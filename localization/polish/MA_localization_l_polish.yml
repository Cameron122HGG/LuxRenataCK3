l_polish:
 #################
 ##MEDIEVAL ARTS##
 #################

 ###########
 #GAME RULE#
 game_rule_category_MedievalArts: "Medieval Arts"
 rule_MA_monuments: "$game_rule_category_MedievalArts$: Zabytki"
 setting_MA_monuments_all: "Pierwszeństwo dla $game_rule_category_MedievalArts$"
 setting_MA_monuments_all_desc: "#help Zalecane:#! W razie konfliktu [special_buildings|E] z #V $game_rule_category_MedievalArts$#! mają pierwszeństwo przed tymi z podstawowej wersji gry."
 setting_MA_monuments_selection: "Pierwszeństwo dla podstawowej wersji gry"
 setting_MA_monuments_selection_desc: "W razie konfliktu [special_buildings|E] z #V podstawowej wersji gry#! mają pierwszeństwo przed tymi z $game_rule_category_MedievalArts$."
 rule_MA_ahistorical_monuments: "$game_rule_category_MedievalArts$: Nieprawdopodobieństwo historyczne"
 setting_MA_ahistorical_monuments_yes: "Nieprawdopodobne zabytki włączone"
 setting_MA_ahistorical_monuments_yes_desc: "#help Zalecane:#! [special_buildings|E], które można uznać za #italic nieprawdopodobne historycznie#!, są dozwolone."
 setting_MA_ahistorical_monuments_no: "Nieprawdopodobne zabytki wyłączone"
 setting_MA_ahistorical_monuments_no_desc: "[special_buildings|E], które można uznać za #italic nieprawdopodobne historycznie#!, #bold nie są#! dozwolone."
 rule_MA_creator_pack: "$game_rule_category_MedievalArts$: DLC"
 setting_MA_creator_pack_yes: "Pierwszeństwo dla DLC"
 setting_MA_creator_pack_yes_desc: "#help Zalecane:#! [special_buildings|E] z #V DLC#!, takich jak #V Holy Buildings#!, o ile są włączone, mają pierwszeństwo przed tymi z $game_rule_category_MedievalArts$."
 setting_MA_creator_pack_no: "$setting_MA_monuments_all$"
 setting_MA_creator_pack_no_desc: "W razie konfliktu [special_buildings|E] z #V $game_rule_category_MedievalArts$#! mają pierwszeństwo przed tymi z #V DLC#!."

 
 ###################
 #SPECIAL BUILDINGS#

 #Rock of Cashel
 MA_rock_cashel_district: "$building_type_MA_rock_cashel$"
 MA_rock_cashel_district_desc: "$building_type_MA_rock_cashel_desc$"
 building_type_MA_rock_cashel: "Skała Cashel"
 building_type_MA_rock_cashel_desc: "Wznosząca się na skalistym wzgórzu pośród zielonych pastwisk Skała Cashel jest niezdobytą kamienną twierdzą otoczoną licznymi murami, mogącą służyć zarówno za zamek, jak i pałac. Mieści również jeden z najbardziej wpływowych klasztorów Irlandii oraz kaplicę pałacową, której sklepienie zdobią piękne freski przedstawiające życie świętego Patryka."
 MA_rock_cashel: "$building_type_MA_rock_cashel$"
 
 #St Donatus of Zadar
 MA_st_donatus_district: "$building_type_MA_st_donatus$"
 MA_st_donatus_district_desc: "$building_type_MA_st_donatus_desc$"
 building_type_MA_st_donatus: "Kościół św. Donata w Zadarze"
 building_type_MA_st_donatus_desc: "Wspaniały okrągły kościół wzniesiony z białego kamienia, połyskującego w promieniach słońca nad falami Adriatyku. Jego budowniczowie czerpali inspirację z kaplicy pałacowej Karola Wielkiego, a wnętrze zdobi piękna złocista mozaika."
 MA_st_donatus: "$building_type_MA_st_donatus$"
 
 #Aula Palatina
 MA_aula_palatina_district: "$building_type_MA_aula_palatina$"
 MA_aula_palatina_district_desc: "$building_type_MA_aula_palatina_desc$"
 building_type_MA_aula_palatina: "Aula Palatina"
 building_type_MA_aula_palatina_desc: "Kolosalna ceglana sala wzniesiona przez Konstantyna Wielkiego dla jego własnego #italic palatium#!. \nJej ogromne rozmiary mają niewielu sobie równych na całym kontynencie, a kunszt inżynieryjny budowniczych pozostaje niewyczerpanym źródłem inspiracji."
 MA_aula_palatina: "$building_type_MA_aula_palatina$"
 
 #Jokhang Temple
 MA_jokhang_district: "$building_type_MA_jokhang$"
 MA_jokhang_district_desc: "$building_type_MA_jokhang_desc$"
 building_type_MA_jokhang: "Świątynia Jokhang"
 building_type_MA_jokhang_desc: "Najstarsza i najbardziej mistyczna świątynia całego Tybetu, majestatyczny zespół dziedzińców i sanktuariów w samym sercu Krainy Bogów."
 MA_jokhang: "$building_type_MA_jokhang$"
 
 #Dongola Throne Hall
 MA_dongola_hall_district: "$building_type_MA_dongola_hall$"
 MA_dongola_hall_district_desc: "$building_type_MA_dongola_hall_desc$"
 building_type_MA_dongola_hall: "Sala Tronowa w Dongoli"
 building_type_MA_dongola_hall_desc: "Wielki pałac wzniesiony na skalistym wzgórzu, z którego rozciąga się widok na okoliczną równinę i Nil. \nSłuży celom ceremonialnym, by olśniewać posłów i podróżnych. Monumentalne schody, ozdobione wspaniałymi freskami nubijskich i greckich artystów, prowadzą ich do majestatycznej sali tronowej na piętrze."
 MA_dongola_hall: "$building_type_MA_dongola_hall$"
 
 #Cathedral of Hildesheim
 MA_hildesheim_cathedral_district: "$building_type_MA_hildesheim_cathedral$"
 MA_hildesheim_cathedral_district_desc: "$building_type_MA_hildesheim_cathedral_desc$"
 building_type_MA_hildesheim_cathedral: "Kościół św. Michała w Hildesheim"
 building_type_MA_hildesheim_cathedral_desc: "Bazylikę tę wzniesiono, aby ukazać potęgę i prestiż jej rzymskiego króla. Malowany drewniany strop i półkoliste łuki nadają jej wspaniały, cesarski wygląd. W budowie uczestniczyli robotnicy i mistrzowie znad Renu oraz z Italii, a jej wnętrze zdobią odlane z brązu drzwi i potężna kolumna, misternie pokryte reliefami."
 MA_hildesheim_cathedral: "$building_type_MA_hildesheim_cathedral$"
 
 #Toulouse Cathedral
 MA_toulouse_basilica_district: "$building_type_MA_toulouse_basilica$"
 MA_toulouse_basilica_district_desc: "$building_type_MA_toulouse_basilica_desc$"
 building_type_MA_toulouse_basilica: "Bazylika w Tuluzie"
 building_type_MA_toulouse_basilica_desc: "Wspaniała bazylika, jedna z największych katedr na północ od Alp. Zbudowana z cegły, której nie brakuje w okolicy, jest prawdziwie romańską świątynią, inspirowaną starożytnymi rzymskimi ruinami południowej Francji i ozdobioną fryzami lombardzkimi, półkolistymi łukami oraz kolumnami ze spoliów."
 MA_toulouse_basilica: "$building_type_MA_toulouse_basilica$"
 
 #The Durham Cathedral
 MA_durham_cathedral_district: "$building_type_MA_durham_cathedral$"
 MA_durham_cathedral_district_desc: "$building_type_MA_durham_cathedral_desc$"
 building_type_MA_durham_cathedral: "Katedra w Durham"
 building_type_MA_durham_cathedral_desc: "Wielka katedra w Durham góruje nad bagnistym półwyspem rzeki Wear, gdzie według legendy dwie dojarki odkryły nieruchomy grób świętego Kutberta. Jej sklepienie żebrowe, zaprojektowane przez rzemieślników z obu stron kanału La Manche, jest niedoścignionym w Anglii arcydziełem inżynierii. Budowlę wzniesiono ponad lasami i brzegami rzeki, wykorzystując kamień wydobyty z urwisk poniżej."
 MA_durham_cathedral: "$building_type_MA_durham_cathedral$"
 
 #The Castel del Monte
 MA_castel_monte_district: "$building_type_MA_castel_monte$"
 MA_castel_monte_district_desc: "$building_type_MA_castel_monte_desc$"
 building_type_MA_castel_monte: "Castel del Monte"
 building_type_MA_castel_monte_desc: "Elegancka rezydencja myśliwska na łagodnym wzgórzu Apulii. \nJej niezwykły plan ośmiokąta, z ośmiobocznymi wieżami w każdym narożniku, łączy architekturę klasyczną z gotycką. \nSurowa, geometryczna bryła wyraźnie kontrastuje z bogatym wyposażeniem wnętrz: arrasami, dywanami, malowidłami i kapitelami."
 MA_castel_monte: "$building_type_MA_castel_monte$"
 
 #The Belfry of Bruges
 MA_belfort_district: "$building_type_MA_belfort$"
 MA_belfort_district_desc: "$building_type_MA_belfort_desc$"
 building_type_MA_belfort: "Dzwonnica w Brugii"
 building_type_MA_belfort_desc: "Zachwycająca gotycka dzwonnica wznosi się nad rynkiem Brugii, wyznaczając rytm życia całego miasta. Ta ogromna wieża, ozdobiona pinaklami i posągami, została zbudowana z cegły i kamienia na planie prostokąta, który w górnej części przechodzi w ośmiobok mieszczący dzwony."
 MA_belfort: "$building_type_MA_belfort$"
 
 #The Strasbourg Cathedral
 MA_strasbourg_cathedral1_district: "$building_type_MA_strasbourg_cathedral1$"
 MA_strasbourg_cathedral1_district_desc: "$building_type_MA_strasbourg_cathedral1_desc$"
 building_type_MA_strasbourg_cathedral1: "Katedra w Strasburgu"
 building_type_MA_strasbourg_cathedral1_desc: "Wzorowana na wielkich kościołach królestw zachodnio- i wschodniofrankijskiego, katedra strasburska zawdzięcza swój rozmach bogactwu mieszczan i opiece ich pana. Jej mury z różowawego piaskowca lśnią w promieniach zachodzącego słońca, górując nad wąskim placem i domami o drewnianej konstrukcji szkieletowej, a spiżowe dzwony niosą swą melodię z wiatrem."
 MA_strasbourg_cathedral1: "Katedra w Strasburgu"
 MA_strasbourg_cathedral2: "$MA_strasbourg_cathedral1$"
 
 #Koutoubia Mosque
 MA_koutoubia_district: "$building_type_MA_koutoubia$"
 MA_koutoubia_district_desc: "$building_type_MA_koutoubia_desc$"
 building_type_MA_koutoubia: "Meczet Kutubijja"
 building_type_MA_koutoubia_desc: "Znakomite arcydzieło architektury mauretańskiej. Minaret tego meczetu stanowi źródło inspiracji dla budowniczych całego świata islamu."
 MA_koutoubia: "$building_type_MA_koutoubia$"
 
 #Parigoritissa
 MA_parigoritissa_district: "$building_type_MA_parigoritissa$"
 MA_parigoritissa_district_desc: "$building_type_MA_parigoritissa_desc$"
 building_type_MA_parigoritissa: "Panagia Paregoretissa"
 building_type_MA_parigoritissa_desc: "Plan tego kościoła, poświęconego Najświętszej Maryi, czerpie z klasycznych ideałów symetrii i geometrycznej doskonałości. Budowla jest niemal idealnym kwadratem, skupionym wokół ośmiobocznej kopuły wspartej na filarach, z małą kaplicą w każdym z czterech narożników."
 MA_parigoritissa: "$building_type_MA_parigoritissa$"
 
 #Rotunda
 MA_rotunda_district: "$building_type_MA_rotunda$"
 MA_rotunda_district_desc: "$building_type_MA_rotunda_desc$"
 building_type_MA_rotunda: "Rotunda w Salonikach"
 building_type_MA_rotunda_desc: "Kolosalna budowla kopułowa wzorowana na rzymskim Panteonie. \nJej wnętrza zdobią mozaiki o niezwykłym kunszcie i pięknie, których złote #italic tessery#! mienią się w świetle słońca wpadającym przez okulus. \nKolumnada łączy budowlę z potężnym marmurowym łukiem wzniesionym przez późniejszego cezara Galeriusza."
 MA_rotunda: "$building_type_MA_rotunda$"
 
 #The Nikaea Walls
 MA_nikaea_walls_district: "$building_type_MA_nikaea_walls$"
 MA_nikaea_walls_district_desc: "$building_type_MA_nikaea_walls_desc$"
 building_type_MA_nikaea_walls: "Mury Nicei"
 building_type_MA_nikaea_walls_desc: "Te niezdobyte podwójne mury, wzniesione przed wiekami przez cezarów, strzegą drogi do Konstantynopola."
 MA_nikaea_walls: "$building_type_MA_nikaea_walls$"
 
 #The Ephesus Basilica
 MA_ephesus_basilica_district: "$building_type_MA_ephesus_basilica$"
 MA_ephesus_basilica_district_desc: "$building_type_MA_ephesus_basilica_desc$"
 building_type_MA_ephesus_basilica: "Bazylika w Efezie"
 building_type_MA_ephesus_basilica_desc: "Potężna bazylika zbudowana za czasów Justyniana nad miejscem pochówku #italic Jana Apostoła#!. \nJej mury z cegły i ciosanego kamienia wspierają eleganckie marmurowe kolumny z Prokonezu, a całość zdobią wystawne złote mozaiki."
 MA_ephesus_basilica: "$building_type_MA_ephesus_basilica$"
 
 #Arles Amphiteatre
 MA_arles_amphiteatre_district: "$building_type_MA_arles_amphiteatre$"
 MA_arles_amphiteatre_district_desc: "$building_type_MA_arles_amphiteatre_desc$"
 building_type_MA_arles_amphiteatre: "Amfiteatr w Arles"
 building_type_MA_arles_amphiteatre_desc: "Ta ogromna arena, wzniesiona przed wiekami, pozostaje centrum życia Arles. \nW jej kamiennych murach mieszczanie urządzili wieże, kaplice i własne domy, zamieszkując piaszczyste pole, na którym niegdyś gladiatorzy mordowali się ku uciesze widzów."
 MA_arles_amphiteatre: "$building_type_MA_arles_amphiteatre$"
 
 #Axum Stelae Field
 MA_axum_stelae_district: "$building_type_MA_axum_stelae$"
 MA_axum_stelae_district_desc: "$building_type_MA_axum_stelae_desc$"
 building_type_MA_axum_stelae: "Pole stel"
 building_type_MA_axum_stelae_desc: "Trzy kolosalne stele to wszystko, co pozostało z niegdyś potężnego Aksum, a mimo to nadal rzucają długi cień na królewską kulturę tych ziem. \nWykute z obrobionego kamienia, wciąż noszą na powierzchni reliefy, które według niektórych przedstawiają #italic Bramy Niebios#!."
 MA_axum_stelae: "$building_type_MA_axum_stelae$"
 
 #Karnak Temple
 MA_karnak_district: "$building_type_MA_karnak$"
 MA_karnak_district_desc: "$building_type_MA_karnak_desc$"
 building_type_MA_karnak: "Karnak"
 building_type_MA_karnak_desc: "Najwspanialsza ze świątyń starożytnych faraonów, Karnak, po tysiącleciach wciąż świadczy o potędze i bogactwie królów Nilu."
 MA_karnak: "$building_type_MA_karnak$"
 
 #Pharos of Alexandria
 MA_pharos_alexandria_district: "$building_type_MA_pharos_alexandria$"
 MA_pharos_alexandria_district_desc: "$building_type_MA_pharos_alexandria_desc$"
 building_type_MA_pharos_alexandria: "Faros"
 building_type_MA_pharos_alexandria_desc: "Wznosząca się wysoko nad przesmykiem latarnia morska znana jest na całym świecie jako jeden z #italic siedmiu wielkich cudów#! Antypatra. \nOd położenia pierwszego kamienia minęły stulecia, a budowlę wieńczy teraz nowa kopuła ufundowana przez kalifów. Jednak jej niezrównana wysokość, solidne mury i jasny blask nadal utrwalają legendę Faros w sercach wszystkich, którzy ją ujrzą."
 MA_pharos_alexandria: "$building_type_MA_pharos_alexandria$"
 
 #Trajan Arch
 MA_trajan_arch1_district: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch1_district_desc: "$building_type_MA_trajan_arch1_desc$"
 building_type_MA_trajan_arch1: "Łuk Trajana"
 building_type_MA_trajan_arch1_desc: "Wielki cesarz Trajan, który z tego miasta wyruszył na wyprawy do #italic Dacji#!, nakazał wznieść wspaniały łuk na pamiątkę swego triumfu. Po dziś dzień wita on każdy statek wpływający do portu Ankony, przywołując wspomnienia dumy i potęgi."
 MA_trajan_arch1: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch2: "Łuk Ankony"
 
 #Palatium of Diocletian
 MA_diocletian_palace_district: "$building_type_MA_diocletian_palace$"
 MA_diocletian_palace_district_desc: "$building_type_MA_diocletian_palace_desc$"
 building_type_MA_diocletian_palace: "Pałac Dioklecjana"
 building_type_MA_diocletian_palace_desc: "Pałac ten, zbudowany za panowania tetrarchy, zaplanowano jako monumentalne, miniaturowe miasto idealne, z ulicami otoczonymi kolumnadami, łukami, murami i salami. \nPo upadku cesarstwa przejęli go mieszkańcy, przekształcając w miejskie serce osady."
 MA_diocletian_palace: "$building_type_MA_diocletian_palace$"
 
 #Romuliana
 MA_romuliana_district: "$building_type_MA_romuliana$"
 MA_romuliana_district_desc: "$building_type_MA_romuliana_desc$"
 building_type_MA_romuliana: "Romuliana"
 building_type_MA_romuliana_desc: "#italic Felix Romuliana#! została założona przez wielkich cezarów jako miasto wzorcowe i przez lata chroniona kolosalnymi murami. \nNie wystarczyły one jednak, by odeprzeć najazdy kolejnych stuleci. Dziś po dawnej chwale pozostały jedynie puste szkielety strażnic oraz przytłaczający ogrom roślinności, która je pochłonęła."
 MA_romuliana: "$building_type_MA_romuliana$"
 
 #Hexamilion
 MA_hexamilion_district: "$building_type_MA_hexamilion$"
 MA_hexamilion_district_desc: "$building_type_MA_hexamilion_desc$"
 building_type_MA_hexamilion: "Heksamilion"
 building_type_MA_hexamilion_desc: "Mury te, wzniesione przez cesarza Teodozjusza dla obrony Peloponezu, od stuleci strzegą wąskiego wejścia na przesmyk. Rozciągają się od Zatoki Korynckiej po Zatokę Sarońską, kierując handel, podróżnych i wrogie wyprawy ku wąskim przejściom na północy i południu."
 MA_hexamilion: "$building_type_MA_hexamilion$"
 
 #Temple of Jupiter
 MA_baalbek_district: "$building_type_MA_baalbek$"
 MA_baalbek_district_desc: "$building_type_MA_baalbek_desc$"
 building_type_MA_baalbek: "Świątynia Jowisza"
 building_type_MA_baalbek_desc: "Główna świątynia Baalbeku była niegdyś jedną z największych na świecie i górowała nad żyzną doliną. \nOd tamtej pory liczne najazdy i oblężenia zniszczyły olbrzymią budowlę, jej kolumny roztrzaskano lub wywieziono do dalekich miast. Ruiny wciąż jednak urzekają podróżników ze wszystkich stron świata."
 MA_baalbek: "$building_type_MA_baalbek$"
 
 #Leptis Magna
 MA_leptis_magna_district: "$building_type_MA_leptis_magna$"
 MA_leptis_magna_district_desc: "$building_type_MA_leptis_magna_desc$"
 building_type_MA_leptis_magna: "Leptis Magna"
 building_type_MA_leptis_magna_desc: "Klejnot Trypolitanii, Leptis Magna, został założony przez starożytnych cesarzy. \nKiedy bezlitosne słońce osiąga w południe zenit, cienie rzucane na ruiny świątyń, targowisk i teatrów znikają, a w tej krainie poza czasem trudno nie poczuć się zagubionym."
 MA_leptis_magna: "$building_type_MA_leptis_magna$"
 
 #Tomb of Numidia
 MA_mauretanian_mausoleum_district: "$building_type_MA_mauretanian_mausoleum$"
 MA_mauretanian_mausoleum_district_desc: "$building_type_MA_mauretanian_mausoleum_desc$"
 building_type_MA_mauretanian_mausoleum: "Grobowiec Numidii"
 building_type_MA_mauretanian_mausoleum_desc: "Starożytne, kolosalne mauzoleum wzniesione przez berberyjskich królów Numidii przed podbojem ich ziem przez Rzymian. \nZbudowane w całości z kamienia na wzgórzu zwróconym ku morzu, jest widoczne z wielkiej odległości i lśni w słońcu ponad horyzontem."
 MA_mauretanian_mausoleum: "$building_type_MA_mauretanian_mausoleum$"
 
 #Meroë Pyramids
 MA_meroe_pyramids_district: "$building_type_MA_meroe_pyramids$"
 MA_meroe_pyramids_district_desc: "$building_type_MA_meroe_pyramids_desc$"
 building_type_MA_meroe_pyramids: "Piramidy Meroe"
 building_type_MA_meroe_pyramids_desc: "Pośród złotych piasków Nubii tajemnicze piramidy wznoszą się niczym zapomniani strażnicy. Pustynne wiatry szepczą o ich sekretach, a przejmujące piękno i misternie zdobione bryły kuszą ciekawskich, by odkryli tajemnice zaginionej cywilizacji."
 MA_meroe_pyramids: "$building_type_MA_meroe_pyramids$"
 
 #Basilica of Saint Martin
 MA_saint_martin_district: "$building_type_MA_saint_martin$"
 MA_saint_martin_district_desc: "$building_type_MA_saint_martin_desc$"
 building_type_MA_saint_martin: "Bazylika św. Marcina"
 building_type_MA_saint_martin_desc: "Ta wielka bazylika, miejsce ostatecznego spoczynku świętego Marcina, powstała, gdy ziemiami tymi władali jeszcze Merowingowie. \nMa sto sześćdziesiąt stóp długości i sześćdziesiąt szerokości, zdobią ją starożytne kolumny i barwne marmury, a na szlaku do Santiago przyciąga pielgrzymów z bliska i daleka."
 MA_saint_martin: "$building_type_MA_saint_martin$"
 
 #Pillars of Titus
 MA_piliers_district: "$building_type_MA_piliers$"
 MA_piliers_district_desc: "$building_type_MA_piliers_desc$"
 building_type_MA_piliers: "Kolumny Gaskonii"
 building_type_MA_piliers_desc: "Ustawione w najwyższym punkcie miasta, skąd górują nad rzeką i kąpią się w słońcu, kolumny te są równie eleganckie, co zagadkowe. Niektórzy twierdzą, że należały kiedyś do wielkiego pałacu cezara Tytusa, inni zaś, że wyrosły ze skały na długo przed przybyciem Rzymian."
 MA_piliers: "$building_type_MA_piliers$"
 
 #Txindoki
 MA_txindoki_district: "$building_type_MA_txindoki$"
 MA_txindoki_district_desc: "$building_type_MA_txindoki_desc$"
 building_type_MA_txindoki: "Txindoki"
 building_type_MA_txindoki_desc: "Pielgrzymom wędrującym przez tę krainę trudno nie dostrzec jego niezwykłego, ośnieżonego szczytu. Wyłaniający się nagle i dumnie Txindoki uosabiał majestat i tajemnicze piękno tych ziem na długo przed tym, zanim człowiek po raz pierwszy na niego spojrzał."
 MA_txindoki: "$building_type_MA_txindoki$"
 
 #Hospice of Santa Juliana
 MA_santillana_district: "$building_type_MA_santillana$"
 MA_santillana_district_desc: "$building_type_MA_santillana_desc$"
 building_type_MA_santillana: "Hospicjum św. Juliany"
 building_type_MA_santillana_desc: "Wielkie sklepienia, kamienne filary, relikwie i pomieszczenia mieszkalne tej kolegiaty sprawiają, że stanowi ona obowiązkowy przystanek dla licznych pielgrzymów zmierzających do Santiago. \nDzięki hojności miejscowego możnowładcy i nieustannemu napływowi datków hospicjum stało się bogate i piękne, ozdobione wspaniałymi posągami i rzeźbionymi reliefami."
 MA_santillana: "$building_type_MA_santillana$"
 
 #Palace of Naranco
 MA_palace_naranco_district: "$building_type_MA_palace_naranco$"
 MA_palace_naranco_district_desc: "$building_type_MA_palace_naranco_desc$"
 building_type_MA_palace_naranco: "Pałac Naranco"
 building_type_MA_palace_naranco_desc: "Ten piękny pałac przez pokolenia służył za rezydencję świętych królów Asturii, górując nad Oviedo ze szczytu góry Naranco. Jego eleganckie łuki i sklepienia, jakich nie widziano na półwyspie od czasów rzymskich, świadczą o ambicji i potędze tamtejszych władców."
 MA_palace_naranco: "$building_type_MA_palace_naranco$"
 
 #Burgos Cathedral
 MA_burgos_cathedral_district: "$building_type_MA_burgos_cathedral$"
 MA_burgos_cathedral_district_desc: "$building_type_MA_burgos_cathedral_desc$"
 building_type_MA_burgos_cathedral: "Katedra w Burgos"
 building_type_MA_burgos_cathedral_desc: "Ta wspaniała katedra, wzniesiona przez rzemieślników z obu stron Pirenejów, należy do najwybitniejszych przykładów nowego, nowoczesnego stylu budownictwa sakralnego. \nJej wieże sięgają nieba, a przestronne kaplice i korytarze prowadzą pielgrzymów od jednej relikwii do drugiej, pośród darów i złota, pod surowymi spojrzeniami licznych wyrzeźbionych świętych."
 MA_burgos_cathedral: "$building_type_MA_burgos_cathedral$"
 
 #Qasr al-Farid
 MA_hegra_district: "$building_type_MA_hegra$"
 MA_hegra_district_desc: "$building_type_MA_hegra_desc$"
 building_type_MA_hegra: "Kasr al-Farid"
 building_type_MA_hegra_desc: "Monumentalny grobowiec wykuty głęboko w monolitycznej skale, pozostałość niegdyś bogatego i potężnego pogańskiego miasta. \nWyrasta samotnie pośrodku pustyni, stawiając opór wiatrom, dlatego miejscowi nazwali go #italic Samotnym Zamkiem#!."
 MA_hegra: "$building_type_MA_hegra$"
 
 #Wadi Rum
 MA_wadirum_district: "$building_type_MA_wadirum$"
 MA_wadirum_district_desc: "$building_type_MA_wadirum_desc$"
 building_type_MA_wadirum: "Wadi Rum"
 building_type_MA_wadirum_desc: "Ta rozległa, prastara dolina od dawna stanowi źródło mitów i legend, a do dziś spowija ją aura tajemniczości. \nWyrasta z niej ogromna ściana czerwonej skały, niewzruszona wobec pustynnych wiatrów, wysoka, potężna i nieosiągalna dla żadnej armii, zapewniająca bezpieczne schronienie nawet w najgorszych czasach."
 MA_wadirum: "$building_type_MA_wadirum$"
 
 #Walls of Sana'a
 MA_walls_sanaa_district: "$building_type_MA_walls_sanaa$"
 MA_walls_sanaa_district_desc: "$building_type_MA_walls_sanaa_desc$"
 building_type_MA_walls_sanaa: "Mury Sany"
 building_type_MA_walls_sanaa_desc: "Pierścień potężnych wałów otacza serce Sany, wyrastając niezłomnie z zawiłego labiryntu gór Sarawat. Ich nadwerężony czasem majestat szepcze opowieści o straszliwych bitwach i wielkich czynach ludzi oraz bogów."
 MA_walls_sanaa: "$building_type_MA_walls_sanaa$"
 
 #Dam of Sheba
 MA_dam_sheba_district: "$building_type_MA_dam_sheba$"
 MA_dam_sheba_district_desc: "$building_type_MA_dam_sheba_desc$"
 building_type_MA_dam_sheba: "Tama królowej Saby"
 building_type_MA_dam_sheba_desc: "Samotne pośród jałowych ziem Maribu, gdzie palące słońce karze każdego, kto odważy się mu przeciwstawić, te wspaniałe ruiny szepczą opowieści o wielkim królestwie królowej Saby, która przemieniła piaski w żyzne pola, przynosząc bogactwo i życie tam, gdzie wcześniej panowały niedostatek i śmierć."
 MA_dam_sheba: "$building_type_MA_dam_sheba$"
 
 #Bahla Fort
 MA_bahla_fort_district: "$building_type_MA_bahla_fort$"
 MA_bahla_fort_district_desc: "$building_type_MA_bahla_fort_desc$"
 building_type_MA_bahla_fort: "Twierdza Bahla"
 building_type_MA_bahla_fort_desc: "Ten ogromny zamek z suszonej cegły wzniesiono, by chronić cenną oazę Bahla z wyżyn pobliskich wzgórz. \nJego zawiłe mury osłaniają przed wrogami i palącym skwarem sieć urządzeń nawadniających oraz wspaniałą plantację palm daktylowych, która z pewnością przyniesie wielki prestiż swemu opiekunowi."
 MA_bahla_fort: "$building_type_MA_bahla_fort$"
 
 #Jebe Hafeet
 MA_jebel_hafeet_district: "$building_type_MA_jebel_hafeet$"
 MA_jebel_hafeet_district_desc: "$building_type_MA_jebel_hafeet_desc$"
 building_type_MA_jebel_hafeet: "Dżabal Hafit"
 building_type_MA_jebel_hafeet_desc: "Długa, smukła i samotna góra, ostatnia przed piaszczystymi wydmami i pierwsza przed pasmem Al-Hadżar. \nJej strome, skaliste zbocza od dawna zamieszkują okoliczne ludy, a u jej stóp znajdują się grobowce w kształcie uli."
 MA_jebel_hafeet: "$building_type_MA_jebel_hafeet$"
 
 #Al-Turaif Palace
 MA_alturaif_district: "$building_type_MA_alturaif$"
 MA_alturaif_district_desc: "$building_type_MA_alturaif_desc$"
 building_type_MA_alturaif: "Pałac At-Turajf"
 building_type_MA_alturaif_desc: "Budowany przez kolejne pokolenia w jednym z najbardziej niegościnnych miejsc stworzonego świata, pałac ten jest symbolem wytrwałości i pobożności. \nZa długim pasmem murów wysokie pałace z suszonej cegły i nawadniany ogród dają schronienie nawet przed najdotkliwszym upałem, a dla właściciela stanowią ważne miejsce gromadzenia zapasów."
 MA_alturaif: "$building_type_MA_alturaif$"
 
 #School of Preslav
 MA_school_preslav_district: "$building_type_MA_school_preslav$"
 MA_school_preslav_district_desc: "$building_type_MA_school_preslav_desc$"
 building_type_MA_school_preslav: "Szkoła presławska"
 building_type_MA_school_preslav_desc: "Dzięki stałemu napływowi darowizn klasztorne skryptoria i pałacowe sale Presławia niestrudzenie pracują nad przekładaniem rękopisów i tworzeniem nowej wiedzy. W powietrzu unosi się zapach atramentu i pergaminu, a ściany zdobią freski świętych i fundatorów. Wpływy szkoły sięgają daleko poza kamienne komnaty, czyniąc z niej dla całego regionu światło rzymskiej liturgii i myśli."
 MA_school_preslav: "$building_type_MA_school_preslav$"
 
 #Madara Rider
 MA_madara_rider_district: "$building_type_MA_madara_rider$"
 MA_madara_rider_district_desc: "$building_type_MA_madara_rider_desc$"
 building_type_MA_madara_rider: "Jeździec z Madary"
 building_type_MA_madara_rider_desc: "Wykuty głęboko w zimnej, odwiecznej ścianie pionowego urwiska starożytny relief przedstawia jeźdźca triumfującego nad lwem. Jeździec z włócznią w dłoni zdaje się wyskakiwać z samej skały, na zawsze zwycięski. Poniżej inskrypcje opowiadają o chwalebnych czynach dokonanych na bezkresnym, porośniętym trawą stepie, zanim jeszcze lud tych ziem osiedlił się na zachodzie."
 MA_madara_rider: "$building_type_MA_madara_rider$"
 
 #Tomb of the Thracian King
 MA_thracian_tomb_district: "$building_type_MA_thracian_tomb$"
 MA_thracian_tomb_district_desc: "$building_type_MA_thracian_tomb_desc$"
 building_type_MA_thracian_tomb: "Grobowiec króla Traków"
 building_type_MA_thracian_tomb_desc: "Ukryty przed upływem czasu, pośród spokojnej, złocistej prerii, starożytny grobowiec spoczywa pod ogromnym ziemnym [Glossary('kurhanem','MA_tumulus_glossary')]. Wejścia strzeże monolityczna brama otoczona lasem kamieni. Legendy szepczą, że pochowano tu wielkiego króla dawnych czasów, którego imię już zapomniano, choć jego duch nadal przemierza niebiosa. \nPrzed wejściem samotny cyprys trwa na straży, rzucając długi, cichy cień na grobowiec."
 MA_thracian_tomb: "$building_type_MA_thracian_tomb$"
 MA_tumulus_glossary: "Ziemny kopiec z gleby i kamieni tworzący potężną kopułę nad grobowcem. Stosowane przez wiele kultur, zwłaszcza starożytnych społeczeństw, #bold kurhany#! są posępnymi i monumentalnymi świadectwami upływu Czasu."
 
 #Boyana Church
 MA_boyana_church_district: "$building_type_MA_boyana_church$"
 MA_boyana_church_district_desc: "$building_type_MA_boyana_church_desc$"
 building_type_MA_boyana_church: "Cerkiew Bojańska"
 building_type_MA_boyana_church_desc: "Ta skromna świątynia na pierwszy rzut oka może nie robić wrażenia. Skryta w wiejskiej osadzie zagubionej pośród złotych pól, swymi prostymi ceglanymi murami wtapia się w krajobraz. \nJednak za niepozorną fasadą kryje się skarb bez równych, ukryty przed oczami świata: serce świątyni zdobią freski o zapierającym dech w piersiach pięknie, a każde pociągnięcie pędzla świadczy o boskim natchnieniu. Błękity, czerwienie i złoto przenikają się, a święci zdają się tańczyć w migotliwym świetle płomieni świec, tworząc niezwykle mistyczne widowisko."
 MA_boyana_church: "$building_type_MA_boyana_church$"
 
 #Belogradchik Fortress
 MA_belogradchik_fort_district: "$building_type_MA_belogradchik_fort$"
 MA_belogradchik_fort_district_desc: "$building_type_MA_belogradchik_fort_desc$"
 building_type_MA_belogradchik_fort: "Twierdza Bełogradczik"
 building_type_MA_belogradchik_fort_desc: "Ta twierdza, ukryta pośród strzelistych formacji skalnych, zdaje się wyrastać z samej ziemi, a jej mury płynnie przechodzą w zimny, czerwony kamień gór. Smukłe skalne iglice wznoszą się wysoko i otaczają ją z trzech stron, czyniąc ją niemal niezdobytą. \nMiejscowi opowiadają prastarą legendę o olbrzymie z pobliskiego lasu, który gołymi rękami usypał skały, oraz o klasztorze pochłoniętym przez kamienie za karę boską."
 MA_belogradchik_fort: "$building_type_MA_belogradchik_fort$"
 
 #Studenica Monastery
 MA_studenica_district: "$building_type_MA_studenica$"
 MA_studenica_district_desc: "$building_type_MA_studenica_desc$"
 building_type_MA_studenica: "Monaster Studenica"
 building_type_MA_studenica_desc: "Najwspanialszy z serbskich zabytków i ostoja wiary oraz spokoju dla okolicznych mieszkańców, ten monaster kryje się w zacisznej dolinie. \nJego mury noszą ślady tradycji zarówno łacińskiego Zachodu, jak i greckiego Wschodu. Białe płyty marmurowe, mistrzowsko obrobione, oraz potężna kopuła spoczywająca na jasnoczerwonym tamburze świadczą o kunszcie i pobożności fundatorów klasztoru."
 MA_studenica: "$building_type_MA_studenica$"
 
 #Church of the Nativity
 MA_church_nativity_district: "$building_type_MA_church_nativity$"
 MA_church_nativity_district_desc: "$building_type_MA_church_nativity_desc$"
 building_type_MA_church_nativity: "Bazylika Narodzenia Pańskiego"
 building_type_MA_church_nativity_desc: "Świątynia, której budowę nakazała najpierw świątobliwa matka Konstantyna, a odbudowę później Justynian, upamiętnia jedno z najświętszych miejsc chrześcijaństwa: miejsce narodzin Chrystusa. \nKościół jest długą, pięcionawową bazyliką o triumfalnym wejściu, ozdobioną złotymi mozaikami i starożytnymi rzymskimi kolumnami z wielobarwnych marmurów. Mieszczą się w nim liczne święte relikwie i dzieła sztuki, które według legend nieraz ocaliły świątynię przed najeźdźcami."
 MA_church_nativity: "$building_type_MA_church_nativity$"
 
 #Great Lejre Hall
 MA_lejre_hall_district: "$building_type_MA_lejre_hall$"
 MA_lejre_hall_district_desc: "$building_type_MA_lejre_hall_desc$"
 building_type_MA_lejre_hall: "Wielka hala Hleiðr"
 building_type_MA_lejre_hall_desc: "Wspaniała sala biesiadna, wzniesiona przez dawnych królów z wysokich drzew i ozdobiona niezwykłymi rzeźbami. \nOpowieści o wielkich bohaterach i władcach, którzy w niej ucztowali i walczyli, z pewnością staną się natchnieniem dla sag."
 MA_lejre_hall: "$building_type_MA_lejre_hall$"
 
 #Aetna
 MA_aetna_district: "$building_type_MA_aetna$"
 MA_aetna_district_desc: "$building_type_MA_aetna_desc$"
 building_type_MA_aetna: "Etna"
 building_type_MA_aetna_desc: "Najpotężniejszy spośród ognistych wulkanów starożytnego świata, góra Etna dumnie góruje nad żyzną Sycylią, a jej popioły znacznie użyźniają pobliską ziemię. \nOd tysiącleci jej oddech przenika mity i legendy, wedle których bóg Hefajstos wykuwał swe boskie dzieła w sercu tej piekielnej góry."
 MA_aetna: "$building_type_MA_aetna$"
 
 #Brescia Duomo
 MA_duomo_brescia_district: "$building_type_MA_duomo_brescia$"
 MA_duomo_brescia_district_desc: "$building_type_MA_duomo_brescia_desc$"
 building_type_MA_duomo_brescia: "Duomo w Brescii"
 building_type_MA_duomo_brescia_desc: "Kamienna rotunda w sercu #italic Cittanuova#!, nowego ośrodka władzy Brescii na zachód od dawnego rzymskiego centrum. Jej grube mury i prosta romańska forma czerpią z opowieści o Jerozolimie, podczas gdy wewnątrz słabo oświetlonego wnętrza freski i relikwie opowiadają o stuleciach pobożności i potęgi."
 MA_duomo_brescia: "$building_type_MA_duomo_brescia$"
 
 #Maschio
 MA_maschio_district: "$building_type_MA_maschio$"
 MA_maschio_district_desc: "$building_type_MA_maschio_desc$"
 building_type_MA_maschio: "Maschio"
 building_type_MA_maschio_desc: "Potężny zamek z kamienia i wulkanicznego tufu wznosi się nad lśniącą Zatoką Neapolitańską. Jego blanki i imponujące okrągłe wieże żelazną ręką panują nad lądem i morzem. \nRozległy system cel i lochów wnika głęboko w skałę, a niektóre z nich pamiętają jeszcze czasy starożytnych Greków. $MA_warning_palermo_napoli$"
 MA_maschio: "$building_type_MA_maschio$"
 MA_warning_palermo_napoli: "\n\n@alert_icon! #alert_trial Wybudowanie zarówno [GetBuildingType('MA_palace_palermo2').GetName] w Palermo, jak i [GetBuildingType('MA_maschio').GetName] w Neapolu uniemożliwi ukończenie [GetDecisionWithKey('empower_sicilian_parliament_decision').GetName] [decision|E]!#!"
 
 #Basilica of Saint Nicholas
 MA_st_nicholas_district: "$building_type_MA_st_nicholas$"
 MA_st_nicholas_district_desc: "$building_type_MA_st_nicholas_desc$"
 building_type_MA_st_nicholas: "Bazylika św. Mikołaja"
 building_type_MA_st_nicholas_desc: "Masywna romańska bazylika wzniesiona z twardego miejscowego kamienia, której połyskująca biel wyraźnie odcina się od ciemnego, winnego błękitu morza. Za jej murami relikwie świętego Mikołaja przyciągają pielgrzymów i wielkie bogactwa z całego chrześcijaństwa, zachęcając wiernych do przeprawy ku Ziemi Świętej."
 MA_st_nicholas: "$building_type_MA_st_nicholas$"
 
 #Palace of Arechis
 MA_palace_arechis_district: "$building_type_MA_palace_arechis$"
 MA_palace_arechis_district_desc: "$building_type_MA_palace_arechis_desc$"
 building_type_MA_palace_arechis: "Pałac Arechisa"
 building_type_MA_palace_arechis_desc: "Rozległy zespół pałacowych budowli wpisany w starożytne rzymskie miasto Benewent, chroniony pierścieniem murów i czworoboczną wieżą. Wzniesiony przez pierwszego księcia Longobardów, stał się symbolem buntu tego ludu i jego upartej niezależności."
 MA_palace_arechis: "$building_type_MA_palace_arechis$"
 
 #Basilica of Saccargia
 MA_saccargia_basilica_district: "$building_type_MA_saccargia_basilica$"
 MA_saccargia_basilica_district_desc: "$building_type_MA_saccargia_basilica_desc$"
 building_type_MA_saccargia_basilica: "Bazylika Saccargia"
 building_type_MA_saccargia_basilica_desc: "Uderzająca czarno-biała kamienna bazylika wyrasta na suchym, smaganym wiatrem wybrzeżu Sardynii. Jej pasiasta wieża widoczna jest z morza z odległości wielu mil. Do budowy sprowadzono rzemieślników z Italii, których wpływ stylistyczny jest wyraźnie dostrzegalny."
 MA_saccargia_basilica: "$building_type_MA_saccargia_basilica$"
 
 #Ruins of Paestum
 MA_paestum_district: "$building_type_MA_paestum$"
 MA_paestum_district_desc: "$building_type_MA_paestum_desc$"
 building_type_MA_paestum: "Ruiny Paestum"
 building_type_MA_paestum_desc: "Pozostałości niegdyś wielkiego starożytnego miasta leżą pośród dzikich traw i ciszy, a kolosalne kolumny jego świątyń są popękane i roztrzaskane. Miasto stopniowo opuszczano, gdy pobliska rzeka zamieniła ziemię w bagno, a dziś niewielu śmie zapuszczać się na te chorobliwe tereny."
 MA_paestum: "$building_type_MA_paestum$"
 
 #Tower of Pisa
 MA_tower_pisa_district: "$building_type_MA_tower_pisa$"
 MA_tower_pisa_district_desc: "$building_type_MA_tower_pisa_desc$"
 building_type_MA_tower_pisa: "Krzywa Wieża w Pizie"
 building_type_MA_tower_pisa_desc: "Elegancka #italic kampanila#! dumnego miasta Pizy, której wdzięczne łuki i lśniący biały kamień stały się sławne w całym chrześcijaństwie i poza nim. Od początku budowy grunt pod wieżą często się przesuwał, sprawiając, że coraz bardziej się ona pochyla."
 MA_tower_pisa: "$building_type_MA_tower_pisa$"
 
 #Saint Peter's Basilica
 MA_vatican_district: "$building_type_MA_vatican$"
 MA_vatican_district_desc: "$building_type_MA_vatican_desc$"
 building_type_MA_vatican: "Bazylika św. Piotra"
 building_type_MA_vatican_desc: "Najświętsza ze starożytnych bazylik wzniesionych w Rzymie z rozkazu Konstantyna góruje nad grobem Apostoła, na którym zbudowano Kościół. \nŚwiątynia jest równie monumentalna, co elegancka. Jej wysokie nawy zdobią złote mozaiki i egzotyczne marmury, a tysiące pielgrzymów z całego chrześcijaństwa przynoszą jej bogactwo i potęgę."
 MA_vatican: "$building_type_MA_vatican$"
 
 #Rock of Canossa
 MA_rock_canossa_district: "$building_type_MA_rock_canossa$"
 MA_rock_canossa_district_desc: "$building_type_MA_rock_canossa_desc$"
 building_type_MA_rock_canossa: "Skała Canossy"
 building_type_MA_rock_canossa_desc: "Ten groźny zamek zbudowano na stromym, skalistym urwisku jako centrum imponującego systemu umocnień strzegących przełęczy apenińskich. Z odosobnionej warowni panowie zamku czuwają nad dolinami u stóp wzgórza, bezpieczni w swym schronieniu z kamienia i nieba."
 MA_rock_canossa: "$building_type_MA_rock_canossa$"
 
 #Hill of Tara
 MA_hill_tara_district: "$building_type_MA_hill_tara$"
 MA_hill_tara_district_desc: "$building_type_MA_hill_tara_desc$"
 building_type_MA_hill_tara: "Wzgórze Tara"
 building_type_MA_hill_tara_desc: "Trawiaste wzgórze chronione wałami i umocnieniami ziemnymi, otoczone starożytnymi rzeźbionymi kamieniami, święta siedziba najwyższych królów Irlandii. Choć nie wznoszą się tu żadne mury, sama ziemia kryje moc i przyciąga przybyszów z całej wyspy."
 MA_hill_tara: "$building_type_MA_hill_tara$"
 
 #Clonmacnoise
 MA_clonmacnoise_district: "$building_type_MA_clonmacnoise$"
 MA_clonmacnoise_district_desc: "$building_type_MA_clonmacnoise_desc$"
 building_type_MA_clonmacnoise: "Clonmacnoise"
 building_type_MA_clonmacnoise_desc: "Wielki klasztor założony nad brzegiem szerokiej rzeki Shannon, którego kamienny kościół i wysoka okrągła wieża uroczyście wznoszą się pośród smaganych wiatrem równin. Z biegiem czasu stał się jednym z najważniejszych ośrodków nauki na wyspie, przyciągając uczonych i pielgrzymów z bliska i daleka."
 MA_clonmacnoise: "$building_type_MA_clonmacnoise$"
 
 #White Stupa of Gaochang
 MA_white_stupa_district: "$building_type_MA_white_stupa$"
 MA_white_stupa_district_desc: "$building_type_MA_white_stupa_desc$"
 building_type_MA_white_stupa: "Biała stupa w Gaochang"
 building_type_MA_white_stupa_desc: "Wzniesiona z rozkazu władz cesarskich dla zaznaczenia zasięgu Państwa Środka, ta lśniąca [Glossary('stupa','MA_stupa_glossary')] góruje samotnie nad rozpalonymi piaskami pustyni. Jej wielka, zaokrąglona biała kopuła i pozłacana iglica czerpią wiele ze świątyń Tybetu i Indii, choć budowla zawiera też tradycyjne chińskie elementy, takie jak drewniana podstawa."
 MA_white_stupa: "$building_type_MA_white_stupa$"
 
 #Khan Tengri
 MA_khan_tengri_district: "$building_type_MA_khan_tengri$"
 MA_khan_tengri_district_desc: "$building_type_MA_khan_tengri_desc$"
 building_type_MA_khan_tengri: "Chan Tengri"
 building_type_MA_khan_tengri_desc: "Nazywana przez mieszkańców stepu #italic Panem Nieba#!, ta strzelista marmurowa piramida wznosi się w doskonałej symetrii nad okolicznymi górami. Jej zbocza okrywa wieczny śnieg, płonący czerwienią o zmierzchu i złotem o świcie, a pod przejrzystym błękitem nieba góra stanowi świętą oś między ziemią a niebiosami."
 MA_khan_tengri: "$building_type_MA_khan_tengri$"
 
 #Singing Dunes
 MA_singing_dunes_district: "$building_type_MA_singing_dunes$"
 MA_singing_dunes_district_desc: "$building_type_MA_singing_dunes_desc$"
 building_type_MA_singing_dunes: "Śpiewające Wydmy"
 building_type_MA_singing_dunes_desc: "Niedaleko oazy ze stepowego pustkowia wyrasta wielki półksiężyc piasku, z którego wiatr wydobywa długie, przejmujące dźwięki, jakby śpiewała sama ziemia. Koczownicy podążający pradawnymi szlakami Azji zatrzymują się, by posłuchać pieśni wydm, wierząc, że to głos duchów, a przybyłych z daleka poetów natchnienie czerpie z ich muzyki."
 MA_singing_dunes: "$building_type_MA_singing_dunes$"
 
 #Dakhma of Gurganj
 MA_dakhma_district: "$building_type_MA_dakhma$"
 MA_dakhma_district_desc: "$building_type_MA_dakhma_desc$"
 building_type_MA_dakhma: "Dachma w Gurgandżu"
 building_type_MA_dakhma_desc: "Ta wielka, okrągła #italic dachma#!, zwana też wieżą milczenia, wieńczy samotne wzniesienie nad równiną. Zaratusztrianie wystawiali tu niegdyś ciała zmarłych na oczyszczające działanie nieba i słońca, lecz z każdym kolejnym latem ubywa wiernych, a wieża coraz rzadziej ogląda obrzędy pogrzebowe. Częściej pojawiają się na niej strażnicy, gdyż jej wysokość i kształt służą teraz lepiej obserwacji niż kultowi. \n\n#help Wieża zapewnia dodatkowe efekty, jeżeli jej właściciel lub mieszkańcy wyznają [faith|E] praktykującą #game_link pochówki powietrzne#!#!"
 MA_dakhma: "$building_type_MA_dakhma$"
 
 #Black Ruins
 MA_karabalgasun_district: "$building_type_MA_karabalgasun$"
 MA_karabalgasun_district_desc: "$building_type_MA_karabalgasun_desc$"
 building_type_MA_karabalgasun: "Czarne Ruiny"
 building_type_MA_karabalgasun_desc: "Zburzone ziemne mury i połamane kolumny to wszystko, co zostało z niegdyś potężnego pałacu, który stał w sercu jednego z największych imperiów stepu. Wiatr wyje po pustych dziedzińcach, a rzeźbione kamienie spoczywają na wpół zakopane w trawie i pyle. Podróżni nadal jednak tędy przechodzą, nazywając to miejsce #italic Karabalgasun#!, Czarnymi Ruinami."
 MA_karabalgasun: "$building_type_MA_karabalgasun$"
 
 #City of the Army
 MA_ordu_district: "$building_type_MA_ordu$"
 MA_ordu_district_desc: "$building_type_MA_ordu_desc$"
 building_type_MA_ordu: "Miasto Armii"
 building_type_MA_ordu_desc: "Na skrzyżowaniu szlaków Europy i Azji leży wielkie miasto kupców, dworzan i koni. \nChronione wałami ziemnymi i otoczone szeroką fosą, mieści liczne namioty i świątynie rozsiane wzdłuż alei z kolumnadami, prowadzącej do pozłacanego namiotu wielkiego władcy stepu, który stąd sprawuje rządy."
 MA_ordu: "$building_type_MA_ordu$"
 
 #Kurgan of the Rider
 MA_kurgan_district: "$building_type_MA_kurgan$"
 MA_kurgan_district_desc: "$building_type_MA_kurgan_desc$"
 building_type_MA_kurgan: "Kurhan Jeźdźca"
 building_type_MA_kurgan_desc: "Miejscowi opowiadają o wielkim jeźdźcu, który przemierzał niegdyś te ziemie, a którego duch nadal galopuje po stepie. \nMówi się, że pochowano go w kurhanie, wielkim kopcu ziemnym otoczonym kręgiem kamieni wyznaczających granice jego włości. Coraz mniej ludzi pamięta jego imię, lecz kurhan wciąż opiera się wiatrowi i czasowi."
 MA_kurgan: "$building_type_MA_kurgan$"
 
 #Cliffs of Ustyurt
 MA_ustyurt_cliffs_district: "$building_type_MA_ustyurt_cliffs$"
 MA_ustyurt_cliffs_district_desc: "$building_type_MA_ustyurt_cliffs_desc$"
 building_type_MA_ustyurt_cliffs: "Urwiska Ustiurtu"
 building_type_MA_ustyurt_cliffs_desc: "Te ukształtowane przez pogodę urwiska wyznaczają przejście z jałowego płaskowyżu ku wybrzeżom śródlądowego morza. Przecinają je kaniony i drążą jaskinie. Surowa, pozbawiona wody kraina zmusiła myśliwych do przystosowania się i budowy #italic aranów#!, kamiennych pułapek kierujących dzikie stada ku wąskim przejściom, zamieniając urwiska w cichy teatr śmierci."
 MA_ustyurt_cliffs: "$building_type_MA_ustyurt_cliffs$"
 
 #White Fortress
 MA_sarkel_district: "$building_type_MA_sarkel$"
 MA_sarkel_district_desc: "$building_type_MA_sarkel_desc$"
 building_type_MA_sarkel: "Biała Twierdza"
 building_type_MA_sarkel_desc: "Potężna warownia z białego wapienia i cegły, #italic Sark-el#! – Biała Twierdza – powstała na lewym brzegu Donu, gdy kagan poprosił cesarza rzymskiego o inżynierów dla umocnienia północnej granicy swego państwa. Dziś kontroluje strategiczny szlak przenoszenia łodzi między Donem a Wołgą, sięgając swą siłą militarną daleko na północ i strzegąc ważnych szlaków handlowych regionu."
 MA_sarkel: "$building_type_MA_sarkel$"
 
 #Nilometer
 MA_nilometer_district: "$building_type_MA_nilometer$"
 MA_nilometer_district_desc: "$building_type_MA_nilometer_desc$"
 building_type_MA_nilometer: "Nilometr"
 building_type_MA_nilometer_desc: "Wąska kamienna komora zbudowana na błotnistym brzegu rzeki, by dokładniej mierzyć wznoszenie i opadanie poziomu Nilu oraz planować uprawy. Wznieśli ją nowi muzułmańscy władcy, podtrzymując pradawny miejscowy zwyczaj i wiążąc powodzie oraz pomyślność z porządkiem państwowym."
 MA_nilometer: "$building_type_MA_nilometer$"
 
 #Abu Simbel
 MA_abu_simbel_district: "$building_type_MA_abu_simbel$"
 MA_abu_simbel_district_desc: "$building_type_MA_abu_simbel_desc$"
 building_type_MA_abu_simbel: "Abu Simbel"
 building_type_MA_abu_simbel_desc: "Kolosalne posągi, wyrzeźbione przez starożytnych faraonów przed wieloma pokoleniami, wystają z tych skalistych wydm, a ich rozmiary wciąż nie mają sobie równych na świecie. \nKażdy, kto ujrzy ich majestat, czy to zwykły podróżnik, czy wielki król, nie może nie poczuć natchnienia opowieścią, którą snują."
 MA_abu_simbel: "$building_type_MA_abu_simbel$"
 
 #Red and White Monasteries
 MA_red_white_monasteries_district: "$building_type_MA_red_white_monasteries$"
 MA_red_white_monasteries_district_desc: "$building_type_MA_red_white_monasteries_desc$"
 building_type_MA_red_white_monasteries: "Czerwony i Biały Klasztor"
 building_type_MA_red_white_monasteries_desc: "Dwa starożytne koptyjskie klasztory w pobliżu brzegów Nilu. Ich mury z kamienia o niezwykłych barwach dały im nazwy: jeden jest głęboko czerwony jak ziemia, drugi blady i świetlisty. Odosobnione, ale niezapomniane, zachowują uczoną i pobożną tradycję chrześcijańską sprzed czasów, gdy muzułmańscy władcy przekroczyli pustynie i skały Synaju, by podbić te ziemie. W ich kaplicach rozbrzmiewają dawne pieśni, a ściany zdobią blaknące freski."
 MA_red_white_monasteries: "$building_type_MA_red_white_monasteries$"
 
 #Knossos
 MA_knossos_ruins_district: "$building_type_MA_knossos_ruins$"
 MA_knossos_ruins_district_desc: "$building_type_MA_knossos_ruins_desc$"
 building_type_MA_knossos_ruins: "Pałac w Knossos"
 building_type_MA_knossos_ruins_desc: "Starożytny pałac w Knossos, górujący nad wspaniałym morzem, zachowuje pamięć o dawnych królach i mitach. Jego wielkie sale, kolumny i freski opowiadają o odległych czasach bogactwa i potęgi, urzekając podróżników i inspirując tych, którzy pragną zająć miejsce wśród możnych władców Krety."
 MA_knossos_ruins: "Ruiny Knossos"
 MA_knossos: "$building_type_MA_knossos_ruins$"
 
 #Skara Brae
 MA_skara_brae_district: "$building_type_MA_skara_brae$"
 MA_skara_brae_district_desc: "$building_type_MA_skara_brae_desc$"
 building_type_MA_skara_brae: "Skara Brae"
 building_type_MA_skara_brae_desc: "Nieśmiało wyłaniająca się z trawiastego wzgórza na smaganym wiatrami wybrzeżu osada starożytnych kamiennych domostw spoczywa na wpół pogrzebana pod ziemią. \nObmywana przenikliwym morskim wiatrem trwa w milczeniu: jej mury są niskie i zwietrzałe, paleniska od niezliczonych stuleci zimne, a mimo to wciąż pobrzmiewa w niej pamięć o życiu, które dawno przeminęło."
 MA_skara_brae: "$building_type_MA_skara_brae$"
 
 #Whitehorse Hill
 MA_whitehorse_hill_district: "$building_type_MA_whitehorse_hill$"
 MA_whitehorse_hill_district_desc: "$building_type_MA_whitehorse_hill_desc$"
 building_type_MA_whitehorse_hill: "Wzgórze Białego Konia"
 building_type_MA_whitehorse_hill_desc: "#flavor Niedaleko miasta Abinton znajduje się góra, na której widnieje postać ogiera, biała niczym śnieg. Nic na niej nie rośnie.#!"
 MA_whitehorse_hill: "$building_type_MA_whitehorse_hill$"
 
 #Gagikashen
 MA_gagikashen_district: "$building_type_MA_gagikashen$"
 MA_gagikashen_district_desc: "$building_type_MA_gagikashen_desc$"
 building_type_MA_gagikashen: "Gagikaszen"
 building_type_MA_gagikashen_desc: "Wielki kościół na planie koła, poświęcony świętemu Grzegorzowi, góruje nad wzgórzami Ani. Jego budowniczowie wzorowali się na ruinach katedry w Zwartnocu. Wysoki tambur wznosi się trzema stopniami ponad kręgami kolumn i bocznych kaplic, otaczających centralną przestrzeń pełną harmonii i przejrzystości."
 MA_gagikashen: "$building_type_MA_gagikashen$"
 
 #Saint Gall
 MA_saint_gall_district: "$building_type_MA_saint_gall$"
 MA_saint_gall_district_desc: "$building_type_MA_saint_gall_desc$"
 building_type_MA_saint_gall: "Opactwo Sankt Gallen"
 building_type_MA_saint_gall_desc: "Wielki zespół klasztorny założony w miejscu pustelni świętego Galla, na skraju ziem Alemanów. Słynący z dyscypliny i organizacji, mieści #italic skryptorium#! oraz bibliotekę wyjątkowej jakości, gdzie mnisi przepisują, tłumaczą i przechowują teksty klasyczne i święte na użytek uczonych z całego chrześcijaństwa."
 MA_saint_gall: "$building_type_MA_saint_gall$"
 
 #Sé of Lisbon
 MA_se_lisbon_district: "$building_type_MA_se_lisbon$"
 MA_se_lisbon_district_desc: "$building_type_MA_se_lisbon_desc$"
 building_type_MA_se_lisbon: "Katedra Sé w Lizbonie"
 building_type_MA_se_lisbon_desc: "Masywna romańska katedra wzniesiona na zboczach ponad portem, której grube mury i wąskie okna świadczą o niespokojnych czasach iberyjskich zmagań. Powstała po chrześcijańskim odbiciu miasta na ruinach dawnego meczetu. W jej kamiennych sklepieniach spoczywają relikwie świętego Wincentego, a przez rozbrzmiewającą echem nawę przechodzą procesje."
 MA_se_lisbon: "$building_type_MA_se_lisbon$"
 
 #Alto Douro Vineyards
 MA_alto_douro_district: "$building_type_MA_alto_douro$"
 MA_alto_douro_district_desc: "$building_type_MA_alto_douro_desc$"
 building_type_MA_alto_douro: "Winnice Alto Douro"
 building_type_MA_alto_douro_desc: "Tarasowe winnice wycięte w stromych zboczach doliny Douro, gdzie kamienne mury podtrzymują ziemię i kierują ku niej promienie słońca. Pierwsze winorośle zasadzono tu w czasach rzymskich, a od dawna wytwarza się tu mocne, ciemne wina, przewożone w dół rzeki na nadmorskie targowiska i zagraniczne dwory."
 MA_alto_douro: "$building_type_MA_alto_douro$"
 
 #Fortifications on the Guadalquivir
 MA_guadalquivir_fortifications_district: "$building_type_MA_guadalquivir_fortifications$"
 MA_guadalquivir_fortifications_district_desc: "$building_type_MA_guadalquivir_fortifications_desc$"
 building_type_MA_guadalquivir_fortifications: "Fortyfikacje nad Gwadalkiwirem"
 building_type_MA_guadalquivir_fortifications_desc: "Umocnienia ciągnące się wzdłuż brzegów Gwadalkiwiru strzegą ruchliwego portu Sewilli, a wieże i bramy stoją na każdym kroku. Najbardziej wyróżnia się Torre del Oro, dwunastoboczna wieża strażnicza pokryta złocistym wapiennym tynkiem, lśniącym ponad wodami rzeki. Jest zarazem latarnią dla zbliżających się statków i ostrzeżeniem o sile miasta."
 MA_guadalquivir_fortifications: "$building_type_MA_guadalquivir_fortifications$"
 
 #Madinat al-Zahra
 MA_madinat_alzahra_district: "$building_type_MA_madinat_alzahra$"
 MA_madinat_alzahra_district_desc: "$building_type_MA_madinat_alzahra_desc$"
 building_type_MA_madinat_alzahra: "Madinat az-Zahra"
 building_type_MA_madinat_alzahra_desc: "Rozległe miasto-pałac wzniesione u łagodnych podnóży wzgórz otaczających Kordobę, mające ukazywać przepych dworu kalifa. Jego ogrody, pawilony i sale audiencyjne rozmieszczono na szerokich tarasach, pośród misternie rzeźbionych ścian z marmuru i jaspisu, a piękno i blask pałacu inspirują poetów do opisywania największych rozkoszy życia."
 MA_madinat_alzahra: "$building_type_MA_madinat_alzahra$"
 
 #Circus of Merida
 MA_circus_merida_district: "$building_type_MA_circus_merida$"
 MA_circus_merida_district_desc: "$building_type_MA_circus_merida_desc$"
 building_type_MA_circus_merida: "Cyrk w Méridzie"
 building_type_MA_circus_merida_desc: "Pozostałości starożytnego rzymskiego cyrku rozciągają się wąskim, długim pasem przez równinę za Méridą. Jego zarys wyznaczają wciąż kruszące się mury i trawiaste tory, a nieliczne cyprysy dają odrobinę cienia. Nieopodal ruin powstał mały kościół z cichym cmentarzem, nadając nowy cel miejscu, które utraciło dawny."
 MA_circus_merida: "$building_type_MA_circus_merida$"
 
 #Alhambra
 MA_alhambra1_district: "$building_type_MA_alhambra1$"
 MA_alhambra1_district_desc: "$building_type_MA_alhambra1_desc$"
 building_type_MA_alhambra1: "Alhambra"
 building_type_MA_alhambra1_desc: "Na łagodnym wzgórzu Sabika czerwone mury Alhambry czuwają nad Grenadą i jej żyzną równiną. W ich objęciach władcy miasta chronią się przed wrogami i skwarem letniego słońca, podczas gdy wieże i blanki ogłaszają ich panowanie nad ziemiami poniżej."
 MA_alhambra2: "Nowa Cytadela"
 MA_alhambra3: "Dziedzińce i Ogrody"
 MA_alhambra4: "Dziedziniec Lwów"
 MA_alhambra1: "Czerwona Twierdza"
 
 #The Cologne Cathedral
 MA_cologne_cathedral1_district: "$building_type_MA_cologne_cathedral1$"
 MA_cologne_cathedral1_district_desc: "$building_type_MA_cologne_cathedral1_desc$"
 building_type_MA_cologne_cathedral1: "Katedra w Kolonii"
 building_type_MA_cologne_cathedral1_desc: "Wielki kościół Kolonii, siedziba arcybiskupa i symbol dumy miasta. Rozbudowywany przez stulecia, przechowuje relikwie o nieocenionej wartości, przyciągające pielgrzymów z bliska i daleka, a jego potężne mury górują nad dachami miejskiej zabudowy."
 MA_cologne_cathedral1: "Stara Katedra w Kolonii"
 MA_cologne_cathedral2: "Bliźniacze Wieże Kolonii"
 
 #Qutb Complex
 MA_qutb_complex1_district: "$building_type_MA_qutb_complex1$"
 MA_qutb_complex1_district_desc: "$building_type_MA_qutb_complex1_desc$"
 building_type_MA_qutb_complex1: "Zespół Kutb"
 building_type_MA_qutb_complex1_desc: "W sercu Delhi leży starożytny święty okręg, gdzie władcy wznosili pomniki i świątynie, by głosić swoją wiarę i potęgę. Rzeźbione kolumny i dziedzińce otaczają wielki żelazny słup dynastii Guptów, którego ciemny trzon przetrwał przemijanie dynastii i bogów."
 MA_qutb_complex1: "Żelazny Słup"
 MA_qutb_complex2: "Wielki Meczet Delhi"
 MA_qutb_complex3: "Kutb Minar"
 MA_qutb_complex4: "Alai Minar"
 
 #Sigiriya
 MA_sigiriya1_district: "$building_type_MA_sigiriya1$"
 MA_sigiriya1_district_desc: "$building_type_MA_sigiriya1_desc$"
 building_type_MA_sigiriya1: "Sigirija"
 building_type_MA_sigiriya1_desc: "Z głębokiej dżungli wyrasta potężna, samotna skała, na której szczycie znajduje się starożytna królewska cytadela [Glossary('Sigirija','MA_sigiriya_glossary')]. Schody pną się wzdłuż ścian pokrytych freskami, mijają kolosalną Lwią Bramę i prowadzą ponad tarasowymi ogrodami oraz sadzawkami, świadcząc o ambicjach królów, którzy zamieszkali na niebie."
 MA_sigiriya1: "Ruiny Sigiriji"
 MA_sigiriya2: "Odbudowana Sigirija"
 MA_sigiriya_glossary: "Słowo syngaleskie, które dosłownie oznacza \"Lwią Skałę\"."
 
 #Great Sanchi Stupa
 MA_sanchi_stupa_district: "$building_type_MA_sanchi_stupa$"
 MA_sanchi_stupa_district_desc: "$building_type_MA_sanchi_stupa_desc$"
 building_type_MA_sanchi_stupa: "Wielka Stupa w Sańczi"
 building_type_MA_sanchi_stupa_desc: "Tę potężną kopułę z kamienia i cegły zbudowano po raz pierwszy na rozkaz wielkiego cesarza Aśoki. Jego następcy rozbudowywali kompleks, który jednocześnie niszczył upływ czasu. Stoi on na podwyższonym tarasie, otoczony rzeźbionymi balustradami i zdobionymi bramami #italics torana#!, wokół których pielgrzymi krążą w nieustannym akcie oddania."
 MA_sanchi_stupa: "$building_type_MA_sanchi_stupa$"
 
 #Vindhyagiri Hill
 MA_gommateshwara1_district: "$building_type_MA_gommateshwara1$"
 MA_gommateshwara1_district_desc: "$building_type_MA_gommateshwara1_desc$"
 building_type_MA_gommateshwara1: "Wzgórze Windhjagiri"
 building_type_MA_gommateshwara1_desc: "Nad miastem Śrawanabelagola stromo wznoszą się granitowe zbocza Windhjagiri, zwieńczone świątyniami i dziedzińcami dźinijskiej pobożności. Pielgrzymi boso wspinają się po wykutych stopniach, a powietrze wypełnia bicie dzwonów i zapach kamienia ogrzanego słońcem."
 MA_gommateshwara2: "Kolos Gommateśwary"
 MA_gommateshwara1: "Świątynie Windhjagiri"
 
 #Palace of Ghazni
 MA_ghazni_palace_district: "$building_type_MA_ghazni_palace$"
 MA_ghazni_palace_district_desc: "$building_type_MA_ghazni_palace_desc$"
 building_type_MA_ghazni_palace: "Pałac Ghaznawidów"
 building_type_MA_ghazni_palace_desc: "Ta królewska rezydencja poza murami Ghazni stanowi ośrodek władzy miejscowego sułtana. Jej sale rozchodzą się promieniście od czworobocznego dziedzińca z #italic iwanem#!, a mistrzowskie rzeźbienia, bogate stiuki i wielobarwne płytki czerpią z kunsztu Persji."
 MA_ghazni_palace: "$building_type_MA_ghazni_palace$"
 
 #Stupas of Anuradhapura
 MA_stupas_anuradhapura_district: "$building_type_MA_stupas_anuradhapura$"
 MA_stupas_anuradhapura_district_desc: "$building_type_MA_stupas_anuradhapura_desc$"
 building_type_MA_stupas_anuradhapura: "Stupy Anuradhapury"
 building_type_MA_stupas_anuradhapura_desc: "Wokół starożytnego miasta świątynnego Anuradhapura wznoszą się ogromne ceglane [Glossary('stupy','MA_stupa_glossary')] syngaleskich królów, zbudowane dla przechowywania relikwii Buddy. Bielone klasztory i ośrodki nauki lśnią w słońcu, podczas gdy w ich salach i na dziedzińcach toczą się uczone dysputy."
 MA_stupas_anuradhapura: "$building_type_MA_stupas_anuradhapura$"
 
 #Eye of the Sahara
 MA_eye_sahara_district: "$building_type_MA_eye_sahara$"
 MA_eye_sahara_district_desc: "$building_type_MA_eye_sahara_desc$"
 building_type_MA_eye_sahara: "Oko Sahary"
 building_type_MA_eye_sahara_desc: "Ogromna kolista formacja w sercu pustyni, której skalne pierścienie ciągną się przez wiele mil pośród piasków. Z daleka przypomina wielkie, zwietrzałe oko skierowane ku niebu, punkt orientacyjny znany koczownikom i karawanom przemierzającym okoliczne pustkowia. \nPradawne legendy wiążą je z niegdyś kwitnącym miastem, bujnym i pełnym płynącej wody, które teraz pochłonęły piaski."
 MA_eye_sahara: "$building_type_MA_eye_sahara$"
 
 #Great Mosque of Mahdia
 MA_mahdia_mosque_district: "$building_type_MA_mahdia_mosque$"
 MA_mahdia_mosque_district_desc: "$building_type_MA_mahdia_mosque_desc$"
 building_type_MA_mahdia_mosque: "Wielki Meczet w Al-Mahdijji"
 building_type_MA_mahdia_mosque_desc: "Wzniesiony na skalistym półwyspie Al-Mahdijji, ten surowy meczet przypomina twierdzę dzięki wieżom z jasnego kamienia. \nDwa eleganckie dziedzińce otoczone arkadami prowadzą do sal modlitwy, gdzie wierni gromadzą się pod łukami z jasnego kamienia."
 MA_mahdia_mosque: "$building_type_MA_mahdia_mosque$"
 
 #Saint Mark's of Zagreb
 MA_zagreb_church_district: "$building_type_MA_zagreb_church$"
 MA_zagreb_church_district_desc: "$building_type_MA_zagreb_church_desc$"
 building_type_MA_zagreb_church: "Kościół św. Marka w Zagrzebiu"
 building_type_MA_zagreb_church_desc: "Kościół świętego Marka, zbudowany z pomocą włoskich i niemieckich rzemieślników, góruje nad resztą miasta. Jego romański plan wzbogacono o gotyckie dodatki, a portale i ściany obficie pokryto malowidłami przedstawiającymi sceny biblijne."
 MA_zagreb_church: "$building_type_MA_zagreb_church$"
 
 #Walls of Balkh
 MA_walls_balkh_district: "$building_type_MA_walls_balkh$"
 MA_walls_balkh_district_desc: "$building_type_MA_walls_balkh_desc$"
 building_type_MA_walls_balkh: "Mury Balchu"
 building_type_MA_walls_balkh_desc: "Przez stulecia cytadelę Balchu chroniły dwa wielkie koliste pierścienie murów otaczających cały jej obwód, jeden wewnątrz drugiego. Ich ziemne wały i wieże stanowią zaporę przeciw armiom nadciągającym przez step i strzegą targowisk oraz warsztatów wewnątrz miasta."
 MA_walls_balkh: "$building_type_MA_walls_balkh$"
 
 #Martand Sun Temple
 MA_martand_sun_temple_district: "$building_type_MA_martand_sun_temple$"
 MA_martand_sun_temple_district_desc: "$building_type_MA_martand_sun_temple_desc$"
 building_type_MA_martand_sun_temple: "Świątynia Słońca w Martandzie"
 building_type_MA_martand_sun_temple_desc: "Wzniesiona na wysokim płaskowyżu w Dolinie Kaszmirskiej świątynia należy do najstarszych poświęconych boskiemu Słońcu. Pośrodku znajduje się wielkie sanktuarium otoczone licznymi mniejszymi kaplicami i rzędami rzeźb przedstawiających bóstwa oraz istoty niebiańskie. Na dziedzińcu otoczonym perystylem spokojna sadzawka połyskuje w słońcu."
 MA_martand_sun_temple: "$building_type_MA_martand_sun_temple$"
 
 #Ruins of Aquae Sulis
 MA_aquae_sulis_ruins_district: "$building_type_MA_aquae_sulis_ruins$"
 MA_aquae_sulis_ruins_district_desc: "$building_type_MA_aquae_sulis_ruins_desc$"
 building_type_MA_aquae_sulis_ruins: "Ruiny Aquae Sulis"
 building_type_MA_aquae_sulis_ruins_desc: "#low Dzieło olbrzymów obraca się w ruinę#! \nWokół parującego świętego źródła leżą rozbite pozostałości Aquae Sulis, gdzie Rzymianie wznieśli niegdyś wielkie łaźnie i świątynie z ciosanego kamienia. Zniszczone mury, zawalone łuki i zalane komnaty wciąż wyznaczają uporządkowany plan starożytnego kompleksu, którego ciepłe wody nadal płyną, gdy pośród ruin gromadzą się pielgrzymi i mieszkańcy."
 MA_aquae_sulis_ruins: "$building_type_MA_aquae_sulis_ruins$"
 
 #Winchester Minster
 MA_winchester_minster_district: "$building_type_MA_winchester_minster$"
 MA_winchester_minster_district_desc: "$building_type_MA_winchester_minster_desc$"
 building_type_MA_winchester_minster: "Wielka Kolegiata w Winchesterze"
 building_type_MA_winchester_minster_desc: "Wielka kolegiata to rozległa bazylika z kamienia i drewna, z szeroką, malowaną nawą i licznymi dzwonnicami. Góruje nad królewskim miastem, znacznie większa od wszystkich jego pozostałych budowli, i strzeże grobów królewskiej dynastii Wesseksu."
 MA_winchester_minster: "$building_type_MA_winchester_minster$"
 
 #Westminster Abbey
 MA_westminster_abbey_district: "$building_type_MA_westminster_abbey$"
 MA_westminster_abbey_district_desc: "$building_type_MA_westminster_abbey_desc$"
 building_type_MA_westminster_abbey: "Opactwo Westminsterskie"
 building_type_MA_westminster_abbey_desc: "Zbudowane nad Tamizą i hojnie uposażone przez królów Anglii Opactwo Westminsterskie jest wielkim kamiennym kościołem klasztornym o długiej nawie i wyniosłym prezbiterium, zdobionym rzeźbionymi kapitelami i malowidłami ściennymi. Tutaj koronuje się i chowa królów, a opactwo stanowi świętą scenę, na której władza królewska splata się z boską przychylnością."
 MA_westminster_abbey: "$building_type_MA_westminster_abbey$"
 
 #Lorsch Gate
 MA_lorsch_gate_district: "$building_type_MA_lorsch_gate$"
 MA_lorsch_gate_district_desc: "$building_type_MA_lorsch_gate_desc$"
 building_type_MA_lorsch_gate: "Brama opactwa Lorsch"
 building_type_MA_lorsch_gate_desc: "Monumentalny budynek bramny opactwa Lorsch jest rzadkim i starannie wykonanym przykładem architektury karolińskiej. Zbudowana z precyzyjnie ciosanego kamienia i cegły, symetryczna fasada została podzielona przyściennymi kolumnami i ślepymi arkadami oraz ozdobiona klasycznymi ornamentami nawiązującymi do wzorów starożytnego Rzymu."
 MA_lorsch_gate: "$building_type_MA_lorsch_gate$"
 
 #Dover Castle
 MA_dover_castle_district: "$building_type_MA_dover_castle$"
 MA_dover_castle_district_desc: "$building_type_MA_dover_castle_desc$"
 building_type_MA_dover_castle: "Zamek Dover"
 building_type_MA_dover_castle_desc: "Twierdza wznosząca się na białych klifach nad wąskim kanałem kontroluje główną przeprawę między Anglią a kontynentem. Jej potężny kamienny donżon, mury kurtynowe i kolejne bramy tworzą groźny system obronny, strzegący portu i dróg prowadzących w głąb lądu, a zarazem służący za królewską warownię i rezydencję."
 MA_dover_castle: "$building_type_MA_dover_castle$"
 
 #Château Gaillard
 MA_chateau_gaillard_district: "$building_type_MA_chateau_gaillard$"
 MA_chateau_gaillard_district_desc: "$building_type_MA_chateau_gaillard_desc$"
 building_type_MA_chateau_gaillard: "Château Gaillard"
 building_type_MA_chateau_gaillard_desc: "Zbudowany na wapiennej ostrodze ponad Sekwaną Château Gaillard jest zwartą i wyrafinowaną kamienną twierdzą przeznaczoną do czynnej obrony. Jego koncentryczne mury, ustawione pod kątem wieże i wysunięte umocnienia bram ograniczają martwe pola i skupiają ostrzał na drogach podejścia. Wzniesiony szybko i precyzyjnie, ucieleśnia najnowsze zasady architektury obronnej, zapewniając kontrolę nad rzeką i granicą Normandii."
 MA_chateau_gaillard: "$building_type_MA_chateau_gaillard$"
 
 #Carnac Stones
 MA_carnac_stones_district: "$building_type_MA_carnac_stones$"
 MA_carnac_stones_district_desc: "$building_type_MA_carnac_stones_desc$"
 building_type_MA_carnac_stones: "Megality w Carnac"
 building_type_MA_carnac_stones_desc: "Setki potężnych głazów rozsiano po równinie, ustawiając je w równych szeregach ciągnących się ku horyzontowi. Wzniesione w odległych, niepamiętnych czasach, skrywają pierwotne przeznaczenie pod warstwą legend i opowieści."
 MA_carnac_stones: "$building_type_MA_carnac_stones$"
 
 #Guérande Salt Marshes
 MA_guerande_salt_marshes_district: "$building_type_MA_guerande_salt_marshes$"
 MA_guerande_salt_marshes_district_desc: "$building_type_MA_guerande_salt_marshes_desc$"
 building_type_MA_guerande_salt_marshes: "Saliny Guérande"
 building_type_MA_guerande_salt_marshes_desc: "Wzdłuż niskich nadmorskich równin w pobliżu Guérande ciągnie się sieć basenów solnych, grobli i kanałów służących wydobywaniu z morza słynnego przysmaku, #italic fleur de sel#!. Morską wodę prowadzi się do płytkich zbiorników, gdzie słońce wytrąca białą sól. Rzemiosło przekazywane z pokolenia na pokolenie utrzymuje miasta i handel całego regionu."
 MA_guerande_salt_marshes: "$building_type_MA_guerande_salt_marshes$"
 
 #Reims Cathedral
 MA_reims_cathedral_district: "$building_type_MA_reims_cathedral$"
 MA_reims_cathedral_district_desc: "$building_type_MA_reims_cathedral_desc$"
 building_type_MA_reims_cathedral: "Katedra w Reims"
 building_type_MA_reims_cathedral_desc: "Rozległa gotycka katedra wyróżnia się wysoką nawą, smukłymi filarami wiązkowymi oraz szerokim zastosowaniem sklepień żebrowych i łuków przyporowych. Zachodnią fasadę bogato zdobią rzeźbione portale i głębokie archiwolty, a wnętrze otaczają ściany witraży, podkreślające wysokość, światło i ceremonialny majestat stosowny do jej centralnej roli w koronacjach królów Francji."
 MA_reims_cathedral: "$building_type_MA_reims_cathedral$"
 
 #Chartres Cathedral
 MA_chartres_cathedral_district: "$building_type_MA_chartres_cathedral$"
 MA_chartres_cathedral_district_desc: "$building_type_MA_chartres_cathedral_desc$"
 building_type_MA_chartres_cathedral: "Katedra w Chartres"
 building_type_MA_chartres_cathedral_desc: "Jeden z najbardziej eleganckich i harmonijnych przykładów ambicji dojrzałego gotyku. Katedrę w Chartres wyróżniają szeroka nawa, masywne filary i głębokie prezbiterium. Jej mury ustępują miejsca ogromnym witrażom osadzonym w solidnym szkielecie konstrukcyjnym, podczas gdy dwie wieże i starannie wyważone proporcje elewacji wyrażają trwałość, przejrzystość i zamysł teologiczny."
 MA_chartres_cathedral: "$building_type_MA_chartres_cathedral$"
 
 #Palace of Avignon
 MA_avignon_palace1_district: "$building_type_MA_avignon_palace1$"
 MA_avignon_palace1_district_desc: "$building_type_MA_avignon_palace1_desc$"
 building_type_MA_avignon_palace1: "Pałac w Awinionie"
 building_type_MA_avignon_palace1_desc: "Na skalistym występie ponad Rodanem wznosi się wielki pałac-twierdza, siedziba wyrafinowanego i potężnego dworu. Jego sale, wieże i sklepione kaplice cechują się zarazem siłą i elegancją form, a ulice poniżej wypełniają posłowie, rzemieślnicy i kupcy przyciągani bogactwem oraz autorytetem władców."
 MA_avignon_palace1: "Stary Pałac"
 MA_avignon_palace2: "Nowy Pałac"
 
 #Walls of Carcassonne
 MA_walls_carcassonne1_district: "$building_type_MA_walls_carcassonne1$"
 MA_walls_carcassonne1_district_desc: "$building_type_MA_walls_carcassonne1_desc$"
 building_type_MA_walls_carcassonne1: "Mury Carcassonne"
 building_type_MA_walls_carcassonne1_desc: "Starożytne mury Carcassonne chronią dolinę i drogi między ziemiami iberyjskimi a frankijskimi. Wieże i silnie ufortyfikowane bramy wieńczą obwód murów, strzegąc domów wewnątrz i pól poniżej. Jest to potężna warownia na pograniczu, o które od dawna walczą królowie i wyznawcy różnych religii."
 MA_walls_carcassonne1: "Starożytne Mury Carcassonne"
 MA_walls_carcassonne2: "Podwójne Mury Carcassonne"
 
 #Saint-Denis Basilica
 MA_saint_denis_basilica1_district: "$building_type_MA_saint_denis_basilica1$"
 MA_saint_denis_basilica1_district_desc: "$building_type_MA_saint_denis_basilica1_desc$"
 building_type_MA_saint_denis_basilica1: "Bazylika Saint-Denis"
 building_type_MA_saint_denis_basilica1_desc: "Wzniesiona w miejscu pochówku świętego Dionizego ta wielka bazylika stanowi sanktuarium królewskiej pobożności. Szeroka nawa wiedzie pielgrzymów ku relikwiarzowi świętego, podczas gdy malowane ściany i rzeźbione kapitele czuwają nad spoczywającymi poniżej królami. Tutaj autorytet Korony i Kościoła zespala się w kamieniu."
 MA_saint_denis_basilica1: "Królewska Bazylika Saint-Denis"
 MA_saint_denis_basilica2: "Wielkie Prezbiterium Saint-Denis"
 
 #Île de la Cité
 MA_ile_de_la_cite1_district: "$building_type_MA_ile_de_la_cite1$"
 MA_ile_de_la_cite1_district_desc: "$building_type_MA_ile_de_la_cite1_desc$"
 building_type_MA_ile_de_la_cite1: "Île de la Cité"
 building_type_MA_ile_de_la_cite1_desc: "Po upadku Rzymu mieszkańcy miasta znaleźli schronienie na wyspie otoczonej wodami zakola Sekwany. Od tamtej pory jednak Île de la Cité rozkwitła, nabrała piękna i dumy, a dziś stanowi polityczne, intelektualne i handlowe serce Paryża, a wraz z nim całej Francji."
 MA_ile_de_la_cite1: "Pałac Karoliński"
 MA_ile_de_la_cite2: "Pałac Gotycki"
 
 #Iron Gate
 MA_iron_gate_district: "$building_type_MA_iron_gate$"
 MA_iron_gate_district_desc: "$building_type_MA_iron_gate_desc$"
 building_type_MA_iron_gate: "Żelazna Brama"
 building_type_MA_iron_gate_desc: "Strzegąca górskiej przełęczy łączącej równinę Orontesu z górami wznoszącymi się ponad nią Żelazna Brama stanowi jedno z najważniejszych wejść do Antiochii. Mury zwężają się tu w ufortyfikowany wąwóz kamiennych wież, bram i murów oporowych osadzonych wprost w skale. Cytadela służy również jako swego rodzaju tama, regulując nurt Parmeniosu dla ochrony miasta."
 MA_iron_gate: "$building_type_MA_iron_gate$"
 
 #Pula Amphitheater
 MA_pula_amphiteater_district: "$building_type_MA_pula_amphiteater$"
 MA_pula_amphiteater_district_desc: "$building_type_MA_pula_amphiteater_desc$"
 building_type_MA_pula_amphiteater: "Amfiteatr w Puli"
 building_type_MA_pula_amphiteater_desc: "Zbudowany z precyzyjnie obrobionego wapienia amfiteatr zachował pełną formę rzymskiej areny, z eliptycznymi murami, stopniowanymi rzędami siedzeń i systemem sklepionych korytarzy poniżej. Cztery narożne wieże i solidne arkady świadczą o dumnej tradycji inżynieryjnej jego budowniczych, a sam obiekt pozostaje miejscem sprawowania władzy, zgromadzeń i widowisk w średniowiecznym mieście."
 MA_pula_amphiteater: "$building_type_MA_pula_amphiteater$"
 
 #Olympus
 MA_olympus_district: "$building_type_MA_olympus$"
 MA_olympus_district_desc: "$building_type_MA_olympus_desc$"
 building_type_MA_olympus: "Olimp"
 building_type_MA_olympus_desc: "Potężna góra w sercu Tesalii, której poszarpany szczyt, najwyższy w całej Grecji, rzuca długie cienie na morze i łagodne, żyzne zbocza. \nUważana za siedzibę bogów, od tysiącleci budzi cześć i zachwyt, a wedle podań jej wierzchołek wieńczy niewidzialny pałac niebian."
 MA_olympus: "$building_type_MA_olympus$"
 
 #Ypres Cloth Hall
 MA_ypres_cloth_hall_district: "$building_type_MA_ypres_cloth_hall$"
 MA_ypres_cloth_hall_district_desc: "$building_type_MA_ypres_cloth_hall_desc$"
 building_type_MA_ypres_cloth_hall: "Sukiennice w Ypres"
 building_type_MA_ypres_cloth_hall_desc: "Ta rozległa hala miejska z kamienia i drewna służy nadzorowi, przechowywaniu i handlowi wełnianym suknem, które stanowi źródło bogactwa miasta. Jej długa, uporządkowana fasada z arkadami, szczytami i dominującą dzwonnicą łączy funkcję handlową z miejskim autorytetem. W sklepionych salach kupcy, urzędnicy cechowi i rajcy nadzorują umowy, miary i podatki stanowiące serce miejskiej gospodarki."
 MA_ypres_cloth_hall: "$building_type_MA_ypres_cloth_hall$"
 
 #Gravensteen
 MA_gravensteen_district: "$building_type_MA_gravensteen$"
 MA_gravensteen_district_desc: "$building_type_MA_gravensteen_desc$"
 building_type_MA_gravensteen: "Gravensteen"
 building_type_MA_gravensteen_desc: "Ten imponujący kamienny zamek jest siedzibą hrabiów Flandrii i symbolem ich władzy nad miastem. Skupiony wokół potężnego donżonu i otoczony grubymi murami kurtynowymi, łączy sale mieszkalne z komnatami sądowymi i umocnieniami obronnymi, podkreślając władzę feudalnego pana wśród gęstej zabudowy Gandawy."
 MA_gravensteen: "$building_type_MA_gravensteen$"
 
 #Mount Ararat
 MA_ararat_district: "$building_type_MA_ararat$"
 MA_ararat_district_desc: "$building_type_MA_ararat_desc$"
 building_type_MA_ararat: "Góra Ararat"
 building_type_MA_ararat_desc: "Ogromny masyw wulkaniczny o dwóch szczytach wyrastających ponad otaczające równiny, Ararat dominuje nad horyzontem, a jego wierzchołki okrywa wieczny śnieg. Czczony w wielu królestwach i religiach, zgodnie z prastarą tradycją jest miejscem spoczynku Arki Noego, nadając ziemiom u jego stóp święty autorytet i dostojną powagę."
 MA_ararat: "$building_type_MA_ararat$"
 
 #Székesfehérvár Basilica
 MA_szekesfehervar_basilica1_district: "$building_type_MA_szekesfehervar_basilica1$"
 MA_szekesfehervar_basilica1_district_desc: "$building_type_MA_szekesfehervar_basilica1_desc$"
 building_type_MA_szekesfehervar_basilica1: "Bazylika w Székesfehérvár"
 building_type_MA_szekesfehervar_basilica1_desc: "Ta wielka kamienna bazylika stanowi ceremonialne i dynastyczne serce królestwa węgierskiego. W jej szerokiej nawie królowie są koronowani i chowani, jednocząc władzę monarszą, prawo i wiarę pod sklepieniami najważniejszego królewskiego sanktuarium królestwa."
 MA_szekesfehervar_basilica1: "Królewska Bazylika w Székesfehérvár"
 MA_szekesfehervar_basilica2: "Wielkie Prezbiterium w Székesfehérvár"
 
 #Prague Castle
 MA_prague_castle1_district: "$building_type_MA_prague_castle1$"
 MA_prague_castle1_district_desc: "$building_type_MA_prague_castle1_desc$"
 building_type_MA_prague_castle1: "Zamek Praski"
 building_type_MA_prague_castle1_desc: "Na długim grzbiecie ponad Wełtawą sale, kościoły i dziedzińce Zamku Praskiego górują nad miastem. Wokół tej siedziby władców Czech gromadzą się rzemieślnicy, dworzanie i duchowni, a bogactwo oraz ambicje panujących uczyniły wzgórze politycznym i świętym sercem ich ziem."
 MA_prague_castle1: "Książęca Siedziba w Pradze"
 MA_prague_castle2: "Królewski Zamek w Pradze"
 
 #Saint Adrian's Basilica
 MA_zalavar_basilica_district: "$building_type_MA_zalavar_basilica$"
 MA_zalavar_basilica_district_desc: "$building_type_MA_zalavar_basilica_desc$"
 building_type_MA_zalavar_basilica: "Bazylika św. Hadriana"
 building_type_MA_zalavar_basilica_desc: "Bazylika świętego Hadriana, ośrodek ufortyfikowanej osady karolińskiej na mokradłach Zali, stanowi ważną fundację kościelną z okresu początków chrystianizacji regionu. Wzniesiona jako trzynawowa kamienna świątynia z wyodrębnionym prezbiterium i zabudowaniami zachodnimi, służy zarazem za ośrodek misyjny i kościół książęcy, wzmacniając wpływy dyplomatyczne swego protektora na ziemiach pogranicznych."
 MA_zalavar_basilica: "$building_type_MA_zalavar_basilica$"
 
 #Baths of Hisham
 MA_baths_hisham_district: "$building_type_MA_baths_hisham$"
 MA_baths_hisham_district_desc: "$building_type_MA_baths_hisham_desc$"
 building_type_MA_baths_hisham: "Łaźnie Hiszama"
 building_type_MA_baths_hisham_desc: "Łaźnie te są częścią większego zespołu pałacowego i składają się z szeregu komór zimnych, ciepłych i gorących, ogrzewanych systemem hypokaustum i przykrytych kamiennymi sklepieniami. Ich posadzki bogato zdobią mozaiki geometryczne i figuralne, zwłaszcza wielka kompozycja przedstawiająca drzewa i zwierzęta, wykonana z drobnych tesser z wielką dbałością o układ."
 MA_baths_hisham: "$building_type_MA_baths_hisham$"
 
 #Peel Castle
 MA_peel_castle1_district: "$building_type_MA_peel_castle1$"
 MA_peel_castle1_district_desc: "$building_type_MA_peel_castle1_desc$"
 building_type_MA_peel_castle1: "Wyspa św. Patryka"
 building_type_MA_peel_castle1_desc: "Na skalistej wysepce świętego Patryka kościoły, sale i miejsca pochówku spoglądają ku otaczającemu morzu. Tutaj dawne miejscowe tradycje spotykają się z wiarą nowych osadników, a duchowni i władcy dzielą wąskie schronienie, którego osłonięte brzegi łączą kult religijny z doczesną potęgą."
 MA_peel_castle1: "Klasztor na Wyspie św. Patryka"
 MA_peel_castle2: "Sala św. Patryka"
 MA_peel_castle3: "Zamek Peel"
 
 #Knin Fortress
 MA_knin_fortress_district: "$building_type_MA_knin_fortress$"
 MA_knin_fortress_district_desc: "$building_type_MA_knin_fortress_desc$"
 building_type_MA_knin_fortress: "Twierdza Knin"
 building_type_MA_knin_fortress_desc: "Rozciągnięta wzdłuż wąskiego wapiennego grzbietu ponad doliną Krki twierdza Knin tworzy długi, podzielony na części zespół obronny z murów, wież i zamkniętych dziedzińców. Jej położenie pozwala kontrolować szlaki między wybrzeżem a równinami w głębi lądu, czyniąc ją jedną z głównych królewskich warowni regionu."
 MA_knin_fortress: "$building_type_MA_knin_fortress$"
 
 #Amaravati Stupa
 MA_amaravati_stupa_district: "$building_type_MA_amaravati_stupa$"
 MA_amaravati_stupa_district_desc: "$building_type_MA_amaravati_stupa_desc$"
 building_type_MA_amaravati_stupa: "Stupa w Amarawati"
 building_type_MA_amaravati_stupa_desc: "Wielka starożytna [Glossary('stupa','MA_stupa_glossary')] obłożona płytami z białego wapienia, największa w drawidyjskich Indiach. W ceglane mury wkomponowano barwne reliefy narracyjne, przedstawiające życie Buddy i sceny pobożności w medalionach oraz fryzach, zaś bramy wyznaczają drogi z czterech stron świata, porządkując rytualne obchodzenie świętego kopca."
 MA_amaravati_stupa: "$building_type_MA_amaravati_stupa$"
 MA_stupa_glossary: "Budowla w kształcie kopuły, zawierająca relikwie i służąca w praktyce buddyjskiej jako miejsce medytacji oraz czci. Najstarsze stupy były prostymi kopcami, lecz ich kształt i funkcja z czasem ewoluowały, wpływając na architekturę buddyjską w całej Azji, być może również na pagody."
 
 #Karla Caves
 MA_karla_caves_district: "$building_type_MA_karla_caves$"
 MA_karla_caves_district_desc: "$building_type_MA_karla_caves_desc$"
 building_type_MA_karla_caves: "Jaskinie Karla"
 building_type_MA_karla_caves_desc: "Wykute bezpośrednio w zboczu góry jaskinie Karla tworzą kompleks skalnych [Glossary('wihar','MA_vihara')] i sanktuariów skupionych wokół wielkiej sali ćajtji. Tę ogromną przestrzeń wyróżnia wysokie sklepienie z rzeźbionymi żebrami, długa nawa z rzędami kolumn i [Glossary('stupa','MA_stupa_glossary')] umieszczona w apsydzie. Fasadę wejściową zdobi wielki łuk podkowiasty i rzeźbione reliefy, wyznaczające przejście ze świata zewnętrznego do uporządkowanego wnętrza rytuału i pobożności."
 MA_karla_caves: "$building_type_MA_karla_caves$"
 MA_vihara: "Rodzaj świątyni buddyjskiej zapewniającej pomieszczenia mieszkalne mnichom. W architekturze indyjskiej oznacza dokładniej centralną salę, z którą połączone są cele."
 
 #Somnath Temple
 MA_somnath_temple_district: "$building_type_MA_somnath_temple$"
 MA_somnath_temple_district_desc: "$building_type_MA_somnath_temple_desc$"
 building_type_MA_somnath_temple: "Świątynia Somnath"
 building_type_MA_somnath_temple_desc: "Wielka kamienna świątynia poświęcona Bogu Księżyca, Somnath, ma podłużną oś złożoną z kolejnych [Glossary('mandap','MA_mandapa')] prowadzących do sanktuarium zwieńczonego strzelistą [Glossary('śikharą','MA_vimana_glossary')]. Jej ściany i filary bogato zdobią rzeźby bóstw, sług i ornamentalne pasy. Jako ważny ośrodek pielgrzymkowy przyciąga wiernych z całego regionu, ale także zazdrosne spojrzenia pogańskich wojsk zza Indusu."
 MA_somnath_temple: "$building_type_MA_somnath_temple$"
 MA_mandapa: "Wsparta na filarach sala lub pawilon w architekturze indyjskiej, służące jako przestrzeń przejściowa i wejście do świątyni."
 
 #Devagiri
 MA_devagiri_district: "$building_type_MA_devagiri$"
 MA_devagiri_district_desc: "$building_type_MA_devagiri_desc$"
 building_type_MA_devagiri: "Dewagiri"
 building_type_MA_devagiri_desc: "Wielkie wulkaniczne wzgórze wyrasta nagle z równiny, a jego ciemne bazaltowe zbocza przecinają wąskie ścieżki wijące się ku szczytowi. Góra, znana jako [Glossary('Dewagiri','MA_devagiri_glossary')], kryje starożytne jaskinie i sanktuaria, a jej wyniosłe położenie zapewnia potężne schronienie tym, którzy nią władają."
 MA_devagiri: "$building_type_MA_devagiri$"
 MA_daulatabad: "Daulatabad"
 MA_devagiri_glossary: "Z sanskrytu: \"Wzgórze Bogów\"."
 MA_daulatabad_glossary: "Siedziba Bogactwa."
 
 #Ashoka's Palace
 MA_ashoka_palace1_district: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_palace1_district_desc: "$building_type_MA_ashoka_palace1_desc$"
 building_type_MA_ashoka_palace1: "Pałac Aśoki"
 building_type_MA_ashoka_palace1_desc: "Pałac wielkiego [Glossary('Aśoki','MA_ashoka_glossary')] świadczy o bogactwie i potędze starożytnych królów Indii. Jego rozległe dziedzińce i sale kolumnowe zrodziły opowieści o niezwykłym przepychu, a skala i wyrafinowanie budowli stanowią godny wzór dla tych, którzy pragnęliby przywrócić dawną chwałę."
 MA_ashoka_palace1: "Ruiny Pałacu Aśoki"
 MA_ashoka_palace2: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_glossary: "Trzeci cesarz dynastii Maurjów, znany z przemiany z bezwzględnego podżegacza wojennego w etycznego władcę, który popierał buddyzm i szeroko zakrojoną działalność misyjną."
 
 #Adina Mosque
 MA_adina_mosque_district: "$building_type_MA_adina_mosque$"
 MA_adina_mosque_district_desc: "$building_type_MA_adina_mosque_desc$"
 building_type_MA_adina_mosque: "Meczet Adina"
 building_type_MA_adina_mosque_desc: "Rozległy [Glossary('hipostylowy','MA_hypostyle_glossary')] meczet z cegły i kamienia, Adina, jest zorganizowany wokół wielkiego prostokątnego dziedzińca otoczonego arkadami i rzędami nakrytych kopułami przęseł. Salę modlitwy przykrywa monumentalne sklepienie kolebkowe, nawiązujące do cesarskich form Persji. Zewnętrzne ściany zdobią rzeźbione kamienne [Glossary('spolia','MA_spolia_glossary')] i terakotowe kwiaty."
 MA_adina_mosque: "$building_type_MA_adina_mosque$"
 MA_hypostyle_glossary: "Typ rozwiązania architektonicznego, w którym dach wspierają rzędy kolumn, tworzące rozległą, otwartą przestrzeń wewnętrzną."
 MA_spolia_glossary: "Elementy architektoniczne wykorzystane ponownie ze starszych budowli, często dla podkreślenia ciągłości i prawowitości. Typowe, choć nie wyłącznie, dla rzymskich ruin na obszarze Morza Śródziemnego."
 
 #Chittorgarh
 MA_chittorgarh_district: "$building_type_MA_chittorgarh$"
 MA_chittorgarh_district_desc: "$building_type_MA_chittorgarh_desc$"
 building_type_MA_chittorgarh: "Ćittorgarh"
 building_type_MA_chittorgarh_desc: "Fort Ćittor, zajmujący szczyt długiego, odosobnionego wzgórza, jest jednym z największych pomników architektury obronnej Indii. Potężne mury ciągną się przez mile wzdłuż krawędzi płaskowyżu, obejmując pałace, świątynie i wieże wewnątrz samowystarczalnej cytadeli."
 MA_chittorgarh: "$building_type_MA_chittorgarh$"
 
 #Lingaraj Temple
 MA_lingaraj_temple_district: "$building_type_MA_lingaraj_temple$"
 MA_lingaraj_temple_district_desc: "$building_type_MA_lingaraj_temple_desc$"
 building_type_MA_lingaraj_temple: "Świątynia Lingaradźa"
 building_type_MA_lingaraj_temple_desc: "Jeden z najwspanialszych przykładów architektury świątynnej Indii. Kompleks Lingaradźa zbudowano wzdłuż jednej osi coraz świętszych przestrzeni, prowadzących ku wyniosłej, krzywoliniowej [Glossary('wimanie','MA_vimana_glossary')] Śiwy. Każdą powierzchnię zdobią rzeźbione bóstwa, ornamenty roślinne i reliefy narracyjne."
 MA_lingaraj_temple: "$building_type_MA_lingaraj_temple$"
 MA_vimana_glossary: "Wysoka, zakrzywiona nadbudowa wznosząca się bezpośrednio ponad wewnętrznym sanktuarium świątyni indyjskiej, często zdobiona misternymi rzeźbieniami. Na północy styl ten nosi nazwę #italic śikhara#!, natomiast w południowych Indiach i w Odiszy określa się go jako #italic wimana#!."
 
 #Tsarevgrad
 MA_tsarevgrad1_district: "$building_type_MA_tsarevgrad1$"
 MA_tsarevgrad1_district_desc: "$building_type_MA_tsarevgrad1_desc$"
 building_type_MA_tsarevgrad1: "Carewgrad"
 building_type_MA_tsarevgrad1_desc: "Skaliste wzgórza ponad Jantrą dominują nad drogami przez okoliczne doliny. Na ich szczytach mury, wieże i świątynie tworzą warownię, której naturalne umocnienia i wyniosłe sale stanowią godną siedzibę władców tych ziem."
 MA_tsarevgrad1: "Stara Twierdza Tyrnowa"
 MA_tsarevgrad2: "$building_type_MA_tsarevgrad1$"
 MA_tsarevets_glossary: "Miasto Carów, nazwa przywołująca cesarskie ambicje i boski autorytet władców rządzących z tej wyniosłej warowni."
 
 #Orange Theater
 MA_orange_theater1_district: "$building_type_MA_orange_theater1$"
 MA_orange_theater1_district_desc: "$building_type_MA_orange_theater1_desc$"
 building_type_MA_orange_theater1: "Teatr w Orange"
 building_type_MA_orange_theater1_desc: "Strzelista rzymska ściana sceniczna teatru w Orange góruje nad wielkim kamiennym półkolem, stanowiąc monumentalne przypomnienie starożytnej chwały miasta. Jej łuki, kolumny i rzeźbione kamienne bloki świadczą o kunszcie budowniczych cezarów, wciąż kształtując życie mieszczan wiele stuleci po przeminięciu ich władzy."
 MA_orange_theater1: "Ruiny Teatru w Orange"
 MA_orange_theater2: "$building_type_MA_orange_theater1$"
 MA_cavea_glossary: "Pochodząca od łacińskiego słowa oznaczającego ogrodzenie nazwa półkolistej, stopniowanej widowni rzymskiego teatru lub amfiteatru."
 
 #Walls of Mesembria
 MA_walls_mesembria_district: "$building_type_MA_walls_mesembria$"
 MA_walls_mesembria_district_desc: "$building_type_MA_walls_mesembria_desc$"
 building_type_MA_walls_mesembria: "Mury Mesembrii"
 building_type_MA_walls_mesembria_desc: "Mury otaczające skalisty półwysep mają długą historię: wzniesiono je na greckich fundamentach, a ich rozbudowy podejmowali się cesarze rzymscy i bizantyjscy. Potężne kurtyny murów, wysunięte wieże i silnie bronione bramy chronią port oraz wąski przesmyk łączący miasto z lądem, czyniąc osadę jednym z najlepiej ufortyfikowanych portów zachodniego wybrzeża Morza Czarnego."
 MA_walls_mesembria: "$building_type_MA_walls_mesembria$"
 
 #Sri Pada
 MA_sri_pada_district: "$building_type_MA_sri_pada$"
 MA_sri_pada_district_desc: "$building_type_MA_sri_pada_desc$"
 building_type_MA_sri_pada: "Góra Malaja"
 building_type_MA_sri_pada_desc: "Stromy granitowy szczyt Malaja, wyróżniający się ponad lasami Lanki, dominuje nad okolicznym krajobrazem. Na jego wierzchołku stoi małe sanktuarium otaczające [Glossary('Sri Padę','MA_sripada_glossary')], przyciągające niekończący się pochód pielgrzymów, którzy wspinają się krętymi ścieżkami, by modlić się ponad chmurami."
 MA_sri_pada: "$building_type_MA_sri_pada$"
 MA_sripada_glossary: "Słowo syngaleskie oznaczające \"święty ślad stopy\", który według tradycji sam Budda pozostawił na tej górze."
 
 #Palace of Palermo
 MA_palace_palermo1_district: "$building_type_MA_palace_palermo1$"
 MA_palace_palermo1_district_desc: "$building_type_MA_palace_palermo1_desc$"
 building_type_MA_palace_palermo1: "Pałac w Palermo"
 building_type_MA_palace_palermo1_desc: "Pałace i wille Palermo słyną z ogrodów, sadów i zacienionych dziedzińców. Ich jasne mury i przestronne sale zachowują pamięć o licznych władcach miasta, których mecenat połączył tradycje artystyczne świata śródziemnomorskiego w siedzibie bogactwa i wyrafinowania."
 MA_palace_palermo1: "Wille Palermo"
 MA_palace_palermo2: "$building_type_MA_palace_palermo1$"
 MA_palace_balarm1: "Wille Balarmu"
 MA_palace_panormus1: "Wille Panormosu"
 MA_palace_balarm2: "Pałac Balarmu"
 MA_palace_panormus2: "Pałac Panormosu"
 MA_cassaro_glossary: "Najgłębiej położony rdzeń Palermo, starożytna dzielnica fenicka i grecka, ufortyfikowana ze wszystkich stron. Jej nazwa wywodzi się z łacińskiego słowa oznaczającego zamek, #italic Castrum#!, później przekształconego pod wpływem arabskiego #italic al Qasr#!."
 
 #Cefalù Duomo
 MA_cefalu_duomo_district: "$building_type_MA_cefalu_duomo$"
 MA_cefalu_duomo_district_desc: "$building_type_MA_cefalu_duomo_desc$"
 building_type_MA_cefalu_duomo: "Duomo w Cefalù"
 building_type_MA_cefalu_duomo_desc: "Górujące nad wapiennymi urwiskami Cefalù to [Glossary('duomo','MA_duomo_glossary')] łączy masywne formy architektury normańskiej z bizantyjskimi i islamskimi zdobieniami. Potężne bliźniacze wieże flankują szeroką zachodnią fasadę, a przestronne wnętrze zwieńcza wielka lśniąca złotem mozaika ponad sanktuarium, głosząca zarówno królewski autorytet, jak i boski majestat."
 MA_cefalu_duomo: "$building_type_MA_cefalu_duomo$"
 MA_duomo_glossary: "Pochodzące od łacińskiego #italic domus#!, czyli \"domu\" Boga, duomo jest głównym kościołem włoskiego miasta. Często błędnie tłumaczy się je jako \"katedrę\", choć w rzeczywistości nie musi być siedzibą biskupa, by nosić ten tytuł."
 
 #Athenaion of Syracuse
 MA_athenaion_district: "$building_type_MA_athenaion$"
 MA_athenaion_district_desc: "$building_type_MA_athenaion_desc$"
 building_type_MA_athenaion: "Atenajon w Syrakuzach"
 building_type_MA_athenaion_desc: "Ten kościół, wzniesiony wewnątrz starożytnej świątyni Ateny, zachował znaczną część dawnej budowli. Wewnętrzne ściany świątyni otwarto, tworząc szeroką nawę, podczas gdy wielkie doryckie kolumny i mury zewnętrzne pozostały dobrze widoczne, obejmując jeden z najwspanialszych zabytków klasycznej przeszłości Sycylii."
 MA_athenaion: "$building_type_MA_athenaion$"
 
 #Cave of the Patriarchs
 MA_cave_patriarchs1_district: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs1_district_desc: "$building_type_MA_cave_patriarchs1_desc$"
 building_type_MA_cave_patriarchs1: "Grota Patriarchów"
 building_type_MA_cave_patriarchs1_desc: "Nad grotą, w której według wierzeń spoczywają Abraham, Izaak, Jakub i ich rodziny, wznosi się wielkie herodiańskie założenie z precyzyjnie ciosanego wapienia. W obrębie mocnych murów świątynie i miejsca modlitwy świadczą o pobożności żydów, chrześcijan i muzułmanów, przyciągając pielgrzymów do świętych grobów poniżej."
 MA_cave_patriarchs1: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs2: "Sanktuarium Patriarchów"
 MA_must_be_abrahamic: "[holder|E] musi należeć do $rf_abrahamic$ [religious_family|E]"
 
 #Łysa Góra
 MA_lysa_gora1_district: "$building_type_MA_lysa_gora1$"
 MA_lysa_gora1_district_desc: "$building_type_MA_lysa_gora1_desc$"
 building_type_MA_lysa_gora1: "Łysa Góra"
 building_type_MA_lysa_gora1_desc: "Ponad zalesionymi zboczami Łysej Góry rozciąga się starożytny święty szczyt, otoczony wielkim pierścieniem kamiennych wałów oddzielających doczesny świat ludzi od uświęconej ziemi po drugiej stronie. Modlitwy i ofiary niosą tu nadzieje tych, którzy wspinają się na górę, a jej uroczyste wyżyny budzą cześć mimo przemijania władców i wyznań."
 MA_lysa_gora1: "Łysa Góra"
 MA_lysa_gora2: "Klasztor Świętego Krzyża"

 #Dome of the Rock
 MA_templum_domini: "Templum Domini"
 
 #Mainz Cathedral
 MA_mainz_cathedral1_district: "$building_type_MA_mainz_cathedral1$"
 MA_mainz_cathedral1_district_desc: "$building_type_MA_mainz_cathedral1_desc$"
 building_type_MA_mainz_cathedral1: "Siedziba arcybiskupia w Moguncji"
 building_type_MA_mainz_cathedral1_desc: "W sercu Moguncji wielka katedra oraz otaczające ją sale, kaplice i dziedzińce stanowią siedzibę potężnego arcybiskupa. Tutaj przyjmuje się posłów i rozstrzyga sprawy ziem, podczas gdy dzwony wzywają wiernych na modlitwę. Kamienne mury głoszą bogactwo i autorytet pana, którego władza sięga daleko poza ołtarz."
 MA_mainz_cathedral1: "Dzielnica Biskupia"
 MA_mainz_cathedral2: "Katedra w Moguncji"
 
 #Ingelheim Palace
 MA_ingelheim_palace_district: "$building_type_MA_ingelheim_palace$"
 MA_ingelheim_palace_district_desc: "$building_type_MA_ingelheim_palace_desc$"
 building_type_MA_ingelheim_palace: "Pałac w Ingelheim"
 building_type_MA_ingelheim_palace_desc: "Spośród wielu rezydencji i pałaców wzniesionych przez królów Franków niewiele może równać się rozmiarem i historią z Ingelheim. Pałac zbudowany w pobliżu Renu ma niezwykły półkolisty plan, obejmujący zarówno [Glossary('Aulę Regię','MA_aula_regia_glossary')], jak i otaczające ją budynki administracyjne, mieszkalne oraz sakralne. Eleganckie arkady i wiejskie otoczenie przywodzą licznym gościom na myśl starożytną rzymską willę."
 MA_ingelheim_palace: "$building_type_MA_ingelheim_palace$"
 MA_aula_regia_glossary: "Wielka sala audiencyjna i tronowa pałaców cesarskich, wzorowana na podobnych salach dawnego Rzymu. Zazwyczaj rozległa, podłużna, jednonawowa hala zakończona z jednej strony apsydą."

