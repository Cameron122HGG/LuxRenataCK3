 # building_type_MA_prague_castle1_desc: "Upon the long ridge above the Vltava, the halls, churches and courtyards of Prague Castle command the city below. Craftsmen, retainers and clergy gather around this seat of the rulers of Bohemia, whose wealth and ambition have made the hill the political and sacred heart of their lands."
 # MA_prague_castle1: "Princely Seat of Prague"
 # --- MA_prague_castle2 (b_praha, MA 1)
 # MA_prague_castle2: "Royal Castle of Prague"
 # --- MA_peel_castle1 (b_castletown, MA 1)
 # building_type_MA_peel_castle1: "Saint Patrick's Island"
 # building_type_MA_peel_castle1_desc: "Upon the rocky isle of Saint Patrick, churches, halls and burial grounds look out over the surrounding sea. Here older local traditions and the faith of new settlers meet side by side, while clergy and rulers share a narrow refuge whose sheltered shores bind worship and worldly power together."
 # MA_peel_castle1: "Saint Patrick’s Isle Monastery"
 # --- MA_peel_castle2 (b_castletown, MA 1)
 # MA_peel_castle2: "Saint Patrick's Hall"
 # --- MA_peel_castle3 (b_castletown, MA 1)
 # MA_peel_castle3: "Peel Castle"
 # --- MA_amaravati_stupa (b_amaravati, MA 1)
 # building_type_MA_amaravati_stupa: "Amaravati Stupa"
 # building_type_MA_amaravati_stupa_desc: "A great, ancient [Glossary('stupa','MA_stupa_glossary')] clad in white limestone panels, the greatest in Dravidian India. Colourful narrative reliefs are carved into the brickwork, depicting the life of the Buddha and scenes of devotion within medallions and friezes, while gateways mark the cardinal approaches, organizing ritual movement around the sacred mound."
 # --- MA_karla_caves (b_thana, MA 70)
 # building_type_MA_karla_caves: "Karla Caves"
 # building_type_MA_karla_caves_desc: "Cut directly into the hillside, the Karla Caves form a complex of rock-hewn [Glossary('viharas','MA_vihara')] and shrines centered around a great chaitya hall. This vast space is defined by a high vaulted ceiling with carved ribs, a long nave lined with colonnades, and a [Glossary('stupa','MA_stupa_glossary')] set at the apsidal end. The entrance façade is articulated with a large horseshoe arch and sculpted reliefs, marking the transition from the outer world into the ordered interior of ritual movement and devotion."
 # --- MA_devagiri (b_devagiri, MA 1)
 # building_type_MA_devagiri: "Devagiri"
 # building_type_MA_devagiri_desc: "A great volcanic hill rises abruptly from the plains, its dark basalt slopes cut by narrow paths that wind toward the summit. Known as [Glossary('Devagiri','MA_devagiri_glossary')], the mountain shelters ancient caves and shrines, while its commanding heights offer a formidable refuge to those who hold it."
 # --- MA_orange_theater1 (b_orange, MA 20)
 building_type_MA_orange_theater1: "Theatrum of Aurenia"
 building_type_MA_orange_theater1_desc: "Aside from the cement foundations and the brick structure, not much of the theatre remains, since most of it has been overtaken by the housing of the people of Aurenia. Once a place of celebration, tragedies and comedies penned by the best playwrights in the Ancient World, vulgar farces of the basest kind, debates and speeches of any sort, now its high walls and strong structure have become the walls of a mighty citadel that guards the lower reaches of the Rhodanus river."
 MA_orange_theater1: "$building_type_MA_orange_theater1$"
 # --- MA_walls_mesembria (b_mesembria, MA 400)
 # building_type_MA_walls_mesembria: "Walls of Mesembria"
 # building_type_MA_walls_mesembria_desc: "The walls that encircle the rocky peninsula have a long history, built upon Greek foundations and great efforts by Roman and Byzantine emperors. The massive stone curtains, projecting towers, and strongly defended gates protect the harbor and the narrow isthmus linking the city to the mainland, making the settlement one of the strongest fortified ports on the western Black Sea."
 # --- MA_sri_pada (b_gimhathiththa, MA 1)
 # building_type_MA_sri_pada: "Mount Malaya"
 # building_type_MA_sri_pada_desc: "A prominent figure over the forests of Lanka, the steep granite peak of Malaya dominates the surrounding landscape. Upon its summit stands a small shrine built around the [Glossary('Sri Pada','MA_sripada_glossary')], drawing an endless procession of pilgrims who climb its winding paths to offer prayers above the clouds."
 # --- MA_palace_palermo1 (b_palermo, MA 1)
 # building_type_MA_palace_palermo1: "Palace of Palermo"
 # building_type_MA_palace_palermo1_desc: "The palaces and villas of Palermo are renowned for their gardens, orchards and shaded courtyards. Their bright walls and spacious halls hold the memory of the city's many rulers, whose patronage has brought together the artistic traditions of the Mediterranean in a seat of wealth and refinement."
 # MA_palace_palermo1: "Villas of Palermo"
 # --- MA_cave_patriarchs1 (b_hebron, MA 1)
 # building_type_MA_cave_patriarchs1: "Cave of the Patriarchs"
 # building_type_MA_cave_patriarchs1_desc: "Above the cave where Abraham, Isaac, Jacob, and their families are believed to rest rises the great Herodian enclosure of finely dressed limestone. Within its sturdy walls, temples and places of prayer mark the devotion of Jews, Christians, and Muslims alike, drawing pilgrims to the sacred tombs beneath."
 # --- MA_cave_patriarchs2 (b_hebron, MA 1)
 # MA_cave_patriarchs2: "Sanctuary of the Patriarchs"
 # --- MA_lysa_gora1 (b_kielce, MA 1)
 # building_type_MA_lysa_gora1: "Łysa Góra"
 # building_type_MA_lysa_gora1_desc: "Above the forested slopes of Łysa Góra lies an ancient sacred summit, encircled by a great ring of stone ramparts separating the profane world of men from the holy ground beyond. Here prayers and offerings carry the hopes of those who climb the mountain, whose solemn heights inspire reverence through the passing of rulers and faiths."
 # MA_lysa_gora1: "Bald Mountain"
 # --- MA_lysa_gora2 (b_kielce, MA 1)
 # MA_lysa_gora2: "Holy Cross Monastery"

