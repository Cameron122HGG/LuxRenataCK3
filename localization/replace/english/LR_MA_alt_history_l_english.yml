 # --- MA_rock_cashel (b_limerick, MA 1100)
 # building_type_MA_rock_cashel: "Rock of Cashel"
 # building_type_MA_rock_cashel_desc: "Constructed over a rocky hill and surrounded by green pastures, the Rock is an impregnable stone fortress surrounded by many walls and capable of serving both as a castle and a palace. It also contains one of the most influential monasteries in Ireland, and has a Palatine Chapel whose vault is decorated by beautiful frescoes depicting the life of St Patrick."
 # --- MA_st_donatus (b_zadar, MA 867)
 building_type_MA_st_donatus: "Temple of the Trinity of Helios Basileus"
 building_type_MA_st_donatus_desc: "Raised to the divine light that binds the worlds together, this temple has three magnificent gilded domes, one larger than the other, dedicated to the Trinitarian Sun taught by the Emperor Julian. Above all stands the supreme Monad, source of Good, in the last and biggest dome, with the smallest eye, signifying that not much can be known of the Ineffable One; from it proceeds Helios Basileus, sovereign and mediator of the divine forces, in the middle dome, where a colossal bronze statue of Helios enthroned rules bathed in sunlight; and from Him shines through the veil of the intellegible the visible Sun, his radiant image in the world of flesh, which many in the city identify with Christ, Solis Filius, who came to Earth and was sacrificed and rose again, one with the Sun again. A single chain of light binds the three worlds, a light that is the absolute manifestation of Good and Truth."
 # --- MA_jokhang (b_lhasa, MA 867)
 # building_type_MA_jokhang: "Jokhang Temple"
 # building_type_MA_jokhang_desc: "The most ancient and mystical temple in the whole of Tibet, a majestic assemble of courtyards and shrines in the very heart of the Land of the Gods."
 # --- MA_dongola_hall (b_old_dongola, MA 867)
 # building_type_MA_dongola_hall: "Dongola Throne Hall"
 # building_type_MA_dongola_hall_desc: "A great palace constructed atop a rocky hill with a complete view of the surrounding plain and the Nile. \nIts use is ceremonial, to impress the envoys and travelers that, through a monumental staircase decorated by splendid frescoes painted by Nubian and Greek artists, are lead to the majestic throne hall of the upper floor."
 # --- MA_hildesheim_cathedral (b_hildesheim, MA 1033)
 # building_type_MA_hildesheim_cathedral: "Saint Michael of Hildesheim"
 # building_type_MA_hildesheim_cathedral_desc: "This basilica was constructed to show the might and prestige of its Roman king, with a painted wooden ceiling and round arches giving it a grandiose, imperial appearance. Labourers and masters from the Rhine and Italy participated in its construction, and it holds a set of doors and a massive column both worked in bronze and carefully decorated with reliefs."
 # --- MA_toulouse_basilica (b_toulouse, MA 1119)
 # building_type_MA_toulouse_basilica: "Toulouse Basilica"
 # building_type_MA_toulouse_basilica_desc: "A grandiose basilica, one of the largest cathedrals north of the Alps. It is made of bricks, a material abundant in the local area, and is a truly Romanesque building, inspired by the ancient Roman ruins of Southern France and decorated with lombard bands, round arches and spolia columns."
 # --- MA_durham_cathedral (b_durham, MA 1133)
 # building_type_MA_durham_cathedral: "Durham Cathedral"
 # building_type_MA_durham_cathedral_desc: "The grand cathedral of Durham towers high over the river Wear's marshy peninsula, where legends say two milk maids discovered the immovable tomb of saint Cuthbert. Its ribbed vault, planned by artisans from both sides of the Channel, is a masterful feat of engineering, without precedence in England, and was built above the woodlands and riverbanks of the town using stone cut from the cliffs below."
 # --- MA_castel_monte (b_trani, MA 1250)
 # building_type_MA_castel_monte: "Castel del Monte"
 # building_type_MA_castel_monte_desc: "An elegant hunting lodge atop a gentle Apulian hill. \nIt has a unique design with an octagonal plan and octagonal towers at each corner, a mixture of Classical and Gothic architecture. \nIts sombre, geometrical exterior is in stark contrast to the lavishly furnished interior of tapestries, rugs, paintings and capitals."
 # --- MA_belfort (b_bruges, MA 1280)
 # building_type_MA_belfort: "Belfry of Bruges"
 # building_type_MA_belfort_desc: "The stunning Gothic belfry soaring over the marketplace of Bruges, dictating life for the entire city. It is an enormous tower covered in spires and statues and has been constructed out of brick and stone with a rectangular plan rising into an octagonal upper stage, where the bells are held."
 # --- MA_strasbourg_cathedral1 (b_strassburg, MA 1066)
 # building_type_MA_strasbourg_cathedral1: "Strasbourg Cathedral"
 # building_type_MA_strasbourg_cathedral1_desc: "Inspired by the great churches of West and East Francia, the cathedral of Strasbourg owes its grandeur to the wealth of the townsfolk and the patronage of their lord. Built out of pinkish sandstone, its walls shine in the late day sun, looming over the narrow square and its timber houses, while bronze bells chant their melody to the winds."
 # MA_strasbourg_cathedral1: "Strasbourg Cathedral"
 # --- MA_koutoubia (b_marrakesh, MA 1158)
 # building_type_MA_koutoubia: "Koutoubia Mosque"
 # building_type_MA_koutoubia_desc: "An exemplary masterpiece of Moorish architecture, the minaret of this mosque is a source of inspiration for builders all over the Islamic world."
 # --- MA_parigoritissa (b_arta, MA 1290)
 # building_type_MA_parigoritissa: "Panagia of Parigoritissa"
 # building_type_MA_parigoritissa_desc: "The plan of this church, dedicated to the Most Holy Mary, is inspired by Classical ideas of symmetry and geometric completeness. An almost perfect square, centred around an octagonal dome supported by piers and surrounded by a minor chapel on each of the four angles."
 # --- MA_santillana (b_santiallana, MA 1130)
 building_type_MA_santillana: "Palace of Reccared"
 building_type_MA_santillana_desc: "The abandoned palace of Reccared languises among the fading town of Reccopolis, its arcades and halls long emptied of the splendour of the splendid court of King Reccared. A small community of monks now inhabits a few surviving chambers, tending the chapel and the library, but disregarding the overgrown courtyards and the great halls of revelry built for happier times."
 # --- MA_palace_naranco (b_oviedo, MA 848)
 building_type_MA_palace_naranco: "Palat dau Rey"
 building_type_MA_palace_naranco_desc: "Raised upon the foundations of an ancient Roman castrum, the Palat dau Rey combines the massive stonework of the old imperial fortress with the chapels and wooden chambers of a Christian royal court. Ever since Leione became a seat of kings, successive generations of monarchs have enriched the halls and chambers with whatever they could buy and pilfer; Roman masonry, Eastern fabrics, Islamic silverwork and mosaics, gold leaf; a veritable mixture of styles and artists coexist in the famously tolerant Court of old Legio."
 # --- MA_burgos_cathedral (b_burgos, MA 1300)
 # building_type_MA_burgos_cathedral: "Burgos Cathedral"
 # building_type_MA_burgos_cathedral_desc: "Constructed by artisans from both sides of the Pyrenees, this magnificent cathedral is one of the foremost examples of this new, modern style of church-building. \nIts towers rise far into the sky, and its cavernous chapels and corridors guide pilgrims from one relic to another, covered in offerings and gold and overseen by the alterous sight of the many sculpted saints."
 # --- MA_bahla_fort (b_bahla, MA 1300)
 # building_type_MA_bahla_fort: "Bahla Fort"
 # building_type_MA_bahla_fort_desc: "This immense mudbrick castle has been constructed to protect the precious Bahla oasis, from atop the heights of the approaching highlands. \nIts intricate walls shield from enemies and the scorching heat a series of irrigation systems and a magnificent plantation of dates palm trees, sure to grant great prestige to its protector."
 # --- MA_alturaif (b_dariya, MA 1400)
 # building_type_MA_alturaif: "Al-Turaif Palace"
 # building_type_MA_alturaif_desc: "Built through generations in one of the most unhospitable places in Creation, this palace is a symbol of determination and piety. \nSurrounded by a long set of walls, tall mudbrick palaces and an irrigated garden offer refuge from even the most scorching heat, and work as an important supply depot for its holder."
 # --- MA_school_preslav (b_preslav, MA 893)
 # building_type_MA_school_preslav: "School of Preslav"
 # building_type_MA_school_preslav_desc: "Supported by a stable stream of donations, the monastic scriptoria and palatial halls of Preslav labor tirelessly to translate manuscripts and produce new knowledge. The scent of ink and parchment permeates the air, and frescoes of saints and patrons adorn the walls. The school's influence is felt far beyond its stone halls, and it has become a beacon of Roman liturgy and thought for the region."
 # --- MA_madara_rider (b_dorostorum, MA 700)
 # building_type_MA_madara_rider: "Madara Rider"
 # building_type_MA_madara_rider_desc: "Carved deep into the cold, eternal embrace of a vertical cliff, this ancient relief depicts a horseman triumphing over a lion. The rider, spear in hand, seems to leap out from the stone itself, forever victorious. Below, inscriptions tell of glorious deeds, achieved in the grazing, infinite steppe, before the people of this land had ever settled west."
 # --- MA_boyana_church (b_sredets, MA 1000)
 # building_type_MA_boyana_church: "Boyana Church"
 # building_type_MA_boyana_church_desc: "This humble church might seem unassuming at first glance, secluded in a rural town lost between golden fields, its simple brickwork blending with the surrounding landscape. \nYet within its modest exterior lies a treasure beyond compare, hidden from the eyes of the world, the heart of the temple is adorned with frescoes of breathtaking beauty, each brushstroke a testament to divine inspiration. The blue, red, golden hues blend together and the saints dance with the flaking of the candles' flames, in the most mystical of spectacles."
 # --- MA_studenica (b_novotrgoviste, MA 1190)
 # building_type_MA_studenica: "Studenica Monastery"
 # building_type_MA_studenica_desc: "The most magnificent of the monuments of Serbia, and a beacon of faith and tranquility to the locals, this monastery lies tucked away in a secluded valley. \nIts walls show traces of the traditions of both the Latin west and the Greek east, the white slabs of marble carved with expert hand and the imposing dome sitting atop a bright red drum are testaments to the skill and piety of the monastery's patrons."
 # --- MA_church_nativity (b_ar-ramla, MA 565)
 # building_type_MA_church_nativity: "Church of the Nativity"
 # building_type_MA_church_nativity_desc: "First commissioned by the saintly mother of Constantine and then rebuilt under orders of Justinian, this temple celebrates one of the holiest sites of Christianity, the place of the nativity of Christ. \nThe church is a long basilica of five naves, with a triumphal entrance and decorated by golden mosaics and ancient Roman columns of colorful marbles. It houses several holy relics and works of art, which have - legends claim - saved her from multiple invasions before."
 # --- MA_lejre_hall (b_roskilde, MA 650)
 # building_type_MA_lejre_hall: "Great Hleiðr Hall"
 # building_type_MA_lejre_hall_desc: "A grandiose mead hall constructed by kings of old with tall trees and magnificent sculptures. \nSagas are sure to be inspired by the tales of the great heroes and kings who dined and fought in this hall."
 # --- MA_duomo_brescia (b_brescia, MA 1100)
 # building_type_MA_duomo_brescia: "Brescia Duomo"
 # building_type_MA_duomo_brescia_desc: "A rotunda of stone in the heart of the #italic Cittanuova#!, the new centre of power of Brescia west of the ancient Roman core. Its thick walls and simple Romanesque design were inspired by tales of Jerusalem, while within its dimly lit interior, frescoes and relics tell of centuries of devotion and power."
 # --- MA_maschio (b_napoli, MA 1282)
 # building_type_MA_maschio: "Maschio"
 # building_type_MA_maschio_desc: "A massive castle of stone and volcanic tuff rising over the glimmering bay of Naples, its battlements and imposing round towers ruling both land and sea with an iron fist. \nA great system of cells and dungeons burrow deep into the rock, some as old as the ancient Greeks. $MA_warning_palermo_napoli$"
 # --- MA_st_nicholas (b_bari, MA 1178)
 # building_type_MA_st_nicholas: "Basilica of Saint Nicholas"
 # building_type_MA_st_nicholas_desc: "A bulky Romanesque basilica built of solid local stone, a glimmering white color striking over the wine-blue sea. Within its walls, the relics of Saint Nicholas attract pilgrims and great riches from all over Christendom, daring them to cross into the Holy Land."
 # --- MA_palace_arechis (b_benevento, MA 780)
 # building_type_MA_palace_arechis: "Palace of Arechis"
 # building_type_MA_palace_arechis_desc: "A vast palatial complex of buildings carved into the ancient Roman city of Beneventum, protected by a circle of walls and a quadrangular tower. Built by the first Prince of the Lombards, it has become a symbol of this people's defiance and stubborn independence."
 # --- MA_saccargia_basilica (b_sassari, MA 1116)
 # building_type_MA_saccargia_basilica: "Basilica of Saccargia"
 # building_type_MA_saccargia_basilica_desc: "A striking black-and-white stone basilica rising from a dry, weather-beaten coast of Sardinia, its striped tower visible for miles from the sea. Craftsmen from Italy were brought to aid in the construction, and their stylistic influence is profound."
 # --- MA_tower_pisa (b_pisa, MA 1300)
 # building_type_MA_tower_pisa: "Tower of Pisa"
 # building_type_MA_tower_pisa_desc: "The elegant #italic campanile#! of the proud city of Pisa, whose elegant arches and shimmering white stone have become known all over Christendom and beyond. Since its construction the ground beneath it has shown to often shift, causing it to increasingly lean."
 # --- MA_rock_canossa (b_canossa, MA 940)
 # building_type_MA_rock_canossa: "Rock of Canossa"
 # building_type_MA_rock_canossa_desc: "This formidable castle was constructed atop a steep, rocky crag as the center of an impressive system of fortifications to guard the Appenine passes. From this isolated stronghold, its lords watch over the valleys below, secure in their refuge of stone and sky."
 # --- MA_clonmacnoise (b_athlone, MA 867)
 # building_type_MA_clonmacnoise: "Clonmacnoise"
 # building_type_MA_clonmacnoise_desc: "A great monastery founded on the banks of the broad River Shannon, its stone church and tall round tower rising solemn amid the windswept plains. With time it has become one of the most important centers of learning of the island, drawing scholars and pilgrims from far and wide."
 # --- MA_white_stupa (b_kara_khoja, MA 867)
 # building_type_MA_white_stupa: "White Stupa of Gaochang"
 # building_type_MA_white_stupa_desc: "Commissioned by the imperial authorities to mark the reach of the Middle Kingdom, this gleaming [Glossary('stupa','MA_stupa_glossary')] rises alone above the scorched sands of the desert. Its design draws heavily from Tibetan and Indian temples with its great, rounded white dome and gilded spire, but also incorporates traditional Chinese elements such as its wooden foundation."
 # --- MA_karabalgasun (b_karabalgasun, MA 847)
 # building_type_MA_karabalgasun: "Black Ruins"
 # building_type_MA_karabalgasun_desc: "Shattered earthen walls and broken columns are all that remain of the once-mighty palace that sat at the heart of one of the greatest empires of the steppe. Wind howls through the empty courtyards and carved stones lie half-buried in grass and dust, but travelers still pass through, and call them the #italic Karabalgasun#!, the Black Ruins."
 # --- MA_ordu (b_itil, MA 750)
 # building_type_MA_ordu: "City of the Army"
 # building_type_MA_ordu_desc: "A great city of merchants, courtiers and horses is found at the crossroad of the routes of Europe and Asia. \nProtected by earthen walls and surrounded by a wide moat, one can found many tents and temples strewn along a colonnaded avenue, leading to the gilded tent of the great lord of the Steppe that rules from such a seat."
 # --- MA_sarkel (b_sarkel, MA 833)
 # building_type_MA_sarkel: "White Fortress"
 # building_type_MA_sarkel_desc: "A grand stronghold made of white limestone-and-brick, #italic Sark-el#! – the White Fortress – was built on the left bank of the Don River when the Khagan solicited from the Roman emperor engineers to reinforce his realm's northern border. Now it commands the strategic portage between the Don and Volga, exerting military might far into the northern lands and protecting the important trade routes that flow through the region."
 # --- MA_nilometer (b_hulwan-cairo, MA 715)
 # building_type_MA_nilometer: "Nilometer"
 # building_type_MA_nilometer_desc: "A narrow stone chamber built along the muddy riverbank to better measure the rise and fall of the Nile and help plan crops. It was commissioned by the new islamic rulers to continue an ancient custom of the land, binding flood and fortune to the order of the state."
 # --- MA_knossos_ruins (b_iraklio, MA 867)
 # building_type_MA_knossos_ruins: "Palace of Knossos"
 # building_type_MA_knossos_ruins_desc: "Overlooking the splendid sea, the ancient palace of Knossos holds the memory of kings and myths of old. Its great halls, columns and frescoes tell of a distant age of wealth and power, enchanting travelers and inspiring those who would claim a place among the mighty rulers of Crete."
 # MA_knossos_ruins: "Ruins of Knossos"
 # --- MA_gagikashen (b_ani, MA 1001)
 # building_type_MA_gagikashen: "Gagikashen"
 # building_type_MA_gagikashen_desc: "A large circular church dedicated to Saint Gregory, towering over the high ground of Ani. Its builders were inspired by the ruined forms of Zvart'nots Cathedral. Its tall drum rises in three steps over rings of columns and side chapels, surrounding a central space of great harmony and clarity."
 # --- MA_saint_gall (b_sankt_gallen, MA 750)
 # building_type_MA_saint_gall: "Saint Gall"
 # building_type_MA_saint_gall_desc: "A major monastic complex founded on the site of Saint Gallus' hermitage, at the edge of the Alemannic lands. Known for its discipline and organization, it houses a #italic scriptorium#! and library of exceptional quality, where monks copy, translate, and preserve classical and sacred texts for the use of scholars across Christendom."
 # --- MA_se_lisbon (b_lisboa, MA 1147)
 # building_type_MA_se_lisbon: "Sé of Lisbon"
 # building_type_MA_se_lisbon_desc: "A heavy Romanesque cathedral built on the slopes above the harbor, its thick walls and narrow windows a reflection of the troubled times of this Iberian struggle. Raised after the Christian reconquest of the city, it stands atop the ruins of an old mosque, with relics of Saint Vincent housed within its stone vaults, welcoming processions along its echoing nave."
 # --- MA_guadalquivir_fortifications (b_sevilla, MA 1221)
 # building_type_MA_guadalquivir_fortifications: "Fortifications on the Guadalquivir"
 # building_type_MA_guadalquivir_fortifications_desc: "Stretching along the banks of the Guadalquivir, fortifications guard the bustling port of Seville with towers and gates at every turn. Most striking is the Torre del Oro, a twelve-sided watchtower clad in a golden-hued limewash that gleams over the waters of the river, both a beacon for approaching ships and a warning of the city's strength."
 # --- MA_madinat_alzahra (b_cantillana, MA 9999)
 # building_type_MA_madinat_alzahra: "Madinat al-Zahra"
 # building_type_MA_madinat_alzahra_desc: "A vast palace-city built near the gentle foothills of the Córdoba countryside, raised to display the splendor of the Caliph's court. Its gardens, pavilions, and reception halls are laid out across broad terraces, with walls of marble and jasper carved in fine detail, its beauty and splendor inspiring poets to write of the finest pleasures of life."
 # --- MA_cologne_cathedral1 (b_cologne, MA 550)
 # building_type_MA_cologne_cathedral1: "Cologne Cathedral"
 # building_type_MA_cologne_cathedral1_desc: "The great church of Cologne, seat of its archbishop and a symbol of the city's pride. Expanded and built upon over centuries, it holds relics of untold value, drawing pilgrims from far and wide, while its mighty walls triumph over the roofs of the city."
 # MA_cologne_cathedral1: "Old Cathedral of Cologne"
 # --- MA_cologne_cathedral2 (b_cologne, MA 550)
 # MA_cologne_cathedral2: "Twin Spires of Cologne"
 # --- MA_sigiriya1 (b_polonnaruwa, MA 495)
 # building_type_MA_sigiriya1: "Sigiriya"
 # building_type_MA_sigiriya1_desc: "A mighty, lonely rock rises from the deep jungle, its summit the seat of the ancient royal citadel of [Glossary('Sigiriya','MA_sigiriya_glossary')]. Stairways climb past frescoed walls and the colossal Lion Gate, above terraced gardens and pools, bearing witness to the ambition of the kings who made their home in the sky."
 # MA_sigiriya1: "Ruins of Sigiriya"
 # --- MA_sigiriya2 (b_polonnaruwa, MA 495)
 # MA_sigiriya2: "Restored Sigiriya"
 # --- MA_ghazni_palace (b_ghazna, MA 867)
 # building_type_MA_ghazni_palace: "Ghaznavid Palace"
 # building_type_MA_ghazni_palace_desc: "Set outside the walls of Ghazni, this royal residence serves as the center of power of the sultan of the city. Its halls, radiating from the quadrangular #italic iwan#! courtyard, are expertly carved and richly adorned with stucco and polychrome tiles, inspired by the artistry of Persia."
 # --- MA_mahdia_mosque (b_mahdiya, MA 920)
 # building_type_MA_mahdia_mosque: "Great Mosque of Mahdia"
