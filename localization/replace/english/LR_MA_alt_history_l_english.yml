 # building_type_MA_martand_sun_temple: "Martand Sun Temple"
 # building_type_MA_martand_sun_temple_desc: "Raised upon a high plateau in the Vale of Kashmir, the temple is one of the most ancient to be devoted to the Sun divine. Its great sanctum lies at its center, and is surrounded by a multitude of smaller shrines and rows of carvings of deities and celestial figures. The peristyle courtyard contains a peaceful pool, beaming in the sunlight."
 # --- MA_winchester_minster (b_winchester, MA 600)
