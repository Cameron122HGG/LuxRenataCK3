 # building_type_MA_winchester_minster_desc: "The great Minster is a vast basilica of stone and timber, with a broad painted nave and multiple bell towers. It dominates the royal city, much larger than any of its other constructions, and acts as guardian of the Wessex royal tombs."
 # --- MA_westminster_abbey (b_brentford, MA 1250)
 # building_type_MA_westminster_abbey: "Westminster Abbey"
 # building_type_MA_westminster_abbey_desc: "Built beside the Thames and richly endowed by the kings of England, Westminster Abbey is a great monastic church of stone, its long nave and soaring choir adorned with sculpted capitals and painted walls. Here kings are crowned and laid to rest, and the abbey serves as a sacred stage where royal authority and divine favor are bound together."
 # --- MA_lorsch_gate (b_kreusnach, MA 867)
 # building_type_MA_lorsch_gate: "Lorsch Gate"
 # building_type_MA_lorsch_gate_desc: "The monumental gatehouse of Lorsch Abbey is a rare and carefully constructed example of Carolingian architecture. Built of finely cut stone and brick, its symmetrical facade is articulated by engaged columns, blind arches, and classical ornament echoing ancient Roman models."
 # --- MA_dover_castle (b_dover, MA 1191)
 # building_type_MA_dover_castle: "Dover Castle"
 # building_type_MA_dover_castle_desc: "Set upon the white cliffs that overlook the narrow channel, the fortress commands the principal gateway between England and the continent. Its massive stone keep, curtain walls, and layered gatehouses form a formidable defensive complex, controlling the harbor and the roads inland while serving as a royal stronghold and residence."
 # --- MA_chateau_gaillard (b_rouen, MA 1198)
 # building_type_MA_chateau_gaillard: "Château Gaillard"
 # building_type_MA_chateau_gaillard_desc: "Constructed atop a limestone spur above the Seine, Château Gaillard is a compact and sophisticated stone fortress designed for active defense. Its concentric walls, angled towers, and forward-facing gateworks minimize blind spots and concentrate fire along the approaches. Built with speed and precision, it embodies the latest principles available of military architecture, securing control of the river and the frontier of Normandy."
 # --- MA_reims_cathedral (b_reims, MA 1250)
 # building_type_MA_reims_cathedral: "Reims Cathedral"
 # building_type_MA_reims_cathedral_desc: "A vast Gothic cathedral defined by its tall nave, slender clustered piers, and extensive use of ribbed vaulting and flying buttresses. Its west front is richly articulated with sculpted portals and deep archivolts, while the interior is enclosed by walls of stained glass that emphasize height, light, and ceremonial grandeur, befitting its central role in the royal coronations of France."
 # --- MA_chartres_cathedral (b_chartres, MA 1220)
 # building_type_MA_chartres_cathedral: "Chartres Cathedral"
 # building_type_MA_chartres_cathedral_desc: "One of the most elegant and ordered examples of High Gothic ambition, Chartres is distinguished by its broad nave, strong piers, and deep choir. Its walls are largely dissolved into stained glass set within a robust skeletal framework, while the twin towers and carefully proportioned elevations express stability, clarity, and theological intent."
 # --- MA_avignon_palace1 (b_avignon, MA 1250)
 # building_type_MA_avignon_palace1: "Palace of Avignon"
 # building_type_MA_avignon_palace1_desc: "Rising on a rocky outcrop above the Rhône, this great palace-fortress is the seat of a refined and powerful court. Its halls, towers and vaulted chapels are strong and elegant in their lines, while envoys, artisans and merchants crowd the streets below, drawn by the wealth and authority of its rulers."
 # MA_avignon_palace1: "Old Palace"
 # --- MA_avignon_palace2 (b_avignon, MA 1250)
 # MA_avignon_palace2: "New Palace"
 # --- MA_iron_gate (b_antiocheia, MA 550)
 # building_type_MA_iron_gate: "Iron Gate"
 # building_type_MA_iron_gate_desc: "Guarding the mountain pass that links the Orontes plain to the mountain range high above, the Iron Gate forms one of the most critical entrances into Antioch. Here the walls narrow into a fortified defile of stone towers, gates, and retaining walls anchored directly into the rock. The citadel also works as a sort of dam, controlling the torrent of the Parmenios to protect the city."
 # --- MA_ypres_cloth_hall (b_ypres, MA 1230)
 # building_type_MA_ypres_cloth_hall: "Ypres Cloth Hall"
 # building_type_MA_ypres_cloth_hall_desc: "This vast civic hall of stone and timber is constructed to house the regulation, storage, and trade of woolen cloth that sustains the wealth of the city. Its long, orderly façade is articulated by arcades, gables, and a commanding belfry, combining mercantile function with urban authority. Within its vaulted halls, merchants, guild officials, and magistrates oversee contracts, measures, and taxes at the heart of the city’s economy."
 # --- MA_gravensteen (b_gent, MA 1180)
 # building_type_MA_gravensteen: "Gravensteen"
 # building_type_MA_gravensteen_desc: "This imposing stone castle serves as the seat of the counts of Flanders and a symbol of comital authority over the city. Centered on a massive donjon and enclosed by thick curtain walls, it combines residential halls with judicial chambers and military defenses, asserting lordly power amid the dense urban fabric of Ghent."
 # --- MA_szekesfehervar_basilica1 (b_szekesfehervar, MA 1030)
 # building_type_MA_szekesfehervar_basilica1: "Basilica of Székesfehérvár"
 # building_type_MA_szekesfehervar_basilica1_desc: "This great stone basilica serves as the ceremonial and dynastic heart of the Hungarian realm. Within its broad nave, kings are crowned and laid to rest, binding kingship, law and faith beneath the vaults of the foremost royal sanctuary of the kingdom."
 # MA_szekesfehervar_basilica1: "Royal Basilica of Székesfehérvár"
 # --- MA_szekesfehervar_basilica2 (b_szekesfehervar, MA 1030)
 # MA_szekesfehervar_basilica2: "Great Choir of Székesfehérvár"
 # --- MA_zalavar_basilica (b_somogyvar, MA 850)
 # building_type_MA_zalavar_basilica: "Saint Adrian's Basilica"
 # building_type_MA_zalavar_basilica_desc: "Center of a Carolingian fortified settlement within the marshlands of the Zala, Saint Adrian’s Basilica is a major ecclesiastical foundation of the early Christianization of the region. Built as a three-aisled stone church with a pronounced sanctuary and western structures, it serves as both a missionary center and princely church, used to enhance the diplomatic reach of its protector over the borderland regions."
 # --- MA_baths_hisham (b_amman, MA 9999)
 # building_type_MA_baths_hisham: "Baths of Hisham"
 # building_type_MA_baths_hisham_desc: "Part of a larger palace complex, these baths are laid out in a sequence of cold, warm, and hot chambers, supplied by a hypocaust system and vaulted in stone. Their floors are richly covered in geometric and figural mosaics, most notably the great pavement of trees and animals, executed with fine tesserae and careful composition."
 # --- MA_knin_fortress (b_knin, MA 1000)
 # building_type_MA_knin_fortress: "Knin Fortress"
 # building_type_MA_knin_fortress_desc: "Extended along a narrow limestone ridge above the Krka valley, the fortress of Knin forms a long, segmented defensive complex of walls, towers, and enclosed courts. Its position controls the routes between the coast and the inland plains, establishing it as a principal royal stronghold in the region."
 # --- MA_somnath_temple (b_somnath, MA 997)
 # building_type_MA_somnath_temple: "Somnath Temple"
 # building_type_MA_somnath_temple_desc: "A major stone temple dedicated to the Moon God, Somnath is organized along a longitudinal axis of [Glossary('mandapas','MA_mandapa')] leading to a sanctum crowned by a soaring [Glossary('shikhara','MA_vimana_glossary')]. Its walls and pillars are richly carved with sculptures of deities, attendants, and ornamental bands. As a prominent pilgrimage center, it draws devotees from across the region, but also jealous eyes from heathen armies across the Indus."
 # --- MA_adina_mosque (b_ramavati, MA 1373)
 # building_type_MA_adina_mosque: "Adina Mosque"
 # building_type_MA_adina_mosque_desc: "A vast [Glossary('hypostyle','MA_hypostyle_glossary')] mosque of brick and stone, the Adina is organized around a great rectangular courtyard surrounded by arcades and rows of domed bays. Its prayer hall is covered by a monumental barrel vaulting, recalling imperial forms of Persia. Carved stone [Glossary('spolia','MA_spolia_glossary')] and terracotta flowers adorn the outer walls."
 # --- MA_chittorgarh (b_chitrakut, MA 1300)
 # building_type_MA_chittorgarh: "Chittorgarh"
 # building_type_MA_chittorgarh_desc: "Occupying the summit of a long, isolated hill, the fort of Chittor is one of the largest martial monuments in India. Massive walls follow the edge of the plateau for miles, enclosing palaces, temples and towers within a self-contained citadel."
 # --- MA_lingaraj_temple (b_bhubaneswar, MA 1090)
 # building_type_MA_lingaraj_temple: "Lingaraj Temple"
 # building_type_MA_lingaraj_temple_desc: "One of the greatest examples of temple architecture in India, the Lingaraj complex is organized along a single axis of increasingly sacred spaces leading toward the towering curvilinear [Glossary('vimana','MA_vimana_glossary')] of Shiva. Every surface is enriched with sculpted deities, floral ornament, and narrative reliefs."
 # --- MA_tsarevgrad1 (b_turnovo, MA 867)
 # building_type_MA_tsarevgrad1: "Tsarevgrad"
 # building_type_MA_tsarevgrad1_desc: "The craggy heights above the Yantra command the approaches through the surrounding valleys. Upon these hills, walls, towers and temples form a stronghold whose natural defenses and lofty halls offer a worthy seat to the rulers of the land."
 # MA_tsarevgrad1: "Old Fort of Turnovo"
 # --- MA_cefalu_duomo (b_cefalu, MA 1131)
 # building_type_MA_cefalu_duomo: "Cefalù Duomo"
 # building_type_MA_cefalu_duomo_desc: "Towering over the limestone cliffs of Cefalù, this [Glossary('Duomo','MA_duomo_glossary')] combines the robust forms of Norman architecture with Byzantine and Islamic decorations. Its massive twin towers flank a broad west front, while the spacious interior culminates in a great mosaic above the sanctuary, of shimmering gold, proclaiming both royal authority and divine majesty."
 # --- MA_athenaion (b_syracusa, MA 700)
 # building_type_MA_athenaion: "Athenaion of Syracuse"
 # building_type_MA_athenaion_desc: "Built within the ancient Temple of Athena, this church preserves much of the original ancient structure. The inner walls of the temple have been opened to create a broad nave, while the great Doric columns and outer walls remain clearly visible, enclosing one of the finest monuments of Sicily's classical past."
 # --- MA_mainz_cathedral1 (b_mainz, MA 867)
 # building_type_MA_mainz_cathedral1: "Archiepiscopal Seat of Mainz"
 # building_type_MA_mainz_cathedral1_desc: "At the heart of Mainz, the great cathedral and the halls, chapels and courtyards surrounding it form the seat of its powerful archbishop. Here envoys are received and the affairs of the land settled, while the bells call the faithful to prayer. Its stone walls proclaim the wealth and authority of a lord whose power reaches far beyond the altar."
 # MA_mainz_cathedral1: "Episcopal Quarter"
 # --- MA_mainz_cathedral2 (b_mainz, MA 867)
 # MA_mainz_cathedral2: "Dom of Mainz"
 # --- MA_ingelheim_palace (b_boppard, MA 750)
 # building_type_MA_ingelheim_palace: "Ingelheim Palace"
 # building_type_MA_ingelheim_palace_desc: "Of the many residences and palaces built by the Frankish kings, very few can rival the size and history of Ingelheim. The palace, constructed near the Rhine, follows an unusual semicircular design, enclosing both the [Glossary('Aula Regia','MA_aula_regia_glossary')] and its satellite administrative, residential and religious buildings. In its elegant arches and countryside setting, it reminds its many visitors of an ancient Roman villa."
 # --- MA_worms_jewish_quarter (b_worms, MA 867)
 # building_type_MA_worms_jewish_quarter: "Jewish Quarter of Worms"
 # building_type_MA_worms_jewish_quarter_desc: "One of the most important Jewish communities of the Rhineland, the narrow street is lined with houses, workshops, and a synagogue of finely dressed stone. Together with Mainz and Speyer, the city is a renowned center of Jewish scholarship, contributing to the development of Ashkenazi religious and intellectual traditions all across Europe."

