l_english:
 # Character window header: rulers with a realm name get "of the <realm>" (LR_character_view_name, user 11-19)
 CHARACTER_VIEW_NAME: "[Character.Custom('LR_character_view_name')], "
 CHARACTER_VIEW_NAME_TT: "[Character.Custom('LR_character_view_name')]"
 # Character tooltip header, the same way (user, 11-19)
 CHARACTER_TT_NAME_AGE: "[Character.Custom('LR_character_view_name')]#medium , [Character.GetAge]#!"
 CHARACTER_TT_NAME: "[Character.Custom('LR_character_view_name')]"
 # 11-25 (user: "the is missing from the tooltips"): realm names with their article; the ruler line as the character header
 TITLE_NAME_NO_TOOLTIP: "[Title.Custom('LR_realm_title_name')|U]"
 MAP_REALM_TT_HEADER: "#T [TITLE.Custom('LR_realm_title_name')|U]#!"
 MAP_REALM_TT_BOTTOM: "Ruler: [CHARACTER.Custom('LR_character_view_name')|UV]"
