 fp2_struggle_secure_iberian_foothold_kingdom_border_tt: "This [title|E] borders a held [de_jure|E] [kingdom|E] in a [empire|E] you [hold|E] which is not [GetTitleByKey('e_spain').GetNameNoTier]"
 game_concept_buy_claim_desc: "An Interaction that allows a character to buy [unpressed_claims|E] in exchange for [piety|E].\n\n$EFFECT_LIST_BULLET$A [vassal|E] may not buy a claim on any [liege|E]'s [title|E], and a Liege may not buy a claim on any Vassal's Title\n$EFFECT_LIST_BULLET$A [king|E] or [emperor|E] may not buy claims on Kingdom Titles, and Great Kings may not buy claims on other Great Kingdoms\n$EFFECT_LIST_BULLET$No one may buy a claim on their [head_of_faith|E]"
 game_concept_eastern_roman_empire_desc: "A [empire|E] [title|E] that can be created by the holder of the Roman Empire.\n\nThe title is created by taking the #EMP $split_roman_empire_decision$#! [decision|E]."
 game_concept_excommunicated_recovery_absolution_PAM: "$EFFECT_LIST_BULLET$Dukes and below (local excommunication): #high $declaration_of_repentance_interaction$#! with a valid cleric #weak (your [head_of_faith|E] if no lesser cleric outranks you)#!\n$EFFECT_LIST_BULLET$All [rulers|E] excommunicated by your [head_of_faith|E], or ruling a kingdom, great kingdom or empire: petition your [head_of_faith|E] in person and choose #high $petition_head_of_faith_decision_option_repentance$#!\n$EFFECT_LIST_BULLET$Winning an [excommunication_war|E] as the defender\n$EFFECT_LIST_BULLET$Converting to another [faith|E]\n\n"
 game_concept_mongol_empire_desc: "A [empire|E] [title|E] that can be created by a powerful tribal ruler on the Steppes. It enables the [mongol_invasion_casus_belli|E].\n\nThe title is created by taking the #EMP $become_greatest_of_khans_decision$#! [decision|E]."
 game_concept_rightful_liege_desc_part1: "The $game_concept_rightful_liege$ of a [vassal|E] is the [ruler|E] who holds the direct [de_jure|E] [liege|E] [title|E] of the $game_concept_vassal$'s [primary_title|E]. If a $game_concept_vassal$ is not under their $game_concept_rightful_liege$, they will contribute less [taxes|E] and [levies|E] as well as suffer an [opinion|E] penalty towards their $game_concept_liege$. Holding a higher-[title_tier|E] $game_concept_title$ of the same $game_concept_de_jure$ results in lessened penalties.\n\nAn exception to this is [dukes|E] that are part of a [empire|E]'s $game_concept_de_jure$ hierarchy and directly vassalized to their $game_concept_emperor$, which still contribute fully, exactly as if the $game_concept_emperor$ held their $game_concept_de_jure$ [kingdom|E] $game_concept_title$."
 game_concept_title_desc: "A $game_concept_title$ is what distinguishes a Ruler from a non-Ruler.\n\nMost Titles are landed:\nThe smallest unit of land on the map is the [barony|E]. Baronies are organized into larger areas called [counties|E]. Counties [de_jure|E] belong to a [duchy|E], duchies to a [kingdom|E] and Kingdoms to a [empire|E]. In some cases, Great Kingdoms even belong to [hegemonies|E].\n\nDuchies, Kingdoms, Great Kingdoms and Empires do not always have a [holder|E], but are Titles that can be [created|E] by a ruler who controls enough of the corresponding territory.\n\nTitles that exist without any corresponding land are referred to as [landless_titles|E]. Certain other Titles may also be subject to a [lease|E]."
 legalistic_yurt_01_unlock: "Unlocked by holding a [empire|E] [title|E]"
 lesson_basics_de_jure_titles_desc: "Most [titles|E] belong in a pyramid-like hierarchy, according to their $game_concept_title$ [title_tier|E]:\n\n[barony|E] — ruled by a Baron or Baroness\n[county|E] — ruled by a Count or Countess\n[duchy|E] — ruled by a Duke or Duchess\n[kingdom|E] — ruled by a King or Queen\n[empire|E] — ruled by a Great King or Great Queen\n[hegemony|E] — ruled by an Emperor or Empress\n\nEvery $game_concept_title$ is legally part of a $game_concept_title$ one $game_concept_title_tier$ up the chain, for example each $game_concept_county$ is thus part of a $game_concept_duchy$.\n\n#TUT Note: There are many dynamic names for these Titles — your current [ruler|E] is in charge of a "Petty Kingdom" which corresponds to the [duchy|E] Tier.#!"
 neighbor_is_hegemony: "[ROOT.Char.GetShortUIName|U] [CharAreIs(ROOT.Char)] an [independent|E] [ruler|E] neighboring an [hegemony|E]"
 offer_vassalization_interaction_aibehavior_hegemony_tt: "[actor.GetShortUIName|U] [CharAreIs(actor)] an [hegemony|E] [title_tier|E] [ruler|E]: $VALUE|=+0$"
 overrunning_gain_titular_empire_tt: "You gain a [empire|E]-[title_tier|E] [titular_title|E]"
 ra_merit_candidacy_merit_desc: "Each [character|E] has a [merit_level|E]. The better the $game_concept_merit_level$, the higher [title_tier|E] [provinces|E] they can rule as [governor|E].\n\nAs your $game_concept_merit_level$ increases, more influential appointments become available:\n$BULLET_WITH_TAB$#V 9th to 8th#!: $game_concept_governor$ of a $county_celestial_chinese_vassal$ #weak (a [county|E] Title)#!\n$BULLET_WITH_TAB$#V 7th to 6th#!: $game_concept_governor$ of a $duchy_celestial_chinese_vassal$ #weak (a [duchy|E] Title)#!\n$BULLET_WITH_TAB$#V 5th to 4th#!: $game_concept_governor$ of a $kingdom_celestial_chinese_vassal$ #weak (a [kingdom|E] Title)#!\n$BULLET_WITH_TAB$#V 3rd to 1st#!: [minister|E] for the [son_of_heaven|E] #weak (a [empire|E] Title)#!\n\n$game_concept_characters$ without a $game_concept_merit_level$ cannot become $game_concept_governor$."
 reactive_advice_vassal_limit_desc: "No one can manage a horde of Counts — aspiring conquerors need to rely on higher-tier [vassals|E], such as Dukes, to manage their land for them!\n\nYou can see your current Vassal Limit in the Domain view.\n\n#TUT Much like with your domain limit, you do not want to exceed your [vassal_limit|E]. To avoid this penalty, you should consolidate your vassals.\n\nThe best way to do this is by granting [duchies|E] to your vassals, this will make them rule a larger area so that you don't have to! Though for this to work you must yourself hold a [kingdom|E] or a [empire|E], do not make the mistake of giving away one of your [primary_titles|E]!\n\nIf you find yourself exceeding the Vassal Limit as a Duke, we suggest that you form a Kingdom as soon as you can.#!"
 roman_restoration.1211.c.tt: "You must have a [empire|E] tier primary [title|E] that is not [GetTitleByKey('e_italy').GetNameNoTier] or [GetTitleByKey('e_maghreb').GetNameNoTier]."
