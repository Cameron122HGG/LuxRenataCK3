 catalyst_hof_bestowed_title_clergy_major_desc: "A prelate bestowes a [empire|E] to the [clergy|E]"
 catalyst_hof_bestowed_title_major_desc: "A prelate single-handedly bestowes a [empire|E] upon a secular [ruler|E]"
