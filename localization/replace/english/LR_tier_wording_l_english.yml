 action_excommunicated_recovery_desc: "You are [excommunicated|E]. The [GetModifier('recent_excommunication').GetNameWithTooltip] [modifier|E] blocks absolution for one year after excommunication.\n\n$EFFECT_LIST_BULLET$Dukes and below (local excommunication): use #high Make Declaration of Repentance#! with a valid cleric #weak (your [head_of_faith|E] if no lesser cleric outranks you)#!\n$EFFECT_LIST_BULLET$All [rulers|E] excommunicated by your [head_of_faith|E], or ruling a kingdom, great kingdom or empire: petition in person and choose #high Lift Excommunication#![AddLocalizationIf( GetPlayer.IsIndependentRuler, 'action_excommunicated_recovery_independent_help' )]\n\nSee [Concept( 'excommunicated_recovery', 'recovery options' )|E] for full details."
 action_excommunicated_recovery_no_cleric_toast_desc: "No cleric in range can hear your declaration of repentance right now. If your [head_of_faith|E] excommunicated you, or you rule a kingdom, great kingdom or empire, petition in person instead."
