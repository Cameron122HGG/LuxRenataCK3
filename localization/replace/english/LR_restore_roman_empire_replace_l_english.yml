l_english:
 # Restore the Roman Empire, reworked for Lux Renata 2026-11-06 (replaces vanilla's Byzantine-only text)
 restore_roman_empire_decision_desc:0 "Twice the Empire has risen from its ashes, once in the West and once in the East, yet each half still rules alone. If Rome and Constantinople stand within one realm and the dioceses of both halves answer to a single Augustus, the two hegemonies can be joined again as one Roman Empire."
 restore_roman_empire_decision_tooltip:0 "The Roman Empire will be restored, East and West as one"
