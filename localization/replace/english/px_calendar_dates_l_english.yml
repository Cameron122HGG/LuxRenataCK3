l_english:
 # Generated by 'Paradox: Generate Calendar Localization' from the px.calendar
 # setting. Edit px.calendar and regenerate instead of editing by hand.
 # Overrides of the engine's date-format keys: same formats as vanilla, with
 # the raw $YEAR$ routed through PX_CAL_YEAR/PX_CAL_ERA.
 GAME_DATE_STRING:0 "$DAY$ $MONTH$, $PX_CAL_YEAR$ $PX_CAL_ERA$"
 GAME_DATE_STRING_SHORT:0 "$DAY$ $MONTH_SHORT$ $PX_CAL_YEAR$ $PX_CAL_ERA$"
 GAME_DATE_STRING_LONG:0 "$DAY|O$ of $MONTH$, $PX_CAL_YEAR$ $PX_CAL_ERA$"
