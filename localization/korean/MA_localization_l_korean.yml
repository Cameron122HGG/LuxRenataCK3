 building_type_MA_baalbek: "유피테르 신전"
 building_type_MA_baalbek_desc: "바알베크의 주요 신전은 한때 비옥한 계곡 위로 솟아오른 세계 최대 규모의 신전 가운데 하나였다. \n그 후 수많은 습격과 포위로 거대한 신전이 파괴되고 기둥들이 부서지거나 먼 도시로 옮겨졌지만, 폐허는 여전히 세계 곳곳의 여행자들을 매료시킨다."
 MA_baalbek: "$building_type_MA_baalbek$"
 
 #Leptis Magna
