 building_type_MA_qutb_complex1: "쿠트브 유적 단지"
 building_type_MA_qutb_complex1_desc: "델리 중심에는 오래된 성역이 있다. 통치자들은 이곳에 기념물과 사원을 세워 자신의 신앙과 권력을 선포했다. 조각된 기둥과 안뜰이 굽타 왕조의 거대한 철기둥을 둘러싸고 있으며, 어두운 기둥은 왕조와 신들이 바뀌는 세월에도 굳건히 서 있다."
