 MA_leptis_magna_district_desc: "$building_type_MA_leptis_magna_desc$"
 building_type_MA_leptis_magna: "렙티스 마그나"
 building_type_MA_leptis_magna_desc: "트리폴리타니아의 보석이라 불리는 렙티스 마그나는 고대 황제들이 세운 도시다. \n무자비한 태양이 정오의 하늘 한가운데에 이르면 신전과 시장, 극장 폐허에 드리운 그림자가 사라지고, 사람들은 시간이 멈춘 땅에서 길을 잃은 듯한 기분에 사로잡힌다."
 MA_leptis_magna: "$building_type_MA_leptis_magna$"
 
