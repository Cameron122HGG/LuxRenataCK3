 MA_alhambra1: "붉은 요새"
 
 #The Cologne Cathedral
 MA_cologne_cathedral1_district: "$building_type_MA_cologne_cathedral1$"
 MA_cologne_cathedral1_district_desc: "$building_type_MA_cologne_cathedral1_desc$"
 building_type_MA_cologne_cathedral1: "쾰른 대성당"
 building_type_MA_cologne_cathedral1_desc: "쾰른의 대교구장이 머무는 거대한 성당이자 도시의 자부심을 상징하는 건물이다. 수세기에 걸쳐 확장되고 증축된 이곳에는 헤아릴 수 없이 귀중한 성유물들이 보관되어 먼 곳의 순례자들까지 불러모으며, 강력한 석벽은 도시의 지붕 위로 우뚝 솟는다."
 MA_cologne_cathedral1: "쾰른 구대성당"
 MA_cologne_cathedral2: "쾰른의 쌍둥이 첨탑"
 
 #Qutb Complex
 MA_qutb_complex1_district: "$building_type_MA_qutb_complex1$"
