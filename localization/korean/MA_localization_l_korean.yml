 MA_boyana_church_district_desc: "$building_type_MA_boyana_church_desc$"
 building_type_MA_boyana_church: "보야나 교회"
 building_type_MA_boyana_church_desc: "황금빛 들판에 둘러싸인 외딴 시골 마을에 자리한 이 소박한 교회는 언뜻 보기에 평범해 보인다. 단순한 벽돌 구조가 주변 풍경에 자연스럽게 녹아든다. \n그러나 수수한 외관 안에는 세상 사람들의 눈에 감춰진 비할 데 없는 보물이 있다. 성당 내부는 신의 영감을 증언하듯 붓질 하나하나가 숨 막히게 아름다운 프레스코화로 장식되어 있다. 푸른빛과 붉은빛, 황금빛이 뒤섞이고 촛불이 흔들릴 때마다 성인들이 춤추는 듯한 신비로운 광경이 펼쳐진다."
 MA_boyana_church: "$building_type_MA_boyana_church$"
 
 #Belogradchik Fortress
 MA_belogradchik_fort_district: "$building_type_MA_belogradchik_fort$"
 MA_belogradchik_fort_district_desc: "$building_type_MA_belogradchik_fort_desc$"
 building_type_MA_belogradchik_fort: "벨로그라드치크 요새"
 building_type_MA_belogradchik_fort_desc: "우뚝 솟은 기암괴석 사이에 자리한 이 요새는 마치 땅에서 스스로 솟아난 듯하고, 성벽은 산의 차가운 붉은 암석에서 자연스레 자라난 것처럼 보인다. 우아한 굴뚝 같은 바위 기둥들이 세 방향에서 요새를 둘러싸 사실상 난공불락으로 만든다. \n주민들은 인근 숲의 거인이 맨손으로 바위들을 높이 쌓았다는 이야기와, 신의 벌로 바위에 삼켜진 수도원에 관한 오래된 전설을 전한다."
 MA_belogradchik_fort: "$building_type_MA_belogradchik_fort$"
 
 #Studenica Monastery
 MA_studenica_district: "$building_type_MA_studenica$"
 MA_studenica_district_desc: "$building_type_MA_studenica_desc$"
 building_type_MA_studenica: "스투데니차 수도원"
 building_type_MA_studenica_desc: "세르비아에서 가장 웅장한 기념물 가운데 하나이며 주민들에게 신앙과 평온의 등불이 되는 이 수도원은 한적한 계곡에 자리한다. \n벽에는 라틴 서방과 그리스 동방 양쪽의 전통이 드러난다. 숙련된 손길로 조각한 하얀 대리석 판과 밝은 붉은색 드럼 위에 올라선 위엄 있는 돔은 수도원 후원자들의 기량과 경건함을 증언한다."
 MA_studenica: "$building_type_MA_studenica$"
 
 #Church of the Nativity
 MA_church_nativity_district: "$building_type_MA_church_nativity$"
 MA_church_nativity_district_desc: "$building_type_MA_church_nativity_desc$"
 building_type_MA_church_nativity: "예수 탄생 교회"
 building_type_MA_church_nativity_desc: "콘스탄티누스의 거룩한 어머니가 처음 건립을 명하고 유스티니아누스의 명으로 재건된 이 성당은 기독교에서 가장 거룩한 장소 가운데 하나인 그리스도의 탄생지를 기념한다. \n교회는 다섯 개의 신랑을 갖춘 긴 바실리카로, 기념비적인 입구와 황금빛 모자이크, 다채로운 대리석으로 만든 고대 로마 기둥으로 장식되어 있다. 여러 성유물과 예술 작품을 품고 있으며, 전설에 따르면 이들이 수차례의 침략에서 교회를 구해 주었다고 한다."
 MA_church_nativity: "$building_type_MA_church_nativity$"
 
 #Great Lejre Hall
 MA_lejre_hall_district: "$building_type_MA_lejre_hall$"
 MA_lejre_hall_district_desc: "$building_type_MA_lejre_hall_desc$"
 building_type_MA_lejre_hall: "흘레이드르 대회당"
 building_type_MA_lejre_hall_desc: "옛 왕들이 거대한 나무와 훌륭한 조각으로 세운 장엄한 벌꿀술 회당이다. \n이곳에서 먹고 싸웠던 위대한 영웅과 왕들의 이야기는 틀림없이 수많은 사가에 영감을 줄 것이다."
 MA_lejre_hall: "$building_type_MA_lejre_hall$"
 
 #Aetna
 MA_aetna_district: "$building_type_MA_aetna$"
 MA_aetna_district_desc: "$building_type_MA_aetna_desc$"
 building_type_MA_aetna: "에트나산"
 building_type_MA_aetna_desc: "고대 세계에서 가장 거대한 화산인 에트나산은 비옥한 시칠리아섬 위로 당당히 솟아오르며, 그 화산재는 주변 토양을 크게 비옥하게 만든다. \n수천 년 동안 신화와 전설이 산의 숨결 속에 스며들었다. 헤파이스토스 신이 지옥 같은 산의 중심부에서 신성한 창조물을 벼렸다는 이야기도 그 가운데 하나다."
 MA_aetna: "$building_type_MA_aetna$"
 
 #Brescia Duomo
 MA_duomo_brescia_district: "$building_type_MA_duomo_brescia$"
 MA_duomo_brescia_district_desc: "$building_type_MA_duomo_brescia_desc$"
 building_type_MA_duomo_brescia: "브레시아 대성당"
 building_type_MA_duomo_brescia_desc: "고대 로마 중심지 서쪽에 들어선 브레시아의 새로운 권력 중심지 #italic 치타누오바#! 한가운데 자리한 석조 원형 성당이다. 두꺼운 벽과 단순한 로마네스크 양식은 예루살렘 이야기에서 영감을 받았으며, 어두운 내부의 프레스코화와 성유물은 수세기에 걸친 신앙과 권력의 역사를 전한다."
 MA_duomo_brescia: "$building_type_MA_duomo_brescia$"
 
 #Maschio
 MA_maschio_district: "$building_type_MA_maschio$"
 MA_maschio_district_desc: "$building_type_MA_maschio_desc$"
 building_type_MA_maschio: "마스키오"
 building_type_MA_maschio_desc: "나폴리의 반짝이는 만 위로 솟아 있는 돌과 화산 응회암으로 지은 거대한 성채로, 흉벽과 위압적인 원형탑이 육지와 바다를 철권으로 지배한다. \n바위 깊숙이 감방과 지하 감옥의 거대한 구조가 뻗어 있으며 일부는 고대 그리스 시대까지 거슬러 올라간다. $MA_warning_palermo_napoli$"
 MA_maschio: "$building_type_MA_maschio$"
 MA_warning_palermo_napoli: "\n\n@alert_icon! #alert_trial 팔레르모의 [GetBuildingType('MA_palace_palermo2').GetName]와 나폴리의 [GetBuildingType('MA_maschio').GetName]를 모두 건설하면 [GetDecisionWithKey('empower_sicilian_parliament_decision').GetName] [decision|E]을 완료할 수 없게 됩니다!#!"
 
 #Basilica of Saint Nicholas
 MA_st_nicholas_district: "$building_type_MA_st_nicholas$"
 MA_st_nicholas_district_desc: "$building_type_MA_st_nicholas_desc$"
 building_type_MA_st_nicholas: "성 니콜라오스 바실리카"
 building_type_MA_st_nicholas_desc: "현지의 단단한 석재로 지은 묵직한 로마네스크 양식 바실리카로, 포도주처럼 푸른 바다 위로 반짝이는 백색이 두드러진다. 이 성당에 보관된 성 니콜라오스의 성유물은 기독교 세계 전역에서 순례자와 막대한 부를 불러들이며, 순례자들은 성지로 건너가고자 한다."
 MA_st_nicholas: "$building_type_MA_st_nicholas$"
 
 #Palace of Arechis
 MA_palace_arechis_district: "$building_type_MA_palace_arechis$"
 MA_palace_arechis_district_desc: "$building_type_MA_palace_arechis_desc$"
 building_type_MA_palace_arechis: "아레키스 궁전"
 building_type_MA_palace_arechis_desc: "고대 로마 도시 베네벤툼의 시가지 안에 세워진 광대한 궁전 단지로, 성벽과 사각형 탑이 이를 보호한다. 롬바르드족의 초대 공작이 건설한 이 궁전은 외세에 굴하지 않는 이 민족의 완강한 독립 정신을 상징하게 되었다."
 MA_palace_arechis: "$building_type_MA_palace_arechis$"
 
 #Basilica of Saccargia
 MA_saccargia_basilica_district: "$building_type_MA_saccargia_basilica$"
 MA_saccargia_basilica_district_desc: "$building_type_MA_saccargia_basilica_desc$"
 building_type_MA_saccargia_basilica: "사카르자 바실리카"
 building_type_MA_saccargia_basilica_desc: "사르데냐의 건조하고 거센 바람이 부는 해안에 검은색과 흰색 돌을 번갈아 쌓은 인상적인 바실리카가 솟아 있으며, 줄무늬 탑은 바다에서 수 마일 떨어진 곳에서도 보인다. 건축을 돕기 위해 이탈리아에서 장인들을 불러왔으며, 그들의 양식적 영향이 깊이 남아 있다."
 MA_saccargia_basilica: "$building_type_MA_saccargia_basilica$"
 
 #Ruins of Paestum
 MA_paestum_district: "$building_type_MA_paestum$"
 MA_paestum_district_desc: "$building_type_MA_paestum_desc$"
 building_type_MA_paestum: "파에스툼 유적"
 building_type_MA_paestum_desc: "한때 번성했던 고대 도시의 유적은 야생 풀과 적막에 둘러싸여 있고, 신전의 거대한 기둥들은 부서지고 쓰러져 있다. 인근 강이 주변을 늪지로 바꾼 뒤 도시는 서서히 버려졌으며, 이제는 병든 듯한 땅에 감히 발을 들이는 사람이 거의 없다."
 MA_paestum: "$building_type_MA_paestum$"
 
 #Tower of Pisa
 MA_tower_pisa_district: "$building_type_MA_tower_pisa$"
 MA_tower_pisa_district_desc: "$building_type_MA_tower_pisa_desc$"
 building_type_MA_tower_pisa: "피사의 탑"
 building_type_MA_tower_pisa_desc: "자랑스러운 피사 도시의 우아한 #italic 종탑#!으로, 아름다운 아치와 빛나는 흰 돌은 기독교 세계를 넘어 널리 알려져 있다. 건설 이후 아래의 지반이 자주 움직이는 것이 드러났고, 탑은 점점 기울어졌다."
 MA_tower_pisa: "$building_type_MA_tower_pisa$"
 
 #Saint Peter's Basilica
 MA_vatican_district: "$building_type_MA_vatican$"
 MA_vatican_district_desc: "$building_type_MA_vatican_desc$"
 building_type_MA_vatican: "성 베드로 대성전"
 building_type_MA_vatican_desc: "콘스탄티누스가 로마에 세우도록 명한 고대 바실리카 중 가장 거룩한 건물로, 교회의 기초가 된 사도의 무덤 위에 솟아 있다. \n이 교회는 웅장하면서도 우아하며, 황금빛 모자이크와 이국적인 대리석으로 꾸민 높은 신랑에는 온 기독교 세계에서 수천 명의 순례자들이 찾아와 부와 권력을 함께 가져온다."
 MA_vatican: "$building_type_MA_vatican$"
 
 #Rock of Canossa
 MA_rock_canossa_district: "$building_type_MA_rock_canossa$"
 MA_rock_canossa_district_desc: "$building_type_MA_rock_canossa_desc$"
 building_type_MA_rock_canossa: "카노사의 바위산"
 building_type_MA_rock_canossa_desc: "아펜니노산맥의 고개를 지키기 위한 거대한 요새 체계의 중심으로, 가파른 바위산 꼭대기에 세워진 강력한 성이다. 이 고립된 거점에서 영주들은 돌과 하늘 사이에 마련된 안전한 피난처에 머무르며 아래 계곡을 굽어본다."
 MA_rock_canossa: "$building_type_MA_rock_canossa$"
 
 #Hill of Tara
 MA_hill_tara_district: "$building_type_MA_hill_tara$"
 MA_hill_tara_district_desc: "$building_type_MA_hill_tara_desc$"
 building_type_MA_hill_tara: "타라 언덕"
 building_type_MA_hill_tara_desc: "둑과 토축으로 보호되고 고대의 조각된 돌에 둘러싸인 풀 덮인 언덕으로, 아일랜드 대왕들의 거룩한 자리다. 성벽은 없지만 땅 자체에 힘이 깃들어 섬 곳곳에서 방문객을 불러들인다."
 MA_hill_tara: "$building_type_MA_hill_tara$"
 
 #Clonmacnoise
 MA_clonmacnoise_district: "$building_type_MA_clonmacnoise$"
 MA_clonmacnoise_district_desc: "$building_type_MA_clonmacnoise_desc$"
 building_type_MA_clonmacnoise: "클론맥노이즈"
 building_type_MA_clonmacnoise_desc: "넓은 섀넌강 기슭에 세워진 큰 수도원으로, 석조 교회와 높은 원형탑이 바람 부는 평원 위로 엄숙히 솟아 있다. 세월이 흐르면서 이곳은 섬에서 가장 중요한 학문의 중심지 가운데 하나로 성장해 먼 곳에서 학자와 순례자들을 끌어들인다."
 MA_clonmacnoise: "$building_type_MA_clonmacnoise$"
 
 #White Stupa of Gaochang
 MA_white_stupa_district: "$building_type_MA_white_stupa$"
 MA_white_stupa_district_desc: "$building_type_MA_white_stupa_desc$"
 building_type_MA_white_stupa: "고창의 백색 스투파"
 building_type_MA_white_stupa_desc: "중원의 세력이 미치는 범위를 나타내기 위해 황실 당국의 명으로 세워진 이 빛나는 [Glossary('스투파','MA_stupa_glossary')]는 작열하는 사막의 모래 위에 홀로 솟아 있다. 크고 둥근 흰 돔과 도금된 첨탑은 티베트와 인도의 사원 건축에서 깊이 영향을 받았으나, 목조 기단과 같은 전통 중국 요소도 결합되어 있다."
 MA_white_stupa: "$building_type_MA_white_stupa$"
 
 #Khan Tengri
 MA_khan_tengri_district: "$building_type_MA_khan_tengri$"
 MA_khan_tengri_district_desc: "$building_type_MA_khan_tengri_desc$"
 building_type_MA_khan_tengri: "칸텡그리"
 building_type_MA_khan_tengri_desc: "초원 사람들이 #italic 하늘의 군주#!라고 부르는 이 거대한 대리석 피라미드는 주변 산맥 위로 완벽한 대칭을 이루며 우뚝 솟아 있다. 사면은 영원한 눈으로 덮여 석양에는 붉게, 새벽에는 금빛으로 빛나며, 맑고 푸른 하늘 아래 땅과 천상을 잇는 신성한 축을 이룬다."
 MA_khan_tengri: "$building_type_MA_khan_tengri$"
 
 #Singing Dunes
 MA_singing_dunes_district: "$building_type_MA_singing_dunes$"
 MA_singing_dunes_district_desc: "$building_type_MA_singing_dunes_desc$"
 building_type_MA_singing_dunes: "노래하는 모래언덕"
 building_type_MA_singing_dunes_desc: "오아시스에서 멀지 않은 황량한 초원에 거대한 초승달 모양의 모래언덕이 솟아 있다. 바람은 대지 자체에서 길고 구슬픈 소리를 끌어낸다. 아시아의 오래된 길을 건너는 유목민들은 멈춰 서서 이 노래를 정령들의 목소리로 믿고 귀를 기울이며, 먼 땅의 시인들도 그 음악에서 영감을 얻는다."
 MA_singing_dunes: "$building_type_MA_singing_dunes$"
 
 #Dakhma of Gurganj
 MA_dakhma_district: "$building_type_MA_dakhma$"
 MA_dakhma_district_desc: "$building_type_MA_dakhma_desc$"
 building_type_MA_dakhma: "구르간즈의 다흐마"
 building_type_MA_dakhma_desc: "거대한 원형 #italic 다흐마#!, 곧 침묵의 탑이 평원 위의 외딴 언덕에 솟아 있다. 한때 조로아스터교도들은 죽은 자들을 정화의 하늘과 태양 아래 내놓는 데 사용했다. 그러나 여름이 지날 때마다 신자들이 줄어들면서 장례 의식은 드물어지고 경비병의 수가 늘었다. 이제 탑의 높이와 형태는 숭배보다 감시에 더 적합하기 때문이다. \n\n#help #game_link 조장#!을 실천하는 [faith|E]이 이 탑을 소유하거나 이곳에 거주할 경우 추가 효과를 얻습니다.#!"
 MA_dakhma: "$building_type_MA_dakhma$"
 
 #Black Ruins
 MA_karabalgasun_district: "$building_type_MA_karabalgasun$"
 MA_karabalgasun_district_desc: "$building_type_MA_karabalgasun_desc$"
 building_type_MA_karabalgasun: "검은 폐허"
 building_type_MA_karabalgasun_desc: "무너진 흙벽과 부서진 기둥은 한때 초원에서 가장 거대한 제국 중 하나의 중심에 서 있던 강력한 궁전의 마지막 흔적이다. 텅 빈 안뜰에는 바람이 울부짖고 조각된 돌들이 풀과 먼지 속에 반쯤 묻혔지만, 여행자들은 여전히 이곳을 지나며 #italic 카라발가순#!, 곧 검은 폐허라고 부른다."
 MA_karabalgasun: "$building_type_MA_karabalgasun$"
 
 #City of the Army
 MA_ordu_district: "$building_type_MA_ordu$"
 MA_ordu_district_desc: "$building_type_MA_ordu_desc$"
 building_type_MA_ordu: "군대의 도시"
 building_type_MA_ordu_desc: "유럽과 아시아를 잇는 길의 교차점에 상인과 신하, 말들로 가득한 거대한 도시가 있다. \n흙벽으로 보호받고 넓은 해자로 둘러싸인 이곳에는 열주가 늘어선 대로를 따라 수많은 천막과 사원이 펼쳐져 있으며, 길은 이 자리에서 통치하는 초원의 대영주가 머무는 황금빛 천막으로 이어진다."
 MA_ordu: "$building_type_MA_ordu$"
 
 #Kurgan of the Rider
 MA_kurgan_district: "$building_type_MA_kurgan$"
 MA_kurgan_district_desc: "$building_type_MA_kurgan_desc$"
 building_type_MA_kurgan: "기마인의 쿠르간"
 building_type_MA_kurgan_desc: "주민들은 오래전 이 땅을 누비던 위대한 기마인이 있었으며 그의 영혼은 여전히 초원을 달린다고 이야기한다. \n거대한 흙무덤인 그의 쿠르간은 그가 묻힌 장소로 전해지고, 영토의 경계를 표시하는 돌의 원이 이를 둘러싸고 있다. 이름을 기억하는 사람은 갈수록 적어지지만 쿠르간은 여전히 바람과 세월을 견디며 서 있다."
 MA_kurgan: "$building_type_MA_kurgan$"
 
 #Cliffs of Ustyurt
 MA_ustyurt_cliffs_district: "$building_type_MA_ustyurt_cliffs$"
 MA_ustyurt_cliffs_district_desc: "$building_type_MA_ustyurt_cliffs_desc$"
 building_type_MA_ustyurt_cliffs: "우스튜르트 절벽"
 building_type_MA_ustyurt_cliffs_desc: "풍화로 형성된 절벽들이 황량한 고원과 내해의 해안 사이의 경계를 이루며, 협곡과 동굴이 곳곳을 가로지르고 파고든다. 땅은 척박하고 물이 없어 사냥꾼들은 적응해야 했고, 야생 무리를 좁은 통로로 몰아넣는 돌덫인 #italic 아란#!을 만들었다. 그리하여 절벽은 조용한 죽음의 무대로 변했다."
 MA_ustyurt_cliffs: "$building_type_MA_ustyurt_cliffs$"
 
 #White Fortress
 MA_sarkel_district: "$building_type_MA_sarkel$"
 MA_sarkel_district_desc: "$building_type_MA_sarkel_desc$"
 building_type_MA_sarkel: "백색 요새"
 building_type_MA_sarkel_desc: "흰 석회암과 벽돌로 지은 장대한 요새 #italic 사르켈#!, 곧 백색 요새는 카간이 로마 황제에게 북쪽 국경을 강화할 기술자를 요청하면서 돈강 왼쪽 기슭에 건설되었다. 이제 이곳은 돈강과 볼가강 사이의 전략적 육상 운송로를 장악하여 북쪽 땅 깊숙이 군사력을 투사하고, 지역을 지나는 중요한 무역로를 보호한다."
 MA_sarkel: "$building_type_MA_sarkel$"
 
 #Nilometer
 MA_nilometer_district: "$building_type_MA_nilometer$"
 MA_nilometer_district_desc: "$building_type_MA_nilometer_desc$"
 building_type_MA_nilometer: "나일로미터"
 building_type_MA_nilometer_desc: "나일강의 수위 상승과 하강을 더 정확히 측정하고 농사를 계획할 수 있도록 진흙투성이 강둑에 좁은 석실을 세웠다. 새로운 이슬람 통치자들이 이 땅의 오랜 관습을 이어가기 위해 건설을 명했으며, 범람과 풍요를 국가의 질서와 연결한다."
 MA_nilometer: "$building_type_MA_nilometer$"
 
 #Abu Simbel
 MA_abu_simbel_district: "$building_type_MA_abu_simbel$"
 MA_abu_simbel_district_desc: "$building_type_MA_abu_simbel_desc$"
 building_type_MA_abu_simbel: "아부 심벨"
 building_type_MA_abu_simbel_desc: "수많은 세대 전 고대 파라오들이 조각한 거대한 석상들이 바위투성이 모래언덕에서 모습을 드러낸다. 그 규모는 지금도 세계 어디에서도 견줄 수 없다. \n평범한 여행자든 위대한 왕이든, 그 장엄함을 목격한 사람이라면 누구나 석상들이 전하는 이야기에서 영감을 얻는다."
 MA_abu_simbel: "$building_type_MA_abu_simbel$"
 
 #Red and White Monasteries
 MA_red_white_monasteries_district: "$building_type_MA_red_white_monasteries$"
 MA_red_white_monasteries_district_desc: "$building_type_MA_red_white_monasteries_desc$"
 building_type_MA_red_white_monasteries: "적색 수도원과 백색 수도원"
 building_type_MA_red_white_monasteries_desc: "나일강 기슭 인근에 자리한 두 고대 콥트 수도원이다. 벽을 쌓은 돌의 선명한 색채에서 이름이 유래했는데, 하나는 흙처럼 짙은 붉은색이고 다른 하나는 희고 빛난다. 외딴곳에 있지만 잊히지 않은 이 수도원들은 오래된 성가가 울려 퍼지는 예배당과 빛바랜 프레스코화로 장식된 벽 사이에서 학문과 신앙의 기독교 전통을 지킨다. 이는 무슬림 통치자들이 시나이의 사막과 바위를 건너 이 땅을 정복하기 전부터 이어져 온 전통이다."
 MA_red_white_monasteries: "$building_type_MA_red_white_monasteries$"
 
 #Knossos
 MA_knossos_ruins_district: "$building_type_MA_knossos_ruins$"
 MA_knossos_ruins_district_desc: "$building_type_MA_knossos_ruins_desc$"
 building_type_MA_knossos_ruins: "크노소스 궁전"
 building_type_MA_knossos_ruins_desc: "아름다운 바다가 내려다보이는 크노소스의 고대 궁전은 옛 왕들과 신화에 대한 기억을 간직하고 있다. 거대한 회당과 기둥, 프레스코화는 먼 옛날의 부와 권력을 전하며 여행자들을 매혹하고 크레타의 강력한 통치자들 가운데 이름을 올리려는 자들에게 영감을 준다."
 MA_knossos_ruins: "크노소스 유적"
 MA_knossos: "$building_type_MA_knossos_ruins$"
 
 #Skara Brae
 MA_skara_brae_district: "$building_type_MA_skara_brae$"
 MA_skara_brae_district_desc: "$building_type_MA_skara_brae_desc$"
 building_type_MA_skara_brae: "스카라 브레이"
 building_type_MA_skara_brae_desc: "바람이 몰아치는 해안의 풀 덮인 언덕에서 고개를 내민 이 고대 석조 주거지들은 땅속에 반쯤 묻혀 있다. \n매서운 바닷바람에 씻기며 낮고 풍화된 벽과 헤아릴 수 없이 오랜 세월 식어 버린 화덕을 간직한 채 고요히 버틴다. 그 안에는 오래전에 사라진 삶의 기억이 여전히 메아리친다."
 MA_skara_brae: "$building_type_MA_skara_brae$"
 
 #Whitehorse Hill
 MA_whitehorse_hill_district: "$building_type_MA_whitehorse_hill$"
 MA_whitehorse_hill_district_desc: "$building_type_MA_whitehorse_hill_desc$"
 building_type_MA_whitehorse_hill: "백마 언덕"
 building_type_MA_whitehorse_hill_desc: "#flavor 애빈턴 마을 근처에는 수말의 형상이 새겨진 산이 있는데, 그 모습은 희다. 그 위에는 아무것도 자라지 않는다.#!"
 MA_whitehorse_hill: "$building_type_MA_whitehorse_hill$"
 
 #Gagikashen
 MA_gagikashen_district: "$building_type_MA_gagikashen$"
 MA_gagikashen_district_desc: "$building_type_MA_gagikashen_desc$"
 building_type_MA_gagikashen: "가기카셴"
 building_type_MA_gagikashen_desc: "아니의 높은 지대에 솟아 있는 성 그레고리오에게 봉헌된 거대한 원형 교회다. 건축가들은 폐허가 된 즈바르트노츠 대성당의 모습에서 영감을 얻었다. 높은 드럼은 기둥과 측면 예배당이 이루는 고리 위로 세 단을 이루며 솟아 있고, 조화롭고 명료한 중앙 공간을 감싼다."
 MA_gagikashen: "$building_type_MA_gagikashen$"
 
 #Saint Gall
 MA_saint_gall_district: "$building_type_MA_saint_gall$"
 MA_saint_gall_district_desc: "$building_type_MA_saint_gall_desc$"
 building_type_MA_saint_gall: "장크트갈렌 수도원"
 building_type_MA_saint_gall_desc: "알레만니족 땅의 가장자리에 있던 성 갈루스의 은둔처에 세워진 대규모 수도원 단지다. 엄격한 규율과 질서로 유명하며, 탁월한 수준의 #italic 필사실#!과 도서관에서 수도사들이 기독교 세계 전역의 학자들을 위해 고전과 성전을 필사하고 번역하며 보존한다."
 MA_saint_gall: "$building_type_MA_saint_gall$"
 
 #Sé of Lisbon
 MA_se_lisbon_district: "$building_type_MA_se_lisbon$"
 MA_se_lisbon_district_desc: "$building_type_MA_se_lisbon_desc$"
 building_type_MA_se_lisbon: "리스본 대성당"
 building_type_MA_se_lisbon_desc: "항구 위 비탈에 세워진 묵직한 로마네스크 대성당으로, 두꺼운 벽과 좁은 창문은 이베리아에서 벌어지는 투쟁의 험난한 시대를 반영한다. 기독교 세력이 도시를 재정복한 뒤 옛 모스크 폐허 위에 건설되었으며, 석조 궁륭 안에 성 빈첸시오의 성유물을 보관하고 있다. 울림이 큰 신랑을 따라 행렬을 맞이한다."
 MA_se_lisbon: "$building_type_MA_se_lisbon$"
 
 #Alto Douro Vineyards
 MA_alto_douro_district: "$building_type_MA_alto_douro$"
 MA_alto_douro_district_desc: "$building_type_MA_alto_douro_desc$"
 building_type_MA_alto_douro: "알투 도루 포도밭"
 building_type_MA_alto_douro_desc: "도루 계곡의 가파른 언덕을 깎아 만든 계단식 포도밭으로, 돌담이 흙을 붙잡고 햇볕을 모은다. 로마 시대에 처음 조성된 이 포도밭은 오래전부터 진하고 짙은 색의 포도주를 생산해 왔으며, 강을 따라 내려가 해안 시장과 외국 궁정으로 운송된다."
 MA_alto_douro: "$building_type_MA_alto_douro$"
 
 #Fortifications on the Guadalquivir
 MA_guadalquivir_fortifications_district: "$building_type_MA_guadalquivir_fortifications$"
 MA_guadalquivir_fortifications_district_desc: "$building_type_MA_guadalquivir_fortifications_desc$"
 building_type_MA_guadalquivir_fortifications: "과달키비르강 방어시설"
 building_type_MA_guadalquivir_fortifications_desc: "과달키비르강 기슭을 따라 이어지는 요새들은 곳곳에 탑과 성문을 세워 활기찬 세비야 항구를 보호한다. 가장 눈에 띄는 것은 토레 델 오로로, 황금빛 회칠을 한 열두 면의 감시탑이 강물 위로 반짝인다. 이 탑은 다가오는 선박의 길잡이이자 도시의 힘을 경고하는 표지다."
 MA_guadalquivir_fortifications: "$building_type_MA_guadalquivir_fortifications$"
 
 #Madinat al-Zahra
 MA_madinat_alzahra_district: "$building_type_MA_madinat_alzahra$"
 MA_madinat_alzahra_district_desc: "$building_type_MA_madinat_alzahra_desc$"
 building_type_MA_madinat_alzahra: "메디나 아사하라"
 building_type_MA_madinat_alzahra_desc: "코르도바 교외의 완만한 산기슭에 칼리프 궁정의 영광을 드러내기 위해 세워진 광대한 궁전 도시다. 정원과 누각, 접견실이 넓은 계단식 대지에 펼쳐져 있으며, 대리석과 벽옥 벽에는 섬세한 조각이 새겨져 있다. 그 아름다움과 화려함은 시인들이 삶의 가장 달콤한 즐거움을 노래하도록 영감을 준다."
 MA_madinat_alzahra: "$building_type_MA_madinat_alzahra$"
 
 #Circus of Merida
 MA_circus_merida_district: "$building_type_MA_circus_merida$"
 MA_circus_merida_district_desc: "$building_type_MA_circus_merida_desc$"
 building_type_MA_circus_merida: "메리다 원형경기장"
 building_type_MA_circus_merida_desc: "고대 로마의 전차 경기장 유적이 메리다 교외 평원에 길고 좁게 뻗어 있으며, 무너져 내리는 벽과 풀 덮인 주로가 아직도 윤곽을 드러낸다. 드문드문 선 사이프러스나무 몇 그루가 부드러운 그늘을 드리운다. 가까운 폐허 바깥에는 고요한 묘지를 딸린 작은 교회가 세워져, 옛 용도가 사라진 곳에서 새로운 의미를 찾았다."
 MA_circus_merida: "$building_type_MA_circus_merida$"
 
 #Alhambra
 MA_alhambra1_district: "$building_type_MA_alhambra1$"
 MA_alhambra1_district_desc: "$building_type_MA_alhambra1_desc$"
 building_type_MA_alhambra1: "알람브라"
 building_type_MA_alhambra1_desc: "완만한 사비카 언덕에서 알람브라의 붉은 성벽은 그라나다와 비옥한 평야를 내려다본다. 성벽 안에서 도시의 통치자들은 적과 여름 태양의 열기를 피할 안식처를 찾으며, 탑과 흉벽은 아래 땅에 대한 지배권을 선포한다."
