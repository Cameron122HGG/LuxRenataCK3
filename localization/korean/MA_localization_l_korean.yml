l_korean:
 #################
 ##MEDIEVAL ARTS##
 #################

 ###########
 #GAME RULE#
 game_rule_category_MedievalArts: "Medieval Arts"
 rule_MA_monuments: "$game_rule_category_MedievalArts$: 기념물"
 setting_MA_monuments_all: "$game_rule_category_MedievalArts$ 우선"
 setting_MA_monuments_all_desc: "#help 권장:#! 충돌이 발생할 경우, #V $game_rule_category_MedievalArts$#!의 [special_buildings|E]이 기본 게임의 것보다 우선합니다."
 setting_MA_monuments_selection: "기본 게임 우선"
 setting_MA_monuments_selection_desc: "충돌이 발생할 경우, #V 기본 게임#!의 [special_buildings|E]이 $game_rule_category_MedievalArts$의 것보다 우선합니다."
 rule_MA_ahistorical_monuments: "$game_rule_category_MedievalArts$: 역사적 개연성"
 setting_MA_ahistorical_monuments_yes: "개연성이 낮은 기념물 허용"
 setting_MA_ahistorical_monuments_yes_desc: "#help 권장:#! #italic 역사적 개연성이 낮다고#! 여겨질 수 있는 [special_buildings|E]을 허용합니다."
 setting_MA_ahistorical_monuments_no: "개연성이 낮은 기념물 금지"
 setting_MA_ahistorical_monuments_no_desc: "#italic 역사적 개연성이 낮다고#! 여겨질 수 있는 [special_buildings|E]은 #bold 허용되지 않습니다#!."
 rule_MA_creator_pack: "$game_rule_category_MedievalArts$: DLC"
 setting_MA_creator_pack_yes: "DLC 우선"
 setting_MA_creator_pack_yes_desc: "#help 권장:#! 활성화된 경우, #V Holy Buildings#! 등의 #V DLC#!에 포함된 [special_buildings|E]이 $game_rule_category_MedievalArts$의 것보다 우선합니다."
 setting_MA_creator_pack_no: "$setting_MA_monuments_all$"
 setting_MA_creator_pack_no_desc: "충돌이 발생할 경우, #V $game_rule_category_MedievalArts$#!의 [special_buildings|E]이 #V DLC#!의 것보다 우선합니다."

 
 ###################
 #SPECIAL BUILDINGS#

 #Rock of Cashel
 MA_rock_cashel_district: "$building_type_MA_rock_cashel$"
 MA_rock_cashel_district_desc: "$building_type_MA_rock_cashel_desc$"
 building_type_MA_rock_cashel: "캐셜 바위"
 building_type_MA_rock_cashel_desc: "푸른 목초지로 둘러싸인 바위 언덕 위에 세워진 캐셜 바위는 여러 겹의 성벽으로 보호받는 난공불락의 석조 요새로, 성과 궁전의 역할을 모두 수행할 수 있다. 아일랜드에서 가장 영향력 있는 수도원 가운데 하나가 이곳에 있으며, 궁정 예배당의 천장 궁륭에는 성 파트리치오의 생애를 그린 아름다운 프레스코화가 장식되어 있다."
 MA_rock_cashel: "$building_type_MA_rock_cashel$"
 
 #St Donatus of Zadar
 MA_st_donatus_district: "$building_type_MA_st_donatus$"
 MA_st_donatus_district_desc: "$building_type_MA_st_donatus_desc$"
 building_type_MA_st_donatus: "자다르의 성 도나투스 성당"
 building_type_MA_st_donatus_desc: "아드리아해의 물결 위로 내리쬐는 햇빛에 반짝이는 백색 석재로 지어진 웅장한 원형 교회다. 카롤루스 대제의 궁정 예배당에서 영감을 받았으며, 아름다운 황금빛 모자이크로 장식되어 있다."
 MA_st_donatus: "$building_type_MA_st_donatus$"
 
 #Aula Palatina
 MA_aula_palatina_district: "$building_type_MA_aula_palatina$"
 MA_aula_palatina_district_desc: "$building_type_MA_aula_palatina_desc$"
 building_type_MA_aula_palatina: "아울라 팔라티나"
 building_type_MA_aula_palatina_desc: "콘스탄티누스 대제가 자신의 #italic 궁전#!을 위해 지은 거대한 벽돌 회당이다. \n대륙에서도 견줄 곳이 드물 만큼 규모가 크며, 뛰어난 건축 기술은 언제나 영감의 원천이 된다."
 MA_aula_palatina: "$building_type_MA_aula_palatina$"
 
 #Jokhang Temple
 MA_jokhang_district: "$building_type_MA_jokhang$"
 MA_jokhang_district_desc: "$building_type_MA_jokhang_desc$"
 building_type_MA_jokhang: "조캉 사원"
 building_type_MA_jokhang_desc: "티베트 전역에서 가장 오래되고 신비로운 사원으로, 신들의 땅 한가운데에 안뜰과 성소가 장엄하게 모여 있다."
 MA_jokhang: "$building_type_MA_jokhang$"
 
 #Dongola Throne Hall
 MA_dongola_hall_district: "$building_type_MA_dongola_hall$"
 MA_dongola_hall_district_desc: "$building_type_MA_dongola_hall_desc$"
 building_type_MA_dongola_hall: "동골라 알현실"
 building_type_MA_dongola_hall_desc: "주변 평원과 나일강을 한눈에 내려다볼 수 있는 바위 언덕 위에 세워진 거대한 궁전이다. \n의례를 위해 사용되며, 누비아와 그리스의 화가들이 그린 화려한 프레스코화로 장식된 기념비적인 계단을 올라 위층의 장엄한 알현실에 이르는 사절과 여행자들에게 깊은 인상을 남긴다."
 MA_dongola_hall: "$building_type_MA_dongola_hall$"
 
 #Cathedral of Hildesheim
 MA_hildesheim_cathedral_district: "$building_type_MA_hildesheim_cathedral$"
 MA_hildesheim_cathedral_district_desc: "$building_type_MA_hildesheim_cathedral_desc$"
 building_type_MA_hildesheim_cathedral: "힐데스하임 성 미하엘 성당"
 building_type_MA_hildesheim_cathedral_desc: "이 바실리카는 로마인의 왕이 지닌 권력과 위신을 드러내기 위해 건립되었다. 채색한 목조 천장과 반원 아치는 장엄하고 황제다운 모습을 자아낸다. 라인 지방과 이탈리아의 장인들이 건설에 참여했으며, 정교한 부조로 장식된 청동 문과 거대한 청동 기둥을 간직하고 있다."
 MA_hildesheim_cathedral: "$building_type_MA_hildesheim_cathedral$"
 
 #Toulouse Cathedral
 MA_toulouse_basilica_district: "$building_type_MA_toulouse_basilica$"
 MA_toulouse_basilica_district_desc: "$building_type_MA_toulouse_basilica_desc$"
 building_type_MA_toulouse_basilica: "툴루즈 바실리카"
 building_type_MA_toulouse_basilica_desc: "알프스 이북에서 손꼽히게 큰 대성당 가운데 하나인 장엄한 바실리카다. 현지에서 풍부하게 구할 수 있는 벽돌로 지어졌으며, 프랑스 남부의 고대 로마 유적에서 영감을 받은 전형적인 로마네스크 양식 건물이다. 롬바르디아 장식띠와 반원 아치, 다른 건물에서 가져온 고대 기둥이 이를 꾸미고 있다."
 MA_toulouse_basilica: "$building_type_MA_toulouse_basilica$"
 
 #The Durham Cathedral
 MA_durham_cathedral_district: "$building_type_MA_durham_cathedral$"
 MA_durham_cathedral_district_desc: "$building_type_MA_durham_cathedral_desc$"
 building_type_MA_durham_cathedral: "더럼 대성당"
 building_type_MA_durham_cathedral_desc: "더럼의 웅장한 대성당은 웨어강의 습지에 둘러싸인 반도 위로 높이 솟아 있다. 전설에 따르면 이곳에서 두 젖 짜는 처녀가 움직일 수 없는 성 커스버트의 무덤을 발견했다고 한다. 해협 양안의 장인들이 설계한 늑재 궁륭은 잉글랜드에 전례가 없는 건축 기술의 걸작이며, 도시의 숲과 강기슭 위에 아래쪽 절벽에서 채취한 돌로 지어졌다."
 MA_durham_cathedral: "$building_type_MA_durham_cathedral$"
 
 #The Castel del Monte
 MA_castel_monte_district: "$building_type_MA_castel_monte$"
 MA_castel_monte_district_desc: "$building_type_MA_castel_monte_desc$"
 building_type_MA_castel_monte: "카스텔 델 몬테"
 building_type_MA_castel_monte_desc: "아풀리아의 완만한 언덕 위에 자리한 우아한 사냥 궁전이다. \n팔각형 평면과 여덟 모퉁이마다 세워진 팔각탑이라는 독특한 구조에는 고전주의 건축과 고딕 건축이 어우러져 있다. \n엄숙하고 기하학적인 외관은 태피스트리와 융단, 그림, 기둥머리로 호화롭게 꾸민 내부와 뚜렷한 대조를 이룬다."
 MA_castel_monte: "$building_type_MA_castel_monte$"
 
 #The Belfry of Bruges
 MA_belfort_district: "$building_type_MA_belfort$"
 MA_belfort_district_desc: "$building_type_MA_belfort_desc$"
 building_type_MA_belfort: "브뤼허 종루"
 building_type_MA_belfort_desc: "브뤼허의 시장 광장 위로 우뚝 솟아 도시 전체의 생활을 지배하는 아름다운 고딕 양식 종루다. 벽돌과 석재로 지은 거대한 탑은 첨탑과 조각상으로 뒤덮여 있으며, 직사각형 기단 위로 종들이 걸린 팔각형 상층부가 솟아 있다."
 MA_belfort: "$building_type_MA_belfort$"
 
 #The Strasbourg Cathedral
 MA_strasbourg_cathedral1_district: "$building_type_MA_strasbourg_cathedral1$"
 MA_strasbourg_cathedral1_district_desc: "$building_type_MA_strasbourg_cathedral1_desc$"
 building_type_MA_strasbourg_cathedral1: "스트라스부르 대성당"
 building_type_MA_strasbourg_cathedral1_desc: "서프랑크와 동프랑크의 거대한 교회들에서 영감을 받은 스트라스부르 대성당은 시민들의 부와 영주의 후원 덕분에 장엄한 위용을 갖추었다. 연분홍 사암으로 쌓은 벽은 늦은 오후 햇빛을 받아 빛나고, 좁은 광장과 목조 가옥들 위로 솟아오른다. 청동 종은 바람을 타고 선율을 울린다."
 MA_strasbourg_cathedral1: "스트라스부르 대성당"
 MA_strasbourg_cathedral2: "$MA_strasbourg_cathedral1$"
 
 #Koutoubia Mosque
 MA_koutoubia_district: "$building_type_MA_koutoubia$"
 MA_koutoubia_district_desc: "$building_type_MA_koutoubia_desc$"
 building_type_MA_koutoubia: "쿠투비아 모스크"
 building_type_MA_koutoubia_desc: "무어 건축의 모범적인 걸작으로, 이 모스크의 미나레트는 이슬람 세계 전역의 건축가들에게 영감을 준다."
 MA_koutoubia: "$building_type_MA_koutoubia$"
 
 #Parigoritissa
 MA_parigoritissa_district: "$building_type_MA_parigoritissa$"
 MA_parigoritissa_district_desc: "$building_type_MA_parigoritissa_desc$"
 building_type_MA_parigoritissa: "파리고리티사 파나기아 성당"
 building_type_MA_parigoritissa_desc: "지극히 거룩한 성모 마리아에게 봉헌된 이 교회의 평면은 대칭과 기하학적 완전성이라는 고전적 이념에서 영감을 받았다. 거의 완벽한 정사각형 중심에는 기둥으로 지탱되는 팔각형 돔이 있고, 네 모퉁이에는 작은 예배당이 하나씩 자리한다."
 MA_parigoritissa: "$building_type_MA_parigoritissa$"
 
 #Rotunda
 MA_rotunda_district: "$building_type_MA_rotunda$"
 MA_rotunda_district_desc: "$building_type_MA_rotunda_desc$"
 building_type_MA_rotunda: "테살로니키 로툰다"
 building_type_MA_rotunda_desc: "로마의 판테온에서 영감을 받은 거대한 돔 건물이다. \n내부에는 독보적인 기예와 아름다움을 지닌 모자이크가 장식되어 있고, 황금빛 #italic 테세라#!들이 둥근 채광창으로 들어오는 햇살을 받아 반짝인다. \n이 건물은 열주 회랑을 통해 옛 카이사르 갈레리우스가 세운 거대한 대리석 개선문과 이어진다."
 MA_rotunda: "$building_type_MA_rotunda$"
 
 #The Nikaea Walls
 MA_nikaea_walls_district: "$building_type_MA_nikaea_walls$"
 MA_nikaea_walls_district_desc: "$building_type_MA_nikaea_walls_desc$"
 building_type_MA_nikaea_walls: "니케아 성벽"
 building_type_MA_nikaea_walls_desc: "수세기 전 로마 황제들이 건설한 이 난공불락의 이중 성벽은 콘스탄티노폴리스로 향하는 길을 보호한다."
 MA_nikaea_walls: "$building_type_MA_nikaea_walls$"
 
 #The Ephesus Basilica
 MA_ephesus_basilica_district: "$building_type_MA_ephesus_basilica$"
 MA_ephesus_basilica_district_desc: "$building_type_MA_ephesus_basilica_desc$"
 building_type_MA_ephesus_basilica: "에페소스 바실리카"
 building_type_MA_ephesus_basilica_desc: "유스티니아누스 시대에 #italic 사도 요한#!의 묘소 위에 세워진 거대한 바실리카다. \n벽돌과 다듬은 돌로 쌓은 벽은 프로콘네소스산 대리석으로 만든 우아한 기둥들이 받치고 있으며, 황금빛 모자이크로 화려하게 장식되어 있다."
 MA_ephesus_basilica: "$building_type_MA_ephesus_basilica$"
 
 #Arles Amphiteatre
 MA_arles_amphiteatre_district: "$building_type_MA_arles_amphiteatre$"
 MA_arles_amphiteatre_district_desc: "$building_type_MA_arles_amphiteatre_desc$"
 building_type_MA_arles_amphiteatre: "아를 원형경기장"
 building_type_MA_arles_amphiteatre_desc: "수세기 전에 건설된 이 거대한 경기장은 여전히 아를 생활의 중심이다. \n시민들은 돌로 쌓은 벽을 활용해 탑과 예배당, 집을 만들고, 한때 검투사들이 구경거리로 서로를 살해하던 모래밭에서 살아간다."
 MA_arles_amphiteatre: "$building_type_MA_arles_amphiteatre$"
 
 #Axum Stelae Field
 MA_axum_stelae_district: "$building_type_MA_axum_stelae$"
 MA_axum_stelae_district_desc: "$building_type_MA_axum_stelae_desc$"
 building_type_MA_axum_stelae: "석비 군락"
 building_type_MA_axum_stelae_desc: "한때 강대했던 악숨의 유적으로 남은 것은 세 개의 거대한 석비뿐이지만, 이들은 여전히 이 땅의 왕권 문화에 긴 그림자를 드리운다. \n다듬은 돌로 만든 석비 표면에는 지금도 부조가 남아 있어, 어떤 이들은 이를 #italic 천국의 문#!이라고 여긴다."
 MA_axum_stelae: "$building_type_MA_axum_stelae$"
 
 #Karnak Temple
 MA_karnak_district: "$building_type_MA_karnak$"
 MA_karnak_district_desc: "$building_type_MA_karnak_desc$"
 building_type_MA_karnak: "카르나크"
 building_type_MA_karnak_desc: "고대 파라오의 신전 가운데 가장 웅장한 카르나크는 수천 년이 지난 오늘날에도 나일강 왕들의 권력과 부를 증언한다."
 MA_karnak: "$building_type_MA_karnak$"
 
 #Pharos of Alexandria
 MA_pharos_alexandria_district: "$building_type_MA_pharos_alexandria$"
 MA_pharos_alexandria_district_desc: "$building_type_MA_pharos_alexandria_desc$"
 building_type_MA_pharos_alexandria: "파로스 등대"
 building_type_MA_pharos_alexandria_desc: "지협 위로 높이 솟은 이 등대는 안티파트로스가 꼽은 #italic 세계 7대 불가사의#! 중 하나로 온 세상에 이름이 알려져 있다. \n초석을 놓은 지 수세기가 흘렀고 칼리프의 명으로 세운 새로운 돔이 건물의 꼭대기를 장식하지만, 비할 데 없는 높이와 견고한 석조 구조, 빛나는 봉화는 이를 보는 모든 이의 가슴에 파로스의 전설을 새긴다."
 MA_pharos_alexandria: "$building_type_MA_pharos_alexandria$"
 
 #Trajan Arch
 MA_trajan_arch1_district: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch1_district_desc: "$building_type_MA_trajan_arch1_desc$"
 building_type_MA_trajan_arch1: "트라야누스 개선문"
 building_type_MA_trajan_arch1_desc: "위대한 황제 트라야누스는 이 도시에서 #italic 다키아#! 원정을 시작했으며, 승리를 기념하고자 장엄한 개선문을 건설하도록 명했다. 개선문은 지금도 안코나 항구에 들어서는 모든 배를 자부심과 위엄의 기억으로 맞이한다."
 MA_trajan_arch1: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch2: "안코나 개선문"
 
 #Palatium of Diocletian
 MA_diocletian_palace_district: "$building_type_MA_diocletian_palace$"
 MA_diocletian_palace_district_desc: "$building_type_MA_diocletian_palace_desc$"
 building_type_MA_diocletian_palace: "디오클레티아누스 궁전"
