 building_type_MA_saint_martin_desc: "성 마르티누스의 유해가 잠든 이 거대한 바실리카는 메로빙거 왕조가 이 땅을 다스리던 시절에 처음 세워졌다. \n길이 160피트, 너비 60피트의 건물은 고대 기둥과 다채로운 대리석으로 장식되어 있으며, 산티아고로 향하는 순례길의 먼 곳에서도 순례자를 끌어들인다."
