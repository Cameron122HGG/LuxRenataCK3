 building_type_MA_romuliana: "로물리아나"
 building_type_MA_romuliana_desc: "#italic 펠릭스 로물리아나#!는 위대한 황제들이 모범 도시로 건설했으며, 오랜 세월 거대한 성벽의 보호를 받았다. \n그러나 성벽조차 수세기에 걸친 침략을 막지 못했다. 이제 과거의 영광을 전하는 것은 텅 빈 감시탑의 뼈대와 이를 집어삼킨 무성한 초목뿐이다."
 MA_romuliana: "$building_type_MA_romuliana$"
 
 #Hexamilion
 MA_hexamilion_district: "$building_type_MA_hexamilion$"
