 building_type_MA_burgos_cathedral_desc: "피레네산맥 양쪽에서 온 장인들이 건설한 이 웅장한 대성당은 새롭고 현대적인 교회 건축 양식의 가장 뛰어난 사례 가운데 하나다. \n탑은 하늘 높이 솟고, 동굴처럼 넓은 예배당과 회랑은 봉헌물과 황금으로 뒤덮인 성유물들을 따라 순례자들을 안내한다. 그 위로 조각된 수많은 성인들의 고귀한 시선이 내려앉는다."
