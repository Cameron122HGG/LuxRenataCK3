 building_type_MA_walls_sanaa_desc: "견고한 방벽이 사나의 중심부를 둘러싸고 있다. 사라와트산맥의 복잡한 미로에서 거침없이 솟아오른 오랜 성벽의 장엄함은 인간과 신들의 위대한 업적과 끔찍한 전투에 관한 이야기를 속삭인다."
