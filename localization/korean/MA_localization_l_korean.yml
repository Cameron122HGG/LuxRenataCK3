 MA_alturaif_district_desc: "$building_type_MA_alturaif_desc$"
 building_type_MA_alturaif: "앗투라이프 궁전"
 building_type_MA_alturaif_desc: "세상에서 가장 살기 어려운 곳 가운데 하나에 여러 세대를 거쳐 세워진 이 궁전은 인내와 경건함의 상징이다. \n긴 성벽에 둘러싸인 높은 흙벽돌 궁전들과 관개 정원은 가장 혹독한 더위에도 피난처가 되어 주며, 소유자에게 중요한 보급 기지 역할을 한다."
 MA_alturaif: "$building_type_MA_alturaif$"
 
 #School of Preslav
 MA_school_preslav_district: "$building_type_MA_school_preslav$"
 MA_school_preslav_district_desc: "$building_type_MA_school_preslav_desc$"
 building_type_MA_school_preslav: "프레슬라프 학당"
 building_type_MA_school_preslav_desc: "꾸준히 이어지는 기부금에 힘입어 프레슬라프의 수도원 필사실과 궁정 회당에서는 사본을 번역하고 새로운 지식을 생산하기 위해 쉴 새 없이 일한다. 잉크와 양피지 향이 공기에 스며들고, 성인과 후원자의 프레스코화가 벽을 장식한다. 이 학당의 영향력은 석조 건물 너머까지 미쳐, 이 지역 로마 전례와 사상의 등대가 되었다."
 MA_school_preslav: "$building_type_MA_school_preslav$"
 
 #Madara Rider
 MA_madara_rider_district: "$building_type_MA_madara_rider$"
 MA_madara_rider_district_desc: "$building_type_MA_madara_rider_desc$"
 building_type_MA_madara_rider: "마다라 기마상"
 building_type_MA_madara_rider_desc: "차갑고 영원할 것 같은 수직 절벽에 깊이 새겨진 이 고대 부조는 사자를 제압하는 기마인을 묘사한다. 손에 창을 든 기마인은 마치 바위에서 뛰쳐나와 영원히 승리하는 듯하다. 아래의 비문들은 이 땅의 사람들이 서쪽에 정착하기 전, 끝없는 초원에서 이룬 영광스러운 업적을 전한다."
 MA_madara_rider: "$building_type_MA_madara_rider$"
 
 #Tomb of the Thracian King
 MA_thracian_tomb_district: "$building_type_MA_thracian_tomb$"
 MA_thracian_tomb_district_desc: "$building_type_MA_thracian_tomb_desc$"
 building_type_MA_thracian_tomb: "트라키아 왕의 무덤"
 building_type_MA_thracian_tomb_desc: "시간과 공간의 흐름 속에 숨겨진 고대의 무덤이 고요한 황금빛 초원 가운데 거대한 흙 [Glossary('봉분','MA_tumulus_glossary')] 아래 잠들어 있다. 거대한 돌문이 입구를 표시하고 석재들이 숲처럼 둘러서 있다. 전설에 따르면 오래전 위대한 왕이 이곳에 묻혔고 이름은 잊혔으나 영혼은 여전히 하늘을 달린다고 한다. \n입구 앞에는 외로운 사이프러스 한 그루가 파수꾼처럼 서서 무덤 위에 길고 고요한 그림자를 드리운다."
 MA_thracian_tomb: "$building_type_MA_thracian_tomb$"
 MA_tumulus_glossary: "무덤 위에 흙과 돌을 쌓아 거대한 돔을 이룬 봉분. 특히 고대 사회를 비롯한 여러 문화에서 사용한 #bold 봉분#!은 세월의 흐름을 증언하는 장엄하고 엄숙한 유산이다."
 
