 MA_qutb_complex3: "쿠트브 미나르"
 MA_qutb_complex4: "알라이 미나르"
 
 #Sigiriya
 MA_sigiriya1_district: "$building_type_MA_sigiriya1$"
 MA_sigiriya1_district_desc: "$building_type_MA_sigiriya1_desc$"
 building_type_MA_sigiriya1: "시기리야"
 building_type_MA_sigiriya1_desc: "깊은 밀림에서 거대한 외로운 바위가 솟아 있고, 그 정상에는 고대 왕실의 성채 [Glossary('시기리야','MA_sigiriya_glossary')]가 자리한다. 계단은 계단식 정원과 연못 위로 프레스코화가 그려진 벽과 거대한 사자문을 지나 올라간다. 하늘에 거처를 마련한 왕들의 야망을 증언하는 곳이다."
 MA_sigiriya1: "시기리야 유적"
 MA_sigiriya2: "복원된 시기리야"
 MA_sigiriya_glossary: "싱할라어로, 문자 그대로는 \"사자 바위\"를 뜻한다."
 
 #Great Sanchi Stupa
 MA_sanchi_stupa_district: "$building_type_MA_sanchi_stupa$"
 MA_sanchi_stupa_district_desc: "$building_type_MA_sanchi_stupa_desc$"
 building_type_MA_sanchi_stupa: "산치 대스투파"
 building_type_MA_sanchi_stupa_desc: "돌과 벽돌로 지은 이 거대한 돔은 처음에 강대한 아소카 황제의 명으로 건설되었다. 이후 후계자들이 단지를 확장했으나 세월의 풍파로 훼손되었다. 높은 대지 위에 서 있으며, 조각된 난간과 장식된 #italics 토라나#! 출입문이 둘러싸고 있다. 순례자들은 끝없는 경건함으로 그 주위를 돈다."
 MA_sanchi_stupa: "$building_type_MA_sanchi_stupa$"
 
 #Vindhyagiri Hill
 MA_gommateshwara1_district: "$building_type_MA_gommateshwara1$"
 MA_gommateshwara1_district_desc: "$building_type_MA_gommateshwara1_desc$"
 building_type_MA_gommateshwara1: "빈디아기리 언덕"
 building_type_MA_gommateshwara1_desc: "슈라바나벨라골라 마을 위로 가파르게 솟은 빈디아기리의 화강암 봉우리는 자이나교의 성소와 안뜰로 장식되어 있다. 순례자들은 맨발로 돌계단을 오르며, 공기에는 종소리와 햇볕에 데워진 돌 냄새가 가득하다."
 MA_gommateshwara2: "거대한 고마테슈와라상"
 MA_gommateshwara1: "빈디아기리 사원"
 
 #Palace of Ghazni
 MA_ghazni_palace_district: "$building_type_MA_ghazni_palace$"
 MA_ghazni_palace_district_desc: "$building_type_MA_ghazni_palace_desc$"
 building_type_MA_ghazni_palace: "가즈나 왕조 궁전"
 building_type_MA_ghazni_palace_desc: "가즈니 성벽 바깥에 위치한 이 왕실 거처는 도시 술탄의 권력 중심지다. 사각형 #italic 이완#! 안뜰에서 사방으로 뻗은 회당은 숙련된 솜씨로 조각되었으며, 페르시아 예술에서 영감을 받은 회반죽 장식과 다채로운 타일로 풍성하게 꾸며져 있다."
 MA_ghazni_palace: "$building_type_MA_ghazni_palace$"
 
 #Stupas of Anuradhapura
 MA_stupas_anuradhapura_district: "$building_type_MA_stupas_anuradhapura$"
 MA_stupas_anuradhapura_district_desc: "$building_type_MA_stupas_anuradhapura_desc$"
 building_type_MA_stupas_anuradhapura: "아누라다푸라 스투파"
 building_type_MA_stupas_anuradhapura_desc: "고대 사원 도시 아누라다푸라 주변 곳곳에는 싱할라 왕들이 부처의 사리를 모시기 위해 지은 거대한 벽돌 [Glossary('스투파','MA_stupa_glossary')]들이 솟아 있다. 하얗게 회칠한 수도원과 학문의 중심지들이 햇빛 아래 빛나고, 그 회당과 안뜰에서는 토론이 이어진다."
 MA_stupas_anuradhapura: "$building_type_MA_stupas_anuradhapura$"
 
 #Eye of the Sahara
 MA_eye_sahara_district: "$building_type_MA_eye_sahara$"
 MA_eye_sahara_district_desc: "$building_type_MA_eye_sahara_desc$"
 building_type_MA_eye_sahara: "사하라의 눈"
 building_type_MA_eye_sahara_desc: "사막 한가운데 거대한 원형 지형이 자리하며 바위 고리가 모래 위로 수 마일에 걸쳐 뻗어 있다. 멀리서 보면 하늘을 응시하는 풍화된 거대한 눈처럼 보이며, 주변의 황무지를 건너는 유목민과 대상들이 길잡이로 삼는다. \n고대의 전설은 이곳에 한때 물이 흐르고 초목이 무성했던 번영하는 도시가 있었으나 지금은 모래에 삼켜졌다고 전한다."
 MA_eye_sahara: "$building_type_MA_eye_sahara$"
 
 #Great Mosque of Mahdia
 MA_mahdia_mosque_district: "$building_type_MA_mahdia_mosque$"
 MA_mahdia_mosque_district_desc: "$building_type_MA_mahdia_mosque_desc$"
 building_type_MA_mahdia_mosque: "마흐디야 대모스크"
 building_type_MA_mahdia_mosque_desc: "마흐디야의 바위 해안 반도에 세워진 이 소박한 모스크는 옅은 색의 석조 탑 덕분에 요새처럼 보인다. \n안으로 들어가면 우아한 아케이드 안뜰 두 곳이 기도실로 이어지고, 신자들은 옅은 석조 아치 아래에 모인다."
 MA_mahdia_mosque: "$building_type_MA_mahdia_mosque$"
 
 #Saint Mark's of Zagreb
 MA_zagreb_church_district: "$building_type_MA_zagreb_church$"
 MA_zagreb_church_district_desc: "$building_type_MA_zagreb_church_desc$"
 building_type_MA_zagreb_church: "자그레브 성 마르코 성당"
 building_type_MA_zagreb_church_desc: "이탈리아와 독일 장인들의 도움으로 건설된 성 마르코 성당은 도시의 다른 건물들 위로 우뚝 솟아 있다. 로마네스크 양식의 평면에 고딕 요소를 더했으며, 입구와 벽에는 성경 이야기가 화려하게 그려져 있다."
 MA_zagreb_church: "$building_type_MA_zagreb_church$"
 
 #Walls of Balkh
 MA_walls_balkh_district: "$building_type_MA_walls_balkh$"
 MA_walls_balkh_district_desc: "$building_type_MA_walls_balkh_desc$"
 building_type_MA_walls_balkh: "발흐 성벽"
 building_type_MA_walls_balkh_desc: "수세기 동안 발흐의 성채는 도시 전체를 둘러싼 두 개의 거대한 원형 성벽에 의해 보호되었다. 하나가 다른 하나의 안쪽에 자리한다. 흙으로 쌓은 방벽과 탑은 초원을 휩쓰는 군대에 맞서는 보루가 되어 도시의 시장과 작업장을 지킨다."
 MA_walls_balkh: "$building_type_MA_walls_balkh$"
 
 #Martand Sun Temple
 MA_martand_sun_temple_district: "$building_type_MA_martand_sun_temple$"
 MA_martand_sun_temple_district_desc: "$building_type_MA_martand_sun_temple_desc$"
 building_type_MA_martand_sun_temple: "마르탄드 태양 신전"
 building_type_MA_martand_sun_temple_desc: "카슈미르 계곡의 높은 고원에 건설된 이 신전은 태양신에게 봉헌된 가장 오래된 신전 가운데 하나다. 중앙에는 거대한 성소가 있고, 주변으로 수많은 작은 사당과 신 및 천상 존재들을 묘사한 조각들이 늘어서 있다. 주랑으로 둘러싸인 안뜰에는 햇빛을 받아 빛나는 평온한 연못이 있다."
 MA_martand_sun_temple: "$building_type_MA_martand_sun_temple$"
 
 #Ruins of Aquae Sulis
 MA_aquae_sulis_ruins_district: "$building_type_MA_aquae_sulis_ruins$"
 MA_aquae_sulis_ruins_district_desc: "$building_type_MA_aquae_sulis_ruins_desc$"
 building_type_MA_aquae_sulis_ruins: "아쿠아이 술리스 유적"
 building_type_MA_aquae_sulis_ruins_desc: "#low 거인들이 만든 작품이 쇠락하고 있다#! \n김이 피어오르는 신성한 샘 주변에는 로마인들이 다듬은 돌로 거대한 목욕탕과 신전을 세웠던 아쿠아이 술리스의 부서진 잔해가 펼쳐져 있다. 무너진 벽과 쓰러진 아치, 물에 잠긴 방들은 여전히 고대 단지의 정연한 배치를 보여 준다. 따뜻한 물은 계속 흐르고 순례자와 주민들은 폐허 사이에 모인다."
 MA_aquae_sulis_ruins: "$building_type_MA_aquae_sulis_ruins$"
 
 #Winchester Minster
 MA_winchester_minster_district: "$building_type_MA_winchester_minster$"
 MA_winchester_minster_district_desc: "$building_type_MA_winchester_minster_desc$"
 building_type_MA_winchester_minster: "윈체스터 대성당"
 building_type_MA_winchester_minster_desc: "거대한 민스터는 돌과 목재로 지은 광대한 바실리카로, 넓은 채색 신랑과 여러 종탑을 갖추었다. 왕실 도시의 다른 어떤 건물보다 훨씬 커서 도시를 압도하며, 웨식스 왕가의 무덤을 지키는 수호자 역할을 한다."
 MA_winchester_minster: "$building_type_MA_winchester_minster$"
 
 #Westminster Abbey
 MA_westminster_abbey_district: "$building_type_MA_westminster_abbey$"
 MA_westminster_abbey_district_desc: "$building_type_MA_westminster_abbey_desc$"
 building_type_MA_westminster_abbey: "웨스트민스터 사원"
 building_type_MA_westminster_abbey_desc: "템스강 옆에 세워지고 잉글랜드 왕들의 풍부한 기증을 받은 웨스트민스터 사원은 긴 신랑과 높이 솟은 성가대석을 갖춘 거대한 석조 수도원 교회다. 조각된 기둥머리와 채색된 벽이 내부를 장식한다. 이곳에서 왕들이 대관식을 치르고 영면에 들며, 수도원은 왕권과 신의 은총이 결합하는 거룩한 무대가 된다."
 MA_westminster_abbey: "$building_type_MA_westminster_abbey$"
 
 #Lorsch Gate
 MA_lorsch_gate_district: "$building_type_MA_lorsch_gate$"
 MA_lorsch_gate_district_desc: "$building_type_MA_lorsch_gate_desc$"
 building_type_MA_lorsch_gate: "로르슈 문루"
 building_type_MA_lorsch_gate_desc: "로르슈 수도원의 기념비적인 문루는 희귀하고 정교하게 건설된 카롤링거 건축의 사례다. 잘 다듬은 돌과 벽돌로 지어졌으며, 대칭적인 정면에는 붙임기둥과 막힌 아치, 고대 로마의 본보기를 연상시키는 고전적인 장식이 배치되어 있다."
 MA_lorsch_gate: "$building_type_MA_lorsch_gate$"
 
 #Dover Castle
 MA_dover_castle_district: "$building_type_MA_dover_castle$"
 MA_dover_castle_district_desc: "$building_type_MA_dover_castle_desc$"
 building_type_MA_dover_castle: "도버성"
 building_type_MA_dover_castle_desc: "좁은 해협을 내려다보는 흰 절벽 위에 세워진 이 요새는 잉글랜드와 대륙을 잇는 주요 관문을 장악한다. 거대한 석조 주탑과 성벽, 여러 겹의 성문 시설이 강력한 방어 체계를 이루어 항구와 내륙 도로를 통제하는 동시에 왕실의 요새와 거처로 쓰인다."
 MA_dover_castle: "$building_type_MA_dover_castle$"
 
 #Château Gaillard
 MA_chateau_gaillard_district: "$building_type_MA_chateau_gaillard$"
 MA_chateau_gaillard_district_desc: "$building_type_MA_chateau_gaillard_desc$"
 building_type_MA_chateau_gaillard: "샤토 가이야르"
 building_type_MA_chateau_gaillard_desc: "센강 위 석회암 돌출부에 세워진 샤토 가이야르는 능동적인 방어를 위해 설계된 작고 정교한 석조 요새다. 동심원형 성벽과 각진 탑, 전방을 향한 성문 방어시설은 사각지대를 줄이고 접근로에 공격을 집중시킨다. 빠르고 정밀하게 건설된 이 요새는 군사 건축의 최신 원리를 구현하여 강과 노르망디 변경에 대한 지배력을 확보한다."
 MA_chateau_gaillard: "$building_type_MA_chateau_gaillard$"
 
 #Carnac Stones
 MA_carnac_stones_district: "$building_type_MA_carnac_stones$"
 MA_carnac_stones_district_desc: "$building_type_MA_carnac_stones_desc$"
 building_type_MA_carnac_stones: "카르나크 열석"
 building_type_MA_carnac_stones_desc: "수백 개의 거대한 돌이 평원에 흩어져 있으며, 지평선을 향해 정연한 줄을 이루고 있다. 기억조차 닿지 않는 먼 시대에 세워진 이 돌들의 진정한 목적은 전설과 이야기 속에 묻혀 버렸다."
 MA_carnac_stones: "$building_type_MA_carnac_stones$"
 
 #Guérande Salt Marshes
 MA_guerande_salt_marshes_district: "$building_type_MA_guerande_salt_marshes$"
 MA_guerande_salt_marshes_district_desc: "$building_type_MA_guerande_salt_marshes_desc$"
 building_type_MA_guerande_salt_marshes: "게랑드 염전"
 building_type_MA_guerande_salt_marshes_desc: "게랑드 인근의 낮은 해안 평지에는 유명한 진미 #italic 플뢰르 드 셀#!을 바다에서 얻기 위한 염전과 제방, 수로망이 펼쳐져 있다. 바닷물을 얕은 웅덩이로 이끌어 햇볕으로 하얀 소금을 얻으며, 대대로 이어진 기술이 지역의 도시와 무역을 지탱한다."
 MA_guerande_salt_marshes: "$building_type_MA_guerande_salt_marshes$"
 
 #Reims Cathedral
 MA_reims_cathedral_district: "$building_type_MA_reims_cathedral$"
 MA_reims_cathedral_district_desc: "$building_type_MA_reims_cathedral_desc$"
 building_type_MA_reims_cathedral: "랭스 대성당"
 building_type_MA_reims_cathedral_desc: "높은 신랑과 가느다란 다발기둥, 광범위하게 사용된 늑재 궁륭과 플라잉 버트레스를 특징으로 하는 거대한 고딕 대성당이다. 서쪽 정면에는 조각된 출입문과 깊은 아키볼트가 화려하게 배치되고, 내부는 높이와 빛, 의식의 장엄함을 강조하는 스테인드글라스 벽으로 둘러싸여 있어 프랑스 왕실 대관식에서 맡는 중심적 역할에 걸맞다."
 MA_reims_cathedral: "$building_type_MA_reims_cathedral$"
 
 #Chartres Cathedral
 MA_chartres_cathedral_district: "$building_type_MA_chartres_cathedral$"
 MA_chartres_cathedral_district_desc: "$building_type_MA_chartres_cathedral_desc$"
 building_type_MA_chartres_cathedral: "샤르트르 대성당"
 building_type_MA_chartres_cathedral_desc: "전성기 고딕 건축의 야망을 가장 우아하고 질서 있게 구현한 사례 가운데 하나인 샤르트르 대성당은 넓은 신랑과 견고한 기둥, 깊은 성가대석으로 유명하다. 튼튼한 골격 구조 안에 설치된 스테인드글라스가 벽 대부분을 대신하고, 쌍둥이 탑과 세심하게 비례를 맞춘 입면은 안정성과 명료함, 신학적 의도를 드러낸다."
 MA_chartres_cathedral: "$building_type_MA_chartres_cathedral$"
 
 #Palace of Avignon
 MA_avignon_palace1_district: "$building_type_MA_avignon_palace1$"
 MA_avignon_palace1_district_desc: "$building_type_MA_avignon_palace1_desc$"
 building_type_MA_avignon_palace1: "아비뇽 궁전"
 building_type_MA_avignon_palace1_desc: "론강 위 바위 돌출부에 솟아 있는 이 거대한 궁전 요새는 세련되고 강력한 궁정의 본거지다. 회당과 탑, 궁륭 예배당은 견고하면서도 우아하며, 통치자의 부와 권위에 이끌린 사절과 장인, 상인들이 아래 거리로 모여든다."
 MA_avignon_palace1: "구궁전"
 MA_avignon_palace2: "신궁전"
 
 #Walls of Carcassonne
 MA_walls_carcassonne1_district: "$building_type_MA_walls_carcassonne1$"
 MA_walls_carcassonne1_district_desc: "$building_type_MA_walls_carcassonne1_desc$"
 building_type_MA_walls_carcassonne1: "카르카손 성벽"
 building_type_MA_walls_carcassonne1_desc: "카르카손의 고대 성벽은 이베리아와 프랑크의 땅을 잇는 계곡과 도로를 보호한다. 탑과 견고한 성문 시설이 성벽을 따라 세워져 내부의 집들과 아래 들판을 지킨다. 왕들과 신앙들이 오랫동안 다투어 온 변경의 막강한 요새다."
 MA_walls_carcassonne1: "카르카손 고대 성벽"
 MA_walls_carcassonne2: "카르카손 이중 성벽"
 
 #Saint-Denis Basilica
 MA_saint_denis_basilica1_district: "$building_type_MA_saint_denis_basilica1$"
 MA_saint_denis_basilica1_district_desc: "$building_type_MA_saint_denis_basilica1_desc$"
 building_type_MA_saint_denis_basilica1: "생드니 대성당"
 building_type_MA_saint_denis_basilica1_desc: "성 드니의 매장지 위에 세워진 이 거대한 바실리카는 왕실 신앙의 성역이다. 넓은 신랑은 순례자들을 성인의 성소로 이끌고, 채색된 벽과 조각된 기둥머리는 아래에서 영면에 든 왕들을 지켜본다. 이곳에서는 왕관과 교회의 권위가 돌로 하나가 된다."
 MA_saint_denis_basilica1: "생드니 왕실 바실리카"
 MA_saint_denis_basilica2: "생드니 대성가대석"
 
 #Île de la Cité
 MA_ile_de_la_cite1_district: "$building_type_MA_ile_de_la_cite1$"
 MA_ile_de_la_cite1_district_desc: "$building_type_MA_ile_de_la_cite1_desc$"
 building_type_MA_ile_de_la_cite1: "시테섬"
 building_type_MA_ile_de_la_cite1_desc: "로마가 몰락한 뒤 시민들은 센강의 굽이치는 물줄기에 둘러싸인 이 섬에서 안전을 찾았다. 그러나 이후 시테섬은 활기차고 아름다우며 자부심 넘치는 곳으로 성장했고, 이제 파리와 더 나아가 프랑스의 정치, 지식, 상업의 중심지가 되었다."
 MA_ile_de_la_cite1: "카롤링거 궁전"
 MA_ile_de_la_cite2: "고딕 궁전"
 
 #Iron Gate
 MA_iron_gate_district: "$building_type_MA_iron_gate$"
 MA_iron_gate_district_desc: "$building_type_MA_iron_gate_desc$"
 building_type_MA_iron_gate: "철문"
 building_type_MA_iron_gate_desc: "오론테스 평원과 높은 산맥을 연결하는 산길을 지키는 철문은 안티오키아로 들어가는 가장 중요한 관문 중 하나다. 이곳의 성벽은 석탑과 성문, 암반에 직접 고정된 옹벽으로 이루어진 좁고 요새화된 협곡을 형성한다. 성채는 일종의 댐 역할도 하여 파르메니오스강의 급류를 조절하고 도시를 보호한다."
 MA_iron_gate: "$building_type_MA_iron_gate$"
 
 #Pula Amphitheater
 MA_pula_amphiteater_district: "$building_type_MA_pula_amphiteater$"
 MA_pula_amphiteater_district_desc: "$building_type_MA_pula_amphiteater_desc$"
 building_type_MA_pula_amphiteater: "풀라 원형경기장"
 building_type_MA_pula_amphiteater_desc: "정교하게 다듬은 석회암으로 건설된 이 원형경기장은 타원형 벽과 계단식 관람석, 아래쪽의 궁륭 회랑을 갖춘 로마 경기장의 온전한 모습을 보존하고 있다. 네 모퉁이의 탑과 견고한 아케이드는 이를 세운 자랑스러운 토목 기술의 전통을 보여 주며, 중세 도시에서도 권력과 모임, 구경거리의 중심지 역할을 이어간다."
 MA_pula_amphiteater: "$building_type_MA_pula_amphiteater$"
 
 #Olympus
 MA_olympus_district: "$building_type_MA_olympus$"
 MA_olympus_district_desc: "$building_type_MA_olympus_desc$"
 building_type_MA_olympus: "올림포스산"
 building_type_MA_olympus_desc: "테살리아 한가운데 솟아 있는 거대한 산으로, 그리스에서 가장 높은 험준한 봉우리가 바다와 완만하고 비옥한 산비탈 위에 긴 그림자를 드리운다. \n신들의 거처로 여겨져 수천 년 동안 경외와 존경을 불러일으켰으며, 정상에는 보이지 않는 신들의 궁전이 있다고 전해진다."
 MA_olympus: "$building_type_MA_olympus$"
 
 #Ypres Cloth Hall
 MA_ypres_cloth_hall_district: "$building_type_MA_ypres_cloth_hall$"
 MA_ypres_cloth_hall_district_desc: "$building_type_MA_ypres_cloth_hall_desc$"
 building_type_MA_ypres_cloth_hall: "이프르 직물회관"
 building_type_MA_ypres_cloth_hall_desc: "돌과 목재로 세운 이 광대한 도시 회관은 도시 부의 원천인 모직물의 규제와 보관, 거래를 위해 건설되었다. 길고 질서 정연한 정면은 아케이드와 박공지붕, 위압적인 종루로 구성되어 상업 기능과 도시의 권위를 결합한다. 궁륭으로 덮인 회당 안에서는 상인과 길드 관리, 행정관들이 도시 경제의 중심인 계약과 도량형, 세금을 감독한다."
 MA_ypres_cloth_hall: "$building_type_MA_ypres_cloth_hall$"
 
 #Gravensteen
 MA_gravensteen_district: "$building_type_MA_gravensteen$"
 MA_gravensteen_district_desc: "$building_type_MA_gravensteen_desc$"
 building_type_MA_gravensteen: "흐라번스테인"
 building_type_MA_gravensteen_desc: "이 위압적인 석조 성은 플랑드르 백작의 거처이자 도시에 대한 백작의 권위를 상징한다. 거대한 주탑을 중심으로 두꺼운 성벽에 둘러싸인 구조에는 거주용 회당과 재판실, 군사 방어시설이 함께 있어 헨트의 빽빽한 시가지 한가운데 영주의 힘을 드러낸다."
 MA_gravensteen: "$building_type_MA_gravensteen$"
 
 #Mount Ararat
 MA_ararat_district: "$building_type_MA_ararat$"
 MA_ararat_district_desc: "$building_type_MA_ararat_desc$"
 building_type_MA_ararat: "아라라트산"
 building_type_MA_ararat_desc: "주변 평야 위로 두 개의 봉우리가 솟은 거대한 화산 산괴인 아라라트산은 정상의 만년설과 함께 지평선을 압도한다. 여러 왕국과 신앙에서 경외받으며 노아의 방주가 머문 곳이라는 고대 전통과 연결되어, 산기슭의 땅에 성스러운 권위와 엄숙한 존재감을 부여한다."
 MA_ararat: "$building_type_MA_ararat$"
 
 #Székesfehérvár Basilica
 MA_szekesfehervar_basilica1_district: "$building_type_MA_szekesfehervar_basilica1$"
 MA_szekesfehervar_basilica1_district_desc: "$building_type_MA_szekesfehervar_basilica1_desc$"
 building_type_MA_szekesfehervar_basilica1: "세케슈페헤르바르 바실리카"
 building_type_MA_szekesfehervar_basilica1_desc: "이 거대한 석조 바실리카는 헝가리 왕국의 의례와 왕조의 중심지다. 넓은 신랑 안에서 왕들이 대관식을 치르고 영면에 들며, 왕국 최고의 왕실 성소 궁륭 아래에서 왕권과 법, 신앙이 하나로 결합된다."
 MA_szekesfehervar_basilica1: "세케슈페헤르바르 왕실 바실리카"
 MA_szekesfehervar_basilica2: "세케슈페헤르바르 대성가대석"
 
 #Prague Castle
 MA_prague_castle1_district: "$building_type_MA_prague_castle1$"
 MA_prague_castle1_district_desc: "$building_type_MA_prague_castle1_desc$"
 building_type_MA_prague_castle1: "프라하성"
 building_type_MA_prague_castle1_desc: "블타바강 위로 길게 뻗은 능선에서 프라하성의 회당과 교회, 안뜰이 아래 도시를 내려다본다. 보헤미아 통치자들의 이 거처에는 장인과 수행원, 성직자들이 모이며, 통치자들의 부와 야망은 이 언덕을 영지의 정치적, 종교적 중심지로 만들었다."
 MA_prague_castle1: "프라하 공작의 거처"
 MA_prague_castle2: "프라하 왕성"
 
 #Saint Adrian's Basilica
 MA_zalavar_basilica_district: "$building_type_MA_zalavar_basilica$"
 MA_zalavar_basilica_district_desc: "$building_type_MA_zalavar_basilica_desc$"
 building_type_MA_zalavar_basilica: "성 하드리아누스 바실리카"
 building_type_MA_zalavar_basilica_desc: "잘라강 습지에 자리한 카롤링거 왕조의 요새화된 정착지 중심에 있는 성 하드리아누스 바실리카는 이 지역 초기 기독교화의 중요한 교회 시설이다. 뚜렷한 성소와 서쪽 부속 시설을 갖춘 삼랑식 석조 교회로 지어졌으며, 변경 지역에 대한 수호자의 외교적 영향력을 넓히는 선교 중심지이자 제후의 교회 역할을 한다."
 MA_zalavar_basilica: "$building_type_MA_zalavar_basilica$"
 
 #Baths of Hisham
 MA_baths_hisham_district: "$building_type_MA_baths_hisham$"
 MA_baths_hisham_district_desc: "$building_type_MA_baths_hisham_desc$"
 building_type_MA_baths_hisham: "히샴의 목욕탕"
 building_type_MA_baths_hisham_desc: "더 큰 궁전 단지의 일부인 이 목욕탕은 온돌식 난방인 히포카우스툼으로 데우는 냉탕, 온탕, 열탕이 차례로 배치되어 있고 석조 궁륭으로 덮여 있다. 바닥에는 기하학적 무늬와 인물 형상의 모자이크가 풍성하게 깔려 있는데, 특히 정교한 테세라와 치밀한 구성으로 나무와 동물을 묘사한 거대한 바닥 모자이크가 유명하다."
 MA_baths_hisham: "$building_type_MA_baths_hisham$"
 
 #Peel Castle
 MA_peel_castle1_district: "$building_type_MA_peel_castle1$"
 MA_peel_castle1_district_desc: "$building_type_MA_peel_castle1_desc$"
 building_type_MA_peel_castle1: "성 패트릭섬"
 building_type_MA_peel_castle1_desc: "바위투성이인 성 패트릭섬에 자리한 교회와 회당, 묘지들이 주변 바다를 내려다본다. 이곳에서는 오래된 지역 전통과 새 정착민들의 신앙이 나란히 만나며, 성직자와 통치자들은 보호받는 해안이 예배와 세속 권력을 연결하는 좁은 피난처를 공유한다."
 MA_peel_castle1: "성 패트릭섬 수도원"
 MA_peel_castle2: "성 패트릭 회당"
 MA_peel_castle3: "필성"
 
 #Knin Fortress
 MA_knin_fortress_district: "$building_type_MA_knin_fortress$"
 MA_knin_fortress_district_desc: "$building_type_MA_knin_fortress_desc$"
 building_type_MA_knin_fortress: "크닌 요새"
 building_type_MA_knin_fortress_desc: "크르카 계곡 위 좁은 석회암 능선을 따라 뻗은 크닌 요새는 성벽과 탑, 둘러싸인 안뜰로 구성된 길고 분절된 방어 단지다. 해안과 내륙 평원을 잇는 길을 장악하는 위치 덕분에 이 지역의 주요 왕실 요새로 자리 잡았다."
 MA_knin_fortress: "$building_type_MA_knin_fortress$"
 
 #Amaravati Stupa
 MA_amaravati_stupa_district: "$building_type_MA_amaravati_stupa$"
 MA_amaravati_stupa_district_desc: "$building_type_MA_amaravati_stupa_desc$"
 building_type_MA_amaravati_stupa: "아마라바티 스투파"
 building_type_MA_amaravati_stupa_desc: "흰 석회암 판으로 덮인 거대한 고대 [Glossary('스투파','MA_stupa_glossary')]로, 드라비다계 인도에서 가장 크다. 벽돌 구조에는 부처의 생애와 신앙의 장면을 원형 장식과 띠 모양 부조에 묘사한 다채로운 이야기 조각이 새겨져 있다. 사방의 출입문은 주요 접근로를 표시하고 성스러운 봉분을 도는 의례의 동선을 안내한다."
 MA_amaravati_stupa: "$building_type_MA_amaravati_stupa$"
 MA_stupa_glossary: "불교에서 명상과 신앙의 장소로 사용하는, 성유물을 안치한 돔 모양 구조물이다. 초기 스투파는 단순한 봉분이었지만 형태와 기능이 세월에 따라 발전하여, 탑을 비롯한 아시아 전역의 불교 건축에 영향을 미쳤다."
 
 #Karla Caves
 MA_karla_caves_district: "$building_type_MA_karla_caves$"
 MA_karla_caves_district_desc: "$building_type_MA_karla_caves_desc$"
 building_type_MA_karla_caves: "카를라 석굴"
 building_type_MA_karla_caves_desc: "산비탈을 직접 파서 만든 카를라 석굴은 거대한 차이티야 회당을 중심으로 바위를 깎아 만든 [Glossary('비하라','MA_vihara')]와 성소들이 모인 단지다. 광대한 내부에는 늑재가 조각된 높은 궁륭 천장과 열주가 늘어선 긴 신랑, 반원형 끝부분에 놓인 [Glossary('스투파','MA_stupa_glossary')]가 있다. 입구 정면에는 거대한 말굽형 아치와 조각 부조가 있어 세속 세계에서 의례와 신앙의 질서 있는 내부 공간으로 넘어감을 나타낸다."
 MA_karla_caves: "$building_type_MA_karla_caves$"
 MA_vihara: "수도사들의 거처를 제공하는 불교 사원의 한 유형이다. 인도 건축에서는 특히 중앙 회당과 여기에 연결된 독방들을 가리킨다."
 
 #Somnath Temple
 MA_somnath_temple_district: "$building_type_MA_somnath_temple$"
 MA_somnath_temple_district_desc: "$building_type_MA_somnath_temple_desc$"
 building_type_MA_somnath_temple: "솜나트 사원"
 building_type_MA_somnath_temple_desc: "달의 신에게 바쳐진 주요 석조 사원인 솜나트는 높이 솟은 [Glossary('시카라','MA_vimana_glossary')]를 얹은 성소를 향해 [Glossary('만다파','MA_mandapa')]들이 일렬로 이어지는 구조다. 벽과 기둥은 신과 시종, 장식 띠의 조각으로 화려하게 꾸며져 있다. 유명한 순례지인 이곳은 지역 전역에서 신도들을 끌어모으는 동시에 인더스강 너머 이교도 군대의 탐욕스러운 시선도 받는다."
 MA_somnath_temple: "$building_type_MA_somnath_temple$"
 MA_mandapa: "인도 건축에서 기둥으로 지탱하는 회당이나 누각으로, 사원 입구에서 공간을 연결하는 전이 공간 역할을 한다."
 
 #Devagiri
 MA_devagiri_district: "$building_type_MA_devagiri$"
 MA_devagiri_district_desc: "$building_type_MA_devagiri_desc$"
 building_type_MA_devagiri: "데바기리"
 building_type_MA_devagiri_desc: "거대한 화산 언덕이 평원에서 갑작스럽게 솟아오르고, 어두운 현무암 사면에는 정상으로 굽이쳐 올라가는 좁은 길이 나 있다. [Glossary('데바기리','MA_devagiri_glossary')]라고 불리는 이 산에는 고대 석굴과 성소가 자리하며, 주변을 압도하는 고지는 이를 차지한 자들에게 강력한 피난처를 제공한다."
 MA_devagiri: "$building_type_MA_devagiri$"
 MA_daulatabad: "다울라타바드"
 MA_devagiri_glossary: "산스크리트어로 \"신들의 언덕\"이라는 뜻이다."
 MA_daulatabad_glossary: "부의 거처."
 
 #Ashoka's Palace
 MA_ashoka_palace1_district: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_palace1_district_desc: "$building_type_MA_ashoka_palace1_desc$"
 building_type_MA_ashoka_palace1: "아소카 궁전"
 building_type_MA_ashoka_palace1_desc: "위대한 [Glossary('아소카','MA_ashoka_glossary')]의 궁전은 고대 인도 왕들의 부와 권력을 증언한다. 넓은 안뜰과 열주 회당의 비범한 장엄함은 수많은 이야기에 영감을 주었으며, 그 규모와 세련미는 옛 영광을 되살리려는 자들에게 훌륭한 본보기가 된다."
 MA_ashoka_palace1: "아소카 궁전 유적"
 MA_ashoka_palace2: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_glossary: "마우리아 왕조의 세 번째 황제로, 잔혹한 정복자에서 불교와 광범위한 포교 활동을 장려하는 도덕적인 통치자로 전향한 것으로 유명하다."
 
 #Adina Mosque
 MA_adina_mosque_district: "$building_type_MA_adina_mosque$"
 MA_adina_mosque_district_desc: "$building_type_MA_adina_mosque_desc$"
 building_type_MA_adina_mosque: "아디나 모스크"
 building_type_MA_adina_mosque_desc: "벽돌과 돌로 지은 거대한 [Glossary('다주식','MA_hypostyle_glossary')] 모스크인 아디나는 아케이드와 돔으로 덮인 여러 구획이 둘러싼 큰 직사각형 안뜰을 중심으로 배치된다. 기도실은 페르시아 제국의 건축 양식을 연상시키는 거대한 원통형 궁륭으로 덮여 있다. 조각된 석조 [Glossary('전용 건축 부재','MA_spolia_glossary')]와 테라코타 꽃무늬가 외벽을 장식한다."
 MA_adina_mosque: "$building_type_MA_adina_mosque$"
 MA_hypostyle_glossary: "여러 줄의 기둥으로 지붕을 받쳐 넓고 트인 실내 공간을 만드는 건축 형식이다."
 MA_spolia_glossary: "이전 건물에서 가져와 새 용도로 사용한 건축 부재로, 종종 연속성과 정통성을 나타내기 위해 이용한다. 지중해 전역의 로마 유적에서 특히 흔하지만 그곳에만 국한되지는 않는다."
 
 #Chittorgarh
 MA_chittorgarh_district: "$building_type_MA_chittorgarh$"
 MA_chittorgarh_district_desc: "$building_type_MA_chittorgarh_desc$"
 building_type_MA_chittorgarh: "치토르가르"
 building_type_MA_chittorgarh_desc: "길고 고립된 언덕 꼭대기에 자리한 치토르 요새는 인도 최대 규모의 군사 기념물 가운데 하나다. 거대한 성벽이 수 마일에 걸쳐 고원 가장자리를 따라 이어지며, 궁전과 사원, 탑을 하나의 독립적인 성채 안에 감싼다."
 MA_chittorgarh: "$building_type_MA_chittorgarh$"
 
 #Lingaraj Temple
 MA_lingaraj_temple_district: "$building_type_MA_lingaraj_temple$"
 MA_lingaraj_temple_district_desc: "$building_type_MA_lingaraj_temple_desc$"
 building_type_MA_lingaraj_temple: "링가라지 사원"
 building_type_MA_lingaraj_temple_desc: "인도 사원 건축의 가장 뛰어난 사례 가운데 하나인 링가라지 단지는 점차 신성해지는 공간들이 하나의 축을 따라 배열되어 시바의 높이 솟은 곡선형 [Glossary('비마나','MA_vimana_glossary')]로 이어진다. 모든 표면은 조각된 신상과 꽃무늬 장식, 이야기 부조로 풍성하게 꾸며져 있다."
 MA_lingaraj_temple: "$building_type_MA_lingaraj_temple$"
 MA_vimana_glossary: "인도 사원의 내부 성소 바로 위로 솟은 높고 굽은 상부 구조로, 정교한 조각과 장식이 자주 새겨진다. 북인도에서는 이 양식을 #italic 시카라#!라 부르며, 남인도와 오디샤에서는 #italic 비마나#!라고 부른다."
 
 #Tsarevgrad
 MA_tsarevgrad1_district: "$building_type_MA_tsarevgrad1$"
 MA_tsarevgrad1_district_desc: "$building_type_MA_tsarevgrad1_desc$"
 building_type_MA_tsarevgrad1: "차레브그라드"
 building_type_MA_tsarevgrad1_desc: "얀트라강 위 험준한 고지는 주변 계곡을 통과하는 길목을 장악한다. 이 언덕 위의 성벽과 탑, 사원들은 천연 방어시설과 높은 회당을 갖춘 요새를 이루어 이 땅의 통치자들에게 어울리는 거처를 제공한다."
 MA_tsarevgrad1: "터르노보 구요새"
 MA_tsarevgrad2: "$building_type_MA_tsarevgrad1$"
 MA_tsarevets_glossary: "황제들의 도시라는 뜻으로, 높은 요새에서 통치하는 군주들의 제국적 야망과 신성한 권위를 나타내는 이름이다."
 
 #Orange Theater
 MA_orange_theater1_district: "$building_type_MA_orange_theater1$"
 MA_orange_theater1_district_desc: "$building_type_MA_orange_theater1_desc$"
 building_type_MA_orange_theater1: "오랑주 극장"
 building_type_MA_orange_theater1_desc: "오랑주의 우뚝 솟은 로마 시대 무대 벽은 거대한 반원형 석조 관람석 위로 높이 솟아 도시의 옛 영광을 기념한다. 아치와 기둥, 조각된 석조 장식은 황제 시대 건축가들의 솜씨를 증언하며, 그들의 통치가 끝난 수세기 뒤에도 시민들의 삶에 영향을 미친다."
 MA_orange_theater1: "오랑주 극장 유적"
 MA_orange_theater2: "$building_type_MA_orange_theater1$"
 MA_cavea_glossary: "울타리를 뜻하는 라틴어에서 유래한 용어로, 로마 극장이나 원형경기장의 계단식 반원형 관람석을 뜻한다."
 
 #Walls of Mesembria
 MA_walls_mesembria_district: "$building_type_MA_walls_mesembria$"
 MA_walls_mesembria_district_desc: "$building_type_MA_walls_mesembria_desc$"
 building_type_MA_walls_mesembria: "메셈브리아 성벽"
 building_type_MA_walls_mesembria_desc: "바위투성이 반도를 둘러싼 성벽은 그리스 시대의 기초 위에 로마와 비잔티움 황제들이 쏟은 노력으로 세워진 오랜 역사를 지닌다. 거대한 석조 성벽과 돌출된 탑, 견고하게 방어되는 성문이 항구와 도시를 본토에 잇는 좁은 지협을 지켜 이 정착지를 흑해 서부에서 가장 강력한 요새 항구 가운데 하나로 만든다."
 MA_walls_mesembria: "$building_type_MA_walls_mesembria$"
 
 #Sri Pada
 MA_sri_pada_district: "$building_type_MA_sri_pada$"
 MA_sri_pada_district_desc: "$building_type_MA_sri_pada_desc$"
 building_type_MA_sri_pada: "말라야산"
 building_type_MA_sri_pada_desc: "랑카의 숲 위로 뚜렷하게 솟아 있는 말라야의 가파른 화강암 봉우리는 주변 풍경을 압도한다. 정상에는 [Glossary('스리 파다','MA_sripada_glossary')]를 둘러싸고 세운 작은 성소가 있으며, 구름 위에서 기도하기 위해 굽이진 길을 오르는 순례자들의 행렬이 끊이지 않는다."
 MA_sri_pada: "$building_type_MA_sri_pada$"
 MA_sripada_glossary: "싱할라어로 \"신성한 발자국\"을 뜻하며, 전통적으로 부처가 이 산에 직접 남긴 발자국으로 여겨진다."
 
 #Palace of Palermo
 MA_palace_palermo1_district: "$building_type_MA_palace_palermo1$"
 MA_palace_palermo1_district_desc: "$building_type_MA_palace_palermo1_desc$"
 building_type_MA_palace_palermo1: "팔레르모 궁전"
 building_type_MA_palace_palermo1_desc: "팔레르모의 궁전과 별장들은 정원과 과수원, 그늘진 안뜰로 유명하다. 밝은 벽과 넓은 회당에는 도시를 거쳐 간 수많은 통치자들의 기억이 깃들어 있으며, 그들의 후원은 지중해의 여러 예술 전통을 부유하고 세련된 이곳에 모이게 했다."
 MA_palace_palermo1: "팔레르모의 별장"
 MA_palace_palermo2: "$building_type_MA_palace_palermo1$"
 MA_palace_balarm1: "발라름의 별장"
 MA_palace_panormus1: "파노르무스의 별장"
 MA_palace_balarm2: "발라름 궁전"
 MA_palace_panormus2: "파노르무스 궁전"
 MA_cassaro_glossary: "팔레르모의 가장 안쪽 중심부로, 사방을 요새화한 고대 페니키아인과 그리스인의 구역이다. 이름은 성을 뜻하는 라틴어 #italic Castrum#!에서 유래했으며, 아랍어 #italic al Qasr#!의 영향으로 더 변형되었다."
 
 #Cefalù Duomo
 MA_cefalu_duomo_district: "$building_type_MA_cefalu_duomo$"
 MA_cefalu_duomo_district_desc: "$building_type_MA_cefalu_duomo_desc$"
 building_type_MA_cefalu_duomo: "체팔루 두오모"
 building_type_MA_cefalu_duomo_desc: "체팔루의 석회암 절벽 위로 솟은 이 [Glossary('두오모','MA_duomo_glossary')]는 노르만 건축의 견고한 형태에 비잔티움과 이슬람 장식을 결합한다. 거대한 쌍둥이 탑이 넓은 서쪽 정면의 양옆에 서 있고, 넓은 내부의 성소 위에는 왕권과 신성한 위엄을 함께 선포하는 빛나는 황금 모자이크가 장식되어 있다."
 MA_cefalu_duomo: "$building_type_MA_cefalu_duomo$"
 MA_duomo_glossary: "신의 \"집\"을 뜻하는 라틴어 #italic domus#!에서 유래한 두오모는 이탈리아 도시의 중심 교회를 가리킨다. 흔히 \"대성당\"으로 잘못 번역되지만, 사실 이 명칭을 얻기 위해 반드시 주교가 머물 필요는 없다."
 
 #Athenaion of Syracuse
 MA_athenaion_district: "$building_type_MA_athenaion$"
 MA_athenaion_district_desc: "$building_type_MA_athenaion_desc$"
 building_type_MA_athenaion: "시라쿠사의 아테나이온"
 building_type_MA_athenaion_desc: "고대 아테나 신전 안에 세워진 이 교회는 원래 고대 건물의 상당 부분을 보존하고 있다. 신전의 내부 벽을 열어 넓은 신랑을 만들었으며, 거대한 도리스식 기둥과 외벽은 여전히 뚜렷하게 드러나 시칠리아 고전 시대 최고의 기념물 가운데 하나를 감싸고 있다."
 MA_athenaion: "$building_type_MA_athenaion$"
 
 #Cave of the Patriarchs
 MA_cave_patriarchs1_district: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs1_district_desc: "$building_type_MA_cave_patriarchs1_desc$"
 building_type_MA_cave_patriarchs1: "족장들의 동굴"
 building_type_MA_cave_patriarchs1_desc: "아브라함과 이사악, 야곱과 그 가족들이 잠들었다고 여겨지는 동굴 위에는 정교하게 다듬은 석회암으로 만든 거대한 헤로데 시대의 성역이 솟아 있다. 견고한 성벽 안에는 유대교도와 기독교도, 무슬림의 신앙을 보여 주는 사원과 기도 장소들이 있어 아래의 거룩한 무덤으로 순례자들을 불러들인다."
 MA_cave_patriarchs1: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs2: "족장들의 성소"
 MA_must_be_abrahamic: "[holder|E]는 $rf_abrahamic$ [religious_family|E]에 속해야 합니다."
 
 #Łysa Góra
 MA_lysa_gora1_district: "$building_type_MA_lysa_gora1$"
 MA_lysa_gora1_district_desc: "$building_type_MA_lysa_gora1_desc$"
 building_type_MA_lysa_gora1: "위사구라"
 building_type_MA_lysa_gora1_desc: "위사구라의 숲이 우거진 산비탈 위에는 거대한 석조 방벽의 고리로 둘러싸인 고대의 신성한 정상이 있다. 이 방벽은 인간의 속세와 그 너머의 성지를 구분한다. 이곳에서는 기도와 제물이 산을 오르는 사람들의 소망을 전하고, 엄숙한 봉우리는 통치자와 신앙이 바뀌어도 경외심을 불러일으킨다."
 MA_lysa_gora1: "민둥산"
 MA_lysa_gora2: "성십자가 수도원"

 #Dome of the Rock
 MA_templum_domini: "템플룸 도미니"
 
 #Mainz Cathedral
 MA_mainz_cathedral1_district: "$building_type_MA_mainz_cathedral1$"
 MA_mainz_cathedral1_district_desc: "$building_type_MA_mainz_cathedral1_desc$"
 building_type_MA_mainz_cathedral1: "마인츠 대주교좌"
 building_type_MA_mainz_cathedral1_desc: "마인츠 중심부의 거대한 대성당과 이를 둘러싼 회당과 예배당, 안뜰은 강력한 대주교의 거처를 이룬다. 이곳에서 사절들을 맞이하고 영지의 일을 처리하는 동안 종은 신자들에게 기도를 알린다. 석조 벽은 제단 너머 먼 곳까지 권력이 미치는 영주의 부와 권위를 선포한다."
 MA_mainz_cathedral1: "주교 지구"
 MA_mainz_cathedral2: "마인츠 대성당"
 
 #Ingelheim Palace
 MA_ingelheim_palace_district: "$building_type_MA_ingelheim_palace$"
 MA_ingelheim_palace_district_desc: "$building_type_MA_ingelheim_palace_desc$"
 building_type_MA_ingelheim_palace: "잉겔하임 궁전"
 building_type_MA_ingelheim_palace_desc: "프랑크 왕들이 세운 수많은 거처와 궁전 중에서 잉겔하임의 규모와 역사에 견줄 수 있는 곳은 거의 없다. 라인강 근처에 세워진 궁전은 특이한 반원형 구조를 따라 [Glossary('아울라 레기아','MA_aula_regia_glossary')]와 그 주변의 행정, 주거, 종교 건물들을 감싸고 있다. 우아한 아치와 전원 풍경은 이곳을 찾는 많은 이들에게 고대 로마의 별장을 연상시킨다."
 MA_ingelheim_palace: "$building_type_MA_ingelheim_palace$"
 MA_aula_regia_glossary: "로마에 존재했던 회당에서 영감을 받은 황궁의 거대한 접견실이자 알현실이다. 일반적으로 한쪽 끝에 앱스가 있는 길고 넓은 단일 신랑 형태의 회당이다."

 #Jewish Quarter of Worms
 MA_worms_jewish_quarter_district: "$building_type_MA_worms_jewish_quarter$"
 MA_worms_jewish_quarter_district_desc: "$building_type_MA_worms_jewish_quarter_desc$"
 building_type_MA_worms_jewish_quarter: "보름스 유대인 지구"
 building_type_MA_worms_jewish_quarter_desc: "라인란트에서 가장 중요한 유대인 공동체 중 하나가 자리한 이곳의 좁은 거리에는 가옥과 공방, 정교하게 다듬은 석재로 지어진 시나고그가 늘어서 있다. 마인츠 및 슈파이어와 더불어 이 도시는 유대 학문의 명망 높은 중심지로서, 유럽 전역에 걸친 아슈케나지 유대인의 종교적·지적 전통 발전에 기여하고 있다."
 MA_worms_jewish_quarter: "$building_type_MA_worms_jewish_quarter$"