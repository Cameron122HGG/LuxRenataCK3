 building_type_MA_piliers_desc: "강이 내려다보이고 햇빛이 비치는 도시의 가장 높은 곳에 세워진 이 기둥들은 우아하면서도 신비롭다. 한때 티투스 황제의 거대한 궁전 일부였다는 이들도 있지만, 로마인들이 오기 훨씬 전부터 바위에서 솟아났다는 이들도 있다."
