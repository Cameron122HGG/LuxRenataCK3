 building_type_MA_meroe_pyramids_desc: "누비아의 황금빛 모래 속에 자리한 신비로운 피라미드들은 잊힌 수호자처럼 우뚝 솟아 있다. 사막 바람이 비밀을 속삭이는 가운데, 정교한 장식과 애잔한 아름다움을 지닌 구조물들은 사라진 문명의 수수께끼를 풀려는 이들을 부른다."
