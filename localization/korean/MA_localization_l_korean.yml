 building_type_MA_wadirum: "와디 럼"
 building_type_MA_wadirum_desc: "이 광활하고 오래된 계곡은 오랫동안 신화와 전설의 원천이었고, 오늘날에도 신비로움에 싸여 있다. \n계곡에는 거대한 붉은 암벽이 사막의 바람에 맞서 높고 묵직하게 솟아 있으며, 그 견고함은 어떤 군대도 넘볼 수 없다. 가장 혹독한 시기에도 안전한 피난처를 제공한다."
