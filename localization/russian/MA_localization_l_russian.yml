 building_type_MA_skara_brae: "Скара-Брей"
 building_type_MA_skara_brae_desc: "Робко выглядывая из травянистого холма на продуваемом ветрами побережье, эта группа древних каменных жилищ наполовину погребена землёй. \nОвеваемая резким океанским ветром, она молчаливо стоит веками: её низкие стены обветшали, очаги остыли бесчисленные столетия назад, но здесь всё ещё живёт память о давно исчезнувших людях."
