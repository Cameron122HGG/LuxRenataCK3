 building_type_MA_red_white_monasteries: "Красный и Белый монастыри"
 building_type_MA_red_white_monasteries_desc: "Два древних коптских монастыря близ берегов Нила. Их стены сложены из камней столь выразительных оттенков, что дали обителям их имена: один глубокого земляного красного цвета, другой — светлый и сияющий. Уединённые, но не забытые, они хранят учёную и благочестивую христианскую традицию. В их капеллах звучат старинные песнопения, стены покрыты поблекшими фресками, а сама традиция восходит ко временам до прихода мусульманских завоевателей через пустыни и скалы Синая."
 MA_red_white_monasteries: "$building_type_MA_red_white_monasteries$"
 
 #Knossos
