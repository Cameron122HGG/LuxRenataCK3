 #Gagikashen
 MA_gagikashen_district: "$building_type_MA_gagikashen$"
 MA_gagikashen_district_desc: "$building_type_MA_gagikashen_desc$"
 building_type_MA_gagikashen: "Гагикашен"
 building_type_MA_gagikashen_desc: "Большая круглая церковь, посвящённая святому Григорию, возвышается на высотах Ани. Её строители вдохновлялись руинами Звартноцского собора. Высокий барабан тремя уступами поднимается над кольцами колонн и боковых часовен, окружающих центральное пространство удивительной гармонии и ясности."
 MA_gagikashen: "$building_type_MA_gagikashen$"
 
 #Saint Gall
