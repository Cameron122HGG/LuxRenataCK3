 building_type_MA_madinat_alzahra: "Мадинат-аз-Захра"
 building_type_MA_madinat_alzahra_desc: "Огромный дворцовый город, построенный у пологих предгорий в окрестностях Кордовы, призван явить великолепие двора халифа. Его сады, павильоны и залы приёмов расположены на широких террасах; стены из мрамора и яшмы покрыты тончайшей резьбой, а красота и роскошь этих мест вдохновляют поэтов воспевать высшие наслаждения жизни."
 MA_madinat_alzahra: "$building_type_MA_madinat_alzahra$"
 
 #Circus of Merida
 MA_circus_merida_district: "$building_type_MA_circus_merida$"
 MA_circus_merida_district_desc: "$building_type_MA_circus_merida_desc$"
 building_type_MA_circus_merida: "Цирк Мериды"
 building_type_MA_circus_merida_desc: "Остатки древнеримского цирка длинной узкой полосой тянутся по равнине за Меридой. Его очертания всё ещё видны по разрушающимся стенам и заросшим травой дорожкам, где редкие кипарисы дарят немного тени. Неподалёку, за пределами руин, выросла небольшая церковь с тихим кладбищем: место, утратившее прежнее назначение, обрело новое."
 MA_circus_merida: "$building_type_MA_circus_merida$"
 
 #Alhambra
 MA_alhambra1_district: "$building_type_MA_alhambra1$"
 MA_alhambra1_district_desc: "$building_type_MA_alhambra1_desc$"
 building_type_MA_alhambra1: "Альгамбра"
 building_type_MA_alhambra1_desc: "На пологом холме Сабика красные стены Альгамбры взирают на Гранаду и её плодородную равнину. Под их защитой городские правители находят убежище от врагов и летнего зноя, а башни и зубчатые стены возвещают об их власти над землями внизу."
 MA_alhambra2: "Новая цитадель"
 MA_alhambra3: "Дворы и сады"
 MA_alhambra4: "Львиный дворик"
 MA_alhambra1: "Красная крепость"
 
 #The Cologne Cathedral
 MA_cologne_cathedral1_district: "$building_type_MA_cologne_cathedral1$"
 MA_cologne_cathedral1_district_desc: "$building_type_MA_cologne_cathedral1_desc$"
 building_type_MA_cologne_cathedral1: "Кёльнский собор"
 building_type_MA_cologne_cathedral1_desc: "Великая церковь Кёльна, резиденция архиепископа и символ городской гордости. На протяжении веков её расширяли и перестраивали; здесь хранятся бесценные реликвии, привлекающие паломников издалека, а могучие стены торжественно возвышаются над крышами города."
 MA_cologne_cathedral1: "Старый Кёльнский собор"
 MA_cologne_cathedral2: "Два шпиля Кёльна"
 
 #Qutb Complex
 MA_qutb_complex1_district: "$building_type_MA_qutb_complex1$"
 MA_qutb_complex1_district_desc: "$building_type_MA_qutb_complex1_desc$"
 building_type_MA_qutb_complex1: "Комплекс Кутб"
 building_type_MA_qutb_complex1_desc: "В сердце Дели лежит древний священный участок, где правители воздвигали памятники и храмы, провозглашая свою веру и могущество. Резные колонны и дворы окружают великий железный столп Гуптов, чья тёмная поверхность переживает смену династий и богов."
 MA_qutb_complex1: "Железный столп"
 MA_qutb_complex2: "Великая мечеть Дели"
 MA_qutb_complex3: "Кутб-Минар"
 MA_qutb_complex4: "Алаи-Минар"
 
 #Sigiriya
 MA_sigiriya1_district: "$building_type_MA_sigiriya1$"
 MA_sigiriya1_district_desc: "$building_type_MA_sigiriya1_desc$"
 building_type_MA_sigiriya1: "Сигирия"
 building_type_MA_sigiriya1_desc: "Могучая одинокая скала возвышается над густыми джунглями; на её вершине находится древняя царская цитадель [Glossary('Сигирия','MA_sigiriya_glossary')]. Лестницы поднимаются мимо покрытых фресками стен и колоссальных Львиных ворот над террасными садами и бассейнами, свидетельствуя о честолюбии царей, сделавших небо своим домом."
 MA_sigiriya1: "Руины Сигирии"
 MA_sigiriya2: "Восстановленная Сигирия"
 MA_sigiriya_glossary: "Сингальское слово, буквально означающее \"Львиная скала\"."
 
 #Great Sanchi Stupa
 MA_sanchi_stupa_district: "$building_type_MA_sanchi_stupa$"
 MA_sanchi_stupa_district_desc: "$building_type_MA_sanchi_stupa_desc$"
 building_type_MA_sanchi_stupa: "Великая ступа Санчи"
 building_type_MA_sanchi_stupa_desc: "Этот массивный купол из камня и кирпича впервые был возведён по приказу могущественного императора Ашоки. С тех пор преемники расширяли комплекс, а время наносило ему раны. Он стоит на приподнятой террасе, окружённой резными ограждениями и украшенными #italics торанами#! — воротами, вокруг которых паломники обходят святыню в бесконечном благоговении."
 MA_sanchi_stupa: "$building_type_MA_sanchi_stupa$"
 
 #Vindhyagiri Hill
 MA_gommateshwara1_district: "$building_type_MA_gommateshwara1$"
 MA_gommateshwara1_district_desc: "$building_type_MA_gommateshwara1_desc$"
 building_type_MA_gommateshwara1: "Холм Виндхьягири"
 building_type_MA_gommateshwara1_desc: "Гранитные высоты Виндхьягири круто поднимаются над городом Шраванабелагола; их венчают джайнские святилища и дворы. Паломники босиком восходят по высеченным ступеням под перезвон колоколов; воздух наполнен запахом согретого солнцем камня."
 MA_gommateshwara2: "Колосс Гоматешвара"
 MA_gommateshwara1: "Храмы Виндхьягири"
 
 #Palace of Ghazni
 MA_ghazni_palace_district: "$building_type_MA_ghazni_palace$"
 MA_ghazni_palace_district_desc: "$building_type_MA_ghazni_palace_desc$"
 building_type_MA_ghazni_palace: "Газневидский дворец"
 building_type_MA_ghazni_palace_desc: "Эта царская резиденция за стенами Газни служит центром власти городского султана. Её залы расходятся от четырёхугольного двора с #italic айваном#!; они искусно отделаны резьбой, лепниной и разноцветными изразцами, вдохновлёнными персидским мастерством."
 MA_ghazni_palace: "$building_type_MA_ghazni_palace$"
 
 #Stupas of Anuradhapura
 MA_stupas_anuradhapura_district: "$building_type_MA_stupas_anuradhapura$"
 MA_stupas_anuradhapura_district_desc: "$building_type_MA_stupas_anuradhapura_desc$"
 building_type_MA_stupas_anuradhapura: "Ступы Анурадхапуры"
 building_type_MA_stupas_anuradhapura_desc: "В древнем храмовом городе Анурадхапура то тут, то там поднимаются огромные кирпичные [Glossary('ступы','MA_stupa_glossary')] сингальских царей, построенные для хранения реликвий Будды. Побелённые монастыри и центры учёности сияют под солнцем, а в их залах и дворах не умолкают споры."
 MA_stupas_anuradhapura: "$building_type_MA_stupas_anuradhapura$"
 
 #Eye of the Sahara
 MA_eye_sahara_district: "$building_type_MA_eye_sahara$"
 MA_eye_sahara_district_desc: "$building_type_MA_eye_sahara_desc$"
 building_type_MA_eye_sahara: "Глаз Сахары"
 building_type_MA_eye_sahara_desc: "Огромное кольцеобразное образование в сердце пустыни: его каменные круги простираются на многие мили среди песков. Издали оно напоминает громадный обветренный глаз, обращённый к небу, и служит ориентиром кочевникам и караванам, пересекающим бесплодные просторы. \nДревние легенды связывают его с некогда процветавшим городом, утопавшим в зелени и воде, но ныне поглощённым песками."
 MA_eye_sahara: "$building_type_MA_eye_sahara$"
 
 #Great Mosque of Mahdia
 MA_mahdia_mosque_district: "$building_type_MA_mahdia_mosque$"
 MA_mahdia_mosque_district_desc: "$building_type_MA_mahdia_mosque_desc$"
 building_type_MA_mahdia_mosque: "Великая мечеть Махдии"
 building_type_MA_mahdia_mosque_desc: "Возведённая на каменистом полуострове Махдии, эта строгая мечеть своими башнями из светлого камня напоминает крепость. \nЗа её стенами два изящных аркадных двора ведут к молитвенным залам, где верующие собираются под светлыми каменными арками."
 MA_mahdia_mosque: "$building_type_MA_mahdia_mosque$"
 
 #Saint Mark's of Zagreb
 MA_zagreb_church_district: "$building_type_MA_zagreb_church$"
 MA_zagreb_church_district_desc: "$building_type_MA_zagreb_church_desc$"
 building_type_MA_zagreb_church: "Церковь Святого Марка в Загребе"
 building_type_MA_zagreb_church_desc: "Построенная с участием итальянских и немецких мастеров, церковь Святого Марка возвышается над всем городом. Её романский план дополнен готическими пристройками, а порталы и стены богато расписаны библейскими сюжетами."
 MA_zagreb_church: "$building_type_MA_zagreb_church$"
 
 #Walls of Balkh
 MA_walls_balkh_district: "$building_type_MA_walls_balkh$"
 MA_walls_balkh_district_desc: "$building_type_MA_walls_balkh_desc$"
 building_type_MA_walls_balkh: "Стены Балха"
 building_type_MA_walls_balkh_desc: "На протяжении столетий цитадель Балха защищали две огромные круглые стены, охватывающие весь город одна внутри другой. Их земляные валы и башни служат оплотом против армий, несущихся через степь, и охраняют городские рынки и мастерские."
 MA_walls_balkh: "$building_type_MA_walls_balkh$"
 
 #Martand Sun Temple
 MA_martand_sun_temple_district: "$building_type_MA_martand_sun_temple$"
 MA_martand_sun_temple_district_desc: "$building_type_MA_martand_sun_temple_desc$"
 building_type_MA_martand_sun_temple: "Солнечный храм Мартанд"
 building_type_MA_martand_sun_temple_desc: "Возведённый на высоком плато Кашмирской долины, этот храм — один из древнейших, посвящённых божественному Солнцу. В центре располагается большое святилище, окружённое множеством малых часовен и рядами резных изображений богов и небесных существ. Во дворе с перистилем тихо лежит водоём, сияющий в солнечных лучах."
 MA_martand_sun_temple: "$building_type_MA_martand_sun_temple$"
 
 #Ruins of Aquae Sulis
 MA_aquae_sulis_ruins_district: "$building_type_MA_aquae_sulis_ruins$"
 MA_aquae_sulis_ruins_district_desc: "$building_type_MA_aquae_sulis_ruins_desc$"
 building_type_MA_aquae_sulis_ruins: "Руины Аква-Сулис"
 building_type_MA_aquae_sulis_ruins_desc: "#low Творения великанов обращаются в прах#! \nВокруг парящего священного источника лежат разрушенные остатки Аква-Сулис, где римляне некогда возвели великие термы и храмы из тёсаного камня. Разбитые стены, обрушившиеся арки и затопленные покои всё ещё обозначают упорядоченный план древнего комплекса; тёплые воды продолжают течь, а паломники и горожане собираются среди руин."
 MA_aquae_sulis_ruins: "$building_type_MA_aquae_sulis_ruins$"
 
 #Winchester Minster
 MA_winchester_minster_district: "$building_type_MA_winchester_minster$"
 MA_winchester_minster_district_desc: "$building_type_MA_winchester_minster_desc$"
 building_type_MA_winchester_minster: "Винчестерский собор"
 building_type_MA_winchester_minster_desc: "Великий минстер — огромная базилика из камня и дерева с широким расписным нефом и несколькими колокольнями. Он господствует над королевским городом, превосходя размерами все прочие сооружения, и служит хранителем гробниц королей Уэссекса."
 MA_winchester_minster: "$building_type_MA_winchester_minster$"
 
 #Westminster Abbey
 MA_westminster_abbey_district: "$building_type_MA_westminster_abbey$"
 MA_westminster_abbey_district_desc: "$building_type_MA_westminster_abbey_desc$"
 building_type_MA_westminster_abbey: "Вестминстерское аббатство"
 building_type_MA_westminster_abbey_desc: "Построенное у Темзы и щедро одарённое королями Англии, Вестминстерское аббатство представляет собой великую монастырскую церковь из камня. Её длинный неф и высокий хор украшены резными капителями и росписями. Здесь королей коронуют и предают земле, а аббатство служит священной сценой, на которой королевская власть соединяется с божественной милостью."
 MA_westminster_abbey: "$building_type_MA_westminster_abbey$"
 
 #Lorsch Gate
 MA_lorsch_gate_district: "$building_type_MA_lorsch_gate$"
 MA_lorsch_gate_district_desc: "$building_type_MA_lorsch_gate_desc$"
 building_type_MA_lorsch_gate: "Лоршские ворота"
 building_type_MA_lorsch_gate_desc: "Монументальная надвратная постройка Лоршского аббатства — редкий и тщательно исполненный образец каролингской архитектуры. Её симметричный фасад, сложенный из искусно отёсанного камня и кирпича, украшен полуколоннами, глухими арками и классическим орнаментом, напоминающим древнеримские образцы."
 MA_lorsch_gate: "$building_type_MA_lorsch_gate$"
 
 #Dover Castle
 MA_dover_castle_district: "$building_type_MA_dover_castle$"
 MA_dover_castle_district_desc: "$building_type_MA_dover_castle_desc$"
 building_type_MA_dover_castle: "Дуврский замок"
 building_type_MA_dover_castle_desc: "Крепость на белых скалах над узким проливом господствует над главными воротами между Англией и континентом. Её массивный каменный донжон, крепостные стены и многоступенчатые привратные укрепления образуют грозный оборонительный комплекс, контролирующий гавань и дороги в глубь страны, одновременно служа королевской твердыней и резиденцией."
 MA_dover_castle: "$building_type_MA_dover_castle$"
 
 #Château Gaillard
 MA_chateau_gaillard_district: "$building_type_MA_chateau_gaillard$"
 MA_chateau_gaillard_district_desc: "$building_type_MA_chateau_gaillard_desc$"
 building_type_MA_chateau_gaillard: "Шато-Гайар"
 building_type_MA_chateau_gaillard_desc: "Шато-Гайар, воздвигнутый на известняковом отроге над Сеной, — компактная и искусно спроектированная каменная крепость для активной обороны. Её концентрические стены, угловые башни и выдвинутые вперёд ворота сводят к минимуму мёртвые зоны и сосредоточивают обстрел на подступах. Возведённая быстро и точно, она воплощает новейшие достижения фортификационного искусства, обеспечивая контроль над рекой и нормандской границей."
 MA_chateau_gaillard: "$building_type_MA_chateau_gaillard$"
 
 #Carnac Stones
 MA_carnac_stones_district: "$building_type_MA_carnac_stones$"
 MA_carnac_stones_district_desc: "$building_type_MA_carnac_stones_desc$"
 building_type_MA_carnac_stones: "Карнакские камни"
 building_type_MA_carnac_stones_desc: "Сотни огромных камней разбросаны по равнине, выстроенные правильными рядами, уходящими к горизонту. Воздвигнутые в незапамятные времена, они давно утратили своё истинное предназначение, оставив лишь легенды и предания."
 MA_carnac_stones: "$building_type_MA_carnac_stones$"
 
 #Guérande Salt Marshes
 MA_guerande_salt_marshes_district: "$building_type_MA_guerande_salt_marshes$"
 MA_guerande_salt_marshes_district_desc: "$building_type_MA_guerande_salt_marshes_desc$"
 building_type_MA_guerande_salt_marshes: "Соляные болота Геранда"
 building_type_MA_guerande_salt_marshes_desc: "Вдоль низменного побережья у Геранда раскинулась сеть соляных бассейнов, дамб и каналов, где из морской воды добывают знаменитый деликатес #italic fleur de sel#!. Морскую воду направляют в мелкие водоёмы, где солнце выпаривает белую соль, поддерживая города и торговлю региона ремеслом, передаваемым из поколения в поколение."
 MA_guerande_salt_marshes: "$building_type_MA_guerande_salt_marshes$"
 
 #Reims Cathedral
 MA_reims_cathedral_district: "$building_type_MA_reims_cathedral$"
 MA_reims_cathedral_district_desc: "$building_type_MA_reims_cathedral_desc$"
 building_type_MA_reims_cathedral: "Реймсский собор"
 building_type_MA_reims_cathedral_desc: "Огромный готический собор с высоким нефом, стройными пучковыми опорами и многочисленными нервюрными сводами и аркбутанами. Его западный фасад богато украшен скульптурными порталами и глубокими архивольтами; внутри стены из витражного стекла подчёркивают высоту, свет и церемониальное величие, подобающее важнейшему месту коронации французских королей."
 MA_reims_cathedral: "$building_type_MA_reims_cathedral$"
 
 #Chartres Cathedral
 MA_chartres_cathedral_district: "$building_type_MA_chartres_cathedral$"
 MA_chartres_cathedral_district_desc: "$building_type_MA_chartres_cathedral_desc$"
 building_type_MA_chartres_cathedral: "Шартрский собор"
 building_type_MA_chartres_cathedral_desc: "Один из самых изящных и упорядоченных образцов устремлений высокой готики, Шартрский собор отличается широким нефом, мощными опорами и глубоким хором. Его стены почти полностью заменены витражами в прочном каркасном остове, а парные башни и тщательно выверенные пропорции выражают устойчивость, ясность и богословский замысел."
 MA_chartres_cathedral: "$building_type_MA_chartres_cathedral$"
 
 #Palace of Avignon
 MA_avignon_palace1_district: "$building_type_MA_avignon_palace1$"
 MA_avignon_palace1_district_desc: "$building_type_MA_avignon_palace1_desc$"
 building_type_MA_avignon_palace1: "Авиньонский дворец"
 building_type_MA_avignon_palace1_desc: "Этот великий дворец-крепость, возвышающийся на скалистом выступе над Роной, служит резиденцией утончённого и могущественного двора. Его залы, башни и сводчатые капеллы сочетают прочность с изяществом, а улицы внизу полны посланников, ремесленников и купцов, привлечённых богатством и властью его правителей."
 MA_avignon_palace1: "Старый дворец"
 MA_avignon_palace2: "Новый дворец"
 
 #Walls of Carcassonne
 MA_walls_carcassonne1_district: "$building_type_MA_walls_carcassonne1$"
 MA_walls_carcassonne1_district_desc: "$building_type_MA_walls_carcassonne1_desc$"
 building_type_MA_walls_carcassonne1: "Стены Каркассона"
 building_type_MA_walls_carcassonne1_desc: "Древние стены Каркассона охраняют долину и дороги между Иберией и Франкскими землями. Башни и мощные привратные укрепления венчают кольцо стен, защищая дома внутри и поля внизу. Это грозная твердыня на рубеже, который издавна оспаривают короли и веры."
 MA_walls_carcassonne1: "Древние стены Каркассона"
 MA_walls_carcassonne2: "Двойные стены Каркассона"
 
 #Saint-Denis Basilica
 MA_saint_denis_basilica1_district: "$building_type_MA_saint_denis_basilica1$"
 MA_saint_denis_basilica1_district_desc: "$building_type_MA_saint_denis_basilica1_desc$"
 building_type_MA_saint_denis_basilica1: "Базилика Сен-Дени"
 building_type_MA_saint_denis_basilica1_desc: "Воздвигнутая над местом погребения святого Дионисия, эта великая базилика служит святилищем королевского благочестия. Её широкий неф ведёт паломников к гробнице святого, а расписные стены и резные капители хранят покой королей, погребённых внизу. Здесь власть Короны и Церкви соединяется в камне."
 MA_saint_denis_basilica1: "Королевская базилика Сен-Дени"
 MA_saint_denis_basilica2: "Великий хор Сен-Дени"
 
 #Île de la Cité
 MA_ile_de_la_cite1_district: "$building_type_MA_ile_de_la_cite1$"
 MA_ile_de_la_cite1_district_desc: "$building_type_MA_ile_de_la_cite1_desc$"
 building_type_MA_ile_de_la_cite1: "Остров Сите"
 building_type_MA_ile_de_la_cite1_desc: "После падения Рима горожане нашли убежище на острове, окружённом водами излучины Сены. С тех пор, однако, Сите разросся, расцвёл и возгордился; теперь он является политическим, интеллектуальным и торговым сердцем Парижа, а вместе с ним и всей Франции."
 MA_ile_de_la_cite1: "Каролингский дворец"
 MA_ile_de_la_cite2: "Готический дворец"
 
 #Iron Gate
 MA_iron_gate_district: "$building_type_MA_iron_gate$"
 MA_iron_gate_district_desc: "$building_type_MA_iron_gate_desc$"
 building_type_MA_iron_gate: "Железные ворота"
 building_type_MA_iron_gate_desc: "Охраняя горный проход, связывающий равнину Оронта с высокими горными хребтами, Железные ворота образуют один из важнейших входов в Антиохию. Здесь стены сужаются в укреплённый проход с каменными башнями, воротами и подпорными стенами, прочно врезанными в скалу. Цитадель также служит своего рода плотиной, сдерживая поток Пармений и защищая город."
 MA_iron_gate: "$building_type_MA_iron_gate$"
 
 #Pula Amphitheater
 MA_pula_amphiteater_district: "$building_type_MA_pula_amphiteater$"
 MA_pula_amphiteater_district_desc: "$building_type_MA_pula_amphiteater_desc$"
 building_type_MA_pula_amphiteater: "Амфитеатр Пулы"
 building_type_MA_pula_amphiteater_desc: "Этот амфитеатр, построенный из тщательно обработанного известняка, сохранил полный облик римской арены: эллиптические стены, ярусы сидений и систему сводчатых коридоров под ними. Четыре угловые башни и прочные аркады отражают гордые инженерные традиции его строителей; сооружение продолжает быть центром власти, собраний и зрелищ в средневековом городе."
 MA_pula_amphiteater: "$building_type_MA_pula_amphiteater$"
 
 #Olympus
 MA_olympus_district: "$building_type_MA_olympus$"
 MA_olympus_district_desc: "$building_type_MA_olympus_desc$"
 building_type_MA_olympus: "Олимп"
 building_type_MA_olympus_desc: "Высокая гора в сердце Фессалии, чья зубчатая вершина — высочайшая во всей Греции — бросает длинные тени на море и пологие плодородные склоны. \nТысячелетиями люди почитают её как обитель богов; говорят, что вершину венчает их невидимый дворец."
 MA_olympus: "$building_type_MA_olympus$"
 
 #Ypres Cloth Hall
 MA_ypres_cloth_hall_district: "$building_type_MA_ypres_cloth_hall$"
 MA_ypres_cloth_hall_district_desc: "$building_type_MA_ypres_cloth_hall_desc$"
 building_type_MA_ypres_cloth_hall: "Суконные ряды Ипра"
 building_type_MA_ypres_cloth_hall_desc: "Этот обширный городской зал из камня и дерева возведён для надзора, хранения и торговли шерстяными тканями, на которых держится богатство города. Его длинный упорядоченный фасад украшен аркадами, фронтонами и господствующей над ними колокольней, соединяя торговое назначение с городской властью. В сводчатых залах купцы, представители гильдий и магистраты следят за договорами, мерами и налогами в самом сердце городской экономики."
 MA_ypres_cloth_hall: "$building_type_MA_ypres_cloth_hall$"
 
 #Gravensteen
 MA_gravensteen_district: "$building_type_MA_gravensteen$"
 MA_gravensteen_district_desc: "$building_type_MA_gravensteen_desc$"
 building_type_MA_gravensteen: "Гравенстен"
 building_type_MA_gravensteen_desc: "Этот внушительный каменный замок служит резиденцией графов Фландрии и символом графской власти над городом. Вокруг массивного донжона, окружённого толстыми крепостными стенами, объединены жилые залы, судебные палаты и военные укрепления, утверждающие сеньориальную власть среди тесной застройки Гента."
 MA_gravensteen: "$building_type_MA_gravensteen$"
 
 #Mount Ararat
 MA_ararat_district: "$building_type_MA_ararat$"
 MA_ararat_district_desc: "$building_type_MA_ararat_desc$"
 building_type_MA_ararat: "Гора Арарат"
 building_type_MA_ararat_desc: "Огромный вулканический массив поднимается над равнинами двумя вершинами; гора Арарат господствует над горизонтом, увенчанная вечными снегами. Почитаемая многими царствами и вероисповеданиями, она связана древним преданием с местом, где остановился Ноев ковчег, придавая священную значимость и торжественность землям у своих склонов."
 MA_ararat: "$building_type_MA_ararat$"
 
 #Székesfehérvár Basilica
 MA_szekesfehervar_basilica1_district: "$building_type_MA_szekesfehervar_basilica1$"
 MA_szekesfehervar_basilica1_district_desc: "$building_type_MA_szekesfehervar_basilica1_desc$"
 building_type_MA_szekesfehervar_basilica1: "Базилика Секешфехервара"
 building_type_MA_szekesfehervar_basilica1_desc: "Эта великая каменная базилика служит церемониальным и династическим сердцем Венгерского королевства. Под её сводами в широком нефе королей венчают на царство и предают земле, объединяя королевскую власть, закон и веру в главном королевском святилище страны."
 MA_szekesfehervar_basilica1: "Королевская базилика Секешфехервара"
 MA_szekesfehervar_basilica2: "Великий хор Секешфехервара"
 
 #Prague Castle
 MA_prague_castle1_district: "$building_type_MA_prague_castle1$"
 MA_prague_castle1_district_desc: "$building_type_MA_prague_castle1_desc$"
 building_type_MA_prague_castle1: "Пражский Град"
 building_type_MA_prague_castle1_desc: "На длинном хребте над Влтавой залы, церкви и дворы Пражского Града господствуют над городом внизу. Вокруг этой резиденции правителей Богемии собираются мастера, дружинники и духовенство; богатство и честолюбие государей превратили холм в политическое и духовное сердце их земель."
 MA_prague_castle1: "Княжеская резиденция Праги"
 MA_prague_castle2: "Королевский замок Праги"
 
 #Saint Adrian's Basilica
 MA_zalavar_basilica_district: "$building_type_MA_zalavar_basilica$"
 MA_zalavar_basilica_district_desc: "$building_type_MA_zalavar_basilica_desc$"
 building_type_MA_zalavar_basilica: "Базилика Святого Адриана"
 building_type_MA_zalavar_basilica_desc: "Базилика Святого Адриана, расположенная в центре каролингского укреплённого поселения среди болот реки Зала, — важнейшее церковное основание эпохи ранней христианизации региона. Трёхнефная каменная церковь с выраженным алтарным пространством и западными пристройками служит миссионерским центром и княжеским храмом, укрепляя дипломатическое влияние своего покровителя на приграничных землях."
 MA_zalavar_basilica: "$building_type_MA_zalavar_basilica$"
 
 #Baths of Hisham
 MA_baths_hisham_district: "$building_type_MA_baths_hisham$"
 MA_baths_hisham_district_desc: "$building_type_MA_baths_hisham_desc$"
 building_type_MA_baths_hisham: "Термы Хишама"
 building_type_MA_baths_hisham_desc: "Эти термы, составляющие часть большого дворцового комплекса, включают последовательность холодных, тёплых и горячих помещений, обогреваемых системой гипокауста и перекрытых каменными сводами. Полы обильно украшены геометрическими и фигурными мозаиками, особенно знаменитым изображением деревьев и животных, выполненным из мелких тессер с исключительным мастерством и вниманием к композиции."
 MA_baths_hisham: "$building_type_MA_baths_hisham$"
 
 #Peel Castle
 MA_peel_castle1_district: "$building_type_MA_peel_castle1$"
 MA_peel_castle1_district_desc: "$building_type_MA_peel_castle1_desc$"
 building_type_MA_peel_castle1: "Остров Святого Патрика"
 building_type_MA_peel_castle1_desc: "На скалистом острове Святого Патрика церкви, залы и кладбища обращены к окружающему морю. Здесь бок о бок встречаются древние местные традиции и вера новых поселенцев, а духовенство и правители делят тесное убежище, чьи защищённые берега соединяют богослужение и мирскую власть."
 MA_peel_castle1: "Монастырь острова Святого Патрика"
 MA_peel_castle2: "Зал Святого Патрика"
 MA_peel_castle3: "Замок Пил"
 
 #Knin Fortress
 MA_knin_fortress_district: "$building_type_MA_knin_fortress$"
 MA_knin_fortress_district_desc: "$building_type_MA_knin_fortress_desc$"
 building_type_MA_knin_fortress: "Книнская крепость"
 building_type_MA_knin_fortress_desc: "Протянувшаяся вдоль узкого известнякового хребта над долиной Крки крепость Книн представляет собой длинный, разделённый на части оборонительный комплекс из стен, башен и замкнутых дворов. Её положение позволяет контролировать дороги между побережьем и внутренними равнинами, делая её главной королевской твердыней региона."
 MA_knin_fortress: "$building_type_MA_knin_fortress$"
 
 #Amaravati Stupa
 MA_amaravati_stupa_district: "$building_type_MA_amaravati_stupa$"
 MA_amaravati_stupa_district_desc: "$building_type_MA_amaravati_stupa_desc$"
 building_type_MA_amaravati_stupa: "Ступа Амаравати"
 building_type_MA_amaravati_stupa_desc: "Великая древняя [Glossary('ступа','MA_stupa_glossary')], облицованная белыми известняковыми плитами, величайшая в дравидийской Индии. В кирпичной кладке вырезаны красочные повествовательные рельефы с эпизодами жизни Будды и сценами поклонения в медальонах и фризах. Ворота отмечают подходы с четырёх сторон света, направляя ритуальные обходы священного кургана."
 MA_amaravati_stupa: "$building_type_MA_amaravati_stupa$"
 MA_stupa_glossary: "Куполообразное сооружение, в котором хранятся реликвии; в буддийской практике служит местом медитации и поклонения. Первые ступы представляли собой простые насыпи, но со временем их облик и назначение менялись, повлияв на буддийскую архитектуру по всей Азии, возможно, даже на пагоды."
 
 #Karla Caves
 MA_karla_caves_district: "$building_type_MA_karla_caves$"
 MA_karla_caves_district_desc: "$building_type_MA_karla_caves_desc$"
 building_type_MA_karla_caves: "Пещеры Карла"
 building_type_MA_karla_caves_desc: "Высеченные непосредственно в склоне, пещеры Карла образуют комплекс скальных [Glossary('вихар','MA_vihara')] и святилищ вокруг большого зала чайтьи. Это обширное пространство отличается высоким сводчатым потолком с резными рёбрами, длинным нефом с колоннадами и [Glossary('ступой','MA_stupa_glossary')] в апсиде. Входной фасад украшен большой подковообразной аркой и скульптурными рельефами, отмечающими переход из внешнего мира в упорядоченное пространство ритуала и молитвы."
 MA_karla_caves: "$building_type_MA_karla_caves$"
 MA_vihara: "Разновидность буддийского храма с жилыми помещениями для монахов. В индийской архитектуре этот термин более конкретно обозначает центральный зал с примыкающими к нему кельями."
 
 #Somnath Temple
 MA_somnath_temple_district: "$building_type_MA_somnath_temple$"
 MA_somnath_temple_district_desc: "$building_type_MA_somnath_temple_desc$"
 building_type_MA_somnath_temple: "Храм Сомнатх"
 building_type_MA_somnath_temple_desc: "Большой каменный храм, посвящённый богу Луны, Сомнатх выстроен по продольной оси [Glossary('мандап','MA_mandapa')], ведущих к святилищу, над которым возвышается [Glossary('шикхара','MA_vimana_glossary')]. Его стены и столпы богато украшены изваяниями божеств, их спутников и орнаментальными поясами. Будучи выдающимся центром паломничества, он привлекает верующих со всего края, но также и завистливые взгляды языческих армий из-за Инда."
 MA_somnath_temple: "$building_type_MA_somnath_temple$"
 MA_mandapa: "Колонный зал или павильон в индийской архитектуре, служащий переходным пространством и входом в храм."
 
 #Devagiri
 MA_devagiri_district: "$building_type_MA_devagiri$"
 MA_devagiri_district_desc: "$building_type_MA_devagiri_desc$"
 building_type_MA_devagiri: "Девагири"
 building_type_MA_devagiri_desc: "Огромный вулканический холм резко поднимается над равнинами, а по его тёмным базальтовым склонам к вершине вьются узкие тропы. Известная как [Glossary('Девагири','MA_devagiri_glossary')], гора укрывает древние пещеры и святилища, а её господствующие высоты даруют грозное убежище своим владельцам."
 MA_devagiri: "$building_type_MA_devagiri$"
 MA_daulatabad: "Даулатабад"
 MA_devagiri_glossary: "В переводе с санскрита означает \"Холм богов\"."
 MA_daulatabad_glossary: "Обитель богатства."
 
 #Ashoka's Palace
 MA_ashoka_palace1_district: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_palace1_district_desc: "$building_type_MA_ashoka_palace1_desc$"
 building_type_MA_ashoka_palace1: "Дворец Ашоки"
 building_type_MA_ashoka_palace1_desc: "Дворец великого [Glossary('Ашоки','MA_ashoka_glossary')] свидетельствует о богатстве и могуществе древних царей Индии. Его широкие дворы и залы с колоннадами породили рассказы о необычайной роскоши; их масштаб и изящество служат достойным образцом для тех, кто стремится возродить былое величие."
 MA_ashoka_palace1: "Руины дворца Ашоки"
 MA_ashoka_palace2: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_glossary: "Третий император династии Маурьев, известный своим превращением из жестокого завоевателя в нравственного правителя, который поддерживал буддизм и широкую миссионерскую деятельность."
 
 #Adina Mosque
 MA_adina_mosque_district: "$building_type_MA_adina_mosque$"
 MA_adina_mosque_district_desc: "$building_type_MA_adina_mosque_desc$"
 building_type_MA_adina_mosque: "Мечеть Адина"
 building_type_MA_adina_mosque_desc: "Огромная [Glossary('гипостильная','MA_hypostyle_glossary')] мечеть из кирпича и камня, Адина устроена вокруг большого прямоугольного двора, окружённого аркадами и рядами купольных пролётов. Её молитвенный зал перекрыт монументальным цилиндрическим сводом, напоминающим императорскую архитектуру Персии. Внешние стены украшают резные каменные [Glossary('сполии','MA_spolia_glossary')] и терракотовые цветы."
 MA_adina_mosque: "$building_type_MA_adina_mosque$"
 MA_hypostyle_glossary: "Архитектурная конструкция, в которой кровлю поддерживают ряды колонн, образуя большое открытое внутреннее пространство."
 MA_spolia_glossary: "Архитектурные элементы, повторно использованные из более старых зданий, часто для подчёркивания преемственности и законности власти. Особенно характерны, но не исключительно, для римских руин Средиземноморья."
 
 #Chittorgarh
 MA_chittorgarh_district: "$building_type_MA_chittorgarh$"
 MA_chittorgarh_district_desc: "$building_type_MA_chittorgarh_desc$"
 building_type_MA_chittorgarh: "Читторгарх"
 building_type_MA_chittorgarh_desc: "Расположенная на вершине длинного уединённого холма крепость Читтор — один из крупнейших военных памятников Индии. Массивные стены на протяжении многих миль повторяют края плато, заключая в самостоятельную цитадель дворцы, храмы и башни."
 MA_chittorgarh: "$building_type_MA_chittorgarh$"
 
 #Lingaraj Temple
 MA_lingaraj_temple_district: "$building_type_MA_lingaraj_temple$"
 MA_lingaraj_temple_district_desc: "$building_type_MA_lingaraj_temple_desc$"
 building_type_MA_lingaraj_temple: "Храм Лингараджа"
 building_type_MA_lingaraj_temple_desc: "Один из величайших образцов индийского храмового зодчества, комплекс Лингараджа организован вдоль единой оси всё более священных пространств, ведущих к высокой криволинейной [Glossary('вимане','MA_vimana_glossary')] Шивы. Каждая поверхность украшена изваяниями божеств, растительными узорами и повествовательными рельефами."
 MA_lingaraj_temple: "$building_type_MA_lingaraj_temple$"
 MA_vimana_glossary: "Высокая изогнутая надстройка, поднимающаяся непосредственно над внутренним святилищем индийского храма, часто украшенная сложной резьбой и орнаментами. На севере этот стиль известен как #italic шикхара#!, а в Южной Индии и Одише называется #italic вимана#!."
 
 #Tsarevgrad
 MA_tsarevgrad1_district: "$building_type_MA_tsarevgrad1$"
 MA_tsarevgrad1_district_desc: "$building_type_MA_tsarevgrad1_desc$"
 building_type_MA_tsarevgrad1: "Царевград"
 building_type_MA_tsarevgrad1_desc: "Скалистые высоты над Янтрой господствуют над подходами через окружающие долины. На этих холмах стены, башни и храмы образуют твердыню, чьи природные укрепления и высокие залы достойны стать резиденцией правителей этих земель."
 MA_tsarevgrad1: "Старая крепость Тырново"
 MA_tsarevgrad2: "$building_type_MA_tsarevgrad1$"
 MA_tsarevets_glossary: "Город царей — название, напоминающее об императорских притязаниях и божественной власти правителей, управляющих этой страной из возвышающейся твердыни."
 
 #Orange Theater
 MA_orange_theater1_district: "$building_type_MA_orange_theater1$"
 MA_orange_theater1_district_desc: "$building_type_MA_orange_theater1_desc$"
 building_type_MA_orange_theater1: "Оранжский театр"
 building_type_MA_orange_theater1_desc: "Высокая римская стена сцены Оранжа поднимается над огромным каменным полукругом, монументальным напоминанием о древней славе города. Её арки, колонны и резная кладка свидетельствуют о мастерстве строителей цезарей и продолжают определять жизнь горожан спустя века после их правления."
 MA_orange_theater1: "Руины Оранжского театра"
 MA_orange_theater2: "$building_type_MA_orange_theater1$"
 MA_cavea_glossary: "От латинского слова, означающего ограду; ярусные полукруглые зрительские места римского театра или амфитеатра."
 
 #Walls of Mesembria
 MA_walls_mesembria_district: "$building_type_MA_walls_mesembria$"
 MA_walls_mesembria_district_desc: "$building_type_MA_walls_mesembria_desc$"
 building_type_MA_walls_mesembria: "Стены Месембрии"
 building_type_MA_walls_mesembria_desc: "Стены, окружающие скалистый полуостров, имеют долгую историю: их возводили на греческих основаниях и значительно укрепляли римские и византийские императоры. Массивные каменные стены, выступающие башни и хорошо защищённые ворота охраняют гавань и узкий перешеек, соединяющий город с материком, делая поселение одним из самых укреплённых портов западного Причерноморья."
 MA_walls_mesembria: "$building_type_MA_walls_mesembria$"
 
 #Sri Pada
 MA_sri_pada_district: "$building_type_MA_sri_pada$"
 MA_sri_pada_district_desc: "$building_type_MA_sri_pada_desc$"
 building_type_MA_sri_pada: "Гора Малая"
 building_type_MA_sri_pada_desc: "Гранитная вершина Малая круто возвышается над лесами Ланки, господствуя над окрестностями. На её вершине стоит небольшое святилище вокруг [Glossary('Шри-Пады','MA_sripada_glossary')], к которому бесконечной чередой поднимаются паломники по извилистым тропам, чтобы молиться над облаками."
 MA_sri_pada: "$building_type_MA_sri_pada$"
 MA_sripada_glossary: "Сингальское слово, означающее \"священный след\", который, согласно преданию, оставил на горе сам Будда."
 
 #Palace of Palermo
 MA_palace_palermo1_district: "$building_type_MA_palace_palermo1$"
 MA_palace_palermo1_district_desc: "$building_type_MA_palace_palermo1_desc$"
 building_type_MA_palace_palermo1: "Дворец Палермо"
 building_type_MA_palace_palermo1_desc: "Дворцы и виллы Палермо славятся своими садами, фруктовыми рощами и затенёнными дворами. Их светлые стены и просторные залы хранят память о многочисленных правителях города, чьё покровительство объединило художественные традиции Средиземноморья в обители богатства и утончённости."
 MA_palace_palermo1: "Виллы Палермо"
 MA_palace_palermo2: "$building_type_MA_palace_palermo1$"
 MA_palace_balarm1: "Виллы Баларма"
 MA_palace_panormus1: "Виллы Панорма"
 MA_palace_balarm2: "Дворец Баларма"
 MA_palace_panormus2: "Дворец Панорма"
 MA_cassaro_glossary: "Внутреннее ядро Палермо, древний финикийский и греческий квартал, укреплённый со всех сторон. Его название происходит от латинского слова, означающего замок, #italic Castrum#!, позднее приспособленного из арабского #italic al Qasr#!."
 
 #Cefalù Duomo
 MA_cefalu_duomo_district: "$building_type_MA_cefalu_duomo$"
 MA_cefalu_duomo_district_desc: "$building_type_MA_cefalu_duomo_desc$"
 building_type_MA_cefalu_duomo: "Кафедральный собор Чефалу"
 building_type_MA_cefalu_duomo_desc: "Этот [Glossary('дуомо','MA_duomo_glossary')], возвышающийся над известняковыми утёсами Чефалу, сочетает мощные формы нормандского зодчества с византийским и исламским убранством. Его массивные парные башни обрамляют широкий западный фасад, а просторный интерьер завершается над алтарём большой сияющей золотом мозаикой, провозглашающей королевскую власть и божественное величие."
 MA_cefalu_duomo: "$building_type_MA_cefalu_duomo$"
 MA_duomo_glossary: "От латинского #italic domus#!, означающего \"дом\" Бога, дуомо — главная церковь итальянского города. Его нередко ошибочно переводят как \"кафедральный собор\", хотя для такого названия церковь не обязательно должна быть резиденцией епископа."
 
 #Athenaion of Syracuse
 MA_athenaion_district: "$building_type_MA_athenaion$"
 MA_athenaion_district_desc: "$building_type_MA_athenaion_desc$"
 building_type_MA_athenaion: "Афинеон Сиракуз"
 building_type_MA_athenaion_desc: "Эта церковь, возведённая внутри древнего храма Афины, сохранила значительную часть античного сооружения. Во внутренних стенах храма прорубили проёмы, образовав широкий неф, а большие дорические колонны и наружные стены остались хорошо видны, обрамляя один из прекраснейших памятников античной Сицилии."
 MA_athenaion: "$building_type_MA_athenaion$"
 
 #Cave of the Patriarchs
 MA_cave_patriarchs1_district: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs1_district_desc: "$building_type_MA_cave_patriarchs1_desc$"
 building_type_MA_cave_patriarchs1: "Пещера Патриархов"
 building_type_MA_cave_patriarchs1_desc: "Над пещерой, где, по преданию, покоятся Авраам, Исаак, Иаков и их семьи, возвышается большая иродианская ограда из тщательно отёсанного известняка. За её прочными стенами храмы и места молитвы свидетельствуют о почитании этой святыни иудеями, христианами и мусульманами, привлекая паломников к священным гробницам внизу."
 MA_cave_patriarchs1: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs2: "Святилище Патриархов"
 MA_must_be_abrahamic: "[holder|E] должен принадлежать к [religious_family|E] $rf_abrahamic$"
 
 #Łysa Góra
 MA_lysa_gora1_district: "$building_type_MA_lysa_gora1$"
 MA_lysa_gora1_district_desc: "$building_type_MA_lysa_gora1_desc$"
 building_type_MA_lysa_gora1: "Лысая Гура"
 building_type_MA_lysa_gora1_desc: "Над лесистыми склонами Лысой Гуры находится древняя священная вершина, окружённая большим кольцом каменных валов, отделяющих мирское пространство людей от святой земли за ними. Здесь молитвы и подношения несут надежды тех, кто восходит на гору, чьи торжественные высоты внушают благоговение сквозь смену правителей и вер."
 MA_lysa_gora1: "Лысая гора"
 MA_lysa_gora2: "Монастырь Святого Креста"

 #Dome of the Rock
 MA_templum_domini: "Templum Domini"
 
 #Mainz Cathedral
 MA_mainz_cathedral1_district: "$building_type_MA_mainz_cathedral1$"
 MA_mainz_cathedral1_district_desc: "$building_type_MA_mainz_cathedral1_desc$"
 building_type_MA_mainz_cathedral1: "Резиденция архиепископа Майнца"
 building_type_MA_mainz_cathedral1_desc: "В сердце Майнца великий собор и окружающие его залы, капеллы и дворы образуют резиденцию могущественного архиепископа. Здесь принимают посланников и решают дела страны, пока колокола зовут верующих на молитву. Каменные стены свидетельствуют о богатстве и власти владыки, чьё могущество простирается далеко за пределы алтаря."
 MA_mainz_cathedral1: "Епископский квартал"
 MA_mainz_cathedral2: "Майнцский собор"
 
 #Ingelheim Palace
 MA_ingelheim_palace_district: "$building_type_MA_ingelheim_palace$"
 MA_ingelheim_palace_district_desc: "$building_type_MA_ingelheim_palace_desc$"
 building_type_MA_ingelheim_palace: "Ингельхаймский дворец"
 building_type_MA_ingelheim_palace_desc: "Среди многих резиденций и дворцов, построенных франкскими королями, лишь немногие могут сравниться с Ингельхаймом размерами и историей. Дворец у Рейна имеет необычный полукруглый план, охватывающий как [Glossary('Аулу Регию','MA_aula_regia_glossary')], так и примыкающие административные, жилые и религиозные здания. Его изящные арки и сельское окружение напоминают многочисленным гостям древнеримскую виллу."
 MA_ingelheim_palace: "$building_type_MA_ingelheim_palace$"
 MA_aula_regia_glossary: "Большой зал приёмов и тронный зал императорских дворцов, созданный по образцу залов, некогда существовавших в Риме. Обычно это большое продольное однонефное помещение с апсидой в одном конце."

 #Jewish Quarter of Worms
 MA_worms_jewish_quarter_district: "$building_type_MA_worms_jewish_quarter$"
 MA_worms_jewish_quarter_district_desc: "$building_type_MA_worms_jewish_quarter_desc$"
 building_type_MA_worms_jewish_quarter: "Еврейский квартал Вормса"
 building_type_MA_worms_jewish_quarter_desc: "Здесь обитает одна из важнейших еврейских общин Рейнской области, а вдоль узкой улицы тянутся жилые дома, мастерские и синагога, возведённая из тщательно отёсанного камня. Наряду с Майнцем и Шпайером город славится как средоточие еврейской учёности, способствуя развитию религиозных и интеллектуальных традиций ашкеназов по всей Европе."
 MA_worms_jewish_quarter: "$building_type_MA_worms_jewish_quarter$"