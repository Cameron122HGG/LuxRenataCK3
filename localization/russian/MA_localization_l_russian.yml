 MA_saint_gall_district_desc: "$building_type_MA_saint_gall_desc$"
 building_type_MA_saint_gall: "Санкт-Галлен"
 building_type_MA_saint_gall_desc: "Крупный монастырский комплекс, основанный на месте отшельнической кельи святого Галла на окраине алеманнских земель. Прославленный дисциплиной и порядком, он обладает #italic скрипторием#! и библиотекой исключительного качества, где монахи переписывают, переводят и сохраняют античные и священные тексты для учёных всего христианского мира."
 MA_saint_gall: "$building_type_MA_saint_gall$"
 
 #Sé of Lisbon
 MA_se_lisbon_district: "$building_type_MA_se_lisbon$"
 MA_se_lisbon_district_desc: "$building_type_MA_se_lisbon_desc$"
 building_type_MA_se_lisbon: "Лиссабонский собор Се"
 building_type_MA_se_lisbon_desc: "Массивный романский собор, возведённый на склонах над гаванью. Его толстые стены и узкие окна отражают неспокойные времена борьбы на Иберийском полуострове. Построенный после христианского отвоевания города на руинах старой мечети, собор хранит под каменными сводами мощи святого Винсента и встречает процессии в своём гулком нефе."
 MA_se_lisbon: "$building_type_MA_se_lisbon$"
 
 #Alto Douro Vineyards
 MA_alto_douro_district: "$building_type_MA_alto_douro$"
 MA_alto_douro_district_desc: "$building_type_MA_alto_douro_desc$"
 building_type_MA_alto_douro: "Виноградники Алту-Дору"
 building_type_MA_alto_douro_desc: "Террасные виноградники вырезаны на крутых склонах долины Дору, где каменные стены удерживают почву и собирают солнечное тепло. Виноград здесь впервые посадили ещё во времена римлян; с тех пор производимые здесь крепкие тёмные вина сплавляют вниз по реке на прибрежные рынки и ко дворам чужеземных владык."
 MA_alto_douro: "$building_type_MA_alto_douro$"
 
 #Fortifications on the Guadalquivir
 MA_guadalquivir_fortifications_district: "$building_type_MA_guadalquivir_fortifications$"
 MA_guadalquivir_fortifications_district_desc: "$building_type_MA_guadalquivir_fortifications_desc$"
 building_type_MA_guadalquivir_fortifications: "Укрепления Гвадалквивира"
 building_type_MA_guadalquivir_fortifications_desc: "Вдоль берегов Гвадалквивира протянулись укрепления, защищающие оживлённый порт Севильи башнями и воротами на каждом повороте. Особенно выделяется Торре-дель-Оро — двенадцатигранная сторожевая башня, покрытая золотистой известковой побелкой, сверкающей над рекой. Она служит и ориентиром для приближающихся кораблей, и предупреждением о могуществе города."
 MA_guadalquivir_fortifications: "$building_type_MA_guadalquivir_fortifications$"
 
 #Madinat al-Zahra
