 MA_knossos_ruins_district_desc: "$building_type_MA_knossos_ruins_desc$"
 building_type_MA_knossos_ruins: "Кносский дворец"
 building_type_MA_knossos_ruins_desc: "Древний Кносский дворец, обращённый к великолепному морю, хранит память о царях и древних мифах. Его просторные залы, колонны и фрески повествуют о далёкой эпохе богатства и могущества, завораживая путников и вдохновляя тех, кто мечтает занять место среди великих правителей Крита."
