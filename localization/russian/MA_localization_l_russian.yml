 #Saint Peter's Basilica
 MA_vatican_district: "$building_type_MA_vatican$"
 MA_vatican_district_desc: "$building_type_MA_vatican_desc$"
 building_type_MA_vatican: "Собор Святого Петра"
 building_type_MA_vatican_desc: "Святейшая из древних базилик, возведённых по приказу Константина в Риме, стоит над гробницей апостола, на котором была основана Церковь. \nМонументальный и вместе с тем изящный храм с высокими нефами, украшенными золотыми мозаиками и заморскими мраморами, принимает тысячи паломников со всего христианского мира, а вместе с ними — их богатства и влияние."
 MA_vatican: "$building_type_MA_vatican$"
 
 #Rock of Canossa
 MA_rock_canossa_district: "$building_type_MA_rock_canossa$"
 MA_rock_canossa_district_desc: "$building_type_MA_rock_canossa_desc$"
 building_type_MA_rock_canossa: "Скала Каносса"
 building_type_MA_rock_canossa_desc: "Этот грозный замок возведён на вершине крутого скалистого утёса и стал центром внушительной системы укреплений, охраняющих перевалы Апеннин. Из уединённой твердыни его господа наблюдают за долинами внизу, находя безопасность в убежище между камнем и небом."
 MA_rock_canossa: "$building_type_MA_rock_canossa$"
 
 #Hill of Tara
 MA_hill_tara_district: "$building_type_MA_hill_tara$"
 MA_hill_tara_district_desc: "$building_type_MA_hill_tara_desc$"
 building_type_MA_hill_tara: "Холм Тара"
 building_type_MA_hill_tara_desc: "Травянистый холм, защищённый рвами и земляными валами и окружённый древними резными камнями, — священная резиденция верховных королей Ирландии. Хотя здесь нет каменных стен, сама земля исполнена силы и привлекает людей со всего острова."
 MA_hill_tara: "$building_type_MA_hill_tara$"
 
 #Clonmacnoise
 MA_clonmacnoise_district: "$building_type_MA_clonmacnoise$"
 MA_clonmacnoise_district_desc: "$building_type_MA_clonmacnoise_desc$"
 building_type_MA_clonmacnoise: "Клонмакнойс"
 building_type_MA_clonmacnoise_desc: "Большой монастырь, основанный на берегу широкой реки Шаннон; его каменная церковь и высокая круглая башня торжественно поднимаются над продуваемыми ветрами равнинами. Со временем он стал одним из важнейших центров учёности острова, привлекая учёных и паломников из далёких краёв."
 MA_clonmacnoise: "$building_type_MA_clonmacnoise$"
 
 #White Stupa of Gaochang
 MA_white_stupa_district: "$building_type_MA_white_stupa$"
 MA_white_stupa_district_desc: "$building_type_MA_white_stupa_desc$"
 building_type_MA_white_stupa: "Белая ступа Гаочана"
 building_type_MA_white_stupa_desc: "Возведённая по повелению имперских властей, чтобы обозначить пределы Срединного царства, эта сияющая [Glossary('ступа','MA_stupa_glossary')] одиноко возвышается над выжженными песками пустыни. Её большой округлый белый купол и позолоченный шпиль многим обязаны тибетским и индийским храмам, но в конструкции присутствуют и традиционные китайские элементы, например деревянное основание."
 MA_white_stupa: "$building_type_MA_white_stupa$"
 
 #Khan Tengri
 MA_khan_tengri_district: "$building_type_MA_khan_tengri$"
 MA_khan_tengri_district_desc: "$building_type_MA_khan_tengri_desc$"
 building_type_MA_khan_tengri: "Хан-Тенгри"
 building_type_MA_khan_tengri_desc: "Эта величественная мраморная пирамида, которую народы степей называют #italic Повелителем неба#!, с совершенной симметрией возвышается над окружающими горами. Её склоны покрыты вечными снегами, багровеющими в сумерках и золотящимися на заре; под ясным голубым небосводом она образует священную ось между землёй и небом."
 MA_khan_tengri: "$building_type_MA_khan_tengri$"
 
 #Singing Dunes
 MA_singing_dunes_district: "$building_type_MA_singing_dunes$"
 MA_singing_dunes_district_desc: "$building_type_MA_singing_dunes_desc$"
 building_type_MA_singing_dunes: "Поющие барханы"
 building_type_MA_singing_dunes_desc: "В нескольких переходах от оазиса над бесплодной степью поднимается огромный песчаный полумесяц, из которого ветер извлекает долгие, завораживающие звуки, будто сама земля обрела голос. Кочевники, идущие древними дорогами Азии, останавливаются послушать: они верят, что поют духи, а поэты из дальних земель находят в этой музыке вдохновение."
 MA_singing_dunes: "$building_type_MA_singing_dunes$"
 
 #Dakhma of Gurganj
 MA_dakhma_district: "$building_type_MA_dakhma$"
 MA_dakhma_district_desc: "$building_type_MA_dakhma_desc$"
 building_type_MA_dakhma: "Дахма Гурганджа"
 building_type_MA_dakhma_desc: "Эта большая круглая #italic дахма#!, или башня молчания, венчает одинокую возвышенность над равниной. Когда-то зороастрийцы оставляли здесь покойников под очищающими небом и солнцем, но с каждым летом верующих становится всё меньше. Теперь башня всё реже видит погребальные обряды и всё чаще — часовых: её высота и форма лучше подходят для наблюдения, чем для поклонения. \n\n#help Башня даёт дополнительные эффекты, если её владелец или население исповедуют [faith|E] с обрядом #game_link Небесные погребения#!#!"
 MA_dakhma: "$building_type_MA_dakhma$"
 
 #Black Ruins
 MA_karabalgasun_district: "$building_type_MA_karabalgasun$"
 MA_karabalgasun_district_desc: "$building_type_MA_karabalgasun_desc$"
 building_type_MA_karabalgasun: "Чёрные руины"
 building_type_MA_karabalgasun_desc: "Разбитые земляные стены и обломанные колонны — всё, что осталось от некогда могучего дворца в самом сердце одной из величайших степных империй. Ветер воет в пустых дворах, резные камни наполовину погребены травой и пылью, но путники всё ещё проходят здесь и называют это место #italic Карабалгасун#! — Чёрные руины."
 MA_karabalgasun: "$building_type_MA_karabalgasun$"
 
 #City of the Army
 MA_ordu_district: "$building_type_MA_ordu$"
 MA_ordu_district_desc: "$building_type_MA_ordu_desc$"
 building_type_MA_ordu: "Город войска"
 building_type_MA_ordu_desc: "Большой город купцов, придворных и лошадей стоит на перекрёстке дорог Европы и Азии. \nЗа земляными валами и широким рвом вдоль улицы с колоннадой раскинулись многочисленные шатры и храмы. Дорога ведёт к позолоченному шатру великого повелителя Степи, правящего из этой резиденции."
 MA_ordu: "$building_type_MA_ordu$"
 
 #Kurgan of the Rider
 MA_kurgan_district: "$building_type_MA_kurgan$"
 MA_kurgan_district_desc: "$building_type_MA_kurgan_desc$"
 building_type_MA_kurgan: "Курган всадника"
 building_type_MA_kurgan_desc: "Местные жители рассказывают о великом всаднике, некогда странствовавшем по этим землям, чей дух до сих пор скачет по степи. \nГоворят, его похоронили в кургане — огромном земляном холме, окружённом кольцом камней, отмечающих границы его владений. Всё меньше людей помнит его имя, но курган по-прежнему противостоит ветрам и времени."
 MA_kurgan: "$building_type_MA_kurgan$"
 
 #Cliffs of Ustyurt
 MA_ustyurt_cliffs_district: "$building_type_MA_ustyurt_cliffs$"
 MA_ustyurt_cliffs_district_desc: "$building_type_MA_ustyurt_cliffs_desc$"
 building_type_MA_ustyurt_cliffs: "Устюртские чинкú"
 building_type_MA_ustyurt_cliffs_desc: "Эти выветренные утёсы отделяют пустынное плато от берегов внутреннего моря; их пересекают каньоны и пронизывают пещеры. Суровая безводная земля заставила охотников приспособиться и создавать #italic араны#! — каменные ловушки, направляющие дикие стада в узкие проходы, превращая скалы в безмолвный театр смерти."
 MA_ustyurt_cliffs: "$building_type_MA_ustyurt_cliffs$"
 
 #White Fortress
 MA_sarkel_district: "$building_type_MA_sarkel$"
 MA_sarkel_district_desc: "$building_type_MA_sarkel_desc$"
 building_type_MA_sarkel: "Белая крепость"
 building_type_MA_sarkel_desc: "Великая твердыня из белого известняка и кирпича, #italic Саркел#! — Белая крепость — была воздвигнута на левом берегу Дона, когда каган попросил римского императора прислать инженеров для укрепления северной границы своих владений. Теперь она господствует над важным волоком между Доном и Волгой, распространяя военную силу далеко на север и защищая важные торговые пути региона."
 MA_sarkel: "$building_type_MA_sarkel$"
 
 #Nilometer
 MA_nilometer_district: "$building_type_MA_nilometer$"
 MA_nilometer_district_desc: "$building_type_MA_nilometer_desc$"
 building_type_MA_nilometer: "Нилометр"
 building_type_MA_nilometer_desc: "Узкая каменная камера, устроенная на илистом берегу, позволяет лучше измерять подъёмы и спады уровня Нила и планировать посевы. Её строительство приказали новые мусульманские правители, продолжая древний местный обычай и связывая разливы реки и благосостояние с государственным порядком."
 MA_nilometer: "$building_type_MA_nilometer$"
 
 #Abu Simbel
 MA_abu_simbel_district: "$building_type_MA_abu_simbel$"
 MA_abu_simbel_district_desc: "$building_type_MA_abu_simbel_desc$"
 building_type_MA_abu_simbel: "Абу-Симбел"
 building_type_MA_abu_simbel_desc: "Колоссальные статуи, высеченные древними фараонами много поколений назад, выступают из каменистых дюн, и их размеры по сей день не имеют равных во всём мире. \nВсякий, кто видит их величие, будь то простой путник или великий король, невольно вдохновляется историей, которую они рассказывают."
 MA_abu_simbel: "$building_type_MA_abu_simbel$"
 
 #Red and White Monasteries
 MA_red_white_monasteries_district: "$building_type_MA_red_white_monasteries$"
