 building_type_MA_paestum: "Руины Пестума"
 building_type_MA_paestum_desc: "Остатки некогда великого древнего города лежат среди диких трав и тишины; колоссальные колонны его храмов разбиты и расколоты. Город постепенно опустел после того, как соседняя река превратила окрестности в болото, и теперь немногие осмеливаются вступить в эти нездоровые земли."
 MA_paestum: "$building_type_MA_paestum$"
 
