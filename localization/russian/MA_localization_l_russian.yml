l_russian:
 #################
 ##MEDIEVAL ARTS##
 #################

 ###########
 #GAME RULE#
 game_rule_category_MedievalArts: "Medieval Arts"
 rule_MA_monuments: "$game_rule_category_MedievalArts$: Памятники"
 setting_MA_monuments_all: "Приоритет $game_rule_category_MedievalArts$"
 setting_MA_monuments_all_desc: "#help Рекомендуется:#! При совпадении [special_buildings|E] из #V $game_rule_category_MedievalArts$#! имеют приоритет над постройками основной игры."
 setting_MA_monuments_selection: "Приоритет основной игры"
 setting_MA_monuments_selection_desc: "При совпадении [special_buildings|E] из #V основной игры#! имеют приоритет над постройками $game_rule_category_MedievalArts$."
 rule_MA_ahistorical_monuments: "$game_rule_category_MedievalArts$: Историческая достоверность"
 setting_MA_ahistorical_monuments_yes: "Допустить неправдоподобные памятники"
 setting_MA_ahistorical_monuments_yes_desc: "#help Рекомендуется:#! Разрешены [special_buildings|E], которые могут считаться #italic исторически неправдоподобными#!."
 setting_MA_ahistorical_monuments_no: "Исключить неправдоподобные памятники"
 setting_MA_ahistorical_monuments_no_desc: "[special_buildings|E], которые могут считаться #italic исторически неправдоподобными#!, #bold запрещены#!."
 rule_MA_creator_pack: "$game_rule_category_MedievalArts$: Дополнения"
 setting_MA_creator_pack_yes: "Приоритет дополнений"
 setting_MA_creator_pack_yes_desc: "#help Рекомендуется:#! При наличии соответствующих дополнений [special_buildings|E] из #V дополнений#!, таких как #V Священные сооружения#!, имеют приоритет над постройками $game_rule_category_MedievalArts$."
 setting_MA_creator_pack_no: "$setting_MA_monuments_all$"
 setting_MA_creator_pack_no_desc: "При совпадении [special_buildings|E] из #V $game_rule_category_MedievalArts$#! имеют приоритет над постройками из #V дополнений#!."

 
 ###################
 #SPECIAL BUILDINGS#

 #Rock of Cashel
 MA_rock_cashel_district: "$building_type_MA_rock_cashel$"
 MA_rock_cashel_district_desc: "$building_type_MA_rock_cashel_desc$"
 building_type_MA_rock_cashel: "Скала Кашел"
 building_type_MA_rock_cashel_desc: "Возведённая на скалистом холме среди зелёных пастбищ, скала Кашел представляет собой неприступную каменную крепость, окружённую множеством стен и способную служить и замком, и дворцом. Здесь также находится один из самых влиятельных монастырей Ирландии и дворцовая капелла, свод которой украшен прекрасными фресками с изображениями жития святого Патрика."
 MA_rock_cashel: "$building_type_MA_rock_cashel$"
 
 #St Donatus of Zadar
 MA_st_donatus_district: "$building_type_MA_st_donatus$"
 MA_st_donatus_district_desc: "$building_type_MA_st_donatus_desc$"
 building_type_MA_st_donatus: "Церковь Святого Доната в Задаре"
 building_type_MA_st_donatus_desc: "Великолепная круглая церковь из белого камня сверкает на солнце над волнами Адриатики. Её облик вдохновлён дворцовой капеллой Карла Великого, а внутреннее убранство украшает прекрасная золотая мозаика."
 MA_st_donatus: "$building_type_MA_st_donatus$"
 
 #Aula Palatina
 MA_aula_palatina_district: "$building_type_MA_aula_palatina$"
 MA_aula_palatina_district_desc: "$building_type_MA_aula_palatina_desc$"
 building_type_MA_aula_palatina: "Аула Палатина"
 building_type_MA_aula_palatina_desc: "Колоссальный кирпичный зал, построенный Константином Великим для собственного #italic palatium#!. \nЕго размеры почти не имеют равных на континенте, а воплощённое в нём инженерное мастерство неизменно служит источником вдохновения."
 MA_aula_palatina: "$building_type_MA_aula_palatina$"
 
 #Jokhang Temple
 MA_jokhang_district: "$building_type_MA_jokhang$"
 MA_jokhang_district_desc: "$building_type_MA_jokhang_desc$"
 building_type_MA_jokhang: "Храм Джоканг"
 building_type_MA_jokhang_desc: "Древнейший и самый таинственный храм всего Тибета — величественное собрание дворов и святилищ в самом сердце Страны богов."
 MA_jokhang: "$building_type_MA_jokhang$"
 
 #Dongola Throne Hall
 MA_dongola_hall_district: "$building_type_MA_dongola_hall$"
 MA_dongola_hall_district_desc: "$building_type_MA_dongola_hall_desc$"
 building_type_MA_dongola_hall: "Тронный зал Донголы"
 building_type_MA_dongola_hall_desc: "Большой дворец, возведённый на вершине скалистого холма, откуда открывается вид на окружающую равнину и Нил. \nОн предназначен для торжественных церемоний и призван поражать посланников и путешественников: по монументальной лестнице, украшенной великолепными фресками нубийских и греческих мастеров, они поднимаются в величественный тронный зал верхнего этажа."
 MA_dongola_hall: "$building_type_MA_dongola_hall$"
 
 #Cathedral of Hildesheim
 MA_hildesheim_cathedral_district: "$building_type_MA_hildesheim_cathedral$"
 MA_hildesheim_cathedral_district_desc: "$building_type_MA_hildesheim_cathedral_desc$"
 building_type_MA_hildesheim_cathedral: "Церковь Святого Михаила в Хильдесхайме"
 building_type_MA_hildesheim_cathedral_desc: "Эта базилика возведена, чтобы явить могущество и величие своего римского короля: расписной деревянный потолок и полуциркульные арки придают ей торжественный, императорский облик. В строительстве участвовали мастера и рабочие с Рейна и из Италии; внутри находятся бронзовые двери и массивная бронзовая колонна, искусно украшенные рельефами."
 MA_hildesheim_cathedral: "$building_type_MA_hildesheim_cathedral$"
 
 #Toulouse Cathedral
 MA_toulouse_basilica_district: "$building_type_MA_toulouse_basilica$"
 MA_toulouse_basilica_district_desc: "$building_type_MA_toulouse_basilica_desc$"
 building_type_MA_toulouse_basilica: "Тулузская базилика"
 building_type_MA_toulouse_basilica_desc: "Величественная базилика, один из крупнейших соборов к северу от Альп. Она построена из кирпича, которого много в этих краях, и представляет собой подлинное творение романского зодчества, вдохновлённое древнеримскими руинами Южной Франции и украшенное ломбардскими полосами, полуциркульными арками и колоннами из вторично использованных античных материалов."
 MA_toulouse_basilica: "$building_type_MA_toulouse_basilica$"
 
 #The Durham Cathedral
 MA_durham_cathedral_district: "$building_type_MA_durham_cathedral$"
 MA_durham_cathedral_district_desc: "$building_type_MA_durham_cathedral_desc$"
 building_type_MA_durham_cathedral: "Даремский собор"
 building_type_MA_durham_cathedral_desc: "Величественный Даремский собор возвышается над болотистым полуостровом на реке Уир, где, по легенде, две доярки обнаружили неподвижную гробницу святого Кутберта. Его нервюрные своды, задуманные мастерами с обоих берегов Ла-Манша, стали беспримерным для Англии достижением инженерного искусства. Собор возведён над лесами и речными берегами города из камня, добытого в скалах внизу."
 MA_durham_cathedral: "$building_type_MA_durham_cathedral$"
 
 #The Castel del Monte
 MA_castel_monte_district: "$building_type_MA_castel_monte$"
 MA_castel_monte_district_desc: "$building_type_MA_castel_monte_desc$"
 building_type_MA_castel_monte: "Кастель-дель-Монте"
 building_type_MA_castel_monte_desc: "Изящный охотничий дворец на пологом апулийском холме. \nЕго необычный план представляет собой восьмиугольник с восьмиугольными башнями по углам, объединяя черты классической и готической архитектуры. \nСуровый геометрический облик снаружи резко контрастирует с роскошным убранством внутренних покоев, полных гобеленов, ковров, картин и резных капителей."
 MA_castel_monte: "$building_type_MA_castel_monte$"
 
 #The Belfry of Bruges
 MA_belfort_district: "$building_type_MA_belfort$"
 MA_belfort_district_desc: "$building_type_MA_belfort_desc$"
 building_type_MA_belfort: "Белфорт Брюгге"
 building_type_MA_belfort_desc: "Поразительная готическая дозорная башня возвышается над рыночной площадью Брюгге, определяя ритм жизни всего города. Эта огромная башня со шпилями и статуями сложена из кирпича и камня: над прямоугольным основанием поднимается восьмиугольный верхний ярус, где размещаются колокола."
 MA_belfort: "$building_type_MA_belfort$"
 
 #The Strasbourg Cathedral
 MA_strasbourg_cathedral1_district: "$building_type_MA_strasbourg_cathedral1$"
 MA_strasbourg_cathedral1_district_desc: "$building_type_MA_strasbourg_cathedral1_desc$"
 building_type_MA_strasbourg_cathedral1: "Страсбургский собор"
 building_type_MA_strasbourg_cathedral1_desc: "Вдохновлённый великими церквями Западной и Восточной Франкии, Страсбургский собор обязан своим великолепием богатству горожан и покровительству их сеньора. Его стены из розоватого песчаника сияют в лучах вечернего солнца, возвышаясь над тесной площадью и фахверковыми домами, а бронзовые колокола разносят по ветру свой перезвон."
 MA_strasbourg_cathedral1: "Страсбургский собор"
 MA_strasbourg_cathedral2: "$MA_strasbourg_cathedral1$"
 
 #Koutoubia Mosque
 MA_koutoubia_district: "$building_type_MA_koutoubia$"
 MA_koutoubia_district_desc: "$building_type_MA_koutoubia_desc$"
 building_type_MA_koutoubia: "Мечеть Кутубия"
 building_type_MA_koutoubia_desc: "Минaрет этой мечети — образцовый шедевр мавританского зодчества, вдохновляющий строителей по всему исламскому миру."
 MA_koutoubia: "$building_type_MA_koutoubia$"
 
 #Parigoritissa
 MA_parigoritissa_district: "$building_type_MA_parigoritissa$"
 MA_parigoritissa_district_desc: "$building_type_MA_parigoritissa_desc$"
 building_type_MA_parigoritissa: "Богородица Паригоритисса"
 building_type_MA_parigoritissa_desc: "План этой церкви, посвящённой Пресвятой Богородице, вдохновлён античными идеалами симметрии и геометрической завершённости. Почти идеальный квадрат сосредоточен вокруг восьмиугольного купола, опирающегося на столбы; по углам расположены четыре небольшие часовни."
 MA_parigoritissa: "$building_type_MA_parigoritissa$"
 
 #Rotunda
 MA_rotunda_district: "$building_type_MA_rotunda$"
 MA_rotunda_district_desc: "$building_type_MA_rotunda_desc$"
 building_type_MA_rotunda: "Ротонда Салоник"
 building_type_MA_rotunda_desc: "Колоссальное купольное сооружение, вдохновлённое римским Пантеоном. \nЕго интерьер украшен мозаиками необычайного мастерства и красоты: их золотые #italic тессеры#! переливаются в солнечных лучах, проникающих сквозь окулюс. \nКолоннада соединяет постройку с массивной мраморной аркой, воздвигнутой покойным цезарем Галерием."
 MA_rotunda: "$building_type_MA_rotunda$"
 
 #The Nikaea Walls
 MA_nikaea_walls_district: "$building_type_MA_nikaea_walls$"
 MA_nikaea_walls_district_desc: "$building_type_MA_nikaea_walls_desc$"
 building_type_MA_nikaea_walls: "Стены Никеи"
 building_type_MA_nikaea_walls_desc: "Возведённые цезарями много веков назад, эти неприступные двойные стены защищают путь к Константинополю."
 MA_nikaea_walls: "$building_type_MA_nikaea_walls$"
 
 #The Ephesus Basilica
 MA_ephesus_basilica_district: "$building_type_MA_ephesus_basilica$"
 MA_ephesus_basilica_district_desc: "$building_type_MA_ephesus_basilica_desc$"
 building_type_MA_ephesus_basilica: "Эфесская базилика"
 building_type_MA_ephesus_basilica_desc: "Огромная базилика, воздвигнутая при Юстиниане над местом погребения #italic апостола Иоанна#!. \nЕё стены из кирпича и тёсаного камня поддерживают изящные мраморные колонны с Проконнеса, а богатое убранство сверкает золотыми мозаиками."
 MA_ephesus_basilica: "$building_type_MA_ephesus_basilica$"
 
 #Arles Amphiteatre
 MA_arles_amphiteatre_district: "$building_type_MA_arles_amphiteatre$"
 MA_arles_amphiteatre_district_desc: "$building_type_MA_arles_amphiteatre_desc$"
 building_type_MA_arles_amphiteatre: "Амфитеатр Арля"
 building_type_MA_arles_amphiteatre_desc: "Возведённая много веков назад, эта огромная арена остаётся центром жизни Арля. \nВ её каменных стенах горожане устроили башни, часовни и жилища, поселившись на песчаном поле, где некогда гладиаторы убивали друг друга ради забавы публики."
 MA_arles_amphiteatre: "$building_type_MA_arles_amphiteatre$"
 
 #Axum Stelae Field
 MA_axum_stelae_district: "$building_type_MA_axum_stelae$"
 MA_axum_stelae_district_desc: "$building_type_MA_axum_stelae_desc$"
 building_type_MA_axum_stelae: "Поле стел"
 building_type_MA_axum_stelae_desc: "Три колоссальные стелы — всё, что осталось от некогда могущественного Аксума, однако они по-прежнему бросают длинную тень на царские традиции этих земель. \nНа их поверхностях, вырезанных из обработанного камня, всё ещё различимы рельефы, которые некоторые считают изображениями #italic Небесных врат#!."
 MA_axum_stelae: "$building_type_MA_axum_stelae$"
 
 #Karnak Temple
 MA_karnak_district: "$building_type_MA_karnak$"
 MA_karnak_district_desc: "$building_type_MA_karnak_desc$"
 building_type_MA_karnak: "Карнак"
 building_type_MA_karnak_desc: "Самый величественный из храмов древних фараонов, Карнак и спустя тысячелетия свидетельствует о могуществе и богатстве царей Нила."
 MA_karnak: "$building_type_MA_karnak$"
 
 #Pharos of Alexandria
 MA_pharos_alexandria_district: "$building_type_MA_pharos_alexandria$"
 MA_pharos_alexandria_district_desc: "$building_type_MA_pharos_alexandria_desc$"
 building_type_MA_pharos_alexandria: "Фарос"
 building_type_MA_pharos_alexandria_desc: "Возвышаясь над перешейком, этот маяк известен всему миру как одно из #italic семи великих чудес#! Антипатра. \nСо времени закладки первого камня прошли века, и теперь сооружение венчает новый купол, возведённый по повелению халифов, однако несравненная высота, прочная кладка и сияющий огонь по-прежнему укрепляют легенду о Фаросе в сердце каждого, кто его увидит."
 MA_pharos_alexandria: "$building_type_MA_pharos_alexandria$"
 
 #Trajan Arch
 MA_trajan_arch1_district: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch1_district_desc: "$building_type_MA_trajan_arch1_desc$"
 building_type_MA_trajan_arch1: "Арка Траяна"
 building_type_MA_trajan_arch1_desc: "Великий император Траян, начавший из этого города свои походы в #italic Дакию#!, повелел воздвигнуть в память о победе великолепную арку, которая и поныне встречает каждый корабль, входящий в гавань Анконы, напоминая о славе и могуществе."
 MA_trajan_arch1: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch2: "Анконская арка"
 
 #Palatium of Diocletian
 MA_diocletian_palace_district: "$building_type_MA_diocletian_palace$"
 MA_diocletian_palace_district_desc: "$building_type_MA_diocletian_palace_desc$"
 building_type_MA_diocletian_palace: "Дворец Диоклетиана"
 building_type_MA_diocletian_palace_desc: "Этот дворец, построенный при тетрархе, задумывался как монументальный миниатюрный город-утопия с колоннадными улицами, арками, стенами и залами. \nПосле падения империи горожане заняли его и превратили в самое сердце городской жизни."
 MA_diocletian_palace: "$building_type_MA_diocletian_palace$"
 
 #Romuliana
 MA_romuliana_district: "$building_type_MA_romuliana$"
 MA_romuliana_district_desc: "$building_type_MA_romuliana_desc$"
 building_type_MA_romuliana: "Ромулиана"
 building_type_MA_romuliana_desc: "#italic Феликс Ромулиана#! была основана великими цезарями как образцовый город и веками защищалась колоссальными стенами. \nНо и они не устояли перед нашествиями столетий, и теперь от былой славы остались лишь пустые остовы сторожевых башен да смиряющий гордыню покров растительности, поглотивший их."
 MA_romuliana: "$building_type_MA_romuliana$"
 
 #Hexamilion
 MA_hexamilion_district: "$building_type_MA_hexamilion$"
 MA_hexamilion_district_desc: "$building_type_MA_hexamilion_desc$"
 building_type_MA_hexamilion: "Гексамилион"
 building_type_MA_hexamilion_desc: "Воздвигнутые императором Феодосием для защиты Пелопоннеса, эти стены веками охраняли узкий проход через перешеек от Коринфского до Саронического залива, направляя торговцев, путников и вражеские отряды к тесным проходам на севере и юге."
 MA_hexamilion: "$building_type_MA_hexamilion$"
 
 #Temple of Jupiter
 MA_baalbek_district: "$building_type_MA_baalbek$"
 MA_baalbek_district_desc: "$building_type_MA_baalbek_desc$"
 building_type_MA_baalbek: "Храм Юпитера"
 building_type_MA_baalbek_desc: "Главный храм Баальбека некогда был одним из крупнейших в мире, возвышаясь над плодородной долиной. \nС тех пор многочисленные набеги и осады повредили исполинское святилище: его колонны разбиты или увезены в далёкие города, но даже руины продолжают завораживать путешественников со всех концов света."
 MA_baalbek: "$building_type_MA_baalbek$"
 
 #Leptis Magna
 MA_leptis_magna_district: "$building_type_MA_leptis_magna$"
 MA_leptis_magna_district_desc: "$building_type_MA_leptis_magna_desc$"
 building_type_MA_leptis_magna: "Лептис-Магна"
 building_type_MA_leptis_magna_desc: "Жемчужина Триполитании, Лептис-Магна была основана древними императорами. \nКогда беспощадное полуденное солнце достигает зенита, тени, падающие на руины храмов, рынков и театров, исчезают, и здесь невольно чувствуешь себя затерянным в земле, неподвластной времени."
 MA_leptis_magna: "$building_type_MA_leptis_magna$"
 
 #Tomb of Numidia
 MA_mauretanian_mausoleum_district: "$building_type_MA_mauretanian_mausoleum$"
 MA_mauretanian_mausoleum_district_desc: "$building_type_MA_mauretanian_mausoleum_desc$"
 building_type_MA_mauretanian_mausoleum: "Гробница Нумидии"
 building_type_MA_mauretanian_mausoleum_desc: "Древний колоссальный мавзолей, сооружённый берберскими царями Нумидии ещё до римского завоевания. \nЦеликом сложенный из камня на вершине холма, обращённого к морю, он виден издалека и сверкает на солнце у горизонта."
 MA_mauretanian_mausoleum: "$building_type_MA_mauretanian_mausoleum$"
 
 #Meroë Pyramids
 MA_meroe_pyramids_district: "$building_type_MA_meroe_pyramids$"
 MA_meroe_pyramids_district_desc: "$building_type_MA_meroe_pyramids_desc$"
 building_type_MA_meroe_pyramids: "Пирамиды Мероэ"
 building_type_MA_meroe_pyramids_desc: "Среди золотых песков Нубии загадочные пирамиды возвышаются словно забытые стражи. Их тайны шепчут ветры пустыни, призывая любознательных разгадать загадки исчезнувшей цивилизации по этим причудливо украшенным сооружениям завораживающей красоты."
 MA_meroe_pyramids: "$building_type_MA_meroe_pyramids$"
 
 #Basilica of Saint Martin
 MA_saint_martin_district: "$building_type_MA_saint_martin$"
 MA_saint_martin_district_desc: "$building_type_MA_saint_martin_desc$"
 building_type_MA_saint_martin: "Базилика Святого Мартина"
 building_type_MA_saint_martin_desc: "Эта великая базилика, где покоится тело святого Мартина, впервые была возведена ещё во времена, когда этими землями правили Меровинги. \nЕё длина составляет сто шестьдесят футов, а ширина — шестьдесят; древние колонны и разноцветный мрамор украшают храм, привлекающий паломников из дальних краёв на пути в Сантьяго."
 MA_saint_martin: "$building_type_MA_saint_martin$"
 
 #Pillars of Titus
 MA_piliers_district: "$building_type_MA_piliers$"
 MA_piliers_district_desc: "$building_type_MA_piliers_desc$"
 building_type_MA_piliers: "Гасконские столпы"
 building_type_MA_piliers_desc: "Эти столпы стоят на самой высокой точке города, над рекой, залитые солнечным светом; они столь же изящны, сколь и загадочны. Одни говорят, будто некогда они были частью великого дворца цезаря Тита, другие же уверяют, что столпы выросли из скалы задолго до прихода римлян."
 MA_piliers: "$building_type_MA_piliers$"
 
 #Txindoki
 MA_txindoki_district: "$building_type_MA_txindoki$"
 MA_txindoki_district_desc: "$building_type_MA_txindoki_desc$"
 building_type_MA_txindoki: "Чиндоки"
 building_type_MA_txindoki_desc: "Паломникам, пересекающим эти земли, трудно не заметить его поразительную заснеженную вершину. Резко вздымаясь над окрестностями, Чиндоки олицетворяет величие и таинственную красоту этих земель с незапамятных времён, задолго до появления здесь человека."
 MA_txindoki: "$building_type_MA_txindoki$"
 
 #Hospice of Santa Juliana
 MA_santillana_district: "$building_type_MA_santillana$"
 MA_santillana_district_desc: "$building_type_MA_santillana_desc$"
 building_type_MA_santillana: "Приют Санта-Хулиана"
 building_type_MA_santillana_desc: "Великие своды, каменные столпы, реликвии и покои этой коллегиальной церкви делают её обязательной остановкой для множества паломников, идущих в Сантьяго. \nБлагодаря щедрости местного вельможи и непрерывному потоку пожертвований приют разбогател и украсился великолепными статуями и резными рельефами."
 MA_santillana: "$building_type_MA_santillana$"
 
 #Palace of Naranco
 MA_palace_naranco_district: "$building_type_MA_palace_naranco$"
 MA_palace_naranco_district_desc: "$building_type_MA_palace_naranco_desc$"
 building_type_MA_palace_naranco: "Дворец Наранко"
 building_type_MA_palace_naranco_desc: "Этот прекрасный дворец на протяжении поколений служил резиденцией благочестивых королей Астурии, господствуя над Овьедо с вершины горы Наранко. Его изящные арки и своды, подобных которым полуостров не видел со времён римлян, свидетельствуют о честолюбии и могуществе его правителей."
 MA_palace_naranco: "$building_type_MA_palace_naranco$"
 
 #Burgos Cathedral
 MA_burgos_cathedral_district: "$building_type_MA_burgos_cathedral$"
 MA_burgos_cathedral_district_desc: "$building_type_MA_burgos_cathedral_desc$"
 building_type_MA_burgos_cathedral: "Бургосский собор"
 building_type_MA_burgos_cathedral_desc: "Возведённый мастерами с обоих склонов Пиренеев, этот великолепный собор стал одним из выдающихся образцов нового, современного церковного зодчества. \nЕго башни вздымаются к небесам, а просторные капеллы и переходы ведут паломников от одной реликвии к другой, окружённые дарами и золотом под строгими взорами многочисленных изваянных святых."
 MA_burgos_cathedral: "$building_type_MA_burgos_cathedral$"
 
 #Qasr al-Farid
 MA_hegra_district: "$building_type_MA_hegra$"
 MA_hegra_district_desc: "$building_type_MA_hegra_desc$"
 building_type_MA_hegra: "Каср-эль-Фарид"
 building_type_MA_hegra_desc: "Монументальная гробница, глубоко высеченная в цельной скале, — наследие некогда богатого и могущественного языческого города. \nОна одиноко возвышается посреди пустыни, противостоя ветрам, отчего местные жители прозвали её #italic Одиноким замком#!."
 MA_hegra: "$building_type_MA_hegra$"
 
 #Wadi Rum
 MA_wadirum_district: "$building_type_MA_wadirum$"
 MA_wadirum_district_desc: "$building_type_MA_wadirum_desc$"
 building_type_MA_wadirum: "Вади-Рам"
 building_type_MA_wadirum_desc: "Эта великая древняя долина издавна служила источником мифов и легенд и по сей день окутана мистической тайной. \nНад ней поднимается огромная стена красных скал, противостоящая ветрам пустыни, высокая и могучая, неприступная для любой армии и дарующая надёжное убежище в самые тяжёлые времена."
 MA_wadirum: "$building_type_MA_wadirum$"
 
 #Walls of Sana'a
 MA_walls_sanaa_district: "$building_type_MA_walls_sanaa$"
 MA_walls_sanaa_district_desc: "$building_type_MA_walls_sanaa_desc$"
 building_type_MA_walls_sanaa: "Стены Саны"
 building_type_MA_walls_sanaa_desc: "Кольцо мощных укреплений окружает сердце Саны, неуязвимо возвышаясь среди запутанного лабиринта гор Сарават. Их обветренное величие словно шепчет истории о страшных битвах и великих деяниях людей и богов."
 MA_walls_sanaa: "$building_type_MA_walls_sanaa$"
 
 #Dam of Sheba
 MA_dam_sheba_district: "$building_type_MA_dam_sheba$"
 MA_dam_sheba_district_desc: "$building_type_MA_dam_sheba_desc$"
 building_type_MA_dam_sheba: "Плотина Сабы"
 building_type_MA_dam_sheba_desc: "Среди бесплодных земель Мариба, где палящее солнце карает всякого, кто осмелится бросить ему вызов, эти величественные руины рассказывают о великом царстве царицы Савской, обратившем пески в плодородные поля и принёсшем богатство и жизнь туда, где царили нужда и смерть."
 MA_dam_sheba: "$building_type_MA_dam_sheba$"
 
 #Bahla Fort
 MA_bahla_fort_district: "$building_type_MA_bahla_fort$"
 MA_bahla_fort_district_desc: "$building_type_MA_bahla_fort_desc$"
 building_type_MA_bahla_fort: "Крепость Бахла"
 building_type_MA_bahla_fort_desc: "Этот огромный замок из сырцового кирпича воздвигнут на высотах у подножия гор для защиты драгоценного оазиса Бахла. \nЗа его сложными стенами, укрытые от врагов и палящего зноя, лежат оросительные сооружения и великолепные плантации финиковых пальм, способные принести своему защитнику великую славу."
 MA_bahla_fort: "$building_type_MA_bahla_fort$"
 
 #Jebe Hafeet
 MA_jebel_hafeet_district: "$building_type_MA_jebel_hafeet$"
 MA_jebel_hafeet_district_desc: "$building_type_MA_jebel_hafeet_desc$"
 building_type_MA_jebel_hafeet: "Джебель-Хафит"
 building_type_MA_jebel_hafeet_desc: "Длинная и стройная одинокая гора — последняя перед песчаными дюнами и первая перед хребтом Хаджар. \nНа её крутых каменистых склонах издавна жили местные народы, а у подножия можно увидеть гробницы в форме пчелиных ульев."
 MA_jebel_hafeet: "$building_type_MA_jebel_hafeet$"
 
 #Al-Turaif Palace
 MA_alturaif_district: "$building_type_MA_alturaif$"
 MA_alturaif_district_desc: "$building_type_MA_alturaif_desc$"
 building_type_MA_alturaif: "Дворец Ат-Тураиф"
 building_type_MA_alturaif_desc: "Возводившийся поколениями в одном из самых негостеприимных мест творения, этот дворец стал символом стойкости и благочестия. \nЗа длинным поясом стен высокие сырцовые дворцы и орошаемый сад укрывают даже от самого невыносимого зноя и служат важным складом припасов своему владельцу."
 MA_alturaif: "$building_type_MA_alturaif$"
 
 #School of Preslav
 MA_school_preslav_district: "$building_type_MA_school_preslav$"
 MA_school_preslav_district_desc: "$building_type_MA_school_preslav_desc$"
 building_type_MA_school_preslav: "Преславская книжная школа"
 building_type_MA_school_preslav_desc: "Благодаря постоянным пожертвованиям монастырские скриптории и дворцовые залы Преслава неустанно трудятся над переводами рукописей и созданием новых знаний. Воздух пропитан запахом чернил и пергамента, а стены украшены фресками святых и покровителей. Влияние школы простирается далеко за пределы её каменных залов; она стала светочем римской литургии и мысли для всей округи."
 MA_school_preslav: "$building_type_MA_school_preslav$"
 
 #Madara Rider
 MA_madara_rider_district: "$building_type_MA_madara_rider$"
 MA_madara_rider_district_desc: "$building_type_MA_madara_rider_desc$"
 building_type_MA_madara_rider: "Мадарский всадник"
 building_type_MA_madara_rider_desc: "Глубоко врезанный в холодную, вечную поверхность отвесной скалы, этот древний рельеф изображает всадника, торжествующего над львом. Кажется, что всадник с копьём в руке вот-вот вырвется из самого камня, навеки оставшись победителем. Надписи ниже повествуют о славных деяниях, совершённых в бескрайних пастбищных степях ещё до того, как народ этих земель переселился на запад."
 MA_madara_rider: "$building_type_MA_madara_rider$"
 
 #Tomb of the Thracian King
 MA_thracian_tomb_district: "$building_type_MA_thracian_tomb$"
 MA_thracian_tomb_district_desc: "$building_type_MA_thracian_tomb_desc$"
 building_type_MA_thracian_tomb: "Гробница фракийского царя"
 building_type_MA_thracian_tomb_desc: "Затерянная во времени и пространстве, среди тихой золотистой степи, древняя гробница покоится под огромным земляным [Glossary('курганом','MA_tumulus_glossary')]. Её вход обозначен монолитными воротами и окружён целым лесом камней. Легенды шепчут, что здесь обрёл покой великий царь древности, чьё имя давно забыто, но чей дух всё ещё скачет по небесам. \nОдинокий кипарис стоит стражем у входа, отбрасывая на гробницу длинную безмолвную тень."
 MA_thracian_tomb: "$building_type_MA_thracian_tomb$"
 MA_tumulus_glossary: "Земляная насыпь из почвы и камней, образующая огромный купол над погребением. Используемые многими народами, особенно древними обществами, #bold курганы#! служат мрачными и монументальными свидетельствами хода Времени."
 
 #Boyana Church
 MA_boyana_church_district: "$building_type_MA_boyana_church$"
 MA_boyana_church_district_desc: "$building_type_MA_boyana_church_desc$"
 building_type_MA_boyana_church: "Боянская церковь"
 building_type_MA_boyana_church_desc: "На первый взгляд эта скромная церковь может показаться непримечательной: затерянная среди золотых полей сельская община и её простая кирпичная кладка сливаются с окружающим пейзажем. \nНо за непритязательными стенами скрыто несравненное сокровище, укрытое от взоров мира: сердце храма украшают фрески захватывающей красоты, каждый мазок которых свидетельствует о божественном вдохновении. Синие, красные и золотистые оттенки сливаются воедино, а святые словно танцуют в мерцании свечного пламени, создавая поистине мистическое зрелище."
 MA_boyana_church: "$building_type_MA_boyana_church$"
 
 #Belogradchik Fortress
 MA_belogradchik_fort_district: "$building_type_MA_belogradchik_fort$"
 MA_belogradchik_fort_district_desc: "$building_type_MA_belogradchik_fort_desc$"
 building_type_MA_belogradchik_fort: "Белоградчикская крепость"
 building_type_MA_belogradchik_fort_desc: "Среди вздымающихся к небу скальных образований эта крепость словно вырастает из самой земли: её стены неотделимы от холодного красного камня горы. Изящные скальные столбы возвышаются с трёх сторон, окружая крепость и делая её почти неприступной. \nМестные жители рассказывают древнюю как мир легенду о великане из близлежащего леса, который голыми руками громоздил эти камни, и о монастыре, поглощённом скалами в божественное наказание."
 MA_belogradchik_fort: "$building_type_MA_belogradchik_fort$"
 
 #Studenica Monastery
 MA_studenica_district: "$building_type_MA_studenica$"
 MA_studenica_district_desc: "$building_type_MA_studenica_desc$"
 building_type_MA_studenica: "Монастырь Студеница"
 building_type_MA_studenica_desc: "Величайший из памятников Сербии и источник веры и умиротворения для местных жителей, этот монастырь укрывается в уединённой долине. \nВ его стенах переплелись традиции латинского Запада и греческого Востока: белые мраморные плиты, искусно обработанные мастерами, и внушительный купол на ярко-красном барабане свидетельствуют о мастерстве и благочестии покровителей обители."
 MA_studenica: "$building_type_MA_studenica$"
 
 #Church of the Nativity
 MA_church_nativity_district: "$building_type_MA_church_nativity$"
 MA_church_nativity_district_desc: "$building_type_MA_church_nativity_desc$"
 building_type_MA_church_nativity: "Храм Рождества Христова"
 building_type_MA_church_nativity_desc: "Впервые возведённый по повелению святой матери Константина и затем перестроенный по приказу Юстиниана, этот храм знаменует одно из самых священных мест христианства — место рождения Христа. \nЦерковь представляет собой длинную пятинефную базилику с торжественным входом, украшенную золотыми мозаиками и древнеримскими колоннами из разноцветного мрамора. Здесь хранятся святые реликвии и произведения искусства, которые, согласно преданию, не раз спасали храм от захватчиков."
 MA_church_nativity: "$building_type_MA_church_nativity$"
 
 #Great Lejre Hall
 MA_lejre_hall_district: "$building_type_MA_lejre_hall$"
 MA_lejre_hall_district_desc: "$building_type_MA_lejre_hall_desc$"
 building_type_MA_lejre_hall: "Великий зал Хлейдра"
 building_type_MA_lejre_hall_desc: "Величественный пиршественный зал, сооружённый древними королями из высоких древесных стволов и украшенный великолепной резьбой. \nИстории о великих героях и королях, пировавших и сражавшихся в этих стенах, непременно вдохновят будущие саги."
 MA_lejre_hall: "$building_type_MA_lejre_hall$"
 
 #Aetna
 MA_aetna_district: "$building_type_MA_aetna$"
 MA_aetna_district_desc: "$building_type_MA_aetna_desc$"
 building_type_MA_aetna: "Этна"
 building_type_MA_aetna_desc: "Величайший из огнедышащих вулканов древнего мира, гора Этна победоносно возвышается над плодородной Сицилией, обогащая окрестные земли своим пеплом. \nТысячелетиями её дыхание питало мифы и легенды о том, как бог Гефест ковал свои божественные творения в недрах этой адской горы."
 MA_aetna: "$building_type_MA_aetna$"
 
 #Brescia Duomo
 MA_duomo_brescia_district: "$building_type_MA_duomo_brescia$"
 MA_duomo_brescia_district_desc: "$building_type_MA_duomo_brescia_desc$"
 building_type_MA_duomo_brescia: "Кафедральный собор Брешии"
 building_type_MA_duomo_brescia_desc: "Каменная ротонда в сердце #italic Cittanuova#!, нового центра власти Брешии к западу от древнеримского ядра города. Её толстые стены и простой романский облик вдохновлены преданиями об Иерусалиме, а в полумраке интерьера фрески и реликвии повествуют о веках благочестия и власти."
 MA_duomo_brescia: "$building_type_MA_duomo_brescia$"
 
 #Maschio
 MA_maschio_district: "$building_type_MA_maschio$"
 MA_maschio_district_desc: "$building_type_MA_maschio_desc$"
 building_type_MA_maschio: "Маскио"
 building_type_MA_maschio_desc: "Громадный замок из камня и вулканического туфа возвышается над сверкающим Неаполитанским заливом. Его зубчатые стены и внушительные круглые башни железной рукой властвуют над сушей и морем. \nГлубоко в скалу уходят многочисленные камеры и темницы, некоторые из которых восходят ещё ко временам древних греков. $MA_warning_palermo_napoli$"
 MA_maschio: "$building_type_MA_maschio$"
 MA_warning_palermo_napoli: "\n\n@alert_icon! #alert_trial Если построить [GetBuildingType('MA_palace_palermo2').GetName] в Палермо и [GetBuildingType('MA_maschio').GetName] в Неаполе, вы не сможете выполнить [GetDecisionWithKey('empower_sicilian_parliament_decision').GetName] [decision|E]!#!"
 
 #Basilica of Saint Nicholas
 MA_st_nicholas_district: "$building_type_MA_st_nicholas$"
 MA_st_nicholas_district_desc: "$building_type_MA_st_nicholas_desc$"
 building_type_MA_st_nicholas: "Базилика Святого Николая"
 building_type_MA_st_nicholas_desc: "Массивная романская базилика из прочного местного камня, ослепительно белого на фоне винно-синего моря. В её стенах покоятся мощи святого Николая, привлекающие паломников и несметные богатства со всего христианского мира и побуждающие верующих продолжать путь в Святую землю."
 MA_st_nicholas: "$building_type_MA_st_nicholas$"
 
 #Palace of Arechis
 MA_palace_arechis_district: "$building_type_MA_palace_arechis$"
 MA_palace_arechis_district_desc: "$building_type_MA_palace_arechis_desc$"
 building_type_MA_palace_arechis: "Дворец Арехиса"
 building_type_MA_palace_arechis_desc: "Обширный дворцовый комплекс, вписанный в древнеримский город Беневент, защищённый кольцом стен и четырёхугольной башней. Построенный первым князем лангобардов, он стал символом непокорности и упорной независимости этого народа."
 MA_palace_arechis: "$building_type_MA_palace_arechis$"
 
 #Basilica of Saccargia
 MA_saccargia_basilica_district: "$building_type_MA_saccargia_basilica$"
 MA_saccargia_basilica_district_desc: "$building_type_MA_saccargia_basilica_desc$"
 building_type_MA_saccargia_basilica: "Базилика Саккарджа"
 building_type_MA_saccargia_basilica_desc: "Поразительная чёрно-белая каменная базилика возвышается над сухим, продуваемым ветрами побережьем Сардинии; её полосатая башня видна с моря за многие мили. Для строительства были приглашены мастера из Италии, и влияние их архитектурных традиций глубоко заметно."
 MA_saccargia_basilica: "$building_type_MA_saccargia_basilica$"
 
 #Ruins of Paestum
 MA_paestum_district: "$building_type_MA_paestum$"
