 building_type_MA_tower_pisa: "Пизанская башня"
 building_type_MA_tower_pisa_desc: "Изящная #italic кампанила#! гордого города Пизы, чьи стройные арки и сияющий белый камень известны всему христианскому миру и за его пределами. Со времени постройки грунт под ней не раз смещался, из-за чего башня всё сильнее наклоняется."
