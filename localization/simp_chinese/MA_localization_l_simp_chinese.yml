l_simp_chinese:
 #################
 ##MEDIEVAL ARTS##
 #################

 ###########
 #GAME RULE#
 game_rule_category_MedievalArts: "Medieval Arts"
 rule_MA_monuments: "$game_rule_category_MedievalArts$：奇观"
 setting_MA_monuments_all: "优先使用$game_rule_category_MedievalArts$"
 setting_MA_monuments_all_desc: "#help 推荐：#!发生冲突时，优先使用#V $game_rule_category_MedievalArts$#!的[special_buildings|E]，而非原版游戏的建筑。"
 setting_MA_monuments_selection: "优先使用原版游戏"
 setting_MA_monuments_selection_desc: "发生冲突时，优先使用#V 原版游戏#!的[special_buildings|E]，而非$game_rule_category_MedievalArts$的建筑。"
 rule_MA_ahistorical_monuments: "$game_rule_category_MedievalArts$：历史合理性"
 setting_MA_ahistorical_monuments_yes: "允许不合史实的奇观"
 setting_MA_ahistorical_monuments_yes_desc: "#help 推荐：#!允许被视作#italic 不合史实#!的[special_buildings|E]。"
 setting_MA_ahistorical_monuments_no: "禁用不合史实的奇观"
 setting_MA_ahistorical_monuments_no_desc: "被视作#italic 不合史实#!的[special_buildings|E]将#bold 不会#!被允许。"
 rule_MA_creator_pack: "$game_rule_category_MedievalArts$：DLC"
 setting_MA_creator_pack_yes: "优先使用DLC"
 setting_MA_creator_pack_yes_desc: "#help 推荐：#!启用后，优先使用#V DLC#!中的[special_buildings|E]（例如#V 神圣建筑#!），而非$game_rule_category_MedievalArts$的建筑。"
 setting_MA_creator_pack_no: "$setting_MA_monuments_all$"
 setting_MA_creator_pack_no_desc: "发生冲突时，优先使用#V $game_rule_category_MedievalArts$#!的[special_buildings|E]，而非#V DLC#!中的建筑。"

 
 ###################
 #SPECIAL BUILDINGS#

 #Rock of Cashel
 MA_rock_cashel_district: "$building_type_MA_rock_cashel$"
 MA_rock_cashel_district_desc: "$building_type_MA_rock_cashel_desc$"
 building_type_MA_rock_cashel: "卡舍尔岩"
 building_type_MA_rock_cashel_desc: "卡舍尔岩坐落于牧草青葱的岩石山丘之上，是一座被重重城墙环绕、坚不可摧的石砌要塞，既可用作城堡，也可充当宫殿。这里还坐落着爱尔兰最具影响力的修道院之一，以及一座宫廷礼拜堂，其拱顶饰有描绘圣帕特里克生平的精美湿壁画。"
 MA_rock_cashel: "$building_type_MA_rock_cashel$"
 
 #St Donatus of Zadar
 MA_st_donatus_district: "$building_type_MA_st_donatus$"
 MA_st_donatus_district_desc: "$building_type_MA_st_donatus_desc$"
 building_type_MA_st_donatus: "扎达尔圣多纳图斯教堂"
 building_type_MA_st_donatus_desc: "这座宏伟的圆形教堂以白石砌成，在亚得里亚海的粼粼波光中熠熠生辉。其设计受到查理曼宫廷礼拜堂的启发，并饰有华美的金色马赛克镶嵌画。"
 MA_st_donatus: "$building_type_MA_st_donatus$"
 
 #Aula Palatina
 MA_aula_palatina_district: "$building_type_MA_aula_palatina$"
 MA_aula_palatina_district_desc: "$building_type_MA_aula_palatina_desc$"
 building_type_MA_aula_palatina: "帕拉蒂纳大厅"
 building_type_MA_aula_palatina_desc: "君士坦丁大帝为自己的#italic 宫殿#!修建的巨型砖砌大厅。\n其规模在整个大陆上都鲜有匹敌，展现出的高超工程技艺足以成为后世取之不尽的灵感源泉。"
 MA_aula_palatina: "$building_type_MA_aula_palatina$"
 
 #Jokhang Temple
 MA_jokhang_district: "$building_type_MA_jokhang$"
 MA_jokhang_district_desc: "$building_type_MA_jokhang_desc$"
 building_type_MA_jokhang: "大昭寺"
 building_type_MA_jokhang_desc: "全西藏最古老、最神秘的寺庙，一组庄严宏伟的庭院与佛殿群，坐落于众神之地的心脏。"
 MA_jokhang: "$building_type_MA_jokhang$"
 
 #Dongola Throne Hall
 MA_dongola_hall_district: "$building_type_MA_dongola_hall$"
 MA_dongola_hall_district_desc: "$building_type_MA_dongola_hall_desc$"
 building_type_MA_dongola_hall: "栋古拉王座大厅"
 building_type_MA_dongola_hall_desc: "一座建于岩石山丘顶端的宏伟宫殿，可将周围平原与尼罗河尽收眼底。\n宫殿用于举行典礼，以彰显威仪。使节与旅人沿着饰有努比亚和希腊艺术家所绘壮丽壁画的宏伟阶梯登上楼层，最终抵达庄严的王座大厅。"
 MA_dongola_hall: "$building_type_MA_dongola_hall$"
 
 #Cathedral of Hildesheim
 MA_hildesheim_cathedral_district: "$building_type_MA_hildesheim_cathedral$"
 MA_hildesheim_cathedral_district_desc: "$building_type_MA_hildesheim_cathedral_desc$"
 building_type_MA_hildesheim_cathedral: "希尔德斯海姆圣米迦勒教堂"
 building_type_MA_hildesheim_cathedral_desc: "这座宗座圣殿旨在彰显罗马国王的威望与权势，彩绘木天花板与圆拱赋予它宏大而庄严的帝国气象。来自莱茵河流域与意大利的工匠和大师参与了建造；教堂内还有一组青铜大门与一根巨型青铜立柱，均饰以精心雕琢的浮雕。"
 MA_hildesheim_cathedral: "$building_type_MA_hildesheim_cathedral$"
 
 #Toulouse Cathedral
 MA_toulouse_basilica_district: "$building_type_MA_toulouse_basilica$"
 MA_toulouse_basilica_district_desc: "$building_type_MA_toulouse_basilica_desc$"
 building_type_MA_toulouse_basilica: "图卢兹大教堂"
 building_type_MA_toulouse_basilica_desc: "这座雄伟的宗座圣殿是阿尔卑斯山以北最大的主教座堂之一。它采用当地盛产的砖材建造，是一座真正的罗曼式建筑，深受法国南部古罗马遗迹启发，装饰着伦巴第式饰带、圆拱与再利用的古柱。"
 MA_toulouse_basilica: "$building_type_MA_toulouse_basilica$"
 
 #The Durham Cathedral
 MA_durham_cathedral_district: "$building_type_MA_durham_cathedral$"
 MA_durham_cathedral_district_desc: "$building_type_MA_durham_cathedral_desc$"
 building_type_MA_durham_cathedral: "达勒姆大教堂"
 building_type_MA_durham_cathedral_desc: "宏伟的达勒姆大教堂高耸于威尔河环抱的沼泽半岛之上。传说两位挤奶女工在此发现了圣卡斯伯特那无法搬动的墓穴。来自英吉利海峡两岸的工匠设计了其肋拱穹顶，这项工程杰作在英格兰前所未见；建造所用石材取自下方峭壁，教堂俯瞰着城镇的树林与河岸。"
 MA_durham_cathedral: "$building_type_MA_durham_cathedral$"
 
 #The Castel del Monte
 MA_castel_monte_district: "$building_type_MA_castel_monte$"
 MA_castel_monte_district_desc: "$building_type_MA_castel_monte_desc$"
 building_type_MA_castel_monte: "蒙特堡"
 building_type_MA_castel_monte_desc: "一座优雅的狩猎行宫，矗立于普利亚一处平缓的山丘之上。\n其设计独一无二，采用八角形平面，八个角各设一座八角塔楼，融合了古典与哥特式建筑风格。\n肃穆而几何化的外观，与内部华贵的挂毯、地毯、绘画和柱头装饰形成鲜明对照。"
 MA_castel_monte: "$building_type_MA_castel_monte$"
 
 #The Belfry of Bruges
 MA_belfort_district: "$building_type_MA_belfort$"
 MA_belfort_district_desc: "$building_type_MA_belfort_desc$"
 building_type_MA_belfort: "布鲁日钟楼"
 building_type_MA_belfort_desc: "这座令人叹为观止的哥特式钟楼高耸于布鲁日集市广场之上，其钟声主宰着整座城市的生活。巨塔遍布尖塔与雕像，由砖石砌成，下部平面呈矩形，向上过渡为八角形钟室。"
 MA_belfort: "$building_type_MA_belfort$"
 
 #The Strasbourg Cathedral
 MA_strasbourg_cathedral1_district: "$building_type_MA_strasbourg_cathedral1$"
 MA_strasbourg_cathedral1_district_desc: "$building_type_MA_strasbourg_cathedral1_desc$"
 building_type_MA_strasbourg_cathedral1: "斯特拉斯堡大教堂"
 building_type_MA_strasbourg_cathedral1_desc: "斯特拉斯堡大教堂受到东西法兰克大教堂的启发，其雄伟气势源于市民的富庶与领主的赞助。粉红色砂岩砌成的墙壁在夕阳下熠熠生辉，俯瞰着狭窄的广场与木构房屋，青铜钟声随风传送出悠扬旋律。"
 MA_strasbourg_cathedral1: "斯特拉斯堡大教堂"
 MA_strasbourg_cathedral2: "$MA_strasbourg_cathedral1$"
 
 #Koutoubia Mosque
 MA_koutoubia_district: "$building_type_MA_koutoubia$"
 MA_koutoubia_district_desc: "$building_type_MA_koutoubia_desc$"
 building_type_MA_koutoubia: "库图比亚清真寺"
 building_type_MA_koutoubia_desc: "这座清真寺是摩尔式建筑的典范杰作，其宣礼塔为整个伊斯兰世界的营造者提供了灵感。"
 MA_koutoubia: "$building_type_MA_koutoubia$"
 
 #Parigoritissa
 MA_parigoritissa_district: "$building_type_MA_parigoritissa$"
 MA_parigoritissa_district_desc: "$building_type_MA_parigoritissa_desc$"
 building_type_MA_parigoritissa: "帕里戈里蒂萨圣母教堂"
 building_type_MA_parigoritissa_desc: "这座奉献给至圣圣母玛利亚的教堂，以古典时代的对称观念与几何完整性为设计灵感。建筑平面几乎是完美的正方形，中央为由墩柱支撑的八角形穹顶，四角各环绕一座小礼拜堂。"
 MA_parigoritissa: "$building_type_MA_parigoritissa$"
 
 #Rotunda
 MA_rotunda_district: "$building_type_MA_rotunda$"
 MA_rotunda_district_desc: "$building_type_MA_rotunda_desc$"
 building_type_MA_rotunda: "塞萨洛尼基圆形大厅"
 building_type_MA_rotunda_desc: "这座巨型穹顶建筑以罗马万神殿为蓝本。\n室内装饰着工艺卓绝、美不胜收的马赛克镶嵌画，金色的#italic 镶嵌石片#!在穹顶天窗射入的阳光下闪烁。\n建筑通过柱廊与晚期凯撒伽列里乌斯修建的巨大大理石拱门相连。"
 MA_rotunda: "$building_type_MA_rotunda$"
 
 #The Nikaea Walls
 MA_nikaea_walls_district: "$building_type_MA_nikaea_walls$"
 MA_nikaea_walls_district_desc: "$building_type_MA_nikaea_walls_desc$"
 building_type_MA_nikaea_walls: "尼西亚城墙"
 building_type_MA_nikaea_walls_desc: "这道坚不可摧的双重城墙由数百年前的凯撒们建造，守卫着通往君士坦丁堡的道路。"
 MA_nikaea_walls: "$building_type_MA_nikaea_walls$"
 
 #The Ephesus Basilica
 MA_ephesus_basilica_district: "$building_type_MA_ephesus_basilica$"
 MA_ephesus_basilica_district_desc: "$building_type_MA_ephesus_basilica_desc$"
 building_type_MA_ephesus_basilica: "以弗所大教堂"
 building_type_MA_ephesus_basilica_desc: "这座宏伟的宗座圣殿建于查士丁尼时代，坐落在#italic 使徒约翰#!的墓址之上。\n砖石与方整石砌筑的墙体由普罗科内索斯岛出产的优雅大理石柱支撑，并以金色马赛克镶嵌画华丽装饰。"
 MA_ephesus_basilica: "$building_type_MA_ephesus_basilica$"
 
 #Arles Amphiteatre
 MA_arles_amphiteatre_district: "$building_type_MA_arles_amphiteatre$"
 MA_arles_amphiteatre_district_desc: "$building_type_MA_arles_amphiteatre_desc$"
 building_type_MA_arles_amphiteatre: "阿尔勒竞技场"
 building_type_MA_arles_amphiteatre_desc: "这座数百年前修建的宏伟竞技场，至今仍是阿尔勒生活的中心。\n市民在石墙之间开凿出塔楼、礼拜堂与住宅，居住在昔日角斗士为供人取乐而互相残杀的沙地上。"
 MA_arles_amphiteatre: "$building_type_MA_arles_amphiteatre$"
 
 #Axum Stelae Field
 MA_axum_stelae_district: "$building_type_MA_axum_stelae$"
 MA_axum_stelae_district_desc: "$building_type_MA_axum_stelae_desc$"
 building_type_MA_axum_stelae: "阿克苏姆石碑群"
 building_type_MA_axum_stelae_desc: "曾经强盛的阿克苏姆如今只剩三座巨型石碑，但它们仍深刻影响着这片土地的王权文化。\n石碑由精心加工的石料雕成，表面的浮雕至今清晰可见，有人认为其中描绘的是#italic 天堂之门#!。"
 MA_axum_stelae: "$building_type_MA_axum_stelae$"
 
 #Karnak Temple
 MA_karnak_district: "$building_type_MA_karnak$"
 MA_karnak_district_desc: "$building_type_MA_karnak_desc$"
 building_type_MA_karnak: "卡尔纳克神庙"
 building_type_MA_karnak_desc: "古代法老所有神庙中最为壮丽的一座。历经千年，卡尔纳克仍是尼罗河诸王权势与财富的见证。"
 MA_karnak: "$building_type_MA_karnak$"
 
 #Pharos of Alexandria
 MA_pharos_alexandria_district: "$building_type_MA_pharos_alexandria$"
 MA_pharos_alexandria_district_desc: "$building_type_MA_pharos_alexandria_desc$"
 building_type_MA_pharos_alexandria: "法罗斯灯塔"
 building_type_MA_pharos_alexandria_desc: "灯塔高耸于地峡之上，作为安提帕特所列的#italic 世界七大奇迹#!之一而名扬四海。\n自奠基以来已过去数百年，哈里发下令修建的新穹顶如今为建筑加冠。然而，它无与伦比的高度、坚固的石砌结构与明亮的灯火，仍在每一位目睹者心中延续着法罗斯的传奇。"
 MA_pharos_alexandria: "$building_type_MA_pharos_alexandria$"
 
 #Trajan Arch
 MA_trajan_arch1_district: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch1_district_desc: "$building_type_MA_trajan_arch1_desc$"
 building_type_MA_trajan_arch1: "图拉真凯旋门"
 building_type_MA_trajan_arch1_desc: "伟大的图拉真皇帝曾从此城出征#italic 达契亚#!。为纪念他的胜利，他下令修建了一座极尽华美的凯旋门。直到今日，每一艘驶入安科纳港的船只仍会受到它的迎接，并忆起往昔的荣耀与力量。"
 MA_trajan_arch1: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch2: "安科纳凯旋门"
 
 #Palatium of Diocletian
 MA_diocletian_palace_district: "$building_type_MA_diocletian_palace$"
 MA_diocletian_palace_district_desc: "$building_type_MA_diocletian_palace_desc$"
 building_type_MA_diocletian_palace: "戴克里先宫"
 building_type_MA_diocletian_palace_desc: "这座宫殿修建于四帝共治时代，被设计为一座宏伟的微型理想城市，拥有列柱街道、拱门、城墙和大厅。\n帝国覆灭后，市民占据了宫殿，将其改造成城市的核心城区。"
 MA_diocletian_palace: "$building_type_MA_diocletian_palace$"
 
 #Romuliana
 MA_romuliana_district: "$building_type_MA_romuliana$"
 MA_romuliana_district_desc: "$building_type_MA_romuliana_desc$"
 building_type_MA_romuliana: "罗穆利亚纳"
 building_type_MA_romuliana_desc: "#italic 菲利克斯·罗穆利亚纳#!由伟大的凯撒们建为模范城市，多年来一直受到宏伟城墙的保护。\n然而城墙未能抵挡数世纪的入侵，如今昔日的辉煌只剩下瞭望塔空洞的骨架，以及将其吞没的茂密植被，令人不禁感慨。"
 MA_romuliana: "$building_type_MA_romuliana$"
 
 #Hexamilion
 MA_hexamilion_district: "$building_type_MA_hexamilion$"
 MA_hexamilion_district_desc: "$building_type_MA_hexamilion_desc$"
 building_type_MA_hexamilion: "六英里城墙"
 building_type_MA_hexamilion_desc: "这道城墙由狄奥多西皇帝修建，以保护伯罗奔尼撒半岛。数百年来，它从科林斯湾延伸至萨罗尼克湾，守卫着地峡狭窄的入口，并将商旅与敌军袭扰引向南北两端的咽喉要道。"
 MA_hexamilion: "$building_type_MA_hexamilion$"
 
 #Temple of Jupiter
 MA_baalbek_district: "$building_type_MA_baalbek$"
 MA_baalbek_district_desc: "$building_type_MA_baalbek_desc$"
 building_type_MA_baalbek: "朱庇特神庙"
 building_type_MA_baalbek_desc: "巴勒贝克的主神庙曾是世界上最大的神庙之一，俯瞰着肥沃的山谷。\n此后的多次劫掠与围攻重创了这座庞然巨构，石柱或遭击碎，或被运往远方的城市。但即使成为废墟，它仍令来自世界各地的旅人倾倒。"
 MA_baalbek: "$building_type_MA_baalbek$"
 
 #Leptis Magna
 MA_leptis_magna_district: "$building_type_MA_leptis_magna$"
 MA_leptis_magna_district_desc: "$building_type_MA_leptis_magna_desc$"
 building_type_MA_leptis_magna: "大莱普提斯"
 building_type_MA_leptis_magna_desc: "大莱普提斯是的黎波里塔尼亚的一颗明珠，由古代皇帝建立。\n当无情的太阳在正午升至天顶，投在神庙、市场与剧院遗迹上的阴影也消失无踪，置身这片仿佛没有时间的土地，任谁都难免迷失。"
 MA_leptis_magna: "$building_type_MA_leptis_magna$"
 
 #Tomb of Numidia
 MA_mauretanian_mausoleum_district: "$building_type_MA_mauretanian_mausoleum$"
 MA_mauretanian_mausoleum_district_desc: "$building_type_MA_mauretanian_mausoleum_desc$"
 building_type_MA_mauretanian_mausoleum: "努米底亚王陵"
 building_type_MA_mauretanian_mausoleum_desc: "这座古老而巨大的陵墓建于罗马征服之前，由努米底亚的柏柏尔国王修建。\n陵墓完全以石材砌成，矗立在面朝大海的山丘顶端，远在天边便可望见它在阳光下闪耀。"
 MA_mauretanian_mausoleum: "$building_type_MA_mauretanian_mausoleum$"
 
 #Meroë Pyramids
 MA_meroe_pyramids_district: "$building_type_MA_meroe_pyramids$"
 MA_meroe_pyramids_district_desc: "$building_type_MA_meroe_pyramids_desc$"
 building_type_MA_meroe_pyramids: "麦罗埃金字塔群"
 building_type_MA_meroe_pyramids_desc: "在努比亚金色的沙海之中，神秘的金字塔如被遗忘的守卫者般耸立。沙漠之风低语着它们的秘密，精妙繁复而令人心醉的装饰，引诱好奇的心灵探寻失落文明的奥秘。"
 MA_meroe_pyramids: "$building_type_MA_meroe_pyramids$"
 
 #Basilica of Saint Martin
 MA_saint_martin_district: "$building_type_MA_saint_martin$"
 MA_saint_martin_district_desc: "$building_type_MA_saint_martin_desc$"
 building_type_MA_saint_martin: "圣马丁大教堂"
 building_type_MA_saint_martin_desc: "这座宏伟的宗座圣殿是圣马丁遗骸的最后安息之所，最初建于墨洛温王朝统治这片土地的时代。\n教堂长一百六十英尺、宽六十英尺，以古代石柱与彩色大理石装饰，吸引着圣地亚哥朝圣之路上来自四面八方的朝圣者。"
 MA_saint_martin: "$building_type_MA_saint_martin$"
 
 #Pillars of Titus
 MA_piliers_district: "$building_type_MA_piliers$"
 MA_piliers_district_desc: "$building_type_MA_piliers_desc$"
 building_type_MA_piliers: "加斯科涅石柱"
 building_type_MA_piliers_desc: "这些石柱立于城市的最高处，俯瞰河流，沐浴阳光，既优雅又神秘。有人说它们曾属于凯撒提图斯的一座宏伟宫殿，也有人说，早在罗马人到来之前，它们就已从岩石中拔地而起。"
 MA_piliers: "$building_type_MA_piliers$"
 
 #Txindoki
 MA_txindoki_district: "$building_type_MA_txindoki$"
 MA_txindoki_district_desc: "$building_type_MA_txindoki_desc$"
 building_type_MA_txindoki: "钦多基山"
 building_type_MA_txindoki_desc: "穿行此地的朝圣者很难不注意到那座引人注目的积雪山峰。钦多基山突兀而雄伟地拔地而起，早在人类投来第一道目光之前，它便已体现着这片土地的庄严与神秘之美。"
 MA_txindoki: "$building_type_MA_txindoki$"
 
 #Hospice of Santa Juliana
 MA_santillana_district: "$building_type_MA_santillana$"
 MA_santillana_district_desc: "$building_type_MA_santillana_desc$"
 building_type_MA_santillana: "圣胡利亚娜朝圣者收容所"
 building_type_MA_santillana_desc: "这座参事会教堂拥有宏大的拱顶、石柱、圣髑与客房，是众多前往圣地亚哥的朝圣者必经的一站。\n在当地权贵的资助和不断涌入的奉献下，收容所日渐富裕而美丽，饰以宏伟的雕像和精美的浮雕。"
 MA_santillana: "$building_type_MA_santillana$"
 
 #Palace of Naranco
 MA_palace_naranco_district: "$building_type_MA_palace_naranco$"
 MA_palace_naranco_district_desc: "$building_type_MA_palace_naranco_desc$"
 building_type_MA_palace_naranco: "纳兰科宫"
 building_type_MA_palace_naranco_desc: "这座美丽的宫殿世代作为阿斯图里亚斯圣王的居所，从纳兰科山顶俯瞰奥维耶多。其优雅的拱券与拱顶，自罗马人统治以来便未曾在伊比利亚半岛上出现，是统治者雄心与权势的明证。"
 MA_palace_naranco: "$building_type_MA_palace_naranco$"
 
 #Burgos Cathedral
 MA_burgos_cathedral_district: "$building_type_MA_burgos_cathedral$"
 MA_burgos_cathedral_district_desc: "$building_type_MA_burgos_cathedral_desc$"
 building_type_MA_burgos_cathedral: "布尔戈斯大教堂"
 building_type_MA_burgos_cathedral_desc: "这座宏伟的主教座堂由比利牛斯山两侧的工匠共同建造，是这种崭新的现代教堂建筑风格最杰出的典范之一。\n高塔直插云霄，深邃的礼拜堂与长廊引导朝圣者穿行于一件件圣髑之间。它们遍布供品与黄金，众多雕刻圣像从高处俯视着来者。"
 MA_burgos_cathedral: "$building_type_MA_burgos_cathedral$"
 
 #Qasr al-Farid
 MA_hegra_district: "$building_type_MA_hegra$"
 MA_hegra_district_desc: "$building_type_MA_hegra_desc$"
 building_type_MA_hegra: "卡斯尔法里德"
 building_type_MA_hegra_desc: "一座深入整块巨岩中凿出的宏伟陵墓，是昔日富庶强大的异教城市留下的遗迹。\n它独自屹立于沙漠中，孤傲地迎击狂风，当地人因此将其称为#italic 孤独城堡#!。"
 MA_hegra: "$building_type_MA_hegra$"
 
 #Wadi Rum
 MA_wadirum_district: "$building_type_MA_wadirum$"
 MA_wadirum_district_desc: "$building_type_MA_wadirum_desc$"
 building_type_MA_wadirum: "瓦迪拉姆"
 building_type_MA_wadirum_desc: "这片广阔而古老的山谷自古便是神话与传说的源头，至今仍笼罩着神秘气息。\n巨大的红色岩壁在沙漠之风中拔地而起，雄伟厚重、坚不可摧，即使大军也无法攻克，在最艰难的岁月里提供着安全的庇护。"
 MA_wadirum: "$building_type_MA_wadirum$"
 
 #Walls of Sana'a
 MA_walls_sanaa_district: "$building_type_MA_walls_sanaa$"
 MA_walls_sanaa_district_desc: "$building_type_MA_walls_sanaa_desc$"
 building_type_MA_walls_sanaa: "萨那城墙"
 building_type_MA_walls_sanaa_desc: "坚固的壁垒环绕着萨那的心脏，自萨拉瓦特山脉错综复杂的群峰间巍然升起，历经风霜仍不可侵犯。那饱经沧桑的威仪仿佛在低语，诉说着人神的伟业与惨烈的战斗。"
 MA_walls_sanaa: "$building_type_MA_walls_sanaa$"
 
 #Dam of Sheba
 MA_dam_sheba_district: "$building_type_MA_dam_sheba$"
 MA_dam_sheba_district_desc: "$building_type_MA_dam_sheba_desc$"
 building_type_MA_dam_sheba: "示巴大坝"
 building_type_MA_dam_sheba_desc: "在贫瘠的马里卜大地上，酷日灼烧着一切敢于正视它的人。这座壮丽的遗迹低声诉说着示巴女王伟大王国的传说：它曾将沙地变成沃野，在匮乏与死亡之地带来财富和生命。"
 MA_dam_sheba: "$building_type_MA_dam_sheba$"
 
 #Bahla Fort
 MA_bahla_fort_district: "$building_type_MA_bahla_fort$"
 MA_bahla_fort_district_desc: "$building_type_MA_bahla_fort_desc$"
 building_type_MA_bahla_fort: "巴赫莱堡"
 building_type_MA_bahla_fort_desc: "这座巨大的泥砖城堡建于高地边缘，旨在保护珍贵的巴赫莱绿洲。\n错综的城墙将灌溉设施与壮丽的椰枣种植园庇护在内，既抵挡敌人，又阻隔酷热，必将为它的守护者赢得巨大威望。"
 MA_bahla_fort: "$building_type_MA_bahla_fort$"
 
 #Jebe Hafeet
 MA_jebel_hafeet_district: "$building_type_MA_jebel_hafeet$"
 MA_jebel_hafeet_district_desc: "$building_type_MA_jebel_hafeet_desc$"
 building_type_MA_jebel_hafeet: "哈菲特山"
 building_type_MA_jebel_hafeet_desc: "一座狭长而孤独的山峰，既是沙丘之前的最后一山，也是哈杰尔山脉前的第一山。\n当地居民很早就在陡峭的岩石山坡上定居，山脚至今可见蜂巢状墓葬。"
 MA_jebel_hafeet: "$building_type_MA_jebel_hafeet$"
 
 #Al-Turaif Palace
 MA_alturaif_district: "$building_type_MA_alturaif$"
 MA_alturaif_district_desc: "$building_type_MA_alturaif_desc$"
 building_type_MA_alturaif: "图赖夫宫"
 building_type_MA_alturaif_desc: "这座宫殿由数代人在世间最不宜居的地方之一建造，是坚毅与虔诚的象征。\n长长的城墙环绕着高大的泥砖宫殿和灌溉花园，使人能够躲避最酷烈的高温，也为其主人提供重要的补给仓库。"
 MA_alturaif: "$building_type_MA_alturaif$"
 
 #School of Preslav
 MA_school_preslav_district: "$building_type_MA_school_preslav$"
 MA_school_preslav_district_desc: "$building_type_MA_school_preslav_desc$"
 building_type_MA_school_preslav: "普雷斯拉夫学派"
 building_type_MA_school_preslav_desc: "在源源不断的捐赠支持下，普雷斯拉夫修道院的缮写室与宫殿大厅不知疲倦地翻译手稿，创造新知识。空气中弥漫着墨水与羊皮纸的气味，墙壁装饰着圣徒与赞助者的湿壁画。学派的影响远远超越了石砌厅堂，成为本地区罗马礼仪与思想的明灯。"
 MA_school_preslav: "$building_type_MA_school_preslav$"
 
 #Madara Rider
 MA_madara_rider_district: "$building_type_MA_madara_rider$"
 MA_madara_rider_district_desc: "$building_type_MA_madara_rider_desc$"
 building_type_MA_madara_rider: "马达拉骑士浮雕"
 building_type_MA_madara_rider_desc: "这幅古老的浮雕深深凿入冰冷而永恒的垂直峭壁，描绘了一名骑士战胜狮子的场景。骑士手持长矛，仿佛从石壁中跃出，永远保持胜利的姿态。下方铭文记述着这片土地的人民尚未向西定居时，在牧草遍野、无边无际的草原上建立的光荣功业。"
 MA_madara_rider: "$building_type_MA_madara_rider$"
 
 #Tomb of the Thracian King
 MA_thracian_tomb_district: "$building_type_MA_thracian_tomb$"
 MA_thracian_tomb_district_desc: "$building_type_MA_thracian_tomb_desc$"
 building_type_MA_thracian_tomb: "色雷斯王陵"
 building_type_MA_thracian_tomb_desc: "在时空的深处，宁静金黄的草原环绕着一座古墓，它沉睡在巨大的土石[Glossary('坟冢','MA_tumulus_glossary')]之下，独石巨门标示着入口，四周石块如林。传说一位古代伟大的国王长眠于此，名字早已被遗忘，灵魂却仍驰骋于天空。\n一株孤独的柏树守卫着墓门，将沉默而修长的阴影投在墓上。"
 MA_thracian_tomb: "$building_type_MA_thracian_tomb$"
 MA_tumulus_glossary: "由泥土和石块堆成、覆盖墓室的巨大穹丘。许多文化——尤其是古代社会——都曾使用#bold 坟冢#!，它们庄严而肃穆，见证了时间的流逝。"
 
 #Boyana Church
 MA_boyana_church_district: "$building_type_MA_boyana_church$"
 MA_boyana_church_district_desc: "$building_type_MA_boyana_church_desc$"
 building_type_MA_boyana_church: "博亚纳教堂"
 building_type_MA_boyana_church_desc: "这座朴素的教堂初看并不起眼，隐居在金色田野间一座偏僻的乡村小镇中，简单的砖墙与周围景色融为一体。\n然而谦逊的外表之下，隐藏着世人难得一见的无价珍宝：教堂深处装饰着美得令人屏息的湿壁画，每一笔都彰显着神圣的灵感。蓝、红、金三色交融，圣徒的身影随着摇曳的烛火起舞，构成无比神秘的景象。"
 MA_boyana_church: "$building_type_MA_boyana_church$"
 
 #Belogradchik Fortress
 MA_belogradchik_fort_district: "$building_type_MA_belogradchik_fort$"
 MA_belogradchik_fort_district_desc: "$building_type_MA_belogradchik_fort_desc$"
 building_type_MA_belogradchik_fort: "贝洛格拉奇克要塞"
 building_type_MA_belogradchik_fort_desc: "这座要塞坐落于高耸的奇岩之间，仿佛从大地本身生长而出，城墙与山间冰冷的红色岩石浑然一体。优雅的石柱般岩峰从三面包围着要塞，使其几乎坚不可摧。\n当地人讲述着古老的传说：附近森林中的巨人曾徒手垒起高耸的巨石，还有一座修道院因遭受神罚而被岩石吞噬。"
 MA_belogradchik_fort: "$building_type_MA_belogradchik_fort$"
 
 #Studenica Monastery
 MA_studenica_district: "$building_type_MA_studenica$"
 MA_studenica_district_desc: "$building_type_MA_studenica_desc$"
 building_type_MA_studenica: "斯图代尼察修道院"
 building_type_MA_studenica_desc: "这座修道院是塞尔维亚最壮丽的古迹，为当地人带来信仰与安宁，如今隐于一处僻静山谷。\n建筑的墙面融合了拉丁西方与希腊东方的传统：工匠精心雕刻的白色大理石板，以及矗立于鲜红鼓座上的雄伟穹顶，均见证了修道院赞助者的技艺与虔诚。"
 MA_studenica: "$building_type_MA_studenica$"
 
 #Church of the Nativity
 MA_church_nativity_district: "$building_type_MA_church_nativity$"
 MA_church_nativity_district_desc: "$building_type_MA_church_nativity_desc$"
 building_type_MA_church_nativity: "圣诞教堂"
 building_type_MA_church_nativity_desc: "这座圣堂最初由君士坦丁的圣洁母亲下令兴建，后依查士丁尼之命重建，纪念着基督教最神圣的地点之一——基督诞生之地。\n教堂是一座狭长的五廊式巴西利卡，设有凯旋式入口，饰以金色镶嵌画和色彩斑斓的大理石古罗马柱。这里珍藏着多件圣髑与艺术品，传说它们曾多次使教堂免遭入侵之祸。"
 MA_church_nativity: "$building_type_MA_church_nativity$"
 
 #Great Lejre Hall
 MA_lejre_hall_district: "$building_type_MA_lejre_hall$"
 MA_lejre_hall_district_desc: "$building_type_MA_lejre_hall_desc$"
 building_type_MA_lejre_hall: "赫莱兹尔大宴会厅"
 building_type_MA_lejre_hall_desc: "古代国王以高大树木建材和华丽雕刻建造了这座宏伟的蜜酒大厅。\n在此饮宴和征战的伟大英雄与国王的故事，必将激发无数萨迦传说。"
 MA_lejre_hall: "$building_type_MA_lejre_hall$"
 
 #Aetna
 MA_aetna_district: "$building_type_MA_aetna$"
 MA_aetna_district_desc: "$building_type_MA_aetna_desc$"
 building_type_MA_aetna: "埃特纳火山"
 building_type_MA_aetna_desc: "埃特纳山是古代世界最伟大的烈焰火山，傲然俯瞰肥沃的西西里岛，火山灰使周围的土地格外丰饶。\n数千年来，无数神话传说萦绕于它的吐息之中，讲述着赫淮斯托斯神如何在这座地狱般的山腹中锻造神圣造物。"
 MA_aetna: "$building_type_MA_aetna$"
 
 #Brescia Duomo
 MA_duomo_brescia_district: "$building_type_MA_duomo_brescia$"
 MA_duomo_brescia_district_desc: "$building_type_MA_duomo_brescia_desc$"
 building_type_MA_duomo_brescia: "布雷西亚主教座堂"
 building_type_MA_duomo_brescia_desc: "这座圆形石砌教堂坐落于#italic 新城#!的中心，位于古罗马城区以西的布雷西亚新权力核心。厚重的墙体和质朴的罗曼式设计受到耶路撒冷故事的启发，而昏暗的内部，壁画与圣髑诉说着数世纪的虔诚和权势。"
 MA_duomo_brescia: "$building_type_MA_duomo_brescia$"
 
 #Maschio
 MA_maschio_district: "$building_type_MA_maschio$"
 MA_maschio_district_desc: "$building_type_MA_maschio_desc$"
 building_type_MA_maschio: "马斯基奥城堡"
 building_type_MA_maschio_desc: "这座巨大的城堡以石材与火山凝灰岩砌成，高耸于波光粼粼的那不勒斯湾之上。雉堞与雄伟的圆塔以铁腕威慑陆海。\n庞大的牢房和地牢系统深入岩层，其中一些甚至可以追溯至古希腊时代。$MA_warning_palermo_napoli$"
 MA_maschio: "$building_type_MA_maschio$"
 MA_warning_palermo_napoli: "\n\n@alert_icon! #alert_trial 在巴勒莫建造[GetBuildingType('MA_palace_palermo2').GetName]，同时在那不勒斯建造[GetBuildingType('MA_maschio').GetName]，将使你无法完成[GetDecisionWithKey('empower_sicilian_parliament_decision').GetName][decision|E]！#!"
 
 #Basilica of Saint Nicholas
 MA_st_nicholas_district: "$building_type_MA_st_nicholas$"
 MA_st_nicholas_district_desc: "$building_type_MA_st_nicholas_desc$"
 building_type_MA_st_nicholas: "圣尼各老大教堂"
 building_type_MA_st_nicholas_desc: "这座厚重的罗曼式巴西利卡采用当地坚实的石料建成，耀眼的白色在酒蓝色海面上格外醒目。教堂内珍藏着圣尼各老的圣髑，吸引基督教世界各地的朝圣者与巨额财富，引诱他们继续渡海前往圣地。"
 MA_st_nicholas: "$building_type_MA_st_nicholas$"
 
 #Palace of Arechis
 MA_palace_arechis_district: "$building_type_MA_palace_arechis$"
 MA_palace_arechis_district_desc: "$building_type_MA_palace_arechis_desc$"
 building_type_MA_palace_arechis: "阿雷基斯宫"
 building_type_MA_palace_arechis_desc: "这座庞大的宫殿建筑群兴建于古罗马城市贝内文图姆的城区之中，由环形城墙与一座方塔保护。它由伦巴第人的第一位亲王建造，如今已成为这个民族反抗精神与顽强独立的象征。"
 MA_palace_arechis: "$building_type_MA_palace_arechis$"
 
 #Basilica of Saccargia
 MA_saccargia_basilica_district: "$building_type_MA_saccargia_basilica$"
 MA_saccargia_basilica_district_desc: "$building_type_MA_saccargia_basilica_desc$"
 building_type_MA_saccargia_basilica: "萨卡尔贾大教堂"
 building_type_MA_saccargia_basilica_desc: "在撒丁岛干燥而饱经风霜的海岸上，一座黑白相间的石砌巴西利卡引人瞩目，其条纹塔楼从数英里外的海上便清晰可见。来自意大利的工匠受邀参与建造，他们的风格留下了深刻印记。"
 MA_saccargia_basilica: "$building_type_MA_saccargia_basilica$"
 
 #Ruins of Paestum
 MA_paestum_district: "$building_type_MA_paestum$"
 MA_paestum_district_desc: "$building_type_MA_paestum_desc$"
 building_type_MA_paestum: "帕埃斯图姆遗址"
 building_type_MA_paestum_desc: "这座昔日宏伟古城的遗迹如今被荒草和寂静包围，神庙巨柱断裂倾颓。附近的河流使土地沼泽化后，城市逐渐被遗弃，如今很少有人敢冒险进入这片瘴疠之地。"
 MA_paestum: "$building_type_MA_paestum$"
 
 #Tower of Pisa
 MA_tower_pisa_district: "$building_type_MA_tower_pisa$"
 MA_tower_pisa_district_desc: "$building_type_MA_tower_pisa_desc$"
 building_type_MA_tower_pisa: "比萨斜塔"
 building_type_MA_tower_pisa_desc: "这座属于骄傲的比萨城的优雅#italic 钟楼#!，以精美拱廊与闪耀的白石闻名于基督教世界乃至更远之地。自建造以来，塔下的地基不断发生移动，令塔身越来越倾斜。"
 MA_tower_pisa: "$building_type_MA_tower_pisa$"
 
 #Saint Peter's Basilica
 MA_vatican_district: "$building_type_MA_vatican$"
 MA_vatican_district_desc: "$building_type_MA_vatican_desc$"
 building_type_MA_vatican: "圣伯多禄大殿"
 building_type_MA_vatican_desc: "这是君士坦丁下令在罗马兴建的古老大教堂中最神圣的一座，矗立在教会奠基使徒的墓穴之上。\n教堂既宏伟又优雅，高耸的中殿饰以金色马赛克与异域大理石，迎接来自基督教世界的成千上万名朝圣者，也接纳着他们带来的财富与权势。"
 MA_vatican: "$building_type_MA_vatican$"
 
 #Rock of Canossa
 MA_rock_canossa_district: "$building_type_MA_rock_canossa$"
 MA_rock_canossa_district_desc: "$building_type_MA_rock_canossa_desc$"
 building_type_MA_rock_canossa: "卡诺莎岩堡"
 building_type_MA_rock_canossa_desc: "这座坚固的城堡修筑于陡峭的岩峰之上，是一系列雄伟防御工事的核心，守卫着亚平宁山口。从这处与世隔绝的堡垒，领主们俯瞰下方的山谷，安然栖身于岩石与天空之间。"
 MA_rock_canossa: "$building_type_MA_rock_canossa$"
 
 #Hill of Tara
 MA_hill_tara_district: "$building_type_MA_hill_tara$"
 MA_hill_tara_district_desc: "$building_type_MA_hill_tara_desc$"
 building_type_MA_hill_tara: "塔拉山丘"
 building_type_MA_hill_tara_desc: "这座青草覆盖的山丘由堤坝与土垒保护，四周环绕古老的刻石，是爱尔兰至高王的神圣王座。虽然这里没有城墙，土地本身却蕴藏着力量，吸引着全岛各地的来访者。"
 MA_hill_tara: "$building_type_MA_hill_tara$"
 
 #Clonmacnoise
 MA_clonmacnoise_district: "$building_type_MA_clonmacnoise$"
 MA_clonmacnoise_district_desc: "$building_type_MA_clonmacnoise_desc$"
 building_type_MA_clonmacnoise: "克朗马克诺斯"
 building_type_MA_clonmacnoise_desc: "这座宏伟的修道院建立于宽阔的香农河畔，石砌教堂与高耸的圆塔庄严地矗立在风吹过的平原中。随着岁月流逝，这里成为全岛最重要的学术中心之一，吸引着远近各地的学者和朝圣者。"
 MA_clonmacnoise: "$building_type_MA_clonmacnoise$"
 
 #White Stupa of Gaochang
 MA_white_stupa_district: "$building_type_MA_white_stupa$"
 MA_white_stupa_district_desc: "$building_type_MA_white_stupa_desc$"
 building_type_MA_white_stupa: "高昌白塔"
 building_type_MA_white_stupa_desc: "这座闪耀的[Glossary('佛塔','MA_stupa_glossary')]由帝国当局下令修建，以标示中华王朝的统治所及，孤独地矗立于灼热的沙漠之上。其巨大的圆形白色塔身与镀金塔刹深受西藏及印度寺庙影响，也融入木制基座等中国传统元素。"
 MA_white_stupa: "$building_type_MA_white_stupa$"
 
 #Khan Tengri
 MA_khan_tengri_district: "$building_type_MA_khan_tengri$"
 MA_khan_tengri_district_desc: "$building_type_MA_khan_tengri_desc$"
 building_type_MA_khan_tengri: "汗腾格里峰"
 building_type_MA_khan_tengri_desc: "草原人民称其为#italic 天空之主#!。这座高耸的金字塔形大理石山峰，以完美对称的形态超然矗立于群山之上。山坡终年积雪，黄昏泛红，黎明镀金，在澄澈的蔚蓝穹苍下，形成连接天地的神圣轴心。"
 MA_khan_tengri: "$building_type_MA_khan_tengri$"
 
 #Singing Dunes
 MA_singing_dunes_district: "$building_type_MA_singing_dunes$"
 MA_singing_dunes_district_desc: "$building_type_MA_singing_dunes_desc$"
 building_type_MA_singing_dunes: "鸣沙丘"
 building_type_MA_singing_dunes_desc: "距离绿洲不远处，荒凉的草原上隆起一道巨大的新月形沙丘，风从大地深处吹出悠长而摄人心魄的音调。穿越古老亚洲商路的游牧民停下脚步聆听，认为沙丘之歌是精灵的声音，远方的诗人也从其音乐中汲取灵感。"
 MA_singing_dunes: "$building_type_MA_singing_dunes$"
 
 #Dakhma of Gurganj
 MA_dakhma_district: "$building_type_MA_dakhma$"
 MA_dakhma_district_desc: "$building_type_MA_dakhma_desc$"
 building_type_MA_dakhma: "古尔干季寂静塔"
 building_type_MA_dakhma_desc: "这座巨大的圆形#italic 达赫玛#!，即寂静塔，耸立于平原上一处孤独的高地。昔日琐罗亚斯德教徒在此将死者暴露于净化的天空与阳光之下。随着信众一年比一年稀少，塔上举行的葬礼日渐减少，驻守的哨兵却愈来愈多——其高度与形状如今更适合瞭望，而非礼拜。\n\n#help 若由实行#game_link 天葬#!的[faith|E]持有或居住，该塔将提供额外效果。#!"
 MA_dakhma: "$building_type_MA_dakhma$"
 
 #Black Ruins
 MA_karabalgasun_district: "$building_type_MA_karabalgasun$"
 MA_karabalgasun_district_desc: "$building_type_MA_karabalgasun_desc$"
 building_type_MA_karabalgasun: "黑色废墟"
 building_type_MA_karabalgasun_desc: "曾经强大的宫殿坐落于草原上最伟大的帝国之一的心脏地带，如今只剩残破的土墙与断柱。狂风呼啸着穿过空荡的庭院，雕刻石块半埋在草木尘土间，但旅人仍会经过此地，称它为#italic 哈剌巴剌合孙#!，意为黑色废墟。"
 MA_karabalgasun: "$building_type_MA_karabalgasun$"
 
 #City of the Army
 MA_ordu_district: "$building_type_MA_ordu$"
 MA_ordu_district_desc: "$building_type_MA_ordu_desc$"
 building_type_MA_ordu: "军队之城"
 building_type_MA_ordu_desc: "在欧亚商路交汇处，坐落着一座商人、廷臣与马匹云集的大城。\n土墙与宽阔的护城河保护着这座城市，列柱大道两侧散布着帐篷与寺庙，一直通往草原大领主的镀金大帐，他便在此统治四方。"
 MA_ordu: "$building_type_MA_ordu$"
 
 #Kurgan of the Rider
 MA_kurgan_district: "$building_type_MA_kurgan$"
 MA_kurgan_district_desc: "$building_type_MA_kurgan_desc$"
 building_type_MA_kurgan: "骑士库尔干"
 building_type_MA_kurgan_desc: "当地人讲述着一位伟大骑士曾纵横此地，而他的灵魂至今仍驰骋于草原之上。\n据说他安葬在一座巨大的土丘——库尔干之下，四周的石环标示着他的领地边界。记得他名字的人越来越少，但坟冢依旧傲立于风中，抵抗着时间的侵蚀。"
 MA_kurgan: "$building_type_MA_kurgan$"
 
 #Cliffs of Ustyurt
 MA_ustyurt_cliffs_district: "$building_type_MA_ustyurt_cliffs$"
 MA_ustyurt_cliffs_district_desc: "$building_type_MA_ustyurt_cliffs_desc$"
 building_type_MA_ustyurt_cliffs: "乌斯秋尔特悬崖"
 building_type_MA_ustyurt_cliffs_desc: "这些经风雨雕琢的峭壁标志着荒凉高原与内海海岸的分界，峡谷纵横，洞穴密布。此地严酷而缺水，迫使猎人改变狩猎方式，创造出#italic 阿兰#!——一种石制陷阱，将野兽群驱赶至狭窄的通道，让峭壁成为无声的死亡剧场。"
 MA_ustyurt_cliffs: "$building_type_MA_ustyurt_cliffs$"
 
 #White Fortress
 MA_sarkel_district: "$building_type_MA_sarkel$"
 MA_sarkel_district_desc: "$building_type_MA_sarkel_desc$"
 building_type_MA_sarkel: "白色要塞"
 building_type_MA_sarkel_desc: "#italic 萨尔克尔#!——意为白色要塞——是一座以白色石灰岩和砖块建成的宏伟堡垒。可汗为巩固国土北境，曾向罗马皇帝请求派遣工程师，于是此堡修筑于顿河左岸。如今它控制着顿河与伏尔加河之间的战略陆路转运地，向北方广大土地投射军力，并保护贯穿本地区的重要贸易路线。"
 MA_sarkel: "$building_type_MA_sarkel$"
 
 #Nilometer
 MA_nilometer_district: "$building_type_MA_nilometer$"
 MA_nilometer_district_desc: "$building_type_MA_nilometer_desc$"
 building_type_MA_nilometer: "尼罗河水位计"
 building_type_MA_nilometer_desc: "这间狭窄的石室建于泥泞的河岸，便于测量尼罗河水位涨落并规划农耕。新的伊斯兰统治者下令兴建它，以延续当地古老的传统，将洪水与丰收纳入国家秩序之中。"
 MA_nilometer: "$building_type_MA_nilometer$"
 
 #Abu Simbel
 MA_abu_simbel_district: "$building_type_MA_abu_simbel$"
 MA_abu_simbel_district_desc: "$building_type_MA_abu_simbel_desc$"
 building_type_MA_abu_simbel: "阿布辛贝神庙"
 building_type_MA_abu_simbel_desc: "数代之前，古代法老凿刻的巨像自岩石沙丘中拔地而起，其规模至今举世无双。\n无论是普通旅人还是伟大君王，凡亲眼见到它们的庄严气象，都难免为其中所讲述的故事而受到启迪。"
 MA_abu_simbel: "$building_type_MA_abu_simbel$"
 
 #Red and White Monasteries
 MA_red_white_monasteries_district: "$building_type_MA_red_white_monasteries$"
 MA_red_white_monasteries_district_desc: "$building_type_MA_red_white_monasteries_desc$"
 building_type_MA_red_white_monasteries: "红白修道院"
 building_type_MA_red_white_monasteries_desc: "两座古老的科普特修道院矗立在尼罗河畔附近，因建筑石材的鲜明色泽而得名：一座呈深沉的土红色，另一座则苍白明亮。它们虽远离尘嚣，却未被遗忘。古老圣歌在礼拜堂中回荡，褪色壁画装饰着墙面，它们保存着一种博学而虔诚的基督教传统，历史可追溯至穆斯林统治者穿越西奈的沙漠与岩山、征服这些土地之前。"
 MA_red_white_monasteries: "$building_type_MA_red_white_monasteries$"
 
 #Knossos
 MA_knossos_ruins_district: "$building_type_MA_knossos_ruins$"
 MA_knossos_ruins_district_desc: "$building_type_MA_knossos_ruins_desc$"
 building_type_MA_knossos_ruins: "克诺索斯宫殿"
 building_type_MA_knossos_ruins_desc: "古老的克诺索斯宫殿俯瞰着壮丽的大海，保存着昔日诸王与神话的记忆。宏伟的厅堂、石柱与壁画讲述着遥远年代的财富和权力，令旅人陶醉，也激励那些渴望跻身克里特强大统治者之列的人们。"
 MA_knossos_ruins: "克诺索斯遗址"
 MA_knossos: "$building_type_MA_knossos_ruins$"
 
 #Skara Brae
 MA_skara_brae_district: "$building_type_MA_skara_brae$"
 MA_skara_brae_district_desc: "$building_type_MA_skara_brae_desc$"
 building_type_MA_skara_brae: "斯卡拉布雷"
 building_type_MA_skara_brae_desc: "在狂风肆虐的海岸上，一组古老的石屋从青草覆盖的山丘中微微露出，半掩埋于地下。\n海上刺骨的微风吹拂着它们，低矮而饱经风霜的墙体在沉默中屹立，炉火早已熄灭了无数世纪，却仍仿佛回荡着消逝生命的记忆。"
 MA_skara_brae: "$building_type_MA_skara_brae$"
 
 #Whitehorse Hill
 MA_whitehorse_hill_district: "$building_type_MA_whitehorse_hill$"
 MA_whitehorse_hill_district_desc: "$building_type_MA_whitehorse_hill_desc$"
 building_type_MA_whitehorse_hill: "白马山"
 building_type_MA_whitehorse_hill_desc: "#flavor 在阿宾顿镇附近有一座山，山上绘有一匹白色的骏马。那里寸草不生。#!"
 MA_whitehorse_hill: "$building_type_MA_whitehorse_hill$"
 
 #Gagikashen
 MA_gagikashen_district: "$building_type_MA_gagikashen$"
 MA_gagikashen_district_desc: "$building_type_MA_gagikashen_desc$"
 building_type_MA_gagikashen: "加吉卡申教堂"
 building_type_MA_gagikashen_desc: "这座奉献给圣格列高利的大型圆形教堂，高耸于阿尼的高地之上。建造者从兹瓦尔特诺茨主教座堂的遗址中汲取灵感。高大的鼓座分三层升起，柱环与侧礼拜堂围绕着和谐而明朗的中央空间。"
 MA_gagikashen: "$building_type_MA_gagikashen$"
 
 #Saint Gall
 MA_saint_gall_district: "$building_type_MA_saint_gall$"
 MA_saint_gall_district_desc: "$building_type_MA_saint_gall_desc$"
 building_type_MA_saint_gall: "圣加仑修道院"
 building_type_MA_saint_gall_desc: "这座庞大的修道院建筑群位于阿勒曼尼土地边缘，建立在圣加卢斯隐修之所的旧址上。它以严格的纪律和组织著称，拥有品质非凡的#italic 缮写室#!与图书馆，僧侣们在此抄录、翻译并保存古典与神圣著作，供整个基督教世界的学者研习。"
 MA_saint_gall: "$building_type_MA_saint_gall$"
 
 #Sé of Lisbon
 MA_se_lisbon_district: "$building_type_MA_se_lisbon$"
 MA_se_lisbon_district_desc: "$building_type_MA_se_lisbon_desc$"
 building_type_MA_se_lisbon: "里斯本主教座堂"
 building_type_MA_se_lisbon_desc: "这座厚重的罗曼式大教堂建于港口上方的坡地，厚墙与窄窗映照着伊比利亚争战的动荡时代。基督徒重新征服这座城市后，教堂在一座旧清真寺的遗址上兴建，石拱顶下珍藏着圣文森特的圣髑，迎接回响于中殿中的游行队伍。"
 MA_se_lisbon: "$building_type_MA_se_lisbon$"
 
 #Alto Douro Vineyards
 MA_alto_douro_district: "$building_type_MA_alto_douro$"
 MA_alto_douro_district_desc: "$building_type_MA_alto_douro_desc$"
 building_type_MA_alto_douro: "上杜罗河葡萄园"
 building_type_MA_alto_douro_desc: "杜罗河谷陡峭的山坡上开辟了层层梯田葡萄园，石墙固土，引来日照。自罗马时代首次栽种以来，这些葡萄园长期出产浓烈的深色葡萄酒，沿河运往沿海市场与异国宫廷。"
 MA_alto_douro: "$building_type_MA_alto_douro$"
 
 #Fortifications on the Guadalquivir
 MA_guadalquivir_fortifications_district: "$building_type_MA_guadalquivir_fortifications$"
 MA_guadalquivir_fortifications_district_desc: "$building_type_MA_guadalquivir_fortifications_desc$"
 building_type_MA_guadalquivir_fortifications: "瓜达尔基维尔河防御工事"
 building_type_MA_guadalquivir_fortifications_desc: "沿瓜达尔基维尔河岸绵延的防御工事，以遍布的塔楼与城门守卫着塞维利亚繁忙的港口。其中最引人注目的是黄金塔，一座十二边形瞭望塔，表面涂有金色石灰浆，在河面上熠熠生辉，既为来船指引方向，也向它们宣示城市的力量。"
 MA_guadalquivir_fortifications: "$building_type_MA_guadalquivir_fortifications$"
 
 #Madinat al-Zahra
 MA_madinat_alzahra_district: "$building_type_MA_madinat_alzahra$"
 MA_madinat_alzahra_district_desc: "$building_type_MA_madinat_alzahra_desc$"
 building_type_MA_madinat_alzahra: "麦地那·阿萨哈拉"
 building_type_MA_madinat_alzahra_desc: "这座广阔的宫殿城市建于科尔多瓦乡间平缓的山麓，旨在彰显哈里发宫廷的辉煌。花园、亭阁与觐见厅分布在宽广的台地上，大理石与碧玉墙面雕琢精美，其壮丽景象令诗人歌咏人生最美好的享乐。"
 MA_madinat_alzahra: "$building_type_MA_madinat_alzahra$"
 
 #Circus of Merida
 MA_circus_merida_district: "$building_type_MA_circus_merida$"
 MA_circus_merida_district_desc: "$building_type_MA_circus_merida_desc$"
 building_type_MA_circus_merida: "梅里达竞技场"
 building_type_MA_circus_merida_desc: "古罗马竞技场的遗迹在梅里达城外平原上狭长延伸，坍塌的墙壁与长草的赛道依然勾勒出轮廓，零星的柏树洒下温和的树荫。不远处，一座有着宁静墓地的小教堂在遗迹之外兴起，为这片失去往昔用途的土地赋予了新的意义。"
 MA_circus_merida: "$building_type_MA_circus_merida$"
 
 #Alhambra
 MA_alhambra1_district: "$building_type_MA_alhambra1$"
 MA_alhambra1_district_desc: "$building_type_MA_alhambra1_desc$"
 building_type_MA_alhambra1: "阿尔罕布拉宫"
 building_type_MA_alhambra1_desc: "阿尔罕布拉宫的红色城墙矗立在和缓的萨比卡山上，俯瞰格拉纳达及其肥沃平原。城中统治者在墙内躲避敌人和盛夏的酷热，高塔与雉堞则向下方大地宣示其统治权威。"
 MA_alhambra2: "新城堡"
 MA_alhambra3: "庭院与花园"
 MA_alhambra4: "狮子庭院"
 MA_alhambra1: "红色要塞"
 
 #The Cologne Cathedral
 MA_cologne_cathedral1_district: "$building_type_MA_cologne_cathedral1$"
 MA_cologne_cathedral1_district_desc: "$building_type_MA_cologne_cathedral1_desc$"
 building_type_MA_cologne_cathedral1: "科隆大教堂"
 building_type_MA_cologne_cathedral1_desc: "科隆的大教堂是大主教的驻地，也是城市引以为傲的象征。经过数世纪扩建与修缮，它收藏着价值无法估量的圣髑，吸引各地朝圣者前来，雄伟的墙体高高超出城市的屋顶。"
 MA_cologne_cathedral1: "科隆旧主教座堂"
 MA_cologne_cathedral2: "科隆双尖塔"
 
 #Qutb Complex
 MA_qutb_complex1_district: "$building_type_MA_qutb_complex1$"
 MA_qutb_complex1_district_desc: "$building_type_MA_qutb_complex1_desc$"
 building_type_MA_qutb_complex1: "顾特卜建筑群"
 building_type_MA_qutb_complex1_desc: "德里市中心有一处古老的神圣圣域，历代统治者在此修建纪念建筑与神庙，彰显信仰和权势。雕刻石柱与庭院环绕着笈多王朝的巨大铁柱，黝黑的柱身历经王朝与神祇的更迭而屹立不倒。"
 MA_qutb_complex1: "铁柱"
 MA_qutb_complex2: "德里大清真寺"
 MA_qutb_complex3: "顾特卜塔"
 MA_qutb_complex4: "阿莱塔"
 
 #Sigiriya
 MA_sigiriya1_district: "$building_type_MA_sigiriya1$"
 MA_sigiriya1_district_desc: "$building_type_MA_sigiriya1_desc$"
 building_type_MA_sigiriya1: "狮子岩"
 building_type_MA_sigiriya1_desc: "一块巨大而孤独的岩石从茂密丛林中拔地而起，顶端是古代[Glossary('狮子岩','MA_sigiriya_glossary')]王家城堡的所在地。阶梯攀过绘有壁画的墙面与巨大的狮门，高于层叠的花园与水池，见证那些将居所建在云端的国王的雄心。"
 MA_sigiriya1: "狮子岩遗址"
 MA_sigiriya2: "修复的狮子岩"
 MA_sigiriya_glossary: "僧伽罗语，字面意思是\"狮子岩\"。"
 
 #Great Sanchi Stupa
 MA_sanchi_stupa_district: "$building_type_MA_sanchi_stupa$"
 MA_sanchi_stupa_district_desc: "$building_type_MA_sanchi_stupa_desc$"
 building_type_MA_sanchi_stupa: "桑奇大佛塔"
 building_type_MA_sanchi_stupa_desc: "这座巨大的砖石圆顶最初奉强大的阿育王之命建造。此后建筑群由继任者扩建，也遭受岁月摧残。佛塔立于高台之上，周围环绕雕刻栏杆与装饰华美的#italics 塔门#!，朝圣者怀着无尽的虔诚绕门巡礼。"
 MA_sanchi_stupa: "$building_type_MA_sanchi_stupa$"
 
 #Vindhyagiri Hill
 MA_gommateshwara1_district: "$building_type_MA_gommateshwara1$"
 MA_gommateshwara1_district_desc: "$building_type_MA_gommateshwara1_desc$"
 building_type_MA_gommateshwara1: "文迪亚吉里山"
 building_type_MA_gommateshwara1_desc: "文迪亚吉里的花岗岩山峰陡峭地耸立于室罗伐那贝拉戈拉镇之上，山顶遍布耆那教的圣祠和庭院。朝圣者赤足攀上凿刻的阶梯，空气中弥漫着钟声和被阳光晒暖的岩石气息。"
 MA_gommateshwara2: "戈马特什瓦拉巨像"
 MA_gommateshwara1: "文迪亚吉里神庙群"
 
 #Palace of Ghazni
 MA_ghazni_palace_district: "$building_type_MA_ghazni_palace$"
 MA_ghazni_palace_district_desc: "$building_type_MA_ghazni_palace_desc$"
 building_type_MA_ghazni_palace: "伽色尼王宫"
 building_type_MA_ghazni_palace_desc: "这座王家居所坐落在伽色尼城墙之外，是城中苏丹的权力中心。各厅堂从四方形的#italic 伊万#!庭院向外延伸，受波斯艺术启发，以精湛的灰泥雕饰与多彩瓷砖装点得富丽堂皇。"
 MA_ghazni_palace: "$building_type_MA_ghazni_palace$"
 
 #Stupas of Anuradhapura
 MA_stupas_anuradhapura_district: "$building_type_MA_stupas_anuradhapura$"
 MA_stupas_anuradhapura_district_desc: "$building_type_MA_stupas_anuradhapura_desc$"
 building_type_MA_stupas_anuradhapura: "阿努拉德普勒佛塔群"
 building_type_MA_stupas_anuradhapura_desc: "古老寺庙城市阿努拉德普勒周围散布着僧伽罗国王修建的巨大砖砌[Glossary('佛塔','MA_stupa_glossary')]，用于供奉佛陀舍利。城中修道院与学术中心粉刷洁白，在阳光下熠熠生辉，厅堂与庭院里充满了辩论之声。"
 MA_stupas_anuradhapura: "$building_type_MA_stupas_anuradhapura$"
 
 #Eye of the Sahara
 MA_eye_sahara_district: "$building_type_MA_eye_sahara$"
 MA_eye_sahara_district_desc: "$building_type_MA_eye_sahara_desc$"
 building_type_MA_eye_sahara: "撒哈拉之眼"
 building_type_MA_eye_sahara_desc: "沙漠深处有一片巨大的环形地貌，层层岩石环带在沙海上延伸数英里。远望如一只饱经风霜的巨眼仰望天空，是穿越荒漠的游牧民与商队熟知的地标。\n古老传说认为这里曾是一座繁盛的城市，绿意盎然，流水潺潺，如今却已被黄沙吞没。"
 MA_eye_sahara: "$building_type_MA_eye_sahara$"
 
 #Great Mosque of Mahdia
 MA_mahdia_mosque_district: "$building_type_MA_mahdia_mosque$"
 MA_mahdia_mosque_district_desc: "$building_type_MA_mahdia_mosque_desc$"
 building_type_MA_mahdia_mosque: "马赫迪耶大清真寺"
 building_type_MA_mahdia_mosque_desc: "这座朴素的清真寺建于马赫迪耶半岛崎岖的海岸上，淡色石塔使其看起来宛如堡垒。\n内部两座美丽的拱廊庭院通往礼拜大厅，信众在浅色石拱下聚集祈祷。"
 MA_mahdia_mosque: "$building_type_MA_mahdia_mosque$"
 
 #Saint Mark's of Zagreb
 MA_zagreb_church_district: "$building_type_MA_zagreb_church$"
 MA_zagreb_church_district_desc: "$building_type_MA_zagreb_church_desc$"
 building_type_MA_zagreb_church: "萨格勒布圣马尔谷教堂"
 building_type_MA_zagreb_church_desc: "圣马尔谷教堂由意大利与德意志工匠协助建造，高耸于城中其他建筑之上。其罗曼式布局经过哥特式增建点缀，门廊和墙壁上绘有丰富的圣经故事。"
 MA_zagreb_church: "$building_type_MA_zagreb_church$"
 
 #Walls of Balkh
 MA_walls_balkh_district: "$building_type_MA_walls_balkh$"
 MA_walls_balkh_district_desc: "$building_type_MA_walls_balkh_desc$"
 building_type_MA_walls_balkh: "巴尔赫城墙"
 building_type_MA_walls_balkh_desc: "数世纪以来，两道同心的大型环形城墙保护着巴尔赫城堡，内外两层环绕着整个城区。土垒与塔楼构成抵御横扫草原的大军的屏障，保护着城内的市场和作坊。"
 MA_walls_balkh: "$building_type_MA_walls_balkh$"
 
 #Martand Sun Temple
 MA_martand_sun_temple_district: "$building_type_MA_martand_sun_temple$"
 MA_martand_sun_temple_district_desc: "$building_type_MA_martand_sun_temple_desc$"
 building_type_MA_martand_sun_temple: "马尔坦德太阳神庙"
 building_type_MA_martand_sun_temple_desc: "这座神庙建于克什米尔河谷的高原之上，是最古老的太阳神庙之一。巨大的圣所在中心，四周遍布较小的神龛，以及一排排神灵和天界人物的雕像。柱廊庭院中有一池宁静的清水，在阳光下闪闪发亮。"
 MA_martand_sun_temple: "$building_type_MA_martand_sun_temple$"
 
 #Ruins of Aquae Sulis
 MA_aquae_sulis_ruins_district: "$building_type_MA_aquae_sulis_ruins$"
 MA_aquae_sulis_ruins_district_desc: "$building_type_MA_aquae_sulis_ruins_desc$"
 building_type_MA_aquae_sulis_ruins: "阿夸埃苏利斯遗址"
 building_type_MA_aquae_sulis_ruins_desc: "#low 巨人之作正走向衰朽#! \n在蒸汽升腾的神圣泉眼周围，散布着阿夸埃苏利斯的残垣断壁，罗马人曾在此以整齐的石块建造宏伟的浴场和神庙。破碎的墙壁、倒塌的拱门与被水淹没的房间，仍勾勒出这片古代建筑群的井然布局；温暖的泉水依旧流淌，朝圣者与市民在废墟中聚集。"
 MA_aquae_sulis_ruins: "$building_type_MA_aquae_sulis_ruins$"
 
 #Winchester Minster
 MA_winchester_minster_district: "$building_type_MA_winchester_minster$"
 MA_winchester_minster_district_desc: "$building_type_MA_winchester_minster_desc$"
 building_type_MA_winchester_minster: "温彻斯特大教堂"
 building_type_MA_winchester_minster_desc: "这座宏伟的大教堂是一座由石料与木材建成的巨大巴西利卡，拥有宽阔的彩绘中殿和多座钟楼。它俯瞰整座王城，规模远超其他建筑，并守护着威塞克斯王室陵墓。"
 MA_winchester_minster: "$building_type_MA_winchester_minster$"
 
 #Westminster Abbey
 MA_westminster_abbey_district: "$building_type_MA_westminster_abbey$"
 MA_westminster_abbey_district_desc: "$building_type_MA_westminster_abbey_desc$"
 building_type_MA_westminster_abbey: "威斯敏斯特修道院"
 building_type_MA_westminster_abbey_desc: "威斯敏斯特修道院建于泰晤士河畔，受到英格兰国王的慷慨捐赠，是一座宏伟的石砌修道院教堂。狭长的中殿与高耸的唱诗班席位饰以雕刻柱头和彩绘墙壁。国王在此加冕并长眠于此，修道院成为将王权与神恩联结起来的神圣舞台。"
 MA_westminster_abbey: "$building_type_MA_westminster_abbey$"
 
 #Lorsch Gate
 MA_lorsch_gate_district: "$building_type_MA_lorsch_gate$"
 MA_lorsch_gate_district_desc: "$building_type_MA_lorsch_gate_desc$"
 building_type_MA_lorsch_gate: "洛尔施门楼"
 building_type_MA_lorsch_gate_desc: "洛尔施修道院的宏伟门楼是加洛林建筑中罕见且精心建造的范例。它采用精心切割的石料与砖块砌成，对称立面由附墙柱、盲拱与呼应古罗马范式的古典装饰构成。"
 MA_lorsch_gate: "$building_type_MA_lorsch_gate$"
 
 #Dover Castle
 MA_dover_castle_district: "$building_type_MA_dover_castle$"
 MA_dover_castle_district_desc: "$building_type_MA_dover_castle_desc$"
 building_type_MA_dover_castle: "多佛城堡"
 building_type_MA_dover_castle_desc: "这座要塞坐落在俯瞰狭窄海峡的白色峭壁上，控制着英格兰与欧洲大陆之间的主要门户。巨大的石砌主楼、围墙和层层设防的城门楼组成坚固的防御体系，控制着港口及通向内陆的道路，同时充当王室堡垒与居所。"
 MA_dover_castle: "$building_type_MA_dover_castle$"
 
 #Château Gaillard
 MA_chateau_gaillard_district: "$building_type_MA_chateau_gaillard$"
 MA_chateau_gaillard_district_desc: "$building_type_MA_chateau_gaillard_desc$"
 building_type_MA_chateau_gaillard: "加亚尔城堡"
 building_type_MA_chateau_gaillard_desc: "加亚尔城堡建于塞纳河上方的石灰岩岬角，是一座精巧而紧凑、专为主动防御设计的石砌要塞。同心城墙、折角塔楼和朝向敌人的门防设施尽量消除射击死角，将火力集中于接近路线。它建造迅速且精确，体现了当时军事建筑的最新原则，守护着诺曼底的河道与边疆。"
 MA_chateau_gaillard: "$building_type_MA_chateau_gaillard$"
 
 #Carnac Stones
 MA_carnac_stones_district: "$building_type_MA_carnac_stones$"
 MA_carnac_stones_district_desc: "$building_type_MA_carnac_stones_desc$"
 building_type_MA_carnac_stones: "卡纳克巨石阵"
 building_type_MA_carnac_stones_desc: "数百块巨石遍布平原，排列成整齐的行列，向地平线延伸。它们立于远超人们记忆的古老时代，真正的用途已湮没在传说与故事之中。"
 MA_carnac_stones: "$building_type_MA_carnac_stones$"
 
 #Guérande Salt Marshes
 MA_guerande_salt_marshes_district: "$building_type_MA_guerande_salt_marshes$"
 MA_guerande_salt_marshes_district_desc: "$building_type_MA_guerande_salt_marshes_desc$"
 building_type_MA_guerande_salt_marshes: "盖朗德盐田"
 building_type_MA_guerande_salt_marshes_desc: "盖朗德附近低洼的海岸平地上，盐池、堤坝和水渠纵横交错，人们用它们从海水中提取名贵的#italic 盐之花#!。海水被引入浅池，经阳光蒸发析出白盐，这门代代相传的技艺维系着当地城镇和贸易。"
 MA_guerande_salt_marshes: "$building_type_MA_guerande_salt_marshes$"
 
 #Reims Cathedral
 MA_reims_cathedral_district: "$building_type_MA_reims_cathedral$"
 MA_reims_cathedral_district_desc: "$building_type_MA_reims_cathedral_desc$"
 building_type_MA_reims_cathedral: "兰斯大教堂"
 building_type_MA_reims_cathedral_desc: "这座宏大的哥特式主教座堂以高耸的中殿、纤细的束柱，以及广泛采用肋拱顶和飞扶壁而著称。西立面装饰着雕刻精美的门廊和深邃的拱券，而室内的彩色玻璃墙面强调高度、光线与仪式的庄严，正与其在法国王室加冕礼中的核心地位相称。"
 MA_reims_cathedral: "$building_type_MA_reims_cathedral$"
 
 #Chartres Cathedral
 MA_chartres_cathedral_district: "$building_type_MA_chartres_cathedral$"
 MA_chartres_cathedral_district_desc: "$building_type_MA_chartres_cathedral_desc$"
 building_type_MA_chartres_cathedral: "沙特尔大教堂"
 building_type_MA_chartres_cathedral_desc: "沙特尔大教堂是盛期哥特式建筑雄心最优雅、最有秩序的典范之一，以宽阔的中殿、坚实的支柱和深邃的唱诗班席位著称。坚固的骨架结构让墙体大部分化作彩绘玻璃，双塔与比例精确的立面则传达着稳定、明晰与神学意涵。"
 MA_chartres_cathedral: "$building_type_MA_chartres_cathedral$"
 
 #Palace of Avignon
 MA_avignon_palace1_district: "$building_type_MA_avignon_palace1$"
 MA_avignon_palace1_district_desc: "$building_type_MA_avignon_palace1_desc$"
 building_type_MA_avignon_palace1: "阿维尼翁宫"
 building_type_MA_avignon_palace1_desc: "这座雄伟的宫殿要塞坐落于罗讷河畔的岩石高地，是一座精致而强大的宫廷所在地。大厅、塔楼与拱顶礼拜堂线条坚固而优雅，山下街道上挤满了被统治者财富与权势吸引而来的使节、工匠和商人。"
 MA_avignon_palace1: "旧宫"
 MA_avignon_palace2: "新宫"
 
 #Walls of Carcassonne
 MA_walls_carcassonne1_district: "$building_type_MA_walls_carcassonne1$"
 MA_walls_carcassonne1_district_desc: "$building_type_MA_walls_carcassonne1_desc$"
 building_type_MA_walls_carcassonne1: "卡尔卡松城墙"
 building_type_MA_walls_carcassonne1_desc: "卡尔卡松古老的城墙守卫着山谷，以及连接伊比利亚与法兰克土地的道路。塔楼与坚固的城门防御工事环绕整座城区，保护着城内房屋与城下田野。这是一处坚固的边疆要塞，历来为诸王与各方信仰所争夺。"
 MA_walls_carcassonne1: "卡尔卡松古城墙"
 MA_walls_carcassonne2: "卡尔卡松双重城墙"
 
 #Saint-Denis Basilica
 MA_saint_denis_basilica1_district: "$building_type_MA_saint_denis_basilica1$"
 MA_saint_denis_basilica1_district_desc: "$building_type_MA_saint_denis_basilica1_desc$"
 building_type_MA_saint_denis_basilica1: "圣但尼大教堂"
 building_type_MA_saint_denis_basilica1_desc: "这座宏伟的宗座圣殿建于圣但尼的墓址之上，是王室虔敬的圣所。宽阔的中殿引导朝圣者走向圣徒圣龛，彩绘墙面与雕刻柱头守望着长眠地下的国王。在此，王冠与教会的权威凝结于石材之中。"
 MA_saint_denis_basilica1: "圣但尼皇家大教堂"
 MA_saint_denis_basilica2: "圣但尼大唱诗班席"
 
 #Île de la Cité
 MA_ile_de_la_cite1_district: "$building_type_MA_ile_de_la_cite1$"
 MA_ile_de_la_cite1_district_desc: "$building_type_MA_ile_de_la_cite1_desc$"
 building_type_MA_ile_de_la_cite1: "西岱岛"
 building_type_MA_ile_de_la_cite1_desc: "罗马帝国覆灭后，市民在塞纳河转弯处被河水环绕的岛上找到了安全。然而此后西岱岛日益繁荣、美丽而骄傲，如今已成为巴黎乃至整个法兰西的政治、知识与商业心脏。"
 MA_ile_de_la_cite1: "加洛林宫殿"
 MA_ile_de_la_cite2: "哥特式宫殿"
 
 #Iron Gate
 MA_iron_gate_district: "$building_type_MA_iron_gate$"
 MA_iron_gate_district_desc: "$building_type_MA_iron_gate_desc$"
 building_type_MA_iron_gate: "铁门"
 building_type_MA_iron_gate_desc: "铁门守卫着连接奥龙特斯平原与上方山脉的山口，是安条克最重要的入口之一。城墙在此收窄成坚固的隘口，石塔、城门和挡土墙直接锚固于岩石之中。城堡还起到类似水坝的作用，控制帕尔梅尼奥斯河的急流，保护城市。"
 MA_iron_gate: "$building_type_MA_iron_gate$"
 
 #Pula Amphitheater
 MA_pula_amphiteater_district: "$building_type_MA_pula_amphiteater$"
 MA_pula_amphiteater_district_desc: "$building_type_MA_pula_amphiteater_desc$"
 building_type_MA_pula_amphiteater: "普拉竞技场"
 building_type_MA_pula_amphiteater_desc: "这座竞技场采用精细切割的石灰岩建造，保留着完整的罗马圆形竞技场形制：椭圆形围墙、阶梯式看台以及下方的拱顶廊道系统。四座角塔与坚固的拱廊体现了建造者引以为傲的工程传统，这座建筑在中世纪城市中仍是权威、集会与表演的中心。"
 MA_pula_amphiteater: "$building_type_MA_pula_amphiteater$"
 
 #Olympus
 MA_olympus_district: "$building_type_MA_olympus$"
 MA_olympus_district_desc: "$building_type_MA_olympus_desc$"
 building_type_MA_olympus: "奥林匹斯山"
 building_type_MA_olympus_desc: "这座高耸的山峰位于色萨利腹地，锯齿状的峰顶是全希腊最高之处，向海洋与和缓肥沃的山坡投下长长的阴影。\n人们相信这里是众神的居所，数千年来它令人敬畏，据说山顶矗立着众神无形的宫殿。"
 MA_olympus: "$building_type_MA_olympus$"
 
 #Ypres Cloth Hall
 MA_ypres_cloth_hall_district: "$building_type_MA_ypres_cloth_hall$"
 MA_ypres_cloth_hall_district_desc: "$building_type_MA_ypres_cloth_hall_desc$"
 building_type_MA_ypres_cloth_hall: "伊普尔布业大厅"
 building_type_MA_ypres_cloth_hall_desc: "这座庞大的市政大厅以石材和木材建成，供管理、储藏与交易羊毛织物之用，这一产业是城市财富的根基。修长而整齐的立面由拱廊、山墙与高耸钟楼构成，将商贸功能与城市权威融为一体。在拱顶大厅中，商人、行会官员和市政官监督契约、度量衡与税收，掌控城市经济的核心。"
 MA_ypres_cloth_hall: "$building_type_MA_ypres_cloth_hall$"
 
 #Gravensteen
 MA_gravensteen_district: "$building_type_MA_gravensteen$"
 MA_gravensteen_district_desc: "$building_type_MA_gravensteen_desc$"
 building_type_MA_gravensteen: "伯爵城堡"
 building_type_MA_gravensteen_desc: "这座雄伟的石砌城堡是佛兰德伯爵的驻地，也是伯爵统治城市的象征。建筑以巨大的主楼为中心，四周环绕厚实的围墙，内部兼具居住厅堂、司法厅与军事防御设施，在根特稠密的城区中彰显领主权威。"
 MA_gravensteen: "$building_type_MA_gravensteen$"
 
 #Mount Ararat
 MA_ararat_district: "$building_type_MA_ararat$"
 MA_ararat_district_desc: "$building_type_MA_ararat_desc$"
 building_type_MA_ararat: "亚拉腊山"
 building_type_MA_ararat_desc: "亚拉腊山是一座由双峰组成的巨大火山山体，高耸于周围平原之上，终年积雪的峰顶主宰着天际。各国与各信仰都敬畏这座山，它与诺亚方舟停泊之地的古老传统相连，为山麓的土地赋予神圣权威与庄严气象。"
 MA_ararat: "$building_type_MA_ararat$"
 
 #Székesfehérvár Basilica
 MA_szekesfehervar_basilica1_district: "$building_type_MA_szekesfehervar_basilica1$"
 MA_szekesfehervar_basilica1_district_desc: "$building_type_MA_szekesfehervar_basilica1_desc$"
 building_type_MA_szekesfehervar_basilica1: "塞克什白堡大教堂"
 building_type_MA_szekesfehervar_basilica1_desc: "这座宏伟的石砌宗座圣殿是匈牙利王国的礼仪与王朝中心。国王们在其宽阔的中殿加冕并安息，使王权、法律与信仰在王国最重要的皇家圣所拱顶之下紧密结合。"
 MA_szekesfehervar_basilica1: "塞克什白堡皇家大教堂"
 MA_szekesfehervar_basilica2: "塞克什白堡大唱诗班席"
 
 #Prague Castle
 MA_prague_castle1_district: "$building_type_MA_prague_castle1$"
 MA_prague_castle1_district_desc: "$building_type_MA_prague_castle1_desc$"
 building_type_MA_prague_castle1: "布拉格城堡"
 building_type_MA_prague_castle1_desc: "在伏尔塔瓦河畔的长形山脊上，布拉格城堡的大厅、教堂与庭院俯瞰着下方城市。工匠、侍从与神职人员聚集在波希米亚统治者的驻地周围，他们的财富与雄心使这座山丘成为领土的政治与神圣中心。"
 MA_prague_castle1: "布拉格亲王宫"
 MA_prague_castle2: "布拉格王宫"
 
 #Saint Adrian's Basilica
 MA_zalavar_basilica_district: "$building_type_MA_zalavar_basilica$"
 MA_zalavar_basilica_district_desc: "$building_type_MA_zalavar_basilica_desc$"
 building_type_MA_zalavar_basilica: "圣阿德里安大教堂"
 building_type_MA_zalavar_basilica_desc: "圣阿德里安大教堂是扎拉河沼泽中一座加洛林设防定居点的中心，也是本地区早期基督教化的重要教会机构。教堂以石材建成，设有三条纵廊、突出的圣所和西侧建筑，兼作传教中心与亲王教堂，以扩大保护者在边疆地区的外交影响。"
 MA_zalavar_basilica: "$building_type_MA_zalavar_basilica$"
 
 #Baths of Hisham
 MA_baths_hisham_district: "$building_type_MA_baths_hisham$"
 MA_baths_hisham_district_desc: "$building_type_MA_baths_hisham_desc$"
 building_type_MA_baths_hisham: "希沙姆浴场"
 building_type_MA_baths_hisham_desc: "这些浴场属于更大的宫殿建筑群，按冷室、温室和热室的顺序布局，由地板下供暖系统供热，并以石拱顶覆盖。地面铺满华丽的几何与人物图案马赛克，其中尤以描绘树木与动物的巨大铺地画最为著名，镶嵌石片细小精致，构图严谨。"
 MA_baths_hisham: "$building_type_MA_baths_hisham$"
 
 #Peel Castle
 MA_peel_castle1_district: "$building_type_MA_peel_castle1$"
 MA_peel_castle1_district_desc: "$building_type_MA_peel_castle1_desc$"
 building_type_MA_peel_castle1: "圣帕特里克岛"
 building_type_MA_peel_castle1_desc: "在圣帕特里克的岩石小岛上，教堂、厅堂与墓地俯瞰着四周大海。当地更古老的传统与新定居者的信仰在此并存，神职人员与统治者共享这处狭窄的避难所。受保护的海岸将宗教崇拜与世俗权力连结起来。"
 MA_peel_castle1: "圣帕特里克岛修道院"
 MA_peel_castle2: "圣帕特里克大厅"
 MA_peel_castle3: "皮尔城堡"
 
 #Knin Fortress
 MA_knin_fortress_district: "$building_type_MA_knin_fortress$"
 MA_knin_fortress_district_desc: "$building_type_MA_knin_fortress_desc$"
 building_type_MA_knin_fortress: "克宁要塞"
 building_type_MA_knin_fortress_desc: "克宁要塞沿克尔卡河谷上方一条狭长的石灰岩山脊延伸，由城墙、塔楼与围合庭院组成分段式的漫长防御体系。其位置控制着海岸与内陆平原之间的道路，使之成为该地区主要的皇家堡垒。"
 MA_knin_fortress: "$building_type_MA_knin_fortress$"
 
 #Amaravati Stupa
 MA_amaravati_stupa_district: "$building_type_MA_amaravati_stupa$"
 MA_amaravati_stupa_district_desc: "$building_type_MA_amaravati_stupa_desc$"
 building_type_MA_amaravati_stupa: "阿马拉瓦蒂佛塔"
 building_type_MA_amaravati_stupa_desc: "这座巨大的古老[Glossary('佛塔','MA_stupa_glossary')]外覆白色石灰岩板，是达罗毗荼印度最宏伟的佛塔。砖墙上雕刻着色彩鲜明的叙事浮雕，圆形饰章与饰带描绘佛陀的生平及礼拜场景，四方入口的塔门则引导着围绕神圣土丘的仪式行进。"
 MA_amaravati_stupa: "$building_type_MA_amaravati_stupa$"
 MA_stupa_glossary: "一种内部供奉舍利的穹顶式建筑，是佛教修习中冥想与礼拜的场所。早期佛塔仅是简单的土丘，后来其形制与功能不断发展，对亚洲各地的佛教建筑产生深远影响，其中可能也包括宝塔。"
 
 #Karla Caves
 MA_karla_caves_district: "$building_type_MA_karla_caves$"
 MA_karla_caves_district_desc: "$building_type_MA_karla_caves_desc$"
 building_type_MA_karla_caves: "卡尔拉石窟"
 building_type_MA_karla_caves_desc: "卡尔拉石窟直接开凿于山坡之中，由岩凿[Glossary('僧院','MA_vihara')]与神龛组成，以一座宏伟的支提堂为中心。大厅拥有带雕刻肋条的高耸拱顶、两侧排列柱廊的狭长中殿，以及位于半圆形后殿端部的[Glossary('佛塔','MA_stupa_glossary')]。入口立面由巨大的马蹄形拱门与雕刻浮雕构成，标志着从外部世界进入井然有序的宗教仪式与礼拜空间。"
 MA_karla_caves: "$building_type_MA_karla_caves$"
 MA_vihara: "一种为僧侣提供居室的佛教寺院。在印度建筑中，特指以中央大厅为核心、周围连接僧房的建筑形式。"
 
 #Somnath Temple
 MA_somnath_temple_district: "$building_type_MA_somnath_temple$"
 MA_somnath_temple_district_desc: "$building_type_MA_somnath_temple_desc$"
 building_type_MA_somnath_temple: "索姆纳特神庙"
 building_type_MA_somnath_temple_desc: "索姆纳特是一座供奉月神的主要石砌神庙，沿纵轴排列一系列[Glossary('柱厅','MA_mandapa')]，通往顶部耸立着高大[Glossary('湿卡罗塔','MA_vimana_glossary')]的内殿。墙壁和柱子装饰着精美的神灵、侍从与饰带雕刻。作为重要的朝圣中心，它吸引着本地区各地的信徒，也招来印度河彼岸异教大军嫉妒的目光。"
 MA_somnath_temple: "$building_type_MA_somnath_temple$"
 MA_mandapa: "印度建筑中的柱式大厅或亭阁，通常作为过渡空间和神庙入口。"
 
 #Devagiri
 MA_devagiri_district: "$building_type_MA_devagiri$"
 MA_devagiri_district_desc: "$building_type_MA_devagiri_desc$"
 building_type_MA_devagiri: "德瓦吉里"
 building_type_MA_devagiri_desc: "一座巨大的火山丘陵从平原上陡然拔起，深色玄武岩山坡上开凿着蜿蜒通往山顶的狭窄道路。这座山被称作[Glossary('德瓦吉里','MA_devagiri_glossary')]，庇护着古老的洞穴与神龛，险峻的高地也为占有者提供坚固的避难所。"
 MA_devagiri: "$building_type_MA_devagiri$"
 MA_daulatabad: "道拉塔巴德"
 MA_devagiri_glossary: "源自梵语，意为\"众神之丘\"。"
 MA_daulatabad_glossary: "财富的居所。"
 
 #Ashoka's Palace
 MA_ashoka_palace1_district: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_palace1_district_desc: "$building_type_MA_ashoka_palace1_desc$"
 building_type_MA_ashoka_palace1: "阿育王宫"
 building_type_MA_ashoka_palace1_desc: "伟大的[Glossary('阿育王','MA_ashoka_glossary')]的宫殿见证了古代印度诸王的财富和权力。宽广的庭院与列柱大厅引出了无数关于罕见奢华的故事，其宏大规模与精致工艺足以成为任何意欲恢复往昔荣光之人的典范。"
 MA_ashoka_palace1: "阿育王宫遗址"
 MA_ashoka_palace2: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_glossary: "孔雀王朝第三位皇帝，以从残酷的好战君主转变为倡导佛教及广泛传教活动的道德统治者而闻名。"
 
 #Adina Mosque
 MA_adina_mosque_district: "$building_type_MA_adina_mosque$"
 MA_adina_mosque_district_desc: "$building_type_MA_adina_mosque_desc$"
 building_type_MA_adina_mosque: "阿迪纳清真寺"
 building_type_MA_adina_mosque_desc: "阿迪纳是一座巨大的砖石[Glossary('多柱式','MA_hypostyle_glossary')]清真寺，以宏大的矩形庭院为中心，四周环绕拱廊与一排排穹顶开间。礼拜大厅由宏伟的筒形拱顶覆盖，令人想起波斯帝国的建筑形式。外墙饰有雕刻的石制[Glossary('再利用构件','MA_spolia_glossary')]与陶土花卉。"
 MA_adina_mosque: "$building_type_MA_adina_mosque$"
 MA_hypostyle_glossary: "一种由成排柱子支撑屋顶的建筑设计，形成宽阔而开敞的内部空间。"
 MA_spolia_glossary: "从较古老建筑中拆取并重新使用的建筑构件，常用于传达传承与正统性的意义。这种做法尤其常见于地中海各地的罗马遗迹，但不限于此。"
 
 #Chittorgarh
 MA_chittorgarh_district: "$building_type_MA_chittorgarh$"
 MA_chittorgarh_district_desc: "$building_type_MA_chittorgarh_desc$"
 building_type_MA_chittorgarh: "奇陶尔加尔"
 building_type_MA_chittorgarh_desc: "奇陶尔要塞位于一座狭长而孤立的山顶，是印度最大的军事建筑之一。巨大的城墙沿高原边缘延伸数英里，将宫殿、神庙与高塔围在一座自成一体的城堡之中。"
 MA_chittorgarh: "$building_type_MA_chittorgarh$"
 
 #Lingaraj Temple
 MA_lingaraj_temple_district: "$building_type_MA_lingaraj_temple$"
 MA_lingaraj_temple_district_desc: "$building_type_MA_lingaraj_temple_desc$"
 building_type_MA_lingaraj_temple: "林伽拉贾神庙"
 building_type_MA_lingaraj_temple_desc: "林伽拉贾建筑群是印度神庙建筑最伟大的典范之一，沿单一轴线排列着神圣程度逐渐递增的空间，通向供奉湿婆、顶端高耸曲线形[Glossary('维摩那','MA_vimana_glossary')]的圣所。每处表面都饰有神像、花卉纹饰与叙事浮雕。"
 MA_lingaraj_temple: "$building_type_MA_lingaraj_temple$"
 MA_vimana_glossary: "印度神庙内殿正上方高耸的弯曲塔状结构，通常饰有繁复的雕刻与装饰。在北印度，这种风格称为#italic 湿卡罗塔#!，而在南印度和奥里萨则称为#italic 维摩那#!。"
 
 #Tsarevgrad
 MA_tsarevgrad1_district: "$building_type_MA_tsarevgrad1$"
 MA_tsarevgrad1_district_desc: "$building_type_MA_tsarevgrad1_desc$"
 building_type_MA_tsarevgrad1: "沙皇之城"
 building_type_MA_tsarevgrad1_desc: "扬特拉河上方崎岖的高地控制着周围山谷的通路。城墙、塔楼与神庙矗立于这些山丘之上，天然屏障和高耸的厅堂构成了足以供这片土地的统治者安居的强大要塞。"
 MA_tsarevgrad1: "特尔诺沃旧堡"
 MA_tsarevgrad2: "$building_type_MA_tsarevgrad1$"
 MA_tsarevets_glossary: "沙皇之城，这个名称让人联想到统治者从这座高耸要塞治理国土时所怀有的帝国雄心和神圣权威。"
 
 #Orange Theater
 MA_orange_theater1_district: "$building_type_MA_orange_theater1$"
 MA_orange_theater1_district_desc: "$building_type_MA_orange_theater1_desc$"
 building_type_MA_orange_theater1: "奥朗日剧院"
 building_type_MA_orange_theater1_desc: "奥朗日高耸的罗马舞台墙壁矗立于巨大的半圆形石构看台上方，雄伟地提醒着人们这座城市古代的荣耀。拱门、石柱与雕刻石材见证了凯撒时代建造者的技艺，在他们的统治结束数世纪后，这些建筑仍塑造着市民的生活。"
 MA_orange_theater1: "奥朗日剧院遗址"
 MA_orange_theater2: "$building_type_MA_orange_theater1$"
 MA_cavea_glossary: "一词源自拉丁语中的围合空间，指罗马剧院或圆形竞技场中呈半圆形、逐层升高的观众席。"
 
 #Walls of Mesembria
 MA_walls_mesembria_district: "$building_type_MA_walls_mesembria$"
 MA_walls_mesembria_district_desc: "$building_type_MA_walls_mesembria_desc$"
 building_type_MA_walls_mesembria: "墨森布里亚城墙"
 building_type_MA_walls_mesembria_desc: "环绕岩石半岛的城墙历史悠久，建立在希腊人的地基之上，也凝聚了罗马与拜占庭皇帝的巨大努力。厚重的石墙、突出的塔楼和防守严密的城门保护着港口及连接城市与大陆的狭窄地峡，使此地成为黑海西岸防御最坚固的港口之一。"
 MA_walls_mesembria: "$building_type_MA_walls_mesembria$"
 
 #Sri Pada
 MA_sri_pada_district: "$building_type_MA_sri_pada$"
 MA_sri_pada_district_desc: "$building_type_MA_sri_pada_desc$"
 building_type_MA_sri_pada: "摩罗耶山"
 building_type_MA_sri_pada_desc: "摩罗耶山的陡峭花岗岩山峰高耸于兰卡的森林之上，主宰着周围的景色。山顶有一座小神殿，围绕着[Glossary('圣足印','MA_sripada_glossary')]修建。朝圣者络绎不绝，沿蜿蜒山路攀登，在云端之上奉献祈祷。"
 MA_sri_pada: "$building_type_MA_sri_pada$"
 MA_sripada_glossary: "僧伽罗语，意为\"神圣的足印\"，传统上认为这是佛陀本人留在山上的脚印。"
 
 #Palace of Palermo
 MA_palace_palermo1_district: "$building_type_MA_palace_palermo1$"
 MA_palace_palermo1_district_desc: "$building_type_MA_palace_palermo1_desc$"
 building_type_MA_palace_palermo1: "巴勒莫宫殿"
 building_type_MA_palace_palermo1_desc: "巴勒莫的宫殿和别墅以花园、果园和阴凉的庭院而闻名。明亮的墙壁与宽敞的大厅保留着这座城市历代统治者的记忆，他们的赞助将地中海的艺术传统汇集于这一富裕而精致的中心。"
 MA_palace_palermo1: "巴勒莫别墅群"
 MA_palace_palermo2: "$building_type_MA_palace_palermo1$"
 MA_palace_balarm1: "巴拉尔姆别墅群"
 MA_palace_panormus1: "帕诺尔穆斯别墅群"
 MA_palace_balarm2: "巴拉尔姆宫"
 MA_palace_panormus2: "帕诺尔穆斯宫"
 MA_cassaro_glossary: "巴勒莫最内层的核心城区，即古代腓尼基与希腊街区，四周设防。其名称源自拉丁语中意为城堡的#italic Castrum#!，并受到阿拉伯语#italic al Qasr#!进一步影响。"
 
 #Cefalù Duomo
 MA_cefalu_duomo_district: "$building_type_MA_cefalu_duomo$"
 MA_cefalu_duomo_district_desc: "$building_type_MA_cefalu_duomo_desc$"
 building_type_MA_cefalu_duomo: "切法卢主教座堂"
 building_type_MA_cefalu_duomo_desc: "这座[Glossary('主教座堂','MA_duomo_glossary')]高耸于切法卢的石灰岩峭壁之上，将诺曼建筑的坚实形制与拜占庭、伊斯兰装饰结合起来。巨大的双塔矗立于宽阔的西立面两侧，宽敞的内部以圣所上方一幅金光闪烁的巨大马赛克镶嵌画为高潮，同时宣示王室权威与神圣威严。"
 MA_cefalu_duomo: "$building_type_MA_cefalu_duomo$"
 MA_duomo_glossary: "源自拉丁语#italic domus#!，意为上帝的\"居所\"，Duomo指意大利城镇的主要教堂。它常被误译为\"主教座堂\"，但实际上无需拥有主教驻地也能获得这一称号。"
 
 #Athenaion of Syracuse
 MA_athenaion_district: "$building_type_MA_athenaion$"
 MA_athenaion_district_desc: "$building_type_MA_athenaion_desc$"
 building_type_MA_athenaion: "叙拉古雅典娜神庙"
 building_type_MA_athenaion_desc: "这座教堂建于古老的雅典娜神庙内部，保留了许多原有的古代建筑结构。神庙内墙被打通，形成宽阔的中殿，而宏伟的多立克柱与外墙依旧清晰可见，围护着西西里古典时代最优秀的遗迹之一。"
 MA_athenaion: "$building_type_MA_athenaion$"
 
 #Cave of the Patriarchs
 MA_cave_patriarchs1_district: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs1_district_desc: "$building_type_MA_cave_patriarchs1_desc$"
 building_type_MA_cave_patriarchs1: "列祖之洞"
 building_type_MA_cave_patriarchs1_desc: "传说亚伯拉罕、以撒、雅各及其家族长眠的洞穴之上，矗立着由精细加工的石灰岩砌成的巨大希律王围墙。在坚固的墙内，神庙和祈祷场所体现了犹太教徒、基督徒和穆斯林共同的虔诚，吸引朝圣者来到下方的神圣坟墓。"
 MA_cave_patriarchs1: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs2: "列祖圣所"
 MA_must_be_abrahamic: "[holder|E]必须属于$rf_abrahamic$[religious_family|E]"
 
 #Łysa Góra
 MA_lysa_gora1_district: "$building_type_MA_lysa_gora1$"
 MA_lysa_gora1_district_desc: "$building_type_MA_lysa_gora1_desc$"
 building_type_MA_lysa_gora1: "维萨古拉山"
 building_type_MA_lysa_gora1_desc: "维萨古拉山森林覆盖的山坡上方，是一处古老的神圣峰顶。巨大的环形石垒将凡人的世俗世界与其后的神圣土地隔开。攀登者在此以祈祷和祭品寄托希望，庄严的山巅历经统治者与信仰的更迭，仍令人肃然起敬。"
 MA_lysa_gora1: "秃山"
 MA_lysa_gora2: "圣十字修道院"

 #Dome of the Rock
 MA_templum_domini: "主之圣殿"
 
 #Mainz Cathedral
 MA_mainz_cathedral1_district: "$building_type_MA_mainz_cathedral1$"
 MA_mainz_cathedral1_district_desc: "$building_type_MA_mainz_cathedral1_desc$"
 building_type_MA_mainz_cathedral1: "美因茨大主教驻地"
 building_type_MA_mainz_cathedral1_desc: "在美因茨中心，宏伟的主教座堂与周围的厅堂、礼拜堂和庭院共同组成了权势显赫的大主教驻地。这里接待使节、处理领地事务，钟声召唤信徒祈祷。石砌墙壁彰显着这位领主的财富与权威，他的力量远远超越祭坛。"
 MA_mainz_cathedral1: "主教区"
 MA_mainz_cathedral2: "美因茨主教座堂"
 
 #Ingelheim Palace
 MA_ingelheim_palace_district: "$building_type_MA_ingelheim_palace$"
 MA_ingelheim_palace_district_desc: "$building_type_MA_ingelheim_palace_desc$"
 building_type_MA_ingelheim_palace: "英格尔海姆宫"
 building_type_MA_ingelheim_palace_desc: "法兰克国王修建的众多居所与宫殿中，鲜有能在规模和历史上与英格尔海姆相媲美者。宫殿建于莱茵河附近，采用不寻常的半圆形布局，将[Glossary('王家大厅','MA_aula_regia_glossary')]及其附属的行政、居住与宗教建筑围合其中。优雅的拱门与乡村环境，使许多到访者想起古罗马别墅。"
 MA_ingelheim_palace: "$building_type_MA_ingelheim_palace$"
 MA_aula_regia_glossary: "帝国宫殿中的大型觐见与王座大厅，受古罗马同类建筑启发。通常为一座宽阔、狭长的单廊大厅，一端设有半圆形后殿。"

 #Jewish Quarter of Worms
 MA_worms_jewish_quarter_district: "$building_type_MA_worms_jewish_quarter$"
 MA_worms_jewish_quarter_district_desc: "$building_type_MA_worms_jewish_quarter_desc$"
 building_type_MA_worms_jewish_quarter: "沃尔姆斯犹太区"
 building_type_MA_worms_jewish_quarter_desc: "这里是莱茵兰最重要的犹太社群之一，狭窄的街道两旁排列着民居、工坊，以及一座以精心琢制的石材建造的犹太会堂。与美因茨和施派尔一道，这座城市是声名远播的犹太学术中心，推动着阿什肯纳兹犹太人的宗教与学术传统在整个欧洲的发展。"
 MA_worms_jewish_quarter: "$building_type_MA_worms_jewish_quarter$"