l_japanese:
 #################
 ##MEDIEVAL ARTS##
 #################

 ###########
 #GAME RULE#
 game_rule_category_MedievalArts: "Medieval Arts"
 rule_MA_monuments: "$game_rule_category_MedievalArts$: モニュメント"
 setting_MA_monuments_all: "$game_rule_category_MedievalArts$を優先"
 setting_MA_monuments_all_desc: "#help 推奨:#! 競合する場合、#V $game_rule_category_MedievalArts$#!の[special_buildings|E]が本編のものより優先されます。"
 setting_MA_monuments_selection: "本編を優先"
 setting_MA_monuments_selection_desc: "競合する場合、#V 本編#!の[special_buildings|E]が$game_rule_category_MedievalArts$のものより優先されます。"
 rule_MA_ahistorical_monuments: "$game_rule_category_MedievalArts$: 史実性"
 setting_MA_ahistorical_monuments_yes: "史実上疑わしいモニュメントを許可"
 setting_MA_ahistorical_monuments_yes_desc: "#help 推奨:#! #italic 史実上疑わしい#!と考えられる[special_buildings|E]を許可します。"
 setting_MA_ahistorical_monuments_no: "史実上疑わしいモニュメントを禁止"
 setting_MA_ahistorical_monuments_no_desc: "#italic 史実上疑わしい#!と考えられる[special_buildings|E]は#bold 許可されません#!。"
 rule_MA_creator_pack: "$game_rule_category_MedievalArts$: DLC"
 setting_MA_creator_pack_yes: "DLCを優先"
 setting_MA_creator_pack_yes_desc: "#help 推奨:#! 有効な場合、#V Holy Buildings#!などの#V DLC#!の[special_buildings|E]が$game_rule_category_MedievalArts$のものより優先されます。"
 setting_MA_creator_pack_no: "$setting_MA_monuments_all$"
 setting_MA_creator_pack_no_desc: "競合する場合、#V $game_rule_category_MedievalArts$#!の[special_buildings|E]が#V DLC#!のものより優先されます。"

 
 ###################
 #SPECIAL BUILDINGS#

 #Rock of Cashel
 MA_rock_cashel_district: "$building_type_MA_rock_cashel$"
 MA_rock_cashel_district_desc: "$building_type_MA_rock_cashel_desc$"
 building_type_MA_rock_cashel: "キャシェルの岩"
 building_type_MA_rock_cashel_desc: "緑の牧草地に囲まれた岩山の上に築かれたキャシェルの岩は、幾重もの城壁に守られ、城塞と宮殿の両方の役割を果たす難攻不落の石造要塞である。アイルランドで最も影響力のある修道院の一つもここにあり、宮廷礼拝堂のヴォールトには聖パトリキウスの生涯を描いた美しいフレスコ画が施されている。"
 MA_rock_cashel: "$building_type_MA_rock_cashel$"
 
 #St Donatus of Zadar
 MA_st_donatus_district: "$building_type_MA_st_donatus$"
 MA_st_donatus_district_desc: "$building_type_MA_st_donatus_desc$"
 building_type_MA_st_donatus: "ザダルの聖ドナトゥス教会"
 building_type_MA_st_donatus_desc: "アドリア海の波間に降り注ぐ陽光を受けて輝く、白い石で造られた壮麗な円形教会。カール大帝の宮殿にある宮廷礼拝堂から着想を得ており、美しい黄金のモザイクで飾られている。"
 MA_st_donatus: "$building_type_MA_st_donatus$"
 
 #Aula Palatina
 MA_aula_palatina_district: "$building_type_MA_aula_palatina$"
 MA_aula_palatina_district_desc: "$building_type_MA_aula_palatina_desc$"
 building_type_MA_aula_palatina: "アウラ・パラティナ"
 building_type_MA_aula_palatina_desc: "コンスタンティヌス大帝が自らの#italic 宮殿#!のために建てた巨大な煉瓦造りの広間。\n大陸でも比類のない規模を誇り、その高度な建築技術は今なお人々に着想を与え続ける。"
 MA_aula_palatina: "$building_type_MA_aula_palatina$"
 
 #Jokhang Temple
 MA_jokhang_district: "$building_type_MA_jokhang$"
 MA_jokhang_district_desc: "$building_type_MA_jokhang_desc$"
 building_type_MA_jokhang: "ジョカン寺"
 building_type_MA_jokhang_desc: "チベット全土で最も古く神秘的な寺院。神々の地のまさに中心に、中庭と聖堂が壮麗に連なる。"
 MA_jokhang: "$building_type_MA_jokhang$"
 
 #Dongola Throne Hall
 MA_dongola_hall_district: "$building_type_MA_dongola_hall$"
 MA_dongola_hall_district_desc: "$building_type_MA_dongola_hall_desc$"
 building_type_MA_dongola_hall: "ドンゴラの玉座の間"
 building_type_MA_dongola_hall_desc: "周囲の平原とナイル川を一望する岩山の頂に建てられた大宮殿。\n儀礼の場として用いられ、ヌビア人とギリシャ人の画家が描いた見事なフレスコ画で飾られた大階段を上る使節や旅人を圧倒する。階段は上階の荘厳な玉座の間へと続く。"
 MA_dongola_hall: "$building_type_MA_dongola_hall$"
 
 #Cathedral of Hildesheim
 MA_hildesheim_cathedral_district: "$building_type_MA_hildesheim_cathedral$"
 MA_hildesheim_cathedral_district_desc: "$building_type_MA_hildesheim_cathedral_desc$"
 building_type_MA_hildesheim_cathedral: "ヒルデスハイムの聖ミヒャエル教会"
 building_type_MA_hildesheim_cathedral_desc: "ローマ人の王の権威と威信を示すために建てられたこのバシリカは、彩色された木造天井と半円アーチによって壮大な皇帝の風格を帯びている。ライン地方やイタリアの職人と親方が建設に携わり、精緻な浮彫で飾られた青銅製の扉と巨大な青銅の円柱が収められている。"
 MA_hildesheim_cathedral: "$building_type_MA_hildesheim_cathedral$"
 
 #Toulouse Cathedral
 MA_toulouse_basilica_district: "$building_type_MA_toulouse_basilica$"
 MA_toulouse_basilica_district_desc: "$building_type_MA_toulouse_basilica_desc$"
 building_type_MA_toulouse_basilica: "トゥールーズのバシリカ"
 building_type_MA_toulouse_basilica_desc: "アルプス以北でも最大級の大聖堂の一つである壮麗なバシリカ。地元で豊富に採れる煉瓦で建てられ、南フランスの古代ローマ遺跡から着想を得た、まさしくロマネスク様式の建築である。ロンバルディア帯、半円アーチ、古い建築から転用した柱が装飾をなしている。"
 MA_toulouse_basilica: "$building_type_MA_toulouse_basilica$"
 
 #The Durham Cathedral
 MA_durham_cathedral_district: "$building_type_MA_durham_cathedral$"
 MA_durham_cathedral_district_desc: "$building_type_MA_durham_cathedral_desc$"
 building_type_MA_durham_cathedral: "ダラム大聖堂"
 building_type_MA_durham_cathedral_desc: "ダラムの大聖堂は、ウェア川の湿地に囲まれた半島の上にそびえ立つ。伝説によれば、二人の乳搾り娘がここで動かすことのできない聖カスバートの墓を発見したという。海峡の両岸から集まった職人が設計したリブ・ヴォールトは、イングランドに前例のない見事な技術の結晶であり、町の森と川岸を見下ろす地に、眼下の崖から切り出された石を用いて築かれた。"
 MA_durham_cathedral: "$building_type_MA_durham_cathedral$"
 
 #The Castel del Monte
 MA_castel_monte_district: "$building_type_MA_castel_monte$"
 MA_castel_monte_district_desc: "$building_type_MA_castel_monte_desc$"
 building_type_MA_castel_monte: "カステル・デル・モンテ"
 building_type_MA_castel_monte_desc: "プーリアのなだらかな丘の上に建つ優美な狩猟館。\n八角形の平面と各角に配された八角塔を特徴とする独創的な設計で、古典建築とゴシック建築が融合している。\n厳格で幾何学的な外観とは対照的に、内部は壁掛け、絨毯、絵画、柱頭などで豪奢に飾られている。"
 MA_castel_monte: "$building_type_MA_castel_monte$"
 
 #The Belfry of Bruges
 MA_belfort_district: "$building_type_MA_belfort$"
 MA_belfort_district_desc: "$building_type_MA_belfort_desc$"
 building_type_MA_belfort: "ブルッヘの鐘楼"
 building_type_MA_belfort_desc: "ブルッヘの市場広場にそびえ、街全体の暮らしを律する壮麗なゴシック様式の鐘楼。煉瓦と石で造られた巨大な塔は尖塔と彫像に覆われ、長方形の基部から鐘を収めた八角形の上層部へと立ち上がる。"
 MA_belfort: "$building_type_MA_belfort$"
 
 #The Strasbourg Cathedral
 MA_strasbourg_cathedral1_district: "$building_type_MA_strasbourg_cathedral1$"
 MA_strasbourg_cathedral1_district_desc: "$building_type_MA_strasbourg_cathedral1_desc$"
 building_type_MA_strasbourg_cathedral1: "ストラスブール大聖堂"
 building_type_MA_strasbourg_cathedral1_desc: "西フランクと東フランクの大教会に着想を得たストラスブール大聖堂の壮麗さは、市民の富と領主の庇護によるものである。淡紅色の砂岩で築かれた壁は夕陽に輝き、狭い広場と木組みの家々の上にそびえる。青銅の鐘は風に乗せて旋律を響かせる。"
 MA_strasbourg_cathedral1: "ストラスブール大聖堂"
 MA_strasbourg_cathedral2: "$MA_strasbourg_cathedral1$"
 
 #Koutoubia Mosque
 MA_koutoubia_district: "$building_type_MA_koutoubia$"
 MA_koutoubia_district_desc: "$building_type_MA_koutoubia_desc$"
 building_type_MA_koutoubia: "クトゥビーヤ・モスク"
 building_type_MA_koutoubia_desc: "ムーア建築を代表する傑作であり、そのミナレットはイスラーム世界各地の建築家たちの手本となっている。"
 MA_koutoubia: "$building_type_MA_koutoubia$"
 
 #Parigoritissa
 MA_parigoritissa_district: "$building_type_MA_parigoritissa$"
 MA_parigoritissa_district_desc: "$building_type_MA_parigoritissa_desc$"
 building_type_MA_parigoritissa: "パリゴリティッサのパナギア教会"
 building_type_MA_parigoritissa_desc: "至聖なるマリアに捧げられたこの教会の平面構成は、対称性と幾何学的完全性という古典的理念に基づいている。ほぼ完全な正方形をなし、中央には支柱で支えられた八角形のドームがあり、四隅にはそれぞれ小礼拝堂が配されている。"
 MA_parigoritissa: "$building_type_MA_parigoritissa$"
 
 #Rotunda
 MA_rotunda_district: "$building_type_MA_rotunda$"
 MA_rotunda_district_desc: "$building_type_MA_rotunda_desc$"
 building_type_MA_rotunda: "テッサロニキのロトンダ"
 building_type_MA_rotunda_desc: "ローマのパンテオンに着想を得た巨大なドーム建築。\n内部には類まれな技術と美しさを備えたモザイクが施され、黄金の#italic テッセラ#!が天窓から差し込む陽光にきらめく。\nこの建物は列柱廊によって、かつてのカエサル、ガレリウスが築いた巨大な大理石の凱旋門と結ばれている。"
 MA_rotunda: "$building_type_MA_rotunda$"
 
 #The Nikaea Walls
 MA_nikaea_walls_district: "$building_type_MA_nikaea_walls$"
 MA_nikaea_walls_district_desc: "$building_type_MA_nikaea_walls_desc$"
 building_type_MA_nikaea_walls: "ニカイアの城壁"
 building_type_MA_nikaea_walls_desc: "数世紀前に皇帝たちが築いたこの難攻不落の二重城壁は、コンスタンティノープルへ至る道を守っている。"
 MA_nikaea_walls: "$building_type_MA_nikaea_walls$"
 
 #The Ephesus Basilica
 MA_ephesus_basilica_district: "$building_type_MA_ephesus_basilica$"
 MA_ephesus_basilica_district_desc: "$building_type_MA_ephesus_basilica_desc$"
 building_type_MA_ephesus_basilica: "エフェソスのバシリカ"
 building_type_MA_ephesus_basilica_desc: "ユスティニアヌスの時代に、#italic 使徒ヨハネ#!の埋葬地の上に建てられた巨大なバシリカ。\n煉瓦と切石でできた壁はプロコネソス島産の優美な大理石の柱に支えられ、黄金のモザイクで豪華に飾られている。"
 MA_ephesus_basilica: "$building_type_MA_ephesus_basilica$"
 
 #Arles Amphiteatre
 MA_arles_amphiteatre_district: "$building_type_MA_arles_amphiteatre$"
 MA_arles_amphiteatre_district_desc: "$building_type_MA_arles_amphiteatre_desc$"
 building_type_MA_arles_amphiteatre: "アルルの円形闘技場"
 building_type_MA_arles_amphiteatre_desc: "数世紀前に建てられたこの巨大な闘技場は、今もアルルの暮らしの中心である。\n町の人々は石壁を利用して塔や礼拝堂、住居を築き、かつて剣闘士たちが娯楽のために殺し合った砂の闘技場で暮らしている。"
 MA_arles_amphiteatre: "$building_type_MA_arles_amphiteatre$"
 
 #Axum Stelae Field
 MA_axum_stelae_district: "$building_type_MA_axum_stelae$"
 MA_axum_stelae_district_desc: "$building_type_MA_axum_stelae_desc$"
 building_type_MA_axum_stelae: "石碑群"
 building_type_MA_axum_stelae_desc: "かつて強大だったアクスムに残るのは三本の巨大な石碑だけだが、それらは今なおこの地の王権文化に大きな影を落としている。\n整形された石から彫り出された表面には、今も浮彫が見られ、人によってはそれを#italic 天国の門#!と解釈する。"
 MA_axum_stelae: "$building_type_MA_axum_stelae$"
 
 #Karnak Temple
 MA_karnak_district: "$building_type_MA_karnak$"
 MA_karnak_district_desc: "$building_type_MA_karnak_desc$"
 building_type_MA_karnak: "カルナック"
 building_type_MA_karnak_desc: "古代ファラオの神殿の中でも最も壮麗なカルナックは、幾千年を経た今もナイルの王たちの権力と富を物語っている。"
 MA_karnak: "$building_type_MA_karnak$"
 
 #Pharos of Alexandria
 MA_pharos_alexandria_district: "$building_type_MA_pharos_alexandria$"
 MA_pharos_alexandria_district_desc: "$building_type_MA_pharos_alexandria_desc$"
 building_type_MA_pharos_alexandria: "ファロス"
 building_type_MA_pharos_alexandria_desc: "地峡の上に高くそびえるこの灯台は、アンティパトロスが挙げた#italic 世界の七不思議#!の一つとして世界中に知られている。\n礎石が置かれてから幾世紀も経ち、カリフの命で新たなドームが頂を飾るようになったが、その比類なき高さ、堅牢な石造り、輝く灯火は、目にした者の心にファロスの伝説を刻み続ける。"
 MA_pharos_alexandria: "$building_type_MA_pharos_alexandria$"
 
 #Trajan Arch
 MA_trajan_arch1_district: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch1_district_desc: "$building_type_MA_trajan_arch1_desc$"
 building_type_MA_trajan_arch1: "トラヤヌスの凱旋門"
 building_type_MA_trajan_arch1_desc: "偉大なる皇帝トラヤヌスは、この都市から#italic ダキア#!遠征を開始した。勝利を記念して壮麗な凱旋門の建設を命じ、今なおアンコーナの港に入る船を、誇りと威光の記憶とともに迎えている。"
 MA_trajan_arch1: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch2: "アンコーナの凱旋門"
 
 #Palatium of Diocletian
 MA_diocletian_palace_district: "$building_type_MA_diocletian_palace$"
 MA_diocletian_palace_district_desc: "$building_type_MA_diocletian_palace_desc$"
 building_type_MA_diocletian_palace: "ディオクレティアヌス宮殿"
 building_type_MA_diocletian_palace_desc: "四分統治時代に建てられたこの宮殿は、列柱の並ぶ街路、アーチ、城壁、広間を備えた、記念碑的な小さな理想都市として構想された。\n帝国の崩壊後、住民たちがここに移り住み、都市生活の中心へと変えていった。"
 MA_diocletian_palace: "$building_type_MA_diocletian_palace$"
 
 #Romuliana
 MA_romuliana_district: "$building_type_MA_romuliana$"
 MA_romuliana_district_desc: "$building_type_MA_romuliana_desc$"
 building_type_MA_romuliana: "ロムリアーナ"
 building_type_MA_romuliana_desc: "#italic フェリクス・ロムリアーナ#!は、偉大な皇帝たちによって模範都市として建設され、巨大な城壁に長く守られてきた。\nしかし城壁も数世紀にわたる侵略には耐えられず、往時の栄光を伝えるのは、今や見張り塔の空洞となった骨組みと、それらをのみ込んだ草木の盛り上がりだけである。"
 MA_romuliana: "$building_type_MA_romuliana$"
 
 #Hexamilion
 MA_hexamilion_district: "$building_type_MA_hexamilion$"
 MA_hexamilion_district_desc: "$building_type_MA_hexamilion_desc$"
 building_type_MA_hexamilion: "ヘクサミリオン"
 building_type_MA_hexamilion_desc: "ペロポネソス半島を守るためテオドシウス帝が築いたこの城壁は、コリントス湾からサロニコス湾まで地峡の狭い入口を横断し、何世紀にもわたってこれを守ってきた。交易商人や旅人、敵の襲撃者は南北の限られた通路へと誘導される。"
 MA_hexamilion: "$building_type_MA_hexamilion$"
 
 #Temple of Jupiter
 MA_baalbek_district: "$building_type_MA_baalbek$"
 MA_baalbek_district_desc: "$building_type_MA_baalbek_desc$"
 building_type_MA_baalbek: "ユピテル神殿"
 building_type_MA_baalbek_desc: "バールベックの主神殿はかつて世界最大級の神殿の一つで、肥沃な谷を見下ろしてそびえていた。\nその後、幾度もの襲撃と包囲戦によって巨大な神殿は傷つき、柱は砕かれ、遠方の都市へ持ち去られた。それでも遺跡は、世界のあらゆる地から訪れる旅人を魅了し続ける。"
 MA_baalbek: "$building_type_MA_baalbek$"
 
 #Leptis Magna
 MA_leptis_magna_district: "$building_type_MA_leptis_magna$"
 MA_leptis_magna_district_desc: "$building_type_MA_leptis_magna_desc$"
 building_type_MA_leptis_magna: "レプティス・マグナ"
 building_type_MA_leptis_magna_desc: "トリポリタニアの宝石と呼ばれるレプティス・マグナは、古代の皇帝たちによって築かれた。\n容赦ない太陽が正午に天頂へ達すると、神殿、市場、劇場の廃墟に落ちる影は消え、時の止まったこの地で迷い込んだような感覚にとらわれる。"
 MA_leptis_magna: "$building_type_MA_leptis_magna$"
 
 #Tomb of Numidia
 MA_mauretanian_mausoleum_district: "$building_type_MA_mauretanian_mausoleum$"
 MA_mauretanian_mausoleum_district_desc: "$building_type_MA_mauretanian_mausoleum_desc$"
 building_type_MA_mauretanian_mausoleum: "ヌミディアの墓"
 building_type_MA_mauretanian_mausoleum_desc: "ローマ人に征服される以前、ヌミディアのベルベル人の王たちが築いた古代の巨大霊廟。\n海に面した丘の上に全て石で造られ、遠くからでも水平線の陽光を浴びて輝く姿を見ることができる。"
 MA_mauretanian_mausoleum: "$building_type_MA_mauretanian_mausoleum$"
 
 #Meroë Pyramids
 MA_meroe_pyramids_district: "$building_type_MA_meroe_pyramids$"
 MA_meroe_pyramids_district_desc: "$building_type_MA_meroe_pyramids_desc$"
 building_type_MA_meroe_pyramids: "メロエのピラミッド群"
 building_type_MA_meroe_pyramids_desc: "ヌビアの黄金の砂に抱かれた謎めいたピラミッド群は、忘れ去られた守護者のようにそびえ立つ。砂漠の風がその秘密をささやき、精緻な装飾を施された物悲しくも美しい建造物が、失われた文明の謎を解き明かそうとする者を誘う。"
 MA_meroe_pyramids: "$building_type_MA_meroe_pyramids$"
 
 #Basilica of Saint Martin
 MA_saint_martin_district: "$building_type_MA_saint_martin$"
 MA_saint_martin_district_desc: "$building_type_MA_saint_martin_desc$"
 building_type_MA_saint_martin: "聖マルティヌス大聖堂"
 building_type_MA_saint_martin_desc: "聖マルティヌスの遺骸が眠るこの大バシリカは、メロヴィング朝がまだこの地を支配していた時代に初めて建てられた。\n長さ百六十フィート、幅六十フィートの堂内には古代の柱や色鮮やかな大理石が施され、サンティアゴへ向かう道を通る遠方の巡礼者たちを引き寄せている。"
 MA_saint_martin: "$building_type_MA_saint_martin$"
 
 #Pillars of Titus
 MA_piliers_district: "$building_type_MA_piliers$"
 MA_piliers_district_desc: "$building_type_MA_piliers_desc$"
 building_type_MA_piliers: "ガスコーニュの石柱"
 building_type_MA_piliers_desc: "川を見下ろし、陽光に恵まれた街の最高地点に立つこれらの柱は、優美であると同時に謎めいている。かつて皇帝ティトゥスの大宮殿の一部だったという者もいれば、ローマ人の到来よりはるか以前に岩から生え出たのだという者もいる。"
 MA_piliers: "$building_type_MA_piliers$"
 
 #Txindoki
 MA_txindoki_district: "$building_type_MA_txindoki$"
 MA_txindoki_district_desc: "$building_type_MA_txindoki_desc$"
 building_type_MA_txindoki: "チンドキ"
 building_type_MA_txindoki_desc: "この地を旅する巡礼者が、ひときわ目を引く雪を頂いた峰を見逃すことは難しい。突如として高くそびえるチンドキは、人が初めてその姿を目にするよりはるか昔から、この土地の威厳と神秘的な美を体現してきた。"
 MA_txindoki: "$building_type_MA_txindoki$"
 
 #Hospice of Santa Juliana
 MA_santillana_district: "$building_type_MA_santillana$"
 MA_santillana_district_desc: "$building_type_MA_santillana_desc$"
 building_type_MA_santillana: "サンタ・フリアナの巡礼宿"
 building_type_MA_santillana_desc: "この参事会教会の大きなヴォールト、石柱、聖遺物、宿泊施設は、サンティアゴへ向かう多くの巡礼者にとって欠かせない立ち寄り先となっている。\n地元の有力者の援助と絶え間ない寄進によって巡礼宿は富み栄え、壮麗な彫像や浮彫で美しく飾られている。"
 MA_santillana: "$building_type_MA_santillana$"
 
 #Palace of Naranco
 MA_palace_naranco_district: "$building_type_MA_palace_naranco$"
 MA_palace_naranco_district_desc: "$building_type_MA_palace_naranco_desc$"
 building_type_MA_palace_naranco: "ナランコ宮殿"
 building_type_MA_palace_naranco_desc: "この美しい宮殿は、何世代にもわたってアストゥリアスの聖なる王たちの居所となり、ナランコ山の頂からオビエドを見下ろしている。ローマ支配の時代以来イベリア半島では見られなかった優雅なアーチとヴォールトは、統治者たちの野心と力を示している。"
 MA_palace_naranco: "$building_type_MA_palace_naranco$"
 
 #Burgos Cathedral
 MA_burgos_cathedral_district: "$building_type_MA_burgos_cathedral$"
 MA_burgos_cathedral_district_desc: "$building_type_MA_burgos_cathedral_desc$"
 building_type_MA_burgos_cathedral: "ブルゴス大聖堂"
 building_type_MA_burgos_cathedral_desc: "ピレネー山脈の両側から集まった職人たちが築いたこの壮麗な大聖堂は、新しく近代的な教会建築様式を代表する傑作の一つである。\n塔は空高くそびえ、洞窟のように広い礼拝堂や回廊が巡礼者を聖遺物から次の聖遺物へと導く。供物と黄金が並び、数多くの聖人像の高貴なまなざしが彼らを見守っている。"
 MA_burgos_cathedral: "$building_type_MA_burgos_cathedral$"
 
 #Qasr al-Farid
 MA_hegra_district: "$building_type_MA_hegra$"
 MA_hegra_district_desc: "$building_type_MA_hegra_desc$"
 building_type_MA_hegra: "カスル・アル＝ファリード"
 building_type_MA_hegra_desc: "一枚岩の奥深くに彫り込まれた壮大な墳墓。かつて富と力を誇った異教都市の名残である。\n砂漠に孤立して立ち、風に抗うその姿から、地元の人々は#italic 孤独の城#!と呼ぶようになった。"
 MA_hegra: "$building_type_MA_hegra$"
 
 #Wadi Rum
 MA_wadirum_district: "$building_type_MA_wadirum$"
 MA_wadirum_district_desc: "$building_type_MA_wadirum_desc$"
 building_type_MA_wadirum: "ワディ・ラム"
 building_type_MA_wadirum_desc: "この広大で古い谷は、長きにわたって神話と伝説の源となり、今なお神秘に包まれている。\n谷からは巨大な赤い岩壁が砂漠の風に抗ってそびえ、重厚かつ頑丈で、いかなる軍勢にも手の届かない高さにある。最も苦しい時にも安全な避難所となる。"
 MA_wadirum: "$building_type_MA_wadirum$"
 
 #Walls of Sana'a
 MA_walls_sanaa_district: "$building_type_MA_walls_sanaa$"
 MA_walls_sanaa_district_desc: "$building_type_MA_walls_sanaa_desc$"
 building_type_MA_walls_sanaa: "サナアの城壁"
 building_type_MA_walls_sanaa_desc: "堅牢な防壁がサナアの中心部を取り囲み、サラワート山脈の複雑な山並みの中から難攻不落の姿で立ち上がる。風雨にさらされたその威容は、人と神々の恐ろしい戦いと偉業を静かに語り継いでいる。"
 MA_walls_sanaa: "$building_type_MA_walls_sanaa$"
 
 #Dam of Sheba
 MA_dam_sheba_district: "$building_type_MA_dam_sheba$"
 MA_dam_sheba_district_desc: "$building_type_MA_dam_sheba_desc$"
 building_type_MA_dam_sheba: "シバのダム"
 building_type_MA_dam_sheba_desc: "灼熱の太陽が立ち向かう者すべてを苦しめるマアリブの荒野に孤立する壮麗な遺跡は、砂を肥沃な畑に変え、欠乏と死が支配した地にも富と命をもたらしたシバの女王の偉大な王国の物語をささやく。"
 MA_dam_sheba: "$building_type_MA_dam_sheba$"
 
 #Bahla Fort
 MA_bahla_fort_district: "$building_type_MA_bahla_fort$"
 MA_bahla_fort_district_desc: "$building_type_MA_bahla_fort_desc$"
 building_type_MA_bahla_fort: "バハラ城塞"
 building_type_MA_bahla_fort_desc: "この巨大な日干し煉瓦の城は、貴重なバハラのオアシスを守るため、山地に近い高台に築かれた。\n複雑に巡らされた城壁は、灌漑施設と見事なナツメヤシ農園を敵と酷暑から守り、その庇護者に大きな名声をもたらす。"
 MA_bahla_fort: "$building_type_MA_bahla_fort$"
 
 #Jebe Hafeet
 MA_jebel_hafeet_district: "$building_type_MA_jebel_hafeet$"
 MA_jebel_hafeet_district_desc: "$building_type_MA_jebel_hafeet_desc$"
 building_type_MA_jebel_hafeet: "ジェベル・ハフィート"
 building_type_MA_jebel_hafeet_desc: "長く細く孤立した山。砂丘の手前にそびえる最後の山であり、ハジャル山脈の入口に位置する最初の山でもある。\n険しい岩の斜面には古くから地元の人々が暮らし、その麓には蜂の巣形の墳墓が点在する。"
 MA_jebel_hafeet: "$building_type_MA_jebel_hafeet$"
 
 #Al-Turaif Palace
 MA_alturaif_district: "$building_type_MA_alturaif$"
 MA_alturaif_district_desc: "$building_type_MA_alturaif_desc$"
 building_type_MA_alturaif: "アッ＝トゥライフ宮殿"
 building_type_MA_alturaif_desc: "天地創造の中でもとりわけ過酷な場所に、何世代もかけて築かれたこの宮殿は、忍耐と信仰の象徴である。\n長い城壁の内側には、高い日干し煉瓦の宮殿と灌漑された庭園があり、厳しい暑さから人々を守るとともに、所有者にとって重要な補給拠点となっている。"
 MA_alturaif: "$building_type_MA_alturaif$"
 
 #School of Preslav
 MA_school_preslav_district: "$building_type_MA_school_preslav$"
 MA_school_preslav_district_desc: "$building_type_MA_school_preslav_desc$"
 building_type_MA_school_preslav: "プレスラフの学問所"
 building_type_MA_school_preslav_desc: "安定した寄進に支えられ、プレスラフの修道院の写字室と宮殿の広間では写本の翻訳と新たな知の創出が休みなく続く。インクと羊皮紙の香りが空気を満たし、聖人や庇護者を描いたフレスコ画が壁を彩る。学問所の影響は石造りの広間をはるかに越え、この地域におけるローマの典礼と思想の灯台となっている。"
 MA_school_preslav: "$building_type_MA_school_preslav$"
 
 #Madara Rider
 MA_madara_rider_district: "$building_type_MA_madara_rider$"
 MA_madara_rider_district_desc: "$building_type_MA_madara_rider_desc$"
 building_type_MA_madara_rider: "マダラの騎士像"
 building_type_MA_madara_rider_desc: "冷たく永遠にそびえる断崖に深く刻まれた古代の浮彫には、獅子を打ち倒す騎士が描かれている。槍を手にした騎士は石から飛び出すように見え、その勝利は永遠に続く。下の銘文には、この地の民が西に定住する以前、果てしなく草の生い茂るステップで成し遂げた栄光の偉業が記されている。"
 MA_madara_rider: "$building_type_MA_madara_rider$"
 
 #Tomb of the Thracian King
 MA_thracian_tomb_district: "$building_type_MA_thracian_tomb$"
 MA_thracian_tomb_district_desc: "$building_type_MA_thracian_tomb_desc$"
 building_type_MA_thracian_tomb: "トラキア王の墳墓"
 building_type_MA_thracian_tomb_desc: "時の流れから隠され、静かな黄金色の草原に囲まれた古代の墓は、巨大な土の[Glossary('墳丘','MA_tumulus_glossary')]の下に眠る。入口には一枚岩の門が立ち、その周囲を石々が林のように取り巻く。伝説では、はるか昔の偉大な王がここに葬られ、名は忘れ去られても、その魂は今なお空を駆けているという。\n一本の糸杉が入口を見張るように立ち、墓の上に静かで長い影を落としている。"
 MA_thracian_tomb: "$building_type_MA_thracian_tomb$"
 MA_tumulus_glossary: "土と石を積み上げて墓の上に巨大なドームを形成した塚。多くの文化、特に古代社会で用いられた#bold 墳丘#!は、時の流れを重々しく壮大に物語る証である。"
 
 #Boyana Church
 MA_boyana_church_district: "$building_type_MA_boyana_church$"
 MA_boyana_church_district_desc: "$building_type_MA_boyana_church_desc$"
 building_type_MA_boyana_church: "ボヤナ教会"
 building_type_MA_boyana_church_desc: "黄金色の畑に埋もれた田舎町にひっそりと佇むこの質素な教会は、一見すると周囲の風景に溶け込む素朴な煉瓦造りにすぎない。\nしかし控えめな外観の内側には、世間の目から隠された比類ない宝がある。聖堂の中心は息をのむほど美しいフレスコ画で飾られ、一筆一筆が神の霊感を証ししている。青、赤、金の色彩が溶け合い、揺れる蝋燭の炎に合わせて聖人たちが踊るように見える、神秘に満ちた光景が広がる。"
 MA_boyana_church: "$building_type_MA_boyana_church$"
 
 #Belogradchik Fortress
 MA_belogradchik_fort_district: "$building_type_MA_belogradchik_fort$"
 MA_belogradchik_fort_district_desc: "$building_type_MA_belogradchik_fort_desc$"
 building_type_MA_belogradchik_fort: "ベログラトチク要塞"
 building_type_MA_belogradchik_fort_desc: "そびえ立つ奇岩に囲まれたこの要塞は、山の冷たい赤い岩と一体になった城壁とともに、大地そのものから現れたかのようだ。優美な岩塔が高く立ち、三方から要塞を包んで、ほぼ難攻不落のものとしている。\n地元には、近くの森の巨人が素手で石を積み上げたという太古からの伝説と、神罰によって岩に呑み込まれた修道院の物語が伝わる。"
 MA_belogradchik_fort: "$building_type_MA_belogradchik_fort$"
 
 #Studenica Monastery
 MA_studenica_district: "$building_type_MA_studenica$"
 MA_studenica_district_desc: "$building_type_MA_studenica_desc$"
 building_type_MA_studenica: "ストゥデニツァ修道院"
 building_type_MA_studenica_desc: "セルビアの記念建築の中でも最も壮麗で、地元の人々にとって信仰と安寧の灯台となるこの修道院は、人里離れた谷間に隠れるように建っている。\nその壁にはラテン世界の西方とギリシャ世界の東方、双方の伝統が見られる。熟練の手で彫られた白大理石の板と、鮮やかな赤いドラムの上に載る堂々たるドームは、庇護者たちの技量と敬虔さを物語る。"
 MA_studenica: "$building_type_MA_studenica$"
 
 #Church of the Nativity
 MA_church_nativity_district: "$building_type_MA_church_nativity$"
 MA_church_nativity_district_desc: "$building_type_MA_church_nativity_desc$"
 building_type_MA_church_nativity: "降誕教会"
 building_type_MA_church_nativity_desc: "最初はコンスタンティヌス帝の聖なる母が建立を命じ、後にユスティニアヌスの命で再建されたこの聖堂は、キリスト教で最も神聖な場所の一つ、キリスト降誕の地を記念する。\n凱旋門のような入口を備えた五廊式の長大なバシリカで、黄金のモザイクと色とりどりの大理石からなる古代ローマの柱で飾られている。数々の聖遺物と芸術品が収められ、伝説によればそれらが幾度もの侵略から教会を救ったという。"
 MA_church_nativity: "$building_type_MA_church_nativity$"
 
 #Great Lejre Hall
 MA_lejre_hall_district: "$building_type_MA_lejre_hall$"
 MA_lejre_hall_district_desc: "$building_type_MA_lejre_hall_desc$"
 building_type_MA_lejre_hall: "フレイズルの大広間"
 building_type_MA_lejre_hall_desc: "昔日の王たちが大木と見事な彫刻を用いて建てた壮麗な蜂蜜酒の広間。\nこの広間で宴を開き、戦った偉大な英雄と王たちの物語は、必ずや数々のサガの題材となるだろう。"
 MA_lejre_hall: "$building_type_MA_lejre_hall$"
 
 #Aetna
 MA_aetna_district: "$building_type_MA_aetna$"
 MA_aetna_district_desc: "$building_type_MA_aetna_desc$"
 building_type_MA_aetna: "エトナ山"
 building_type_MA_aetna_desc: "古代世界の火を噴く火山の中でも最大のエトナ山は、肥沃なシチリア島の上に堂々とそびえ、その火山灰は周囲の土地を豊かにしている。\n幾千年もの間、その息吹には神話と伝説が染み込み、神ヘーパイストスが地獄のような山の内部で神々の創造物を鍛えたと語られてきた。"
 MA_aetna: "$building_type_MA_aetna$"
 
 #Brescia Duomo
 MA_duomo_brescia_district: "$building_type_MA_duomo_brescia$"
 MA_duomo_brescia_district_desc: "$building_type_MA_duomo_brescia_desc$"
 building_type_MA_duomo_brescia: "ブレシア大聖堂"
 building_type_MA_duomo_brescia_desc: "古代ローマの中心地の西に生まれたブレシアの新たな権力の中心、#italic チッタヌオーヴァ#!に建つ石造の円形聖堂。その厚い壁と素朴なロマネスク様式の設計はエルサレムの物語に着想を得ており、薄暗い内部ではフレスコ画と聖遺物が幾世紀もの信仰と権力の歴史を語る。"
 MA_duomo_brescia: "$building_type_MA_duomo_brescia$"
 
 #Maschio
 MA_maschio_district: "$building_type_MA_maschio$"
 MA_maschio_district_desc: "$building_type_MA_maschio_desc$"
 building_type_MA_maschio: "マスキオ"
 building_type_MA_maschio_desc: "ナポリのきらめく湾を見下ろす、石と火山凝灰岩からなる巨大な城。胸壁と堂々たる円塔が鉄の拳で陸と海を支配する。\n岩の奥深くには監房や地下牢が広がり、中には古代ギリシャ人の時代にまで遡るものもある。$MA_warning_palermo_napoli$"
 MA_maschio: "$building_type_MA_maschio$"
 MA_warning_palermo_napoli: "\n\n@alert_icon! #alert_trial パレルモに[GetBuildingType('MA_palace_palermo2').GetName]、ナポリに[GetBuildingType('MA_maschio').GetName]の両方を建設すると、[GetDecisionWithKey('empower_sicilian_parliament_decision').GetName]の[decision|E]を完了できなくなります！#!"
 
 #Basilica of Saint Nicholas
 MA_st_nicholas_district: "$building_type_MA_st_nicholas$"
 MA_st_nicholas_district_desc: "$building_type_MA_st_nicholas_desc$"
 building_type_MA_st_nicholas: "聖ニコラウス大聖堂"
 building_type_MA_st_nicholas_desc: "地元の堅い石で築かれた重厚なロマネスク様式のバシリカ。ぶどう酒のように青い海に対して、輝く白い色彩が鮮やかに映える。堂内にある聖ニコラウスの聖遺物は、キリスト教世界の各地から巡礼者と莫大な富を引き寄せ、彼らを聖地へ渡る旅に誘う。"
 MA_st_nicholas: "$building_type_MA_st_nicholas$"
 
 #Palace of Arechis
 MA_palace_arechis_district: "$building_type_MA_palace_arechis$"
 MA_palace_arechis_district_desc: "$building_type_MA_palace_arechis_desc$"
 building_type_MA_palace_arechis: "アレキス宮殿"
 building_type_MA_palace_arechis_desc: "古代ローマ都市ベネウェントゥムの市街に築かれた広大な宮殿群は、城壁と四角い塔に守られている。ランゴバルド人の最初の公によって建設され、この民族の不屈の精神と頑強な独立を象徴するものとなった。"
 MA_palace_arechis: "$building_type_MA_palace_arechis$"
 
 #Basilica of Saccargia
 MA_saccargia_basilica_district: "$building_type_MA_saccargia_basilica$"
 MA_saccargia_basilica_district_desc: "$building_type_MA_saccargia_basilica_desc$"
 building_type_MA_saccargia_basilica: "サッカルジャのバシリカ"
 building_type_MA_saccargia_basilica_desc: "サルデーニャの乾いた風雨の激しい海岸に立つ、印象的な白黒の石造バシリカ。縞模様の塔は海上から何マイルも先まで見える。建設にはイタリアから職人が招かれ、その様式上の影響は顕著である。"
 MA_saccargia_basilica: "$building_type_MA_saccargia_basilica$"
 
 #Ruins of Paestum
 MA_paestum_district: "$building_type_MA_paestum$"
 MA_paestum_district_desc: "$building_type_MA_paestum_desc$"
 building_type_MA_paestum: "パエストゥムの遺跡"
 building_type_MA_paestum_desc: "かつて栄えた古代都市の遺構は、野草と静寂に囲まれ、神殿の巨大な柱は折れ砕けている。近くの川が土地を沼沢地に変えた後、都市は徐々に放棄され、今日では病のはびこるこの地に踏み込もうとする者はほとんどいない。"
 MA_paestum: "$building_type_MA_paestum$"
 
 #Tower of Pisa
 MA_tower_pisa_district: "$building_type_MA_tower_pisa$"
 MA_tower_pisa_district_desc: "$building_type_MA_tower_pisa_desc$"
 building_type_MA_tower_pisa: "ピサの斜塔"
 building_type_MA_tower_pisa_desc: "誇り高きピサの街の優美な#italic 鐘楼#!。その端正なアーチと輝く白い石は、キリスト教世界の内外に広く知られている。建設以来、その下の地盤はたびたび動き、塔は次第に傾きを増してきた。"
 MA_tower_pisa: "$building_type_MA_tower_pisa$"
 
 #Saint Peter's Basilica
 MA_vatican_district: "$building_type_MA_vatican$"
 MA_vatican_district_desc: "$building_type_MA_vatican_desc$"
 building_type_MA_vatican: "サン・ピエトロ大聖堂"
 building_type_MA_vatican_desc: "コンスタンティヌス帝がローマに建立を命じた古代バシリカの中でも最も神聖なこの教会は、教会の礎となった使徒の墓の上に立っている。\n堂々たる規模と優美さを兼ね備え、高い身廊は黄金のモザイクと異国の大理石で彩られ、キリスト教世界の各地から幾千もの巡礼者と、それに伴う富と権力を迎え入れる。"
 MA_vatican: "$building_type_MA_vatican$"
 
 #Rock of Canossa
 MA_rock_canossa_district: "$building_type_MA_rock_canossa$"
 MA_rock_canossa_district_desc: "$building_type_MA_rock_canossa_desc$"
 building_type_MA_rock_canossa: "カノッサの岩山"
 building_type_MA_rock_canossa_desc: "この堅固な城は、アペニン山脈の峠を守る壮大な防衛施設群の中心として、険しい岩山の頂に築かれた。人里離れたこの砦から領主たちは眼下の谷を見守り、石と空に囲まれた避難所で安住している。"
 MA_rock_canossa: "$building_type_MA_rock_canossa$"
 
 #Hill of Tara
 MA_hill_tara_district: "$building_type_MA_hill_tara$"
 MA_hill_tara_district_desc: "$building_type_MA_hill_tara_desc$"
 building_type_MA_hill_tara: "タラの丘"
 building_type_MA_hill_tara_desc: "土塁と堀に守られ、古代の刻石に囲まれた草深い丘は、アイルランドの上王たちの聖なる座である。石の城壁はなくとも、この土地そのものが力を宿し、島の各地から訪問者を引き寄せる。"
 MA_hill_tara: "$building_type_MA_hill_tara$"
 
 #Clonmacnoise
 MA_clonmacnoise_district: "$building_type_MA_clonmacnoise$"
 MA_clonmacnoise_district_desc: "$building_type_MA_clonmacnoise_desc$"
 building_type_MA_clonmacnoise: "クロンマクノイズ"
 building_type_MA_clonmacnoise_desc: "広大なシャノン川の岸に創建された大修道院。その石造教会と高い円塔が風の吹きすさぶ平原に厳かに立つ。時とともに島でも最も重要な学問の中心の一つとなり、遠方から学者や巡礼者を集めるようになった。"
 MA_clonmacnoise: "$building_type_MA_clonmacnoise$"
 
 #White Stupa of Gaochang
 MA_white_stupa_district: "$building_type_MA_white_stupa$"
 MA_white_stupa_district_desc: "$building_type_MA_white_stupa_desc$"
 building_type_MA_white_stupa: "高昌の白い仏塔"
 building_type_MA_white_stupa_desc: "中華の版図を示すために帝国当局が建設を命じた、輝く[Glossary('仏塔','MA_stupa_glossary')]が灼熱の砂漠に孤立してそびえる。大きな丸い白いドームと金色の尖塔にはチベットやインドの寺院の影響が色濃い一方、木造の基壇など中国伝統の要素も取り入れている。"
 MA_white_stupa: "$building_type_MA_white_stupa$"
 
 #Khan Tengri
 MA_khan_tengri_district: "$building_type_MA_khan_tengri$"
 MA_khan_tengri_district_desc: "$building_type_MA_khan_tengri_desc$"
 building_type_MA_khan_tengri: "ハン・テングリ"
 building_type_MA_khan_tengri_desc: "ステップの人々に#italic 天空の主#!と呼ばれる大理石の巨大なピラミッドは、周囲の山々の上に完全な対称性をもってそびえる。斜面は万年雪に覆われ、夕暮れには赤く、夜明けには黄金に輝く。澄んだ青い天空の下、大地と天を結ぶ神聖な軸となっている。"
 MA_khan_tengri: "$building_type_MA_khan_tengri$"
 
 #Singing Dunes
 MA_singing_dunes_district: "$building_type_MA_singing_dunes$"
 MA_singing_dunes_district_desc: "$building_type_MA_singing_dunes_desc$"
 building_type_MA_singing_dunes: "鳴き砂の砂丘"
 building_type_MA_singing_dunes_desc: "オアシスからそう遠くない荒涼としたステップに巨大な三日月形の砂丘がそびえ、風が大地そのものから長くもの悲しい音色を引き出す。アジアの古い道を渡る遊牧民は足を止め、砂丘の歌を精霊の声と信じて耳を傾け、遠方の詩人たちはその音楽に霊感を得る。"
 MA_singing_dunes: "$building_type_MA_singing_dunes$"
 
 #Dakhma of Gurganj
 MA_dakhma_district: "$building_type_MA_dakhma$"
 MA_dakhma_district_desc: "$building_type_MA_dakhma_desc$"
 building_type_MA_dakhma: "グルガンジュのダフマ"
 building_type_MA_dakhma_desc: "この巨大な円形の#italic ダフマ#!、すなわち沈黙の塔は、平原に孤立する高台の頂に立つ。かつてゾロアスター教徒は死者を浄化の空と太陽にさらすために用いたが、夏が過ぎるごとに信徒が減り、葬儀は少なくなった。代わりに見張りが増え、その高さと形は今や礼拝より監視に適している。\n\n#help この塔を#game_link 鳥葬#!#!を実践する[faith|E]が所有するか、同信仰の住民がいる場合、追加の効果が得られる。"
 MA_dakhma: "$building_type_MA_dakhma$"
 
 #Black Ruins
 MA_karabalgasun_district: "$building_type_MA_karabalgasun$"
 MA_karabalgasun_district_desc: "$building_type_MA_karabalgasun_desc$"
 building_type_MA_karabalgasun: "黒い廃墟"
 building_type_MA_karabalgasun_desc: "砕けた土壁と折れた柱は、かつてステップ最大級の帝国の中心にあった強大な宮殿の残骸である。風が空の中庭を吹き抜け、彫刻された石は草と埃に半ば埋もれる。それでも旅人はここを通り、#italic カラバルガスン#!、すなわち黒い廃墟と呼ぶ。"
 MA_karabalgasun: "$building_type_MA_karabalgasun$"
 
 #City of the Army
 MA_ordu_district: "$building_type_MA_ordu$"
 MA_ordu_district_desc: "$building_type_MA_ordu_desc$"
 building_type_MA_ordu: "軍勢の都"
 building_type_MA_ordu_desc: "欧州とアジアを結ぶ道の交差点に、商人と廷臣と馬が集う大都市がある。\n土壁に守られ広い堀に囲まれた内部では、列柱が続く大通りに沿って無数の天幕と寺院が並び、この地から統治するステップの大君主の金色の天幕へと続く。"
 MA_ordu: "$building_type_MA_ordu$"
 
 #Kurgan of the Rider
 MA_kurgan_district: "$building_type_MA_kurgan$"
 MA_kurgan_district_desc: "$building_type_MA_kurgan_desc$"
 building_type_MA_kurgan: "騎士のクルガン"
 building_type_MA_kurgan_desc: "地元では、かつてこの地を駆け、その魂が今もステップを駆ける偉大な騎士の話が伝わる。\n彼のクルガンと呼ばれる大きな土塚は、その埋葬地だとされ、領域の境を示す環状の石に囲まれている。名を覚える者は減り続けても、クルガンは風と時に抗って立ち続ける。"
 MA_kurgan: "$building_type_MA_kurgan$"
 
 #Cliffs of Ustyurt
 MA_ustyurt_cliffs_district: "$building_type_MA_ustyurt_cliffs$"
 MA_ustyurt_cliffs_district_desc: "$building_type_MA_ustyurt_cliffs_desc$"
 building_type_MA_ustyurt_cliffs: "ウスチュルトの断崖"
 building_type_MA_ustyurt_cliffs_desc: "風雨に削られたこの断崖は、荒涼とした高原から内海の沿岸への移り変わりを示し、峡谷に裂かれ、洞窟が穿たれている。水のない厳しい土地で狩人たちは工夫を重ね、#italic アラン#!と呼ばれる石の罠を造った。野生の群れを狭い場所へ追い込むそれらの罠は、断崖を静かな死の舞台に変えている。"
 MA_ustyurt_cliffs: "$building_type_MA_ustyurt_cliffs$"
 
 #White Fortress
 MA_sarkel_district: "$building_type_MA_sarkel$"
 MA_sarkel_district_desc: "$building_type_MA_sarkel_desc$"
 building_type_MA_sarkel: "白い要塞"
 building_type_MA_sarkel_desc: "白い石灰岩と煉瓦でできた壮大な砦、#italic サルケル#!、すなわち「白い要塞」は、カガンが北方国境の強化のためローマ皇帝に技師を求めた際、ドン川左岸に築かれた。現在はドン川とヴォルガ川の間の戦略的な陸上運搬路を押さえ、北方の遠くまで軍事力を及ぼし、地域を通る重要な交易路を守っている。"
 MA_sarkel: "$building_type_MA_sarkel$"
 
 #Nilometer
 MA_nilometer_district: "$building_type_MA_nilometer$"
 MA_nilometer_district_desc: "$building_type_MA_nilometer_desc$"
 building_type_MA_nilometer: "ナイロメーター"
 building_type_MA_nilometer_desc: "泥深い川岸に築かれた狭い石室は、ナイル川の水位の増減をより正確に測り、作付けの計画を助けるためのものである。新たなイスラームの支配者たちはこの地の古い習わしを受け継ぐために建設を命じ、洪水と豊穣を国家の秩序に結びつけた。"
 MA_nilometer: "$building_type_MA_nilometer$"
 
 #Abu Simbel
 MA_abu_simbel_district: "$building_type_MA_abu_simbel$"
 MA_abu_simbel_district_desc: "$building_type_MA_abu_simbel_desc$"
 building_type_MA_abu_simbel: "アブ・シンベル"
 building_type_MA_abu_simbel_desc: "幾世代も前に古代ファラオが彫った巨大な石像が岩の砂丘から突き出している。その規模は今なお世界に比類がない。\nその威厳を目にした者は、ただの旅人であれ偉大な王であれ、石像が語る物語に心を動かされずにはいられない。"
 MA_abu_simbel: "$building_type_MA_abu_simbel$"
 
 #Red and White Monasteries
 MA_red_white_monasteries_district: "$building_type_MA_red_white_monasteries$"
 MA_red_white_monasteries_district_desc: "$building_type_MA_red_white_monasteries_desc$"
 building_type_MA_red_white_monasteries: "赤と白の修道院"
 building_type_MA_red_white_monasteries_desc: "ナイル川の岸辺近くにある二つの古代コプト修道院。その名は壁に使われた特徴的な色の石に由来し、一方は大地のような深い赤、もう一方は淡く輝く白である。人里離れてはいても忘れ去られてはおらず、古い聖歌の響く礼拝堂と色あせたフレスコ画に飾られた壁の内側では、ムスリムの支配者がシナイの砂漠と岩山を越えてこの地を征服する以前から続く、学識深く敬虔なキリスト教の伝統が守られている。"
 MA_red_white_monasteries: "$building_type_MA_red_white_monasteries$"
 
 #Knossos
 MA_knossos_ruins_district: "$building_type_MA_knossos_ruins$"
 MA_knossos_ruins_district_desc: "$building_type_MA_knossos_ruins_desc$"
 building_type_MA_knossos_ruins: "クノッソス宮殿"
 building_type_MA_knossos_ruins_desc: "美しい海を見下ろす古代のクノッソス宮殿には、昔日の王たちと神話の記憶が宿っている。大広間、列柱、フレスコ画は遠い富と権力の時代を語り、旅人を魅了し、クレタの強大な支配者に並び立とうとする者たちに霊感を与える。"
 MA_knossos_ruins: "クノッソスの遺跡"
 MA_knossos: "$building_type_MA_knossos_ruins$"
 
 #Skara Brae
 MA_skara_brae_district: "$building_type_MA_skara_brae$"
 MA_skara_brae_district_desc: "$building_type_MA_skara_brae_desc$"
 building_type_MA_skara_brae: "スカラ・ブレイ"
 building_type_MA_skara_brae_desc: "風の吹きすさぶ海岸の草深い丘から、古代の石造住居群がひっそりと顔をのぞかせ、大地に半ば埋もれている。\n冷たい海風に洗われながら、低く風化した壁と幾世紀も冷え切った炉を抱えて、静かに時に耐える。それでも遠い昔に消え去った人々の暮らしの記憶が響いている。"
 MA_skara_brae: "$building_type_MA_skara_brae$"
 
 #Whitehorse Hill
 MA_whitehorse_hill_district: "$building_type_MA_whitehorse_hill$"
 MA_whitehorse_hill_district_desc: "$building_type_MA_whitehorse_hill_desc$"
 building_type_MA_whitehorse_hill: "ホワイトホース・ヒル"
 building_type_MA_whitehorse_hill_desc: "#flavor アビントンの町の近くには、一頭の雄馬の姿を刻んだ白い山がある。その上には何も生えない。#!"
 MA_whitehorse_hill: "$building_type_MA_whitehorse_hill$"
 
 #Gagikashen
 MA_gagikashen_district: "$building_type_MA_gagikashen$"
 MA_gagikashen_district_desc: "$building_type_MA_gagikashen_desc$"
 building_type_MA_gagikashen: "ガギカシェン"
 building_type_MA_gagikashen_desc: "アニの高台にそびえる、聖グレゴリウスに捧げられた大きな円形教会。建設者たちは廃墟となったズヴァルトノツ大聖堂の姿から着想を得た。高いドラムは円環状の柱と側礼拝堂の上に三段に重なって立ち上がり、調和と明晰さに満ちた中央空間を囲んでいる。"
 MA_gagikashen: "$building_type_MA_gagikashen$"
 
 #Saint Gall
 MA_saint_gall_district: "$building_type_MA_saint_gall$"
 MA_saint_gall_district_desc: "$building_type_MA_saint_gall_desc$"
 building_type_MA_saint_gall: "ザンクト・ガレン"
 building_type_MA_saint_gall_desc: "アレマン人の土地の辺境、聖ガルスの隠遁所跡に創設された大修道院群。厳格な規律と組織で知られ、優れた#italic 写字室#!と図書館を擁する。修道士たちはキリスト教世界各地の学者のため、古典と聖典を筆写し、翻訳し、保存している。"
 MA_saint_gall: "$building_type_MA_saint_gall$"
 
 #Sé of Lisbon
 MA_se_lisbon_district: "$building_type_MA_se_lisbon$"
 MA_se_lisbon_district_desc: "$building_type_MA_se_lisbon_desc$"
 building_type_MA_se_lisbon: "リスボン大聖堂"
 building_type_MA_se_lisbon_desc: "港を見下ろす斜面に建つ重厚なロマネスク様式の大聖堂。その厚い壁と狭い窓は、イベリアでの争いが続く不穏な時代を映し出している。キリスト教徒による都市奪還の後、古いモスクの廃墟の上に建てられ、石のヴォールトには聖ヴィセンテの聖遺物が納められている。反響する身廊は行列を迎え入れる。"
 MA_se_lisbon: "$building_type_MA_se_lisbon$"
 
 #Alto Douro Vineyards
 MA_alto_douro_district: "$building_type_MA_alto_douro$"
 MA_alto_douro_district_desc: "$building_type_MA_alto_douro_desc$"
 building_type_MA_alto_douro: "アルト・ドウロの葡萄畑"
 building_type_MA_alto_douro_desc: "ドウロ渓谷の急斜面に刻まれた段々畑の葡萄園。石壁が土を支え、陽光を取り込む。ローマ時代に初めて植えられて以来、この葡萄畑は濃厚で色の濃いワインを産し、川を下って沿岸の市場や異国の宮廷へ運ばれてきた。"
 MA_alto_douro: "$building_type_MA_alto_douro$"
 
 #Fortifications on the Guadalquivir
 MA_guadalquivir_fortifications_district: "$building_type_MA_guadalquivir_fortifications$"
 MA_guadalquivir_fortifications_district_desc: "$building_type_MA_guadalquivir_fortifications_desc$"
 building_type_MA_guadalquivir_fortifications: "グアダルキビル川の防衛施設"
 building_type_MA_guadalquivir_fortifications_desc: "グアダルキビル川沿いに連なる防御施設は、至る所に塔と門を備え、活気に満ちたセビリアの港を守っている。中でも目を引くのは黄金の石灰塗りで覆われた十二角形の監視塔、トーレ・デル・オロである。川面に輝くその姿は、入港する船の目印であると同時に街の力を示す警告でもある。"
 MA_guadalquivir_fortifications: "$building_type_MA_guadalquivir_fortifications$"
 
 #Madinat al-Zahra
 MA_madinat_alzahra_district: "$building_type_MA_madinat_alzahra$"
 MA_madinat_alzahra_district_desc: "$building_type_MA_madinat_alzahra_desc$"
 building_type_MA_madinat_alzahra: "マディーナ・アッ＝ザフラー"
 building_type_MA_madinat_alzahra_desc: "コルドバ郊外のなだらかな丘陵地に築かれた広大な宮殿都市。カリフの宮廷の栄華を示すために造られた。庭園、あずまや、謁見の間が広々とした段丘に並び、大理石と碧玉の壁には細やかな彫刻が施されている。その美と豪奢は詩人たちに人生の至上の喜びを歌わせる。"
 MA_madinat_alzahra: "$building_type_MA_madinat_alzahra$"
 
 #Circus of Merida
 MA_circus_merida_district: "$building_type_MA_circus_merida$"
 MA_circus_merida_district_desc: "$building_type_MA_circus_merida_desc$"
 building_type_MA_circus_merida: "メリダの競技場"
 building_type_MA_circus_merida_desc: "メリダ郊外の平原には古代ローマの競技場の遺構が細長く延び、崩れた壁と草に覆われた走路が今も輪郭を示している。数本の糸杉がわずかな木陰を落とす。近くには静かな墓地を備えた小教会が遺跡の外に建ち、かつての用途が失われた場所に新たな役割を見いだしている。"
 MA_circus_merida: "$building_type_MA_circus_merida$"
 
 #Alhambra
 MA_alhambra1_district: "$building_type_MA_alhambra1$"
 MA_alhambra1_district_desc: "$building_type_MA_alhambra1_desc$"
 building_type_MA_alhambra1: "アルハンブラ"
 building_type_MA_alhambra1_desc: "なだらかなサビカの丘に、アルハンブラの赤い城壁がグラナダと肥沃な平原を見下ろしている。市の支配者たちはその懐で敵と夏の暑さを避け、塔と胸壁は眼下の土地に対する支配を高らかに示す。"
 MA_alhambra2: "新城塞"
 MA_alhambra3: "中庭と庭園"
 MA_alhambra4: "獅子の中庭"
 MA_alhambra1: "赤い城"
 
 #The Cologne Cathedral
 MA_cologne_cathedral1_district: "$building_type_MA_cologne_cathedral1$"
 MA_cologne_cathedral1_district_desc: "$building_type_MA_cologne_cathedral1_desc$"
 building_type_MA_cologne_cathedral1: "ケルン大聖堂"
 building_type_MA_cologne_cathedral1_desc: "大司教の座であり、街の誇りを象徴するケルンの大教会。幾世紀にもわたって増築が重ねられ、計り知れない価値の聖遺物を収めて遠方から巡礼者を集める。その力強い石壁は街の屋根を見下ろしてそびえる。"
 MA_cologne_cathedral1: "ケルンの旧大聖堂"
 MA_cologne_cathedral2: "ケルンの双塔"
 
 #Qutb Complex
 MA_qutb_complex1_district: "$building_type_MA_qutb_complex1$"
 MA_qutb_complex1_district_desc: "$building_type_MA_qutb_complex1_desc$"
 building_type_MA_qutb_complex1: "クトゥブ建造物群"
 building_type_MA_qutb_complex1_desc: "デリーの中心には古代の聖域があり、歴代の支配者は信仰と威信を示すため記念建造物や寺院を建ててきた。彫刻の施された柱と中庭がグプタ朝の巨大な鉄柱を囲み、その黒い柱身は王朝と神々の移り変わりを超えて立ち続ける。"
 MA_qutb_complex1: "鉄柱"
 MA_qutb_complex2: "デリーの大モスク"
 MA_qutb_complex3: "クトゥブ・ミナール"
 MA_qutb_complex4: "アライ・ミナール"
 
 #Sigiriya
 MA_sigiriya1_district: "$building_type_MA_sigiriya1$"
 MA_sigiriya1_district_desc: "$building_type_MA_sigiriya1_desc$"
 building_type_MA_sigiriya1: "シーギリヤ"
 building_type_MA_sigiriya1_desc: "深い密林から巨大な孤岩がそびえ、その頂上には古代の王の城塞[Glossary('シーギリヤ','MA_sigiriya_glossary')]がある。段々庭園と池の上を、フレスコ画の壁や巨大な獅子の門を過ぎて階段が登る。その姿は空に住まいを築いた王たちの野心を物語っている。"
 MA_sigiriya1: "シーギリヤの遺跡"
 MA_sigiriya2: "修復されたシーギリヤ"
 MA_sigiriya_glossary: "シンハラ語で、文字どおり\"獅子の岩\"を意味する。"
 
 #Great Sanchi Stupa
 MA_sanchi_stupa_district: "$building_type_MA_sanchi_stupa$"
 MA_sanchi_stupa_district_desc: "$building_type_MA_sanchi_stupa_desc$"
 building_type_MA_sanchi_stupa: "サーンチーの大仏塔"
 building_type_MA_sanchi_stupa_desc: "この石と煉瓦の巨大なドームは、強大なアショーカ王の命で初めて建設された。その後、後継者たちによって拡張され、時の流れによって荒廃した。高い基壇の上に置かれ、彫刻された欄干と装飾的な#italics トラナ#!と呼ばれる門に囲まれ、巡礼者たちは絶え間ない信仰心でその周りを巡る。"
 MA_sanchi_stupa: "$building_type_MA_sanchi_stupa$"
 
 #Vindhyagiri Hill
 MA_gommateshwara1_district: "$building_type_MA_gommateshwara1$"
 MA_gommateshwara1_district_desc: "$building_type_MA_gommateshwara1_desc$"
 building_type_MA_gommateshwara1: "ヴィンディヤギリの丘"
 building_type_MA_gommateshwara1_desc: "シュラヴァナベラゴラの町の上に急峻にそびえる花崗岩のヴィンディヤギリの高みには、ジャイナ教の祠堂と中庭が並ぶ。巡礼者は裸足で石段を登り、鐘の音と陽光に温められた石の香りが空気を満たす。"
 MA_gommateshwara2: "ゴンマテーシュワラ大像"
 MA_gommateshwara1: "ヴィンディヤギリの寺院群"
 
 #Palace of Ghazni
 MA_ghazni_palace_district: "$building_type_MA_ghazni_palace$"
 MA_ghazni_palace_district_desc: "$building_type_MA_ghazni_palace_desc$"
 building_type_MA_ghazni_palace: "ガズナ朝宮殿"
 building_type_MA_ghazni_palace_desc: "ガズニーの城壁の外にあるこの王宮は、都市のスルタンの権力の中心となっている。四角形の#italic イーワーン#!式中庭から広がる広間には、ペルシアの芸術に着想を得た精巧な彫刻と、漆喰細工や色鮮やかなタイルの豪華な装飾が施されている。"
 MA_ghazni_palace: "$building_type_MA_ghazni_palace$"
 
 #Stupas of Anuradhapura
 MA_stupas_anuradhapura_district: "$building_type_MA_stupas_anuradhapura$"
 MA_stupas_anuradhapura_district_desc: "$building_type_MA_stupas_anuradhapura_desc$"
 building_type_MA_stupas_anuradhapura: "アヌラーダプラの仏塔群"
 building_type_MA_stupas_anuradhapura_desc: "古代の寺院都市アヌラーダプラには、仏陀の聖遺物を安置するためシンハラ王たちが築いた巨大な煉瓦の[Glossary('仏塔','MA_stupa_glossary')]が点在する。白く塗られた修道院と学問所は陽光の下に輝き、その広間や中庭では議論が交わされている。"
 MA_stupas_anuradhapura: "$building_type_MA_stupas_anuradhapura$"
 
 #Eye of the Sahara
 MA_eye_sahara_district: "$building_type_MA_eye_sahara$"
 MA_eye_sahara_district_desc: "$building_type_MA_eye_sahara_desc$"
 building_type_MA_eye_sahara: "サハラの目"
 building_type_MA_eye_sahara_desc: "砂漠の中心にある巨大な円形の地形で、岩の環が何マイルにもわたり砂地に広がる。遠くからは空を見上げる風化した巨大な眼のように見え、荒野を横断する遊牧民や隊商の目印となっている。\n古い伝説では、かつて水と緑に恵まれた繁栄の都市があったが、今では砂に呑み込まれたのだという。"
 MA_eye_sahara: "$building_type_MA_eye_sahara$"
 
 #Great Mosque of Mahdia
 MA_mahdia_mosque_district: "$building_type_MA_mahdia_mosque$"
 MA_mahdia_mosque_district_desc: "$building_type_MA_mahdia_mosque_desc$"
 building_type_MA_mahdia_mosque: "マフディーヤの大モスク"
 building_type_MA_mahdia_mosque_desc: "マフディーヤの岩の多い海岸の半島に建てられたこの質素なモスクは、淡い石造りの塔によって要塞のような姿を見せる。\n内部では二つの優美なアーケード付き中庭が礼拝堂へ続き、信徒たちは淡い色の石のアーチの下に集う。"
 MA_mahdia_mosque: "$building_type_MA_mahdia_mosque$"
 
 #Saint Mark's of Zagreb
 MA_zagreb_church_district: "$building_type_MA_zagreb_church$"
 MA_zagreb_church_district_desc: "$building_type_MA_zagreb_church_desc$"
 building_type_MA_zagreb_church: "ザグレブの聖マルコ教会"
 building_type_MA_zagreb_church_desc: "イタリアとドイツの職人たちの助けで建てられた聖マルコ教会は、市内の他の建物より高くそびえる。ロマネスク様式の平面にゴシック様式の増築が加えられ、入口と壁面には聖書の物語が豊かに描かれている。"
 MA_zagreb_church: "$building_type_MA_zagreb_church$"
 
 #Walls of Balkh
 MA_walls_balkh_district: "$building_type_MA_walls_balkh$"
 MA_walls_balkh_district_desc: "$building_type_MA_walls_balkh_desc$"
 building_type_MA_walls_balkh: "バルフの城壁"
 building_type_MA_walls_balkh_desc: "何世紀にもわたりバルフの城塞は、外周を取り囲む二重の巨大な環状城壁によって守られてきた。土塁と塔はステップを駆け抜ける軍勢に対する防壁となり、市内の市場と工房を守っている。"
 MA_walls_balkh: "$building_type_MA_walls_balkh$"
 
 #Martand Sun Temple
 MA_martand_sun_temple_district: "$building_type_MA_martand_sun_temple$"
 MA_martand_sun_temple_district_desc: "$building_type_MA_martand_sun_temple_desc$"
 building_type_MA_martand_sun_temple: "マールターンド太陽神殿"
 building_type_MA_martand_sun_temple_desc: "カシミール渓谷の高原に建てられたこの神殿は、太陽神に捧げられた最古級の神殿の一つである。中心には大きな聖所があり、その周囲には無数の小祠と神々や天界の存在を彫った列が並ぶ。列柱に囲まれた中庭には静かな池があり、陽光にきらめいている。"
 MA_martand_sun_temple: "$building_type_MA_martand_sun_temple$"
 
 #Ruins of Aquae Sulis
 MA_aquae_sulis_ruins_district: "$building_type_MA_aquae_sulis_ruins$"
 MA_aquae_sulis_ruins_district_desc: "$building_type_MA_aquae_sulis_ruins_desc$"
 building_type_MA_aquae_sulis_ruins: "アクアエ・スリスの遺跡"
 building_type_MA_aquae_sulis_ruins_desc: "#low 巨人たちの偉業が朽ち果ててゆく#! \n湯気の立つ聖なる泉の周囲には、かつてローマ人が切石で壮大な浴場と神殿を建てたアクアエ・スリスの砕けた遺構が残る。崩れた壁、落ちたアーチ、水没した部屋は今なお古代の施設の整然とした配置を示し、巡礼者や市民が遺跡に集う中、温かな水は流れ続ける。"
 MA_aquae_sulis_ruins: "$building_type_MA_aquae_sulis_ruins$"
 
 #Winchester Minster
 MA_winchester_minster_district: "$building_type_MA_winchester_minster$"
 MA_winchester_minster_district_desc: "$building_type_MA_winchester_minster_desc$"
 building_type_MA_winchester_minster: "ウィンチェスター大教会"
 building_type_MA_winchester_minster_desc: "この大教会は、広い彩色された身廊と複数の鐘楼を備えた、石と木材からなる巨大なバシリカである。王都にそびえ、他のどの建造物よりもはるかに大きく、ウェセックス王家の墓を守っている。"
 MA_winchester_minster: "$building_type_MA_winchester_minster$"
 
 #Westminster Abbey
 MA_westminster_abbey_district: "$building_type_MA_westminster_abbey$"
 MA_westminster_abbey_district_desc: "$building_type_MA_westminster_abbey_desc$"
 building_type_MA_westminster_abbey: "ウェストミンスター寺院"
 building_type_MA_westminster_abbey_desc: "テムズ川のほとりに建てられ、イングランドの王たちの豊かな寄進に支えられたウェストミンスター寺院は、長い身廊と高い内陣を備えた巨大な石造の修道院教会である。彫刻された柱頭と彩色壁が堂内を飾る。ここでは王たちが戴冠し、永眠する。修道院は王権と神の恩寵を結びつける聖なる舞台となっている。"
 MA_westminster_abbey: "$building_type_MA_westminster_abbey$"
 
 #Lorsch Gate
 MA_lorsch_gate_district: "$building_type_MA_lorsch_gate$"
 MA_lorsch_gate_district_desc: "$building_type_MA_lorsch_gate_desc$"
 building_type_MA_lorsch_gate: "ロルシュの門楼"
 building_type_MA_lorsch_gate_desc: "ロルシュ修道院の壮大な門楼は、カロリング朝建築の珍しい、精緻に築かれた実例である。丁寧に切り出された石と煉瓦で造られ、対称的な正面には付け柱、盲アーチ、古代ローマを思わせる古典的な装飾が施されている。"
 MA_lorsch_gate: "$building_type_MA_lorsch_gate$"
 
 #Dover Castle
 MA_dover_castle_district: "$building_type_MA_dover_castle$"
 MA_dover_castle_district_desc: "$building_type_MA_dover_castle_desc$"
 building_type_MA_dover_castle: "ドーバー城"
 building_type_MA_dover_castle_desc: "狭い海峡を見下ろす白亜の崖に築かれたこの城塞は、イングランドと大陸を結ぶ主要な玄関口を押さえている。巨大な石造主塔、外郭城壁、幾重にも重なる門楼が強固な防御施設をなし、港と内陸への道を支配するとともに、王の要塞と居所を兼ねている。"
 MA_dover_castle: "$building_type_MA_dover_castle$"
 
 #Château Gaillard
 MA_chateau_gaillard_district: "$building_type_MA_chateau_gaillard$"
 MA_chateau_gaillard_district_desc: "$building_type_MA_chateau_gaillard_desc$"
 building_type_MA_chateau_gaillard: "ガイヤール城"
 building_type_MA_chateau_gaillard_desc: "セーヌ川を見下ろす石灰岩の尾根に築かれたガイヤール城は、積極的な防衛を意図して設計された小規模で洗練された石造要塞である。同心円状の城壁、角度をつけた塔、前方に突き出した門の防御設備により死角を減らし、進入路に火力を集中させる。迅速かつ精密に築かれたこの城は、最新の軍事建築の理念を体現し、川とノルマンディー国境の支配を確保する。"
 MA_chateau_gaillard: "$building_type_MA_chateau_gaillard$"
 
 #Carnac Stones
 MA_carnac_stones_district: "$building_type_MA_carnac_stones$"
 MA_carnac_stones_district_desc: "$building_type_MA_carnac_stones_desc$"
 building_type_MA_carnac_stones: "カルナック列石"
 building_type_MA_carnac_stones_desc: "数百もの巨石が平原に散らばり、地平線へ向かって整然と列をなしている。記憶も及ばぬ遠い時代に立てられたこれらの真の目的は、伝説と物語の中に失われている。"
 MA_carnac_stones: "$building_type_MA_carnac_stones$"
 
 #Guérande Salt Marshes
 MA_guerande_salt_marshes_district: "$building_type_MA_guerande_salt_marshes$"
 MA_guerande_salt_marshes_district_desc: "$building_type_MA_guerande_salt_marshes_desc$"
 building_type_MA_guerande_salt_marshes: "ゲランドの塩田"
 building_type_MA_guerande_salt_marshes_desc: "ゲランド近くの低い海岸平野には、名高い#italic フルール・ド・セル#!を海から採るための塩田、堤、運河が網の目のように広がる。海水は浅い池に導かれ、太陽が白い塩を析出させる。代々伝えられてきた技術が町と地域の交易を支えている。"
 MA_guerande_salt_marshes: "$building_type_MA_guerande_salt_marshes$"
 
 #Reims Cathedral
 MA_reims_cathedral_district: "$building_type_MA_reims_cathedral$"
 MA_reims_cathedral_district_desc: "$building_type_MA_reims_cathedral_desc$"
 building_type_MA_reims_cathedral: "ランス大聖堂"
 building_type_MA_reims_cathedral_desc: "高い身廊、細い束ね柱、リブ・ヴォールトと飛梁の広範な使用を特徴とする巨大なゴシック大聖堂。西正面は彫像のある入口と深い飾り迫縁で豊かに構成され、内部はステンドグラスの壁に囲まれて、高さ、光、儀礼的な威厳を強調している。フランス王の戴冠式で中心的役割を果たすのにふさわしい。"
 MA_reims_cathedral: "$building_type_MA_reims_cathedral$"
 
 #Chartres Cathedral
 MA_chartres_cathedral_district: "$building_type_MA_chartres_cathedral$"
 MA_chartres_cathedral_district_desc: "$building_type_MA_chartres_cathedral_desc$"
 building_type_MA_chartres_cathedral: "シャルトル大聖堂"
 building_type_MA_chartres_cathedral_desc: "盛期ゴシックの野心を示す最も優美で秩序だった建築の一つ。シャルトル大聖堂は広い身廊、堅固な柱、奥深い内陣で際立つ。壁面の大部分は堅牢な骨組みの中にはめ込まれたステンドグラスへと置き換えられ、双塔と入念に均整の取れた立面は安定、明晰さ、神学的意図を表している。"
 MA_chartres_cathedral: "$building_type_MA_chartres_cathedral$"
 
 #Palace of Avignon
 MA_avignon_palace1_district: "$building_type_MA_avignon_palace1$"
 MA_avignon_palace1_district_desc: "$building_type_MA_avignon_palace1_desc$"
 building_type_MA_avignon_palace1: "アヴィニョン宮殿"
 building_type_MA_avignon_palace1_desc: "ローヌ川を見下ろす岩の高台に立つこの巨大な宮殿城塞は、洗練された強大な宮廷の所在地である。広間、塔、ヴォールト天井の礼拝堂は力強く優雅な輪郭を見せ、眼下の通りには統治者の富と権威に引き寄せられた使節、職人、商人があふれている。"
 MA_avignon_palace1: "旧宮殿"
 MA_avignon_palace2: "新宮殿"
 
 #Walls of Carcassonne
 MA_walls_carcassonne1_district: "$building_type_MA_walls_carcassonne1$"
 MA_walls_carcassonne1_district_desc: "$building_type_MA_walls_carcassonne1_desc$"
 building_type_MA_walls_carcassonne1: "カルカソンヌの城壁"
 building_type_MA_walls_carcassonne1_desc: "カルカソンヌの古い城壁は、イベリアとフランクの地を結ぶ谷と街道を守っている。塔と堅固な門が城壁を飾り、内側の家々と眼下の畑を保護する。王と信仰が長く争ってきた国境に立つ恐るべき要塞である。"
 MA_walls_carcassonne1: "カルカソンヌの古城壁"
 MA_walls_carcassonne2: "カルカソンヌの二重城壁"
 
 #Saint-Denis Basilica
 MA_saint_denis_basilica1_district: "$building_type_MA_saint_denis_basilica1$"
 MA_saint_denis_basilica1_district_desc: "$building_type_MA_saint_denis_basilica1_desc$"
 building_type_MA_saint_denis_basilica1: "サン＝ドニ大聖堂"
 building_type_MA_saint_denis_basilica1_desc: "聖ドニの埋葬地に建てられたこの大バシリカは、王家の信仰の聖所である。広い身廊は巡礼者を聖人の霊廟へと導き、彩色された壁と彫刻された柱頭はその下に眠る王たちを見守る。ここでは王冠と教会の権威が石の中に結ばれている。"
 MA_saint_denis_basilica1: "サン＝ドニ王立大聖堂"
 MA_saint_denis_basilica2: "サン＝ドニの大内陣"
 
 #Île de la Cité
 MA_ile_de_la_cite1_district: "$building_type_MA_ile_de_la_cite1$"
 MA_ile_de_la_cite1_district_desc: "$building_type_MA_ile_de_la_cite1_desc$"
 building_type_MA_ile_de_la_cite1: "シテ島"
 building_type_MA_ile_de_la_cite1_desc: "ローマの崩壊後、町の人々はセーヌ川の曲流に囲まれた島の中に安全を見いだした。しかしその後、シテ島は活気と美しさと誇りに満ち、今ではパリ、ひいてはフランスの政治、学問、商業の中心となっている。"
 MA_ile_de_la_cite1: "カロリング朝宮殿"
 MA_ile_de_la_cite2: "ゴシック様式の宮殿"
 
 #Iron Gate
 MA_iron_gate_district: "$building_type_MA_iron_gate$"
 MA_iron_gate_district_desc: "$building_type_MA_iron_gate_desc$"
 building_type_MA_iron_gate: "鉄の門"
 building_type_MA_iron_gate_desc: "オロンテス平原と高い山脈を結ぶ峠を守る鉄の門は、アンティオキアへの最も重要な入口の一つである。ここでは城壁が石塔、門、擁壁で固められた狭い峡谷に集まり、岩盤に直接固定されている。城塞は一種のダムとしても機能し、パルメニオス川の急流を制御して街を守る。"
 MA_iron_gate: "$building_type_MA_iron_gate$"
 
 #Pula Amphitheater
 MA_pula_amphiteater_district: "$building_type_MA_pula_amphiteater$"
 MA_pula_amphiteater_district_desc: "$building_type_MA_pula_amphiteater_desc$"
 building_type_MA_pula_amphiteater: "プーラの円形闘技場"
 building_type_MA_pula_amphiteater_desc: "精巧に切り出された石灰岩で築かれたこの円形闘技場は、楕円形の壁、階段状の観客席、地下のヴォールト通路など、ローマの闘技場の全体像を今に留めている。四隅の塔と堅牢なアーケードは建設者たちの誇る技術の伝統を示し、この建物は中世都市における権力、集会、見世物の中心であり続ける。"
 MA_pula_amphiteater: "$building_type_MA_pula_amphiteater$"
 
 #Olympus
 MA_olympus_district: "$building_type_MA_olympus$"
 MA_olympus_district_desc: "$building_type_MA_olympus_desc$"
 building_type_MA_olympus: "オリンポス山"
 building_type_MA_olympus_desc: "テッサリアの中心にそびえる山。ギリシャ全土で最も高い険しい山頂は、海と穏やかな肥沃な斜面に長い影を落とす。\n神々の住まいと信じられ、幾千年もの間、畏敬と崇拝を呼び起こしてきた。頂には目に見えぬ神々の宮殿があるという。"
 MA_olympus: "$building_type_MA_olympus$"
 
 #Ypres Cloth Hall
 MA_ypres_cloth_hall_district: "$building_type_MA_ypres_cloth_hall$"
 MA_ypres_cloth_hall_district_desc: "$building_type_MA_ypres_cloth_hall_desc$"
 building_type_MA_ypres_cloth_hall: "イーペルの織物会館"
 building_type_MA_ypres_cloth_hall_desc: "石と木材で建てられたこの巨大な市民会館は、街の富を支える毛織物の規制、保管、取引のための施設である。整然と伸びる長い正面はアーケード、破風、堂々たる鐘楼で構成され、商業的な機能と都市の権威を兼ね備える。ヴォールト天井の広間では、商人、ギルド役員、行政官が街の経済の中心で契約、度量衡、税を監督している。"
 MA_ypres_cloth_hall: "$building_type_MA_ypres_cloth_hall$"
 
 #Gravensteen
 MA_gravensteen_district: "$building_type_MA_gravensteen$"
 MA_gravensteen_district_desc: "$building_type_MA_gravensteen_desc$"
 building_type_MA_gravensteen: "フラーフェンステーン城"
 building_type_MA_gravensteen_desc: "この堂々たる石造の城はフランドル伯の居城であり、都市に対する伯爵の権威の象徴である。巨大な主塔を中心に厚い外郭城壁で囲まれ、居住用の広間、法廷、軍事防衛施設を一体化し、ヘントの密集した街並みの中で領主権力を誇示する。"
 MA_gravensteen: "$building_type_MA_gravensteen$"
 
 #Mount Ararat
 MA_ararat_district: "$building_type_MA_ararat$"
 MA_ararat_district_desc: "$building_type_MA_ararat_desc$"
 building_type_MA_ararat: "アララト山"
 building_type_MA_ararat_desc: "周囲の平原から双峰を掲げてそびえる巨大な火山山塊、アララト山は、万年雪を頂いて地平線を支配する。諸王国と諸信仰で崇められ、ノアの方舟がたどり着いた場所という古い伝承と結びつき、山麓の土地に神聖な権威と厳かな存在感を与えている。"
 MA_ararat: "$building_type_MA_ararat$"
 
 #Székesfehérvár Basilica
 MA_szekesfehervar_basilica1_district: "$building_type_MA_szekesfehervar_basilica1$"
 MA_szekesfehervar_basilica1_district_desc: "$building_type_MA_szekesfehervar_basilica1_desc$"
 building_type_MA_szekesfehervar_basilica1: "セーケシュフェヘールヴァールのバシリカ"
 building_type_MA_szekesfehervar_basilica1_desc: "この大きな石造バシリカは、ハンガリー王国の儀礼と王朝の中心である。広い身廊では王たちが戴冠し、葬られ、王国随一の王室聖所のヴォールトの下で、王権、法、信仰が結びつく。"
 MA_szekesfehervar_basilica1: "セーケシュフェヘールヴァール王立大聖堂"
 MA_szekesfehervar_basilica2: "セーケシュフェヘールヴァールの大内陣"
 
 #Prague Castle
 MA_prague_castle1_district: "$building_type_MA_prague_castle1$"
 MA_prague_castle1_district_desc: "$building_type_MA_prague_castle1_desc$"
 building_type_MA_prague_castle1: "プラハ城"
 building_type_MA_prague_castle1_desc: "ヴルタヴァ川を見下ろす長い尾根の上で、プラハ城の広間、教会、中庭は眼下の街を支配する。職人、従者、聖職者がボヘミアの支配者たちの居所に集い、その富と野心は丘を領土の政治的かつ宗教的な中心へと変えた。"
 MA_prague_castle1: "プラハの公の居城"
 MA_prague_castle2: "プラハの王城"
 
 #Saint Adrian's Basilica
 MA_zalavar_basilica_district: "$building_type_MA_zalavar_basilica$"
 MA_zalavar_basilica_district_desc: "$building_type_MA_zalavar_basilica_desc$"
 building_type_MA_zalavar_basilica: "聖ハドリアヌス大聖堂"
 building_type_MA_zalavar_basilica_desc: "ザラ川の沼沢地にあるカロリング朝の要塞集落の中心に位置する聖ハドリアヌス大聖堂は、この地域の初期キリスト教化における重要な宗教施設である。際立つ聖所と西側の付属建築を備えた三廊式石造教会として建てられ、宣教拠点と公の教会を兼ね、その庇護者の外交的な影響力を国境地帯へ広げている。"
 MA_zalavar_basilica: "$building_type_MA_zalavar_basilica$"
 
 #Baths of Hisham
 MA_baths_hisham_district: "$building_type_MA_baths_hisham$"
 MA_baths_hisham_district_desc: "$building_type_MA_baths_hisham_desc$"
 building_type_MA_baths_hisham: "ヒシャームの浴場"
 building_type_MA_baths_hisham_desc: "大きな宮殿群の一部であるこの浴場には冷浴室、温浴室、熱浴室が連なり、床下暖房のハイポコーストを備え、石造のヴォールトに覆われている。床には幾何学模様や人物像を描いたモザイクが豊かに敷かれ、とりわけ木々と動物を表した巨大な床面は、細かなテッセラと周到な構図で仕上げられている。"
 MA_baths_hisham: "$building_type_MA_baths_hisham$"
 
 #Peel Castle
 MA_peel_castle1_district: "$building_type_MA_peel_castle1$"
 MA_peel_castle1_district_desc: "$building_type_MA_peel_castle1_desc$"
 building_type_MA_peel_castle1: "聖パトリック島"
 building_type_MA_peel_castle1_desc: "岩の多い聖パトリック島に、教会、広間、墓地が築かれ、周囲の海を見渡している。ここでは古くからの地元の伝統と新たな入植者の信仰が隣り合い、聖職者と支配者は、守られた岸辺で礼拝と世俗権力が結びつく狭い避難所を分かち合う。"
 MA_peel_castle1: "聖パトリック島修道院"
 MA_peel_castle2: "聖パトリックの広間"
 MA_peel_castle3: "ピール城"
 
 #Knin Fortress
 MA_knin_fortress_district: "$building_type_MA_knin_fortress$"
 MA_knin_fortress_district_desc: "$building_type_MA_knin_fortress_desc$"
 building_type_MA_knin_fortress: "クニン要塞"
 building_type_MA_knin_fortress_desc: "クルカ渓谷を見下ろす細長い石灰岩の尾根に沿って延びるクニン要塞は、城壁、塔、囲まれた中庭からなる長大で区画化された防衛施設である。その位置は沿岸と内陸平原を結ぶ道を支配し、地域の主要な王の要塞となっている。"
 MA_knin_fortress: "$building_type_MA_knin_fortress$"
 
 #Amaravati Stupa
 MA_amaravati_stupa_district: "$building_type_MA_amaravati_stupa$"
 MA_amaravati_stupa_district_desc: "$building_type_MA_amaravati_stupa_desc$"
 building_type_MA_amaravati_stupa: "アマラーヴァティーの仏塔"
 building_type_MA_amaravati_stupa_desc: "白い石灰岩の板で覆われた古代の巨大な[Glossary('仏塔','MA_stupa_glossary')]であり、ドラヴィダ人のインドでは最大のものである。煉瓦造りには仏陀の生涯と信仰の場面を描く色鮮やかな物語の浮彫が、円形装飾や帯状装飾の中に刻まれている。四方の門は聖なる塚の周囲を巡る儀礼の動線を定める。"
 MA_amaravati_stupa: "$building_type_MA_amaravati_stupa$"
 MA_stupa_glossary: "仏教で瞑想と礼拝の場として使われる、聖遺物を納めたドーム状の建築物。初期の仏塔は単純な塚だったが、その形と機能は時とともに発展し、仏塔寺院を含むアジア各地の仏教建築に影響を与えた可能性がある。"
 
 #Karla Caves
 MA_karla_caves_district: "$building_type_MA_karla_caves$"
 MA_karla_caves_district_desc: "$building_type_MA_karla_caves_desc$"
 building_type_MA_karla_caves: "カーラ石窟群"
 building_type_MA_karla_caves_desc: "丘陵の岩を直接掘り抜いたカーラ石窟群は、巨大なチャイティヤ堂を中心に、岩窟の[Glossary('ヴィハーラ','MA_vihara')]と祠堂が連なる。広大な堂内は彫刻されたリブのある高いヴォールト天井、列柱が並ぶ長い身廊、後陣に置かれた[Glossary('仏塔','MA_stupa_glossary')]を特徴とする。入口正面には巨大な馬蹄形アーチと彫刻の浮彫が施され、外界から儀礼と信仰の秩序ある内部空間への移行を示している。"
 MA_karla_caves: "$building_type_MA_karla_caves$"
 MA_vihara: "僧侶の住居を備えた仏教寺院の一種。インド建築では、より具体的には周囲に僧房がつながる中央の広間を指す。"
 
 #Somnath Temple
 MA_somnath_temple_district: "$building_type_MA_somnath_temple$"
 MA_somnath_temple_district_desc: "$building_type_MA_somnath_temple_desc$"
 building_type_MA_somnath_temple: "ソームナート寺院"
 building_type_MA_somnath_temple_desc: "月神に捧げられた大きな石造神殿、ソームナートは、[Glossary('マンダパ','MA_mandapa')]が並ぶ長い軸線に沿って構成され、その先の聖所には高くそびえる[Glossary('シカラ','MA_vimana_glossary')]が冠されている。壁と柱は神々、従者、装飾帯の彫像で豊かに飾られる。主要な巡礼地として地域各地から信者を集める一方、インダス川の向こうの異教徒の軍勢からも嫉妬の目を向けられている。"
 MA_somnath_temple: "$building_type_MA_somnath_temple$"
 MA_mandapa: "インド建築における柱のある広間やパヴィリオンで、神殿の入口となる移行空間を担う。"
 
 #Devagiri
 MA_devagiri_district: "$building_type_MA_devagiri$"
 MA_devagiri_district_desc: "$building_type_MA_devagiri_desc$"
 building_type_MA_devagiri: "デーヴァギリ"
 building_type_MA_devagiri_desc: "平原から巨大な火山性の丘が突如として立ち上がり、暗い玄武岩の斜面を山頂へ続く細道が曲がりくねっている。[Glossary('デーヴァギリ','MA_devagiri_glossary')]と呼ばれるこの山には古代の洞窟と祠があり、頂の要害は占有者にとって強固な避難所となる。"
 MA_devagiri: "$building_type_MA_devagiri$"
 MA_daulatabad: "ダウラターバード"
 MA_devagiri_glossary: "サンスクリット語で、\"神々の丘\"を意味する。"
 MA_daulatabad_glossary: "富の住まい。"
 
 #Ashoka's Palace
 MA_ashoka_palace1_district: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_palace1_district_desc: "$building_type_MA_ashoka_palace1_desc$"
 building_type_MA_ashoka_palace1: "アショーカ王の宮殿"
 building_type_MA_ashoka_palace1_desc: "偉大な[Glossary('アショーカ王','MA_ashoka_glossary')]の宮殿は、古代インドの王たちの富と力を物語る。広い中庭と列柱の広間は比類ない豪華さの物語を生み、その規模と洗練は昔日の栄光を再興しようとする者の手本にふさわしい。"
 MA_ashoka_palace1: "アショーカ王宮殿の遺跡"
 MA_ashoka_palace2: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_glossary: "マウリヤ朝の第三代皇帝。残忍な好戦者から倫理的な統治者へと転じ、仏教と広範な布教活動を擁護したことで知られる。"
 
 #Adina Mosque
 MA_adina_mosque_district: "$building_type_MA_adina_mosque$"
 MA_adina_mosque_district_desc: "$building_type_MA_adina_mosque_desc$"
 building_type_MA_adina_mosque: "アディナ・モスク"
 building_type_MA_adina_mosque_desc: "煉瓦と石で造られた巨大な[Glossary('多柱式','MA_hypostyle_glossary')]モスク、アディナは、アーケードとドーム天井の区画に囲まれた大きな長方形の中庭を中心に構成される。礼拝堂はペルシアの帝国的な形式を思わせる壮大な半円筒ヴォールトに覆われている。外壁は古い建築から転用した石の[Glossary('スポリア','MA_spolia_glossary')]とテラコッタの花飾りで彩られる。"
 MA_adina_mosque: "$building_type_MA_adina_mosque$"
 MA_hypostyle_glossary: "柱を何列も並べて屋根を支え、広く開放的な内部空間を生み出す建築形式。"
 MA_spolia_glossary: "古い建物から再利用された建築部材。しばしば継続性と正統性を示すために用いられる。地中海各地のローマ遺跡で典型的だが、それに限らない。"
 
 #Chittorgarh
 MA_chittorgarh_district: "$building_type_MA_chittorgarh$"
 MA_chittorgarh_district_desc: "$building_type_MA_chittorgarh_desc$"
 building_type_MA_chittorgarh: "チットールガル"
 building_type_MA_chittorgarh_desc: "長く孤立した丘の頂を占めるチットールの砦は、インド最大級の軍事記念建築の一つである。巨大な城壁が何マイルにもわたって高原の縁に沿い、宮殿、寺院、塔を自立した城塞の内側に包み込んでいる。"
 MA_chittorgarh: "$building_type_MA_chittorgarh$"
 
 #Lingaraj Temple
 MA_lingaraj_temple_district: "$building_type_MA_lingaraj_temple$"
 MA_lingaraj_temple_district_desc: "$building_type_MA_lingaraj_temple_desc$"
 building_type_MA_lingaraj_temple: "リンガラージ寺院"
 building_type_MA_lingaraj_temple_desc: "インドの神殿建築の最大の傑作の一つであるリンガラージの建造物群は、シヴァ神のための曲線を描く高い[Glossary('ヴィマーナ','MA_vimana_glossary')]へと向かい、次第に神聖さを増す空間を一本の軸線に沿って配置している。あらゆる表面は神々の彫像、花の装飾、物語の浮彫で豊かに飾られている。"
 MA_lingaraj_temple: "$building_type_MA_lingaraj_temple$"
 MA_vimana_glossary: "インドの寺院の奥の聖所の真上に立つ高く曲線的な上部構造で、しばしば精緻な彫刻で飾られる。北方ではこの形式を#italic シカラ#!、南インドとオディシャでは#italic ヴィマーナ#!と呼ぶ。"
 
 #Tsarevgrad
 MA_tsarevgrad1_district: "$building_type_MA_tsarevgrad1$"
 MA_tsarevgrad1_district_desc: "$building_type_MA_tsarevgrad1_desc$"
 building_type_MA_tsarevgrad1: "ツァレヴグラト"
 building_type_MA_tsarevgrad1_desc: "ヤントラ川を見下ろす険しい高地は、周囲の谷を通る進入路を支配する。これらの丘では城壁、塔、寺院が要塞を形作り、自然の防御と高い広間はこの地の支配者にふさわしい居城となる。"
 MA_tsarevgrad1: "タルノヴォの古城"
 MA_tsarevgrad2: "$building_type_MA_tsarevgrad1$"
 MA_tsarevets_glossary: "ツァーリたちの都。この高地の要塞から統治する支配者の帝国への野心と神聖な権威を思わせる名称。"
 
 #Orange Theater
 MA_orange_theater1_district: "$building_type_MA_orange_theater1$"
 MA_orange_theater1_district_desc: "$building_type_MA_orange_theater1_desc$"
 building_type_MA_orange_theater1: "オランジュの劇場"
 building_type_MA_orange_theater1_desc: "オランジュの古代ローマの巨大な舞台壁が石造の大半円形の上にそびえ、街の古い栄光を伝える壮大な記念建築となっている。アーチ、列柱、彫刻された石造部材は皇帝たちの建築家の技量を示し、その支配が終わって幾世紀も経った今も住民の生活を形作っている。"
 MA_orange_theater1: "オランジュ劇場の遺跡"
 MA_orange_theater2: "$building_type_MA_orange_theater1$"
 MA_cavea_glossary: "囲いを意味するラテン語に由来し、ローマの劇場や円形闘技場の階段状になった半円形の観客席を指す。"
 
 #Walls of Mesembria
 MA_walls_mesembria_district: "$building_type_MA_walls_mesembria$"
 MA_walls_mesembria_district_desc: "$building_type_MA_walls_mesembria_desc$"
 building_type_MA_walls_mesembria: "メセンブリアの城壁"
 building_type_MA_walls_mesembria_desc: "岩の多い半島を取り巻く城壁の歴史は長く、ギリシャ人の基礎の上にローマとビザンツの皇帝たちが多大な労力を注いで建設した。巨大な石造城壁、張り出した塔、堅固な門は港と都市を本土に結ぶ狭い地峡を守り、集落を黒海西岸屈指の要塞港にしている。"
 MA_walls_mesembria: "$building_type_MA_walls_mesembria$"
 
 #Sri Pada
 MA_sri_pada_district: "$building_type_MA_sri_pada$"
 MA_sri_pada_district_desc: "$building_type_MA_sri_pada_desc$"
 building_type_MA_sri_pada: "マラヤ山"
 building_type_MA_sri_pada_desc: "ランカの森を見下ろして際立つマラヤの急峻な花崗岩の峰は、周囲の風景を支配する。頂には[Glossary('スリ・パーダ','MA_sripada_glossary')]を囲む小さな聖堂があり、曲がりくねった道を登って雲の上で祈りを捧げる巡礼者の列が絶えることはない。"
 MA_sri_pada: "$building_type_MA_sri_pada$"
 MA_sripada_glossary: "シンハラ語で\"聖なる足跡\"を意味し、伝統的に仏陀自身が山に残したものと信じられている。"
 
 #Palace of Palermo
 MA_palace_palermo1_district: "$building_type_MA_palace_palermo1$"
 MA_palace_palermo1_district_desc: "$building_type_MA_palace_palermo1_desc$"
 building_type_MA_palace_palermo1: "パレルモ宮殿"
 building_type_MA_palace_palermo1_desc: "パレルモの宮殿と別荘は庭園、果樹園、日陰の中庭で知られている。明るい壁と広々とした広間には、数多くの支配者の記憶が息づく。その庇護の下、地中海の芸術的伝統が富と洗練の都に集められた。"
 MA_palace_palermo1: "パレルモの別荘群"
 MA_palace_palermo2: "$building_type_MA_palace_palermo1$"
 MA_palace_balarm1: "バラルムの別荘群"
 MA_palace_panormus1: "パノルムスの別荘群"
 MA_palace_balarm2: "バラルム宮殿"
 MA_palace_panormus2: "パノルムス宮殿"
 MA_cassaro_glossary: "パレルモの最も内側の中心地区で、両側を防備された古代フェニキア人とギリシャ人の街区。その名は城を意味するラテン語#italic Castrum#!に由来し、さらにアラビア語の#italic al Qasr#!から影響を受けた。"
 
 #Cefalù Duomo
 MA_cefalu_duomo_district: "$building_type_MA_cefalu_duomo$"
 MA_cefalu_duomo_district_desc: "$building_type_MA_cefalu_duomo_desc$"
 building_type_MA_cefalu_duomo: "チェファル大聖堂"
 building_type_MA_cefalu_duomo_desc: "チェファルの石灰岩の崖にそびえるこの[Glossary('ドゥオーモ','MA_duomo_glossary')]は、ノルマン建築の堅固な造形とビザンツ・イスラームの装飾を融合させている。巨大な双塔が広い西正面を挟み、ゆったりとした内部の奥、聖所の上には輝く黄金の大モザイクが広がり、王の権威と神の威厳をともに宣言する。"
 MA_cefalu_duomo: "$building_type_MA_cefalu_duomo$"
 MA_duomo_glossary: "ラテン語で神の\"家\"を意味する#italic domus#!に由来するドゥオーモは、イタリアの都市の主要な教会である。しばしば誤って\"大聖堂\"と訳されるが、実際にはこの名称を得るために必ずしも司教座を置く必要はない。"
 
 #Athenaion of Syracuse
 MA_athenaion_district: "$building_type_MA_athenaion$"
 MA_athenaion_district_desc: "$building_type_MA_athenaion_desc$"
 building_type_MA_athenaion: "シラクサのアテナ神殿"
 building_type_MA_athenaion_desc: "古代のアテナ神殿の内部に建てられたこの教会は、元の古代建造物の多くを保存している。神殿の内壁は広い身廊を造るために開かれたが、巨大なドーリア式円柱と外壁は今も明瞭に見え、シチリアの古典古代を代表する優れた記念建築を囲んでいる。"
 MA_athenaion: "$building_type_MA_athenaion$"
 
 #Cave of the Patriarchs
 MA_cave_patriarchs1_district: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs1_district_desc: "$building_type_MA_cave_patriarchs1_desc$"
 building_type_MA_cave_patriarchs1: "族長たちの洞窟"
 building_type_MA_cave_patriarchs1_desc: "アブラハム、イサク、ヤコブとその家族が眠ると信じられている洞窟の上には、精巧に切り出された石灰岩で造られたヘロデ時代の巨大な囲壁がそびえる。頑丈な城壁の内側には、ユダヤ教徒、キリスト教徒、ムスリムがそれぞれ信仰を捧げる神殿と祈りの場があり、巡礼者を地下の聖なる墓へと招く。"
 MA_cave_patriarchs1: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs2: "族長たちの聖域"
 MA_must_be_abrahamic: "[holder|E]は$rf_abrahamic$の[religious_family|E]に属していなければならない"
 
 #Łysa Góra
 MA_lysa_gora1_district: "$building_type_MA_lysa_gora1$"
 MA_lysa_gora1_district_desc: "$building_type_MA_lysa_gora1_desc$"
 building_type_MA_lysa_gora1: "ウィサ・グラ"
 building_type_MA_lysa_gora1_desc: "ウィサ・グラの森に覆われた斜面の上には古代の聖なる山頂があり、人間の俗世とその向こうの聖域を隔てる巨大な環状の石の防壁に囲まれている。ここでは祈りと供物が山を登る者たちの願いを運び、厳かな高地は支配者と信仰が移り変わる中でも畏敬を呼び起こす。"
 MA_lysa_gora1: "禿山"
 MA_lysa_gora2: "聖十字架修道院"

 #Dome of the Rock
 MA_templum_domini: "テンプルム・ドミニ"
 
 #Mainz Cathedral
 MA_mainz_cathedral1_district: "$building_type_MA_mainz_cathedral1$"
 MA_mainz_cathedral1_district_desc: "$building_type_MA_mainz_cathedral1_desc$"
 building_type_MA_mainz_cathedral1: "マインツ大司教座"
 building_type_MA_mainz_cathedral1_desc: "マインツの中心には、大聖堂とそれを囲む広間、礼拝堂、中庭が集まり、強大な大司教の座を形作っている。使節たちはここで迎えられ、領内の政務が決定され、鐘の音は信徒を祈りへと呼び寄せる。石壁は祭壇のはるか先まで力を及ぼす領主の富と権威を示している。"
 MA_mainz_cathedral1: "司教区画"
 MA_mainz_cathedral2: "マインツ大聖堂"
 
 #Ingelheim Palace
 MA_ingelheim_palace_district: "$building_type_MA_ingelheim_palace$"
 MA_ingelheim_palace_district_desc: "$building_type_MA_ingelheim_palace_desc$"
 building_type_MA_ingelheim_palace: "インゲルハイム宮殿"
 building_type_MA_ingelheim_palace_desc: "フランク王たちが築いた数多くの居館や宮殿の中でも、その規模と歴史においてインゲルハイムに並ぶものはごく少ない。ライン川近くに建てられたこの宮殿は珍しい半円形の設計を採り、[Glossary('アウラ・レギア','MA_aula_regia_glossary')]と、それに付随する行政、居住、宗教の建物を包み込んでいる。優雅なアーチと田園風景は、訪れる多くの人に古代ローマの別荘を思い起こさせる。"
 MA_ingelheim_palace: "$building_type_MA_ingelheim_palace$"
 MA_aula_regia_glossary: "かつてのローマにあった広間を手本とする、皇帝の宮殿の大謁見室兼玉座の間。通常は一端に後陣を備えた、細長い単廊式の広大な広間である。"

 #Jewish Quarter of Worms
 MA_worms_jewish_quarter_district: "$building_type_MA_worms_jewish_quarter$"
 MA_worms_jewish_quarter_district_desc: "$building_type_MA_worms_jewish_quarter_desc$"
 building_type_MA_worms_jewish_quarter: "ヴォルムスのユダヤ人街"
 building_type_MA_worms_jewish_quarter_desc: "ラインラントでも屈指の重要なユダヤ人共同体が暮らすこの地区では、狭い通りに家屋や工房、精緻に切り出された石材で築かれたシナゴーグが立ち並ぶ。マインツやシュパイアーとともに、この都市はユダヤ教学の名高き中心地であり、ヨーロッパ全土に広がるアシュケナジムの宗教的・知的伝統の発展に寄与している。"
 MA_worms_jewish_quarter: "$building_type_MA_worms_jewish_quarter$"