l_english:
 # Proclaiming a regional Roman empire (TEMP)
 LR_proclaimed_roman_emperor_modifier:0 "Proclaimed Emperor"
 LR_proclaimed_roman_emperor_modifier_desc:0 "This character proclaimed a new empire of the Romans, and the purple still shines on them."
 LR_proclaimed_roman_empire_opinion:0 "Proclaimed a Roman Empire"
 LR_proclaim_roman_empire_vassals_custom:0 "Every great Roman [vassal|E] in your realm"
 LR_proclaim_roman_empire_opinion_custom:0 "Every Roman [vassal|E]"
 LR_roman_proclamation.0001.t:0 "The [proclaimed_empire.GetNameNoTier] Proclaimed"
 LR_roman_proclamation.0001.desc:0 "The legions raise their standards and the cities send their delegates. What was the rump of [old_empire.GetNameNoTier] is a rump no longer: before the assembled magnates I am proclaimed Augustus of the [proclaimed_empire.GetNameNoTier], heir to Rome in these lands."
 LR_roman_proclamation.0001.a:0 "Ave, Imperator!"
 LR_roman_proclamation.0002.t:0 "A New Empire of the Romans"
 LR_roman_proclamation.0002.desc:0 "Word arrives that [new_roman_emperor.GetTitledFirstName] has put on the purple and proclaimed the [proclaimed_empire.GetNameNoTier], claiming the inheritance of Rome in [new_roman_emperor.GetHerHis] lands."
 LR_roman_proclamation.0002.desc_rival:0 "Word arrives that [new_roman_emperor.GetTitledFirstName] has put on the purple and proclaimed the [proclaimed_empire.GetNameNoTier]. Another claimant to the inheritance of Rome, and one who will not be content to stay in [new_roman_emperor.GetHerHis] corner of the old empire for long."
 LR_roman_proclamation.0002.a:0 "Interesting news."
