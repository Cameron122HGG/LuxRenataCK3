l_english:																
TRAIT_FLAG_DESC_lux_bloodline: "This character belongs to a prestigious bloodline, granting them unique bonuses and abilities associated with their illustrious heritage."
trait_bloodline_alexander: "Blood of Alexandros"
trait_bloodline_alexander_desc: "Alexandros III of Makedonia, better known to this world as Megas Alexandros, was the conqueror who broke the Achaemenid Empire and forged a legend which even the greatest of men can only envy. His son by Roxana, Alexandros IV was a tragic figure, blinded in a childhood accident. Following unrest he retired to Cyprus, where he took little interest in the affairs of the world. The main line of the Argeadai became irrelevant, yet respected rulers of their island kingdom, while the secondary line, descended from Stateira, became glorified marriage partners for the daughters of the Diadokhoi. It is said the Conqueror's blood boils with ambition, and echoes of Alexandros' will yet rings through the very heart of his heirs! This broken world, weeping in the throes of chaos and despair, calls out for a hero, a savior, a conqueror! The Blood of Alexandros-Ammon yearn to fulfill their divine purpose, to set this world to right. They shall march to the Ends of the Earth, and weep only when there are no more worlds to conquer!"
trait_bloodline_ptolemaios: "Blood of Ptolemaios"
trait_bloodline_ptolemaios_desc: "The proud Diadokhoi bloodline of Ptolemaios once ruled over Egypt and the Levant, from Kyrene to Cyprus! As a Roman vassal, Ptolemaic Egypt managed to survive in a reduced state, until finally its rulers had to accept the loss of Egypt and rule over the small kingdom of Kyrene alone. Kyrene became an impregnable bastion of the Ptolemaioi, a highly fortified and developed realm sustained by a powerful professional military, and even Muslim expansion could not dislodge the proud Hellenes from their seat of power. Upon their elevation to the throne, the Ptolemaioi of Kyrene adopt the sacred praenomen of Userkhaenre Meryamun - Who is made strong through the ka of Re, beloved of Amun - the ancient name of Ptolemaîos Philádelphos, for it was prophesized that He would ride back in glory to Alexandria and beyond!"
trait_bloodline_gelimer: "Blood of Gelimer"
trait_bloodline_gelimer_desc: "Gelimer, King of the Vandals and the Alans and Champion of Arianism, defeated Belisarius at Ad Decimum in 533 CE, thus ensuring the survival of the Vandal state. His dream of forging a Vandalic Empire to rival Carthage came very near to fruition. He ruled over a vast state spanning North Africa, Sicily, Sardinia, Corsica, and Southern Hispania, but was assassinated in Carthago Nova before he could proclaim himself Emperor. The Kings of Carthage slowly lost their Mediterranean conquests, but their vast maritime and commercial power assured their survival even in the face of Muslim expansion. The blood of Gelimer yearns for revenge, and remembers the great King's last words: Roma delenda est..."																				
trait_bloodline_seleukos: "Blood of Seleukos"
trait_bloodline_seleukos_desc: "Seleukos I Nikator, Blood of Apollo, forged a mighty empire in the very heart of Makedon's storied conquests. And yet, his descendants squandered it all the same. The Seleukidai came close to extinction, but the young Antiochus XIII Soter defeated Tigranes at Antiocheia ad Taurus in 83 BCE, sparking the beginning of a Seleukid Renaissance. Antiochus XIII Soter brought Tigranes' Armenian Empire to its knees, then after a series of successful campaigns in the East, had himself proclaimed a second Alexandros after a triumphal entry into Seleukeia on the Tigris, the ancient capital of Arche Seleukeia. The Seleukid Renaissance ended in 116 CE, when Antiochus XVI Epiphanes bent the knee before a victorious Trajan and accepted Roman sovereignty. Seleukid Syria survived as a Roman vassal and later became a buffer state between the Romans and Islam. The blood of divine Seleukos is restless, and shall see its glory restored!"
trait_bloodline_antigonos: "Blood of Antigonos"
trait_bloodline_antigonos_desc: "Antigonos I Monophthalmos, Lord of Asia built a vast Empire but his descendants lost it generations ago. The Antigonidai came close to extinction but the young Demetrios II Nicator defeated the Parthians at the Battle of Ecbatana in 129 BCE, sparking the beginning of an Antigonid Renaissance. Demetrios II Nicator brought Parthia to its knees, then after a series of successful campaigns in the East he had himself proclaimed a second Alexandros after a triumphal entry into Babylon	 the ancient capital of Mesopotamia. The Antigonid Renaissance ended in 83 BCE when Demetrios III Eucaerus bent the knee before a victorious Sulla and accepted Roman sovereignty."
trait_bloodline_antipater: "Blood of Antipater"
trait_bloodline_antipater_desc: "Antipater I, regent of Alexander's Empire and later King of Macedon, built a vast empire, only for it to slip through the fingers of his descendants. The Antipatridai came close to extinction but the young Cassander defeated the Greek city-states at the Battle of Crannon in 322 BCE sparking the beginning of an Antipatrid Renaissance. Cassander brought Greece to its knees	 then after a series of successful campaigns in the Balkans he had himself proclaimed a second Alexandros after a triumphal entry into Pella, the ancient capital of Macedon. The Antipatrid Renaissance ended in 168 BCE when Antipater II Etesias bent the knee before a victorious Lucius Aemilius Paullus and accepted Roman sovereignty."
trait_bloodline_sassanid: "Blood of Sassan"
trait_bloodline_sassanid_desc: "From Estakhr, Ardashir I, blood of Sassan and Darius the Achaemenid, built an Empire and swore to bring the world under the dominion of Ahura Mazda. The glory of the Realm of Light knew no equal in this world, and kings from Sindhia to the shores of the Inner Sea prostrated themselves before the glory of the Light. Yet Angra Mainyu saw fit to test the steadfastness of the Sovereigns of Light, bringing forth a great darkness from the sands to challenge the Realm of Ahura Mazda. It was Yazdegird III who warded against those who would destroy the Realm of Light, and in 636 CE at the Battle of al-Qadisiyyah, Ahura Mazda emerged victorious. The Empire was saved, only to fall prey to internal dissent as the centuries weakened the blood of the Sovereigns of Light. Yet in Estakhr, the blood of Sassan remains strong, and the Lords of Light still whisper: 'With me is the Derafsh Kavian, through which I shall rule the nations.'"
trait_bloodline_julianos: "Blood of Julian"
trait_bloodline_julianos_desc: "Flavius Claudius Julianus Augustus, blood of Constantine and Augustus on his mother's side, Sol Invictus made flesh and Savior of the Light, was a true philosopher king the likes of which the Romans have never seen again. Invincible in battle, Julian humbled all who opposed him, from the barbaric Alemanni and Franks to the Sassanids of Persia. His complete victory over the Christian infidels and his Sacred Policies of Purification of the Eastern Empire were an inspiration for many Emperors to come, as Christianity and other barbaric cults were humbled by the Invincible Light of Sol. Although his descendants lost the throne, Aurelian II, the True Restorer of the World, a descendant of the great Aurelian on the maternal side, managed to reclaim the throne. On the 25th of December 932 CE, the very date of the Dies Natalis Sol Invicti, the Birthday of Sol Invictus, he entered Constantinople in triumph and restored the blood of Julian to its rightful place of glory. The Sun Emperors of Constantinople dedicate their rule to 'Inventori Lucis Soli Invicto Augusto' - to the Creator of Light, Sol Invictus Augustus, and await his return, for the Sun will be made flesh once more in the very person of the Emperor and the Light shall banish the Darkness from the world of Man!"
trait_bloodline_eurypontid: "Blood of Eurypon"
trait_bloodline_eurypontid_name: "Blood of Eurypon"
trait_bloodline_agiad: "Blood of Agis"
trait_bloodline_agiad_desc: "The bloodline of Agis I, son of Eurysthenes, blood of Herakles, and King of Sparta, has provided Lakedaimon with its senior line of kings for millennia. Ever the outlier among the Hellenic polises, the city of Sparta has two kings, called Arkhagetai, with the two dynastic lines descending from the twins Eurysthenes and Procles. These Heraclidae Kings of Sparta are split into the senior Agiad and junior Eurypontid line. Fueled by the Spartan warrior ethos, the Kings of Sparta are legendary figures, from the immortal Leonidas and his Three Hundred, to Agesilaus II, King of the Hellenes. The Spartans still shout 'Molon Labe!' before being asked to surrender as they inevitably meet some superior force on the battlefield...and then proceed to humble it. While its great traditions never died out, Sparta did lose its glory as the star of Makedon rose, but the Lakedaimonians managed to hold on to their corner of the Peloponnesus. The Romans, great admirers of the militaristic Spartan state, allowed them to continue as a vassal kingdom, and the Spartans, ever more insular, continued to dedicate themselves to martial perfection. The Spartan Homoioi - those who are the same - fought for the Romans in countless battles, many of them in the shade of clouds of arrows fired by Eastern hosts. The Agiads rule over the city to this day, and upon their ascension to kingship they go on a sacred pilgrimage to Thermopylae, where they recite the famous epigram of Simonides, so that they might remember what it is to be Spartan: O ksein', angellein Lakedaimoniois hoti teide keimetha, tois keinon rhemasi peithomenoi - Go tell the Spartans, stranger passing by, that here obedient to their laws we lie."
trait_bloodline_karling: "Blood of Charlemagne"
trait_bloodline_karling_desc: "Karolus Magnus, King of the Franks and Emperor of the Romans, ruled over a vast yet fragile realm. A major architect of this Empire was Pope Leo III, exiled from Rome by the Western Roman Emperor Marcus Aurelius V. The Pope went to the court of the Frankish King, and persuaded him to embark upon a Crusade against the Unholy Empire now found in Rome. In order to give legitimacy to the enterprise, Leo had Karolus crowned Holy Roman Emperor, and proclaimed the birth of a new Holy Roman Empire! The crusading armies of this new empire marched on Rome, but in 802 CE at the Battle of Pavia, a Roman coalition led by the Mithraic host of Ravenna defeated the Franks and sent them back over the Alps. The Empire of the Carolingians remained a fragmented state, greater in theory than reality, and upon his death it split into many lesser kingdoms paying only lip service to the new Sacral Emperor reigning in Aachen. The main Karling line retained the fiction of their Holy Roman Imperial title, but little power outside the walls of their capital. The lesser lines of the Pepinid Karlings and Lotharing Karlings ruling over Austrasia and Lotharingia retain vastly more power than their theoretical overlord. The Emperor himself is nothing but a shadow of the great Karolus, with the great nobility of his nonexistent Empire bowing before him in public, yet laughing behind his back. A Carolingian Restoration is the dream of every Sacral Emperor, which even the lesser bloodlines of the Karlings share...yet such a dream might be beyond the powers of mere mortal men. A true Holy Roman Emperor, Karolus Reborn, might be the only one able to fulfill such glory! Whether there can be such a one, it is the Karling's sacred destiny to find out."
trait_bloodline_merovech: "Blood of Merovech"
trait_bloodline_merovech_desc: "The Merovingian Kings of Francia trace their descent from Merovech and Clovis I, the first great Christian King of the Franks. Their holy Sang Real, the Royal Blood, has ruled over the Franks for hundreds of years, although many were spent as mere figure-heads, with over-powerful Mayors of the Palace being the actual power of the realm. The Karlings kept the Sang Real on a tight leash, the Merovingian Kings being in truth less than minor aristocrats in their new capital of Paris. Providing little besides glorified marriage partners for the Karlings and other more powerful dynasties, the Merovingians might have disappeared into complete irrelevance. Yet this was not to be. Following the great fragmentation of the Carolingian Empire and The Third Great War of the Princes, an able scion of the Sang Real rose to great power among the feudal nobles of the Holy Roman Empire. His name was Clovis VI, and through his marriage to the Karling princess Adelheid, a well-engineered network of alliances, and undisputed martial genius, this latter-day Clovis built a kingdom worthy of his sacred bloodline. Under his descendants, this Sacral Frankish Kingdom became ever more of a theocracy than a feudal state. The Kings of the Sang Real are considered divine by their subjects, and are said to be able to ritually cure sickness by laying on hands. Ever greater belief in their own Sacred Mission saw the Merovingians split with Rome, establishing their own Gallic Church, based upon the Mystery of the Sang Real and the divine destiny of its heirs. It is said that a Ruler of the Holy Blood will one day rule the world, for the world belongs to the Sacred Sang Real, now and forever!"
trait_bloodline_capet: "Blood of Hugh Capet"
trait_bloodline_capet_desc: "The Capetians trace their descent from Robert the Strong, the first of their line to ascend the throne of Neustria. As Sovereign-Margrave of Neustria, Robert was one of the great feudal lords of the Empire, and following the collapse of Karling power during the First Great War of the Princes, crowned himself King. Following his successes in battle against the Vikings, Robert became known as the Strong, and he would come to sire a long line of Kings. In spite of his greatness, the dynasty of Neustria now takes its name after Hugh Capet, one of his descendants, thanks to a short-lived elevation as High King of the Franks during his victorious war against the Karling kingdoms. Wielding the Sacred Oriflamme banner of Saint Denis, after having been gifted the banner by his ally, the Merovingian warrior King Charibert VIII, Hugh led the armies of Neustria to countless victories. Fittingly in 996 CE, Hugh died in battle, surrounded yet never surrendering, cut down by his own treacherous nobles. Even in death, he still held to the sacred Oriflamme banner, and thus ascended into legend. The Kings of Neustria honor his legacy as they go into battle shouting 'Montjoie! Saint Denis!', with their host following the Sacred Oriflamme to glory!"
trait_bloodline_barcelona: "Blood of Bello"
trait_bloodline_barcelona_desc: "This character is a descendant of Bello of Carcassonne, whose dynasty ruled over vast lands in Septimania and Catalonia during the reign of the Karlings. The Bellonids became hereditary rulers of the short-lived Spanish March, and under Wilfred the Hairy, Lord of Barcelona, the former territories of the March were reorganized into a powerful Principality. The proud symbol of the Bellonids is the Senyera, the golden flag with four red stripes of the House of Barcelona, an emblem that dates back to Wilfred's participation in the failed Spanish Crusade of Karolus the Bold. Following a great victory against the infidels, the wounded Frankish King smeared four bloodied fingers over Wilfred's golden shield, thus giving rise to the eternal symbol of the Catalans. The proud Lords of Barcelona carry the Senyera into battle to this day, ready to add their blood to the golden shield of Wilfred!"
trait_bloodline_decebal: "Blood of Decebalus"
trait_bloodline_decebal_desc: "Decebalus the Brave, King of Dacia, ruled over a vast Dacian state from his great capital of Sarmizegetusa. In 87 CE, Decebalus destroyed five Roman legions at the Battle of Tapae, thus earning himself the eternal enmity of Rome. Trajan defeated Decebalus in 102 CE, and Dacia was forced to become a client kingdom. As a client of Rome, Dacia became a militaristic buffer state of the Empire, and a fertile recruiting ground for its legions. The Dacians owe their survival to the peculiar nature of their society. As a military client of the Empire, the Dacian state became increasingly more dedicated to warfare. The tarabostes, the warrior nobility, became a meritocratic class whose sole purpose was turned to martial excellence, and through their influence the Cult of Zalmoxis became a monotheistic faith, with its disciples believing in an afterlife most easily earned by valor in battle. Zalmoxism became the state religion, and this mystical warrior cult forged the Dacians into an unconquerable and fearless martial people. The Dacians hold death in contempt, and their fanatic falxmen expect their glorious place in the afterlife in every battle. Every year, the Dacians send a warrior to Zalmoxis with their petitions, as he fearlessly throws himself from a great height onto the spears of the assembled host. It is said that Zalmoxis hears this supreme prayer and sends glorious thunder to signal his acceptance of his people's supplication. After gaining the approval of Heaven, the Dacian hosts march behind their Draco banners to the glory none can deny them! Woe to the enemies of Zalmoxis, for the Blood of Decebalus fear nothing!"
trait_bloodline_brian: "Blood of Brian Boru"
trait_bloodline_brian_desc: "Brian Bóruma mac Cennétig, King of Munster, was the last Irishman to hold the High Kingship of Hibernia. After several successful campaigns, Brian received the submission of all of the kings of the island, from the ruthless Norse Ivarrings of Dublin to the proud Conchobairs of Connacht. In a sacred ceremony on the Holy Hill of Tara, Brian drank the royal ale, and married the goddess Medb. It is said that as the ceremony came to a close, Brian touched the Lia Fáil, the Stone of Destiny, and the stone sang as it had not since time of Cúchulainn! As the rightful king of Ireland, Brian should have enjoyed a long and prosperous reign, but it was not to be. In 1014 CE, at the Battle of Clontarf, Brian led his Fianna Fáil, his Warriors of Destiny, against a vast Norse host, and while his army emerged victorious their rightful king fell to treachery. It is said that in Sacred Tara the Lia Fáil roared with sorrow, and that since then it has fallen silent once more. Perhaps it will come to be, that one day another king of the blood of Brian will become Ard Ri of Hibernia, and go on to Tara so the Stone may roar again! Until then, the Lia Fáil waits in silence."
trait_bloodline_oleg: "Blood of Oleg"
trait_bloodline_oleg_desc: "Oleg the Seer, the first Great Varangian Prince of Kiev, is a figure of legend, credited with great oracular powers. In 912 CE Oleg, Bane of the Romans, assembled a great Varangian host and sailed south to besiege Miklagard itself. Unable to penetrate the great walls of the Queen of Cities, Oleg fixed his shield to the gate of the city. It is said that a prophecy foretold that Oleg would find his death from his own stallion, and so he sent it away, and many years later when the beast had died, he finally went to see its remains. As Oleg touched the skull of his stallion, a snake slithered from inside the skull and bit him. Thus, Oleg died fulfilling the prophecy. His descendants are still credited with great oracular power, and are prone to call themselves 'The Seer Princes' of Kiev. While their dominion is much diminished, the Olegovichs of Kiev are still feared by their enemies as they cling on to power in the Seer's capital. The Princes of Kiev have overcome many misfortunes, and have remained steadfast in their resolve. For it is foretold that one day, a King of the Blood of Oleg will march once more on Miklagard, and he will affix his shield on the very doors of the Imperial Palace!"
trait_bloodline_rurik: "Blood of Rurik"
trait_bloodline_rurik_desc: "Rurik, the Varangian Prince of Holmgardr, established a strong Norse state centered around his newly founded capital. One of many Varangian warlords to try their hand at conquest in the East, Rurik's legacy proved to be the most lasting. His heir Ingvar of Holmgardr was acknowledged by the other Varangian Princes as King of Gardariki. His great Varangian host besieged Miklagard on two occasions in 941 CE and 944 CE. Not content with these mere raids on the Black Sea, Ingvar terrorized the Caspian as well, his Varangians launching a major expedition into Persia, and sacking the great city of Arsakia Rhagae. In spite of his glorious exploits, Ingvar met with an undignified end, as the Drevlyans captured him while attempting to collect tribute. The Drevlyans bent down two birch trees to the ground and tied them to Ingvar's legs, and then they let the trees straighten, thus tearing him apart. His wife Olga extracted merciless revenge, burning their capital of Iskorosten and then salting its very ground, then leveling their other towns so that nothing remained of them, while all Drevlyan men were put to the sword. Rurik's blood lost the High Kingship, but his descendants continued to reign in Holmgardr and elsewhere. After several expeditions to Miklagard, and with many of their warriors having served in the Varangian Guard of the Eastern Empire, the Princes of Holmgardr adopted Ódinn-Sól as their patron, their very own version of Sol Invictus. It is their dream to build a great Empire of the North, a Third Rome under the auspices of their Invincible Sun, and then one day with the whole might of Gardariki, descend upon Miklagard in victory and march on to even greater glory, to Rome and beyond!"
trait_bloodline_parmenion: "Blood of Parmenion"
trait_bloodline_parmenion_desc: "Parmenion, the great general of Philip II of Makedon, and then Megas Alexandros, was one of the greatest of the Makedones. The chief companion of Philip, and then Alexandros' second in command, Parmenion's great wisdom inspired generations of Makedonian generals. While some whisper that his steadfast command of the left at the Battle of Issus was the true key to success in that most famous of battles, others choose to remember him for his advice before the Battle of Gaugamela. Darius had sent an emissary offering Alexandros half of his entire empire in exchange for peace. Parmenion opined that if he were Alexandros, he would have gladly accepted the offer. Alexandros only replied, 'And I would too, if I were Parmenion.' The bloodline of Parmenion became Satraps of Ecbatana after the conquest of Persia, and stubbornly held it as they mastered the art of bowing before the most powerful ruler of the day. Their greatest moment came towards the end of the Seleukid Renaissance. In 102 CE, Philotas XII, after a famous victory at Arsakia Rhagae, humbled his Parthian overlord and went on to crown himself King of Media. After a series of whirlwind campaigns, Philotas, now king of Media, Atropatene, and Armenia, marched upon Seleukeia on the Tigris and entered the city in triumph as the Seleukid Basileus Antiochus XVI Epiphanes chose not to give battle. Great celebrations were planned to mark the restoration of a Hellenic Persian Empire, but on that very night, Philotas the Conqueror died choking on a cup of poisoned wine, and the dream of an Arche Makedonia reborn died with him. His descendants did well to hold on to Ecbatana and wither the storms time sent their way. Now Persianized, the Parmenions of Ecbatana dream of the Empire that could have been, if not but for a cup of wine!"
trait_bloodline_almaqah: "Blood of Almaqah"
trait_bloodline_almaqah_desc: "The Mukarrib Priest Kings of Saba claim their descent from Almaqah, the Sun God. Almaqah holds a cluster of lightning bolts in his hand, surrounding a sacred sickle-sword, ready to smite those who would bring Darkness to his Sacred Realm. From their great capital of Ma'rib, the Priest Kings of Saba rule over a powerful, unconquerable realm beloved to the Sun above. Masters of the spice trade, their caravans ply the sands of Arabia and beyond, bringing great wealth to the Children of the Sun. Their impregnable dominion is centered upon great fortified cities where Sun Priests invoke the benevolent grace of Almaqah, and merchant princes plan their next trade expeditions. The armies of Almaqah are centered upon the steadfast heavy infantry of Sabaean cities, complemented by the impetuous light cavalry of the nobility and desert tribesmen who call the Mukarrib their Lord. The Sun Lords of Ma'rib have proved their divine heritage as their glorious kingdom stands unbowed on the tip of the Arabian Peninsula, defying all those who would seek to possess its wealth. From their magnificent Holy City of Ma'rib, the Blood of Almaqah plan great conquests! There is glory to be won over the Ocean of Sand to the north, and a place in history to the Mukarrib who restores the worship of the Sun to his errant Arab cousins. Almaqah is ready to embrace all under His benevolent Light, and bring forth an Age of Glory!"
trait_bloodline_artorius: "Blood of Artorius"
trait_bloodline_artorius_desc: "The general Lucius Artorius, commander of the Sarmatian Cavalry of Alexandros III, was the bastard son of King Abgar IX of Osroene. In 207 CE, Lucius Artorius was sent at the head of a great Daco-Sarmatian army to Britannia to defeat the Republicans under Clodius Albinus. His defeat of the Republicans in the great battle of Londinium, and the trampling of the body of Clodius Albinus, still clutching the SPQR banner remain the stuff of legend. Alexandros III would fondly call him 'the True Destroyer of the Republic'. Wielding his Sword of Victory, Lucius Artorius soon embarked on the legendary Campaign Beyond the Wall, reaching the Northern End of the World as no civilized man had done before, only adding to the Artorian myth. Lucius Artorius was later named hereditary Military Governor of Britannia, and his power over the island was enforced by a vast program of Daco-Sarmatian colonization. In 259 CE, his descendant Maximus Artorius proclaimed himself Emperor of Britannia, and would go on to become Gallic Emperor and co-Emperor of the Roman Empire. In 500 CE, another Artorian, Magnus Artorius, High King of Britannia, won the Brythons a great victory at the Battle of Mons Badonicus against the Saxon invaders, halting their western advance, only to fall in single combat to his own son Modredus during the Battle of Camlann in 537 CE. The Artorii would go on to produce many High Kings of the Brythons and lesser kings as well. The senior Sarmato-Brython branch of the family took up the name Pendragon - 'Head Dragon' - as their Sarmatian Dragon Banners became the symbol of the dynasty. Another symbol of the dynasty remains Lucius Artorius' Sword of Victory, the true symbol of Artorian kingship. Each Artorian King is supposed to sacrifice at least one man to the Sword of the War God throughout his reign, that he might be recognized as a true king. The greater the rank of the sacrifice, the greater the king, the legend goes, and many great men of Britannia saw their end with the Sword of Victory thrust into the ground through their beating heart. While the power of the Artorii is much diminished, men still tremble at the very sight of the invincible Dragon Banners! It is said that a True King wielding the Sword of Victory will once more humble the West and show himself to the world by having an Emperor sacrificed to the War God. The Sword thirsts for blood, and the Dragon Banners are restless! The Horse Lords of the West are ready to ride forth in glory!"
trait_bloodline_vespasian: "Blood of Vespasian"
trait_bloodline_vespasian_desc: "Titus Flavius Caesar Vespasianus Augustus was Roman Emperor from 69 CE to 79 CE. With the support of the East behind him, Vespasian emerged victorious during the Year of the Four Emperors, after Alexandros II had been assassinated by his Nabatean mistress Salome. His son Titus, who would go on to become Emperor himself, subdued Judaea, conquered Jerusalem and captured the Jewish fortress of Masada. In 73 CE, Vespasian was responsible for the first wave of Jewish resettlement in the Sinai. The last words of the great Emperor were one last joke at the Divine Alexandros II's expense: 'I think I am turning into a God.' The Vespasiani lost the Imperial throne, but survived as one of the great Roman patrician families. The star of the Vespasiani rose once more in 895 CE, when Leo VI the Macedonian appointed Lucius Vespasianus as hereditary Dux of the new Vicarate of Etruria. The Vespasiani have retained their African dominion ever since, still distantly dreaming of their restoring their line to Imperial glory. Can the descendants of the Great Vespasian be Emperors once more? Only time will tell whether they might actually become gods in truth."
trait_bloodline_kahina: "Blood of Kahina"
trait_bloodline_kahina_desc: "The Berber Queen Daya Ult Yenfaq Tajrawt, known to the world as Kahina, led the Berber resistance against Islam in North Africa. Claiming descent from the Antonii and the Amanai Berber Princes, the Great Warrior Queen of the Berbers proved worthy of her Roman and divine blood both. Her many victories against Islam and preternatural military talent earned her a reputation for sorcery among the Muslims. In 692 CE, Kahina destroyed a great Islamic army near Biskra and had all captives decapitated, their bodies left to rot on the field. This earned her the dread name of 'Gatherer of Heads' among the Arabs. Furthermore in 695 CE, Kahina defeated the great Arab general Hasan ibn al-Numan, greatly weakening Islam in North Africa, with the Queen swearing never to rest till its destruction. In 710 CE, the Kahinid prince Amanay founded the Kingdom of Nekor, and her descendants have ruled it ever since. Unbent and unbroken, the Berber Kings of Nekor are reputed for their invincible exploits on the battlefield and their talent for sorcery. Arabs and other Berbers alike fear the Sorcerer Kings of Nekor, and shy far away from the shadow of their mountain strongholds. Upon their ascension as King, the Kahinid princes are ritually remembered of the Oath of Kahina, and swear never to rest until the followers of Mohammed are swept from their sands."
trait_bloodline_verus: "Blood of Verus"
trait_bloodline_verus_desc: "Lucius Aurelius Verus Augustus became Roman co-Emperor in 161 CE, signaling the rise to prominence of the Veri, who would go on to become one of the great Roman patrician families. His reign as co-Emperor began inauspiciously, as Lucius Verus was forced to pay the Praetorian Guard a donative of 20,000 sestercii per capita in exchange for an oath of loyalty. His reign proceeded smoothly after this, and Lucius Verus became much loved by the people, as he lacked the imperial arrogance and pomp of his predecessors and mingled with them freely. He instituted several programs aimed at taking care of poor children and integrating them from an early age within the military structure of the Empire. He allowed free speech, and was said to enjoy comedians who managed to mock him in intelligent fashion. Lucius Verus proved to be invincible on the battlefield, winning several battles for the Empire in a quick and efficient manner. In his later years he turned to luxury, gambling, and orgies, while still managing to fulfill his duties with great aplomb. He took the divinely beautiful Panthea as a mistress, whose influence over him was so great that comedians came to call him Panthea, something the Emperor took in good humor. Lucius Verus also became known as an avid collector of fossils and 'bones of giants', and earned a reputation of a pleasure loving scholar, entertaining his guests with his knowledge and parties both. The other great Verus, Lucius Verus II, was one of the greatest martial Emperors, sadly remembered by most only for his execution of the widow of Alexandros IV, Aquilia Severa. The former Vestal Virgin was buried alive according to Roman custom once Lucius took power. Her son, Alexandros V, would later forgive him, proclaiming it to have been 'the Roman way'. In 428 CE, the magnate Quintus Verus was appointed hereditary military governor of Provincia, thus inaugurating the centuries long Veri rule over Provinica. The Veri remain one of the most prestigious and richest Roman aristocratic families, and should they sire a new Lucius, Imperial honors could once more be within their grasp!"
trait_bloodline_amyntas: "Blood of Amyntas"
trait_bloodline_amyntas_desc: "Amyntas, Tetrarch of the Trocmi and King of Galatia, was the greatest of all Galatian Kings. After his conquest of Kappadokia, Amyntas defeated Antiochus XIV in battle near Mazaka, had the Seleukid Basileus torn to pieces, and went on to besiege Antiocheia. In 34 BCE, Amyntas received the submission of Armenia, and in 32 BCE became Sovereign of Atropatene. His legendary campaign against Parthia culminated in his defeat of Phraates IV near Hecatompylos. His Tindotae are said to have refused to emasculate the Parthian dead, considering them 'not manly enough to be worth the trouble.' Amyntas entered Hecatompylos in triumph and had himself acclaimed King of Kings. Seven days later, he died under mysterious circumstances, and with him died the dream of a Galatian Empire to rival Alexandros'. His descendants continued to rule in Galatia and emerged as major players in imperial politics as their warlike state became a source of great military strength for those who could command its loyalty. The proud, warlike Galatians were also widely used as military colonists throughout the known world, and their heritage can be found from the Pillars of Hercules to the Arche Serika. The adoption of the cult of Eosphoros, the Dawn Bringer, as the state religion of the Kingdom further strengthened this unbreakable people. Eosphoros, Lucifer, the True Lord of Hosts, commands his subjects to carry on his eternal battle against the False Gods of Darkness who would enslave Man, subject him to countless indignities, and condemn him to eternal servitude. The Galatian Kings remember well their storied heritage, as well as their divine mission. One day the Dawn Bringer shall topple the False Gods of the Yahwists, and Light shall reign in eternal Glory over the Realms of Man!"
trait_bloodline_severus: "Blood of Severus"
trait_bloodline_severus_desc: "Lucius Septimius Severus Augustus started his career by campaigning against the Great Abgar IX of Osroene. He humbled the Armenian Emperor, and extracted an oath that cemented his role as a petty client of Rome. Following his victories in the East, Severus was sent to Hispania to put down a Lusitanian rebellion. In 192 CE, following the death of Commodus, his legions proclaimed him Emperor in Africa. He became a member of the Imperial Triumvirate alongside Clodius Albinus and Alexandros III, confirming his control over Hispania and Africa. In 200 CE, while in Rome, Septimius Severus attempted to have himself crowned sole Emperor, and after the refusal of the Senate, had it disbanded, thus sparking the War of the Three Emperors. The great champion of the Republicans, Clodius Albinus, expelled Severus from Rome and then chased him into Africa. At the end of the war in 210 CE, Alexandros III acknowledged Septimius Severus as Emperor of Africa, thus starting the long rule of the Severi over their African possessions, and inaugurating the long lived political entity of the Empire of Africa. On his deathbed Severus told his sons Geta and Caracalla: 'Be harmonious, enrich the soldiers, and scorn all other men.' The Severi have taken this to heart, surviving the centuries on martial strength alone. They have slowly lost their hold over Africa, and in 553 CE Leptis submitted to Belisarius. Justinian had Marius Severus confirmed as hereditary Exarch of Africa, and thus the once proud Emperors became the unbreakable Exarchs of the West. In 707 CE, Julius Severus broke with the Empire, proclaiming himself King of Africa, and the Severi once more became masters of an independent power. Having weathered centuries of adversity and wars with the Vandals, Berbers, and the Muslims, the Severi still hold on to their Kingdom of Africa and dream of the Empire that is rightfully theirs. With their great militaristic state ready to raise endless legions for their masters, the Severi stand ready to once more claim the Empire of Africa as their own, and Mithras willing, shall one day return to Rome to punish the Senate for its ancient, yet never forgiven insolence!"
trait_bloodline_muawiyah: "Blood of Mu'awiyah"
trait_bloodline_muawiyah_desc: "Mu'awiyah ibn Abi Sufyan was the first of the Umayyad Caliphs. In 657 CE, Mu'awiyah fought Ali to a bitter standstill in the great Battle of Siffin, a key moment in the dissolution of Islamic unity. The arbitration following the indecisive battle spelled the beginning of the end for the Rashidun Caliphate. Following Ali's assassination by a Kharijite, Mu'awiyah became Caliph and ruled over much of the Islamic world from Damascus. In 670 CE, Alexandros XVI entreated him to attack Persia, wishing to see him humbled in the process, but his plan backfired as Mu'awiyah conquered Ctesiphon and expelled the Persians from Mesopotamia. Alexandros famously proclaimed: 'Never trust a Persian to do your business.' The later years of his rule saw the Great Fragmentation of Islam and the collapse of any form of central authority. He was assassinated in 680 CE, his death causing further Islamic disunity. In 750 CE, Umayyad power in the East collapsed entirely following their defeat in the Battle of the Zab by the new Abbasid Caliph. The Umayyad Caliph Marwan II barely managed to flee to Damascus and retain rule over the city and its environs. In 755 CE, the Umayyad Abd-ar-Rahman went to Hispania, thus inaugurating the Great Umayyad adventure in the West, culminating in the establishment of the Caliphate of Cordoba. The Umayyads went on to become great patrons of 'Ilm, their realms renowned for their tolerance, scientific advances, and patronage of art. The Umayyads might have lost their former glory, but as patrons of the Light of Knowledge in a world of Darkness, they hold out hope for the day where they take back what is rightfully theirs. Perhaps, a day will come when 'Ilm will be the guiding principle of Islam once more, and the Umayyad Caliphs will once more guide the the prayers of the faithful, from Mecca to Cordoba and beyond!"
trait_bloodline_calgacus: "Blood of Calgacus"
trait_bloodline_calgacus_desc: "Calgacus, High King of the Caledoni, is a legend among his people. The Great King achieved the impossible - he united the disparate tribes of the North, to fight a common enemy - Rome. Even Tacitus acknowledged him as 'the most distinguished and valorous of the chieftains'. His speech before the Battle of Mons Graupius became part of the mythology of the Peoples of the North. He spoke to them thus: 'Here at the very end of the Earth, slavery is a thing unknown, and we would do well to die as free men rather than be the slaves of Rome.' He famously finished his discourse by declaring that 'the Romans make a desert and call it peace', a saying that has echoed through the ages. Calgacus died that day with iron in his hands, preferring honorable death to slavery. The Peoples of the North and his descendants remember his example to this very day, and they remain unbent and unbroken, the true Free People on the Edge of the World!"
trait_bloodline_theodemir: "Blood of Theodemir"
trait_bloodline_theodemir_desc: "The Amali High King Theodemir was the father of Theodoric the Great, and sire of several long lines of Kings. The blood of Theodemir ruled many kingdoms from the Balkans to Hispania, and found its way into many dynasties on the maternal line. While Theodoric went West, several branches of the family remained in the east. The blood of Theodemir retained the High Kingship of the Balkan Ostrogoths, and in 504 CE Leo II created the Kingdom of Dioclea for his Ostrogothic clients. The Kingdom of Dioclea became the primary Ostrogothic recruiting ground for the Empire, and these Eastern Goths found themselves fighting under the imperial banner in battlefields from Hispania to Persia. Their proud warrior culture and excellence in the art of battle saw them settled as military colonists throughout the Eastern Empire wherever a Gothic sword was needed. The Blood of Theodemir retain the martial spirit of their ancestors, unconquered in their strongholds on the Adriatic Sea. The Theodemirings serve the Empire no longer, and are now free to find their own glory! They still remember the Great High Kings of Old, and know that Rome was once humbled by the Goths, and it can be so again. Their will is iron, their resolve steel, and their ambition unending!"
trait_bloodline_hengist: "Blood of Hengist"
trait_bloodline_hengist_desc: "Hengist was a 5th century Saxon warlord, one of the leaders of the Germanic invasion of Britannia, and eventually the first King of the British Saxons. He is widely considered to be the 'Father of the Country' by the Saxons of the Island, and all Saxon kings without fail trace their lineage to him in some manner. While Hengist could not acquire much land from the Brythons, barely holding dominion over what would later become Kent, he remained infamous for the 'Brad y Cyllyll Hirion' - the Treachery of the Long Knives. At a famous council meeting, Hengist had several British sub-kings and lords treacherously murdered, after his supposedly unarmed Saxons hid knives in their shoes. In spite of his treacherous ways, Hengist reigned undisputed in southeastern England, and Britannia was changed forever. His bloodline would go on to sire a great many Kings, both saintly and murderous, but none without ambition, for it burns within their very blood!"
trait_bloodline_aelle: "Blood of Aelle"
trait_bloodline_aelle_desc: "Aelle was the first King of the South Saxons. In 478 CE, Aelle established his dominion over Suþseaxna, and went on to be acknowledged as High King by the Saxons of Britannia. Aelle alternated between a policy of war and diplomacy towards the Brythons, which would ultimately prove disastrous. In 515 CE, Aelle was captured by an Artorian contingent of Sarmatian cavalry and used for target practice. His body, pierced by countless arrows, was left to rot for days before it was recovered by his Saxon followers. His descendants, the Aellings, remain one of the most prestigious royal families of the Saxons to this day. His bloodline, ever rooted in Suþseaxna, provided the British Saxons with several more High Kings after their forebear. While their power is much diminished, a worthy heir of Aelle could still rise once more to the High Kingship, and God willing, avenge his ancestor by repaying the Sarmatians for the ancient murder of their sire!"
trait_bloodline_aescwine: "Blood of Aescwine"
trait_bloodline_aescwine_desc: "Aescwine was the first King of the East Saxons. In 527 CE, Aescwine established his dominion over what would become Eastseaxe, one of the traditional kingdoms of the Saxons. Aescwine held dominion over his people, partly on behalf of his illustrious lineage, for he claimed direct descent from Seaxneat, the ancient Forefather, King, and God of the Saxons. Claiming senior right of blood over the rest of the Kings of the Saxons, his descendants often vied for the title of Bretwalda, and often met with success in their endeavors. Known for their diplomatic prowess, the crafty heirs of Aescwine proved worthy of their forefather. Yet in spite of all their guile and power, their dominion dwindled, for a wave of new conquerors evicted them from much of their lands. The Norse now reign in their ancient capital of Londinium, and this is the blood of Aescwine can not tolerate! A King of their blood must set this wrong to rights, and return the most holy and ancient Blood of the Saxons to their rightful seat!"
trait_bloodline_raedwald: "Blood of Raedwald"
trait_bloodline_raedwald_desc: "Raedwald was the great King of East Anglia. Raedwald was the first sovereign to be called 'High King of the Angles' rather than the Saxons, after proclaiming himself High King of Eastern Britannia in 599 CE. His ambition to unite all Britannia under one king collapsed following the Battle of Wantage in 603 CE. Defeated by Riothamus II Artorius, the High King of the Brythons, the two acknowledged each other as High Kings, one ruling over the West, the other over the East. Yet Raedwald's conversion to Christianity would have disastrous consequences in terms of his power over the Saxons. In 610 CE, Oswald of Northumbria proclaimed himself High King of the Saxons, and Raedwald was forced to fight an indecisive war that cost his sovereignty over the North. Raedwald's descendants stubbornly cling to power in East Anglia, and his blood is often blamed by many to this very day for bringing about the division of the Saxon High Kingship and the rise of the High Kingdom of the North. The Raedwaldings remain a powerful, yet embittered dynasty, still clinging to their dream of reuniting the Saxon lands and expelling all invaders from their ancestral High Kingdom."
trait_bloodline_oswald: "Blood of Oswald"
trait_bloodline_oswald_desc: "Oswald the Great was the Divine Ruler and King of Northumbria, as well as a man of great ambition. His claim of being the Son of God, his unequaled charisma, and his merging of Christian and pagan beliefs into a powerful royal cult turned many nobles to his cause. His campaigns brought the North under his rule, and in 610 CE Oswald proclaimed himself Bretwalda, fighting Raedwald of East Anglia to a standstill over the High Kingship. This war would prove to be the beginning of the end for the unity of the High Kingdom of the Saxons. Widely acknowledged as the Divine Ruler of the North, Oswald became Bretwalda in truth in 632 CE. Following his death, his body remained uncorrupt. With his divinity proven, Oswald's remains became the focus of an important Saxon cult, his descendants later carrying his invincible right hand into battle as a relic guaranteeing victory. In 650 CE, the split between the South and North would become permanent, as his descendant Oswiu of Northanhymbra, supported by the Sarmato-Brython High King Riothamus III Artorius, proclaimed himself High King of the North, thus splitting Saxon dominions in half and creating the long lasting status-quo of the Three Kingdoms in Britannia. The Divine Blood of the Oswaldings is seen by many to this very day as the rightful Ruling Blood of the North, and the heirs of Oswald still carry their ancestor's guiding hand into glorious battle, dreaming that they might one day reestablish their rightful dominion over the North and beyond!"
trait_bloodline_offa: "Blood of Offa"
trait_bloodline_offa_desc: "Offa the Good was King of Mercia. With his kingdom bordering the Brython lands, Offa decided to ally himself with his western neighbors, and in 757 CE he married the Artorian princess Axyra. The Offaning line thus became to be known by many as the 'Saxon Artorii'. Following an elaborate diplomatic policy, Offa of Mercia become Bretwalda of the Saxons in 765 CE. He would rule in peace, establishing good relations with the High Kings of Brythonia and Northanhymbra. Mostly concerning himself with internal affairs, Offa established a great system of burghs within his realm, while his monetary policies saw his coins being used in international commerce, his golden face making its way as far east as the Abbasid Caliphate! Offa the Good was ultimately assassinated by his own son Ecgfrith, who would come to lose the High Kingship and his life on account of his later proven patricide. The Offanings rule over Mercia to this day. Accused by some to be more Brython than Saxon, the Kings of Mercia have intermarried into the Brython noble families and are seen by many to be more Artorii than anything else. Yet it is these ties with outsiders that have given them a unique edge in administrative and diplomatic skills, and many believe that an Offaning High King might one day bring back the prosperity of old to Britannia."
trait_bloodline_urien: "Blood of Urien"
trait_bloodline_urien_desc: "Urien Rheged was King of Rheged and Sovereign Lord of the Hen Ogledd. One of the legendary warleaders of the Brythons, Urien of Rheged imposed his authority over the Old North and was acknowledged as High King by the Brythons of the Hen Ogledd. Invincible in battle and widely respected by the Brythons, Urien married the Artorian princess Morgana, and together they would sire a long line of kings. Morgana would later kill her husband and rule as Queen in her own right over Rheged and the Men of the North. While it is said that the Saxons of the South are steel, the Men of the North are stone. Unconquered and unbreakable, the Kings of Rheged seek to restore their dominion over the Hen Ogledd and banish the Norse and the Saxons into the sea. With the Blood of Urien and Artorius in their veins, the true Kings of the North are prophesied to regain their High Kingship and bring the dominion of the Gwyr y Gogledd - the Men of the North - over all of the great Islands of the West!"
trait_bloodline_maelgwn: "Blood of Maelgwn"
trait_bloodline_maelgwn_desc: "Maelgwn ap Cadwallon was King of Gwynedd and High King of the Brythons. Maelgwn remains a legendary character among the Brythons, partly thanks to Taliesin the Bard, his son-in-law and court bard. Immortalized in the great songs of the Brythons, Maelgwn is widely remembered as the High Dragon of the North, and Great King of the Hen Ogledd. An Artorian and Constantinid on the maternal lines, Maelgwn was one of the chief supporters of Christianity in Brythonia. His support of Christianity turned the pagan Brythons against him, and the Dragon of the Island found his death at the hand of the pagan priesthood, burned alive as a sacrifice to the old gods. His descendants turned Gwynedd into a bastion of Christianity, while still allowing the druids of Ynis Mon their traditional rights over the Island. The Kings of Gwynedd might not be considered a great power among the Kings of the Island, but their strongholds remain impregnable, from this position of strength they can safely plot the downfall of their many enemies!"
trait_bloodline_mathrafal: "Blood of Rhodri"
trait_bloodline_mathrafal_desc: "Rhodri ap Mawr, better known as Rhodri the Great, was King of Powys and High King of the Brythons. An Artorian of the royal line of Powys, Rhodri proved worthy of his blood, winning many famous battles over the Viking invaders. He was rewarded for his victories, and the sacrifice of one hundred of one Norse prisoners to a Sword of Victory in the ancient Artorian fashion, by being elected High King of the Brythons. Ever impulsive and fearless, Rhodri died in battle charging a Norse shieldwall alone, with his troops refusing to fight a greatly superior enemy. His death would inspire his army to victory, and the name of Rhodri the Great has become a rallying cry against every Norse invasion since. His senior bloodline rule over Powys, from the ancient seat of their power, the great stronghold of Mathrafal, seat of the High Kings of Old. They remain unconquerable, and true to their ancestor's blood, they bow to no man, no matter his power or earthly glory!"
trait_bloodline_artgal: "Blood of Artgal"
trait_bloodline_artgal_desc: "Artgal of Alt Clut was King of Ystrad Clud and High King of the Hen Ogledd. Known by the Brythons as the Great Artorius of the North, Artgal of Alt Clut ruled over a vast kingdom centered around his great fortress of Dun Breatainn, the oldest stronghold still standing in all of the Islands! His endless wars against the Picts ruined his kingdom, and while the Picts could not overcome him, the great fortress of Dun Breatainn fell after a great siege by the Norse. The Brythons withstood the invaders for four months, but in the end the wells of the castle dried out. Rather than surrender, the Great King Artgal and his followers died of thirst, defiance on their lips to the very bitter end. His bloodline survived this trial and remain to this day the proudest of Kings, ruling over the northern bastion of the Brythons, the Kingdom of Ystrad Clud. These proud Artorii of the North have proved their mettle time and time again, and none can deny that, given the right circumstances, they might once more rise to rule the Old North. Woe to their enemies! The Kings of Ystrad Clud know not the meaning of defeat!"
trait_bloodline_samo: "Blood of Samo"
trait_bloodline_samo_desc: "Samo the Great was the First High King and Emperor of the Western Slavs. Samo was not a Slav, but a merchant of Frankish descent. As a supplier of weapons to the Slavs, and as a result of his great personal charisma, Samo came to be elected as High King by the Slavs of Moravia and Slovakia in their attempt to unite against the Avars. Samo increased his authority over the Western Slavic lands by marrying the daughters of many Slavic princes. He had over twelve wives and fathered twenty two legitimate sons and fifteen daughters by his wives. His progeny by concubines or lovers is myriad! This true father of Western Slavic royalty united the Western Slavs into their own primitive version of an Empire, a great state that would later come to be called Great Moravia. Humbling all who would oppose him, from the Avars to the Germans and the Franks, Samo crowned himself Emperor in imitation of the Romans, and proved to be an inspiration for many later Slavic monarchs. In truth, most descend from him, if only on the maternal side. His descendants, however, squandered his legacy and lost their 'empire', and thus turned to the worship of Veles in their great bitterness. The Samonids of Nitra are greatly feared by their enemies, for they know neither mercy nor restraint! Even their Ahriman-worshipping Avar neighbors know that to anger their northern foe is something not to be done lightly, for the Samonids are more than glad to sacrifice their beaten enemies to their cruel god, ever beseeching him to grant their return to the great glory of old! Their enemies should beware, for the Blood of Samo can never be extinguished!"
trait_bloodline_cerdic: "Blood of Cerdic"
trait_bloodline_cerdic_desc: "Cerdic was the first King of the West Saxons. The establishment of Wessex started in 495 CE when Cerdic and his son Cynric began to slowly drive out the Brythons from the area that would later become the most famous of the Saxon kingdoms. Claiming descent from Woden himself, the Cerdicing kings of Wessex remained staunchly pagan, refusing to convert to Christianity. While the Cerdicings consider themselves to be the rightful Bretwaldas of the Saxons, their power has waxed and waned through the ages. Many consider Alfred, Bretwalda of the Saxons, to be the greatest of Cerdic's line. His victory in 878 CE over Guthrum, King of the Danelaw, at the Battle of Ethandun put an effective end to the expansion of the Danes into Western Britannia. A less fondly remembered Cerdicing is Edward the Martyr, the sole Christian King of Wessex. His repeated attempts at converting his subjects failed miserably and earned him his death in 978 CE, when he was assassinated by his brother the pagan Aethelred, a deed met with great approval by the people. The West Saxons know that they are ruled by the Blood of Woden, and they would never tolerate such blasphemy! The Cerdicings of Wessex remember their divine heritage, and upon their ascension as Kings of the West Saxons are required to swear an oath to drive the Christians into the sea. While many Kings have failed this oath so far, who is to say that a future King of Wessex might not succeed where the others have failed?"
trait_bloodline_wisimar: "Blood of Wisimar"
trait_bloodline_wisimar_desc: "Wisimar was one of the great High Kings of the Hasdingi Vandals. The blood of Wisimar provided many Vandal kings throughout history and continues to do so to this day. In 550 CE Gaiseric, a Vandal prince in control of territories on both sides of the Pillars of Hercules, submitted to Belisarius and was confirmed as the first Vandal client King of Tingis. The powerful Vandal Kingdom of Tingis proved to be an effective barrier against the expansion of Islam until 700 CE, when Godigisel II of Tingis assassinated his father and converted to Islam, in order to receive the support of Musa bin Nusair and his Islamic army. The Wisimarid Kings of Tingis were thus directly responsible for opening the way to the expansion of Islam into Hispania. Their control over the Pillars of Hercules, as well as their powerful fleet, mark the Wisimarids of Tingis as one of the greatest commercial powers of the Mediterranean. The blood of Wisimar hold the other Vandal princes in contempt, considering even the Kings of Carthage to be beneath them in their estimation. From their great stronghold of Tingis, the Wisimarids plan to expand their dominion over the Mediterranean and beyond, for they know full well that their invincible fleet can bring them the glory they so richly deserve!"
trait_bloodline_gabran: "Blood of Gabrán"
trait_bloodline_gabran_desc: "Gabrán mac Domangairt was King of Dál Riata. The blood of Gabrán ruled over the great Gaelic Kingdom of Dál Riata from the 6th century on. Several of the Kings of Dál Riata were accepted as High Kings of Alba and ruled over the entire northern coast of the Island, if only in name. The greatest king of Gabráin's line, Áedán mac Gabráin, tried to unify Alba, Hibernia and the Hen Ogledd into one great Northern State. His initial efforts bore fruit, as he came to dominate vast lands from Northern Hibernia to Ystrad Clud. In 603 CE, at the Battle of Degsastan, the self-proclaimed High King of all the North met with defeat against a coalition of the southern lords. Áedán, refusing to abandon his dream, died on the battlefield. It is said that he suffered no less than thirty three wounds before meeting his final end. While the power of the Gabrains was broken, their dream was not. The Kings of Dál Riata might seem like nothing more than petty kings to some, but their ancestor's sacred dream of a united North is nothing of the sort! As long as the Blood of Gabrán still flows in their veins, their dream is not dead, only dormant, ready to return in glory once the right King ascends their ancient throne!"
trait_bloodline_findlaech: "Blood of Findláech"
trait_bloodline_findlaech_desc: "Findláech mac Ruaidrí was King of Moray and Fortriu. Findláech, King of Moray, ascended to become King of Fortriu, and after several campaigns throughout the North he was acknowledged as High King of Alba. His rule was short, and he died at the hands of his own son Mac Bethad, Ri Deircc - the Red King. Mac Bethad would in turn become High King of Alba after assassinating all those who would oppose him. Widely accused of using witchcraft in order to further his ambitions, Mac Bethad openly took the title of 'The Witch King of Fortriu'. Several lesser kings are said to have died as a result of his witchery, and even Duncan, the King of Alba is said to have succumbed to his unholy powers. True to his blood, his son Mac Bethad II assassinated his own father, also taking to the title of 'Witch King' with relish. While the Blood of Findláech might have lost the High Kingship, their terrible reputation and fearful powers might very well help restore them to their rightful throne. Their enemies know that to defy them is to court death, for the evils the Blood of Findláech can unleash upon their enemies are legion!"
trait_bloodline_britconstantine: "Blood of Constantine of Britannia"
trait_bloodline_britconstantine_desc: "Constantine the Great of Britannia, Slayer of Emperors, was the living will of Sol Christus, come to dethrone the false servants of the one true Solar God and cleanse this world of sin. Son of the Western Emperor Constantine I and the Julio-Argead princess Helena, Constantine was passed over for succession by his father in favor of Maxentius II, and made hereditary military governor of Dumnonia. Refusing to be relegated to an imperial backwater, Constantine of Britannia rose in rebellion against his father in 330 CE. His inexorable march on the Eternal City and his sacrifice of no less than four Emperors, including his father, to the Sword of Victory earned him his title. Likewise, his undefeated record on the battlefield cemented his status as a living god in the eyes of his followers, who reveled in glory as they burned and slaughtered their way to the city of Rome. His seizure of the capital in 352 CE was met by a subservient Senate who hastened to proclaim him Emperor, Master, and God, and a populace trembling in rightful terror and reverence. Yet the great triumph that was to be his rule was cut short by the treachery of the Artorii, his most trusted disciples, precipitating the fall of Rome to the forces of Alexandros VIII mere months later. It was before the Sacred Heart of Sol that Constantine was sacrificed to his own Sword, and his blood blessed its holy blade. Although granted mercy by the Emperor Valentinian, and forced to kneel for a time, his descendants have never forgotten the greatness of their divine forebear. Nor their duty to the Sword of Victory. An instrument sent from the heavens whose true power can only be wielded by Sol Christus in the Flesh, it grows stronger with every life given to it, and stronger still by the blood of kings and emperors. The Blood of the Slayer of Emperors shall yet seize the Empire that was their Sol-given birthright, and cast every traitor and heretic from Caledonia to Ctesiphon onto the blade screaming for a mercy that will never come!"
trait_bloodline_ivar: "Blood of Ivar"
trait_bloodline_ivar_desc: "Ivar the Boneless, son of Ragnar Lodbrok and the Scourge of the Islands, was one of the leaders of the Norse attacks in Britannia in the middle of the 9th century CE. Ivar campaigned throughout the Islands, humbling many lords, from the petty Kings of Hibernia to great Kings such as Aella the High King of Northanhymbra. His legendary cruelty saw many captured Kings blood-eagled - their ribs cut off by the spine, then broken on their back, so as to resemble blood-stained wings, their lungs pulled out through the wounds in their back - in order to subdue the rest. The pale skinned Ivar became a figure of great dread and his strange sickness made many whisper of his unnatural condition. It is said that his very bones melted in the end, yet his body would not decay. While some believe that his uncorrupt body was burned in a great pyre, others believe that Ivar was sent to the bottom of the sea, and will one day rise up again to terrorize all of the Islands! His Blood remains strong, and many kings, from Bernicia to the Isles to Dubhlin, hail Ivar as their legendary sire. They all know that their Blood carries great power, and they hear the whispers of their great ancestor! None of the Ivarrings believe him to be gone forever, and all await his return from the Sea! Woe to the Lands of Man, when Ivar the Boneless will come again!"
trait_bloodline_fergus: "Blood of Fergus"
trait_bloodline_fergus_desc: "Fergus Mor is the legendary progenitor of the Gabrains of Dal Riata. The eastern line of the Gabrains centered their power around their great stronghold of Dun Chailleann, later called Dunkeld. While their western relatives claim to be the senior line of the family, the eastern Gabrains care little for this claim. Their power is greater, and the number of swords they command can do the talking for them! These Gabrains of Dun Chailleann, as they have come to be called, have held the High Kingship of Alba more times than the western line in recent times, and can safely claim to be the strongest descendants of the Blood of Fergus! While their power has diminished of late, the true Kings of Alba have the resources to humble all of the North, including their wayward western cousins!"
trait_bloodline_guthrum: "Blood of Guthrum"
trait_bloodline_guthrum_desc: "Guthrum was the first King of the Danelaw. Guthrum's dream of a great kingdom of Daneland began by forcing the lesser Danish Lords of the eastern coast into submission. By 874 CE, he had consolidated his power over much of the Danelaw and declared himself as High King of the Danes in England. His campaigns of conquest took him further and further afield, till finally he met the host of Wessex. In 878 CE at the Battle of Ethandun, Alfred of Wessex defeated Guthrum in a contest that would become the inspiration of many a song. While Alfred defeated Guthrum, his power was by no means broken, and a treaty was signed between the Danes and the Saxons, with the Great King of the Danelaw holding on to his eastern dominions. Guthrum's later conversion to Christianity was a calculated move aimed at securing his possessions, a move which proved highly prescient, as the Christian Saxon kings surrounding his lands could stomach a Christian Danish kingdom easier than a pagan one. His blood still rule over the great Kingdom of Daneland, although they have yet to imitate their great ancestor. While their glory might only be heard in song, they are ever ready to grasp it once more!"
trait_bloodline_halfdan: "Blood of Halfdan"
trait_bloodline_halfdan_desc: "Halfdan Ragnarsson was the great Norse King of Jorvik. The lesser known son of Ragnar Lodbrok, Halfdan was one of the commanders of the Great Heathen Army that ravaged the British Isles in the 9th century CE. While his brothers hogged the glory, Halfdan saw to his conquests. He humbled many Saxon Kings, including Alfred in the great Battle of Reading. His rule had many ups and downs and saw him in control of many great cities, including Londinium, before losing them to his many enemies. Widely feared for his cruelty, and reportedly putting even his brother Ivar to shame on that account, Halfdan ultimately lost his many domains, and was ultimately left with Jorvik alone. His blood have maintained this great Norse Kingdom ever since, and to this day remain the terror of the Isles. Their Raven Banners set fear in the hearts of their enemies, for all who oppose them know that when the Ravens come calling, the Blood Eagles spread throughout the Land!"
trait_bloodline_sweyn: "Blood of Sweyn"
trait_bloodline_sweyn_desc: "Sweyn Forkbeard was High King of the Danes and High King of Anglia. In 986 CE, Sweyn secured the High Kingship of the Danes and went on to increase his dominions further afield, from Norway to the Isles of the West! In 1003 CE, Sweyn led the largest Norse invasion force Britannia had ever seen in an attempt to overwhelm all resistance. King after King swore fealty to the new Danish High King, and in 1005 CE he was acknowledged as the uncontested High King of the Saxons and the Norse of Britannia. In 1007 CE, his western advances were checked at the Battle of Glevum, where Brennius Pendragon, High King of the Brythons, soundly defeated his great Norse army. The following peace confirmed Sweyn as Overlord of the Saxons and of the Norse, while abandoning all claims on the Brython lands. Sweyn died in 1015 CE, and his realm was plunged into a great civil war, with several Kings vying for the High Kingship. His son Knut would eventually emerge victorious. Knut the Great would prove an even greater ruler than his father. Having served in the Varangian Guard in Constantinople in his youth, Knut returned home with great ambitions of Empire. In imitation of the Romans, he adopted Sunna, the Norse sun goddess, as a patron of his realm. He would go on to establish his dominion not only over the Norse and Saxons of Britannia, but over Denmark, Sweden and Norway as well. The Great Sun Emperor of the North built his great state of Miklaríki, stretching from the Baltic to Iceland! His great Realm proved to be ephemeral, for upon Knut's death his Empire collapsed into chaos and anarchy. His descendants might rule many realms, yet all remain but shadows of their great ancestor. Will the blood of Sweyn rebuild its Great Empire of the North, or will Miklaríki remain but a half-remembered dream? Only time will tell."
trait_bloodline_rognvald: "Blood of Rognvald"
trait_bloodline_rognvald_desc: "Rognvald Eysteinsson, also known as Rognvald the Wise, was the first Jarl of Orkney. A favored companion of the great Norse King Harald Fairhair, he went on many viking expeditions, from the Volga to the Mediterranean. After having achieved great riches during his many travels, Rognvald returned to the North, desiring to establish a realm of his own. He set his sights on Orkney, and with the help of his Viking companions the islands were soon his. The Jarls of Orkney hold themselves to be kings in their own lands, and have for many years coveted the title of Kings of the North. Their attempts at subduing the Picts and Scots invariably failed, yet the Great Jarls of Orkney remain the unquestioned power of the Eastern Isles. While many of the Jarls of Orkney seem more concerned with plunder than expansion, they still yearn for dominion over the Northern Lands, and the true Blood of Rognvald know that only riches earned from great plunder can bring them the power they need to subdue their errant neighbors!"
trait_bloodline_zenobia: "Blood of Zenobia"
trait_bloodline_zenobia_desc: "Zenobia was Warrior Queen of Palmyra, and Queen Regent of the Palmyrene Empire. After her husband Odaenathus was assassinated in 267 CE, Zenobia took control as Queen of Palmyra as regent for her infant son Vaballathus, and expanded the Palmyran Empire by Egypt to the south in 269 CE and Ancyra in Asia Minor to the north in 272 CE, but these gains were lost to Roman emperor Alexandros V by 275 CE. By the peace treaty, she retained the title Empress of Palmyra, but renounced control of all territory outside Palmyra proper. While leading her troops, she displayed significant prowess. She was an able horse rider, and would march miles alongside her soldiers."
trait_bloodline_warcislaw: "Blood of Warcislaw"
trait_bloodline_warcislaw_desc: "Lech was the eldest of the three Slavic brothers from the 5th century CE, and legendary progenitor of the Polish people. Leading a loose tribal confederation, Lech and his brothers Cech and Rus conquered the lands between the Dnieper and Elbe, forcing out or assimilating their former Gothic inhabitants. Soon after Lech had established his seat of power in Gniezno, the confederation splintered, giving birth to three great Slavic peoples - the Poles, the Czechs and the Russians. Lech and his sons led huge expeditions into German lands in 496, 512 and 518 CE, reaching as far as the Atlantic Ocean according to legend. In 578 CE, Warcislaw of Pomerania conducted a devastating raid into Scandinavia, plundering Bornholm, southern Skane and Sjaelland in his wake. Though the divided Slavs are now merely a shade of their former strength, many warlords are likely to follow a strong, charismatic leader, should one appear. And who would be a better leader than a scion of Lech himself?"
trait_bloodline_krak: "Blood of Krak"
trait_bloodline_krak_desc: "Prince Krak, the founder of Kraków, was the leader of the Vistulans in the 7th century CE. According to a popular legend, he and his two sons defeated a mighty dragon living beneath hill Wawel, thus earning the nickname 'Dragonslayers'. Under the reign of Krak's dynasty, Kraków became a wealthy trade hub, arguably the richest Slavic town north of the Carpathians. In 986 CE, Prince Krak IV defeated the Piast incursion, killing Prince Mieszko in personal combat. In 987 CE, a combined Małopolski-Silesian force managed to rout an invasion by the Czech prince Boleslav II, securing their independence from foreign invaders for a time. But can the 'City of the Dragonslayer' preserve its independence against the surrounding foes forever?"
trait_bloodline_piast: "Blood of Piast"
trait_bloodline_piast_desc: "Piast the Wheelwright was a peasant who led a popular uprising against the tyrant Prince Popiel of Goplans in 828 CE. Made Prince by popular acclamation, Piast personally commanded the assault on Popiel's island fortress on Lake Goplo and slew the tyrant in personal combat, taking the old Lechitic stronghold of Gniezno as his capital. Under Piast's rule, the Polans began an ambitious attempt to restore the legendary realm of Lech. This dream was brought to an unfortunate end in 986 CE, when Prince Mieszko was killed in the Battle of Kraków by Prince Krak IV. The tribes already subjugated by the Polans - the Kuyavians and Silesians - have rebelled, restoring their independence. Yet the dream of a united Poland is not so easily forgotten."
trait_bloodline_cech: "Blood of Cech"
trait_bloodline_cech_desc: "Cech was one of three Slavic brothers who led the conquest of the Gothic lands between the Dnieper and Elbe in the second half of the 5th century CE. After the confederation's breakup, Cech and his tribes crossed the Sudetes, eventually founding the city of Praha on the banks of Vltava river. From his new seat of power, Cech conducted expeditions against the Hungarians, Avars and Germans, until his death in 522 CE. His son Nezamysl led an ambitious incursion into Roman lands in 552 CE, reaching the banks of the Mediterranean. Later on, his scions became engulfed in internal conflicts, ultimately being subjugated by the Moravians in the 9th century, but the breakup of Great Moravia in the 10th century gave Premysl the Pluoghman, a distant descendant of Cech, a chance to oust the Moravian occupiers and establish a new realm of his own. Although Czech expansion was halted in 987 CE, the blood of Cech remains the most vibrant and fearsome force of the southern Slavs... "
trait_bloodline_rus: "Blood of Rus"
trait_bloodline_rus_desc: "Rus was the youngest of three brothers who lead the conquest of Gothic lands in the 5th century CE. After the breakup of the Slavic tribal confederation, Rus turned his sights to the eastern steppe, taking up lands between the Bug and Dnieper rivers. After his death in 541 CE, his oldest son Vladislav crossed the Dnieper and attempted to conquer all the lands up to Volga, while the younger Rus lead his tribes against the Cimmerian Bosporus and the Crimean Goths, although he was repelled in a great battle on the banks of Tanais. Rus' descendants established numerous smaller states, feuding with the surrounding Baltic, Ugro-Finnic and Altaic tribes, as well as with one another. Upon his arrival in 864 CE, Rurik and the Varangians twisted the internal strife and political splintering to their advantage, ousting Rus' descendants and replacing them with Varangian nobility. Unwilling to accept Nordic overlords, a group of nobles led by Sviatoslav III retreated west, entrenching themselves along the Danastris river. The blood of Rus shall need both time and luck to regain what has been lost...Or else disappear, suffering themselves merely to being the latest in a long list of vanquished steppe peoples."
trait_bloodline_attila: "Blood of Attila"
trait_bloodline_attila_desc: "Following the death of his brother and co-ruler Bleda, Attila took sole rulership of the Hunnic Empire, whose domain stretched from the Eastern Steppe to the Black Forest at its height. In 450 CE, Valentinian IV's daughter begged Attila to rescue her from an arranged marriage to the Romano-Gothic Areobindus. Declaring the Western Empire would be his dowry, Attila invaded Europe a year later, resulting in the death of Valentinian IV himself. With the Western Empire stunned and terrified, Attila went on to sack many vital Roman towns until Flavius Aetius mustered a grand coalition to confront Attila at the Battle of the Catalaunian Plains. Following the shocking defeat of Attila and his retreat to back to Pannonia, he began his plans to invade Italia. However, his plans did not come to fruition, as he died during the consummation of his marriage to the Gothic princess Ildica. Because of this, and the surprise defeat at the Catalaunian Plains, the Germanic vassals of Attila revolted and claimed their own portions of the crumbling empire. Amidst the chaos, Attila's sons Ellac, Dengizich, and Ernakh fought for the remains of their father's empire. Diminished, scattered, and damned to languish at the forgotten periphery of their former subjects for centuries, the descendants of mighty Attila rule but a fraction of his vast realm. Yet the constant, unending struggle has honed their spirits, and the arrival of new blood on the Steppe brings forth a call from within. To ride West, as their forefather did, and to fill the air with smoke and blood."
trait_bloodline_diocletian: "Blood of Diocletian"
trait_bloodline_diocletian_desc: "Gaius Aurelius Valerius Diocletianus, better known as Diocletian, reigned as co-emperor beside Alexandros VI. Diocletian fought alongside Alexandros in the East, and led his own invasion of Gallia. Following Alexandros' capture and blinding by the treacherous Antonius Ptolemy, Diocletian rushed to the aid of his co-emperor and defeated the Egyptians at the legendary Siege of Alexandria. Diocletian and Alexandros continued to campaign in the East until the latter's disappearance and assumed death. Exactly a year later, Diocletian died in his palace in Split. Now his scions are but a fraction of their former glory, surrounded by the newly arrived barbaric Slavs. Will they dredge themselves up out of the mire they currently find themselves in?"
trait_bloodline_valentinian: "Blood of Valentinian"
trait_bloodline_valentinian_desc: "Flavius Valentinianus reigned as co-emperor alongside Julian II and Alexandros VIII, before becoming the Western Roman Emperor. Early in his career, Valentinian was delivered a surprise victory over Constantine II of Britannia, which he attributed to divine intervention and prompted him to convert to Christianity. Emboldened by his victories in Britannia, Valentinian decided to split the empire in two: he and his brother Valens ruling in the West, whilst Julian and Alexandros ruled in the East. The rising persecution of Christians in the Eastern Empire enraged Valentinian, and saw him to forge an alliance with Shapur II of the Persian Empire, who then proceeded to invade the East. After a failed siege at Constantinople, Valentinian met Julian in battle again, this time outside Athens. It was here that Valentinian fell in combat against his former friend. His descendants continue to hold on to the throne of the Western Empire despite many interruptions, yet now their authority extends scarcely further than the city of Rome itself. Will the family of Valentinianus restore the Western Empire to its former extent? Or will their star rise ever higher to unite the fractured Empire?"
trait_bloodline_aurelius: "Blood of Aurelius"
trait_bloodline_aurelius_desc: "Marcus Aurelius reigned as co-emperor alongside Antoninus Pius and then Lucius Verus. It was during his reign that the first widespread persecutions against Christians began. It was also during Marcus Aurelius' reign when the border provinces of the Empire were re-purposed into military frontiers, in order to protect against the recent barbarian incursions. Following Aurelius' death, his son Commodus succeeded him as emperor and formalized the cults of Sol Invictus and Mithras. Now, the descendants of Aurelius reign in Venetia, in the precarious position of being caught between Germanic barbarians and ambitious fellow Romans. Will they find the strength to seize the throne of the Roman Empire once more?"
trait_bloodline_augustus: "Blood of Augustus"
trait_bloodline_augustus_desc: "Octavian, better known as Augustus Caesar, was the first emperor of Rome. Following the assassination of Caesar, Octavian fought against Marcus Antonius in the second major Roman Civil War. They soon reconciled however, and fought to restore order in the Republic's eastern provinces. In 41 BCE, Marcus Antonius was seduced by Cleopatra VII and hatched his plan to become Megas Basileus of the East. In response to this treachery, Octavian gathered his Seleukid and Nabatean allies and defeated Marcus Antonius' forces in Egypt, driving the traitor to commit suicide. With order restored, Octavian was granted the cognomen Augustus. In 27 BCE he married Alexandra Argead, a descendant of Megas Alexandros himself. Just four years later, Augustus was proclaimed as the first Princeps of the new Roman Empire. Until his death in 14 CE, Augustus fought tirelessly to keep the borders of the Empire intact against various barbarians and the rebellion of the Ptolemaioi in Egypt. He was succeeded by his son Alexandros, who struggled for decades against increasing barbarian raids and the rise of Parthia in the East. The Julio-Argead dynasty that Augustus built has been perhaps the most enduring element of Imperial rule, producing many of Rome's greatest emperors for a millennium bearing the mighty name of Alexandros, from Alexandros II Helios, to Alexandros VI the Blind, to Alexandros XV the Martyr. Although the scions of Augustus do not currently hold the throne of their much weakened Empire, it is within their grasp. Will they do what is necessary to take claim their birthright?"
trait_bloodline_popiel: "Blood of Popiel"
trait_bloodline_popiel_desc: "Popiel was Prince of the Goplans. Once hegemon of northern Poland, Popiel's realm was shattered in 828 CE when Piast the Wheelwright led a popular uprising against his tyrannical rule. After Popiel was slain by Piast in his island hold on Lake Goplo, his only son Gniewomir fled east, ultimately finding refuge on the east bank of Vistula. The restored Popielid principality, led by Popiel's grandson Lech, campaigned against Piast prince Lestek in 889 CE, reestablishing control over the lands of Kuyavia. Thus the rising star of the Piasts was counterbalanced for a time - but Lech's untimely death in 891 CE almost resulted in the Popielid realm being divided between his twin brothers Popiel II and Skarbimir. Will the Popielids manage to restore their position among the Lechitic tribes, or shall they vanish from history forever?"
trait_bloodline_theodosius: "Blood of Theodosius"
trait_bloodline_theodosius_desc: "Flavius Theodosius reigned as co-emperor alongside Valentinian II in the West. It was during his reign that Christianity was instituted as the state religion of the Western Empire. In 382 CE, Theodosius ordered the destruction of the Temple of the Vestal Virgins and the defilement of the Sacred Heart of Sol, enraging Julian II in the process. Julian then invaded the West and conquered the city of Rome within three months. Valentinian and Theodosius regrouped at Ravenna where they were beaten again by Julian. Following this, they fled first to Gallia and then Hispania, where Theodosius instigated the foederati and other barbarian tribes to invade the Empire. In 387 CE, Julian was mortally wounded, and so embarked upon his final journey into the desert. By this time, Valentinian and Theodosius had gathered the support of the Severans of Hispania, which they then used to re-establish their authority in the Western Empire. Because of tensions between the Eastern Empire and the Persians, Theodosius made peace with Alexandros IX, who was now the sole emperor of the East. Theodosius died in 395 CE of sun stroke, which Alexandros regarded as 'only fitting'. He was then succeeded by his son Honorius as co-emperor, however true power in the Western Empire lay with the half-Vandal general Stilicho. Honorius later moved his capital to Ravenna, where his descendants still reign today. With the power of the Western Emperor broken, will the Blood of Theodosius once again reclaim their Empire?"
trait_bloodline_aetius: "Blood of Aetius"
trait_bloodline_aetius_desc: "Flavius Aetius was the Roman general who defeated Attila the Hun, and co-Emperor of the Western Empire. Aetius was used as a hostage to placate the enemies of Rome twice. The first time he was sent to the Visigoths in 405 CE, and then he was sent to the Huns in 409 CE. His first military action was to restore Roman rule in Gallia, and in doing so he subjugated the Visigothic Kingdom of Aquitania, the Burgundians, and the Salian Franks. Following Aetius' first victory against the Huns, Valentinian IV appointed Aetius as co-emperor of the West. In 451 CE, Aetius managed the impossible and assembled a grand army of Romans and Goths against the renewed vigour of the Huns under their new leader Attila, and defeated them at the Battle of the Catalaunian Plains. However, the new emperor Valentinian V saw Aetius as a threat and ordered his assassination, followed by the appointment of Aetius' son as hereditary governor of Panormus to divert any suspicion away from himself. The descendants of Flavius Aetius still rule in Sicily, and their anger at their betrayal has only grown stronger over the centuries. Destiny compels them to take their rightful vengeance against the manipulative dynasts who have brought mighty Rome so low, and to deliver the Empire from the rot that plagues it from within. Their soldierly virtues saved the Empire once, and they may yet do so again."
trait_bloodline_david: "Blood of David"
trait_bloodline_david_desc: "David, son of Jesse, of the Tribe of Judah, Slayer of Goliath and Champion of the Israelites, ruled over and expanded the kingdom of Israel and moved its capital to Jerusalem. After the division of the kingdom during his grandson Rehoboam's reign, the southern kingdom of Judah continued to be ruled by the House of David until its conquest by the Babylonians. Despite this, the descendants of David survived, though they fell from power after 135 CE. In that year, following the defeat of the bar Kokhba revolt in Judea and the expulsion of the Jews from their ancient homeland, many were forced to march into the Sinai, where resettlement of Jews had started following the Jewish revolt of the preceding century, and a scion of the House of David was installed as Rome's client to keep them in order. It has long been prophesied that one of David's descendants shall be the messiah. Can they reforge the Kingdom of David and Solomon, and bring back the golden age of Israel?"
trait_bloodline_mithridates: "Blood of Mithridates"
trait_bloodline_mithridates_desc: "Mithridates VI Eupator was the greatest King of Pontus, and was crowned Megas Basileus in Pella after receiving the submission of Asia Minor and Hellas. Mithridates began the expansion of his kingdom by seizing Bithynia to the west, following which the Hellenes of Asia Minor submitted to this growing power. Soon after, Mithridates would take advantage of the civil war in Rome between Sulla and Marius, invading the client state of Makedonia. Once in Pella, Mithridates proclaimed himself Great King of the Hellenes and continued his campaign south, defeating the Spartan and Athenian army at Pydna, where the Spartans, refusing to surrender, were killed to a man. He would continue to win victories against both Hellenic and Roman forces until he would finally be defeated by Gnaeus Pompeius and King Deiotarus of Galatia. Forced to flee to his son's kingdom of the Cimmerian Bosphorus, he was pursued by Pompeius, who soundly defeated the Pontic army. Mithidates son, Machares, betrayed and murdered his father in the hopes of catering favor with Rome. Instead however, Pompeius executed Machares for fratricide and installed Mithidates VII as a Roman client in Pontus, whose descendants still rule from Sinope. With the Romans once again in turmoil, might they be able to once again claim the title Megas Basileus?"
trait_bloodline_hieron: "Blood of Hieron"
trait_bloodline_hieron_desc: "Hieron II was King of Syracuse and ally to Rome against the Carthaginians. Hieron was preceded by Agathocles who had united the island, but his death created a succession crisis. Taking advantage of the situation, mercenaries called the Mamertines gained control of the northeast of the island with their base at Messina. Hieron emerged triumphant from the succession crisis and defeated the Mamertines at Mylae, wresting control of the whole of Sicily. The true test of his reign would come at the speartips of the Sacred Band of Carthage. Hieron requested aid from Rome, thus sparking the First Punic War. When the Carthaginians were driven from Sicily, the two nations signed a Treaty of Eternal Alliance. The Hieronids would continue to provide Rome with ships and men in their many wars, but the occupation of the Vandals and Muslims have left the island kingdom weak. Will the scions of Hieron once again spread their rule across their island home and beyond?"
trait_bloodline_maccabeus: "Blood of Maccabeus"
trait_bloodline_maccabeus_desc: "This character is a Hasmonean, a descendant of Judas Maccabeus, the Hammer of Judea. In 167 BCE, his father Mattathias began a rebellion against the cruel policies of the Seleukids, but died within a year, leaving Judas to carry his father's torch. Judas did not falter, and lead the Chosen People to victory after victory over the Seleukids, joining the ranks of Joshua, Gideon, and David as one of Israel's greatest heroes! When Seleukid strength proved too much, Judah invited the Romans, who forced the Seleukid king Demetrios I Soter to recognize Judas as King of Judea in 160 BCE. However, the following year Judas was treacherously killed while in prayer, likely on Demetrios' orders. The power of the Hasmoneans has waned, but it has not disappeared. From their citadel in Beersheba, the heirs of Judas pray to Yahweh Sabaoth for victory over the infidels who now lord over Israel. Soon, the idolaters will once again know to fear the Hammer of Judea!"
trait_bloodline_viriathus: "Blood of Viriathus"
trait_bloodline_viriathus_desc: "Viriathus was King of the Lusitani, and first High King over Hispania. Valiant in danger, prudent and careful on campaign, Viriathus was a man cut from the same cloth as the Homeric Heroes of old! When Punicus of Lusitania bowed to the Romans, one of the conditions was that the youngest soldiers, the flower of the Lusitanian military, be put to death. The order was carried out in 150 BCE, but one young soldier survived. The following year, he was king, and Punicus' head decorated his spear. Viriathus moved fast, and in five years he unified the Lusitani, Celtiberi, and Iberian tribes into a single, unified force that fought Rome to a standstill at Numantia. For centuries afterwards, his line ruled Lusitania even as their hold over the rest of Hispania was broken by the Germanic tribes. Even throughout the chaos and the collapse of the Western Empire, they held true to the old Celtiberian gods, and it was a Viriathan, Martim Viriathus Vimaranes, who defeated the Caliph of Cordoba and prevented a Muslim conquest of Hispania. Now, with the blessing of Endovellico-Neto and the strength of the Lusitani, the line of Viriathus is poised to unite and free Hispania once again!"
trait_bloodline_chlorus: "Blood of Chlorus"
trait_bloodline_chlorus_desc: "Constantius Chlorus was co-emperor to Diocletian. A sickly man, he was nonetheless appointed co-emperor, and in 296 CE forced the rebel Maximus Artorius II to make peace with the Empire. Chlorus continued to campaign in Gaul and Britain, finally dying in 306 CE at the hands of the Picts. Never a zealot, his participation in the purges against Christianity consisted of knocking down two abandoned churches and being curt to a priest on a single occasion. Chlorus was nonetheless blessed, for he produced three lines of rulers! But of these lines, the Konstantinians, descended from his grandson Constantius II, consider themselves the most pure of Chlorus' heirs. They do not profane themselves with barbaric ceremonies around a sword like the Constantinids of Dumnonia, nor do they profess to personify a fictitious sun god like the Julianoi. Instead they maintain the traditional Imperial Cult, certain that someday an Emperor with the proper bloodline, one worthy of worship, will reign once more!"
trait_bloodline_theodoric: "Blood of Theodoric"
trait_bloodline_theodoric_desc: "Theodoric the Great was the son of Theodemir, and the only man to ever rule over all Goths, Eastern and Western alike. In 478 CE, Theodoric forced the Celtic kings of Tylis and Singidun to accept his authority over that of Constantinople's. Leaving his brother Theodemir II to rule the Balkans in his name, Theodoric traveled west, attacking the Western Empire on the suggestion of Emperor Zeno. Though he failed to break the might of Rome's legions, he simply went further west, uniting the disparate Goths of Southern Gallia. He was then invited by the Visigoths to be regent for the Balthing king Amalric, who was too young to rule. When the Tervingi king protested, Theodoric simply invited him to a banquet for a toast, and then strangled the Visigoth with his own two hands! And while not even Theodoric could stand against Clovis of the Franks, he was also one of the few men who could speak his mind around the infamously ruthless Merovingian. Theodoric was betrayed by his daughter Amalasuntha and killed in 515 CE. Though his empire did not outlast him, the Kings of Aquitaine still look to Theodoric as the great champion of Gothic Arianism. Even the Teutones respect and honor him, knowing him as Dietrich of Bern. From Alcantara all the way to Crimea, Goths everywhere know that one man almost forged them into an empire capable of rivaling Rome. If not for an ungrateful brat of a daughter!"
trait_bloodline_arminius: "Blood of Widukind"
trait_bloodline_arminius_desc: "Widukind was a warleader of the mainland Saxons in the late 8th century. Precious little is known of who he was before rising to prominence, and even his true name has been lost to time. 'Widukind' is merely a kenning which means 'Child of the Woods'. He was the leader of the continental Saxons in 777 CE, when Charlemagne, King of the Franks invaded the lands of the Saxons with intention to incorporate them to his new Holy Roman Empire. Just before a great battle with Charlemagne's forces, Widukind was invited by the priest-keepers of the Great Irminsul of Paderborn to 'meet' it in order to receive blessings from the gods. It is said that in the sacred grove that day, Wotan himself whispered to him of the weaknesses of the Frankish line, and that Widukind exploited this divine revelation to attain a great victory at the Battle of Paderborn. The Franks were broken and swept from Saxon lands, and in the great celebrations that came afterwards, the Teutones proclaimed him Arminius come again! His descendants continue to rule in Saxony, and much like their legendary forefather they jealously guard the independence of their people and the sanctity of the Irminsul."
trait_bloodline_asander: "Blood of Asander"
trait_bloodline_asander_desc: "Asander was King of the Cimmerian Bosporus. He was installed as client king by Gnaeus Pompeius in 64 BCE after his help against Machares, son of Mithridates VI, and during his reign would pursue a semi-autonomous policy. He expanded his dominions along the Black Sea and would come to conflict with Burebista, the King of the Dacians. After a draw at the Battle of Histria, a Treaty of Friendship was brokered between the two kingdoms and Asander married Boriava, a daughter of Burebista. He had Pharnaces II, Basileus of Pontus, killed after he fled to his court as a sign of his 'friendship' for Caesar, and was the first king who patronized the cult of Apollo-Boreas as the state cult. Despite numerous invasions from the Scythians, the Goths, the Huns, and a dozens of other nomad tribes from the Steppe, and the loss of Panticapaeum to the Audianist merchants, his descendants still rule the northern shore of the Black Sea. The Hellenes of the Cimmerian Bosporus now await the return of a great king to make their lands whole once again, and to unleash upon their enemies the cold breath of Apollo-Boreas."
trait_bloodline_aniketos: "Blood of Aniketos"
trait_bloodline_aniketos_desc: "This character is a descendant of the mighty line of Demetrius I Aniketos. In 184 BCE, Demetrius made the most of his position as the ruler of the furthest east of Alexander's old empire in Central Asia. After successfully invading large swathes of India, he used an amalgamation of Indohellenic aristocrats, Zhao bureaucrats, and Galatian soldiers to rule. However, his life was cut short by the traitorous Apollodotus I Soter before he could solidify his conquests. His sons split his empire amongst themselves, with Demetrius II taking India and Antimachus I taking Marakanda. When Demetrius II was assassinated by his general Pusyamitra Sunga, his realm collapsed. Sunga went on to kill the usurper Apollodotus, but a coalition led by Antimachus and his younger brother Menander would eventually retake India. Menander cut ties with Marakanda after Antimachus was assassinated, and though he placed Antimachus' son on the throne of Marakanda thereafter, relations between the two sides of the family were never the same. The older line of the Aniketoi once again found themselves relegated to Marakanda. However years later, the ambitious Alexandros II Aniketos saw an opportunity in the Peasant Rebellions against the Han, and set aside his rivalry with Menander's descendant, Epander II, to invade China from two directions. Alexandros made the legendary Katabasis to the Pacific in 96 BCE. He is said to have tearfully lamented that there were no worlds left to conquer, and instead sought to solidify his position in his new empire of Arche Serika. Though the family has survived the centuries, the years have not been kind to the Aniketos family. Now they are divided into a few small fiefdoms, but perhaps they could one day repeat the feats of their ancestors, or surpass them."
trait_bloodline_epanderos: "Blood of Epander"
trait_bloodline_epanderos_desc: "This character hails from the line of Epander II and his grandfather, Menander I. The family's origins are murky, but they are believed to share a common ancestor with the Aniketos dynasty, and split from their cousins in 158 BCE when Menander, the new Megas Basileus of India, lost his ally and brother Antimachus I in Marakanda. After that, Menander married a daughter of Apollodotus I, and his descendants would come to view themselves as separate from the Aniketos line in Marakanda. In 155 BCE, Menander invaded the island of Lanka, and after its successful conquest Menander campaigned into China during the Rebellion of the Seven States, hammering the Han Dynasty and forcing them into a Treaty of Eternal Friendship. His brother Alexandros was placed on the throne of the new satrapy of Antiocheia Eschate, based in Chengdu. In 134 BCE, Epander I marched east, carving new provinces out of Burma and Nam Viet. His descendants would engage in a joint invasion of China with their distant Aniketos cousins. Meanwhile, the Megas Basileus of India would campaign further south, conquering the Malay Peninsula and renaming it Epanderia. This represented the apex of their power, until the destruction of Epander III's navy in the Straits of Malacca on his way to invade the island of Sumatra. Since then, the family's rule has seen some of the most brutal wars in Indian history, fighting both native kingdoms and Indohellenic rivals, the bloodshed leaving their once prosperous realm a shadow of its former glory. Despite this, the Epanderoi still proudly claim the title of Megas Basileus of India, while other branches rule in far flung lands. Though hard times have befallen the descendants of Epander, they still remember their former power, and yearn to win back what they have lost."
