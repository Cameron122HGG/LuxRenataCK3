l_english:
 # LR 2026-11-06: the Solar Church situation (a re-themed copy of the Christian Church)
 LR_solar_church:0 "The Solar Church"
 LR_solar_church_desc:0 "The cult of the Unconquered Sun, bound to the Roman throne. Rome's priests and the incarnate Sun of Constantinople read the same light in different ways, and the Church swings between unity, eclipse, zeal and concord."
 situation_LR_solar_church:0 "$LR_solar_church$"
 situation_LR_solar_church_desc:0 "$LR_solar_church_desc$"
 situation_type_LR_solar_church:0 "$LR_solar_church$"
 situation_type_LR_solar_church_desc:0 "$LR_solar_church_desc$"
 LR_solar_church_sub_region_sc_core:0 "The Solar World"
 LR_solar_church_sub_region_sc_core_desc:0 "Wherever the Unconquered Sun is worshipped as Rome taught it."

 # Phases
 LR_solar_church_sc_divided_light_situation_phase:0 "Divided Light"
 LR_solar_church_sc_divided_light_situation_phase_desc:0 "One cult, two capitals. Rome's priests and the court of Constantinople each claim to read the Sun aright, and no one rite commands the rest."
 LR_sc_divided_light_effects:0 "Divided Light"
 LR_solar_church_sc_eclipse_situation_phase:0 "The Eclipse"
 LR_solar_church_sc_eclipse_situation_phase_desc:0 "The light fails. Priests sell their offices, rival emperors buy their prayers, and if the quarrel between the rites has gone far enough, the Eclipse is when the faith breaks."
 LR_sc_eclipse_effects:0 "The Eclipse"
 LR_solar_church_sc_rising_sun_situation_phase:0 "The Rising Sun"
 LR_solar_church_sc_rising_sun_situation_phase_desc:0 "The cult spreads: new temples, new converts, and the Sun carried beyond the old frontiers."
 LR_sc_rising_sun_effects:0 "The Rising Sun"
 LR_solar_church_sc_reform_situation_phase:0 "Reform of the Cult"
 LR_solar_church_sc_reform_situation_phase_desc:0 "Reformers purge the priesthoods of their abuses and set the rites in order again."
 LR_sc_reform_effects:0 "Reform of the Cult"
 LR_solar_church_sc_radiant_crown_situation_phase:0 "Crisis of the Radiant Crown"
 LR_solar_church_sc_radiant_crown_situation_phase_desc:0 "Who names the Sun's priests: the emperor, the Sun made flesh, or the Pontifex of Rome? The East bows to the crown, and the West's priests resist it."
 LR_sc_radiant_crown_effects:0 "Crisis of the Radiant Crown"
 LR_solar_church_sc_sacred_war_situation_phase:0 "The Sacred War"
 LR_solar_church_sc_sacred_war_situation_phase_desc:0 "The Sun's enemies are at the gates, or hold its holy cities, and the faithful take up arms."
 LR_sc_sacred_war_effects:0 "The Sacred War"
 LR_solar_church_sc_concord_situation_phase:0 "Sol Concors"
 LR_solar_church_sc_concord_situation_phase_desc:0 "The Sun shines on one people: the rites keep peace, temples rise and the priesthoods prosper."
 LR_sc_concord_effects:0 "Sol Concors"

 # Participant groups
 LR_solar_church_participant_group_sc_western_clergy:0 "Western Priesthood"
 LR_solar_church_participant_group_sc_western_clergy_desc:0 "Priestly rulers of the Western rite, Sol Invictus, and the Pontifex of Rome."
 LR_solar_church_participant_group_sc_western_rulers:0 "Western Rulers"
 LR_solar_church_participant_group_sc_western_rulers_desc:0 "Secular rulers of the Western rite, Sol Invictus."
 LR_solar_church_participant_group_sc_eastern_clergy:0 "Eastern Priesthood"
 LR_solar_church_participant_group_sc_eastern_clergy_desc:0 "Priestly rulers of the Eastern rite, Helios Autokrator."
 LR_solar_church_participant_group_sc_eastern_rulers:0 "Eastern Rulers"
 LR_solar_church_participant_group_sc_eastern_rulers_desc:0 "Secular rulers of the Eastern rite, Helios Autokrator, under the incarnate Sun."

