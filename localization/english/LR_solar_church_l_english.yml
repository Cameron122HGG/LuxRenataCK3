 catalyst_sc_faith_reunited:0 "$catalyst_sc_faith_reunited_desc$"
 catalyst_sc_faith_reunited_desc:0 "The Solar faith is reunited"
 catalyst_sc_schism:0 "$catalyst_sc_schism_desc$"
 catalyst_sc_schism_desc:0 "The quarrel between the rites has reached the breaking point"
 catalyst_sc_shaped_divided_light:0 "$catalyst_sc_shaped_divided_light_desc$"
 catalyst_sc_shaped_divided_light_desc:0 "A ruler shapes the Solar Church toward Divided Light"
 catalyst_sc_shaped_eclipse:0 "$catalyst_sc_shaped_eclipse_desc$"
 catalyst_sc_shaped_eclipse_desc:0 "A ruler shapes the Solar Church toward the Eclipse"
 catalyst_sc_shaped_rising_sun:0 "$catalyst_sc_shaped_rising_sun_desc$"
 catalyst_sc_shaped_rising_sun_desc:0 "A ruler shapes the Solar Church toward the Rising Sun"
 catalyst_sc_shaped_reform:0 "$catalyst_sc_shaped_reform_desc$"
 catalyst_sc_shaped_reform_desc:0 "A ruler shapes the Solar Church toward Reform"
 catalyst_sc_shaped_radiant_crown:0 "$catalyst_sc_shaped_radiant_crown_desc$"
 catalyst_sc_shaped_radiant_crown_desc:0 "A ruler shapes the Solar Church toward the Crisis of the Radiant Crown"
 catalyst_sc_shaped_sacred_war:0 "$catalyst_sc_shaped_sacred_war_desc$"
 catalyst_sc_shaped_sacred_war_desc:0 "A ruler shapes the Solar Church toward the Sacred War"
 catalyst_sc_shaped_concord:0 "$catalyst_sc_shaped_concord_desc$"
 catalyst_sc_shaped_concord_desc:0 "A ruler shapes the Solar Church toward Sol Concors"

 # Parameters
 situation_parameter_LR_sc_cheaper_solar_council:0 "Convening a Solar Council costs half the [piety|E]"
 situation_parameter_LR_sc_schism_can_land:0 "If the quarrel between the rites has reached its threshold, the Solar faith splits when this phase ends"

 # Decisions
 LR_shape_the_solar_church_decision:0 "Shape the Solar Church"
 LR_shape_the_solar_church_decision_desc:0 "Use my standing among the faithful to steer the Solar Church toward the age I want for it."
 LR_shape_the_solar_church_decision_tooltip:0 "Push the Solar Church toward one of the phases it can enter next"
 LR_shape_the_solar_church_decision_confirm:0 "Shape the Church"
 LR_shape_the_solar_church_decision_effect_tt:0 "Choose a phase the Solar Church can move to next and push it there"
 LR_prevent_solar_schism_decision:0 "Prevent the Solar Schism"
 LR_prevent_solar_schism_decision_desc:0 "The Sun cannot shine in two ways. I will bring Rome and Constantinople to terms before the faith breaks."
 LR_prevent_solar_schism_decision_tooltip:0 "Settle the quarrel of the rites before the Eclipse ends"
 LR_prevent_solar_schism_decision_confirm:0 "One Sun"
 LR_prevent_solar_schism_decision_effect_tt:0 "The Solar schism is averted for good unless a new quarrel arises: the Solar Church enters #V Sol Concors#!, and you gain [piety|E] and the nickname #V the Concordant#!"
 LR_cause_solar_schism_decision:0 "Cause the Solar Schism"
 LR_cause_solar_schism_decision_desc:0 "There is no reconciling the two rites. Better to break now, on my terms."
 LR_cause_solar_schism_decision_tooltip:0 "Split the Solar faith now, without waiting for the Eclipse to end"
 LR_cause_solar_schism_decision_confirm:0 "Break with them"
 LR_cause_solar_schism_decision_effect_tt:0 "The Solar faith splits at once into #V Sol Invictus#! (West) and #V Helios Autokrator#! (East), and the Solar Church enters #V Reform of the Cult#!"
 LR_sc_holds_a_holy_city_tt:0 "Rome or Constantinople is in your realm"
 LR_sc_stance_no_schism_tt:0 "You took the stance #V One Sun: no schism#!"
 LR_sc_stance_schism_tt:0 "You took the side of the West or the East"
 LR_sc_stance_west_tt:0 "You will stand with the West, Sol Invictus and the priests of Rome, if the faith breaks"
 LR_sc_stance_east_tt:0 "You will stand with the East, Helios Autokrator and the incarnate Sun, if the faith breaks"

 # Events
 LR_solar_church.0001.t:0 "The Solar Church"
 LR_solar_church.0001.t.sc_divided_light:0 "The Solar Church: Divided Light"
 LR_solar_church.0001.t.sc_eclipse:0 "The Solar Church: The Eclipse"
 LR_solar_church.0001.t.sc_rising_sun:0 "The Solar Church: The Rising Sun"
 LR_solar_church.0001.t.sc_reform:0 "The Solar Church: Reform of the Cult"
 LR_solar_church.0001.t.sc_radiant_crown:0 "The Solar Church: Crisis of the Radiant Crown"
 LR_solar_church.0001.t.sc_sacred_war:0 "The Solar Church: The Sacred War"
 LR_solar_church.0001.t.sc_concord:0 "The Solar Church: Sol Concors"
 LR_solar_church.0001.desc:0 "The Solar Church enters a new age."
 LR_solar_church.0001.desc.sc_divided_light:0 "$LR_solar_church_sc_divided_light_situation_phase_desc$"
 LR_solar_church.0001.desc.sc_eclipse:0 "$LR_solar_church_sc_eclipse_situation_phase_desc$"
 LR_solar_church.0001.desc.sc_rising_sun:0 "$LR_solar_church_sc_rising_sun_situation_phase_desc$"
 LR_solar_church.0001.desc.sc_reform:0 "$LR_solar_church_sc_reform_situation_phase_desc$"
 LR_solar_church.0001.desc.sc_radiant_crown:0 "$LR_solar_church_sc_radiant_crown_situation_phase_desc$"
 LR_solar_church.0001.desc.sc_sacred_war:0 "$LR_solar_church_sc_sacred_war_situation_phase_desc$"
 LR_solar_church.0001.desc.sc_concord:0 "$LR_solar_church_sc_concord_situation_phase_desc$"
 LR_solar_church.0001.a:0 "So turns the Sun."
 LR_solar_church.0010.t:0 "The Breaking Point"
 LR_solar_church.0010.desc:0 "Rome and Constantinople no longer speak of the Sun in the same words. Anathemas pass between the Pontifex and the court of the incarnate Sun, and the faithful are choosing sides. When the Solar Church next falls into Eclipse, the faith will break, unless someone holds it together."
 LR_solar_church.0010.a:0 "May the light hold."
 LR_solar_church.0020.t:0 "The Eclipse of the Rites"
 LR_solar_church.0020.desc:0 "The quarrel has come to a head. If the faith breaks, the West will follow the Pontifex of Rome as Sol Invictus, and the East the incarnate Sun as Helios Autokrator. Every Solar ruler must say where they stand."
 LR_solar_church.0020.a:0 "With Rome and the Unconquered Sun."
 LR_solar_church.0020.b:0 "With Constantinople and the Sun made flesh."
 LR_solar_church.0020.c:0 "There is only one Sun."
 LR_solar_church.0022.t:0 "The Light Holds"
 LR_solar_church.0022.desc:0 "[sc_peacemaker.GetTitledFirstName] has brought the rites to terms. Rome and Constantinople still read the Sun differently, but they read it as one faith, and the Solar Church enters an age of concord."
 LR_solar_church.0022.a:0 "One Sun."
 LR_solar_church.0030.t:0 "Shaping the Solar Church"
 LR_solar_church.0030.desc:0 "Priests, courtiers and the faithful look to me. Where should I lead the Solar Church?"
 LR_solar_church.0030.sc_divided_light:0 "Let each rite read the light its own way."
 LR_solar_church.0030.sc_divided_light.tt:0 "Pushes the Solar Church toward #V Divided Light#!"
 LR_solar_church.0030.sc_eclipse:0 "Let the corrupt priesthoods fall where they will."
 LR_solar_church.0030.sc_eclipse.tt:0 "Pushes the Solar Church toward #V The Eclipse#!"
 LR_solar_church.0030.sc_rising_sun:0 "Carry the Sun to new lands."
 LR_solar_church.0030.sc_rising_sun.tt:0 "Pushes the Solar Church toward #V The Rising Sun#!"
 LR_solar_church.0030.sc_reform:0 "Purge the priesthoods of their abuses."
 LR_solar_church.0030.sc_reform.tt:0 "Pushes the Solar Church toward #V Reform of the Cult#!"
 LR_solar_church.0030.sc_radiant_crown:0 "Settle who names the Sun's priests."
 LR_solar_church.0030.sc_radiant_crown.tt:0 "Pushes the Solar Church toward the #V Crisis of the Radiant Crown#!"
 LR_solar_church.0030.sc_sacred_war:0 "Call the faithful to arms."
 LR_solar_church.0030.sc_sacred_war.tt:0 "Pushes the Solar Church toward #V The Sacred War#!"
 LR_solar_church.0030.sc_concord:0 "Bring the rites to peace."
 LR_solar_church.0030.sc_concord.tt:0 "Pushes the Solar Church toward #V Sol Concors#!"
 LR_solar_church.0030.leave:0 "On reflection, let the Church find its own way."

 # The window's schism panel
 LR_sc_schism_panel_header:0 "The Solar Schism"
 LR_sc_schism_panel_unity:0 "#bold Unity#!"
 LR_sc_schism_panel_schism:0 "#bold Schism#!"
 LR_sc_schism_status_brewing:0 "#weak The rites drift apart: [GetGlobalVariable('LR_solar_schism_progress').GetValue|0] / 100#!"
 LR_sc_schism_status_threshold:0 "#N The breaking point is reached: the next Eclipse decides#!"
 LR_sc_schism_status_ongoing:0 "#N The Eclipse is deciding: the faith splits when it ends, unless the schism is prevented#!"
 LR_sc_schism_status_split:0 "The Sun is divided: #V Sol Invictus#! in the West, #V Helios Autokrator#! in the East"
 LR_sc_schism_status_averted:0 "#P The schism was averted: the Sun is one#!"
 LR_sc_schism_your_stance_west:0 "Your stance: with the West"
 LR_sc_schism_your_stance_east:0 "Your stance: with the East"
 LR_sc_schism_your_stance_none:0 "Your stance: one Sun, no schism"
 LR_sc_schism_panel_tt:0 "#T The Solar Schism#!\nThe Western rite (Sol Invictus, the Pontifex of Rome) and the Eastern rite (Helios Autokrator, the incarnate Sun of Constantinople) drift apart.\n\n#T What moves it#!\n$BULLET_WITH_TAB$Each year: separate Western and Eastern emperors #bold +3#!; Rome held by the West while Constantinople is held by the East #bold +2#!; a restored Rome #bold -5#!\n$BULLET_WITH_TAB$A head of the faith killed by the other rite #bold +10#!, imprisoned by it #bold +5#!\n$BULLET_WITH_TAB$Rome taken by the East, or Constantinople by the West #bold +10#!\n$BULLET_WITH_TAB$A war between the rites, or an excommunication across them #bold +5#!; a county crossing rites #bold +1#!\n$BULLET_WITH_TAB$Convening a Solar Council #bold -25#!\n\n#T At 100#!\nThe next #V Eclipse#! decides: every Solar ruler takes a stance, and the faith splits when the Eclipse ends unless a head of the faith or a great ruler takes #V Prevent the Solar Schism#!."
