 catalyst_sc_rite_crossed_desc:0 "A county crosses between the Western and Eastern rites"
 catalyst_sc_excommunication:0 "$catalyst_sc_excommunication_desc$"
 catalyst_sc_excommunication_desc:0 "A Solar ruler is excommunicated"
