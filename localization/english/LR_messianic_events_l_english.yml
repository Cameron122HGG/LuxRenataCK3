 # GENERATED by tools/li_soul_regimes/build_messianic_events.py (SELIN by Numahr, 2026-11-26)
 LR_messianic.0010.t: "Messianic Guidance"
 LR_messianic.0010.desc: "As I now enjoy some spiritual aura and authority, I exercise a measure of messianic guidance over my realm."
 LR_messianic.0010.a: "My guidance is still loose, though."
 LR_messianic.0020.t: "Messianic Guidance Grows"
 LR_messianic.0020.desc: "As I now enjoy stronger spiritual leadership and authority, I exercise real messianic leadership over my realm."
 LR_messianic.0020.a: "My leadership is still not very inspiring, though."
 LR_messianic.0011.t: "Guidance Lost"
 LR_messianic.0011.desc: "For lack of spiritual leadership and authority, I no longer exercise any messianic guidance over my realm."
 LR_messianic.0011.a: "So be it."
 LR_messianic.0021.t: "Guidance Loosens"
 LR_messianic.0021.desc: "My spiritual leadership and authority are weak, and my messianic guidance has loosened."
 LR_messianic.0021.a: "I still guide them a little."
 LR_messianic.0031.t: "The Inspiration Fades"
 LR_messianic.0031.desc: "Inspiring messianic leadership rested on my aura as a great spiritual guide. Of late that aura and authority have slipped away, and I inspire the realm no longer."
 LR_messianic.0031.a: "My guidance remains effective, though."
 LR_messianic.0041.t: "The Fanaticism Ebbs"
 LR_messianic.0041.desc: "The believers' fanaticism rested on my aura as an exceptional spiritual guide. Of late that aura and authority have slipped away, and fanatics no longer answer my call."
 LR_messianic.0041.a: "They are still inspired, though."
 LR_messianic.0130.t: "The Believers Mobilise"
 LR_messianic.0130.desc: "My messianic leadership is mobilising the believers of my realm. Their counties will give me more men and gold, but the social order is disrupted."
 LR_messianic.0130.a: "I shall lead them to victory and spiritual fulfilment."
 LR_messianic.0140.t: "The Believers Turn Fanatic"
 LR_messianic.0140.desc: "My messianic leadership is turning the believers of my realm into fanatics. Their counties will give me many more men and gold, but the social order is dissolving."
 LR_messianic.0140.a: "I shall build a better world for them."
 LR_messianic.0131.t: "The Mobilisation Ends"
 LR_messianic.0131.desc: "My messianic leadership is not as inspiring as it was. The believers are no longer in a state of intense spiritual mobilisation."
 LR_messianic.0131.a: "Back to normal for them."
 LR_messianic.0141.t: "The Fanaticism Cools"
 LR_messianic.0141.desc: "My messianic leadership has lost some of its intensity. The believers no longer follow me fanatically."
 LR_messianic.0141.a: "They remain mobilised, though, while the inspiration lasts."
 LR_messianic.0005.t: "The Savior"
 LR_messianic.0005.desc: "The gods rule over my life. I, their shadow on Earth, shall lead the faithful in our struggle against the darkness."
 LR_messianic.0005.a: "Those who do not follow me are our enemies."
 LR_messianic.0005.b: "The time is not right yet."
 LR_messianic.0006.t: "A False Savior?"
 LR_messianic.0006.desc: "My fellow believers do not hail me as the Savior. My clergy point out that the scriptures do not seem to speak of me when they foretell one. And, perhaps worse, my vassals grow tired of what they see as tyranny."
 LR_messianic.0006.a: "I shall prove them wrong!"
 LR_messianic.0006.b: "Time to end this madness."
 LR_messianic_mobilization_modifier: "Messianic Mobilisation"
 LR_messianic_mobilization_modifier_desc: "The believers here are in a state of intense spiritual mobilisation: more men and gold for the cause, less order."
 LR_messianic_fanaticism_modifier: "Messianic Fanaticism"
 LR_messianic_fanaticism_modifier_desc: "The believers here follow their messianic leader fanatically. The cause gets many more men and gold; the social order is dissolving."
 LR_messianic_agitation_modifier: "Messianic Agitation"
 LR_messianic_agitation_modifier_desc: "This ruler keeps a Messianic regime that the believers will not accept, and pays the political price."
 trait_LR_messianic_savior: "Messianic Savior"
 trait_LR_messianic_savior_desc: "This character is hailed as the true Savior by the believers of [ROOT.Char.GetHerHis] faith."
 trait_LR_messianic_savior_character_desc: "[ROOT.Char.GetFirstName] is hailed as the true Savior by the believers of [ROOT.Char.GetHerHis] faith."
 LR_nick_the_savior: "the Savior"
 LR_become_savior_decision: "Become the Savior"
 LR_become_savior_decision_desc: "There is no doubt left that I am the one the gods chose to cleanse the world. The believers of my realm already follow my messianic leadership fanatically. I may proclaim myself the Savior long foretold in the scriptures."
 LR_become_savior_decision_tooltip: "Proclaim yourself the Savior"
 LR_become_savior_decision_confirm: "I am the one"
 LR_become_savior_regime_tt: "If you do not hold the Messianic regime, you may take it at once"
