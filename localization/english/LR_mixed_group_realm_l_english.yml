l_english:
 # Lux Renata 2026-11-18: vassals whose government group differs from their top liege's (LR_mixed_group_realm_effects.txt)
 LR_adopt_realm_customs_decision: "Adopt the Customs of the Realm"
 LR_adopt_realm_customs_decision_desc: "My realm is ruled by customs other than those of my people. To set aside our ways and govern as my liege does would earn their favor, and end the quarrels between our courts."
 LR_adopt_realm_customs_decision_tooltip: "Take up the government of your top liege's customs."
 LR_adopt_realm_customs_decision_confirm: "We shall govern as the realm does"

 LR_demand_conformity_interaction: "Demand Conformity"
 LR_demand_conformity_interaction_desc: "Ask [recipient.GetTitledFirstName] to give up the customs of [recipient.GetHerHis] people and govern as the realm does."
 LR_demand_conformity_acceptance_reason: "Accepts your culture"
 LR_demand_conformity_meek_reason: "Content or humble"
 LR_demand_conformity_proud_reason: "Stubborn or arrogant"

 LR_foreign_customs_opinion: "Foreign Customs"
 LR_adopted_realm_customs_opinion: "Adopted the Customs of the Realm"
 LR_forced_customs_opinion: "Forced to Give Up Our Customs"
 LR_refused_conformity_opinion: "Refused to Conform"

 LR_realm_of_many_customs_modifier: "Realm of Many Customs"
 LR_realm_of_many_customs_modifier_desc: "Several vassals of this realm govern by customs other than their liege's, and give less of their taxes and levies."
 LR_realm_of_very_many_customs_modifier: "Realm of Very Many Customs"
 LR_realm_of_very_many_customs_modifier_desc: "Many vassals of this realm govern by customs other than their liege's, and give far less of their taxes and levies."

 # Option C (2026-11-18): realm customs laws
 LR_realm_customs: "Realm Customs"
 LR_realm_customs_0: "Many Customs"
 LR_realm_customs_0_effects: "$EFFECT_LIST_BULLET$Vassals of other government customs do not resent you\n$EFFECT_LIST_BULLET$Three or more of them who do not tolerate your customs give 10% less tax and levies (15% with six or more)\n$EFFECT_LIST_BULLET$You cannot Demand Conformity"
 LR_realm_customs_1: "Customary"
 LR_realm_customs_1_effects: "$EFFECT_LIST_BULLET$Vassals of other government customs who do not tolerate yours have [opinion|E] #N -10#! of you\n$EFFECT_LIST_BULLET$Three or more such vassals give 5% less tax and levies (10% with six or more)"
 LR_realm_customs_2: "One Custom"
 LR_realm_customs_2_effects: "$EFFECT_LIST_BULLET$Vassals of other government customs who do not tolerate yours have [opinion|E] #N -20#! of you\n$EFFECT_LIST_BULLET$Three or more such vassals give 5% less tax and levies (10% with six or more)\n$EFFECT_LIST_BULLET$Each year, any vassal of other customs may be pressed to take up the realm's customs"

 LR_customs_suppressed_opinion: "Customs Suppressed"
 LR_realm_of_tolerated_customs_modifier: "Realm of Tolerated Customs"
 LR_realm_of_tolerated_customs_modifier_desc: "This realm lets several vassals govern by their own customs, at a cost to their taxes and levies."
 LR_realm_of_very_tolerated_customs_modifier: "Realm of Many Tolerated Customs"
 LR_realm_of_very_tolerated_customs_modifier_desc: "This realm lets many vassals govern by their own customs, at a heavy cost to their taxes and levies."

 LR_realm_customs.0001.t: "One Custom for the Realm"
 LR_realm_customs.0001.desc: "[ROOT.Char.GetTopLiege.GetTitledFirstName] will have one custom of government across [ROOT.Char.GetTopLiege.GetHerHis] realm, and [ROOT.Char.GetTopLiege.GetHerHis] envoys now press me to give up the ways of my people and govern as [ROOT.Char.GetTopLiege.GetSheHe] does."
 LR_realm_customs.0001.a: "We shall govern as the realm does."
 LR_realm_customs.0001.b: "Our customs are not [ROOT.Char.GetTopLiege.GetHerHis] to take."
 LR_realm_customs.0001.toast_conformed: "A Vassal Conforms"
 LR_realm_customs.0001.toast_refused: "A Vassal Refuses to Conform"
