l_english:
 # Dynastic realm names (common/scripted_effects/LR_dynastic_realm_names_effects.txt)
 # Parsed once when the title is named; ROOT is the ruler. The tier word is the realm's flavored tier ("Caliphate").
 LR_dynastic_realm_name: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 LR_dynastic_realm_name_adj: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 # Article, as vanilla does for custom names like e_byzantium ("the Byzantine Empire"): a title with an
 # article shows as "the <Name>" in text instead of "<Tier> of <Name>". TEST: does the engine read it for set_title_name_dynamic?
 LR_dynastic_realm_name_article: "the "
 # Temporal head of faith (the caliph): the word comes from the faith's head title name ("Caliphate")
 LR_dynastic_realm_name_hof: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip] [ROOT.Char.GetFaith.ReligiousHeadTitleName|U]"
 LR_dynastic_realm_name_hof_adj: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 LR_dynastic_realm_name_hof_article: "the "
 # "All realms" mode, cultures that don't name realms after houses: "Kingdom of France"
 LR_tiered_realm_name: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 LR_tiered_realm_name_adj: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 LR_tiered_realm_name_article: "the "
 LR_tiered_realm_name_hof: "[ROOT.Char.GetFaith.ReligiousHeadTitleName|U] of [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 LR_tiered_realm_name_hof_adj: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 LR_tiered_realm_name_hof_article: "the "

 # UI tier word for house-named realms, so the UI doesn't read "Caliphate of Abbasid Caliphate"
 LR_dynastic_realm_duchy: "Realm"
 LR_dynastic_realm_kingdom: "Realm"
 LR_dynastic_realm_empire: "Realm"
 LR_dynastic_realm_hegemony: "Realm"

 # character window header (LR_character_view_name custom loc)
 # NoTooltip forms (11-21): the plain forms made the header name an underlined tooltip
 LR_character_view_name_realm: "[ROOT.Char.GetTitledFirstNameNicknamedNoTooltipRegnal] of the [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 LR_character_view_name_realm_house_first: "[ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetHouse.GetBaseNameNoTooltip] [ROOT.Char.GetFirstNameNicknamedNoTooltipRegnal] of the [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 LR_character_view_name_default: "[ROOT.Char.GetUINameNotMeNoTooltip]"

 # Game rule
 rule_lr_dynastic_realm_names: "$lux_gr_prefix$Dynastic Realm Names"
 setting_lr_dynastic_realm_names_dynastic: "#high Dynastic Cultures#!"
 setting_lr_dynastic_realm_names_dynastic_desc: "[realms|E] of [duchy|E] tier and above whose ruler's [culture|E] names realms after the ruling [house|E] (Arabic, Iranian, Turkic, Indic and other cultures) are named after the house and their tier, e.g. #V Abbasid Caliphate#!. Republics, theocracies and holy orders of [duchy|E] tier and above are named after their title, e.g. #V Republic of Venice#!, #V Duke-Bishopric of Salzburg#! or #V Order of Knights Templar#!."
 setting_lr_dynastic_realm_names_all: "#high All Realms#!"
 setting_lr_dynastic_realm_names_all_desc: "Every [realm|E] of [kingdom|E] tier and above shows its tier on the map. Cultures that name realms after the ruling [house|E] use the house, from [duchy|E] tier up, e.g. #V Abbasid Caliphate#!; all others use the title, e.g. #V Kingdom of France#!. Republics, theocracies and holy orders are named the same way from [duchy|E] tier up, e.g. #V Republic of Venice#!, #V Duke-Bishopric of Salzburg#! or #V Order of Knights Templar#!. Mercenaries, adventurers and nomads keep their names."
 setting_lr_dynastic_realm_names_tiered: "#high Tier Names Only#!"
 setting_lr_dynastic_realm_names_tiered_desc: "Every [realm|E] of [kingdom|E] tier and above shows its tier on the map, named after its title, e.g. #V Kingdom of France#! or #V Sultanate of Rum#!. No realm is named after its [house|E]. Republics, theocracies and holy orders are named the same way from [duchy|E] tier up, e.g. #V Republic of Venice#!, #V Duke-Bishopric of Salzburg#! or #V Order of Knights Templar#!. Mercenaries, adventurers and nomads keep their names."
 setting_lr_dynastic_realm_names_vanilla: "Off"
 setting_lr_dynastic_realm_names_vanilla_desc: "Realm names are left to the base game: dynastic cultures show only the [house|E] name on the map, as set by the game's Dynasty Named Realms setting."

 # Two-line character window header (user, 2026-11-21): name on top, held title + age below
 LR_character_view_name_top_default: "[ROOT.Char.GetTitledFirstNameNicknamedNoTooltipRegnal]"
 LR_character_view_name_top_house_first: "[ROOT.Char.GetTitleAsNameNoTooltip] [ROOT.Char.GetHouse.GetBaseNameNoTooltip] [ROOT.Char.GetFirstNameNicknamedNoTooltipRegnal]"
 LR_character_view_name_title_line_realm: "of the [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 LR_character_view_name_title_line_default: "of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]"
 LR_CHARACTER_VIEW_TITLE_LINE: "[Character.Custom('LR_character_view_name_title_line')], "
 LR_character_view_name_top_none: ""
