l_english:
 # Dynastic realm names (common/scripted_effects/LR_dynastic_realm_names_effects.txt)
 # Parsed once when the title is named; ROOT is the ruler. The tier word is the realm's flavored tier ("Caliphate").
 LR_dynastic_realm_name: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
 LR_dynastic_realm_name_adj: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 # Article, as vanilla does for custom names like e_byzantium ("the Byzantine Empire"): a title with an
 # article shows as "the <Name>" in text instead of "<Tier> of <Name>". TEST: does the engine read it for set_title_name_dynamic?
 LR_dynastic_realm_name_article: "the "
 # Temporal head of faith (the caliph): the word comes from the faith's head title name ("Caliphate")
 LR_dynastic_realm_name_hof: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip] [ROOT.Char.GetFaith.ReligiousHeadTitleName|U]"
 LR_dynastic_realm_name_hof_adj: "[ROOT.Char.GetHouse.GetBaseNameNoTooltip]"
 LR_dynastic_realm_name_hof_article: "the "
 # "All realms" mode, cultures that don't name realms after houses: "Kingdom of France"
 LR_tiered_realm_name: "[ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 LR_tiered_realm_name_adj: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 LR_tiered_realm_name_article: "the "
 LR_tiered_realm_name_hof: "[ROOT.Char.GetFaith.ReligiousHeadTitleName|U] of [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 LR_tiered_realm_name_hof_adj: "[ROOT.Char.GetPrimaryTitle.GetAdjectiveNoTooltip]"
 LR_tiered_realm_name_hof_article: "the "

 # UI tier word for house-named realms, so the UI doesn't read "Caliphate of Abbasid Caliphate"
 LR_dynastic_realm_kingdom: "Realm"
 LR_dynastic_realm_empire: "Realm"
 LR_dynastic_realm_hegemony: "Realm"

 # Game rule
 rule_lr_dynastic_realm_names: "$lux_gr_prefix$Dynastic Realm Names"
 setting_lr_dynastic_realm_names_dynastic: "#high Dynastic Cultures#!"
 setting_lr_dynastic_realm_names_dynastic_desc: "[realms|E] of [kingdom|E] tier and above whose ruler's [culture|E] names realms after the ruling [house|E] (Arabic, Iranian, Turkic, Indic and other cultures) are named after the house and their tier, e.g. #V Abbasid Caliphate#!."
 setting_lr_dynastic_realm_names_all: "#high All Realms#!"
 setting_lr_dynastic_realm_names_all_desc: "Every [realm|E] of [kingdom|E] tier and above shows its tier on the map. Cultures that name realms after the ruling [house|E] use the house, e.g. #V Abbasid Caliphate#!; all others use the title, e.g. #V Kingdom of France#!. Theocracies, republics, holy orders, mercenaries, adventurers and nomads keep their names."
 setting_lr_dynastic_realm_names_vanilla: "Off"
 setting_lr_dynastic_realm_names_vanilla_desc: "Realm names are left to the base game: dynastic cultures show only the [house|E] name on the map, as set by the game's Dynasty Named Realms setting."
