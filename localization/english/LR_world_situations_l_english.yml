 LR_world_situation.0001.t:0 "Imperium"
 LR_world_situation.0001.desc:0 "A secure emperor rules [situation_sub_region.GetName] again."
 LR_world_situation.0001.a:0 "Long live the emperor"
 LR_world_situation.0002.t:0 "Crisis in the Empire"
 LR_world_situation.0002.desc:0 "The throne of [situation_sub_region.GetName] is shaken: usurpers stir and the legions waver."
 LR_world_situation.0002.a:0 "The purple must hold"
 LR_world_situation.0003.t:0 "Anarchy"
 LR_world_situation.0003.desc:0 "No emperor rules [situation_sub_region.GetName]. Every warlord and decayed court reaches for the purple."
 LR_world_situation.0003.a:0 "Then let us contend"
 LR_world_situation.0004.t:0 "The Restoration"
 LR_world_situation.0004.desc:0 "In [situation_sub_region.GetName] the old dioceses and provinces are being rebuilt."
 LR_world_situation.0004.a:0 "Rome endures"
 LR_world_situation.0005.t:0 "Pax Romana"
 LR_world_situation.0005.desc:0 "One Augustus rules both halves of the Roman world."
 LR_world_situation.0005.a:0 "Pax Romana"
 LR_world_situation.0011.t:0 "Twilight of the Successors"
 LR_world_situation.0011.desc:0 "Few of the old lines endure, and Rome and Persia press on the Greek East."
 LR_world_situation.0011.a:0 "The light fades"
 LR_world_situation.0012.t:0 "A Hellenic Revival"
 LR_world_situation.0012.desc:0 "Old lines are refounded and the satrapies restored: the Hellenic world revives."
 LR_world_situation.0012.a:0 "Alexander's heirs return"
 LR_world_situation.0013.t:0 "The Balance of Kings"
 LR_world_situation.0013.desc:0 "Several successor lines now reign side by side."
 LR_world_situation.0013.a:0 "Let there be balance"
 LR_world_situation.0014.t:0 "Wars of the Successors"
 LR_world_situation.0014.desc:0 "The successor kings are at war for Alexander's inheritance."
 LR_world_situation.0014.a:0 "To arms"
 LR_world_situation.0015.t:0 "A Hegemon Rises"
 LR_world_situation.0015.desc:0 "One line now stands above the others in the Hellenistic world."
 LR_world_situation.0015.a:0 "So it was under Alexander"
 LR_cleave_needs_pax_tt:0 "Your half of the Roman World is in Pax Romana"
 LR_rw_pax_romana_war_ban_tt:0 "The Pax Romana forbids wars between Romans of the Augustus's realm"
