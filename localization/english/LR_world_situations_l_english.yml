l_english:
 # LR 2026-11-06: the Roman World and Hellenistic World situations
 LR_roman_world:0 "The Roman World"
 LR_roman_world_desc:0 "The two halves of the Roman world, each with its own fortunes: secure under an emperor, in crisis, in anarchy or being restored, and at peace together under one Augustus. The Greek East leans [GetGlobalVariable('LR_greek_east').GetValue|0] out of 100 toward the diadochi (0 is wholly Rome's)."
 situation_LR_roman_world:0 "$LR_roman_world$"
 situation_LR_roman_world_desc:0 "$LR_roman_world_desc$"
 situation_type_LR_roman_world:0 "$LR_roman_world$"
 situation_type_LR_roman_world_desc:0 "$LR_roman_world_desc$"
 LR_hellenistic_world:0 "The Hellenistic World"
 LR_hellenistic_world_desc:0 "The legacy of Alexander's successors: the diadochi lines, the satrapies and the Hellenic courts, from twilight to revival, balance, war and hegemony. The Greek East leans [GetGlobalVariable('LR_greek_east').GetValue|0] out of 100 toward the diadochi (0 is wholly Rome's)."
 situation_LR_hellenistic_world:0 "$LR_hellenistic_world$"
 situation_LR_hellenistic_world_desc:0 "$LR_hellenistic_world_desc$"
 situation_type_LR_hellenistic_world:0 "$LR_hellenistic_world$"
 situation_type_LR_hellenistic_world_desc:0 "$LR_hellenistic_world_desc$"
 LR_roman_world_rw_imperium_situation_phase:0 "Imperium"
 LR_roman_world_rw_imperium_situation_phase_desc:0 "A secure emperor rules this half of the empire. His officials serve him and his vassals stay loyal."
 LR_rw_imperium_effects:0 "Imperium"
 LR_roman_world_rw_crisis_situation_phase:0 "Crisis"
 LR_roman_world_rw_crisis_situation_phase_desc:0 "Usurpers, civil war or a failing dynasty shake the throne of this half."
 LR_rw_crisis_effects:0 "Crisis"
 LR_roman_world_rw_anarchy_situation_phase:0 "Anarchy"
 LR_roman_world_rw_anarchy_situation_phase_desc:0 "No restored emperor rules this half independently. Decayed courts and warlords fight over the purple."
 LR_rw_anarchy_effects:0 "Anarchy"
 LR_roman_world_rw_restoration_situation_phase:0 "Restoration"
 LR_roman_world_rw_restoration_situation_phase_desc:0 "An emperor is rebuilding the dioceses and provinces of this half; the old order is coming back."
 LR_rw_restoration_effects:0 "Restoration"
 LR_roman_world_rw_pax_situation_phase:0 "Pax Romana"
 LR_roman_world_rw_pax_situation_phase_desc:0 "One Augustus rules both halves of the Roman world."
 LR_rw_pax_effects:0 "Pax Romana"
 LR_hellenistic_world_hw_twilight_situation_phase:0 "Twilight"
 LR_hellenistic_world_hw_twilight_situation_phase_desc:0 "Few of the old lines endure. Rome and Persia press on the Greek East, and the satrapies are being made into provinces."
 LR_hw_twilight_effects:0 "Twilight"
 LR_hellenistic_world_hw_revival_situation_phase:0 "Revival"
 LR_hellenistic_world_hw_revival_situation_phase_desc:0 "Old lines are being refounded and satrapies restored; the Hellenic courts revive."
 LR_hw_revival_effects:0 "Revival"
 LR_hellenistic_world_hw_balance_situation_phase:0 "Balance of Kings"
 LR_hellenistic_world_hw_balance_situation_phase_desc:0 "Several successor lines reign side by side, bound by marriage and embassy."
 LR_hw_balance_effects:0 "Balance of Kings"
 LR_hellenistic_world_hw_wars_situation_phase:0 "Wars of the Successors"
 LR_hellenistic_world_hw_wars_situation_phase_desc:0 "The successor lines are at war for Alexander's inheritance."
 LR_hw_wars_effects:0 "Wars of the Successors"
 LR_hellenistic_world_hw_hegemony_situation_phase:0 "Hegemony"
 LR_hellenistic_world_hw_hegemony_situation_phase_desc:0 "One line stands above the others as hegemon of the Hellenistic world."
 LR_hw_hegemony_phase_effects:0 "Hegemony"
 LR_roman_world_sub_region_rw_west:0 "The West"
 LR_roman_world_sub_region_rw_west_desc:0 "Italia, Gallia, Illyricum and Germania."
 LR_roman_world_sub_region_rw_east:0 "The East"
