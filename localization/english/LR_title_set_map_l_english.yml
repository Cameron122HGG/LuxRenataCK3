 LR_TSM_VIEW: "View:"
 LR_TSM_VIEW_LAND: "Land"
 LR_TSM_VIEW_LAND_TT: "Colour each county by the title set its de jure duchy, kingdom or empire belongs to."
 LR_TSM_VIEW_RULE: "Rule"
 LR_TSM_VIEW_RULE_TT: "Colour each county ruled under a held set title: in the set's colour if a native holds it, in red if an outsider does."
 LR_TSM_DESC_LAND: "Each county shows the set its de jure titles belong to. Counties that no restoration or reorganisation has moved into a set stay grey."
 LR_TSM_DESC_RULE: "Each county ruled under a held set title shows that set, or red if any holder of its set titles is an outsider under Foreign Administration."
 LR_TSM_PREVIEW: "Preview:"
 LR_TSM_SET_HELLENISTIC: "Hellenistic"
 LR_TSM_SET_HELLENISTIC_TT: "Show the whole Hellenistic set: hyparchies, satrapies and strategiai, as its restore decisions lay them out."
 LR_TSM_SET_ROMAN: "Roman"
 LR_TSM_SET_ROMAN_TT: "Show the whole Roman set: provinces, dioceses and praetorian prefectures, as its restore decisions lay them out."
 LR_TSM_SET_THEMES: "Themes"
 LR_TSM_SET_THEMES_TT: "Show the whole Themes set: themes, catepanates and exarchates, at their widest before the warlord map of 1060."
 LR_TSM_SET_PERSIAN: "Persian"
 LR_TSM_SET_PERSIAN_TT: "Show the whole Persian set: the tasūgs, šahrs and kusts of Ērānšahr, as their restore decision lays them out."
 LR_TSM_SET_HEBREW: "Israelite"
 LR_TSM_SET_HEBREW_TT: "Show the whole Israelite set: the medinot, mamlakhot and eretz of Mamlekhet Yisra'el, as their restore decision lays them out."
 LR_TSM_SET_BRYTHONIC: "Celtic"
 LR_TSM_SET_BRYTHONIC_TT: "Show the whole Celtic set: the old kingdoms of the Britons and the Gaels and their high-kingships, as their restore decision lays them out."
 LR_TSM_SET_GALATIAN: "Galatian"
 LR_TSM_SET_GALATIAN_TT: "Show the whole Galatian set: the tetrarchies and kingdoms of Trigalatia and Danuuia, as their restore decision lays them out."
 LR_TSM_SET_WARLORD: "Warlord"
