l_english:
 # LR Caesars (tools/cleave_caesars.py, 2026-11-24). GENERATED.
 trait_caesar: "Caesar"
 trait_caesar_desc: "This character was named Caesar, the junior emperor who rules a part of the Empire for an Augustus and hopes to succeed him."
 trait_caesar_character_desc: "[ROOT.Char.GetFirstName] was named Caesar: a junior emperor ruling a part of the Empire for an Augustus, and next in line for the purple."
 LR_caesar_male: "Caesar"
 LR_caesar_female: "Caesarissa"
 LR_caesar_appoint_tt: "#HIGH [new_holder.GetName]#! becomes #V Caesar#! of [caesar_command.GetName]: the command, your [counties|E] and titles in it, and your direct [vassal|E]s based there go to [new_holder.GetHerHim]. The command becomes a [de_jure|E] part of your Empire."
 LR_caesar.0001.t: "A Caesar for the Empire"
 LR_caesar.0001.desc: "One Augustus cannot watch every frontier. Diocletian gave each Augustus a Caesar, a junior emperor with his own command and the hope of the purple. Which part of the Empire shall be entrusted to a Caesar?"
 LR_caesar.0001.none: "Not now."
 LR_caesar.0002.t: "Who Shall Be Caesar?"
 LR_caesar.0002.desc: "[caesar_command.GetName] needs a Caesar. Blood, an imperial colleague, the strongest man on the spot, or a great house bound to the throne: each has its price."
 LR_caesar.0002.local: "[cand_local.GetName], the strongest of the lords there"
 LR_caesar.0002.family: "[cand_family.GetName], of my own blood"
 LR_caesar.0002.diarch: "[cand_diarch.GetName], my imperial colleague"
 LR_caesar.0002.house: "[cand_house.GetName], head of a great house"
 LR_caesar.0002.none: "No one is worthy. Not yet."
 LR_caesar.0003.t: "Caesar"
 LR_caesar.0003.desc: "[caesar_augustus.GetTitledFirstName] has named me Caesar over [caesar_command.GetName]. I rule it for the Augustus, and when the purple falls vacant, the army will remember who held the frontier."
 LR_caesar.0003.a: "Ave, Auguste."
 LR_caesar.0004.t: "A Usurper in the Purple"
 LR_caesar.0004.desc: "[usurper.GetTitledFirstName], whom I made Caesar, has let the soldiers hail [usurper.GetHerHim] Augustus. [usurper.GetSheHe|U] marches against me."
 LR_caesar.0004.a: "Then the gods will judge between us."
 LR_name_caesar_decision: "Name a Caesar"
 LR_name_caesar_decision_desc: "Give a junior emperor one of the Empire's great commands to rule in your name, as the Tetrarchs did."
 LR_name_caesar_decision_tooltip: "Name a Caesar over a part of the Empire"
 LR_name_caesar_decision_confirm: "Choose the Command"
 LR_debug_make_caesar_decision: "Debug: Make a Caesar"
 LR_debug_make_caesar_decision_desc: "Debug only. Choose any Roman command (taken from its holder if needed) and a Caesar for it, without the requirements of Name a Caesar. The command goes under your hegemony only if you hold one."
 LR_debug_make_caesar_decision_confirm: "Choose the Command"
 LR_debug_raise_college_cohesion_decision: "Debug: Raise College Cohesion"
 LR_debug_raise_college_cohesion_decision_desc: "Debug only. Your Imperial College gains #P 25#! cohesion (levels at 20, 45, 70 and 95; growth slows above 60)."
 LR_debug_raise_college_cohesion_decision_confirm: "Raise Cohesion"
 LR_debug_start_tetrarchy_decision: "Debug: Start a Tetrarchy"
 LR_debug_start_tetrarchy_decision_desc: "Debug only. Take the Roman Empire if you do not hold it, cleave it into two Augusti in one Imperial College, then each Augustus names a Caesar from any command, without requirements."
 LR_debug_start_tetrarchy_decision_confirm: "Start the Tetrarchy"
 LR_caesar.0091.t: "Debug: The Tetrarchy"
 LR_caesar.0091.desc: "The Empire is cleaved: [new_holder.GetTitledFirstName] becomes the other Augustus, the two halves join one Imperial College, and each Augustus then names a Caesar."
 LR_caesar.0091.a: "Two Augusti, two Caesars."
 LR_caesar.0091.b: "No one can be the other Augustus (no vassal, family or great house found)."
 LR_caesar.0090.t: "Debug: Make a Caesar"
 LR_caesar.0090.desc: "Every command is offered, whoever holds it and however little of it you rule. You get the counties and vassals you have there; the Caesar is chosen next."
 LR_name_caesar_decision_command_tt: "A command can be given: a Roman half, regional empire, restored prefecture or formed magisterium that is unheld or yours, without your capital, with a [county|E] of your own in it and at least half its [counties|E] in your [realm|E]"
 LR_name_caesar_decision_room_tt: "Fewer than two Caesars serve you"
 LR_name_caesar_decision_effect_tt: "Choose the command, then the Caesar"
 LR_caesar_proclaim_augustus_decision: "Proclaim Yourself Augustus"
 LR_caesar_proclaim_augustus_decision_desc: "Carausius did not wait for Maximian to die. Let the legions hail you Augustus and take the purple by the sword."
 LR_caesar_proclaim_augustus_decision_tooltip: "Break with your Augustus and fight for independence"
 LR_caesar_proclaim_augustus_decision_confirm: "Hail me Augustus!"
 LR_caesar_proclaim_augustus_decision_effect_tt: "You stop being Caesar, leave the Imperial College (its cohesion drops by #N 30#!), become #V Augustus#!, and go to war for your Augustus's Empire with a [pressed_claim|E] on it."
 LR_recall_caesar_interaction: "Recall the Caesar"
 LR_recall_caesar_interaction_desc: "Demand the Caesar's command back. If [recipient.GetSheHe] agrees, [recipient.GetSheHe] swears fealty to you with [recipient.GetHerHis] other lands. If [recipient.GetSheHe] refuses, [recipient.GetSheHe] leaves the Imperial College and you gain a [pressed_claim|E] on the command."
 LR_caesar_independent_tt: "[new_holder.GetName|U] rules as an #V independent#! Caesar, bound to you in the #V Imperial College#!: the college defends its members, and its cohesion decides whether the senior Caesar succeeds you"
 LR_caesar.0005.t: "The Purple Passes"
 LR_caesar.0005.desc: "The college stood in harmony, and the old law of the Tetrarchs held: the purple of my father went to his senior Caesar, [lr_promoted.GetTitledFirstName]. I rule what is mine as Caesar now, and my turn will come."
 LR_caesar.0005.a: "So the Tetrarchs ordained."
