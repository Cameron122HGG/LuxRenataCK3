l_english:
 # LR 2026-11-25: descriptions for vanilla's shared salary obligation levels (salary_*), used by the Gaul administrative,
 # Roman imperial, celestial, Japanese and meritocratic contracts. Vanilla never wrote them; kept neutral so they fit every one.
 salary_very_low_desc: "The office pays only a token salary. The liege's treasury is spared, but the official resents serving for so little."
 salary_low_desc: "The office pays a modest salary, somewhat less than its holder feels is owed."
 salary_medium_desc: "The office pays the customary salary for its rank."
 salary_high_desc: "The office pays a generous salary, earning the holder's gratitude at some cost to the liege."
 salary_very_high_desc: "The office pays a lavish salary, binding its holder closely to the liege who pays it."

 # LR 2026-11-25: salary-rank descriptions (the rank follows the official's highest title tier)
 roman_imperial_salary_rank_none_desc: "The official holds no rank in the imperial order, and draws no salary from the treasury."
 roman_imperial_salary_rank_egregius_desc: "As a count, the official is ranked among the #EMP egregii#!, the lowest grade of the equestrian order, and paid accordingly."
 roman_imperial_salary_rank_perfectissimus_desc: "As a duke, the official is ranked among the #EMP perfectissimi#!, the equestrians who govern provinces and command in the emperor's name."
 roman_imperial_salary_rank_clarissimus_desc: "As a king, the official is ranked among the #EMP clarissimi#!, the senatorial order, and paid the salary of a senator."
 roman_imperial_salary_rank_eminentissimus_desc: "As the holder of an empire, the official is ranked among the #EMP eminentissimi#!, the praetorian prefects who stand at the emperor's side."
 roman_dominate_salary_rank_none_desc: "The official holds no rank in the imperial order, and draws no salary from the treasury."
 roman_dominate_salary_rank_perfectissimus_desc: "As a count, the official is ranked among the #EMP perfectissimi#!, the lesser officials of the late imperial service."
 roman_dominate_salary_rank_clarissimus_desc: "As a duke, the official is ranked among the #EMP clarissimi#!, the senators who fill the governorships of the provinces."
 roman_dominate_salary_rank_spectabilis_desc: "As a king, the official is ranked among the #EMP spectabiles#!, the vicars of the dioceses and the great commanders."
 roman_dominate_salary_rank_illustris_desc: "As the holder of an empire, the official is ranked among the #EMP illustres#!, the prefects and great ministers of the sacred palace."
 meritocratic_salary_rank_none_desc: "The official holds no rank in the bureaucracy, and draws no salary from the treasury."
 meritocratic_salary_rank_county_desc: "The official is paid the salary of a prefecture, the lowest rank of territorial office."
 meritocratic_salary_rank_duchy_desc: "The official is paid the salary of a province, a rank of real authority over many prefectures."
 meritocratic_salary_rank_kingdom_desc: "The official is paid the salary of a circuit, one of the great regional offices of the realm."
 meritocratic_salary_rank_empire_desc: "The official is paid the salary of a great circuit, among the highest offices the realm can bestow."

 # LR 2026-11-25: treasury share levels (vanilla's shared treasury_* keys; Roman imperial, meritocratic, celestial)
 treasury_very_low_desc: "The office receives only a meagre allotment from the liege's treasury to run its affairs, and its holder resents it."
 treasury_low_desc: "The office receives a modest allotment from the liege's treasury, somewhat less than its holder would like."
 treasury_medium_desc: "The office receives the customary allotment from the liege's treasury."
 treasury_high_desc: "The office receives a generous allotment from the liege's treasury, to the holder's satisfaction."
 treasury_very_high_desc: "The office receives a lavish allotment from the liege's treasury, and its holder wants for nothing."

 # LR 2026-11-25: tribute from tributaries
 roman_imperial_tributary_tax_none_desc: "The tributary sends no gold to the emperor, keeping its friendship with Rome cheaply."
 roman_imperial_tributary_tax_low_desc: "The tributary sends a light yearly tribute in gold, enough to acknowledge the majesty of Rome."
 roman_imperial_tributary_tax_normal_desc: "The tributary sends the customary tribute in gold, as client kings have always paid to Rome."
 roman_imperial_tributary_tax_high_desc: "The tributary sends a heavy tribute in gold, filling the emperor's coffers at the cost of its goodwill."
 roman_imperial_prestige_transfer_none_desc: "The tributary owes no public homage to the emperor."
 roman_imperial_prestige_transfer_low_desc: "The tributary sends envoys and gifts now and then, a small acknowledgement of the emperor's majesty."
 roman_imperial_prestige_transfer_normal_desc: "The tributary sends regular embassies to the imperial court, and its submission adds to the emperor's glory."
 roman_imperial_prestige_transfer_high_desc: "The tributary humbles itself before the emperor at every turn, its rulers bowing in the imperial presence for all to see."
 meritocratic_tributary_tax_none_desc: "The tributary sends no gold to its overlord."
 meritocratic_tributary_tax_low_desc: "The tributary sends a light tribute in gold to its overlord."
 meritocratic_tributary_tax_normal_desc: "The tributary sends the customary tribute in gold to its overlord."
 meritocratic_tributary_tax_high_desc: "The tributary sends a heavy tribute in gold, at the cost of its goodwill."
 meritocratic_prestige_transfer_none_desc: "The tributary owes no public homage to its overlord."
 meritocratic_prestige_transfer_low_desc: "The tributary sends envoys and gifts now and then, a small acknowledgement of its overlord's standing."
 meritocratic_prestige_transfer_normal_desc: "The tributary sends regular embassies to its overlord's court, adding to the overlord's renown."
 meritocratic_prestige_transfer_high_desc: "The tributary humbles itself before its overlord at every turn, for all the world to see."
