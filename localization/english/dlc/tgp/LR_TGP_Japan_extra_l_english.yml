l_english:
unite_the_japanese_courts_decision:0 "Unite the Warring Courts of Japan"
unite_the_japanese_courts_decision_desc:0 "Whether from the North or South, we have reunited the two warring courts of Japan into the correct one: Ours! "
unite_the_japanese_courts_decision_confirm:0 "Great Japan is the divine land!"
unite_the_japanese_courts_decision_tooltip: "Unite the courts of Japan."
 unite_the_japanese_courts_own_throne_tt: "The Ten'nō of our court is our vassal"
 unite_the_japanese_courts_rival_court_tt: "The rival court is gone, or its regent is our vassal"
 unite_the_japanese_courts_effect_tt: "Our Ten'nō takes the one Chrysanthemum Throne and we become the rulers of all Japan. The Northern and Southern courts and thrones are dissolved."
