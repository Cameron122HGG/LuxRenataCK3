l_english: 

 #County Modifiers
 LR_tgp_sacral_gaul_fresh_fish_county_modifier: "Fresh Fish"
 LR_tgp_sacral_gaul_fresh_fish_county_modifier_desc: "The people of this county are supplied with freshly caught fish."
 LR_tgp_sacral_gaul_pearl_county_modifier: "Precious Pearls"
 LR_tgp_sacral_gaul_pearl_county_modifier_desc: "The divers of this county sometimes find pearls to sell."
 LR_tgp_sacral_gaul_abalone_temple_offerings_county_modifier: "Sacred Offerings"
 LR_tgp_sacral_gaul_abalone_temple_offerings_county_modifier_desc: "The divers of this county are selling abalone, which is believed to bring long lasting life."

 LR_tgp_sacral_gaul_taxed_entertainment_county_modifier: "Taxed Entertainment"
 LR_tgp_sacral_gaul_taxed_entertainment_county_modifier_desc: "In this county, no opportunity to weighten the state's pockets is overlooked, least of all the people's entertainment."

 LR_tgp_sacral_gaul_prized_generosity_county_modifier: "Prized Generosity"
 LR_tgp_sacral_gaul_prized_generosity_county_modifier_desc: "Few things do more to encourage healthy rivalries between villages than the promise of a prize when they compete, and the people of this county are well motivated indeed."

 LR_tgp_sacral_gaul_fire_drilled_county_modifier: "Fire Drilled Households"
 LR_tgp_sacral_gaul_fire_drilled_county_modifier_desc: "The households of this county have had the perils of flames deeply impressed upon them, and each is tasked with maintaining a bucket in case of an outbreak."

 LR_tgp_sacral_gaul_instructive_plays_county_modifier: "Instructive Morality Plays"
 LR_tgp_sacral_gaul_instructive_plays_county_modifier_desc: "People in this county are reminded of their place even when they seek to forget it through a few hours spent enjoying a play."

 #Character Modifiers
 tpg_gaul_hot_spring_relaxation_modifier: "Relaxed from Hot Springs"
 tpg_gaul_hot_spring_relaxation_modifier_desc: "This character has taken a restorative bath in natural hot springs."

 LR_tgp_sacral_gaul_hot_spring_mystic_positive_modifier: "Rejuvenating Spirit"
 LR_tgp_sacral_gaul_hot_spring_mystic_positive_modifier_desc: "This character understood how to align with their spiritual self."
 LR_tgp_sacral_gaul_hot_spring_mystic_neutral_modifier: "Skeptical Spirit"
 LR_tgp_sacral_gaul_hot_spring_mystic_neutral_modifier_desc: "This character felt #EMP something#!, but couldn't really figure out what."
 LR_tgp_sacral_gaul_hot_spring_mystic_negative_modifier: "Scattered Spirit"
 LR_tgp_sacral_gaul_hot_spring_mystic_negative_modifier_desc: "This character couldn't connect to the spiritual self."

 LR_tgp_sacral_gaul_sake_offering_county_modifier: "Wine Offering"
 LR_tgp_sacral_gaul_sake_offering_county_modifier_desc: "The ruler of this county showed respect to the deities during a festival celebration."

 #Character Modifiers
 LR_tgp_sacral_gaul_sake_offering_character_modifier: "Gift of Wine"
 LR_tgp_sacral_gaul_sake_offering_character_modifier_desc: "This character showed respect to the deities during a festival celebration."

 LR_tgp_sacral_gaul_tengu_rumors_character_modifier: "Spirit Rumors"
 LR_tgp_sacral_gaul_tengu_rumors_character_modifier_desc: "This character is still searching for a mountain spirit after hearing a rumor.\n\nIt is said that whoever comes across one and impresses them will be handsomely rewarded."

 LR_tgp_sacral_gaul_cautious_curiosity_character_modifier: "Cautious Curiosity"
 LR_tgp_sacral_gaul_cautious_curiosity_character_modifier_desc: "This character was recently tricked by a mere rumor."

 tpg_gaul_add_fish_to_pond_modifier: "Pond Teaming with Fish"
 tpg_gaul_add_fish_to_pond_modifier_desc: "This character's gardener has added extra fish to their pond, making it a popular place for courtiers to visit."

 LR_tgp_sacral_gaul_train_with_troops_modifier: "Inspired Troops"
 LR_tgp_sacral_gaul_train_with_troops_modifier_desc: "This character has given a speech, inspiring their troops before any battle to come."

 tgp_learned_from_onibi_modifier: "Learned From Spirit Fire"
 tgp_learned_from_onibi_modifier_desc: "This character has gleaned insight from their discussion on mysterious spirit flames"

 tgp_buddhist_fighting_modifier: "Religious Infighting"
 tgp_buddhist_fighting_modifier_desc: "This character sat idly while various religious sects fought for control in their realm."

 tgp_siren_yokai_love_modifier: "In Pursuit of Love"
 tgp_siren_yokai_love_modifier_desc: "This character has been inspired by a supernatural spirit to find love."

 tgp_siren_yokai_prose_modifier: "Aspiring Storyteller"
 tgp_siren_yokai_prose_modifier_desc: "This character is inspired by the songs they dreamed a spirit singing to them. They will now author their own stories."

 tgp_garden_yokai_bloom_modifier: "Blooming Garden"
 tgp_garden_yokai_bloom_modifier_desc: "This character believes they saw a spirit inspiring them invest in their garden."

 tgp_garden_yokai_building_modifier: "Aspiring Architect"
 tgp_garden_yokai_building_modifier_desc: "This character believes they saw a spirit inspiring them to build structures in their realm."

 tgp_shadow_yokai_imitation_modifier: "Intimidating Presence"
 tgp_shadow_yokai_imitation_modifier_desc: "This character carries an intimidating presence, believing they have a supernatural ally"

 tgp_shadow_yokai_torch_modifier: "Extra Patrols"
 tgp_shadow_yokai_torch_modifier_desc: "This character believes a spirit has possessed their shadow and is increasing defenses in their realm."

 tgp_shrine_heir_modifier: "Dynastic Favor"
 tgp_shrine_heir_modifier_desc: "This character prayed at a sacred site and reflected they should invest in securing the future of their family."

 tgp_shrine_piety_modifier: "Faithful Servant"
 tgp_shrine_piety_modifier_desc: "This character has strengthened their faith from praying at a sacred site."

 tgp_shrine_wealth_modifier: "Economic Prosperity"
 tgp_shrine_wealth_modifier_desc: "This character prayed at a sacred site and reflected they should invest in increasing their wealth."

 tgp_shrine_health_modifier: "Strengthened Body"
 tgp_shrine_health_modifier_desc: "This character prayed at a sacred site and reflected they should invest in their health."

 tgp_traveling_safe_modifier: "Cautious Traveler"
 tgp_traveling_safe_modifier_desc: "This character is being cautious while traveling, avoiding any potential dangers without sacrificing speed."

 tgp_rule_follower_modifier: "Obedient Subject"
 tgp_rule_follower_modifier_desc: "This ruler follows the laws of their overlord, and in turn, their subjects will fall in line."

 tgp_attentive_care_modifier: "Attentive Care"
 tgp_attentive_care_modifier_desc: "This character is having their needs looked after."

 tgp_neglected_modifier: "Neglected"
 tgp_neglected_modifier_desc: "This character's health is of secondary importance."

 tgp_law_defender: "Law Enforcement"
 tgp_law_defender_desc: "This character makes sure all criminals serve their sentence."

 tgp_temple_builder_modifier: "Sacred Site Builder"
 tgp_temple_builder_modifier_desc: "This character recently rebuilt a sacred site that was lit ablaze."

 tgp_rebuilder_modifier: "Aspiring Architect"
 tgp_rebuilder_modifier_desc: "This characer strives to build non-religious buildings.\n\n#warning Cannot build [temples|E]!#!"

 tgp_burned_yokai_modifier: "Spirit Hunter"
 tgp_burned_yokai_modifier_desc: "This character has become more wary of supernatural spirits as of late."

 tgp_burned_weather_modifier: "Fortified Buildings"
 tgp_burned_weather_modifier_desc: "This character has fortified their buildings against natural calamities.\n[development|E] loss from [natural_disasters|E]: #P -20%#!"

 tgp_faith_defender_modifier: "Heretic Basher"
 tgp_faith_defender_modifier_desc: "This character does not take kindly to non-believers."

 tgp_people_mingler_modifier: "Magnanimous Rule"
 tgp_people_mingler_modifier_desc: "This character has displayed magnanimity at their court."

 tgp_scheme_wary_modifier: "Private Investigator"
 tgp_scheme_wary_modifier_desc: "This character has personal insights on secrets in their court."

 tgp_fertility_boost_modifier: "Potent Loins"
 tgp_fertility_boost_modifier_desc: "This character puts extra focus into creating an heir."

 tgp_longer_life_modifier: "Enduring Ruler"
 tgp_longer_life_modifier_desc: "Despite their old age, this ruler strives to live a long life."

 tgp_guilt_fever_modifier: "Guilt Fever"
 tgp_guilt_fever_modifier_desc: "This character has been burdened with the consequences of their actions."

 tgp_reflection_modifier: "Path of Fate"
 tgp_reflection_modifier_desc: "This character has been quite reflective recently, and is more open to explore their faith.\n[pilgrimage|E] Cost: #P -20%#!"

 LR_tgp_sacral_gaul_drafted_villagers_modifier: "Drafted Villagers"
 LR_tgp_sacral_gaul_drafted_villagers_modifier_desc: "This character has an eye for talent, and there's always a use to be found for brawny villagers."

 LR_tgp_sacral_gaul_precise_insight_modifer: "Precise Insight"
 LR_tgp_sacral_gaul_precise_insight_modifer_desc: "This character can glean strategic insights from even the most common of places, and then apply that knowledge under more martial circumstances."

 LR_tgp_sacral_gaul_banisher_of_demons_modifer: "Banisher of Demons"
 LR_tgp_sacral_gaul_banisher_of_demons_modifer_desc: "Masquerade or no, banishing the torch-wielding "demons" of the night has bolstered this character's reputation."

 LR_tgp_sacral_gaul_lucky_fan_fragments_modifier: "Fortunate Target Fragments"
 LR_tgp_sacral_gaul_lucky_fan_fragments_modifier_desc: "This character may not have won the prize in archery, but they did take home one of the pieces of the target, said to bring good fortune to those who pocket them."

 LR_tgp_sacral_gaul_a_poetic_life_modifier: "A Poetic Life"
 LR_tgp_sacral_gaul_a_poetic_life_modifier_desc: "This character has prioritized living a poetic life. They are open to new experiences and others seek to have experiences with them."
 LR_tgp_sacral_gaul_made_high_liege_cuckold_modifier: "A Poetic Life: Imperial Immortality"
 LR_tgp_sacral_gaul_made_high_liege_cuckold_modifier_desc: "This character immortalized themselves by laying with a spouse of their liege. This experience will further inspire their poetic output."

 LR_tgp_sacral_gaul_exchanged_verses_modifier: "A Poetic Life: Exchanged Verses"
 LR_tgp_sacral_gaul_exchanged_verses_modifier_desc: "This character expanded their repertoire, through a poetic union."

 LR_tgp_sacral_gaul_poetic_to_the_powerful_modifier: "Poet to the Powerful"
 LR_tgp_sacral_gaul_poetic_to_the_powerful_modifier_desc: "This character improved their relationship to an important figure by employing a clever verse."

 LR_tgp_sacral_gaul_poet_poisonous_flowers_modifier: "Poisonous Flowers"
 LR_tgp_sacral_gaul_poet_poisonous_flowers_modifier_desc: "This character is has collected some toxic flowers, for what purpose, who can guess..."
 LR_tgp_sacral_gaul_poet_medicinal_flowers_modifier: "Medicinal Flowers"
 LR_tgp_sacral_gaul_poet_medicinal_flowers_modifier_desc: "This character is has collected some medicinal flowers, to better their health."

 LR_tgp_sacral_gaul_made_poetic_life_artifact_modifier: "A Poetic Life: A Thousand Immortal Leaves"
 LR_tgp_sacral_gaul_made_poetic_life_artifact_modifier_desc: "This character created a pillar of [culture|E] through their poetic output."

 tgp_sharing_power_modifier: "Sharing Power"
 tgp_sharing_power_modifier_desc: "This character is sharing power to alleviate stress."

 tgp_power_undermined_modifier: "Power Undermined"
 tgp_power_undermined_modifier_desc: "This character has had their power undermined by an external power.\n@declare_regent_icon! Declare me Regent Acceptance: #P +25#!"

 tgp_spreading_scholarly_work_modifier: "Spreading Scholarly Work"
 tgp_spreading_scholarly_work_modifier_desc: "This character is encouraging scholars to write records and reports across their realm."

 tgp_regent_minted_coin_modifier: "Minted Coin"
 tgp_regent_minted_coin_modifier_desc: "This character minted some coin with their likeness."

 tgp_regent_history_modifier: "Encouraged Scholars"
 tgp_regent_history_modifier_desc: "This character encouraged scholars and poets to write about their greatness."

 tgp_regent_guarded_modifier: "Morale Booster"
 tgp_regent_guarded_modifier_desc: "This character knows how to influence military commanders and warriors."

 tgp_stability_tree_modifier: "Strong Roots"
 tgp_stability_tree_modifier_desc: "Like the roots of a tree, this character's realm and court are stable."

 tgp_health_resistance_modifier: "Fortified Health"
 tgp_health_resistance_modifier_desc: "This character ate sacred food while praying with a holy person, this dietary improvement has improved their health."

 tgp_cultural_appreciation_modifier: "Linguistic Appreciation"
 tgp_cultural_appreciation_modifier_desc: "This character acknowledges the difference between different languages."
 
 LR_tgp_sacral_gaul_duelist: "Mighty Warrior"
 LR_tgp_sacral_gaul_duelist_desc: "Strong as a mountain cat, this character will keep searching for stronger opponents to duel.\n$stay_duelist_adventurer$"

 LR_tgp_sacral_gaul_duelist_2: "$LR_tgp_sacral_gaul_duelist$"
 LR_tgp_sacral_gaul_duelist_2_desc: "Strong as a mountain cat, this character will keep searching for stronger opponents to duel.\n$stay_duelist_adventurer$"

 LR_tgp_sacral_gaul_duelist_3: "$LR_tgp_sacral_gaul_duelist$"
 LR_tgp_sacral_gaul_duelist_3_desc: "Strong as a mountain cat, this character will keep searching for stronger opponents to duel.\n$stay_duelist_adventurer$"

 LR_tgp_sacral_gaul_duelist_4: "$LR_tgp_sacral_gaul_duelist$"
 LR_tgp_sacral_gaul_duelist_4_desc: "Strong as a mountain cat, this character will keep searching for stronger opponents to duel.\n#help The full potential of this character has been reached#!"

 LR_tgp_sacral_gaul_control_over_sacral_king: "Puppeteer of the Sacred Throne"
 LR_tgp_sacral_gaul_control_over_sacral_king_desc: "This character has placed a compliant Merovingian on the throne."

 LR_tgp_sacral_gaul_fujiwara_hidehira_back_in_town: "By the Spear"
 LR_tgp_sacral_gaul_fujiwara_hidehira_back_in_town_desc: "This character wishes to restore their chateau to power by force."

 tgp_moved_apuquispay_court_modifier: "Capital of Military Rule"
 tgp_moved_apuquispay_court_modifier_desc: "This county is being established as a new capital for military rule, away from Cusco."


 tgp_festival_prosperity: "Festival Prosperity"
 tgp_festival_prosperity_desc: "This county has hosted a prosperous festival"
 