l_english:
 ##################################################
 # GALLIC REGENT FACTION
 ##################################################
 replace_ceremonial_regent_faction_name: "Install $game_concept_ceremonial_regent$"
 replace_ceremonial_regent_faction: "$replace_ceremonial_regent_faction_name$ Faction"
 replace_ceremonial_regent_faction_desc: "Members of the $replace_ceremonial_regent_faction_name$ [faction|E] seek to forcibly oust the current [ceremonial_regent|E].\n\n#S Ultimatum#!\n$replace_ceremonial_regent_faction_desc_sacral_king_gaul$"
 replace_ceremonial_regent_faction_desc_emperor: "The Faction Leader replaces the current [ceremonial_regent|E], takes all their [landed|E] [titles|E], and may become [cloistered_emperor|E] or attempt to re-establish direct imperial rule"
 replace_ceremonial_regent_faction_desc_sacral_king_gaul: "The Faction Leader replaces the current [ceremonial_regent|E], and takes all their [landed|E] [titles|E]"
 replace_ceremonial_regent_faction_short_effect_desc_emperor: "Wants to be installed as [cloistered_emperor|E]"
 replace_ceremonial_regent_faction_short_effect_desc_regent: "Wants to be installed as [ceremonial_regent|E]"
 FACTION_GALLIC_REPLACE_REGENT_NAME_DYNAMIC: "Install [ROOT.Faction.GetSpecialCharacter.GetShortUINameNotMe|U] as $game_concept_ceremonial_regent$"
 FACTION_GALLIC_REPLACE_REGENT: "$replace_ceremonial_regent_faction_name$ Demand"
 FACTION_GALLIC_REPLACE_REGENT_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nThe loyal nobles of [faction_target.GetPrimaryTitle.GetNameNoTierNoTooltip] have no confidence in your intolerable regency! Relinquish your power to me, or face our swords on the battlefield!"
 FACTION_GALLIC_REPLACE_RULER_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nThe loyal nobles of [faction_target.GetPrimaryTitle.GetNameNoTierNoTooltip] have no confidence in your unguided despotic rule! Delegate your powers to me, or face our swords on the battlefield!"
 FACTION_GALLIC_REPLACE_REGENT_ACCEPTED: "$replace_ceremonial_regent_faction_name$ Demands Accepted"
 FACTION_GALLIC_REPLACE_REGENT_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nYour brazen and shameless attempts at power-grab will only weaken [faction_target.GetPrimaryTitle.GetNameNoTier]. However, to avoid needless bloodshed, I will accept your demands..."
 FACTION_GALLIC_REPLACE_REGENT_REFUSED: "$replace_ceremonial_regent_faction_name$ Demands Refused"
 FACTION_GALLIC_REPLACE_REGENT_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nYour ridiculous attempt at intimidation will never succeed. I am the rightful [faction_target.GetTitleAsNameNoTooltip] of [faction_target.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]! All traitors shall meet justice — on the battlefield if needs-be!"
 FACTION_GALLIC_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION: "The Regent Must Fall!"
 FACTION_GALLIC_REPLACE_REGENT_SEND_DEMAND_NOTIFICATION_DESC: "The moment has come! The lords of the [faction.GetName] agree that [faction_target.GetName] is a despot who must yield [faction_target.GetHerHis] power — at sword point, if needs-be!"
 cannot_create_claimant_faction_against_sacral_king_gaul_tooltip: "[claimant|E] [factions|E] cannot be created against a [ceremonial_regent|E]"
 FACTIONS_WINDOW_GALLIC_REGENT: "Challenger"
 replace_ceremonial_regent_faction_sacral_king_gaul_trigger: "Only a [sacral_king_gaul|E] or [joko|E] can be replaced"
 not_house_head_allied_to_faction_target_trigger: "You cannot be a member of the [faction|E] target's house"
 not_house_member_of_faction_target_trigger: "Your [house_head|E] cannot have an [alliance|E] with the [faction|E] target"
 must_be_leading_house_of_bloc_trigger: "In [governments|E] with [house_blocs|E], only [house_heads|E] of a $game_concept_bloc_possessive$ [leading_house|E] may create [factions|E] against the [top_liege|E]"
 ##################################################
 # RESTORE SACRAL_KING FACTION
 ##################################################
 FACTION_GALLIC_RESTORE_SACRAL_KING_NAME_DYNAMIC: "Restore [ROOT.Faction.GetSpecialCharacter.GetShortUINameNotMe|U]"
 FACTION_GALLIC_RESTORE_SACRAL_KING: "$restore_ceremonial_liege_faction_name$ Demand"
 FACTION_GALLIC_RESTORE_SACRAL_KING_DESC: "[faction_leader.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nYour tyranny over the [ROOT.Char.Custom('GetTitleTierAdjective')] court, royal family, and all [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], must end.\n\nStand aside for our true ruler, [faction.GetSpecialCharacter.GetTitledFirstName]!"
 FACTION_GALLIC_RESTORE_SACRAL_KING_ACCEPTED: "$restore_ceremonial_liege_faction_name$ Demands Accepted"
 FACTION_GALLIC_RESTORE_SACRAL_KING_ACCEPTED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nI have only the best interests of the [ROOT.Char.Custom('GetTitleTierAdjective')] court, royal family, and all [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], at heart!\n\nThough I question your motives, I shall not stand in the way of the [faction.GetSpecialCharacter.GetTitledFirstName]."
 FACTION_GALLIC_RESTORE_SACRAL_KING_REFUSED: "$restore_ceremonial_liege_faction_name$ Demands Refused"
 FACTION_GALLIC_RESTORE_SACRAL_KING_REFUSED_DESC: "[faction_target.Custom2('AppropriateGreetingNegative', ROOT.Char)]\n\nSuch insolence! I have only the best interests of the [ROOT.Char.Custom('GetTitleTierAdjective')] court, royal family, and all [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], at heart!\n\nYou and your band of traitors will pay for staining the [faction.GetSpecialCharacter.GetTitleAsNamePossessiveNoTooltip] honor!"
 FACTION_GALLIC_RESTORE_SACRAL_KING_SEND_DEMAND_NOTIFICATION: "$restore_ceremonial_liege_faction_name$ "
 FACTION_GALLIC_RESTORE_SACRAL_KING_SEND_DEMAND_NOTIFICATION_DESC: "[faction_leader.Custom2('AppropriateGreetingPositive', ROOT.Char)]\n\n[faction_target.GetTitledFirstNamePossessive] tyranny over the [ROOT.Char.Custom('GetTitleTierAdjective')] court, royal family, and all [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], must end.\n\nWe must be ready to fight to restore our true ruler, [faction.GetSpecialCharacter.GetTitledFirstName]!"
 FACTIONS_WINDOW_GALLIC_RESTORE_SACRAL_KING: "[ceremonial_liege|E]"
 sacral_policy_faction_war: "Sacral Policy Faction"
 sacral_policy_WAR_NAME: "Sacral Policy War"
 sacral_policy_war_victory_desc: "[attacker.GetShortUIName|U] will select a new [sacral_policy|E]"
 sacral_policy_war_white_peace_end_desc: "[defender.GetShortUIName|U] gets a truce and a [revoke_title_reason|E] against all rebelling vassals."
 sacral_policy_war_defeat_end_desc: "[defender.GetShortUIName|U] imprisons every rebellious vassal and gains a [revoke_title_reason|E] against each of them."