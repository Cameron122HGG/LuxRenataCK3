l_english: 
#GAUL
 game_concept_gaul_administrative:0 "Gaul Administrative"
 game_concept_palatine_government:0 "Palatine"
 game_concept_palatine_government_desc:0 "Palatine is a [government_form|E] in which the amount of [levies|E] and [taxes|E] given to a [liege|E] by their [vassals|E] is determined by the [aptitude|E] of said Liege's [palatine|E]."
 game_concept_palatine:0 "@government_type_palatine! Palatine"
 game_concept_palatine_i:0 "@government_type_palatine!"
 game_concept_procurator:0 "Procurator"
 game_concept_procurator_desc:0 "The Procurator is a low-ranking official in the Gaul Administrative government, responsible for overseeing the collection of levies and taxes from vassals on behalf of the liege. The Procurator's aptitude directly influences the amount of resources that the liege can extract from their vassals, making this position crucial for the financial stability and military strength of the realm."

 game_concept_gaul_feudal:0 "Gaul Feudal"
 game_concept_manorial:0 "@government_type_manorial! Manorial"
 game_concept_manorial_i:0 "@government_type_manorial!"
 game_concept_manorial_desc:0 "Manorial is a [government_form|E] in which the amount of [levies|E] and [taxes|E] given to a [liege|E] by their [vassals|E] is determined by the [aptitude|E] of said Liege's Regulus."
 game_concept_manorial_government:0 "Manorial"
 game_concept_manorial_government_desc:0 "Manorial is a [government_form|E] in which the amount of [levies|E] and [taxes|E] given to a [liege|E] by their [vassals|E] is determined by the [aptitude|E] of said Liege's [manorial|E]."
 game_concept_regulus:0 "Regulus"
 game_concept_regulus_desc:0 "The Regulus is a low-ranking official in the Gaul Feudal government, responsible for overseeing the collection of levies and taxes from vassals on behalf of the liege. The Regulus's aptitude directly influences the amount of resources that the liege can extract from their vassals, making this position crucial for the financial stability and military strength of the realm." 

 game_concept_magister_militum: "Magister Militum"
 game_concept_magister_militum_possessive: "Magister Militum's"
 game_concept_magister_militum_desc: "The Magister Militum is, de facto, the highest position in the [palatine|E] bureaucracy, exercising significant control over the organs of state in the [sacral_king_gaul_possessive|E] stead.\n\nWith enough [influence|E] and [prestige|E], any noble family might rise to the occasion."
 
 game_concept_sacral_majordomo: "Mayor of the Palace"
 game_concept_sacral_majordomo_possessive: "Mayor's"
 game_concept_sacral_majordomo_desc: "A $game_concept_sacral_majordomo$, or just Mayor, is the de facto [manorial|E] ruler of all Tawantinsuyu, who has consolidated their position to the point their succession is hereditary, and reigns in the [sacral_king_gaul_possessive|E] stead."
 
 game_concept_sacral_king_gaul: "Sacral King of Gaul"
 game_concept_sacral_king_gaul_possessive: "Sacral King's"
 game_concept_sacral_king_gaul_desc: "The $game_concept_sacral_king_gaul$ is the official Monarch of all Gaul, considered by the people of Gaul to be a legitimate descendant of the sun god Inti."
 
 game_concept_sacral_manor: "Sacral Manor"
 game_concept_sacral_manor_desc: "The $game_concept_sacral_manor$ is a [holding|E] type that can be built in the [counties|E] of Gaul. It represents the traditional manorial system of Gaul, where a noble family would manage their lands and resources to provide for their vassals and subjects. The $game_concept_sacral_manor$ is a symbol of the feudal structure of Gaul, with its emphasis on land ownership, agricultural production, and the relationship between lords and peasants."
 game_concept_sacral_manors: "Sacral Manors"
 game_concept_sacral_manor_building: "Sacral Manor Building"
 game_concept_sacral_manor_building_desc: "The $game_concept_sacral_manor_building$ is a [building|E] type that can be constructed within a $game_concept_sacral_manor$. It serves as the central hub of the manor, where the lord and their family reside, and where administrative and economic activities take place. The $game_concept_sacral_manor_building$ is a symbol of the lord's authority and status within the feudal system of Gaul, and it plays a crucial role in the management of the manor's resources and the well-being of its inhabitants."

 game_concept_sacral_manor_buildings: "Sacral Manor Buildings"
 game_concept_sacral_bureaucracy: "Sacral Bureaucracy"
 game_concept_sacral_bureaucracy_desc: "$game_concept_sacral_bureaucracy$ represents a [ritsuryo_government|E] [realm_possessive|E] level of centralization and the general power that the [ruler|E] wields over their [vassals|E].\n\nOnly the [top_liege|E] can change $game_concept_japanese_bureaucracy$. Japanese $game_concept_vassals$ use the same level as their $game_concept_liege$.\n\nThere are four levels of $game_concept_japanese_bureaucracy$:\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_0$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_1$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_2$\n$EFFECT_LIST_BULLET$$japanese_bureaucracy_3$\n\nIncreasing $game_concept_japanese_bureaucracy$ costs an amount of [prestige|E] depending on [realm_size|E] and the ruler's [learning_skill|E]."

 game_concept_cloistered_sacral_king_gaul: "Cloistered Sacral King of Gaul"
 game_concept_cloistered_sacral_king_gaul_possessive: "Cloistered Sacral King's"
 game_concept_cloistered_sacral_king_gaul_desc: "A $game_concept_cloistered_sacral_king_gaul$ is a retired [sacral_king_gaul|E] who govern as de facto [ceremonial_regent|E] for the reigning High King of Gaul.\n\nTo become $game_concept_cloistered_sacral_king_gaul$, a High King of Gaul must abdicate the #V Sacral Throne#! and become a Monk."
 
 game_concept_low_king: "Low King" # 上皇
 game_concept_low_king_possessive: "Low King's" # 上皇
 
 game_concept_restored_sacral_king_gaul: "Restored Sacral King of Gaul"
 game_concept_restored_sacral_king_gaul_possessive: "Restored Sacral King of Gaul's"
 game_concept_restored_sacral_king_gaul_desc: "A $game_concept_restored_emperor$ is a [tenno|E] who governs independently of a [ceremonial_regent|E].\n\nTo become a $game_concept_restored_sacral_king_gaul$, a [tenno|E] may be installed by a $restore_ceremonial_liege_faction_name$ [faction|E], or use the [GetDecisionWithKey('tgp_japan_emperor_restoration_decision').GetName] [decision|E] after becoming [ceremonial_regent|E]."
 

 game_concept_rex_christ_gaul: "Sanctus Rex"
 game_concept_rex_christ_gaul_possessive: "Sanctus Rex's"
 # Royal Policies
 game_concept_sacral_policy: "Sacral Policy"
 game_concept_sacral_policies: "Sacral Policies"
 game_concept_sacral_policy_desc: "The $game_concept_sacral_policy$ is a [law|E] set by the [top_liege|E] of Gaul that applies to all [vassals|E]. Different policies may restrict or allow actions, or bestow [realm|E]-wide effects."
 game_concept_sacral_king: "Sacral King"
 game_concept_sacral_king_possessive: "Sacral King's"
