 ##################################################
 # GAUL DECISIONS 
 ##################################################
 # Establish House Fief
 LR_tgp_gaul_establish_house_fief_decision: "Establish $sacral_feudal_government_adjective$ Estate"
 LR_tgp_gaul_establish_house_fief_decision_desc: "The old sacral administration is crumbling under myriad crises and the unfettered ambition of our age. To ensure my family's future, and bring stability to the provinces, a permanent base must be established."
 LR_tgp_gaul_establish_house_fief_decision_tooltip: "Rule your [governorship|E] as a personal estate, rejecting central oversight"
 LR_tgp_gaul_establish_house_fief_decision_confirm: "$LR_tgp_gaul_establish_house_fief_decision$"
 LR_tgp_gaul_establish_house_fief_domicile_in_governorship_trigger: "Your [domicile|E] must be within a held [county|E] [governorship|E]"
 LR_tgp_gaul_establish_house_fief_aspiration_trigger: "Your [house|E] must not have the [GetHouseAspiration( 'service' ).GetName|V] or [GetHouseAspiration( 'ceremony' ).GetName|V] [house_aspiration|E]"
 LR_tgp_gaul_establish_house_fief_domicile_building_trigger: "Your [domicile|E] must have a [GetDomicileBuilding('sacral_manor_main_02').GetName] [domicile_building|E] or higher"
 LR_tgp_gaul_establish_house_fief_capital_domicile_trigger: "Your [domicile|E] must NOT be in the [capital|E] [county|E] of [THIS.Char.GetTopLiege.GetPrimaryTitle.GetNameNoTier] #weak ([THIS.Char.GetTopLiege.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier])#!"
 LR_tgp_gaul_establish_house_fief_centralization_trigger: "Your [top_liege|E] must not have the [GetLaw('sacral_bureaucracy_3').GetName] [law|E]"
 LR_tgp_gaul_establish_house_fief_direct_descendent_position_trigger: "You must not have a direct descendant who is a [governor|E]"
 LR_tgp_gaul_establish_house_fief_found_house_effect: "As your [dynast|E] is [administrative|E], you found a new [dynasty|E]"
 LR_tgp_gaul_establish_house_fief_change_government_type_effect: "You adopt the [manorial|E] government"
 LR_tgp_gaul_establish_house_fief_direct_descendents_effect: "All direct descendants will join your [house|E]"
 LR_tgp_gaul_establish_house_fief_mayor_gaul_crime_effect: "@warning_icon! #X The [ceremonial_regent|E] is [palatine|E] and will consider this a [crime_i|E][crime|E]#!\n#HELP Permission may be gained via [petition_liege|E]#!"
 LR_tgp_gaul_establish_house_fief_castle_effect: "Every held [county|E] [capital|E] [holding|E] is replaced with a [castle|E]"
 LR_tgp_gaul_establish_house_fief_mayor_gaul_toast: "Governor Declares Estate"
 LR_tgp_gaul_house_fief_created_title: "New Sacral Estate Created"
 LR_tgp_gaul_house_fief_established_title: "Sacral Estate Established"
 LR_tgp_gaul_house_created_desc_fief: "[new_head.GetShortUIName|U] [CharHaveHas(new_head)] established the [new_head.GetHouse.GetBaseName] estate in [new_head.GetCapitalLocation.GetTitle.GetDeJureLiege.GetNameNoTier]"
 LR_tgp_gaul_house_created_desc_cadet: "[new_head.GetShortUIName|U] [CharHaveHas(new_head)] split from [house|E] [old_head.GetHouse.GetBaseName]"
 LR_tgp_gaul_establish_manorial_manor_decision: "Abandon the Administration"
 LR_tgp_gaul_establish_manorial_manor_decision_desc: "$LR_tgp_gaul_establish_house_fief_decision_desc$"
 LR_tgp_gaul_establish_manorial_manor_decision_tooltip: "Forgo the old ways and establish a [manorial|E] [house|E]"
 LR_tgp_gaul_establish_manorial_manor_decision_confirm: "$LR_tgp_gaul_establish_house_fief_decision$"
 
 # Establish Military Rule
 LR_tgp_gaul_become_sacral_dictator_decision_TUTORIAL: "Formalize [GetPlayer.GetHouse.GetNameNoTooltip] Military Rule"
 LR_tgp_gaul_become_sacral_dictator_decision: "Formalize [ROOT.Char.GetHouse.GetNameNoTooltip] Military Rule"
 LR_tgp_gaul_become_sacral_dictator_decision_desc: "The endless politicking of the sacral court has run its course, undermined by the pageantry and trappings of days past. A strong hand must establish a new order — of service, family, and steel."
 LR_tgp_gaul_become_sacral_dictator_decision_tooltip: "Strengthen military power over [GetTitleByKey('e_sacral_kingdom_gaul').GetBaseNameNoTier]"
 LR_tgp_gaul_become_sacral_dictator_decision_confirm: "Establish lasting military rule"
 LR_tgp_gaul_no_other_powerful_forces_trigger: "No landed [vassals|E] of [GetTitleByKey('e_sacral_kingdom_gaul').GetBaseNameNoTier] with greater than #V 50%#! of your total military strength (including their allies) are not your [ally|E], [house|E] member, or [hooked|E] #weak (Current: [SCOPE.ScriptValue('japanese_shogun_opposition_vassals_value')|0V])#!"
 LR_tgp_gaul_become_sacral_dictator_decision_hoken_county_trigger: "No [de_jure|E] [counties|E] of [GetTitleByKey('e_sacral_kingdom_gaul').GetBaseNameNoTier] are held by [GetGovernment('sacral_administrative_government').GetName] [government|E] [vassals|E] #weak (Current: [SCOPE.ScriptValue('tgp_japan_shogunate_ritsuryo_county_current_value')|0V])#!"
 LR_tgp_gaul_become_sacral_dictator_decision_centralization_trigger: "You have at least [GetLaw('sacral_bureaucracy_2').GetName] [law|E]"
 LR_tgp_gaul_become_sacral_dictator_decision_top_liege_trigger: "You are the [ceremonial_regent|E] of [GetTitleByKey('e_sacral_kingdom_gaul').GetBaseNameNoTier]"
 LR_tgp_gaul_become_sacral_dictator_decision_land_trigger: "The [duchies|E] of [GetTitleByKey('d_aquitaine').GetBaseNameNoTier], [GetTitleByKey('d_languedoc').GetBaseNameNoTier], [GetTitleByKey('d_valois').GetBaseNameNoTier], [GetTitleByKey('d_brittany').GetBaseNameNoTier], and [GetTitleByKey('d_normandy').GetBaseNameNoTier] are all completely within the [realm|E] of [GetTitleByKey('e_sacral_kingdom_gaul').GetBaseNameNoTier]"
 LR_tgp_gaul_become_sacral_dictator_decision_vassal_revocation_effect: "All [titles|E] held by [GetGovernment('sacral_administrative_government').GetName] [government|E] [vassals|E] are revoked"
 LR_tgp_gaul_become_sacral_dictator_decision_dynasty_split_effect: "All [dynasties|E] with more than a single living [house|E] will split"
 unlocks_lux_tradition_LR_tgp_sacred_chivalry_tooltip: "Unlocks the [GetCultureTradition('lux_tradition_LR_tgp_sacred_chivalry').GetName] [tradition|E]"
 lux_tradition_LR_tgp_sacred_chivalry_tt: "[THIS.Culture.GetName] [culture_possessive|E] [GetCultureTradition('lux_tradition_LR_tgp_sacral_harmony').GetName] [tradition|E] is replaced by [GetCultureTradition('lux_tradition_LR_tgp_sacred_chivalry').GetName]"

 
 # Sacral King Restoration
 LR_tgp_gaul_sacral_king_restoration_decision: "Restore Direct Sacral Rule"
 LR_tgp_gaul_sacral_king_restoration_decision_desc: "I've watched for too long from within Paris while my authority is usurped by warmongers. No more. It is time to take my place as Sacral King, restoring divine dignity and stabilizing the realm."
 LR_tgp_gaul_sacral_king_restoration_decision_tooltip: "Restore the ancient rule of the $game_concept_sacral_king_gaul$"
 LR_tgp_gaul_sacral_king_restoration_decision_confirm: "Not as symbol, but as sovereign"
 LR_tgp_gaul_sacral_king_restoration_decision_faction_effect: "#X [vassals|E] are more likely to join the #V $replace_ceremonial_regent_faction_name$#! [faction|E]"
 # Sacral Branch (Minamoto/Taira)
 LR_tgp_gaul_sacral_branch_decision: "Request Sacral Branch Status"
 LR_tgp_gaul_sacral_branch_decision_desc: "Though Christ's blood flows in my veins, my destiny lies beyond Paris. I leave my royalty behind, that the deeds of a new noble line may echo louder in the annals of these mountains."
 LR_tgp_gaul_sacral_branch_decision_tooltip: "Create or join a collateral or provincial [house|E]"
 LR_tgp_gaul_sacral_branch_decision_confirm: "Relinquish the [ROOT.Char.GetHouse.GetBaseNameNoTooltip] name"
 LR_tgp_gaul_sacral_branch_decision_emperor_ancestor_trigger: "You are at least a great-grandchild of a past [ceremonial_liege|E]"
 LR_tgp_gaul_sacral_branch_decision_sacral_heir_trigger: "You are not in the [ceremonial_liege_possessive] [line_of_succession|E]"
 LR_tgp_gaul_sacral_branch_decision_living_descendants_trigger: "You have at least #V 3#! living descendants"
 LR_tgp_gaul_sacral_branch_decision_existing_dynasty_effect: "You join [house|E] [minamoto_house.GetName|V] or [taira_house.GetName|V] [dynasties|E]"
 LR_tgp_gaul_sacral_branch_decision_existing_or_minamoto_effect: "You join [house|E] [taira_house.GetName|V], or found the #V [nearest_emperor.GetFirstNameNoTooltip] collateral line#! [dynasty|E]"
 LR_tgp_gaul_sacral_branch_decision_existing_or_taira_effect: "You join the [minamoto_house.GetName|V], or found the #V [nearest_emperor.GetFirstNameNoTooltip] provincial line#! [dynasty|E]"
 LR_tgp_gaul_sacral_branch_decision_new_dynasty_effect: "You create a new #V collateral#! or #V provincial#! [dynasty|E]"
 # LR_tgp_gaul_cadet_branch_decision
 LR_tgp_gaul_cadet_branch_decision: "Found Cadet House"
 LR_tgp_gaul_cadet_branch_decision_desc: "The House of [ROOT.Char.GetHouse.GetNameNoTooltip] is no longer worthy of my membership. In preservation of my honor, a new branch of our dynasty must be born."
 LR_tgp_gaul_cadet_branch_decision_tooltip: "You will form a Cadet Branch"
 LR_tgp_gaul_cadet_branch_decision_confirm: "Found Cadet House"

 LR_tgp_gaul_become_a_poet_decision: "Study Poetry"
 LR_tgp_gaul_become_a_poet_decision_desc: "Experiences, feelings, rhymes and reason. Find a way to understand this assortment of words and give it meaning."
 LR_tgp_gaul_become_a_poet_decision_tooltip: "Study to become a poet"
 LR_tgp_gaul_become_a_poet_decision_confirm: "$LR_tgp_gaul_become_a_poet_decision$"
 LR_tgp_gaul_become_a_poet_decision_effects_tooltip_trait: "You may be able to gain the [GetTrait('lifestyle_poet').GetName( GetNullCharacter )] [trait|E]"
 LR_tgp_gaul_become_a_poet_decision_effects_tooltip_stress: "You will gain a lot of [stress|E]"

 LR_tgp_gaul_train_with_troops_decision: "Inspire the Troops"
 LR_tgp_gaul_train_with_troops_decision_desc: "The strength of any army owes as much to its spirit as to its training and arms. We should assemble our troops so that I might remind them of the glories and spoils of victory, the ignominy of defeat, and exhort them to give their utmost for our cause."
 LR_tgp_gaul_train_with_troops_decision_tooltip: "Gain a temporary [character_modifier|E] and a chance for a [commander_trait|E]"
 LR_tgp_gaul_train_with_troops_decision_confirm: "$LR_tgp_gaul_train_with_troops_decision$"
 LR_tgp_gaul_train_with_troops_decision_effects_tooltip_trait: "You may be able to gain a [commander_trait|E] based on your [martial_skill|E]"
 LR_tgp_gaul_train_with_troops_decision_effects_tooltip_modifier: "You have inspired your troops with a speech"

 LR_tgp_gaul_become_a_monk_decision: "Seek Spiritual Enlightenment"
 LR_tgp_gaul_become_a_monk_decision_desc: "As I grow older and weaker in both my mind, as well as my body, thoughts that have never occurred to me are brewing up more frequently — it is time to find a greater purpose in life."
 LR_tgp_gaul_become_a_monk_decision_tooltip: "Embrace spiritual devotion and leave your previous obligations behind"
 LR_tgp_gaul_become_a_monk_decision_confirm: "Become a Devoted Monk"
 LR_tgp_gaul_become_a_monk_decision_health_tt: "You have less than $HEALTH_FINE$ [health|E]"
 LR_tgp_gaul_become_a_monk_decision_effects_trait: "You will gain the [trait|E]"
 LR_tgp_gaul_become_a_monk_decision_effects_resource: "You will gain [piety|E]"
 # Restore Merovingian Sacral Throne
 LR_tgp_gaul_restore_sacral_monarchy_decision: "Restore a Sacral High King"
 LR_tgp_gaul_restore_sacral_monarchy_decision_desc: "Inti's unbroken bloodline has ever ruled over these lands, if we are to restore the might of Gaul, a rightful heir must be restored."
 LR_tgp_gaul_restore_sacral_monarchy_decision_tooltip: "Re-establish the ancient sacral dynasty"
 LR_tgp_gaul_restore_sacral_monarchy_decision_confirm: "$LR_tgp_gaul_restore_sacral_monarchy_decision$"
 LR_tgp_gaul_restore_sacral_monarchy_decision_title_tt: "[GetTitleByKey('k_sacral_king_gaul_throne').GetNameNoTier] is vacant, or part of another [realm|E]"
 LR_tgp_gaul_restore_sacral_monarchy_decision_government_tt: "You have [GetGovernment('sacral_administrative_government').GetName], [GetGovernment('sacral_feudal_government').GetName], [GetGovernment('administrative_government').GetName], or [GetGovernment('feudal_government').GetName] [government|E]"
 LR_tgp_restore_sacral_monarchy_merovingian_decision_hook_tt: "You will gain a [strong_hook|E] on the new High King"
 LR_tgp_restore_sacral_monarchy_merovingian_scion_found_tt: "A member of [house|E] [house_merovingian.GetBaseName] will accede to [GetTitleByKey('k_sacral_king_gaul_throne').GetNameNoTier]"
 LR_tgp_restore_sacral_monarchy_merovingian_scion_created_tt: "A scion of [house|E] [house_merovingian.GetBaseName] will accede to [GetTitleByKey('k_sacral_king_gaul_throne').GetNameNoTier]"
 LR_tgp_restore_sacral_monarchy_merovingian_scion_sacral_majordomo_gaul_tt: "[sacral_majordomo_gaul.GetShortUIName|U] will accede to [GetTitleByKey('k_sacral_king_gaul_throne').GetNameNoTier]"
 LR_tgp_restore_sacral_monarchy_merovingian_scion_last_tt: "[last_sacral_king_gaul.GetShortUIName] will accede to [GetTitleByKey('k_sacral_king_gaul_throne').GetNameNoTier] once more"
 LR_tgp_restore_sacral_monarchy_merovingian_scion_last_child_tt: "A child of [last_sacral_king_gaul.GetShortUIName] will accede to [GetTitleByKey('k_sacral_king_gaul_throne').GetNameNoTier]"
 LR_tgp_restore_sacral_monarchy_merovingian_scion_last_close_family_tt: "A close relative of [last_sacral_king_gaul.GetShortUIName] will accede to [GetTitleByKey('k_sacral_king_gaul_throne').GetNameNoTier]"

 # Restore Sacral Administration
 LR_tgp_gaul_restore_sacral_government_decision: "Restore Roman Administration"
 LR_tgp_gaul_restore_sacral_government_decision_desc: "The traditions of our ancestors were torn asunder by upheaval and expedience. It is time to return to their proven examples of good governance."
 LR_tgp_gaul_restore_sacral_government_decision_tooltip: "Re-establish the old sacral administration"
 LR_tgp_gaul_restore_sacral_government_decision_confirm: "$LR_tgp_gaul_restore_sacral_government_decision$"
 LR_tgp_gaul_restore_sacral_government_decision_government_tt: "You have [GetGovernment('administrative_government').GetName] or [GetGovernment('feudal_government').GetName] [government|E]"
 LR_tgp_gaul_restore_sacral_government_decision_vassal_tt: "Other same-[heritage|E] [vassals|E] will adopt [GetGovernment('sacral_administrative_government').GetName] [government|E]"
 every_sacral_feudal_vassal_custom: "Every [GetGovernment('sacral_feudal_government').GetName] [vassal|E]"
 every_sacral_admin_vassal_custom_bullet: "$BULLET$Every [GetGovernment( 'sacral_administrative_government' ).GetNameWithIcon] [vassal|E]"
 LR_tgp_gaul_restore_sacral_government_decision_civil_war_tt: "#X @warning_icon! Disgruntled [vassals|E] may start a [civil_war|E]#!"

# Assert Regional Dominion (Become Regnulum Duke i.e. SupermanorialTM)
 LR_tgp_gaul_assert_regional_dominion_government_decision: "Assert Regional Dominion"
 LR_tgp_gaul_assert_regional_dominion_government_decision_desc: "The kingdom is rudderless! It is necessary for strong warriors to steer local leadership, while the tiller of state remains unmanned. Local lords will see the wisdom in this or be swept away by a storm of arrows and fire."
 LR_tgp_gaul_assert_regional_dominion_government_decision_sacral_dictator_desc: "With the impotent Romans swept away, this is an age of frankish power! An Duke of the Franks is at the helm, leading the state as if from a war camp. Warriors must steer local leadership! Your neighbors will see the wisdom in this or be swept away by a storm of arrows and fire."
 LR_tgp_gaul_assert_regional_dominion_government_decision_trigger_01: "Your [domicile|E] must have the [GetDomicileBuilding('gaul_manor_main_03').GetName] [domicile_building|E] or higher"
 LR_tgp_gaul_assert_regional_dominion_government_decision_trigger_aspiration: "Your [house|E] have a fully upgraded [GetHouseAspiration('strength').GetName|V] or [GetHouseAspiration('determination').GetName|V] [house_aspiration|E]"
 LR_tgp_gaul_assert_regional_dominion_government_decision_trigger_bloc: "You lead a [GetHouseAspiration('strength').GetName|V] or [GetHouseAspiration('determination').GetName|V] [house_aspiration|E] [bloc|E] with a #V $house_bloc_level_03$#! level"
 LR_tgp_gaul_assert_regional_dominion_government_decision_tooltip: "Become a [duke|E], subjugating local lords if they do not fall in line."
 LR_tgp_gaul_assert_regional_dominion_government_decision_confirm: "The Choice is Theirs"

 LR_tgp_gaul_establish_manorial_administration_decision: "Establish Regional Governance"
 LR_tgp_gaul_establish_manorial_administration_decision_desc: "The fetters of the old administration only stymie the government's ability to keep the peace. It is time to move past these illusory formalities, for the good of all Gaul."
 LR_tgp_gaul_establish_manorial_administration_decision_tooltip: "Seek to impose [manorial|E] [government|E] from within the old administration"
 LR_tgp_gaul_establish_manorial_administration_decision_confirm: "A necessary measure"
