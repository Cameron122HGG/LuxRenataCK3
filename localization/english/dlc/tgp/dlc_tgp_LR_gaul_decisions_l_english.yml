 # Move Magisterial Court
 LR_tgp_gaul_move_sacral_dictatorship_court_decision: "Move the [ROOT.Char.GetHouse.GetBaseNameNoTooltip] Court"
 LR_tgp_gaul_move_sacral_dictatorship_court_decision_desc: "[ROOT.Char.GetCapitalLocation.GetBaronyNameExplicitlyNoTooltip] is the old capital: in this new era, it is time to establish a true [ROOT.Char.GetHouse.GetBaseName] court. Moving to a more distant province will also allow us to exercise our authority far from the meddling administrators and priests."
 LR_tgp_gaul_move_sacral_dictatorship_court_decision_tooltip: "Establish a new capital for military rule"
 move_sacral_dictatorship_court_decision_confirm: "$LR_tgp_gaul_move_sacral_dictatorship_court_decision_tooltip$"

 # High King War Decision
 LR_tgp_gaul_sacral_king_war_decision: "Begin the Restoration War"
 LR_tgp_gaul_sacral_king_war_decision_desc: "Gaul is my birthright, and it will soon be mine in more than just name. By might, if need be. No longer shall I watch [ROOT.Char.GetTopLiege.GetShortUIName] ruin my lands in silence."
 LR_tgp_gaul_sacral_king_war_decision_tooltip: "Your [faction|E] will start a [war|E] to place you upon the throne of all [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetName]."

