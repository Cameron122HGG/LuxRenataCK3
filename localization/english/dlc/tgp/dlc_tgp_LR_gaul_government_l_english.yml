 LR_tgp_is_sacral_governor_trigger: "You are a [GetGovernment('sacral_administrative_government').GetName] [governor|E]"
 sacral_administrative_government:0 "Palatine"
 sacral_administrative_government_desc: "\n$sacral_administrative_government$ is a type of [administrative|E] [government|E] unique to Gaul.\n\nIt is a centralized [government_bureaucratic_type|E] [government_form|E] where [characters|E] are appointed as [governors|E] on behalf of their [liege|E], have access to [influence|E], and [noble_family|E] [house_head_heads|E] have a [family_manor|E] and [house_aspiration|E].\n\n$sacral_administrative_government$ [vassals|E] generally govern only a single [county|E], but may reject the centralized system and become local [manorial|E] lords to build their own power, though this is usually considered a [criminal|E] act.\n\n$sacral_administrative_government$ $game_concept_house_heads$ may create and join [house_blocs|E] within the [realm|E], which will support the [leading_house|E] in becoming $game_concept_magister_militum$.\n\n$gaul_government_domain_limit_help$\n\n#F The $sacral_administrative_government$ system refers to the centralized administrative government of the High Kingdom of Gaul, inspired by centuries of Roman bureaucracy.#!"
 sacral_administrative_government_adjective: "$sacral_administrative_government$"
 sacral_administrative_government_with_icon:0 "@government_type_palatine! $sacral_administrative_government$"
 sacral_administrative_government_realm:0 "sacral Governorship"
 government_is_gaul_administrative:0 "[government|E] type is [GetGovernment( 'sacral_administrative_government' ).GetName]"
 sacral_administrative_government_filter_option:0 "$game_concept_palatine$"
 sacral_administrative_government_filter_option_desc:0 "Only show characters with [palatine|E] [government|E]"
 gaul_administrative_vassal:0 "$sacral_administrative_government$"

 sacral_feudal_government:0 "Manorial"
 sacral_feudal_government_desc: "\n$sacral_feudal_government$ is a type of [feudal|E] [government|E] unique to Gaul.\n\n$sacral_feudal_government$ represents local lords who have discarded or supplanted the reach of the central [palatine|E] government and rule provinces as their own fiefs.\n\n$sacral_feudal_government$ Characters do not use [influence|E], but [noble_family|E] [house_head_heads|E] retain their [family_manor|E] and [house_aspiration|E].\n\n$sacral_feudal_government$ $game_concept_house_heads$ may create and join [house_blocs|E] within the [realm|E].\n\n$gaul_government_domain_limit_help$\n\n#F $sacral_feudal_government$ refers to a traditional Frankish social and economic unit, typically the extended family of a lord, characterized by shared resources, communal work, and mutual support, within the broader organizational framework of an intricate bureaucratic structure.#!"
 sacral_feudal_government_adjective: "$sacral_feudal_government$"
 sacral_feudal_government_with_icon:0 "@government_type_manorial! $sacral_feudal_government$"
 sacral_feudal_government_realm:0 "sacral Lordship"
 government_is_gaul_feudal:0 "[government|E] type is [GetGovernment( 'sacral_feudal_government' ).GetName]"
 sacral_feudal_government_filter_option:0 "$game_concept_manorial$"
 sacral_feudal_government_filter_option_desc:0 "Only show characters with [manorial|E] [government|E]"
 
 gaul_government_domain_limit_help: "@alert_icon! #HELP sacral $game_concept_governments$ have a lower [domain_limit|E] than others, which may be increased by upgrading the $game_concept_family_manor$.#!"
 influence_candidacy_interaction_desc_gaul: "Spend [influence|E] to promote or undermine a character's candidacy for [recipient.GetTopLiege.Custom('GetGovernorConcept')]"
 request_appointment_support_desc_gaul: "Ask [recipient.GetShortUINameNoTooltip] to promote you or a [house|E] member in becoming a future [actor.GetTopLiege.Custom('GetGovernorConcept')]"
 demand_admin_interaction_desc_gaul: "Ask [recipient.GetShortUIName|U] to abandon [recipient.GetGovernment.GetAdjective] [government|E] and become a [GetGovernment('sacral_administrative_government').GetName] [governor|E]"

 # Appointment Succession Law
 sacral_appointment_succession_law: "$sacral_administrative_government$ Appointment Succession"
 sacral_appointment_succession_law_subname: "Candidate with the Highest Score Inherits"
 sacral_appointment_succession_law_effects: "\nA type of [appointment_succession_law|E]. Under $sacral_appointment_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the candidate with the highest score. Any [adult|E] in the [realm|E] may strive to attain a [governorship|E] through various means from [scheming|E] to spending [influence|E]."
 sacral_military_appointment_succession_law: "$sacral_administrative_government$ Military Succession"
 sacral_military_appointment_succession_law_subname: "Candidate with the Highest Score Inherits"
 sacral_military_appointment_succession_law_effects: "\nA type of [appointment_succession_law|E]. Under $sacral_military_appointment_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the candidate with highest [candidate_score|E]. Any [adult|E] in the [realm|E] may strive to attain a military [governorship|E] by having a good [martial_skill|E], gaining [commander_traits|E], or spending [influence|E].#!"
 sacral_regency_succession_law: "sacral Regency Succession"
 sacral_regency_succession_law_subname: "$appointment_succession_law_subname$"
 sacral_regency_succession_law_effects: "Under $sacral_regency_succession_law$, the [title|E] and its associated [holdings|E] will be inherited by the candidate with the highest score. The pool of candidates includes the realm's [noble_families|E], [governors|E], and their family members."
