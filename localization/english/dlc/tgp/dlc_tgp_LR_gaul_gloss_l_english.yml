 # LR 2026-11-25: the commented-out Japanese glosses (Fujiwara, Minamoto, Taira, Tachibana, Takashina, Honsei, Heiji Rebellion, Ronin) were removed; CAPET_GLOSS and SYRAGIUS_GLOSS were linked but missing, so they are written here.
 MEROVINGIAN_GLOSS: "#bold $dynn_Merovingian$#! is the royal house of Gaul, the long-haired kings said to carry the sacred blood of Merovech. Though once powerful Sacral Kings, they saw the [Glossary( 'Robertines', 'CAPET_GLOSS' )] wrest control of the true organs of state, ruling as Mayors of the Palace in the royal house's name.\n\nMany of the most influential families of Gaul descend directly from Merovingian Sacral Kings, including the [Glossary( 'Robertines', 'CAPET_GLOSS' )] and the [Glossary( 'Syagrii', 'SYRAGIUS_GLOSS' )].\n\nTheir traditional [Glossary( 'Charge', 'CHARGE_GLOSS' )] was a #EMP lis#! — lily — flower."
 CAPET_GLOSS: "#bold $dynn_Robertine$s#! — later called the house of #EMP $dynn_Capet$#! — are the great Neustrian family who rose through service to the [Glossary( 'Merovingian', 'MEROVINGIAN_GLOSS' )] kings. Holding the office of [Glossary( 'Mayor of the Palace', 'sacral_majordomo_GLOSS' )] from father to son, they came to govern Gaul in the [Glossary( 'Sacral King', 'SACRAL_KING_GLOSS' )]'s name, while the king himself kept only the sacred throne and its rites."
 SYRAGIUS_GLOSS: "#bold The Syagrii#! are the heirs of the Gallo-Roman house of Syagrius, the last Roman masters of northern Gaul. Bound by marriage to the [Glossary( 'Merovingian', 'MEROVINGIAN_GLOSS' )] kings, they kept the memory of Roman Gaul alive and stood behind the restoration of the sacred throne."
 sacral_majordomo_GLOSS: "#bold Mayor of the Palace#! is a title given to the official household manager of an adult Sacral King of Gaul. Beginning as a position of honour close to the [Glossary( 'Sacral King', 'SACRAL_KING_GLOSS' )], it was gradually seized by the [Glossary( 'Robertines', 'CAPET_GLOSS' )], until the Mayor was the de facto ruler, and the Sacral Kings were mere figureheads."
 SACRAL_KING_GLOSS: "#bold Sacral King#! is the title given to the Sacral King of Gaul. Over time the Mayors of the Palace gradually wrested control from the royal family, until the [Glossary( 'Mayor of the Palace', 'sacral_majordomo_GLOSS' )] was the de facto ruler, and the kings were mere figureheads."
 RETIRED_SACREAL_KING_GLOSS: "#bold Retired King#! is the general term for a past [Glossary( 'Sacral King', 'SACRAL_KING_GLOSS' )] who has abdicated the Sacral Throne. As power was wrested from the royal family, it became increasingly common for a Sacral King to abdicate once his succession was secured with a healthy heir, allowing him to take part in politics from behind the throne, without its ceremonial responsibilities."
 CHATEAU_GLOSS: "#bold Château#! were the manor houses of Gallic noble houses, and the attached farmland they increasingly wrested from central control as the centralized [palatine|E] system declined."
 CHARGE_GLOSS: "#bold Heraldic#! - #EMP charges#! - were the emblems that came to be associated with and used to identify the aristocratic houses of Gaul and their many branches."
 SACRED_THRONE_GLOSS: "The #bold Sacred Throne#! refers to the royal throne of Gaul, both in the literal sense, but also a metonymic representation of the [Glossary( 'Sacral King', 'SACRAL_KING_GLOSS' )] and the legal authority for the existence of the government. Its emblem is the golden bees found in the tomb of King Childeric, father of Clovis, which the [Glossary( 'royal house', 'MEROVINGIAN_GLOSS' )] took as a sign of its unbroken and ever-renewing line."
