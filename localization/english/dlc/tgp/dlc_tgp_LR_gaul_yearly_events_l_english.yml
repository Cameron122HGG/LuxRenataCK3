 artifact_kakejiku_scroll_name: "Decorated Scroll"
 KAKEJIKU_GLOSS: ""
 artifact_kakejiku_scroll_desc: "A decorated scroll telling the story of"
 artifact_kakejiku_scroll_crane_desc: "$artifact_kakejiku_scroll_desc$ a lone condor, watching over a tree.\n\n#weak The condor's feathers ruffle in the wind, watching the sapling. Condors mate for life, but this tree takes centuries to grow...#!"
 artifact_kakejiku_scroll_friends_desc: "$artifact_kakejiku_scroll_desc$ two people united by fate, growing through their struggles and developing a deep friendship.\n\n#weak Two figures meet beneath a starry sky, their bond joined by a celestial bridge...#!"
 artifact_kakejiku_scroll_sword_desc: "$artifact_kakejiku_scroll_desc$ an enchanted blade, only able to be wielded by the most honorable warriors.\n\n#weak A sacred tree grows beside still waters, and beneath it a sheathed weapon...#!"

 LR_tgp_sacral_gaul_yearly_events.1250.t: "A Story for the Ages"
 LR_tgp_sacral_gaul_yearly_events.1250.desc: "[scroll_gifter.GetName] steps forward, bearing a long, wrapped object. "My [scroll_gifter.Custom2('RelationToMeShort', ROOT.Char)], I have a gift for your union." [scroll_gifter.GetNameNoTooltip] says, presenting a scroll. "A decorated scroll, with prose from the finest poet, may you remember its meaning when times get tough.""
 LR_tgp_sacral_gaul_yearly_events.1250.a: "Hang it above the marital bed."
 LR_tgp_sacral_gaul_yearly_events.1250.b: "Place it in the court, where everyone can see."
 LR_tgp_sacral_gaul_yearly_events.1250.c: "Keep it safe, so our descendants may read it."
