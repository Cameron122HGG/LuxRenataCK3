l_english:
 # LR 2026-11-22: sacral Gaul rework (temp loc)
 LR_tgp_sacral_gaul_depose_sacral_king_tt: "The Sacral King is deposed and tonsured: the [GetTitleByKey('k_sacral_king_gaul_throne').GetName] is destroyed and he retires to a monastery"
 LR_tgp_sacral_gaul_mayors_crown_dejure_tt: "The [de_jure|E] [kingdoms|E] of the [GetTitleByKey('e_sacral_kingdom_gaul').GetName] pass to the [GetTitleByKey('e_frankish_empire').GetName], which replaces it"

 LR_tgp_sacral_gaul_mayors_crown_decision: "Take the Mayor's Crown"
 LR_tgp_sacral_gaul_mayors_crown_decision_desc: "For generations the Mayors of the Palace have ruled Gaul in the name of Merovingian kings who reign but do not rule. Should the one who holds the power not also hold the crown? Let the last long-haired king be shorn and sent to a monastery, and let my house be anointed in his place."
 LR_tgp_sacral_gaul_mayors_crown_decision_tooltip: "Depose the Sacral King and make the [GetTitleByKey('e_sacral_kingdom_gaul').GetName] the [GetTitleByKey('e_frankish_empire').GetName]"

 LR_tgp_sacral_gaul_gallic_empire_decision: "End the Sacral Kingdom"
 LR_tgp_sacral_gaul_gallic_empire_decision_desc: "The Merovingian throne is a Frankish relic that the Gallo-Romans have endured for too long. As Mayor of the Palace I already govern Gaul; it is time to set the sacred kings aside and restore the Gallic Empire of Postumus and Tetricus."
 LR_tgp_sacral_gaul_gallic_empire_decision_tooltip: "Depose the Sacral King, end the [GetTitleByKey('e_sacral_kingdom_gaul').GetName] and proclaim the [GetTitleByKey('e_gallic_empire').GetName]"

 LR_tgp_sacral_gaul_claim_imperial_crown_decision: "Claim the Imperial Crown"
 LR_tgp_sacral_gaul_claim_imperial_crown_decision_desc: "Karolus was crowned emperor as King of the Franks. With Francia, Lotharingia and the German lands under my rule, the crown of the West belongs once more to the throne of Gaul."
 LR_tgp_sacral_gaul_claim_imperial_crown_decision_tooltip: "Found the [GetTitleByKey('h_hre').GetName] from Gaul"
 LR_tgp_sacral_gaul_mayors_crown_decision_confirm: "The king is shorn"
 LR_tgp_sacral_gaul_gallic_empire_decision_confirm: "Gaul for the Gallo-Romans"
 LR_tgp_sacral_gaul_claim_imperial_crown_decision_confirm: "Renovatio Imperii"
