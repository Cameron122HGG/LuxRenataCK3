l_english:
 game_rule_category_lux: "Lux Renata"
 lux_gr_prefix: "#clickable #Bold LR#!#!: "
 
 rule_shattered_earth_rule: "$lux_gr_prefix$Shattered Earth"
 setting_shattered_earth_false: "Unshattered"
 setting_shattered_earth_false_desc: "[title|E] structure will remain intact as intended."
 setting_shattered_earth_counties: "#high Shattered - Counties#!"
 setting_shattered_earth_counties_desc: "[title|E] structure will be shattered into independent [counties|E] shortly after starting the game."
 setting_shattered_earth_duchies: "#high Shattered - Duchies#!"
 setting_shattered_earth_duchies_desc: "[title|E] structure will be shattered into independent [duchies|E] shortly after starting the game."
 setting_shattered_earth_kingdoms: "#high Shattered - Kingdoms#!"
 setting_shattered_earth_kingdoms_desc: "[title|E] structure will be shattered into independent [kingdoms|E] shortly after starting the game."
 setting_shattered_earth_empires: "#high Shattered - Empires#!"
 setting_shattered_earth_empires_desc: "[title|E] structure will be shattered into independent [empires|E] shortly after starting the game."
 shattered_earth.t: "Ecumene Broken"
 shattered_earth.desc: "The world is changed. I feel it in the water. I feel it in the earth. I smell it in the air. Much that once was is lost...\n\nIt appears we are nought but playthings of the Gods!"
 shattered_earth.a: "It has been broken and changed thrice before - now again?"

 rule_calendar_rule: "$lux_gr_prefix$Calendar System"
 setting_alexander_calendar: "Argead's Reckoning - Alexander#!"
 setting_alexander_calendar_desc: "The standard game calendar is replaced by the Alexandrian version of the [macedonian|E] calendar. Years are counted from the death of Alexander in 323 BC (A.A.)."
 setting_macedonian_calendar: "#high macedonian#!"
 setting_macedonian_calendar_desc: "The standard game calendar is replaced by the Seleukid version of the [macedonian|E] calendar. Years are counted from the Seleukid era in 312 BC (S.E.)."
 setting_roman_calendar: "#high western_roman#!"
 setting_roman_calendar_desc: "The standard game calendar is replaced with the calendar used by the [western_romans|E] of the [western_empire|E]. Years are counted from the founding of Rome in 753 BC (A.U.C.)."
 setting_egyptian_calendar: "#high Kemetic Reckoning#!"
 setting_egyptian_calendar_desc: "The standard game calendar is replaced with the calendar used in the [egyptian|E] lands. Years are counted from the Era of the Martyrs in 284 AD (A.M.)."
 setting_gregorian_calendar: "#high Gregorian Calendar#!"
 setting_gregorian_calendar_desc: "The game calendar will remain unchanged and use the standard Gregorian calendar, with years counted A.D. and B.C."