 LR_roman_dux_male:0 "Dux"
 LR_roman_dux_female:0 "Dux"
 LR_roman_dux_modifier:0 "Roman Dux"
 LR_roman_dux_modifier_desc:0 "This character holds a frontier command of the Roman Empire, and the state bears much of the cost of its garrison."
 LR_roman_dux_appointment_succession_law:0 "Dux Appointment"
 LR_roman_dux_appointment_succession_law_subname:0 "$meritocratic_military_appointment_succession_law_subname$"
 LR_roman_dux_appointment_succession_law_effects:0 "\nA type of [appointment_succession_law|E] used only by the Roman frontier commands. Under $LR_roman_dux_appointment_succession_law$, the command passes to the candidate with the highest [candidate_score|E]. Score is mostly raised by [martial_skill|E], [commander_traits|E], Roman citizenship and service on the imperial consistory."
 LR_appoint_roman_dux_decision:0 "Appoint a Dux"
 LR_appoint_roman_dux_decision_desc:0 "The frontiers of a restored empire need commanders answerable to the emperor alone. A dux holds no land of their own: they command the frontier of a diocese, and when they fall the command passes to the most capable soldier of the realm."
 LR_appoint_roman_dux_decision_tooltip:0 "Create a frontier command for one of your dioceses and appoint a commander to it."
 LR_appoint_roman_dux_decision_confirm:0 "Appoint the Dux"
 LR_appoint_roman_dux_decision_trigger_1:0 "A diocese in your realm has a frontier command that has not been filled"
 LR_appoint_roman_dux_decision_effect_tt:0 "The chosen frontier command is created and given to the best available commander in your court or among your vassals and their courts, who becomes your landless vassal. A commander without land of their own also founds a [noble_family|E] of county rank and receives the command's garrison of limitanei, which stays with the command. The command passes by [GetLaw('LR_roman_dux_appointment_succession_law').GetName]."
 LR_appoint_roman_dux_no_candidate_tt:0 "There is no one fit to command this frontier"
 LR_CHOOSE_DUX_BUTTON:0 "Choose Frontier Command"
 LR_ROMAN_COMMAND:0 "Command"
 LR_ROMAN_COMMAND_CONCEPT:0 "Command"
 LR_ROMAN_COMMAND_TOOLTIP:0 "[ROOT.Char.GetVassalContract.GetAdminDivisionTextIcon] [SelectLocalization( ROOT.Char.GetGovernment.IsValid(), 'GOVERNMENT_ADJECTIVE', '' )] Command"
