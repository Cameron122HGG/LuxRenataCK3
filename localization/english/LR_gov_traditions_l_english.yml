l_english:
 # Lux Renata government traditions (TEMP)
 lux_tradition_gov_classical_name:0 "Classical Statecraft"
 lux_tradition_gov_classical_desc:0 "This culture governs in the manner of Rome and the Hellenistic kingdoms: magistrates, cities and written law, from which the classical governments grow."
 culture_parameter_lux_government_group_classical:0 "[rulers|E] of this culture use the classical [governments|E]: [GetPlayer.Custom('LR_gov_tradition_ranks_classical')]"
 lux_tradition_gov_western_name:0 "Feudal Custom"
 lux_tradition_gov_western_desc:0 "This culture binds lords and vassals by oath and custom, and its realms follow the feudal path of the West."
 culture_parameter_lux_government_group_western:0 "[rulers|E] of this culture use the Western feudal [governments|E]: [GetPlayer.Custom('LR_gov_tradition_ranks_western')]"
 lux_tradition_gov_despotic_name:0 "Persianate Court"
 lux_tradition_gov_despotic_desc:0 "This culture rules through a splendid court and the will of a king of kings, in the manner of the Persianate world."
 culture_parameter_lux_government_group_despotic:0 "[rulers|E] of this culture use the Persianate [governments|E]: [GetPlayer.Custom('LR_gov_tradition_ranks_despotic')]"
 lux_tradition_gov_indic_name:0 "Dharmic Kingship"
 lux_tradition_gov_indic_desc:0 "This culture holds that a king rules by upholding dharma, and its realms follow the paths of the Indic kingdoms."
 culture_parameter_lux_government_group_indic:0 "[rulers|E] of this culture use the Indic [governments|E]: [GetPlayer.Custom('LR_gov_tradition_ranks_indic')]"
 lux_tradition_gov_mamlakah_name:0 "Mamlakah"
 lux_tradition_gov_mamlakah_desc:0 "This culture keeps the old kingship of the Semitic peoples, the mamlakah: kings who rule through their household, their kin and their tribes, from the cities of Arabia and the Levant to Aksum and Carthage. Muslim rulers of this culture govern instead by the Iqta of the Islamic world."
 culture_parameter_lux_government_group_mamlakah:0 "[rulers|E] of this culture use the Mamlakah [governments|E]: [GetPlayer.Custom('LR_gov_tradition_ranks_mamlakah')] (Muslim rulers use the Iqta: [GetPlayer.Custom('LR_gov_tradition_ranks_iqta')])"
 lux_tradition_gov_sinic_name:0 "Mandate of Heaven"
 lux_tradition_gov_sinic_desc:0 "This culture holds that rule is granted by Heaven to the worthy, and its realms follow the Sinic paths of governance."
 culture_parameter_lux_government_group_sinic:0 "[rulers|E] of this culture use the Sinic [governments|E]"
 lux_tradition_gov_japanese_name:0 "Ritsuryo Tradition"
 lux_tradition_gov_japanese_desc:0 "This culture governs by codes of law and court ranks, and its great houses vie for power in the Japanese manner."
 culture_parameter_lux_government_group_japanese:0 "[rulers|E] of this culture use the Japanese [governments|E]"
 lux_tradition_gov_barbarian_name:0 "Tribal Confederation"
 lux_tradition_gov_barbarian_desc:0 "This culture gathers its peoples into great confederations under warrior kings, outside the settled traditions of its neighbours."
 culture_parameter_lux_government_group_barbarian:0 "[rulers|E] of this culture use the great tribal [governments|E]"
 lux_tradition_gov_anarchy_name:0 "Anarchy"
 lux_tradition_gov_anarchy_desc:0 "This culture has no settled way of government. Every lord rules as they see fit, no one agrees whose claims or customs bind, and the realm frays at the edges. The culture's leaders must settle on a [government|E] tradition."
 culture_parameter_lux_government_anarchy:0 "#N Government [traditions|E] cost a quarter as much and ignore the tradition cooldown until one is adopted#!"
 LR_tradition_cost_in_anarchy_desc:0 "Anarchy"

 LR_gov_anarchy.0001.t:0 "No Way to Rule"
 LR_gov_anarchy.0001.desc:0 "The [ROOT.Char.GetCulture.GetName] people share no custom of rule. My vassals ignore my summons when it suits them, my courtiers argue over which law binds whom, and the common folk grumble that no one keeps order.\n\nAs head of the [ROOT.Char.GetCulture.GetName] [culture|E], I must give my people a way of [government|E] before this anarchy undoes us."
 LR_gov_anarchy.0001.a:0 "Let the way I rule become our custom."
 LR_gov_anarchy.0001.b:0 "We will follow the ways of [SCOPE.sC('LR_gov_overlord').GetShortUIName]."
 LR_gov_anarchy.0001.c:0 "I will weigh the traditions of others first."
 LR_gov_anarchy.0001.c.tt:0 "Government [traditions|E] can be adopted from the [culture|E] view at a quarter of the usual cost, without waiting for the tradition cooldown. This choice returns every year, and each year of delay costs more [prestige|E]."


 # LR 2026-11-18 government tradition tweaks (LR_gov_traditions.txt)
 LR_tradition_cost_realm_drift_desc:0 "Much of the culture lives under this way of government"
 LR_tradition_gov_classical_known_tt:0 "Some of the culture's counties lie in a realm of the classical [governments|E], or its head's realm or a neighbouring realm is one"
 LR_tradition_gov_western_known_tt:0 "Some of the culture's counties lie in a realm of the western feudal [governments|E], or its head's realm or a neighbouring realm is one"
 LR_tradition_gov_despotic_known_tt:0 "Some of the culture's counties lie in a realm of the Persianate [governments|E], or its head's realm or a neighbouring realm is one"
 LR_tradition_gov_indic_known_tt:0 "Some of the culture's counties lie in a realm of the Indic [governments|E], or its head's realm or a neighbouring realm is one"
 LR_tradition_gov_mamlakah_known_tt:0 "Some of the culture's counties lie in a realm of the Mamlakah [governments|E], or its head's realm or a neighbouring realm is one"
 LR_tradition_gov_sinic_known_tt:0 "Some of the culture's counties lie in a realm of the Sinic [governments|E], or its head's realm or a neighbouring realm is one"
 LR_tradition_gov_japanese_known_tt:0 "Some of the culture's counties lie in a realm of the Japanese [governments|E], or its head's realm or a neighbouring realm is one"
 LR_tradition_gov_barbarian_known_tt:0 "Some of the culture's counties lie in a realm of the tribal [governments|E], or its head's realm or a neighbouring realm is one"
 LR_tradition_gov_replaces_gov_tt:0 "Can only replace the culture's government tradition (or Anarchy)"
 lux_tradition_gov_nilotic_name:0 "Nilotic Kingship"
 lux_tradition_gov_nilotic_desc:0 "This culture keeps the kingship of the Nile and the Horn of Africa: sacred kings of river and highland, from Egypt and Nubia to Aksum and the Somali coast, who rule through their court, their kin and their church. Muslim rulers of this culture govern instead by the Iqta of the Islamic world."
 culture_parameter_lux_government_group_nilotic:0 "[rulers|E] of this culture use the Nilotic Kingship [governments|E]: [GetPlayer.Custom('LR_gov_tradition_ranks_nilotic')] (Muslim rulers use the Iqta: [GetPlayer.Custom('LR_gov_tradition_ranks_iqta')])"
 LR_tradition_gov_nilotic_known_tt:0 "Some of the culture's counties lie in a realm of the Nilotic Kingship [governments|E], or its head's realm or a neighbouring realm is one"
 lux_tradition_gov_sudanic_name:0 "Sudanic Kingship"
 lux_tradition_gov_sudanic_desc:0 "This culture keeps the kingship of the settled realms of sub-Saharan Africa, from the Sahel and the Guinea coast to the Swahili towns: kings who rule through their court, their lineages and the trade of their markets. Muslim rulers of this culture govern instead by the Iqta of the Islamic world."
 culture_parameter_lux_government_group_sudanic:0 "[rulers|E] of this culture use the Sudanic Kingship [governments|E]: [GetPlayer.Custom('LR_gov_tradition_ranks_sudanic')] (Muslim rulers use the Iqta: [GetPlayer.Custom('LR_gov_tradition_ranks_iqta')])"
 LR_tradition_gov_sudanic_known_tt:0 "Some of the culture's counties lie in a realm of the Sudanic Kingship [governments|E], or its head's realm or a neighbouring realm is one"
