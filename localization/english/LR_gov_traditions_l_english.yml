l_english:
 # Lux Renata government traditions (TEMP)
 lux_tradition_gov_classical_name:0 "Classical Statecraft"
 lux_tradition_gov_classical_desc:0 "This culture governs in the manner of Rome and the Hellenistic kingdoms: magistrates, cities and written law, from which the classical governments grow."
 culture_parameter_LR_government_group_classical:0 "[rulers|E] of this culture use the classical [governments|E]"
 lux_tradition_gov_western_name:0 "Feudal Custom"
 lux_tradition_gov_western_desc:0 "This culture binds lords and vassals by oath and custom, and its realms follow the feudal path of the West."
 culture_parameter_LR_government_group_western:0 "[rulers|E] of this culture use the Western feudal [governments|E]"
 lux_tradition_gov_despotic_name:0 "Persianate Court"
 lux_tradition_gov_despotic_desc:0 "This culture rules through a splendid court and the will of a king of kings, in the manner of the Persianate world."
 culture_parameter_LR_government_group_despotic:0 "[rulers|E] of this culture use the Persianate [governments|E]"
 lux_tradition_gov_indic_name:0 "Dharmic Kingship"
 lux_tradition_gov_indic_desc:0 "This culture holds that a king rules by upholding dharma, and its realms follow the paths of the Indic kingdoms."
 culture_parameter_LR_government_group_indic:0 "[rulers|E] of this culture use the Indic [governments|E]"
 lux_tradition_gov_islamic_name:0 "Iqta Tradition"
 lux_tradition_gov_islamic_desc:0 "This culture rewards its soldiers and officials with revenue grants rather than land, in the manner of the Islamic world."
 culture_parameter_LR_government_group_islamic:0 "[rulers|E] of this culture use the Iqta [governments|E]"
 lux_tradition_gov_sinic_name:0 "Mandate of Heaven"
 lux_tradition_gov_sinic_desc:0 "This culture holds that rule is granted by Heaven to the worthy, and its realms follow the Sinic paths of governance."
 culture_parameter_LR_government_group_sinic:0 "[rulers|E] of this culture use the Sinic [governments|E]"
 lux_tradition_gov_japanese_name:0 "Ritsuryo Tradition"
 lux_tradition_gov_japanese_desc:0 "This culture governs by codes of law and court ranks, and its great houses vie for power in the Japanese manner."
 culture_parameter_LR_government_group_japanese:0 "[rulers|E] of this culture use the Japanese [governments|E]"
 lux_tradition_gov_barbarian_name:0 "Tribal Confederation"
 lux_tradition_gov_barbarian_desc:0 "This culture gathers its peoples into great confederations under warrior kings, outside the settled traditions of its neighbours."
 culture_parameter_LR_government_group_barbarian:0 "[rulers|E] of this culture use the great tribal [governments|E]"
