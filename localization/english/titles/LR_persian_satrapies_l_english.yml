 # Decision
 LR_restore_eranshahr_shahrs_decision: "Restore a Šahr of Ērānšahr"
 LR_restore_eranshahr_shahrs_decision_desc: "The šahrs of Ērānšahr were governed from Staxr to Sugd and from Sparda to the Indus by šahrabs and marzbāns of the King of Kings. Let one of them be restored, divided again into its tasūgs and set under its kust."
 LR_restore_eranshahr_shahrs_decision_tooltip: "Restore a šahr of Ērānšahr and divide it into tasūgs"
 LR_restore_eranshahr_shahrs_decision_confirm: "Appoint the Šahrabs"
 LR_restore_eranshahr_shahrs_decision_trigger: "You completely control the lands of a šahr that is not yet restored"
 LR_restore_eranshahr_shahrs_decision_effect_tt: "The šahr is restored over its lands and divided into tasūgs, and you take it. It is set under its kust, and the kust under Ērānšahr if you hold it. Hyparchies, satrapies and Roman provinces left without land are dissolved, and their holders receive the tasūg or šahr over their old capital."
