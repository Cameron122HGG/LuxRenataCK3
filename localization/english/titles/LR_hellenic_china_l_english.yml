 LR_sina_restore_henan_decision_tooltip: "Lay out the satrapy of Sēra and its hyparchies"
 LR_sina_restore_henan_decision_confirm: "Restore the Satrapy"
 LR_sina_restore_henan_decision_trigger: "Completely control every county of the satrapy of Sēra; or, as holder of its strategia or of the great kingdom, completely control its seat ([GetTitleByKey('c_henan').GetName]) and hold at least half its counties"
 LR_sina_restore_henan_decision_effect_tt: "The counties of Sēra move into its hyparchies, the satrapy into its strategia, and the strategia becomes [de_jure|E] part of [GetTitleByKey('h_hellenic_china').GetName]. Old duchies and kingdoms left without land are dissolved; their holders get the matching hyparchy or satrapy if it is free."
