 LR_title_set_galatian_creation_tooltip: "Only Galatians and other Britons may create the realms of the eastern Celts"
 LR_foreign_administration_galatian_modifier: "Foreign Administration (Galatian)"
 LR_foreign_administration_galatian_modifier_desc: "This ruler holds the old realms of the eastern Celts without being a Galatian or a Briton. Their Galatian vassals resent it, and the lands are hard to hold until they are handed to a ruler entitled to them, or lost."
 LR_foreign_administration_galatian_opinion: "Rules the Galatians as a foreigner"

 LR_restore_galat_kingdoms_decision: "Restore a Galatian Kingdom"
 LR_restore_galat_kingdoms_decision_desc: "The Tolistobogioi, Tektosages and Trokmoi once held Anatolia in twelve tetrarchies, and their kin ruled Tulis and the Danube. Let one of their realms rise again, divided into its old lands and set under its high-kingship."
 LR_restore_galat_kingdoms_decision_tooltip: "Restore a Galatian kingdom and divide it into its old lands"
 LR_restore_galat_kingdoms_decision_confirm: "Summon the tetrarchs"
 LR_restore_galat_kingdoms_decision_trigger: "You completely control the lands of a Galatian kingdom that is not yet restored"
 LR_restore_galat_kingdoms_decision_effect_tt: "The kingdom is restored over its lands and divided into its duchies, and you take it. It is set under its high-kingship, and the high-kingship under [GetTitleByKey('h_reixath_galathon').GetName] if you hold it. Titles of other sets left without land are dissolved, and their holders receive the duchy or kingdom over their old capital."
