 LR_title_set_hebrew_creation_tooltip: "Only rulers of the Jewish religion or of Israelite heritage may create the realms of Israel"
 LR_foreign_administration_hebrew_modifier: "Foreign Administration (Israelite)"
 LR_foreign_administration_hebrew_modifier_desc: "This ruler holds the mamlakhot and medinot of Israel without being of Israel's faith or blood. Their Jewish and Israelite vassals resent it, and the lands are hard to hold until they are handed to a ruler entitled to them, or lost."
 LR_foreign_administration_hebrew_opinion: "Rules us as a foreign province"

 LR_restore_yisrael_mamlakhot_decision: "Restore a Mamlakhah of Israel"
 LR_restore_yisrael_mamlakhot_decision_desc: "From the River of Egypt to the great river Euphrates the land was promised. Let one of its kingdoms be restored, divided again into its medinot and set under its eretz."
 LR_restore_yisrael_mamlakhot_decision_tooltip: "Restore a mamlakhah of Israel and divide it into medinot"
 LR_restore_yisrael_mamlakhot_decision_confirm: "Appoint the Governors"
 LR_restore_yisrael_mamlakhot_decision_trigger: "You completely control the lands of a mamlakhah that is not yet restored"
 LR_restore_yisrael_mamlakhot_decision_effect_tt: "The mamlakhah is restored over its lands and divided into medinot, and you take it. It is set under its eretz, and the eretz under Mamlekhet Yisra'el if you hold it. Hyparchies, satrapies, šahrs and Roman provinces left without land are dissolved, and their holders receive the medinah or mamlakhah over their old capital."
 LR_mamlakhah_phoenicia_desc: "Kena'an"
 LR_mamlakhah_syria_desc: "Aram"
 LR_mamlakhah_mesopotamia_desc: "Aram-Naharayim"
 LR_mamlakhah_babylon_desc: "Shin'ar"
 LR_mamlakhah_egypt_desc: "Mitsrayim"

 LR_proclaim_mamlekhet_yisrael_decision: "Proclaim Mamlekhet Yisra'el"
 LR_proclaim_mamlekhet_yisrael_decision_desc: "Jerusalem is ours, and our writ runs from Alexandria to Antioch and Baghdad. The kingdom of David and Solomon can rise again, greater than before."
 LR_proclaim_mamlekhet_yisrael_decision_tooltip: "Proclaim the kingdom of Israel from the Nile to the Euphrates"
 LR_proclaim_mamlekhet_yisrael_decision_confirm: "Next year in Jerusalem, and every year after!"
 LR_proclaim_mamlekhet_yisrael_kenaan_tt: "You completely control the lands of Kena'an (the satrapy of Phoenicia)"
 LR_proclaim_mamlekhet_yisrael_decision_effect_tt: "You take [GetTitleByKey('h_mamlekhet_yisrael').GetName]. Eretz Yisra'el, Ever ha-Nahar and Eretz Ham become de jure parts of it, and every restored mamlakhah is set under its eretz."
