 e_magisterium_italia: "Magisterium per Italiam"
 e_magisterium_italia_adj: "Magisterial"
 e_magisterium_italia_article: "the "
 LR_form_magisterium_italia_decision: "Appoint a Magister Militum per Italiam"
 LR_form_magisterium_italia_decision_desc: "One command over the field armies and the dioceses: let a magister militum per Italiam hold [GetTitleByKey('k_diocese_italia_annonaria').GetName], [GetTitleByKey('k_diocese_italia_suburbicaria').GetName] for the Empire, as the regional commands did before the exarchs."
 LR_form_magisterium_italia_decision_tooltip: "Create the Magisterium per Italiam over [GetTitleByKey('k_diocese_italia_annonaria').GetName], [GetTitleByKey('k_diocese_italia_suburbicaria').GetName]"
 LR_form_magisterium_italia_decision_confirm: "Appoint the Magister"
 LR_form_magisterium_italia_decision_effect_tt: "You create the Magisterium per Italiam, a great command under your empire that you may grant to a vassal. [GetTitleByKey('k_diocese_italia_annonaria').GetName], [GetTitleByKey('k_diocese_italia_suburbicaria').GetName] move directly under it; [GetTitleByKey('e_praetorian_prefecture_italia').GetName] loses them (yours is dissolved if left empty). Dioceses restored there later go under the magisterium."
 e_magisterium_africa: "Magisterium per Africam"
 e_magisterium_africa_adj: "Magisterial"
 e_magisterium_africa_article: "the "
 LR_form_magisterium_africa_decision: "Appoint a Magister Militum per Africam"
 LR_form_magisterium_africa_decision_desc: "One command over the field armies and the dioceses: let a magister militum per Africam hold [GetTitleByKey('k_diocese_africa').GetName], [GetTitleByKey('k_diocese_mauretania').GetName] for the Empire, as the regional commands did before the exarchs."
 LR_form_magisterium_africa_decision_tooltip: "Create the Magisterium per Africam over [GetTitleByKey('k_diocese_africa').GetName], [GetTitleByKey('k_diocese_mauretania').GetName]"
 LR_form_magisterium_africa_decision_confirm: "Appoint the Magister"
 LR_form_magisterium_africa_decision_effect_tt: "You create the Magisterium per Africam, a great command under your empire that you may grant to a vassal. [GetTitleByKey('k_diocese_africa').GetName], [GetTitleByKey('k_diocese_mauretania').GetName] move directly under it; [GetTitleByKey('e_praetorian_prefecture_italia').GetName] loses them (yours is dissolved if left empty). Dioceses restored there later go under the magisterium."
 k_quaestura_exercitus: "Quaestura exercitus"
 k_quaestura_exercitus_adj: "Quaestorian"
 k_quaestura_exercitus_article: "the "
 LR_form_quaestura_exercitus_decision: "Create the Quaestura exercitus"
 LR_form_quaestura_exercitus_decision_desc: "As Justinian did, let one quaestor supply the Danube armies from the rich provinces of the sea: [GetTitleByKey('d_roman_province_moesia_secunda').GetName], [GetTitleByKey('d_roman_province_scythia').GetName], [GetTitleByKey('d_roman_province_insulae').GetName], [GetTitleByKey('d_roman_province_caria').GetName], [GetTitleByKey('d_roman_province_cyprus').GetName]."
 LR_form_quaestura_exercitus_decision_tooltip: "Join [GetTitleByKey('d_roman_province_moesia_secunda').GetName], [GetTitleByKey('d_roman_province_scythia').GetName], [GetTitleByKey('d_roman_province_insulae').GetName], [GetTitleByKey('d_roman_province_caria').GetName], [GetTitleByKey('d_roman_province_cyprus').GetName] into the Quaestura exercitus"
 LR_form_quaestura_exercitus_decision_confirm: "Create the Quaestura"
 LR_form_quaestura_exercitus_decision_trigger: "Your realm holds every one of [GetTitleByKey('d_roman_province_moesia_secunda').GetName], [GetTitleByKey('d_roman_province_scythia').GetName], [GetTitleByKey('d_roman_province_insulae').GetName], [GetTitleByKey('d_roman_province_caria').GetName], [GetTitleByKey('d_roman_province_cyprus').GetName]"
 LR_form_quaestura_exercitus_decision_effect_tt: "You create the Quaestura exercitus, and [GetTitleByKey('d_roman_province_moesia_secunda').GetName], [GetTitleByKey('d_roman_province_scythia').GetName], [GetTitleByKey('d_roman_province_insulae').GetName], [GetTitleByKey('d_roman_province_caria').GetName], [GetTitleByKey('d_roman_province_cyprus').GetName] move directly under it."
 LR_radd_magister_restore_italia_decision: "Restore the Dioceses of the Magisterium per Italiam"
 LR_radd_magister_restore_italia_decision_desc: "The magister militum per Italiam answers to the emperor, but the dioceses of his command are his to put in order: let [GetTitleByKey('k_diocese_italia_suburbicaria').GetName], [GetTitleByKey('k_diocese_italia_annonaria').GetName] be drawn again where he holds the land."
 LR_radd_magister_restore_italia_decision_tooltip: "Restore [GetTitleByKey('k_diocese_italia_suburbicaria').GetName], [GetTitleByKey('k_diocese_italia_annonaria').GetName] under your magisterium"
 LR_radd_magister_restore_italia_decision_confirm: "Restore the Dioceses"
 LR_radd_magister_restore_italia_decision_trigger: "You completely control a diocese of the magisterium ([GetTitleByKey('k_diocese_italia_suburbicaria').GetName], [GetTitleByKey('k_diocese_italia_annonaria').GetName]) that is not yet restored"
 LR_radd_magister_restore_italia_decision_effect_tt: "Each diocese you completely control is restored and given to you; it goes into your magisterium under the emperor's hegemony."
 LR_radd_magister_restore_africa_decision: "Restore the Dioceses of the Magisterium per Africam"
 LR_radd_magister_restore_africa_decision_desc: "The magister militum per Africam answers to the emperor, but the dioceses of his command are his to put in order: let [GetTitleByKey('k_diocese_africa').GetName] be drawn again where he holds the land."
 LR_radd_magister_restore_africa_decision_tooltip: "Restore [GetTitleByKey('k_diocese_africa').GetName] under your magisterium"
 LR_radd_magister_restore_africa_decision_confirm: "Restore the Dioceses"
 LR_radd_magister_restore_africa_decision_trigger: "You completely control a diocese of the magisterium ([GetTitleByKey('k_diocese_africa').GetName]) that is not yet restored"
