l_english:
 # LR 2026-11-06: the Holy Roman Empire as a hegemony (translatio imperii)
 h_hre: "Holy Roman Empire"
 h_hre_adj: "Holy Roman"
 h_hre_article: "the "
 LR_proclaim_holy_roman_empire_decision: "Proclaim the Holy Roman Empire"
 LR_proclaim_holy_roman_empire_decision_desc: "The empire of Karolus is ours again in Aachen and the German lands. Let it take back the name the Pope once gave it: the Holy Roman Empire."
 LR_proclaim_holy_roman_empire_decision_tooltip: "The Carolingian Empire becomes the Holy Roman Empire"
 LR_proclaim_holy_roman_empire_decision_confirm: "For Karolus and for Rome"
 LR_karling_restoration_decision: "The Karling Restoration"
 LR_karling_restoration_decision_desc: "Since Pavia the Karlings of Aachen have kept only the fiction of the imperial title. Now the lands of Karolus answer to his blood again, and no Pope is needed to say what the blood already proves: the Holy Roman Empire is restored."
 LR_karling_restoration_decision_tooltip: "Restore the Holy Roman Empire by the right of the Karling blood"
 LR_karling_restoration_decision_confirm: "The blood of Karolus endures"
 LR_found_holy_roman_hegemony_dejure_tt: "The Holy Roman Empire is founded as a hegemony over the Sacral Kingdom of Gaul and Germany. The kingdoms of the old empire are shared between them (Gaul to the Sacral Kingdom, the rest to Germany), and the old empire titles are dissolved."
