 LR_found_sacral_empire_tt: "The [GetTitleByKey('h_sacral_empire').GetName] is founded over the three realms of the Franks. Every regnum already organised is laid out in missatica and marches, and the realm takes up Carolingian administration. If you hold the [GetTitleByKey('h_hre').GetName], it becomes the Sacral Empire."
 LR_reform_frankish_empire_decision: "Reform the Empire"
 LR_reform_frankish_empire_decision_desc: "The Franks have been ruled both ways: by a sacral emperor through his missi, and by an elected emperor through his princes. The crown may turn from one to the other."
 LR_reform_frankish_empire_decision_tooltip: "Turn your empire into the other Frankish crown"
 LR_reform_frankish_empire_decision_confirm: "Reform the Empire"
 LR_reform_to_hre_tt: "The [GetTitleByKey('h_sacral_empire').GetName] becomes the [GetTitleByKey('h_hre').GetName]: the regna are laid out over their old duchies, the Electors are chosen and the crown becomes elective."
 LR_reform_to_sacral_tt: "The [GetTitleByKey('h_hre').GetName] becomes the [GetTitleByKey('h_sacral_empire').GetName]: the regna are laid out in missatica and marches, and the realm takes up Carolingian administration."
