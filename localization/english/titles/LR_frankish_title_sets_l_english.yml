 LR_proclaim_sacral_empire_decision: "Proclaim the Sacral Empire"
 LR_proclaim_sacral_empire_decision_desc: "Before the Treaty of Verdun divided them, the Franks were one people under one crown. Gather the three realms of the Franks under a sacral emperor anointed at Aachen, and govern them as Karolus did, through his missi and his counts."
