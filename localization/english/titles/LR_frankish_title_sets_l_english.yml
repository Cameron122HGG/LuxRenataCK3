 LR_title_set_frankish_creation_tooltip: "Only the realms of the Frankish world may create the Frankish regna: the Sacral Kingdom of Gaul, the High Kingdom of the Franks, the Carolingian Empire, the High Kingdom of Germany, the Sacral Empire and the Holy Roman Empire"
 LR_title_set_german_creation_tooltip: "Only the realms of the Frankish world may create the German regna: the Sacral Kingdom of Gaul, the High Kingdom of the Franks, the Carolingian Empire, the High Kingdom of Germany, the Sacral Empire and the Holy Roman Empire"
 LR_title_set_missatica_creation_tooltip: "Only the realms of the Frankish world under Carolingian administration may create missatica and marches: the High Kingdom of the Franks, the Carolingian Empire, the High Kingdom of Germany, the Sacral Empire and the Holy Roman Empire"
 LR_foreign_administration_frankish_modifier: "Foreign Administration (Frankish)"
 LR_foreign_administration_frankish_modifier_desc: "This ruler holds a Frankish regnum without belonging to a realm of the Frankish world. The land is hard to hold until it passes to a ruler entitled to it, or is lost."
 LR_foreign_administration_frankish_opinion: "Rules the Franks as a foreigner"
 LR_foreign_administration_german_modifier: "Foreign Administration (German)"
 LR_foreign_administration_german_modifier_desc: "This ruler holds a German regnum without belonging to a realm of the Frankish world. The land is hard to hold until it passes to a ruler entitled to it, or is lost."
 LR_foreign_administration_german_opinion: "Rules the Franks as a foreigner"
 LR_foreign_administration_missatica_modifier: "Foreign Administration (Missatica)"
 LR_foreign_administration_missatica_modifier_desc: "This ruler holds a Carolingian missaticum or march without belonging to a realm of the Frankish world. The land is hard to hold until it passes to a ruler entitled to it, or is lost."
 LR_foreign_administration_missatica_opinion: "Rules the Franks as a foreigner"
 LR_frankish_march_modifier: "Border Command"
 LR_frankish_march_modifier_desc: "This ruler holds a march, a border command of the Frankish realm."
 LR_frankish_crown_taken_opinion: "Took my crown for a Frankish regnum"
 LR_frankish_west_layout_merovingian_tt: "Gaul is laid out in the three regna of West Francia: [GetTitleByKey('k_regnum_neustria').GetName], [GetTitleByKey('k_regnum_burgundia').GetName] and [GetTitleByKey('k_regnum_aquitania').GetName], over the old duchies. The petty kingdoms they replace are dissolved, and their kings lose their crowns."
 LR_frankish_west_layout_missatica_tt: "Gaul is laid out in the three regna of West Francia: [GetTitleByKey('k_regnum_neustria').GetName], [GetTitleByKey('k_regnum_burgundia').GetName] and [GetTitleByKey('k_regnum_aquitania').GetName], governed in missatica and marches. The petty kingdoms they replace are dissolved: a sitting king of the realm becomes king of the regnum over his capital."
 LR_frankish_organise_missatica_tt: "The regnum is laid out in missatica and marches. The kingdoms and duchies it replaces are dissolved: a sitting king of the realm becomes its king, and dukes get the missaticum over their seat."
 LR_frankish_organise_merovingian_tt: "The regnum is laid out over its old duchies. The petty kingdoms it replaces are dissolved, and their kings lose their crowns."
 LR_organise_frankish_regnum_neustria_decision: "Organise the Regnum of Neustria"
 LR_organise_frankish_regnum_neustria_decision_desc: "Neustria is one of the three regna of West Francia. Let its lands be ordered as the realm orders them, under the crown of Gaul. Under a Sacral Emperor it is governed in missatica and marches; under a Holy Roman Emperor, over its old duchies."
 LR_organise_frankish_regnum_neustria_decision_tooltip: "Make Neustria a regnum of your realm, laid out as the crown in force wants it"
 LR_organise_frankish_regnum_neustria_decision_confirm: "Organise Neustria"
 LR_organise_frankish_regnum_neustria_decision_trigger: "You completely control the lands of Neustria"
