 e_epikrateia_upper_satrapies: "Epikrateia of the Upper Satrapies"
 e_epikrateia_upper_satrapies_adj: "Upper"
 e_epikrateia_upper_satrapies_article: "the "
 LR_form_epikrateia_upper_satrapies_decision: "Form the Epikrateia of the Upper Satrapies"
 LR_form_epikrateia_upper_satrapies_decision_desc: "One governor over many satraps: let [GetTitleByKey('e_strategia_baktriane').GetName], [GetTitleByKey('e_strategia_upper_satrapies').GetName], [GetTitleByKey('e_strategia_serindia').GetName] be joined into a single dominion of the Hegemony, its satrapies answering to it and it to us."
 LR_form_epikrateia_upper_satrapies_decision_tooltip: "Join [GetTitleByKey('e_strategia_baktriane').GetName], [GetTitleByKey('e_strategia_upper_satrapies').GetName], [GetTitleByKey('e_strategia_serindia').GetName] into the Epikrateia of the Upper Satrapies"
 LR_form_epikrateia_upper_satrapies_decision_confirm: "Form the Epikrateia"
 LR_form_epikrateia_upper_satrapies_decision_trigger: "Your realm holds a restored satrapy in at least two of: [GetTitleByKey('e_strategia_baktriane').GetName], [GetTitleByKey('e_strategia_upper_satrapies').GetName], [GetTitleByKey('e_strategia_serindia').GetName]"
 LR_form_epikrateia_upper_satrapies_decision_effect_tt: "You create the Epikrateia of the Upper Satrapies, a great kingdom under [GetTitleByKey('h_hellenistic_empire').GetName] that you may grant to a vassal. Every restored satrapy of [GetTitleByKey('e_strategia_baktriane').GetName], [GetTitleByKey('e_strategia_upper_satrapies').GetName], [GetTitleByKey('e_strategia_serindia').GetName] moves directly under it; those strategiai lose their land (your own empty ones are dissolved) and cannot be founded again. Satrapies restored there later go straight under the epikrateia."
