 LR_title_set_pontic_creation_tooltip: "Only the Mithridatic realm may create the Pontic kingdoms and duchies, once the Mithridatic Empire and the Hypsistian faith have both been proclaimed"
 LR_foreign_administration_pontic_modifier: "Foreign Administration (Pontic)"
 LR_foreign_administration_pontic_modifier_desc: "This ruler holds Pontic kingdoms or duchies outside the Mithridatic realm. Their Pontic vassals resent it, and the lands are hard to hold until they are handed to a ruler entitled to them, or lost."
 LR_foreign_administration_pontic_opinion: "Rules Pontic lands as a foreigner"
 LR_pontic_organise_kingdom_hellespontos_decision: "Organise the Kingdom of Hellēspontos"
 LR_pontic_organise_kingdom_hellespontos_decision_desc: "The lands of Hellēspontos answer to Amaseia now. Let them be ordered as the house of Mithridates orders its realm, under the Mithridatic Empire."
 LR_pontic_organise_kingdom_hellespontos_decision_tooltip: "Lay out the Pontic kingdom of Hellēspontos and its duchies"
 LR_pontic_organise_kingdom_hellespontos_decision_confirm: "Organise the Kingdom"
 LR_pontic_organise_kingdom_hellespontos_decision_trigger: "Completely control every county of the Pontic kingdom of Hellēspontos"
 LR_pontic_organise_kingdom_hellespontos_decision_effect_tt: "The counties of Hellēspontos move into its Pontic duchies, and the kingdom becomes [de_jure|E] part of [GetTitleByKey('e_mithridatid_empire').GetName]. Old duchies and kingdoms left without land are dissolved; their holders get the matching Pontic title if it is free."
