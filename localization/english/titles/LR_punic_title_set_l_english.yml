l_english:
 # LR 2026-11-06: the Punic title set (the Carthaginian Empire and its kingdoms) and the Vandal kingdom-empire
 LR_title_set_punic_creation_tooltip: "Only rulers of Phoenician heritage may create the realms of Carthage"
 LR_foreign_administration_punic_modifier: "Foreign Administration (Punic)"
 LR_foreign_administration_punic_modifier_desc: "This ruler holds the realms of Carthage without being of Phoenician heritage. Their Punic vassals resent it, and the lands are hard to hold until they are handed to a ruler entitled to them, or lost."
 LR_foreign_administration_punic_opinion: "Rules Carthage as a foreigner"
 e_regnum_vandalorum: "Kingdom of the Vandals and Alans"
 e_regnum_vandalorum_adj: "Vandal"
 e_regnum_vandalorum_article: "the "
 LR_found_vandal_kingdom_decision: "Found the Kingdom of the Vandals and Alans"
 LR_found_vandal_kingdom_decision_desc: "Gaiseric led our fathers across the strait and took Carthage from the Romans. His heirs still wear its crown, but the realm he built, from the Syrtes to the Balearics, has fallen apart. Gather the shores and islands of the Vandal Sea again under one king of the Vandals and Alans."
 LR_found_vandal_kingdom_decision_tooltip: "Re-found the realm of Gaiseric"
 LR_found_vandal_kingdom_decision_confirm: "Rex Vandalorum et Alanorum!"
 LR_found_vandal_kingdom_crown_tt: "You hold the Crown of Carthage ([GetTitleByKey('k_kartaga').GetName], [GetTitleByKey('k_africa').GetName] or [GetTitleByKey('k_carthage').GetName])"
 LR_found_vandal_kingdom_dejure_tt: "The kingdoms of Africa, Tripolitania, eastern Numidia, Sardinia, Corsica and the Balearics (and Sicily, if you control it) become [de_jure|E] part of the [GetTitleByKey('e_regnum_vandalorum').GetNameNoTier]"
 LR_vandal_kingdom.0001.t: "Rex Vandalorum et Alanorum"
 LR_vandal_kingdom.0001.desc: "From Carthage the word goes out to every shore Gaiseric held: there is again one king of the Vandals and Alans, and the sea between Africa and the islands is his."
 LR_vandal_kingdom.0001.a: "The Vandal Sea is ours once more."
