 LR_title_set_brythonic_creation_tooltip: "Only Britons, Gaels and Norse-Gaels may create the old Celtic realms"
 LR_foreign_administration_brythonic_modifier: "Foreign Administration (Celtic)"
 LR_foreign_administration_brythonic_modifier_desc: "This ruler holds the old kingdoms of the Britons and Gaels without being a Briton or a Gael. Their Celtic vassals resent it, and the lands are hard to hold until they are handed to a ruler entitled to them, or lost."
 LR_foreign_administration_brythonic_opinion: "Rules the Celts as a foreigner"

 LR_restore_brython_kingdoms_decision: "Restore an Old Celtic Kingdom"
 LR_restore_brython_kingdoms_decision_desc: "The bards and filid still sing of the old kingdoms, of Rheged and Gododdin, of Gwynedd and Dumnonia, of Ulaid and the fifths of Ériu. Let one of them rise again, divided into its old lands and set under its high-kingship."
 LR_restore_brython_kingdoms_decision_tooltip: "Restore an old kingdom of the Britons or the Gaels and divide it into its old lands"
 LR_restore_brython_kingdoms_decision_confirm: "Let the bards sing of it"
 LR_restore_brython_kingdoms_decision_trigger: "You completely control the lands of an old Celtic kingdom that is not yet restored"
 LR_restore_brython_kingdoms_decision_effect_tt: "The kingdom is restored over its lands and divided into its duchies, and you take it. It is set under its high-kingship, and the high-kingship under the [GetTitleByKey('h_western_celtic_empire').GetName] if you hold it. If a kingdom of the Britons is restored and you are High King of the Britons, that title is destroyed. Titles of other sets left without land are dissolved, and their holders receive the duchy or kingdom over their old capital."
