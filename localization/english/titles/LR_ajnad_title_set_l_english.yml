 LR_title_set_ajnad_creation_tooltip: "Only Muslim rulers may create al-Khilafa, the wilayat and their districts"
 LR_foreign_administration_ajnad_modifier: "Foreign Administration (Caliphal)"
 LR_foreign_administration_ajnad_modifier_desc: "This ruler holds caliphal wilayat or districts without being a Muslim. The ʿummal resent it, and the lands are hard to hold until they are handed to a ruler entitled to them, or lost."
 LR_foreign_administration_ajnad_opinion: "Rules the caliphal provinces as an unbeliever"
 LR_ajnad_commander_of_the_faithful_modifier: "Commander of the Faithful"
 LR_ajnad_commander_of_the_faithful_modifier_desc: "This ruler holds both the caliphal office and the caliphal provinces."
