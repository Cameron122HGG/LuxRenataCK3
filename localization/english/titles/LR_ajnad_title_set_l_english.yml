 LR_ajnad_guardian_of_the_holy_cities_modifier_desc: "This ruler restored the Caliphate as master of Makka and al-Madina."
 LR_ajnad_establish_sham_decision: "Establish the Wilaya of al-Sham"
 LR_ajnad_establish_sham_decision_desc: "The districts of al-Sham were once ordered by the caliphs, each under its ʿamil. Let the old divisions be drawn again, and al-Sham be a wilaya of the Caliphate."
 LR_ajnad_establish_sham_decision_tooltip: "Lay out Wilayat al-Sham and its districts"
 LR_ajnad_establish_sham_decision_confirm: "Establish the Wilaya"
 LR_ajnad_establish_sham_decision_trigger: "Completely control every county of the districts of al-Sham"
 LR_ajnad_establish_sham_decision_effect_tt: "The counties of al-Sham move into its districts, and the wilaya becomes [de_jure|E] part of [GetTitleByKey('e_khilafa').GetName]. Old duchies and kingdoms left without land are dissolved; their holders get the matching district or wilaya if it is free."
