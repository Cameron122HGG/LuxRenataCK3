 powder_magazine_3_effect_desc: "$unlocks_building_desc$[gunpowder|E] [men_at_arms|E] Recruitment Limit: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_3')|0]#!"
 
 building_type_mandala_capital_01: "Capital Temple Complex"
 building_type_mandala_capital_01_desc: "This [great_project|E] is not just a temple. It is a testament to our mettle. Our accomplishments. Our #EMP grandeur#!. A temple such as this signifies the rule and benevolence of our divine and powerful Devaraja."
 mandala_capital_01: "Ornate Temple"
 mandala_capital_01_desc: "A humble beginning to a grand legacy, this ornate temple is a place to worship and pray to the ruling Devaraja."
 mandala_capital_02: "Majestic Temple"
 mandala_capital_02_desc: "Improving on the original temple building, the capital temple has been extended with additional shrines, furnishings and decorations."
 mandala_capital_03: "Temple Grounds"
 mandala_capital_03_desc: "More lodgings have been added to grow the temple into budding temple grounds.\nIt now houses several shrines for worship as well as shelter for worshipers, servants and the clergy."
 mandala_capital_04: "Grand Temple Complex"
 mandala_capital_04_desc: "The temple complex now span the size of a small village and has become largely self-reliant in most necessities.\nA small reliquary and reflection pools spanning from east to west has been added, further increasing the connection to the spirit plane."
 mandala_capital_05: "Divine Temple Palace"
 mandala_capital_05_desc: "A rarely seen architectural gem, the temple palace has been expanded with magnificent lodgings for the divine Devaraja.\nMonuments, relics, treasures — travelers come from all over to marvel at the excess of this divine temple palace."

 building_type_wulingyuan_01: "$wulingyuan_01$"
 building_type_wulingyuan_01_desc: "$wulingyuan_01_desc$"
 wulingyuan_01: "Wulingyuan"
 wulingyuan_01_desc: "These mountains are filled with thousands of imposing sandstone pillars rising high above the ground. While the pillars are the most striking feature, the area is also filled with ravines, streams, small lakes and caves."

 building_type_leshan_giant_buddha_01: "$leshan_giant_buddha_01$"
 building_type_leshan_giant_buddha_01_desc: "$leshan_giant_buddha_01_desc$"
 leshan_giant_buddha_01: "Leshan Giant Buddha"
 leshan_giant_buddha_01_desc: "Carved into the side of a cliff, this Buddha statue faces the confluence of the Min and Dadu rivers, greeting weary travelers on their journey."

 building_type_yungang_grottoes_01: "$yungang_grottoes_01$"
 building_type_yungang_grottoes_01_desc: "$yungang_grottoes_01_desc$"
 yungang_grottoes_01: "Yungang Grottoes"
 yungang_grottoes_01_desc: "A large complex of temple grottoes, containing a several dozen of larger caves and hundreds of smaller ones. The caves are filled with thousands upon thousands of Buddha statues."

 building_type_wudang_mountain_temples_01: "$wudang_mountain_temples_01$"
 building_type_wudang_mountain_temples_01_desc: "$wudang_mountain_temples_01_desc$"
 wudang_mountain_temples_01: "Wudang Mountain Temples"
 wudang_mountain_temples_01_desc: "The Wudang mountains are one of several mountains sacred to Taoism. They are also the home to large temple complex, famed for the practice of tai chi."

 building_type_shaolin_monastery_01: "$shaolin_monastery_01$"
 building_type_shaolin_monastery_01_desc: "$shaolin_monastery_01_desc$"
 shaolin_monastery_01: "Shaolin Monastery"
 shaolin_monastery_01_desc: "The Shaolin Monastery is perhaps most famous for being the birthplace of Shaolin kung fu and for producing monks highly skilled in martial arts. It is, however, also a place of learning and study, and for translating Buddhist texts."

 building_type_lingyin_temple_01: "$lingyin_temple_01$"
 building_type_lingyin_temple_01_desc: "$lingyin_temple_01_desc$"
 lingyin_temple_01: "Lingyin Temple"
 lingyin_temple_01_desc: "Lingyin Temple was founded by an Indian monk and pilgrim in 328 AD to spread Buddhism. Since then, the temple has grown immensely. It has several pavilions, a large number of grottoes and pagodas, and has enough dormitories to house thousands of monks."

 building_type_giant_wild_goose_pagoda_01: "$giant_wild_goose_pagoda_01$"
 building_type_giant_wild_goose_pagoda_01_desc: "$giant_wild_goose_pagoda_01_desc$"
 giant_wild_goose_pagoda_01: "Giant Wild Goose Pagoda"
 giant_wild_goose_pagoda_01_desc: "The Giant Wild Goose Pagoda was originally constructed in 652 AD as a place to keep and conserve texts, carvings, and various figurines. It was later rebuilt to have an impressive ten stories, until various reconstructions and restorations lowered it to seven stories."

 building_type_kaifeng_palace_01: "$kaifeng_palace_01$"
 building_type_kaifeng_palace_01_desc: "$kaifeng_palace_01_desc$"
 kaifeng_palace_01: "Kaifeng Imperial Palace"
 kaifeng_palace_01_desc: "The imperial palace in Kaifeng was built when the Song dynasty established its capital in the city. A strong and efficient government rule within these walls, ensuring that the city and the realm at large will prosper."
 kaifeng_examination_cost_bonus_desc: "Cost for the [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType( 'activity_imperial_examination').GetName] [activity|E] while this [barony|E] is the [realm_capital|E]: #P -[EmptyScope.ScriptValue('kaifeng_examination_cost_value')|%0]#!"
 kaifeng_palace_name_desc: "[GetBuildingType('kaifeng_palace_01').GetName]"

 building_type_forbidden_city_01: "$forbidden_city_01$"
 building_type_forbidden_city_01_desc: "$forbidden_city_01_desc$"
 forbidden_city_01: "The Forbidden City"
 forbidden_city_01_desc: "The Forbidden City is a vast imperial palace, consisting of almost a thousand separate buildings. The entire compound is surrounded by a high wall and a deep moat, protecting the ruling government and the many officials working tirelessly within."

 building_type_qianling_mausoleum_01: "$qianling_mausoleum_01$"
 building_type_qianling_mausoleum_01_desc: "$qianling_mausoleum_01_desc$"
 qianling_mausoleum_01: "Qianling Mausoleum"
 qianling_mausoleum_01_desc: "The Qianling Mausoleum is primarily the tomb of Emperor Gaozong and Empress Wu Zetian, though several other members of the Li family is buried here as well. The burial mound is protected by a rectangular wall and the many stone statues that adorn the landscape is one of the mausoleum's most recognizable features."

 building_type_quanzhou_seaport_01: "$quanzhou_seaport_01$"
 building_type_quanzhou_seaport_01_desc: "$quanzhou_seaport_01_desc$"
 quanzhou_seaport_01: "Quanzhou Seaport"
 quanzhou_seaport_01_desc: "Quanzhou's port attracts foreign merchants from far and wide. Traders are known to come from Arabia and Anatolia, Japan and Korea, and everything in-between. This influx of trade vessels ensures that local industries are booming and it has made Quanzhou the foremost shipbuilder in the region."

 building_type_angkor_wat_01: "$angkor_wat_01$"
 building_type_angkor_wat_01_desc: "$angkor_wat_01_desc$"
 angkor_wat_01: "Angkor Wat"
 angkor_wat_01_desc: "Angkor Wat is a massive temple complex dedicated to the deity Vishnu. It is designed to be a representation of Mount Meru, home of the gods in Hindu mythology. The complex is surrounded by an impressive moat and has several galleried temples, overflowing with religious art, sculptures and reliefs."

 building_type_citadel_thang_long_01: "Citadel of Thăng Long" # 昇龍
 building_type_citadel_thang_long_01_desc: "$citadel_thang_long_01_desc$"
 citadel_thang_long_01: "Đai La Citadel"
 citadel_thang_long_01_desc: "A citadel that serves as a military base for local armies and is greatly fortified to help repel invaders."
 citadel_thang_long_02: "Imperial Citadel of Thăng Long" # 昇龍
 citadel_thang_long_02_desc: "The Imperial Citadel acts as a fortress and royal residence. The citadel complex includes three sectors, the primary fortification, the imperial city, and the Forbidden City."

 building_type_po_klong_garai_01: "$po_klong_garai_01$"
 building_type_po_klong_garai_01_desc: "$po_klong_garai_01_desc$"
 po_klong_garai_01: "Po Klong Garai Temple"
 po_klong_garai_01_desc: "A pinnacle of Cham architecture, the Po Klong Garai temple is said to be built to honor the legendary king of the same name. It has three distinct brick towers and an impressive sculpture of the god Shiva as its primary art piece."

 building_type_dau_temple_01: "$dau_temple_01$"
 building_type_dau_temple_01_desc: "$dau_temple_01_desc$"
 dau_temple_01: "Dâu Temple"
 dau_temple_01_desc: "A revered temple in Luy Lâu, marks the spot where monks from far-off lands first came together. The brick tower, relics, and mummified masters that remain there embody centuries of devotion to Buddhism."

 building_type_liuhe_pagoda_01: "$liuhe_pagoda_01$"
 building_type_liuhe_pagoda_01_desc: "$liuhe_pagoda_01_desc$"
 liuhe_pagoda_01: "Liuhe Pagoda"
 liuhe_pagoda_01_desc: "A towering pagoda raised by kings to calm the tides and honor the Buddha. Its beacon shines over the land, a symbol of harmony between man and Heaven."

 building_type_muaro_jambi_01: "$muaro_jambi_01$"
 building_type_muaro_jambi_01_desc: "$muaro_jambi_01_desc$"
 muaro_jambi_01: "Muaro Jambi Compounds"
 muaro_jambi_01_desc: "Located along the Batang Hari River, Muaro Jambi's extensive brick compounds protected both trade and faith. As a Srivijayan stronghold, it provided refuge for rulers and mobilized armies within the Sumatran heartland."

 building_type_hanging_temple_01: "$hanging_temple_01$"
 building_type_hanging_temple_01_desc: "$hanging_temple_01_desc$"
 hanging_temple_01: "Hanging Temple"
 hanging_temple_01_desc: "The Hanging Temple is a monastery suspended from a cliff face at Mount Heng. According to legend, its construction began centuries ago with a monk named Liaoran. Its wooden halls, built on stilts, contain shrines to Buddhist, Taoist, and Confucian sages, blending faiths and defying gravity with graceful serenity."

 building_type_pagoda_of_fogong_temple_01: "$pagoda_of_fogong_temple_01$"
 building_type_pagoda_of_fogong_temple_01_desc: "$pagoda_of_fogong_temple_01_desc$"
 pagoda_of_fogong_temple_01: "Pagoda of Fogong Temple"
 pagoda_of_fogong_temple_01_desc: "The Pagoda of Fogong Temple is a tall wooden pagoda built without nails. Rising nine stories, it houses sacred relics and statues, and its clever design remains a marvel of engineering and a symbol of faith."

 building_type_plain_of_jars_01: "$plain_of_jars_01$"
 building_type_plain_of_jars_01_desc: "$plain_of_jars_01_desc$"
 plain_of_jars_01: "Plain of Jars"
 plain_of_jars_01_desc: "The Plain of Jars is a vast plateau strewn with giant stone vessels, their purpose shrouded in mystery. Once used in ancient rites, they endure as relics of a forgotten people, inspiring awe and local reverence."

 building_type_dieng_plateau_01: "$dieng_plateau_01$"
 building_type_dieng_plateau_01_desc: "$dieng_plateau_01_desc$"
 dieng_plateau_01: "Dieng Plateau"
 dieng_plateau_01_desc: "The Dieng Plateau is a mist-covered volcanic basin, where sulfur pools and gas vents dot the landscape. Scattered ancient temples and ritual legends make it both feared and revered, a sacred highland where ancient good and evil deities once roamed."

 building_type_mount_apo_01: "$mount_apo_01$"
 building_type_mount_apo_01_desc: "$mount_apo_01_desc$"
 mount_apo_01: "Mount Apo"
 mount_apo_01_desc: "Rising above Lake Venado, Mount Apo's name means "revered elder" in Lumad languages. It is a shortened form of Apo Sandawa, the spirit of the sacred mountain, also called "Elder Sandawa" or "Grandfather Sandawa." Rituals for Apo Sandawa are performed by the tribe's shaman who is seen as a medium for ancestor spirits."

 building_type_besakih_temple_01: "$besakih_temple_01$"
 building_type_besakih_temple_01_desc: "$besakih_temple_01_desc$"
 besakih_temple_01: "Besakih Temple"
 besakih_temple_01_desc: "Known as the "Mother Temple of Bali," Besakih is the island's most significant and holiest Hindu temple complex. It is located on the slopes of Mount Agung, Bali's tallest volcano and sacred mountain. It is the island's religious and cultural heart, hosting grand ceremonies for all."

 building_type_gongsanseong_fortress_01: "$gongsanseong_fortress_01$"
 building_type_gongsanseong_fortress_01_desc: "$gongsanseong_fortress_01_desc$"
 gongsanseong_fortress_01: "Gongsanseong Fortress"
 gongsanseong_fortress_01_desc: "Gongsanseong Fortress crowns the hills above the Geum River. Built as Baekje's royal citadel, its long walls and stone gates guarded kings and subjects alike, a mountain stronghold of dynastic power and defense."

 building_type_krakatoa_01: "$krakatoa_01$"
 building_type_krakatoa_01_desc: "$krakatoa_01_desc$"
 krakatoa_01: "Krakatoa"
 krakatoa_01_desc: "Krakatoa is a imposing volcano situated on a small archipelago just off the coast."

 building_type_borobudur_01: "$borobudur_01$"
 building_type_borobudur_01_desc: "$borobudur_01_desc$"
 borobudur_01: "Borobudur"
 borobudur_01_desc: "Borobudur is a massive Buddhist temple consisting of nine stone platforms stacked on top of each other, topped by a central dome. The temple is decorated with thousands of reliefs and hundreds of Buddha statues."

 building_type_hoshi_ryokan_01: "$hoshi_ryokan_01$"
 building_type_hoshi_ryokan_01_desc: "$hoshi_ryokan_01_desc$"
 hoshi_ryokan_01: "Hōshi Ryokan"
 hoshi_ryokan_01_desc: "Hōshi Ryokan is an old traditional inn and a family business. It offers travelers a respite on their journey with rest, food, and access to hot spring baths."
 
 building_type_celestial_great_barracks_01: "Great Barracks"
 building_type_celestial_great_barracks_01_desc: "This massive barracks and fortress provide the local governor with soldiers to bolster their armies, and greatly improves the local area's defenses. Expanded, it becomes a fortress town in its own right, from which the province is defended, supplied, and governed whenever the civil officials falter."
 celestial_great_barracks_01: "$building_type_celestial_great_barracks_01$"
 building_celestial_great_barracks_01_desc: "This massive barracks and fortress provide the local governor with soldiers to bolster their armies, and greatly improves the local area's defenses."
 celestial_great_barracks_enabled_desc: "[holder.GetShortUIName|U] [holder.LocalPlayerString( 'are', 'is' )] not a military [governor|E]"
 celestial_great_barracks_great_project_only_desc: "Can only be constructed by completing the [GetGreatProjectType('construct_great_barracks').GetName] [great_project|E]"
 
 building_type_the_great_wall_01: "$the_great_wall_01$"
 building_type_the_great_wall_01_desc: "$the_great_wall_01_desc$"
 the_great_wall_01: "The Great Wall"
 the_great_wall_01_desc: "This is the oldest part of the great wall, largely built by the Qin dynasty. The sands of time might have worn down stone, brick, and mortar, but it's still a formidable piece of fortification."
 building_type_the_great_wall_02: "$the_great_wall_01$"
 building_type_the_great_wall_02_desc: "$the_great_wall_02_desc$"
 the_great_wall_02: "The Great Wall"
 the_great_wall_02_desc: "The Han dynasty greatly expanded the existing walls built by their predecessors. They built some of the more extensive sections, stretching across deserts and mountains for hundred of miles."
 building_type_the_great_wall_03: "$the_great_wall_01$"
 building_type_the_great_wall_03_desc: "$the_great_wall_03_desc$"
 the_great_wall_03: "The Great Wall"
 the_great_wall_03_desc: "The Wei, Qi and Sui dynasties all added to the wall during the 5th and 6th centuries AD, improving several sections with improved fortifications."
 building_type_the_great_wall_04: "$the_great_wall_01$"
 building_type_the_great_wall_04_desc: "$the_great_wall_04_desc$"
 the_great_wall_04: "The Great Wall"
 the_great_wall_04_desc: "A most impressive feat of engineering, this gargantuan wall has been expanded upon many times since its initial construction in the 7th century BC. It now stretches across thousands of miles and encompasses a large number of watchtowers, barracks, and garrison stations. Surely, no barbarian invader will ever overcome this mighty obstacle?"
 building_type_the_great_wall_shanhai_pass: "$the_great_wall_01$"
 building_type_the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 the_great_wall_shanhai_pass: "$the_great_wall_04$"
 the_great_wall_shanhai_pass_desc: "$the_great_wall_04_desc$"
 building_type_the_great_wall_liaodong: "$the_great_wall_01$"
 building_type_the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"
 the_great_wall_liaodong: "$the_great_wall_04$"
 the_great_wall_liaodong_desc: "$the_great_wall_04_desc$"

 special_building_improve_silk_road: "When this [special_building|E] is completed it will bring the [sub_region_temp.GetName] [situation_sub_region|E] closer to the [situation_silk_road_phase_exceptional_bounty|E] [silk_road|E] [situation_phase|E] #weak (if not already in it)#!"


 building_type_herat_bazaar_01: "$herat_bazaar_01$"
 building_type_herat_bazaar_01_desc: "$herat_bazaar_01_desc$"
 herat_bazaar_01: "Bazaar of Herat"
 herat_bazaar_01_desc: "The bustling markets of Herat have been renowned since the ancient Achaemenids it #italic Haraiva#!. The caravans that enter and leave the city every day mark the bazaars of Herat as the Pearl of Khorasan."
 herat_bazaar_02: "Sprawling Bazaar of Herat"
 herat_bazaar_02_desc: "Herat's bazaars overflow with commerce and trade. The Pearl of Khorasan glitters finer than the most polished jewel on any crown."

 building_type_tabriz_bazaar_01: "$tabriz_bazaar_01$"
 building_type_tabriz_bazaar_01_desc: "$tabriz_bazaar_01_desc$"
 tabriz_bazaar_01: "Bazaar of Tabriz"
 tabriz_bazaar_01_desc: "The venerable market of Tabriz has served as the great hub of commerce since time immemorial. Its walls are decorated with colorful tiles and tinted plasters, reflecting the wealth and prestige of this ancient marketplace."
 tabriz_bazaar_02: "Sprawling Bazaar of Tabriz"
 tabriz_bazaar_02_desc: "Age has not sapped Tabriz's august and ancient marketplace of any vitality; if anything, the venerable bazaar seems more lively than ever before."

 building_type_gurganj_bazaar_01: "$gurganj_bazaar_01$"
 building_type_gurganj_bazaar_01_desc: "$gurganj_bazaar_01_desc$"
 gurganj_bazaar_01: "Bazaar of Gurganj"
 gurganj_bazaar_01_desc: "Gateway to the Steppe, the bustling city of Gurganj is notable for its abundance of traders and travelers seeking profits or fortune on the frontier."
 gurganj_bazaar_02: "Sprawling Bazaar of Gurganj"
 gurganj_bazaar_02_desc: "Under the burning sun, nomads, merchants, and adventurers eke out fortunes and trade whispers of far China's wealth over the exotic coins of the Huángdì."

 building_type_lhasa_market_01: "$lhasa_market_01$"
 building_type_lhasa_market_01_desc: "$lhasa_market_01_desc$"
 lhasa_market_01: "Khrom of Lhasa"
 lhasa_market_01_desc: "At a prime crossroads between India and China, the merchants of Lhasa crowd for traveler's attention in the shadow of the lofty Potala palace."
 lhasa_market_02: "Sprawling Khrom of Lhasa"
 lhasa_market_02_desc: "There is nothing new under the sun, so the merchants of Lhasa would have you believe, for there is no bauble or jewel they have not encountered, wending its way along the Silk Road."

 building_type_changan_market_01: "$changan_market_01$"
 building_type_changan_market_01_desc: "$changan_market_01_desc$"
 changan_market_01: "Market of Cháng'ān"
 changan_market_01_desc: "The markets of the great city of Cháng'ān, #EMP Perpetual Peace#!, bustle with all manner of trade, and are an essential stop for nearly all commerce heading both in and out of China."
 changan_market_02: "Sprawling Market of Cháng'ān"
 changan_market_02_desc: "Cháng'ān's prosperous merchants no longer blink at the sight of the greatest treasures known to man — for they have seen them all before, and probably own a few of them."

 building_type_dunhuang_market_01: "$dunhuang_market_01$"
 building_type_dunhuang_market_01_desc: "$dunhuang_market_01_desc$"
 dunhuang_market_01: "Market of Dūnhuáng"
 dunhuang_market_01_desc: "Sat on the glistening banks of the Shule river, the city of Dūnhuáng marks the gateway between the Hexi Corridor and the Tarim basin, and is a key stopping point for all travelers between them."
 dunhuang_market_02: "Sprawling Market of Dūnhuáng"
 dunhuang_market_02_desc: "The sun-bleached streets of Dūnhuáng know only the steady, languid march of countless laden camels, mules, and men, and their ever-crossing paths east and west."

 building_type_lahur_bazaar_01: "$lahur_bazaar_01$"
 building_type_lahur_bazaar_01_desc: "$lahur_bazaar_01_desc$"
 lahur_bazaar_01: "Bazaar of Lahur"
 lahur_bazaar_01_desc: "The old town of Lahur was built around two major markets, surrounded by homes, all enclosed by a long mud wall. This bustling cluster of markets has hummed with activity as long as anyone can remember, and will likely hum with activity for generations to come."
 lahur_bazaar_02: "Sprawling Bazaar of Lahur"
 lahur_bazaar_02_desc: "Trade flows through Lahur as naturally as water flows through a riverbed. Its clustered markets overflow with goods, and its merchants seem to have all the wisdom of the city's storied history lurking behind their keen eyes."

 building_type_hamadan_bazaar_01: "Hamadan Bazaar"
 building_type_hamadan_bazaar_01_desc: "$hamadan_bazaar_01_desc$"
 hamadan_bazaar_01: "Hamadan Bazaar"
 hamadan_bazaar_01_desc: "The heartland of the ancient Median people, Hamadan has been a center of commerce since the time of clay tablets and cuneiform inscriptions. Hundreds of generations of merchants have peddled their wares and worked their craft among the stalls of Hamadan's main bazaar."
 hamadan_bazaar_02: "Sprawling Hamadan Bazaar"
 hamadan_bazaar_02_desc: "Hamadan's great bazaar prospers like never before, achieving new heights of wealth and activity unmatched in its long and dignified history."

 building_type_sunday_bazaar_01: "Sunday Bazaar"
 building_type_sunday_bazaar_01_desc: "$sunday_bazaar_01_desc$"
 sunday_bazaar_01: "Sunday Bazaar"
 sunday_bazaar_01_desc: "Some locals will tell you that before there was money, Kashgar already had the Sunday Bazaar. Walking between the stalls of the market, it certainly feels that way — it's impossible to imagine a time without this place."
 sunday_bazaar_02: "Sprawling Sunday Bazaar"
 sunday_bazaar_02_desc: "While Kashgar's great Sunday Bazaar may have lasted since time immemorial, the prosperity it feels now will surely be remembered for ages to come."
 
 building_type_mount_fuji_01: "Mount Fuji"
 building_type_mount_fuji_01_desc: "The lone, towering, snow-capped peak of Fujisan marks the passage into eastern Japan and is a sight famed throughout the islands, drawing travelers and pilgrims, and granting repose to all who gaze upon it. Among the most sacred Shintō mountains, Fuji is home to #EMP Konohanasakuya-hime#!, goddess of volcanoes, the cherry blossom, and life's ephemeral delicacy."
 mount_fuji_01: "$building_type_mount_fuji_01$"
 mount_fuji_01_desc: "$building_type_mount_fuji_01_desc$"

 building_type_waterworks_01: "Water Management"
 building_type_waterworks_01_desc: "Water is the foundation upon which all life depends. Maintaining a steady supply of water, and effectively utilizing it, is essential for maintaining a strong realm and a strong reign."

 waterworks_01: "Man-Made Ponds"
 building_waterworks_01_desc: "The first step in managing water is having water to manage. A simple depression in the ground, lined with clay for retention, creates a natural spot for water to accumulate for later use."
 building_waterworks_02: "Cisterns"
 building_waterworks_02_desc: "Deeper holes, less permeable linings, and simple roofings help create places where more water can be stored longer with less loss to pollution or evaporation."
 building_waterworks_03: "Level Canals"
 building_waterworks_03_desc: "Digging ditches between storage locations makes managed water far more accessible to far more people. This process relieves pressure from floods when water is overabundant, while still providing water to people, livestock, and crops in times of drought. Planned the right way, these can even be used for light boat traffic."
 building_waterworks_04: "Irrigation Tanks"
 building_waterworks_04_desc: "Any sort of hill or crest or change in elevation can be turned into a place to store water, if the right embankments are dug. Connected by channels, these open tanks of water can feed into each other, giving greater control over how much water is stored and how much water is used at any given time."
 building_waterworks_05: "Stepwells"
 building_waterworks_05_desc: "Water control can be combined with basic well-digging to create tremendous structures dug into the ground that will, at all times, have some water sourced from the earth. These subterranean buildings can still be connected to ground-level sluices and channels that either feed it more water or siphon it away to other areas as needed."
 building_waterworks_06: "Canal Locks"
 building_waterworks_06_desc: "The very depth of a waterway itself can be controlled with gates and drains. Water stored behind these locks can be used to make channels viable waterways for barges and small ships, making the canals excellent for transport."
 building_waterworks_07: "Artificial Lakes"
 building_waterworks_07_desc: "A monumental reservoir can hold a monumental amount of water. Fed by rivers and channels, artificial lakes can provide water for vast farmlands and multitudes of villages. Their grandeur means they can also serve as prestigious places in their own right, making them effective sites for worship and rule."
 building_waterworks_08: "Supply and Sewer Systems"
 building_waterworks_08_desc: "With pipes and pumps, water can flow up and down, giving water to the highest towers and flushing waste away to the farthest cesspools. No place can lack for water, and any excess can be drained away before it turns into a dangerous flood."

 building_type_spice_plantation_01: "Spice Plantations"
 building_type_spice_plantation_01_desc: "The finest fragrances and most delicate flavors can be extracted from plants which grow in only very specific regions of the world. Their rarity and their quality make them exceptionally lucrative to produce, if the earth is able to nurture them."
 building_spice_plantation_01: "Spice Foraging"
 building_spice_plantation_01_desc: "Spices are produced naturally by several trees, bushes, and flowers. The trick is to #italic find#! those plants in the first place."
 building_spice_plantation_02: "Cultivated Spice Groves"
 building_spice_plantation_02_desc: "The highest-demand spices can be cultivated under the right conditions, with the right labor, and the right oversight from the right overseers."
 building_spice_plantation_03: "Spice Orchards"
 building_spice_plantation_03_desc: "Planting crops with a geometric method over a large area can produce a much more predictable amount of spice, year after year after year."
 building_spice_plantation_04: "Spice Drying"
 building_spice_plantation_04_desc: "Setting aside space near the crops to dry spices before shipping means more of a harvest can be processed before it spoils, saving money in overall spice production."
 building_spice_plantation_05: "Spice Mills"
 building_spice_plantation_05_desc: "Grinding can make spices more likely to spoil, but it can also make storage far more efficient. Mills can also assist with winnowing, however, making for a far more pure crop."
 building_spice_plantation_06: "Spice Estates"
 building_spice_plantation_06_desc: "Consolidating worker housing, crop processing and product storage into a site near where the spices are actually grown significantly helps make and sell more spices with fewer expenses overall."
 building_spice_plantation_07: "Plantation Land Management"
 building_spice_plantation_07_desc: "The earth itself can be reshaped to open up more land to crop growth. Terraces and channels create new opportunities for more crops."
 building_spice_plantation_08: "Industrial Spice Production"
 building_spice_plantation_08_desc: "With the right direction, the whole land can be committed to the production of the most lucrative spices. Every tree planted, every bush cultivated, every leaf picked and every nut dried is another coin in the coffers."

 building_type_examination_hall_01: "Examination Hall"
 building_type_examination_hall_01_desc: "Imperial exams can't be conducted without having somewhere to conduct those exams. It is the responsibility of the local governor to ensure that officials have all the resources they need in order to conduct the exams properly, and that test-takers have the support they need while minimizing opportunities to cheat."
 examination_hall_01: "$building_type_examination_hall_01$"
 building_examination_hall_01_desc: "To test candidates for government posts, there needs to be a place to conduct a test. A room devoted to exam-taking is the bare minimum needed, but it is a start."
 examination_hall_02: "$building_type_examination_hall_01$ II"
 building_examination_hall_02_desc: "A little prayer can give some test-takers more confidence than all the studying and preparation in the world."
 examination_hall_03: "$building_type_examination_hall_01$ III"
 building_examination_hall_03_desc: "A complex of lecture halls, testing facilities, faculty offices, and storage-rooms provides the comprehensive support necessary to conduct any and every part of the imperial exam with the utmost efficiency and quality."
 examination_hall_04: "$building_type_examination_hall_01$ IV"
 examination_hall_05: "$building_type_examination_hall_01$ V"
 examination_hall_effects_desc: "[SelectLocalization( HasDlcFeature( 'all_under_heaven' ), 'examination_hall_effect_desc', 'examination_hall_cost_discount_max_desc' )]"
 examination_hall_effect_desc: "Reduced cost for [GetActivityType('activity_imperial_examination').GetTextIcon][GetActivityType('activity_imperial_examination').GetName] and [GetActivityType('activity_local_examination').GetTextIcon][GetActivityType('activity_local_examination').GetName] [activities|E] Hosted in this [holding|E]: [EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 examination_hall_cost_discount_max_desc: "$examination_hall_effect_desc$[EmptyScope.ScriptValue('imperial_examination_cost_discount_max_value')|P0%]"
 imperial_examination_cost_discount_examination_hall: "Location has $building_type_examination_hall_01$"

