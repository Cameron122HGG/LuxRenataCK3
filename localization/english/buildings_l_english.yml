 building_type_kollur_mines_01:0 "The Kollur Mines"
 building_type_kollur_mines_01_desc:0 "The Kollur mines exploit the largest seam of diamonds in all of the Indian subcontinent. The work is extremely dangerous, but the riches are unimaginable."
 kollur_mines_01:0 "Kollur Mining Pits"
 kollur_mines_01_desc:0 "Merely a pit of clay and gravel, loincloth-clad workers toil here night and day to extract diamonds."
 kollur_mines_02:0 "Kollur Mine"
 kollur_mines_02_desc:1 "The mining pits have been expanded, and engineers have been brought in to truly be able to ramp up the extraction of diamonds."
 kollur_mines_03:0 "Large Kollur Mine"
 kollur_mines_03_desc:0 "A village has sprung up around the many mining pits, and the workers find massive diamonds regularly."
 kollur_mines_04:0 "Kollur Mining Complex"
 kollur_mines_04_desc:0 "The extraction of diamonds have reached a near-industrial scale, with the amount of workers now ranging in the thousands. Endless riches seemingly flow from the mines."
 
 building_type_tribe_01:1 "Tribal Hold"
 building_type_tribe_01_desc:1 "A simple but effective tribal hold, standing guard over a tribal village."
 tribe_01:1 "$building_type_tribe_01$"
 tribe_01_desc:1 "Constructed out of logs and rough-hewn stone, this hold is imposing despite its small size."
 tribe_02:1 "$building_type_tribe_01$ II"
 tribe_02_desc:1 "The fortified hold takes its inspiration from feudal castles, adding many new defensive elements."
 
 building_type_longhouses_01:1 "Gathering Halls"
 building_type_longhouses_01_desc:1 "Tribal chiefs, elders and warlords all confer in the longhouse when making decisions. The mighty halls bring prestige upon whoever hosts the gathering."
 building_longhouses_01:1 "Longhouses"
 building_longhouses_01_desc:1 "Longhouses are large enough to accommodate important meetings between elders. Laws and policies are determined here."
 building_longhouses_02:1 "Grand Halls"
 building_longhouses_02_desc:1 "Grand halls host a central stage, where a chief or warlord can deliver rousing speeches."
 
 building_type_war_camps_01:0 "War Camps"
 building_type_war_camps_01_desc:1 "Fierce tribal warriors gather in the war camps when the horn bellows them to war. Even in times of peace, they can be found sparring, preparing for the inevitability of conflict."
 war_camps_01:1 "Sparring Grounds"
 building_war_camps_01_desc:2 "Training equipment, arenas, and wooden walls define the sparring grounds. Warriors come here to hone their skills."
 building_war_camps_02:1 "Warrior Lodges"
 building_war_camps_02_desc:1 "Only the greatest fighters are allowed into a warrior lodge, and their mere presence is inspiring."
 
 building_type_palisades_01:0 "Palisades"
 building_type_palisades_01_desc:2 "Layers of wooden palisades protect the scattered tribal settlements, shielding them from simple threats such as wild animals or smaller raids."
 building_palisades_01:1 "Simple Palisade"
 building_palisades_01_desc:1 "Simple palisades offer limited protection; while effective against skirmishes, they are less reliable against larger groups of enemies."
 building_palisades_02:1 "Walls & Ditches"
 building_palisades_02_desc:1 "Outer ditches combined with stone-reinforced palisade walls offer decent protection against sieges."
 
 building_type_market_villages_01:1 "Markets"
 building_type_market_villages_01_desc:1 "A host of small market villages has sprung up around the more well-traveled parts of these lands. Here the tribesmen trade and barter with traveling merchants."
 building_market_villages_01:1 "Trading Outposts"
 building_market_villages_01_desc:1 "Trading outposts offer the opportunity for tribesmen and traders to meet and barter."
 building_market_villages_02:1 "Market Villages"
 building_market_villages_02_desc:2 "At stated times, these villages host public markets that attract traders from the whole region and increase local wealth."
 
 building_type_water_temples_01: "Subak Water-Temples"
 building_type_water_temples_01_desc: "Inland-friendly irrigation cooperatives anchored by water shrines and temples; ritual calendars coordinate planting and canal maintenance."
 water_temples: "$building_type_water_temples_01$"
 building_type_water_temples_1: "$water_temples$"
 building_type_water_temples_1_desc: "$building_type_water_temples_01_desc$"
 water_temples_1: "$water_temples$"
 water_temples_2: "$water_temples$ II"
 water_temples_3: "$water_temples$ III"
 water_temples_4: "$water_temples$ IV"
 water_temples_5: "$water_temples$ V"
 building_water_temples_01: "Subak Weirs & Field Shrines"
 building_water_temples_01_desc: "Small weirs and earth channels link paddies; a shrine oversees offerings and work-rotas. Reliable surplus begins to flow, and so do rites."
 building_water_temples_02: "Subak Council Shrines"
 building_water_temples_02_desc: "Multiple shrines coordinate a wider "subak" with calendared water sharing; disputes and repairs are handled communally, improving control and yields."
 building_water_temples_03: "Water-Temple Network"
 building_water_temples_03_desc: "A proper water-temple circuit supervises synchronized planting and fallow cycles; pests drop, output rises, and ritual piety grows."
 building_water_temples_04: "Great Water-Temple Landscape"
 building_water_temples_04_desc: "The whole drainage is organized through temple-led assemblies; terraces, sluices, and celebrations make this province a pious breadbasket."
 
 building_type_stilted_granaries_01: "Stilted Granaries"
 building_type_stilted_granaries_01_desc: "Rat-proof, post-raised barns on four or more piles, perfect for storing tribute and provisioning warbands."
 building_stilted_granaries_01: "Post-Raised Granary"
 building_stilted_granaries_01_desc: "A simple four-post barn keeps seed and tribute dry; village guards eat better on campaign."
 building_stilted_granaries_02: "Granary Row"
 building_stilted_granaries_02_desc: "A line of stilted barns with rat-stoppers and covered steps. Grain dues grow steadier and levy recovery improves."
 building_stilted_granaries_03: "Carved Stilt Granaries"
 building_stilted_granaries_03_desc: "Prestige carvings mark surplus; stewards rotate stores and rations for longer marches."
 building_stilted_granaries_04: "Granary Ward"
 building_stilted_granaries_04_desc: "A fenced cluster with watch-lean-to and tally shed, food security steadies the whole county."
 
 building_type_kora_kora_yards_01: "Kora-Kora Yards"
 building_type_kora_kora_yards_01_desc: "Clan canoe sheds and slipways for outrigger war-canoes."
 kora_kora_yards: "$building_type_kora_kora_yards_01$"
 building_type_kora_kora_yards_1: "$kora_kora_yards$"
 building_type_kora_kora_yards_1_desc: "$building_type_kora_kora_yards_01_desc$"
 kora_kora_yards_1: "$kora_kora_yards$"
 kora_kora_yards_2: "$kora_kora_yards$ II"
 kora_kora_yards_3: "$kora_kora_yards$ III"
 kora_kora_yards_4: "$kora_kora_yards$ IV"
 kora_kora_yards_5: "$kora_kora_yards$ V"
 building_kora_kora_yards_01: "Canoe Sheds"
 building_kora_kora_yards_01_desc: "Covered slips for paddled outriggers; crews drill for shore raids and inter-island runs."
 building_kora_kora_yards_02: "Clan Boat Yard"
 building_kora_kora_yards_02_desc: "Stockpiles of timbers, fiber lashings, and spare outriggers speed turnarounds; raiders bring back trophies and barter goods."
 building_kora_kora_yards_03: "Kora-Kora Yard"
 building_kora_kora_yards_03_desc: "Larger hulls, fighting platforms, and signal drums; coastal patrols and seasonal expeditions become a rhythm of life (and income)."
 building_kora_kora_yards_04: "Great War-Canoe Arsenal"
 building_kora_kora_yards_04_desc: "Yard masters outfit whole fleets; launch ramps, rigging lofts, and mustering platforms put fear into neighbors."
 
 building_type_idjang_forts_01: "Idjang Forts"
 building_type_idjang_forts_01_desc: "Terraced tribal citadels, strongpoints on spurs or knolls."
 idjang_forts: "$building_type_idjang_forts_01$"
 building_type_idjang_forts_1: "$idjang_forts$"
 building_type_idjang_forts_1_desc: "$building_type_idjang_forts_01_desc$"
 idjang_forts_1: "$idjang_forts$"
 idjang_forts_2: "$idjang_forts$ II"
 idjang_forts_3: "$idjang_forts$ III"
 idjang_forts_4: "$idjang_forts$ IV"
 idjang_forts_5: "$idjang_forts$ V"
 building_idjang_forts_01: "Stockaded Idjang"
 building_idjang_forts_01_desc: "A timber palisade crowns a defensible rise, watch-fires and dry moats deter raiders."
 building_idjang_forts_02: "Stone-Walled Idjang"
 building_idjang_forts_02_desc: "Rubble revetments replace timber in key faces; covered paths let defenders shuttle safely."
 building_idjang_forts_03: "Terraced Idjang"
 building_idjang_forts_03_desc: "Step-cut approaches, sally stairs, and firing platforms create murderous angles for arrows and spears."
 building_idjang_forts_04: "Citadel Idjang"
 building_idjang_forts_04_desc: "Gatehouse, inner keep, and cistern; the garrison can hold for seasons."
 
 building_type_wantilan_01: "Wantilan"
 building_type_wantilan_01_desc: "Open, wall-less great halls and community pavilions for assemblies, rites, and performances."
 building_wantilan_01: "Small Wantilan"
 building_wantilan_01_desc: "The village hall hosts musters, oaths, and rehearsals; elders arbitrate feuds before they spark."
 building_wantilan_02: "Wantilan Pavilion"
 building_wantilan_02_desc: "A broad, tier-roofed hall handles festivals and initiations where shared rites lift morale and prestige."
 building_wantilan_03: "Temple Wantilan"
 building_wantilan_03_desc: "A ceremonial space tied to the local sanctuary with ample space for offerings and processions."
 building_wantilan_04: "Great Wantilan"
 building_wantilan_04_desc: "A landmark arena where drums, dancers, and captains share one roof."
 
 building_type_military_academy_01:0 "Military Academies"
 building_type_military_academy_01_desc:0 "Dedicated facilities for training officers and knights, improving their efficiency in combat."
 military_academy_01:0 "$building_type_military_academy_01$"
 building_military_academy_01_desc:0 "Aspiring officers are vetted based on merit in the military school. Naturally, the school only accepts students of a noble pedigree."
 military_academy_02:3 "$building_type_military_academy_01$ II"
 building_military_academy_02_desc:1 "Middle to high level officers are trained here, where they gain a greater understanding of troop movements, field preparations, and battlefield conditions."
 military_academy_03:3 "$building_type_military_academy_01$ III"
 building_military_academy_03_desc:2 "A Grand Military Academy is the beating heart of an advanced military apparatus. Officers trained here learn all about field strategy, army organization, and the latest technological advancements in warfare."
 military_academy_04:3 "$building_type_military_academy_01$ IV"
 military_academy_05:3 "$building_type_military_academy_01$ V"
 
 building_type_march_01:0 "Marches"
 building_type_march_01_desc:0 "Marcher lords protect the borders with fortifications and local garrisons."
 marches_effect_desc: "Reduces the chances for special [raid_intents|E]"
 marches_effect_2_desc: "Blocks special [raid_intents|E]"
 march_01:0 "$building_type_march_01$"
 building_march_01_desc:0 "Marches are constructed in the most vulnerable and remote areas of the duchy, protecting against attacks. While few and far between, they serve as a useful warning system, and also catch the occasional smuggler."
 march_02:2 "$building_type_march_01$ II"
 building_march_02_desc:1 "The system of marcher lords is expanded along the entire border, providing a solid line of defense."
 march_03:2 "$building_type_march_01$ III"
 building_march_03_desc:0 "Large march fortifications are constructed all over the duchy, significantly hampering any attacking force."
 march_04:2 "$building_type_march_01$ IV"
 march_05:2 "$building_type_march_01$ V"
 
 building_type_siege_works_01:0 "Siege Works"
 building_type_siege_works_01_desc:0 "Dedicated siege works allow the ruler to field and maintain superior-quality siege weapons."
 siege_works_01:0 "$building_type_siege_works_01$"
 building_siege_works_01_desc:1 "Siege workshops provide a quicker and constant flow of siege weapons through specialized and standardized building procedures."
 siege_works_02:2 "$building_type_siege_works_01$ II"
 building_siege_works_02_desc:1 "Specialized engineers are required to field the most advanced weapons of siege warfare: the trbuchets."
 siege_works_03:2 "$building_type_siege_works_01$ III"
 building_siege_works_03_desc:1 "Cannons are the latest weapon to appear on the warfare scene. Loud, heavy, and difficult to maneuver, they are nevertheless lethal against stone fortifications. Being able to produce and field cannons puts us to an indisputable advantage against our enemies."
 siege_works_04:2 "$building_type_siege_works_01$ IV"
 siege_works_05:2 "$building_type_siege_works_01$ V"
 
 building_type_royal_armory_01:0 "Royal Armory"
 building_type_royal_armory_01_desc:2 "Crown-funded armories ensure a steady supply and maintenance of working weapons for the army."
 royal_armory_01:0 "$building_type_royal_armory_01$"
 building_royal_armory_01_desc:1 "In times of war, peasant levies can be assigned a weapon from the depot. It's mostly rusty old axes, splintering spears, and blunt blades, but with a little maintenance they can easily be more efficient than the average farming tools the levies are usually armed with."
 royal_armory_02:2 "$building_type_royal_armory_01$ II"
 building_royal_armory_02_desc:1 "Armories run by the crown collect and maintain weapons and armor for use in war. These are of decent quality, and can make any drunk layabout look like a proper soldier, if not act like one."
 royal_armory_03:2 "$building_type_royal_armory_01$ III"
 building_royal_armory_03_desc:1 "A Royal Arsenal hosts and maintains a huge amount of weapons, enough to field uncountable peasant levies on short notice and to attract the best mercenaries in the land."
 royal_armory_04:2 "$building_type_royal_armory_01$ IV"
 royal_armory_05:2 "$building_type_royal_armory_01$ V"
 
 building_type_jousting_lists_01:0 "Jousting Lists"
 building_type_jousting_lists_01_desc:0 "By having dedicated grounds for jousting, more riders and knights are encouraged to train and join the banners."
 jousting_lists_01:0 "$building_type_jousting_lists_01$"
 building_jousting_lists_01_desc:0 "A clearing is kept open year-round to facilitate the training of riders and knights."
 jousting_lists_02:1 "$building_type_jousting_lists_01$ II"
 building_jousting_lists_02_desc:0 "With jousting lists and stands for the public, these tournament grounds attract a huge amount of contestants."
 jousting_lists_03:1 "$building_type_jousting_lists_01$ III"
 building_jousting_lists_03_desc:0 "Upgraded with seats for royal guests and a larger fairground, the tournament arena is truly impressive."
 jousting_lists_04:1 "$building_type_jousting_lists_01$ IV"
 jousting_lists_05:1 "$building_type_jousting_lists_01$ V"
 
 building_type_blacksmiths_01:1 "Blacksmiths"
 building_type_blacksmiths_01_desc:0 "Smiths in the employ of the crown forge weapons and armor for the royal guard, ensuring a steady supply of superior armaments."
 blacksmiths_01:1 "$building_type_blacksmiths_01$"
 building_blacksmiths_01_desc:1 "The best and most productive smiths are employed by the crown and set to produce swords, mail, and pikes for the royal guard."
 blacksmiths_02:2 "$building_type_blacksmiths_01$ II"
 building_blacksmiths_02_desc:0 "By collaborating with the various guilds, large amounts of gear can be made cheaply on order."
 blacksmiths_03:2 "$building_type_blacksmiths_01$ III"
 building_blacksmiths_03_desc:0 "Large forges are constructed for the sole purpose of supplying the crown with weapons; only the best smiths are employed to work therein."
 blacksmiths_04:2 "$building_type_blacksmiths_01$ IV"
 blacksmiths_05:2 "$building_type_blacksmiths_01$ V"
 
 building_type_archery_ranges_01:0 "Archery Ranges"
 building_type_archery_ranges_01_desc:0 "Dedicated archery ranges allow the common folk to train with bows, and experienced archers to hone their skills."
 archery_ranges_01:0 "$building_type_archery_ranges_01$"
 building_archery_ranges_01_desc:0 "Everyone is welcome at the archery range, regardless of if you're wealthy or poor. The reason is twofold; peasants that can fire a bow are more useful in war, and experienced marksmen keep themselves in top shape when they can compete in tournaments."
 archery_ranges_02:2 "$building_type_archery_ranges_01$ II"
 building_archery_ranges_02_desc:1 "The best bowyers are employed by the crown, and set to craft the highest-quality bows they can in facilities specifically constructed for the task."
 archery_ranges_03:2 "$building_type_archery_ranges_01$ III"
 building_archery_ranges_03_desc:0 "To inspire the peasantry and provide ample challenge for our marksmen, these special ranges are designed to train our archers in long-distance archery."
 archery_ranges_04:2 "$building_type_archery_ranges_01$ IV"
 archery_ranges_05:2 "$building_type_archery_ranges_01$ V"
 
 building_type_leisure_palace_01:0 "Leisure Palace"
 building_type_leisure_palace_01_desc:0 "While staying in one lavishly luxuriant castle is fine, having a few more to choose between never hurts."
 leisure_palace_01:0 "$building_type_leisure_palace_01$"
 building_leisure_palace_01_desc:0 "When the burdens of responsibility become too much (or an angry mob of peasants is storming the gates), there's no place like the rural, far-away chateau for some impromptu relaxation!"
 leisure_palace_02:1 "$building_type_leisure_palace_01$ II"
 building_leisure_palace_02_desc:0 "The summer palace is located in a scenic part of the duchy, far away from the menial lives of our toiling subjects. There's truly no better way to display royal power and prestige, and the simple fact that we are #emphasis better#! than everyone else."
 leisure_palace_03:1 "$building_type_leisure_palace_01$ III"
 building_leisure_palace_03_desc:0 "The winter palace is designed to house the royal family during the harsher months of the year. With a well-stocked larder and a defensible position, it towers over any shivering subjects that have the privilege to work nearby."
 leisure_palace_04:1 "$building_type_leisure_palace_01$ IV"
 leisure_palace_05:1 "$building_type_leisure_palace_01$ V"
 chateau_01:1 "Chateau"
 chateau_02:1 "$chateau_01$ II"
 chateau_03:1 "$chateau_01$ III"
 chateau_04:1 "$chateau_01$ IV"
 chateau_05:1 "$chateau_01$ V"
 
 building_type_royal_forest_01:0 "Royal Forest"
 building_type_royal_forest_01_desc:0 "A royal forest is a valuable source of wealth, allowing you to override the law of the land in a province, strip rights from the locals, and then sell them back. Needless to say, the hunting is also excellent."
 royal_forest_01:0 "$building_type_royal_forest_01$"
 building_royal_forest_01_desc:0 "Large areas of forest in this duchy are reserved for use by the royal family. Peasants are prohibited from living in the forest, hunting any of its animals or clearing trees for agriculture. Attacking the crown's tax assessors as they're passing by is especially prohibited."
 royal_forest_02:1 "$building_type_royal_forest_01$ II"
 building_royal_forest_02_desc:0 "Entire towns are now subsumed by this royal forest, and nearby settlements often find that the monarch's men have 'discovered' maps placing their dwellings firmly inside the local crownswood."
 royal_forest_03:1 "$building_type_royal_forest_01$ III"
 building_royal_forest_03_desc:0 "Law is only as good as the system that backs it up, and now this royal forest has an entire system of courts, wardens, and clerks, backed up by trained magistrates, all ready to enforce the diktats of the crown."
 royal_forest_04:1 "$building_type_royal_forest_01$ IV"
 royal_forest_05:1 "$building_type_royal_forest_01$ V"
 
 building_type_royal_garden_01:0 "Royal Garden"
 building_type_royal_garden_01_desc:0 "Few places allow people to relax and socialize as well as a beautiful garden. While a small and personal garden would suffice for most, only the most spectacular of creations is good enough for the wealthy and powerful!"
 royal_garden_01:0 "$building_type_royal_garden_01$"
 building_royal_garden_01_desc:0 "A small garden enclosed by stone walls. It provides a small haven of peace and comfort by shutting out the busy world outside."
 royal_garden_02:1 "$building_type_royal_garden_01$ II"
 building_royal_garden_02_desc:0 "An expansive and impressive garden housing flowers, herbs, fruit trees, and everything in between. Maintained by a large number of gardeners, the garden is under constant care."
 royal_garden_03:1 "$building_type_royal_garden_01$ III"
 building_royal_garden_03_desc:0 "The royal park is a vast and stunning landscape carefully crafted into the surrounding terrain and architecture. Open and available to everyone, it brings awe to visitors far and wide."
 royal_garden_04:1 "$building_type_royal_garden_01$ IV"
 royal_garden_05:1 "$building_type_royal_garden_01$ V"
 
 building_type_ananda_temple_01:0 "Ananda Temple"
 building_type_ananda_temple_01_desc:0 "While Pagan has thousands of pagodas, temples, and shrines littered throughout the city and the surrounding plains, the Ananda Temple stands as a crowning achievement among them. The perfectly dimensioned structure contains many unique plaques and stone images. It is a place of worship and a center of learning to educate the people in religious ethos."
 ananda_temple_01:0 "$building_type_ananda_temple_01$"
 ananda_temple_01_desc:0 "$building_type_ananda_temple_01_desc$"
 
 building_type_hotin_fort_01:0 "Hotin Fortification"
 building_type_hotin_fort_01_desc:0 "Hotin Fort is a small fort built on the banks of the river Dniester. Its location allows it to protect local trade routes and grants the owner control of the river."
 hotin_fort_01:0 "Hotin Fort"
 hotin_fort_01_desc:0 "$building_type_hotin_fort_01_desc$"
 hotin_fort_02:0 "Hotin Fortress"
 hotin_fort_02_desc:0 "An impressive Fortress that makes the old fort pale in comparison. The fortifications have been expanded across the centuries to include high stone walls, a wide moat, and several massive towers. This defensive structure will hold most besiegers at bay with ease."
 
 building_type_golden_gate_of_kiev_01:1 "Golden Gate of Kyiv"
 building_type_golden_gate_of_kiev_01_desc:1 "Modeled and named after a gate in Constantinople, the Golden Gate of Kyiv serves as both an entrance to the city and a triumphal arch. The golden dome of the church, built on top of the gate, can be seen from afar and makes it a prominent symbol of Kyiv."
 golden_gate_of_kiev_01:0 "$building_type_golden_gate_of_kiev_01$"
 golden_gate_of_kiev_01_desc:0 "$building_type_golden_gate_of_kiev_01_desc$"
 
 building_type_heddal_stave_church_01:0 "Heddal Stave Church"
 building_type_heddal_stave_church_01_desc:0 "Heddal Stave Church is the largest stave church in Norway and has a beautiful wooden interior. Legend says the church was built by a mountain troll in merely three days."
 heddal_stave_church_01:0 "$building_type_heddal_stave_church_01$"
 heddal_stave_church_01_desc:0 "$building_type_heddal_stave_church_01_desc$"
 
 building_type_temple_of_uppsala_01:0 "Temple of Uppsala"
 building_type_temple_of_uppsala_01_desc:0 "The temple at Uppsala serves as a religious center for large parts of Scandinavia. A sacred tree stands near the temple, next to a well, similar to that of the legendary Yggdrasil."
 temple_of_uppsala_01:0 "$building_type_temple_of_uppsala_01$"
 temple_of_uppsala_01_desc:0 "$building_type_temple_of_uppsala_01_desc$"
 temple_of_uppsala_02:0 "Uppsala Cathedral"
 temple_of_uppsala_02_desc:0 "A lofty cathedral built to rival the most splendid constructions of southern Europe, Uppsala Cathedral serves as the burial site for some of the most prominent monarchs of Sweden and contains several saintly relics."
 
 building_type_lund_cathedral_01:0 "Lund Cathedral"
 building_type_lund_cathedral_01_desc:0 "Lund Cathedral is a magnificent church richly decorated with stone sculptures. Constructed with influences from Romanesque architecture, the church shares a lot of similarities with churches in Germany. The building is dedicated to Saint Lawrence, who is the patron saint of Lund."
 lund_cathedral_01:0 "$building_type_lund_cathedral_01$"
 lund_cathedral_01_desc:0 "$building_type_lund_cathedral_01_desc$"
 
 building_type_danevirke_01:0 "Danevirke"
 building_type_danevirke_01_desc:1 "The Danevirke is an extensive earthwork fortification built to prevent incursions from the continent into Danish territories and has been expanded multiple times since its original construction."
 danevirke_01:0 "$building_type_danevirke_01$"
 danevirke_01_desc:0 "$building_type_danevirke_01_desc$"

 building_type_aljaferia_palace_01:0 "Aljafería"
 building_type_aljaferia_palace_01_desc:0 "A great palace-fortress built on the Saría plain, the Aljafería is a testament to the power and wealth of Zaragoza. Imposing and splendid in equal measure; it is both an intimidating fortification and a pinnacle of Iberian architecture."
 aljaferia_palace_01:0 "$building_type_aljaferia_palace_01$"
 aljaferia_palace_01_desc:0 "$building_type_aljaferia_palace_01_desc$"

 building_type_roman_wall_of_lugo_01:0 "Roman Walls of Lugo"
 building_type_roman_wall_of_lugo_01_desc:0 "Built by the Romans long ago, the great Walls of Lugo remain an impressive sight. Pilgrims pass their five gates on the road to Santiago de Compostela, making the journey even more profound."
 roman_wall_of_lugo_01:0 "$building_type_roman_wall_of_lugo_01$"
 roman_wall_of_lugo_01_desc:0 "$building_type_roman_wall_of_lugo_01_desc$"

 building_type_rock_of_gibraltar_01:0 "Rock of Gibraltar"
 building_type_rock_of_gibraltar_01_desc:0 "The monolithic Rock of Gibraltar overlooks a narrow strait that is the gateway to the Mediterranean Sea. It was one of the Pillars of Hercules in antiquity, considered to mark the end of the known world. Looking at it now, you cannot help but wonder what lies beyond."
 rock_of_gibraltar_01:0 "$building_type_rock_of_gibraltar_01$"
 rock_of_gibraltar_01_desc:0 "$building_type_rock_of_gibraltar_01_desc$"

 building_type_tower_of_hercules_01:0 "Farum Brigantium"
 building_type_tower_of_hercules_01_desc:0 "This ancient lighthouse is said to have been based on its more famous sister in Alexandria. Having guided seafarers for untold centuries, it remains important to Galicia's coastal trade. Some claim that you can glimpse Ireland's green coast from the top of this lonely tower, but gazing out, you see only endless sea."
 tower_of_hercules_01:0 "$building_type_tower_of_hercules_01$"
 tower_of_hercules_01_desc:0 "$building_type_tower_of_hercules_01_desc$"

 building_type_city_wall_of_toledo_01:0 "City Walls of Toledo"
 building_type_city_wall_of_toledo_01_desc:0 "Originally built by the Romans in days of old, these massive walls were significantly expanded under the reign of Wamba, king of the Visigoths. The early Arabic rulers widened them even further, creating a defensive system fit for the City of Kings."
 city_wall_of_toledo_01:0 "$building_type_city_wall_of_toledo_01$"
 city_wall_of_toledo_01_desc:0 "$building_type_city_wall_of_toledo_01_desc$"

 building_type_alcazar_of_segovia_01:0 "Alcázar of Segovia"
 building_type_alcazar_of_segovia_01_desc:0 "Rising like the bow of a ship from a rocky crag, this fortress is an awe-inspiring sight. As majestic as it is impenetrable, it is the greatest of all castles in the kingdom of castles — Castile."
 alcazar_of_segovia_01:0 "$building_type_alcazar_of_segovia_01$"
 alcazar_of_segovia_01_desc:0 "$building_type_alcazar_of_segovia_01_desc$"

 building_type_holy_site_basilica_santiago_01:0 "Cathedral of Santiago de Compostela"
 building_type_holy_site_basilica_santiago_01_desc:0 "Built over the tomb of James the Great, this splendid edifice is the end point of the Way of Saint James, and the crown of one of the great sites of Christendom. Pilgrims from all over Western and Northern Europe arrive in large numbers, speaking dozens of tongues — though many become mute with awe."
 holy_site_basilica_santiago_01:0 "$building_type_holy_site_basilica_santiago_01$"
 holy_site_basilica_santiago_01_desc:0 "$building_type_holy_site_basilica_santiago_01_desc$"

 building_type_charnel_grounds_01: "Charnel Grounds"
 building_type_charnel_grounds_01_desc: "As much sites for spiritual cleansing as they are areas for the dead to rest, these open-air grounds provide a site for bodies to decompose."

 charnel_grounds_01: "$building_type_charnel_grounds_01$"
 building_charnel_grounds_01_desc: "Bleached by the sun and picked at by birds of prey, bodies putrefy on the hilltop."

 charnel_grounds_02: "$building_type_charnel_grounds_01$ II"
 building_charnel_grounds_02_desc: "Part religious site, part graveyard, the rotting bodies of the dead are kept well away from the living here."

 charnel_grounds_03: "$building_type_charnel_grounds_01$ III"
 building_charnel_grounds_03_desc: "Bodies litter the landscape, scented sachets partially covering up the smell around the paths where the still-living prepare new offerings to the elements."
 charnel_grounds_04: "$building_type_charnel_grounds_01$ IV"
 charnel_grounds_05: "$building_type_charnel_grounds_01$ V"
 
 building_type_imam_reza_shrine_01: "Sanctuary of Imam Reza"
 building_type_imam_reza_shrine_01_desc: "This sanctuary houses the remains of Ali ar-Rida, celebrated by some Shiites as the eighth imam, who was martyred in this land. The ever-expanding complex includes his shrine as well as prayer halls, a library and a bazaar, growing in an eclectic but glorious fashion with the ebb and flow of pilgrims and caravans."
 imam_reza_shrine_01: "$building_type_imam_reza_shrine_01$"
 imam_reza_shrine_01_desc: "$building_type_imam_reza_shrine_01_desc$"

 building_type_soltaniyeh_01: "Dome of Soltaniyeh"
 building_type_soltaniyeh_01_desc: "Both temple and mausoleum, the grand scale and exquisite symmetry of this building is sure to inspire many great works yet to come. Its great double-shelled dome is clad in turquoise, and of such a scale that it almost seems like a challenge to heaven."
 soltaniyeh_01: "$building_type_soltaniyeh_01$"
 soltaniyeh_01_desc: "$building_type_soltaniyeh_01_desc$"

 building_type_palace_of_ctesiphon_01: "Ruins of the Palace of Ctesiphon"
 building_type_palace_of_ctesiphon_01_desc: "This ancient edifice was the ceremonial seat of the Sasanian kings of kings, but silence has fallen over its once glorious halls, and the flowers in the gardens bloom no more. Much material was taken for the founding of Baghdad, and the people have scattered to the four winds. Yet, an eerie splendor remains, the lingering glory of old."
 palace_of_ctesiphon_01: "$building_type_palace_of_ctesiphon_01$"
 palace_of_ctesiphon_01_desc: "$building_type_palace_of_ctesiphon_01_desc$"

 building_type_palace_of_ctesiphon_02: "Great Palace of Ctesiphon"
 building_type_palace_of_ctesiphon_02_desc: "Now rebuilt, the seat of the ancient kings is restored to its full glory. The gardens bloom anew, and the halls are yet again filled with music and splendor. Visitors come from near and far to behold the great arch of the open throne room, a long-forgotten wonder of the ancient world, that has now at last found its place in the songs." 
 palace_of_ctesiphon_02: "$building_type_palace_of_ctesiphon_02$"
 palace_of_ctesiphon_02_desc: "$building_type_palace_of_ctesiphon_02_desc$"

 building_type_falak_ol_aflak_citadel_01: "Falak-ol-Aflak"
 building_type_falak_ol_aflak_citadel_01_desc: "Ensconced on a hilltop above the town of Khorramabad, this Sasanian mudbrick fortress remains an impressive sight. The inhabitants of the valley call it #italic Falak-ol-Aflak#!, "The Heaven of Heavens", for it seems to them to rest on top of the world, and within its strong walls, they have often found refuge."
 falak_ol_aflak_citadel_01: "$building_type_falak_ol_aflak_citadel_01$"
 falak_ol_aflak_citadel_01_desc: "$building_type_falak_ol_aflak_citadel_01_desc$"

 building_type_minarets_and_remains_of_jam_01: "Minaret of Jam"
 building_type_minarets_and_remains_of_jam_01_desc: "This structure towers over the Hari river valley, covered in stucco and glazed tile decorations and alternating bands of calligraphy, an exquisite monument to what faith and wealth can achieve even in these remote, rugged lands."
 minarets_and_remains_of_jam_01: "$building_type_minarets_and_remains_of_jam_01$"
 minarets_and_remains_of_jam_01_desc: "$building_type_minarets_and_remains_of_jam_01_desc$"

 building_type_great_wall_of_gorgan_01: "Great Wall of Gorgan"
 building_type_great_wall_of_gorgan_01_desc: "A vast fortification system built by the ancient kings as a bulwark against the Hephthalites Huns, the Great Wall of Gorgan is shrouded in legend. Alexander the Great himself is said to have passed through its gates on his march to conquer the East."
 great_wall_of_gorgan_01: "$building_type_great_wall_of_gorgan_01$"
 great_wall_of_gorgan_01_desc: "$building_type_great_wall_of_gorgan_01_desc$"

 building_type_maharloo_lake_01: "Lake Maharloo"
 building_type_maharloo_lake_01_desc: "Though this seasonal lake is sometimes merely a dry salt flat, in mid-summer the waters achieve an exquisite, pale red hue. Young poets gather at the shore to gaze upon the strange water, and ponder the beauty and mysteries of the earth." 
 maharloo_lake_01: "$building_type_maharloo_lake_01$"
 maharloo_lake_01_desc: "$building_type_maharloo_lake_01_desc$"

 building_type_tomb_of_cyrus_01: "Tomb of Batsheba"
 building_type_tomb_of_cyrus_01_desc: "This ancient tomb of white limestone is said to be the resting place of Batsheba, the mother of king Solomon, exalted by many faiths. Women tend to the site, and only women are allowed to enter the tomb's dark interior. They seldom speak of what they have seen inside. The waters nearby are said to be blessed, and can cure those who have been bitten by mad dogs."
 tomb_of_cyrus_01: "$building_type_tomb_of_cyrus_01$"
 tomb_of_cyrus_01_desc: "$building_type_tomb_of_cyrus_01_desc$"

 building_type_rainbow_mountains_01: "Rainbow Mountains"
 building_type_rainbow_mountains_01_desc: "The Creator themselves seem to have painted these ridges in a rainbow of colors. Bands of red, white, yellow, gray, orange and yet stranger hues tint the rocky, tranquil landscape. Local rulers will often take guest hunting here, to see this sublime wonder."
 rainbow_mountains_01: "$building_type_rainbow_mountains_01$"
 rainbow_mountains_01_desc: "$building_type_rainbow_mountains_01_desc$"

 building_type_mount_damavand_01: "Mount Damavand"
 building_type_mount_damavand_01_desc: "A great, snow-capped pinnacle steeped in ancient lore, Mount Damavand is said to be the prison of the monstrous tyrant Zahhāk, where he will abide until the end of the world. Many heroes of old have performed great feats on this mountain, and to those who travel there today, its mighty presence seem to touch their very souls. A dormant volcano, its slopes are dotted by hot springs where weary travelers can stop and relax, pondering the deeds of the ancients."
 mount_damavand_01: "$building_type_mount_damavand_01$"
 mount_damavand_01_desc: "$building_type_mount_damavand_01_desc$"

 building_type_holy_site_fire_temple_01: "Great Fire Temple"
 building_type_holy_site_fire_temple_01_desc: "Inside this grand edifice burns an #italic Atash Behram#!, a Fire of Victory, the greatest and purest of all flames, gathered from lightning, royal candles, cremation pyres, goldsmiths' furnaces and ascetics' hearths. Pilgrims from far away lands come to behold this wonder, while the magi perform seemingly unending purification rites."
 holy_site_fire_temple_01: "Great Fire Temple"
 holy_site_fire_temple_01_desc:1 "$building_type_holy_site_fire_temple_01_desc$"

 building_type_ark_of_bukhara_01: "Ark of Bukhara"
 building_type_ark_of_bukhara_01_desc: "It is said that prince Siyavusha built this massive fortress when the world was young. Three thousand years later, it was restored by the Bukhara Khudas, the ancient rulers of this region, and it has been in use ever since. Travelers come from near and far to admire the construction, with seven great pillars mirroring the seven stars of the Big Dipper, but it is a fortification first and foremost, intimidating in its splendor."
 ark_of_bukhara_01: "$building_type_ark_of_bukhara_01$"
 ark_of_bukhara_01_desc: "$building_type_ark_of_bukhara_01_desc$"

 building_type_shah_i_zinda_01: "Shah-i-Zinda"
 building_type_shah_i_zinda_01_desc: "The name of this tomb complex means #italic The Living King#!, referring to Muhammad's cousin Quham ibn Abbas who is said to be buried here. The mausoleums are quite small and humble, yet they hold a solemn beauty that makes many linger amidst the silent tombs, to ponder the transience of life." 
 shah_i_zinda_01: "$building_type_shah_i_zinda_01$"
 shah_i_zinda_01_desc: "$building_type_shah_i_zinda_01_desc$"
 shah_i_zinda_02: "Shah-i-Zinda Necropolis"
 shah_i_zinda_02_desc: "A vast necropolis of mausoleums, tall gates and domed passages clad in turquoise tiles, #italic The Living King#! is the burial site of the prophet's cousin and many other great lords of old. The complex is ever-expanding and sublime, eerie and impressive in equal measure."

 building_type_alamut_castle_01: "Alamut Castle"
 building_type_alamut_castle_01_desc: "This eagle's nest, perched atop a lofty crag, was built by the Justanids to serve as a fortress redoubt of their beleaguered realm. With its awe-inspiring setting and strong ramparts, it is near-impregnable by all accounts, and could prove an ideal stronghold for any warlike faction or sect that would thrive in such an isolated location." 
 alamut_castle_01: "$building_type_alamut_castle_01$"
 alamut_castle_01_desc: "$building_type_alamut_castle_01_desc$"
 building_type_alamut_castle_02: "Alamut Fortress"
 building_type_alamut_castle_02_desc: "Perched atop a lofty crag, this castle has long served as a remote mountain redoubt. It has now been rebuilt into a formidable #italic fedayeen#! fortress, housing libraries, laboratories and tranquil gardens among the imposing fortifications. To some, it is a place of bloodshed and war, to others a place of spiritual repose - or perhaps both."
 alamut_castle_02: "$building_type_alamut_castle_02$"
 alamut_castle_02_desc: "$building_type_alamut_castle_02_desc$"
 building_type_assassin_castle_01: "$holy_order_hashshashin$ $castle_04$"
 building_type_assassin_castle_01_desc: "$building_type_alamut_castle_02_desc$"
 assassin_castle_01: "$building_type_assassin_castle_01$"
 assassin_castle_01_desc: "$building_type_assassin_castle_01_desc$"
 
 building_type_qanats_01: "$qanats_06$"
 building_type_qanats_01_desc: "$qanats_05_desc$"
 building_qanats_01: "Yakchāl"
 building_qanats_01_desc: "These dome-shaped ice houses combine a subterranean storage area with heat-resistant construction materials to create an insulated space that functions as an evaporative cooler." 
 building_qanats_02: "Cistern"
 building_qanats_02_desc: "Called #italic Ab anbar#! in Persian, these arched structures, half underground, are used to store large volumes of water."
 building_qanats_03: "Windcatchers"
 building_qanats_03_desc: "A Persian invention, these tall towers are connected to cisterns and other buildings. Through openings in the direction of the prevailing winds, they catch air flows which are then circulated in their interiors to provide cooling."
 building_qanats_04: "Kārīz"
 building_qanats_04_desc: "The first stage of a subterranean aqueduct system, the kārīz is a series of vertical shafts, connected by a gently sloping tunnel, that taps into a source of underground water and delivers it to the surface."
 building_qanats_05: "Small Qanats"
 qanats_05_desc: "Qanats are underground aqueducts designed to mitigate loss of water from evaporation. While quite small at this stage, this system still provides a significant benefit to agriculture."
 qanats_06: "Qanats"
 building_qanats_06_desc: "The underground aqueducts have been expanded, connecting them to local cisterns, ice houses and irrigation systems."
 building_qanats_07: "Large Qanats"
 building_qanats_07_desc: "This large system of underground aqueducts stretches for several #italic parasangs#!, providing a formidable water supply for both farmers and townspeople."
 building_qanats_08: "Massive Qanat System"
 building_qanats_08_desc: "Flowing into countless underground cisterns, irrigation channels, ice houses, bath houses, fountains and drinking wells, this formidable subterranean aqueduct system is a true testament to Persian ingenuity and glory."

 building_type_tower_of_silence_01: "Great Tower of Silence"
 building_type_tower_of_silence_01_desc: "The dead are laid out on the open tower for the birds, so that neither earth nor fire is defiled by them. The bones are gathered afterward and given to the pit at the center."
 tower_of_silence_01: "Great Tower of Silence"
 tower_of_silence_01_desc: "Built in a quiet part of the duchy, this flat, open-topped tower is where the locals lay their dead to rest. Bodies inside are exposed to carrion birds and the rigors of the sun, conveying their departed souls safely to the afterlife and keeping the living free of corruption. Religious proscriptions necessitate the tower rather than the traditional wilderness, but its presence binds the community fast."
 tower_of_silence_01.tt.liege_not_approve_of_burial: "[liege_possessive|E] [faith|E] allows your people to practice traditional burial without the need for a $building_type_event_tower_of_silence_01$"
 tower_of_silence_01.tt.county_not_tos_users: "[county|E] [faith|E] does not dispose of its dead like this"

 building_type_event_tower_of_silence_01: "Tower of Silence"
 building_type_event_tower_of_silence_01_desc: "$tower_of_silence_01_desc$"
 event_tower_of_silence_01: "Tower of Silence"
 event_tower_of_silence_01_desc: "$building_type_tower_of_silence_01_desc$"

 church_of_the_theotokos: "Temple of the Theotokos"
 church_of_the_theotokos_desc: "The Holy Cross has long conquered this magnificent structure, vanquishing the pagan cult to the virgin goddess Athena.\nNowadays, it holds the shrines to Maria Parthenos, Mother of God and only Virgin worthy of the name #EMP Holy#!."
 building_type_church_of_the_theotokos: "$church_of_the_theotokos$"
 building_type_church_of_the_theotokos_desc: "$church_of_the_theotokos_desc$"
 parthenon: "Parthenon"
 parthenon_desc: "The holy temple of mighty Athena stands proudly once again, uncontaminated by silly superstitions.\nThese majestic columns and walls, raised more than 1000 years ago, have withstood the test of time and still protect the homes of the faithful from above, a silent symbol of the blessing of the Virgin Goddess who named the city."
 building_type_parthenon: "$parthenon$"
 building_type_parthenon_desc: "$parthenon_desc$"

 hagios_demetrios: "Hagios Demetrios"
 hagios_demetrios_desc: "The church of Saint Demetrios is the most important shrine in the city.\nFirst raised when the faith in Christ was still young, it incorporates the Roman bathhouse in which the Saint, together with many other early believers, was imprisoned, martyrized, and buried."
 building_type_hagios_demetrios: "$hagios_demetrios$"
 building_type_hagios_demetrios_desc: "$hagios_demetrios_desc$"

 kassiopi_castle: "Kassiopi Castle"
 kassiopi_castle_desc: "An imposing fortification on the coast. Its strategic position overseeing the channel separating the island from the mainland makes it a vital control point in the Ionian area."
 building_type_kassiopi_castle: "$kassiopi_castle$"
 building_type_kassiopi_castle_desc: "$kassiopi_castle_desc$"

 saint_lazarus: "Church of Saint Lazarus"
 saint_lazarus_desc: "According to tradition, Lazarus of Bethany, once raised from the dead by Christ, was buried in the town of Larnaca upon his second death.\nThe tomb was lost for centuries but, upon its retrieval, Emperor Leo VI had the saint's remains moved to Constantinople and this imposing church built on top of the grave."
 building_type_saint_lazarus: "$saint_lazarus$"
 building_type_saint_lazarus_desc: "$saint_lazarus_desc$"

 building_type_sumela_monastery_01: "Sumela Monastery"
 building_type_sumela_monastery_01_desc: "The origins of this monastery, built on a steep cliff on the Black Mountain, are so remote to be almost shrouded in mystery; according to some, it was first erected by order of Emperor Theodosius in the 4th century, but the sacred spring and ancient frescoes could be even older.\nThe monastery's gem is a fresco of the Mother of God, said to have been painted by Apostle Luke himself."
 sumela_monastery_01: "$building_type_sumela_monastery_01$"
 sumela_monastery_01_desc: "The monastery has fallen into ruins and has been subsequently restored and expanded by several emperors; the main contributor to the current embodiment has been Emperor Justinian through General Belisarius' intervention."
 sumela_monastery_02: "Renovated $building_type_sumela_monastery_01$"
 sumela_monastery_02_desc: "Many centuries have passed since the last time this monastery was renovated. The most recent intervention has granted it more hereditary lands and dependents, tax exemptions, and imperial fundings to raise new buildings. The Rock Church benefited from it the most as it received a completely new cycle of frescoes."

 patras_castle: "Patras Castle"
 patras_castle_desc: "The archaic acropolis of the city of Patras, rising on a hill of the Vodias mountains, was replaced by a fortification during the reign of Emperor Justinian.\nThe castle has been uninterruptedly in use since then, always under the protection of the local patron, St. Andrew, and of the #EMP genius loci#! Patrinella, the Roman statue of a maiden."
 building_type_patras_castle: "$patras_castle$"
 building_type_patras_castle_desc: "$patras_castle_desc$"

 maiden_tower: "Maiden's Tower"
 maiden_tower_desc: "This rock in front of the coast already hosted a custom station at the times of Alcibiades the Athenian thanks to its ideal position at the entrance of the Bosphorus strait.\nA fortified tower on the same small island is now able to control all naval traffic coming from and heading to the Black Sea; in addition, a large chain can be lifted to the sea level between the tower and Constantinople, effectively blocking the passage to any dangerous or unwanted ship."
 building_type_maiden_tower: "$maiden_tower$"
 building_type_maiden_tower_desc: "$maiden_tower_desc$"

 despot_palace: "Despots' Palace"
 despot_palace_desc: "A grandiose palace in a safe location on Mt. Taygetos, just above the fortified city of Mystras.\nThe palace has all the luxuries to compete with the greatness of the Constantinopolitan halls, and it's worthy of only the richest and most influential of governors."
 building_type_despot_palace: "$despot_palace$"
 building_type_despot_palace_desc: "$despot_palace_desc$"

 building_type_meteora_01: "Meteora"
 building_type_meteora_01_desc: "Meteora is the name given by the locals to a breathtaking rock formation made of natural pillars rising just beside Mount Pidnos."
 meteora_01: "$building_type_meteora_01$"
 meteora_01_desc: "The natural caves and hollows of Meteora have been inhabited by ascetic hermits since the early 9th century, but no human-made buildings have ever altered the landscape."
 meteora_02: "$building_type_meteora_01$"
 meteora_02_desc: "As more and more hermit monks seeked refuge on the hollowed peaks of Meteora, more and more monasteries started to appear.\nMan's dominion over hostile nature here is still very feeble, though; the monasteries are extremely hard to reach, mostly relying only on ladders, ropes, hand-hauling, and #EMP prayers#!, as the fall in case of equipment's failure is lethal."

 building_type_mount_athos_01: "Mount Athos"
 building_type_mount_athos_01_desc: "According to tradition, the Virgin Mary was sailing from Palestine to Cyprus to visit her son's friend, Lazarus, who was evangelizing the island, when the ship was blown off-course and forced to land here, by Mount Athos. When Mary disembarked, she was in awe of the natural beauty of the area, so she blessed it and asked for it as her own garden. A voice from Heaven granted her wish; since then, the area is considered holy and is forbidden to any other woman."
 mount_athos_01: "$building_type_mount_athos_01$"
 mount_athos_01_desc: "Christian communities have inhabited this promontory since at least the times of Emperor Constantine I, and monks from Mount Athos already took part in the Seventh Council of Nicaea. However, no proper monastic community or permanent buildings exist yet."
 mount_athos_02: "$building_type_mount_athos_01$"
 mount_athos_02_desc: "The arrival of a monk called Athanasios to Mount Athos sets into motion the foundation of several monasteries throughout the peninsula: first of all, Great Lavra and Vatopedi, both dedicated to the Annunciation. With proper monasteries, the local monastic life is given order and rules."
 mount_athos_03: "$building_type_mount_athos_01$"
 mount_athos_03_desc: "The popularity of Mount Athos as a monastic center, based on the many concessions offered to it by the lay power, its autonomous statutory, the truly isolated lifestyle, and its flourishing production of icons, has ensured a continuous stream of new joining monks for centuries.\nAs the number of monks grew, so did the number of monasteries. Twenty monasteries currently exist on Mt. Athos, making it one of the largest and more influential monastic communities in the area."

 apollinare_nuovo: "Sant'Apollinare Nuovo"
 apollinare_nuovo_desc: "The Basilica of Sant'Apollinare Nuovo has only gained its current name recently, when the relics of Saint Apollinaris were transferred from the neighboring Basilica in Classe. Its history, however, is much longer.\nFirst consecrated in the early 6th century by King Theodoric of the Ostrogoths as an Arian church, the building has seen many renovations both in structure and decoration while maintaining its unique style — an elegant mixture of western and eastern art — and its amazing Byzantine mosaics."
 building_type_apollinare_nuovo: "$apollinare_nuovo$"
 building_type_apollinare_nuovo_desc: "$apollinare_nuovo_desc$"

 saint_catherine: "Saint Catherine's Monastery"
 saint_catherine_desc: "An unassuming monastery in the middle of the desert, but with a heavy history. The first monastic structure was, in fact, ordered to be built by Emperor Constantine's mother on the site of the apparition of the Burning Bush to Moses. Emperor Justinian financed its expansion into the current fortified monastery, also enclosing the Well of Moses. Only centuries after its foundation did the spoils of Saint Catherine arrive at the monastery, changing its name.\nThe monastery has always been among the most ancient and prolific scriptoria and icon-making centers."
 building_type_saint_catherine: "$saint_catherine$"
 building_type_saint_catherine_desc: "$saint_catherine_desc$"

 jvari_monastery: "Jvari Monastery"
 jvari_monastery_desc: "An ancient monastery erected on the exact spot where Saint Nino planted a miraculous cross while evangelizing Georgia.\nThe holy building attracts pilgrims from all over the Caucasus."
 building_type_jvari_monastery: "$jvari_monastery$"
 building_type_jvari_monastery_desc: "$jvari_monastery_desc$"

 etchmiadzin_cathedral: "Cathedral of Vagarshapat"
 etchmiadzin_cathedral_desc: "This ancient cathedral is the historical center of Armenian Apostolic Christianity. Originally founded by Saint Gregory the Illuminator over a pagan temple to symbolize the triumph of the newly-adopted religion of the Kingdom of Armenia, the church was destructed almost completely during the Sasanid invasion, and rebuilt from the ground some years later.\nAfter the 7th century, however, the cathedral has been repeatedly plundered and abandoned, and has fallen into a state of disrepair. Only a drastic and expensive intervention could return it to its previous splendor."
 building_type_etchmiadzin_cathedral: "$etchmiadzin_cathedral$"
 building_type_etchmiadzin_cathedral_desc: "$etchmiadzin_cathedral_desc$"

 cattolica_stilo: "Cattolica di Stilo"
 cattolica_stilo_desc: "The Byzantine influence on this building is strong: a small church with baptistery, in red bricks nested upon naked rocks, with an "inscribed cross" plan and a rich decoration of fresco cycles, dominating the valley of the Stilaro stream.\nThe church is an isolated gem in the middle of hostile nature, where man can feel closer to God."
 building_type_cattolica_stilo: "$cattolica_stilo$"
 building_type_cattolica_stilo_desc: "$cattolica_stilo_desc$"

 hosios_loukas: "Hosios Loukas"
 hosios_loukas_desc: "The monastery is dedicated to the preservation of the relics of Venerable Luke of Steiris, the hermit monk.\nThe holy remains are said to exude a miraculous oil, and attract countless pilgrims who sleep by the tomb in order to be healed by incubation. The inner decoration is praised throughout the Eastern Mediterranean for its quality and lavishness, as the finest artists of the age have enriched it with mosaics, icons, chandeliers, carvings, and cloths."
 building_type_hosios_loukas: "$hosios_loukas$"
 building_type_hosios_loukas_desc: "$hosios_loukas_desc$"

 sofia_ohrid: "Church of Saint Sophia"
 sofia_ohrid_desc: "The cathedral of Ohrid was first destroyed when the Slavs first descended into these lands, and was not rebuilt until the area was safely back into the folds of the Christian faith.\nIts last embodiment is a dome basilica richly decorated with fresco cycles from the finest artists of the age."
 building_type_sofia_ohrid: "$sofia_ohrid$"
 building_type_sofia_ohrid_desc: "$sofia_ohrid_desc$"

 fairy_chimneys: "Troglodytic Settlements"
 fairy_chimneys_desc: "Rocks are extremely malleable in this area, naturally forming cones, peaks, and caves.\nHumans have taken advantage of these structures for centuries, building stables, storage, and refuges, then houses and production buildings, then finally churches inside the rock cones, and whole settlements have thus formed."
 building_type_fairy_chimneys: "$fairy_chimneys$"
 building_type_fairy_chimneys_desc: "$fairy_chimneys_desc$"

 cilician_gates: "Cilician Gates"
 cilician_gates_desc: "The Cilician Gates are a pass through the Taurus Mountains that connect the Cilician plains with the Anatolian plateau.\nSince time immemorial, the pass has been fortified, and controlling it meant controlling one of the main commercial and military arteries of Asia Minor and the Middle East."
 building_type_cilician_gates: "$cilician_gates$"
 building_type_cilician_gates_desc: "$cilician_gates_desc$"

 swahili_port_pemba: "Pemba Trade Ports"
 swahili_port_pemba_desc: "The reefs, beaches, and mangrove forests of Pemba Island provide an abundance of inlets and resources for the people of Pemba, making it a natural entrepôt of the Zanj."
 building_type_swahili_port_pemba: "$swahili_port_pemba$"
 building_type_swahili_port_pemba_desc: "$swahili_port_pemba_desc$"

 swahili_port_zanzibar: "Zanzibar Trade Ports"
 swahili_port_zanzibar_desc: "The island of Unguja's sandy shores sheltered by coral islets make it a perfect haven for ships. Traders from across the Indian Ocean come to enjoy Unguja's natural strengths as a center of maritime commerce."
 building_type_swahili_port_zanzibar: "$swahili_port_zanzibar$"
 building_type_swahili_port_zanzibar_desc: "$swahili_port_zanzibar_desc$"

 swahili_port_mombasa: "Port of Mombasa"
 swahili_port_mombasa_desc: "Perched atop a rocky island surrounded by steep cliffs, Mombasa enjoys a naturally defensible position that still remains uniquely accessible to maritime traffic."
 building_type_swahili_port_mombasa: "$swahili_port_mombasa$"
 building_type_swahili_port_mombasa_desc: "$swahili_port_mombasa_desc$"

 swahili_port_pate: "Pate Island Trade Ports"
 swahili_port_pate_desc: "Located on the northern edge of the Swahili heartlands, Pate Island was one of the first Swahili regions introduced to Islam and thus to Middle Eastern trade networks."
 building_type_swahili_port_pate: "$swahili_port_pate$"
 building_type_swahili_port_pate_desc: "$swahili_port_pate_desc$"

 swahili_port_lamu: "Lamu Trade Ports"
 swahili_port_lamu_desc: "The warm white sands of its beaches and the vibrant blue of the waters that lazily lap its shores belie the bustling commerce that serves as the lifeblood of Lamu. Long connected to trade across the ocean, goods from the western and eastern ends of the known world can be bought and sold here."
 building_type_swahili_port_lamu: "$swahili_port_lamu$"
 building_type_swahili_port_lamu_desc: "$swahili_port_lamu_desc$"

 building_type_dragon_kiln_01: "Dragon Kiln"
 building_type_dragon_kiln_01_desc: "Built on the side of a steep slope, this complex of kilns can produce the extremely high-temperature fires needed to produce exotic ceramics highly-valued as trade goods and gifts."
 dragon_kiln_01: "$building_type_dragon_kiln_01$"
 building_dragon_kiln_01_desc: "This long kiln pulls the draught of a fire horitzonally, producing an intense heat needed by potters to create valuable bowls, vases, and other ceramics."
 dragon_kiln_02: "$building_type_dragon_kiln_01$ II"
 building_dragon_kiln_02_desc: "Ceramic production can be eased with the use of saggars, simple containers that help protect pottery being fired from impurities and damage like smoke, ash, and debris from industrial-scale production."
 dragon_kiln_03: "$building_type_dragon_kiln_01$ III"
 building_dragon_kiln_03_desc: "Enclosing the kiln's main fire in a series of chambers both regulates fire temperature and makes the loading and unloading of pottery much easier for workers, creating higher-quality wares at a larger scale that more people are willing to pay higher prices for."
 dragon_kiln_04: "$building_type_dragon_kiln_01$ IV"
 dragon_kiln_05: "$building_type_dragon_kiln_01$ V"
 dragon_kiln_terrain_requirement_tt: "The [terrain|E] is not #V $terrain_mountains$#!, #V $terrain_desert_mountains$#!, or #V $terrain_hills$#!"
 only_one_mint_tt: "No other mint exists in the [province|E]: only one #V $mint$#! (in the #V $mine_district$#!) or #V $bureaucratic_mint$#! (in the #V $bureaucratic_district$#!) can be built"

 TERRAIN_NOT_FARMLANDS: "Terrain is not $farmlands$"
 building_type_burkhan_khaldun_01: "Burkhan Khaldun"
 building_type_burkhan_khaldun_01_desc: "The Burkhan Khaldun is the most imposing of the Khentii Mountains.\nSaid to be the birthplace of many Mongolian heroes, its slopes are covered in ovoos and many sacrifices are made in the hopes of gaining its favor."
 burkhan_khaldun_01: "$building_type_burkhan_khaldun_01$"
 burkhan_khaldun_01_desc: "$building_type_burkhan_khaldun_01_desc$"

 pleasure_dome: "Pleasure Dome"
 pleasure_dome_desc: "A Mongolian palace, serving both as a military and cultural center in equal measure. Its crowning glory stands as a fountain in the shape of a silver tree, where different kinds of wine flow from the serpents that entwine the statue."
 building_type_pleasure_dome: "$pleasure_dome$"
 building_type_pleasure_dome_desc: "$pleasure_dome_desc$"

 building_type_murex_farm_01: "Murex Fisheries"
 building_type_murex_farm_01_desc: "Imperial purple is always in high demand. The snails from which this luxurious dye is made are harvested and processed here."
 building_murex_farm_01: "Murex Harvesters"
 building_murex_farm_01_desc: "A thriving Murex fishing industry has been established along the Mediterranean coast. It provides a modest but steady income through the sale of harvested snails."
 building_murex_farm_02: "Murex Processing Center"
 building_murex_farm_02_desc: "This center efficiently processes Murex snails, enhancing the extraction of their valuable secretions. The result is a higher quality of the coveted purple dye."
 building_murex_farm_03: "Dye Distillery"
 building_murex_farm_03_desc: "The specialized distillery refines Murex secretions into a potent purple dye. Its operation significantly increases the vibrancy and value of the dye."
 building_murex_farm_04: "Drying Flats"
 building_murex_farm_04_desc: "An open-air courtyard expedites the dye oxidation process. This reduces the production time for the purple dye, ensuring a more efficient workflow."
 building_murex_farm_05: "Master Dyers Guild"
 building_murex_farm_05_desc: "The Master Dyers Guild, renowned for achieving the perfect shade of Tyrian purple, enhances the precision of textile dyeing. This results in consistently high-quality purple garments."
 building_murex_farm_06: "Silk Weaving Atelier"
 building_murex_farm_06_desc: "This workshop specializes in weaving luxurious fabrics like silk for dyeing. It unlocks the ability to produce garments of exceptional quality, increasing their trade value."
 building_murex_farm_07: "Imperial Textile Workshop"
 building_murex_farm_07_desc: "The imperial workshop focuses on mass production of Tyrian purple-dyed textiles, significantly boosting income from the sale of these prestigious garments."
 building_murex_farm_08: "Royal Palace of Purple"
 building_murex_farm_08_desc: "A magnificent palace adorned with Tyrian purple-themed decorations stands as a symbol of wealth and power. It showcases the local mastery in Tyrian purple production."


 building_type_generic_copper_mines_01: "Copper Mines"
 building_type_generic_copper_mines_01_desc: "An important copper mine, providing incredibly profitable copper ore to whoever is lucky enough to own it."
 generic_copper_mines_01: "Copper Mining Settlement"
 generic_copper_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_copper_mines_02: "Copper Mine"
 generic_copper_mines_02_desc: "$rammelsberg_mines_02_desc$"
 generic_copper_mines_03: "Large Copper Mine"
 generic_copper_mines_03_desc: "$rammelsberg_mines_03_desc$"
 generic_copper_mines_04: "Copper Mining Complex"
 generic_copper_mines_04_desc: "$rammelsberg_mines_04_desc$"

 building_type_generic_silver_mines_01: "Silver Mines"
 building_type_generic_silver_mines_01_desc: "A rich silver mine, providing a constant stream of valuable silver."
 generic_silver_mines_01: "Silver Mining Settlement"
 generic_silver_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_silver_mines_02: "Silver Mine"
 generic_silver_mines_02_desc: "$rammelsberg_mines_02_desc$"
 generic_silver_mines_03: "Silver Copper Mine"
 generic_silver_mines_03_desc: "$rammelsberg_mines_03_desc$"
 generic_silver_mines_04: "Silver Mining Complex"
 generic_silver_mines_04_desc: "$rammelsberg_mines_04_desc$"

 building_type_generic_gold_mines_01: "Gold Mines"
 building_type_generic_gold_mines_01_desc: "An incredibly valuable and rare gold mine, highly sought after by every noble in the region."
 generic_gold_mines_01: "Gold Mining Settlement"
 generic_gold_mines_01_desc: "$rammelsberg_mines_01_desc$"
 generic_gold_mines_02: "Gold Mine"
 generic_gold_mines_02_desc: "$rammelsberg_mines_02_desc$"
 generic_gold_mines_03: "Gold Copper Mine"
 generic_gold_mines_03_desc: "$rammelsberg_mines_03_desc$"
 generic_gold_mines_04: "Gold Mining Complex"
 generic_gold_mines_04_desc: "$rammelsberg_mines_04_desc$"
 
 building_type_capital_bureau_01: "Capital Magistracy"
 building_type_capital_bureau_01_desc: "A dedicated branch of government, which devotes all of its resources to manage the capital. A throng of clerks and servicemen resides within these walls, ready to serve at the eparch's command."
 building_capital_bureau_01: "Courthouse"
 building_capital_bureau_01_desc: "Law is what makes a city thrive and prosper, and law can only be upheld in court."
 building_capital_bureau_02: "Security Office"
 building_capital_bureau_02_desc: "This office employs a large policing force, which keeps the city safe from criminals and apprehends lawbreakers."
 building_capital_bureau_03: "Firemen's Headquarters"
 building_capital_bureau_03_desc: "Fires are a constant threat that looms over any densely populated area. A well-drilled fire crew will put out a fire before it spreads."
 building_capital_bureau_04: "Guild Administration"
 building_capital_bureau_04_desc: "Appointing officials as overseers of the many guilds within the city will ensure that each guild is efficient, maintain quality, and follow all necessary procedures."
 building_capital_bureau_05: "Judicial Department"
 building_capital_bureau_05_desc: "An extended department for judicial matters is a necessity in a large and growing city. An army of officials, clerks, and judges, work effortlessly to enforce law and order."
 building_capital_bureau_06: "City Jail"
 building_capital_bureau_06_desc: "While there might be a number of small prisons spread out across the city, a larger jail will ensure that anyone breaking the law will have a cell waiting for them."
 building_capital_bureau_07: "Trade College"
 building_capital_bureau_07_desc: "Trade is too lucrative a business to not be better regulated by law. By overseeing tolls and goods entering the city, we can administer the capital's provisions much more efficiently, and perhaps even earn some additional gold."
 building_capital_bureau_08: "Urban Palace"
 building_capital_bureau_08_desc: "A large and majestic residence, spectacular enough to put most palaces to shame, ensures that the chief administrator can be close and available at all times. For while a city never truly sleeps, its administrator surely does."
 capital_bureau_custom_effect_desc: "#low Unlocks:#!\nIncreases [aptitude|E] of the [GetCourtPositionType('eparch_court_position').GetName()] [court_position|E]"
 

 #ACH
 building_type_oath_warriors_building_01: "Martial Grants"
 building_type_oath_warriors_building_01_desc: "The sovereign of these lands has sworn a coronation oath to provide for the warriors."
 oath_warriors_building_01: "Veterans' Smallholdings"
 oath_warriors_building_01_desc: "Aristocratic fighters of long service have been given generous local plots, and interest in serving loyally has increased here accordingly."
 oath_warriors_building_02: "Martial Estates"
 oath_warriors_building_02_desc: "Those of the aristocratic warrior class who do not die on the battlefield live in comfort, their granted holdings allowing them to recruit and arm themselves amply."
 oath_warriors_building_03: "Village Fiefdoms"
 oath_warriors_building_03_desc: "Many local villages are given over to knightly officers as personal holdings, allowing them to gather strength and wealth at the expense of the other classes."
 oath_warriors_building_04: "Vast Martial Holdings"
 oath_warriors_building_04_desc: "A sizeable share of local taxes are delivered unto minor warrior aristocrats, the title-holders to field and settlement alike. Their mighty retinues, however, still serve."

 building_type_oath_faithful_building_01: "Religious Monuments"
 building_type_oath_faithful_building_01_desc: "The sovereign of these lands has sworn a coronation oath to provide for the faithful."
 oath_faithful_building_01: "Wayside Shrines"
 oath_faithful_building_01_desc: "Small shelters by the roadsides house simple sacred icons."
 oath_faithful_building_02: "Sacred Gates"
 oath_faithful_building_02_desc: "Above the entrances to and throughout this settlement, detailed religious artworks inspire awe and promise safe passage."
 oath_faithful_building_03: "Temple Sanctuaries"
 oath_faithful_building_03_desc: "The local temple complexes have been expanded with vaulted gardens, serene places which house freshwater wells."
 oath_faithful_building_04: "Monumental Squares"
 oath_faithful_building_04_desc: "Great investment has gone into massive central squares that abound with religious artwork, are kept bare of excess waste and usury, and supply water to locals."

 building_type_oath_poor_building_01: "Official Almshouses"
 building_type_oath_poor_building_01_desc: "The sovereign of these lands has sworn a coronation oath to provide for the poor."
 oath_poor_building_01: "Charitable Customs"
 oath_poor_building_01_desc: "People with means are encouraged by authorities to give surplus food and wealth to the less fortunate, typically during holy days."
 oath_poor_building_02: "Poorhouses"
 oath_poor_building_02_desc: "The very poor, widows and the elderly are given modest boarding and some care in simple accommodations."
 oath_poor_building_03: "Benevolent Ministries"
 oath_poor_building_03_desc: "Almshouses and other civic needs that serve the wretched are well-serviced by official ministers of some means."
 oath_poor_building_04: "Charitable Institutions"
 oath_poor_building_04_desc: "All through the land, the needy want for nought. Gracious accommodations house would-be vagrants, hospitals tend to the sick and elderly, and generous allowances are made for poor peasants."

