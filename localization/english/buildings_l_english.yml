 building_type_mogok_mines_01_desc:0 "Mogok Valley is famous for its rubies and sapphires, as well as less valuable stones such as spinel or garnet.\nWhat makes 'the valley of rubies' stand out even more than quantity is the quality of the stones. As the deep red stones are excavated from the earth they sparkle in the basting sun in a way that has no equal anywhere else."
