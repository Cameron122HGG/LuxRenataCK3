 building_type_ratnapura_mines_01:0 "The Ratnapura Mines"
 building_type_ratnapura_mines_01_desc:0 "Ratnapura, the city of Gems, is one of the world's most significant sources of rubies, and sapphires. For hundreds of years these riches have been mined and traded with merchants from the Indian subcontinent, South East Asia and China."
