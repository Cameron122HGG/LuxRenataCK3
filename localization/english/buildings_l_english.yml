 building_type_hetian_mines_01: "The Khotan Mines"
 building_type_hetian_mines_01_desc: "Khotan has been the source of Hetian jade since the beginning of time. This precious white stone is the most highly prized of all jade, valued higher than either gold or silver by many. Jade is mined both directly out of the mountain and picked directly from open pits and riverbeds."
 hetian_mines_01: "Khotan Mining Settlement"
 hetian_mines_01_desc: "$building_type_hetian_mines_01_desc$"
 hetian_mines_02: "Khotan Mine"
 hetian_mines_02_desc: "As the mining settlement grows, more and more jade is being extracted. As the fame of the precious stones grow an increasing influx of competent engineers and merchants greatly improves the profitability of the operation."
 hetian_mines_03: "Large Khotan Mine"
 hetian_mines_03_desc: "As the mining operations grow, so does the mines themselves. More people are employed in mining and traffic to and from the many locations in which the jade is mined is now a constant feature of the landscape."
 hetian_mines_04: "Khotan Mining Complex"
 hetian_mines_04_desc: "Over time jade has grown to be not just the main export of this region but also the livelihood for many of its artisans and craftsmen. A veritable industry of workshops and resellers now line the streets."

