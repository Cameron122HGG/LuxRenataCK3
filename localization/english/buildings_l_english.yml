 building_type_powder_magazine_01: "Gunpowder Manufacturer"
 building_type_powder_magazine_01_desc: "Gunpowder calls for dedicated production, storage and maintenance to remain functional. In order to recruit [GetMaA('handgunners').GetName] and other units that require this potent force, specialized buildings must be raised."

 powder_magazine_01: "Powder Storehouse"
 building_powder_magazine_01_desc: "Storehouses in which the powder can be kept safe from the elements to minimize the risk of accidents."
 building_powder_magazine_02: "Powder Logistics Office"
 building_powder_magazine_02_desc: "Hiring officials who can oversee a workforce dedicated to handle the complicated logistics of gunpowder will make sure the powder is stored correctly and transported across the realm without incident."
 building_powder_magazine_03: "Sulfur Mine"
 building_powder_magazine_03_desc: "Sulfur, sometimes called brimstone, exists in abundance but can be difficult to produce in high quantities. A dedicated mine will ensure a steady supply of this precious mineral."
 building_powder_magazine_04: "Saltpeter Workshop"
 building_powder_magazine_04_desc: "A key component in creating gunpowder, saltpeter requires skilled hands in a controlled environment if it is to be produced in high quantity without burning down the entire building."
 building_powder_magazine_05: "Powder Magazines"
 building_powder_magazine_05_desc: "Storage of gunpowder requires creating dedicated buildings with strengthened walls, safely located away from inhabited and valuable places."
 building_powder_magazine_06: "Guardhouse"
 building_powder_magazine_06_desc: "Gunpowder is dangerous on its own, but it can be even more so if it would fall into the wrong hands. A large number of guards can now be employed to keep the powder safe from prying eyes."
 building_powder_magazine_07: "Powder Refinement Workroom"
 building_powder_magazine_07_desc: "A separate building in which the different components are combined to create gunpowder. Should an accident occur, it should hopefully no longer ruin the entire establishment."
 building_powder_magazine_08: "Hand Cannon Facility"
 building_powder_magazine_08_desc: "Hand cannons can be unreliable and crack during use. We must therefore procure the best equipment possible and hire the most skilled crafters available to produce weapons of the highest quality"
 powder_magazine_1_effect_desc: "$unlocks_building_desc$[gunpowder|E] [men_at_arms|E] Recruitment Limit: #P +[EmptyScope.ScriptValue('gunpowder_building_limit_bonus_1')|0]#!"
