 NOT_holy_site_muslim_or_zoroastrian_or_holy_site_trigger:0 "The holder must be Muslim, Zoroastrian, or consider this a [holy_site|E]"
 NOT_holy_site_jewish_or_holy_site_trigger:0 "The holder must be Jewish or consider this a [holy_site|E]"
