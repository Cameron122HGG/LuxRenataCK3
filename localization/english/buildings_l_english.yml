 rebuilding_grants_full_benefits: "#S After [rebuilding|El]:#!\n"
 building_requirements_header: "#S Requirements:#!\n"
 building_fallback: "#S If you do not fulfill the requirements:#!\n"
 building_effects_header: "#S Effects:#!\n"

 building_type_citadel_shrine_01: "Citadel Shrine"
 building_type_citadel_shrine_01_desc: "A $building_type_temple_citadel_01$ isn't complete without a place in which to worship its pantheon. Be it regular citizens or garrisoned forces, the sanctity emanating from within its walls will calm any restless soul."
 building_citadel_shrine_01: "Prasada Tower"
 building_citadel_shrine_01_desc: "The Prasada crowns the $building_type_temple_citadel_01$, painting a regal silhouette in the distance. It allows its worshipers to admire the Shrine from afar."
 building_citadel_shrine_02: "Prang Spire"
 building_citadel_shrine_02_desc: "Flooded in delicate carvings, the Prang rises above in structural cascades, enhancing the offered impression of height. It is a delightful eye rest while prayers are being expelled, be it in uttered words or contemplative silence."
 building_citadel_shrine_03: "Divine Statuary"
 building_citadel_shrine_03_desc: "The collection of statues perpetually stare into the aether, pondering eternity and oftentimes invoking complex emotions in its worshipers."
 building_citadel_shrine_04: "Singha Statues"
 building_citadel_shrine_04_desc: "Grinning teeth and staring eyes, these ferocious guardian lions offer their blessing of protection on the denizens of the $building_type_temple_citadel_01$."
 building_citadel_shrine_05: "Nāga Guardians"
 building_citadel_shrine_05_desc: "Carefully crafted in sandstone and the mandala intricately inscribed on its chest, these seven-headed serpents offer peace and prosperity to the dwellers of the Shrine."
 building_citadel_shrine_06: "Bas-Reliefs"
 building_citadel_shrine_06_desc: "Citizens often stop to inspect the minute details of these bas-reliefs, as they depict dramatic periods of battle but also various planes of divinity and creation myths."
 building_citadel_shrine_07: "Reliquaries"
 building_citadel_shrine_07_desc: "A treasure trove of various religious and ceremonial statues and objects, this $building_type_temple_citadel_01$ has a collection greater than anywhere else."
 building_citadel_shrine_08: "Devaraja Image"
 building_citadel_shrine_08_desc: "The Divine Being, frozen in time in a majestic pose, allowing its worshipers to pray and pay dutiful homage in order to receive its blessings."


 building_type_sacred_pool_01: "Sacred Pool"
 building_type_sacred_pool_01_desc: "Such a large body of water may have many purposes; but it is clear that as time passes and the seasons change, the visual phenomena reflected in the pool occasionally becomes truly transcendent. A source of fortification as well as hydration, these pools are an important part of the day-to-day life of its denizens."
 sacred_pool_01: "Lotus Pond"
 building_sacred_pool_01_desc: "A harmonious pond, stunning its onlookers with its beauty and tranquility, and purportedly being the setting for significant spiritual events to occur."
 sacred_pool_02: "Holy Reservoir"
 building_sacred_pool_02_desc: "Increasing in scale, this $sacred_pool_02$ also brings the occasional wildlife; flora and fauna working as one to inspire its visitors with the sense of the cycle of life."
 building_sacred_pool_03: "Basin"
 building_sacred_pool_03_desc: "A place for the odd ceremony and ritual, this body of water tells the tale of an increased splendor of its ruler."
 building_sacred_pool_04: "Moat"
 building_sacred_pool_04_desc: "Now surrounding the place of worship, its denizens feel more secure now that the $building_type_sacred_pool_01$ offer some fortification between themselves and potential hostile forces."
 building_sacred_pool_05: "Petty Baray"
 building_sacred_pool_05_desc: "A collection of guardian lions watch over the Baray, making any intruders think twice before traversing its still waters."
 sacred_pool_06: "Baray"
 building_sacred_pool_06_desc: "The $sacred_pool_06$ stretching from east to west is a magnificent sight to behold. Serpent statues help keep watch over its outer perimeters."
 building_sacred_pool_07: "Great Baray"
 building_sacred_pool_07_desc: "Statues, blossoming vegetation and splendid scenery signifies this majestic body of water, bringing cool relief as well as hydration in periods of excruciating heat."
 building_sacred_pool_08: "Sacred Baray"
 building_sacred_pool_08_desc: "Travelers and other visitors passing by often stand in awe of this man-made body of water — its width making the eye barely able to see the edge at the other side. A true testament to the divine link of this location."

 building_type_vihara_halls_01: "Vihara Halls"
 building_type_vihara_halls_01_desc: "A monastic building, built to shelter monks from the rain season, this is a place of quiet meditation, prayer and recuperation. Expanding the halls contributes to the vigor and devotion of its inhabiting religious followers."
 vihara_halls_01: "Prayer Shrine"
 building_vihara_halls_01_desc: "The addition of the $vihara_halls_01$ offer its visitors a place of worship and contemplation."
 building_vihara_halls_02: "Scripture Library"
 building_vihara_halls_02_desc: "Ancient, as well as new, scriptures are contained within the walls of the Hor Trai. Visiting devotees can peruse and further their enlightenment at their leisure."
 building_vihara_halls_03: "Colonnaded Chapels"
 building_vihara_halls_03_desc: "Majestic colonnades tower over these chapels, offering intricate inscriptions and various religious depictions to the worshipers within."
 building_vihara_halls_04: "Mandapa"
 building_vihara_halls_04_desc: "The sheer size of this pillared hall is excellent for performing public rituals or other religious ceremonies."
 building_vihara_halls_05: "Shala Pavilion"
 building_vihara_halls_05_desc: "A pavilion in the middle of the greenery, the beauty of this structure is only matched by its air of spirituality."
 building_vihara_halls_06: "Sima Stones"
 building_vihara_halls_06_desc: "The boundary stones assist the keepers of the $building_type_vihara_halls_01$ in approximating the adequate size and distance of spaces required for monks to be able to perform their worship in a proper way."
 vihara_halls_07: "Bell Tower"
 building_vihara_halls_07_desc: "A majestic $vihara_halls_07$ crowns these $building_type_vihara_halls_01$, reflecting the sunlight during day and looming in the distance at night."
 building_vihara_halls_08: "Grand Halls"
 building_vihara_halls_08_desc: "The comfort and amenities of these halls make monks travel from further away to visit, consolidating and dispersing teachings and ideas in an invaluable information network, spreading harmony into nearby realms."

 building_type_itsukushima_jinja_01: "$itsukushima_jinja_01$"
 building_type_itsukushima_jinja_01_desc: "$itsukushima_jinja_01_desc$"
 itsukushima_jinja_01: "Itsukushima Shrine" # 厳島神社
 itsukushima_jinja_01_desc: "Established in the 6th century and dedicated to the Shintō goddesses of the sea and storms, Itsukushima-jinja's galleries stand over the water, looking towards a famed torii gate which appears to float over the waters of Matsushima bay."
 itsukushima_jinja_02: "$itsukushima_jinja_01$"
 itsukushima_jinja_02_desc: "$itsukushima_jinja_01_desc$"

 building_type_heian_palace_01: "$heian_palace_01$"
 building_type_heian_palace_01_desc: "$heian_palace_01_desc$"
 heian_palace_01: "Heian Palace" # 平安宮
 heian_palace_01_desc: "Built by Emperor Kanmu as the centerpiece of his great city of Heian-kyō, or 'Peace Capital', the sprawling palace complex houses the imperial court, residence, and the central bureaucratic offices of Japan. Its corridors are bustling hubs of ceremony, politics, and intrigue, where ancient aristocratic families vie for influence."

 building_type_ise_jingu_01: "$ise_jingu_01$"
 building_type_ise_jingu_01_desc: "$ise_jingu_01_desc$"
 ise_jingu_01: "Ise Shrine" # 伊勢神宮
 ise_jingu_01_desc: "Ise-jingū is sacred to the sun goddess, #EMP Amaterasu#!, and among the most hallowed Shintō sites. The shrine houses the Yamato imperial regalia, and is overseen by a vestal Saigū priestess, chosen from among the imperial dynasty."

 building_type_kofuku_ji_01: "$kofuku_ji_01$"
 building_type_kofuku_ji_01_desc: "$kofuku_ji_01_desc$"
 kofuku_ji_01: "Kōfuku Temple" # 興福寺
 kofuku_ji_01_desc: "Dating to the 7th century, Kōfuku-ji is one of the Seven Great Temples of Nara, among the oldest and most important centers of Buddhist thought and power in Japan."

 building_type_enryaku_ji_01: "$enryaku_ji_01$"
 building_type_enryaku_ji_01_desc: "$enryaku_ji_01_desc$"
 enryaku_ji_01: "Enryaku Temple" # 延暦寺
 enryaku_ji_01_desc: "Founded by $SaichO_$ in the late 8th century, Enryaku-ji sits on Mount Hiei overlooking Emperor Kanmu's capital, Heian-kyō, and is the center of Japanese Pundarika, or Tendai, Buddhism in Japan."

 building_type_dazaifu_01: "$dazaifu_01$"
 building_type_dazaifu_01_desc: "$dazaifu_01_desc$"
 dazaifu_01: "Dazaifu Office" # 興福寺
 dazaifu_01_desc: "The town of Dazaifu is the imperial court's administrative center on distant Kyūshū. Established to oversee the island's defense, facilitate overseas trade, and host foreign dignitaries, governorship of Dazaifu is a common career stepping stone of ambitious bureaucrats."

 building_type_chinjufu_01: "$chinjufu_01$"
 building_type_chinjufu_01_desc: "$chinjufu_01_desc$"
 chinjufu_01: "Chinjufu District" # 鎮守府
 chinjufu_01_desc: "Originally based in Taga, the Chinjufu is the fortified center of the imperial pacification efforts in northern Japan, overseen by a special commander with responsibility for the region's defense and taxation."

 building_type_hakata_port_01: "$hakata_port_01$"
 building_type_hakata_port_01_desc: "$hakata_port_01_desc$"
 hakata_port_01: "Hakata Port" # 博多
 hakata_port_01_desc: "Since the earliest days of the Yamato, the port city of Hakata on Kyūshū's northern shore has been a naval gateway, a bustling nexus overseen by the nearby Dazaifu office, where traders sell goods from far-off lands and diplomatic delegations step onto Japan's shores."
 building_hakata_port_02: "$hakata_port_01$"
 building_hakata_port_02_desc: "$hakata_port_01_desc$"

 building_type_hwangnyongsa_01: "$hwangnyongsa_01$"
 building_type_hwangnyongsa_01_desc: "$hwangnyongsa_01_desc$"
 hwangnyongsa_01: "Hwangnyong Temple" # 皇龍寺 (황룡사)
 hwangnyongsa_01_desc: "Completed in the 7th century, Hwangnyongsa, or the 'Imperial Dragon Temple', is a sprawling complex built by King Jin-heung of Silla as a center of Buddhist teaching and power, and boasts one of the world's tallest pagodas."

 building_type_white_deer_grotto_academy_01: "$white_deer_grotto_academy_01$"
 building_type_white_deer_grotto_academy_01_desc: "$white_deer_grotto_academy_01_desc$"
 white_deer_grotto_academy_01: "White Deer Grotto Academy"
 white_deer_grotto_academy_01_desc: "Founded by the hermit Li Bo, where white deer roamed freely, the academy flourished as a center of Neo-Confucianism."

 building_type_shigu_academy_01: "$shigu_academy_01$"
 building_type_shigu_academy_01_desc: "$shigu_academy_01_desc$"
 shigu_academy_01: "Shigu Academy"
 shigu_academy_01_desc: "This academy drew scholars studying the Classics in Hunan's quiet hills. A hub of poetry and philosophy, it carried Tang traditions into the Song."

 building_type_culai_academy_01: "$culai_academy_01$"
 building_type_culai_academy_01_desc: "$culai_academy_01_desc$"
 culai_academy_01: "Culai Academy"
 culai_academy_01_desc: "Scholars built an academy among Mount Culai's peaks to study Confucian texts in seclusion. Its halls echoed with debates on harmonizing nature and governance."

 building_type_lize_academy_01: "$lize_academy_01$"
 building_type_lize_academy_01_desc: "$lize_academy_01_desc$"
 lize_academy_01: "Lize Academy"
 lize_academy_01_desc: "The Lize Academy promotes scholarship among waters and reeds of Hebei, serving as a northern bastion of Confucian order amid shifting frontiers."

 building_type_maoshan_academy_01: "$maoshan_academy_01$"
 building_type_maoshan_academy_01_desc: "$maoshan_academy_01_desc$"
 maoshan_academy_01: "Maoshan Academy"
 maoshan_academy_01_desc: "An academy that trains in ritual, meditation, and sacred texts, serving as a spiritual counterpoint to the Song-era Confucian academies."

 building_type_tiantai_monasteries_01: "$tiantai_monasteries_01$"
 building_type_tiantai_monasteries_01_desc: "$tiantai_monasteries_01_desc$"
 tiantai_monasteries_01: "Tiantai Monasteries"
 tiantai_monasteries_01_desc: "Scholarly institution of the Tiantai school, this academy specializes in teaching philosophy and meditation."

 building_type_jizu_shan_temples_01: "$jizu_shan_temples_01$"
 building_type_jizu_shan_temples_01_desc: "$jizu_shan_temples_01_desc$"
 jizu_shan_temples_01: "Jizu Shan Temples"
 jizu_shan_temples_01_desc: "The Buddhist mountain monastery complex served as a stronghold of Esoteric Buddhism. Pilgrims likened it to India's Vulture Peak."

 building_type_nanhua_temple_01: "$nanhua_temple_01$"
 building_type_nanhua_temple_01_desc: "$nanhua_temple_01_desc$"
 nanhua_temple_01: "Nanhua Temple"
 nanhua_temple_01_desc: "Seat of the Sixth Patriarch Huineng of Chan Buddhism. It remains a vibrant hub for Chan teachings."

 building_type_byeokran_port_01: "$byeokran_port_01$"
 building_type_byeokran_port_01_desc: "$byeokran_port_01_desc$"
 byeokran_port_01: "Byeokran Port" # 碧瀾渡 (벽란도)
 byeokran_port_01_desc: "Situated just west of Gaeseong city at the mouth of the Ryeseong river, the port of Byeokran is the most direct route for foreign goods and travelers to enter the Korean peninsula, avoiding the northern borders and mountain ranges."

 building_type_sado_mines_01: "$sado_mines_02$" # 佐渡金山
 building_type_sado_mines_01_desc: "$sado_mines_01_desc$"
 sado_mines_01: "Sado Gold Pits"
 sado_mines_01_desc: "An old place of exile, few would have expected the distant island of Sado could secretly be hoarding such a wealth of gold beneath its surface."
 sado_mines_02: "Sado Gold Mine"
 sado_mines_02_desc: "The mining pits have been expanded, and engineers have been brought in to truly be able to ramp up the extraction of gold."
 sado_mines_03: "Large Sado Gold Mine"
 sado_mines_03_desc: "A village has sprung up around the many mining pits, and the workers find new gold veins regularly."
 sado_mines_04: "Sado Gold Mining Complex"
 sado_mines_04_desc: "The extraction of gold has reached a near-industrial scale, with the amount of workers now ranging in the thousands. Endless riches seemingly flow from the mines."

 building_type_tada_mines_01: "$tada_mines_02$" # 多田銀銅山遺
 building_type_tada_mines_01_desc: "$tada_mines_01_desc$"
 tada_mines_01: "Tada Copper Pits"
 tada_mines_01_desc: "Beneath the village of Tada, nestled in the Hokusetsu mountains, a wealth of precious metals lies waiting to be rendered. It is said the plating of the great Buddha of Tōdai-ji was hewn from this place."
 tada_mines_02: "Tada Copper Mine"
 tada_mines_02_desc: "The mining pits have been expanded, and engineers have been brought in to truly be able to ramp up the extraction of copper."
 tada_mines_03: "Large Tada Copper Mine"
 tada_mines_03_desc: "A village has sprung up around the many mining pits, and the workers find new copper veins regularly."
 tada_mines_04: "Tada Copper Mining Complex"
 tada_mines_04_desc: "The extraction of copper has reached a near-industrial scale, with the amount of workers now ranging in the thousands. Endless riches seemingly flow from the mines."

 building_type_tsushima_mines_01: "$tsushima_mines_02$" # 対馬銀山
 building_type_tsushima_mines_01_desc: "$tsushima_mines_01_desc$"
 tsushima_mines_01: "Tsushima Silver Pits"
 tsushima_mines_01_desc: "The island of Tsushima is famed for its silver deposits, discovered in the late 7th century during the reign of Emperor Tenmu. Rich in galena, the black ores of the Sea of Japan yield many riches."
 tsushima_mines_02: "Tsushima Silver Mine"
 tsushima_mines_02_desc: "The mining pits have been expanded, and engineers have been brought in to truly be able to ramp up the extraction of silver."
 tsushima_mines_03: "Large Tsushima Silver Mine"
 tsushima_mines_03_desc: "A village has sprung up around the many mining pits, and the workers find new silver veins regularly."
 tsushima_mines_04: "Tsushima Silver Mining Complex"
 tsushima_mines_04_desc: "The extraction of silver has reached a near-industrial scale, with the amount of workers now ranging in the thousands. Endless riches seemingly flow from the mines."

 building_type_koganeyama_mines_01: "$koganeyama_mines_02$"
 building_type_koganeyama_mines_01_desc: "$koganeyama_mines_01_desc$"
 koganeyama_mines_01: "Kinka Gold Pits"
 koganeyama_mines_01_desc: "The island of Kinka and its associated Koganeyama Shrine are famous for the earliest discovered gold deposits in Japan, in the form of gold dust. Established by Emperor Shōmu in the 8th century, the shrine is dedicated to #EMP Kanayama#!, god of mining."
 koganeyama_mines_02: "Kinka Gold Mine"
 koganeyama_mines_02_desc: "The mining pits have been expanded, and engineers have been brought in to truly be able to ramp up the extraction of gold."
 koganeyama_mines_03: "Large Kinka Gold Mine"
 koganeyama_mines_03_desc: "A village has sprung up around the many mining pits, and the workers find new gold veins regularly."
 koganeyama_mines_04: "Kinka Gold Mining Complex"
 koganeyama_mines_04_desc: "The extraction of gold has reached a near-industrial scale, with the amount of workers now ranging in the thousands. Endless riches seemingly flow from the mines."
 
 building_type_mount_baekdu_01: "Mount Baekdu"
 building_type_mount_baekdu_01_desc: "The lofty peak of Mount Baekdu is said to be the origin of all the mountains of the Korean peninsula, and its heights are a sacred place among the region's many faiths and peoples."
 mount_baekdu_01: "$building_type_mount_baekdu_01$"
 mount_baekdu_01_desc: "$building_type_mount_baekdu_01_desc$"

 building_type_mozu_tombs: "$mozu_tombs$"
 building_type_mozu_tombs_desc: "$mozu_tombs_desc$"
 mozu_tombs: "Mozu Tombs"
 mozu_tombs_desc: "The key-hole shaped mounds at Mozu are said to house past emperors of old. For ships in the nearby bay they are a notable landmark as well as a reminder of times past."

 building_type_trosky_castle_01: "$trosky_castle_01$"
 building_type_trosky_castle_01_desc: "$trosky_castle_01_desc$"
 trosky_castle_01: "Trosky Castle"
 trosky_castle_01_desc: "Trosky Castle is built between two basalt rock formations of a long-extinct volcano. The castle derives its name from the shape of the rock, which resembles the ruins of a collapsed castle." 

 building_type_great_project_cathedral_01: "$great_project_cathedral_01$"
 building_type_great_project_cathedral_01_desc: "$building_great_project_cathedral_01_desc$"
great_project_cathedral_01: "Romanesque Grand Cathedral"
great_project_cathedral_01_desc: "An early standing cathedral, seat of a bishop and a beacon for Christian pilgrims. Beneath heavy rounded arches and stately vaults, sacred relics and altars await the faithful.\n\n[building|E] Effects: [GetDomicileBuilding('ecclesiastical_domicile_main_02').GetName] in [cathedral_complex|E]"
 building_type_great_project_cathedral_under_construction: "Cathedral"
 building_great_project_cathedral_under_construction: "Cathedral Under Construction"
 building_great_project_cathedral_under_construction_desc: "Rising up within treadwheel cranes and countless scaffolds, this incomplete edifice of rough stone prepares to one day host a holy seat."

 # Border Forts
 watchtowers: "Watchtowers"
 building_type_watchtowers_1: "$watchtowers$"
 building_type_watchtowers_1_desc: "When raiders are spotted, a fire is lit atop the watchtower, then another, then another. News of a raid can outrun the fastest horse."
 watchtowers_1: "$watchtowers$"
 watchtowers_2: "$watchtowers$ II"
 watchtowers_3: "$watchtowers$ III"
 watchtowers_4: "$watchtowers$ IV"
 watchtowers_5: "$watchtowers$ V"
 scout_camps: "Scout Camps"
 building_type_scout_camps_1: "$scout_camps$"
 building_type_scout_camps_1_desc: "From these camps, scouts slip across the border to count campfires, horses, and banners. A lord who knows the enemy's numbers has already won half the battle."
 scout_camps_1: "$scout_camps$"
 scout_camps_2: "$scout_camps$ II"
 scout_camps_3: "$scout_camps$ III"
 scout_camps_4: "$scout_camps$ IV"
 scout_camps_5: "$scout_camps$ V"
 toll_gates: "Toll Gates"
 building_type_toll_gates_1: "$toll_gates$"
 building_type_toll_gates_1_desc: "Travelers crossing the border must stop at these toll gates and pay for every cart and herd they bring. Smugglers know every goat path around them."
 toll_gates_1: "$toll_gates$"
 toll_gates_2: "$toll_gates$ II"
 toll_gates_3: "$toll_gates$ III"
 toll_gates_4: "$toll_gates$ IV"
 toll_gates_5: "$toll_gates$ V"
 militia_musterhouses: "Militia Musterhouses"
 building_type_militia_musterhouses_1: "$militia_musterhouses$"
 building_type_militia_musterhouses_1_desc: "When the alarm bell rings, the townsfolk gather at this musterhouse to collect spears, shields, and helmets from its racks. Most of the helmets even fit."
