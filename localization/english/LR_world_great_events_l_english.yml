 # LR great events (tools/world_great_events/gen_great_events.py, 2026-11-25). GENERATED - edit the generator.
 LR_world_great.0001.t: "Imperium"
 LR_world_great.0001.desc: "Order returns to [situation_sub_region.GetName]. An emperor holds the purple securely, the frontier armies answer to him, and the cities pay their taxes again. For a while, at least, the Empire is an empire."
 LR_world_great.0001.a: "Secure the frontiers."
 LR_world_great.0001.b: "Reward the legions."
 LR_world_great.0001.c: "Long live the emperor."
 LR_world_great.0001.d: "Rome is strong again."
 LR_world_great.0001.z: "So the world turns."
 LR_world_great.0002.t: "Crisis of the Empire"
 LR_world_great.0002.desc: "The throne of [situation_sub_region.GetName] is shaken. Usurpers stir in the provinces, the armies hail their own commanders, and the treasury cannot pay them all. Every emperor's reign may now be measured in months."
 LR_world_great.0002.a: "Pay the legions, whatever it costs."
 LR_world_great.0002.b: "Make an example of the pretenders."
 LR_world_great.0002.c: "Raise our own banner."
 LR_world_great.0002.d: "Stay loyal, and wait."
 LR_world_great.0002.e: "The Empire tears at itself."
 LR_world_great.0002.z: "So the world turns."
 LR_world_great.0003.t: "Anarchy"
 LR_world_great.0003.desc: "No emperor rules [situation_sub_region.GetName]. The provinces go their own ways, every warlord and dynast eyes the purple, and the old frontiers lie open."
 LR_world_great.0003.a: "Then the purple is ours to claim."
 LR_world_great.0003.b: "Guard our own lands."
 LR_world_great.0003.c: "Let the Romans fight over their corpse."
 LR_world_great.0003.z: "So the world turns."
 LR_world_great.0004.t: "The Restoration"
 LR_world_great.0004.desc: "In [situation_sub_region.GetName] the old dioceses and provinces are drawn again, the prefects return to their seats, and the roads are rebuilt. Rome is not dead: it is remembering what it was."
 LR_world_great.0004.a: "Rebuild the provinces."
 LR_world_great.0004.b: "Bow to the restored Empire."
 LR_world_great.0004.c: "Rome endures."
 LR_world_great.0004.z: "So the world turns."
 LR_world_great.0005.t: "Pax Romana"
 LR_world_great.0005.desc: "One Augustus rules both halves of the Roman world. From the Ocean to the Euphrates the legions keep one peace, and the world holds its breath under the Roman eagle."
 LR_world_great.0005.a: "Pax Romana!"
 LR_world_great.0005.b: "Prosper under the Roman peace."
 LR_world_great.0005.c: "The eagle casts a long shadow."
 LR_world_great.0005.z: "So the world turns."
 LR_world_great.0011.t: "Twilight of the Successors"
 LR_world_great.0011.desc: "Few of the old lines endure in [situation_sub_region.GetName]. Rome and Persia press on the Greek kingdoms, and Alexander's inheritance is fading like a lamp at dawn."
 LR_world_great.0011.a: "Keep the flame burning."
 LR_world_great.0011.b: "The light fades."
 LR_world_great.0011.c: "The age of Alexander is ending."
 LR_world_great.0011.z: "So the world turns."
 LR_world_great.0012.t: "A Hellenic Revival"
 LR_world_great.0012.desc: "Old lines are refounded and the satrapies restored in [situation_sub_region.GetName]. Greek is spoken in the councils of kings again, and the heirs of Alexander return to their thrones."
 LR_world_great.0012.a: "Alexander's heirs return!"
 LR_world_great.0012.b: "The Greeks rise again."
 LR_world_great.0012.c: "The Hellenic world stirs."
 LR_world_great.0012.z: "So the world turns."
 LR_world_great.0013.t: "The Balance of Kings"
 LR_world_great.0013.desc: "Several successor lines now reign side by side in [situation_sub_region.GetName]. None can rule the others, and all must watch their neighbours."
 LR_world_great.0013.a: "Let there be balance."
 LR_world_great.0013.b: "So the kings divide the world."
 LR_world_great.0013.c: "The successors watch each other."
 LR_world_great.0013.z: "So the world turns."
 LR_world_great.0014.t: "Wars of the Successors"
 LR_world_great.0014.desc: "The successor kings of [situation_sub_region.GetName] are at war for Alexander's inheritance. Phalanxes and elephants march again across the old satrapies."
 LR_world_great.0014.a: "To arms!"
 LR_world_great.0014.b: "Seek alliances, not battles."
 LR_world_great.0014.c: "The successors bleed each other."
 LR_world_great.0014.d: "Let the Greeks fight."
 LR_world_great.0014.z: "So the world turns."
 LR_world_great.0015.t: "A Hegemon Rises"
 LR_world_great.0015.desc: "One line now stands above the others in the Hellenistic world. The successor kings bring tribute and envoys, and some remember that it was so under Alexander."
 LR_world_great.0015.a: "So it was under Alexander."
 LR_world_great.0015.b: "Bend the knee to the hegemon."
 LR_world_great.0015.c: "We will never bow."
 LR_world_great.0015.d: "A new Alexander rises."
 LR_world_great.0015.z: "So the world turns."
 LR_world_great.0021.t: "Rome Reborn"
 LR_world_great.0021.desc: "[great_emperor.GetTitledFirstName] has restored the Roman Empire. East and West answer to one Augustus again, and from Britain to Egypt the world must reckon with Rome."
 LR_world_great.0021.a: "Rome is reborn in me."
 LR_world_great.0021.b: "Ave, Auguste!"
 LR_world_great.0021.c: "The old empire lives again."
 LR_world_great.0021.z: "So the world turns."
 LR_world_great.0022.t: "The Empire Divided"
 LR_world_great.0022.desc: "[great_emperor.GetTitledFirstName] has cleaved the Roman Empire. Two courts, two armies and two treasuries now share the Roman world: whether as partners or as rivals, time will tell."
 LR_world_great.0022.a: "It is too great for one man."
 LR_world_great.0022.b: "The Empire divides."
 LR_world_great.0022.c: "Rome is two now."
 LR_world_great.0022.z: "So the world turns."
