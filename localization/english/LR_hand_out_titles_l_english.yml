l_english:
 # LR 2026-11-24: hand out titles (common/decisions/Lux Renata/01_Government/LR_hand_out_titles_decisions.txt)
 LR_hand_out_titles_liege_decision: "Hand Out Titles to Our People"
 LR_hand_out_titles_liege_decision_tooltip: "Grant every title below our highest rank to new lords of our own culture and faith."
 LR_hand_out_titles_liege_decision_desc: "Our domain has outgrown what one ruler can hold. Let loyal men and women of our own people take up the lesser titles in our name."
 LR_hand_out_titles_liege_decision_confirm: "Raise new lords"
 LR_hand_out_titles_liege_decision_effect_tt: "Every title you hold below your highest rank, except your capital county and its duchy, goes to a new character of #V your#! culture and faith. Each duchy, kingdom and empire goes with a county to rule from, and lords whose titles lie under another new lord's title become that lord's vassals."
 LR_hand_out_titles_local_decision: "Hand Out Titles to Local Lords"
 LR_hand_out_titles_local_decision_tooltip: "Grant every title below our highest rank to new lords drawn from the people of each land."
 LR_hand_out_titles_local_decision_desc: "Each land knows its own. Let the notables of every province take up its title in our name, of its own people and its own faith."
 LR_hand_out_titles_local_decision_confirm: "Raise local lords"
 LR_hand_out_titles_local_decision_effect_tt: "Every title you hold below your highest rank, except your capital county and its duchy, goes to a new character of the #V culture and faith of that land#! (the county they will rule from). Each duchy, kingdom and empire goes with a county to rule from, and lords whose titles lie under another new lord's title become that lord's vassals."
 LR_hand_out_titles_decision_has_titles: "You hold titles below your highest rank other than your capital county and its duchy"
