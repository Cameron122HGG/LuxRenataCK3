 nick_voulgaropoulos: "Voulgaropoulos"
 nick_voulgaropoulos_desc: "Son of a Bulgar"
 nick_the_bastard_rumoured: "The Bastard"
 nick_the_bastard_rumoured_desc: "Whispers of bastardy haunt [CHARACTER.GetShortUINameNoTooltipNoFormat] wherever they go. They may only be unproven rumors, but they persist nonetheless."
 nick_the_goth: "the Goth"
 nick_the_goth_desc: "The one who is of Gothic culture."
