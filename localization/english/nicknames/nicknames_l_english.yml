l_english:
 nick_the_slayer_of_emperors: "the Slayer of Emperors"
 nick_the_slayer_of_emperors_desc: "With the blessed blade of the Sword of Victory, [CHARACTER.GetShortUINameNoTooltipNoFormat] snuffed out the lives of three emperors, enshrining himself forever in the annals of history among Rome's most bloodthirsty usurpers." 
 nick_the_leper_king: "the Leper King"
 nick_the_leper_king_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] is afflicted by the wretched disease of leprosy, regarded by commoners and nobles alike as a mark of impurity in body and soul."
 nick_the_illustrious: "the Illustrious"
 nick_the_illustrious_desc: "The one who is renowned and celebrated."
 nick_the_quarreler: "the Quarreler"
 nick_the_quarreler_desc: "The one who is known for arguing and disputing."
 nick_the_adopted: "the Adopted"
 nick_the_adopted_desc: "The one who was adopted into a new family."
 nick_greymantle: "the Greymantle"
 nick_greymantle_desc: "The one who wears a grey mantle."
 nick_the_justiciar: "the Justiciar"
 nick_the_justiciar_desc: "The one who is a just and fair judge."
 nick_gleaming_hilt: "the Gleaming Hilt"
 nick_gleaming_hilt_desc: "The one with a hilt that gleams."
 nick_of_the_tusks: "the Tusks"
 nick_of_the_tusks_desc: "The one who bears tusks."
 nick_the_imperator: "the Imperator"
 nick_the_imperator_desc: "The one who is an emperor."
 nick_the_impetuous: "the Impetuous"
 nick_the_impetuous_desc: "The one who is rash and hasty."
 nick_the_long_hand: "the Long Hand"
 nick_the_long_hand_desc: "The one with a long reach."
 nick_the_roebuck: "the Roebuck"
 nick_the_roebuck_desc: "The one who is as swift as a roebuck."
 nick_the_bald_and_grey: "the Bald and Grey"
 nick_the_bald_and_grey_desc: "The one who is bald and grey."
 nick_greybeard: "the Greybeard"
 nick_greybeard_desc: "The one who has a grey beard."
 nick_white_tooth: "the White Tooth"
 nick_white_tooth_desc: "The one who has a white tooth."
 nick_the_lesser: "the Lesser"
 nick_the_lesser_desc: "The one who is lesser in stature."
 nick_the_fleet_owner: "the Fleet Owner"
 nick_the_fleet_owner_desc: "The one who owns a fleet."
 nick_golden_breast: "the Golden Breast"
 nick_golden_breast_desc: "The one with a golden breastplate."
 nick_splintered_spear: "the Splintered Spear"
 nick_splintered_spear_desc: "The one with a splintered spear."
 nick_the_ambitious: "the Ambitious"
 nick_the_ambitious_desc: "The one who is ambitious and driven."
 nick_the_impotent: "the Impotent"
 nick_the_impotent_desc: "The one who is impotent and unable to act."
 nick_the_snake: "the Snake"
 nick_the_snake_desc: "The one who is cunning and treacherous."
 nick_the_poor: "the Poor"
 nick_the_poor_desc: "The one who is in a state of poverty."
 nick_the_clubfooted: "the Clubfooted"
 nick_the_clubfooted_desc: "The one who has a clubfoot."
 nick_the_bad: "the Bad"
 nick_the_bad_desc: "The one who is morally bad."
 nick_the_sickly: "the Sickly"
 nick_the_sickly_desc: "The one who is often ill."
 nick_of_the_red_robe: "The Red Robe"
 nick_of_the_red_robe_desc: "The one who wears a red robe."
 nick_long_hand: "the Long Hand"
 nick_long_hand_desc: "The one with a long reach."
 nick_the_reluctant: "the Reluctant"
 nick_the_reluctant_desc: "The one who is hesitant and unwilling."
 nick_the_battler: "the Battler"
 nick_the_battler_desc: "The one who is always ready for a fight."
 nick_the_catholic: "the Catholic"
 nick_the_catholic_desc: "The one who is a devout Catholic."
 nick_the_callous: "the Callous"
 nick_the_callous_desc: "The one who is emotionally insensitive."
 nick_nicator: "Nicator"
 nick_nicator_desc: "A great conqueror who has tasted no end of glory, the accomplishments of [CHARACTER.GetShortUINameNoTooltipNoFormat] the Victorious inspire boundless confidence in [CharYourHerHis(CHARACTER)] troops - and no small amount of terror in the enemy."
 nick_soter: "Soter"
 nick_soter_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat], deliverer of justice, bringer of salvation, font of hope and glory, is unanimously hailed by [CharYourHerHis(CHARACTER)] subjects as their beloved Savior."
 nick_theos: "Theos"
 nick_theos_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] is renowned as a godly soul, beloved by [ROOT.Char.GetFaith.HighGodName]."
 nick_euergetes: "Euergetes"
 nick_euergetes_desc: "The Generous"
 nick_eleutherios: "Eleutherios"
 nick_eleutherios_desc: "Having freed their people from foreign yoke, [CHARACTER.GetShortUINameNoTooltipNoFormat] has been acclaimed as 'the Liberator'."
 nick_epiphanes: "Epiphanes"
 nick_epiphanes_desc: "The Glorious"
 nick_eupator: "Eupator"
 nick_eupator_desc: "Of Noble Father"
 nick_philadelphus: "Philadelphus"
 nick_philadelphus_desc: "Sibling-Loving"
 nick_ktistes: "Ktistes"
 nick_ktistes_desc: "Founder"
 nick_dikaios: "Dikaios"
 nick_dikaios_desc: "The Righteous"
 nick_eusebes: "Eusebes"
 nick_eusebes_desc: "the Pious"
 nick_frangopoulos: "Frangopoulos"
 nick_frangopoulos_desc: "Son of a Frank"
