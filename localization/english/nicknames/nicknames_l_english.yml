 nick_saio: "Saiō"
 nick_saio_desc: "Saiō (斎王) or itsuki no miko, was the title of the unmarried female members of the Japanese imperial family."
 nick_thiufadus: "Thiufadus"
 nick_augustus: "Augustus"
 nick_augustus_desc: "The title of Augustus, meaning 'august' or 'venerable', marks [CHARACTER.GetShortUINameNoTooltipNoFormat] as a worthy carrier of Rome's time-honored traditions and of [CharYourHerHis(CHARACTER)] own divine blood."
 nick_heliophilus: "Heliophilus"
 nick_heliophilus_desc: "On account of [CharYourHerHis(CHARACTER)] deep devotion to the worship of Sol, [CHARACTER.GetShortUINameNoTooltipNoFormat] is known far and wide as a lover of the sun."
 nick_renatus: "Renatus"
 nick_renatus_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat], after years of being a prisoner in [CharYourHerHis(CHARACTER)] own body, has miraculously risen to life again." #https://steamcommunity.com/sharedfiles/filedetails/?id=3637096776
 nick_omnividens: "Omnividens"
 nick_omnividens_desc: "Even after having been blinded, [CHARACTER.GetShortUINameNoTooltipNoFormat] looks upon the world as well as any man alive, proclaiming that he sees through the eyes of Sol. So it is that [CharYourHerHis(CHARACTER)] subjects acclaimed him 'the All-Seeing'."
 nick_janus: "Janus"
 nick_janus_desc: "A scheming manipulator in both secular and religious politics, [CHARACTER.GetShortUINameNoTooltipNoFormat] often finds himself compared to Ianus Bifrons - the god of two faces."
 nick_bretanoktonos: "Bretanoktonos"
 nick_bretanoktonos_desc: "It is unwise to ask [CHARACTER.GetShortUINameNoTooltipNoFormat] of [CharYourHerHis(CHARACTER)] opinion on Britannian food, let alone how many Britannians he had to kill to earn the name 'Briton-slayer'."
 nick_stratiotikos: "Stratiotikos"
 nick_stratiotikos_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] is a dutiful defender of [CharYourHerHis(CHARACTER)] realm, and an exemplar of soldierly virtue."
 nick_antichristos: "Antichristos"
 nick_antichristos_desc: "When [CHARACTER.GetShortUINameNoTooltipNoFormat] was declared the Antichrist himself by Pope Innocent I, [CharYouSheHe(CHARACTER)] did not deny it."
 nick_mikros: "Mikros"
 nick_mikros_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] claims ancestry from men who aspired to great and mighty deeds. Yet [CharYouSheHe(CHARACTER)] is but a lesser man, hardly even a shade of that glory..."
 nick_basileiskos: "Basileiskos"
 nick_basileiskos_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] was enthroned as Emperor at the age of two, denigrated by [CharYourHerHis(CHARACTER)] regent as 'the Little Emperor'."
 nick_ammonios: "Ammonios"
 nick_ammonios_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] was considered the descendant of Amun, and was an object of great veneration among the Berber tribes. Or at least, [CharYourHerHis(CHARACTER)] corpse was."
 nick_oinochous: "Oinochous"
 nick_oinochous_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat] is world-famous for [CharYourHerHis(CHARACTER)] ability to hold various liquids."
 nick_senator: "Senator"
 nick_boethius: "Boethius"
 nick_muinremuir: "Muinremuir"
 nick_mor: "Mór"
 nick_mor_desc: "Gaelic for 'the Great'."
 nick_reti: "Réti"
 nick_buide: "Buide"
 nick_buide_desc: "Gaelic for 'The Yellow' or 'the Fair-haired'."
 nick_cerr: "Cerr"
 nick_brecc: "Brecc"
 nick_brecc_desc: "Gaelic for 'the Speckled'."
 nick_crandomna: "Crandomna"
 nick_donn: "Donn"
 nick_donn_desc: "Known as 'the Brown' or 'the Brown-haired', a Gaelic descriptive byname."
 nick_fota: "Fota"
 nick_fota_desc: "'the Tall' or 'the Long' in Gaelic."
 nick_cael: "Cáel"
 nick_cael_desc: "'the Slender', a Gaelic descriptive byname."
 nick_bec: "Bec"
 nick_bec_desc: "'the Little', in Gaelic."
 nick_find: "Find"
 nick_find_desc: "Known as 'the Fair' or 'the White'."
 nick_guletic: "Guletic"
 nick_guletic_desc: "The early Brittonic version of the storied 'Wledic' byname, meanign 'land-ruler' or 'sovereign'. Not many in British history have born this epithet."
 nick_hen: "Hen"
 nick_hael: "Hael"
 nick_hael_desc: "'the Generous' or 'the Liberal', a famous byname of Rhydderch of Alt Clut."
 nick_hwyr: "Hwyr"
 nick_hwyr_desc: "'the Late' in Brittonic. Dumnagual earned this byname after arriving too late to aid the Pictish king Uuen at the Battle of Uortrebacht against Ivarr the Boneless."
 nick_foel: "Foel"
 nick_foel_desc: "'the Bald' in Brittonic."
 nick_uthr: "Uthr"
 nick_uthr_desc: "A Brittonic epithet meaning 'terrible', 'fearsome', or 'dread'. Best known from the Welsh name Uther Pendragon."
 nick_teir_goronetic: "Terguletic"
 nick_teir_goronetic_desc: "'the Thrice-Ruler', due to the three kingdoms Artgal ruled over."
 nick_hen: "Hen"
 nick_hen_desc: "'The old' in Brittonic tradition. Coel Hen is remembered as the ancestral king of many rulers of the Old North."
 nick_gul: "Gul"
 nick_oer: "Oer"
 nick_oer_desc: "'The Cold' in Brittonic tradition."
 nick_the_great_alexander: "ho Mégas"
 nick_the_great_alexander_desc: "A tomb now suffices him for whom the world was not enough."
 nick_nine_hostages: "of the Nine Hostages"
 nick_nine_hostages_desc: "It is said that [CHARACTER.GetShortUINameNoTooltipNoFormat] recieved a hostage from each of the five provinces of Ireland and the far off realms of Scotland, Saxony, Britain and Gaul."
 nick_the_hierakaine: "Hierakáine"
 nick_the_hierakaine_desc: "the She-Hawk"
 nick_versutus: "Versūtus"
 nick_polytropon: "Polýtropos"
 nick_versutus_desc: "the Clever, the Shrewd, the Wily, an epithet used in Latin to define Ulysses."
 nick_polytropon_desc: "He of Many Turns, He of Many Travels and Devices, the Wily, the... Complicated. The famous epithet with which the Odyssey refers to its hero Odysseus."
 nick_the_unconquered: "ho Anikētos"
 nick_the_unconquered_desc: "A title bestowed upon those who could not be subdued, a testament to their indomitable spirit."
 nick_beronja: "Beronja"
 nick_beronja_desc: "A doublet meaning both the Fair Maid or the Barren, in the Illyrian language, no doubt poisoned praise fed by envy."
 nick_optimus_maximus: "[Select_CString( CHARACTER.IsFemale, 'Optima Maxima', 'Optimus Maximus' )]"
 nick_olympios: "Olympios"
 nick_olympios_desc: "The Olympian, the supreme ruler of the gods. . It suits one whose authority appears elevated above that of ordinary mortals."
 nick_teleia: "Teleia"
 nick_teleia_desc: "the Bringer to Fulfilment, Hera as patroness of marriage and completed rites. She brings promise and great undertaking, and rewards difficult journeys through life."
 nick_ennosigaios: "Ennosigaios"
 nick_ennosigaios_desc: "Said crafty Odysseus that he know how the renowned Earth-Shaker was angered against him. Poseidon is lord of the Sea but he is also the Shaker of the Earth, just like the storm makes the world tremble, so does his wrath."
 nick_thesmophoros: "Thesmophoros"
 nick_thesmophoros_desc: "The Bearer of Sacred Laws, this was one of the domains of Demeter."
 nick_pallas: "Pallas"
 nick_pallas_desc: "An epithet of Athena, of unknown meaning but associated with maidenhood."
 nick_phoibos: "Phoibos"
 nick_phoibos_desc: "The Bright or the Pure, this was the most famous poetic epithet of Apollo. It evokes radiance, clarity, prophecy, and the merciless light of truth."
 nick_pythios: "Pythios"
 nick_pythios_desc: "The slayer of Python, Apollo, is the god who gives sight to the priestess of Delphi, the most sacred of the Panhellenic oracles."
 nick_agrotera: "Agrotera"
 nick_agrotera_desc: "'Artemis was the Huntress, the Lady of the Wilderness, the giver of chase and the ruler of the uncultivated lands."
 nick_enyalios: "Enyalios"
 nick_enyalios_desc: "Sometmes an epithet of the savage Ares, sometimes a god of war in his own merit."
 nick_thourios: "Thourios"
 nick_thourios_desc: "The Impetuous, or the Furious, one of the most popular epithets of Ares, He who strides into battle with no restraint."
 nick_ourania: "Ourania"
 nick_ourania_desc: "The Heavenly, this was an epithet of Aphrodite as the giver of exalted, spiritual love, rather than earthly lust."
 nick_pandemos: "Pandēmos"
 nick_pandemos_desc: "Of All People, an epithet given to Aphrodite in Corinth as the uniter of the community in brotherly love."
 nick_klytotekhnes: "Klytotekhnēs"
 nick_klytotekhnes_desc: "The Renowned Craftsman, this was a poetic epithet of Hephaistos."
 nick_psychopompos: "Psychopompos"
 nick_psychopompos_desc: "The Guide of Souls, Hermes in his role as the shepherd of the spirits of the dead towards Hades."
 nick_bromios: "Bromios"
 nick_bromios_desc: "The Roaring or the Thunderous, this was a famous epithet of Dionysos as the presider of an ecstatic crowd of merry-makers."
 nick_prytaneia: "Prytaneia"
 nick_prytaneia_desc: "She of the Prytaneion, this title belonged to Hestia as guardian of the public hearth."
 nick_boulaia: "Boulaia"
 nick_boulaia_desc: "She of the Council, this was an epithet of Hestia in her role as a civic protector of proper political procedure and debate."
 nick_despoina: "Despoina"
 nick_despoina_desc: "The Mistress, a solemn title associated especially with Persephone and the mysterious Arcadian goddess Despoina."
 nick_kore: "Korē"
 nick_kore_desc: "The Maiden, this was the customary title of Persephone, particularly in the Eleusinian mysteries."
 nick_plouton: "Ploutōn"
 nick_plouton_desc: "The Wealthy One, this was the reverential name of Hades as lord of the riches hidden beneath the earth."
 nick_optimus_maximus_desc: "The Best and Greatest, this was the supreme title of Jupiter as chief protector of the Roman state."
 nick_regina: "Regina"
 nick_regina_desc: "The Queen, a title given most famously borne by Juno Regina. It signifies sovereign womanhood, commanding dignity, and queenship exercised as a sacred power in its own right."
 nick_moneta: "Moneta"
 nick_moneta_desc: "The Warner or the Adviser, this was the title of Juno, the prudent queen of Olympus. Her temple housed the Roman mint, causing the name Moneta eventually to become associated with coins."
 nick_equester: "Equester"
 nick_equester_desc: "Neptune, He of the Horsemen, lord of horses and racing, festivites and merrymaking."
 nick_gradivus: "Gradivus"
 nick_gradivus_desc: "He Who Marches Forth or the Strider, this was one of the oldest titles of Mars as the one who led the Roman armies to victory."
 nick_ultor: "Ultor"
 nick_ultor_desc: "The Avenger, an apellation of the rageful Mars, whose great temple was raised by Augustus."
 nick_genetrix: "Genetrix"
 nick_genetrix_desc: "The epithet of Venus Genetrix as divine foremother of the Julian line and the Roman people."
 nick_victrix: "Victrix"
 nick_victrix_desc: "'The Victorious' in the feminine, this was most famously the title of Venus Victrix. It suits a woman whose favour, beauty, strategy, or martial power repeatedly brings triumph."
 nick_victor: "Victor"
 nick_victor_desc: "The Victorious, this title was applied to gods such as Jupiter, Mars, and Hercules. It honours one whose victories have become the defining feature of their reputation."
 nick_trivia: "Trivia"
 nick_trivia_desc: "She of the Three Ways, Diana in her identification with Hekate, a lady of the hidden secrets, the night and crossroads. Three roads diverged in a yellow wood..."
 nick_caducifer: "Caducifer"
 nick_caducifer_desc: "The Bearer of the Caduceus, an epithet of Mercury, who brings news but also hidden knowledge."
 nick_podarkes: "Podarkēs"
 nick_podarkes_desc: "The Swift-Footed, like mighty Achilles son of Peleus. It honours extraordinary speed in battle, pursuit, or escape."
 nick_frugifera: "Frugifera"
 nick_frugifera_desc: "'The Fruit-Bearing', this was a title associated with agricultural goddesses such as Ceres and Tellus. It honours one under whose protection fields, orchards, and people flourish."
 nick_mulciber: "Mulciber"
 nick_mulciber_desc: "The Softener, this was a name of Vulcan, the divine smith who softens and shapes metal with the fire of his own ingenuity."
 nick_mater: "Mater"
 nick_mater_desc: "Mother, this sacred title was borne by goddesses such as Vesta, Ceres, and the Magna Mater."
 nick_augusta: "Augusta"
 nick_augusta_desc: "The Venerable or the Majestic, this title was granted to goddesses and imperial women. It marks a woman whose dignity has acquired an almost sacred character."
 nick_geminus: "Geminus"
 nick_geminus_desc: "The Twin, or the Twofold, especially associated with Janus Geminus and other dual powers. It suits one defined by twinship, divided identity, or command over two opposing realms."
 nick_gemina: "Gemina"
 nick_gemina_desc: "The Twin, or the Twofold, the epithet of divine twins."
 nick_pater: "Pater"
 nick_pater_desc: "Father, this sacred title appears in names such as Jupiter Pater, Liber Pater, and Dis Pater. It honours a founder, protector, ancestral ruler, or the father of an entire people."
 nick_indiges: "Indiges"
 nick_indiges_desc: "An ancient title commonly understood as 'the Native', 'the Ancestral', or 'the Indwelling God'. It was associated especially with the deified Aeneas and the native divine powers of Italy."
 nick_lyaios: "Lyaios"
 nick_lyaios_desc: "The Releaser or He Who Sets Free, was the epithet of the god Dionysos, whose sweet liquid dissolves grief and mortal cares."
 nick_doondemayence: "Doon De Mayence"
 nick_doondemayence_desc: "The Doon de Mayence is a legendary figure of the French chansons de geste, a hero of the Carolingian cycle whose exploits are celebrated in epic poetry."
