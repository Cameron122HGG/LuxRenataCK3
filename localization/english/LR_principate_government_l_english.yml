l_english:
 # LR 2026-11-19: the Principate (common/scripted_effects/LR/LR_principate_effects.txt)

 # Succession
 principate_succession_law: "Adoptive Principate"
 principate_succession_law_subname: "The Senate Elects the Adopted Heir"
 principate_succession_law_effects: "\n#high Under $principate_succession_law$, the Princeps rules for life and may adopt a successor.#!\n\n#weak On the death of the Princeps the Senate ([assembly|E]) elects the next Princeps from the Princeps' family, direct vassals and [councillors|E]. The adopted heir is strongly favoured; renown and generalship also win votes.#!\n"
 principate_elective_candidates: "Family, Direct Vassals and Councillors"
 principate_elective_candidates_tooltip: "In order to be a valid Candidate under $principate_succession_law$, a character must fulfill one of the following conditions:\n$EFFECT_LIST_BULLET$Be close or extended family of the Princeps\n$EFFECT_LIST_BULLET$Be a [direct_vassal|E] of the Princeps\n$EFFECT_LIST_BULLET$Be a [councillor|E] of the Princeps"
 principate_elective_electors: "Princeps and Senate"
 principate_elective_electors_tooltip: "In order to be a valid [elector|E] under $principate_succession_law$, a character must fulfill one of the following conditions:\n$EFFECT_LIST_BULLET$Be the Princeps\n$EFFECT_LIST_BULLET$Be a member of the Senate ([assembly|E]) or a Principate governor"
 LR_principate_vote_strength_princeps: "The Princeps"
 LR_principate_vote_strength_province: "Governs a Great Province"
 LR_principate_elector_adopted_heir_princeps: "My Adopted Heir"
 LR_principate_elector_adopted_heir: "Adopted Heir of the Princeps"
 LR_principate_elector_princeps_family: "My Own Blood"
 LR_principate_elector_opinion: "Opinion"
 LR_principate_elector_candidate_prestige: "Renown"
 LR_principate_elector_candidate_martial: "Acclaimed by the Legions"
 LR_principate_elector_candidate_province: "Governs a Great Province"
 LR_principate_elector_self: "Myself"
 LR_principate_elector_same_house: "Of My House"

 # Adopt a successor
 LR_principate_adopt_successor_interaction: "Adopt as Successor"
 LR_principate_adopt_successor_interaction_desc: "Adopt [recipient.GetShortUIName] as your successor. The Senate will favour [recipient.GetHerHim] when it elects the next Princeps."
 LR_principate_already_adopted_tt: "[recipient.GetShortUIName] is already your adopted heir"

 # Accept the Principate
 LR_accept_principate_decision: "Accept the Principate"
 LR_accept_principate_decision_desc: "The Republic has outgrown its magistrates. Let the Senate grant me the powers of a Princeps, the First Citizen, to hold for life."
 LR_accept_principate_decision_tooltip: "Ask the Senate to make you Princeps"
 LR_accept_principate_decision_confirm: "Let the Senate decide"
 LR_accept_principate_auctoritas_tt: "You have #V Legendary#! [prestige|E], at least #V 14#! [martial|E], or an army of at least #V 10,000#! soldiers"
 LR_accept_principate_reluctance_desc: "Fears a Master"
 LR_accept_principate_renown_desc: "Renowned Consul"
 LR_accept_principate_ambitious_desc: "Ambitious"
 LR_accept_principate_meek_desc: "Meek"
 LR_become_princeps_governors_tt: "Your landed [direct_vassals|E] of [duchy|E] tier or higher become governors of Senatorial or Imperial provinces"
 LR_become_princeps_senators_tt: "Your landed [vassals|E] of [duchy|E] tier or higher take seats in the [assembly|E], and the Senate Size law is set to fit them"
 LR_become_princeps_opinion_custom: "Every republican [vassal|E]"

 # Reform into the Dominate
 LR_reform_into_dominate_decision: "Reform into the Dominate"
 LR_reform_into_dominate_decision_desc: "The Senate is a shadow and the Republic a memory. Let the pretence end: I shall rule as Dominus, lord and master, with a bureaucracy of my own choosing."
 LR_reform_into_dominate_decision_tooltip: "Set the Senate aside and rule as Dominus"
 LR_reform_into_dominate_decision_confirm: "The Republic is ended"
 LR_reform_into_dominate_ceremonial_senate_tt: "The Senate's authority is #V Ceremonial#!"
 LR_reform_into_dominate_skill_tt: "You have at least #V 14#! [stewardship|E] or [martial|E]"
 LR_reform_into_dominate_governors_tt: "You and your Principate governors take up the #V Roman Dominate#! [government|E]"
 LR_principate_passed_over_children_custom: "Your grown children"

 # Modifiers
 LR_princeps_auctoritas_modifier: "Auctoritas of the Princeps"
 LR_princeps_auctoritas_modifier_desc: "The Senate has granted this character the powers of a Princeps, the First Citizen."
 LR_principate_adopted_heir_modifier: "Adopted Heir of the Princeps"
 LR_principate_adopted_heir_modifier_desc: "This character has been adopted as successor by the Princeps."
 LR_dominus_reform_modifier: "Dominus"
 LR_dominus_reform_modifier_desc: "This character set the Senate aside and rules as lord and master."

 # Opinions
 LR_became_princeps_opinion: "Became Princeps"
 LR_principate_adopted_opinion: "Adopted Me"
 LR_principate_disinherited_opinion: "Disinherited Me"
 LR_principate_passed_over_opinion: "Passed Me Over"
 LR_senate_set_aside_opinion: "Set the Senate Aside"

 # LR 2026-11-19: decayed Roman empires (LR_can_have_upgraded_roman_government_trigger)
 LR_can_have_upgraded_roman_government_tt: "You do not rule a decayed Roman empire (Byzantium, Roma, Tadmor, Syagria or the Constantinid Empire): transition out of that title first"

 # LR 2026-11-19: Roman Autocratic emperors at the hegemony tier (99_LR_principate_decisions.txt)
 LR_roman_autocrat_highest_tier_tt: "You hold a title of the highest tier (a Roman hegemony such as the Roman Empire of the West, of the East, or of all Rome)"
 LR_adopt_roman_dominate_decision: "Establish the Dominate"
 LR_adopt_roman_dominate_decision_desc: "The Empire is whole again, and it needs more than the old autocracy of camp and court. Let a great bureaucracy of ministers, offices and appointed governors serve one Dominus, lord and master of the Roman world."
 LR_adopt_roman_dominate_decision_tooltip: "Rule the restored Empire as Dominus"
 LR_adopt_roman_dominate_decision_confirm: "I am Dominus"
 LR_adopt_roman_dominate_governors_tt: "You and your #V Roman Imperial#! vassals take up the #V Roman Dominate#! [government|E]"
 LR_restore_roman_principate_decision: "Restore the Principate"
 LR_restore_roman_principate_decision_desc: "Rome was greatest when its master called himself only the First Citizen. Let the Senate sit again, let the provinces be shared between the Senate and the Princeps, and let the next Princeps be the best of us rather than merely the next of kin."
 LR_restore_roman_principate_decision_tooltip: "Give the Senate back its place and rule as Princeps"
 LR_restore_roman_principate_decision_confirm: "Restore the Senate"
 LR_has_classical_government_tt: "Your [government|E] is one of the $lux_tradition_gov_classical_name$ governments (Classical, Roman or Hellenistic)"

 # LR 2026-11-19: Roman title twins (LR_roman_title_twins_effects.txt)
 LR_roman_titles_to_republic_tt: "Your Roman Empire titles become their Roman Republic twins ([GetTitleByKey('e_western_roman_empire').GetName] becomes [GetTitleByKey('e_western_roman_republic').GetName], and so on), keeping their lands, history and men-at-arms (the next day)"
 LR_roman_titles_to_empire_tt: "As Princeps, your Roman Republic titles become their Roman Empire twins ([GetTitleByKey('e_western_roman_republic').GetName] becomes [GetTitleByKey('e_western_roman_empire').GetName], and so on), keeping their lands, history and men-at-arms (the next day)"

 # LR 2026-11-19: the Principate's legions (LR_roman_legion_laws.txt)
 LR_principate_legion_appointment_succession_law: "Legion Appointment by the Cursus"
 LR_principate_legion_appointment_succession_law_subname: "The Princeps Appoints a Legate"
 LR_principate_legion_appointment_succession_law_effects: "\nA type of [appointment_succession_law|E] used only by the Principate's legions. The legion passes to the candidate with the best appointment score among those of high enough [merit|E] on the cursus honorum, favouring generals, Roman citizens and the friends of the Princeps.\n"
 LR_has_roman_evolution_dlc_tt: "The Roads to Power, Silk & Silver and All Under Heaven DLCs are enabled"

 # LR 2026-11-19: the Princeps' ministers (LR_principate_ministry_positions.txt)
 LR_praefectus_praetorio: "Praetorian Prefect"
 LR_praefectus_praetorio_desc: "The $LR_praefectus_praetorio$ commands the Praetorian Guard, the only soldiers allowed in Rome. A loyal prefect keeps the Princeps safe; a disloyal one can make or unmake him."
 LR_praefectus_praetorio_possessive: "Praetorian Prefect's"
 LR_praefectus_praetorio_modifier: "Liege's $LR_praefectus_praetorio$"
 LR_principate_praefectus_urbi: "Urban Prefect"
 LR_principate_praefectus_urbi_desc: "The $LR_principate_praefectus_urbi$, always a senator of consular rank, keeps order in the city and speaks for the Princeps to the Senate."
 LR_principate_praefectus_urbi_possessive: "Urban Prefect's"
 LR_principate_praefectus_urbi_modifier: "Liege's $LR_principate_praefectus_urbi$"
 LR_praefectus_annonae: "Prefect of the Grain Supply"
 LR_praefectus_annonae_desc: "The $LR_praefectus_annonae$ brings the grain fleets from Egypt and Africa and feeds the people of Rome, who never forget who fed them."
 LR_praefectus_annonae_possessive: "Prefect of the Grain Supply's"
 LR_praefectus_annonae_modifier: "Liege's $LR_praefectus_annonae$"
 LR_a_rationibus: "Secretary of Accounts"
 LR_a_rationibus_desc: "The $LR_a_rationibus$ (a rationibus) keeps the Princeps' treasuries, estates and revenues."
 LR_a_rationibus_possessive: "Secretary of Accounts'"
 LR_a_rationibus_modifier: "Liege's $LR_a_rationibus$"
 LR_ab_epistulis: "Secretary of Correspondence"
 LR_ab_epistulis_desc: "The $LR_ab_epistulis$ (ab epistulis) answers the letters of governors, client kings and embassies in the name of the Princeps."
 LR_ab_epistulis_possessive: "Secretary of Correspondence'"
 LR_ab_epistulis_modifier: "Liege's $LR_ab_epistulis$"
 LR_principate_minister_modifier: "Minister of the Princeps"
 LR_principate_minister_modifier_desc: "This character serves the Princeps as a minister, a step on the cursus honorum."
 # LR 2026-11-19: the offices as court positions (LR_principate_court_positions.txt); the council seats crashed
 LR_praefectus_praetorio_court_position: "$LR_praefectus_praetorio$"
 LR_praefectus_praetorio_court_position_desc: "$LR_praefectus_praetorio_desc$ Office holders rise on the cursus honorum."
 LR_principate_praefectus_urbi_court_position: "$LR_principate_praefectus_urbi$"
 LR_principate_praefectus_urbi_court_position_desc: "$LR_principate_praefectus_urbi_desc$ Office holders rise on the cursus honorum."
 LR_praefectus_annonae_court_position: "$LR_praefectus_annonae$"
 LR_praefectus_annonae_court_position_desc: "$LR_praefectus_annonae_desc$ Office holders rise on the cursus honorum."
 LR_a_rationibus_court_position: "$LR_a_rationibus$"
 LR_a_rationibus_court_position_desc: "$LR_a_rationibus_desc$ Office holders rise on the cursus honorum."
 LR_ab_epistulis_court_position: "$LR_ab_epistulis$"
 LR_ab_epistulis_court_position_desc: "$LR_ab_epistulis_desc$ Office holders rise on the cursus honorum."
 principate_province_imperial_rank_desc: "The governor has at least [merit_level|E] 2 on the cursus honorum"
 LR_principate_adopt_rank_tt: "[recipient.GetShortUIName] has at least [merit_level|E] 2 on the cursus honorum"

 # LR 2026-11-19: the Dominate's ceremonial Senate (LR_dominate_senate_laws.txt)
 LR_dominate_senate_laws: "Senate"
 LR_dominate_ceremonial_senate_law: "Ceremonial Senate"
 LR_dominate_ceremonial_senate_law_effects: "The Senate still meets in the Curia, robed and honoured, but it governs nothing. Its one remaining power is to ask for the Principate back.\n"
 LR_roman_circus_games_decision: "Hold Games in the Circus"
 LR_roman_circus_games_decision_desc: "Chariots, beasts and gladiators: let the people of the capital see what their emperor gives them."
 LR_roman_circus_games_decision_tooltip: "Raise the capital's popular opinion with games"
 LR_roman_circus_games_vassals_custom: "Every great vassal"
 LR_roman_circus_games_opinion: "Enjoyed the Games"
 LR_roman_institutions_to_dominate_tt: "Your officials take the matching ministries of the Dominate (the Praetorian Prefect becomes Master of Soldiers, the Urban Prefect stays Urban Prefect, the Secretaries of Accounts and Correspondence become Master of Offices and Magister Memoriae), and the Senatorial governors keep their seats in a ceremonial Senate"
 LR_roman_institutions_to_principate_tt: "Your ministers take the matching offices of the Princeps at court the next day (the Master of Soldiers becomes Praetorian Prefect, the Urban Prefect stays Urban Prefect, the Master of Offices and Magister Memoriae become the Secretaries of Accounts and Correspondence), and the ceremonial Senate's members sit in the restored Senate"
 LR_roman_imperial_legion_cap_tt: "As a #V Roman Imperial#! ruler you have fewer than #V 3#! legions"
 LR_roman_imperial_dux_cap_tt: "As a #V Roman Imperial#! ruler you have fewer than #V 3#! duces"
 LR_roman_circus_games_decision_confirm: "Let the games begin!"
 LR_accept_principate_dictator_tt: "You are #V Dictator#!: the Senate has made your office #V For Life#!"
