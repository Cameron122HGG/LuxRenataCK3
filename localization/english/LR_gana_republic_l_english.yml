l_english:
 # LR 2026-11-25 group republics (tools/group_republics/build_group_republics.py)
 gana_republic_government: "Gana-Sangha"
 gana_republic_government_adjective: "$gana_republic_government$"
 gana_republic_government_realm: "Gana-Sangha"
 gana_republic_government_desc: "$LR_gana_republic_desc_body$\n\n$republic_government_desc$"
 gana_republic_government_vassals_label: "$republic_government_vassals_label$"
 LR_gana_republic_desc_body: "#F The rajas of the clans rule together: they meet in the Santhagara, the assembly hall, elect a chief raja and his deputy, and decide by vote, as the Licchavis of Vaishali, the Vajji and the Malla did.#!"
 LR_gov_icon_gana_republic_government: "@lr_gov_gana_republic_government!"
 LR_gana_uparaja: "Uparaja"
 LR_gana_uparaja_desc: "Whether the chief raja rules alone, or beside an Uparaja: a deputy raja of another clan, the most diplomatic of them, chosen each term, who shares the state as a [diarch|E]."
 LR_uparaja_none: "The Raja Alone"
 LR_uparaja_none_desc: "The chief raja leads the gana without a deputy beside him."
 LR_uparaja_elected: "Elected Uparaja"
 LR_uparaja_elected_desc: "An Uparaja, the most diplomatic raja of another clan, is elected each term to share the state with the chief raja."
 uparaja_diarchy_diarchy_type: "Uparaja"
 uparaja_diarchy_diarch_title: "Uparaja"
 LR_from_uparaja_opinion: "Uparaja's Diplomacy"
 LR_to_uparaja_prestige: "Uparaja of the Gana"
 republic_type_gana_kula: "Gana"
 republic_type_gana_kula_effects: "\n#weak The ruling clans, each led by its raja, share the state: a proud, armed oligarchy of kinsmen.#!"
 republic_type_gana_sangha: "Sangha"
 republic_type_gana_sangha_effects: "\n#weak The whole assembly decides in the Santhagara: debate, the vote and the counting of the voting sticks.#!"
 republic_type_gana_shreni: "Shreni"
 republic_type_gana_shreni_effects: "\n#weak The guilds of merchants and craftsmen sit beside the clans and keep the city's treasury full.#!"
 republic_type_gana_ayudhajivi: "Ayudhajivi"
 republic_type_gana_ayudhajivi_effects: "\n#weak Those who live by arms: a warrior republic whose citizens are its soldiers, as the grammarians called the martial ganas.#!"
