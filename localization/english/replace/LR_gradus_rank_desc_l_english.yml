l_english:
 # LR 2026-11-25 GRADUS rank lines on vanilla government descriptions (tools/imperial_rise/build_rank_lines.py)
 meritocratic_government_desc_body: "\n$game_concept_meritocratic_desc$\n\n#F The $meritocratic_government$ system refers to the centralized Administrative government of China's neighbors, inspired by the Confucian bureaucracy.#!"
 meritocratic_government_desc: "$LR_gradus_rank_meritocratic_government$\n\n$meritocratic_government_desc_body$"
 celestial_government_desc_body: "\n$game_concept_celestial_government_desc$\n\n#F The $celestial_government$ system refers to the centralized Administrative government of China, overseen by the Son of Heaven.#!"
 celestial_government_desc: "$LR_gradus_rank_celestial_government$\n\n$celestial_government_desc_body$"
 japan_feudal_government_desc_body: "\n$japan_feudal_government$ is a type of [feudal|E] [government|E] unique to Japan.\n\n$japan_feudal_government$ represents local lords who have discarded or supplanted the reach of the central [ritsuryo|E] government and rule provinces as their own fiefs.\n\n$japan_feudal_government$ Characters do not use [influence|E], but [noble_family|E] [house_head_heads|E] retain their [family_manor|E] and [house_aspiration|E].\n\nThough they cannot be elected [ceremonial_regent|E], $japan_feudal_government$ [rulers|E] may take power via the #V $replace_ceremonial_regent_faction_name$#! [faction|E], and use the #V Formalize Shōgunate#! [decision|E].\n\n$japan_feudal_government$ $game_concept_ceremonial_regents$ govern the [realm|E] on behalf of the [japanese_emperor|E], inherit by $single_heir_succession_law$ [succession|E], and may be overthrown by [faction|E] demand.\n\n$japan_feudal_government$ $game_concept_house_heads$ may create and join [house_blocs|E] within the [realm|E].\n\n$japan_government_domain_limit_help$\n\n#F $japan_feudal_government$ refers to the early stages of Japanese feudalization beginning in the Heian-period, increasingly formalized under the Kamakura-period's first Shōgunate.#!"
 japan_feudal_government_desc: "$LR_gradus_rank_japan_feudal_government$\n\n$japan_feudal_government_desc_body$"
 japan_administrative_government_desc_body: "\n$japan_administrative_government$ is a type of [government_bureaucratic_type|E] [government|E] unique to Japan.\n\nIt is a centralized [government_bureaucratic_type|E] [government_form|E] where [characters|E] are appointed as [governors|E] on behalf of their [liege|E], have access to [influence|E], and [noble_family|E] [house_head_heads|E] have a [family_manor|E] and [house_aspiration|E].\n\nA [kampaku|E] governs the [realm|E] on behalf of the [japanese_emperor|E], and may be elected from among [noble_family|E] [house_head_heads|E], or imposed by [faction|E] demand.\n\n$japan_administrative_government$ [vassals|E] generally govern only a single [county|E], but may reject the centralized system and become local [soryo|E] lords to build their own power, though this is usually considered a [criminal|E] act.\n\n$japan_administrative_government$ $game_concept_house_heads$ may create and join [house_blocs|E] within the [realm|E], which will support the [leading_house|E] in becoming $game_concept_kampaku$.\n\n$japan_government_domain_limit_help$\n\n#F The $japan_administrative_government$ system refers to the centralized administrative government of Japan, inspired by the Chinese Confucian bureaucracy.#!"
 japan_administrative_government_desc: "$LR_gradus_rank_japan_administrative_government$\n\n$japan_administrative_government_desc_body$"
