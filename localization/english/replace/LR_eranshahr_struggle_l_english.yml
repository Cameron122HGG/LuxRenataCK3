 catalyst_caliph_died_naturally:0 "The shah of [GetTitleByKey('e_persia').GetNameNoTier] died naturally"
 catalyst_caliph_died_naturally_desc:0 "The shah of [GetTitleByKey('e_persia').GetNameNoTier] dies naturally\n#WEAK ([EmptyScope.ScriptValue('catalyst_cooldown_between_significant_character_deaths_years_value')] year cooldown)#!"
 catalyst_caliph_died_violently:0 "The shah of [GetTitleByKey('e_persia').GetNameNoTier] died violently"
 catalyst_caliph_died_violently_desc:0 "The shah of [GetTitleByKey('e_persia').GetNameNoTier] dies violently\n#WEAK ([EmptyScope.ScriptValue('catalyst_cooldown_between_significant_character_deaths_years_value')] year cooldown)#!"
 catalyst_caliph_or_emperor_accepts_faction_demands:0 "The shah of [GetTitleByKey('e_persia').GetNameNoTier] accepted a [faction|E]'s demands"
 catalyst_caliph_or_emperor_accepts_faction_demands_desc:0 "The shah of [GetTitleByKey('e_persia').GetNameNoTier] accepts a [faction|E]'s demands"
 catalyst_caliph_or_emperor_loses_revolt_war:0 "The shah of [GetTitleByKey('e_persia').GetNameNoTier] lost a [civil_war|E]"
 catalyst_caliph_or_emperor_loses_revolt_war_desc:0 "The shah of [GetTitleByKey('e_persia').GetNameNoTier] loses a [civil_war|E]"
 catalyst_missing_caliphate_or_arabian_empire:0 "Yearly Drift: there is no shah of [GetTitleByKey('e_persia').GetNameNoTier]"
 catalyst_missing_caliphate_or_arabian_empire_desc:0 "Yearly Drift: there is no shah of [GetTitleByKey('e_persia').GetNameNoTier]"
