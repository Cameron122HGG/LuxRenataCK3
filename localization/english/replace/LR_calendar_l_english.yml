l_english:
 # Calendar years for the calendar_rule game rule (calendar_setting in common/script_values/LR_time_values.txt).
 # Game years are AD + 5000 (1 AD = 5001). Each era counts its year 1 from this game year:
 #   0 Anno Domini, from 1 AD: year 1 = 5001, labels A.D. / B.C.
 #   1 Era of Alexander, from his death in 323 BC: year 1 = 4678, labels A.A. / B.A.
 #   2 Seleukid era, from 312 BC: year 1 = 4689, labels S.E. / B.S.E.
 #   3 Ab Urbe Condita, from the founding of Rome in 753 BC: year 1 = 4248, labels A.U.C. / B.U.C.
 #   4 Era of the Martyrs (Coptic), from 284 AD: year 1 = 5284, labels A.M. / B.A.M.
 # Generated by calendar_years.py; to change an epoch, change every number for it below.
 # The engine's date formats; these replace the px-toolkit ones.
 GAME_DATE_STRING:0 "$DAY$ $MONTH$, $LR_CAL_YEAR$ $LR_CAL_ERA$"
 GAME_DATE_STRING_SHORT:0 "$DAY$ $MONTH_SHORT$ $LR_CAL_YEAR$ $LR_CAL_ERA$"
 GAME_DATE_STRING_LONG:0 "$DAY|O$ of $MONTH$, $LR_CAL_YEAR$ $LR_CAL_ERA$"
 # The year and era label for a $YEAR$ parameter
 LR_CAL_YEAR:0 "[Select_int32(EqualTo_int32('(int32)1', FixedPointToInt(EmptyScope.ScriptValue('calendar_setting'))), Select_int32(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)4678'), Subtract_int32('(int32)$YEAR|q$', '(int32)4677'), Subtract_int32('(int32)4678', '(int32)$YEAR|q$')), Select_int32(EqualTo_int32('(int32)2', FixedPointToInt(EmptyScope.ScriptValue('calendar_setting'))), Select_int32(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)4689'), Subtract_int32('(int32)$YEAR|q$', '(int32)4688'), Subtract_int32('(int32)4689', '(int32)$YEAR|q$')), Select_int32(EqualTo_int32('(int32)3', FixedPointToInt(EmptyScope.ScriptValue('calendar_setting'))), Select_int32(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)4248'), Subtract_int32('(int32)$YEAR|q$', '(int32)4247'), Subtract_int32('(int32)4248', '(int32)$YEAR|q$')), Select_int32(EqualTo_int32('(int32)4', FixedPointToInt(EmptyScope.ScriptValue('calendar_setting'))), Select_int32(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)5284'), Subtract_int32('(int32)$YEAR|q$', '(int32)5283'), Subtract_int32('(int32)5284', '(int32)$YEAR|q$')), Select_int32(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)5001'), Subtract_int32('(int32)$YEAR|q$', '(int32)5000'), Subtract_int32('(int32)5001', '(int32)$YEAR|q$'))))))]"
 LR_CAL_ERA:0 "[Localize(Select_CString(EqualTo_int32('(int32)1', FixedPointToInt(EmptyScope.ScriptValue('calendar_setting'))), Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)4678'), 'LR_CAL_AFTER_1', 'LR_CAL_BEFORE_1'), Select_CString(EqualTo_int32('(int32)2', FixedPointToInt(EmptyScope.ScriptValue('calendar_setting'))), Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)4689'), 'LR_CAL_AFTER_2', 'LR_CAL_BEFORE_2'), Select_CString(EqualTo_int32('(int32)3', FixedPointToInt(EmptyScope.ScriptValue('calendar_setting'))), Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)4248'), 'LR_CAL_AFTER_3', 'LR_CAL_BEFORE_3'), Select_CString(EqualTo_int32('(int32)4', FixedPointToInt(EmptyScope.ScriptValue('calendar_setting'))), Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)5284'), 'LR_CAL_AFTER_4', 'LR_CAL_BEFORE_4'), Select_CString(GreaterThanOrEqualTo_int32('(int32)$YEAR|q$', '(int32)5001'), 'LR_CAL_AFTER_0', 'LR_CAL_BEFORE_0'))))))]"
 # Era labels: after year 1 / before year 1
 LR_CAL_AFTER_0:0 "A.D."
 LR_CAL_BEFORE_0:0 "B.C."
 LR_CAL_AFTER_1:0 "A.A."
 LR_CAL_BEFORE_1:0 "B.A."
 LR_CAL_AFTER_2:0 "S.E."
 LR_CAL_BEFORE_2:0 "B.S.E."
 LR_CAL_AFTER_3:0 "A.U.C."
 LR_CAL_BEFORE_3:0 "B.U.C."
 LR_CAL_AFTER_4:0 "A.M."
 LR_CAL_BEFORE_4:0 "B.A.M."
