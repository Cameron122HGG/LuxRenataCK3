l_english:
 # LR 2026-11-25 Meritocratic provinces (tools/sinic_twins/build_meritocratic_provinces.py): Song names for Meritocratic's provinces
 meritocratic_province_standard: "@meritocratic_standard_administration! Fu" # Chinese fu, a superior prefecture of the Song
 meritocratic_province_standard_short: "@meritocratic_standard_administration! Fu"
 meritocratic_province_standard_desc: "#low A superior prefecture, run by a prefect who passed the examinations, who answers to the court for its registers, courts and granaries.#!"
 duke_meritocratic_province_standard_governor_male: "Zhifu" # Chinese zhifu, prefect of a fu, an examination graduate sent from the capital
 duke_meritocratic_province_standard_governor_female: "$duke_meritocratic_province_standard_governor_male$"
 duchy_meritocratic_province_standard_governor: "Fu" # Chinese fu, a superior prefecture of the Song
 king_meritocratic_province_standard_governor_male: "$duke_meritocratic_province_standard_governor_male$"
 king_meritocratic_province_standard_governor_female: "$duke_meritocratic_province_standard_governor_male$"
 kingdom_meritocratic_province_standard_governor: "$duchy_meritocratic_province_standard_governor$"
 meritocratic_province_industrial: "@meritocratic_industrial_administration! Jian" # Chinese jian, a Song state works district of mints, mines or salt pans
 meritocratic_province_industrial_short: "@meritocratic_industrial_administration! Jian"
 meritocratic_province_industrial_desc: "#low A district of state works, mints, mines and salt pans, whose director answers for every string of cash it sends to the treasury.#!"
 duke_meritocratic_province_industrial_governor_male: "Zhijian" # Chinese zhijian, director of a jian
 duke_meritocratic_province_industrial_governor_female: "$duke_meritocratic_province_industrial_governor_male$"
 duchy_meritocratic_province_industrial_governor: "Jian" # Chinese jian, a Song state works district of mints, mines or salt pans
 king_meritocratic_province_industrial_governor_male: "$duke_meritocratic_province_industrial_governor_male$"
 king_meritocratic_province_industrial_governor_female: "$duke_meritocratic_province_industrial_governor_male$"
 kingdom_meritocratic_province_industrial_governor: "$duchy_meritocratic_province_industrial_governor$"
 meritocratic_province_military: "@meritocratic_military_administration! Jun" # Chinese jun, a Song military prefecture
 meritocratic_province_military_short: "@meritocratic_military_administration! Jun"
 meritocratic_province_military_desc: "#low A military prefecture on a road or frontier, where a commander keeps the garrison and musters the levies.#!"
 duke_meritocratic_province_military_governor_male: "Zhijun" # Chinese zhijun, commander of a military prefecture
 duke_meritocratic_province_military_governor_female: "$duke_meritocratic_province_military_governor_male$"
 duchy_meritocratic_province_military_governor: "Jun" # Chinese jun, a Song military prefecture
 king_meritocratic_province_military_governor_male: "$duke_meritocratic_province_military_governor_male$"
 king_meritocratic_province_military_governor_female: "$duke_meritocratic_province_military_governor_male$"
 kingdom_meritocratic_province_military_governor: "$duchy_meritocratic_province_military_governor$"
