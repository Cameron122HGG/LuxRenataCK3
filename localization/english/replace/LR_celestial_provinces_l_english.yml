l_english:
 # LR 2026-11-25 Celestial provinces (tools/sinic_twins/build_celestial_provinces.py): Tang-Song names for Celestial's provinces
 celestial_province_standard: "@celestial_standard_administration! Dao" # Chinese dao, a circuit of the Tang
 celestial_province_standard_short: "@celestial_standard_administration! Dao"
 celestial_province_standard_desc: "#low A circuit of the empire, watched over by a surveillance commissioner who inspects its prefects in the Son of Heaven's name.#!"
 duke_celestial_province_standard_governor_male: "Guanchashi" # Chinese guanchashi, surveillance commissioner of a circuit
 duke_celestial_province_standard_governor_female: "$duke_celestial_province_standard_governor_male$"
 duchy_celestial_province_standard_governor: "Dao" # Chinese dao, a circuit of the Tang
 king_celestial_province_standard_governor_male: "$duke_celestial_province_standard_governor_male$"
 king_celestial_province_standard_governor_female: "$duke_celestial_province_standard_governor_male$"
 kingdom_celestial_province_standard_governor: "$duchy_celestial_province_standard_governor$"
 celestial_province_industrial: "@celestial_industrial_administration! Yantie" # Chinese yantie, the salt and iron monopoly
 celestial_province_industrial_short: "@celestial_industrial_administration! Yantie"
 celestial_province_industrial_desc: "#low A district of the salt and iron monopoly, whose commissioner fills the imperial treasury from the pans and furnaces.#!"
 duke_celestial_province_industrial_governor_male: "Yantieshi" # Chinese yantieshi, commissioner of salt and iron
 duke_celestial_province_industrial_governor_female: "$duke_celestial_province_industrial_governor_male$"
 duchy_celestial_province_industrial_governor: "Yantie" # Chinese yantie, the salt and iron monopoly
 king_celestial_province_industrial_governor_male: "$duke_celestial_province_industrial_governor_male$"
 king_celestial_province_industrial_governor_female: "$duke_celestial_province_industrial_governor_male$"
 kingdom_celestial_province_industrial_governor: "$duchy_celestial_province_industrial_governor$"
 celestial_province_metropolitan: "@celestial_metropolitan_administration! Du" # Chinese du, a secondary capital
 celestial_province_metropolitan_short: "@celestial_metropolitan_administration! Du"
 celestial_province_metropolitan_desc: "#low A great city of the empire, a second capital held for the throne by a regent while the court is away.#!"
 duke_celestial_province_metropolitan_governor_male: "Liushou" # Chinese liushou, regent of a secondary capital
 duke_celestial_province_metropolitan_governor_female: "$duke_celestial_province_metropolitan_governor_male$"
 duchy_celestial_province_metropolitan_governor: "Du" # Chinese du, a secondary capital
 king_celestial_province_metropolitan_governor_male: "$duke_celestial_province_metropolitan_governor_male$"
 king_celestial_province_metropolitan_governor_female: "$duke_celestial_province_metropolitan_governor_male$"
 kingdom_celestial_province_metropolitan_governor: "$duchy_celestial_province_metropolitan_governor$"
 celestial_province_military: "@celestial_military_administration! Junzhen" # Chinese junzhen, a garrison command of the Song
 celestial_province_military_short: "@celestial_military_administration! Junzhen"
 celestial_province_military_desc: "#low A garrison command, whose commander-in-chief keeps the imperial armies ready on the roads and rivers.#!"
 duke_celestial_province_military_governor_male: "Duzongguan" # Chinese duzongguan, commander-in-chief of a command
 duke_celestial_province_military_governor_female: "$duke_celestial_province_military_governor_male$"
 duchy_celestial_province_military_governor: "Junzhen" # Chinese junzhen, a garrison command of the Song
 king_celestial_province_military_governor_male: "$duke_celestial_province_military_governor_male$"
 king_celestial_province_military_governor_female: "$duke_celestial_province_military_governor_male$"
 kingdom_celestial_province_military_governor: "$duchy_celestial_province_military_governor$"
 celestial_province_protectorate: "@celestial_protectorate_administration! Da Duhufu" # Chinese da duhufu, a grand protectorate of the Tang
 celestial_province_protectorate_short: "@celestial_protectorate_administration! Da Duhufu"
 celestial_province_protectorate_desc: "#low A grand protectorate beyond the old borders, where a grand protector-general rules the tributary peoples in the emperor's name.#!"
 duke_celestial_province_protectorate_governor_male: "Da Duhu" # Chinese da duhu, grand protector-general
 duke_celestial_province_protectorate_governor_female: "$duke_celestial_province_protectorate_governor_male$"
 duchy_celestial_province_protectorate_governor: "Da Duhufu" # Chinese da duhufu, a grand protectorate of the Tang
 king_celestial_province_protectorate_governor_male: "$duke_celestial_province_protectorate_governor_male$"
 king_celestial_province_protectorate_governor_female: "$duke_celestial_province_protectorate_governor_male$"
