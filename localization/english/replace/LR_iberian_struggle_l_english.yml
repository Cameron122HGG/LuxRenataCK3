l_english:
 # Lux Renata: the Iberian struggle reskinned as the Council of Toledo. Overrides vanilla FP2 keys (replace folder).

 # The struggle and its phases (game concepts)
 game_concept_iberian_struggle:1 "Council of Toledo"
 game_concept_iberian_struggle_desc:2 "The $game_concept_iberian_struggle$ is the long contest for the vacant crown of Hispania. In 595 the Great Council of Toledo elected Reccared High King, so that the peninsula would answer to neither Rome nor Carthage. Since 910 the Council has been unable to meet.\n\nGothic, Suevic and Hispano-Roman kings of a dozen creeds, the Umayyads of Córdoba, and the Vandal and Alan lords of the south all claim to speak for Hispania. The [struggle|E] shifts between [struggle_phase_phases|E] of anathema and war, uneasy pacts and councils. There are few permanent allies: a shared [faith|E] counts for little when every king follows his own creed."
 game_concept_struggle_phase_iberia_opportunity:1 "Empty Throne"
 game_concept_struggle_phase_iberia_opportunity_desc:2 "With no High King and no Council, the kings of Hispania watch one another, and every claim, usurpation and slight is remembered.\n\nFresh abuses will tip the peninsula into the [struggle_phase_iberia_hostility|E]. Patient diplomacy can instead bring the kings to the [struggle_phase_iberia_conciliation|E]."
 game_concept_struggle_phase_iberia_hostility:1 "Wars of Anathema"
 game_concept_struggle_phase_iberia_hostility_desc:2 "The creeds of Hispania have declared one another heretics, and the kings make war in their names. Arian, Adoptionist, Roman and Martinian Christians fight each other as readily as they fight the Muslims of the south, while Rome and Carthage watch for an opening.\n\nSuch bloodshed cannot last forever. In time, exhaustion or wiser heads bring the peninsula to the [struggle_phase_iberia_compromise|E]."
 game_concept_struggle_phase_iberia_compromise:1 "Pact of Toledo"
 game_concept_struggle_phase_iberia_compromise_desc:2 "Worn down by the [struggle_phase_iberia_hostility|E], or drawn together by the [struggle_phase_iberia_conciliation|E], the kings of Hispania agree to respect each other's borders and creeds.\n\nIf the old quarrels return, the [struggle_phase_iberia_opportunity|E] awaits."
 game_concept_struggle_phase_iberia_conciliation:1 "Gathering of the Council"
 game_concept_struggle_phase_iberia_conciliation_desc:1 "Out of a lasting [struggle_phase_iberia_compromise|E], the kings, bishops and imams of Hispania begin to meet as a council once more. Rulers of different creeds sit together, as the Moorish king Mauregatus once did, and marriages across creeds are common.\n\nIt cannot last forever: broken trust will bring the [iberian_struggle|E] back to the [struggle_phase_iberia_compromise|E]."

 # Endings
 struggle_iberia_ending_hostility_decision:1 "Proclaim the One Creed"
 struggle_iberia_ending_hostility_decision_desc:0 "The Council will not meet again while heretics sit in it. Hispania will be one realm under one creed, the [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] creed of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], and its crown will pass by blood, not by vote."
 struggle_iberia_ending_hostility_decision_tooltip:0 "End the [iberian_struggle|E]"
 struggle_iberia_ending_compromise_decision:1 "The Kingdoms of Hispania"
 struggle_iberia_ending_compromise_decision_desc:0 "Hispania will have no High King. Let each kingdom keep its own crown and creed, [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] among them, and let the Pact of Toledo keep the peace between them."
 struggle_iberia_ending_conciliation_decision:1 "Reconvene the Great Council"
 struggle_iberia_ending_conciliation_decision_desc:0 "For the first time since 910, the Great Council of Toledo will meet. Kings, bishops and imams of every creed will elect a High King of Hispania, as their forebears elected Reccared in 595, and the crown will answer to neither Rome nor Carthage."
 LR_council_reconvened_tt:0 "The Great Council crowns you High King of [GetTitleByKey('e_spain').GetNameNoTier]. The other independent rulers of the Council become your [vassals|E], whatever their [faith|E], and a [feudal|E] crown becomes elective"

 # Rome: the foothold, for any empire beyond Hispania
 secure_iberian_foothold_decision_title:0 "Claim Hispania for the Empire"
 secure_iberian_foothold_decision_desc:0 "The kings of Hispania have bled each other white. As Rome once governed the peninsula, an empire beyond the mountains and the sea can take a Hispanic kingdom into its own lands and settle the Council's quarrel by force."
 secure_iberian_foothold_decision_tooltip:0 "Take a Hispanic kingdom into your empire"

 # Carthage: the Vandal Sea
 LR_vandal_sea_decision:0 "The Vandal Sea"
 LR_vandal_sea_decision_desc:0 "Carthage has looked across the strait since Genseric's day. The Vandals of Granada and Murcia are kin to our own, and the kings of Hispania are too divided to stop us. Let the lands on both shores answer to one crown."
 LR_vandal_sea_decision_tooltip:0 "Take the duchies of a Hispanic kingdom into your crown"
 LR_vandal_sea_decision_confirm:0 "Cross the Strait"
 LR_vandal_sea_decision_kingdom_tt:0 "Completely control a de jure [kingdom|E] of [GetTitleByKey('e_spain').GetNameNoTier]"

 # Convene the Council of Toledo: open to Mozarabic and Adoptionist rulers, run on the host's own rite
 council_of_toledo_decision_toledo_holder_trigger:0 "You [hold|E] or rule over the [GetTitleByKey('c_toledo').GetName], and its [ruler|E] follows your [rite|E]"
 fp2_other_decisions.0700.a:0 "It shall be a synod of our own rite."
 fp2_council_opinion_mozarabic_effect_tt:0 "Every attendee of your [rite|E]"
 fp2_council_opinion_other_effect_tt:0 "Every attendee of another [rite|E]"
 fp2_council_conversion_modifier_desc:0 "The last Council of Toledo encouraged the conversion of infidels in the realms of its rite."
 fp2_council_reform_modifier_desc:0 "The last Council of Toledo encouraged reform of its church given its new power."
 fp2_council_hof_modifier_desc:0 "The last Council of Toledo encouraged its church to appoint its own head of faith."
 fp2_council_pope_modifier_desc:0 "The last Council of Toledo encouraged cooperation between its church and the wider Christian world."
