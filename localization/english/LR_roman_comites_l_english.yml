 LR_roman_comes_male:0 "Comes"
 LR_roman_comes_female:0 "Comes"
 LR_roman_comes_modifier:0 "Roman Comes"
 LR_roman_comes_modifier_desc:0 "This character holds one of the great military commands of the Roman Empire, and the state bears much of the cost of its troops."
 LR_roman_comes_appointment_succession_law:0 "Comes Appointment"
 LR_roman_comes_appointment_succession_law_subname:0 "$meritocratic_military_appointment_succession_law_subname$"
 LR_roman_comes_appointment_succession_law_effects:0 "\nA type of [appointment_succession_law|E] used only by the Roman comites. Under $LR_roman_comes_appointment_succession_law$, the command passes to the candidate the emperor favours, not to the comes' family."
 LR_appoint_roman_comes_decision:0 "Appoint a Comes"
 LR_appoint_roman_comes_decision_desc:0 "Above the frontier duces stand the comites rei militaris: counts of the empire who hold its great regional commands, some on the frontier with their limitanei, others at the head of a field army. A comes holds no land of their own, and when they fall the command passes to whoever the emperor names."
 LR_appoint_roman_comes_decision_tooltip:0 "Create one of the great regional commands of a diocese and appoint a comes to it."
 LR_appoint_roman_comes_decision_confirm:0 "Appoint the Comes"
 LR_appoint_roman_comes_decision_trigger_1:0 "A diocese in your realm has a comital command that has not been filled"
 LR_appoint_roman_comes_decision_effect_tt:0 "The chosen command is created and given to the best available commander in your court or among your vassals and their courts, who becomes your landless vassal. A comes holds a Command with two regiments (limitanei on the frontier, comitatenses in the field), passed on by [appointment_succession_law|E]."
 LR_CHOOSE_COMES_BUTTON:0 "Choose Command"
