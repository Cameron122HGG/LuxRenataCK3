 roman_bureaucracy_1:0 "Diocesan Administration"
 roman_bureaucracy_1_effects:0 "$celestial_bureaucracy_1_effects$"
 roman_bureaucracy_1_effects_not_in_prev:0 "$celestial_bureaucracy_1_effects_not_in_prev$"
 roman_bureaucracy_2:0 "Praetorian Prefectures"
 roman_bureaucracy_2_effects:0 "$celestial_bureaucracy_2_effects$"
 roman_bureaucracy_2_effects_not_in_prev:0 "$celestial_bureaucracy_2_effects_not_in_prev$"
 roman_bureaucracy_3:0 "The Dominate"
 roman_bureaucracy_3_effects:0 "$celestial_bureaucracy_3_effects$"
 LR_ROMAN_BUREAUCRACY_IS_ON_COOLDOWN:0 "You recently changed your Imperial Administration. Can be changed again after [GetCurrentDateWithDiff( GetVarTimeRemaining( CHARACTER.MakeScope, 'imperial_bureaucracy_cooldown') )]"

 # Roman appointment succession
 LR_roman_civic_appointment_succession_law:0 "Imperial Appointment"
 LR_roman_civic_appointment_succession_law_subname:0 "$meritocratic_appointment_succession_law_subname$"
 LR_roman_civic_appointment_succession_law_effects:0 "\nA type of [appointment_succession_law|E]. Under $LR_roman_civic_appointment_succession_law$, the emperor names a new governor when the [title|E] falls vacant, and its [holdings|E] pass to the candidate with the highest [candidate_score|E]. Roman citizens and members of the imperial consistory are favored over those who merely share the late governor's blood.\n\n"
 LR_roman_military_appointment_succession_law:0 "Imperial Military Appointment"
 LR_roman_military_appointment_succession_law_subname:0 "$meritocratic_military_appointment_succession_law_subname$"
 LR_roman_military_appointment_succession_law_effects:0 "\nA type of [appointment_succession_law|E]. Under $LR_roman_military_appointment_succession_law$, the [title|E] and its [holdings|E] pass to the candidate with the highest [candidate_score|E]. Commanders with a good [martial_skill|E] and [commander_traits|E] are favored, as are Roman citizens and members of the imperial consistory.\n\n"
 LR_roman_appointment_citizen:0 "Roman citizen"
 LR_roman_appointment_consistory:0 "Member of the imperial consistory"

 # Roman imperial ministries
 LR_magister_officiorum:0 "Master of Offices"
 LR_magister_officiorum_possessive:0 "Master of Offices'"
 LR_magister_officiorum_modifier:0 "Liege's Master of Offices"
 LR_magister_officiorum_desc:0 "The $LR_magister_officiorum$ heads the palace bureaus, the imperial couriers and the reception of foreign embassies, and decides who rises in the emperor's service."
 LR_magister_memoriae:0 "Magister Memoriae"
 LR_magister_memoriae_possessive:0 "Magister Memoriae's"
 LR_magister_memoriae_modifier:0 "Liege's Magister Memoriae"
 LR_magister_memoriae_desc:0 "The $LR_magister_memoriae$ heads the bureau that drafts the emperor\'s rescripts and answers petitions, and so gives the emperor\'s rule the force of law."
 LR_praefectus_urbi:0 "Urban Prefect"
 LR_praefectus_urbi_possessive:0 "Urban Prefect's"
 LR_praefectus_urbi_modifier:0 "Liege's Urban Prefect"
 LR_praefectus_urbi_desc:0 "The $LR_praefectus_urbi$ governs the imperial capital, keeping its walls, aqueducts, granaries and great works in order."
 LR_magister_militum:0 "Master of Soldiers"
 LR_magister_militum_possessive:0 "Master of Soldiers'"
 LR_magister_militum_modifier:0 "Liege's Master of Soldiers"
 LR_magister_militum_desc:0 "The $LR_magister_militum$ commands the field armies that march with the emperor."

