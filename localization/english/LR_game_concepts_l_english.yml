l_english:
#RANKS/TIERS
 game_concept_barony: "Barony"
 game_concept_baronies: "Baronies"
 game_concept_barons: "Barons"
 game_concept_baron: "Baron"
 game_concept_barony_desc: "A $game_concept_barony$ is a [title|E] of the lowest [title_tier|E].\n\n$game_concept_baronies$ have the smallest footprint on the map, organized into larger [counties|E].\n\n$game_concept_barony$ $game_concept_titles$ must always have a [holder|E] if they contain a [holding|E]."
 game_concept_baron_desc: "A $game_concept_baron$ is a [ruler|E] whose [primary_title|E] is a [barony|E].\n\nTheir [rank|E] is the lowest possible, directly below [counts|E]. As such, they cannot have [vassals|E] and any non-$game_concept_baron$ can be their [liege|E]."

 game_concept_county: "County"
 game_concept_counties: "Counties"
 game_concept_count: "Count"
 game_concept_counts: "Counts"
 game_concept_county_desc: "A $game_concept_county$ is a [title|E] one [title_tier|E] below a [duchy|E] and one above a [barony|E].\n\nThe $game_concept_title$ includes the [county_capital|E] in the $game_concept_county$, as well as [de_jure|E] rights to all the [baronies|E] in the $game_concept_county$.\n\n$game_concept_counties$ always have [holders|E] because $game_concept_county_capitals$ cannot be destroyed."
 game_concept_count_desc: "A $game_concept_count$ is a [ruler|E] whose [primary_title|E] is a [county|E].\n\nTheir [rank|E] is only above [barons|E] and directly below [dukes|E], and as such they can have $game_concept_barons$ as [vassals|E], and a $game_concept_duke$ or above as their [liege|E]."

 game_concept_duchy: "Province"
 game_concept_duchies: "Provinces"
 game_concept_duke: "Duke"
 game_concept_dukes: "Dukes"
 game_concept_duchy_desc: "A $game_concept_duchy$ is a [title|E] one [title_tier|E] below a [kingdom|E] and one above a [county|E].\n\nThe [holder|E] of a $game_concept_duchy$ has [de_jure|E] rights to its constituent $game_concept_counties$ and can have [counts|E] as [vassals|E].\n\nDuchies may be dormant and have no current Holder. Such $game_concept_title_succession$ can be created by a [ruler|E] who controls at least half of its $game_concept_counties$."
 game_concept_duke_desc: "A $game_concept_duke$ is a [ruler|E] whose [primary_title|E] is a [duchy|E].\n\nTheir [rank|E] is directly above [counts|E] and directly below [kings|E], and as such they can have $game_concept_counts$ as [vassals|E], and a $game_concept_king$ or above as their [liege|E]."

 game_concept_kingdom: "Kingdom"
 game_concept_kingdoms: "Kingdoms"
 game_concept_king: "King"
 game_concept_kings: "Kings"
 game_concept_kingdom_desc: "A $game_concept_kingdom$ is a [title|E] one [title_tier|E] below a [empire|E] and one above a [duchy|E].\n\nThe [holder|E] of a $game_concept_kingdom$ has [de_jure|E] rights to its constituent territory.\n\n$game_concept_kingdoms$ may be dormant and have no current $game_concept_holder$. Such $game_concept_titles$ can be created by a [ruler|E] who controls at least half of the [counties|E] within."
 game_concept_king_desc: "A $game_concept_king$ is a [ruler|E] whose [primary_title|E] is a [kingdom|E].\n\nTheir [rank|E] is directly above [dukes|E] and directly below [emperors|E], and as such they can have $game_concept_dukes$ and below as [vassals|E], and an $game_concept_emperor$ or above as their [liege|E]."

 game_concept_empire: "Great Kingdom"
 game_concept_empires: "Great Kingdoms"
 game_concept_emperor: "Great King"
 game_concept_emperors: "Great Kings"
 game_concept_empire_desc: "An $game_concept_empire$ is a [title|E] one [title_tier|E] below a [hegemony|E] and one above a [kingdom|E].\n\nThe [holder|E] of an Empire has [de_jure|E] rights to its constituent territory and can have [kings|E] as [vassals|E].\n\n$game_concept_empires$ can be dormant and have no current $game_concept_holder$. Such $game_concept_titles$ can be created by a [ruler|E] who controls more than 80% of the [counties|E] within."
 game_concept_emperor_desc: "An $game_concept_emperor$ is a [ruler|E] whose [primary_title|E] is an [empire|E].\n\nTheir [rank|E] is directly above [kings|E] and directly below [hegemons|E], and as such they can have $game_concept_kings$ and below as [vassals|E], and only a $game_concept_hegemon$ as their [liege|E]."

 game_concept_hegemony: "Empire"
 game_concept_hegemonies: "Empires"
 game_concept_hegemon: "Emperor"
 game_concept_hegemons: "Emperors"
 game_concept_hegemony_desc: "A $game_concept_hegemony$ is a [title|E] of the highest [title_tier|E].\n\nThe [holder|E] of a $game_concept_hegemony$ has [de_jure|E] rights to its constituent territory and can have [emperors|E] as [vassals|E]."
 game_concept_hegemon_desc: "A $game_concept_hegemon$ is a [ruler|E] whose [primary_title|E] is a [hegemony|E].\n\nTheir [rank|E] is the highest possible, directly above [emperors|E]. As such, they can have any non-$game_concept_hegemons$ as their [vassals|E], and they can never have a [liege|E]."

#Government types and concepts
 game_concept_classical: "Classical"
 game_concept_classical_government: "Classical Monarchy"
 game_concept_classical_i: "@government_type_classical! $classical$"
 game_concept_classical_desc: "Classical is a [government_form|E] in which the amount of [levies|E] and [taxes|E] given to a [liege|E] by their [vassals|E] is determined by the [aptitude|E] of said Liege's [tax_collector|E]."  
 
 game_concept_roman_administrative: "Roman Administrative"
 game_concept_roman_administrative_government: "Roman Administrative Monarchy"
 game_concept_roman_administrative_i: "@government_type_roman_administrative! $roman_administrative_government$"
 #game_concept_roman_administrative_desc: "A form of government inspired by the Roman and Hellenistic traditions, emphasizing enlightened monarchy, developed administration, and the Graeco-Roman legal system."
 game_concept_roman_administrative_desc: "$game_concept_roman_administrative$ is a [government_bureaucratic_type|E] [government_form|E] that appoints [characters|E] as [governors|E], to manage and preside over land, called [provinces|E], on behalf of their [liege|E].\n\n$game_concept_administrative$ Characters have access to [influence|E] and some also have a personal [family_estate|E].\n\nOnly [independent|E] [rulers|E] of an $game_concept_administrative$ [realm|E] have [legitimacy|E], while [vassals|E] do not.\n\n$admin_cannot_declare_internal_wars$\n\nImportant aspect of this form of government is management of Land Ownership through governor contract.\nHigh State Land Ownership lowers provincial treasury, increasing the revenue of the Central Government but decreasing the amount of funds available to the province. \nIt also increases salary of the governor, strengthening them in the process, thus it is important to take all factors into consideration, to keep political and financial balance."
 game_concept_roman_administrative_government_desc: "The Roman Administrative Monarchy is a form of government inspired by the Roman and Hellenistic political models. It emphasizes enlightened rule by the monarch, with a well-developed administrative system that maintains the Graeco-Roman legal framework. This government type allows for efficient governance, urban development, and strong military organization, reflecting the principles of classical administration."

 game_concept_alexandrian_administrative: "Alexandrian Administrative"
 game_concept_alexandrian_administrative_government: "Alexandrian Administrative Monarchy"
 game_concept_alexandrian_administrative_i: "@government_type_alexandrian_administrative! $alexandrian_administrative_government$"
 game_concept_alexandrian_administrative_desc: "$game_concept_alexandrian_administrative$ is a [government_bureaucratic_type|E] [government_form|E] that appoints [characters|E] as [governors|E], to manage and preside over land, called [provinces|E], on behalf of their [liege|E].\n\n$game_concept_administrative$ Characters have access to [influence|E] and some also have a personal [family_estate|E].\n\nOnly [independent|E] [rulers|E] of an $game_concept_administrative$ [realm|E] have [legitimacy|E], while [vassals|E] do not.\n\n$admin_cannot_declare_internal_wars$\n\nImportant aspect of this form of government is management of Land Ownership through governor contract.\nHigh State Land Ownership lowers provincial treasury, increasing the revenue of the Central Government but decreasing the amount of funds available to the province. \nIt also increases salary of the governor, strengthening them in the process, thus it is important to take all factors into consideration, to keep political and financial balance."
 game_concept_alexandrian_administrative_government_desc: "The Alexandrian Administrative Monarchy is a form of government inspired by the Hellenistic Successor Kingdoms left in the wake of Alexander the Great's Empire. It emphasizes strong rule by the monarch, with a well-developed administrative system taking inspirations from both Greek and Near Eastern World. This government type allows for efficient governance, urban development, and strong military organization, reflecting the principles of Enlightened Monarchy."

 game_concept_despotic: "Despotic"
 game_concept_despotic_government: "Despotism"
 game_concept_despotic_i: "@government_type_despotic! $despotic_government$!"
 game_concept_despotic_desc: "Despotism is the ancient form of government of the fertile crescent in which a single individual formally wields all the power and authority embodying the state. This practice of power rooted in ancient history grants more power to the ruler, but is not well-accepted by populations and rulers from other civilizations as well as tribes. This government grants easier access to advanced administration and vice-royalties, larger demesne and has no limit on the number of vassals following one of the ancient Persian, Archaic or Mandaean cults. However, this government tends to be rejecte by rulers of other religions, who will resent being part of this state. Oriental despots still practice the looting of neighboring realms to enrich the despot abroad." 

 game_concept_despotic_administrative: "Persianate Administrative"
 game_concept_persianate_administrative_government: "Persianate Administrative Monarchy"
 game_concept_despotic_administrative_i: "@government_type_despotic_administrative! $persianate_administrative_government$"
 game_concept_despotic_administrative_desc: "$game_concept_despotic_administrative$ is a [government_bureaucratic_type|E] [government_form|E] that appoints [characters|E] as [governors|E], to manage and preside over land, called [provinces|E], on behalf of their [liege|E].\n\n$game_concept_administrative$ Characters have access to [influence|E] and some also have a personal [family_estate|E].\n\nOnly [independent|E] [rulers|E] of an $game_concept_administrative$ [realm|E] have [legitimacy|E], while [vassals|E] do not.\n\n$admin_cannot_declare_internal_wars$\n\nImportant aspect of this form of government is management of Land Ownership through governor contract.\nHigh State Land Ownership lowers provincial treasury, increasing the revenue of the Central Government but decreasing the amount of funds available to the province. \nIt also increases salary of the governor, strengthening them in the process, thus it is important to take all factors into consideration, to keep political and financial balance."
 game_concept_persianate_administrative_government_desc: "The Persianate Administrative Monarchy is a form of government maintaining principles of ancient states. It emphasizes strong rule by the monarch, with a well-developed administrative system that prevail despite the passage of time, while sharing similarities with Diadochi states. This government type allows for efficient governance, urban development, and strong military organization, all in the name of the 'King of Kings'."

#Cultural and religious concepts
 game_concept_western_roman: "Western Roman"
 game_concept_western_romans: "Western Romans"
 game_concept_western_roman_desc: "The Western Roman heritage group is the Latin heir to the ancient Roman civilization that once ruled much of Europe, North Africa, and the Middle East. Time has passed, and the Western Roman Empire has long been split from the East and greatly weakened, but its legacy endures in the languages, laws, and customs of its descendants. Western Romans are known for their strong sense of civic duty, their love of order and discipline, and their appreciation for the arts and architecture. They are also renowned for their military prowess, having inherited the tactics and strategies of their Roman ancestors. In the medieval world, Western Romans often find themselves at odds with other cultures, particularly the Germanic tribes that have settled in former Roman territories."
 game_concept_western_empire: "The Western Empire"
 game_concept_western_empire_desc: "The long history of the Western Roman Empire has left a conception amongst the people in the lands it once ruled that even if the empire has fallen, it can be restored. The idea of the Western Empire as a unifying political entity has persisted through the centuries, inspiring various rulers and factions to attempt to revive its glory. This concept is often associated with a sense of nostalgia for the past and a desire to reclaim the cultural and political heritage of ancient Rome. In the medieval period, the notion of the Western Empire continues to influence political ambitions and alliances, as various powers vie for dominance in the fragmented landscape of post-Roman Europe."
 
 game_concept_macedonian: "Macedonian"
 game_concept_macedonian_desc: "The Macedonian heritage group traces its origins to the ancient kingdom of Macedon, which rose to prominence under the leadership of Philip II and his son Alexander the Great. Macedonians are known for their martial traditions, their strategic acumen, and their ability to adapt and integrate diverse cultures into their own. The legacy of Alexander's conquests has left a lasting impact on the Macedonian identity, fostering a sense of pride in their historical role as conquerors and cultural disseminators. In the medieval period, Macedonians often find themselves navigating the complex political landscape of the Balkans, balancing their Hellenistic heritage with the influences of neighboring Slavic and Byzantine cultures."
 game_concept_macedonians: "Macedonians"

 game_concept_egyptian: "Egyptian"
 game_concept_egyptian_desc: "The Egyptian heritage group is the descendant of the ancient civilization that flourished along the Nile River for millennia. Egyptians are known for their deep connection to their land, their rich cultural traditions, and their contributions to art, architecture, and learning. The legacy of the pharaohs and the enduring influence of ancient Egyptian religion and customs continue to shape the identity of the Egyptian people. In the medieval world, Egyptians often find themselves at the crossroads of trade and cultural exchange, interacting with a diverse array of peoples from the Mediterranean, Africa, and the Middle East."
 game_concept_egyptians: "Egyptians"
 
 game_concept_mainstream: "Mainstream"
 game_concept_mainstream_desc: "The Mainstream religious group represents the dominant faith tradition within a given region or culture. Adherents of the Mainstream religion often hold significant social, political, and cultural influence, shaping the norms and values of their communities. This religious group is characterized by its widespread acceptance and institutional presence, often serving as the foundation for societal cohesion and identity. In the medieval period, Mainstream religions play a crucial role in governance, education, and community life, with rulers frequently aligning themselves with the dominant faith to legitimize their authority."
 
 game_concept_statist: "Statist"
 game_concept_statist_desc: "The Statist religious group emphasizes the central role of the state in religious affairs, often advocating for a close relationship between religious institutions and governmental authority. Adherents of the Statist faith tradition believe that the state should play a significant role in regulating religious practices, promoting social order, and ensuring the welfare of its citizens. This religious group is characterized by its support for strong centralized governance and its emphasis on the collective good over individual spiritual pursuits. In the medieval period, Statist religions often align closely with ruling powers, influencing policy and societal norms to reflect their values."

 game_concept_graeco_roman: "Graeco-Roman"
 game_concept_graeco_roman_desc: "The Graeco-Roman religious group represents the syncretic blend of Greek and Roman religious traditions that emerged during antiquity. Adherents of the Graeco-Roman faith honor a pantheon of gods and goddesses, each embodying various aspects of life, nature, and human experience. This religious group is characterized by its rich mythology, elaborate rituals, and emphasis on civic participation in religious festivals and ceremonies. In the medieval period, Graeco-Roman religions continue to influence cultural practices and artistic expressions, serving as a bridge between ancient traditions and contemporary beliefs."
 game_concept_graeco_romans: "Graeco-Romans"
 game_concept_greco_roman: "Graeco-Roman"
 game_concept_greco_romans: "Graeco-Romans"


 game_concept_decayed_principate_government: "Principate"
 game_concept_decayed_principate_government_desc: "The Principate is a highly centralized form of government where power primarily resides within the capital. Birthright, while still important, is not as prominent as in a warlord realm. With enough skill and ambition, anyone, even from the most humble of origins, may rise to become an influential governor or make a play for the throne and become emperor."
 game_concept_decayed_principate: "Principate"
 game_concept_decayed_principate_desc: "The Principate is a highly centralized form of government where power primarily resides within the capital. Birthright, while still important, is not as prominent as in a warlord realm. With enough skill and ambition, anyone, even from the most humble of origins, may rise to become an influential governor or make a play for the throne and become emperor."

 game_concept_roman_autocratic_government: "Roman Autocratic"
 game_concept_roman_autocratic_government_desc: "The Roman Imperial government is a highly centralized form of government that draws inspiration from the political structures of the Roman Empire. In this system, power is concentrated in the hands of a single ruler, often referred to as the emperor, who exercises authority over a vast and diverse realm. The Roman Imperial government is characterized by its complex bureaucracy, extensive administrative apparatus, and reliance on a network of governors and officials to manage the affairs of the state. This form of government emphasizes strong central control, efficient administration, and the maintenance of order and stability across the empire."
 game_concept_roman_autocratic: "Roman Imperial"
 game_concept_roman_autocratic_desc: "The Roman Imperial government is a highly centralized form of government that draws inspiration from the political structures of the Roman Empire. In this system, power is concentrated in the hands of a single ruler, often referred to as the emperor, who exercises authority over a vast and diverse realm. The Roman Imperial government is characterized by its complex bureaucracy, extensive administrative apparatus, and reliance on a network of governors and officials to manage the affairs of the state. This form of government emphasizes strong central control, efficient administration, and the maintenance of order and stability across the empire."
 game_concept_roman_autocratic_i: "@government_type_roman_autocratic! $roman_autocratic_government$"
 
 game_concept_decayed_principate_i: "@government_type_decayed_principate! $decayed_principate_government$"

 game_concept_despotic_imperial: "Persian Imperial"
 game_concept_despotic_imperial_desc: "The Persian Imperial government is a unique form of governance that combines the grandeur and pageantry of a ceremonial monarchy with the administrative structure of an empire. It is characterized by a strong emphasis on tradition, ritual, and the display of power, while also maintaining a complex bureaucracy to manage the affairs of the state. This government type often features a powerful monarch who serves as the symbolic head of state, while real political power may be held by advisors, ministers, or a council. The Imperial Ceremonial government is often associated with opulence, elaborate ceremonies, and a focus on maintaining the legitimacy and prestige of the ruling dynasty."

 game_concept_high_tribal: "High Tribal"
 game_concept_high_tribal_desc: "High Tribal is a [government_form|E] in which the amount of [levies|E] and [taxes|E] given to a [liege|E] by their [vassals|E] is determined by the [aptitude|E] of said Liege's [war_leader|E]."
 game_concept_high_tribal_government: "High Tribal"
 game_concept_high_tribal_i: "@government_type_high_tribal! $high_tribal_government$"
 game_concept_entrenched: "Entrenched"
 game_concept_entrenched_desc: "Entrenched is the most strict form of regency"




 game_concept_stationed_peasant_militia: "Stationed Peasant Militia"
 game_concept_stationed_peasant_militias: "Stationed Peasant Militias"
 game_concept_stationed_peasant_militia_desc: "Stationed Peasant Militias are [men_at_arms|E] who are armed with pitchforks and spears.\n\nWhile each kind of Militia is unique, they generally [counter|E] [heavy_cavalry|E] and [light_cavalry|E], and are in turn Countered by [heavy_infantry|E].\n\nPeasant Militias are strong in mountainous and fertile [terrain|E]."

 game_concept_holding:0 "Holding"
 game_concept_holdings:0 "Holdings"
 game_concept_holding_desc:0 "A $game_concept_holding$ is the central settlement of a [barony|E] or [county_capital|E].\n\nIt provides [taxes|E] and [levies|E] to its [holder|E], depending on its [holding_type|E]. The collection of Holdings personally owned by a [ruler|E] is called a [domain|E]."
 game_concept_holding_type:0 "Holding Type"
 game_concept_holding_types:0 "Holding Types"
 game_concept_holding_type_desc:2 "There are four types of [holdings|E]: [castles|E], [cities|E], [tribes|E], and [temples|E]. Each type allows different types of [buildings|E]. A [ruler|E]'s [government_form|E] determines which types of Holding the Ruler can personally own without penalty. In the case of Temples, the [doctrines|E] of their [faith|E] may also play a role."
 game_concept_castle_holding:0 "City Holding"
 game_concept_castle:0 "City"
 game_concept_castles:0 "Cities"
 game_concept_castle_holdings:0 "City Holdings"
 game_concept_castle_holding_desc:0 "Castles are the most heavily fortified [holding_type|E] and the standard type for [feudal|E], [clan|E] and [tribal|E] [rulers|E], as well as [holy_orders|E]. They tend to provide more [levies|E] than [taxes|E]."
 game_concept_temple_holding:0 "Temple Holding"
 game_concept_temple:0 "Temple"
 game_concept_temples:0 "Temples"
 game_concept_temple_holdings:0 "Temple Holdings"
 game_concept_temple_holding_desc:0 "Temples are a [holding_type|E] that can be held by members of the [clergy|E] as [church_property|E] (the [theocratic|E] [government_form|E]). However, in [faiths|E] with the [GetFaithDoctrine('doctrine_theocracy_lay_clergy').GetBaseName] [doctrine|E], anyone can hold Temples without penalty.\n\nTemples provide a fairly even mix of [levies|E] and [taxes|E]."
 game_concept_city_holding:0 "Town Holding"
 game_concept_city:0 "Town"
 game_concept_cities:0 "Towns"
 game_concept_city_holdings:0 "Town Holdings"
 game_concept_tribal_holding:0 "Tribal Holding"
 game_concept_tribal_holdings:0 "Tribal Holdings"
 game_concept_tribal_holding_desc:0 "Tribes are poor in [taxes|E] but rich in [levies|E], [prestige|E], and [men_at_arms|E] upgrades. They have limited upgrade potential and, while strong early, quickly dwindle in power the longer time progresses. Only [tribal|E] characters can hold them without penalties.\n\nIf a Tribe exists in a [county|E], no other [holdings|E] can be built. [feudal|E] rulers will have to spend [gold|E] to transform Tribes into [castles|E]."


 game_concept_iqta:0 "Iqta"
 game_concept_iqtas: "Iqtas"
 game_concept_iqta_government:0 "Iqta Government"
 game_concept_iqta_i: "@government_type_clan! $iqta_government$"
 game_concept_iqta_desc:1 "Iqtas are a [government_form|E] in which the amount of [levies|E] and [taxes|E] given to a [liege|E] by their [vassals|E] is determined by the [aptitude|E] of said Liege's [tax_collector|E]. Iqtas also make use of [house_unity|E]."

 game_concept_western_feudal:0 "Dynastic"
 game_concept_western_feudal_government:0 "Carolingian Feudal Government"
 game_concept_western_feudalism:0 "Dynastic"
 game_concept_western_feudal_i: "@government_type_feudal! $western_feudal_government$"
 game_concept_western_feudal_desc:0 "Under the Western Feudal [government_form|E], a [liege|E] gives their [vassals|E] [land|E] to govern in exchange for [levies|E] and [taxes|E], regulated by individual [vassal_contract|E] between Vassal and Liege."

game_concept_indic_feudal: "Indic"
 game_concept_indic_feudal_government: "Indic Feudal"
 game_concept_indic_feudal_i: "@government_type_despotic! $indic_feudal_government$!"
 game_concept_indic_feudal_desc: "Indic is the ancient form of government of the fertile crescent in which a single individual formally wields all the power and authority embodying the state. This practice of power rooted in ancient history grants more power to the ruler, but is not well-accepted by populations and rulers from other civilizations as well as tribes. This government grants easier access to advanced administration and vice-royalties, larger demesne and has no limit on the number of vassals following one of the ancient Persian, Archaic or Mandaean cults. However, this government tends to be rejecte by rulers of other religions, who will resent being part of this state. Oriental despots still practice the looting of neighboring realms to enrich the despot abroad." 

 game_concept_gupta_administrative: "Persianate Administrative"
 game_concept_gupta_administrative_government: "Persianate Administrative Monarchy"
 game_concept_gupta_administrative_i: "@government_type_despotic_administrative! $gupta_administrative_government$"
 game_concept_gupta_administrative_desc: "$game_concept_gupta_administrative$ is a [government_bureaucratic_type|E] [government_form|E] that appoints [characters|E] as [governors|E], to manage and preside over land, called [provinces|E], on behalf of their [liege|E].\n\n$game_concept_administrative$ Characters have access to [influence|E] and some also have a personal [family_estate|E].\n\nOnly [independent|E] [rulers|E] of an $game_concept_administrative$ [realm|E] have [legitimacy|E], while [vassals|E] do not.\n\n$admin_cannot_declare_internal_wars$\n\nImportant aspect of this form of government is management of Land Ownership through governor contract.\nHigh State Land Ownership lowers provincial treasury, increasing the revenue of the Central Government but decreasing the amount of funds available to the province. \nIt also increases salary of the governor, strengthening them in the process, thus it is important to take all factors into consideration, to keep political and financial balance."
 game_concept_gupta_administrative_government_desc: "The Persianate Administrative Monarchy is a form of government maintaining principles of ancient states. It emphasizes strong rule by the monarch, with a well-developed administrative system that prevail despite the passage of time, while sharing similarities with Diadochi states. This government type allows for efficient governance, urban development, and strong military organization, all in the name of the 'King of Kings'."