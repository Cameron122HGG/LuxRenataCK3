l_english:
 LR_quaestor_court_position:0 "Quaestor of the Sacred Palace"
 LR_quaestor_court_position_desc:0 "The $LR_quaestor_court_position$ is the voice of imperial law, drafting the emperor's edicts and answering petitions in their name. A learned Quaestor lends the throne moral and legal authority across the realm."
 LR_palatine_magister_court_position:0 "Magister of the Palatine School"
 LR_palatine_magister_court_position_desc:0 "The $LR_palatine_magister_court_position$ oversees the education of the imperial heirs and the young officials of the palace, shaping the next generation of Roman administrators."
 LR_comes_excubitorum_court_position:0 "Count of the Excubitors"
 LR_comes_excubitorum_court_position_desc:0 "Commander of the palace guard, the $LR_comes_excubitorum_court_position$ stands between the emperor and every blade raised against the purple."
 LR_siphonarios_court_position:0 "Master of the Siphons"
 LR_siphonarios_court_position_desc:0 "Keeper of the secret of the liquid fire, the $LR_siphonarios_court_position$ oversees the siphons and fire-ships that guard the empire's walls and fleets."
