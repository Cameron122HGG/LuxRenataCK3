 # Patron Gods tab of the faith window (gui/LR_faith_patrons.gui) (TEMP)
 LR_FAITH_PATRONS:0 "Patron Gods"
 LR_PATRON_CURRENT:0 "Your patron:"
 LR_PATRON_NONE:0 "None"
 LR_PATRON_OTHER_FAITH:0 "Only followers of this faith may choose its patrons"
 LR_PATRON_CHOOSE:0 "Choose"
 LR_PATRON_IS_CURRENT:0 "Your patron"
 LR_PATRON_LORE_SHOW_TT:0 "Show lore"
 LR_PATRON_LORE_HIDE_TT:0 "Hide lore"
 LR_PATRON_FAITH_PANEL:0 "Primary Pantheon"
 LR_PATRON_FAITH_PANEL_DESC:0 "The gods of the whole faith, honoured by every rite"
 LR_PATRON_RITE_PANEL:0 "Gods of [GetPlayer.GetRite.GetNameNoTooltip]"
 LR_PATRON_RITE_PANEL_DESC:0 "Only followers of your rite may choose these"
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_celtic_deity_01_icon:0 "$patron_god_celtic_deity_01$"
 patron_god_celtic_deity_01_desc:0 "The many-skilled god honoured in Lugdunum and beyond, master of every art. Feasts in his name bring the people together, and his followers carry their cares lightly."
 patron_god_celtic_deity_02_icon:0 "$patron_god_celtic_deity_02$"
 patron_god_celtic_deity_02_desc:0 "Lord of the sea and keeper of hidden knowledge, who drives his chariot over the waves as if they were a plain. Those he favours cross the water with ease."
 patron_god_celtic_deity_03_icon:0 "$patron_god_celtic_deity_03$"
 patron_god_celtic_deity_03_desc:0 "The bright healer whose sacred springs cure the sick. His fires burn at Beltane, and his warriors fight hard for the faith."
 patron_god_celtic_deity_04_icon:0 "$patron_god_celtic_deity_04$"
 patron_god_celtic_deity_04_desc:0 "God of the people and protector of the tribe, honoured by every clan. Kinsmen stand together under his eye, and his followers keep their own counsel."
 patron_god_celtic_deity_05_icon:0 "$patron_god_celtic_deity_05$"
 patron_god_celtic_deity_05_desc:0 "The antlered lord of beasts, pictured with coins spilling from his lap. He rewards rulers who keep faith with their people, and their treasuries grow."
 patron_god_celtic_deity_06_icon:0 "$patron_god_celtic_deity_06$"
 patron_god_celtic_deity_06_desc:0 "Exalted goddess of hearth, poetry and the end of winter, whose feast brings the first milk of spring. She blesses mothers and keeps her people warm through the cold."
 patron_god_celtic_deity_07_icon:0 "$patron_god_celtic_deity_07$"
 patron_god_celtic_deity_07_desc:0 "The great queen of battle, who appears as a crow above the fighting. Her chosen are feared and famous, though few would call them gentle."
 patron_god_celtic_deity_08_icon:0 "$patron_god_celtic_deity_08$"
 patron_god_celtic_deity_08_desc:0 "Star goddess of healing springs, often worshipped alongside Grannus. The sick bathe in her waters and go home with years added to their lives."
 patron_god_celtic_deity_09_icon:0 "$patron_god_celtic_deity_09$"
 patron_god_celtic_deity_09_desc:0 "War god of the Gauls and Britons, whose name lives on in Camulodunum. Chieftains who honour him draw spears to their side for less silver."
 patron_god_celtic_deity_10_icon:0 "$patron_god_celtic_deity_10$"
 patron_god_celtic_deity_10_desc:0 "The thunderer, holder of the wheel, worshipped from Gaul to the Danube by many peoples. He cares little for tribe or tongue, only for faith and strength in the field."
 patron_god_celtic_deity_11_icon:0 "$patron_god_celtic_deity_11$"
 patron_god_celtic_deity_11_desc:0 "The aged god of eloquence, who leads his listeners by chains of gold running from his tongue to their ears. Scholars of letters and tongues seek his favour."
 patron_god_celtic_deity_12_icon:0 "$patron_god_celtic_deity_12$"
 patron_god_celtic_deity_12_desc:0 "Lady of the North Sea crossings, honoured with altars by every merchant who sailed safely home. Her ships run fast and her sailors fight well on any shore."
 patron_god_celtic_deity_13_icon:0 "$patron_god_celtic_deity_13$"
 patron_god_celtic_deity_13_desc:0 "The Great Provider, bearer of the cornucopia and the honey-filled bucket, companion of Lugus. Her followers are welcomed with gifts rather than fear."
 patron_god_celtic_deity_14_icon:0 "$patron_god_celtic_deity_14$"
 patron_god_celtic_deity_14_desc:0 "Goddess of the nemeton, the sacred grove where all may come in peace. She teaches her followers to receive strangers and other faiths with patience."
 patron_god_celtic_deity_15_icon:0 "$patron_god_celtic_deity_15$"
 patron_god_celtic_deity_15_desc:0 "The provider and protector, who drives off harm with his club and his serpent. Lords and vassals alike trust a warrior so plainly honest."
 patron_god_celtic_deity_16_icon:0 "$patron_god_celtic_deity_16$"
 patron_god_celtic_deity_16_desc:0 "Unconquerable goddess of victory, called upon by Boudica before she rose against Rome. Her followers move against their enemies swiftly and in secret, and hold their own people close."
 patron_god_celtic_deity_17_icon:0 "$patron_god_celtic_deity_17$"
 patron_god_celtic_deity_17_desc:0 "The good striker, who carries a long-handled mallet and a pot of plenty. Under his care fields are worked, tithes are paid, and unruly lands settle down."
 patron_god_celtic_deity_18_icon:0 "$patron_god_celtic_deity_18$"
 patron_god_celtic_deity_18_desc:0 "The old woman of winter, who shapes the mountains and rules the dark half of the year. Her chosen march through snow and ice as though it were summer."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_dharmic_deity_01_icon:0 "$patron_god_dharmic_deity_01$"
 patron_god_dharmic_deity_01_desc:0 "Goddess of learning, music and speech, seated on a white lotus with her veena. Scholars of every faith find a welcome under her patronage."
 patron_god_dharmic_deity_02_icon:0 "$patron_god_dharmic_deity_02$"
 patron_god_dharmic_deity_02_desc:0 "The seventh avatar of Vishnu and the model of a just king, who won back Sita at the head of an army of allies. Rulers who follow him lead in war and peace alike."
 patron_god_dharmic_deity_03_icon:0 "$patron_god_dharmic_deity_03$"
 patron_god_dharmic_deity_03_desc:0 "The mother goddess of rain, who sends away fever and smallpox. Villages honour her for health and for children."
 patron_god_dharmic_deity_04_icon:0 "$patron_god_dharmic_deity_04$"
 patron_god_dharmic_deity_04_desc:0 "The elephant-headed remover of obstacles, son of Shiva and Parvati, invoked before every new venture. Merchants and stewards prosper under his eye."
 patron_god_dharmic_deity_05_icon:0 "$patron_god_dharmic_deity_05$"
 patron_god_dharmic_deity_05_desc:0 "The fearsome form of Shiva, guardian of temples and lord of time. Those who follow him are feared, and that fear is a kind of devotion."
 patron_god_dharmic_deity_06_icon:0 "$patron_god_dharmic_deity_06$"
 patron_god_dharmic_deity_06_desc:0 "The mighty monkey god, devoted servant of Rama, who leapt across the sea to Lanka. He gives strength of body and a mind at peace."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_hellenic_deity_01_icon:0 "$patron_god_hellenic_deity_01$"
 patron_god_hellenic_deity_02_icon:0 "$patron_god_hellenic_deity_02$"
 patron_god_hellenic_deity_02_desc:0 "Messenger of the gods and patron of heralds, travellers and the silver-tongued. Envoys who carry his staff are welcome in every court."
 patron_god_hellenic_deity_03_icon:0 "$patron_god_hellenic_deity_03$"
 patron_god_hellenic_deity_03_desc:0 "God of light, prophecy, music and healing, lord of Delphi. His oracle draws scholars and pilgrims from across the world, and the culture that honours him shines."
 patron_god_hellenic_deity_04_icon:0 "$patron_god_hellenic_deity_04$"
 patron_god_hellenic_deity_04_desc:0 "Grey-eyed goddess of wisdom, crafts and the well-ordered city. She favours rulers who govern with prudence and fill their treasuries through skill rather than force."
 patron_god_hellenic_deity_05_icon:0 "$patron_god_hellenic_deity_05$"
 patron_god_hellenic_deity_05_desc:0 "Queen of Olympus and guardian of marriage and lineage. Houses that honour her grow in renown with every generation."
 patron_god_hellenic_deity_06_icon:0 "$patron_god_hellenic_deity_06$"
 patron_god_hellenic_deity_06_desc:0 "The hero who earned his place on Olympus through twelve labours, claimed as an ancestor by kings from Macedon to Sparta. Those who follow him win fame and sway."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_kemetic_deity_01_icon:0 "$patron_god_kemetic_deity_01$"
 patron_god_kemetic_deity_01_desc:0 "The falcon-headed son of Isis, who avenged his father and won the throne of the Two Lands. Every pharaoh rules as the living Horus and wins his battles in that name."
 patron_god_kemetic_deity_02_icon:0 "$patron_god_kemetic_deity_02$"
 patron_god_kemetic_deity_02_desc:0 "Lord of the red desert, of storms and of foreign lands, who slew his brother Osiris. He is feared more than loved, and those he favours are feared in turn."
 patron_god_kemetic_deity_03_icon:0 "$patron_god_kemetic_deity_03$"
 patron_god_kemetic_deity_03_desc:0 "The ibis-headed scribe of the gods, inventor of writing and keeper of the divine records. His priests guard the knowledge of temples and stars."
 patron_god_kemetic_deity_04_icon:0 "$patron_god_kemetic_deity_04$"
 patron_god_kemetic_deity_04_desc:0 "Great of Magic, who gathered the scattered body of Osiris and hid her son from Set. Her followers win their ends through patience, persuasion and cunning."
 patron_god_kemetic_deity_05_icon:0 "$patron_god_kemetic_deity_05$"
 patron_god_kemetic_deity_05_desc:0 "Lord of the dead and of the rising Nile, who returns every year with the grain. Under his care the fields are fertile and the granaries full."
 patron_god_kemetic_deity_06_icon:0 "$patron_god_kemetic_deity_06$"
 patron_god_kemetic_deity_06_desc:0 "The Hidden One joined with the Sun, king of the gods and patron of Thebes. Pharaohs ruled as his sons, and his temple at Karnak was the greatest in Egypt."
 patron_god_kemetic_deity_07_icon:0 "$patron_god_kemetic_deity_07$"
 patron_god_kemetic_deity_07_desc:0 "The creator of Memphis, who shaped the world by thought and word, and patron of craftsmen and builders. Temples and cities rise quickly under his hand."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_mithras_deity_01:0 "Deus Arimanius"
 patron_god_mithras_deity_01_icon:0 "$patron_god_mithras_deity_01$"
 patron_god_mithras_deity_01_desc:0 "The lion-headed god who stands coiled by a serpent in the depths of the mithraeum. Initiates honour his fearsome strength and trust him to keep the faithful steady in battle."
 patron_god_mithras_deity_02:0 "Oceanus"
 patron_god_mithras_deity_02_icon:0 "$patron_god_mithras_deity_02$"
 patron_god_mithras_deity_02_desc:0 "Lord of the waters that flowed when Mithras struck the rock with his arrow. He gives life and health, and the common people love those who carry his blessing."
 patron_god_mithras_deity_03:0 "Aion"
 patron_god_mithras_deity_03_icon:0 "$patron_god_mithras_deity_03$"
 patron_god_mithras_deity_03_desc:0 "Boundless Time, keeper of the turning heavens and the soul's ascent through the seven spheres. His followers seek knowledge and grow wiser with every year."
 patron_god_mithras_deity_04:0 "Saturnus"
 patron_god_mithras_deity_04_icon:0 "$patron_god_mithras_deity_04$"
 patron_god_mithras_deity_04_desc:0 "Patron of the Pater, the highest grade of initiates, and of the treasury that bears his name. He rewards careful stewards, though the people resent his tax-gatherers."
 patron_god_mithras_deity_05:0 "Cautes"
 patron_god_mithras_deity_05_icon:0 "$patron_god_mithras_deity_05$"
 patron_god_mithras_deity_05_desc:0 "The torchbearer of dawn, raising his torch as the sun climbs. Those under his light are seen and loved by all."
 patron_god_mithras_deity_06:0 "Petra Genetrix"
 patron_god_mithras_deity_06_icon:0 "$patron_god_mithras_deity_06$"
 patron_god_mithras_deity_06_desc:0 "The Rock that gave birth to Mithras, the foundation of every mithraeum. Those who build in her name build quickly and cheaply."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_roman_deity_01_icon:0 "$patron_god_roman_deity_01$"
 patron_god_roman_deity_01_desc:0 "Jupiter Optimus Maximus, best and greatest, lord of the Capitol. Victorious generals laid their laurels in his temple, and his priests keep the State's oldest rites."
 patron_god_roman_deity_02_icon:0 "$patron_god_roman_deity_02$"
 patron_god_roman_deity_02_desc:0 "Lord of the sea, of springs and of horses, who shakes the earth when he is angered. Sailors and astronomers alike pray for his calm."
 patron_god_roman_deity_03_icon:0 "$patron_god_roman_deity_03$"
 patron_god_roman_deity_03_desc:0 "Queen of the gods, protector of wives and, as Juno Lucina, of childbirth. She blesses marriages and the households they raise."
 patron_god_roman_deity_04_icon:0 "$patron_god_roman_deity_04$"
 patron_god_roman_deity_04_desc:0 "Goddess of grain and the harvest, whose gifts feed the city and its legions alike. The plebs have honoured her on the Aventine since the early Republic."
 patron_god_roman_deity_05_icon:0 "$patron_god_roman_deity_05$"
 patron_god_roman_deity_05_desc:0 "Father of Romulus and god of war, honoured by every legion before it marches. Rome itself is the city of Mars."
 patron_god_roman_deity_06_icon:0 "$patron_god_roman_deity_06$"
 patron_god_roman_deity_06_desc:0 "God of merchants, profit and safe roads, and guide of souls to the underworld. Wealth flows to those who keep his festival."
 patron_god_roman_deity_07_icon:0 "$patron_god_roman_deity_07$"
 patron_god_roman_deity_07_desc:0 "Peace made a goddess, honoured at the Ara Pacis of Augustus. She favours rulers who end wars by treaty and govern with wisdom."
 patron_god_solar_deity_01_desc:0 "$patron_god_desc_solar_deity_01$"
 patron_god_solar_deity_01_icon:0 "$patron_god_solar_deity_01$"
 patron_god_solar_deity_02_icon:0 "$patron_god_solar_deity_02$"
 patron_god_solar_deity_02_desc:0 "$patron_god_desc_solar_deity_02$"
 patron_god_solar_deity_03_icon:0 "$patron_god_solar_deity_03$"
 patron_god_solar_deity_03_desc:0 "$patron_god_desc_solar_deity_03$"
 patron_god_solar_deity_04_icon:0 "$patron_god_solar_deity_04$"
 patron_god_solar_deity_05_icon:0 "$patron_god_solar_deity_05$"
 patron_god_solar_deity_04_desc:0 "$patron_god_desc_solar_deity_04$"
 patron_god_solar_deity_05_desc:0 "$patron_god_desc_solar_deity_05$"
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_norse_deity_01_icon:0 "$patron_god_norse_deity_01$"
 patron_god_norse_deity_01_desc:0 "Allfather, lord of Asgard and the slain, who gave an eye for wisdom and hung nine nights on the world-tree to win the runes. Kings who follow him are wise and famous."
 patron_god_norse_deity_02_icon:0 "$patron_god_norse_deity_02$"
 patron_god_norse_deity_02_desc:0 "The thunderer, bane of giants and protector of Midgard, who wields the hammer Mjölnir. Warriors carry his hammer at their throats and strike first."
 patron_god_norse_deity_03_icon:0 "$patron_god_norse_deity_03$"
 patron_god_norse_deity_03_desc:0 "The one-handed god of war and of oaths, who gave his hand to bind the wolf Fenrir. His followers keep their word, and their men trust them for it."
 patron_god_norse_deity_04_icon:0 "$patron_god_norse_deity_04$"
 patron_god_norse_deity_04_desc:0 "Lord of sunshine, rain and the harvest, giver of peace and plenty, honoured at Uppsala. Under his care the fields ripen and households grow."
 patron_god_norse_deity_05_icon:0 "$patron_god_norse_deity_05$"
 patron_god_norse_deity_05_desc:0 "Lady of the Vanir, mistress of love and of seiðr magic, who claims half of the slain for her hall. None can easily refuse those she favours."
 patron_god_norse_deity_06_icon:0 "$patron_god_norse_deity_06$"
 patron_god_norse_deity_06_desc:0 "God of the sea, of winds and of fishermen, father of Freyr and Freyja. Ships sail swiftly under his wind and land safely on any shore."
 patron_god_norse_deity_07_icon:0 "$patron_god_norse_deity_07$"
 patron_god_norse_deity_07_desc:0 "The shape-changer and sly-tongued trickster, friend and foe of the gods alike. His followers' plots ripen quickly and rarely come to light."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_slavic_deity_01_icon:0 "$patron_god_slavic_deity_01$"
 patron_god_slavic_deity_01_desc:0 "The thunder god in the high oak, lord of the warband and smiter of serpents. Princes swear their treaties on his name and march out under his lightning."
 patron_god_slavic_deity_02_icon:0 "$patron_god_slavic_deity_02$"
 patron_god_slavic_deity_02_desc:0 "God of cattle, wealth and the underworld, rival of Perun, who guards the herds and the souls of the dead. Those who honour him never want for riches."
 patron_god_slavic_deity_03_icon:0 "$patron_god_slavic_deity_03$"
 patron_god_slavic_deity_03_desc:0 "The heavenly smith, who forged the sun and first taught people to work iron. His followers carry strong arms and raise strong walls."
 patron_god_slavic_deity_04_icon:0 "$patron_god_slavic_deity_04$"
 patron_god_slavic_deity_04_desc:0 "The giver of good things, son of Svarog, who drives the sun across the sky. Princes claim descent from him and shine in his light."
 patron_god_slavic_deity_05_icon:0 "$patron_god_slavic_deity_05$"
 patron_god_slavic_deity_05_desc:0 "Mother of moist earth, spinner of fate and protector of women and childbirth. She keeps families healthy and marriages warm."
 patron_god_slavic_deity_06_icon:0 "$patron_god_slavic_deity_06$"
 patron_god_slavic_deity_06_desc:0 "The four-faced god of Arkona, whose white horse foretells war and whose horn foretells the harvest. His priests are rich, learned and listened to."
 patron_god_slavic_deity_07_icon:0 "$patron_god_slavic_deity_07$"
 patron_god_slavic_deity_07_desc:0 "The ancestor, who breathes life into every newborn, with the Rozhanitsy who weave each child's fate. He binds the living to their kin and their forefathers."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_canaanite_deity_01_icon:0 "$patron_god_canaanite_deity_01$"
 patron_god_canaanite_deity_01_desc:0 "Lord of the city of Carthage and father of its gods, enthroned between winged sphinxes. The suffetes and the great families rule in his name."
 patron_god_canaanite_deity_02_icon:0 "$patron_god_canaanite_deity_02$"
 patron_god_canaanite_deity_02_desc:0 "The Face of Baal, protector of Carthage, whose sign is carved on every stele of the tophet. She watches over mothers, children and the faithful of her city."
 patron_god_canaanite_deity_03_icon:0 "$patron_god_canaanite_deity_03$"
 patron_god_canaanite_deity_03_desc:0 "The King of the City, lord of Tyre, who led the Phoenician ships to every shore of the sea. Colonists and merchants offer him a tithe of all they earn."
 patron_god_canaanite_deity_04_icon:0 "$patron_god_canaanite_deity_04$"
 patron_god_canaanite_deity_04_desc:0 "The storm god who rides the clouds, slayer of Yam the sea and of Mot, death. Armies march behind his thunder."
 patron_god_canaanite_deity_05_icon:0 "$patron_god_canaanite_deity_05$"
 patron_god_canaanite_deity_05_desc:0 "The healer of Sidon, whose temple stands beside a sacred spring. The sick come to his waters, and his priests are learned in medicine."
 patron_god_canaanite_deity_06_icon:0 "$patron_god_canaanite_deity_06$"
 patron_god_canaanite_deity_06_desc:0 "Queen of heaven and lady of Sidon, goddess of love and of war, honoured from Byblos to Eryx. Kings court her favour, and their own courts grow brighter for it."
 patron_god_canaanite_deity_07_icon:0 "$patron_god_canaanite_deity_07$"
 patron_god_canaanite_deity_07_desc:0 "The skilled and wise craftsman, who built Baal's palace of cedar, silver and gold. His followers' halls rise quickly and cost little."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_anatolian_deity_01_icon:0 "$patron_god_anatolian_deity_01$"
 patron_god_anatolian_deity_01_desc:0 "The Storm God, king of heaven, who slew the serpent Illuyanka and rides a chariot drawn by bulls. Great Kings ruled the land as his stewards."
 patron_god_anatolian_deity_02_icon:0 "$patron_god_anatolian_deity_02$"
 patron_god_anatolian_deity_02_desc:0 "The Sun Goddess of Arinna, queen of the land of Hatti, to whom kings and queens prayed first. She gives the realm its children and its rulers their crowns."
 patron_god_anatolian_deity_03_icon:0 "$patron_god_anatolian_deity_03$"
 patron_god_anatolian_deity_03_desc:0 "The goddess of healing and magic, whose rites cleanse sickness and impurity. Those under her care are hale, and her priests are wise."
 patron_god_anatolian_deity_04_icon:0 "$patron_god_anatolian_deity_04$"
 patron_god_anatolian_deity_04_desc:0 "The old god of grain and wealth, father of kings before the Storm God's reign. Granaries and treasuries swell under his eye."
 patron_god_anatolian_deity_05_icon:0 "$patron_god_anatolian_deity_05$"
 patron_god_anatolian_deity_05_desc:0 "Lord of the deep waters and of wisdom, keeper of the tablets of fate. Scribes and diviners grow wiser in his service."
 patron_god_anatolian_deity_06_icon:0 "$patron_god_anatolian_deity_06$"
 patron_god_anatolian_deity_06_desc:0 "The moon god, who watches through the night and sees what is hidden. Plots against his followers come slowly to fruit."
 patron_god_anatolian_deity_07_icon:0 "$patron_god_anatolian_deity_07$"
 patron_god_anatolian_deity_07_desc:0 "The sea, vast and old, who once held the Sun himself captive. Sailors who keep his rites cross his waters swiftly."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_zoroastrian_deity_01_icon:0 "$patron_god_zoroastrian_deity_01$"
 patron_god_zoroastrian_deity_01_desc:0 "The yazata of victory, who comes to the righteous as a wind, a bull, a boar and a falcon. Shahs carry his fire into battle, and his warriors strike hard."
 patron_god_zoroastrian_deity_02_icon:0 "$patron_god_zoroastrian_deity_02$"
 patron_god_zoroastrian_deity_02_desc:0 "Lord of the covenant and of wide pastures, who watches every oath with a thousand ears and ten thousand eyes. Those who keep faith with him are trusted by all."
 patron_god_zoroastrian_deity_03_icon:0 "$patron_god_zoroastrian_deity_03$"
 patron_god_zoroastrian_deity_03_desc:0 "Aredvi Sura Anahita, the strong and immaculate, lady of the waters that flow from Mount Hara. She purifies the seed of men and the wombs of women, and gives health to all."
 patron_god_zoroastrian_deity_04_icon:0 "$patron_god_zoroastrian_deity_04$"
 patron_god_zoroastrian_deity_04_desc:0 "The holy fire, son of Ahura Mazda, kept burning in every fire temple of Ērānšahr. Priests and believers gather around his flame."
 patron_god_zoroastrian_deity_05_icon:0 "$patron_god_zoroastrian_deity_05$"
 patron_god_zoroastrian_deity_05_desc:0 "The Good Mind, first of the Amesha Spentas, who led Zarathustra into the presence of Ahura Mazda. Wisdom and right thought follow his followers."
 patron_god_zoroastrian_deity_06_icon:0 "$patron_god_zoroastrian_deity_06$"
 patron_god_zoroastrian_deity_06_desc:0 "Desirable Dominion, guardian of metals and of just rule. He blesses rulers who govern well, and their treasuries fill."
 patron_god_zoroastrian_deity_07_icon:0 "$patron_god_zoroastrian_deity_07$"
 patron_god_zoroastrian_deity_07_desc:0 "The righteous judge, who weighs every soul on his golden scales at the Chinvat Bridge. Vassals trust a ruler who honours him, and plotters fear his eye."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_illyrian_deity_01_icon:0 "$patron_god_illyrian_deity_01$"
 patron_god_illyrian_deity_01_desc:0 "The armoured horseman of Risinium, who rides with his lance raised over the walls he protects. Illyrian lords charge into battle in his name."
 patron_god_illyrian_deity_02_icon:0 "$patron_god_illyrian_deity_02$"
 patron_god_illyrian_deity_02_desc:0 "The Sun, highest of the gods, whose wheel is carved on Illyrian graves and shields. Kings who honour him shine before their people."
 patron_god_illyrian_deity_03_icon:0 "$patron_god_illyrian_deity_03$"
 patron_god_illyrian_deity_03_desc:0 "The healer of the hot springs, honoured by Illyrians and Celts alike. The sick bathe in his waters and the wise learn his remedies."
 patron_god_illyrian_deity_04_icon:0 "$patron_god_illyrian_deity_04$"
 patron_god_illyrian_deity_04_desc:0 "Lady of the forests and the fertile fields, honoured with Thana at the sacred springs. Her lands are green and her households full."
 patron_god_illyrian_deity_05_icon:0 "$patron_god_illyrian_deity_05$"
 patron_god_illyrian_deity_05_desc:0 "The herdsman god, keeper of cattle and patron of the trade that follows them. Herds and treasuries grow under his care."
 patron_god_illyrian_deity_06_icon:0 "$patron_god_illyrian_deity_06$"
 patron_god_illyrian_deity_06_desc:0 "Lord of springs and of the sea, honoured by the Iapodes at his sacred spring and by every Illyrian crew that put to sea. His lemboi are swift and his sailors bold."
 patron_god_illyrian_deity_07_icon:0 "$patron_god_illyrian_deity_07$"
 patron_god_illyrian_deity_07_desc:0 "The wandering hero and trickster, who outwits monsters and kings alike. His followers win by cunning what others win by force."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_zalmoxian_deity_01_icon:0 "$patron_god_zalmoxian_deity_01$"
 patron_god_zalmoxian_deity_01_desc:0 "The teacher of the Getae, who went beneath the earth and returned to show his people they would never die. His followers face death calmly and live long."
 patron_god_zalmoxian_deity_02_icon:0 "$patron_god_zalmoxian_deity_02$"
 patron_god_zalmoxian_deity_02_desc:0 "The thunderer of the high places, at whom Getic warriors loose their arrows when the storm comes. Armies march under his wolf-headed dragon standard."
 patron_god_zalmoxian_deity_03_icon:0 "$patron_god_zalmoxian_deity_03$"
 patron_god_zalmoxian_deity_03_desc:0 "The horseman god of the Thracians and Phrygians, rider of the sky, whose bronze hands bless his faithful. Warriors who follow him are famous for their courage."
 patron_god_zalmoxian_deity_04_icon:0 "$patron_god_zalmoxian_deity_04$"
 patron_god_zalmoxian_deity_04_desc:0 "Lord of the underworld and of the riches beneath the earth, who gives health and abundance to the living. Fields are rich and bodies strong under his care."
 patron_god_zalmoxian_deity_05_icon:0 "$patron_god_zalmoxian_deity_05$"
 patron_god_zalmoxian_deity_05_desc:0 "The huntress with two spears, goddess of the moon and of the waters, whose torch races were run even in Athens. She blesses mothers and makes friends of strangers."
 patron_god_zalmoxian_deity_06_icon:0 "$patron_god_zalmoxian_deity_06$"
 patron_god_zalmoxian_deity_06_desc:0 "The twice-born god of the night mysteries, whose rites are held by torchlight in the mountains. His initiates keep their secrets well."
 patron_god_zalmoxian_deity_07_icon:0 "$patron_god_zalmoxian_deity_07$"
 patron_god_zalmoxian_deity_07_desc:0 "The fox-skinned god of wine and feasting, honoured by every Thracian household. His followers laugh easily and are welcome everywhere."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_neoplatonic_deity_01_icon:0 "$patron_god_neoplatonic_deity_01$"
 patron_god_neoplatonic_deity_01_desc:0 "The founder of the Academy, who taught that this world is a shadow of the eternal Forms. Rulers who follow him strive to be philosopher-kings."
 patron_god_neoplatonic_deity_02_icon:0 "$patron_god_neoplatonic_deity_02$"
 patron_god_neoplatonic_deity_02_desc:0 "The sage of Samos, who found the harmony of the spheres in number and taught the transmigration of souls. His disciples keep their accounts as carefully as their vows."
 patron_god_neoplatonic_deity_03_icon:0 "$patron_god_neoplatonic_deity_03$"
 patron_god_neoplatonic_deity_03_desc:0 "The master of Rome's school, who four times in his life rose to union with the One. His followers meet the world's troubles with serenity."
 patron_god_neoplatonic_deity_04_icon:0 "$patron_god_neoplatonic_deity_04$"
 patron_god_neoplatonic_deity_04_desc:0 "The disciple of Plotinus from Tyre, editor of the Enneads and critic of every faith he studied. His followers can speak with any believer."
 patron_god_neoplatonic_deity_05_icon:0 "$patron_god_neoplatonic_deity_05$"
 patron_god_neoplatonic_deity_05_desc:0 "The divine Iamblichus of Chalcis, who taught that the soul rises through theurgy, the sacred rites, and not by thought alone. His school fills the temples."
 patron_god_neoplatonic_deity_06_icon:0 "$patron_god_neoplatonic_deity_06$"
 patron_god_neoplatonic_deity_06_desc:0 "The philosopher of Alexandria, mathematician and astronomer, whom governors came to for counsel. Those who follow her are heard with respect."
 patron_god_neoplatonic_deity_07_icon:0 "$patron_god_neoplatonic_deity_07$"
 patron_god_neoplatonic_deity_07_desc:0 "The successor at Athens, who set out the whole order of the gods from the One to the world, and greeted the rising sun with hymns. He sharpens every mind he touches."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_sabaean_arab_deity_01_icon:0 "$patron_god_sabaean_arab_deity_01$"
 patron_god_sabaean_arab_deity_01_desc:0 "The lord of Saba, whose temple at Marib stands by the great dam that waters the desert. Kings who honour him build well and keep their fields green."
 patron_god_sabaean_arab_deity_02_icon:0 "$patron_god_sabaean_arab_deity_02$"
 patron_god_sabaean_arab_deity_02_desc:0 "The Goddess, lady of Ta'if, whom the Nabataeans and the tribes alike honour, armed and helmed. She leads the raiders of the desert to victory."
 patron_god_sabaean_arab_deity_03_icon:0 "$patron_god_sabaean_arab_deity_03$"
 patron_god_sabaean_arab_deity_03_desc:0 "The Mightiest, the morning star, worshipped in the acacia grove of Nakhla. She gives strength to warriors and children to their wives."
 patron_god_sabaean_arab_deity_04_icon:0 "$patron_god_sabaean_arab_deity_04$"
 patron_god_sabaean_arab_deity_04_desc:0 "The goddess of fate and of the measured span of life, honoured at the shore between Mecca and Medina. Her followers accept what is allotted to them, and are pious for it."
 patron_god_sabaean_arab_deity_05_icon:0 "$patron_god_sabaean_arab_deity_05$"
 patron_god_sabaean_arab_deity_05_desc:0 "The god of the divining arrows, whose red carnelian image stands in the Kaaba. Seers and judges seek his answers."
 patron_god_sabaean_arab_deity_06_icon:0 "$patron_god_sabaean_arab_deity_06$"
 patron_god_sabaean_arab_deity_06_desc:0 "Fortune, the luck of a city or a tribe, honoured with offerings at every market. Trade flows to the places he favours."
 patron_god_sabaean_arab_deity_07_icon:0 "$patron_god_sabaean_arab_deity_07$"
 patron_god_sabaean_arab_deity_07_desc:0 "The Nabataean god of the night and protector of caravans, who abstains from wine. He keeps watch while his followers sleep."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_steppe_deity_01_icon:0 "$patron_god_steppe_deity_01$"
 patron_god_steppe_deity_01_desc:0 "The war god of the Altai, son of Ülgen, who rides at the head of the host. Khans who honour him lead their riders to victory."
 patron_god_steppe_deity_02_icon:0 "$patron_god_steppe_deity_02$"
 patron_god_steppe_deity_02_desc:0 "The mother goddess, protector of women, children and the felt tent, whom the old khagans honoured beside Tengri. She keeps the family whole."
 patron_god_steppe_deity_03_icon:0 "$patron_god_steppe_deity_03$"
 patron_god_steppe_deity_03_desc:0 "The good creator, who sits above the sky on a golden mountain and sends fortune to the righteous. His blessing is a ruler's kut, the right to rule."
 patron_god_steppe_deity_04_icon:0 "$patron_god_steppe_deity_04$"
 patron_god_steppe_deity_04_desc:0 "Lord of the underworld, who claims the souls of the dead and sends sickness to the living. Even his followers fear him, and so do their enemies."
 patron_god_steppe_deity_05_icon:0 "$patron_god_steppe_deity_05$"
 patron_god_steppe_deity_05_desc:0 "Earth and Water, the sacred homeland, the mountains and rivers where the ancestors lie. Those who honour the land are rich in its herds and pastures."
 patron_god_steppe_deity_06_icon:0 "$patron_god_steppe_deity_06$"
 patron_god_steppe_deity_06_desc:0 "The healer among the sons of Ülgen, who drives off the spirits of sickness. Shamans call on him beside the sickbed."
 patron_god_steppe_deity_07_icon:0 "$patron_god_steppe_deity_07$"
 patron_god_steppe_deity_07_desc:0 "The Moon Father, who lights the steppe at night and marks the seasons for the herdsmen. His followers are wise and keep the old rites."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_baltic_deity_01_icon:0 "$patron_god_baltic_deity_01$"
 patron_god_baltic_deity_01_desc:0 "The thunderer, whose axe splits the oak and drives out the devils. Warriors carry his fire into battle."
 patron_god_baltic_deity_02_icon:0 "$patron_god_baltic_deity_02$"
 patron_god_baltic_deity_02_desc:0 "The Sun, who drives her chariot across the sky and sails home each night in a golden boat. She warms the land and its people."
 patron_god_baltic_deity_03_icon:0 "$patron_god_baltic_deity_03$"
 patron_god_baltic_deity_03_desc:0 "The goddess of fate, who stands at every birth and spins the length of each life. Mothers pray to her, and her chosen live long."
 patron_god_baltic_deity_04_icon:0 "$patron_god_baltic_deity_04$"
 patron_god_baltic_deity_04_desc:0 "The spirit of the hearth fire, kept burning in every home and fed with salt and bread. She keeps the household together."
 patron_god_baltic_deity_05_icon:0 "$patron_god_baltic_deity_05$"
 patron_god_baltic_deity_05_desc:0 "The young Prussian god of grain, springs and plenty, honoured with Perkūnas and Patollo in the sacred grove of Romuva. His fields always ripen."
 patron_god_baltic_deity_06_icon:0 "$patron_god_baltic_deity_06$"
 patron_god_baltic_deity_06_desc:0 "Old Man God, who wanders the land in rags to test the kindness of mortals and teach them. Wisdom comes to those who welcome him."
 patron_god_baltic_deity_07_icon:0 "$patron_god_baltic_deity_07$"
 patron_god_baltic_deity_07_desc:0 "The two-faced god of the sea and of storms, who blows the waves before him. Ships with his blessing run fast before the wind."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_finno_ugric_deity_01_icon:0 "$patron_god_finno_ugric_deity_01$"
 patron_god_finno_ugric_deity_01_desc:0 "The thunderer of the war-bands, whose lightning splits the rocks. Raiders call his name as they set out across the lakes."
 patron_god_finno_ugric_deity_02_icon:0 "$patron_god_finno_ugric_deity_02$"
 patron_god_finno_ugric_deity_02_desc:0 "The eternal singer, son of Ilmatar, whose songs of power shaped the world and bound his enemies in the swamp. Wisdom and eloquence follow his followers."
 patron_god_finno_ugric_deity_03_icon:0 "$patron_god_finno_ugric_deity_03$"
 patron_god_finno_ugric_deity_03_desc:0 "The great smith, who hammered out the vault of the sky and forged the Sampo. His followers raise strong halls and carry strong blades."
 patron_god_finno_ugric_deity_04_icon:0 "$patron_god_finno_ugric_deity_04$"
 patron_god_finno_ugric_deity_04_desc:0 "The god of the fields, who first brought the turnip to the people. Under his care the harvest comes in and the storehouses fill."
 patron_god_finno_ugric_deity_05_icon:0 "$patron_god_finno_ugric_deity_05$"
 patron_god_finno_ugric_deity_05_desc:0 "The old mother, wife of Ukko, keeper of the home and of women's health. Her households are healthy and full of children."
 patron_god_finno_ugric_deity_06_icon:0 "$patron_god_finno_ugric_deity_06$"
 patron_god_finno_ugric_deity_06_desc:0 "The king of the waters, lord of the lakes and the sea, whose grey beard is moss and whose halls lie under the waves. Fishermen and sailors prosper by his favour."
 patron_god_finno_ugric_deity_07_icon:0 "$patron_god_finno_ugric_deity_07$"
 patron_god_finno_ugric_deity_07_desc:0 "The earth sprite of the hills and the deep forest, who leads travellers astray and plays tricks on the careless. His followers move unseen."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_mari_deity_01_icon:0 "$patron_god_mari_deity_01$"
 patron_god_mari_deity_01_desc:0 "The thunder god, who drives his fire across the sky over the Volga forests. Mari warriors pray to him in the sacred grove before they ride out."
 patron_god_mari_deity_02_icon:0 "$patron_god_mari_deity_02$"
 patron_god_mari_deity_02_desc:0 "The Birth Mother, who gives each child its soul and watches over mothers in labour. Families who honour her grow strong."
 patron_god_mari_deity_03_icon:0 "$patron_god_mari_deity_03$"
 patron_god_mari_deity_03_desc:0 "The god of flowers and of the blossoming fields, whose favour makes the bees busy and the grain heavy. Households under his care want for nothing."
 patron_god_mari_deity_04_icon:0 "$patron_god_mari_deity_04$"
 patron_god_mari_deity_04_desc:0 "The god of the homestead, who dwells by the hearth and keeps the family together. Kin stand by those who honour him."
 patron_god_mari_deity_05_icon:0 "$patron_god_mari_deity_05$"
 patron_god_mari_deity_05_desc:0 "The Creator of Fate, who shapes each soul and sets its path before birth. His followers understand what is written and keep the old rites."
 patron_god_mari_deity_06_icon:0 "$patron_god_mari_deity_06$"
 patron_god_mari_deity_06_desc:0 "The dark brother of Kugu Jumo, bringer of sickness and misfortune, who must be appeased in his own groves. Those who serve him are feared."
 patron_god_mari_deity_07_icon:0 "$patron_god_mari_deity_07$"
 patron_god_mari_deity_07_desc:0 "The Water Mother, who dwells in the rivers and springs and rules the Volga. Boats with her blessing travel swiftly and cheaply."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_slavic_deity_08_icon:0 "$patron_god_slavic_deity_08$"
 patron_god_slavic_deity_08_desc:0 "Grandfather of the winds, who sends the gales over steppe and river. Boats and riders blessed by him travel fast and far."
 patron_god_slavic_deity_09_icon:0 "$patron_god_slavic_deity_09$"
 patron_god_slavic_deity_09_desc:0 "The young god of spring and of the green shoots, who returns each year from the land of the dead. Under his care the fields and the family grow."
 patron_god_slavic_deity_10_icon:0 "$patron_god_slavic_deity_10$"
 patron_god_slavic_deity_10_desc:0 "Lady of winter and of death, whose straw effigy is drowned each spring. Those who honour her do not fear the cold or the grave."
 patron_god_kemetic_deity_08_icon:0 "$patron_god_kemetic_deity_08$"
 patron_god_kemetic_deity_08_desc:0 "The Golden One, lady of music, love and joy, who nursed the young Horus. Courts that honour her are merry and generous."
 patron_god_rite_rod_deity_01_icon:0 "$patron_god_rite_rod_deity_01$"
 patron_god_rite_rod_deity_01_desc:0 "The fate-maidens who come to every cradle on the third night to spin the child's thread of life. Families who feed them live long."
 patron_god_rite_dazhbog_deity_01_icon:0 "$patron_god_rite_dazhbog_deity_01$"
 patron_god_rite_dazhbog_deity_01_desc:0 "The round shining disc of the sun, honoured on the hill of Kiev beside Perun. Princes who follow him are seen from afar."
 patron_god_rite_perun_deity_01_icon:0 "$patron_god_rite_perun_deity_01$"
 patron_god_rite_perun_deity_01_desc:0 "Perun's bride, the rain maiden, for whom girls dance in garlands in time of drought. She brings rain to the fields of the faithful."
 patron_god_rite_slavic_pagan_deity_01_icon:0 "$patron_god_rite_slavic_pagan_deity_01$"
 patron_god_rite_slavic_pagan_deity_01_desc:0 "Goddess of spring, love and harmony, who blesses weddings and the households they found. Her followers are loved by their spouses and kin."
 patron_god_rite_slavic_pagan_deity_02_icon:0 "$patron_god_rite_slavic_pagan_deity_02$"
 patron_god_rite_slavic_pagan_deity_02_desc:0 "The midsummer god of fire and water, when the fern blooms and lovers leap the bonfires. Those who keep his night are hale and hopeful."
 patron_god_rite_svaroh_deity_01_icon:0 "$patron_god_rite_svaroh_deity_01$"
 patron_god_rite_svaroh_deity_01_desc:0 "The fire, son of Svarog, honoured as Radegast in the temple at Rethra. The flame of the hearth and the forge is his, and he guards the warband."
 patron_god_rite_svetovid_deity_01_icon:0 "$patron_god_rite_svetovid_deity_01$"
 patron_god_rite_svetovid_deity_01_desc:0 "The three-headed god of Szczecin, who rules sky, earth and underworld and sees with his blindfolded eyes. His priests read his will from the black horse."
 patron_god_rite_veles_deity_01_icon:0 "$patron_god_rite_veles_deity_01$"
 patron_god_rite_veles_deity_01_desc:0 "The black god, master of misfortune and the dark half of the year, to whom the cup is passed with a curse. His followers are feared and seldom crossed."
 patron_god_rite_amun_deity_01_icon:0 "$patron_god_rite_amun_deity_01$"
 patron_god_rite_amun_deity_01_desc:0 "The Mother, consort of Amun and queen of Thebes, whose temple is ringed by a crescent lake. She guards kings and the women of their house."
 patron_god_rite_aten_deity_01_icon:0 "$patron_god_rite_aten_deity_01$"
 patron_god_rite_aten_deity_01_desc:0 "The living sun disc, whose rays end in hands that give life to the king alone. All the land praises it through its prophet."
 patron_god_rite_aten_deity_02_icon:0 "$patron_god_rite_aten_deity_02$"
 patron_god_rite_aten_deity_02_desc:0 "The prophet-king who first saw the Aten as the only god and built it a city in the desert. His heirs rule as the sun's sole voice."
 patron_god_rite_horus_re_deity_01_icon:0 "$patron_god_rite_horus_re_deity_01$"
 patron_god_rite_horus_re_deity_01_desc:0 "The scarab who rolls the newborn sun over the eastern horizon each dawn, beating back Apep. He renews the strength of his faithful."
 patron_god_rite_isis_deity_01_icon:0 "$patron_god_rite_isis_deity_01$"
 patron_god_rite_isis_deity_01_desc:0 "Lord of Alexandria, the god of the Ptolemies who joined Osiris and the Apis bull with the Greek Zeus. Greeks and Egyptians alike bring him their petitions."
 patron_god_rite_set_deity_01_icon:0 "$patron_god_rite_set_deity_01$"
 patron_god_rite_set_deity_01_desc:0 "Lady of the House, sister of Isis and consort of Set, who mourns the dead and guards the borders of the night. Her followers move unseen."
 patron_god_rite_kushitism_pagan_deity_01_icon:0 "$patron_god_rite_kushitism_pagan_deity_01$"
 patron_god_rite_kushitism_pagan_deity_01_desc:0 "The lion-headed war god of Meroë, with a serpent's body and three faces. Kushite kings march under his roar."
 patron_god_rite_kushitism_pagan_deity_02_icon:0 "$patron_god_rite_kushitism_pagan_deity_02$"
 patron_god_rite_kushitism_pagan_deity_02_desc:0 "The protective goddess of Meroë, who wears a crescent moon and falcons on her crown. She keeps the royal family safe."
 patron_god_rite_palmyran_pagan_deity_01_icon:0 "$patron_god_rite_palmyran_pagan_deity_01$"
 patron_god_rite_palmyran_pagan_deity_01_desc:0 "The father of gods and men, the aged king with grey beard who sits at the source of the two rivers. All decrees come from his tent."
 patron_god_rite_palmyran_pagan_deity_02_icon:0 "$patron_god_rite_palmyran_pagan_deity_02$"
 patron_god_rite_palmyran_pagan_deity_02_desc:0 "Lady of the Sea, mother of the seventy gods and consort of El, whose wooden poles stand by every altar. She blesses mothers and their children."
 patron_god_rite_aglibol_deity_01_icon:0 "$patron_god_rite_aglibol_deity_01$"
 patron_god_rite_aglibol_deity_01_desc:0 "The Calf of Baal, the moon god of Palmyra crowned with the sickle moon. His followers read the nights and keep the calendar."
 patron_god_rite_aglibol_deity_02_icon:0 "$patron_god_rite_aglibol_deity_02$"
 patron_god_rite_aglibol_deity_02_desc:0 "The god of the spring of Efqa that waters Palmyra, who gives oracles and judges disputes. Those he favours are just and well obeyed."
 patron_god_rite_beelshamen_deity_01_icon:0 "$patron_god_rite_beelshamen_deity_01$"
 patron_god_rite_beelshamen_deity_01_desc:0 "The Lord of the Heavens, master of rain and fertility, the great Baal of the Syrians. Kings rule as his stewards on earth."
 patron_god_rite_beelshamen_deity_02_icon:0 "$patron_god_rite_beelshamen_deity_02$"
 patron_god_rite_beelshamen_deity_02_desc:0 "The lord of the great temple of Palmyra, who drives the planets in their courses. Caravans and cities prosper under his order."
 patron_god_rite_hadad_deity_01_icon:0 "$patron_god_rite_hadad_deity_01$"
 patron_god_rite_hadad_deity_01_desc:0 "The Syrian Goddess of Hierapolis, Hadad's consort, whose sacred fish swim in her temple pool. She brings plenty and protects her city."
 patron_god_rite_kothar_deity_01_icon:0 "$patron_god_rite_kothar_deity_01$"
 patron_god_rite_kothar_deity_01_desc:0 "The grain god of the Euphrates and the Philistine coast, father of Baal in the old songs. He fills the granaries of those who honour him."
 patron_god_rite_malakbel_deity_01_icon:0 "$patron_god_rite_malakbel_deity_01$"
 patron_god_rite_malakbel_deity_01_desc:0 "The Messenger of Baal, the young sun god who rides beside Aglibôl in the Palmyrene triad. His light is a sign of the god's favour."
 patron_god_rite_malakbel_deity_02_icon:0 "$patron_god_rite_malakbel_deity_02$"
 patron_god_rite_malakbel_deity_02_desc:0 "The god of the caravans, who rides a camel and guards traders on the desert roads. Travellers under his protection come home safe."
 patron_god_rite_almaqah_deity_01_icon:0 "$patron_god_rite_almaqah_deity_01$"
 patron_god_rite_almaqah_deity_01_desc:0 "The sun goddess of Saba, honoured beside Almaqah and Attar in the great temples of Marib. She warms the fields and the hearts of the people."
 patron_god_rite_allat_deity_01_icon:0 "$patron_god_rite_allat_deity_01$"
 patron_god_rite_allat_deity_01_desc:0 "The lord of the mountain of Petra, worshipped as a black stone by the Nabataeans. His followers keep the passes and the trade roads."
 patron_god_rite_attar_deity_01_icon:0 "$patron_god_rite_attar_deity_01$"
 patron_god_rite_attar_deity_01_desc:0 "The god of thunderstorms and rain and of the morning star, vengeful against his enemies. His warriors strike at dawn."
 patron_god_rite_attar_deity_02_icon:0 "$patron_god_rite_attar_deity_02$"
 patron_god_rite_attar_deity_02_desc:0 "The moon god of the Minaeans, whose name means love, honoured with the serpent and the snake-staff. He binds friends together."
 patron_god_rite_hubal_deity_01_icon:0 "$patron_god_rite_hubal_deity_01$"
 patron_god_rite_hubal_deity_01_desc:0 "The lovers turned to stone for their sin in the sanctuary, set up by the well of Zamzam as a warning. Pilgrims touch them as they pass."
 patron_god_rite_maher_deity_01_icon:0 "$patron_god_rite_maher_deity_01$"
 patron_god_rite_maher_deity_01_desc:0 "Mahrem, the Aksumite god of war and of kings, to whom captives and cattle are offered after victory. He grants triumph in battle."
 patron_god_rite_maher_deity_02_icon:0 "$patron_god_rite_maher_deity_02$"
 patron_god_rite_maher_deity_02_desc:0 "The sky god of Aksum and father of Maher, named first in the kings' inscriptions. He keeps the king's word and the king's law."
 patron_god_rite_shams_deity_01_icon:0 "$patron_god_rite_shams_deity_01$"
 patron_god_rite_shams_deity_01_desc:0 "The sun goddess of the Himyarites, the great mistress who watches every deed from the sky. Kings swear by her and keep their oaths."
 patron_god_rite_shams_deity_02_icon:0 "$patron_god_rite_shams_deity_02$"
 patron_god_rite_shams_deity_02_desc:0 "The evening star of the north Arabian tribes, guardian of the dead and of desert travellers. Those who honour her find their way home."
 patron_god_rite_talab_deity_01_icon:0 "$patron_god_rite_talab_deity_01$"
 patron_god_rite_talab_deity_01_desc:0 "The lord of the pastures of Riyam, god of the Sumʿay tribe, who gives oracles from his mountain shrine. He feeds the herds and settles disputes."
 patron_god_rite_talab_deity_02_icon:0 "$patron_god_rite_talab_deity_02$"
 patron_god_rite_talab_deity_02_desc:0 "The moon god of Hadramaut, lord of Shabwa and its frankincense. The incense trade pays tithe to his temple."
 patron_god_rite_baltic_pagan_deity_01_icon:0 "$patron_god_rite_baltic_pagan_deity_01$"
 patron_god_rite_baltic_pagan_deity_01_desc:0 "The earth mother, who brings forth all that grows and receives the dead. Bread is kissed in her honour, and she feeds her people."
 patron_god_rite_peckols_deity_01_icon:0 "$patron_god_rite_peckols_deity_01$"
 patron_god_rite_peckols_deity_01_desc:0 "Lord of the underworld and of the restless dead, who haunts those who forget their ancestors. His followers are dreaded."
 patron_god_rite_peckols_deity_02_icon:0 "$patron_god_rite_peckols_deity_02$"
 patron_god_rite_peckols_deity_02_desc:0 "The pale twin of Peckols, the old man of death whose head is wrapped in white. He brings an end to the enemies of the faithful."
 patron_god_rite_perkunas_deity_01_icon:0 "$patron_god_rite_perkunas_deity_01$"
 patron_god_rite_perkunas_deity_01_desc:0 "The heavenly smith who forged the sun and hammers a new ring for her each morning. Iron and skill come from his anvil."
 patron_god_rite_saule_deity_01_icon:0 "$patron_god_rite_saule_deity_01$"
 patron_god_rite_saule_deity_01_desc:0 "The moon, Saulė's unfaithful husband, the warrior who counts the days and leads the stars. Soldiers swear by him before battle."
 patron_god_rite_luwian_deity_01_icon:0 "$patron_god_rite_luwian_deity_01$"
 patron_god_rite_luwian_deity_01_desc:0 "The Luwian sun god, the father who sees all and judges with the eyes of heaven. Rulers who honour him are just."
 patron_god_rite_luwian_deity_02_icon:0 "$patron_god_rite_luwian_deity_02$"
 patron_god_rite_luwian_deity_02_desc:0 "The warrior god of the Luwians, armed with bow and arrows, who brings plague on the enemies of his people."
 patron_god_rite_illuyanka_deity_01_icon:0 "$patron_god_rite_illuyanka_deity_01$"
 patron_god_rite_illuyanka_deity_01_desc:0 "The serpent dragon of the deep waters, defeated by the storm god but never destroyed. Its cult keeps the secrets of the old world."
 patron_god_rite_illuyanka_deity_02_icon:0 "$patron_god_rite_illuyanka_deity_02$"
 patron_god_rite_illuyanka_deity_02_desc:0 "The goddess of the wild creatures, who laid the feast that trapped the serpent. She grants cunning to those who must win by guile."
 patron_god_rite_tarhunt_deity_01_icon:0 "$patron_god_rite_tarhunt_deity_01$"
 patron_god_rite_tarhunt_deity_01_desc:0 "The mountain god who walks on the backs of the peaks, son of the storm god, the king's own protector. He holds the king in his embrace."
 patron_god_rite_german_pagan_rite_deity_01_icon:0 "$patron_god_rite_german_pagan_rite_deity_01$"
 patron_god_rite_german_pagan_rite_deity_01_desc:0 "Mother Earth, whose veiled wagon is drawn by cows through the lands of the Angles, bringing peace wherever she comes."
 patron_god_rite_german_pagan_rite_deity_02_icon:0 "$patron_god_rite_german_pagan_rite_deity_02$"
 patron_god_rite_german_pagan_rite_deity_02_desc:0 "The goddess of the Marsi, whose famous grove-temple was destroyed by the Romans. Her feast marks the end of the harvest."
 patron_god_rite_allfather_deity_01_icon:0 "$patron_god_rite_allfather_deity_01$"
 patron_god_rite_allfather_deity_01_desc:0 "The wandering wise god of the continental Germans, lord of the wild hunt and giver of victory. The Lombards took their name from his gift."
 patron_god_rite_allfather_deity_02_icon:0 "$patron_god_rite_allfather_deity_02$"
 patron_god_rite_allfather_deity_02_desc:0 "Wodan's queen, who spins the clouds and turned her husband's favour to the Lombards. She keeps the household and its children."
 patron_god_rite_irminsul_deity_01_icon:0 "$patron_god_rite_irminsul_deity_01$"
 patron_god_rite_irminsul_deity_01_desc:0 "The great god of the Saxons, whose pillar-tree holds up the sky. His priests speak with the voice of the whole people."
 patron_god_rite_irminsul_deity_02_icon:0 "$patron_god_rite_irminsul_deity_02$"
 patron_god_rite_irminsul_deity_02_desc:0 "The sword-companion, ancestor of the kings of Essex, named in the old Saxon oath beside Thunaer and Woden. Warriors swear on his blade."
 patron_god_rite_teiwaz_deity_01_icon:0 "$patron_god_rite_teiwaz_deity_01$"
 patron_god_rite_teiwaz_deity_01_desc:0 "The old sky god and lord of battle, whose rune is cut on spearheads. Victory goes to the side whose cause is just."
 patron_god_rite_teiwaz_deity_02_icon:0 "$patron_god_rite_teiwaz_deity_02$"
 patron_god_rite_teiwaz_deity_02_desc:0 "The god of the thing, the assembly of free men, honoured by Frisian soldiers on Hadrian's Wall. His followers speak well in council."
 patron_god_rite_norse_pagan_deity_01_icon:0 "$patron_god_rite_norse_pagan_deity_01$"
 patron_god_rite_norse_pagan_deity_01_desc:0 "Queen of Asgard and wife of Odin, who knows all fates but tells none. She guards marriages and the mothers of kings."
 patron_god_rite_norse_pagan_deity_02_icon:0 "$patron_god_rite_norse_pagan_deity_02$"
 patron_god_rite_norse_pagan_deity_02_desc:0 "The shining god, the fairest and best-loved of the Æsir, who will return after Ragnarök. Men gladly follow those he favours."
 patron_god_rite_norse_christ_deity_01_icon:0 "$patron_god_rite_norse_christ_deity_01$"
 patron_god_rite_norse_christ_deity_01_desc:0 "The White Christ, the god of the southern kings, honoured beside the old gods by those who were prime-signed. He opens doors in Christian lands."
 patron_god_rite_norse_christ_deity_02_icon:0 "$patron_god_rite_norse_christ_deity_02$"
 patron_god_rite_norse_christ_deity_02_desc:0 "Saint Michael the archangel, who weighs the souls of the dead and leads them to the hall of heaven. Warriors call on him before they fall."
 patron_god_rite_norse_war_deity_01_icon:0 "$patron_god_rite_norse_war_deity_01$"
 patron_god_rite_norse_war_deity_01_desc:0 "The choosers of the slain, who ride over the battlefield and carry the bravest to Valhalla. Warriors they watch fight without fear."
 patron_god_rite_norse_war_deity_02_icon:0 "$patron_god_rite_norse_war_deity_02$"
 patron_god_rite_norse_war_deity_02_desc:0 "The silent god, the avenger, who will tear apart the wolf at Ragnarök. His followers repay every wrong."
 patron_god_rite_nott_deity_01_icon:0 "$patron_god_rite_nott_deity_01$"
 patron_god_rite_nott_deity_01_desc:0 "Night, the dark-haired giantess who rides the horse Hrímfaxi across the sky, his bit-foam the morning dew. She hides what must stay hidden."
 patron_god_rite_nott_deity_02_icon:0 "$patron_god_rite_nott_deity_02$"
 patron_god_rite_nott_deity_02_desc:0 "The moon, brother of Sól, who steers the moon's path and is chased by the wolf Hati. He counts the months for wise men."
 patron_god_rite_ragnarok_deity_01_icon:0 "$patron_god_rite_ragnarok_deity_01$"
 patron_god_rite_ragnarok_deity_01_desc:0 "Loki's daughter, ruler of the cold hall of those who die without glory, half living and half dead. The thralls and outcasts are her people."
 patron_god_rite_ragnarok_deity_02_icon:0 "$patron_god_rite_ragnarok_deity_02$"
 patron_god_rite_ragnarok_deity_02_desc:0 "The fire giant of Múspellsheimr, who will set the world alight at the end of days. His cult longs for the burning of the old order."
 patron_god_rite_sowilo_deity_01_icon:0 "$patron_god_rite_sowilo_deity_01$"
 patron_god_rite_sowilo_deity_01_desc:0 "Sunna, the sun, who drives her horses across the sky chased by the wolf Sköll. Her warmth keeps the world tree alive."
 patron_god_rite_sowilo_deity_02_icon:0 "$patron_god_rite_sowilo_deity_02$"
 patron_god_rite_sowilo_deity_02_desc:0 "The god of time, father of the sun and moon, who gave the world its turning. His followers order their realms like the heavens."
 patron_god_rite_finnish_pagan_deity_01_icon:0 "$patron_god_rite_finnish_pagan_deity_01$"
 patron_god_rite_finnish_pagan_deity_01_desc:0 "The old man of the sky, god of thunder and of the harvest rain, highest of the Finnish gods. His cup is drunk at the spring sowing."
 patron_god_rite_finnish_pagan_deity_02_icon:0 "$patron_god_rite_finnish_pagan_deity_02$"
 patron_god_rite_finnish_pagan_deity_02_desc:0 "The bearded king of the forest, whose leave the hunter must ask. His woods give game and shelter to those who honour him."
 patron_god_rite_chumbylat_deity_01_icon:0 "$patron_god_rite_chumbylat_deity_01$"
 patron_god_rite_chumbylat_deity_01_desc:0 "Kubrat the Wolf, the hero who united the steppe tribes into a mighty khaganate and now rests on his mountain. Mari warriors pray at his stone."
 patron_god_rite_chumbylat_deity_02_icon:0 "$patron_god_rite_chumbylat_deity_02$"
 patron_god_rite_chumbylat_deity_02_desc:0 "The Great God of the Mari, who lives in the white sky and is honoured with horse sacrifice in the sacred groves."
 patron_god_rite_ilmatar_deity_01_icon:0 "$patron_god_rite_ilmatar_deity_01$"
 patron_god_rite_ilmatar_deity_01_desc:0 "The maiden of the air, who floated on the sea for seven hundred years and bore Väinämöinen. From her knee the world was made."
 patron_god_rite_ilmatar_deity_02_icon:0 "$patron_god_rite_ilmatar_deity_02$"
 patron_god_rite_ilmatar_deity_02_desc:0 "The reckless, handsome hero of the north, brought back from death by his mother's love. Those he favours are bold and admired."
 patron_god_rite_jumala_deity_01_icon:0 "$patron_god_rite_jumala_deity_01$"
 patron_god_rite_jumala_deity_01_desc:0 "The one god of the Jumala cult, who alone made the sky and all beneath it. Other gods are only names for his works."
 patron_god_rite_jumala_deity_02_icon:0 "$patron_god_rite_jumala_deity_02$"
 patron_god_rite_jumala_deity_02_desc:0 "The one god as judge, who hears every oath sworn under the open sky. His followers keep faith with their lords."
 patron_god_rite_voipel_deity_01_icon:0 "$patron_god_rite_voipel_deity_01$"
 patron_god_rite_voipel_deity_01_desc:0 "The Komi god of the night and the cold north wind, who will one day devour the world. Great fires are lit at midnight to hold him back."
 patron_god_rite_voipel_deity_02_icon:0 "$patron_god_rite_voipel_deity_02$"
 patron_god_rite_voipel_deity_02_desc:0 "The sky god of the Komi, maker of the good things of the world and brother of the trickster Omöl. He blesses the hunt and the home."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_indo_hellenic_deity_01_icon:0 "$patron_god_indo_hellenic_deity_01$"
 patron_god_indo_hellenic_deity_01_desc:0 "Athena the Defender of the People, hurling her thunderbolt on the coins of King Menander. Indo-Greek kings fight under her aegis."
 patron_god_indo_hellenic_deity_02_icon:0 "$patron_god_indo_hellenic_deity_02$"
 patron_god_indo_hellenic_deity_02_desc:0 "The hero with lion skin and club, crowning himself on the coins of Demetrios, conqueror of India. The Indians honour him as their own strong one."
 patron_god_indo_hellenic_deity_03_icon:0 "$patron_god_indo_hellenic_deity_03$"
 patron_god_indo_hellenic_deity_03_desc:0 "The wine god who conquered India in legend and founded Nysa beneath its sacred mountain. The Greeks of the Paropamisadae keep his ivy and his feasts."
 patron_god_indo_hellenic_deity_04_icon:0 "$patron_god_indo_hellenic_deity_04$"
 patron_god_indo_hellenic_deity_04_desc:0 "The radiant sun god with his crown of rays, struck on the coins of Plato of Bactria. He sees all and favours the just ruler."
 patron_god_indo_hellenic_deity_05_icon:0 "$patron_god_indo_hellenic_deity_05$"
 patron_god_indo_hellenic_deity_05_desc:0 "Winged Victory, who offers the wreath to the king on the reverse of a hundred Indo-Greek coins. She flies to the side of the bold."
 patron_god_indo_hellenic_deity_06_icon:0 "$patron_god_indo_hellenic_deity_06$"
 patron_god_indo_hellenic_deity_06_desc:0 "The city goddess of Kapisa with her turreted crown and horn of plenty, protector of cities and their markets."
 patron_god_indo_hellenic_deity_07_icon:0 "$patron_god_indo_hellenic_deity_07$"
 patron_god_indo_hellenic_deity_07_desc:0 "Apollo of the Roads, whose pillar stands by the city gate on the square coins of Apollodotos. He guards travellers and gives oracles."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_rite_hellenic_pagan_rite_deity_01_icon:0 "$patron_god_rite_hellenic_pagan_rite_deity_01$"
 patron_god_rite_hellenic_pagan_rite_deity_01_desc:0 "The earth-shaker, lord of the sea and of horses, brother of Zeus. Sailors and horsemen alike pour wine for him before setting out."
 patron_god_rite_hellenic_pagan_rite_deity_02_icon:0 "$patron_god_rite_hellenic_pagan_rite_deity_02$"
 patron_god_rite_hellenic_pagan_rite_deity_02_desc:0 "The grain mother, whose grief for Persephone brings winter and whose joy brings spring. Her mysteries at Eleusis promise a better lot after death."
 patron_god_rite_cybele_rite_deity_01_icon:0 "$patron_god_rite_cybele_rite_deity_01$"
 patron_god_rite_cybele_rite_deity_01_desc:0 "Matar Kubileya, the Great Mother of the Phrygian mountains, who rides in a chariot drawn by lions. Cities and kings shelter under her turreted crown."
 patron_god_rite_cybele_rite_deity_02_icon:0 "$patron_god_rite_cybele_rite_deity_02$"
 patron_god_rite_cybele_rite_deity_02_desc:0 "The shepherd beloved of the Great Mother, who died beneath the pine and rose again in spring. His galli priests dance in ecstasy at his feast."
 patron_god_rite_dionysos_rite_deity_01_icon:0 "$patron_god_rite_dionysos_rite_deity_01$"
 patron_god_rite_dionysos_rite_deity_01_desc:0 "The twice-born god of wine, ecstasy and the theatre, who conquered India with his maenads and satyrs. His followers drink deep and fear nothing."
 patron_god_rite_dionysos_rite_deity_02_icon:0 "$patron_god_rite_dionysos_rite_deity_02$"
 patron_god_rite_dionysos_rite_deity_02_desc:0 "The princess of Crete, abandoned on Naxos and raised to the stars as the bride of Dionysos. She leads the faithful out of every labyrinth."
 patron_god_rite_hypsistarian_rite_deity_01_icon:0 "$patron_god_rite_hypsistarian_rite_deity_01$"
 patron_god_rite_hypsistarian_rite_deity_01_desc:0 "The Most High God, worshipped without images under the open sky by Greeks and Jews alike. His followers keep lamps burning and pray at dawn."
 patron_god_rite_hypsistarian_rite_deity_02_icon:0 "$patron_god_rite_hypsistarian_rite_deity_02$"
 patron_god_rite_hypsistarian_rite_deity_02_desc:0 "The Holy and Just, the messenger of the Most High in the Phrygian hills, to whom vows and confessions are made. He keeps his worshippers honest."
 patron_god_rite_alexandros_rite_deity_01_icon:0 "$patron_god_rite_alexandros_rite_deity_01$"
 patron_god_rite_alexandros_rite_deity_01_desc:0 "Megas Alexandros, son of Ammon, the god-king who carried Hellas to the edge of the world. Kings who follow him dream of conquest."
 patron_god_rite_alexandros_rite_deity_02_icon:0 "$patron_god_rite_alexandros_rite_deity_02$"
 patron_god_rite_alexandros_rite_deity_02_desc:0 "The beloved companion of Alexandros, honoured as a divine hero at his command. Friends and companions stay loyal to those he favours."
 patron_god_rite_solomonic_alexandros_rite_deity_01_icon:0 "$patron_god_rite_solomonic_alexandros_rite_deity_01$"
 patron_god_rite_solomonic_alexandros_rite_deity_01_desc:0 "Alexandros as the wise king of the Ethiopian tradition, heir of Solomon, who judges with justice and builds with wisdom."
 patron_god_rite_solomonic_alexandros_rite_deity_02_icon:0 "$patron_god_rite_solomonic_alexandros_rite_deity_02$"
 patron_god_rite_solomonic_alexandros_rite_deity_02_desc:0 "The Queen of Sheba, who came to Solomon with gold and spices and bore him the first king of Aksum. Her line rules by right."
 patron_god_rite_celtic_pagan_deity_01_icon:0 "$patron_god_rite_celtic_pagan_deity_01$"
 patron_god_rite_celtic_pagan_deity_01_desc:0 "Nuada of the Silver Hand, first king of the Tuatha Dé, who lost his arm in battle and ruled again when it was remade. He rewards kings who keep their honour."
 patron_god_rite_celtic_pagan_deity_02_icon:0 "$patron_god_rite_celtic_pagan_deity_02$"
 patron_god_rite_celtic_pagan_deity_02_desc:0 "The good god, father of the tribe, whose cauldron never empties and whose club kills with one end and revives with the other."
 patron_god_rite_endovellico_deity_01_icon:0 "$patron_god_rite_endovellico_deity_01$"
 patron_god_rite_endovellico_deity_01_desc:0 "The god of health and safety of Lusitania, worshipped in his sanctuary on the hill of São Miguel, who answers in dreams."
 patron_god_rite_endovellico_deity_02_icon:0 "$patron_god_rite_endovellico_deity_02$"
 patron_god_rite_endovellico_deity_02_desc:0 "The goddess of spring and rebirth of the Lusitanians, given goats in her shrine by the Guadiana. She brings back what was lost."
 patron_god_rite_martinianism_deity_01_icon:0 "$patron_god_rite_martinianism_deity_01$"
 patron_god_rite_martinianism_deity_01_desc:0 "The soldier of Tours who cut his cloak in half for a beggar and became the bishop the Britons and Franks honour above all. His shrine heals and protects."
 patron_god_rite_martinianism_deity_02_icon:0 "$patron_god_rite_martinianism_deity_02$"
 patron_god_rite_martinianism_deity_02_desc:0 "The bishop of Auxerre who came to Britain, out-argued its heretics and led the Britons to the Alleluia victory without a blow."
 patron_god_rite_lugh_deity_01_icon:0 "$patron_god_rite_lugh_deity_01$"
 patron_god_rite_lugh_deity_01_desc:0 "Lugh's foster-mother, who cleared the plains of Ireland for farming and died of the labour. Lugh founded the great games and fair in her honour."
 patron_god_rite_celtic_christ_deity_01_icon:0 "$patron_god_rite_celtic_christ_deity_01$"
 patron_god_rite_celtic_christ_deity_01_desc:0 "The Briton taken as a slave to Ireland, who returned to bring Christ to the Gaels and drove out the serpents. Kings convert at his word."
 patron_god_rite_celtic_christ_deity_02_icon:0 "$patron_god_rite_celtic_christ_deity_02$"
 patron_god_rite_celtic_christ_deity_02_desc:0 "The abbess of Kildare, keeper of the holy flame and patron of poets, smiths and healers, who shares the name and gifts of the old goddess."
 patron_god_rite_roman_pagan_deity_01_icon:0 "$patron_god_rite_roman_pagan_deity_01$"
 patron_god_rite_roman_pagan_deity_01_desc:0 "The goddess of the hearth, whose fire in the Forum is kept burning by the Vestal Virgins. While it burns, Rome stands."
 patron_god_rite_roman_pagan_deity_02_icon:0 "$patron_god_rite_roman_pagan_deity_02$"
 patron_god_rite_roman_pagan_deity_02_desc:0 "The two-faced god of beginnings, gates and passages, whose temple doors stand open in war and closed in peace. He opens every undertaking."
 patron_god_rite_roman_caesar_cult_rite_deity_01_icon:0 "$patron_god_rite_roman_caesar_cult_rite_deity_01$"
 patron_god_rite_roman_caesar_cult_rite_deity_01_desc:0 "The first emperor, raised among the gods by the Senate, whose priests the Augustales tend his cult in every city of the empire."
 patron_god_rite_roman_caesar_cult_rite_deity_02_icon:0 "$patron_god_rite_roman_caesar_cult_rite_deity_02$"
 patron_god_rite_roman_caesar_cult_rite_deity_02_desc:0 "The goddess Rome herself, helmeted and enthroned, worshipped beside the emperors in the temples of the provinces."
 patron_god_rite_roman_jupiter_rite_deity_01_icon:0 "$patron_god_rite_roman_jupiter_rite_deity_01$"
 patron_god_rite_roman_jupiter_rite_deity_01_desc:0 "Winged Victory, who stood in the Senate house and crowns the emperor's triumphs. Generals sacrifice to her before battle."
 patron_god_rite_mithras_rite_deity_01_icon:0 "$patron_god_rite_mithras_rite_deity_01$"
 patron_god_rite_mithras_rite_deity_01_desc:0 "Mithras the bull-slayer, born from the rock, whose sacrifice in the cave brought life to the world. Soldiers rise through his seven grades."
 patron_god_rite_mithras_rite_deity_02_icon:0 "$patron_god_rite_mithras_rite_deity_02$"
 patron_god_rite_mithras_rite_deity_02_desc:0 "The torch-bearer with the lowered torch, twin of Cautes, the setting sun and the death that comes before rebirth."
 patron_god_rite_mithras_christ_deity_01_icon:0 "$patron_god_rite_mithras_christ_deity_01$"
 patron_god_rite_mithras_christ_deity_01_desc:0 "Christ as the slayer of the bull, whose blood washes the faithful clean, as the Tauraimanians teach. His soldiers fear no death."
 patron_god_rite_mithras_christ_deity_02_icon:0 "$patron_god_rite_mithras_christ_deity_02$"
 patron_god_rite_mithras_christ_deity_02_desc:0 "The soldier saint of Lydda, martyred for refusing to sacrifice, who slew the dragon. The army's own saint among the Tauraimanians."
 patron_god_rite_mani_mithras_deity_01_icon:0 "$patron_god_rite_mani_mithras_deity_01$"
 patron_god_rite_mani_mithras_deity_01_desc:0 "The prophet of light from Babylon, who taught that Buddha, Zoroaster and Jesus were his forerunners. The Theomachians count Mithras among his messengers."
 patron_god_rite_mani_mithras_deity_02_icon:0 "$patron_god_rite_mani_mithras_deity_02$"
 patron_god_rite_mani_mithras_deity_02_desc:0 "The first son of the Father of Greatness, who went down armed with light to fight the darkness and was swallowed by it, to be saved."
 patron_god_rite_mithras_sol_deity_01_icon:0 "$patron_god_rite_mithras_sol_deity_01$"
 patron_god_rite_mithras_sol_deity_01_desc:0 "The Lightbringer, the morning star in which Mithras and Sol become one, who leads the day out of night."
 patron_god_rite_mithras_sol_deity_02_icon:0 "$patron_god_rite_mithras_sol_deity_02$"
 patron_god_rite_mithras_sol_deity_02_desc:0 "The evening star, twin of Eosphoros, who guards the soul through the dark until the dawn returns."
 patron_god_rite_tengri_pagan_deity_01_icon:0 "$patron_god_rite_tengri_pagan_deity_01$"
 patron_god_rite_tengri_pagan_deity_01_desc:0 "The eternal blue sky, father of all, who grants the khan his heavenly mandate. Those he favours rule the steppe."
 patron_god_rite_tengri_pagan_deity_02_icon:0 "$patron_god_rite_tengri_pagan_deity_02$"
 patron_god_rite_tengri_pagan_deity_02_desc:0 "The sacred forest-mountain of the Turks, seat of the khagans, whose spirit holds the land together. Who holds Ötüken holds the realm."
 patron_god_rite_tengri_rod_deity_01_icon:0 "$patron_god_rite_tengri_rod_deity_01$"
 patron_god_rite_tengri_rod_deity_01_desc:0 "The Celestial Rod, creator of the world, in whom the Slavic ancestor and the Turkic sky are one god."
 patron_god_rite_tengri_rod_deity_02_icon:0 "$patron_god_rite_tengri_rod_deity_02$"
 patron_god_rite_tengri_rod_deity_02_desc:0 "The Slavic mother of moist earth and spinner of fate, honoured by the Rod Tanri faithful as the Sky's bride."
 patron_god_rite_tengri_ahriman_deity_01_icon:0 "$patron_god_rite_tengri_ahriman_deity_01$"
 patron_god_rite_tengri_ahriman_deity_01_desc:0 "The god who schemes to overturn the corrupted order of the world, as his cult teaches. His followers plot and strike from the dark."
 patron_god_rite_tengri_ahriman_deity_02_icon:0 "$patron_god_rite_tengri_ahriman_deity_02$"
 patron_god_rite_tengri_ahriman_deity_02_desc:0 "The demon of greed and desire, the hunger that is never filled. Those who serve her take what they want."
 patron_god_rite_tengri_mani_deity_01_icon:0 "$patron_god_rite_tengri_mani_deity_01$"
 patron_god_rite_tengri_mani_deity_01_desc:0 "The luminous sun god of the Turks, joined with the Manichaean Light. His warmth drives back the darkness of the world."
 patron_god_rite_tengri_mani_deity_02_icon:0 "$patron_god_rite_tengri_mani_deity_02$"
 patron_god_rite_tengri_mani_deity_02_desc:0 "The prophet of light, whose faith the Uyghur khagans made their own. His elect are learned and teach peace."
 patron_god_rite_vattisenyaly_deity_01_icon:0 "$patron_god_rite_vattisenyaly_deity_01$"
 patron_god_rite_vattisenyaly_deity_01_desc:0 "The supreme sky god of the Bolgars and Chuvash, to whom white animals are sacrificed in the sacred grove. He keeps the ancestral ways."
 patron_god_rite_vattisenyaly_deity_02_icon:0 "$patron_god_rite_vattisenyaly_deity_02$"
 patron_god_rite_vattisenyaly_deity_02_desc:0 "The god who measures out each person's fate and family, honoured at weddings and births. Those he favours have many children."
 patron_god_rite_tengri_bud_deity_01_icon:0 "$patron_god_rite_tengri_bud_deity_01$"
 patron_god_rite_tengri_bud_deity_01_desc:0 "The Enlightened Sky Father, of whom the historical Buddha was an earthly manifestation. He grants calm and wisdom."
 patron_god_rite_tengri_bud_deity_02_icon:0 "$patron_god_rite_tengri_bud_deity_02$"
 patron_god_rite_tengri_bud_deity_02_desc:0 "The coming Buddha, who waits in heaven to descend and renew the world. His faithful prepare the way for him."
 patron_god_rite_tengri_confucian_deity_01_icon:0 "$patron_god_rite_tengri_confucian_deity_01$"
 patron_god_rite_tengri_confucian_deity_01_desc:0 "Confucius as the divine sage and prophet of the Sky, whose teaching orders family and state alike."
 patron_god_rite_tengri_confucian_deity_02_icon:0 "$patron_god_rite_tengri_confucian_deity_02$"
 patron_god_rite_tengri_confucian_deity_02_desc:0 "The second sage, who taught that the people are the root of the state and that Heaven sees through the people's eyes."
 patron_god_rite_erlik_deity_01_icon:0 "$patron_god_rite_erlik_deity_01$"
 patron_god_rite_erlik_deity_01_desc:0 "The Black Khan of the underworld, Erlik's dark lieutenant, who sends sickness and takes the souls of the dead below."
 patron_god_rite_neoplato_deity_01_icon:0 "$patron_god_rite_neoplato_deity_01$"
 patron_god_rite_neoplato_deity_01_desc:0 "The porter of Alexandria who taught Plotinus and Origen, and wrote nothing, so that his teaching passed only from mouth to ear."
 patron_god_rite_neoplato_deity_02_icon:0 "$patron_god_rite_neoplato_deity_02$"
 patron_god_rite_neoplato_deity_02_desc:0 "The last head of the Academy of Athens, who led its philosophers into exile in Persia rather than abandon their teaching."
 patron_god_rite_plato_pythagorean_deity_01_icon:0 "$patron_god_rite_plato_pythagorean_deity_01$"
 patron_god_rite_plato_pythagorean_deity_01_desc:0 "The wandering Pythagorean sage, healer and wonder-worker, who travelled to the Brahmins of India and raised the dead."
 patron_god_rite_porphyryan_deity_01_icon:0 "$patron_god_rite_porphyryan_deity_01$"
 patron_god_rite_porphyryan_deity_01_desc:0 "The philosopher who wrote the True Word against the Christians, defending the old gods with reason and wit."
 patron_god_rite_plato_christ_deity_01_icon:0 "$patron_god_rite_plato_christ_deity_01$"
 patron_god_rite_plato_christ_deity_01_desc:0 "The bishop of Hippo who read the Platonists before he read Paul, and built the City of God from both."
 patron_god_rite_plato_christ_deity_02_icon:0 "$patron_god_rite_plato_christ_deity_02$"
 patron_god_rite_plato_christ_deity_02_desc:0 "The Alexandrian teacher, pupil of Ammonius, who read Scripture as Plato read the world: as a ladder of meanings up to God."
 patron_god_rite_plato_islam_deity_01_icon:0 "$patron_god_rite_plato_islam_deity_01$"
 patron_god_rite_plato_islam_deity_01_desc:0 "The philosopher of the Arabs, who brought Greek learning to Baghdad and taught that truth is welcome from whatever people it comes."
 patron_god_rite_plato_islam_deity_02_icon:0 "$patron_god_rite_plato_islam_deity_02$"
 patron_god_rite_plato_islam_deity_02_desc:0 "The Second Teacher after Aristotle, who wrote of the Virtuous City ruled by a philosopher-prophet."
 patron_god_rite_plato_hindu_deity_01_icon:0 "$patron_god_rite_plato_hindu_deity_01$"
 patron_god_rite_plato_hindu_deity_01_desc:0 "The Academy-trained guru who set Advaita Vedanta in the frame of the One, teaching that the self and the absolute are not two."
 patron_god_rite_plato_hindu_deity_02_icon:0 "$patron_god_rite_plato_hindu_deity_02$"
 patron_god_rite_plato_hindu_deity_02_desc:0 "The teacher of Shankara's teacher, whose verses on the Mandukya taught that nothing was ever truly born."
 patron_god_rite_zal_deity_01_icon:0 "$patron_god_rite_zal_deity_01$"
 patron_god_rite_zal_deity_01_desc:0 "The Getic god of storm and lightning, at whom the Getae shoot arrows when it thunders, to show they know no god but theirs."
 patron_god_rite_zal_deity_02_icon:0 "$patron_god_rite_zal_deity_02$"
 patron_god_rite_zal_deity_02_desc:0 "The first and greatest king of the Dacians, who united the tribes with Deceneus at his side and made Rome afraid."
 patron_god_rite_zal_mani_deity_01_icon:0 "$patron_god_rite_zal_mani_deity_01$"
 patron_god_rite_zal_mani_deity_01_desc:0 "The chosen warrior thrown upon the spears every fifth year to carry the people's wishes to Zalmoxis. The Twice-Born seek his death in battle."
 patron_god_rite_zal_mani_deity_02_icon:0 "$patron_god_rite_zal_mani_deity_02$"
 patron_god_rite_zal_mani_deity_02_desc:0 "The prophet of light, whose Gnostic teaching the Apogenesianists joined to the promise of Zalmoxis."
 patron_god_rite_zal_christ_deity_01_icon:0 "$patron_god_rite_zal_christ_deity_01$"
 patron_god_rite_zal_christ_deity_01_desc:0 "The high priest and lawgiver of the Dacians, who taught them philosophy and the stars, and through whom Zalmoxis still speaks."
 patron_god_rite_zal_christ_deity_02_icon:0 "$patron_god_rite_zal_christ_deity_02$"
 patron_god_rite_zal_christ_deity_02_desc:0 "The apostle of Scythia, who preached by the Danube and the Black Sea, brother of Peter. The Decaeneists honour him as Zalmoxis' herald."
 patron_god_rite_alekjendaravism_deity_01_icon:0 "$patron_god_rite_alekjendaravism_deity_01$"
 patron_god_rite_alekjendaravism_deity_01_desc:0 "Vishnu's avatar with the conch and the wheel, struck on the coins of King Agathocles. The cowherd god is a king's counsellor in war."
 patron_god_rite_alekjendaravism_deity_02_icon:0 "$patron_god_rite_alekjendaravism_deity_02$"
 patron_god_rite_alekjendaravism_deity_02_desc:0 "Krishna's elder brother, the ploughman with the club, struck beside him on the Greek kings' coins. He gives strength and harvest."
 patron_god_rite_indohelen_deity_01_icon:0 "$patron_god_rite_indohelen_deity_01$"
 patron_god_rite_indohelen_deity_01_desc:0 "Zeus the All-Destroyer, creator and destroyer of worlds, the Most High who exists in all things, as the Pantoléteirans teach."
 patron_god_rite_indohelen_deity_02_icon:0 "$patron_god_rite_indohelen_deity_02$"
 patron_god_rite_indohelen_deity_02_desc:0 "The roaring archer of the storm, the fierce face of the All-Destroyer, who heals as well as he harms."
 patron_god_rite_indoh_zor_deity_01_icon:0 "$patron_god_rite_indoh_zor_deity_01$"
 patron_god_rite_indoh_zor_deity_01_desc:0 "Mithra as the Bactrian Greeks and Kushans knew him, the radiant god of the covenant on the kings' coins. He binds vassals to their oaths."
 patron_god_rite_indoh_zor_deity_02_icon:0 "$patron_god_rite_indoh_zor_deity_02$"
 patron_god_rite_indoh_zor_deity_02_desc:0 "The wind god of Bactria, running with his cloak billowing on the Kushan coins. Riders and messengers travel fast under him."
 patron_god_rite_sindh_indohelen_deity_01_icon:0 "$patron_god_rite_sindh_indohelen_deity_01$"
 patron_god_rite_sindh_indohelen_deity_01_desc:0 "The king of the devas, wielder of the thunderbolt, honoured by the Greek kings of the Indus as their own Zeus."
 patron_god_rite_sindh_indohelen_deity_02_icon:0 "$patron_god_rite_sindh_indohelen_deity_02$"
 patron_god_rite_sindh_indohelen_deity_02_desc:0 "The goddess of fortune and plenty, standing on the lotus on the coins of the Indo-Greeks. She fills the treasury of the righteous."
 patron_god_rite_bud_zor_deity_01_icon:0 "$patron_god_rite_bud_zor_deity_01$"
 patron_god_rite_bud_zor_deity_01_desc:0 "The coming Buddha, awaited by the horse-lords and the Greek monks alike, who will teach the Dharma anew."
 patron_god_rite_bud_zor_deity_02_icon:0 "$patron_god_rite_bud_zor_deity_02$"
 patron_god_rite_bud_zor_deity_02_desc:0 "The god of royal glory, the khvarenah that shines on the rightful king, holding fire and purse on the Kushan coins."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_rite_solar_imperial_rite_deity_01_icon:0 "$patron_god_rite_solar_imperial_rite_deity_01$"
 patron_god_rite_solar_imperial_rite_deity_01_desc:0 "The Sun as the emperor of heaven, of whom the emperor on earth is the living image. All authority flows from his throne."
 patron_god_rite_solar_imperial_rite_deity_02_icon:0 "$patron_god_rite_solar_imperial_rite_deity_02$"
 patron_god_rite_solar_imperial_rite_deity_02_desc:0 "Constantine, the emperor who saw the sign of the Sun before the battle at the Milvian Bridge and was raised among the gods at his death."
 patron_god_rite_sol_invictus_rite_deity_01_icon:0 "$patron_god_rite_sol_invictus_rite_deity_01$"
 patron_god_rite_sol_invictus_rite_deity_01_desc:0 "The Sun as the emperor's companion, Soli Invicto Comiti on the coins, who stands beside the ruler in every campaign."
 patron_god_rite_sol_invictus_rite_deity_02_icon:0 "$patron_god_rite_sol_invictus_rite_deity_02$"
 patron_god_rite_sol_invictus_rite_deity_02_desc:0 "The Moon, sister of the Sun, who drives her two-horse chariot through the night and rules the tides and the months."
 patron_god_rite_sol_christ_rite_deity_01_icon:0 "$patron_god_rite_sol_christ_rite_deity_01$"
 patron_god_rite_sol_christ_rite_deity_01_desc:0 "Christ as the true Sun of the world, driving his chariot across the sky as in the mosaic beneath Saint Peter's. The Helianists know no other sun."
 patron_god_rite_sol_christ_rite_deity_02_icon:0 "$patron_god_rite_sol_christ_rite_deity_02$"
 patron_god_rite_sol_christ_rite_deity_02_desc:0 "The Baptist, the morning star who went before the Sun, honoured at midsummer as Christ is at midwinter."
 patron_god_rite_sol_victor_rite_deity_01_icon:0 "$patron_god_rite_sol_victor_rite_deity_01$"
 patron_god_rite_sol_victor_rite_deity_01_desc:0 "Christ the conqueror under the sign of the Sun, the war-god of the Constantinid line and its legions."
 patron_god_rite_sol_victor_rite_deity_02_icon:0 "$patron_god_rite_sol_victor_rite_deity_02$"
 patron_god_rite_sol_victor_rite_deity_02_desc:0 "The first martyr of Britain, a soldier who took the place of a hunted priest. The Sarmato-Briton legions carry his banner."
 patron_god_rite_sol_apollo_rite_deity_01_icon:0 "$patron_god_rite_sol_apollo_rite_deity_01$"
 patron_god_rite_sol_apollo_rite_deity_01_desc:0 "Apollo as the one Sun, the god of light, music and prophecy whom the Apollonians worship above all others."
 patron_god_rite_sol_apollo_rite_deity_02_icon:0 "$patron_god_rite_sol_apollo_rite_deity_02$"
 patron_god_rite_sol_apollo_rite_deity_02_desc:0 "The son of Apollo, the healer of Epidaurus and Pergamon, whose serpent staff cures the sick who sleep in his temples."
 patron_god_rite_sol_boreas_rite_deity_01_icon:0 "$patron_god_rite_sol_boreas_rite_deity_01$"
 patron_god_rite_sol_boreas_rite_deity_01_desc:0 "The north wind, the Devouring One, adopted by the Bosporan kings as the cruel side of the Sun. Their enemies freeze before him."
 patron_god_rite_sol_boreas_rite_deity_02_icon:0 "$patron_god_rite_sol_boreas_rite_deity_02$"
 patron_god_rite_sol_boreas_rite_deity_02_desc:0 "Achilles as lord of the Black Sea, worshipped on the White Island by sailors and the Greek cities of the north coast."
 patron_god_rite_sol_mani_rite_deity_01_icon:0 "$patron_god_rite_sol_mani_rite_deity_01$"
 patron_god_rite_sol_mani_rite_deity_01_desc:0 "The God of Light, Sol Invictus in Manichaean fashion, who struggles against Ahriman to free the light trapped in the world."
 patron_god_rite_sol_mani_rite_deity_02_icon:0 "$patron_god_rite_sol_mani_rite_deity_02$"
 patron_god_rite_sol_mani_rite_deity_02_desc:0 "The demiurge who made the sun and moon as ships to carry the freed light back to its source."
 patron_god_rite_sol_norse_rite_deity_01_icon:0 "$patron_god_rite_sol_norse_rite_deity_01$"
 patron_god_rite_sol_norse_rite_deity_01_desc:0 "Odin as the Sun, patron of rulers, whom the Varangian captains brought home from the Roman court. His one eye is the sun in the sky."
 patron_god_rite_sol_norse_rite_deity_02_icon:0 "$patron_god_rite_sol_norse_rite_deity_02$"
 patron_god_rite_sol_norse_rite_deity_02_desc:0 "Day, who rides the horse Skinfaxi across the sky, his shining mane lighting the earth. Men work and fight in his light."
 patron_god_rite_sol_slav_rite_deity_01_icon:0 "$patron_god_rite_sol_slav_rite_deity_01$"
 patron_god_rite_sol_slav_rite_deity_01_desc:0 "The solar disc, who crosses the sky by day and fights the monsters under the earth by night, to rise again each morning."
 patron_god_rite_sol_slav_rite_deity_02_icon:0 "$patron_god_rite_sol_slav_rite_deity_02$"
 patron_god_rite_sol_slav_rite_deity_02_desc:0 "The two Dawn maidens who open the gates of the Sun's palace in the morning and close them at night."
 patron_god_rite_sol_sahara_rite_deity_01_icon:0 "$patron_god_rite_sol_sahara_rite_deity_01$"
 patron_god_rite_sol_sahara_rite_deity_01_desc:0 "The Sun of the Fur, red over the desert, whose cult the pale strangers in ornate dress brought to the early Fur."
 patron_god_rite_sol_sahara_rite_deity_02_icon:0 "$patron_god_rite_sol_sahara_rite_deity_02$"
 patron_god_rite_sol_sahara_rite_deity_02_desc:0 "The holy mountain of the Fur, whose springs and crater lakes give water in the desert. Its people never go thirsty."
 patron_god_rite_sol_tsahay_rite_deity_01_icon:0 "$patron_god_rite_sol_tsahay_rite_deity_01$"
 patron_god_rite_sol_tsahay_rite_deity_01_desc:0 "Maḥrem the war god of Aksum crowned with the rays of the Sun, worshipped in the manner of Sol Invictus."
 patron_god_rite_sol_tsahay_rite_deity_02_icon:0 "$patron_god_rite_sol_tsahay_rite_deity_02$"
 patron_god_rite_sol_tsahay_rite_deity_02_desc:0 "The Aksumite god of the land and the sea, named beside Astar and Maḥrem in the kings' oaths. He keeps the trade of the Red Sea."
 patron_god_rite_sol_islam_rite_deity_01_icon:0 "$patron_god_rite_sol_islam_rite_deity_01$"
 patron_god_rite_sol_islam_rite_deity_01_desc:0 "The Light of the heavens and the earth, as the Shamsiyyah read the verse of light: the one God shining through the sun."
 patron_god_rite_sol_islam_rite_deity_02_icon:0 "$patron_god_rite_sol_islam_rite_deity_02$"
 patron_god_rite_sol_islam_rite_deity_02_desc:0 "The caliph who joined the spiritual traditions of Judaea under one light and founded the Shamsiyyah. Rulers follow his statecraft."
 patron_god_rite_vaishnavism_deity_01_icon:0 "$patron_god_rite_vaishnavism_deity_01$"
 patron_god_rite_vaishnavism_deity_01_desc:0 "The preserver, who sleeps on the serpent Shesha and descends to the world as his avatars whenever dharma declines."
 patron_god_rite_vaishnavism_deity_02_icon:0 "$patron_god_rite_vaishnavism_deity_02$"
 patron_god_rite_vaishnavism_deity_02_desc:0 "The king of birds and Vishnu's mount, enemy of serpents, whose banner flies over the Gupta kings."
 patron_god_rite_krishnaism_deity_01_icon:0 "$patron_god_rite_krishnaism_deity_01$"
 patron_god_rite_krishnaism_deity_01_desc:0 "The dark cowherd of Vrindavan and charioteer of Arjuna, who taught the Gita on the battlefield of Kurukshetra."
 patron_god_rite_krishnaism_deity_02_icon:0 "$patron_god_rite_krishnaism_deity_02$"
 patron_god_rite_krishnaism_deity_02_desc:0 "The beloved of Krishna, whose longing for him is the soul's longing for God. Her devotees are loving and loved."
 patron_god_rite_shaivism_deity_01_icon:0 "$patron_god_rite_shaivism_deity_01$"
 patron_god_rite_shaivism_deity_01_desc:0 "The destroyer and ascetic of Mount Kailash, lord of the dance, whose third eye burns away illusion."
 patron_god_rite_shaivism_deity_02_icon:0 "$patron_god_rite_shaivism_deity_02$"
 patron_god_rite_shaivism_deity_02_desc:0 "The daughter of the mountain, who won Shiva by her austerities. She is the mother of Ganesha and Skanda."
 patron_god_rite_advaitism_deity_01_icon:0 "$patron_god_rite_advaitism_deity_01$"
 patron_god_rite_advaitism_deity_01_desc:0 "Shiva as the silent teacher under the banyan tree, who teaches the sages by silence that the self and Brahman are one."
 patron_god_rite_advaitism_deity_02_icon:0 "$patron_god_rite_advaitism_deity_02$"
 patron_god_rite_advaitism_deity_02_desc:0 "The white bull at Shiva's gate, the gatekeeper and first of his devotees. Those who wait as he waits are rewarded."
 patron_god_rite_srikula_shaktism_deity_01_icon:0 "$patron_god_rite_srikula_shaktism_deity_01$"
 patron_god_rite_srikula_shaktism_deity_01_desc:0 "The beautiful goddess of the three worlds, enthroned on the Sri Chakra, whose play is the creation itself."
 patron_god_rite_srikula_shaktism_deity_02_icon:0 "$patron_god_rite_srikula_shaktism_deity_02$"
 patron_god_rite_srikula_shaktism_deity_02_desc:0 "The queen of the worlds, whose body is the universe and who holds the noose and the goad over all that lives."
 patron_god_rite_kalikula_shaktism_deity_01_icon:0 "$patron_god_rite_kalikula_shaktism_deity_01$"
 patron_god_rite_kalikula_shaktism_deity_01_desc:0 "The black goddess of time and death, garlanded with skulls, who drank the blood of the demon Raktabija. Her enemies fear her."
 patron_god_rite_kalikula_shaktism_deity_02_icon:0 "$patron_god_rite_kalikula_shaktism_deity_02$"
 patron_god_rite_kalikula_shaktism_deity_02_desc:0 "The fierce goddess who slew the demons Chanda and Munda, worshipped in the cremation grounds."
 patron_god_rite_smartism_deity_01_icon:0 "$patron_god_rite_smartism_deity_01$"
 patron_god_rite_smartism_deity_01_desc:0 "The invincible goddess riding the lion, made from the radiance of all the gods to slay the buffalo demon Mahishasura."
 patron_god_rite_smartism_deity_02_icon:0 "$patron_god_rite_smartism_deity_02$"
 patron_god_rite_smartism_deity_02_desc:0 "Skanda, the six-faced son of Shiva and general of the gods' army, riding his peacock into battle."
 patron_god_rite_saura_deity_01_icon:0 "$patron_god_rite_saura_deity_01$"
 patron_god_rite_saura_deity_01_desc:0 "The sun god in his chariot of seven horses, worshipped at Multan and Konark, who heals the sick and sees all deeds."
 patron_god_rite_saura_deity_02_icon:0 "$patron_god_rite_saura_deity_02$"
 patron_god_rite_saura_deity_02_desc:0 "The dawn, Surya's lover, who drives away the darkness and wakes every creature, hymned in the oldest songs of the Veda."
 patron_god_rite_mazdayasna_deity_01_icon:0 "$patron_god_rite_mazdayasna_deity_01$"
 patron_god_rite_mazdayasna_deity_01_desc:0 "The Wise Lord, creator of all that is good, whose holy fire burns in every temple of the Good Religion."
 patron_god_rite_mazdayasna_deity_02_icon:0 "$patron_god_rite_mazdayasna_deity_02$"
 patron_god_rite_mazdayasna_deity_02_desc:0 "The prophet who heard the Wise Lord and sang the Gathas, teaching good thoughts, good words and good deeds."
 patron_god_rite_zor_hindu_deity_01_icon:0 "$patron_god_rite_zor_hindu_deity_01$"
 patron_god_rite_zor_hindu_deity_01_desc:0 "The Vedic fire god, the sacred flame that carries offerings to the gods, honoured by the Parsikasa as the Indian face of Atar."
 patron_god_rite_zor_hindu_deity_02_icon:0 "$patron_god_rite_zor_hindu_deity_02$"
 patron_god_rite_zor_hindu_deity_02_desc:0 "The Vedic lord of cosmic order and the waters, the Asura whom the Parsikasa know as the Ahura."
 patron_god_rite_zor_angra_deity_01_icon:0 "$patron_god_rite_zor_angra_deity_01$"
 patron_god_rite_zor_angra_deity_01_desc:0 "The Destructive Spirit, who his cult believes will cover the world in darkness and reward those who served him."
 patron_god_rite_zor_angra_deity_02_icon:0 "$patron_god_rite_zor_angra_deity_02$"
 patron_god_rite_zor_angra_deity_02_desc:0 "The demon of wrath and fury, wielder of the bloody club, who drives men to violence."
 patron_god_rite_zurvanism_deity_01_icon:0 "$patron_god_rite_zurvanism_deity_01$"
 patron_god_rite_zurvanism_deity_01_desc:0 "Infinite Time, the father of both Ohrmazd and Ahriman, who gave the world nine thousand years of mixture."
 patron_god_rite_zurvanism_deity_02_icon:0 "$patron_god_rite_zurvanism_deity_02$"
 patron_god_rite_zurvanism_deity_02_desc:0 "The wind and the space between light and darkness, the warrior god through whom every soul must pass after death."
 patron_god_rite_gayomarthianism_deity_01_icon:0 "$patron_god_rite_gayomarthianism_deity_01$"
 patron_god_rite_gayomarthianism_deity_01_desc:0 "The first man, the mortal of life, from whose seed the human race grew. The kings of Iran trace their line to him."
 patron_god_rite_gayomarthianism_deity_02_icon:0 "$patron_god_rite_gayomarthianism_deity_02$"
 patron_god_rite_gayomarthianism_deity_02_desc:0 "The first couple, who grew from the earth as a rhubarb plant from Gayomart's seed. Families honour them at every wedding."
 patron_god_rite_khurmazta_deity_01_icon:0 "$patron_god_rite_khurmazta_deity_01$"
 patron_god_rite_khurmazta_deity_01_desc:0 "Ohrmazd as the Sogdians call him, lord of the gods, painted on the walls of Panjikent beside Nana."
 patron_god_rite_khurmazta_deity_02_icon:0 "$patron_god_rite_khurmazta_deity_02$"
 patron_god_rite_khurmazta_deity_02_desc:0 "The four-armed goddess of Sogdia riding her lion, holding the sun and the moon, mistress of Panjikent's great temple."
 patron_god_rite_mazdakism_deity_01_icon:0 "$patron_god_rite_mazdakism_deity_01$"
 patron_god_rite_mazdakism_deity_01_desc:0 "The reformer who taught that envy and greed are the root of all evil and that the goods of the earth should be shared."
 patron_god_rite_mazdakism_deity_02_icon:0 "$patron_god_rite_mazdakism_deity_02$"
 patron_god_rite_mazdakism_deity_02_desc:0 "The shahanshah who took up Mazdak's cause, broke the power of the great houses and fed the poor in the great famine."
 patron_god_rite_khurramism_deity_01_icon:0 "$patron_god_rite_khurramism_deity_01$"
 patron_god_rite_khurramism_deity_01_desc:0 "The red-banner rebel of Azerbaijan who held the mountains against the caliphs for twenty years. His followers never yield."
 patron_god_rite_khurramism_deity_02_icon:0 "$patron_god_rite_khurramism_deity_02$"
 patron_god_rite_khurramism_deity_02_desc:0 "The general who raised the black banners in Khorasan, whom the Khurramites believe never died and will return."
 patron_god_rite_urartuism_deity_01_icon:0 "$patron_god_rite_urartuism_deity_01$"
 patron_god_rite_urartuism_deity_01_desc:0 "The great god of Urartu, the warrior on the lion, to whom the kings of Van dedicated their conquests at Musasir."
 patron_god_rite_urartuism_deity_02_icon:0 "$patron_god_rite_urartuism_deity_02$"
 patron_god_rite_urartuism_deity_02_desc:0 "The storm god of Urartu, standing on a bull with lightning in his hands, guardian of the fortress Teishebaini."
 patron_god_rite_afridunism_deity_01_icon:0 "$patron_god_rite_afridunism_deity_01$"
 patron_god_rite_afridunism_deity_01_desc:0 "The prophet of Khwaf who returned from China with a shirt of fine green silk and taught seven daily prayers. His followers are devout."
 patron_god_rite_afridunism_deity_02_icon:0 "$patron_god_rite_afridunism_deity_02$"
 patron_god_rite_afridunism_deity_02_desc:0 "The hero-king who chained the serpent-king Zahhak under Mount Damavand and divided the world among his three sons."
 patron_god_rite_illyrian_pagan_deity_01_icon:0 "$patron_god_rite_illyrian_pagan_deity_01$"
 patron_god_rite_illyrian_pagan_deity_01_desc:0 "The goddess of the hunt and of the forests, honoured with Vidasus in the springs and woods of Pannonia and Dalmatia."
 patron_god_rite_illyrian_pagan_deity_02_icon:0 "$patron_god_rite_illyrian_pagan_deity_02$"
 patron_god_rite_illyrian_pagan_deity_02_desc:0 "The Liburnian goddess of the waters and springs, whose healing sanctuary lay at Flanona by the sea."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_christian_deity_01_icon:0 "$patron_god_christian_deity_01$"
 patron_god_christian_deity_01_desc:0 "Mary, the Mother of God, whose icons are carried before armies and hung in every home. She intercedes for the families that call on her."
 patron_god_christian_deity_02_icon:0 "$patron_god_christian_deity_02$"
 patron_god_christian_deity_02_desc:0 "The Prince of the Apostles, the rock on which the Church is built, keeper of the keys of heaven. Bishops and clergy honour those under his patronage."
 patron_god_christian_deity_03_icon:0 "$patron_god_christian_deity_03$"
 patron_god_christian_deity_03_desc:0 "The Apostle to the Gentiles, who carried the Gospel across the Roman world by road and sea and wrote to its churches."
 patron_god_christian_deity_04_icon:0 "$patron_god_christian_deity_04$"
 patron_god_christian_deity_04_desc:0 "The archangel who cast down the dragon and leads the hosts of heaven. Soldiers and kings take him as their captain."
 patron_god_christian_deity_05_icon:0 "$patron_god_christian_deity_05$"
 patron_god_christian_deity_05_desc:0 "The soldier martyr of Lydda who slew the dragon. Knights from Britain to Georgia ride under his cross."
 patron_god_christian_deity_06_icon:0 "$patron_god_christian_deity_06$"
 patron_god_christian_deity_06_desc:0 "The bishop of Myra, wonder-worker, protector of sailors, merchants and children, who gave his wealth in secret."
 patron_god_christian_deity_07_icon:0 "$patron_god_christian_deity_07$"
 patron_god_christian_deity_07_desc:0 "The father of monks, who went into the Egyptian desert and fought the demons alone. Ascetics follow his rule."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_islamic_deity_01_icon:0 "$patron_god_islamic_deity_01$"
 patron_god_islamic_deity_01_desc:0 "Ibrahim, the friend of God, who broke the idols, built the Kaaba with his son and was saved from the fire. Rulers honour his faith and hospitality."
 patron_god_islamic_deity_02_icon:0 "$patron_god_islamic_deity_02$"
 patron_god_islamic_deity_02_desc:0 "Musa, who spoke with God at the burning bush and led his people out of Egypt through the parted sea."
 patron_god_islamic_deity_03_icon:0 "$patron_god_islamic_deity_03$"
 patron_god_islamic_deity_03_desc:0 "Dawud, the shepherd who slew Jalut, the king to whom the Psalms were given and for whom iron grew soft in his hands."
 patron_god_islamic_deity_04_icon:0 "$patron_god_islamic_deity_04$"
 patron_god_islamic_deity_04_desc:0 "Sulayman, the wise king who understood the speech of birds and commanded the wind and the jinn. Just rulers take him as their example."
 patron_god_islamic_deity_05_icon:0 "$patron_god_islamic_deity_05$"
 patron_god_islamic_deity_05_desc:0 "Yusuf, the beautiful, who interpreted the king's dreams, filled the granaries of Egypt and forgave his brothers."
 patron_god_islamic_deity_06_icon:0 "$patron_god_islamic_deity_06$"
 patron_god_islamic_deity_06_desc:0 "Luqman the Wise, whose counsel to his son is kept in the Quran: gratitude, patience and modesty."
 patron_god_islamic_deity_07_icon:0 "$patron_god_islamic_deity_07$"
 patron_god_islamic_deity_07_desc:0 "The Green One, the mysterious servant of God who guided Musa, patron of travellers and those lost at sea or in the desert."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_jewish_deity_01_icon:0 "$patron_god_jewish_deity_01$"
 patron_god_jewish_deity_01_desc:0 "Abraham our father, who left Ur at God's call and received the covenant for his descendants. His tent was open on all four sides."
 patron_god_jewish_deity_02_icon:0 "$patron_god_jewish_deity_02$"
 patron_god_jewish_deity_02_desc:0 "Moses our teacher, who brought the people out of Egypt and the Torah down from Sinai. Judges and scholars follow him."
 patron_god_jewish_deity_03_icon:0 "$patron_god_jewish_deity_03$"
 patron_god_jewish_deity_03_desc:0 "King David, the shepherd who slew Goliath, the sweet singer of Israel, from whose house the anointed king will come."
 patron_god_jewish_deity_04_icon:0 "$patron_god_jewish_deity_04$"
 patron_god_jewish_deity_04_desc:0 "King Solomon, the wisest of men, who built the Temple and judged between the two mothers. His kingdom was rich and at peace."
 patron_god_jewish_deity_05_icon:0 "$patron_god_jewish_deity_05$"
 patron_god_jewish_deity_05_desc:0 "Queen Esther, who risked her life before the Persian king to save her people from Haman. Courtiers and queens remember her."
 patron_god_jewish_deity_06_icon:0 "$patron_god_jewish_deity_06$"
 patron_god_jewish_deity_06_desc:0 "Elijah the prophet, who called down fire on Carmel and rose to heaven in a whirlwind, and will return to herald redemption."
 patron_god_jewish_deity_07_icon:0 "$patron_god_jewish_deity_07$"
 patron_god_jewish_deity_07_desc:0 "Judah the Hammer, who led the revolt against the Seleucids and rededicated the Temple. Those who fight for their faith take his name."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_gnostic_deity_01_icon:0 "$patron_god_gnostic_deity_01$"
 patron_god_gnostic_deity_01_desc:0 "Wisdom, the last of the aeons, whose fall made the world and whose longing for the light draws the soul home."
 patron_god_gnostic_deity_02_icon:0 "$patron_god_gnostic_deity_02$"
 patron_god_gnostic_deity_02_desc:0 "The first thought of the unknowable Father, the mother of all, the womb of the aeons."
 patron_god_gnostic_deity_03_icon:0 "$patron_god_gnostic_deity_03$"
 patron_god_gnostic_deity_03_desc:0 "The third son of Adam, the father of the spiritual race, who carries the true knowledge through every age."
 patron_god_gnostic_deity_04_icon:0 "$patron_god_gnostic_deity_04$"
 patron_god_gnostic_deity_04_desc:0 "The Apostle of Light from Babylon, the seal of the prophets, who painted his teaching so that all peoples might read it."
 patron_god_gnostic_deity_05_icon:0 "$patron_god_gnostic_deity_05$"
 patron_god_gnostic_deity_05_desc:0 "John the Baptist, the true prophet of the Mandaeans, who baptises in the living, flowing water."
 patron_god_gnostic_deity_06_icon:0 "$patron_god_gnostic_deity_06$"
 patron_god_gnostic_deity_06_desc:0 "The radiant saviour of the Mandaeans, who went down to the world of darkness and returned with its secrets."
 patron_god_gnostic_deity_07_icon:0 "$patron_god_gnostic_deity_07$"
 patron_god_gnostic_deity_07_desc:0 "The Alexandrian teacher who nearly became bishop of Rome, and whose school mapped the thirty aeons of the Pleroma."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_sinitic_deity_01_icon:0 "$patron_god_sinitic_deity_01$"
 patron_god_sinitic_deity_01_desc:0 "Confucius, the First Teacher, whose sayings order the family and the state. Officials offer to him in every prefectural temple."
 patron_god_sinitic_deity_02_icon:0 "$patron_god_sinitic_deity_02$"
 patron_god_sinitic_deity_02_desc:0 "The Old Master, who wrote the Daodejing at the western pass and rode away on an ox. The Daoists honour him as the Supreme Lord Lao."
 patron_god_sinitic_deity_03_icon:0 "$patron_god_sinitic_deity_03$"
 patron_god_sinitic_deity_03_desc:0 "The Jade Emperor, ruler of heaven, whose celestial court mirrors the emperor's court on earth."
 patron_god_sinitic_deity_04_icon:0 "$patron_god_sinitic_deity_04$"
 patron_god_sinitic_deity_04_desc:0 "The loyal general of the Three Kingdoms, raised among the gods as the patron of soldiers, sworn brothers and keeping one's word."
 patron_god_sinitic_deity_05_icon:0 "$patron_god_sinitic_deity_05$"
 patron_god_sinitic_deity_05_desc:0 "The fisherman's daughter of Meizhou who saved her kin from the storm and became goddess of the sea. Every junk carries her image."
 patron_god_sinitic_deity_06_icon:0 "$patron_god_sinitic_deity_06$"
 patron_god_sinitic_deity_06_desc:0 "The Divine Farmer, who taught the people to plough and tasted a hundred herbs to find the medicines."
 patron_god_sinitic_deity_07_icon:0 "$patron_god_sinitic_deity_07$"
 patron_god_sinitic_deity_07_desc:0 "The Queen Mother of the West, keeper of the peaches of immortality in the Kunlun mountains."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_rite_roman_rite_deity_01_icon:0 "$patron_god_rite_roman_rite_deity_01$"
 patron_god_rite_roman_rite_deity_01_desc:0 "The pope who sent missions to the English, reformed the chant and the papal estates, and called himself servant of the servants of God."
 patron_god_rite_roman_rite_deity_02_icon:0 "$patron_god_rite_roman_rite_deity_02$"
 patron_god_rite_roman_rite_deity_02_desc:0 "The scholar who translated the Scriptures into Latin in his cell at Bethlehem, with a lion at his feet."
 patron_god_rite_byzantine_rite_deity_01_icon:0 "$patron_god_rite_byzantine_rite_deity_01$"
 patron_god_rite_byzantine_rite_deity_01_desc:0 "The golden-mouthed archbishop of Constantinople, whose liturgy is sung every Sunday and whose sermons spared not even the empress."
 patron_god_rite_byzantine_rite_deity_02_icon:0 "$patron_god_rite_byzantine_rite_deity_02$"
 patron_god_rite_byzantine_rite_deity_02_desc:0 "The bishop of Caesarea who wrote the rule of the eastern monks and built a city of hospitals for the poor."
 patron_god_rite_ambrosian_rite_deity_01_icon:0 "$patron_god_rite_ambrosian_rite_deity_01$"
 patron_god_rite_ambrosian_rite_deity_01_desc:0 "The governor who became bishop of Milan by acclamation, barred the emperor from his church, and gave Milan its own rite and chant."
 patron_god_rite_ambrosian_rite_deity_02_icon:0 "$patron_god_rite_ambrosian_rite_deity_02$"
 patron_god_rite_ambrosian_rite_deity_02_desc:0 "Ambrose's convert and pupil, baptised at Milan, whose City of God and Confessions shape the Latin mind."
 patron_god_rite_beneventan_rite_deity_01_icon:0 "$patron_god_rite_beneventan_rite_deity_01$"
 patron_god_rite_beneventan_rite_deity_01_desc:0 "The father of western monks, who founded Montecassino and wrote the Rule of prayer and work."
 patron_god_rite_beneventan_rite_deity_02_icon:0 "$patron_god_rite_beneventan_rite_deity_02$"
 patron_god_rite_beneventan_rite_deity_02_desc:0 "The apostle whose relics the Lombard prince Sicard brought to Benevento, making it a city of pilgrims."
 patron_god_rite_carolingian_christianity_deity_01_icon:0 "$patron_god_rite_carolingian_christianity_deity_01$"
 patron_god_rite_carolingian_christianity_deity_01_desc:0 "The Northumbrian master of Charlemagne's palace school, who revived Latin learning across the Frankish realm."
 patron_god_rite_carolingian_christianity_deity_02_icon:0 "$patron_god_rite_carolingian_christianity_deity_02$"
 patron_god_rite_carolingian_christianity_deity_02_desc:0 "The apostle of the Germans, who felled Donar's oak at Geismar and was martyred among the Frisians."
 patron_god_rite_georgian_rite_deity_01_icon:0 "$patron_god_rite_georgian_rite_deity_01$"
 patron_god_rite_georgian_rite_deity_01_desc:0 "The Cappadocian maiden who brought the faith to Georgia with a cross of vine branches bound with her own hair."
 patron_god_rite_georgian_rite_deity_02_icon:0 "$patron_god_rite_georgian_rite_deity_02$"
 patron_god_rite_georgian_rite_deity_02_desc:0 "The first Christian king of Iberia, converted by Nino after a miracle in the darkened forest. Georgian kings rule in his line."
 patron_god_rite_insular_celtic_deity_01_icon:0 "$patron_god_rite_insular_celtic_deity_01$"
 patron_god_rite_insular_celtic_deity_01_desc:0 "The prince-abbot of Iona, who carried the Gospel to the Picts and crowned the kings of Dál Riata."
 patron_god_rite_insular_celtic_deity_02_icon:0 "$patron_god_rite_insular_celtic_deity_02$"
 patron_god_rite_insular_celtic_deity_02_desc:0 "The Irish wanderer who founded Luxeuil and Bobbio and stood up to Frankish queens. His monks keep the hardest rule."
 patron_god_rite_mozarabic_church_deity_01_icon:0 "$patron_god_rite_mozarabic_church_deity_01$"
 patron_god_rite_mozarabic_church_deity_01_desc:0 "The bishop whose Etymologies gathered all the knowledge of the ancients, the last great scholar of Visigothic Spain."
 patron_god_rite_mozarabic_church_deity_02_icon:0 "$patron_god_rite_mozarabic_church_deity_02$"
 patron_god_rite_mozarabic_church_deity_02_desc:0 "The Mozarab priest martyred at Córdoba for his faith, who kept the Latin books of Spain alive under the emirs."
 patron_god_rite_slavic_rite_deity_01_icon:0 "$patron_god_rite_slavic_rite_deity_01$"
 patron_god_rite_slavic_rite_deity_01_desc:0 "Constantine the Philosopher, who made the Glagolitic letters so that the Slavs could hear the liturgy in their own tongue."
 patron_god_rite_slavic_rite_deity_02_icon:0 "$patron_god_rite_slavic_rite_deity_02$"
 patron_god_rite_slavic_rite_deity_02_desc:0 "Cyril's brother, archbishop of Moravia, who translated the Scriptures and defended the Slavonic liturgy before the pope."
 patron_god_rite_antinomian_rite_deity_01_icon:0 "$patron_god_rite_antinomian_rite_deity_01$"
 patron_god_rite_antinomian_rite_deity_01_desc:0 "The Alexandrian teacher who held that the soul is freed by passing through every deed of the world, bound by no law."
 patron_god_rite_antinomian_rite_deity_02_icon:0 "$patron_god_rite_antinomian_rite_deity_02$"
 patron_god_rite_antinomian_rite_deity_02_desc:0 "The son of Carpocrates, who wrote On Righteousness and died at seventeen, honoured as a god on Cephallenia."
 patron_god_rite_albionian_rite_deity_01_icon:0 "$patron_god_rite_albionian_rite_deity_01$"
 patron_god_rite_albionian_rite_deity_01_desc:0 "The martyrs of Caerleon, citizens of the Legion's city who died for the faith in Britain's first persecution."
 patron_god_rite_albionian_rite_deity_02_icon:0 "$patron_god_rite_albionian_rite_deity_02$"
 patron_god_rite_albionian_rite_deity_02_desc:0 "The rich man who buried Christ and, the Britons say, came to Glastonbury and planted his staff, which flowered."
 patron_god_rite_pelagian_rite_deity_01_icon:0 "$patron_god_rite_pelagian_rite_deity_01$"
 patron_god_rite_pelagian_rite_deity_01_desc:0 "The British monk who taught in Rome that man can choose the good by his own will, without inherited sin."
 patron_god_rite_pelagian_rite_deity_02_icon:0 "$patron_god_rite_pelagian_rite_deity_02$"
 patron_god_rite_pelagian_rite_deity_02_desc:0 "Pelagius' bold disciple, the lawyer who argued his master's cause before councils from Carthage to Ephesus."
 patron_god_rite_saxon_rite_deity_01_icon:0 "$patron_god_rite_saxon_rite_deity_01$"
 patron_god_rite_saxon_rite_deity_01_desc:0 "The monk Gregory sent to the English, who baptised King Æthelberht and founded the see of Canterbury."
 patron_god_rite_saxon_rite_deity_02_icon:0 "$patron_god_rite_saxon_rite_deity_02$"
 patron_god_rite_saxon_rite_deity_02_desc:0 "The shepherd-bishop of Lindisfarne, hermit of the Farne Islands, whose incorrupt body the monks carried before the Danes."
 patron_god_rite_arian_rite_deity_01_icon:0 "$patron_god_rite_arian_rite_deity_01$"
 patron_god_rite_arian_rite_deity_01_desc:0 "The Alexandrian presbyter who taught that the Son was begotten and not eternal, and whose creed the Goths and Vandals took as their own."
 patron_god_rite_arian_rite_deity_02_icon:0 "$patron_god_rite_arian_rite_deity_02$"
 patron_god_rite_arian_rite_deity_02_desc:0 "Wulfila, the bishop of the Goths, who made their alphabet and translated the Bible into Gothic."
 patron_god_rite_adoptionist_rite_deity_01_icon:0 "$patron_god_rite_adoptionist_rite_deity_01$"
 patron_god_rite_adoptionist_rite_deity_01_desc:0 "The leather-worker of Byzantium who taught in Rome that Jesus was a man chosen and adopted by God at his baptism."
 patron_god_rite_adoptionist_rite_deity_02_icon:0 "$patron_god_rite_adoptionist_rite_deity_02$"
 patron_god_rite_adoptionist_rite_deity_02_desc:0 "The archbishop who defended the Spanish adoptionist teaching against Charlemagne's theologians."
 patron_god_rite_mari_christ_rite_deity_01_icon:0 "$patron_god_rite_mari_christ_rite_deity_01$"
 patron_god_rite_mari_christ_rite_deity_01_desc:0 "Our Lady Mary as the Basques know her, the Lady of the mountains in whom the old goddess Mari was born again."
 patron_god_rite_mari_christ_rite_deity_02_icon:0 "$patron_god_rite_mari_christ_rite_deity_02$"
 patron_god_rite_mari_christ_rite_deity_02_desc:0 "The serpent consort of Mari who crosses the sky as a flame and brings the storm, honoured still in the Basque valleys."
 patron_god_rite_armenian_rite_deity_01_icon:0 "$patron_god_rite_armenian_rite_deity_01$"
 patron_god_rite_armenian_rite_deity_01_desc:0 "The saint who survived thirteen years in the pit of Khor Virap and baptised King Tiridates, making Armenia the first Christian kingdom."
 patron_god_rite_armenian_rite_deity_02_icon:0 "$patron_god_rite_armenian_rite_deity_02$"
 patron_god_rite_armenian_rite_deity_02_desc:0 "The monk who created the Armenian alphabet and translated the Scriptures, so that the nation would never lose its faith."
 patron_god_rite_apollinarist_rite_deity_01_icon:0 "$patron_god_rite_apollinarist_rite_deity_01$"
 patron_god_rite_apollinarist_rite_deity_01_desc:0 "The Syrian bishop who taught that in Christ the divine Word took the place of the human mind."
 patron_god_rite_apollinarist_rite_deity_02_icon:0 "$patron_god_rite_apollinarist_rite_deity_02$"
 patron_god_rite_apollinarist_rite_deity_02_desc:0 "His father, the grammarian who rewrote the Scriptures as Homeric epics and Platonic dialogues when Julian closed the schools."
 patron_god_rite_audianist_rite_deity_01_icon:0 "$patron_god_rite_audianist_rite_deity_01$"
 patron_god_rite_audianist_rite_deity_01_desc:0 "The ascetic of Edessa who rebuked the worldly bishops, was exiled to Scythia, and won the Goths to his strict church."
 patron_god_rite_audianist_rite_deity_02_icon:0 "$patron_god_rite_audianist_rite_deity_02$"
 patron_god_rite_audianist_rite_deity_02_desc:0 "The aged bishop of Smyrna, disciple of John, who kept Easter on the fourteenth of Nisan as the Audians still do."
 patron_god_rite_docetist_rite_deity_01_icon:0 "$patron_god_rite_docetist_rite_deity_01$"
 patron_god_rite_docetist_rite_deity_01_desc:0 "The Syrian teacher who held that the Saviour only seemed to be born and to suffer, being wholly spirit."
 patron_god_rite_docetist_rite_deity_02_icon:0 "$patron_god_rite_docetist_rite_deity_02$"
 patron_god_rite_docetist_rite_deity_02_desc:0 "The Alexandrian ascetic who taught that Christ's flesh was only an appearance and that the faithful should refuse the body's desires."
 patron_god_rite_donatist_rite_deity_01_icon:0 "$patron_god_rite_donatist_rite_deity_01$"
 patron_god_rite_donatist_rite_deity_01_desc:0 "The bishop of Carthage who refused the traitors who had handed over the Scriptures, and led the church of the martyrs."
 patron_god_rite_donatist_rite_deity_02_icon:0 "$patron_god_rite_donatist_rite_deity_02$"
 patron_god_rite_donatist_rite_deity_02_desc:0 "The Donatist layman whose Book of Rules taught the Latin West how to read Scripture, admired even by Augustine."
 patron_god_rite_eutychianist_rite_deity_01_icon:0 "$patron_god_rite_eutychianist_rite_deity_01$"
 patron_god_rite_eutychianist_rite_deity_01_desc:0 "The archimandrite of Constantinople who taught that after the union Christ had one nature only."
 patron_god_rite_eutychianist_rite_deity_02_icon:0 "$patron_god_rite_eutychianist_rite_deity_02$"
 patron_god_rite_eutychianist_rite_deity_02_desc:0 "The patriarch who presided over the Robber Council of Ephesus and was deposed at Chalcedon for his stand."
 patron_god_rite_marcionist_rite_deity_01_icon:0 "$patron_god_rite_marcionist_rite_deity_01$"
 patron_god_rite_marcionist_rite_deity_01_desc:0 "The shipowner of Pontus who set the God of love against the God of the Law and made the first canon of Scripture."
 patron_god_rite_marcionist_rite_deity_02_icon:0 "$patron_god_rite_marcionist_rite_deity_02$"
 patron_god_rite_marcionist_rite_deity_02_desc:0 "Marcion's disciple, who taught one good God and wrote down the visions of the prophetess Philumene."
 patron_god_rite_montanist_rite_deity_01_icon:0 "$patron_god_rite_montanist_rite_deity_01$"
 patron_god_rite_montanist_rite_deity_01_desc:0 "The Phrygian prophet of the New Prophecy, through whom the Paraclete spoke, who awaited the heavenly Jerusalem at Pepuza."
 patron_god_rite_montanist_rite_deity_02_icon:0 "$patron_god_rite_montanist_rite_deity_02$"
 patron_god_rite_montanist_rite_deity_02_desc:0 "The two prophetesses of the New Prophecy, who left their husbands to speak the words of the Spirit."
 patron_god_rite_sabellianist_rite_deity_01_icon:0 "$patron_god_rite_sabellianist_rite_deity_01$"
 patron_god_rite_sabellianist_rite_deity_01_desc:0 "The Libyan teacher who held that Father, Son and Spirit are three faces of one God, as the sun is light, heat and shape."
 patron_god_rite_sabellianist_rite_deity_02_icon:0 "$patron_god_rite_sabellianist_rite_deity_02$"
 patron_god_rite_sabellianist_rite_deity_02_desc:0 "The teacher who first said that the Father himself was born and suffered, and was cast out by his presbyters for it."
 patron_god_rite_frankish_christianity_deity_01_icon:0 "$patron_god_rite_frankish_christianity_deity_01$"
 patron_god_rite_frankish_christianity_deity_01_desc:0 "The bishop of Reims who baptised Clovis with the oil brought by a dove: bow your head, proud Sicambrian."
 patron_god_rite_frankish_christianity_deity_02_icon:0 "$patron_god_rite_frankish_christianity_deity_02$"
 patron_god_rite_frankish_christianity_deity_02_desc:0 "The patroness of Paris, who held the city's courage against Attila and fed it through the Frankish siege."
 patron_god_rite_unctionist_rite_deity_01_icon:0 "$patron_god_rite_unctionist_rite_deity_01$"
 patron_god_rite_unctionist_rite_deity_01_desc:0 "The first Christian king of the Franks, anointed with the holy oil of Reims, from whom the Unctionists' kings draw their sacred power."
 patron_god_rite_unctionist_rite_deity_02_icon:0 "$patron_god_rite_unctionist_rite_deity_02$"
 patron_god_rite_unctionist_rite_deity_02_desc:0 "The Burgundian queen who brought Clovis to the faith and founded churches across Francia."
 patron_god_rite_semipelagian_rite_deity_01_icon:0 "$patron_god_rite_semipelagian_rite_deity_01$"
 patron_god_rite_semipelagian_rite_deity_01_desc:0 "The monk who brought the wisdom of the desert fathers to Marseille and taught that the will makes the first step toward grace."
 patron_god_rite_semipelagian_rite_deity_02_icon:0 "$patron_god_rite_semipelagian_rite_deity_02$"
 patron_god_rite_semipelagian_rite_deity_02_desc:0 "The abbot of Lérins and bishop of Riez, champion of free will and of the Gallic bishops against the Arian Visigoths."
 patron_god_rite_bogomilist_rite_deity_01_icon:0 "$patron_god_rite_bogomilist_rite_deity_01$"
 patron_god_rite_bogomilist_rite_deity_01_desc:0 "The village priest of Bulgaria, 'dear to God', who taught that the visible world is the work of the devil."
 patron_god_rite_bogomilist_rite_deity_02_icon:0 "$patron_god_rite_bogomilist_rite_deity_02$"
 patron_god_rite_bogomilist_rite_deity_02_desc:0 "The Bogomil teacher of Constantinople, healer and preacher, who gathered twelve apostles in the capital itself."
 patron_god_rite_cathar_rite_deity_01_icon:0 "$patron_god_rite_cathar_rite_deity_01$"
 patron_god_rite_cathar_rite_deity_01_desc:0 "The dualist bishop from Constantinople who consecrated the bishops of the Good Men in Languedoc."
 patron_god_rite_cathar_rite_deity_02_icon:0 "$patron_god_rite_cathar_rite_deity_02$"
 patron_god_rite_cathar_rite_deity_02_desc:0 "The noble lady who took the consolamentum and became a perfecta, protector of the Good Men in the mountains."
 patron_god_rite_paulician_rite_deity_01_icon:0 "$patron_god_rite_paulician_rite_deity_01$"
 patron_god_rite_paulician_rite_deity_01_desc:0 "The Armenian founder of the Paulicians, who took the name of Paul's companion and preached the two principles."
 patron_god_rite_paulician_rite_deity_02_icon:0 "$patron_god_rite_paulician_rite_deity_02$"
 patron_god_rite_paulician_rite_deity_02_desc:0 "The Paulician officer who built the fortress of Tephrike and led the faithful in war against the empire."
 patron_god_rite_messalian_rite_deity_01_icon:0 "$patron_god_rite_messalian_rite_deity_01$"
 patron_god_rite_messalian_rite_deity_01_desc:0 "The leader of the Euchites, the praying ones, who held that only ceaseless prayer drives out the demon in every soul."
 patron_god_rite_messalian_rite_deity_02_icon:0 "$patron_god_rite_messalian_rite_deity_02$"
 patron_god_rite_messalian_rite_deity_02_desc:0 "The spiritual teacher whose homilies on the indwelling Spirit are read by monks of every church."
 patron_god_rite_iconoclast_rite_deity_01_icon:0 "$patron_god_rite_iconoclast_rite_deity_01$"
 patron_god_rite_iconoclast_rite_deity_01_desc:0 "The Isaurian who saved Constantinople from the Arabs and ordered the image of Christ removed from the Chalke Gate."
 patron_god_rite_iconoclast_rite_deity_02_icon:0 "$patron_god_rite_iconoclast_rite_deity_02$"
 patron_god_rite_iconoclast_rite_deity_02_desc:0 "The iconoclast emperor, scourge of the Bulgars and of the monks, who called the council of Hieria."
 patron_god_rite_adamites_deity_01_icon:0 "$patron_god_rite_adamites_deity_01$"
 patron_god_rite_adamites_deity_01_desc:0 "The first man before the fall, whose innocence the Adamites claim to have regained, naked and unashamed."
 patron_god_rite_adamites_deity_02_icon:0 "$patron_god_rite_adamites_deity_02$"
 patron_god_rite_adamites_deity_02_desc:0 "The mother of all the living, whom the Adamites honour as she was in the garden before the serpent spoke."
 patron_god_rite_coptic_rite_deity_01_icon:0 "$patron_god_rite_coptic_rite_deity_01$"
 patron_god_rite_coptic_rite_deity_01_desc:0 "The writer of the Gospel, first bishop of Alexandria, whose relics the Venetians stole away in a barrel of pork."
 patron_god_rite_coptic_rite_deity_02_icon:0 "$patron_god_rite_coptic_rite_deity_02$"
 patron_god_rite_coptic_rite_deity_02_desc:0 "The patriarch who defended the one incarnate nature of the Word and called Mary Theotokos at Ephesus."
 patron_god_rite_antiochian_rite_deity_01_icon:0 "$patron_god_rite_antiochian_rite_deity_01$"
 patron_god_rite_antiochian_rite_deity_01_desc:0 "The bishop of Antioch who wrote seven letters on his way to the beasts of Rome, and first called the Church catholic."
 patron_god_rite_antiochian_rite_deity_02_icon:0 "$patron_god_rite_antiochian_rite_deity_02$"
 patron_god_rite_antiochian_rite_deity_02_desc:0 "The ragged bishop who travelled the East in a beggar's cloak, ordaining priests so that the Syriac church would not die."
 patron_god_rite_ethiopian_rite_deity_01_icon:0 "$patron_god_rite_ethiopian_rite_deity_01$"
 patron_god_rite_ethiopian_rite_deity_01_desc:0 "Abba Salama, the shipwrecked Syrian who became tutor to the king of Aksum and its first bishop."
 patron_god_rite_ethiopian_rite_deity_02_icon:0 "$patron_god_rite_ethiopian_rite_deity_02$"
 patron_god_rite_ethiopian_rite_deity_02_desc:0 "The hymnographer who heard the songs of the angels from three birds and gave Ethiopia its sacred chant."
 patron_god_rite_solomonic_christ_rite_deity_01_icon:0 "$patron_god_rite_solomonic_christ_rite_deity_01$"
 patron_god_rite_solomonic_christ_rite_deity_01_desc:0 "The son of Solomon and the Queen of Sheba, who brought the Ark of the Covenant to Aksum and founded the line of its kings."
 patron_god_rite_solomonic_christ_rite_deity_02_icon:0 "$patron_god_rite_solomonic_christ_rite_deity_02$"
 patron_god_rite_solomonic_christ_rite_deity_02_desc:0 "The king who turned from the old gods to the Cross and struck it on his coins, ruling from the Nile to the Red Sea."
 patron_god_rite_melkite_rite_deity_01_icon:0 "$patron_god_rite_melkite_rite_deity_01$"
 patron_god_rite_melkite_rite_deity_01_desc:0 "The caliph's treasurer turned monk of Mar Saba, who defended the holy icons and wrote the Fount of Knowledge."
 patron_god_rite_melkite_rite_deity_02_icon:0 "$patron_god_rite_melkite_rite_deity_02$"
 patron_god_rite_melkite_rite_deity_02_desc:0 "The Cappadocian who founded the Great Lavra in the Judean desert, the mother of the monasteries of the Holy Land."
 patron_god_rite_nestorian_deity_01_icon:0 "$patron_god_rite_nestorian_deity_01$"
 patron_god_rite_nestorian_deity_01_desc:0 "The archbishop of Constantinople who would not call Mary Theotokos, deposed at Ephesus and honoured in the East as a teacher."
 patron_god_rite_nestorian_deity_02_icon:0 "$patron_god_rite_nestorian_deity_02$"
 patron_god_rite_nestorian_deity_02_desc:0 "The Interpreter, whose commentaries teach the Church of the East to read the Scriptures plainly."
 patron_god_rite_syriac_christ_rite_deity_01_icon:0 "$patron_god_rite_syriac_christ_rite_deity_01$"
 patron_god_rite_syriac_christ_rite_deity_01_desc:0 "The disciple of Addai who carried the Gospel down the Tigris to Seleucia-Ctesiphon, founder of the Church of the East."
 patron_god_rite_syriac_christ_rite_deity_02_icon:0 "$patron_god_rite_syriac_christ_rite_deity_02$"
 patron_god_rite_syriac_christ_rite_deity_02_desc:0 "The Zoroastrian convert who became catholicos and reformed the Church of the East under the Sasanian shah."
 patron_god_rite_nasrani_rite_deity_01_icon:0 "$patron_god_rite_nasrani_rite_deity_01$"
 patron_god_rite_nasrani_rite_deity_01_desc:0 "The apostle who sailed to India, founded the seven churches of Malabar and died by a spear at Mylapore."
 patron_god_rite_nasrani_rite_deity_02_icon:0 "$patron_god_rite_nasrani_rite_deity_02$"
 patron_god_rite_nasrani_rite_deity_02_desc:0 "The merchant who led seventy-two Syrian families to Kodungallur and won the copper-plate charter from the Chera king."
 patron_god_rite_fraticelli_rite_deity_01_icon:0 "$patron_god_rite_fraticelli_rite_deity_01$"
 patron_god_rite_fraticelli_rite_deity_01_desc:0 "The merchant's son who married Lady Poverty, preached to the birds and bore the wounds of Christ."
 patron_god_rite_fraticelli_rite_deity_02_icon:0 "$patron_god_rite_fraticelli_rite_deity_02$"
 patron_god_rite_fraticelli_rite_deity_02_desc:0 "The leader of the Spiritual Franciscans, who kept the Rule of poverty to the letter against popes and ministers."
 patron_god_rite_hussite_rite_deity_01_icon:0 "$patron_god_rite_hussite_rite_deity_01$"
 patron_god_rite_hussite_rite_deity_01_desc:0 "The rector of Prague who preached in Czech, gave the chalice to the people and was burned at Constance."
 patron_god_rite_hussite_rite_deity_02_icon:0 "$patron_god_rite_hussite_rite_deity_02$"
 patron_god_rite_hussite_rite_deity_02_desc:0 "The one-eyed general who led the war wagons of the Hussites and was never defeated."
 patron_god_rite_joachimite_rite_deity_01_icon:0 "$patron_god_rite_joachimite_rite_deity_01$"
 patron_god_rite_joachimite_rite_deity_01_desc:0 "The Calabrian abbot who read history as three ages, of the Father, the Son and the Spirit that is coming."
 patron_god_rite_joachimite_rite_deity_02_icon:0 "$patron_god_rite_joachimite_rite_deity_02$"
 patron_god_rite_joachimite_rite_deity_02_desc:0 "The Franciscan who proclaimed Joachim's writings the Eternal Gospel of the coming age."
 patron_god_rite_lollard_rite_deity_01_icon:0 "$patron_god_rite_lollard_rite_deity_01$"
 patron_god_rite_lollard_rite_deity_01_desc:0 "The Oxford master who put the Bible into English and denied the lordship of sinful clergy."
 patron_god_rite_lollard_rite_deity_02_icon:0 "$patron_god_rite_lollard_rite_deity_02$"
 patron_god_rite_lollard_rite_deity_02_desc:0 "The Lollard knight who rose against the king and was hanged and burned in St Giles' Fields."
 patron_god_rite_waldensian_rite_deity_01_icon:0 "$patron_god_rite_waldensian_rite_deity_01$"
 patron_god_rite_waldensian_rite_deity_01_desc:0 "The merchant of Lyon who gave away his fortune, had the Gospels put into the vernacular and sent the Poor Men out to preach."
 patron_god_rite_waldensian_rite_deity_02_icon:0 "$patron_god_rite_waldensian_rite_deity_02$"
 patron_god_rite_waldensian_rite_deity_02_desc:0 "The preacher who rejected churches, crosses and the baptism of infants, burned at Saint-Gilles on a pyre of crosses."
 patron_god_rite_bosnian_church_deity_01_icon:0 "$patron_god_rite_bosnian_church_deity_01$"
 patron_god_rite_bosnian_church_deity_01_desc:0 "The Grandfather, head of the Krstjani, elder of the Bosnian Church in its houses in the highlands."
 patron_god_rite_bosnian_church_deity_02_icon:0 "$patron_god_rite_bosnian_church_deity_02$"
 patron_god_rite_bosnian_church_deity_02_desc:0 "The guest Radin, Krstjani elder and envoy, counsellor to the dukes of Hum."
 patron_god_rite_conversos_deity_01_icon:0 "$patron_god_rite_conversos_deity_01$"
 patron_god_rite_conversos_deity_01_desc:0 "The archbishop of Toledo of Jewish descent, whose learning was the glory of Visigothic Spain."
 patron_god_rite_conversos_deity_02_icon:0 "$patron_god_rite_conversos_deity_02$"
 patron_god_rite_conversos_deity_02_desc:0 "The ruler of the Jews who came to Jesus by night and helped to bury him, honoured by those who keep their faith in secret."
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_rite_hanafi_deity_01_icon:0 "$patron_god_rite_hanafi_deity_01$"
 patron_god_rite_hanafi_deity_01_desc:0 "The jurist of Kufa who built the law on the Quran, the Sunna and reasoned judgement, and refused the post of chief judge."
 patron_god_rite_hanafi_deity_02_icon:0 "$patron_god_rite_hanafi_deity_02$"
 patron_god_rite_hanafi_deity_02_desc:0 "Abu Hanifa's pupil, chief judge of Baghdad under Harun al-Rashid, who wrote the Book of the Land Tax."
 patron_god_rite_hanbali_deity_01_icon:0 "$patron_god_rite_hanbali_deity_01$"
 patron_god_rite_hanbali_deity_01_desc:0 "The traditionist of Baghdad who would not say the Quran was created, though the caliph had him flogged for it."
 patron_god_rite_hanbali_deity_02_icon:0 "$patron_god_rite_hanbali_deity_02$"
 patron_god_rite_hanbali_deity_02_desc:0 "The Hanbali preacher of Baghdad whose sermons drew crowds of every rank, patron of the Qadiri path."
 patron_god_rite_maliki_deity_01_icon:0 "$patron_god_rite_maliki_deity_01$"
 patron_god_rite_maliki_deity_01_desc:0 "The imam of Medina, who gathered the practice of the city of the Prophet in the Muwatta."
 patron_god_rite_maliki_deity_02_icon:0 "$patron_god_rite_maliki_deity_02$"
 patron_god_rite_maliki_deity_02_desc:0 "The judge of Kairouan who wrote the Mudawwana and made the Maliki school the law of the Maghrib."
 patron_god_rite_shafii_deity_01_icon:0 "$patron_god_rite_shafii_deity_01$"
 patron_god_rite_shafii_deity_01_desc:0 "The father of Muslim jurisprudence, who set out the roots of the law in his Risala."
 patron_god_rite_shafii_deity_02_icon:0 "$patron_god_rite_shafii_deity_02$"
 patron_god_rite_shafii_deity_02_desc:0 "Al-Shafi'i's foremost pupil in Egypt, whose Mukhtasar spread his master's school."
 patron_god_rite_sahabah_deity_01_icon:0 "$patron_god_rite_sahabah_deity_01$"
 patron_god_rite_sahabah_deity_01_desc:0 "The truthful one, the Prophet's companion in the cave and the first caliph, who held the community together."
 patron_god_rite_sahabah_deity_02_icon:0 "$patron_god_rite_sahabah_deity_02$"
 patron_god_rite_sahabah_deity_02_desc:0 "The second caliph, who set up the diwan and the calendar and entered Jerusalem on foot."
 patron_god_rite_tabiun_deity_01_icon:0 "$patron_god_rite_tabiun_deity_01$"
 patron_god_rite_tabiun_deity_01_desc:0 "The preacher of Basra, born in Medina, who taught the fear of God and the emptiness of the world."
 patron_god_rite_tabiun_deity_02_icon:0 "$patron_god_rite_tabiun_deity_02$"
 patron_god_rite_tabiun_deity_02_desc:0 "The foremost of the Seven Jurists of Medina, who would not give his daughter to the caliph's son."
 patron_god_rite_athari_deity_01_icon:0 "$patron_god_rite_athari_deity_01$"
 patron_god_rite_athari_deity_01_desc:0 "The imam of Syria and Beirut, who held to the received tradition and spoke for the Christians of Lebanon before the caliph."
 patron_god_rite_athari_deity_02_icon:0 "$patron_god_rite_athari_deity_02$"
 patron_god_rite_athari_deity_02_desc:0 "The traditionist of Kufa who refused every office the caliphs offered and lived in hiding for his independence."
 patron_god_rite_masmudi_deity_01_icon:0 "$patron_god_rite_masmudi_deity_01$"
 patron_god_rite_masmudi_deity_01_desc:0 "The Masmuda preacher of the Atlas who proclaimed the absolute unity of God and was hailed as the Mahdi."
 patron_god_rite_masmudi_deity_02_icon:0 "$patron_god_rite_masmudi_deity_02$"
 patron_god_rite_masmudi_deity_02_desc:0 "Ibn Tumart's general and successor, who built the Almohad empire from the Atlas to Tripoli and al-Andalus."
 patron_god_rite_quranist_deity_01_icon:0 "$patron_god_rite_quranist_deity_01$"
 patron_god_rite_quranist_deity_01_desc:0 "The Basran theologian who doubted the reports of the traditionists and trusted reason and the Book."
 patron_god_rite_quranist_deity_02_icon:0 "$patron_god_rite_quranist_deity_02$"
 patron_god_rite_quranist_deity_02_desc:0 "The early theologian who weighed every tradition against the Quran and rejected what it did not confirm."
 patron_god_rite_nabi_deity_01_icon:0 "$patron_god_rite_nabi_deity_01$"
 patron_god_rite_nabi_deity_01_desc:0 "Nuh, who warned his people for nine hundred and fifty years and built the ark at God's command."
 patron_god_rite_nabi_deity_02_icon:0 "$patron_god_rite_nabi_deity_02$"
 patron_god_rite_nabi_deity_02_desc:0 "Yunus, swallowed by the great fish, who cried out in the darkness and was forgiven, with his whole city."
 patron_god_rite_ilm_islam_deity_01_icon:0 "$patron_god_rite_ilm_islam_deity_01$"
 patron_god_rite_ilm_islam_deity_01_desc:0 "The prince of physicians, whose Canon of Medicine and Book of Healing gathered all the sciences under one mind."
 patron_god_rite_ilm_islam_deity_02_icon:0 "$patron_god_rite_ilm_islam_deity_02$"
 patron_god_rite_ilm_islam_deity_02_desc:0 "The scholar of the House of Wisdom who gave his name to the algorithm and to algebra."
 patron_god_rite_mutazila_deity_01_icon:0 "$patron_god_rite_mutazila_deity_01$"
 patron_god_rite_mutazila_deity_01_desc:0 "The Basran who withdrew from Hasan al-Basri's circle and founded the school of reason and divine justice."
 patron_god_rite_mutazila_deity_02_icon:0 "$patron_god_rite_mutazila_deity_02$"
 patron_god_rite_mutazila_deity_02_desc:0 "The wit of Basra, who wrote the Book of Animals and argued every side of every question."
 patron_god_rite_ibadi_deity_01_icon:0 "$patron_god_rite_ibadi_deity_01$"
 patron_god_rite_ibadi_deity_01_desc:0 "The moderate of Basra who broke with the extremists and taught that the community may live in peace without an imam."
 patron_god_rite_ibadi_deity_02_icon:0 "$patron_god_rite_ibadi_deity_02$"
 patron_god_rite_ibadi_deity_02_desc:0 "The jurist of Basra, pupil of Ibn Abbas, whose teaching the Ibadis of Oman and the Maghrib keep."
 patron_god_rite_azariqa_deity_01_icon:0 "$patron_god_rite_azariqa_deity_01$"
 patron_god_rite_azariqa_deity_01_desc:0 "The fiery leader who declared all who stayed behind to be unbelievers and led the Azariqa into Ahwaz."
 patron_god_rite_azariqa_deity_02_icon:0 "$patron_god_rite_azariqa_deity_02$"
 patron_god_rite_azariqa_deity_02_desc:0 "The poet and warrior-caliph of the Azariqa, who held Fars and Kerman against the Umayyads for a decade."
 patron_god_rite_najdat_deity_01_icon:0 "$patron_god_rite_najdat_deity_01$"
 patron_god_rite_najdat_deity_01_desc:0 "The Kharijite who ruled Yamama and Bahrain and held that a leader serves only by the consent of the faithful."
 patron_god_rite_najdat_deity_02_icon:0 "$patron_god_rite_najdat_deity_02$"
 patron_god_rite_najdat_deity_02_desc:0 "Najda's successor in Bahrain, who led the Najdat until the Umayyad armies came."
 patron_god_rite_sufri_deity_01_icon:0 "$patron_god_rite_sufri_deity_01$"
 patron_god_rite_sufri_deity_01_desc:0 "The teacher from whom the Sufris take their name, who held to the middle way among the Khawarij."
 patron_god_rite_sufri_deity_02_icon:0 "$patron_god_rite_sufri_deity_02$"
 patron_god_rite_sufri_deity_02_desc:0 "The Sufri imam of the Banu Ifran at Tlemcen, who raised the Berbers of the central Maghrib against the caliphs' governors."
 patron_god_rite_ismaili_deity_01_icon:0 "$patron_god_rite_ismaili_deity_01$"
 patron_god_rite_ismaili_deity_01_desc:0 "The son of Ja'far al-Sadiq through whom the Seveners trace the hidden line of the imams."
 patron_god_rite_ismaili_deity_02_icon:0 "$patron_god_rite_ismaili_deity_02$"
 patron_god_rite_ismaili_deity_02_desc:0 "The Fatimid caliph who conquered Egypt and founded Cairo, the Victorious City."
 patron_god_rite_nizari_deity_01_icon:0 "$patron_god_rite_nizari_deity_01$"
 patron_god_rite_nizari_deity_01_desc:0 "The Fatimid heir passed over for his brother, in whom the Nizaris keep faith with the true line of the imams."
 patron_god_rite_nizari_deity_02_icon:0 "$patron_god_rite_nizari_deity_02$"
 patron_god_rite_nizari_deity_02_desc:0 "The master of Alamut, who ruled from his mountain fortress with books and daggers."
 patron_god_rite_imami_deity_01_icon:0 "$patron_god_rite_imami_deity_01$"
 patron_god_rite_imami_deity_01_desc:0 "The sixth imam, teacher of jurists and scholars in Medina, whose school is the law of the Twelvers."
 patron_god_rite_imami_deity_02_icon:0 "$patron_god_rite_imami_deity_02$"
 patron_god_rite_imami_deity_02_desc:0 "The eighth imam, named heir by al-Ma'mun and buried at Mashhad, the shrine of Khorasan."
 patron_god_rite_zayidi_deity_01_icon:0 "$patron_god_rite_zayidi_deity_01$"
 patron_god_rite_zayidi_deity_01_desc:0 "The grandson of Husayn who rose against the Umayyads at Kufa, holding that the true imam is the one who fights injustice."
 patron_god_rite_zayidi_deity_02_icon:0 "$patron_god_rite_zayidi_deity_02$"
 patron_god_rite_zayidi_deity_02_desc:0 "Yahya ibn al-Husayn, the first Zaydi imam of Yemen, who came to Sa'da to make peace among the tribes."
 patron_god_rite_hafizi_deity_01_icon:0 "$patron_god_rite_hafizi_deity_01$"
 patron_god_rite_hafizi_deity_01_desc:0 "The Fatimid caliph of the longest reign, who saw the great famine and the restoration of Egypt by Badr al-Jamali."
 patron_god_rite_hafizi_deity_02_icon:0 "$patron_god_rite_hafizi_deity_02$"
 patron_god_rite_hafizi_deity_02_desc:0 "The regent who took the caliphate himself, and whose followers defend the reigning caliph above all."
 patron_god_rite_alawite_deity_01_icon:0 "$patron_god_rite_alawite_deity_01$"
 patron_god_rite_alawite_deity_01_desc:0 "The companion of the eleventh imam who taught the hidden meaning of the faith, from whom the Nusayris are named."
 patron_god_rite_alawite_deity_02_icon:0 "$patron_god_rite_alawite_deity_02$"
 patron_god_rite_alawite_deity_02_desc:0 "The teacher who organised the Nusayri community at Aleppo under the Hamdanids."
 patron_god_rite_alevi_deity_01_icon:0 "$patron_god_rite_alevi_deity_01$"
 patron_god_rite_alevi_deity_01_desc:0 "The saint of Khorasan who came to Anatolia and taught love, tolerance and the four gates of the path."
 patron_god_rite_alevi_deity_02_icon:0 "$patron_god_rite_alevi_deity_02$"
 patron_god_rite_alevi_deity_02_desc:0 "The Turkic Sufi of Turkestan, who sang his wisdom in the Turks' own tongue."
 patron_god_rite_ghulat_deity_01_icon:0 "$patron_god_rite_ghulat_deity_01$"
 patron_god_rite_ghulat_deity_01_desc:0 "The disciple of Ja'far al-Sadiq who taught the divinity of the imams and died fighting in Kufa."
 patron_god_rite_ghulat_deity_02_icon:0 "$patron_god_rite_ghulat_deity_02$"
 patron_god_rite_ghulat_deity_02_desc:0 "The Kufan teacher of the hidden light of the imams, who promised the return of the Mahdi."
 patron_god_rite_qarmatian_deity_01_icon:0 "$patron_god_rite_qarmatian_deity_01$"
 patron_god_rite_qarmatian_deity_01_desc:0 "The Isma'ili missionary of the Sawad who gave the Qarmatians their name and their communities."
 patron_god_rite_qarmatian_deity_02_icon:0 "$patron_god_rite_qarmatian_deity_02$"
 patron_god_rite_qarmatian_deity_02_desc:0 "The Qarmatian lord of Bahrain who sacked Mecca and carried off the Black Stone."
 patron_god_rite_druze_deity_01_icon:0 "$patron_god_rite_druze_deity_01$"
 patron_god_rite_druze_deity_01_desc:0 "The teacher who proclaimed the unity of God in the time of al-Hakim and wrote the Epistles of Wisdom."
 patron_god_rite_druze_deity_02_icon:0 "$patron_god_rite_druze_deity_02$"
 patron_god_rite_druze_deity_02_desc:0 "The Fatimid caliph who rode out into the Muqattam hills one night and never came back, awaited by the Druze."
 patron_god_rite_davidic_jud_deity_01_icon:0 "$patron_god_rite_davidic_jud_deity_01$"
 patron_god_rite_davidic_jud_deity_01_desc:0 "The high priest who anointed Solomon, from whose line the Zadokites take their name and their right."
 patron_god_rite_davidic_jud_deity_02_icon:0 "$patron_god_rite_davidic_jud_deity_02$"
 patron_god_rite_davidic_jud_deity_02_desc:0 "The priest who brought the Law back from Babylon and read it to the people at the Water Gate."
 patron_god_rite_jud_ark_deity_01_icon:0 "$patron_god_rite_jud_ark_deity_01$"
 patron_god_rite_jud_ark_deity_01_desc:0 "The craftsman filled with the spirit of God, who made the Ark, the menorah and the tabernacle."
 patron_god_rite_jud_ark_deity_02_icon:0 "$patron_god_rite_jud_ark_deity_02$"
 patron_god_rite_jud_ark_deity_02_desc:0 "The brother of Moses, first high priest, keeper of the Ark and of the rod that budded."
 patron_god_rite_jud_sabaoth_deity_01_icon:0 "$patron_god_rite_jud_sabaoth_deity_01$"
 patron_god_rite_jud_sabaoth_deity_01_desc:0 "Joshua, who led Israel across the Jordan and brought down the walls of Jericho."
 patron_god_rite_jud_sabaoth_deity_02_icon:0 "$patron_god_rite_jud_sabaoth_deity_02$"
 patron_god_rite_jud_sabaoth_deity_02_desc:0 "The judge who beat the Midianites with three hundred men, trumpets and torches."
 patron_god_rite_jud_zion_deity_01_icon:0 "$patron_god_rite_jud_zion_deity_01$"
 patron_god_rite_jud_zion_deity_01_desc:0 "The cupbearer of the Persian king who rebuilt the walls of Jerusalem in fifty-two days."
 patron_god_rite_jud_zion_deity_02_icon:0 "$patron_god_rite_jud_zion_deity_02$"
 patron_god_rite_jud_zion_deity_02_desc:0 "Ezekiel, the prophet of the exile, who saw the dry bones live and the new Temple measured."
 patron_god_rite_rabbinism_deity_01_icon:0 "$patron_god_rite_rabbinism_deity_01$"
 patron_god_rite_rabbinism_deity_01_desc:0 "The sage of Babylon and Jerusalem who taught the whole Torah standing on one foot."
 patron_god_rite_rabbinism_deity_02_icon:0 "$patron_god_rite_rabbinism_deity_02$"
 patron_god_rite_rabbinism_deity_02_desc:0 "Judah the Prince, who gathered the oral law into the Mishnah."
 patron_god_rite_merkabah_deity_01_icon:0 "$patron_god_rite_merkabah_deity_01$"
 patron_god_rite_merkabah_deity_01_desc:0 "The shepherd who became the greatest of the sages, the only one of four to enter the Orchard and leave in peace."
 patron_god_rite_merkabah_deity_02_icon:0 "$patron_god_rite_merkabah_deity_02$"
 patron_god_rite_merkabah_deity_02_desc:0 "The high priest of the Hekhalot, who ascended through the seven palaces and saw the Throne."
 patron_god_rite_karaism_deity_01_icon:0 "$patron_god_rite_karaism_deity_01$"
 patron_god_rite_karaism_deity_01_desc:0 "The exilarch's heir who rejected the oral law and taught: search the Scripture well."
 patron_god_rite_karaism_deity_02_icon:0 "$patron_god_rite_karaism_deity_02$"
 patron_god_rite_karaism_deity_02_desc:0 "The Persian scholar who gave Karaism its name and its first great law books."
 patron_god_rite_samaritan_deity_01_icon:0 "$patron_god_rite_samaritan_deity_01$"
 patron_god_rite_samaritan_deity_01_desc:0 "The great priest who restored the Samaritan synagogues and councils and defended Mount Gerizim."
 patron_god_rite_samaritan_deity_02_icon:0 "$patron_god_rite_samaritan_deity_02$"
 patron_god_rite_samaritan_deity_02_desc:0 "The Samaritan sage whose Teaching and hymns are sung on Mount Gerizim."
 patron_god_rite_kabarism_deity_01_icon:0 "$patron_god_rite_kabarism_deity_01$"
 patron_god_rite_kabarism_deity_01_desc:0 "The Khazar king who heard the debate of the three faiths and chose the Law of Moses."
 patron_god_rite_kabarism_deity_02_icon:0 "$patron_god_rite_kabarism_deity_02$"
 patron_god_rite_kabarism_deity_02_desc:0 "The Khazar bek who built synagogues and schools and brought sages to teach the converts."
 patron_god_rite_haymanot_deity_01_icon:0 "$patron_god_rite_haymanot_deity_01$"
 patron_god_rite_haymanot_deity_01_desc:0 "The Jewish queen of Semien who overthrew the kings of Aksum, as the Beta Israel tell."
 patron_god_rite_haymanot_deity_02_icon:0 "$patron_god_rite_haymanot_deity_02$"
 patron_god_rite_haymanot_deity_02_desc:0 "The monk who joined the Beta Israel and taught them the monastic way and their prayers."
 patron_god_rite_malabarism_deity_01_icon:0 "$patron_god_rite_malabarism_deity_01$"
 patron_god_rite_malabarism_deity_01_desc:0 "The leader of the Jews of Cranganore, granted the copper plates and the rights of a prince by the Chera king."
 patron_god_rite_malabarism_deity_02_icon:0 "$patron_god_rite_malabarism_deity_02$"
 patron_god_rite_malabarism_deity_02_desc:0 "The traveller from Navarre who visited the Jewish communities from Spain to the Indies and wrote what he saw."
 patron_god_rite_manichean_deity_01_icon:0 "$patron_god_rite_manichean_deity_01$"
 patron_god_rite_manichean_deity_01_desc:0 "The King of the Paradise of Light, from whom the light came forth to battle the darkness."
 patron_god_rite_manichean_deity_02_icon:0 "$patron_god_rite_manichean_deity_02$"
 patron_god_rite_manichean_deity_02_desc:0 "The radiant Jesus who woke Adam and showed him the light trapped in his body."
 patron_god_rite_mingism_deity_01_icon:0 "$patron_god_rite_mingism_deity_01$"
 patron_god_rite_mingism_deity_01_desc:0 "The Radiant Venerable of the Chinese Manichaeans, to whom the faithful await the coming of the Kingdom of Light."
 patron_god_rite_mingism_deity_02_icon:0 "$patron_god_rite_mingism_deity_02$"
 patron_god_rite_mingism_deity_02_desc:0 "Jesus the Buddha of Light, honoured in the Chinese Manichaean hymns."
 patron_god_rite_mand_ruha_deity_01_icon:0 "$patron_god_rite_mand_ruha_deity_01$"
 patron_god_rite_mand_ruha_deity_01_desc:0 "The Spirit of the lower world, mother of the planets, whom her cult worships as the Holy Spirit."
 patron_god_rite_mand_ruha_deity_02_icon:0 "$patron_god_rite_mand_ruha_deity_02$"
 patron_god_rite_mand_ruha_deity_02_desc:0 "Ruha's son, the dragon king of darkness, lord of the black waters."
 patron_god_rite_mani_ahriman_deity_01_icon:0 "$patron_god_rite_mani_ahriman_deity_01$"
 patron_god_rite_mani_ahriman_deity_01_desc:0 "The King of Darkness of the Manichaeans, whom his cult worships as the true master of the world."
 patron_god_rite_mani_ahriman_deity_02_icon:0 "$patron_god_rite_mani_ahriman_deity_02$"
 patron_god_rite_mani_ahriman_deity_02_desc:0 "The demon prince who swallowed the light and begot the first man to imprison it."
 patron_god_rite_mani_germanic_deity_01_icon:0 "$patron_god_rite_mani_germanic_deity_01$"
 patron_god_rite_mani_germanic_deity_01_desc:0 "Wulfila as the Wulfilists honour him, the teacher who gave the Goths their letters and their faith."
 patron_god_rite_mani_germanic_deity_02_icon:0 "$patron_god_rite_mani_germanic_deity_02$"
 patron_god_rite_mani_germanic_deity_02_desc:0 "The fair god of the North, the trapped light the Wulfilists see in the world, who will return."
 patron_god_rite_mani_norse_deity_01_icon:0 "$patron_god_rite_mani_norse_deity_01$"
 patron_god_rite_mani_norse_deity_01_desc:0 "The white god, watchman of the rainbow bridge, who sees the light in all things and sounds the horn at the end."
 patron_god_rite_mani_norse_deity_02_icon:0 "$patron_god_rite_mani_norse_deity_02$"
 patron_god_rite_mani_norse_deity_02_desc:0 "The wise head beneath the world tree, whose well holds the knowledge Odin paid an eye for."
 patron_god_rite_mani_slavic_deity_01_icon:0 "$patron_god_rite_mani_slavic_deity_01$"
 patron_god_rite_mani_slavic_deity_01_desc:0 "The Manichaean priest who preached to the Slavs and joined the light and darkness to their old gods."
 patron_god_rite_mani_slavic_deity_02_icon:0 "$patron_god_rite_mani_slavic_deity_02$"
 patron_god_rite_mani_slavic_deity_02_desc:0 "The White God, giver of good fortune, the light that wars against Chernobog."
 patron_god_rite_mandaeism_deity_01_icon:0 "$patron_god_rite_mandaeism_deity_01$"
 patron_god_rite_mandaeism_deity_01_desc:0 "Knowledge of Life, the messenger of the light who comes down to save the souls of the Mandaeans."
 patron_god_rite_mandaeism_deity_02_icon:0 "$patron_god_rite_mandaeism_deity_02$"
 patron_god_rite_mandaeism_deity_02_desc:0 "Seth as the Mandaeans know him, whose pure soul was the first to rise to the world of light."
 patron_god_rite_priscillianism_deity_01_icon:0 "$patron_god_rite_priscillianism_deity_01$"
 patron_god_rite_priscillianism_deity_01_desc:0 "The ascetic bishop of Ávila, the first heretic put to death by Christians, honoured in Gallaecia as a martyr."
 patron_god_rite_priscillianism_deity_02_icon:0 "$patron_god_rite_priscillianism_deity_02$"
 patron_god_rite_priscillianism_deity_02_desc:0 "The bishop who stood with Priscillian before the councils of Bordeaux and Trier, and went into exile for him."
 patron_god_rite_sabianism_deity_01_icon:0 "$patron_god_rite_sabianism_deity_01$"
 patron_god_rite_sabianism_deity_01_desc:0 "Thrice-great Hermes, whom the Sabians of Harran honour as their prophet and the teacher of the stars."
 patron_god_rite_sabianism_deity_02_icon:0 "$patron_god_rite_sabianism_deity_02$"
 patron_god_rite_sabianism_deity_02_desc:0 "The good spirit, the Sabians' second prophet, guardian of the world's angelic caretakers."
 patron_god_rite_cainitism_deity_01_icon:0 "$patron_god_rite_cainitism_deity_01$"
 patron_god_rite_cainitism_deity_01_desc:0 "The first son of Eve, whom the Cainites honour as the first victim of the Demiurge."
 patron_god_rite_cainitism_deity_02_icon:0 "$patron_god_rite_cainitism_deity_02$"
 patron_god_rite_cainitism_deity_02_desc:0 "The disciple whom the Cainites say alone knew the truth and freed the Saviour from the body."
 patron_god_rite_valentinianism_deity_01_icon:0 "$patron_god_rite_valentinianism_deity_01$"
 patron_god_rite_valentinianism_deity_01_desc:0 "Valentinus' pupil, who wrote the Letter to Flora on the three parts of the Law."
 patron_god_rite_sethianism_deity_01_icon:0 "$patron_god_rite_sethianism_deity_01$"
 patron_god_rite_sethianism_deity_01_desc:0 "The sister and wife of Seth, who burned Noah's ark three times and cried to the Light for rescue."
 patron_god_rite_daoxue_deity_01_icon:0 "$patron_god_rite_daoxue_deity_01$"
 patron_god_rite_daoxue_deity_01_desc:0 "The scholar of the Diagram of the Supreme Ultimate, who loved the lotus that grows clean from the mud."
 patron_god_rite_daoxue_deity_02_icon:0 "$patron_god_rite_daoxue_deity_02$"
 patron_god_rite_daoxue_deity_02_desc:0 "The Tang essayist who defended the Way of the sages against Buddhism and Daoism and called for a return to the ancient style."
 patron_god_rite_jingxue_deity_01_icon:0 "$patron_god_rite_jingxue_deity_01$"
 patron_god_rite_jingxue_deity_01_desc:0 "The Han master who wrote commentaries on all the classics and reconciled their schools."
 patron_god_rite_jingxue_deity_02_icon:0 "$patron_god_rite_jingxue_deity_02$"
 patron_god_rite_jingxue_deity_02_desc:0 "The descendant of Confucius who edited the Correct Meanings of the Five Classics for the Tang examinations."
 patron_god_rite_indoh_confucian_deity_01_icon:0 "$patron_god_rite_indoh_confucian_deity_01$"
 patron_god_rite_indoh_confucian_deity_01_desc:0 "Confucius as the Hellenes of the East call him, the sage whose teaching Empress Alexandra I brought into the Greek world."
 patron_god_rite_indoh_confucian_deity_02_icon:0 "$patron_god_rite_indoh_confucian_deity_02$"
 patron_god_rite_indoh_confucian_deity_02_desc:0 "The Hellenic empress who welcomed the teachings of Konphosios into her court."
 patron_god_rite_zhengyi_deity_01_icon:0 "$patron_god_rite_zhengyi_deity_01$"
 patron_god_rite_zhengyi_deity_01_desc:0 "The first Celestial Master, who received the covenant of the Orthodox One from Lord Lao on Crane-Call Mountain."
 patron_god_rite_zhengyi_deity_02_icon:0 "$patron_god_rite_zhengyi_deity_02$"
 patron_god_rite_zhengyi_deity_02_desc:0 "The Celestial Master who ruled Hanzhong as a Daoist state, with free inns for travellers and mercy for the penitent."
 patron_god_rite_shangqing_deity_01_icon:0 "$patron_god_rite_shangqing_deity_01$"
 patron_god_rite_shangqing_deity_01_desc:0 "The Daoist woman of the Jin who returned as an immortal to reveal the scriptures of Highest Clarity."
 patron_god_rite_shangqing_deity_02_icon:0 "$patron_god_rite_shangqing_deity_02$"
 patron_god_rite_shangqing_deity_02_desc:0 "The hermit of Mount Mao, the 'prime minister in the mountains', who edited the Shangqing scriptures and the pharmacopoeia."
 patron_god_rite_quanzhen_deity_01_icon:0 "$patron_god_rite_quanzhen_deity_01$"
 patron_god_rite_quanzhen_deity_01_desc:0 "The founder of Complete Perfection, who lived in a grave he called the Tomb of the Living Dead."
 patron_god_rite_quanzhen_deity_02_icon:0 "$patron_god_rite_quanzhen_deity_02$"
 patron_god_rite_quanzhen_deity_02_desc:0 "The master who crossed the steppe to counsel the Great Khan and saved many lives with his words."
