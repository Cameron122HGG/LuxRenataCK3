l_english:
 # Title sets (gen_title_sets.py)
 LR_foreign_administration_hellenistic_modifier: "Foreign Administration (Hellenistic)"
 LR_foreign_administration_hellenistic_modifier_desc: "This ruler holds Hellenistic hyparchies, satrapies and strategiai without the right to them. Their natives resent it, and the lands are hard to hold until they are reorganised, handed to a ruler entitled to them, or lost."
 LR_foreign_administration_hellenistic_opinion: "Rules us as a foreign province"
 LR_title_set_hellenistic_creation_tooltip: "Only rulers of a Successor realm, rulers inside one and rulers of Hellenistic heritage may create Hellenistic hyparchies, satrapies and strategiai"
 LR_foreign_administration_roman_modifier: "Foreign Administration (Roman)"
 LR_foreign_administration_roman_modifier_desc: "This ruler holds Roman provinces, dioceses and praetorian prefectures without the right to them. Their natives resent it, and the lands are hard to hold until they are reorganised, handed to a ruler entitled to them, or lost."
 LR_foreign_administration_roman_opinion: "Rules us as a foreign province"
 LR_title_set_roman_creation_tooltip: "Only restored Roman emperors and rulers inside a restored Roman empire may create Roman provinces, dioceses and praetorian prefectures"
 LR_eastern_roman_theme_creation_tooltip: "Only restored Roman emperors and rulers inside a restored Roman empire may create the Eastern Roman themes, catepanates and exarchates"
