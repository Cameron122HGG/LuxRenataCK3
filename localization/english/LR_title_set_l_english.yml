l_english:
 # Title sets (gen_title_sets.py)
 LR_foreign_administration_hellenistic_modifier: "Foreign Administration (Hellenistic)"
 LR_foreign_administration_hellenistic_modifier_desc: "This ruler holds Hellenistic hyparchies, satrapies and strategiai without the right to them. Their natives resent it, and the lands are hard to hold until they are reorganised, handed to a ruler entitled to them, or lost."
 LR_foreign_administration_hellenistic_opinion: "Rules us as a foreign province"
 LR_title_set_hellenistic_creation_tooltip: "Only rulers of a Successor realm, rulers inside one and rulers of Hellenistic heritage may create Hellenistic hyparchies, satrapies and strategiai"
 LR_foreign_administration_roman_modifier: "Foreign Administration (Roman)"
 LR_foreign_administration_roman_modifier_desc: "This ruler holds Roman provinces, dioceses and praetorian prefectures without the right to them. Their natives resent it, and the lands are hard to hold until they are reorganised, handed to a ruler entitled to them, or lost."
 LR_foreign_administration_roman_opinion: "Rules us as a foreign province"
 LR_title_set_roman_creation_tooltip: "Only restored Roman emperors and rulers inside a restored Roman empire may create Roman provinces, dioceses and praetorian prefectures"
 LR_eastern_roman_theme_creation_tooltip: "Only restored Roman emperors and rulers inside a restored Roman empire may create the Eastern Roman themes, catepanates and exarchates"
 LR_foreign_administration_themes_modifier: "Foreign Administration (Themes)"
 LR_foreign_administration_themes_modifier_desc: "This ruler holds Eastern Roman themes, catepanates and exarchates outside a restored Roman empire. Their natives resent it, and the lands are hard to hold until they return to the Empire, are handed to a ruler entitled to them, or are lost."
 LR_foreign_administration_themes_opinion: "Rules us as a foreign province"

 # Reorganise decisions (gen_title_set_reorganise.py)
 LR_title_set_reorganise_decision_trigger: "You completely control the lands of a satrapy that can be reorganised"
 LR_provincialise_satrapies_decision: "Provincialise a Satrapy"
 LR_provincialise_satrapies_decision_desc: "The satraps and hyparchs of the Successors have no place in the order of Rome. Let the lands of a satrapy be divided into Roman provinces and set under their dioceses."
 LR_provincialise_satrapies_decision_tooltip: "Reorganise a satrapy you hold into Roman provinces and dioceses"
 LR_provincialise_satrapies_decision_confirm: "Appoint the Governors"
 LR_provincialise_satrapies_decision_effect_tt: "The satrapy's counties move into their Roman provinces under the matching dioceses. Hyparchies and satrapies left without land are dissolved, and their holders receive the province or diocese over their old capital."
 LR_restore_satrapies_from_provinces_decision: "Restore a Satrapy from the Provinces"
 LR_restore_satrapies_from_provinces_decision_desc: "Roman governors have carved the lands of the Successors into provinces and dioceses. Let the satrapy of old be restored over them and divided again into hyparchies."
 LR_restore_satrapies_from_provinces_decision_tooltip: "Restore a satrapy over lands now in Roman provinces"
 LR_restore_satrapies_from_provinces_decision_confirm: "Appoint the Satraps"
 LR_restore_satrapies_from_provinces_decision_effect_tt: "The satrapy is restored and divided into hyparchies. Roman provinces and dioceses left without land are dissolved, and their holders receive the hyparchy or satrapy over their old capital."

 # Roman vassal tiers (user, 2026-11-05)
 LR_decayed_roman_no_vassal_kingdoms_tooltip: "A decayed Roman empire cannot have vassal kings. Only a restored Roman empire may raise kings beneath it"
