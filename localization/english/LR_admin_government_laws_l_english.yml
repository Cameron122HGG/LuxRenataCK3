l_english:
 # Realm laws of the non-Roman administrative governments (gen_admin_laws.py, 2026-11-05)

 # alexandrian_administrative_government
 alexandrian_bureaucracy: "$imperial_bureaucracy$"
 alexandrian_bureaucracy_0: "Free Satrapies"
 alexandrian_bureaucracy_0_desc: "The satraps rule their provinces much as the Persian satraps did, and the king asks only for tribute and troops."
 alexandrian_bureaucracy_0_effects: "$imperial_bureaucracy_0_effects$"
 alexandrian_bureaucracy_1: "Royal Epistatai" # Greek epistates, overseer, the king's officer set over a city or district
 alexandrian_bureaucracy_1_desc: "Royal overseers sit beside the satraps and report to the king on everything they do."
 alexandrian_bureaucracy_1_effects: "$imperial_bureaucracy_1_effects$"
 alexandrian_bureaucracy_1_effects_not_in_prev: "$imperial_bureaucracy_1_effects_not_in_prev$"
 alexandrian_bureaucracy_2: "Royal Scribes" # Greek basilikos grammateus, the royal scribe of Ptolemaic Egypt
 alexandrian_bureaucracy_2_desc: "The royal scribes keep the registers of land, harvest and tax in every district, and the court governs through them."
 alexandrian_bureaucracy_2_effects: "$imperial_bureaucracy_2_effects$"
 alexandrian_bureaucracy_2_effects_not_in_prev: "$imperial_bureaucracy_2_effects_not_in_prev$"
 alexandrian_bureaucracy_3: "Spear-Won Land" # Greek doriktetos chora, land won by the spear, the Hellenistic claim that conquered land belongs to the king
 alexandrian_bureaucracy_3_desc: "All the land is the king's by right of conquest, and every governor holds it at his pleasure."
 alexandrian_bureaucracy_3_effects: "$imperial_bureaucracy_3_effects$"
 alexandrian_bureaucracy_3_effects_not_in_prev: "$imperial_bureaucracy_3_effects_not_in_prev$"

 # gupta_administrative_government
 gupta_bureaucracy: "$imperial_bureaucracy$"
 gupta_bureaucracy_0: "Samanta Lords" # Sanskrit samanta, a neighbouring or subordinate lord
 gupta_bureaucracy_0_desc: "The provinces are held by samantas, subject lords who pay tribute and keep their own courts."
 gupta_bureaucracy_0_effects: "$imperial_bureaucracy_0_effects$"
 gupta_bureaucracy_1: "Royal Kumaramatyas" # Sanskrit kumaramatya, a high officer of the Gupta court
 gupta_bureaucracy_1_desc: "Officers of the royal court are sent out to the provinces and answer to the king."
 gupta_bureaucracy_1_effects: "$imperial_bureaucracy_1_effects$"
 gupta_bureaucracy_1_effects_not_in_prev: "$imperial_bureaucracy_1_effects_not_in_prev$"
 gupta_bureaucracy_2: "Council of Mantrins" # Sanskrit mantriparishad, the council of ministers
 gupta_bureaucracy_2_desc: "The king rules through his council of ministers, and the provinces through their departments."
 gupta_bureaucracy_2_effects: "$imperial_bureaucracy_2_effects$"
 gupta_bureaucracy_2_effects_not_in_prev: "$imperial_bureaucracy_2_effects_not_in_prev$"
 gupta_bureaucracy_3: "Chakravartin Rule" # Sanskrit cakravartin, the universal ruler whose wheel turns everywhere
 gupta_bureaucracy_3_desc: "The king is the universal ruler, and the governors are his servants and nothing more."
 gupta_bureaucracy_3_effects: "$imperial_bureaucracy_3_effects$"
 gupta_bureaucracy_3_effects_not_in_prev: "$imperial_bureaucracy_3_effects_not_in_prev$"

 # iqta_administrative_government
 iqta_bureaucracy: "$imperial_bureaucracy$"
 iqta_bureaucracy_0: "Free Amirates" # Arabic amir, commander
 iqta_bureaucracy_0_desc: "The amirs hold their provinces as their own, and the sultan asks only for the khutba and tribute."
 iqta_bureaucracy_0_effects: "$imperial_bureaucracy_0_effects$"
 iqta_bureaucracy_1: "Iqta Registers" # Arabic iqta, an assignment of revenue
 iqta_bureaucracy_1_desc: "Every iqta is written in the registers, and the sultan's officers check what each holder owes."
 iqta_bureaucracy_1_effects: "$imperial_bureaucracy_1_effects$"
 iqta_bureaucracy_1_effects_not_in_prev: "$imperial_bureaucracy_1_effects_not_in_prev$"
 iqta_bureaucracy_2: "The Diwans" # Arabic diwan, a ministry or register office
 iqta_bureaucracy_2_desc: "The ministries of the court govern the provinces, and the governors carry out their orders."
 iqta_bureaucracy_2_effects: "$imperial_bureaucracy_2_effects$"
 iqta_bureaucracy_2_effects_not_in_prev: "$imperial_bureaucracy_2_effects_not_in_prev$"
 iqta_bureaucracy_3: "The Sultan's Command" # Arabic sultan, power, authority
 iqta_bureaucracy_3_desc: "The sultan's command is the only law, and governors serve at his pleasure."
 iqta_bureaucracy_3_effects: "$imperial_bureaucracy_3_effects$"
 iqta_bureaucracy_3_effects_not_in_prev: "$imperial_bureaucracy_3_effects_not_in_prev$"

 # persianate_administrative_government
 persianate_bureaucracy: "$imperial_bureaucracy$"
 persianate_bureaucracy_0: "Houses of the Marzbans" # Middle Persian marzban, warden of the border
 persianate_bureaucracy_0_desc: "The great houses hold the provinces as hereditary wardens and pay the king of kings what they choose."
 persianate_bureaucracy_0_effects: "$imperial_bureaucracy_0_effects$"
 persianate_bureaucracy_1: "Royal Dibirs" # Middle Persian dibir, scribe
 persianate_bureaucracy_1_desc: "Royal scribes keep the registers of the land tax in every province and report to the court."
 persianate_bureaucracy_1_effects: "$imperial_bureaucracy_1_effects$"
 persianate_bureaucracy_1_effects_not_in_prev: "$imperial_bureaucracy_1_effects_not_in_prev$"
 persianate_bureaucracy_2: "Divan of the Wuzurg Framadar" # Middle Persian wuzurg framadar, the great commander, the chief minister
 persianate_bureaucracy_2_desc: "The chief minister and his divan govern the realm, and the governors answer to them."
 persianate_bureaucracy_2_effects: "$imperial_bureaucracy_2_effects$"
 persianate_bureaucracy_2_effects_not_in_prev: "$imperial_bureaucracy_2_effects_not_in_prev$"
 persianate_bureaucracy_3: "Royal Farr" # Middle Persian farr, the divine glory that marks a rightful king
 persianate_bureaucracy_3_desc: "The king of kings rules by the divine glory he alone holds, and no one shares his power."
 persianate_bureaucracy_3_effects: "$imperial_bureaucracy_3_effects$"
 persianate_bureaucracy_3_effects_not_in_prev: "$imperial_bureaucracy_3_effects_not_in_prev$"

 # western_administrative_government
 carolingian_bureaucracy: "$imperial_bureaucracy$"
 carolingian_bureaucracy_0: "Free Counts"
 carolingian_bureaucracy_0_desc: "The counts govern their counties as they see fit and come to the king only when he calls the host."
 carolingian_bureaucracy_0_effects: "$imperial_bureaucracy_0_effects$"
 carolingian_bureaucracy_1: "Missi Dominici" # Latin missi dominici, envoys of the lord
 carolingian_bureaucracy_1_desc: "Envoys of the king ride through the counties in pairs to hear complaints and check the counts."
 carolingian_bureaucracy_1_effects: "$imperial_bureaucracy_1_effects$"
 carolingian_bureaucracy_1_effects_not_in_prev: "$imperial_bureaucracy_1_effects_not_in_prev$"
 carolingian_bureaucracy_2: "Capitularies" # Latin capitularia, royal ordinances divided into chapters
 carolingian_bureaucracy_2_desc: "The king's ordinances, written chapter by chapter, bind every count in the realm."
 carolingian_bureaucracy_2_effects: "$imperial_bureaucracy_2_effects$"
 carolingian_bureaucracy_2_effects_not_in_prev: "$imperial_bureaucracy_2_effects_not_in_prev$"
 carolingian_bureaucracy_3: "Renovatio Imperii" # Latin renovatio imperii, renewal of the empire
 carolingian_bureaucracy_3_desc: "The empire of the Romans is renewed, and all its offices answer to the emperor."
 carolingian_bureaucracy_3_effects: "$imperial_bureaucracy_3_effects$"
 carolingian_bureaucracy_3_effects_not_in_prev: "$imperial_bureaucracy_3_effects_not_in_prev$"

 # hellenistic_autocratic_government, hellenistic_imperial_government
 hellenistic_bureaucracy: "$meritocratic_bureaucracy$"
 hellenistic_bureaucracy_0: "Free Poleis" # Greek polis, city
 hellenistic_bureaucracy_0_desc: "The Greek cities keep their own councils and laws, and the king rules through them."
 hellenistic_bureaucracy_0_effects: "$meritocratic_bureaucracy_0_effects$"
 hellenistic_bureaucracy_1: "The King's Philoi" # Greek philoi, friends, the title of the king's courtiers and officers
 hellenistic_bureaucracy_1_desc: "The king's Friends, his courtiers and officers, govern the provinces in his name."
 hellenistic_bureaucracy_1_effects: "$meritocratic_bureaucracy_1_effects$"
 hellenistic_bureaucracy_1_effects_not_in_prev: "$meritocratic_bureaucracy_1_effects_not_in_prev$"
 hellenistic_bureaucracy_2: "Royal Chancery"
 hellenistic_bureaucracy_2_desc: "The king's chancery issues his letters and decrees, and the governors carry them out."
 hellenistic_bureaucracy_2_effects: "$meritocratic_bureaucracy_2_effects$"
 hellenistic_bureaucracy_2_effects_not_in_prev: "$meritocratic_bureaucracy_2_effects_not_in_prev$"
 hellenistic_bureaucracy_3: "Ruler Cult"
 hellenistic_bureaucracy_3_desc: "The king is honoured as a god and a saviour, and his will is beyond question."
 hellenistic_bureaucracy_3_effects: "$meritocratic_bureaucracy_3_effects$"

 # persianate_autocratic_government
 persianate_imperial_bureaucracy: "$meritocratic_bureaucracy$"
 persianate_imperial_bureaucracy_0: "Great Houses" # Middle Persian wuzurgan, the great ones, the high nobility
 persianate_imperial_bureaucracy_0_desc: "The great houses share the empire with the king of kings and govern their lands as they please."
 persianate_imperial_bureaucracy_0_effects: "$meritocratic_bureaucracy_0_effects$"
 persianate_imperial_bureaucracy_1: "Ostandars' Registers" # Middle Persian ostandar, holder of a province
 persianate_imperial_bureaucracy_1_desc: "The governors keep registers of their provinces and send them to the court."
 persianate_imperial_bureaucracy_1_effects: "$meritocratic_bureaucracy_1_effects$"
 persianate_imperial_bureaucracy_1_effects_not_in_prev: "$meritocratic_bureaucracy_1_effects_not_in_prev$"
 persianate_imperial_bureaucracy_2: "Divan of the Wuzurg Framadar" # Middle Persian wuzurg framadar, the great commander, the chief minister
 persianate_imperial_bureaucracy_2_desc: "The chief minister and his divan govern the empire, and the governors answer to them."
 persianate_imperial_bureaucracy_2_effects: "$meritocratic_bureaucracy_2_effects$"
 persianate_imperial_bureaucracy_2_effects_not_in_prev: "$meritocratic_bureaucracy_2_effects_not_in_prev$"
 persianate_imperial_bureaucracy_3: "Royal Farr" # Middle Persian farr, the divine glory that marks a rightful king
 persianate_imperial_bureaucracy_3_desc: "The king of kings rules by the divine glory he alone holds, and no one shares his power."
 persianate_imperial_bureaucracy_3_effects: "$meritocratic_bureaucracy_3_effects$"
