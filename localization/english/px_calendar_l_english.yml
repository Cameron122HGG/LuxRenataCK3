l_english:
 # Generated by 'Paradox: Generate Calendar Localization' from the px.calendar
 # setting. Edit px.calendar and regenerate instead of editing by hand.
 # Script year >= 5001 shows as (year - 5000) AD; below as (5001 - year) BC.
 PX_CAL_YEAR:0 "[Select_int32( GreaterThanOrEqualTo_int32( '(int32)$YEAR|q$', '(int32)5001' ), Subtract_int32( '(int32)$YEAR|q$', '(int32)5000' ), Subtract_int32( '(int32)5001', '(int32)$YEAR|q$' ) )]"
 PX_CAL_ERA:0 "[Select_CString( GreaterThanOrEqualTo_int32( '(int32)$YEAR|q$', '(int32)5001' ), 'A.D', 'B.C' )]"
