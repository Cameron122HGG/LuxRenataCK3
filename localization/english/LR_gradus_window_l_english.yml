 LR_gradus_my_group_barbarian: "Barbarian"
 LR_GRADUS_TXT_OVERVIEW: "[gradus|E] (Latin #italic gradus#!, a step, a rank) is how governments work in Lux Renata. In place of vanilla's handful of governments, every [culture|E] belongs to a [government_group|E] of [governments|E], and each group is a #high ladder#! a [realm|E] climbs step by step.\n\nIts six letters are its six rules:\n\n#high G, Groups:#! a [culture|E]'s government [tradition|E] decides which family of governments its rulers use.\n#high R, Ranks:#! each group is a ladder: plain, dynastic, administrative, imperial and, at the top, universal.\n#high A, Alignment:#! [realms|E] that mix groups follow fixed rules. Administrations follow the [top_liege|E]; feudal [vassals|E] keep their own customs.\n#high D, DLC twins:#! every rank has a stand-in, so the system works with or without the DLC.\n#high U, Upgrades:#! the imperial and universal ranks are earned by [decisions|E], and only at the right [title_tier|E].\n#high S, Supersession:#! vanilla [feudal|E], [clan|E] and [administrative|E] governments never stay in play. Lux Renata always swaps in your group's government.\n\nOne rule sits over all six: #high one grammar, different flesh#!. The ladder is the same for every group; what fills each step is not.\n\nThe panel on the left shows where #italic you#! stand: your group, your government and its next step."
 LR_GRADUS_TXT_GROUPS: "Every [culture|E] has one #high government#! [tradition|E]. The tradition picks the group, and the group picks your government whenever you gain land, change rank or change [liege|E].\n\n#high Classical#! (Classical Statecraft): Latin, Byzantine, Greek and Hellenistic peoples, the Brythons, the Caucasus, Albanians, Vlachs, Ostrogoths, Visigoths, Suebi and Vandals.\n#high Western#! (Feudum): Franks, Germans, Iberians, Gaels, Illyrians, Balts, Finns and Slavs.\n#high Persianate#! (Persianate Court): Iranians, Sarmatians and Turks.\n#high Malkuta#! (Malkuta): Arabs, Israelites, Syriacs, Phoenicians and Berbers.\n#high Nilotic#! (Nilotic Kingship): East Africa, Egypt, Somalia and Ethiopia.\n#high Sudanic#! (Sudanic Kingship): West and Central Africa, the Sahel and the Bantu peoples.\n#high Indic#! (Dharmic Kingship): Indo-Aryan and Dravidian India, Burma and the Mon-Khmer.\n#high Sinic#! (Mandate of Heaven): China, Korea, Vietnam, the Tai, Tibet, the Mongols and the Tungus.\n#high Japanese#! (Ritsuryo Tradition): Japan and the Ainu.\n#high Barbarian#! (Tribal Confederation): Goths, Huns, Magyars and the Ugro-Permian and Volga-Finnic peoples.\n\nTwo groups are not set by culture. #high Iqta#! (Islamicate) is a [faith|E] rule: every Muslim ruler uses the Iqta governments, and non-Muslims leave them. #high Sacral#! belongs to the Sacral Kingdom of Gaul and its [realm|E].\n\nA culture left without a tradition lives in [gradus_anarchy|E], with penalties until it settles on one. Cultures can take up a new government tradition through the normal [tradition|E] system; it is easier when much of the culture already lives under that group.\n\n#weak Outside the groups:#! the #high Potentes#!, a merchant house, and the #high Archontes#!, the lords it becomes, are a side road into landed rule."
 LR_GRADUS_TXT_RANKS: "Each group is a ladder. You climb by decision, and fall back when you lose what a rank needs: a DLC, a [title|E] or a [faith|E].\n\n[gradus_plain_rank|E]: the group's base government, on the [feudal|E] mechanic (Iqta on the [clan|E] mechanic).\n[gradus_dynastic_rank|E]: [noble_families|E] and [Concept('estate','estates')|E], still feudal. Needs Roads to Power and All Under Heaven.\n[gradus_administrative_rank|E]: [governors|E], [provinces|E], [noble_families|E] and [title_men_at_arms|E]. Taken through #high Convert to Administrative#!.\n[gradus_imperial_rank|E]: above the administrations, earned by [decision|E] at [empire|E] tier.\n[gradus_universal_rank|E]: a claim to rule the whole world, not one realm among others. It is the top of every settled group's ladder.\n\n#high The ladders#! (plain > dynastic > administrative > imperial > universal):\n\n#high Roman#!: Classical > Patriciate > Magistratus > Imperium > Roman Principate or Roman Dominate\n#high Hellenistic#!: Classical > Hetaireia > Epimeleia > Basileia > Kosmokratoria\n#high Western#!: Feudum > Dominium > Ministerium > Renovatio > Universum Regnum\n#high Persianate#!: Dihqan > Azatan > Dibiran > Shahanshahi > Farr\n#high Malkuta#!: Malkuta > Bet Abba > Safra > Rabuta > Alma\n#high Nilotic#!: Ouru > Mekwanent > Shumshir > Mangist > Kebra\n#high Sudanic#!: Kafu > Horon > Farma > Askiya > Kurufaba\n#high Iqta#!: Iqta > Amirate > Wizara > Sultanate > Imama\n#high Indic#!: Rajya > Samanta > Amatya > Samrajya > Sarvabhauma\n#high Sinic#!: Fangguo > Fengjian > Junxian > Keju > Tianchao\n#high Japanese#!: Uji > Soryo > Ritsuryo > Chotei > Bakufu or Tenka\n#high Sacral#!: Rigion > Manorial > Palatine > Unctio > Maiestas\n#high Barbarian#!: Teuta, a rank to grow out of, with no ladder above it\n\nConvert to Administrative offers an [independent_ruler|E] only their own group's administrations, and a [vassal|E] only their [top_liege|E]'s. Classical [rulers|E] of Hellenistic [heritage|E] take the Hellenistic branch, the others the Roman one."
 LR_GRADUS_TXT_MIXED: "A [realm|E] can hold [vassals|E] of several groups. Each group's administration has its own province types, so administrations cannot mix. GRADUS fixes the rules:\n\n#high 1. Administrative vassals follow the top liege.#! A vassal on any administration takes the [top_liege|E]'s administration. If the top liege is not administrative, the vassal goes feudal. Muslims stay Iqta.\n#high 2. Feudal vassals keep their own group.#! A Western count under a Persianate shah stays Western. But they resent a top liege of other customs ([foreign_customs|E], -10 [opinion|E]), and a realm with 3 or 6 such vassals pays for it ([realm_of_many_customs|E], -5% or -10% [vassal|E] [taxes|E] and [levies|E]).\n#high 3. Conforming.#! A vassal can #high Adopt the Customs of the Realm#! (a [decision|E], 150 [prestige|E]), and a top liege can #high Demand Conformity#! of a direct [vassal|E] (an [interaction|E]).\n#high 4.#! The [realm_customs_law|E] ([kingdom|E] tier and up): #high Many Customs#! means no resentment, but a heavier cost (-10% or -15%); #high Customary#! (the default) follows rules 1 to 3; #high One Custom#! brings sharper resentment (-20), and each year vassals are pressed to conform.\n#high 5. Cultural toleration#! softens or sharpens all of this between neighbouring groups.\n\nRule 1 holds under every Realm Customs law; the law only touches feudal vassals."
 LR_GRADUS_TXT_DLC: "GRADUS works with any DLC set: every rank has a stand-in.\n\n#high Dynastic#! and #high administrative#! ranks need Roads to Power and All Under Heaven. Without them, a dynastic government becomes its plain twin, and back again when the DLC is on.\nWith #high Roads to Power alone#!, every group shares one administrative rank: #high Autocratic#!. Your group still decides your [titles|E], [traditions|E] and [decisions|E].\n#high Imperial#! ranks need All Under Heaven; with Roads to Power alone they become Autocratic, with neither the plain government.\n#high Universal#! ranks need All Under Heaven. The Roman and Hellenistic ones need all three: Roads to Power, Silk and Silver and All Under Heaven. Without them a universal rank falls back to its group's imperial rank.\n\n#high The ladder per DLC set:#!\nNo DLC: plain\nRoads to Power: plain and Autocratic\nRoads to Power and All Under Heaven: plain, dynastic, administrative, imperial and most universal ranks\nWith Silk and Silver too: the Roman and Hellenistic universal ranks as well.\n\nThe panel on the left shows which of the three GRADUS sees for you."
 LR_GRADUS_TXT_UPGRADES: "Imperial and universal governments are not handed out. They are earned by [decision|E], at the right [title_tier|E]. Look for them in the Decisions window: each says what it needs.\n\n#high Imperial ranks#! (Imperium, Basileia, Renovatio, Shahanshahi, Rabuta, Mangist, Askiya, Sultanate, Samrajya, Keju, Chotei, Unctio) sit above the administrations and need an [empire|E]-tier [realm|E].\n#high Most universal ranks follow a#! [hegemony|E] #high title#!: the Kosmokratoria the Hellenistic Empire, Tianchao the throne of China (rival claimants of the Mandate keep it), Farr Eranshahr, Sarvabhauma India or the Ashvamedha, Bakufu and Tenka Japan after its two endings, Universum Regnum the Holy Roman Empire, Maiestas the Sacral Empire, Imama the Dar al-Islam and Alma the Kingdom of Israel.\n#high The rest are taken by#! [decision|E] #high at#! [hegemony|E] #high tier#!: the Roman Principate and Dominate, Alma (also), Kebra and Kurufaba.\n\n#high The Roman ladder#! is the longest: the empire is restored through its dioceses and prefectures, Caesars can be named over its commands, and an emperor may rule as Princeps with the Senate or as Dominus. The Imperium window shows where your Rome stands.\n\nLose the [title|E] a rank stands on, or the DLC it needs, and you step back down the ladder."
