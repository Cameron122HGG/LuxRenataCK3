 LR_gradus_my_group_none: "None (Anarchy, or outside the groups)"
 LR_gradus_dlc_on: "#P on#!"
 LR_gradus_dlc_off: "#N off#!"
 LR_gradus_my_group_potentes: "Potentes (outside the groups)"
 LR_gradus_my_group_islamic: "Iqta (Islamicate)"
