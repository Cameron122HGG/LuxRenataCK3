 LR_gradus_my_group_classical: "Classical"
 LR_gradus_my_group_western: "Western"
 LR_gradus_my_group_despotic: "Persianate"
 LR_gradus_my_group_mamlakah: "Malkuta"
 LR_gradus_my_group_nilotic: "Nilotic"
 LR_gradus_my_group_sudanic: "Sudanic"
 LR_gradus_my_group_indic: "Indic"
 LR_gradus_my_group_sinic: "Sinic"
