 LR_GRADUS_WIN_RANK: "[GetPlayer.Custom('LR_gradus_my_rank')]"
 LR_GRADUS_WIN_DLC: "#weak DLC GRADUS sees#!\nRoads to Power: [GetPlayer.Custom('LR_gradus_dlc_rtp')]\nAll Under Heaven: [GetPlayer.Custom('LR_gradus_dlc_auh')]\nSilk and Silver: [GetPlayer.Custom('LR_gradus_dlc_gdp')]"
 LR_GRADUS_WIN_FOOT: "Hover your government's name in the character window for its full description."
