 LR_soul_traditional_0: "Predominant Traditions"
 LR_soul_traditional_0_desc: "Power lies with the keepers of tradition; the ruler can do little against them."
 LR_soul_traditional_1: "Rigid Traditions"
 LR_soul_traditional_1_desc: "The keepers of tradition keep much of their power."
 LR_soul_traditional_2: "Influential Traditions"
 LR_soul_traditional_2_desc: "Ruler and the keepers of tradition share power in balance."
 LR_soul_traditional_3: "Flexible Traditions"
