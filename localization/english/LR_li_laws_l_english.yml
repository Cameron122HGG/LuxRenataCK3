 LR_soul_messianic_0: "No Messianic Influence"
 LR_soul_messianic_0_desc: "Power lies with the faithful; the ruler can do little against them."
 LR_soul_messianic_1: "Loose Messianic Guidance"
 LR_soul_messianic_1_desc: "The faithful keep much of their power."
 LR_soul_messianic_2: "Effective Messianic Guidance"
 LR_soul_messianic_2_desc: "Ruler and the faithful share power in balance."
 LR_soul_messianic_3: "Inspiring Messianic Leadership"
 LR_soul_messianic_3_desc: "The ruler bends the faithful to the realm's ends."
 LR_soul_messianic_4: "Fanatic Messianic Leadership"
 LR_soul_messianic_4_desc: "The ruler rules the faithful outright."
 LR_religious_tolerance: "Religious Tolerance"
 LR_religious_tolerance_desc: "How the realm treats other faiths. Tolerant realms win their trust and convert more slowly; Intolerant ones convert faster and please the zealous, at a cost with everyone else. From Lux Invicta."
 LR_religious_tolerance_0: "Tolerant Policy"
 LR_religious_tolerance_0_desc: "The realm tolerates other faiths: they trust it more, and conversion costs more piety."
 LR_religious_tolerance_1: "Indifferent"
 LR_religious_tolerance_1_desc: "The realm neither favours nor persecutes other faiths."
 LR_religious_tolerance_2: "Intolerant Policy"
 LR_religious_tolerance_2_desc: "The realm presses other faiths: conversion is cheaper and the zealous approve, but other faiths resent it. Enforcing it needs a Moderately Centralized realm or more."
 LR_li_intolerance_needs_centralization_tt: "The realm is at least Moderately Centralized"
 LR_clan_centralization: "Control on Clans"
 LR_clan_centralization_desc: "How firmly the overlord holds the clans and tribes together. It is not chosen: it follows the realm's [gradus_rank|E], its tribal authority and its Soul law, and is updated every year. From Lux Invicta."
 LR_centralization: "Centralization"
 LR_centralization_desc: "How firmly the ruler holds the realm together. It is not chosen: it follows the realm's [gradus_rank|E], its crown or tribal authority and its Soul law, and is updated every year. A loose realm can hold more vassals and land; a tight one draws more taxes and levies from them. From Lux Invicta."
 LR_li_centralization_automatic_tt: "Centralization follows the realm: its GRADUS rank, its crown or tribal authority and its Soul law"
 LR_centralization_0: "Decentralized"
 LR_centralization_0_desc: "The realm holds together on custom and distrust of outsiders alone. Its ruler can hold many vassals and lands, but draws little from them."
 LR_clan_centralization_0: "Autonomous Clans and Tribes"
 LR_clan_centralization_0_desc: "The chieftains think of themselves as all but independent, and see their overlord as first among equals."
 LR_centralization_1: "Slightly Centralized"
 LR_centralization_1_desc: "Mustering men and money from vassals is a little more effective."
 LR_clan_centralization_1: "Minor Control on Clans and Tribes"
 LR_clan_centralization_1_desc: "The chieftains pay a symbolic tribute and send a few warriors to their liege's wars."
 LR_centralization_2: "Moderately Centralized"
 LR_centralization_2_desc: "The ruler can muster men and money from vassals effectively."
 LR_clan_centralization_2: "Moderate Control on Clans and Tribes"
 LR_clan_centralization_2_desc: "The chieftains grant their overlord more say, while keeping wide autonomy."
 LR_centralization_3: "Highly Centralized"
 LR_centralization_3_desc: "The ruler draws more men and money from vassals, at the cost of fewer of them."
 LR_clan_centralization_3: "Federation of Clans and Tribes"
 LR_clan_centralization_3_desc: "The clans and tribes recognize lasting institutions beyond the oath to their overlord."
 LR_centralization_4: "Maximum Centralization"
 LR_centralization_4_desc: "The ruler squeezes the most men and money from fewer vassals."
 LR_clan_centralization_4: "Integrated Clans and Tribes"
 LR_clan_centralization_4_desc: "The clans and tribes see themselves as one state, after the great empires of old."
 LR_women_status: "Status of Women"
 LR_women_status_desc: "Which women the realm admits to its council. Where the faith already allows it, a realm may keep its council narrower. From Lux Invicta."
 LR_women_status_0: "Women Excluded"
 LR_women_status_0_desc: "No woman sits on the council but the ruler."
 LR_women_status_1: "Royal Women Only"
 LR_women_status_1_desc: "Only women of the ruler's close family sit on the council."
 LR_women_status_2: "Limited Influence"
 LR_women_status_2_desc: "Women of the ruler's family, and women of great skill (12 or more in a council skill), sit on the council."
 LR_women_status_3: "Notable Influence"
 LR_women_status_3_desc: "Women of the ruler's family, and women of some skill (8 or more in a council skill), sit on the council."
 LR_women_status_4: "Full Status"
 LR_women_status_4_desc: "Women sit on the council as freely as their faith allows."
 LR_female_marshals: "Female Marshals"
 LR_female_marshals_desc: "Which women may lead the realm's armies and fight as its knights. Where culture and faith already allow it, a realm may hold them to a higher standard. From Lux Invicta."
 LR_female_marshals_0: "Forbidden"
 LR_female_marshals_0_desc: "Women may not command or fight for the realm."
 LR_female_marshals_1: "Allowed"
 LR_female_marshals_1_desc: "Women of exceptional martial ability or prowess (16 or more) may command and fight."
 LR_female_marshals_2: "Accepted"
 LR_female_marshals_2_desc: "Women of above-average martial ability or prowess (12 or more) may command and fight."
 LR_female_marshals_3: "Approved"
 LR_female_marshals_3_desc: "Women command and fight as freely as their culture allows."
 LR_administration: "Administration"
 LR_administration_desc: "How the realm is run: by custom and patronage, by written law, or by a class of state servants. It readies the realm for the next [gradus_rank|E]: [gradus_administrative_rank|E] needs Legal Administration, and the [gradus_imperial_rank|E] decisions need Imperial Administration. From Lux Invicta."
 LR_administration_0: "Informal Administration"
 LR_administration_0_desc: "Society holds together by unwritten custom and patronage. The ruler leans on personal charisma and the loyalty of clients, as most of the barbarian world does."
 LR_administration_1: "Legal Administration"
 LR_administration_1_desc: "Written law, jurisprudence and rulings bind the realm, and lords can keep their inheritances whole. A realm needs it to take an [gradus_administrative_rank|E]."
 LR_administration_2: "Imperial Administration"
 LR_administration_2_desc: "A class of unlanded state servants runs the realm in the ruler's name, and landed vassals hold less power. A realm needs it for the [gradus_imperial_rank|E] decisions."
 LR_li_legal_needs_tt: "The realm is at least Slightly Centralized"
 LR_li_imperial_needs_tt: "The realm is at least Highly Centralized"
 LR_li_has_legal_administration_tt: "The realm has [Concept('law','Legal Administration')|E] or more"
 LR_li_has_imperial_administration_tt: "The realm has [Concept('law','Imperial Administration')|E]"
 LR_office_terms: "Office Terms"
 LR_office_terms_desc: "How long governors and the realm's appointed officers serve before the throne must reappoint them. Short terms keep noble families from digging in, at a cost in influence; long ones are cheap and stable. From Lux Invicta's term laws, after Rome's annual proconsuls."
 LR_office_terms_0: "Five-Year Terms"
 LR_office_terms_0_desc: "Officers serve five years. Families entrench little and pay more in, but every reappointment costs influence."
 LR_office_terms_1: "Ten-Year Terms"
 LR_office_terms_1_desc: "Officers serve ten years."
 LR_office_terms_2: "Twenty-Year Terms"
 LR_office_terms_2_desc: "Officers serve twenty years, the customary span."
 LR_office_terms_3: "Terms for Life"
 LR_office_terms_3_desc: "Officers serve for life: cheap and stable, but families dig in and pay less."
 LR_settle_the_people_decision: "Settle the People"
 LR_settle_the_people_decision_desc: "Our people have wandered and raided long enough. The land we rule has its own ways of government, older and more settled than ours; it is time our people took them up."
 LR_settle_the_people_decision_tooltip: "Your culture gives up its Barbarian government tradition for that of your capital's people."
 LR_settle_the_people_decision_confirm: "We shall settle"
 LR_republic_term_annual: "Annual Consulship"
 LR_republic_term_annual_desc: "The consuls serve a single year, as in the Republic of old: frequent elections and more chances for rival families, at a cost in stability."
