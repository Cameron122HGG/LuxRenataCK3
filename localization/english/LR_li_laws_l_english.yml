 # LR 2026-11-25 LI laws (tools/li_laws/build_li_laws.py)
 LR_li_one_step_tt: "Only from the neighbouring step of this law"
 LR_soul_populist_power: "People's Power"
 LR_soul_populist_power_desc: "How much power the people hold against the ruler, in a realm whose faith has the #high Populist Soul#!. Steps move one at a time; the controlling steps cost more."
 LR_soul_populist_0: "Popular Liberty"
 LR_soul_populist_0_desc: "Power lies with the people; the ruler can do little against them."
 LR_soul_populist_1: "Popular Autonomy"
 LR_soul_populist_1_desc: "The people keep much of their power."
 LR_soul_populist_2: "People under Control"
 LR_soul_populist_2_desc: "Ruler and the people share power in balance."
 LR_soul_populist_3: "Demagogic Guidance"
 LR_soul_populist_3_desc: "The ruler bends the people to the realm's ends."
 LR_soul_populist_4: "Demagogic Cult of Personality"
 LR_soul_populist_4_desc: "The ruler rules the people outright."
