 LR_soul_martial_1: "Loose Control on the Army"
 LR_soul_martial_1_desc: "The army keep much of their power."
 LR_soul_martial_2: "Average Control on the Army"
 LR_soul_martial_2_desc: "Ruler and the army share power in balance."
 LR_soul_martial_3: "Tight Control on the Army"
