 LR_soul_scholarly_1: "Innovative Expression"
 LR_soul_scholarly_1_desc: "The learned keep much of their power."
 LR_soul_scholarly_2: "Open Expression"
 LR_soul_scholarly_2_desc: "Ruler and the learned share power in balance."
 LR_soul_scholarly_3: "Steered Knowledge"
