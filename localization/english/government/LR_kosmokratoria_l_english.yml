 hellenistic_province_dyarchia_desc:0 "#low As Alexander ordered, the province has a civil satrap and a military strategos, each watching the other.#!"
 hellenistic_province_dyarchia_benefits:0 "Half the strength of a Satrapeia and of a Strategia, but a loyal governor: more [opinion|E] of the [liege|E] and quicker [control|E]. Only under the [hellenistic_kosmokratoria|E]."
