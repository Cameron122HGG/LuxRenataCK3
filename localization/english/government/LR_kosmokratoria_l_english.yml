l_english:
 # LR 2026-11-19 (user): the Kosmokratoria, the Hellenistic Universal government
 hellenistic_kosmokratoria_government:0 "Kosmokratoria"
 hellenistic_kosmokratoria_government_adjective:0 "Kosmokratoria"
 hellenistic_kosmokratoria_government_realm:0 "Kosmokratoria"
 hellenistic_kosmokratoria_icon_concept:0 "@government_type_hellenistic_kosmokratoria!"
 hellenistic_kosmokratoria_government_with_icon:0 "@government_type_hellenistic_kosmokratoria! $hellenistic_kosmokratoria_government$"
 hellenistic_kosmokratoria_government_desc:0 "\n$game_concept_hellenistic_kosmokratoria_desc$"
 hellenistic_kosmokratoria_government_vassal_opinion:0 "[hellenistic_kosmokratoria|E] [vassal|E] [opinion|E]"
 hellenistic_kosmokratoria_government_tax_contribution_add:0 "[hellenistic_kosmokratoria|E] [vassal|E] [tax|E] contribution"
 game_concept_hellenistic_kosmokratoria:0 "Kosmokratoria"
 game_concept_hellenistic_kosmokratoria_government:0 "Kosmokratoria"
 game_concept_hellenistic_kosmokratoria_i:0 "@government_type_hellenistic_kosmokratoria! $hellenistic_kosmokratoria_government$"
 game_concept_hellenistic_kosmokratoria_desc:0 "The Kosmokratoria is the rule of the world restored: Alexander's empire under one Kosmokrator. Above the [hellenistic_imperial|E] of the Diadochi, the Kosmokrator rules through the Philoi, the Friends of the King, of every nation of the realm; the army acclaims each new king; the cities grant him divine honours for his deeds; and the conquered peoples are bound to the Greeks by marriage and custom.\n\nOnly the ruler of Alexander's restored empire, with the #V Roads to Power#!, #V Silk & Silver#! and #V All Under Heaven#! DLCs."
 game_concept_hellenistic_kosmokratoria_government_desc:0 "$game_concept_hellenistic_kosmokratoria_desc$"
 LR_kosmokratoria_alexander_tt:0 "With #V Roads to Power#!, #V Silk & Silver#! and #V All Under Heaven#!, your government becomes [hellenistic_kosmokratoria|E] the next day"

 # Philoi offices (LR_kosmokratoria_court_positions.txt)
 LR_chiliarchos_court_position:0 "Chiliarchos"
 LR_chiliarchos_court_position_desc:0 "The Chiliarchos, commander of the first thousand of the Companions, is the second man of the realm: he leads the King's army and speaks for its officers. Philoi rise by merit."
 LR_somatophylax_court_position:0 "Somatophylax"
 LR_somatophylax_court_position_desc:0 "The Somatophylax is one of the King's seven bodyguards, his closest companions in battle and at court. Philoi rise by merit."
 LR_dioiketes_court_position:0 "Dioiketes"
 LR_dioiketes_court_position_desc:0 "The Dioiketes keeps the royal treasury and the revenues of the satrapies. Philoi rise by merit."
 LR_epistolographos_court_position:0 "Epistolographos"
 LR_epistolographos_court_position_desc:0 "The Epistolographos writes the King's letters to cities, satraps and kings. Philoi rise by merit."
 LR_archigrammateus_court_position:0 "Archigrammateus"
 LR_archigrammateus_court_position_desc:0 "The Archigrammateus keeps the royal records and the King's Ephemerides, and the memory of his deeds. Philoi rise by merit."

 # Army acclamation
 kosmokratoria_acclamation_succession_law:0 "Army Acclamation"
 kosmokratoria_acclamation_succession_law_desc:0 "As in the days of the Argeads, the Macedonians under arms acclaim the new king. Generals, the Philoi, the strategoi and the blood of the royal house carry the most weight."
 kosmokratoria_acclamation_succession_law_effects:0 "\nA type of [appointment_succession_law|E] used only by the [hellenistic_kosmokratoria|E]: as Acclamation, the candidate with the best score succeeds, and the army favours martial skill, prowess, [merit|E], commanders, the Philoi, the strategoi and the ruling dynasty.\n"
 LR_kosmokratoria_acclaim_martial_desc:0 "Acclaimed by the army: [martial_skill|E]"
 LR_kosmokratoria_acclaim_prowess_desc:0 "Acclaimed by the army: [prowess|E]"
 LR_kosmokratoria_acclaim_merit_desc:0 "Acclaimed by the army: [merit_level|E]"
 LR_kosmokratoria_acclaim_commander_desc:0 "Acclaimed by the army: a proven commander"
 LR_kosmokratoria_acclaim_guard_desc:0 "Chiliarchos or Somatophylax"
 LR_kosmokratoria_acclaim_philos_desc:0 "One of the Philoi"
 LR_kosmokratoria_acclaim_strategos_desc:0 "A strategos of the realm"
 LR_kosmokratoria_acclaim_royal_blood_desc:0 "Of the royal house"

 # Ruler cult
 LR_kosmokratoria_divine_honours_decision:0 "Receive Divine Honours"
 LR_kosmokratoria_divine_honours_decision_desc:0 "The cities of the oikoumene would raise altars to me, as they did to the Saviours and Benefactors of old. My deeds have earned it."
 LR_kosmokratoria_divine_honours_decision_tooltip:0 "Let the cities honour you as a god among men."
 LR_kosmokratoria_divine_honours_decision_confirm:0 "Accept the honours"
 LR_kosmokratoria_cult_epithet_tt:0 "You bear a cult epithet (from #V Choose a Hellenistic Epithet#!)"
 LR_kosmokratoria_divine_honours_effect_tt:0 "You gain #V Divine Honours#! for life: more [legitimacy|E], [prestige|E] and the [opinion|E] of your faith; vassals of monotheist faiths resent it"
 LR_kosmokratoria_divine_honours_megas_tt:0 "If you control all of Alexander's lands, you are honoured as #V Megas#!, the Great: stronger Divine Honours"
 LR_divine_honours_modifier:0 "Divine Honours"
 LR_divine_honours_modifier_desc:0 "The cities have voted this ruler the honours of a god."
 LR_divine_honours_megas_modifier:0 "Divine Honours: Megas"
 LR_divine_honours_megas_modifier_desc:0 "Master of all Alexander's lands, this ruler is honoured as a god and called the Great."
 LR_divine_honours_monotheist_opinion:0 "Claims Divine Honours"

 # Fusion policy
 LR_kosmokratoria_susa_weddings_decision:0 "Hold the Susa Weddings"
 LR_kosmokratoria_susa_weddings_decision_desc:0 "As Alexander did at Susa, my Companions will marry the daughters of the conquered nobles in one great wedding feast, and the peoples of my realm will become one."
 LR_kosmokratoria_susa_weddings_decision_tooltip:0 "Bind the peoples of the realm together by marriage."
 LR_kosmokratoria_susa_weddings_decision_confirm:0 "Let the feast begin"
 LR_kosmokratoria_susa_foreign_vassals_tt:0 "At least 3 [vassals|E] of other [cultures|E]"
 LR_kosmokratoria_susa_weddings_effect_tt:0 "Your [culture|E] gains [cultural_acceptance|E] with every culture of your realm; [vassals|E] of other cultures are pleased, those of your own culture resent it"
 LR_kosmokratoria_susa_weddings_acceptance_desc:0 "The Susa Weddings"
 LR_kosmokratoria_philos_acceptance_desc:0 "A Philos of the Kosmokrator"
 LR_susa_weddings_modifier:0 "The Susa Weddings"
 LR_susa_weddings_modifier_desc:0 "This ruler has married the realm's peoples to one another."
 LR_susa_weddings_foreign_opinion:0 "The Susa Weddings"
 LR_susa_weddings_own_people_opinion:0 "Married us to the Barbarians"
 LR_kosmokratoria_adopt_proskynesis_decision:0 "Adopt Proskynesis"
 LR_kosmokratoria_adopt_proskynesis_decision_desc:0 "The Persians prostrate themselves before their Great King. Let all who approach me do the same, Greek and barbarian alike."
 LR_kosmokratoria_adopt_proskynesis_decision_tooltip:0 "More [legitimacy|E] and the favour of other cultures, at the cost of your own people's."
 LR_kosmokratoria_adopt_proskynesis_decision_confirm:0 "Let them kneel"
 LR_kosmokratoria_abolish_proskynesis_decision:0 "Abolish Proskynesis"
 LR_kosmokratoria_abolish_proskynesis_decision_desc:0 "Free Greeks and Macedonians bow to no man. The prostration ends."
 LR_kosmokratoria_abolish_proskynesis_decision_tooltip:0 "End the prostration at court."
 LR_kosmokratoria_abolish_proskynesis_decision_confirm:0 "Stand, Macedonians"
 LR_proskynesis_modifier:0 "Proskynesis"
 LR_proskynesis_modifier_desc:0 "All who approach this ruler prostrate themselves, Persian-style."

