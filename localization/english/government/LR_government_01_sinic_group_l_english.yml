 chinese_in_service_taxation_tax_collector: "Kleroukhia"
 chinese_in_service_taxation_tax_collector_desc: "[vassal|E] sends their men to serve their lord, increasing [levies|E] as the focus"
 chinese_in_service_taxation_tax_collector_flavor_desc: "Subjects will be fulfil their obligations by serving in the army."

#Japanese Feudal (sinic group, without All Under Heaven)
