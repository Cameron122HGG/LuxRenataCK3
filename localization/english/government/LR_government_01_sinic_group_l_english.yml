 japanese_government_desc: "\n$game_concept_feudal_desc$\n\n#F Japanese Feudal rule binds the provincial houses of the islands to the court through grants of land and office. Warrior households, mounted archers and armoured retainers, form the strength of every lord, and a capable ruler can hold the great families together under a single court.#!"
