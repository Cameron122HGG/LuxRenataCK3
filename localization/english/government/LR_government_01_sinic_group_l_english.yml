 chinese_feudal_government_desc: "\n$game_concept_feudal_desc$\n\n#F The Sinic Feudal government is characterized by a hierarchical structure where vassals owe allegiance to their lords, and obligations are fulfilled through various forms of taxation and service. #!"
 
 chinese_feudal: "Sinic"
