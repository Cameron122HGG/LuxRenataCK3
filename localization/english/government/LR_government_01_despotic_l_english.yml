l_english:

# Despotism
 despotic_government: "Despotic"
 despotic_icon_concept: "@government_type_despotic!"
 despotic_government_with_icon: "@government_type_despotic! $despotic_government$"
 despotic_government_adjective: "Despotic"
 despotic_government_realm: "Despotic Realm"
 despotic_government_desc: "\n$game_concept_despotic_desc$\n\n#F Despotic is the ancient form of government of Persia, later adopted by the Diadochi themselves. It is characterised by autonomy given to local rulers, while retaining strong bureaucratic elements.#!"
 
 despotic_government_vassals_label: "Despotic [obligations|E] are based on [vassal_contract|E], multiplied by [tax_collector|E] Aptitude, and [tax_jurisdictions|E] type"
 despotic_government_obligations: "From [opinion|E]"
 despotic_government_tax_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_tax_max_possible'))|1V])"
 despotic_government_levies_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_levies_max_possible'))|1V])"
 despotic_government_unclamped_contribution_label: "Based on [opinion|E] of me"
 
 despotic_government_min_contribution_label: "[crown_authority|E] minimum"
 despotic_vassal: "Despotic"
 despotic_vassal_desc: "$game_concept_despotic_desc$"
 
 despotic_tax_slot: "Tax Jurisdiction"
 despotic_tax_slot_no_tax_collector: "Tax Jurisdiction"
 despotic_tax_slot_tax_collector: "Tax Jurisdiction: [character.GetName]"  
 despotic_tax_collector_obligations: "[tax_collector|E] Aptitude" 

 despotic_in_kind_tax_collector: "In Kind"
 despotic_in_kind_tax_collector_desc: "Base [obligations|E] apply, based on the [vassal_contract|E], multiplied by [aptitude|E] of the assigned [tax_collector|E]"
 despotic_in_kind_tax_collector_flavor_desc: "A standard tax in kind. Subjects taxes are largely paid in agricultural produce, being the most lenient form of taxation."
 
 despotic_in_cash_taxation_tax_collector: "In Cash"
 despotic_in_cash_taxation_tax_collector_desc: "The [vassal|E] pays directly in monetary form, increasing [gold|E] taxation"
 despotic_in_cash_taxation_tax_collector_flavor_desc: "Subjects will cover, their obligations by focusing on payment in gold or silver."
 
 despotic_in_labour_taxation_tax_collector: "In Labour"
 despotic_in_labour_taxation_tax_collector_desc: "[vassal|E] cover their obligations in labour, increasing both [levies|E] and [gold|E] send to their lord"
 despotic_in_labour_taxation_tax_collector_flavor_desc: "Subjects will be contribute in the form of increased labour on their lords land, or in public works."
 
 despotic_in_service_taxation_tax_collector: "In Service"
 despotic_in_service_taxation_tax_collector_desc: "[vassal|E] sends their men to serve their lord, increasing [levies|E] as the focus"
 despotic_in_service_taxation_tax_collector_flavor_desc: "Subjects will be sent to the front, and serve in the army."
 
 persianate_administrative_government: "Persianate Administrative"
 persianate_administrative_icon_concept: "@government_type_persianate_administrative!"
 persianate_administrative_government_with_icon: "@government_type_persianate_administrative! $persianate_administrative_government$"
 persianate_administrative_government_adjective: "Persianate Administrative"
 persianate_administrative_government_realm: "Persianate Administrative Realm"
 persianate_administrative_government_desc: "\n$game_concept_persianate_administrative_desc$\n\n#F The Persianate Administrative Monarchy is a form of government maintaining principles of ancient states. It emphasizes strong rule by the monarch, with a well-developed administrative system that prevail despite the passage of time, while sharing similarities with Diadochi states. This government type allows for efficient governance, urban development, and strong military organization, all in the name of the 'King of Kings'. #!"
 persianate_administrative_government_vassals_label: "Persianate Administrative [obligations|E] is based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 persianate_admin_vassal: "Persianate Administrative"
 persianate_admin_vassal_desc: "$game_concept_persianate_administrative_desc$"
 persianate_administrative_obligations: "Persianate Administrative Obligations"
 persianate_administrative_themes: "Available Administration Types"
 persianate_administrative_theme_balanced: "@balanced_administration! Balanced Administration"
 persianate_administrative_theme_balanced_short: "@balanced_administration! Balanced"
 persianate_administrative_theme_balanced_text_icon: "@balanced_administration!"
 persianate_administrative_theme_balanced_desc: "#flavor A well balanced administration seeks moderation to ensure equal attention in all areas of governance.#!"
 persianate_administrative_theme_military: "@military_administration! Military Administration"
 persianate_administrative_theme_military_short: "@military_administration! Military"
 persianate_administrative_theme_military_text_icon: "@military_administration!"
 persianate_administrative_theme_military_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [martial|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!"
 persianate_administrative_theme_military_desc: "#flavor A military administration puts all energy on recruiting and training formidable troops for the imperial army.#!"
 persianate_administrative_theme_civilian: "@civilian_administration! Civilian Administration"
 persianate_administrative_theme_civilian_short: "@civilian_administration! Civilian"
 persianate_administrative_theme_civilian_text_icon: "@civilian_administration!"
 persianate_administrative_theme_civilian_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [stewardship|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n[influence|E] gained from constructing [buildings|E] in held [counties|E] is increased"
 persianate_administrative_theme_civilian_desc: "#flavor Exempt from military service, a civilian administration focuses on improving the economy and well-being of the citizens.#!"
 persianate_administrative_theme_frontier: "@frontier_administration! Frontier Administration"
 persianate_administrative_theme_frontier_short: "@frontier_administration! Frontier"
 persianate_administrative_theme_frontier_text_icon: "@frontier_administration!"
 persianate_administrative_theme_frontier_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\nUnlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [subject|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [prowess|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\nUnlocks the #high $EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]\nEnables [raiding|E]"
 persianate_administrative_theme_frontier_desc: "#flavor One cannot leave the borders undefended. A frontier administration will ensure the realm's defenses and stand ready to repel any potential invaders.#!"
 persianate_administrative_theme_imperial: "@imperial_administration! Imperial Administration"
 persianate_administrative_theme_imperial_short: "@imperial_administration! Imperial"
 persianate_administrative_theme_imperial_text_icon: "@imperial_administration!"
 persianate_administrative_theme_imperial_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [prestige_level|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_currency_level_increase_value')|+0%/] for each level#!#!\nIncreases [powerful_family|E] Rating\nCannot have appointment revoked without a [revoke_title_reason|E]"
 persianate_administrative_theme_imperial_desc: "#flavor An imperial administration provides a significant level of autonomy and freedom from many regular responsibilities. It is the most prestigious administration one can have.#!"
 persianate_administrative_theme_naval: "@naval_administration! Naval Administration"
 persianate_administrative_theme_naval_short: "@naval_administration! Naval"
 persianate_administrative_theme_naval_text_icon: "@naval_administration!"
 persianate_administrative_theme_naval_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\nUnlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [subject|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] for every controlled #high [GetBuilding('common_tradeport_01').GetTypeName]#!#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_building_increase_value')|+0%/] for each [GetBuilding('common_tradeport_01').GetTypeName]#!#!\nUnlocks the #high $NAVAL_EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]"
 persianate_administrative_theme_naval_desc: "#flavor The navy is the backbone of any expansive realm. With a dedicated naval administration, safety and efficiency at sea will be highly increased.#!"
 PERSIANATE_ADMINISTRATIVE_CONTRACT: "[Character.Custom( 'GetProvinceConceptNoTooltip' )] Appointment"
 persianate_administrative_theme_frontier_valid_desc: "The [subject.Custom( 'GetProvinceConceptNoTooltip' )] must border another [realm|E]"
 persianate_administrative_theme_imperial_valid_desc: "Only one [subject.Custom( 'GetProvinceConceptNoTooltip' )] can have this administration active"
 persianate_administrative_theme_naval_valid_desc: "The [subject.Custom( 'GetProvinceConceptNoTooltip' )] must be Coastal"
 persianate_administrative_contract_forbids_revocation_desc: "You cannot revoke [titles|E] or Appointments from a [subject|E] governing with the [GetSubjectContractType( 'persianate_administrative_themes' ).GetObligationName( 'persianate_administrative_theme_imperial' )] unless you have a [revoke_title_reason|E]"

 persianate_autocratic_government_realm: "Persianate Imperial Realm"
 persianate_autocratic_government: "Persianate Imperial"
 persianate_autocratic_government_desc: "\n$game_concept_persianate_autocratic_desc$\n\n#F The Persianate Imperial government is a unique form of governance that combines the grandeur and pageantry of a Despotic monarchy with the administrative structure of an empire. It is characterized by a strong emphasis on tradition, ritual, and the display of power, while also maintaining a complex bureaucracy to manage the affairs of the state. This government type often features a powerful monarch who serves as the symbolic head of state, while real political power may be held by advisors, ministers, or a council. The Persianate Imperial government is often associated with opulence, elaborate ceremonies, and a focus on maintaining the legitimacy and prestige of the ruling dynasty. #!"
 persianate_autocratic_government_vassals_label: "Persianate Imperial [obligations|E] is based on [GetPlayer.Custom('GetProvinceConceptNoTooltip')]"
 persianate_autocratic_obligations: "Persianate Imperial Obligations"