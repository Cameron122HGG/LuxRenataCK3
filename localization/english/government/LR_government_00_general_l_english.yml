 # Principate (LR 2026-11-19: republic mechanic, Senatorial and Imperial provinces; was the administrative Decayed Principate)
 roman_principate_government: "Roman Principate"
 roman_principate_government_with_icon: "@government_type_principate! $roman_principate_government$"
 roman_principate_government_adjective: "Roman Principate"
 roman_principate_government_realm: "First Citizen's State"
 roman_principate_government_desc: "\n$game_concept_principate_desc$\n\n#F The Republic endures in name: the Senate still meets, the consuls are still chosen, and the laws are still passed in the name of the Senate and People of Rome. Yet all of it bends to the First Citizen, who holds the legions, the treasury and the loyalty of the provinces for life.#!"
 roman_principate_government_vassals_label: "[obligations|E] depend on the province: Senatorial or Imperial"
