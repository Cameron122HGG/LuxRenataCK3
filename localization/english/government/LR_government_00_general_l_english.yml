 principate_vassal: "Principate"
 principate_vassal_desc: "$game_concept_principate_desc$"
 principate_provinces: "Province"
 principate_province_senatorial: "@civilian_administration! Senatorial Province"
 principate_province_senatorial_short: "@civilian_administration! Senatorial"
 principate_province_senatorial_desc: "#flavor A province of the Roman people, governed by a proconsul of senatorial rank who answers to the Senate, sends its taxes to Rome and keeps few soldiers.#!\n\n#emphasis #bold [subject|E] Benefits:#!#!\nThe governor sits in the Senate (the [assembly|E])"
 principate_province_imperial: "@military_administration! Imperial Province"
 principate_province_imperial_short: "@military_administration! Imperial"
 principate_province_imperial_desc: "#flavor A frontier province of the Princeps, held by his legate together with the legions. It sends more soldiers and less gold, and its governor has no seat in the Senate.#!"
 principate_province_imperial_valid_desc: "The province must border another [realm|E]"
