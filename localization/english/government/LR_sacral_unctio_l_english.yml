l_english:
 # LR 2026-11-25 Unctio (tools/sacral_unctio/build_sacral_unctio.py)
 sacral_imperial_government: "Unctio"
 sacral_imperial_government_adjective: "Sacral"
 sacral_imperial_government_realm: "Unctio"
 sacral_imperial_government_with_icon: "@government_type_palatine! $sacral_imperial_government$"
 sacral_imperial_government_desc_body: "#F The #V Unctio#! ('anointing') is the rule of the anointed king of the Franks. Holy oil has made the ruler more than a lord among lords: the Church proclaims the throne, the palace governs in its name, and the counts hold the cities as the king's officers.#!\n\n$sacral_administrative_government_desc_body$"
 sacral_imperial_government_desc: "$LR_gradus_rank_sacral_imperial_government$\n\n$sacral_imperial_government_desc_body$"
 sacral_imperial_government_vassals_label: "$sacral_imperial_government$ [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 sacral_imperial_government_filter_option: "$sacral_imperial_government$"
 sacral_imperial_government_filter_option_desc: "Only show characters with the $sacral_imperial_government$ [government|E]"
 sacral_imperial_obligations: "Unctio Obligations"
 sacral_imperial_provinces: "$administrative_themes$"
 sacral_imperial_vassal: "$sacral_imperial_government$"
 sacral_imperial_vassal_desc: "$sacral_administrative_government_desc_body$"
 sacral_imperial_province_civitas: "@balanced_administration! Civitas" # Latin civitas, the Gallo-Roman city and its territory
 sacral_imperial_province_civitas_short: "@balanced_administration! Civitas"
 sacral_imperial_province_civitas_text_icon: "@balanced_administration!"
 sacral_imperial_province_civitas_desc: "#low A city and its territory, held for the king by a grafio who keeps its court and gathers its dues.#!"
 sacral_imperial_province_civitas_benefits: "$sacral_administrative_province_standard_benefits$"
 duke_sacral_imperial_province_civitas_governor_male: "Grafio" # Frankish grafio, the king's count of the Salic law
 duke_sacral_imperial_province_civitas_governor_female: "$duke_sacral_imperial_province_civitas_governor_male$"
 duchy_sacral_imperial_province_civitas_governor: "Civitas" # Latin civitas, the Gallo-Roman city and its territory
 king_sacral_imperial_province_civitas_governor_male: "$duke_sacral_imperial_province_civitas_governor_male$"
 king_sacral_imperial_province_civitas_governor_female: "$duke_sacral_imperial_province_civitas_governor_male$"
 kingdom_sacral_imperial_province_civitas_governor: "$duchy_sacral_imperial_province_civitas_governor$"
 sacral_imperial_province_villa_regia: "@civilian_administration! Villa Regia" # Latin villa regia, a royal estate
 sacral_imperial_province_villa_regia_short: "@civilian_administration! Villa Regia"
 sacral_imperial_province_villa_regia_text_icon: "@civilian_administration!"
 sacral_imperial_province_villa_regia_desc: "#low The king's own estates, whose domesticus sends their harvests and rents to the palace.#!"
 sacral_imperial_province_villa_regia_benefits: "$sacral_administrative_province_trade_benefits$"
 sacral_imperial_province_villa_regia_amount_desc: "$sacral_imperial_province_villa_regia_short$ limit reached"
 duke_sacral_imperial_province_villa_regia_governor_male: "Domesticus" # Latin domesticus, the manager of the royal estates
 duke_sacral_imperial_province_villa_regia_governor_female: "$duke_sacral_imperial_province_villa_regia_governor_male$"
 duchy_sacral_imperial_province_villa_regia_governor: "Villa Regia" # Latin villa regia, a royal estate
 king_sacral_imperial_province_villa_regia_governor_male: "$duke_sacral_imperial_province_villa_regia_governor_male$"
 king_sacral_imperial_province_villa_regia_governor_female: "$duke_sacral_imperial_province_villa_regia_governor_male$"
 kingdom_sacral_imperial_province_villa_regia_governor: "$duchy_sacral_imperial_province_villa_regia_governor$"
 sacral_imperial_province_centena: "@military_administration! Centena" # Latin centena, the hundred, a military and judicial district
 sacral_imperial_province_centena_short: "@military_administration! Centena"
 sacral_imperial_province_centena_text_icon: "@military_administration!"
 sacral_imperial_province_centena_desc: "#low A district of hundreds, each raising its men for the king's host under its centenarius.#!"
 sacral_imperial_province_centena_benefits: "$sacral_administrative_province_military_benefits$"
 sacral_imperial_province_centena_amount_desc: "$sacral_imperial_province_centena_short$ limit reached"
 duke_sacral_imperial_province_centena_governor_male: "Centenarius" # Latin centenarius, the leader of a hundred
 duke_sacral_imperial_province_centena_governor_female: "$duke_sacral_imperial_province_centena_governor_male$"
 duchy_sacral_imperial_province_centena_governor: "Centena" # Latin centena, the hundred, a military and judicial district
 king_sacral_imperial_province_centena_governor_male: "$duke_sacral_imperial_province_centena_governor_male$"
 king_sacral_imperial_province_centena_governor_female: "$duke_sacral_imperial_province_centena_governor_male$"
 kingdom_sacral_imperial_province_centena_governor: "$duchy_sacral_imperial_province_centena_governor$"
 sacral_imperial_government_opinion: "$sacral_imperial_government$ Ruler Opinion"
 sacral_imperial_government_vassal_opinion: "$sacral_imperial_government$ [vassal|E] Opinion"
 sacral_imperial_government_opinion_same_faith: "$sacral_imperial_government$ Opinion from Same [faith|E]"
 sacral_imperial_government_tax_contribution_add: "$sacral_imperial_government$ [vassal|E] [tax|E] [modifier_base_contribution|E]"
 sacral_imperial_government_tax_contribution_mult: "$sacral_imperial_government$ [vassal|E] [tax|E] [modifier_contribution|E]"
 sacral_imperial_government_levy_contribution_add: "$sacral_imperial_government$ [vassal|E] [levy|E] [modifier_base_contribution|E]"
 sacral_imperial_government_levy_contribution_mult: "$sacral_imperial_government$ [vassal|E] [levy|E] [modifier_contribution|E]"
