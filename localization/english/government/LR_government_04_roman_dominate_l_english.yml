l_english:
 # Roman Dominate government (restored Roman empires). Most text reuses the Roman Autocratic government's.
 roman_dominate_government:0 "Roman Dominate"
 roman_dominate_government_adjective:0 "Roman Dominate"
 roman_dominate_government_desc:0 "The Roman Dominate government is the administration of a restored Roman Empire. The emperor rules through a palace of ministers and a hierarchy of dioceses and provinces whose governors are appointed, not born. Its Imperial Administration, army commands and retirement laws are modelled on the celestial bureaucracy."
 roman_dominate_government_realm:0 "Imperium"
 roman_dominate_icon_concept:0 "$roman_autocratic_icon_concept$"
 roman_dominate_government_vassals_label:0 "$roman_autocratic_government_vassals_label$"
 roman_dominate_obligations:0 "Roman Dominate Obligations"
 roman_dominate_provinces:0 "Governor Rank"
 roman_dominate_province_praeses:0 "@celestial_standard_administration! Praeses"
 roman_dominate_province_praeses_short:0 "Praeses"
 roman_dominate_province_praeses_text_icon:0 "@celestial_standard_administration!"
 roman_dominate_province_praeses_benefits:0 "#emphasis #bold [vassal|E] Benefits:#!#!\nUses [GetLaw('LR_roman_civic_appointment_succession_law').GetName]"
 roman_dominate_province_praeses_desc:0 "#low The ordinary governor of a province, who judges cases, keeps the roads and posts and gathers the annona. Since Diocletian he commands no soldiers.#!"
 roman_dominate_province_consularis:0 "@celestial_metropolitan_administration! Consularis"
 roman_dominate_province_consularis_short:0 "Consularis"
 roman_dominate_province_consularis_text_icon:0 "@celestial_metropolitan_administration!"
 roman_dominate_province_consularis_benefits:0 "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ More [prestige|E] and [county_opinion|E]\n$EFFECT_LIST_BULLET$ Uses [GetLaw('LR_roman_civic_appointment_succession_law').GetName]"
 roman_dominate_province_consularis_desc:0 "#low A governor of senatorial rank, set over the greater provinces. His dignity draws the loyalty of the provincials and the respect of the court.#!"
 roman_dominate_province_consularis_amount_desc:0 "$roman_dominate_province_consularis_short$ limit reached"
 roman_dominate_province_corrector:0 "@celestial_industrial_administration! Corrector"
 roman_dominate_province_corrector_short:0 "Corrector"
 roman_dominate_province_corrector_text_icon:0 "@celestial_industrial_administration!"
 roman_dominate_province_corrector_benefits:0 "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Faster [development|E] and cheaper buildings\n$EFFECT_LIST_BULLET$ Uses [GetLaw('LR_roman_civic_appointment_succession_law').GetName]"
 roman_dominate_province_corrector_desc:0 "#low A governor sent to set the finances of the cities in order, as the correctores of Italy and Achaea did, raising revenue and restoring public works.#!"
 roman_dominate_province_corrector_amount_desc:0 "$roman_dominate_province_corrector_short$ limit reached"
 roman_dominate_province_proconsul:0 "@celestial_protectorate_administration! Proconsul"
 roman_dominate_province_proconsul_short:0 "Proconsul"
 roman_dominate_province_proconsul_text_icon:0 "@celestial_protectorate_administration!"
 roman_dominate_province_proconsul_benefits:0 "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ More [prestige|E], [development|E] and [control|E]\n$EFFECT_LIST_BULLET$ Uses [GetLaw('LR_roman_civic_appointment_succession_law').GetName]"
 roman_dominate_province_proconsul_desc:0 "#low The highest provincial governor, as of Africa, Asia and Achaea. The proconsul answers to the emperor alone rather than to the vicarius of the diocese.#!"
 roman_dominate_province_proconsul_amount_desc:0 "$roman_dominate_province_proconsul_short$ limit reached"
 roman_dominate_province_comes_praeses:0 "@celestial_military_administration! Comes et Praeses"
 roman_dominate_province_comes_praeses_short:0 "Comes et Praeses"
 roman_dominate_province_comes_praeses_text_icon:0 "@celestial_military_administration!"
 roman_dominate_province_comes_praeses_benefits:0 "#emphasis #bold [vassal|E] Benefits:#!#!\n$EFFECT_LIST_BULLET$ Can raise [men_at_arms|E] and holds stronger forts\n$EFFECT_LIST_BULLET$ Uses [GetLaw('LR_roman_military_appointment_succession_law').GetName]"
 roman_dominate_province_comes_praeses_desc:0 "#low A province where civil and military command are joined in one man, as Justinian did in Isauria and Pontus, so that unruly frontiers can be held.#!"
 roman_dominate_province_comes_praeses_amount_desc:0 "$roman_dominate_province_comes_praeses_short$ limit reached"
 roman_dominate_province_proconsul_liege_desc:0 "Only governors serving the emperor directly can be $roman_dominate_province_proconsul_short$"
