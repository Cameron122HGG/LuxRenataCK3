l_english:
 roman_autocratic_government_desc: "The Roman Autocratic government is a highly centralized form of government that draws inspiration from the political structures of the Roman Empire. In this system, power is concentrated in the hands of a single ruler, often referred to as the emperor, who exercises authority over a vast and diverse realm. The Roman Imperial government is characterized by its complex bureaucracy, extensive administrative apparatus, and reliance on a network of governors and officials to manage the affairs of the state. This form of government emphasizes strong central control, efficient administration, and the maintenance of order and stability across the empire."
 roman_autocratic_government: "Roman Autocratic"
 roman_autocratic_government_adjective: "Roman Autocratic"
 roman_autocratic_icon_concept: "@government_type_roman_autocratic!"
 roman_autocratic_government_with_icon: "@government_type_roman_autocratic! $roman_autocratic_government$"


 roman_autocratic_government_vassals_label: "[roman_autocratic|E] [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
