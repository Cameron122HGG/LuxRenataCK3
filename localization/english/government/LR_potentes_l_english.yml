l_english:
 # LR 2026-11-22 (user): Potentes government and Tower House entrenchment
 potentes_government: "Potentes"
 potentes_government_with_icon: "@government_type_potentes! $potentes_government$"
 potentes_government_adjective: "Potens"
 potentes_government_tt: "You are a [merchant|E] among the Potentes"
 potentes_government_realm: "Patrocinium"
 potentes_government_desc: "\nThe $potentes_government$, 'the powerful', are [merchant|E] houses of noble standing. Besides its [company|E], a house of the $potentes_government$ owns [trade_posts|E] in foreign cities and builds a #V Tower House#! in them: a fortified house with its own guards, clients and courts.\n\nThe longer the house holds a post, and the stronger its Tower House, the deeper it is #V entrenched#!. A deeply entrenched house can take the county as a [vassal|E] of its holder, splitting into a trading branch and a landed branch of #V $archontes_government$#!, whose lord can then proclaim the warlord [duchy|E] around their seat.\n\n#F In Rome's last centuries the potentes took villages and towns under their patrocinium, beyond the reach of the emperor's tax collectors. In this age their heirs do it with silver and towers: houses that came to the cities as guests, and stayed as lords.#!"
 potentes_government_vassals_label: "$potentes_government$ [clients|E] have no [obligations|E]"
 potentes_government_filter_option: "$potentes_government$"
 potentes_government_filter_option_desc: "Only show characters with the $potentes_government$ [government|E]"
 potentes_government_opinion: "[merchant_i] $potentes_government$ [opinion|E]"

 # Archontes: the landed sibling
 archontes_government: "Archontes"
 archontes_government_with_icon: "@government_type_archontes! $archontes_government$"
 archontes_government_adjective: "Archontic"
 archontes_government_realm: "Archontate"
 archontes_government_desc: "\nThe $archontes_government$ are city lords risen from trade: houses of the #V $potentes_government$#! that took the county where their Tower House stood. They rule as [feudal|E] lords and still run [profit_routes|E] for [gold|E], but the old nobility does not count them as equals: they can create [duchies|E], and [kingdoms|E] only from the warlord titles, nothing higher.\n\nAfter a generation, a house of the $archontes_government$ may settle among the nobility of its culture.\n\n#F As the Empire's hold slipped, archontes made themselves masters of the Greek cities: the Gabrades at Trebizond, Leo Sgouros at Nauplion and Corinth.#!"
 archontes_government_vassals_label: "$archontes_government$ [vassals|E] owe [obligations|E] as [feudal|E] vassals do"
 archontes_government_filter_option: "$archontes_government$"
 archontes_government_filter_option_desc: "Only show characters with the $archontes_government$ [government|E]"
 archontes_government_opinion: "$archontes_government$ [opinion|E]"
 LR_archontes_duchy_cap_tooltip: "The $archontes_government$ create [duchies|E], and [kingdoms|E] only from the warlord titles (settle among the nobility to lift this)"
 LR_settle_archontes_decision: "Settle Among the Nobility"
 LR_settle_archontes_decision_desc: "Our house has held its city for a generation. The counting house is far behind us; let us rule as the lords of our people rule."
 LR_settle_archontes_decision_tooltip: "Leave the $archontes_government$ for your culture's [government|E], without the warlord-kingdom limit"
 LR_settle_archontes_decision_confirm: "Settle"
 LR_settle_archontes_decision_effect_tt: "You take your culture's [feudal|E] [government|E], and may create any kingdom or empire"
 LR_settle_archontes_not_founder_tt: "Not the lord who first took the city: the house must have held it for a generation"

 # Tower House
 building_type_lr_tower_house_01: "Tower House"
 building_type_lr_tower_house_01_desc: "A merchant house's fortified seat inside its trade post: a stone tower, a hall for its clients and a yard for its guards. Greeks call it a pyrgos, Latins a castellum, Persians and Sogdians a kushk. Each level digs the house deeper into the county."
 lr_tower_house_01: "$building_type_lr_tower_house_01$"
 lr_tower_house_02: "$building_type_lr_tower_house_01$ II"
 lr_tower_house_03: "$building_type_lr_tower_house_01$ III"
 lr_tower_house_04: "$building_type_lr_tower_house_01$ IV"
 lr_tower_house_05: "$building_type_lr_tower_house_01$ V"
 lr_tower_house_effect_desc: "Raises the house's #V Entrenchment#! in this county by 10 per level"

 # Stages (county modifiers)
 LR_entrenchment_stage_2_county_modifier: "A Merchant's Tower"
 LR_entrenchment_stage_2_county_modifier_desc: "A merchant house has raised a Tower House here; some of the county's men and silver answer to it."
 LR_entrenchment_stage_3_county_modifier: "A Fortified Compound"
 LR_entrenchment_stage_3_county_modifier_desc: "A merchant house holds a fortified compound here, with its own guards and courts."
 LR_entrenchment_stage_4_county_modifier: "A House Seat"
 LR_entrenchment_stage_4_county_modifier_desc: "A merchant house rules its quarter of the county like a lord. It may soon ask for the county itself."

 # Opinions
 LR_ousted_tower_house_opinion: "Tore Down Our Tower"
 LR_house_banner_refused_opinion: "Refused Our Banner"
 LR_house_banner_granted_opinion: "Sold Us a Fief"
 LR_tower_house_privileges_opinion: "Confirmed Privileges"

 # Toasts
 LR_entrenchment_stage_up_toast: "Our House Digs In"
 LR_entrenchment_stage_up_toast_desc: "Our hold on [lr_entrench_county.GetName] has grown: our Tower House there has reached a new stage of entrenchment."
 LR_entrenchment_stage_up_host_toast: "A House Digs In"
 LR_entrenchment_stage_up_host_toast_desc: "[lr_entrench_owner.GetName]'s house has dug deeper into [lr_entrench_county.GetName]."
 LR_entrenchment_ousted_toast: "Our Tower Torn Down"
 LR_entrenchment_ousted_toast_desc: "Our trade post in [lr_entrench_county.GetName] has been torn down."
 LR_house_banner_raised_toast: "The House Banner Raised"
 LR_house_banner_raised_toast_desc: "We hold [lr_banner_county.GetName] as a fief. [lr_firm_heir.GetName] carries on the company and its trade posts."
 LR_house_banner_raised_host_toast: "A Merchant Lord"
 LR_house_banner_raised_host_toast_desc: "[lr_new_lord.GetName] now holds [lr_banner_county.GetName] as our [vassal|E]."
 LR_house_banner_refused_toast: "Our Banner Refused"
 LR_house_banner_refused_toast_desc: "[lr_banner_host.GetName] will not sell us [lr_banner_county.GetName]. We may take it by war: #V Seize the Stronghold#!."

 # Decisions
 LR_found_potentes_decision: "Rise Among the Potentes"
 LR_found_potentes_decision_desc: "Our company has grown beyond a counting house. Let our house stand among the powerful of the cities, with towers of its own in every port we trade in."
 LR_found_potentes_decision_tooltip: "Join the $potentes_government$: own [trade_posts|E] and build Tower Houses in them"
 LR_raise_house_banner_decision: "Raise the House Banner"
 LR_raise_house_banner_decision_desc: "Our Tower House has become the true seat of power in its county. It is time its lord sold us the county as a fief."
 LR_raise_house_banner_decision_tooltip: "Ask to buy the county of your most entrenched Tower House"
 LR_raise_house_banner_decision_confirm: "Raise the banner"
 LR_raise_house_banner_decision_effect_tt: "Offer the gold to the holder of [lr_banner_county.GetName]. If they accept, your house splits: you hold the county as their [vassal|E], and a kinsman carries on the [company|E] and its [trade_posts|E]."
 LR_raise_house_banner_needs_seat_tt: "A Tower House is a #V House Seat#! (stage 4) in a county whose holder keeps their capital and other land"
 LR_raise_house_banner_needs_gold_tt: "Enough [gold|E] to buy the county (cheaper the deeper the house is entrenched)"
 LR_proclaim_house_lordship_decision: "Proclaim the House's Lordship"
 LR_proclaim_house_lordship_decision_desc: "From our seat, our house's writ already runs further than its walls. Let the lands around it know us as their lords."
 LR_proclaim_house_lordship_decision_tooltip: "Create the warlord [duchy|E] around your seat"
 LR_proclaim_house_lordship_decision_effect_tt: "Create [lr_lordship_duchy.GetName], remaining the [vassal|E] of your [liege|E]. Its warlord counties become its [de_jure|E] land, and you gain [claims|E] on those where your house holds a Fortified Compound or House Seat."
 LR_proclaim_house_lordship_needs_duchy_tt: "Your seat's warlord [duchy|E] exists, is unheld and is open (no higher than a duchy)"
 LR_proclaim_house_lordship_needs_reach_tt: "A second county of that duchy, or your house's Fortified Compound or House Seat in another"

 # War
 LR_seize_the_stronghold_cb: "$LR_SEIZE_THE_STRONGHOLD_CB_NAME$"
 LR_SEIZE_THE_STRONGHOLD_CB_NAME: "Seize the Stronghold"
 LR_SEIZE_THE_STRONGHOLD_WAR_NAME: "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]Seizure of [TITLE.GetBaseNameNoTier]"
 LR_SEIZE_THE_STRONGHOLD_WAR_NAME_BASE: "Seizure of [TITLE.GetBaseNameNoTier]"
 LR_seize_the_stronghold_victory_desc: "The house takes the county as a [vassal|E] of its holder, and splits into a landed and a trading branch."
 LR_seize_the_stronghold_defeat_desc: "The house pays reparations, and its Tower House is torn down."
 LR_house_banner_refused_cb_cost_desc: "Our banner was refused"

 # Events
 LR_entrenchment.0001.t: "The House Banner"
 LR_entrenchment.0001.desc: "[lr_banner_house.GetName] has come before me with a chest of silver. Their Tower House in [lr_banner_county.GetName] has long ruled the town in all but name; now they ask that I sell them the county, to hold it from me as my [vassal|E].\n\n#weak The price: [lr_banner_price|0] [gold|E].#!"
 LR_entrenchment.0001.a: "Better a loyal lord than a rebel tower. Agreed."
 LR_entrenchment.0001.b: "The county is not for sale."
 LR_entrenchment.0010.t: "A Fortress Within a Fortress"
 LR_entrenchment.0010.desc: "The trade post of [lr_entrench_owner.GetName]'s house in [lr_entrench_county.GetName] is a trade post no longer. Its tower overlooks the market, its guards walk the streets, and the townsfolk bring their disputes to its hall instead of to mine."
 LR_entrenchment.0010.a: "Buy back the privileges they have gathered."
 LR_entrenchment.0010.a.tt: "Their years in the post no longer count toward their entrenchment"
 LR_entrenchment.0010.b: "Confirm their privileges. A friendly house is useful."
 LR_entrenchment.0010.c: "Tear down their tower!"

 # TEST (not for release): 936 Potentes start
 bm_group_test_potentes: "TEST 936"
 bm_group_test_potentes_year: "936"
 bm_group_test_potentes_subtitle: "Test: the Potentes"
 bm_group_tooltip_test_potentes: "#T $bm_group_test_potentes_subtitle$ #!\n\n#help The 936 world a day later. The non-Roman dynasties that rule Eastern Roman land as warlords in 1066 start as Potentes, dug into the counties they will rule. Needs Silk & Silver.#!"
 bm_test_potentes_5936: "Test: the Potentes"
 bm_test_potentes_5936_desc: "A test start for the Potentes government. Twelve non-Roman houses (Norman, Hellenistic, Bulgarian, Georgian and Gepid) hold Tower Houses in the Eastern Roman counties they rule in 1066, some already House Seats that can flip at once. The warlord duchies are open early. Play one with the #V Test: Play a house of the Potentes#! decision."
 LR_test_play_potentes_decision: "Test: Play a house of the Potentes"
 LR_test_play_potentes_decision_desc: "TEST: switch to one of the houses of the Potentes set up for the 936 test start."
 LR_test_play_potentes_decision_tooltip: "Pick a house of the Potentes to play"
 LR_test_potentes.0002.t: "Test: Play a house of the Potentes"
 LR_test_potentes.0002.desc: "Which house will you play? The House Seats (Philomelium, Demetrias, Mesembria, Kos, Euboea) can raise their banner at once."
