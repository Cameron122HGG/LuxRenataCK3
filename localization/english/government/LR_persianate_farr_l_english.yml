l_english:
 # LR 2026-11-25 Farr (tools/persianate_farr/build_persianate_farr.py)
 persianate_farr_government: "Farr"
 persianate_farr_government_adjective: "$persianate_farr_government$" # LR 2026-11-25: the government's own name, so the character window tells the tiers apart
 persianate_farr_government_realm: "Farr"
 persianate_farr_government_with_icon: "@government_type_persianate_imperial! $persianate_farr_government$"
 persianate_farr_government_desc_body: "#F The #V Farr#! is the divine glory that marks the rightful king of the world. Its holder is king of kings of Iran and non-Iran: the great houses kneel at his Nowruz court, the four quarters of the realm answer to his governors, and the glory stays with him only while Heaven favours him, as Jamshid learned when it left him.#!\n\n$persianate_imperial_government_desc_body$"
 persianate_farr_government_desc: "$LR_gradus_rank_persianate_farr_government$\n\n$persianate_farr_government_desc_body$"
 persianate_farr_government_vassals_label: "$persianate_farr_government$ [obligations|E] is based on [GetPlayer.Custom('GetProvinceConceptNoTooltip')]"
 persianate_farr_government_filter_option: "$persianate_farr_government$"
 persianate_farr_government_filter_option_desc: "Only show characters with the $persianate_farr_government$ [government|E]"
 persianate_farr_vassal: "$persianate_farr_government$"
 persianate_farr_vassal_desc: "$game_concept_administrative_desc$"
 persianate_farr_obligations: "Farr Obligations"
 persianate_farr_provinces: "Province Type"
 persianate_farr_province_padgos: "@meritocratic_standard_administration! Pādgōs"
 persianate_farr_province_padgos_short: "@meritocratic_standard_administration! Pādgōs"
 persianate_farr_province_padgos_text_icon: "@meritocratic_standard_administration!"
 persianate_farr_province_padgos_desc: "#low One of the great quarters of the realm, governed by a pādgōspān for the king of kings.#!"
 persianate_farr_province_padgos_benefits: "$meritocratic_province_standard_benefits$"
 duke_persianate_farr_province_padgos_governor_male: "Pādgōspān" # Middle Persian pādgōspān, governor of a quarter
 duke_persianate_farr_province_padgos_governor_female: "$duke_persianate_farr_province_padgos_governor_male$"
 duchy_persianate_farr_province_padgos_governor: "Pādgōs" # Middle Persian pādgōs, one of the four great quarters of the realm
 king_persianate_farr_province_padgos_governor_male: "$duke_persianate_farr_province_padgos_governor_male$"
 king_persianate_farr_province_padgos_governor_female: "$duke_persianate_farr_province_padgos_governor_male$"
 kingdom_persianate_farr_province_padgos_governor: "$duchy_persianate_farr_province_padgos_governor$"
 persianate_farr_province_ganj: "@meritocratic_industrial_administration! Ganj"
 persianate_farr_province_ganj_short: "@meritocratic_industrial_administration! Ganj"
 persianate_farr_province_ganj_text_icon: "@meritocratic_industrial_administration!"
 persianate_farr_province_ganj_desc: "#low A province given over to the royal treasury, whose ganjwar keeps the tribute of the four quarters.#!"
 persianate_farr_province_ganj_benefits: "$meritocratic_province_industrial_benefits$"
 duke_persianate_farr_province_ganj_governor_male: "Ganjwar" # Middle Persian ganjwar, the treasurer
 duke_persianate_farr_province_ganj_governor_female: "$duke_persianate_farr_province_ganj_governor_male$"
 duchy_persianate_farr_province_ganj_governor: "Ganj" # Middle Persian ganj, the treasury
 king_persianate_farr_province_ganj_governor_male: "$duke_persianate_farr_province_ganj_governor_male$"
 king_persianate_farr_province_ganj_governor_female: "$duke_persianate_farr_province_ganj_governor_male$"
 kingdom_persianate_farr_province_ganj_governor: "$duchy_persianate_farr_province_ganj_governor$"
 persianate_farr_province_gund: "@meritocratic_military_administration! Gund"
 persianate_farr_province_gund_short: "@meritocratic_military_administration! Gund"
 persianate_farr_province_gund_text_icon: "@meritocratic_military_administration!"
 persianate_farr_province_gund_desc: "#low A military province that raises the armies of Iran under the ērān-spāhbed.#!"
 persianate_farr_province_gund_benefits: "$meritocratic_province_military_benefits$"
 duke_persianate_farr_province_gund_governor_male: "Ērān-spāhbed" # Middle Persian ērān-spāhbed, commander of the armies of Iran
 duke_persianate_farr_province_gund_governor_female: "$duke_persianate_farr_province_gund_governor_male$"
 duchy_persianate_farr_province_gund_governor: "Gund" # Middle Persian gund, an army corps
 king_persianate_farr_province_gund_governor_male: "$duke_persianate_farr_province_gund_governor_male$"
