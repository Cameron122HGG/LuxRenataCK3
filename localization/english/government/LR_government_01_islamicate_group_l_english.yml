l_english: 
 iqta_dynastic_government: "Iqta"
 iqta_dynastic_government_with_icon: "@government_type_clan! $iqta_dynastic_government$"
 iqta_dynastic_government_adjective: "Iqta"
 iqta_dynastic_government_realm: "Iqta"
 iqta_dynastic_government_desc: "\n$game_concept_iqta_desc$\n\n#F The clan is united by kinship — either by blood or a shared relation with a symbolic ancestor. A clan leader relies heavily on the support of the clan. United, they are a strength to be reckoned with, but a discontent clan withers from within.#!"
 iqta_dynastic_government_vassals_label: "Iqta [obligations|E] are based on [opinion|E]"
 iqta_dynastic_government_obligations: "From [opinion|E]"
 iqta_dynastic_government_tax_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_tax_max_possible'))|1V])"
 iqta_dynastic_government_levies_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_levies_max_possible'))|1V])"
 iqta_dynastic_government_unclamped_contribution_label: "Based on [opinion|E] of me"
 iqta_dynastic_government_min_contribution_label: "[crown_authority|E] minimum"
 iqta_administrative_government: "Iqta Administrative"
 iqta_administrative_government_with_icon: "@government_type_administrative! $iqta_administrative_government$"
 iqta_administrative_government_adjective: "Iqta Administrative"
 iqta_administrative_government_realm: "Iqta Realm"
 iqta_administrative_government_desc: "\n$game_concept_iqta_desc$\n\n#F The Iqta Administrative realm is ruled through a bureaucracy of appointed governors. Land revenues are granted as iqtas to officers and officials in return for service, while the treasury and the right to appoint stay with the sovereign.#!"
 iqta_special_rights: "$iqta_special_rights_tax_collector$"
