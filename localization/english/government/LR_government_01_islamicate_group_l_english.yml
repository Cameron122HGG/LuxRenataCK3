l_english: 
 iqta_government: "Iqta"
 iqta_government_with_icon: "@government_type_iqta! $iqta_government$"
 iqta_government_adjective: "Iqta"
 iqta_government_realm: "Iqta"
 iqta_government_desc: "\n$game_concept_iqta_desc$\n\n#F The sovereign grants the revenues of land as iqtas to commanders and kinsmen, who keep their troopers from the harvest and answer the call to war. Such grants bind the realm only as long as the muqtas are content: a loyal court of emirs makes a sultan formidable, while discontented grant-holders keep the revenue and forget the service.#!"
 iqta_government_vassals_label: "Iqta [obligations|E] are based on [opinion|E]"
 iqta_government_obligations: "From [opinion|E]"
 iqta_government_tax_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_tax_max_possible'))|1V])"
 iqta_government_levies_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_levies_max_possible'))|1V])"
 iqta_government_unclamped_contribution_label: "Based on [opinion|E] of me"
 iqta_government_min_contribution_label: "[crown_authority|E] minimum"
 iqta_government_filter_option: "$iqta_government$"
 iqta_government_filter_option_desc: "Only show characters with the $iqta_government$ [government|E]"

 iqta_dynastic_government: "Iqta Dynastic"
 iqta_dynastic_government_with_icon: "@government_type_iqta_dynastic! $iqta_dynastic_government$"
 iqta_dynastic_government_adjective: "Iqta Dynastic"
 iqta_dynastic_government_realm: "Iqta Dynastic Realm"
 iqta_dynastic_government_desc: "$iqta_government_desc$\n\nThe #V Iqta Dynastic#! government is the dynastic counterpart of the #V $iqta_administrative_government$#! government. Great houses hold their iqtas by inheritance while keeping the estates and noble families of an administrative realm; a strong ruler can reform it into $iqta_administrative_government$."
 iqta_dynastic_government_vassals_label: "Iqta [obligations|E] are based on [opinion|E]"
 iqta_dynastic_government_obligations: "From [opinion|E]"
 iqta_dynastic_government_tax_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_tax_max_possible'))|1V])"
 iqta_dynastic_government_levies_contribution_postfix: " (max [FixedPointToProgressbarValue(EmptyScope.ScriptValue('clan_government_levies_max_possible'))|1V])"
 iqta_dynastic_government_unclamped_contribution_label: "Based on [opinion|E] of me"
 iqta_dynastic_government_min_contribution_label: "[crown_authority|E] minimum"
 iqta_dynastic_government_house_attribute_flavor_name: "$japan_feudal_government_house_attribute_flavor_name$"
 iqta_dynastic_government_house_attribute_flavor_name_no_tooltip: "$japan_feudal_government_house_attribute_flavor_name_no_tooltip$"
 iqta_dynastic_government_potential_domicile: "$japan_feudal_government_potential_domicile$"
 iqta_dynastic_government_filter_option: "$iqta_dynastic_government$"
 iqta_dynastic_government_filter_option_desc: "Only show characters with the $iqta_dynastic_government$ [government|E]"
 iqta_administrative_government: "Iqta Administrative"
 iqta_administrative_government_with_icon: "@government_type_iqta_administrative! $iqta_administrative_government$"
 iqta_administrative_government_adjective: "Iqta Administrative"
 iqta_administrative_government_realm: "Iqta Realm"
 iqta_administrative_government_desc: "\n$game_concept_iqta_desc$\n\n#F The Iqta Administrative realm is ruled through a bureaucracy of appointed governors. Land revenues are granted as iqtas to officers and officials in return for service, while the treasury and the right to appoint stay with the sovereign.#!"
 iqta_special_rights: "$iqta_special_rights_tax_collector$"
 iqta_special_rights_default: "Default $iqta_special_rights$"
 iqta_special_rights_default_short: "Default"
 iqta_special_rights_granted: "Granted $iqta_special_rights$"
 iqta_special_rights_granted_short: "Granted"
 iqta_special_rights_granted_desc: "$iqta_special_rights_tax_collector_desc$"
 iqta_vassal: "Iqta"
 iqta_vassal_desc: "$game_concept_iqta_desc$"


 iqta_tax_slot: "Tax Jurisdiction"
