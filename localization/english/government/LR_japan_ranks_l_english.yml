l_english:
 # LR 2026-11-25 Japanese ranks (tools/japan_ranks/build_japan_ranks.py)
 japan_imperial_government: "Chōtei"
 japan_imperial_government_adjective: "$japan_imperial_government$" # LR 2026-11-25: the government's own name, so the character window tells the tiers apart
 japan_imperial_government_realm: "Chōtei"
 japan_imperial_government_with_icon: "@government_type_ritsuryo! $japan_imperial_government$"
 japan_imperial_government_desc_body: "\n$game_concept_ritsuryo_government_desc$\n\n#F The #V Chōtei#! ('the court') is the court of Japan in its full majesty: the tennō's Council of State, the Daijō-kan, rules the provinces through governors sent out from the capital, and every house holds its rank by the court's grant.#!"
 japan_imperial_government_desc: "$LR_gradus_rank_japan_imperial_government$\n\n$japan_imperial_government_desc_body$"
 japan_imperial_government_vassals_label: "$japan_imperial_government$ [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 japan_imperial_government_filter_option: "$japan_imperial_government$"
 japan_imperial_government_filter_option_desc: "Only show characters with the $japan_imperial_government$ [government|E]"
 japan_imperial_obligations: "Chōtei Obligations"
 japan_imperial_provinces: "$administrative_themes$"
 japan_imperial_vassal: "$japan_imperial_government$"
 japan_imperial_vassal_desc: "$game_concept_ritsuryo_government_desc$"
