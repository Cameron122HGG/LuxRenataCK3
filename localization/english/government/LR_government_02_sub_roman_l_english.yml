l_english:
#Roman Administrative
 roman_administrative_government: "Roman Administrative"
 roman_administrative_icon_concept: "@government_type_roman_administrative!"
 roman_administrative_government_with_icon: "@government_type_roman_administrative! $roman_administrative_government$"
 roman_administrative_government_adjective: "Roman"
 roman_administrative_government_realm: "Roman Administrative Realm"
 roman_administrative_government_desc: "\n$game_concept_roman_administrative_desc$\n\n#F The classical Roman and Hellenistic form of government emphasizes enlightened rule by the monarch. In the classical Graeco-Roman political model the ruler is less involved in the day to day decision making, hampering centralization limiting personal domain. At the same time, the realm's administration is more developed and maintains the Graeco-Roman legal system, preventing realm split upon succession. Prestigious rulers develop their urban centers. On the battlefield, Graeco-Roman Pikemen and heavy infantry remain unmatched, heirs to the phalanx and the legion. #!"
 roman_administrative_vassals_label: "Roman Classical [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 roman_administrative_vassal: "Governor"
 roman_administrative_vassal_desc: "$game_concept_roman_administrative_desc$"
 roman_administrative_obligations: "Roman Obligations"
 roman_administrative_themes: "Available Administration Types"
 roman_administrative_theme_balanced: "@balanced_administration! Balanced Administration"
 roman_administrative_theme_balanced_short: "@balanced_administration! Balanced"
 roman_administrative_theme_balanced_text_icon: "@balanced_administration!"
 roman_administrative_theme_balanced_desc: "#flavor A well balanced administration seeks moderation to ensure equal attention in all areas of governance.#!"
 roman_administrative_theme_military: "@military_administration! Military Administration"
 roman_administrative_theme_military_short: "@military_administration! Military"
 roman_administrative_theme_military_text_icon: "@military_administration!"
 roman_administrative_theme_military_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [martial|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!"
 roman_administrative_theme_military_desc: "#flavor A military administration puts all energy on recruiting and training formidable troops for the imperial army.#!"
 roman_administrative_theme_civilian: "@civilian_administration! Civilian Administration"
 roman_administrative_theme_civilian_short: "@civilian_administration! Civilian"
 roman_administrative_theme_civilian_text_icon: "@civilian_administration!"
 roman_administrative_theme_civilian_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [stewardship|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\n[influence|E] gained from constructing [buildings|E] in held [counties|E] is increased"
 roman_administrative_theme_civilian_desc: "#flavor Exempt from military service, a civilian administration focuses on improving the economy and well-being of the citizens.#!"
 roman_administrative_theme_frontier: "@frontier_administration! Frontier Administration"
 roman_administrative_theme_frontier_short: "@frontier_administration! Frontier"
 roman_administrative_theme_frontier_text_icon: "@frontier_administration!"
 roman_administrative_theme_frontier_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\nUnlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [subject|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [prowess|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_skill_increase_value')|+1%/] for each [skill|E] Point#!#!\nUnlocks the #high $EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]\nEnables [raiding|E]"
 roman_administrative_theme_frontier_desc: "#flavor One cannot leave the borders undefended. A frontier administration will ensure the realm's defenses and stand ready to repel any potential invaders.#!"
 roman_administrative_theme_imperial: "@imperial_administration! Princely Administration"
 roman_administrative_theme_imperial_short: "@imperial_administration! Princely"
 roman_administrative_theme_imperial_text_icon: "@imperial_administration!"
 roman_administrative_theme_imperial_benefits: "#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] based on [prestige_level|E]#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_currency_level_increase_value')|+0%/] for each level#!#!\nIncreases [powerful_family|E] Rating\nCannot have appointment revoked without a [revoke_title_reason|E]"
 roman_administrative_theme_imperial_desc: "#flavor An imperial administration provides a significant level of autonomy and freedom from many regular responsibilities. It is the most prestigious administration one can have.#!"
 roman_administrative_theme_naval: "@naval_administration! Naval Administration"
 roman_administrative_theme_naval_short: "@naval_administration! Naval"
 roman_administrative_theme_naval_text_icon: "@naval_administration!"
 roman_administrative_theme_naval_benefits: "#emphasis #bold [liege|E] Benefits:#!#!\nUnlocks the #high $frontier_influence_war_interaction$#! [interaction|E] allowing the liege to request the [subject|E] to declare war for a foreign [duchy|E]-tier [title|E]\n\n#emphasis #bold [subject|E] Benefits:#!#!\nIncreases [governor_efficiency|E] for every controlled #high [GetBuilding('common_tradeport_01').GetTypeName]#!#indent_newline:4 \n#weak Adds an extra [EmptyScope.ScriptValue('efficiency_building_increase_value')|+0%/] for each [GetBuilding('common_tradeport_01').GetTypeName]#!#!\nUnlocks the #high $NAVAL_EXPANSION_DUCHY_CB_NAME$#! [casus_belli|E]"
 roman_administrative_theme_naval_desc: "#flavor The navy is the backbone of any expansive realm. With a dedicated naval administration, safety and efficiency at sea will be highly increased.#!"
 roman_administrative_CONTRACT: "[Character.Custom( 'GetProvinceConceptNoTooltip' )] Appointment"
 roman_administrative_theme_frontier_valid_desc: "The [subject.Custom( 'GetProvinceConceptNoTooltip' )] must border another [realm|E]"
 roman_administrative_theme_imperial_valid_desc: "Only one [subject.Custom( 'GetProvinceConceptNoTooltip' )] can have this administration active"
 roman_administrative_theme_naval_valid_desc: "The [subject.Custom( 'GetProvinceConceptNoTooltip' )] must be Coastal"
 roman_administrative_forbids_revocation_desc: "You cannot revoke [titles|E] or Appointments from a [subject|E] governing with the [GetSubjectContractType( 'roman_administrative_themes' ).GetObligationName( 'roman_administrative_theme_imperial' )] unless you have a [revoke_title_reason|E]"
