 nilotic_bureaucracy: "$imperial_bureaucracy$"
 nilotic_bureaucracy_0: "Houses of the Marzbans" # Middle Persian marzban, warden of the border
 nilotic_bureaucracy_0_desc: "The great houses hold the provinces as hereditary wardens and pay the king of kings what they choose."
 nilotic_bureaucracy_0_effects: "$imperial_bureaucracy_0_effects$"
 nilotic_bureaucracy_1: "Royal Dibirs" # Middle Persian dibir, scribe
 nilotic_bureaucracy_1_desc: "Royal scribes keep the registers of the land tax in every province and report to the court."
 nilotic_bureaucracy_1_effects: "$imperial_bureaucracy_1_effects$"
 nilotic_bureaucracy_1_effects_not_in_prev: "$imperial_bureaucracy_1_effects_not_in_prev$"
 nilotic_bureaucracy_2: "Divan of the Wuzurg Framadar" # Middle Persian wuzurg framadar, the great commander, the chief minister
 nilotic_bureaucracy_2_desc: "The chief minister and his divan govern the realm, and the governors answer to them."
 nilotic_bureaucracy_2_effects: "$imperial_bureaucracy_2_effects$"
 nilotic_bureaucracy_2_effects_not_in_prev: "$imperial_bureaucracy_2_effects_not_in_prev$"
 nilotic_bureaucracy_3: "Royal Farr" # Middle Persian farr, the divine glory that marks a rightful king
 nilotic_bureaucracy_3_desc: "The king of kings rules by the divine glory he alone holds, and no one shares his power."
 nilotic_bureaucracy_3_effects: "$imperial_bureaucracy_3_effects$"
 nilotic_bureaucracy_3_effects_not_in_prev: "$imperial_bureaucracy_3_effects_not_in_prev$"
