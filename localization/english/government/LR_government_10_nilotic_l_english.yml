 nilotic_imperial_bureaucracy_0: "Great Houses" # Middle Persian wuzurgan, the great ones, the high nobility
 nilotic_imperial_bureaucracy_0_desc: "The great houses share the empire with the king of kings and govern their lands as they please."
 nilotic_imperial_bureaucracy_0_effects: "$meritocratic_bureaucracy_0_effects$"
 nilotic_imperial_bureaucracy_1: "Ostandars' Registers" # Middle Persian ostandar, holder of a province
 nilotic_imperial_bureaucracy_1_desc: "The governors keep registers of their provinces and send them to the court."
 nilotic_imperial_bureaucracy_1_effects: "$meritocratic_bureaucracy_1_effects$"
