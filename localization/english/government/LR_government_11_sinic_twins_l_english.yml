l_english:
 # LR 2026-11-25 (user): the Sinic twins (tools/sinic_twins/build_sinic_twins.py)
 sinic_dynastic_government: "Fengjian"
 sinic_dynastic_government_adjective: "Fengjian"
 sinic_dynastic_government_realm: "Fengjian Realm"
 sinic_dynastic_government_desc: "$chinese_feudal_government_desc$\n\nThe #V Fengjian#! (enfeoffment) government is the dynastic counterpart of #V Junxian#!: lords hold their fiefs by the grant of the throne, and the great houses rise as noble families. Converting to administration turns it into Junxian."
 sinic_dynastic_government_with_icon: "@government_type_sinic_dynastic! $sinic_dynastic_government$"
 sinic_dynastic_government_house_attribute_flavor_name: "$japan_feudal_government_house_attribute_flavor_name$"
 sinic_dynastic_government_house_attribute_flavor_name_no_tooltip: "$japan_feudal_government_house_attribute_flavor_name_no_tooltip$"
 sinic_dynastic_government_potential_domicile: "$japan_feudal_government_potential_domicile$"
 sinic_dynastic_government_filter_option: "$sinic_dynastic_government$"
 sinic_dynastic_government_filter_option_desc: "Only show characters with the $sinic_dynastic_government$ [government|E]"
 sinic_dynastic_government_vassals_label: "$sinic_dynastic_government$ [obligations|E] are based on each [vassal|E]'s [vassal_contract|E]"
 sinic_administrative_government: "Junxian"
 sinic_administrative_government_adjective: "Junxian"
 sinic_administrative_government_realm: "Junxian Realm"
 sinic_administrative_government_desc: "\n$game_concept_administrative_desc$\n\nThe #V Junxian#! (commanderies and counties) government rules through appointed [governors|E] and a [treasury|E] of the state. It is the Sinic administration below the [meritocratic|E] examinations and the Mandate of the [celestial_government|E] emperor, who alone holds the Chinese hegemony."
 sinic_administrative_government_with_icon: "@government_type_sinic_administrative! $sinic_administrative_government$"
 sinic_administrative_government_vassals_label: "[administrative|E] [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 sinic_administrative_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 sinic_administrative_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"
 go_sinic_administrative_government_name: "Junxian Government"
 go_sinic_administrative_government_desc: "Rule through appointed [governors|E] over commanderies and counties, as [sinic_administrative_government|E]."
 game_concept_sinic_administrative_government: "Junxian"
 game_concept_sinic_administrative_government_desc: "#V Junxian#! is the administrative rank of the Sinic group: [governors|E], [provinces|E], a [treasury|E] and noble families. Its dynastic twin is #V Fengjian#!; above it stand [meritocratic|E] (imperial) and [celestial_government|E] (universal, the holder of the Chinese hegemony)."
 game_concept_sinic_dynastic_government: "Fengjian"
 game_concept_sinic_dynastic_government_desc: "#V Fengjian#! is the dynastic rank of the Sinic group: lords hold their fiefs as noble families. Its administrative twin is [sinic_administrative_government|E]."
