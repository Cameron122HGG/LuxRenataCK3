l_english:
 # Lux Renata 2026-11-25: Autocratic, the one Roads-to-Power-only administration (tools/rtp_tier/consolidate_autocratic.py)
 rtp_autocratic_government: "Autocratic"
 rtp_autocratic_government_adjective: "Autocratic"
 rtp_autocratic_government_realm: "Autocracy"
 rtp_autocratic_government_desc: "The ruler governs through appointed [governors|E] and a [treasury|E] of the state, and the great houses of the realm rise as noble families. Every people of the world can rule this way: their titles keep their own culture's names.\n\n#weak This is the administration for players with Roads to Power but not All Under Heaven. With All Under Heaven it becomes the administrative government of the ruler's own group, with a dynastic twin to step down to and, for most groups, an Imperial rank above it.#!"
 rtp_autocratic_government_with_icon: "@government_type_rtp_autocratic! $rtp_autocratic_government$"
 rtp_autocratic_government_vassals_label: "[administrative|E] [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 rtp_autocratic_government_house_attribute_flavor_name: "[powerful_family_attribute|E]"
 rtp_autocratic_government_house_attribute_flavor_name_no_tooltip: "$game_concept_powerful_family_attribute$"
 rtp_autocratic_government_opinion: "[rtp_autocratic_i|E] [rtp_autocratic|E] Ruler Opinion"
 rtp_autocratic_government_vassal_opinion: "[rtp_autocratic_i|E] [rtp_autocratic|E] [vassal|E] Opinion"
 rtp_autocratic_government_opinion_same_faith: "[rtp_autocratic_i|E] [rtp_autocratic|E] Opinion from Same [faith|E]"
 rtp_autocratic_government_tax_contribution_add: "[rtp_autocratic_i|E] [rtp_autocratic|E] [vassal|E] [tax|E] [modifier_base_contribution|E]"
 rtp_autocratic_government_tax_contribution_mult: "[rtp_autocratic_i|E] [rtp_autocratic|E] [vassal|E] [tax|E] [modifier_contribution|E]"
 rtp_autocratic_government_levy_contribution_add: "[rtp_autocratic_i|E] [rtp_autocratic|E] [vassal|E] [levy|E] [modifier_base_contribution|E]"
 rtp_autocratic_government_levy_contribution_mult: "[rtp_autocratic_i|E] [rtp_autocratic|E] [vassal|E] [levy|E] [modifier_contribution|E]"
 # game concept (LR_rtp_tier_game_concepts.txt)
 game_concept_rtp_autocratic: "Autocratic"
 game_concept_rtp_autocratic_government: "Autocratic"
 game_concept_rtp_autocratic_i: "@government_type_rtp_autocratic! $rtp_autocratic_government$"
 game_concept_rtp_autocratic_desc: "#V Autocratic#! is the administration of every people for players with Roads to Power but not All Under Heaven. It appoints [governors|E] to its [provinces|E], pays for the state from its [treasury|E], and its great houses rise as noble families. An Autocratic ruler keeps the [government|E] group of their culture (Muslims Iqta), and their titles keep their culture's names.\n\nWith All Under Heaven it becomes the administrative government of that group."
 # Convert to Administrative (00_LR_government_decisions.txt)
 go_rtp_autocratic_government_name: "Autocratic Government"
 go_rtp_autocratic_government_desc: "Rule through appointed [governors|E] and a [treasury|E], as [rtp_autocratic|E]. Your titles keep your culture's names."
