 # Absolutist
 western_administrative_government: "Carolingian Administrative"
 western_administrative_government_with_icon: "@government_type_administrative! $western_administrative_government$"
 western_administrative_government_adjective: "Carolingian Administrative"
 western_administrative_government_realm: "Carolingian Realm"
 western_administrative_government_desc: "\n$game_concept_administrative_desc$\n\n#F Absolutist is a highly centralized government, where power mainly resides within the capital. Birthright, while still important, is not as prominent as in a feudal realm. With enough skill and ambition anyone, even from the most humble of origin, may rise up to become an influential governor or make a play for the throne and become emperor.#!"
 western_administrative_government_vassals_label: "[administrative|E] [obligations|E] are based on [GetPlayer.Custom('GetProvinceAdministrationConcept')]"
 WESTERN_ADMINISTRATIVE_CONTRACT: "[Character.Custom( 'GetProvinceConceptNoTooltip' )] Administration"
 western_admin_contract_forbids_revocation_desc: "You cannot revoke [titles|E] or Appointments from a [vassal|E] governing with the [GetSubjectContractType( 'administrative_themes' ).GetObligationName( 'western_admin_theme_imperial' )] unless you have a [revoke_title_reason|E]"
 western_admin_vassal: "$western_administrative_government$"
 western_admin_vassal_desc: "$game_concept_administrative_desc$"