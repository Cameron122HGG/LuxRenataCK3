 game_concept_mamlakah_desc: "The #V Mamlakah#! ('kingdom') is the government of the Semitic-speaking peoples outside Islam: Arabs, Arameans, Hebrews, Phoenicians and the peoples of Aksum. Its kings rule through their household and kin, much as the Persianate courts, without the law of the Iqta."
