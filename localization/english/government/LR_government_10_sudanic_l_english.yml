 sudanic_bureaucracy_0: "Houses of the Marzbans" # Middle Persian marzban, warden of the border
 sudanic_bureaucracy_0_desc: "The great houses hold the provinces as hereditary wardens and pay the king of kings what they choose."
 sudanic_bureaucracy_0_effects: "$imperial_bureaucracy_0_effects$"
 sudanic_bureaucracy_1: "Royal Dibirs" # Middle Persian dibir, scribe
 sudanic_bureaucracy_1_desc: "Royal scribes keep the registers of the land tax in every province and report to the court."
 sudanic_bureaucracy_1_effects: "$imperial_bureaucracy_1_effects$"
 sudanic_bureaucracy_1_effects_not_in_prev: "$imperial_bureaucracy_1_effects_not_in_prev$"
 sudanic_bureaucracy_2: "Divan of the Wuzurg Framadar" # Middle Persian wuzurg framadar, the great commander, the chief minister
 sudanic_bureaucracy_2_desc: "The chief minister and his divan govern the realm, and the governors answer to them."
 sudanic_bureaucracy_2_effects: "$imperial_bureaucracy_2_effects$"
 sudanic_bureaucracy_2_effects_not_in_prev: "$imperial_bureaucracy_2_effects_not_in_prev$"
 sudanic_bureaucracy_3: "Royal Farr" # Middle Persian farr, the divine glory that marks a rightful king
 sudanic_bureaucracy_3_desc: "The king of kings rules by the divine glory he alone holds, and no one shares his power."
 sudanic_bureaucracy_3_effects: "$imperial_bureaucracy_3_effects$"
 sudanic_bureaucracy_3_effects_not_in_prev: "$imperial_bureaucracy_3_effects_not_in_prev$"
