l_english:
 # Sudanic governments (gen_sudanic.py, 2026-11-19): copies of the Persianate (despotic) keys with Sudanic names
 sudanic_government: "Kafu"
 sudanic_government_adjective: "$sudanic_government$" # LR 2026-11-25: the government's own name, so the character window tells the tiers apart
 sudanic_government_realm: "Kafu"
 sudanic_government_with_icon: "@government_type_sudanic! $sudanic_government$"
 sudanic_government_desc_body: "\n$game_concept_sudanic_desc$"
 sudanic_government_desc: "$LR_gradus_rank_sudanic_government$\n\n$sudanic_government_desc_body$"
 sudanic_icon_concept: "@government_type_sudanic!"
 game_concept_sudanic: "Kafu"
 game_concept_sudanic_desc: "The #V Kafu#! (Mande 'a lordship of villages') is the government of the settled realms of sub-Saharan Africa, from the Sahel and the Guinea coast to the Swahili towns: kings who rule through their court, their lineages and the trade of their markets."
 game_concept_sudanic_government: "Kafu"
 game_concept_sudanic_icon: "@government_type_sudanic! $sudanic_government$"
 sudanic_government_filter_option: "$sudanic_government$"
 sudanic_government_filter_option_desc: "Only show characters with the $sudanic_government$ [government|E]"
 sudanic_government_opinion: "[sudanic_icon|E] [sudanic|E] Ruler Opinion"
 sudanic_government_vassal_opinion: "[sudanic_icon|E] [sudanic|E] [vassal|E] Opinion"
 sudanic_government_opinion_same_faith: "[sudanic_icon|E] [sudanic|E] Opinion from Same [faith|E]"
 sudanic_government_tax_contribution_add: "[sudanic_icon|E] [sudanic|E] [vassal|E] [tax|E] [modifier_base_contribution|E]"
 sudanic_government_tax_contribution_mult: "[sudanic_icon|E] [sudanic|E] [vassal|E] [tax|E] [modifier_contribution|E]"
 sudanic_government_levy_contribution_add: "[sudanic_icon|E] [sudanic|E] [vassal|E] [levy|E] [modifier_base_contribution|E]"
 sudanic_government_levy_contribution_mult: "[sudanic_icon|E] [sudanic|E] [vassal|E] [levy|E] [modifier_contribution|E]"

