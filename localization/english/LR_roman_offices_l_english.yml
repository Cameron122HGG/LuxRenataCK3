 LR_roman_prefect_male:0 "Praetorian Prefect"
 LR_roman_prefect_female:0 "Praetorian Prefect"
 LR_roman_prefect_modifier:0 "Praetorian Prefect"
 LR_roman_prefect_modifier_desc:0 "This character governs a prefecture of the Roman Empire in the emperor's name."
 LR_roman_prefect_appointment_succession_law:0 "Prefect Appointment"
 LR_roman_prefect_appointment_succession_law_subname:0 "$meritocratic_appointment_succession_law_subname$"
 LR_roman_prefect_appointment_succession_law_effects:0 "\nA type of [appointment_succession_law|E] used only by the Praetorian Prefects. Under $LR_roman_prefect_appointment_succession_law$, the prefecture passes to the candidate with the highest [candidate_score|E], favouring able administrators, Roman citizens and members of the imperial consistory."
 LR_roman_minister_appointment_succession_law:0 "Ministry Appointment"
 LR_roman_minister_appointment_succession_law_subname:0 "$meritocratic_appointment_succession_law_subname$"
 LR_roman_minister_appointment_succession_law_effects:0 "\nA type of [appointment_succession_law|E] used only by the Roman ministries. Under $LR_roman_minister_appointment_succession_law$, the ministry and its council seat pass to the candidate with the highest [candidate_score|E]. If the seat is left empty, the ministry lapses."
 LR_roman_military_minister_appointment_succession_law:0 "Military Ministry Appointment"
 LR_roman_military_minister_appointment_succession_law_subname:0 "$meritocratic_military_appointment_succession_law_subname$"
 LR_roman_military_minister_appointment_succession_law_effects:0 "\nA type of [appointment_succession_law|E] used only by the Master of Soldiers. Under $LR_roman_military_minister_appointment_succession_law$, the office and its council seat pass to the candidate with the highest [candidate_score|E], mostly raised by [martial_skill|E] and [commander_traits|E]. If the seat is left empty, the office lapses."
 LR_appoint_roman_prefect_decision:0 "Appoint a Praetorian Prefect"
 LR_appoint_roman_prefect_decision_desc:0 "With its dioceses restored, a prefecture can once again be given a Praetorian Prefect: the highest civil official below the emperor, holding no land of their own but governing the prefecture in the emperor's name."
 LR_appoint_roman_prefect_decision_tooltip:0 "Appoint a Praetorian Prefect for one of your restored prefectures."
 LR_appoint_roman_prefect_decision_confirm:0 "Appoint the Prefect"
 LR_appoint_roman_prefect_decision_trigger_1:0 "Every diocese of a prefecture is held within your realm, and it has no Praetorian Prefect"
 LR_appoint_roman_prefect_decision_effect_tt:0 "The chosen prefecture is given to the best available administrator in your court or among your vassals and their courts, who becomes your landless vassal. A prefect without land of their own also founds a [noble_family|E] of county rank. The prefecture passes by [GetLaw('LR_roman_prefect_appointment_succession_law').GetName]."
 LR_appoint_roman_prefect_no_candidate_tt:0 "There is no one fit to govern this prefecture"
