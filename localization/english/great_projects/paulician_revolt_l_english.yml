l_english:
 paulician_leader: "Chrysocheir"
 paulician_army: "Followers of Golden-hand"
 paulician_invasion: "Paulician War For Anatolia"
 paulician_leader_1: "Nikephoros"

 great_project_type_paulician_heresy: "Deal With Paulician Heretics"
 great_project_type_paulician_heresy_desc: "Winning the war against Chrysocheir is only the beginning. The Paulician heresy has poisoned the eastern themes for generations, and simply killing its soldiers will not kill the idea. This grand project represents a systematic effort to permanently eradicate the heresy from our lands, using every tool at the Empire's disposal: the sword, the coin, and the Cross. We will not only defeat the heretics, we will uproot their entire society."
 great_project_type_tooltip_paulician_heresy: ""
 great_project_name_possessive_paulician_heresy: ""
 great_project_name_paulician_heresy: ""
 
 great_project_type_paulician_heresy_contribution_paulician_local_leaders: "Shatter Their Unity"
 great_project_type_paulician_heresy_contribution_paulician_local_leaders_desc: "Not every follower of Chrysocheir is a true believer; many are opportunists or local chieftains who have thrown their lot in with him for personal gain. This contribution establishes a 'discretionary fund' used to bribe these lesser leaders with gold, titles, and land in exchange for turning against their heresiarch. We will break their rebellion from within."
 great_project_type_paulician_heresy_contribution_name_paulician_local_leaders: ""
 great_project_type_paulician_heresy_contribution_paulician_resettlement: "Transplant the Heresy"
 great_project_type_paulician_heresy_contribution_paulician_resettlement_desc: "Paulician communities draw strength from their concentration. This contribution organizes the difficult but necessary task of 'metanastasis'- the forced resettlement of captured or surrendered Paulician clans. By transplanting them to distant lands like Thrace or the Peloponnese, we will shatter their enclaves, sever their roots, and dilute their faith amongst the Orthodox populace."
 great_project_type_paulician_heresy_contribution_name_paulician_resettlement: ""
 great_project_type_paulician_heresy_contribution_paulician_forts: "The Frontier Fortification Program"
 great_project_type_paulician_heresy_contribution_paulician_forts_desc: "To prevent this heresy from ever rising again, we must physically dominate the land. This contribution provides engineers and materials for a chain of new forts and watchtowers across the former heretic heartlands. These garrisons will watch the roads, enforce Imperial law, and serve as a permanent stone reminder of our authority."
 great_project_type_paulician_heresy_contribution_name_paulician_forts: ""
 great_project_type_paulician_heresy_contribution_paulician_conversion: "The Orthodox Mission"
 great_project_type_paulician_heresy_contribution_paulician_conversion_desc: "The heresy must be confronted directly. This contribution funds the dispatch of monks and zealous theologians into the pacified territories. They will be tasked with re-consecrating defiled churches, burning heretical texts, and publicly debating Paulician preachers to shatter their authority and enforce the singular truth of Orthodoxy."
 great_project_type_paulician_heresy_contribution_name_paulician_conversion: ""

 paulician_revolt.0001.t: "The Heresy of Tephrice"
 paulician_revolt.0001.desc: "An urgent dispatch has arrived from Anatolia, reporting that a rebellion on the Empire's eastern frontier has developed into open war. A Paulician leader named Chrysocheir has established his headquarters at the mountain fortress of Tephrice and declared an independent state. His forces have crossed the frontier and begun occupying neighboring territories, claiming to act in defense of the Paulician communities. The Paulicians reject several central teachings and practices of the established Church, including the veneration of the Cross and sacred icons. Their beliefs include a form of dualism that distinguishes between an evil creator of the material world and a separate, good divine power. Their growing influence presents a challenge to both Imperial authority and the religious order of the Empire. Decades ago, during the reign of Empress Theodora, Imperial authorities persecuted the Paulicians, executing some of their leaders and driving many from their homes. Many fled to the eastern borderlands, where they continued to maintain their communities. Chrysocheir has now united some of these exiles under his leadership and taken up arms against the Empire. His aim is to secure territory for his followers and establish a lasting state beyond Imperial control."
 paulician_revolt.0001.a: "This blasphemy will be met with Imperial steel!"
 paulician_revolt.0001.b: "Play as the rebels!"
 
 paulician_revolt.1111.t: ""
 paulician_revolt.1111.desc: ""
 paulician_revolt.1111.a: ""

 paulician_revolt.0002.t: "A Diplomatic Victory"
 paulician_revolt.0002.desc: "An entry in the Imperial intelligence ledger notes the success of a recent operation. A significant contribution of funds, designated for covert actions against eastern heretics, was received and acknowledged via a private channel. The funds have reportedly been disbursed to turn key figures within the heretic leadership against each other, exacerbating internal conflicts. The source of the funds was formally praised in the exchange for their 'subtle and effective' methods."
 paulician_revolt.0002.a: "A house divided against itself cannot stand."

 paulician_revolt.0003.t: "A Difficult Task"
 paulician_revolt.0003.desc: "I have received thanks from the governors in the East for assisting in the difficult logistics of the population transfers. While a grim task, it is seen as a necessary one to ensure the long-term stability of the region and prevent the heresy from festering again. My dedication to this unpleasant but vital work is appreciated."
 paulician_revolt.0003.a: "A heavy burden for a secure future."

 paulician_revolt.0004.t: "Foundations of Power"
 paulician_revolt.0004.desc: "The sound of hammers now rings through the eastern passes. A report from the front confirms that work on the Frontier Fortification Program is proceeding ahead of schedule.\n\nA vital contribution of materials and funds has allowed engineers to begin laying the foundations for new forts. These new strongholds will stand as a permanent reminder of Imperial authority, securing the themes for generations to come."
 paulician_revolt.0004.a: "Strong walls make loyal subjects."

 paulician_revolt.0005.t: "A Holy Endeavor"
 paulician_revolt.0005.desc: "The Patriarch sends thanks for my support of the Orthodox Mission in the east. My contribution, I am told, has been instrumental in providing the Church with the resources it needs to confront the Paulician heretics directly and bring the light of true faith back to those lost lands. My piety has been duly noted."
 paulician_revolt.0005.a: "May God grant them strength."
 
 paulician_revolt.0006.t: "The East is Pacified"
 paulician_revolt.0006.desc: "Victory is total. The grand project to pacify the eastern themes is complete. The fortress of Tephrice, once the heart of a vile heresy, is now a loyal Imperial garrison. The Paulician leaders are dead or scattered, their followers converted or resettled in distant lands. A new chain of forts watches over a populace that is slowly but surely returning to the Orthodox fold. The cancer of heresy has been cut out, and the soul of Anatolia is once again secure."
 paulician_revolt.0006.a: "A triumph of Imperial will and Orthodox faith!"
 
 paulician_revolt.0007.t: "The Heresy Endures"
 paulician_revolt.0007.desc: "The ambitious project to pacify the east has failed. The war may be over, but the heresy remains, now more defiant than ever. Our efforts to convert, bribe, and resettle the Paulicians were insufficient, and their communities have weathered the storm. Though their state has been broken, their faith endures, a permanent source of instability and rebellion on our frontier. We have shown our hand, and we have lost. The heretics of the east remain a thorn in the side of the Empire."
 paulician_revolt.0007.a: "A bitter and shameful failure."

 paulician_stronghold_modifier: "Paulician Stronghold"
 paulician_stronghold_modifier_desc: "This county serves as the heart of the Paulician heresy. Its people are hostile, its fortress is manned by fanatics, and all Imperial authority has evaporated."

 paulicians_subdued_modifier: "Paulicians Subdued"
 paulicians_subdued_modifier_desc: "The Paulician heresy has been systematically uprooted from this region. Imperial authority has been fully restored, new fortifications watch over the land, and the populace is slowly returning to the Orthodox fold. The land is secure, loyal, and prosperous once more."
 
 paulician_revolt.0008.t: ""
 paulician_revolt.0008.desc: ""
 paulician_revolt.0008.a: ""
 
 paulician_revolt.0009.t: "The Price of Failure"
 paulician_revolt.0009.desc: "The fragile peace in the east has been shattered. Our past failure to deal decisively with the Paulician heresy was not seen as mercy, but as weakness—an opportunity to be exploited.\n\nIn the years since our campaign faltered, new and ruthless leaders have risen among them. They have used the time to rally the scattered heretic clans, forge alliances with our foreign enemies, and re-arm their followers for a war of total vengeance.\n\nThis is no mere resurgence. Dispatches from the frontier describe a disciplined host of fanatics, far greater in number than the rabble we first faced. They are not fighting for a stronghold anymore; they seek to cleanse Anatolia with fire and forge a kingdom from the ashes.\n\nOur indecision has allowed a simmering threat to boil over into a deadly crisis. Now, we must face the consequences."
 paulician_revolt.0009.a: "To arms! We will correct our failure with fire and steel!"
 
 bzn_defenders_of_paulicianism_decision: "Defenders of Paulicianism"
 bzn_defenders_of_paulicianism_decision_desc: "Persecuted and branded heretics, we have endured in the shadows of Anatolia. Now we stand openly as guardians of the true faith, defying imperial corruption and proclaiming our unity."
 bzn_defenders_of_paulicianism_decision_confirm: "We are the True Faith."
 bzn_defenders_of_paulicianism_decision_tooltip: "Publicly defend Paulicianism, strengthening the faith and challenging Byzantine religious authority."
 
