 anatolian_beacon_system.0001.t: "The Mountaintops are Surveyed"
 anatolian_beacon_system.0001.desc: "My lord, as the entire Empire celebrates the completion of the Imperial Beacon System, a special honor is owed to you. While many praise the masons who raised the towers or the engineers who designed the final link, the scholars and strategists of the court remember where the great work truly began.\n\nIt began with the perilous first step: the surveying of the hostile, uncharted wilderness. It was your foresight and patronage that funded the brave surveyors who charted the peaks and valleys, risking their lives to draw the maps that made everything else possible. Without the precise lines of sight they established, not a single stone could have been laid true, and the chain of light would have been broken before it was ever forged.\n\nIn the grand tapestry of this achievement, yours is the foundational thread. "
 anatolian_beacon_system.0001.a: "A firm foundation is the key to any great work."

 anatolian_beacon_system.0002.t: "A Legacy of Vigilance"
 anatolian_beacon_system.0002.desc: "My lord, while celebratory bonfires are lit in Constantinople, the most heartfelt thanks for the new Beacon System comes from the soldiers and citizens of the frontier. They know better than any courtier that a chain is only as strong as its first link, and it was your vital contribution that forged that link in the most dangerous of lands.\n\nUnder the very gaze of our enemies, your patronage raised the first fortified towers in the Cilician passes—the very eyes of this great system. These were not ceremonial structures, but military installations built in hostile territory, a defiant statement of Imperial resolve. It is from these towers that the first spark of warning will now fly, buying the Empire precious hours to muster its defense.\n\nOthers may have completed the system, but you built its shield. Let it be remembered that your coin and will secured the Empire's most vulnerable lands."
 anatolian_beacon_system.0002.a: "The shield is as important as the sword."

 anatolian_beacon_system.0003.t: "A Legacy of Command"
 anatolian_beacon_system.0003.desc: "My lord, the great work is complete—a chain of light now binds the frontier to the capital. Every link in that chain is a marvel, yet the final, most glorious link stands as a personal testament to your wisdom and patronage: the great receiver and command center atop the Pharos of the Great Palace.\n\nIt was your crucial contribution that brought the signal home, transforming a distant, flickering light into coherent intelligence delivered unto the Basileus himself. You have given this grand system its nerve center and its connection to the heart of Imperial power. While others built the eyes and ears of the Empire, you have gifted it a mind.\n\nLet the histories record that while the chain may have been forged by many hands, it was you who gave it its ultimate purpose."
 anatolian_beacon_system.0003.a: "Information is the sharpest weapon of all."

 anatolian_beacon_system.0004.t: "A Legacy of Dedication"
 anatolian_beacon_system.0004.desc: "My lord, the towers of the Beacon System stand tall, a marvel of Imperial engineering. But architects know that any great work is inert without skilled hands to operate it. It was your exceptional wisdom that recognized this truth, prompting you to fund the establishment of the *Vigiles*—the professional Beacon Watch.\n\nWhile the structure provides the body, it is these men, trained and equipped through your patronage, who are its living soul. It is they who will stand the lonely watch through storm and night, they who will manage the precious fuel, and they who will ensure the signal of light never fails. Your contribution has guaranteed the reliability and resilience of the entire system for generations to come.\n\nAn Emperor can command that a tower be built, but it takes a truly wise ruler to invest in the men who make it work. In this, you have proven your greatness."
 anatolian_beacon_system.0004.a: "A fortress is only as strong as its watchmen."

 anatolian_beacon_system.0005.t: "A Legacy of Genius"
 anatolian_beacon_system.0005.desc: "My lord, the completed Beacon System now stands as a vigilant shield, capable of sending a swift alarm across the Empire. Yet, it was your visionary contribution that elevated the project from a simple warning system into a true weapon of statecraft. By funding the integration of the semaphore, you have given the light a voice.\n\nWhere once a crude fire could only shout 'Danger!', the system can now whisper the specifics: the size of the enemy force, their direction, their very intent. This is the difference between a panicked muster and a calculated stratagem.\n\nLet it be known that while others gave the Empire eyes to see the fire, it was you who gave it the mind to understand its meaning."
 anatolian_beacon_system.0005.a: "Knowledge must be wielded with precision."
 
 anatolian_beacon_system.0006.t: "The Beacon System is Ready!"
 anatolian_beacon_system.0006.desc: "My lord, the final link is in place! Today, from the observation deck of the Great Palace, we witnessed a stunning success. A signal fire, lit on the distant edge of the Empire in the Cilician mountains, was relayed from peak to peak across the breadth of Anatolia. In little more than an hour, the final flash was received here, at the newly completed Pharos station.\n\nThe work of my ancestors, and my own, has come to fruition. The Imperial Beacon System, a marvel of engineering first perfected by Leo the Mathematician, is complete. The towers stand ready, the lines of sight are clear, and the infrastructure now lies dormant, a sleeping giant of vigilance awaiting my command.\n\nThe Master of Offices confirms that the order can be given at any time to bring the system to full readiness, though he cautions that maintaining such a state—manning the towers, stocking the fuel, and holding the garrisons on high alert—will be a constant drain on the Imperial coffers."
 anatolian_beacon_system.0006.a: "A light against the darkness, ready at my command."
 
 anatolian_beacon_system.0007.t: "The Light is Extinguished"
 anatolian_beacon_system.0007.desc: "A grim report has arrived from the Master of Offices. With the loss of the Anatolikon theme to our enemies, the very spine of our Imperial Beacon System has been snapped in two. The signal chain is irrecoverably broken.\n\nThe towers in the west can no longer see the signals from the frontier, and the frontier beacons now signal only to each other, their warnings lost in the desolate mountains now held by our foes. The work has come to a grinding halt, the engineers and masons abandoning their posts for fear of the enemy.\n\nThe dream of a vigilant Empire is shattered. The mountains of gold spent, the years of labor expended by my ancestors and I... all squandered because we could not hold the line. The half-finished system is now nothing more than a series of lonely, useless towers; monuments to our failure."
 anatolian_beacon_system.0007.a: "This humiliation will not stand!"

