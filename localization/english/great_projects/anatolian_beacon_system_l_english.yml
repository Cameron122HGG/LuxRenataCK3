 anatolian_beacon_system_modifier: "Vigilant Beacons"
 anatolian_beacon_system_modifier_desc: "By Imperial decree, the Beacon System is active. All along the frontier, the fires of vigilance are lit, their signals passed from peak to peak across Anatolia in a chain of fire and light. The message of readiness reaches all the way to the Great Palace itself, keeping even Constantinople on high alert.\n\nHere on the frontier, the local garrison stands perpetually ready, knowing that the slightest incursion will be seen, reported across the mountains in mere hours, and avenged with Imperial speed."
 
 building_bgp_byzantine_beacon_unlit: "Dormant Beacon Tower"
 building_bgp_byzantine_beacon_unlit_desc: "A tall stone watchtower stands silent on a commanding peak, a testament to Imperial engineering and strategic foresight. Built as a vital link in the great Imperial Beacon System, it currently lies dormant and unmanned.\n\nNo smoke rises from its chimney, and no watchmen walk its battlements. It is a promise of security, a sleeping sentinel that awaits the Imperial decree to be brought back to life and have its fires lit once more."
 building_type_bgp_byzantine_beacon_unlit: "$building_bgp_byzantine_beacon_unlit$"
 building_type_bgp_byzantine_beacon_unlit_desc: "$building_bgp_byzantine_beacon_unlit_desc$"
 
 building_bgp_byzantine_beacon_lit: "Vigilant Beacon Tower"
 building_bgp_byzantine_beacon_lit_desc: "No longer silent, this beacon tower is now fully manned and operational, a humming nerve ending of the active Imperial Beacon System. Smoke trickles from its flue, and a small garrison of elite *Vigiles* stands a constant watch, their gaze fixed on the neighboring peak in the great chain of light.\n\nReady at a moment's notice to light the great fire that will send a warning of invasion across Anatolia, the tower serves as a formidable local fortress. A spark of light here will become an urgent report in the Great Palace within the hour."
 building_type_bgp_byzantine_beacon_lit: "$building_bgp_byzantine_beacon_lit$"
 building_type_bgp_byzantine_beacon_lit_desc: "$building_bgp_byzantine_beacon_lit_desc$"
 
 activate_anatolian_beacons: "Light the Imperial Beacons" 
 activate_anatolian_beacons_desc: "The great Imperial Beacon System, a legacy of engineering and foresight passed down by my ancestors, stands silent across the Anatolian mountains. For generations, this chain of towers has been the Empire's first and best defense against sudden invasion.\n\nThough the towers are dormant, the threat from the East is ever-present. I can give the command to man the watch and light the fires of vigilance. This will bring the Empire to a heightened state of readiness, providing strength to our border garrisons and a swift warning against any incursion.\n\nSuch readiness is a heavy burden, however, and the Imperial treasury will be called upon to bear the significant ongoing expense."    
 activate_anatolian_beacons_tooltip: "Assume the monthly cost to activate the Imperial Beacon System, granting powerful defensive bonuses to your frontier provinces."
 activate_anatolian_beacons_effect_tooltip: "The Imperial Beacons will be lit and the system will become fully operational.\n\n• You will begin paying a monthly cost to maintain the system.\n• You will gain the #P 'Imperial Beacons Active'#! character modifier for as long as the system is operational.\n• #P `Dormant Beacon Towers`#! in your frontier provinces will be upgraded to #P `Vigilant Beacon Towers`#!, granting powerful defensive bonuses."
 activate_anatolian_beacons_confirm: "Anatolia calls for aid!" 
 
 deactivate_anatolian_beacons: "Quench the Imperial Beacons" 
 deactivate_anatolian_beacons_desc: "The Imperial Beacons have served their purpose, their vigilant fires burning brightly during a time of great peril. Now, with the immediate threats subsided and the treasury groaning under the constant expense, it is time to consider if such a heightened state of readiness is still necessary.\n\nI can give the command to stand down the watch and quench the flames. The towers will fall silent, and the significant cost of their upkeep will be lifted from my coffers. This will leave our frontiers more vulnerable to sudden attack, but it is a calculated risk that may be necessary for the economic health of the Empire.\n\nThe system remains, ready to be awoken again should the need arise."    
 deactivate_anatolian_beacons_tooltip: "End the monthly cost of the Beacon System by deactivating it, removing its powerful defensive bonuses until it is reactivated."
 deactivate_anatolian_beacons_effect_tooltip: "The Imperial Beacons will be quenched and the system will become dormant.\n\n• You will no longer pay the monthly maintenance cost for the system.\n• You will lose the #P 'Imperial Beacons Active'#! character modifier.\n• All #P `Vigilant Beacon Towers`#! in your frontier provinces will revert to #P `Dormant Beacon Towers`#!."
 deactivate_anatolian_beacons_confirm: "Quench the Flames of Vigilance." 