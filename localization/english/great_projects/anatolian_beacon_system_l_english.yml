 great_project_type_anatolian_beacon_system: "Restore the Anatolian Beacon System"
 great_project_type_anatolian_beacon_system_desc: "The frontiers of the Empire are under constant threat. Raids devastate the countryside, turning prosperous themes into dangerous borderlands. To respond effectively, we must be able to send warnings faster than the raiders can advance. During the reign of #bold Emperor Theophilos#!, a system was developed to counter the Saracen raids from Syria. With imperial support, the scholar and philosopher #bold Leo the Mathematician#! devised a network of signal beacons, using light to carry messages across great distances. It stretched from the frontier fortress of Loulon all the way to the Pharos of the Great Palace. The system eventually fell into disuse as Imperial power declined, but it had proved its worth.Now, it falls to us to restore this network. We will rebuild the towers, clear the lines of sight, and give the capital a way to receive warnings from its most distant and vulnerable frontier."
