 building_LR_st_david_cathedral: "St. David's Cathedral"
 building_LR_st_david_cathedral_desc: "St. David's Cathedral stands as the undisputed heart of the Christian faith in Wales, a magnificent edifice raised on the very ground where Dewi Sant founded his sacred community. Hewn from distinctive purple sandstone, its imposing towers and soaring nave create a spectacle of solemn grandeur.\n\nIts status as the keeper of the saint's relics makes it one of the great pilgrimage destinations of Christendom, drawing the faithful from across the known world. The entire complex, protected by the fortified walls of the Cathedral Close, serves as the unshakeable seat of the Bishop and the administrative soul of the Welsh Church."
 building_type_LR_st_david_cathedral: "$building_LR_st_david_cathedral$"
 building_type_LR_st_david_cathedral_desc: "$building_LR_st_david_cathedral_desc$"