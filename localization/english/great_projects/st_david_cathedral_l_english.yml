 great_project_type_st_david_cathedral: "Construct the Great Cathedral of Saint David"
 great_project_type_st_david_cathedral_desc: "For too long, the spiritual life of our nation has been centered in scattered monasteries and modest churches. To truly be a great Christian kingdom, we need a heart, a spiritual center to rival Canterbury or even Rome. We shall build it on the most sacred ground in all of Wales: the site of Saint David's original community.\n\nThis will be no mere church. We will raise a great cathedral, a fortress of faith whose grandeur will be spoken of throughout all of Christendom. It will serve as the magnificent See of our chief Bishop, a destination for pilgrims from across the world, and a testament in stone and glass to our devotion and power. The glory of God and the glory of Wales shall be made one."
