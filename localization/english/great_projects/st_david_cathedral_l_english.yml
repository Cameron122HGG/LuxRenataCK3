 pious_benefactor_modifier: "Pious Benefactor"
 pious_benefactor_modifier_desc: "My wealth was given to a cause far greater than myself: the raising of the magnificent See of Saint David. Every prayer said within its hallowed walls is now, in some small way, a testament to my own devotion. The bishops speak my name with reverence, and my legacy is now built not just on worldly deeds, but on a foundation of sacred stone."

 st_david_cathedral.0001.t: "The Ground is Hallowed"
 st_david_cathedral.0001.desc: "A letter bearing the seal of your chief Bishop arrives. It reads: 'The great consecration is complete. The ground where we shall build has been thoroughly blessed and purified by ceaseless prayer. More importantly, after a long and delicate search, the sacred bones of Dewi Sant himself have been recovered and now rest within a magnificent new reliquary. We can now proceed, assured that we build upon a foundation of true holiness.'"
 st_david_cathedral.0001.a: "With God's Saint on our side, we cannot fail."

 st_david_cathedral.0002.t: "Victory over the Mire"
 st_david_cathedral.0002.desc: "The Master of Works sends a report, its parchment still smelling of damp earth and sweat. He writes that the struggle against the Alun marshes is finally over. The engineers have succeeded in digging miles of drainage ditches and sinking colossal stone footings into the mire. The ground, once a treacherous swamp that swallowed tools whole, is now a stable, dry platform ready to bear the immense weight of our ambitions. It has been a costly and grueling battle against nature itself, but one we have decisively won."
 st_david_cathedral.0002.a: "Even the land itself must yield to our will."

 st_david_cathedral.0003.t: "The Veins of the Earth"
 st_david_cathedral.0003.desc: "Your royal steward reports that the quarries near the coast are now operating at full capacity. The quality of the sandstone they are yielding is exceptional—a deep, rich purple that seems to capture the light of the setting sun. Supply lines have been established, and a mountain of precisely cut stone is now ready and waiting for the masons. The very blood of the Welsh earth will flow into the walls of this great cathedral."
 st_david_cathedral.0003.a: "A worthy material for a house of God."

 st_david_cathedral.0004.t: "The Nave is Laid"
 st_david_cathedral.0004.desc: "A milestone has been reached. The master mason writes that the foundational footprint of the cathedral is now complete. The layout of the great nave and its mighty pillars has been set in stone, covering an immense area that astonishes all who see it. For the first time, one can truly grasp the monumental scale of our undertaking. This is no longer just a plan; it is a physical reality etched into the earth, ready to rise toward the heavens."
 st_david_cathedral.0004.a: "From these strong roots, a mighty structure will grow."

 st_david_cathedral.0005.t: "The Choir is Raised"
 st_david_cathedral.0005.desc: "An update from the chief architect informs you that the Presbytery and Choir are now structurally complete. He describes it as the most intricate and difficult part of the construction, requiring masterful stonework to support the high, vaulted ceilings and delicate window traceries. Though the rest of the cathedral is still a shell, this inner sanctum—the sacred heart of the entire building—now stands in its finished glory, awaiting the day it can be filled with prayer."
 st_david_cathedral.0005.a: "A space worthy of God's servants."
 
 st_david_cathedral.0006.t: "A New Landmark in Christendom"
 st_david_cathedral.0006.desc: "Word spreads like wildfire from pilgrims and merchants returning from the west. The great central tower of the cathedral is finished, and it has transformed the skyline for leagues around. It stands as a formidable beacon of faith and power, visible to ships far out at sea. The project is no longer a local affair; with this tower, you have placed a new landmark on the map of Christendom itself."
 st_david_cathedral.0006.a: "Our devotion now touches the clouds."

 st_david_cathedral.0007.t: "The Altar is Consecrated"
 st_david_cathedral.0007.desc: "The Abbott supervising the interior furnishings sends a profoundly reverent letter. The High Altar and great Rood Screen have been installed and consecrated. The altar, gleaming with gold leaf and studded with donated gems, is a masterpiece of devotion. The Rood Screen, a forest of intricately carved wood depicting the saints and apostles, now partitions the sacred space with a sense of profound mystery and awe. The soul of the cathedral is now in place."
 st_david_cathedral.0007.a: "A magnificent sight for both man and God."

 st_david_cathedral.0008.t: "A Fortress of Faith"
 st_david_cathedral.0008.desc: "The Bishop of St. David's writes to you, not from a simple monastic cell, but from his grand new palace. He confirms that the final contribution is complete: the cathedral is now surrounded by its fortified Close, containing the Bishop's Palace, the chapter house, and residences for the clergy. It has been transformed from a mere church into a true administrative and political See, a secure and self-sufficient center of ecclesiastical power from which to govern the spiritual life of your realm."
 st_david_cathedral.0008.a: "The foundation of our new Church is complete."

 st_david_cathedral.0009.t: "The Marsh Reclaims Its Own"
 st_david_cathedral.0009.desc: "A frantic master mason has arrived with devastating news: the cathedral is lost. Years of work and a king's ransom in gold have been swallowed by the very ground it was built upon. The initial efforts to drain the Alun marshes were evidently insufficient for a project of this scale. A corner of the massive central tower, its weight too great for the unstable soil, has collapsed, taking half the nave with it.\n\nThe priests are calling it a sign of God's displeasure, while the engineers simply weep at the sight of their life's work sinking back into the mud. The project is an unsalvageable, humiliating ruin. The sacred relics have been rescued, but our dream of a great national cathedral lies shattered."
 st_david_cathedral.0009.a: "To fail is one thing, to become a cautionary tale is another..."

 st_david_cathedral.0010.t: "Saint David's Cathedral"
 st_david_cathedral.0010.desc: "The deep, sonorous peel of the new cathedral bells rolls across the hills of Dyfed for the first time, a sound that shakes the very soul. Before a jubilant crowd of nobles, bishops, and countless common folk, the new See of Saint David is consecrated. The sunlight, filtering through the high windows, catches the purple hue of the stone, bathing the interior in a light that seems both royal and divine.\n\nThe Papal Legate, visibly moved, declares that our great work rivals any in England and that its sanctity is palpable. Pilgrims are already flocking to it, and its influence is immense. We have not just built a church; we have given our nation a spiritual heart, a fortress of faith that will serve as the center of our world for all time."
 st_david_cathedral.0010.a: "Glorious!"

