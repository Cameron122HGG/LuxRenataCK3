 great_project_type_convert_hagia_sophia: "Convert Hagia Sophia"
 great_project_type_convert_hagia_sophia_desc: "For centuries, Hagia Sophia has stood as the greatest monument to the Nazarene faith, a masterpiece of architecture dedicated to a foreign God. It remains a reminder of our people's long submission to a faith built around suffering and humility. As long as it stands in its present form, our restoration remains incomplete. The time has come to reclaim the building and give it a new purpose. We will remove its Christian icons and mosaics, refit its interior, and dedicate it to the gods of our ancestors. Its great dome, once built to honor a foreign faith, will become the centerpiece of a new temple. Dedicated to the wisdom and martial strength of Pallas Athena, this Grand Temple will serve as the heart of the Hellenic world and a sign that the Gods of Olympus have returned to their rightful place."
