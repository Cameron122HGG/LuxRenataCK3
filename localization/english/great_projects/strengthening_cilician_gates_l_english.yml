l_english:

 great_project_type_strengthening_cilician_gates: "Strengthen the Cilician Gates"
 great_project_type_strengthening_cilician_gates_desc: "The Cilician Gates are the primary gateway from Syria into the Anatolian heartland. For centuries, this narrow pass through the Taurus Mountains has been an artery for invasion, a permanent dagger pointed at our core territories. To leave it undefended is to invite disaster.\n\nThis grand endeavor will not just rebuild a single fort, but will establish an entire defensive system. We will construct a main fortress, a network of watchtowers, and a dedicated mountain garrison. We will turn this geographic vulnerability into an impenetrable iron door, forever slamming it shut in the face of our enemies to the south."
 great_project_type_tooltip_strengthening_cilician_gates: ""
 great_project_name_possessive_strengthening_cilician_gates: ""
 great_project_name_strengthening_cilician_gates: ""
 
 great_project_type_strengthening_cilician_gates_contribution_secure_the_pass: "Secure the Pass"
 great_project_type_strengthening_cilician_gates_contribution_secure_the_pass_desc: "Before any construction can begin, the pass itself must be pacified. The rugged mountains are a haven for bandits, warlords, and enemy scouts. We must dispatch experienced soldiers to clear out these nests of resistance, secure the main road, and map the treacherous side paths. Only when the area is under our firm control can the engineers begin their work."
 great_project_type_strengthening_cilician_gates_contribution_name_secure_the_pass: ""
 great_project_type_strengthening_cilician_gates_contribution_construct_pass_fortress: "Construct the Fortress of the Pass"
 great_project_type_strengthening_cilician_gates_contribution_construct_pass_fortress_desc: "At the narrowest point of the pass, we will construct a new, state-of-the-art fortress — the 'lock' upon the gates. This contribution will fund a formidable castle with high curtain walls, deep cisterns, and powerful catapult platforms designed to halt any invading army in its tracks and command the chokepoint."
 great_project_type_strengthening_cilician_gates_contribution_name_construct_pass_fortress: ""
 great_project_type_strengthening_cilician_gates_contribution_establish_watchtowers: "Establish the Watchtower Network"
 great_project_type_strengthening_cilician_gates_contribution_establish_watchtowers_desc: "A single fortress can be bypassed. We must construct a chain of inter-visible watchtowers and fortified posts stretching the entire length of the pass. Manned by vigilant sentinels, this network will serve as the eyes and ears of our defense, using signal fires to provide early warning of any enemy movement, day or night."
 great_project_type_strengthening_cilician_gates_contribution_name_establish_watchtowers: ""
 great_project_type_strengthening_cilician_gates_contribution_institute_toll_pass: "Institute the Toll Pass"
 great_project_type_strengthening_cilician_gates_contribution_institute_toll_pass_desc: "This pass is not just a military route, but a vital artery for the spice and silk caravans heading west. Now that we firmly control the road, we can turn this security into profit. This contribution establishes fortified toll stations, where our agents will collect tariffs from all merchant traffic, filling our coffers while demonstrating our authority."
 great_project_type_strengthening_cilician_gates_contribution_name_institute_toll_pass: ""

 domain_of_the_akritai_modifier: "Domain of the Akritai"
 domain_of_the_akritai_modifier_desc: "The Cilician Gates are no longer a mere border, but the sworn domain of the *Akritai*. These hardened frontier warriors, masters of the mountain passes, now operate from a formidable new fortress and a network of vigilant watchtowers. They are the eyes, ears, and sword of this land, ensuring no enemy can advance unchallenged and no merchant travels in fear. The pass has been transformed from a vulnerability into a bulwark, manned by the finest defenders of the Empire."

 cilician_gates_tolls_modifier: "Cilician Tolls Established"
 cilician_gates_tolls_modifier_desc: "This pass is now a regulated and profitable trade route. Fortified toll stations have been established, and the tariffs collected from passing caravans have created a new source of wealth, stimulating the local economy and enriching the lands that border this vital commercial artery."

 cilician_gates_toll_master_modifier: "Master of the Pass"
 cilician_gates_toll_master_modifier_desc: "By establishing and securing the toll stations within the Cilician Gates, I now command a vital artery of world commerce. A steady stream of revenue from the spice and silk caravans flows directly into my coffers, a constant reminder that securing this frontier is not just a military necessity, but a profoundly profitable enterprise."

 strengthening_cilician_gates.0001.t: "Report: The Way is Clear"
 strengthening_cilician_gates.0001.desc: "My lord, the captain leading the pacification effort sends word: the last of the major bandit dens has been burned out, and our banners now fly over the key strategic points. The road through the Gates is secure, and our engineers can proceed without fear of ambush."
 strengthening_cilician_gates.0001.a: "An excellent start. Let the builders proceed."

 strengthening_cilician_gates.0002.t: "The Lock Upon the Gates"
 strengthening_cilician_gates.0002.desc: "My lord, the master engineer reports that the Fortress of the Pass is complete. The new castle now utterly dominates the roadway, its stone walls seeming to merge with the mountainside itself. No army can now force its way through this chokepoint without undertaking a costly and bloody siege. The gate has its lock."
 strengthening_cilician_gates.0002.a: "Let them break themselves upon its walls."

 strengthening_cilician_gates.0003.t: "The Watchtowers Are Lit"
 strengthening_cilician_gates.0003.desc: "My lord, last night the signal was tested. From the southernmost tower to the gates of the main fortress, the chain of signal fires blazed to life in a matter of minutes. No hostile force can now move through the mountains undetected. The pass is under our constant watch."
 strengthening_cilician_gates.0003.a: "They will see our enemies long before they arrive."

 strengthening_cilician_gates.0004.t: "The Tolls Are Being Collected"
 strengthening_cilician_gates.0004.desc: "My lord, the first caravans have paid the new tariff to pass through the Gates. Our agents report a steady stream of revenue is already flowing from the toll stations. Not only have we secured the pass against our enemies, but we have now made it profitable in times of peace."
 strengthening_cilician_gates.0004.a: "Let the merchants fund our security."

 strengthening_cilician_gates.0005.t: "The Gates Are Sealed"
 strengthening_cilician_gates.0005.desc: "A dispatch has arrived from the newly fortified Cilician Gates, and the news is triumphant. The last toll station is operational, and the project is complete. What was once a gaping wound in our southern flank is now an impenetrable system of defense.\n\nThe new fortress stands as an unyielding bulwark, its watchtowers keeping a sleepless vigil over every path and valley. The eerie silence of a potential ambush has been replaced by the confident march of our patrols and the jingle of coin from merchant caravans paying for safe passage. We have not just fortified a pass; we have tamed a mountain range.\n\nLet the Caliphs and Sultans to the south rage. The gateway to Anatolia is now a door of iron, and we hold the only key."
 strengthening_cilician_gates.0005.a: "Anatolia is safe."
 
 strengthening_cilician_gates.0006.t: "The Gates Remain Vulnerable"
 strengthening_cilician_gates.0006.desc: "A shameful report has arrived from the Cilician Gates. The grand project has collapsed into ruin and disarray. The half-built walls of the fortress have become shelters for the very bandits we sought to displace, and the funds for the watchtowers have vanished into the pockets of corrupt officials.\n\nThe pass remains a critical vulnerability, a clear path for any determined invader. Our squandered investment has proven nothing to our enemies, save that our ambition far outstrips our competence. The gateway to our heartland remains dangerously open."
 strengthening_cilician_gates.0006.a: "A disastrous failure."


 cilician_akritai: "Cilician Akritai"
 cilician_akritai_flavor: "#F Born in the harsh borderlands of the Cilician Gates, the Akritai are grim veterans of the endless wars against Saracen and Turkish horsemen. They are masters of the ambush and the counter-raid, using javelins to break cavalry charges before closing in with their swords. They are the watchful wolves of the frontier. #!"
