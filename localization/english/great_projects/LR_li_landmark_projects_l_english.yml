 great_project_type_LR_rebuild_memphis: "Rebuild Memphis"
 great_project_type_LR_rebuild_memphis_desc: "Memphis, the White Walls of Menes and the first capital of the Two Lands, has crumbled into the fields beside Giza and Saqqara. Its walls, the great temple of Ptah and the necropolis of the old kings can be restored, and Egypt's oldest city made the seat of its gods again."
