 great_project_type_LR_rebuild_hattusa: "Rebuild Hattusa"
 great_project_type_LR_rebuild_hattusa_desc: "Hattusa, city of the Great Kings of Hatti, lies in ruins on its ridge above the Anatolian plain. Its palace on Büyükkale, its lower city and the great temple of the Storm God and the Sun Goddess of Arinna can be raised again, so that the gods of Hatti have a home worthy of them."
 great_project_type_tooltip_LR_rebuild_hattusa: "The capital of the Hittites rises from the ruins."
