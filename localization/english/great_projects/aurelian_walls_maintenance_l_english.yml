 great_project_type_aurelian_walls_maintenance: "Aurelian Walls Maintenance"
 great_project_type_aurelian_walls_maintenance_desc: "The great Aurelian Walls of Rome have fallen into serious disrepair. For centuries, this nineteen-kilometer circuit of brick and stone protected the city, but years of neglect have left much of it in poor condition. Sections of the ramparts are at risk of collapse, the towers are overgrown with ivy, and the gates have deteriorated to the point where they offer little protection. This is a necessary task to secure the city. We will repair the damaged walls, restore the gates, establish a permanent city garrison, and stock the granaries in preparation for a possible siege. By completing this work, we will restore Rome's defenses and ensure that the Eternal City is better prepared to face any threat."
