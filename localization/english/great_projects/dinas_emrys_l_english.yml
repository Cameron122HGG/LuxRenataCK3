 great_project_type_dinas_emrys: "Establish the Dinas Emrys"
 great_project_type_dinas_emrys_desc: "In the heart of Eryri lies a hill steeped in prophecy and power. It is said that long ago, the High King Vortigern tried to build a fortress here, only for its foundations to collapse each night. A boy with no mortal father, Myrddin Emrys, revealed the cause: two dragons, one red and one white, sleeping in a hidden pool beneath the hill. Their epic battle, once awoken, would foretell the struggle between our people and the encroaching Saxons.\n\nTo build here is not an act of mere construction; it is an act of seizing destiny. We will not be like Vortigern. We will build a fortress that works in concert with this ancient power, making this hill the prophetic heart of our realm. Dinas Emrys will become our ultimate stronghold, a symbol that the age of the Red Dragon's ascendancy is at hand."
