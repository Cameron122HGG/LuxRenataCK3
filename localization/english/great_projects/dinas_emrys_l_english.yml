 master_of_stone_modifier: "Master of Stone"
 master_of_stone_modifier_desc: "My investment in the quarrying efforts for a great project has paid off handsomely. The discovery of a vast vein of superior iron-stone means the quarries now produce far more than needed for the great structure. I have wisely organized the sale of this surplus, and the resulting flow of coin is a testament to my sound management."

 LR_master_of_fortifications_modifier: "Master of Fortifications"
 LR_master_of_fortifications_modifier_desc: "TThe theoretical knowledge of siegecraft is common, but I have gained a rare, practical mastery. By funding the monumental task of raising the fortifications of Dinas Emrys, I have put theory into practice on a scale few can comprehend. My name is now spoken with reverence by engineers and commanders, who see me as a true expert in the art of defense."

 prophets_patron_modifier: "The Prophet's Patron"
 prophets_patron_modifier_desc: "My patronage of the Tower of Myrddin Emrys, a center for both celestial observation and the study of sacred prophecies, has deeply connected me to the pursuit of higher knowledge. The scholars and seers who work within its walls look to me as their benefactor, and in their company, my own understanding of both the heavens and the divine has been profoundly deepened."

 dinas_emrys.0001.t: "The Prophet's Tower is Raised"
 dinas_emrys.0001.desc: "My lord, the Prophet's Tower now stands complete, its peak the highest point in the new fortress. Already our scholars and seers are at work within, poring over ancient texts and charting the movement of the stars. From its height, we can see not only our worldly domain, but perhaps a glimpse of the future as well."
 dinas_emrys.0001.a: "An excellent start."

 dinas_emrys.0002.t: "The Quarries are Productive"
 dinas_emrys.0002.desc: "The foreman overseeing the initial clearing and quarrying at Dinas Emrys sends an encouraging report. After blasting away the softer surface rock, his men have struck a vast vein of exceptionally hard, dark stone, dense enough to turn aside all but the strongest of siege engines.\n\nThe quality is so high that they have been able to establish a highly efficient quarrying operation much faster than anticipated. We now have a steady and high-quality supply of stone that is more than sufficient for the entire project. The mountain itself has provided the bones for its new crown."
 dinas_emrys.0002.a: "An excellent and auspicious start."

 dinas_emrys.0003.t: "The Foundations are Secure"
 dinas_emrys.0003.desc: "A dispatch, sealed with the Master Engineer's emblem, has arrived from the construction site. He writes that the sinking of the foundations, the most grueling and uncertain phase of the project, is finally complete. The bedrock of the hill was unexpectedly stubborn, shattering tools and morale for months on end. Some of the more superstitious laborers claimed the ground itself resisted their work.\n\nNevertheless, through persistence and expert engineering, our men have prevailed. The foundations have been sunk to a tremendous depth, anchored directly into the unyielding heart of the mountain. Whatever we build here will stand for eternity."
 dinas_emrys.0003.a: "A fortress must have deep roots."

 dinas_emrys.0004.t: "A New Mountain in Eryri"
 dinas_emrys.0004.desc: "Travelers arriving from Gwynedd bring exhilarating news that has spread across the realm. The outer walls of Dinas Emrys are complete, and they are a sight to behold. From a distance, it appears as if a new, sharp-peaked mountain has erupted from the hill, a crown of dark stone that glints in the sun.\n\nThe sheer scale and height of the fortifications have already had a profound effect on the local populace, who now speak of the project with a newfound sense of awe and security. The fortress is no longer a mere construction site; it is now a visible and intimidating symbol of my power."
 dinas_emrys.0004.a: "Let our enemies gaze upon it and tremble."

 dinas_emrys.0005.t: "The Heart of the Fortress"
 dinas_emrys.0005.desc: "It is done. The final contribution is complete, and the chief architect declares the inner citadel of Dinas Emrys finished. This fortress-within-a-fortress contains the lord's private quarters, secure barracks for the elite guard, a deep well, and vaulted storerooms that can withstand a prolonged siege.\n\nFrom the citadel's central keep, a commander can survey the entire outer perimeter and the surrounding passes. It is the secure and unbreachable heart of the entire complex. All that remains now is the final consecration of the fortress as a whole, to dedicate this great work to the security and glory of our people."
 dinas_emrys.0005.a: "Our will, made manifest in stone."
 
 dinas_emrys.0006.t: "The Red Dragon's Prophecy"
 dinas_emrys.0006.desc: "The final stone of the inner citadel has been laid, and the Master of Works has officially declared the fortress of Dinas Emrys complete. It is a masterpiece of military engineering, its formidable walls commanding the passes of Eryri, a bastion that will surely stand for a thousand years. But its true significance became clear only during the dedication ceremony.\n\nAs the priests blessed the gates, a powerful gust of wind swept up the hillside, unfurling my personal banner—the Red Dragon of our people—so that it flew perfectly against the sky. The assembled nobles and soldiers let out a spontaneous, thunderous cheer. In that moment, a bard began to sing an old verse, one telling of how the great Myrddin Emrys prophesied the victory of the Red Dragon over the White.\n\nI now understand. Vortigern, a foreign king, failed to build here because the very land rejected him. By succeeding where he failed, by raising this mighty fortress upon this sacred hill, I have done more than build a castle. I have become the living embodiment of that ancient prophecy. The common folk will not see stone and mortar; they will see a sign that the age of our people's ascendancy is at hand, with me at its head."
 dinas_emrys.0006.a: "This fortress is not my legacy. It is my destiny."

 dinas_emrys.0007.t: "The Hill Rejects Us!"
 dinas_emrys.0007.desc: "A grim-faced Master of Works has arrived from Dinas Emrys with a catastrophic report. The project is irretrievably lost. The treasury has run dry, and the constant demand for coin, stone, and men has brought the work to a grinding halt for months. The unpaid laborers have grown mutinous, and the foremen live in constant fear of riot and sabotage.\n\nWorse, the old superstitions have taken root in the camp. The workers whisper that our failure is not due to a lack of funds, but to a curse. They say the ground itself, the sacred soil where Myrddin prophesied, is rejecting my authority just as it rejected Vortigern's so long ago. My name is now mockingly spoken in the same breath as that weak, foreign king, a comparison I will struggle to live down.\n\nThe half-finished walls now stand as a monument not to my ambition, but to my hubris. My attempt to master a legend has instead become a fresh and humiliating new chapter in its long history."
 dinas_emrys.0007.a: "To fail is one thing, to become a cautionary tale is another..."

 ERYRI_LOCATION_TOOLTIP: "You need to hold [GetTitleByKey('c_caernarfonshire').GetName]"

 building_LR_dinas_emrys: "Dinas Emrys"
 building_LR_dinas_emrys_desc: "Dinas Emrys is a masterpiece of military engineering, its formidable walls dominating the mountain passes of Eryri. Yet it is more than a fortress; it is a symbol of destiny. Built upon the sacred hill where Myrddin prophesied the victory of the Red Dragon, its towering form is seen by the Welsh people as a living fulfillment of that legend. This place serves not only as the unshakeable heart of regional defense but also as a powerful anchor of loyalty and a constant reminder of our people's indomitable will."
 building_type_LR_dinas_emrys: "$building_LR_dinas_emrys$"
 building_type_LR_dinas_emrys_desc: "$building_LR_dinas_emrys_desc$"

 welsh_longbowmen: "Welsh Longbowmen"
 welsh_longbowmen_flavor: "From the hills of Wales come masters of the yew longbow. Their strength is legendary and their aim true. In battle, they unleash a storm of steel-tipped arrows capable of piercing a knight's mail from afar."

 welsh_longbowmen_unlocked: "Can recruit [GetMaA('welsh_longbowmen').GetName] as [men_at_arms|E]"
