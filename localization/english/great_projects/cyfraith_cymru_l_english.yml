 renowned_lawmaker_modifier: "Renowned Lawmaker"
 renowned_lawmaker_modifier_desc: "My name will be remembered alongside the great jurists who forged the new `Cyfraith Cymru`. By contributing my wealth and influence to this monumental undertaking, I have earned a lasting reputation as a wise and foundational figure in the establishment of a just and modern kingdom."

 royal_prerogative_modifier: "Royal Prerogative"
 royal_prerogative_modifier_desc: "The ancient and destructive custom of the blood-feud has been supplanted by the King's Peace. An offense against one of my subjects is now an offense against the Crown itself, to be judged and punished by my courts alone. This monumental shift has greatly centralized my authority and brought a new level of stability to the realm."

 cyfraith_cymru.0001.t: "The Council Has Reached an Accord"
 cyfraith_cymru.0001.desc: "A report from the secretary of the Great Council has arrived. After months of ferocious debate that saw ancient traditions pitted against modern needs, a consensus has finally been forged. The fundamental principles of the new, unified `Cyfraith Cymru` have been agreed upon by a majority of the assembled jurists, bards, and priests. The raw, theoretical material for our new legal code is now ready to be given its permanent form."
 cyfraith_cymru.0001.a: "From many voices, one law will emerge."

 cyfraith_cymru.0002.t: "The Royal Scriptorium is Open"
 cyfraith_cymru.0002.desc: "Your steward confirms that the new Royal Scriptorium is fully established and operational. A dedicated building has been constructed, and it is now staffed with the finest scribes in the land. The rooms smell of fresh ink and expensive vellum, the tools necessary not just for recording law, but for creating a modern, literate state bureaucracy. The machinery to draft our new legal reality is now in place."
 cyfraith_cymru.0002.a: "Let the permanent record begin."

 cyfraith_cymru.0003.t: "Feudal Contracts Have Been Established"
 cyfraith_cymru.0003.desc: "A revolutionary step has been taken. Your chancellor reports that the great lords of the realm have formally agreed to the replacement of the old tribal obligations with standardized Feudal Contracts. The vague requirements of personal loyalty have been supplanted by written charters that clearly define the taxes and levies owed to the crown in exchange for land tenure. This is the dawn of a new, more stable and predictable social order."
 cyfraith_cymru.0003.a: "A kingdom built on contracts, not just kinship."

 cyfraith_cymru.0004.t: "The King's Justice is Proclaimed"
 cyfraith_cymru.0004.desc: "The Marshal sends word of a landmark legal case. A feud between two powerful clans that would have once exploded into a bloody local war was instead settled by a royal judge. The new laws defining crimes against the 'King's Peace' have been successfully implemented. Justice is no longer a private matter of vengeance, but a public expression of state authority. The Crown, and the Crown alone, is now the ultimate arbiter of right and wrong in this land."
 cyfraith_cymru.0004.a: "One law, one justice, one king."

 cyfraith_cymru.0005.t: "The Succession is Secured"
 cyfraith_cymru.0005.desc: "It is done. After tense negotiations and a great deal of political maneuvering, the powerful lords of the realm have formally sworn to uphold the law of Primogeniture. They have recognized that the stability of a unified kingdom is more valuable than the fleeting opportunities presented by a succession crisis. No longer will this realm be shattered into pieces upon a ruler's death. The Crown and its lands will now pass, whole and intact, to a single heir."
 cyfraith_cymru.0005.a: "The kingdom will endure."
 
 cyfraith_cymru.0006.t: "A Cacophony of Voices"
 cyfraith_cymru.0006.desc: "The Council of Jurists has ended in ignominious failure. Instead of fostering unity, the great debate has only sharpened the divisions between the legal traditions of my vassals. The northern lords refuse to yield the customs of the south, the priests decry the pagan remnants championed by the bards, and the entire project has collapsed into a cacophony of competing voices.\n\nMy attempt to create a single law code has failed utterly. Worse, my vassals, now more aware than ever of their ancient privileges, are fiercely resistant to any further attempts at royal centralization. My ambition to create order has only succeeded in strengthening the chaos."
 cyfraith_cymru.0006.a: "A disaster!"

 cyfraith_cymru.0007.t: "The Law is Made One"
 cyfraith_cymru.0007.desc: "Before the assembled lords and clergy of my realm, the Master Jurist has unveiled the fruit of our great endeavor: a single, massive, leather-bound volume. Within its pages is the entirety of Welsh Law, made singular and whole for the first time in history. The `Cyfraith Cymru` is no longer a matter of disparate memory; it is now the unified, codified bedrock of my kingdom.\n\nThis book changes everything. With this act, the chaotic obligations of the old tribal ways are swept aside, replaced by the clear light of feudal law and royal authority. My lords now hold their lands by formal contract, my succession is secure, and my justice is the only justice. We are no longer a mere collection of clans and warring families. We are a true and proper kingdom, with one law, one standard, and one king."
 cyfraith_cymru.0007.a: "I am the Lawgiver!"

