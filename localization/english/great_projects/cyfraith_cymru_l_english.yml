 great_project_type_cyfraith_cymru: "Codify the Cyfraith Cymru"
 great_project_type_cyfraith_cymru_desc: "The laws of the Welsh people are ancient and just, but they exist primarily in the memory of jurists and the songs of bards. This patchwork of local tradition and oral history is insufficient for the great, unified kingdom I intend to build. To be a true nation, our laws must be singular, written, and applied equally from Anglesey to Gwent.\n\nFollowing the example of the great Hywel Dda, I will undertake the immense task of debating, compiling, and finally codifying the ancient `Cyfraith Cymru` into a single, magnificent legal text. This act will transform our realm, laying the foundations of a modern feudal state upon the bedrock of our unique Welsh heritage."
