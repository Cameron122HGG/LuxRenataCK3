 building_LR_offa_dyke: "Fortified Offa's Dyke"
 building_LR_offa_dyke_desc: "This section of the ancient border earthwork has been transformed into a formidable state-controlled fortification. Reinforced with stone revetments and studded with watchtowers, this imposing barrier is constantly manned by patrols. It serves as a powerful deterrent to raiders, channeling all cross-border traffic through official checkpoints and replacing the chaos of the wild frontier with the tangible presence of state security and order."
