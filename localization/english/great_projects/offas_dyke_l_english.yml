 great_project_type_offa_dyke: "Fortify Offa's Dyke"
 great_project_type_offa_dyke_desc: "A vast earthwork runs the length of the border, a relic of a bygone era's conflicts. For generations, it has marked a lawless and violent frontier, a porous line that invites raids and bleeds the treasuries of rulers on both sides. It is a symbol of instability.\n\nThis grand project will bring order to that chaos. By fortifying key strategic points, constructing a chain of watchtowers, and building a dedicated military road, we will transform this rambling mound into a staffed, fortified, and official border. This is not about separation; it is about control. The constant, draining border skirmishes will cease, replaced by the secure and regulated authority of a modern state."
