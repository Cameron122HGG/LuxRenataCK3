l_english:
 # The Eastern Anarchy (gen_eastern_anarchy.py)
 LR_eastern_anarchy:0 "Eastern Anarchy"
 LR_eastern_anarchy_desc:0 "With no emperor in Constantinople, the old Eastern empire has broken apart among despots, strategoi and warlords, each claiming the inheritance of Rome."
 situation_LR_eastern_anarchy:0 "$LR_eastern_anarchy$"
 situation_LR_eastern_anarchy_desc:0 "$LR_eastern_anarchy_desc$"
 situation_type_LR_eastern_anarchy:0 "$LR_eastern_anarchy$"
 situation_type_LR_eastern_anarchy_desc:0 "$LR_eastern_anarchy_desc$"

 LR_eastern_anarchy_situation_phase_eastern_anarchy_peace_situation_phase:0 "Uneasy Peace"
 LR_eastern_anarchy_situation_phase_eastern_anarchy_peace_situation_phase_desc:0 "The warlords have exhausted one another for now. Taxes come in, but no one's writ runs far beyond his own walls."
 LR_eastern_anarchy_peace_effects:0 "Uneasy Peace"
 LR_eastern_anarchy_situation_phase_eastern_anarchy_tension_situation_phase:0 "Usurpations"
 LR_eastern_anarchy_situation_phase_eastern_anarchy_tension_situation_phase_desc:0 "Strategoi proclaim themselves emperor, and every despot's vassals wonder whom they truly serve. New titles are cheap and loyalty is cheaper."
 LR_eastern_anarchy_tension_effects:0 "Usurpations"
 LR_eastern_anarchy_situation_phase_eastern_anarchy_war_situation_phase:0 "Civil War"
 LR_eastern_anarchy_situation_phase_eastern_anarchy_war_situation_phase_desc:0 "Open civil war: armies march on rival capitals, and the land pays for every campaign."
 LR_eastern_anarchy_war_effects:0 "Civil War"

 LR_eastern_anarchy_sub_region_byzantine_thunderdome:0 "Rhomania"
 LR_eastern_anarchy_sub_region_byzantine_thunderdome_desc:0 "The heartland of the Eastern empire, where every warlord claims the throne of Constantinople."
 LR_eastern_anarchy_sub_region_byzantine_border:0 "Borderlands"
 LR_eastern_anarchy_sub_region_byzantine_border_desc:0 "The marches of the old empire, where local powers hold the frontier for themselves."
 LR_eastern_anarchy_sub_region_roman_italy:0 "The Latins"
 LR_eastern_anarchy_sub_region_roman_italy_desc:0 "The Latin West, whose rulers watch the East for opportunity."
 LR_eastern_anarchy_participant_group_byzantine_rulers:0 "Rhomaic Warlords"
 LR_eastern_anarchy_participant_group_byzantine_rulers_desc:0 "The despots and strategoi of the heartland, each with a claim to the empire."
 LR_eastern_anarchy_participant_group_byzantine_marches:0 "Byzantine Marches"
 LR_eastern_anarchy_participant_group_byzantine_marches_desc:0 "The rulers of the old frontier, who keep its forts and serve no emperor."
 LR_eastern_anarchy_participant_group_latin_interlopers:0 "Latin Rulers"
 LR_eastern_anarchy_participant_group_latin_interlopers_desc:0 "The rulers of the Latin West, for whom the eastern wars are a field of glory."

 LR_eastern_anarchy_situation.0010.t:0 "An Uneasy Peace"
 LR_eastern_anarchy_situation.0010.desc:0 "The fighting in [situation_sub_region.GetName] has died down. The warlords count their losses and their taxes, and none of them trusts the quiet."
 LR_eastern_anarchy_situation.0010.a:0 "Let us use it well"
 LR_eastern_anarchy_situation.0011.t:0 "Usurpations"
 LR_eastern_anarchy_situation.0011.desc:0 "In [situation_sub_region.GetName], strategoi and despots proclaim themselves emperor one after another. Every vassal now weighs whom to follow."
 LR_eastern_anarchy_situation.0011.a:0 "Purple is cheap these days"
 LR_eastern_anarchy_situation.0012.t:0 "Civil War"
 LR_eastern_anarchy_situation.0012.desc:0 "Open war has come to [situation_sub_region.GetName]. Armies march on rival capitals, and the land will pay for it."
 LR_eastern_anarchy_situation.0012.a:0 "To arms"
 LR_eastern_anarchy_situation.0013.t:0 "The Eastern Anarchy"
 LR_eastern_anarchy_situation.0013.desc:0 "With no emperor in Constantinople, the East has broken among despots and warlords. My realm is now one of the contenders in the [situation.GetName]."
 LR_eastern_anarchy_situation.0013.a:0 "Then let us contend"
 LR_eastern_anarchy_situation.0014.t:0 "The Empire Restored"
 LR_eastern_anarchy_situation.0014.desc:0 "An emperor rules the East again, and the years of anarchy are over. What the warlords took, the empire will now reckon with."
 LR_eastern_anarchy_situation.0014.a:0 "Long live the emperor"
