l_english:
 GAME_DATE_STRING:100 "$DAY$ $MONTH$, $YEAR_LUX_GREG_IG$ $ERA_LUX_GREG_IG$"
 GAME_DATE_STRING_SHORT:100 "$DAY$ $MONTH_SHORT$, $YEAR_LUX_GREG_IG$ $ERA_LUX_GREG_IG$"
 GAME_DATE_STRING_LONG:100 "$DAY|O$ of $MONTH$, $YEAR_LUX_GREG_IG$ $ERA_LUX_GREG_IG$"
 GAME_DATE_STRING_SHORT_NO_YEAR:100 "$DAY$ $MONTH_SHORT$"

 YEAR_LUX_GREG_IG: "[Max_int32(Add_int32('(int32)$YEAR|q$', '(int32)-5000'), Subtract_int32('(int32)5001', '(int32)$YEAR|q$'))]"
 ERA_LUX_GREG_IG: "[Select_CString(GreaterThan_int32('(int32)$YEAR|q$', '(int32)5000'), 'A.D', 'B.C')]"
 BOOKMARK_DATE_STRING:100 "[GameSetup.GetSelectedDate.GetStringShortNoYear], $ERA_LUX_GREG_IG$ $YEAR_LUX_GREG_IG$"

 ERA_LUX_GREG_DYNASTY_FOUNDED: "[Select_CString(GreaterThan_int32(DynastyHouse.GetFoundYear, '(int32)5000'), 'A.D.', 'B.C.')]"
 YEAR_LUX_GREG_DYNASTY_FOUNDED: "[Max_int32(Add_int32('(int32)-5000', DynastyHouse.GetFoundYear), Subtract_int32('(int32)5001', DynastyHouse.GetFoundYear))]"


 ERA_LUX_GREG_IG_FRONTEND_BOOKMARK: "[Add_int32('(int32)-5000', '(int32)$YEAR|q$')], [Select_CString(GreaterThan_int32('(int32)$YEAR|q$', '(int32)5000'), 'A.D', 'B.C')]"
 YEAR_LUX_GREG_IG_FRONTEND_BOOKMARK: "[Add_int32('(int32)-5000', '(int32)$YEAR|q$')]"
 ERA_LUX_GREG_CULTURE_FOUNDED: "[Select_CString(GreaterThan_int32(DATE.GetYear, '(int32)5000'), 'A.D.', 'B.C.')]"

