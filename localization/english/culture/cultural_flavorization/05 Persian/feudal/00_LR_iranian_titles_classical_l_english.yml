l_english:
 # Lux Renata: Iranian classical titles (same as the despotic set), after Lux Invicta's Iranian set (Argbadh, Marzban, Satrap, Shah, Shahanshah,
 # Banebshen), 2026-11-05. The offices take the same word for both sexes, as in Lux Invicta. The empire tier is the
 # Wuzurg Shāh (Great Shah, the shah of Iran); only the hegemony (Ērānšahr) is the Shāhanshāh, the King of Kings.
 baron_iranian_classical_male: "Argbadh"
 baron_iranian_classical_female: "Argbadh"
 barony_iranian_classical_land: "Arg"

 count_iranian_classical_male: "Marzban"
 count_iranian_classical_female: "Marzban"
 county_iranian_classical_land: "Marzpanate"

 count_iranian_classical_male_independent: "Marzban"
 count_iranian_classical_female_independent: "Marzban"
 county_iranian_classical_land_independent: "Marzpanate"

 duke_iranian_classical_male: "Satrap"
 duke_iranian_classical_female: "Satrap"
 duchy_iranian_classical_land: "Satrapy"

 duke_iranian_classical_male_independent: "Satrap"
 duke_iranian_classical_female_independent: "Satrap"
 duchy_iranian_classical_land_independent: "Satrapy"

 king_iranian_classical_male: "Shāh"
 king_iranian_classical_female: "Banebshen"
 kingdom_iranian_classical_land: "Shāhdom"

 king_iranian_classical_male_independent: "Shāh"
 king_iranian_classical_female_independent: "Banebshen"
 kingdom_iranian_classical_land_independent: "Shāhdom"

 emperor_iranian_classical_male: "Wuzurg Shāh"
 emperor_iranian_classical_female: "Wuzurg Banebshen"
 empire_iranian_classical_land: "Wuzurg Shāhdom"

 emperor_iranian_classical_male_independent: "Wuzurg Shāh"
 emperor_iranian_classical_female_independent: "Wuzurg Banebshen"
 empire_iranian_classical_land_independent: "Wuzurg Shāhdom"

 hegemon_iranian_classical_male: "Shāhanshāh"
 hegemon_iranian_classical_female: "Banebshenan Banebshen"
 hegemony_iranian_classical_land: "Shāhanshāhdom"
