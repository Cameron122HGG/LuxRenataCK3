l_english:
 # Iranian law-based republic titles in Middle Persian style; Gissafid attested, other female forms take -banu
 count_republic_life_male_iranian: "Rīšsafīd" # rish-safid / gis-safid, white-beard / white-hair: the elder man and woman of a community
 count_republic_life_female_iranian: "Gīssafīd"
 duke_republic_life_male_iranian: "Mahist" # mahist, eldest or foremost, head of a council
 duke_republic_life_female_iranian: "Mahistbanū"
 count_republic_appointed_male_iranian: "Šahrab" # shahrab, Sasanian governor appointed over a city and its district
 count_republic_appointed_female_iranian: "Šahrabbanū"
 county_republic_appointed_iranian: "Šahrabīh"
 duke_republic_appointed_male_iranian: "Pādgōspān" # padgospan, governor appointed over one of the four quarters; padgos, the quarter
 duke_republic_appointed_female_iranian: "Pādgōspānbanū"
 duchy_republic_appointed_iranian: "Pādgōs"
 count_republic_hereditary_male_iranian: "Kanārang" # kanarang, hereditary march-lord of the Khorasan frontier
 count_republic_hereditary_female_iranian: "Kanārangbanū"
 county_republic_hereditary_iranian: "Kanārangīh"
 duke_republic_hereditary_male_iranian: "Bidaxš" # bidaxsh, hereditary viceroy in Parthian and Sasanian court lists
 duke_republic_hereditary_female_iranian: "Bidaxšbanū"
 duchy_republic_hereditary_iranian: "Bidaxšīh"
