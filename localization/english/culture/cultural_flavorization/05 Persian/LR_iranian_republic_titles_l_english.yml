l_english:
 # Iranian republic titles in Middle Persian style; Hanjamanbed and the Eran- titles reconstructed
 baron_republic_male_iranian: "Kadkhudā" # kadkhuda (Middle Persian kadag-xwaday, master of the house), village headman; deh, village
 baron_republic_female_iranian: "Kadkhudābanū"
 barony_republic_iranian: "Deh"
 count_republic_male_iranian: "Kalāntar" # kalantar, head of a city's quarters and guilds
 count_republic_female_iranian: "Kalāntarbanū"
 county_republic_iranian: "Kalāntarī"
 duke_republic_male_iranian: "Hanjamanbed" # hanjaman, an assembly, with -bed, master of (reconstructed)
 duke_republic_female_iranian: "Hanjamanbedbanū"
 duchy_republic_iranian: "Hanjaman"
 king_republic_male_iranian: "Mehestar" # the Parthian Mehestan, the council of elders and great houses that chose the Arsacid kings
 king_republic_female_iranian: "Mehestarbanū"
 kingdom_republic_iranian: "Mehestān"
 emperor_republic_male_iranian: "Wuzurg Mehestar" # wuzurg, great
 emperor_republic_female_iranian: "Wuzurg Mehestarbanū"
 empire_republic_iranian: "Wuzurg Mehestān"
 hegemon_republic_male_iranian: "Ērān-Mehestar" # elder of Iran; the Assembly of Iran (reconstructed)
 hegemon_republic_female_iranian: "Ērān-Mehestarbanū"
 hegemony_republic_iranian: "Hanjaman ī Ērān"
