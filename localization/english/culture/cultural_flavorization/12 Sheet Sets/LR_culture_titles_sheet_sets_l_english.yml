# Dacian (dacian) - from the team sheet 'Lux titles flavorization'
 baron_feudal_dacian_male: "Comat" # From 'Comatus', or 'Long Haired'. Apparently a designation for the Dacian aristocrats.
 baron_feudal_dacian_female: "Comate"
 count_feudal_dacian_male: "Zibythet" # 'Zibythides' could mean 'noble' or 'genuine' in a Thracian inscription, but we don't know if it had any other meaning beyond this.
 count_feudal_dacian_female: "Zibythete"
 duke_feudal_dacian_male: "Tarabost" # 'Tarabostes' was a title either meaning chief or aristocrat. Unclear if it was meant to be a ruler, a tribal leader or simply anyone considered elite.
 duke_feudal_dacian_female: "Taraboste"

