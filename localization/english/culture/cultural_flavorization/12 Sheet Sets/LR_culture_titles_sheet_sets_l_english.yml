 duke_feudal_garbarian_male: "Pram" # From PIE *prāmas, 'First'
 duke_admin_garbarian_male: "Varreth" # From Gaul. Uerobretos (chief judge) > Verbretho > Varretho
 duke_feudal_garbarian_female: "Pramë"
 duke_admin_garbarian_female: "Varrathjë"
 king_feudal_garbarian_male: "Rēg" # PIE *h₃rḗǵs native *Rēks, Reg-, Celtic and Latin influence with Riks/Rex > Hrēg > Rēz
