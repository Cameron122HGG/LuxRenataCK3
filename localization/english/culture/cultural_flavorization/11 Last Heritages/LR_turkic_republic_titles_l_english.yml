l_english:
 # Turkic republic titles; the same for women except aqsaqal/aqjaulyq
 baron_republic_male_turkic: "Aqsaqal" # aqsaqal, white-beard, the village elder; aqjaulyq, white kerchief, the elder woman; aul, village
 baron_republic_female_turkic: "Aqjaulyq"
 barony_republic_turkic: "Aul"
 count_republic_male_turkic: "Kethüda" # kethuda, a town's headman (from Persian kadkhuda); kent, town
 count_republic_female_turkic: "Kethüda"
 county_republic_turkic: "Kent"
 duke_republic_male_turkic: "Toybashı" # Old Turkic toy, a council, with bashi, head of (reconstructed)
 duke_republic_female_turkic: "Toybashı"
 duchy_republic_turkic: "Toy"
 king_republic_male_turkic: "Tarkhan" # tarkhan, a free and privileged rank owing no tribute
 king_republic_female_turkic: "Tarkhan"
 kingdom_republic_turkic: "Tarkhanlyq"
 emperor_republic_male_turkic: "Ulug Tarkhan" # ulug, great
 emperor_republic_female_turkic: "Ulug Tarkhan"
 empire_republic_turkic: "Ulug Tarkhanlyq"
 hegemon_republic_male_turkic: "Kurultay Begi" # lord of the kurultai, the great assembly of the steppe (reconstructed)
 hegemon_republic_female_turkic: "Kurultay Begi"
 hegemony_republic_turkic: "Ulug Kurultay"
