l_english:
 # East Slavic law-based republic titles (Kievan Rus' and Muscovite terms); female forms reconstructed
 count_republic_life_male_east_slavic: "Stareyshina" # stareyshina, elder chosen for life
 count_republic_life_female_east_slavic: "Stareyshina"
 duke_republic_life_male_east_slavic: "Veliky Stareyshina"
 duke_republic_life_female_east_slavic: "Veliky Stareyshina"
 count_republic_appointed_male_east_slavic: "Namestnik" # namestnik, Muscovite governor of a town or district
 count_republic_appointed_female_east_slavic: "Namestnitsa"
 county_republic_appointed_east_slavic: "Namestnichestvo"
 duke_republic_appointed_male_east_slavic: "Veliky Namestnik"
 duke_republic_appointed_female_east_slavic: "Velikaya Namestnitsa"
 duchy_republic_appointed_east_slavic: "Velikoe Namestnichestvo"
 count_republic_hereditary_male_east_slavic: "Votchinnik" # votchinnik, holder of a votchina, land held by hereditary right
 count_republic_hereditary_female_east_slavic: "Votchinnitsa"
 county_republic_hereditary_east_slavic: "Votchina"
 duke_republic_hereditary_male_east_slavic: "Udelny Knyaz" # udelny knyaz, prince of an udel (appanage)
 duke_republic_hereditary_female_east_slavic: "Udelnaya Knyaginya"
 duchy_republic_hereditary_east_slavic: "Udel"
