l_english:
 # Volga-Finnic republic titles from Mordvin and Mari roots; largely reconstructed
 baron_republic_male_volga_finnic: "Velatya" # Mordvin vel' (village), atya (old man), babo (old woman): village elder
 baron_republic_female_volga_finnic: "Velbabo"
 barony_republic_volga_finnic: "Vel"
 count_republic_male_volga_finnic: "Merkugyza" # Mari mer, a union of villages, under its elder (kugyza; kuva, old woman)
 count_republic_female_volga_finnic: "Merkuva"
 county_republic_volga_finnic: "Mer"
 duke_republic_male_volga_finnic: "Ozksazor" # Mordvin ozks, the communal prayer-assembly, with azor/ava (master/mistress)
 duke_republic_female_volga_finnic: "Ozksava"
 duchy_republic_volga_finnic: "Ozks"
 king_republic_male_volga_finnic: "Kugu Merkugyza" # Mari kugu, great: the great union
 king_republic_female_volga_finnic: "Kugu Merkuva"
 kingdom_republic_volga_finnic: "Kugu Mer"
 emperor_republic_male_volga_finnic: "Inä Ozksazor" # Mordvin inä, great: the great assembly
 emperor_republic_female_volga_finnic: "Inä Ozksava"
 empire_republic_volga_finnic: "Inä Ozks"
 hegemon_republic_male_volga_finnic: "Mastorazor" # Mordvin mastor, land or country: master of the land; Mastorava is also the Earth Mother
 hegemon_republic_female_volga_finnic: "Mastorava"
 hegemony_republic_volga_finnic: "Mastor"
