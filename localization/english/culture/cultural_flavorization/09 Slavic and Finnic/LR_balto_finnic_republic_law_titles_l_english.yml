l_english:
 # Balto-Finnic law-based republic titles in Finnish forms; the same for men and women except isäntä/emäntä
 count_republic_life_male_balto_finnic: "Lautamies" # lautamies, juror of the district court
 count_republic_life_female_balto_finnic: "Lautamies"
 duke_republic_life_male_balto_finnic: "Laamanni" # laamanni (Swedish lagman), law-speaker of a province, for life
 duke_republic_life_female_balto_finnic: "Laamanni"
 count_republic_appointed_male_balto_finnic: "Vouti" # vouti, the crown's appointed bailiff
 count_republic_appointed_female_balto_finnic: "Vouti"
 county_republic_appointed_balto_finnic: "Voutikunta"
 duke_republic_appointed_male_balto_finnic: "Maaherra" # maaherra, appointed governor of a lääni (province)
 duke_republic_appointed_female_balto_finnic: "Maaherra"
 duchy_republic_appointed_balto_finnic: "Lääni"
 count_republic_hereditary_male_balto_finnic: "Isäntä" # isäntä / emäntä, master and mistress of a perintötila (hereditary freehold)
 count_republic_hereditary_female_balto_finnic: "Emäntä"
 county_republic_hereditary_balto_finnic: "Perintötila"
 duke_republic_hereditary_male_balto_finnic: "Perintöruhtinas" # perintöruhtinas, hereditary prince
 duke_republic_hereditary_female_balto_finnic: "Perintöruhtinas"
 duchy_republic_hereditary_balto_finnic: "Perintöruhtinaskunta"
