l_english:
 # Ugro-Permian law-based republic titles (Komi, with Russian loans from the Perm lands); the same for men and women
 count_republic_life_male_ugro_permian: "Olanpörys" # Komi olan, life + pörys, elder: an elder for life
 count_republic_life_female_ugro_permian: "Olanpörys"
 duke_republic_life_male_ugro_permian: "Ydžyd Olanpörys"
 duke_republic_life_female_ugro_permian: "Ydžyd Olanpörys"
 count_republic_appointed_male_ugro_permian: "Tiun" # tiun, the steward Novgorod and Moscow appointed in the Perm lands
 count_republic_appointed_female_ugro_permian: "Tiun"
 county_republic_appointed_ugro_permian: "Tiunstvo"
 duke_republic_appointed_male_ugro_permian: "Namestnik" # namestnik, the Muscovite governor of Great Perm
 duke_republic_appointed_female_ugro_permian: "Namestnik"
 duchy_republic_appointed_ugro_permian: "Namestnichestvo"
 count_republic_hereditary_male_ugro_permian: "Kozjain" # kozjain, Russian khozyain (master, owner) as Komi borrowed it
 count_republic_hereditary_female_ugro_permian: "Kozjain"
 county_republic_hereditary_ugro_permian: "Kozjainstvo"
 duke_republic_hereditary_male_ugro_permian: "Knyaz" # knyaz, as used for the hereditary princes of Great Perm
 duke_republic_hereditary_female_ugro_permian: "Knyaz"
 duchy_republic_hereditary_ugro_permian: "Knyazhestvo"
