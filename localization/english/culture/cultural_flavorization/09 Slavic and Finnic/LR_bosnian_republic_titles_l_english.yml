l_english:
 # Bosnian republic titles: offices of the medieval Bosnian banate and kingdom; female forms reconstructed
 baron_republic_male_bosnian: "Satnik" # satnik, local captain and official
 baron_republic_female_bosnian: "Satnica"
 barony_republic_bosnian: "Satništvo"
 count_republic_male_bosnian: "Kaznac" # kaznac, court official who ran a district
 count_republic_female_bosnian: "Kaznačica"
 county_republic_bosnian: "Kaznačina"
 duke_republic_male_bosnian: "Tepčija" # tepčija, a high court office of medieval Bosnia
 duke_republic_female_bosnian: "Tepčijka"
 duchy_republic_bosnian: "Tepčijstvo"
 king_republic_male_bosnian: "Veliki Vojvoda" # veliki vojvoda bosanski, the realm's greatest lord after the ruler
 king_republic_female_bosnian: "Velika Vojvotkinja"
 kingdom_republic_bosnian: "Veliko Vojvodstvo"
 emperor_republic_male_bosnian: "Ban" # ban, ruler of Bosnia before the kingdom
 emperor_republic_female_bosnian: "Banica"
 empire_republic_bosnian: "Banovina"
 hegemon_republic_male_bosnian: "Veliki Ban" # veliki ban, great ban
 hegemon_republic_female_bosnian: "Velika Banica"
 hegemony_republic_bosnian: "Velika Banovina"
