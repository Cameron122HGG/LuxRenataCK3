l_english:
 # East Slavic republic titles, after the Novgorod Republic; female forms reconstructed
 baron_republic_male_east_slavic: "Sotsky" # sotsky, the hundred-man, an elected ward official of Novgorod
 baron_republic_female_east_slavic: "Sotskaya"
 barony_republic_east_slavic: "Sotnya"
 count_republic_male_east_slavic: "Tysyatsky" # tysyatsky, the thousand-man, head of Novgorod's militia and commoners
 count_republic_female_east_slavic: "Tysyatskaya"
 county_republic_east_slavic: "Tysyacha"
 duke_republic_male_east_slavic: "Posadnik" # posadnik, elected mayor of Novgorod and Pskov
 duke_republic_female_east_slavic: "Posadnitsa"
 duchy_republic_east_slavic: "Posadnichestvo"
 king_republic_male_east_slavic: "Stepenny Posadnik" # stepenny posadnik, the sitting mayor; veche, the city assembly
 king_republic_female_east_slavic: "Stepennaya Posadnitsa"
 kingdom_republic_east_slavic: "Veche"
 emperor_republic_male_east_slavic: "Veliky Posadnik" # veliky posadnik, great posadnik
 emperor_republic_female_east_slavic: "Velikaya Posadnitsa"
 empire_republic_east_slavic: "Velikoe Veche"
 hegemon_republic_male_east_slavic: "Gosudar" # gosudar, sovereign; gosudarstvo became the Russian word for state
 hegemon_republic_female_east_slavic: "Gosudarynya"
 hegemony_republic_east_slavic: "Gosudarstvo"
