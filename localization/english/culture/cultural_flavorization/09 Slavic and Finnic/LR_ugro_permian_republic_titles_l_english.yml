l_english:
 # Ugro-Permian republic titles, Komi-based and heavily reconstructed; the same for men and women
 baron_republic_male_ugro_permian: "Pörys" # Komi pörys, old one, an elder; sikt, village
 baron_republic_female_ugro_permian: "Pörys"
 barony_republic_ugro_permian: "Sikt"
 count_republic_male_ugro_permian: "Karpörys" # Komi kar, a town or fortified settlement: the town elder
 count_republic_female_ugro_permian: "Karpörys"
 county_republic_ugro_permian: "Kar"
 duke_republic_male_ugro_permian: "Tun" # Komi tun, the sage-elder of Komi tradition; mu, land
 duke_republic_female_ugro_permian: "Tun"
 duchy_republic_ugro_permian: "Mu"
 king_republic_male_ugro_permian: "Ydžyd Tun" # Komi ydžyd, great
 king_republic_female_ugro_permian: "Ydžyd Tun"
 kingdom_republic_ugro_permian: "Ydžyd Mu"
 emperor_republic_male_ugro_permian: "Pam" # Komi pam, the high priest-leader (as Pam Sotnik, who opposed Stephen of Perm); yöz, the people
 emperor_republic_female_ugro_permian: "Pam"
 empire_republic_ugro_permian: "Yöz"
 hegemon_republic_male_ugro_permian: "Ydžyd Pam" # great pam; the great people
 hegemon_republic_female_ugro_permian: "Ydžyd Pam"
 hegemony_republic_ugro_permian: "Ydžyd Yöz"
