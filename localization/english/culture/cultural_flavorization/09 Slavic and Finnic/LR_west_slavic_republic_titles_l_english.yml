l_english:
 # West Slavic republic titles in Polish forms: self-governing towns under German town law, and the Rzeczpospolita
 baron_republic_male_west_slavic: "Sołtys" # sołtys, village head under German town law
 baron_republic_female_west_slavic: "Sołtysowa"
 barony_republic_west_slavic: "Sołectwo"
 count_republic_male_west_slavic: "Wójt" # wójt, the advocatus who ran a chartered town
 count_republic_female_west_slavic: "Wójtowa"
 county_republic_west_slavic: "Wójtostwo"
 duke_republic_male_west_slavic: "Burmistrz" # burmistrz, mayor of a town council
 duke_republic_female_west_slavic: "Burmistrzowa"
 duchy_republic_west_slavic: "Burmistrzostwo"
 king_republic_male_west_slavic: "Wielki Burmistrz" # wielki burmistrz, great mayor
 king_republic_female_west_slavic: "Wielka Burmistrzowa"
 kingdom_republic_west_slavic: "Wielkie Burmistrzostwo"
 emperor_republic_male_west_slavic: "Marszałek" # marszałek, the marshal who chaired the Polish Sejm
 emperor_republic_female_west_slavic: "Marszałkowa"
 empire_republic_west_slavic: "Marszałkostwo"
 hegemon_republic_male_west_slavic: "Wielki Marszałek" # wielki marszałek, great marshal; Rzeczpospolita, Polish for res publica
 hegemon_republic_female_west_slavic: "Wielka Marszałkowa"
 hegemony_republic_west_slavic: "Rzeczpospolita"
