l_english:

 # Croatian republic titles: Dalmatian communes and the Republic of Ragusa; female forms reconstructed
 baron_republic_male_croatian: "Glavar" # glavar, village headman
 baron_republic_female_croatian: "Glavarica"
 barony_republic_croatian: "Glavarstvo"
 count_republic_male_croatian: "Potestat" # potestat (podestà) of the Dalmatian communes; općina, commune
 count_republic_female_croatian: "Potestatica"
 county_republic_croatian: "Općina"
 duke_republic_male_croatian: "Knez" # knez, the elected rector of the Republic of Ragusa
 duke_republic_female_croatian: "Kneginja"
 duchy_republic_croatian: "Knežija"
 king_republic_male_croatian: "Veliki Knez" # veliki knez, great knez
 king_republic_female_croatian: "Velika Kneginja"
 kingdom_republic_croatian: "Velika Knežija"
 emperor_republic_male_croatian: "Ban" # ban, Croatia's highest office below the king
 emperor_republic_female_croatian: "Banica"
 empire_republic_croatian: "Banovina"
 hegemon_republic_male_croatian: "Veliki Ban" # veliki ban, great ban
 hegemon_republic_female_croatian: "Velika Banica"
 hegemony_republic_croatian: "Velika Banovina"

 # Serbian republic titles: offices of the Nemanjić state (there were no Serbian republics); female forms reconstructed
 baron_republic_male_serbian: "Kmet" # kmet, village headman
 baron_republic_female_serbian: "Kmetica"
 barony_republic_serbian: "Kmetstvo"
 count_republic_male_serbian: "Kefalija" # kefalija, town governor under Dušan (from Greek kephale)
 count_republic_female_serbian: "Kefalijka"
 county_republic_serbian: "Kefalijstvo"
 duke_republic_male_serbian: "Čelnik" # čelnik, high court official
 duke_republic_female_serbian: "Čelnica"
 duchy_republic_serbian: "Čelništvo"
 king_republic_male_serbian: "Veliki Čelnik" # veliki čelnik, the highest court office in medieval Serbia
 king_republic_female_serbian: "Velika Čelnica"
 kingdom_republic_serbian: "Veliko Čelništvo"
 emperor_republic_male_serbian: "Protosevast" # protosevast, senior court rank (from Greek protosebastos)
 emperor_republic_female_serbian: "Protosevastica"
 empire_republic_serbian: "Protosevastija"
 hegemon_republic_male_serbian: "Kesar" # kesar (Caesar), held by great lords of Dušan's empire
 hegemon_republic_female_serbian: "Kesarica"
 hegemony_republic_serbian: "Kesarstvo"
