l_english:
 # West Slavic law-based republic titles in Polish forms
 count_republic_life_male_west_slavic: "Ławnik" # ławnik, alderman of a town bench
 count_republic_life_female_west_slavic: "Ławniczka"
 duke_republic_life_male_west_slavic: "Wielki Ławnik"
 duke_republic_life_female_west_slavic: "Wielka Ławniczka"
 count_republic_appointed_male_west_slavic: "Starosta" # starosta, the king's appointed governor
 count_republic_appointed_female_west_slavic: "Starościna"
 county_republic_appointed_west_slavic: "Starostwo"
 duke_republic_appointed_male_west_slavic: "Starosta Generalny" # starosta generalny, governor of a whole province such as Greater Poland
 duke_republic_appointed_female_west_slavic: "Starościna Generalna"
 duchy_republic_appointed_west_slavic: "Starostwo Generalne"
 count_republic_hereditary_male_west_slavic: "Dziedzic" # dziedzic, hereditary lord or heir
 count_republic_hereditary_female_west_slavic: "Dziedziczka"
 county_republic_hereditary_west_slavic: "Dziedzictwo"
 duke_republic_hereditary_male_west_slavic: "Książę Udzielny" # książę udzielny, duke of a hereditary appanage duchy
 duke_republic_hereditary_female_west_slavic: "Księżna Udzielna"
 duchy_republic_hereditary_west_slavic: "Księstwo Udzielne"
