l_english:
 # Balto-Finnic republic titles in Finnish forms, built on vanhin (elder); the same for men and women
 baron_republic_male_balto_finnic: "Kylänvanhin" # kylänvanhin, village elder; kyläkunta, village community
 baron_republic_female_balto_finnic: "Kylänvanhin"
 barony_republic_balto_finnic: "Kyläkunta"
 count_republic_male_balto_finnic: "Pitäjänvanhin" # pitäjänvanhin, parish elder; pitäjä, parish
 count_republic_female_balto_finnic: "Pitäjänvanhin"
 county_republic_balto_finnic: "Pitäjä"
 duke_republic_male_balto_finnic: "Maanvanhin" # maanvanhin, elder of a land (Estonian maavanem); maakunta, province
 duke_republic_female_balto_finnic: "Maanvanhin"
 duchy_republic_balto_finnic: "Maakunta"
 king_republic_male_balto_finnic: "Ylivanhin" # ylivanhin, chief elder; liitto, league of lands
 king_republic_female_balto_finnic: "Ylivanhin"
 kingdom_republic_balto_finnic: "Liitto"
 emperor_republic_male_balto_finnic: "Valtionvanhin" # valtionvanhin, State Elder (Estonian riigivanem); valtio, state
 emperor_republic_female_balto_finnic: "Valtionvanhin"
 empire_republic_balto_finnic: "Valtio"
 hegemon_republic_male_balto_finnic: "Suuri Valtionvanhin" # suuri valtionvanhin, Great State Elder; tasavalta, republic
 hegemon_republic_female_balto_finnic: "Suuri Valtionvanhin"
 hegemony_republic_balto_finnic: "Tasavalta"
