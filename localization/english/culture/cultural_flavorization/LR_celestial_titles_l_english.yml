 king_tang_celestial_male_chinese: "Guowang" # Chinese guowang, king of a state
 king_tang_celestial_female_chinese: "$king_tang_celestial_male_chinese$"
 emperor_tang_celestial_male_chinese: "Huangdi" # Chinese huangdi, emperor: in the dynastic cycle the claimants of the Mandate are emperors
 emperor_tang_celestial_female_chinese: "$emperor_tang_celestial_male_chinese$"
 hegemon_tang_celestial_male_chinese: "Tianzi" # Chinese tianzi, the Son of Heaven
