l_english:

# West Gothic, Classical
 baron_classical_west_gothic_male: "Gardingus" # Visigothic gardingus, a noble of the royal household; Gothic gards, house
 baron_classical_west_gothic_female: "Gardinga" # invented feminine of gardingus
 barony_classical_west_gothic_land: "Gards" # Gothic gards, house or estate
 count_classical_west_gothic_male: "Thiufadus" # Visigothic thiufadus, commander of a thousand
 count_classical_west_gothic_female: "Thiufada" # invented feminine of thiufadus
 county_classical_west_gothic_land: "Thiufa" # Visigothic thiufa, a thousand-man levy
 duke_classical_west_gothic_male: "Kindins" # Gothic kindins, governor (used of Pilate)
 duke_classical_west_gothic_female: "Kindina" # invented feminine of kindins
 duchy_classical_west_gothic_land: "Kindinassus" # Gothic kindins + -assus (office)
 king_classical_west_gothic_male: "Thiudans" # Gothic thiudans, king
 king_classical_west_gothic_female: "Thiudanei" # invented feminine of thiudans
 kingdom_classical_west_gothic_land: "Thiudinassus" # Gothic thiudinassus, kingdom
 kingdom_classical_west_gothic_land_independent: "Thiudangardi" # Gothic thiudangardi, kingdom, royal house
 king_classical_west_gothic_male_independent: "Thiudans" # Gothic thiudans, king
 king_classical_west_gothic_female_independent: "Thiudanei" # invented feminine of thiudans
 emperor_classical_west_gothic_male: "Allathiudans" # Gothic alla-, all + thiudans, king: a high king
 emperor_classical_west_gothic_female: "Allathiudanei" # invented feminine of allathiudans
 empire_classical_west_gothic_land_independent: "Allathiudinassus" # Gothic alla-, all + thiudinassus, kingdom
 emperor_classical_west_gothic_male_independent: "Allathiudans" # Gothic alla-, all + thiudans, king: a high king
 emperor_classical_west_gothic_female_independent: "Allathiudanei" # invented feminine of allathiudans
 hegemon_classical_west_gothic_male: "Kaisar" # Gothic kaisar, emperor
 hegemon_classical_west_gothic_female: "Kaisarei" # invented feminine of kaisar
 hegemony_classical_west_gothic_land: "Kaisaragardi" # Gothic kaisar + gardi, house

