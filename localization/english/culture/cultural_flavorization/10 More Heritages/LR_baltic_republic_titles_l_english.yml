l_english:
 # Baltic republic titles in Lithuanian forms (chartered towns and the Commonwealth); female forms reconstructed
 baron_republic_male_baltic: "Šaltyšius" # šaltyšius, village head (from Polish sołtys)
 baron_republic_female_baltic: "Šaltyšienė"
 barony_republic_baltic: "Šaltyšija"
 count_republic_male_baltic: "Vaitas" # vaitas, town advocate under Magdeburg law
 count_republic_female_baltic: "Vaitienė"
 county_republic_baltic: "Vaitystė"
 duke_republic_male_baltic: "Burmistras" # burmistras, mayor of a town council
 duke_republic_female_baltic: "Burmistrienė"
 duchy_republic_baltic: "Burmistrystė"
 king_republic_male_baltic: "Didysis Burmistras" # didysis burmistras, great mayor
 king_republic_female_baltic: "Didžioji Burmistrienė"
 kingdom_republic_baltic: "Didžioji Burmistrystė"
 emperor_republic_male_baltic: "Maršalka" # maršalka, the marshal who presided over the Lithuanian diet
 emperor_republic_female_baltic: "Maršalkienė"
 empire_republic_baltic: "Maršalkija"
 hegemon_republic_male_baltic: "Didysis Maršalka" # didysis maršalka, great marshal; Respublika, as in the Commonwealth's Lithuanian name
 hegemon_republic_female_baltic: "Didžioji Maršalkienė"
 hegemony_republic_baltic: "Respublika"
