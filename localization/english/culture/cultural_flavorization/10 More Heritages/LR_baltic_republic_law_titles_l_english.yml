l_english:
 # Baltic law-based republic titles in Lithuanian forms (Grand Duchy of Lithuania terms); female forms reconstructed
 count_republic_life_male_baltic: "Lavininkas" # lavininkas, alderman of a town bench (Polish ławnik)
 count_republic_life_female_baltic: "Lavininkė"
 duke_republic_life_male_baltic: "Didysis Lavininkas"
 duke_republic_life_female_baltic: "Didžioji Lavininkė"
 count_republic_appointed_male_baltic: "Seniūnas" # seniūnas, the Grand Duchy's appointed governor (Polish starosta)
 count_republic_appointed_female_baltic: "Seniūnienė"
 county_republic_appointed_baltic: "Seniūnija"
 duke_republic_appointed_male_baltic: "Didysis Seniūnas" # didysis seniūnas, after the Elder of Samogitia, governor of a whole province
 duke_republic_appointed_female_baltic: "Didžioji Seniūnienė"
 duchy_republic_appointed_baltic: "Didžioji Seniūnija"
 count_republic_hereditary_male_baltic: "Tėvonis" # tėvonis, holder of a tėvonija, patrimonial land
 count_republic_hereditary_female_baltic: "Tėvonienė"
 county_republic_hereditary_baltic: "Tėvonija"
 duke_republic_hereditary_male_baltic: "Dalinis Kunigaikštis" # dalinis kunigaikštis, appanage duke
 duke_republic_hereditary_female_baltic: "Dalinė Kunigaikštienė"
 duchy_republic_hereditary_baltic: "Dalinė Kunigaikštystė"
