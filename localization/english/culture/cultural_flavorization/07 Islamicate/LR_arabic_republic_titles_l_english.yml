l_english:
 # Arabic republic realm names and top-tier rulers (the lower rulers are in culture_titles_l_english.yml)
 emperor_republic_male_arabic_group: "Ra'īs al-Ru'asā'" # ra'is al-ru'asa', chief of chiefs, an Abbasid-era title
 emperor_republic_female_arabic_group: "Ra'īsat al-Ru'asā'"
 hegemon_republic_male_arabic_group: "Ḥākim al-Ḥukkām" # hakim al-hukkam, ruler of rulers (on the pattern of qadi al-qudat)
 hegemon_republic_female_arabic_group: "Ḥākimat al-Ḥukkām"
 barony_republic_arabic_group: "Riyāsa" # riyasa, headship, the office of a ra'is
 county_republic_arabic_group: "Madīna" # madina, city
 duchy_republic_arabic_group: "Ḥukūma" # hukuma, the jurisdiction of a hakim
 kingdom_republic_arabic_group: "Majlis" # majlis, council
 empire_republic_arabic_group: "Majlis al-Shūrā" # majlis al-shura, the consultative council
 hegemony_republic_arabic_group: "Jamā'a" # jama'a, the community or commonwealth
