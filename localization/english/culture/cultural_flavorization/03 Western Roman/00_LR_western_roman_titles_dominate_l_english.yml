 kingdom_western_roman_roman_dominate_independent: "Cesarato"

 emperor_western_roman_roman_dominate_male: "Prefecto Pretorio" # praefectus praetorio
 emperor_western_roman_roman_dominate_female: "Prefecta Pretorio"
 empire_western_roman_roman_dominate: "Prefectura"

 emperor_western_roman_roman_dominate_male_independent: "Agosto" # Augustus
 emperor_western_roman_roman_dominate_female_independent: "Agosta"
 empire_western_roman_roman_dominate_independent: "Imperio"

 hegemon_western_roman_roman_dominate_male: "Dominu" # dominus, the lord of the Dominate
