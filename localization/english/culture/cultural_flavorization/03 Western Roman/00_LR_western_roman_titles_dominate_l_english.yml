 baron_western_roman_roman_dominate_male: "Decurione" # decurio, member of a city council (curialis)
 baron_western_roman_roman_dominate_female: "Decurionessa"
 barony_western_roman_roman_dominate: "Vico"

 count_western_roman_roman_dominate_male: "Defensore" # defensor civitatis
 count_western_roman_roman_dominate_female: "Defensora"
 county_western_roman_roman_dominate: "Citade"

 king_western_roman_roman_dominate_male_independent: "Cesare" # a junior emperor of the Tetrarchy
