# Lux Renata: Romano-Hispanic titles use the culture's own evolved Latin (2026-11-05; were copies of the Romano-Gothic set).
# Each evolved form notes the Latin it comes from.

#Roman Classical Feudal
 baron_classical_romano_hispanic_male: "Edil" # from Latin aedilis
 baron_classical_romano_hispanic_female: "Edil" # from Latin aedilis
 barony_classical_romano_hispanic_land: "Municipio" # from Latin municipium

 count_classical_romano_hispanic_male: "Conde" # from Latin comes, comitem
 count_classical_romano_hispanic_female: "Condesa" # from Latin comitissa
 county_classical_romano_hispanic_land: "Condado" # from Latin comitatus

 duke_classical_romano_hispanic_male: "Duque" # from Latin dux, ducem
 duke_classical_romano_hispanic_female: "Duquesa" # from Latin ducissa
 duchy_classical_romano_hispanic_land: "Ducado" # from Latin ducatus

 king_classical_romano_hispanic_male: "Domne Rei" # from Latin dominus rex, a lord-king under a higher crown
 king_classical_romano_hispanic_female: "Domna Reina" # from Latin domina regina
 kingdom_classical_romano_hispanic_land: "Domnio" # from Latin dominium

 king_classical_romano_hispanic_male_independent: "Rei" # from Latin rex, regem
 king_classical_romano_hispanic_female_independent: "Reina" # from Latin regina
 kingdom_classical_romano_hispanic_land_independent: "Reino" # from Latin regnum

 emperor_classical_romano_hispanic_male: "Rei Imperial" # from Latin rex imperialis
 emperor_classical_romano_hispanic_female: "Reina Imperial" # from Latin regina imperialis
 empire_classical_romano_hispanic_land: "Reino Imperial" # from Latin regnum imperiale

 emperor_classical_romano_hispanic_male_independent: "Emperador" # from Latin imperator, imperatorem
 emperor_classical_romano_hispanic_female_independent: "Emperatriz" # from Latin imperatrix
 empire_classical_romano_hispanic_land_independent: "Imperio" # from Latin imperium

 hegemon_classical_romano_hispanic_male: "Agusto" # from Latin Augustus
 hegemon_classical_romano_hispanic_female: "Agusta" # from Latin Augusta
 hegemony_classical_romano_hispanic_land: "Imperio" # from Latin imperium

