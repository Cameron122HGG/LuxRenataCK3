l_english:
 # Carthaginian republic titles; Rabbat and Adirat attested, Shofetet and the realm names Hubur, 'Am Rab, Memshelet 'Am reconstructed
 baron_republic_male_carthaginian: "Rab Mizrah" # head of a mizrah, a Punic civic association (attested rb mzrh)
 baron_republic_female_carthaginian: "Rabbat Mizrah"
 barony_republic_carthaginian: "Mizrah"
 count_republic_male_carthaginian: "Shofet" # shofet, a suffete; every Punic city had its own pair; qart, city
 count_republic_female_carthaginian: "Shofetet"
 county_republic_carthaginian: "Qart"
 duke_republic_male_carthaginian: "Adir" # adir, one of the mighty ones of the council; hubur, an association or council
 duke_republic_female_carthaginian: "Adirat"
 duchy_republic_carthaginian: "Hubur"
 king_republic_male_carthaginian: "Rab Adirim" # chief of the council; 'am, the people's assembly (the people of Carthage on the coins)
 king_republic_female_carthaginian: "Rabbat Adirim"
 kingdom_republic_carthaginian: "'Am"
 emperor_republic_male_carthaginian: "Rab Shofetim" # chief of the suffetes; the great assembly
 emperor_republic_female_carthaginian: "Rabbat Shofetim"
 empire_republic_carthaginian: "'Am Rab"
 hegemon_republic_male_carthaginian: "Rab Mahanet" # rab mahanet, the general the state elected; dominion of the people
 hegemon_republic_female_carthaginian: "Rabbat Mahanet"
 hegemony_republic_carthaginian: "Memshelet 'Am"
