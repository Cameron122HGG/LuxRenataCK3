l_english:
 # Hellenistic republic titles (polis and federal leagues); Archousa attested, Autokrateira on the Byzantine pattern, other female forms reconstructed
 baron_republic_male_hellenistic: "Démarchos" # dēmarchos, head of a deme, the Athenian village unit
 baron_republic_female_hellenistic: "Dēmarchís"
 barony_republic_hellenistic: "Dêmos"
 count_republic_male_hellenistic: "Prýtanis" # prytanis, presiding magistrate of a city's council; polis, city-state
 count_republic_female_hellenistic: "Prytanîtis"
 county_republic_hellenistic: "Pólis"
 duke_republic_male_hellenistic: "Árchōn" # archon, chief magistrate; sympoliteia, a union of cities sharing one citizenship
 duke_republic_female_hellenistic: "Árchousa"
 duchy_republic_hellenistic: "Sympoliteía"
 king_republic_male_hellenistic: "Stratēgós" # strategos, the elected head of the Achaean and Aetolian Leagues; koinon, a federal league
 king_republic_female_hellenistic: "Stratēgís"
 kingdom_republic_hellenistic: "Koinón"
 emperor_republic_male_hellenistic: "Hēgemón" # hegemon, leader of a league of leagues, as Philip and Alexander led the League of Corinth
 emperor_republic_female_hellenistic: "Hēgemonís"
 empire_republic_hellenistic: "Hēgemonía"
 hegemon_republic_male_hellenistic: "Stratēgós Autokrátōr" # strategos autokrator, general with full powers; Commonwealth of the Hellenes
 hegemon_republic_female_hellenistic: "Stratēgís Autokráteira"
 hegemony_republic_hellenistic: "Koinón tōn Hellénōn"
