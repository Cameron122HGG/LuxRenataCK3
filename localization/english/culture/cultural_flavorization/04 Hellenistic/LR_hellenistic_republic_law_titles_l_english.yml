l_english:
 # Hellenistic law-based republic titles; Geraira and Dynasteira attested, other female forms reconstructed
 count_republic_life_male_hellenistic: "Gérōn" # geron, member of the Spartan gerousia, elected for life; geraira, honoured elder woman in Athenian rites
 count_republic_life_female_hellenistic: "Geráira"
 duke_republic_life_male_hellenistic: "Areopagítēs" # areopagites, member of the Areopagus, Athens' council of former archons, for life
 duke_republic_life_female_hellenistic: "Areopagîtis"
 count_republic_appointed_male_hellenistic: "Epimelētés" # epimeletes, appointed overseer or curator; epimeleia, his charge
 count_republic_appointed_female_hellenistic: "Epimelétria"
 county_republic_appointed_hellenistic: "Epimeleía"
 duke_republic_appointed_male_hellenistic: "Harmostés" # harmostes, governor Sparta appointed over subject cities
 duke_republic_appointed_female_hellenistic: "Harmóstria"
 duchy_republic_appointed_hellenistic: "Harmosteía"
 count_republic_hereditary_male_hellenistic: "Dynástēs" # dynastes, hereditary local lord; dynasteira attested
 count_republic_hereditary_female_hellenistic: "Dynásteira"
 county_republic_hereditary_hellenistic: "Dynasteía"
 duke_republic_hereditary_male_hellenistic: "Týrannos" # tyrannos, hereditary sole ruler of a city; tyrannis, the tyranny
 duke_republic_hereditary_female_hellenistic: "Tyranníssa"
 duchy_republic_hereditary_hellenistic: "Tyrannís"
