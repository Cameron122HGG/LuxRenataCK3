l_english:
 lux_tradition_hellenistic_nostalgia_name: "Hellenistic Nostalgia"
 lux_tradition_hellenistic_nostalgia_desc: "The age of Alexander and his Successors lives on in this culture's memory. Its nobles wear the helmets of the phalanx and the linothorax of the Companions, and its people still speak of the oikoumene the Macedonians made.\n\n#weak Characters of this culture wear Hellenistic clothing and armour.#!"

 rule_lr_hellenistic_nostalgia_start: "Hellenistic Nostalgia"
 setting_lr_hellenistic_nostalgia_all: "#high All Hellenic Heritages#!"
 setting_lr_hellenistic_nostalgia_all_desc: "Every culture of the Ancient Greek, Hellenistic Greek, Indo-Hellenic and Serican heritages starts with the #high Hellenistic Nostalgia#! tradition and its Hellenistic clothing. This is Lux Renata's default setting."
 setting_lr_hellenistic_nostalgia_greek: "Greek Heritages"
 setting_lr_hellenistic_nostalgia_greek_desc: "Only cultures of the Ancient Greek and Hellenistic Greek heritages start with the #high Hellenistic Nostalgia#! tradition and its Hellenistic clothing."
 setting_lr_hellenistic_nostalgia_hellenistic: "Hellenistic Greek Heritage"
 setting_lr_hellenistic_nostalgia_hellenistic_desc: "Only cultures of the Hellenistic Greek heritage start with the #high Hellenistic Nostalgia#! tradition and its Hellenistic clothing."
 setting_lr_hellenistic_nostalgia_hellenistic_culture: "Hellenistic Culture"
 setting_lr_hellenistic_nostalgia_hellenistic_culture_desc: "Only the Hellenistic culture starts with the #high Hellenistic Nostalgia#! tradition and its Hellenistic clothing."
 setting_lr_hellenistic_nostalgia_off: "Off"
 setting_lr_hellenistic_nostalgia_off_desc: "No culture starts with the #high Hellenistic Nostalgia#! tradition. Cultures can still adopt it, and with it the Hellenistic clothing."
