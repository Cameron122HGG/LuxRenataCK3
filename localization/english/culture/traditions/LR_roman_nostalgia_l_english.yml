l_english:
 lux_tradition_roman_nostalgia_name: "Roman Nostalgia"
 lux_tradition_roman_nostalgia_desc: "Centuries after the legions marched, this culture still dresses the part. Its nobles wear the toga at court, its soldiers march in the armour of the centurion, and its people speak of the Empire as if it never truly ended.\n\n#weak Characters of this culture wear Roman clothing and armour.#!"

 rule_lr_roman_nostalgia_start: "Roman Nostalgia"
 setting_lr_roman_nostalgia_both: "#high Both Roman Heritages#!"
 setting_lr_roman_nostalgia_both_desc: "Every culture of the Western Roman and Eastern Roman heritages starts with the #high Roman Nostalgia#! tradition, and wears togas, centurion armour and other Roman clothing. This is Lux Renata's default setting."
 setting_lr_roman_nostalgia_western: "Western Roman Heritage"
 setting_lr_roman_nostalgia_western_desc: "Only cultures of the Western Roman heritage start with the #high Roman Nostalgia#! tradition and its Roman clothing."
 setting_lr_roman_nostalgia_eastern: "Eastern Roman Heritage"
 setting_lr_roman_nostalgia_eastern_desc: "Only cultures of the Eastern Roman heritage start with the #high Roman Nostalgia#! tradition and its Roman clothing."
 setting_lr_roman_nostalgia_western_roman: "Western Roman Culture"
 setting_lr_roman_nostalgia_western_roman_desc: "Only the Western Roman culture starts with the #high Roman Nostalgia#! tradition and its Roman clothing."
 setting_lr_roman_nostalgia_off: "Off"
 setting_lr_roman_nostalgia_off_desc: "No culture starts with the #high Roman Nostalgia#! tradition. Cultures can still adopt it, and with it the Roman clothing."
