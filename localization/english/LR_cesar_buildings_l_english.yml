 LR_altar_pergamon_district_desc_flavor: "$building_type_LR_altar_pergamon_desc$"
 building_type_LR_diplotaphos_troy: "Diplotaphos of Troy"
 building_type_LR_diplotaphos_troy_desc: "This ancient double tomb, where Achilles and Patroclus lie, is the centre of a sprawling necropolis and a series of sanctuaries dedicated to the heroes of the Homeric legends and the gods of the Underworld."
 LR_diplotaphos_troy: "$building_type_LR_diplotaphos_troy$"
