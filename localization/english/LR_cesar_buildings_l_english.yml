 LR_telesterion_eleusis_district_desc_flavor: "$building_type_LR_telesterion_eleusis_desc$"
 building_type_LR_altar_pergamon: "Altar of Pergamon"
 building_type_LR_altar_pergamon_desc: "A monumental altar to Zeus, where the wealth of nations was sacrified to the Olympian. Now part of the fortifications of the Attalid acropolis of Pergamon, it is not as accessible as it used to be."
 LR_altar_pergamon: "$building_type_LR_altar_pergamon$"
 LR_altar_pergamon_desc: "$building_type_LR_altar_pergamon_desc$"
