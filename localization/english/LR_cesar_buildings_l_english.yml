 building_type_LR_phosphoretai_ankyra: "Rotunda of the Phosphoretai"
 building_type_LR_phosphoretai_ankyra_desc: "This sacred foundation of the Phosphoretai in Ankyra is devoted to holy illumination, vigilance and divine guidance."
 LR_phosphoretai_ankyra: "$building_type_LR_phosphoretai_ankyra$"
