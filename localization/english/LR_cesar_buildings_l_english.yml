 building_type_LR_kybelaion_sardes_desc: "A sanctuary dedicated to the Great Mother, the Kybelaion of Sardes is a place of ecstatic devotion, where the Emperor Julian, as part of his treaty with Valentinian, returned the ."
 LR_kybelaion_sardes: "$building_type_LR_kybelaion_sardes$"
