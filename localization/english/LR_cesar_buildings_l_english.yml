 building_type_LR_medaurion: "Medaurion"
 building_type_LR_medaurion_desc: "A revered sanctuary of Medaurus, this holy site is a meeting hall of warriors and a necropolis for those who died in battle after pronouncing an oath to Medauros, the god of war, brotherhood and altruistic intent. Many come with offerings and prayers, but also some arrive to take part in the secret induction to the Brotherhood of the Red Hand, the protectors of the Hall of Warriors."
 LR_medaurion: "$building_type_LR_medaurion$"
 LR_medaurion_desc: "$building_type_LR_medaurion_desc$"
 LR_medaurion_district: "$building_type_LR_medaurion$"
 LR_medaurion_district_desc_flavor: "$building_type_LR_medaurion_desc$"
 building_type_akrokorinthos_01: "Akrokorinthos"
 building_type_akrokorinthos_01_desc: "The towering High Corinth and one of the three Fetters of Greece, this storied citadel commands the Isthmic plains and the entrance to the Argolis. A high crest topped by an ancient citadel from before the days of Homer hosts a temple which used to be dedicated to the worship of Aphrodite, although in time the Corinthians came to worship the mysteries of Isis, Mithraism, the cult of Helios and the various Neoplatonic mystical variants more than the old. The cult of Aphrodite never vanished entirely, but it survived transformed in the epithets of Isis, the female helpers of Mithras, Aphrodite Selene, lover of Helios, or the Heavenly Mary Magdalene."
 akrokorinthos_01: "$building_type_akrokorinthos_01$"
 akrokorinthos_01_desc: "$building_type_akrokorinthos_01_desc$"
 akrokorinthos_01_district: "$building_type_akrokorinthos_01$"
 akrokorinthos_01_district_desc_flavor: "$building_type_akrokorinthos_01_desc$"
 building_type_castellum_ticinianum_01: "Castellum Ticinianum"
 building_type_castellum_ticinianum_01_desc: "At the crossroads of the Via Aemilia stands an ancient fortified castrum, raised by the Legions and where, in time, Legionary initiates of Mithras transformed the fortress into a temple-stronghold with a vast heptagonal enclosure surrounded by seven mighty towers. Its innermost court was barred to all but the initiated, though travellers and labourers felt safe toiling and trailing at its shadow. At some point in the 400's, as Christianity spread in the West and the Legions were reassigned to more pressing posts, the Castellum was abandoned and occupied soon after by Bishop Syrus as his residence. When the Lombards made Pavia the seat of their kingdom, bishop and king came to share the fortress for the defence of the city, while its hidden chambers and towers gained a darker reputation as a prison for prince and pauper alike."
 castellum_ticinianum_01: "$building_type_castellum_ticinianum_01$"
 castellum_ticinianum_01_desc: "$building_type_castellum_ticinianum_01_desc$"
 castellum_ticinianum_01_district: "$building_type_castellum_ticinianum_01$"
 castellum_ticinianum_01_district_desc_flavor: "$building_type_castellum_ticinianum_01_desc$"
 building_type_heptapyrgian_mithraeum_01: "Sepiturrine Mithraeum"
 building_type_heptapyrgian_mithraeum_01_desc: "The buried sanctuary beneath the seven towers has been opened once more and the ancient Castellum reconsecrated to Mithras, not just as a castle to protect the secret rites, but as a mighty stronghold from which protect the initiates, train the warriors of the future generation, spread the faith of the Oath of Mithras and bring forth a new birth of light to the world."
 heptapyrgian_mithraeum_01: "$building_type_heptapyrgian_mithraeum_01$"
 heptapyrgian_mithraeum_01_desc: "$building_type_heptapyrgian_mithraeum_01_desc$"
 building_type_LR_mallorca_norse_palace: "Konungshǫll of Majork"
 building_type_LR_mallorca_norse_palace_desc: "Above the harbour of Majorkaborg rises the great hall of the island's Norse rulers, a sprawling royal compound of dark brick bult over the quarry stone foundations of the Roman citadel. Jarls and Oath-men gather beneath its roof to feast, divide the profits of war, discuss the state of trade in the Western Mediterranean and negotiate taxes on all goods. The Bjornings have become rich, but has this palace made them soft?"
 LR_mallorca_norse_palace: "$building_type_LR_mallorca_norse_palace$"
 LR_mallorca_norse_palace_desc: "$building_type_LR_mallorca_norse_palace_desc$"
