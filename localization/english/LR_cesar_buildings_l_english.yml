l_english:
 # Cèsar de Quart's LR special buildings (generated by tools/cesar_buildings/port_cesar_buildings.py)
 building_type_artemision_ephesus_01: "Artemision of Ephesus"
 building_type_artemision_ephesus_01_desc: "The great ephesian Temple of Artemis, among the most celebrated sanctuaries of the ancient world, house of the Lady of the Ephesians, a mysterious fertility goddess the Greeks translated to Artemis. In its day, it was the greatest temple ever built by the Greeks, and it was exquisite in its carvings and decorations. Today, the luck of Ephesus has waned, and the temple, despite its might, has had to endure the ravages of war and the fury of Poseidon the Earth-Shaker. Additional structures and brick buttresses support the building where the old pillars gave in, and a tower was built next to it, to watch the land for signs of invasion. The worship of the Lady of the Ephesians, however, often equated now with Kybele as well as Artemis, continues, and the colossal onicelephantine statue with its black stone skin and many-breasted ivory chest, still recieves worship unperturbed."
 artemision_ephesus_01: "$building_type_artemision_ephesus_01$"
 artemision_ephesus_01_desc: "$building_type_artemision_ephesus_01_desc$"
 artemision_ephesus_01_district: "$building_type_artemision_ephesus_01$"
 artemision_ephesus_01_district_desc_flavor: "$building_type_artemision_ephesus_01_desc$"
 building_type_LR_oracle_delphi: "Oracle of Delphi"
 building_type_LR_oracle_delphi_desc: "Seat of Apollo's most famed oracle, the Pythia and her priesthood, Delphi is where king and pauper alike pilgrim to see through the divine eyes that can pierce all, even the future."
 LR_oracle_delphi: "$building_type_LR_oracle_delphi$"
 LR_oracle_delphi_desc: "$building_type_LR_oracle_delphi_desc$"
 LR_oracle_delphi_district: "$building_type_LR_oracle_delphi$"
 LR_oracle_delphi_district_desc_flavor: "$building_type_LR_oracle_delphi_desc$"
 building_type_LR_panepeiroteion: "Panepeiroteion"
 building_type_LR_panepeiroteion_desc: "A great pan-Epirote sanctuary and gathering place, and the seat of the democratic politics of the Christians of the Epirus."
 LR_panepeiroteion: "$building_type_LR_panepeiroteion$"
 LR_panepeiroteion_desc: "$building_type_LR_panepeiroteion_desc$"
 LR_panepeiroteion_district: "$building_type_LR_panepeiroteion$"
 LR_panepeiroteion_district_desc_flavor: "$building_type_LR_panepeiroteion_desc$"
 building_type_LR_oracle_dodona: "Oracle of Dodona"
 building_type_LR_oracle_dodona_desc: "One of the oldest oracular sanctuaries in the Greek world, Dodona is revered despite its modest size; there's a rather small temple and a courtyard where the sacred oak grows, and those who seek to hear the voice of the King of Olympus in the branches etch their petitions in bronze sheets and hang them or leave them besides the oak, after which they meditate and listen for prophetic voices in the wind."
 LR_oracle_dodona: "$building_type_LR_oracle_dodona$"
 LR_oracle_dodona_desc: "$building_type_LR_oracle_dodona_desc$"
 LR_oracle_dodona_district: "$building_type_LR_oracle_dodona$"
 LR_oracle_dodona_district_desc_flavor: "$building_type_LR_oracle_dodona_desc$"
 building_type_LR_oracle_didyma: "Oracle of Didyma"
 building_type_LR_oracle_didyma_desc: "A renowned center of Apollonian worship, once monumental, but now in ruins after war and famine ravaged Miletos. It used to be one of the biggest temples of all the Hellenistic world, with a sacred laurel tree and a fresh spring inside of in, within an open air adyton. In that courtyard, the prophetess of Apollo submerged herself partially in the sacred spring and spoke with the voice of the god, after which the priests -often of the Branchidai family, although under the Roman empire the Emperor or local governors often gave the privilege to loyal servants- interpreted the visions and wrote them in archaic, formal verse, a signature of the Deidyman oracular tradition."
 LR_oracle_didyma: "$building_type_LR_oracle_didyma$"
 LR_oracle_didyma_desc: "$building_type_LR_oracle_didyma_desc$"
 LR_oracle_didyma_district: "$building_type_LR_oracle_didyma$"
 LR_oracle_didyma_district_desc_flavor: "$building_type_LR_oracle_didyma_desc$"
 building_type_LR_church_pantokrator: "Church of the Pantokrator"
 building_type_LR_church_pantokrator_desc: "Dedicated to Christ Pantokrator, this church barely disguises its underlying structure, the Temple of Zeus Olympian, where the famed Phidian statue had its home until Julian took it to Constantinople to adorn his project of the Hagia Sophia of Helios. As the Christian population grew in western Greece, so waned the hellenic rites of old, and when the Eastern Roman Empire officially adopted the Doctrine of Helios Aniketos, the traditional cults lost their most important patron. The whole of Elis became majority Christian at some point in the 700's, especially after the Emperor relocated Christians from other parts of the Empire to the depopulated eastern Greece and the Peloponnese. The sanctuaries of Olympia, abandoned for decades, found a new use as a monastic area, and the major temple of Zeus became a church dedicated to the Christ Pantokrator."
 LR_church_pantokrator: "$building_type_LR_church_pantokrator$"
 LR_church_pantokrator_desc: "$building_type_LR_church_pantokrator_desc$"
 LR_church_pantokrator_district: "$building_type_LR_church_pantokrator$"
 LR_church_pantokrator_district_desc_flavor: "$building_type_LR_church_pantokrator_desc$"
 building_type_LR_temple_zeus_olympios: "Temple of Zeus Olympios"
 building_type_LR_temple_zeus_olympios_desc: "Restored, this temple now honors Zeus Olympios, the King of the Gods, wielding majesty and absolute power. The colossal statue may not be the original by Phidias, but it is a close match, with marble skin and bronze chlamys, laurels, scepre, eagle and victory on the palm of his mighty hand."
 LR_temple_zeus_olympios: "$building_type_LR_temple_zeus_olympios$"
 LR_temple_zeus_olympios_desc: "$building_type_LR_temple_zeus_olympios_desc$"
 building_type_LR_telesterion_eleusis: "Telesterion of Eleusis"
 building_type_LR_telesterion_eleusis_desc: "The great hall of initiation at Eleusis is the ritual heart of the Mysteries, where sacred rites promise revelation to the worthy after the sun sets, Demeter sleeps and Persephone dwells in the Hades. It is now a smaller hall than the one Emperor Marcus Aurelius had built, since parts of its structure have been damaged by the Gepid, Gothic and Arab raids. But the faithful still come to Eleusis to partake in the mysterious extatic rituals."
 LR_telesterion_eleusis: "$building_type_LR_telesterion_eleusis$"
 LR_telesterion_eleusis_desc: "$building_type_LR_telesterion_eleusis_desc$"
