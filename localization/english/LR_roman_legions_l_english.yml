 LR_roman_legate_male:0 "Legatus"
 LR_roman_legate_female:0 "Legata"
 LR_roman_legate_modifier:0 "Roman Legate"
 LR_roman_legate_modifier_desc:0 "This character commands a legion of the Roman field army, and the state bears much of the cost of its soldiers."
 LR_roman_legion_appointment_succession_law:0 "Legion Appointment"
 LR_roman_legion_appointment_succession_law_subname:0 "$meritocratic_military_appointment_succession_law_subname$"
 LR_roman_legion_appointment_succession_law_effects:0 "\nA type of [appointment_succession_law|E] used only by the Roman legions. Under $LR_roman_legion_appointment_succession_law$, the legion passes to the candidate the emperor favours, not to the legate's family."
 LR_appoint_roman_legion_decision:0 "Raise a Legion"
 LR_appoint_roman_legion_decision_desc:0 "A restored empire cannot rely on its frontier garrisons alone. A legion of the field army answers to the emperor: its legate holds no land of their own, and when they fall the eagle passes to whoever the emperor names."
 LR_appoint_roman_legion_decision_tooltip:0 "Raise one of the old legions again and appoint a legate to command it."
 LR_appoint_roman_legion_decision_confirm:0 "Raise the Legion"
 LR_appoint_roman_legion_decision_trigger_1:0 "A legion whose garrison county lies in your realm has not been raised"
 LR_appoint_roman_legion_decision_effect_tt:0 "The chosen legion is raised and given to the best available commander in your court or among your vassals and their courts, who becomes your landless vassal. A legion is a Command with two regiments of comitatenses, and passes by [appointment_succession_law|E]."
 LR_CHOOSE_LEGION_BUTTON:0 "Choose Legion"
