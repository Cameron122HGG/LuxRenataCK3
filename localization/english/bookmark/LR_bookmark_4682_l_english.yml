l_english:
 # LR 2026-11-22: the characters of bm_lr_4682 (Death of the Conqueror, 319 BC). tools/diadochi_4682/enable_bm_4682.py
 bookmark_lr_4682_1: "Alexandros IV"
 bookmark_lr_4682_1_desc: "The son of Megas Alexandros and Rhoxane is four years old and already Great King of the whole inhabited world. The army acclaimed him at Babylon, the satraps swore to him, and every one of them is now measuring the boy's throne for himself.\n\n#bold Survive the regency. Every Diadochos needs you alive and powerless; grow up before they decide otherwise.#!"
 bookmark_lr_4682_1_subheading: "The Boy King"
 bookmark_lr_4682_2: "Perdikkas"
 bookmark_lr_4682_2_desc: "Chiliarch of the empire, holder of Alexander's ring and regent for his son, Perdikkas commands the royal army and means to keep the empire whole, under himself. The other generals see a rival in the regent's chair, and some see a king.\n\n#bold Hold the regency. Bring the satraps to heel before they unite against you.#!"
 bookmark_lr_4682_2_subheading: "The Regent"
 bookmark_lr_4682_3: "Antigonos Monophthalmos"
 bookmark_lr_4682_3_desc: "The one-eyed veteran has governed Great Phrygia from Kelainai since Alexander first crossed into Asia. Older than the other Successors and more patient, he has a son, Demetrios, who is anything but.\n\n#bold Asia Minor is yours. With the regency failing, all of Asia could be.#!"
 bookmark_lr_4682_3_subheading: "The One-Eyed"
 bookmark_lr_4682_4: "Ptolemaios"
 bookmark_lr_4682_4_desc: "Ptolemaios took Egypt while Alexander still lived and rules it like a Pharaoh in all but name. Rich, defensible and far from Babylon, the Nile is the safest seat in the empire, and Ptolemaios has no wish to leave it.\n\n#bold Keep Egypt, take Cyprus and Syria, and let the others bleed for the throne.#!"
 bookmark_lr_4682_4_subheading: "Lord of the Nile"
 bookmark_lr_4682_5: "Seleukos"
 bookmark_lr_4682_5_desc: "Once commander of the Companion cavalry, Seleukos now holds Babylon and Mesopotamia, the heart of the old Persian empire. He has fewer men than his rivals, but the land between the rivers can feed a kingdom.\n\n#bold Win the East. From Babylon to the Indus, every satrapy can still be yours.#!"
 bookmark_lr_4682_5_subheading: "Satrap of Babylon"
 bookmark_lr_4682_6: "Eumenes"
 bookmark_lr_4682_6_desc: "Alexander's Greek secretary from Kardia was never meant to command Macedonians, yet he holds Cappadocia, Paphlagonia and Pontus and is loyal to the house of Argead when few others are. The Macedonian generals will never forget that he is a foreigner.\n\n#bold Defend the Argead throne against men who despise you, and outwit them all.#!"
 bookmark_lr_4682_6_subheading: "The Loyal Greek"
 bookmark_lr_4682_7: "Antipatros"
 bookmark_lr_4682_7_desc: "For years Antipatros held Macedon and Greece for Alexander while the king marched east. Now nearly eighty, he is the last of Philip's generals, and his sons, Kassandros above all, already plan for the day he dies.\n\n#bold Keep Europe loyal, and choose your successor before others choose for you.#!"
 bookmark_lr_4682_7_subheading: "Regent of Europe"
 bookmark_lr_4682_8: "Chandragupta"
 bookmark_lr_4682_8_desc: "Beyond the Indus the Maurya king watches the Macedonians quarrel. The satrapies Alexander left in the Punjab are thinly held, and Chandragupta already rules the greatest realm India has known.\n\n#bold Unite India, and take back what the Yavanas hold.#!"
 bookmark_lr_4682_8_subheading: "The Maurya"
