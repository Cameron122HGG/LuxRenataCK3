l_english:
 bm_6020_eastern_themes_test: "TEST: The Anarchy of the Themes"
 bm_6020_eastern_themes_test_desc: "Julian VI has been murdered by a Christian fanatic in Adrianopolis. His infant son Julian VII is proclaimed in Constantinople, but his government holds little outside the capital: the catapans, the strategoi of the themes and the client kings reject imperial authority, the Christian provinces are in revolt, and the Crusade preached by Benedict VIII begins in spite of Julian's death."
 bookmark_6020_ioulianos: "Ioulianos"
 bookmark_6020_ioulianos_desc: "TEST character: Julian VII, the infant emperor of the Julianoi."
