l_english: 
 bookmark_britain_anglia: "King Svend of Anglia"
 bookmark_britain_anglia_desc: "Less than a century ago, Sweyn Forkbeard carved a kingdom out from the ever-feuding territories of Britannia, and his son Knut the Great, by the grace of Sunna, expanded his father's realm so that it spanned from the Baltic Sea to the frigid shores of Iceland. King after king knelt in fealty to the Emperor of the North Sea, and his magnificent conquests held no rival in Norse history. Yet his realm was an ephemeral one, and shattered upon his death. The primacy of the Knutings fell away in the vicious civil war that followed, confined to the lands around Lundúnir amidst the Saxon heartland.\n\n#bold The Light of the North is not so easily extinguished, for their successor has inherited the majesty of his divine ancestor. From his forlorn station, Svend may yet bind the wounds of bleeding Britannia, and bring his disloyal subjects to heel before the warmth of the Northern Sun!#!"
 bookmark_britain_anglia_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"


 bookmark_britain_anglia_alt_tostig: "$Tostig$"
 bookmark_britain_anglia_alt_eadgifu: "$Eadgifu$ $nick_the_fair$"

 bookmark_britain_normandy: "William the Bastard"
 bookmark_britain_normandy_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_britain_normandy_desc: "The House of Normandy trace their lineage back to Norse vikings, and established themselves on the mainland of Europe over two hundred years ago. In this time of strife and uncertainty, William II seeks survival above all else for himself and his family - a survival that may only be guaranteed by dominating their opposition. To the south, the bitter feuds of the Frankish lords have bloodied the lands of Gaul beyond all reason or mercy, and to the north the divided peoples of Britannia languish in the dying wake of the Viking empire that once ruled them.\n\n#bold William's opportunities are many, should you deign to seek them. Shall you establish yourself above the petty Franks who foolishly thought they could subjugate you, or shall you sail forth and make a new realm in Britain? Fate compels you to choose, for the whims of power are not kind to the meek.#!"


 bookmark_britain_norway: "Harald Hardrade"
 bookmark_britain_norway_desc: "Having displayed formidable military talent since youth, Harald has recently tried, and failed, to conquer Denmark. Now, he looks beyond the sea by ancient contract, the crown of Anglia should have passed to Harald, when the last King died without an heir. But, instead, the Anglo-Saxons have put Harold Godwinson on the throne! Luckily, the false King has made enemies, and Tostig Godwinson, Harold's own brother, lives in exile in Norway...\n\n#bold By using his own enemies against him, can you give this Varangian viking control over the North Sea?#!"
 
 bookmark_britain_dumnonia: "Rhui Modredus of Dumnonia"
 bookmark_britain_dumnonia_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bookmark_britain_dumnonia_desc: "The last remnant of Roman power at the edge of the world, and the rightful master of Britannia, stands battered and alone. Dumnonia is assailed by Saxon barbarians to the east, the treacherous Artorii to the north, and Viking despoilers from the sea. Yet the Constantinids do not despair these circumstances, for theirs is the line of the Slayer of Emperors, the divine ichor of Christ and Sol Almighty, and their hand brought the greatest of the Western legions weeping for mercy in their march on the Eternal City. They received none, and neither shall the unwashed Germanic invaders or the Sarmatian turncoats, for the only instrument in this world that the Dumnonii may trust is in the blade.\n\n#bold The Sword of Victory thirsts for blood, and you shall not refuse it. Safeguard your strength and exploit the weakness of your foes at the earliest opportunity. Your journey to reclaim your birthright starts here, and it shall not end with this island. For Britannia is only a stepping stone, and your destiny is to seat your blood in Rome once more!#!"

 bookmark_britain_denmark_alt_harald: "$Harald$ $nick_the_whetstone$"
 bookmark_britain_denmark_alt_knud: "$Knud$"

 bookmark_britain_scotland: "King Malcolm of Scotland"
 bookmark_britain_scotland_desc: "Known to Scotland as the 'Great Chief', Malcolm III's situation is tenuous, but full of opportunity. To the south, the rich lands of Northumbria lie vulnerable as Anglia is torn apart by war, but Norse warlords and Gaelic highlanders yet contest the king's rule at home.\n\n#bold The British Isles teem with dangers and opportunities; can you pluck a rose from this garden of thorns?#!"

 bookmark_britain_scotland_alt_duncan: "$Duncan$"
 bookmark_britain_scotland_alt_donald: "$Donald$ $nick_the_fair$"

