l_english:
 # Test starts (not for release)
 bm_group_test_100: "TEST 100"
 bm_group_test_100_year: "100"
 bm_group_test_100_subtitle: "Test: Age of Nomads"
 bm_group_tooltip_test_100: "#T $bm_group_test_100_subtitle$ #!\n\n#help A test start before any title history. Every ruler is a nomad, and the base duchies, kingdoms and empires can only be formed through decisions and events.#!"
 bm_test_nomad_100: "Test: Age of Nomads"
 bm_test_nomad_100_desc: "A test start at 100.1.1 with no title history. Every ruler is a nomad, to test the base list titles while nomads conquer and settle."
 bm_group_test_bronze: "TEST BRONZE"
 bm_group_test_bronze_year: "2500"
 bm_group_test_bronze_subtitle: "Test: Bronze Age titles"
 bm_group_tooltip_test_bronze: "#T $bm_group_test_bronze_subtitle$ #!  #help A test start in 2500 BC. The base duchies sit under the Bronze Age kingdoms and empires, which can be created during the Bronze Age.#!"
 bm_test_bronze_2500: "Test: Bronze Age titles"
 bm_test_bronze_2500_desc: "A test start at 2500.1.1 (2500 BC) with no title history, to test the Bronze Age title set."
 bm_group_test_classical: "TEST CLASSICAL"
 bm_group_test_classical_year: "4500"
 bm_group_test_classical_subtitle: "Test: Classical Age titles"
 bm_group_tooltip_test_classical: "#T $bm_group_test_classical_subtitle$ #!  #help A test start in 500 BC. The base duchies sit under the Classical Age kingdoms and empires, which can be created during the Classical Age.#!"
 bm_test_classical_4500: "Test: Classical Age titles"
 bm_test_classical_4500_desc: "A test start at 4500.1.1 (500 BC), to test the Classical Age title set."
 # LR 2026-11-19 (user): TEST, not for release
 bm_group_test_universal: "TEST 1066"
 bm_group_test_universal_year: "1066"
 bm_group_test_universal_subtitle: "Test: the Universal Empires"
 bm_group_tooltip_test_universal: "#T $bm_group_test_universal_subtitle$ #!\n\n#help The 1066 world a day later, with the West's emperor as Dominus and the East's as Princeps, both at the hegemony tier. Needs Roads to Power, Silk & Silver and All Under Heaven.#!"
 bm_test_universal_6066: "Test: the Universal Empires"
 bm_test_universal_6066_desc: "A test start with both Universal governments at their height. Traianus Valentianus rules the Western Roman Empire as Dominus under the Roman Dominate, and Photios Julianos the Eastern Roman Empire as Princeps under the Roman Principate. Both are set up when the game starts (after the lobby), through the same effects as Establish the Dominate, Restore the Principate and the Western and Eastern hegemony decisions."
