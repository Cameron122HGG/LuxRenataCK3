 bm_LI_exiles_west: "Exiles of the West"
 bm_LI_exiles_west_desc: "Lombards, Etruscans, Bavarians, Franks and Brabanters: lords of Lux Invicta's West, driven from their lands. Each leads a band of followers and presses his claim on the realm that was his."
 bookmark_LI_exile_lombardia: "Agelmund"
 bookmark_LI_exile_lombardia_desc: "Duke of Lombardy in Lux Invicta, Agelmund lost his realm to other lords. Now he leads his band, Lombardy in Exile, and presses his claims to win it back."
