l_english:
 # LR 2026-11-25 Lux Invicta bookmarks (tools/li_bookmarks/build_li_bookmarks.py)
 bm_LI_eastern_splendour: "Eastern Splendours"
 bm_LI_eastern_splendour_desc: "Since Aristotle's scholarly explorations and Megas Alexandros' world empire, the legendary splendours of the East have shaped the Western princes' dreams of exoticism, mysticism and conquests. In spite of centuries of Hellenistic rule from the Mediterranean to the Seas of Kathay, the East still stands untamed. Beyond the Northern steppes, beyond the high passes of at Roof of the World and the burning deserts of Arabia, history itself takes another meaning, as civilizations strive to revive a Golden Age, older than the foundation of Rome itself. Their spirituality defies souls and minds, as metaphysical constructions intertwine refined sensuality with boundless violence as well as audacious intellectual speculations. The ruthless nomads of the Eastern Steppes, eternal enemies of the architect and the farmer, loom as a Damocles swords over old states that have long overpassed their natural lifespan. The eastern splendours remain the fantasy they have always been, but they may well become a living nightmare for corrupt kings of decadent empires."
 bookmark_LI_163005: "Antiochus Aniketos"
 bookmark_LI_163005_desc: "Proud Emperor of Serindia, decided to restore it's ancient glory at all costs."
 bookmark_LI_163005_subheading: "Serindia"
 bookmark_LI_927: "Kai Permyd"
 bookmark_LI_927_desc: "A powerful Komi warlord, rallying the tribes with intent to assault the civilized world."
 bookmark_LI_927_subheading: "Perm"
 bookmark_LI_73: "Uldin Attilid"
 bookmark_LI_73_desc: "The dreaded Khan of the Huns. A cruel and zealous man who fully believes to be Ahriman incarnated, prepared to scourge the servants of the Great Opponent."
 bookmark_LI_73_subheading: "Huns"
 bookmark_LI_163016: "Qing Zhao"
 bookmark_LI_163016_desc: "The merchant lord of Kashgar. A competent statesman and shrewd trader. Not the best adherent of the Confucian principles."
 bookmark_LI_163016_subheading: "Kashgar"
 bookmark_LI_1713087: "Al-Qa'im al-Abbasiyyah"
 bookmark_LI_1713087_desc: "The Caliph of Baghdad, a great Islamic scholar, but otherwise a weak leader. Under him, the Abbasid remnant is in constant turmoil."
 bookmark_LI_1713087_subheading: "Sunni Caliphate"
 bookmark_LI_816: "Akh-Yabrik V banu Almaqah"
 bookmark_LI_816_desc: "The Mukarrib of Saba, an isolationist, disliked by merchants due to high commerce taxes, and by his younger brother."
 bookmark_LI_816_subheading: "Saba"
 bm_LI_persias_glittering_fires: "Persia's Glittering Fires"
 bm_LI_persias_glittering_fires_desc: "Persia showed the way to all. We remember. Persia built the most solid, glorious and enduring empire. Persia worshipped Ahura Mazda's holy fire altars long before the Western Rumi barbarians understood the immanent truth of Divine Light. Our holy fires may now be shattered by fake creeds, our temples in rumble, our empire split between ambitious liers. But Truth will prevail against the realm of Lies. Once more, Persia shall lead men to glory and salvation!"
 bookmark_LI_901: "Shapur Sassanid"
 bookmark_LI_901_desc: "The Persian King of Kings. A resolute young man, who is succeeding in carrying his empire out of its dark age as the true blood of Sassan, heir to most glorious Persian dynasty."
 bookmark_LI_901_subheading: "Eranshahr"
 bookmark_LI_929: "Artaxshasa Arsacid"
 bookmark_LI_929_desc: "Long before the Sassanid usurpers took the throne, the Arsacids ruled over Persia. Enlightened by the revelations of Mazdak, moved by the desire to cleanse the world from injustice, the heirs of Artaxshasa shall rule again and usher in a new age where all men shall be brothers."
 bookmark_LI_929_subheading: "Khorasan"
 bookmark_LI_913: "Xshayarshan Artabanid"
 bookmark_LI_913_desc: "Since Sassan took over the Persian throne by lies and treachery from Ardavan VI, our forefather, the Parthians have been biding their time. The Artabanids may have lost worldly power and taken refuge in the Northern desolations, but they know who is the true Lord and side with Him. The bitterness of humiliation is sour, but sweet are the promises for revenge brought to us by Angra Mainyu, Lord of Darkness."
 bookmark_LI_913_subheading: "Khwarazmshahiyan"
 bookmark_LI_162026: "Menander Pethion"
 bookmark_LI_162026_desc: "India and Iran have always had close links, dating from the ancient time when Iranians came from the Indus valley to conquer the Persian plateau. More recently, trade, a force as powerful as swords and gods, has given this link a new vector, generating a fusion culture on the shores of the Indian Ocean. Will the ruler of Zorastrian-Hindu Patala succeed in reinvigorating Persia thanks to the syncretical learnings of the sister millennia-old civilization, India?"
 bookmark_LI_162026_subheading: "Patala"
 bookmark_LI_904: "Telephos Hephaestionos"
 bookmark_LI_904_desc: "Central Asia is home to the oldest forms of Iranian spirituality. It is where the Prophet Zoroaster lived and preached. But it is also in Central Asia, the crossroad of Eurasia, that Persian spirituality met other religious systems and gave birth to innovative syncretisms. The Ephaestionos dynasty of Kârmânia Satrapes have merged the old spiritual enemies of Zoroastrianism and the Hellenistic religion into a harmonious yet potent new system, Pyromantism. May this provincial medium power succeed in redefining Persia based on this new faith, born from the Central Asia spiritual melting-pot?"
 bookmark_LI_904_subheading: "Gedrosia"
 bookmark_LI_914: "Eudoxios Eucratides"
 bookmark_LI_914_desc: "Persia's spirituality is not exclusively about Zoroaster's teachings and its offspring. Persia is also the center of the far-reaching "Church of the East", resulting from the relocation of the School of Edessa to Nisibis. Under Sassanid patronage, Nestorianism has won the souls of Kathay emperors and steppe Kaghans. With the current chaotic situation, is it not the right time for Bukharan Nestorians to claim Persia itself as the new Rome?"
 bookmark_LI_914_subheading: "Bukhara"
 bm_LI_alexanders_legacy: "Alexander's Legacy"
 bm_LI_alexanders_legacy_desc: "§Y'To reach the ends of the world and the Great Outer Ocean, at the head of my army.'§! The dream of Megas Alexandros still echoes through the ages, in the halls and temples of the Hellenistic lands, in the words of would-be conquerors and in the blood of his descendants. Even if weakened, the realms founded by the Diadokhoi, Alexandros' Successors, generals and loyal companions, still stand proud from Makedonia to India. Though they all share a language and similar culture, over time the claims and counter-claims of legitimacy have deepened the rivalry between the Successors, all claim to be true Greeks, and each also claim to be the one true inheritors of the legacy of the legends of old: of Megas Alexandros, Ptolemy Soter and Seleukus Nikator. This legacy though, belongs to only the strongest..."
 bookmark_LI_20: "Apollophanes Antigonos"
 bookmark_LI_20_desc: "Governor of Krete, and descendant of Antigonus the One-eyed. A frustrated man with great ambitions, and no means to carry them out."
 bookmark_LI_20_subheading: "Krete"
 bookmark_LI_163027: "Megasthenes Epanderos"
 bookmark_LI_163027_desc: "The Hellenistic Basileus of India, a foolish man. Supposedly a living buddha, he's anything but that. Not the brightest bulb in the lot, but he absolutely thinks he is."
 bookmark_LI_163027_subheading: "India"
 bm_LI_eagles_of_rome: "Eagles of Rome"
 bm_LI_eagles_of_rome_desc: "Ah, the Eternal City! At its greatest extent, the Empire of the Romans stretched from Mesopotamia to the coasts of the Atlantic, encompassing many lands and its peoples, all beholden to the greater idea of Rome. However, its glory is now divided and scattered, East and West mere shadows of their former - united - glory, splintered by religious differences: by the holy Christ, the mighty Sol Invictus and Mithras the Lightbearer. Barbarian usurpers, claimants of all kinds, ancient enemies and would-be invaders on all sides threaten to finally extinguish its light. But Roman ambition should never be underestimated. The very same ambition that shaped the Eternal City's birth and rise to domination is now the only thing standing between it and oblivion. The Aquila Romana, the Eagle of Rome, stands proudly at the head of the armies of all the Romans as they set forth to conquer, just as they have done a thousand times before."
 bookmark_LI_714: "Tiberius Severus"
 bookmark_LI_714_desc: "Tiberius Severus is a man of duty before anything else. Duty to his realm, to his blood, and to Mithras, and nothing more. There's little personality beyond these facts, behind the grim and stonelike face of Tiberius. He is an accomplished warrior, uncharismatic, and completely disinterested in the frivolities of life. In order to maintain loyalty among his vassals, he relies on his best general, and only friend, Flavius Rodericus Vivaricus, an exile from the Gothic realms of Hispania, forever in debt to his liege for the shelter he provided from the deadly politics of the Visigothic courts. Tiberius will do almost anything to fulfill the duty of his bloodline, to restore Hispania for the Severans..."
 bookmark_LI_714_subheading: "Valentia"
 bm_LI_europa_barbarorum: "Europa Barbarorum"
 bm_LI_europa_barbarorum_desc: "All the might of the Christ and Sol Invictus together could not bring down the ancient worlds of the Celts, the Germans, the Norse, the Balts, the Slavs, and of many other peoples for which civilized languages have no name. In the endless plains and forests of North-Western Europe, Europa Barbarorum, the Barbaric Europe, is still very much alive, a place where the old gods still dwell. Beware, as the proud tribes who once defeated Karolus Magnus, determined to preserve their ancient customs at any cost, have adapted to use the tricks, tools and advancements of the civilized world. As the Macedonians of old had once been considered as barbaric by their southern Hellenic neighbors, the Megas Alexandros of the new era may well turn to be a leader from the Europa Barbarorum!"
 bookmark_LI_451: "Arturus Pendragon"
 bookmark_LI_451_desc: "High King of the Britons by the grace of Zalmoxis and His champion Christ, Artorus of the Pendragon line, trueborn descendant of Lucius Artorius Castus, savior of Britain. Though his title and blood carry little weigh nowadays, young Artorus is resolute to make the title of High King befitting of its name again. A strong believer in the honorable forms of combat and leadership, this attitude earns equal measures of recognition and derision from his subjects, who often snicker behind his back or look down on his childish ideals. Nevertheless, King Pendragon often leads his knights bravely, from the front, hoping to live up to the name of his great ancestor, and one day perhaps be worthy of his own Sword of Victory..."
 bookmark_LI_451_subheading: "Brythonia"
 bookmark_LI_703: "Theoderic Balthing"
 bookmark_LI_703_desc: "The Balthings, the "Bold Ones", are among the oldest and most prestigious of all Gothic tribes. The ancestral figure, Alaric, died in battle while leading the invasion of Severan Hispania in 413 CE, with support from the Western Emperor Honorius. His illegitimate son Theodoric completed the conquest and became the first Emperor of Hispania in 436, claiming equality in rank with the Roman Emperors and founding a state that would dominate Iberia for centuries. Heir of this prestigious legacy, Theodoric III is much less prone to war than his illustrious ancestors. At 25 years old, he is already recognized as one of the greatest scholars of Christendom. What this great mind will succeed to achieve in the fractured times of Lux Invicta remains unknown..."
 bookmark_LI_703_subheading: "Gothia"
 bookmark_LI_224: "Isebretch Immendinger"
 bookmark_LI_224_desc: "Guardian of the land of the great Irminsul, Isebrecht knows that only display of force can keep the ambitious worshippers of the Cross or heretical Wodazanic tribes at bay. His forefather, Widukind, barely defeated the most dangerous Christian tree-burner, Karlus Magnus, and became one with the Holy Tree. His enemies may confuse his composure for passivity, but Isebrecht is ready to take up new fights to preserve his land, his people and the old cult. In fact, his neighbors may soon remember that the cold and dark Germanic forests are indeed fertile in exceptionally talented war leaders."
 bookmark_LI_224_subheading: "the Saxons"
 bookmark_LI_301: "Huneric"
 bookmark_LI_301_desc: "Second son of Gelimer III, youngest of age, Huneric started showing symptoms of the leper. Since the line was already safe with his elder brother, young Huneric spend his childhood sheltered in his quarters, with the tales of his mighty ancestor, King Gelimer, and other poetry epics as his only company. At age 11 he started studying military tactics under his uncle Sigeric and alongside his cousin Gelimer. When his father died of old age, Huneric plotted in order to seize Carthage from his unassuming elder brother Gaiseric. He ordered the assassination of Gaieric, and eventually executed his younger sister for her refusal to marry a political ally. Now, the Leper King is determined to fulfil the ambition of his ancestor, an Empire of all the Vandals, while his vengeful uncle, bitter over Huneric's betrayal of his family, has raised his son Gelimer in hopes to overthrow the Leper King before he leads Carthage to it's doom and to have him become the king that Huneric should have been."
 bookmark_LI_301_subheading: ""
 bookmark_LI_601: "Decaeneus"
 bookmark_LI_601_desc: ""
 bookmark_LI_601_subheading: ""
