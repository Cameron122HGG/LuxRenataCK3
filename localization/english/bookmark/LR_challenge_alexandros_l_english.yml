 # LR 2026-11-25: Alexandros's adventurer challenge (common/bookmarks/challenge_characters/00_challenge_characters.txt)
 challenge_alexandros_legion: "Alexandros Julio-Argead"
 challenge_alexandros_legion_subheading: "The Legion of Alexandros"
 challenge_alexandros_legion_desc: "Heir of Augustus Caesar, Megas Alexandros and Neos Helios, Alexandros of Thrace believes the Imperial Throne is his by right of holy blood. Yet he holds no land at all. His Legion is a band of sworn swords and true believers in the Sun Made Flesh, camped wherever a lord will pay or a road will lead, while the false emperor Photios sits in Constantinople.\n\n#bold Lead the Legion without a single county to your name. Gather gold, men and followers, win back the lands of your blood in Macedonia and Philippopolis, then the City itself.#!"
