 # Lux Renata Guide (common/decisions/Lux Renata/99_LR_guide_decisions.txt, events/LR_guide_events.txt)
 LR_guide_decision:0 "Lux Renata Guide"
 LR_guide_decision_desc:0 "A short guide to the mechanics that make Lux Renata different from the base game: its governments, the restoration of Rome, the landless Commands, the regional empires, Sacral Gaul, and the pantheons."
 LR_guide_decision_tooltip:0 "Read about how Lux Renata works. This changes nothing in your game."
 LR_guide_decision_confirm:0 "Open the Guide"
 LR_guide_decision_effect_tt:0 "Opens the Lux Renata Guide. It has no effect on your game, and can be opened as often as you like."

 LR_guide.back:0 "Back to the topics"
 LR_guide.close:0 "Close the guide"

 LR_guide.0001.t:0 "The Lux Renata Guide"
 LR_guide.0001.desc:0 "The lights of Alexander and Rome were never put out. In this world the empire endured in pieces, and its heirs, rivals and imitators all claim its inheritance.\n\nChoose a topic to read about. Nothing here changes your game."
 LR_guide.0001.governments:0 "Governments and cultures"
 LR_guide.0001.rome:0 "Restoring Rome"
 LR_guide.0001.commands:0 "Commands, prefects and ministers"
 LR_guide.0001.regional:0 "The regional Roman empires"
 LR_guide.0001.gaul:0 "Sacral Gaul"
 LR_guide.0001.faith:0 "Pantheons and patron gods"

 LR_guide.0010.t:0 "Governments and Cultures"
 LR_guide.0010.desc:0 "Every settled ruler belongs to a #high government group#!: Classical, Western, Despotic (Persianate), Indic, Islamic, Sinic, Japanese, Sacral or Barbarian. Each group is a ladder:\n\n#high Plain#! government (without the DLC) > #high Dynastic#! government (with Roads to Power and All Under Heaven) > #high Administrative#! government > the group's #high top tier#!, such as Roman Imperial.\n\nWhich group your rulers use is decided by your [culture|E]'s #high government tradition#!, such as Classical Statecraft or Feudal Custom. If your culture adopts a different government tradition, or you change culture, your rulers move to the same rung of the new group's ladder. Tribal rulers who settle also join their culture's group.\n\nMoving between the dynastic and administrative rungs is done by decision, as in Japan: taking a title from a ruler with a different government does not change yours."

 LR_guide.0011.t:0 "Restoring Rome"
 LR_guide.0011.desc:0 "Rome survives in #high decayed#! empires, such as the Senate of Rome and the rump of Byzantium. They can become the #high restored#! Western and Eastern Roman Empires, and in the end a #high hegemony#!.\n\n#high 1. Restore the administration.#! Taking the administration decision makes you the restored emperor under the Roman Imperial government. It does not redraw the map.\n\n#high 2. Restore the dioceses.#! Each prefecture decision restores one diocese at a time, once you control its lands. The diocese becomes yours, and its counties are sorted into the old #high late-Roman provinces#! (Campania, Tuscia et Umbria, Aquitania Prima and so on) instead of the medieval duchies. Only rulers of a restored Roman realm can create those provinces.\n\n#high 3. Restore the hegemony.#! Once enough provinces are restored and the empire's core and dioceses are yours or your vassals', you can raise the Western or Eastern hegemony."

 LR_guide.0012.t:0 "Commands, Prefects and Ministers"
 LR_guide.0012.desc:0 "A restored emperor governs through #high landless offices#!. Each is held by a noble family loyal to the emperor and passes by #high appointment#!, not inheritance: when the holder dies, the emperor names the next one.\n\n#high Commands#! hold their own troops, paid largely by the state:\n- #high Duces#! command the frontier of a diocese with limitanei.\n- #high Comites#! hold the great regional commands, with limitanei on the frontier or comitatenses in the field.\n- #high Legions#! are raised again by name, with comitatenses.\nAppoint them with the Appoint a Dux, Appoint a Comes and Raise a Legion decisions, once the diocese (or the legion's garrison) lies in your realm.\n\n#high Praetorian Prefects#! oversee a prefecture of dioceses, and the #high ministries#! of East and West back the Roman council seats. These belong to the Roman Imperial government only."

 LR_guide.0013.t:0 "The Regional Roman Empires"
 LR_guide.0013.desc:0 "Not every claimant to Rome rules from Rome. Three decayed realms can proclaim #high regional empires#! of their own:\n\n- #high Syagria#! becomes the #high Gallic Empire#!, which restores Gaul and Hispania.\n- #high Tadmor#! becomes the #high Palmyrene Empire#!, which restores Syria, Palestine and Aegyptus.\n- The #high Constantinid#! realm becomes the #high Brittanic Empire#!, which restores Britannia first, then crosses to the continent like Constantine III.\n\nProclaiming one makes you a Roman Autocratic emperor, with prestige, legitimacy and the support of your Roman vassals. A regional empire restores its own home dioceses through the prefecture decisions, without waiting for Rome, and can appoint duces, comites and legions there. Its restorations do not count toward Rome's hegemony, but if it later bows to Rome, its dioceses do."

 LR_guide.0014.t:0 "Sacral Kingdom of Gaul"
 LR_guide.0014.desc:0 "In Gaul the old kings are #high sacred#!: a ceremonial sacral monarch reigns, while great houses and mayors of the palace hold the real power.\n\nThe sacral governments belong to the realm of the #high Sacral Kingdom of Gaul#!, not to any culture. Its rulers use #high Manorial#! (feudal, with estates) and #high Palatine#! (administrative) governments, and #high Sacral Kingship#! without the All Under Heaven DLC. Vassals can adopt their liege's Gaulish government by decision, and a ruler who leaves the realm returns to the government of their own culture.\n\nRestoring the sacral monarchy brings back the Palatine government at the head of the realm."

 LR_guide.0015.t:0 "Pantheons and Patron Gods"
 LR_guide.0015.desc:0 "Many faiths of the Graeco-Roman world, and some beyond it, follow a #high primary pantheon#!: Roman, Hellenic, Solar, Celtic, Dharmic, Zoroastrian and others. You can see it under the #high Pantheon#! doctrines of the faith window.\n\nA faith with a pantheon lets its followers choose a #high patron god#!. Open your faith and go to the #high Patron Gods#! tab to see each god and the blessing they give, then choose one for a cost in piety. You can only choose from the patrons of your own faith, and changing patrons later costs more."
