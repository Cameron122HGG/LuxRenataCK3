l_english:
 # Empire Faith Gate (game rule, title window panel, contested empires)
 rule_empire_faith_gate: "Empire Faith Gate"
 setting_empire_faith_gate_on: "On"
 setting_empire_faith_gate_on_desc: "Feudal, clan and tribal rulers need a reformed [faith|E] to create an [empire|E], the approval of their [head_of_faith|E] and of their [powerful_vassals|E]. Same-faith empires contest each other's [legitimacy|E]."
 setting_empire_faith_gate_no_hof_exempt: "On, Headless Faiths Exempt"
 setting_empire_faith_gate_no_hof_exempt_desc: "As #V On#!, but rulers whose faith has no living [head_of_faith|E] need no approval to create an [empire|E]."
 setting_empire_faith_gate_off: "Off"
 setting_empire_faith_gate_off_desc: "Empires are created as in the base game."

 empire_faith_gate_panel_organized_faith: "Reformed faith"
 empire_faith_gate_panel_hof_approval: "[head_of_faith|E] approves"
 empire_faith_gate_panel_vassals_approve: "[powerful_vassals|E] approve"

 empire_faith_gate_organized_faith_required: "Your [faith|E] must be reformed to found an [empire|E]"
 empire_faith_gate_hof_spiritual_good_terms: "Your [head_of_faith|E] has a positive [opinion|E] of you"
 empire_faith_gate_hof_temporal_is_hof: "You are the [head_of_faith|E]"
 empire_faith_gate_hof_temporal_good_terms: "Your [head_of_faith|E] has a positive [opinion|E] of you"
 empire_faith_gate_powerful_vassals_approve: "At least half of your [powerful_vassals|E] have a positive [opinion|E] of you"

 empire_faith_gate_reformation_piety_level: "You are at least [piety_level|E] 2"
 empire_faith_gate_reformation_tribal_authority: "Your realm has the third level of [tribal_authority|E]"
 empire_faith_gate_reformation_holy_site: "Your faith controls at least 3 [holy_sites|E]"

 empire_faith_gate_contested_legitimacy_applied: "Contested Empire"
 empire_faith_gate_contested_legitimacy_applied_desc: "[efg_other_emperor.GetTitledFirstName|U] also claims an [empire|E] of the [efg_other_emperor.GetFaith.GetAdjective] faith. In 3 years, unless one of you falls, both your claims to [legitimacy|E] will suffer."

 EXCOMMUNICATION_CONTESTED_EMPIRE: "[secondary_recipient.GetShortUIName|U] divides the faith with a rival [empire|E]: $VALUE|=+0$"
 efg_contested_empire_rivalry: "Rival claimants to an [empire|E] of the same faith"

 multi_empire_same_faith_penalty_1: "Contested Empire"
 multi_empire_same_faith_penalty_1_desc: "Another ruler of this faith also claims an empire."
 multi_empire_same_faith_penalty_2: "Divided Empire"
 multi_empire_same_faith_penalty_2_desc: "Two other rulers of this faith also claim empires."
 multi_empire_same_faith_penalty_3: "Shattered Empire"
 multi_empire_same_faith_penalty_3_desc: "Three or more other rulers of this faith also claim empires."
 efg_contested_wrath: "Champions of the True Empire"
 efg_contested_wrath_desc: "This ruler's knights carry word of their lord's claim to every corner of the realm."
 efg_divine_mandate: "Mandate of Faith"
 efg_divine_mandate_desc: "This ruler proclaims that the faith alone makes an emperor, and the faithful listen."
 efg_contested_patience: "Patient Sovereign"
 efg_contested_patience_desc: "This ruler leaves the rival claims to time and tends to the realm instead."

 empire_faith_gate.0002.t: "A Divided Imperium"
 empire_faith_gate.0002.desc: "[efg_primary_rival.GetTitledFirstName|U] still claims an [empire|E] of the [ROOT.Char.GetFaith.GetAdjective] faith. The faithful cannot serve two emperors, and as long as the claims stand, my [legitimacy|E] will bleed away.\n\nHow am I to answer this rival?"
 empire_faith_gate.0002.a: "My knights will carry my claim across the realm."
 empire_faith_gate.0002.b: "The faith alone makes an emperor, and the faith is with me."
 empire_faith_gate.0002.c: "Let time settle what swords cannot."

 # Liege Title Approval (game rule, title window panel)
 rule_lta_liege_title_approval: "Liege Title Approval"
 setting_lta_liege_title_approval_enabled: "Enabled"
 setting_lta_liege_title_approval_enabled_desc: "Vassals of a [liege|E] with High or Absolute [crown_authority|E] need their liege's approval, a positive [opinion|E], to create titles."
 setting_lta_liege_title_approval_disabled: "Disabled"
 setting_lta_liege_title_approval_disabled_desc: "Vassals create titles as in the base game."

 lta_panel_liege_approval: "[liege|E] approves"
 lta_liege_approval_required_tt: "Your [liege|E] has a positive [opinion|E] of you"
 lta_independent_title_creation_tt: "As an [independent_ruler|E], you need no [liege|E]'s approval to create titles"
