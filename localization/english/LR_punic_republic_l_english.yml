l_english:
 # LR 2026-11-25 group republics (tools/group_republics/build_group_republics.py)
 punic_republic_government: "Suffetate"
 punic_republic_government_adjective: "$punic_republic_government$"
 punic_republic_government_realm: "Suffetate"
 punic_republic_government_desc: "$LR_punic_republic_desc_body$\n\n$republic_government_desc$"
 punic_republic_government_vassals_label: "$republic_government_vassals_label$"
 LR_punic_republic_desc_body: "#F Two suffetes, elected each year from the great houses, lead the city; the council of the Adirim, the Mighty, prepares the laws and the people's assembly votes on what the suffetes and the council cannot agree, as in Carthage and Tyre of old.#!"
 LR_gov_icon_punic_republic_government: "@lr_gov_punic_republic_government!"
 LR_punic_suffetes: "Suffetes"
 LR_punic_suffetes_desc: "Whether the city is led by one suffete or by two. Two suffetes share the state as a [diarchy|E]: the second comes from another great house, the richest of them, and holds power of his own."
 LR_suffetes_one: "One Suffete"
 LR_suffetes_one_desc: "One suffete leads the city alone, with no colleague to share or check his power."
 LR_suffetes_two: "Two Suffetes"
 LR_suffetes_two_desc: "As in Carthage and Tyre, two suffetes lead together. The second, the richest man of another great house, is chosen each term and shares the state as a [diarch|E]."
 suffete_diarchy_diarchy_type: "Suffeteship"
 suffete_diarchy_diarch_title: "Co-Suffete"
 LR_from_co_suffete_tax: "Co-Suffete's Stewardship"
 LR_to_co_suffete_prestige: "Co-Suffete of the City"
 republic_type_punic_adirim: "Adirim"
 republic_type_punic_adirim_effects: "\n#weak The Mighty, the council of the richest merchant houses, governs as in Carthage: trade and coin first.#!"
 republic_type_punic_barcid: "Barcid Command"
 republic_type_punic_barcid_effects: "\n#weak A great military house holds the generalship from father to son, as the Barcids did in Iberia: hired armies, drilled and paid.#!"
 republic_type_punic_kohanim: "Kohanim"
 republic_type_punic_kohanim_effects: "\n#weak The temple priesthoods of Melqart and Tanit sit among the great families and lend the state their sanctity.#!"
 republic_type_punic_colonial: "Colonial League"
 republic_type_punic_colonial_effects: "\n#weak A mother city and her colonies across the sea, bound by tribute, trade and kinship, as Carthage bound the western Phoenicians.#!"
