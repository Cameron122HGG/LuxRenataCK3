l_english:
 # LR 2026-11-24: naming Alexander's hegemony (events/LR_hellenistic_name_events.txt) and its debug grant
 LR_hellenistic_name.0001.t: "The Name of the Hegemony"
 LR_hellenistic_name.0001.desc: "The heirs of Alexander have called his realm by many names: the Kingdom of Alexander, the rule of the Macedonians, the whole inhabited world. Now the diadem is ours, and the chancery asks by what name the Hegemony shall be written in our decrees, on our coins and over the gates of our cities."
 LR_hellenistic_name.0001.a: "Let it be proclaimed so."
 LR_hellenistic_name.0001.b: "It keeps the name it bears."
 LR_hellenistic_name_entered_text: "[ROOT.Char.GetLocalizedText('new_realm_title_name')]" # the text typed in the widget, as vanilla's new_realm_title_name_entered_text (tgp loc)
 LR_hellenistic_name_alexandrou: "Basileia Alexandrou"
 LR_hellenistic_name_makedonon: "Archē tōn Makedonōn"
 LR_hellenistic_name_hellenon: "Archē tōn Hellēnōn"
 LR_hellenistic_name_oikoumene: "Oikoumenē"
 LR_hellenistic_name_kosmokratoria: "Kosmokratoria"
 LR_debug_grant_hellenistic_empire_decision: "Debug: Grant the Hellenistic Empire"
 LR_debug_grant_hellenistic_empire_decision_desc: "Take [GetTitleByKey('h_hellenistic_empire').GetName] now, from its holder if it has one, as Restore Alexander's Hegemony would give it: the empires of Alexander's lands go under it and restored satrapies into its strategiai (+5000 prestige). The naming event follows."
 LR_debug_grant_hellenistic_empire_decision_confirm: "Do it"
