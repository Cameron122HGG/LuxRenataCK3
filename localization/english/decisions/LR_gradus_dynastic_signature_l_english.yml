l_english:
 # LR 2026-11-25 GRADUS dynastic signature (tools/imperial_rise/build_dynastic_signatures.py)
 LR_dynastic_roman_house_modifier: "Clientela"
 LR_dynastic_roman_house_modifier_desc: "Every great house of Rome stands at the head of its clients, who owe it their votes and their swords."
 LR_salutatio_opinion: "Received at the Salutatio"
 LR_hold_salutatio_decision: "Hold a Salutatio"
 LR_hold_salutatio_decision_desc: "At dawn the clients of my house gather at my door. Let them be received, and let every lord of the realm see who stands at the head of Rome."
 LR_hold_salutatio_decision_tooltip: "Gain [prestige|E], and your vassals think better of you."
 LR_hold_salutatio_decision_confirm: "Open the doors"
 LR_dynastic_alexandrian_house_modifier: "The Companions"
 LR_dynastic_alexandrian_house_modifier_desc: "The king's Companions ride at his side and dine at his table."
 LR_feasted_companions_modifier: "Feasted Companions"
 LR_feasted_companions_modifier_desc: "The Companions have drunk with their king and will die for him."
 LR_feast_the_companions_decision: "Feast the Companions"
 LR_feast_the_companions_decision_desc: "Let the Companions be called to the symposium, as Philip and Alexander called them, and let the wine and the boasts bind them to me."
 LR_feast_the_companions_decision_tooltip: "Gain [prestige|E], and your knights fight harder for a time."
 LR_feast_the_companions_decision_confirm: "Call the symposium"
 LR_dynastic_western_house_modifier: "Fealty"
 LR_dynastic_western_house_modifier_desc: "Every lord of the realm has knelt and sworn; the oath binds both ways."
 LR_homage_modifier: "Homage Renewed"
 LR_homage_modifier_desc: "The vassals have renewed their oaths and send their levies more readily."
 LR_homage_opinion: "Renewed Homage"
 LR_call_vassals_to_homage_decision: "Call the Vassals to Homage"
 LR_call_vassals_to_homage_decision_desc: "Let every lord of the realm come before me, put his hands between mine and renew his oath."
 LR_call_vassals_to_homage_decision_tooltip: "Your vassals think better of you and send more levies for a time."
 LR_call_vassals_to_homage_decision_confirm: "Receive their oaths"
 LR_dynastic_persianate_house_modifier: "The Great Houses"
 LR_dynastic_persianate_house_modifier_desc: "The great houses of Iran hold their lands by ancient right, and the king who honours it is honoured in turn."
 LR_privileges_confirmed_opinion: "Privileges Confirmed"
 LR_confirm_house_privileges_decision: "Confirm the Houses' Privileges"
 LR_confirm_house_privileges_decision_desc: "Let the great houses hear from my own mouth that their lands, their titles and their seats at court are theirs by right."
 LR_confirm_house_privileges_decision_tooltip: "Your [powerful_vassals|E] think much better of you."
 LR_confirm_house_privileges_decision_confirm: "Confirm their privileges"
 LR_dynastic_mamlakah_house_modifier: "House of the Father"
 LR_dynastic_mamlakah_house_modifier_desc: "The house is ruled by its father and its elders, and its name outlives every one of them."
 LR_gather_the_elders_decision: "Gather the Elders"
 LR_gather_the_elders_decision_desc: "Let the elders of my house be gathered to hear its history and settle its quarrels, so that the house of my father stands as one."
 LR_gather_the_elders_decision_tooltip: "Your dynasty gains renown, and you gain [prestige|E]."
 LR_gather_the_elders_decision_confirm: "Gather the house"
 LR_dynastic_nilotic_house_modifier: "The Moving Court"
 LR_dynastic_nilotic_house_modifier_desc: "The king's court moves from province to province, and every lord sees his king."
 LR_moving_court_opinion: "Visited by the Court"
 LR_hold_court_on_the_move_decision: "Hold Court on the Move"
 LR_hold_court_on_the_move_decision_desc: "Let the royal camp be struck and the court travel through the provinces, so that every lord may feast the king and see his face."
 LR_hold_court_on_the_move_decision_tooltip: "Gain [prestige|E], and your vassals think better of you."
 LR_hold_court_on_the_move_decision_confirm: "Strike the camp"
 LR_dynastic_sudanic_house_modifier: "Free Lineages"
 LR_dynastic_sudanic_house_modifier_desc: "The free noble lineages keep their names alive in the songs of their griots."
 LR_summon_the_griots_decision: "Summon the Griots"
 LR_summon_the_griots_decision_desc: "Let the griots of my house sing the deeds of my ancestors before the court, so that no one forgets whose blood rules here."
 LR_summon_the_griots_decision_tooltip: "Gain [prestige|E], and your dynasty gains renown."
 LR_summon_the_griots_decision_confirm: "Let them sing"
 LR_dynastic_iqta_house_modifier: "Hereditary Grants"
 LR_dynastic_iqta_house_modifier_desc: "The amirs hold their grants from father to son, and their soldiers with them."
 LR_iqta_grant_modifier: "Iqta Grants"
 LR_iqta_grant_modifier_desc: "New grants of revenue have raised more soldiers for the realm."
 LR_iqta_granted_opinion: "Granted Iqta Revenue"
 LR_grant_an_iqta_decision: "Grant an Iqta"
 LR_grant_an_iqta_decision_desc: "Let revenues be granted to my amirs in return for soldiers, so that the realm's army grows and its lords are bound to me."
 LR_grant_an_iqta_decision_tooltip: "Your vassals think better of you, and your levies are larger for a time."
 LR_grant_an_iqta_decision_confirm: "Grant the revenues"
 LR_dynastic_gupta_house_modifier: "Feudatories"
 LR_dynastic_gupta_house_modifier_desc: "The samantas bow to their overlord and keep his peace in their lands."
 LR_samanta_homage_opinion: "Paid Homage"
 LR_receive_samantas_homage_decision: "Receive the Samantas' Homage"
 LR_receive_samantas_homage_decision_desc: "Let the samantas come to my court, bow before my throne and bring their tribute, as feudatories owe to their overlord."
 LR_receive_samantas_homage_decision_tooltip: "Gain [piety|E], and your vassals think better of you."
 LR_receive_samantas_homage_decision_confirm: "Receive the samantas"
 LR_dynastic_sinic_house_modifier: "Enfeoffed Kin"
 LR_dynastic_sinic_house_modifier_desc: "The ruler's kinsmen hold fiefs throughout the realm, and their states guard the throne."
 LR_enfeoffed_kin_opinion: "Enfeoffed Kinsman"
 LR_enfeoff_a_kinsman_decision: "Enfeoff a Kinsman"
 LR_enfeoff_a_kinsman_decision_desc: "Let my kinsmen be enfeoffed with new lands and titles, as the Zhou kings enfeoffed theirs, so that the states of my house surround the throne."
 LR_enfeoff_a_kinsman_decision_tooltip: "Vassals of your house think much better of you, and you gain [prestige|E]."
 LR_enfeoff_a_kinsman_decision_confirm: "Enfeoff them"
