l_english:
 # Western Celtic Empire (ported from Lux Invicta's e_celtic)
 h_western_celtic_empire: "Celtic Empire"
 h_western_celtic_empire_adj: "Celtic"
 h_western_celtic_empire_article: "the "

 form_western_celtic_empire_decision: "Forge the Celtic Empire"
 form_western_celtic_empire_decision_desc: "From Hibernia to Armorica the Gaels and the Britons have long answered to Roman governors, Saxon kings and Norse raiders. United under one crown, the Celtic peoples of the western isles can stand as an empire in their own right."
 form_western_celtic_empire_decision_tooltip: "Unite the Gaels and the Britons under one crown."
 form_western_celtic_empire_decision_confirm: "One people of the western isles!"
 LR_form_western_celtic_empire_dejure_tt: "Ireland becomes de jure part of [GetTitleByKey('e_ireland').GetName]; Verturia, Scottia and Mann and the Isles of [GetTitleByKey('e_scotland').GetName]; Cambrogia, Dumnonia, Rheged and Armorica of [GetTitleByKey('e_britons').GetName]. All three become de jure part of the [GetTitleByKey('h_western_celtic_empire').GetName]."
