l_english:
 # Reixath Galáthon, the eastern Celtic empire (name from a fan's custom Galatian empire campaign)
 e_reixath_galathon: "Reixath Galáthon"
 e_reixath_galathon_adj: "Galatian"

 form_reixath_galathon_decision: "Raise Reixath Galáthon"
 form_reixath_galathon_decision_desc: "The Tectosages, Tolistobogii and Trocmi crossed into Asia long ago and made the heart of Anatolia their own. Kings and emperors have ruled over them ever since. Now the three tribes can be united again, from Ancyra to the shores of the Euxine, in a realm of the Galatians."
 form_reixath_galathon_decision_tooltip: "Unite the Galatians of Anatolia and the Pontic shore."
 form_reixath_galathon_decision_confirm: "For the three tribes!"
 LR_form_reixath_galathon_dejure_tt: "[GetTitleByKey('k_galatia').GetName] and [GetTitleByKey('k_pontus').GetName] are laid out over their old lands and become de jure parts of [GetTitleByKey('e_reixath_galathon').GetName]. Roman themes left without land are dissolved."
