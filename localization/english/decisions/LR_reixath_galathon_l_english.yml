l_english:
 # Reixath Galáthon, the eastern Celtic empire (name from a fan's custom Galatian empire campaign)
 # h_reixath_galathon (now the Galatian set's hegemony) is named in titles/LR_galatian_title_set_l_english.yml

 form_reixath_galathon_decision: "Raise Reixath Galáthon"
 form_reixath_galathon_decision_desc: "The Tektosages, Tolistobogioi and Trokmoi crossed into Asia long ago and made the heart of Anatolia their own. Kings and emperors have ruled over them ever since. Now the three tribes can be united again, from Ankura to the Danube, in a realm of the Galatians."
 form_reixath_galathon_decision_tooltip: "Unite the Galatians of Anatolia and the Danube."
 form_reixath_galathon_decision_confirm: "For the three tribes!"
 LR_form_reixath_galathon_dejure_tt: "Every Galatian kingdom whose lands you completely control is restored and divided into its old lands. [GetTitleByKey('e_galat_trigalatia').GetName] and [GetTitleByKey('e_galat_danuuia').GetName] become de jure parts of [GetTitleByKey('h_reixath_galathon').GetName], each with the kingdoms restored under it. Titles of other sets left without land are dissolved."
