l_english:
 # LR 2026-11-25 GRADUS signature (tools/imperial_rise/build_signatures.py)
 LR_mamlakah_household_army_modifier: "Household Army"
 LR_mamlakah_household_army_modifier_desc: "The realm's strength is the ruler's own household: soldiers bought, trained and paid by the throne, not the levies of the lords."
 LR_nilotic_sacred_kingship_modifier: "Sacred Kingship"
 LR_nilotic_sacred_kingship_modifier_desc: "The ruler stands between Heaven and the river; every rite performed in the king's name binds the realm to the throne."
 LR_sudanic_gold_road_modifier: "The Gold Road"
 LR_sudanic_gold_road_modifier_desc: "Gold from the mines and markets of the realm flows to the court along roads the throne protects."
 LR_basileia_spear_won_land_modifier: "Spear-Won Land"
 LR_basileia_spear_won_land_modifier_desc: "The king holds his realm by the spear: what his army has won is his, and his veterans are settled on it."
 LR_persianate_royal_road_modifier: "The Royal Road"
 LR_persianate_royal_road_modifier_desc: "Couriers ride the king's road from post to post, and the trade of the realm follows them."
 LR_western_royal_justice_modifier: "Royal Justice"
 LR_western_royal_justice_modifier_desc: "The crown's envoys hear complaints in every county, and the lords know that the king's justice reaches them."
 LR_iqta_revocable_grants_modifier: "Revocable Grants"
 LR_iqta_revocable_grants_modifier_desc: "Every iqta is the sultan's to give and to take back; its holder serves, or loses it to one who will."
 LR_gupta_royal_patron_modifier: "Royal Patron"
 LR_gupta_royal_patron_modifier_desc: "The king endows the learned and the holy with land, and the faithful praise his name in their grants."
 LR_japan_court_ranks_modifier: "Court Ranks"
 LR_japan_court_ranks_modifier_desc: "Every house measures itself by the rank the court has granted it, and the court alone can grant more."
 LR_japan_shugo_jito_modifier: "Shugo and Jitō"
 LR_japan_shugo_jito_modifier_desc: "The shōgun's governors hold the provinces and his stewards the estates, and every warrior house answers the camp's call."
 LR_japan_restored_throne_modifier: "The Restored Throne"
 LR_japan_restored_throne_modifier_desc: "The tennō rules in person again, and the realm looks to the throne itself rather than to its regents."
 LR_persianate_iran_aniran_modifier: "Iran and Aniran"
 LR_persianate_iran_aniran_modifier_desc: "The king of kings rules Iran and non-Iran alike: the great houses kneel at his court, and the peoples beyond the realm look to his throne."
 LR_gupta_wheel_turning_king_modifier: "The Wheel-Turning King"
 LR_gupta_wheel_turning_king_modifier_desc: "The wheel of the king's rule turns in every direction, and the kings of the quarters own him as their lord."
 LR_western_heir_of_rome_modifier: "Heir of Rome"
 LR_western_heir_of_rome_modifier_desc: "The empire of the Romans has passed to this throne, and every king of the West owes it honour."
 LR_sacral_imperial_church_modifier: "Imperial Church"
 LR_sacral_imperial_church_modifier_desc: "The emperor rules through his bishops and abbots, and the Church is the sinew of his realm."
 LR_iqta_commander_of_faithful_modifier: "Commander of the Faithful"
 LR_iqta_commander_of_faithful_modifier_desc: "The believers look to the imam as their leader, and sultans and emirs hold their power under him."
 LR_mamlakah_everlasting_kingdom_modifier: "The Everlasting Kingdom"
 LR_mamlakah_everlasting_kingdom_modifier_desc: "The kingdom that shall not pass away: its household army and its scribes outlast every rival."
 LR_nilotic_solomonic_line_modifier: "Solomonic Line"
 LR_nilotic_solomonic_line_modifier_desc: "The kings of this line are the heirs of Solomon, and the Ark rests in their keeping."
 LR_sudanic_great_union_modifier: "The Great Union"
 LR_sudanic_great_union_modifier_desc: "Many kings have sworn the union, and the gold of every road comes to the mansa's court."
 LR_sacral_holy_anointing_modifier: "Holy Anointing"
 LR_sacral_holy_anointing_modifier_desc: "Holy oil has made the ruler sacred: the Church proclaims the throne, and every crown-wearing renews the bond."
 LR_household_recruits_modifier: "Household Recruits"
 LR_household_recruits_modifier_desc: "New soldiers bought for the royal household are cheaper to raise into regiments."
 LR_royal_rites_modifier: "Royal Rites"
 LR_royal_rites_modifier_desc: "The king has performed the rites of the river, and the land answers with plenty."
 LR_gold_embassy_opinion: "Gold Embassy"
 LR_buy_household_recruits_decision: "Buy Household Recruits"
 LR_buy_household_recruits_decision_desc: "My house buys, trains and pays its own soldiers. Let a new company of the household be raised, under a commander who owes everything to me."
 LR_buy_household_recruits_decision_tooltip: "A loyal household commander joins your court, and your regiments are cheaper to raise for a time."
 LR_perform_royal_rites_decision: "Perform the Royal Rites"
 LR_perform_royal_rites_decision_desc: "The people look to their king to keep the river and Heaven at peace. Let the rites be performed in my name, before the court and the priests."
 LR_perform_royal_rites_decision_tooltip: "Gain [legitimacy|E] and faster prosperity growth for a time."
 LR_send_gold_embassy_decision: "Send a Gold Embassy"
 LR_send_gold_embassy_decision_desc: "Let my envoys carry gold to the courts around my realm, so that every king knows the wealth of my throne."
 LR_send_gold_embassy_decision_tooltip: "Gain [prestige|E], and neighbouring rulers think better of you."
 LR_buy_household_recruits_decision_confirm: "Raise the company"
 LR_perform_royal_rites_decision_confirm: "Perform the rites"
 LR_send_gold_embassy_decision_confirm: "Send the envoys"
 # priority 4: Basileia and Megale Basileia
 LR_royal_city_county_modifier: "Royal City"
 LR_royal_city_county_modifier_desc: "A polis founded by the king, with its gymnasium, its agora and its royal mint."
 LR_cleruchy_county_modifier: "Cleruchy"
 LR_cleruchy_county_modifier_desc: "The king's veterans hold land here in return for service, and answer his call to arms."
 LR_found_royal_city_decision: "Found a Royal City"
 LR_found_royal_city_decision_desc: "The kings who came after Alexander built cities as they built armies. Let a new polis rise in my lands, to carry my house's name and pay my house's taxes."
 LR_found_royal_city_decision_tooltip: "Your most prosperous domain county without a royal city becomes one."
 LR_found_royal_city_decision_confirm: "Lay out the walls"
 LR_found_royal_city_decision_county_tt: "You hold a county without a royal city in your domain"
 LR_found_royal_city_decision_effect_tt: "[SCOPE.sTitle('LR_found_royal_city_decision_county').GetNameNoTooltip] becomes a royal city: faster prosperity growth and more urban tax."
 LR_settle_cleruchs_decision: "Settle Cleruchs"
 LR_settle_cleruchs_decision_desc: "My veterans have earned land. Let them hold it from me, in my poorest county, and stand ready when the trumpet sounds."
 LR_settle_cleruchs_decision_tooltip: "Your least prosperous domain county without a cleruchy receives veteran settlers."
 LR_settle_cleruchs_decision_confirm: "Settle the veterans"
 LR_settle_cleruchs_decision_county_tt: "You hold a county without a cleruchy in your domain"
 LR_settle_cleruchs_decision_effect_tt: "[SCOPE.sTitle('LR_settle_cleruchs_decision_county').GetNameNoTooltip] receives a cleruchy: more levies, faster levy reinforcement and a larger garrison."
 # 2026-11-25 (user picks): Persianate, Latin, Iqta and Indic signatures
 LR_royal_couriers_county_modifier: "Royal Couriers"
 LR_royal_couriers_county_modifier_desc: "The king's couriers keep the road posts here, and merchants travel safely in their wake."
 LR_missi_modifier: "The Missi Abroad"
 LR_missi_modifier_desc: "The crown's envoys are riding through the counties, and the lords pay what they owe."
 LR_missi_opinion: "Heard by the Missi"
 LR_iqtas_reassigned_modifier: "Iqtas Reassigned"
 LR_iqtas_reassigned_modifier_desc: "The grants have been handed out anew, and every holder raises his men to keep his own."
 LR_iqtas_reassigned_opinion: "Iqta Confirmed"
 LR_agrahara_county_modifier: "Agrahara"
 LR_agrahara_county_modifier_desc: "Land granted by the king to the learned and the holy, recorded on copper plates, and tilled by new settlers."
 LR_send_royal_couriers_decision: "Send the Royal Couriers"
 LR_send_royal_couriers_decision_desc: "Let fresh horses wait at every post of the king's road, so that my word and my merchants cross the realm in days."
 LR_send_royal_couriers_decision_tooltip: "Your counties in your capital's duchy grow more prosperous for a time, and you gain [prestige|E]."
 LR_send_royal_couriers_decision_confirm: "Open the road"
 LR_send_royal_couriers_decision_capital_tt: "You have a capital"
 LR_send_royal_couriers_decision_effect_tt: "The counties you hold in your capital's duchy get faster prosperity growth for 10 years."
 LR_send_the_missi_decision: "Send the Missi"
 LR_send_the_missi_decision_desc: "Let my envoys ride out in pairs, a lord and a churchman, to hear the complaints of my people and remind the counts what they owe the crown."
 LR_send_the_missi_decision_tooltip: "Your vassals think better of you and pay more tax for a time."
 LR_send_the_missi_decision_confirm: "Send them out"
 LR_reassign_the_iqtas_decision: "Reassign the Iqtas"
 LR_reassign_the_iqtas_decision_desc: "The grants are mine to give. Let every iqta be confirmed or given anew, so that each holder knows whose bread he eats."
 LR_reassign_the_iqtas_decision_tooltip: "Your vassals think better of you and send more levies for a time."
 LR_reassign_the_iqtas_decision_confirm: "Confirm the grants"
 LR_grant_an_agrahara_decision: "Grant an Agrahara"
 LR_grant_an_agrahara_decision_desc: "Let a village of my poorest lands be granted to the learned, as the old kings did, and the grant engraved on copper so that no one may undo it."
 LR_grant_an_agrahara_decision_tooltip: "Gain [piety|E], and your least prosperous domain county without an agrahara grows faster for a time."
 LR_grant_an_agrahara_decision_confirm: "Engrave the plates"
 LR_grant_an_agrahara_decision_county_tt: "You hold a county without an agrahara in your domain"
 LR_grant_an_agrahara_decision_effect_tt: "[SCOPE.sTitle('LR_grant_an_agrahara_decision_county').GetNameNoTooltip] receives an agrahara: faster prosperity growth for 10 years."
 # 2026-11-25: the remaining universal ranks
 LR_imperial_diet_opinion: "Summoned to the Diet"
 LR_invested_bishops_opinion: "Bishops Invested"
 LR_bishops_invested_modifier: "Bishops Invested"
 LR_bishops_invested_modifier_desc: "The emperor's new bishops hold their sees from him and pay what they owe."
 LR_household_feasted_modifier: "Household Feasted"
 LR_household_feasted_modifier_desc: "The king's household soldiers have feasted at his table and will fight the harder for it."
 LR_hold_an_imperial_diet_decision: "Hold an Imperial Diet"
 LR_hold_an_imperial_diet_decision_desc: "Let the princes of the empire gather at my court, to hear my word and bring me their counsel."
 LR_hold_an_imperial_diet_decision_tooltip: "Your vassals think better of you for a long time."
 LR_hold_an_imperial_diet_decision_confirm: "Summon the princes"
 LR_invest_the_bishops_decision: "Invest the Bishops"
 LR_invest_the_bishops_decision_desc: "The sees of my empire are mine to fill. Let worthy men receive the ring and staff from my hand."
 LR_invest_the_bishops_decision_tooltip: "Your vassals think better of you and pay more tax for a time."
 LR_invest_the_bishops_decision_confirm: "Give the ring and staff"
 LR_send_the_hajj_caravan_decision: "Send the Hajj Caravan"
 LR_send_the_hajj_caravan_decision_desc: "Let the pilgrim caravan set out under my banner, with water, guards and alms for the holy cities."
 LR_send_the_hajj_caravan_decision_tooltip: "Gain [piety|E] and [prestige|E]."
 LR_send_the_hajj_caravan_decision_confirm: "Send the caravan"
 LR_feast_the_household_decision: "Feast the Household"
 LR_feast_the_household_decision_desc: "My household soldiers are the strength of the kingdom. Let them feast at my table, so they know whose bread they eat."
 LR_feast_the_household_decision_tooltip: "Gain [prestige|E], and your men-at-arms fight harder for a time."
 LR_feast_the_household_decision_confirm: "Lay the tables"
 LR_bring_out_the_ark_decision: "Bring Out the Ark"
 LR_bring_out_the_ark_decision_desc: "On the great feast let the Ark of the Covenant be carried before the people, so that all see the glory of the kings of Solomon's line."
 LR_bring_out_the_ark_decision_tooltip: "Gain [prestige|E] and [legitimacy|E]."
 LR_bring_out_the_ark_decision_confirm: "Carry out the Ark"
 LR_make_the_hajj_of_gold_decision: "Make the Hajj of Gold"
 LR_make_the_hajj_of_gold_decision_desc: "Let me travel to the holy places with a train of gold so great that the cities I pass will speak of it for a hundred years."
 LR_make_the_hajj_of_gold_decision_tooltip: "Gain a great deal of [prestige|E] and [piety|E]."
 LR_make_the_hajj_of_gold_decision_confirm: "Set out with the gold"
 # 2026-11-25: Sarvabhauma (Indic universal)
 LR_perform_a_rajasuya_decision: "Perform a Rajasuya"
 LR_perform_a_rajasuya_decision_desc: "Let the royal consecration be performed again before the priests and the kings of the quarters, so that all the earth sees its lord renewed."
 LR_perform_a_rajasuya_decision_tooltip: "Gain [prestige|E] and [legitimacy|E]."
 LR_perform_a_rajasuya_decision_confirm: "Be consecrated"
 # 2026-11-25: Farr (Persianate universal)
 LR_nowruz_court_opinion: "Honoured at Nowruz"
 LR_hold_the_nowruz_court_decision: "Hold the Nowruz Court"
 LR_hold_the_nowruz_court_decision_desc: "At the new year the great houses come before the throne with their gifts, and the king of kings receives them in all the glory of his farr."
 LR_hold_the_nowruz_court_decision_tooltip: "Gain [prestige|E], and your [powerful_vassals|E] think better of you for a long time."
 LR_hold_the_nowruz_court_decision_confirm: "Receive the houses"
 # 2026-11-25: Unctio (Sacral imperial)
 LR_hold_a_crown_wearing_decision: "Hold a Crown-wearing"
 LR_hold_a_crown_wearing_decision_desc: "At Easter the court gathers, the bishops sing the praises, and I wear the crown before them all, as the anointed kings have always done."
 LR_hold_a_crown_wearing_decision_tooltip: "Gain [prestige|E] and [legitimacy|E]."
 LR_hold_a_crown_wearing_decision_confirm: "Wear the crown"
 # 2026-11-25: the Japanese ranks (Chotei, Bakufu, Tenka)
 LR_court_ranks_granted_modifier: "Ranks Granted"
 LR_court_ranks_granted_modifier_desc: "The houses newly raised in court rank pay their dues to the court with gratitude."
 LR_court_ranks_opinion: "Raised in Court Rank"
 LR_gokenin_summoned_modifier: "Gokenin Summoned"
 LR_gokenin_summoned_modifier_desc: "The shōgun's housemen have answered the summons, and their warriors stand ready."
 LR_imperial_edict_opinion: "Heard the Imperial Edict"
 LR_grant_court_ranks_decision: "Grant Court Ranks"
 LR_grant_court_ranks_decision_desc: "The houses of the realm compete for the court's ranks. Let new ranks be granted at the New Year, so that every house remembers whose favour raised it."
 LR_grant_court_ranks_decision_tooltip: "Your vassals think better of you and pay more tax for a time."
 LR_grant_court_ranks_decision_confirm: "Grant the ranks"
 LR_summon_the_gokenin_decision: "Summon the Gokenin"
 LR_summon_the_gokenin_decision_desc: "My housemen hold their lands from me. Let them come to the camp with their warriors, so that every province sees the strength of the shōgun."
 LR_summon_the_gokenin_decision_tooltip: "Gain [prestige|E], and your levies and knights are stronger for a time."
 LR_summon_the_gokenin_decision_confirm: "Call them to the camp"
 LR_issue_an_imperial_edict_decision: "Issue an Imperial Edict"
 LR_issue_an_imperial_edict_decision_desc: "The throne speaks for itself again. Let an edict go out under my own seal, and let every house hear the tennō's word."
 LR_issue_an_imperial_edict_decision_tooltip: "Gain [prestige|E], and your vassals think better of you for a time."
 LR_issue_an_imperial_edict_decision_confirm: "Seal the edict"
