l_english:
 # Successor satrapies
 LR_restore_antipatrid_satrapies_decision:0 "Restore the Antipatrid Satrapies"
 LR_restore_antipatrid_satrapies_decision_desc:0 "As Antipatros once governed Makedonia and Hellas for Alexander, so shall we order our European lands into satrapies, each divided into hyparchies answering to the throne at Pella."
 LR_restore_antipatrid_satrapies_decision_tooltip:0 "Restore a satrapy of the Antipatrid realm and divide it into hyparchies"
 LR_restore_antipatrid_satrapies_decision_confirm:0 "Appoint the Satraps"
 custom_satrapy_macedonia_desc:0 "Makedonia"
 custom_satrapy_greece_desc:0 "Hellas"
 custom_satrapy_thrace_desc:0 "Thrake"
 LR_restore_antigonid_satrapies_decision:0 "Restore the Antigonid Satrapies"
 LR_restore_antigonid_satrapies_decision_desc:0 "Antigonos Monophthalmos ruled Asia from Kelainai through the satraps of Alexander. Let the old satrapies of Asia Minor be raised again, each divided into hyparchies under our rule."
 LR_restore_antigonid_satrapies_decision_tooltip:0 "Restore a satrapy of the Antigonid realm and divide it into hyparchies"
 LR_restore_antigonid_satrapies_decision_confirm:0 "Appoint the Satraps"
