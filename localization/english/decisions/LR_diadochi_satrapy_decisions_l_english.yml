l_english:
 # Satrapies
 LR_restore_hellenistic_satrapies_decision:0 "Restore the Satrapies of Alexander"
 LR_restore_hellenistic_satrapies_decision_desc:0 "Alexander ruled from Pella to the Indus through his satraps, and after Babylon his empire was held by great strategoi: of Europe, of Asia, of Syria, of Persis, of the Upper Satrapies and of Egypt. As Hegemon of the Hellenes, we shall restore every satrapy of his empire and set each under its strategia."
 LR_restore_hellenistic_satrapies_decision_tooltip:0 "Restore any satrapy of Alexander's empire, or of Hellenistic India, and place it in its strategia"
 LR_restore_hellenistic_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_indian_satrapies_decision:0 "Restore the Satrapies of India"
 LR_restore_indian_satrapies_decision_desc:0 "From Pentapotamia to Taprobane, the Basileia Indike is ruled through satraps and hyparchs in the manner of the Hellenes. Let each satrapy of India be restored and set under its strategia."
 LR_restore_indian_satrapies_decision_tooltip:0 "Restore a satrapy of Hellenistic India and place it in its strategia"
 LR_restore_indian_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_antipatrid_satrapies_decision:0 "Restore the Antipatrid Satrapies"
 LR_restore_antipatrid_satrapies_decision_desc:0 "As Antipatros once governed Makedonia and Hellas for Alexander, so shall we order our European lands into satrapies, each divided into hyparchies answering to the throne at Pella."
 LR_restore_antipatrid_satrapies_decision_tooltip:0 "Restore a satrapy of the Antipatrid realm and divide it into hyparchies"
 LR_restore_antipatrid_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_antigonid_satrapies_decision:0 "Restore the Antigonid Satrapies"
 LR_restore_antigonid_satrapies_decision_desc:0 "Antigonos Monophthalmos ruled Asia from Kelainai through the satraps of Alexander. Let the old satrapies of Asia Minor be raised again, each divided into hyparchies under our rule."
 LR_restore_antigonid_satrapies_decision_tooltip:0 "Restore a satrapy of the Antigonid realm and divide it into hyparchies"
 LR_restore_antigonid_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_seleukid_satrapies_decision:0 "Restore the Seleukid Satrapies"
 LR_restore_seleukid_satrapies_decision_desc:0 "From Antiocheia to the Iranian plateau, Seleukos Nikator ruled through satraps, strategoi and hyparchs. The time has come to restore the satrapies of the Upper and Lower Provinces."
 LR_restore_seleukid_satrapies_decision_tooltip:0 "Restore a satrapy of the Seleukid realm and divide it into hyparchies"
 LR_restore_seleukid_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_ptolemaic_satrapies_decision:0 "Restore the Ptolemaic Satrapies"
 LR_restore_ptolemaic_satrapies_decision_desc:0 "The Ptolemies ruled Egypt and its overseas possessions through a careful order of nomes, hyparchies and strategoi. Let this order be restored across our realm."
 LR_restore_ptolemaic_satrapies_decision_tooltip:0 "Restore a satrapy of the Ptolemaic realm and divide it into hyparchies"
 LR_restore_ptolemaic_satrapies_decision_confirm:0 "Appoint the Satraps"
