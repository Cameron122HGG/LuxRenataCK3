 custom_satrapy_persia_desc:0 "Persis"
 custom_satrapy_parthia_desc:0 "Parthia"
 LR_restore_ptolemaic_satrapies_decision:0 "Restore the Ptolemaic Satrapies"
 LR_restore_ptolemaic_satrapies_decision_desc:0 "The Ptolemies ruled Egypt and its overseas possessions through a careful order of nomes, hyparchies and strategoi. Let this order be restored across our realm."
 LR_restore_ptolemaic_satrapies_decision_tooltip:0 "Restore a satrapy of the Ptolemaic realm and divide it into hyparchies"
 LR_restore_ptolemaic_satrapies_decision_confirm:0 "Appoint the Satraps"
