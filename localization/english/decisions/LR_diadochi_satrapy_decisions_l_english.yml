l_english:
 # Satrapies
 LR_restore_hellenistic_satrapies_decision:0 "Restore the Satrapies of Alexander"
 LR_restore_hellenistic_satrapies_decision_desc:0 "Alexander ruled from Pella to the Indus through his satraps, and after Babylon his empire was held by great strategoi: of Europe, of Asia, of Syria, of Persis, of the Upper Satrapies and of Egypt. As Hegemon of the Hellenes, we shall restore every satrapy of his empire and set each under its strategia."
 LR_restore_hellenistic_satrapies_decision_tooltip:0 "Restore any satrapy of Alexander's empire, or of Hellenistic India, and place it in its strategia"
 LR_restore_hellenistic_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_indian_satrapies_decision:0 "Restore the Satrapies of India"
 LR_restore_indian_satrapies_decision_desc:0 "From Pentapotamia to Taprobane, the Basileia Indike is ruled through satraps and hyparchs in the manner of the Hellenes. Let each satrapy of India be restored and set under its strategia."
 LR_restore_indian_satrapies_decision_tooltip:0 "Restore a satrapy of Hellenistic India and place it in its strategia"
 LR_restore_indian_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_strategia_europe_satrapies_decision:0 "Restore the Satrapies of Europe"
 LR_restore_strategia_europe_satrapies_decision_desc:0 "Makedonia, Hellas and Thrake, the homeland of the Argeads and the prize every Successor fought over. Each Successor first restores the satrapies their house held of old; once all of those are in their realm, the rest of the strategia is theirs to claim."
 LR_restore_strategia_europe_satrapies_decision_tooltip:0 "Restore a satrapy of the Strategia of Europe and divide it into hyparchies"
 LR_restore_strategia_europe_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_strategia_asia_satrapies_decision:0 "Restore the Satrapies of Asia"
 LR_restore_strategia_asia_satrapies_decision_desc:0 "Asia Minor and the Caucasus, the lands Antigonos governed from Kelainai and his rivals divided after Ipsos. Each Successor first restores the satrapies their house held of old; once all of those are in their realm, the rest of the strategia is theirs to claim."
 LR_restore_strategia_asia_satrapies_decision_tooltip:0 "Restore a satrapy of the Strategia of Asia and divide it into hyparchies"
 LR_restore_strategia_asia_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_strategia_syria_satrapies_decision:0 "Restore the Satrapies of Syria"
 LR_restore_strategia_syria_satrapies_decision_desc:0 "Syria, Mesopotamia and Babylonia, the heart of the Seleukid realm and the road between East and West. Each Successor first restores the satrapies their house held of old; once all of those are in their realm, the rest of the strategia is theirs to claim."
 LR_restore_strategia_syria_satrapies_decision_tooltip:0 "Restore a satrapy of the Strategia of Syria and divide it into hyparchies"
 LR_restore_strategia_syria_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_strategia_persis_satrapies_decision:0 "Restore the Satrapies of Persis"
 LR_restore_strategia_persis_satrapies_decision_desc:0 "The old Persian heartland of Media and Persis, held by satraps who answered to whoever ruled at Babylon. Each Successor first restores the satrapies their house held of old; once all of those are in their realm, the rest of the strategia is theirs to claim."
 LR_restore_strategia_persis_satrapies_decision_tooltip:0 "Restore a satrapy of the Strategia of Persis and divide it into hyparchies"
 LR_restore_strategia_persis_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_strategia_upper_satrapies_satrapies_decision:0 "Restore the Upper Satrapies"
 LR_restore_strategia_upper_satrapies_satrapies_decision_desc:0 "The Upper Satrapies, from Parthia to the Indus, always the hardest for any Successor to hold. Each Successor first restores the satrapies their house held of old; once all of those are in their realm, the rest of the strategia is theirs to claim."
 LR_restore_strategia_upper_satrapies_satrapies_decision_tooltip:0 "Restore a satrapy of the Strategia of the Upper Satrapies and divide it into hyparchies"
 LR_restore_strategia_upper_satrapies_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_strategia_egypt_satrapies_decision:0 "Restore the Satrapies of Egypt"
 LR_restore_strategia_egypt_satrapies_decision_desc:0 "Egypt and its neighbours, the treasure-house of the Ptolemies. Each Successor first restores the satrapies their house held of old; once all of those are in their realm, the rest of the strategia is theirs to claim."
 LR_restore_strategia_egypt_satrapies_decision_tooltip:0 "Restore a satrapy of the Strategia of Egypt and divide it into hyparchies"
 LR_restore_strategia_egypt_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_restore_strategia_pentapotamia_satrapies_decision:0 "Restore the Satrapies of Pentapotamia"
 LR_restore_strategia_pentapotamia_satrapies_decision_desc:0 "The satrapies of Pentapotamia. Each Successor first restores the satrapies their house held of old; once all of those are in their realm, the rest of the strategia is theirs to claim."
 LR_restore_strategia_pentapotamia_satrapies_decision_tooltip:0 "Restore a satrapy of the Strategia of Pentapotamia and divide it into hyparchies"
 LR_restore_strategia_pentapotamia_satrapies_decision_confirm:0 "Appoint the Satraps"
 LR_satrapy_originals_restored_tt:0 "Your realm holds every original satrapy of your empire"
 LR_satrapy_originals_first_tt:0 "This is one of your empire's original satrapies, or your realm already holds all of them"
