 LR_CHOOSE_SATRAPY_BUTTON:0 "Choose Satrapy"
 LR_restore_satrapies_decision_trigger:0 "Completely control the lands of at least one satrapy that has not been restored"
 LR_restore_satrapies_decision_effect_tt:0 "The chosen satrapy is created under your empire (or its strategia, if you are the Hegemon), and its counties become [de_jure|E] part of its hyparchies"
 LR_sort_satrapies_into_strategiai_tt:0 "Every restored satrapy becomes [de_jure|E] part of its strategia, and the strategiai of [GetTitleByKey('h_hellenistic_empire').GetName]"

 LR_debug_take_satrapy_lands_decision:0 "Debug: Take Satrapy Lands"
 LR_debug_take_satrapy_lands_decision_desc:0 "Take every county of the chosen satrapy that is outside your realm, to test the successor and satrapy decisions."
 LR_debug_take_satrapy_lands_decision_tooltip:0 "Take every county of the chosen satrapy that is outside your realm"
 LR_debug_take_satrapy_lands_decision_confirm:0 "Take the Lands"

 LR_diadochi_satrapy.0001.t:0 "The Satrapy of [restored_satrapy.GetNameNoTier]"
 LR_diadochi_satrapy.0001.desc:0 "By royal decree, the lands of [restored_satrapy.GetNameNoTier] have been ordered once more as a satrapy of [satrapy_empire.GetName]. Its hyparchies have been drawn anew, and its satrap answers to the throne as in the days of the Successors."
 LR_diadochi_satrapy.0001.a:0 "Let the satraps govern in our name."