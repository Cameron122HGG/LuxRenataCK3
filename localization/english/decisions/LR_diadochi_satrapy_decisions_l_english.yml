 LR_CHOOSE_SATRAPY_BUTTON:0 "Choose Satrapy"
 LR_restore_satrapies_decision_trigger:0 "Completely control the lands of at least one satrapy that has not been restored"
 LR_restore_satrapies_decision_effect_tt:0 "The chosen satrapy is created under your empire (or its strategia, if you hold a Hegemony), and its counties become [de_jure|E] part of its hyparchies"
 LR_sort_satrapies_into_strategiai_tt:0 "Every restored satrapy of Alexander's empire becomes [de_jure|E] part of its strategia, and the strategiai of [GetTitleByKey('h_hellenistic_empire').GetName]"

 LR_found_greek_india_decision:0 "Proclaim the Basileia Indike"
 LR_found_greek_india_decision_desc:0 "The Yavana kings have ruled in India since the days of Menandros. With Pentapotamia and more of India in our hands, we can proclaim a Hellenic kingship over all of India and order it into satrapies, as Alexander did in the West."
 LR_found_greek_india_decision_tooltip:0 "Proclaim the Indo-Hellenic Hegemony and restore the satrapies of India"
 LR_found_greek_india_decision_confirm:0 "Basileus of India!"
 LR_found_greek_india_second_satrapy_tt:0 "Completely control the lands of one other satrapy of Hellenistic India"
 LR_found_greek_india_decision_effect_tt:0 "Any satrapy of India already restored becomes [de_jure|E] part of its strategia, and the strategiai of [GetTitleByKey('h_greek_india').GetName]"
 LR_join_greek_india_to_hegemony_decision:0 "Join India to the Empire of Alexander"
 LR_join_greek_india_to_hegemony_decision_desc:0 "Alexander crossed the Indus and the Hydaspes, and the satrapies of India were his. Let the strategiai of India join the Hegemony of the Hellenes once more."
 LR_join_greek_india_to_hegemony_decision_tooltip:0 "Make the strategiai of Hellenistic India part of the Hegemony"
 LR_join_greek_india_to_hegemony_decision_confirm:0 "From Pella to the Ganges!"
 LR_join_greek_india_holder_tt:0 "You hold [GetTitleByKey('h_greek_india').GetName], or no one does"
 LR_join_greek_india_satrapy_tt:0 "At least one satrapy of Hellenistic India has been restored"
 LR_join_greek_india_to_hegemony_decision_effect_tt:0 "The strategiai of India become [de_jure|E] part of [GetTitleByKey('h_hellenistic_empire').GetName], and your [GetTitleByKey('h_greek_india').GetName] is destroyed. Satrapies of India you restore from now on go to the Hegemony."

 LR_debug_take_satrapy_lands_decision:0 "Debug: Take Satrapy Lands"
 LR_debug_take_satrapy_lands_decision_desc:0 "Take every county of the chosen satrapy that is outside your realm, to test the successor and satrapy decisions."
 LR_debug_take_satrapy_lands_decision_tooltip:0 "Take every county of the chosen satrapy that is outside your realm"
 LR_debug_take_satrapy_lands_decision_confirm:0 "Take the Lands"
 LR_debug_take_strategia_lands_decision:0 "Debug: Take Strategia Lands"
 LR_debug_take_strategia_lands_decision_desc:0 "Take every county of every satrapy in the chosen strategia that is outside your realm, to test the hegemony and satrapy decisions."
 LR_debug_take_strategia_lands_decision_tooltip:0 "Take every county of every satrapy in the chosen strategia that is outside your realm"
 LR_debug_take_strategia_lands_decision_confirm:0 "Take the Lands"
 LR_CHOOSE_STRATEGIA_BUTTON:0 "Choose Strategia"

 LR_diadochi_satrapy.0001.t:0 "The Satrapy of [restored_satrapy.GetNameNoTier]"
 LR_diadochi_satrapy.0001.desc:0 "By royal decree, the lands of [restored_satrapy.GetNameNoTier] have been ordered once more as a satrapy of [satrapy_empire.GetName]. Its hyparchies have been drawn anew, and its satrap answers to the throne as in the days of the Successors."
 LR_diadochi_satrapy.0001.a:0 "Let the satraps govern in our name."
 LR_diadochi_satrapy.0002.t:0 "The Basileia Indike"
 LR_diadochi_satrapy.0002.desc:0 "Before the assembled hyparchs and the priests of many gods, [ROOT.Char.GetFirstName] has been proclaimed Basileus of all India. The satrapies of India answer to a Hellenic throne, as the Yavana kings once dreamed."
 LR_diadochi_satrapy.0002.a:0 "From the Indus to the Ganges, one kingship."