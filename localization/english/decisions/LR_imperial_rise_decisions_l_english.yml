l_english:
 # LR 2026-11-25: GRADUS imperial rise decisions (LR_imperial_rise_decisions.txt)
 LR_imperial_rise_governors_tt: "Your realm's governors on your administration rise with you."
 LR_proclaim_king_of_kings_decision: "Proclaim the King of Kings"
 LR_proclaim_king_of_kings_decision_desc: "The great houses already bow before my throne. Let them be kings in their own lands, and let me be crowned the king above them all."
 LR_proclaim_king_of_kings_decision_tooltip: "Raise the [persianate_administrative_government|E] to the #V $persianate_imperial_government$#!: a king of kings over the great houses."
 LR_proclaim_king_of_kings_decision_confirm: "Wear the crown of kings"
 LR_proclaim_king_of_kings_decision_houses_tt: "Every [powerful_vassal|E] has at least 20 [opinion|E] of you"
 LR_raise_the_royal_household_decision: "Raise the Royal Household"
 LR_raise_the_royal_household_decision_desc: "My soldiers are bought, trained and fed by my house alone, and my scribes keep the realm's every account. Let the sword and the pen serve the throne as one."
 LR_raise_the_royal_household_decision_tooltip: "Raise the [mamlakah_administrative_government|E] to the [mamlakah_imperial_government|E]: a household army and a royal chancery."
 LR_raise_the_royal_household_decision_confirm: "Muster the household"
 LR_proclaim_the_sacred_kingship_decision: "Proclaim the Sacred Kingship"
 LR_proclaim_the_sacred_kingship_decision_desc: "The river rises and falls at the will of Heaven, and the king stands between Heaven and the people. Let the realm see its ruler crowned as the sacred lord of the river."
 LR_proclaim_the_sacred_kingship_decision_tooltip: "Raise the [nilotic_administrative_government|E] to the [nilotic_imperial_government|E]: a sacred king over the Nile and the Horn."
 LR_proclaim_the_sacred_kingship_decision_confirm: "Be crowned as the sacred king"
 LR_proclaim_the_lord_of_tribute_decision: "Proclaim the Lord of Tribute"
 LR_proclaim_the_lord_of_tribute_decision_desc: "Gold comes to my court from every market and every mine, and the kings around me send their tribute. Let them know me as their lord."
 LR_proclaim_the_lord_of_tribute_decision_tooltip: "Raise the [sudanic_administrative_government|E] to the [sudanic_imperial_government|E]: a lord of gold over tributary kings."
 LR_proclaim_the_lord_of_tribute_decision_confirm: "Receive the kings' tribute"
 LR_renew_the_empire_decision: "Renew the Empire"
 LR_renew_the_empire_decision_desc: "The empire of the west fell, but its crown was never forgotten. Let the lords of my realm see me renew it, anointed and acclaimed."
 LR_renew_the_empire_decision_tooltip: "Raise the #V $western_administrative_government$#! to the #V $western_imperial_government$#!: an emperor over the counts and dukes of the west."
 LR_renew_the_empire_decision_confirm: "Renew the empire"
 LR_proclaim_the_sultanate_decision: "Proclaim the Sultanate"
 LR_proclaim_the_sultanate_decision_desc: "The lands and soldiers of the realm answer to me, and the faithful look to my sword. Let my rule be proclaimed in the Friday prayer as that of a sultan."
 LR_proclaim_the_sultanate_decision_tooltip: "Raise the #V $iqta_administrative_government$#! to the #V $iqta_imperial_government$#!: a sultan over the holders of the iqta."
 LR_proclaim_the_sultanate_decision_confirm: "Proclaim the Sultanate"
 LR_proclaim_the_chakravartin_decision: "Proclaim the Chakravartin"
 LR_proclaim_the_chakravartin_decision_desc: "The wheel of my rule turns in every direction, and the kings around me bow. Let me be proclaimed the Chakravartin, the universal king whose realm is the Samrajya."
 LR_proclaim_the_chakravartin_decision_tooltip: "Raise the #V $gupta_administrative_government$#! to the #V $gupta_imperial_government$#!: a universal king over the samantas."
 LR_proclaim_the_chakravartin_decision_confirm: "Turn the wheel"
 LR_convene_the_daijokan_decision: "Convene the Daijō-kan"
 LR_convene_the_daijokan_decision_desc: "The provinces answer to my governors and the great houses wait upon my word. Let the Council of State sit again in full, so that the realm is ruled as a court, not as a household."
 LR_convene_the_daijokan_decision_tooltip: "Raise the #V $japan_administrative_government$#! to the #V $japan_imperial_government$#!: the full court of the realm, ruling through its Council of State."
 LR_convene_the_daijokan_decision_confirm: "Seat the Council of State"
 LR_receive_the_anointing_decision: "Receive the Anointing"
 LR_receive_the_anointing_decision_desc: "The palace rules in my name and the counts answer to my court. Let the bishops pour the holy oil on my head, so that the realm sees its ruler made sacred before God."
 LR_receive_the_anointing_decision_tooltip: "Raise the #V $sacral_administrative_government$#! to the #V $sacral_imperial_government$#!: the anointed king of the Franks."
 LR_receive_the_anointing_decision_confirm: "Kneel for the oil"
