 form_great_moravia_decision: "Restore Great Moravia"
 form_great_moravia_decision_desc: "Once the princes of Moravia ruled from the Elbe to the Danube bend, and Nitra and the Pannonian lakes answered to them. With Moravia and Pannonia in our hands, we can raise that realm again."
 form_great_moravia_decision_tooltip: "Unite Moravia, Nitra and Pannonia in one realm."
 form_great_moravia_decision_confirm: "Megale Moravia rises again!"
 LR_form_great_moravia_dejure_tt: "Nitra, Gyor and Somogy become de jure part of [GetTitleByKey('k_moravia').GetName]. [GetTitleByKey('k_bohemia').GetName], [GetTitleByKey('k_moravia').GetName] and [GetTitleByKey('k_sorbia').GetName] become de jure part of [GetTitleByKey('e_great_moravia').GetName]. You also gain [GetTitleByKey('k_moravia').GetName] if no one holds it."
