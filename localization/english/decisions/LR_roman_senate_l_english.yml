l_english:
 # LR 2026-11-25 Reconvene the Senate (tools/roman_senate/build_roman_senate.py)
 LR_reconvene_western_senate_decision: "Reconvene the Senate (West)"
 LR_reconvene_western_senate_decision_desc: "The provinces are restored and the Republic stands again. Let the Senate sit once more in Rome, and let the governors of the provinces take their seats beside the old houses."
 LR_reconvene_western_senate_decision_tooltip: "The [GetTitleByKey('e_western_roman_republic').GetNameNoTier] becomes the Senate of Rome, and the governors of the dioceses and prefectures sit in it."
 LR_reconvene_western_senate_decision_confirm: "Open the doors of the Curia"
 LR_senate_western_latin: "Senatus Romanus in Curia Iulia"
 LR_senate_western_greek: "Rhōmaikē Synklētos"
 LR_senate_western_foreign: "Senate of Rome"
 LR_reconvene_eastern_senate_decision: "Reconvene the Senate (East)"
 LR_reconvene_eastern_senate_decision_desc: "The provinces are restored and the Republic stands again. Let the Senate sit once more in Constantinople, and let the governors of the provinces take their seats beside the old houses."
 LR_reconvene_eastern_senate_decision_tooltip: "The [GetTitleByKey('e_eastern_roman_republic').GetNameNoTier] becomes the Senate of Constantinople, and the governors of the dioceses and prefectures sit in it."
 LR_reconvene_eastern_senate_decision_confirm: "Open the doors of the Curia"
 LR_senate_eastern_latin: "Senatus Constantinopolitanus"
 LR_senate_eastern_greek: "Synklētos Kōnstantinoupoleōs"
 LR_senate_eastern_foreign: "Senate of Constantinople"
 LR_reconvene_senate_half_tt: "You hold the half's Republic title"
 LR_reconvene_senate_authority_tt: "The Senate is not merely #high Ceremonial#!"
 LR_roman_senate_provinces_tt: "The holders of the dioceses and praetorian prefectures in your realm are enrolled in the Senate, and the Senate grows."
 LR_roman_curia_modifier: "Seat of the Senate"
 LR_roman_curia_modifier_desc: "The Senate of the Republic sits here, and the city prospers in its shadow."
 LR_princeps_senatus_modifier: "Princeps Senatus"
 LR_princeps_senatus_modifier_desc: "First of the senators: the one who speaks first in the Senate of the Republic."
 LR_roman_senate_seat_modifier: "The Senate in Session"
 LR_roman_senate_seat_modifier_desc: "The Republic is governed from the seat of its Senate, where the senators can be heard and won over."
 LR_senatus_consultum_modifier: "Senatus Consultum"
 LR_senatus_consultum_modifier_desc: "The Senate has given its advice, and the provinces pay what the Republic asks."
 LR_senatus_consultum_opinion: "Heard in the Senate"
 LR_hold_senatus_consultum_decision: "Hold a Senatus Consultum"
 LR_hold_senatus_consultum_decision_desc: "Let the matter be put before the Senate, and let the senators give their advice, so that what the Republic does it does with their voice."
 LR_hold_senatus_consultum_decision_tooltip: "The senators think better of you, and the provinces pay more for a time."
 LR_hold_senatus_consultum_decision_confirm: "Put it to the Senate"
 LR_convene_gallic_senate_decision: "Convene the Senate of the Gauls"
 LR_convene_gallic_senate_decision_desc: "The prefecture is ours again. We may rule it as an Augustus, from a court of palaces, or as the first of the senators, with the governors of the provinces seated beside us in Trier. Postumus had his consuls; let us have our Senate."
 LR_convene_gallic_senate_decision_tooltip: "The [GetTitleByKey('e_gallic_empire').GetNameNoTier] becomes the Senate of the Gauls, seated in Trier. You rule as Consul, not Augustus."
 LR_convene_gallic_senate_decision_confirm: "Seat the Senate in Trier"
 LR_senate_gallic_latin: "Senatus Galliarum in Augusta Treverorum"
 LR_senate_gallic_greek: "Synklētos tōn Galatiōn"
 LR_senate_gallic_foreign: "Senate of the Gauls"
 LR_convene_palmyrene_senate_decision: "Convene the Senate of Palmyra"
 LR_convene_palmyrene_senate_decision_desc: "The prefecture is ours again. We may rule it as an Augustus, from a court of palaces, or as the first of the senators, with the governors of the provinces seated beside us in Palmyra. Postumus had his consuls; let us have our Senate."
 LR_convene_palmyrene_senate_decision_tooltip: "The [GetTitleByKey('e_palmyrene_empire').GetNameNoTier] becomes the Senate of Palmyra, seated in Palmyra. You rule as Consul, not Augustus."
 LR_convene_palmyrene_senate_decision_confirm: "Seat the Senate in Palmyra"
 LR_senate_palmyrene_latin: "Senatus Palmyrenus"
 LR_senate_palmyrene_greek: "Boulē kai Dēmos Palmyrēnōn"
 LR_senate_palmyrene_foreign: "Council of Palmyra"
 LR_convene_brittanic_senate_decision: "Convene the Senate of the Britains"
 LR_convene_brittanic_senate_decision_desc: "The prefecture is ours again. We may rule it as an Augustus, from a court of palaces, or as the first of the senators, with the governors of the provinces seated beside us in Londinium. Postumus had his consuls; let us have our Senate."
 LR_convene_brittanic_senate_decision_tooltip: "The [GetTitleByKey('e_brittanic_empire').GetNameNoTier] becomes the Senate of the Britains, seated in Londinium. You rule as Consul, not Augustus."
 LR_convene_brittanic_senate_decision_confirm: "Seat the Senate in Londinium"
 LR_senate_brittanic_latin: "Senatus Britanniarum Londiniensis"
 LR_senate_brittanic_greek: "Synklētos tōn Brettaniōn"
 LR_senate_brittanic_foreign: "Senate of the Britains"
 LR_convene_southern_senate_decision: "Convene the Senate of Africa"
 LR_convene_southern_senate_decision_desc: "The prefecture is ours again. We may rule it as an Augustus, from a court of palaces, or as the first of the senators, with the governors of the provinces seated beside us in Carthage. Postumus had his consuls; let us have our Senate."
 LR_convene_southern_senate_decision_tooltip: "The [GetTitleByKey('e_southern_roman_empire').GetNameNoTier] becomes the Senate of Africa, seated in Carthage. You rule as Consul, not Augustus."
 LR_convene_southern_senate_decision_confirm: "Seat the Senate in Carthage"
 LR_senate_southern_latin: "Senatus Africae Carthaginiensis"
 LR_senate_southern_greek: "Synklētos tēs Libyēs"
 LR_senate_southern_foreign: "Senate of Africa"
 LR_convene_regional_senate_final_tt: "#warning The choice is final: #V Reorganize our Imperium#! (the Imperial Court) will no longer be possible for this line.#!"
 LR_roman_senate_provinces_regional_tt: "The holders of the dioceses and praetorian prefectures in your realm take their seats in the Senate."
 LR_regional_consul_modifier: "Consul"
 LR_regional_consul_modifier_desc: "This ruler governs with a Senate of the provinces, as consul and first citizen rather than as Augustus."
 LR_seated_in_senate_opinion: "Seated in the Senate"
