l_english:
 ###Unite Britannia
 unify_england_anglo_saxon_decision: "Claim the Title of Bretwalda"
 unify_england_anglo_saxon_decision_desc: "The time has come to unify the Anglo-Saxon realms and claim the title of Bretwalda! For too long have petty wars for land, rampant chaos and foreign invaders ruled over the Saxons of Britannia. No longer shall this be! Claim the title of Bretwalda, ruler of the wide land, and make rightful order of this strife!"
 unify_england_anglo_saxon_decision_tooltip: "Unite the kingdoms of the Heptarchy into a single realm and be crowned Bretwalda, ruler of the wide land."
 unify_england_anglo_saxon_decision_confirm: "I am the Bretwalda!"

 LR_bretwalda_holds_anglia_tt: "Hold the title of [GetTitleByKey('k_petty_anglia').GetNameNoTierNoTooltip], or completely control [GetTitleByKey('d_london').GetName]"
 LR_bretwalda_holds_east_anglia_tt: "Hold the title of [GetTitleByKey('k_petty_east_anglia').GetNameNoTierNoTooltip], or completely control [GetTitleByKey('d_norfolk').GetName]"
 LR_bretwalda_holds_essex_tt: "Hold the title of [GetTitleByKey('k_petty_essex').GetNameNoTierNoTooltip], or completely control [GetTitleByKey('d_bedford').GetName]"
 LR_bretwalda_holds_kent_tt: "Hold the title of [GetTitleByKey('k_petty_kent').GetNameNoTierNoTooltip], or completely control [GetTitleByKey('d_canterbury').GetName]"
 LR_bretwalda_holds_sussex_tt: "Hold the title of [GetTitleByKey('k_petty_sussex').GetNameNoTierNoTooltip], or completely control [GetTitleByKey('d_canterbury').GetName]"
 LR_claim_bretwalda_decision_de_jure_tt: "The duchies of Wessex, Mercia, the Magonsæte, Anglia, Deira and Bernicia become [de_jure|E] part of [GetTitleByKey('k_hk_england').GetName]"
 LR_claim_bretwalda_decision_locked_tt: "The petty kingdoms of the Heptarchy that you hold are destroyed, and none of them can ever be created again"

 LR_bretwalda.0001.t: "The Bretwalda"
 LR_bretwalda.0001.desc: "For too long have the Saxon kingdoms of Britannia quarreled in petty wars. Through strength of arms and cunning, I have prevailed over my foes and unified all the bickering realms into [GetTitleByKey('k_hk_england').GetNameNoTier], land of all the Saxons.\n\nIn the Great Mead Hall of [founder.GetCapitalLocation.GetName], the Anglo-Saxon nobility have sworn fealty to me as Bretwalda, ruler of the wide land."
 LR_bretwalda.0001.a: "In the name of [ROOT.Char.GetFaith.HighGodName], I am the Bretwalda!"
 LR_bretwalda.0002.desc: "For too long have the Saxon kingdoms of Britannia quarreled in petty wars. Through strength of arms and cunning, [founder.GetFullName] has prevailed over [founder.GetHerHis] foes, unified all the bickering realms into [GetTitleByKey('k_hk_england').GetNameNoTier], land of all the Saxons, and been crowned Bretwalda, ruler of the wide land.\n\nThe Bretwalda has been crowned in the Great Mead Hall of [founder.GetCapitalLocation.GetName], and all of the Anglo-Saxon nobility have sworn fealty to [founder.GetHerHim]."
 LR_bretwalda.0002.a: "Hail the Bretwalda!"
 LR_bretwalda.0002.b: "The Saxon tide rises once more."
 LR_bretwalda.0002.c: "Interesting."

 unify_england_briton_decision: "Reclaim Logres"
 unify_england_briton_decision_desc: "For far too long the Germanic barbarians were allowed to ravage our lands! We need to hold grip over what they call 'England', and restore the Roman Order in East Britannia!"  
 unify_england_briton_decision_tooltip: "Barbarians Shall Submit!"
 unify_england_briton_decision_confirm: "Barbarians Shall Submit!" 
 
 primary_title_is_kingdom_tooltip: "Primary Title is a Kingdom"
 