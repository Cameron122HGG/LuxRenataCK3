 # LR 2026-11-25: Junxian -> Meritocratic (LR_sinic_examinations_decisions.txt)
 LR_institute_imperial_examinations_decision: "Institute the Imperial Examinations"
 LR_institute_imperial_examinations_decision_desc: "Commanderies and counties are governed, but by whom? Let every office of the realm be filled by those who pass the examinations of the throne, and let merit, not birth, decide who serves the Son of Heaven."
 LR_institute_imperial_examinations_decision_tooltip: "Raise the [sinic_administrative_government|E] administration to [meritocratic|E], the imperial rank of the Sinic group."
 LR_institute_imperial_examinations_decision_confirm: "Open the examination halls"
 LR_institute_imperial_examinations_decision_effect_tooltip: "Your realm's [sinic_administrative_government|E] governors become [meritocratic|E] with you."
