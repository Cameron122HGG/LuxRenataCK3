 restore_diocese_africa_mauretania_decision: "Restore the Dioceses of North Africa"
 restore_diocese_africa_mauretania_decision_desc: "Once the breadbasket of Rome, the fertile provinces of North Africa and must be reclaimed after centuries under the yoke of the Vandal kings and the dominion of the Berber warlords.\n\nRestoring the old [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] is the first step reassure the Grain Dole to Rome from the southern shores of the Mediterranean." 
 restore_diocese_africa_mauretania_decision_tooltip: "Re-establish the old Dioceses of Africa and Mauretania"
 restore_diocese_africa_mauretania_decision_confirm: "Rome rises!"
 africa_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_africa').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_tahert').GetName]"
