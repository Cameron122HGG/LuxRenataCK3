 LR_restore_western_hegemony_decision: "Restore the Hegemony of the Romans of the West"
 LR_restore_western_hegemony_decision_desc: "When Emperor (Get Lux Invicta Lore might be Theodosius still) split the Roman Empire into two administrative halves, the Western part went to his youngest son, [GetScriptedCharacterByHistoryID( '145227' ).GetFirstName]. We are his direct successors. However, the borders of our [Glossary( 'Pars', 'PARS_OCCIDENTIS_GLOSS' )] have greatly contracted since those days; it will be cause of great glory for a Imperator to re-establish the frontiers that [GetScriptedCharacterByHistoryID( '70534' ).GetFirstNameNoTooltip] originally left us."
 LR_restore_western_hegemony_decision_tooltip: "Re-establish the original frontiers of the Western Empire"
 LR_restore_western_hegemony_decision_confirm: "Send out the tax collectors!"
 LR_western_kingdoms_held_or_vassals_tt: "You must hold the following [kingdom|E] titles, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_italia_annonaria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_italia_suburbicaria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_illyricum').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_lugdunensis').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_viennensis').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_africa').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_mauretania').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_diocese_hispania').GetName]"
  
 every_county_in_theodosian_wre_region: "[GetTitleByKey('h_western_roman_empire').GetName] becomes [de_jure|E] liege of every [kingdom|E] and [duchy|E] title in the [GetGeographicalRegion('custom_theodosian_wre').GetName]"
 
 every_county_in_theodosian_ere_region: "[GetTitleByKey('h_eastern_roman_empire').GetName] becomes [de_jure|E] liege of every [kingdom|E] [empire|E] and [duchy|E] title in the [GetGeographicalRegion('custom_theodosian_ere').GetName]"
 
