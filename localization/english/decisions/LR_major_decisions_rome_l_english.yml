 restore_eastern_roman_administration_decision: "Restore the Administrative Divisions of the Eastern Empire"
 restore_eastern_roman_administration_decision_desc: "The old imperial administrative divisions will be restored."
 restore_eastern_roman_administration_decision_tooltip: "Restore the former administrative divisions of the Eastern Empire"
 restore_eastern_roman_administration_decision_confirm: "Constantinople rules the East!"
 restore_eastern_diocese_system_effect_tooltip:0 "The provinces of [GetTitleByKey('k_diocese_thracia').GetName], [GetTitleByKey('k_diocese_dardania').GetName], [GetTitleByKey('k_diocese_macedonia').GetName], [GetTitleByKey('k_diocese_asia').GetName] and [GetTitleByKey('k_diocese_pontus').GetName] will be reestablished, and brought back under [de_jure|E] Imperial rule."
 eastern_diocese_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_byzantium').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_krete').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_hellas').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_epirus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_bulgaria').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_pergamon').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_anatolia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_pontus').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_cyprus').GetName]"
 restore_eastern_diocese_system_unlock_tooltip:0 "Unlocks further decisions to restore former Imperial provinces."
 

 restore_western_roman_administration_decision: "Restore Roman Administration in the West"
 restore_western_roman_administration_decision_desc: "The centuries have not be kind to the Western Empire, only recently barely a city state, we have restored control over Italy. Let us restore the Roman System of Administration to the West, and bring the provinces of the old empire back under our control one by one."
 restore_western_roman_administration_decision_tooltip: "Reorganize the Western Empire under the old Roman System of government and province management."
 restore_western_roman_administration_decision_confirm: "Rome rises!"
 restore_western_diocese_system_effect_tooltip:0 "The Dioceses of [GetTitleByKey('k_diocese_italia_annonaria').GetName], [GetTitleByKey('k_diocese_italia_suburbicaria').GetName] will be reestablished, and brought back under [de_jure|E] [GetGovernment('roman_autocratic_government').GetName]."
 restore_western_diocese_system_unlock_tooltip:0 "Unlocks further decisions to restore former Imperial Dioceses and eventually Praetorian Prefectures under a Hegemony."
 western_diocese_kingdoms_held_or_vassals_tt: "Hold [GetGeographicalRegion('custom_western_roman_imperial_core').GetName]"

 restore_diocese_viennensis_decision: "Restore the Dioceses of Gallia"
 restore_diocese_viennensis_decision_desc: "Following the collapse of our [Glossary( 'limes', 'LIMES_GLOSS' )], the germanic barbarians flooded Gaul, a region that remained safe within the Empire for almost four hundred years.\n\nOnce we push the invasors back to the other side of the rhine, we must reassure Imperial control over the region and restore the old Dioceses."
 restore_diocese_viennensis_decision_tooltip: "Re-establish the old Dioceses of Gallia and Viennensis"
 restore_diocese_viennensis_decision_confirm: "Gallia returns to Rome!"
 restore_diocese_gallia_effect_tooltip: "[GetTitleByKey('k_diocese_lugdunensis').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_lugdunensis').GetName]."
 restore_diocese_viennensis_effect_tooltip: "[GetTitleByKey('k_diocese_viennensis').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_viennensis').GetName]."
 viennensis_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_aquitaine').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_burgundy').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_france').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_lotharingia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_brittany').GetName]"
 wre_borders_restored_tt: "The Western Theodosian Borders have been restored."

 restore_diocese_aegyptus_decision: "Restore Roman Rule in Aegyptus"
 restore_diocese_aegyptus_decision_desc: "Generations ago, Roman Rule receded from the Nile. Leaving Egypt to warlords. Now, with the Vandal and Berber invaders pushed back, it is time to restore the old [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] and bring the rich lands of Aegyptus back under the rule of Rome.\n\nWith the old [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] reclaimed, the southern shores of the Mediterranean will once again be secure under the righteous Roman rule."
 restore_diocese_aegyptus_decision_tooltip: "Restore the old Imperial Diocese of Aegyptus"
 restore_diocese_aegyptus_decision_confirm: "Rome rises!"
 restore_diocese_aegyptus_effect_tooltip: "[GetTitleByKey('k_diocese_aegyptus').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_aegyptus').GetName]."
