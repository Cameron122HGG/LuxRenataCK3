 ere_borders_restored_tt: "The Theodosian Borders have been restored in the East"

 restore_diocese_syria_decision: "Restore the provinces of Syria Palestina"
 restore_diocese_syria_decision_desc: "After spilling rivers of barbarian blood, the lands of Antioch, Damascus, and Jerusalem must be brought back under Imperial Rule."
 restore_diocese_syria_decision_tooltip: "Restore the old Imperial Diocese of Syria Palestina"
 restore_diocese_syria_decision_confirm: "Rome rises!"
 restore_diocese_syria_effect_tooltip: "[GetTitleByKey('k_diocese_syria').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_syria').GetName]."
