 restore_diocese_mauretania_effect_tooltip: "[GetTitleByKey('k_diocese_mauretania').GetName] will be re-established and become [de_jure|E] liege of every [duchy|E] title in the [GetGeographicalRegion('custom_roman_mauretania').GetName]."
 
 restore_diocese_hispania_decision: "Restore the Diocese of Hispania"
 restore_diocese_hispania_decision_desc: "After centuries under the grasp of the Visigothic and Muslim usurpers, the Eagle of the Empire shall once again fly over Tarraco, Corduba, and Toletum.\n\nWith the old [Glossary( 'Dioecesis', 'ROMAN_diocese_GLOSS' )] reclaimed, the western shores of the Mediterranean will once again be secure under the righteous Roman rule." 
 restore_diocese_hispania_decision_tooltip: "Re-establish the old Diocese of Hispania"
 restore_diocese_hispania_decision_confirm: "Rome rises!"
 hispania_kingdoms_held_or_vassals_tt: "If the following [kingdom|E] titles are created, you must hold them, or their holders must be your [vassals|E]: \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_valencia').GetName] \n$EFFECT_LIST_BULLET$ [GetTitleByKey('k_toledo').GetName]"
