 LR_restore_western_empire_decision_desc:0 "Lux Invicta SPQR Lore"
 LR_restore_western_empire_decision_tooltip:0 "Restore the Empire of the West"
 LR_restore_western_empire_decision_confirm: "Rome rises!"
