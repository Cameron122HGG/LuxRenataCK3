 LR_diadochi_warlord.0001.t:0 "[founded_title.GetName]"
 LR_diadochi_warlord.0001.desc:0 "Like the Successors before [scoped_ruler.GetHerHim], [scoped_ruler.GetFirstName] has taken up the diadem. Before the assembled army [scoped_ruler.GetSheHe] is hailed as basileus of [founded_title.GetNameNoTier], heir to the warlords who divided the empire of Alexander."
 LR_diadochi_warlord.0001.a:0 "Let the diadem be worn."