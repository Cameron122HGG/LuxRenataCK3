l_english:
 # Formable kingdoms of post-Alexander warlords
 k_lysimachid_kingdom:0 "Lysimachid Kingdom"
 k_lysimachid_kingdom_adj:0 "Lysimachid"
 k_lysimachid_kingdom_article:0 "the "
 LR_found_lysimachid_decision:0 "Found the Lysimachid Kingdom"
 LR_found_lysimachid_decision_desc:0 "Lysimachos held Thrace for Alexander, built Lysimacheia on the Chersonese, and after Ipsos carried his kingdom across the Hellespont into Asia. Let the Lysimachid kingdom rise again astride the straits."
 LR_found_lysimachid_decision_tooltip:0 "Take the diadem and found the Lysimachid Kingdom"
 LR_found_lysimachid_decision_confirm:0 "Take the Diadem"
 LR_found_lysimachid_decision_effect_tooltip:0 "You found [GetTitleByKey('k_lysimachid_kingdom').GetName], which becomes your primary title unless you hold an empire"
 LR_found_lysimachid_decision_second_satrapy_tt:0 "Completely control the lands of one of the satrapies of Hellespontine Phrygia or Ionia"
 k_attalid_kingdom:0 "Attalid Kingdom"
 k_attalid_kingdom_adj:0 "Attalid"
 k_attalid_kingdom_article:0 "the "
 LR_found_attalid_decision:0 "Found the Attalid Kingdom"
 LR_found_attalid_decision_desc:0 "From the treasury of Pergamon, Philetairos and his heirs built a kingdom of libraries, altars and alliances. Let the Attalids rule from the acropolis of Pergamon once more."
 LR_found_attalid_decision_tooltip:0 "Take the diadem and found the Attalid Kingdom"
 LR_found_attalid_decision_confirm:0 "Take the Diadem"
 LR_found_attalid_decision_effect_tooltip:0 "You found [GetTitleByKey('k_attalid_kingdom').GetName], which becomes your primary title unless you hold an empire"
 k_mithridatid_kingdom:0 "Kingdom of Pontos"
 k_mithridatid_kingdom_adj:0 "Pontic"
 k_mithridatid_kingdom_article:0 "the "
 LR_found_mithridatid_decision:0 "Found the Kingdom of Pontos"
 LR_found_mithridatid_decision_desc:0 "Mithridates Ktistes, companion of Antigonos, fled to the hills of Pontos and founded a kingdom that would one day defy Rome itself. Let the house of Mithridates reign at Amaseia again."
 LR_found_mithridatid_decision_tooltip:0 "Take the diadem and found the Kingdom of Pontos"
 LR_found_mithridatid_decision_confirm:0 "Take the Diadem"
 LR_found_mithridatid_decision_effect_tooltip:0 "You found [GetTitleByKey('k_mithridatid_kingdom').GetName], which becomes your primary title unless you hold an empire"
 k_graeco_bactrian_kingdom:0 "Graeco-Bactrian Kingdom"
 k_graeco_bactrian_kingdom_adj:0 "Graeco-Bactrian"
 k_graeco_bactrian_kingdom_article:0 "the "
 LR_found_graeco_bactrian_decision:0 "Found the Graeco-Bactrian Kingdom"
 LR_found_graeco_bactrian_decision_desc:0 "Diodotos, satrap of Baktra, threw off the Seleukids and made the thousand cities of Bactria a kingdom of their own. Let a Hellenic king rule from Baktra to Marakanda once more."
 LR_found_graeco_bactrian_decision_tooltip:0 "Take the diadem and found the Graeco-Bactrian Kingdom"
 LR_found_graeco_bactrian_decision_confirm:0 "Take the Diadem"
 LR_found_graeco_bactrian_decision_effect_tooltip:0 "You found [GetTitleByKey('k_graeco_bactrian_kingdom').GetName], which becomes your primary title unless you hold an empire"
 k_eumenid_kingdom:0 "Eumenid Kingdom"
 k_eumenid_kingdom_adj:0 "Eumenid"
 k_eumenid_kingdom_article:0 "the "
 LR_found_eumenid_decision:0 "Found the Eumenid Kingdom"
 LR_found_eumenid_decision_desc:0 "Eumenes of Kardia, Alexander's secretary, held Kappadokia for the Argeads against every rival general. What he defended for the royal house, his heirs may now rule as their own."
 LR_found_eumenid_decision_tooltip:0 "Take the diadem and found the Eumenid Kingdom"
 LR_found_eumenid_decision_confirm:0 "Take the Diadem"
 LR_found_eumenid_decision_effect_tooltip:0 "You found [GetTitleByKey('k_eumenid_kingdom').GetName], which becomes your primary title unless you hold an empire"
 k_peithonid_kingdom:0 "Peithonid Kingdom"
 k_peithonid_kingdom_adj:0 "Peithonid"
 k_peithonid_kingdom_article:0 "the "
 LR_found_peithonid_decision:0 "Found the Peithonid Kingdom"
 LR_found_peithonid_decision_desc:0 "Peithon, satrap of Media and strategos of the Upper Satrapies, sought to rule the East from Ekbatana. Let his house claim the kingship he reached for."
 LR_found_peithonid_decision_tooltip:0 "Take the diadem and found the Peithonid Kingdom"
 LR_found_peithonid_decision_confirm:0 "Take the Diadem"
 LR_found_peithonid_decision_effect_tooltip:0 "You found [GetTitleByKey('k_peithonid_kingdom').GetName], which becomes your primary title unless you hold an empire"
 e_lysimachid_empire:0 "Lysimachid Empire"
 e_lysimachid_empire_adj:0 "Lysimachid"
 e_lysimachid_empire_article:0 "the "
 LR_reform_lysimachid_empire_decision:0 "Proclaim the Lysimachid Empire"
 LR_reform_lysimachid_empire_decision_desc:0 "The Lysimachid Kingdom has outgrown a single satrapy. With Thrake secured and more of its old lands in hand, let it be proclaimed an empire and govern its satrapies as the great Successors did."
 LR_reform_lysimachid_empire_decision_tooltip:0 "Reform the Lysimachid Kingdom into the Lysimachid Empire, which can restore its satrapies"
 LR_reform_lysimachid_empire_decision_confirm:0 "Proclaim the Empire"
 LR_reform_lysimachid_empire_decision_two_satrapies_tt:0 "Completely control the lands of at least two of the satrapies of Hellespontine Phrygia, Ionia and Lydia"
 LR_reform_lysimachid_empire_decision_effect_tooltip:0 "You found [GetTitleByKey('e_lysimachid_empire').GetName], with [GetTitleByKey('k_lysimachid_kingdom').GetName] as part of it, and can restore its satrapies"
