l_english:
 ###Reform to Feudal from High Tribal
 convert_great_tribal_to_civ_group_decision: "Adopt Civilizational Governance"
 convert_great_tribal_to_civ_group_decision_desc: "Our tribe has grown in size and complexity, and it is clear that our current form of governance is no longer sufficient to manage our realm. It is time to adopt a more advanced form of governance, one that will allow us to better organize our society and ensure the prosperity of our people."  
 convert_great_tribal_to_civ_group_decision_tooltip: "I give law and order to my people, and they will follow me into a new era of governance."
 convert_great_tribal_to_civ_group_decision_confirm: "Establish Law and Order!"

 convert_classical_decision: "Adopt Classical Feudalism"
 convert_classical_decision_desc: "My Realm has deep contacts with Classical Religions and their way of governance, perhaps I should consider leaning more into them..."  
 convert_classical_decision_tooltip: "Light is not Extinguished!"
 convert_classical_decision_confirm: "Light is not Extinguished!"  
 
 convert_despotic_decision: "Adopt Satrapy System"
 convert_despotic_decision_desc: "My Realm has been deeply influence by ancient forms of governance, perhaps I should consider leaning more into them..."  
 convert_despotic_decision_tooltip: "Just like the Ancients!"
 convert_despotic_decision_confirm: "Just like the Ancients!"

 abandon_ancient_government_decision: "Simplify Realm Structure"
 abandon_ancient_government_decision_desc: "While My realms form of governance is rather sophisticated, it can become rather unwieldy at times, perhaps it is time to simplify My mode of governance..."  
 abandon_ancient_government_decision_tooltip: "Sometimes simpler is better!"
 abandon_ancient_government_decision_confirm: "Sometimes simpler is better!"

 adopt_gaul_gov_decision: "Adopt Gaul's Government Customs"
 adopt_gaul_gov_decision_desc: "Through centuries Gaul has developed quite unique customs around their government form. Perhaps considering our current ties to Gaul it would be a good idea to lean more into them?"  
 adopt_gaul_gov_decision_tooltip: "May Gauls Sacred Light Illuminate Us!"
 adopt_gaul_gov_decision_confirm: "May Gauls Sacred Light Illuminate Us!" 
 
 LR_great_tribal_vassal_adoption: "Vassals will adopt your new Government as well"
 
 ##LR government events
 LR_gov_events.0001.t:0 "Solidification of Feudal Relations"
 LR_gov_events.0001.desc:0 "The informal becomes formal. As the [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], I have concluded that we must fully adopt feudalism and its principles if we shall continue to prosper. It is the crucial next step on our road to greatness!"
 LR_gov_events.0001.a:0 "Long live [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]!"
 LR_gov_events.0002.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]" 
 LR_gov_events_abandon_great_tribal: "[GetGovernment('great_tribal_government').GetName] has been abandoned"
 
 LR_gov_events.0003.t:0 "A New form of governance"
 LR_gov_events.0003.desc:0 "My Realm reforms. As the [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], I have concluded that we must adopt more advanced form of governance!"
 LR_gov_events.0003.a:0 "May it be for the best!"
 LR_gov_events.0003.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"

 LR_gov_events.0007.t:0 "A Simple Realm"
 LR_gov_events.0007.desc:0 "As the [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], I have concluded that our current form of governance is unsustainable. Thus the structure of it needs to be simplified."
 LR_gov_events.0007.a:0 "May it be for the best..."
 LR_gov_events.0007.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]" 
 
 LR_gov_events.0009.t:0 "A Realm of Gaul"
 LR_gov_events.0009.desc:0 "As the [ROOT.Char.GetTitleAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip], I have concluded that it will be most wise to adopt our government in line with the customs of Gaul, for betterment of our realm."
 LR_gov_events.0009.a:0 "May it be for the best..."
 LR_gov_events.0009.opening:0 "[actor.Custom2('AppropriateGreeting', ROOT.Char)]"