l_english:
 # Diadochi hegemonies
 h_antipatrid_hegemony:0 "Antipatrid Hegemony"
 h_antipatrid_hegemony_adj:0 "Antipatrid"
 h_antipatrid_hegemony_article:0 "the "
 LR_reform_antipatrid_hegemony_decision:0 "Proclaim the Antipatrid Hegemony"
 LR_reform_antipatrid_hegemony_decision_desc:0 "The Antipatrid realm now holds whole strategiai of Alexander's empire. Let it be proclaimed a hegemony over the strategoi and satraps, second only to the throne of Alexander himself."
 LR_reform_antipatrid_hegemony_decision_tooltip:0 "Raise the [GetTitleByKey('e_antipatrid_empire').GetName] into the Antipatrid Hegemony"
 LR_reform_antipatrid_hegemony_decision_confirm:0 "Proclaim the Hegemony"
 LR_reform_antipatrid_hegemony_decision_effect_tooltip:0 "[GetTitleByKey('e_antipatrid_empire').GetName] becomes [de_jure|E] part of the Antipatrid Hegemony. The satrapies your realm holds move into their strategiai under it, and satrapies you restore from now on join their strategia, unless a rival hegemony already holds it."
