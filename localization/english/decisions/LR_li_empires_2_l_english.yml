l_english:
 # Hunnic Empire (ported from Lux Invicta's e_huns)
 h_hunnic_empire: "Hunnic Empire"
 h_hunnic_empire_adj: "Hunnic"
 h_hunnic_empire_article: "the "
 form_hunnic_empire_decision: "Forge the Hunnic Empire"
 form_hunnic_empire_decision_desc: "Attila's horsemen once rode from the Don to the fields of Catalaunum, and kings from the Rhine to the Caucasus paid him tribute. With the Huns behind us and Sarkel, Pannonia, Bohemia and Chalons in our grip, his empire can rise again."
 form_hunnic_empire_decision_tooltip: "Claim Attila's empire from the Don to Gaul."
 form_hunnic_empire_decision_confirm: "The Scourge returns!"

 # Revive Hatti (ported from Lux Invicta's e_hittite)
 LR_revive_hatti_decision: "Revive Hatti"
 LR_revive_hatti_decision_desc: "From Hattusa the Great Kings of Hatti once ruled Anatolia and warred with Egypt and Assyria. The Storm God and the Sun Goddess of Arinna are honoured again in their old city. Let the land of Hatti rise as it was."
 LR_revive_hatti_decision_tooltip: "Raise the empire of the Hittites again from Hattusa."
 LR_revive_hatti_decision_confirm: "For the Sun Goddess of Arinna!"
 LR_revive_hatti_dejure_tt: "The Bronze Age kingdoms of [GetTitleByKey('e_bronze_hatti').GetName] are laid out again over Anatolia as its de jure lands, and rulers of the Anatolian faith may create them in any age. You gain [GetTitleByKey('e_bronze_hatti').GetName], and [GetTitleByKey('k_bronze_hatti').GetName] if no one holds it."

 # Palmyrene hegemony (ported from Lux Invicta's e_palmyra)
 LR_reform_palmyrene_hegemony_decision: "Proclaim Zenobia's Empire"
 LR_reform_palmyrene_hegemony_decision_desc: "Queen Zenobia once held Syria, Egypt and Anatolia in Palmyra's name. With Jerusalem, Alexandria and Paphlagonia ours, the Palmyrene Empire can claim her full inheritance."
 LR_reform_palmyrene_hegemony_decision_tooltip: "Raise the Palmyrene Empire to a hegemony over the East."
 LR_reform_palmyrene_hegemony_decision_confirm: "For Tadmor and Zenobia!"
 LR_reform_palmyrene_hegemony_decision_effect_tt: "You gain [GetTitleByKey('h_palmyrene_empire').GetName]. [GetTitleByKey('e_palmyrene_empire').GetName], [GetTitleByKey('e_levant').GetName] and [GetTitleByKey('e_egypt').GetName] become its de jure parts."
