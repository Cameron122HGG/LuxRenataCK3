l_english:
 # Egypt split (2026-11-06): reuniting Upper and Lower Egypt
 LR_reunite_egypt_decision: "Reunite the Two Lands"
 LR_reunite_egypt_decision_desc: "Since the Fatimid crown lost its grip, the Nile has been divided between the lords of the Delta and the lords of the Sa'id. Whoever holds both lands may wear the double crown and rule Egypt as one kingdom again."
 LR_reunite_egypt_decision_tooltip: "Unite Upper and Lower Egypt into one kingdom."
 LR_reunite_egypt_decision_confirm: "Wear the double crown"
 LR_reunite_egypt_dejure_tt: "The duchies of [GetTitleByKey('k_upper_egypt').GetName] and [GetTitleByKey('k_lower_egypt').GetName] become de jure part of [GetTitleByKey('k_egypt').GetName], which becomes de jure part of [GetTitleByKey('e_egypt').GetName]. Your own [GetTitleByKey('k_upper_egypt').GetName] and [GetTitleByKey('k_lower_egypt').GetName] titles are destroyed."
