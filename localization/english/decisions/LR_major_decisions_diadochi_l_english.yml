 #convert_to_classical_decision: "Convert to Classical Government"
 #convert_to_classical_decision_desc: "Form a government of the Graeco-Roman World"
 #convert_to_classical_decision_tooltip: "Tooltip shown when hovering over it"
 #convert_to_classical_decision_confirm: "The text on the confirm button"

 LR_diadochi_seleukid_kingdom_decision: "Restore the Seleukid Kingdom"
 LR_diadochi_seleukid_kingdom_confirm: "Let the Elephant of Seleukos stand strong again!"
 LR_diadochi_seleukid_kingdom_desc: "After the death of Alexander the Great, Seleukos I forged a colossal Hellenic empire, from the Syrian coasts to the gates of Persia and India, uniting the East in Macedonian glory. His successors upheld it with fire and steel, but shadows devoured it. Now, with lands reconquered and the favor of the gods, you can revive this titanic heritage: the Seleukid Kingdom will be reborn from its ashes."
 LR_diadochi_seleukid_kingdom_tooltip: "Create the Kingdom of Seleukos, restoring Hellenistic rule over the ancient lands of the Seleukid Empire."
 LR_diadochi_seleukid_kingdom_effect_tooltip: "From the dust of history rises the Hellenic colossus! The Seleukid Kingdom is reborn."

 LR_diadochi_seleukid_empire_decision: "Restore the Seleukid Empire"
 LR_diadochi_seleukid_empire_desc: "The Seleukid Kingdom is but a shadow of its former glory. The true dream of Seleukos was to rule an empire that spanned from the Mediterranean to the Indus, a Hellenistic colossus that united East and West under Macedonian rule. Now, with our armies strengthened and our rivals weakened, we can reclaim this imperial legacy and restore the Seleukid Empire to its rightful place as the master of the ancient world."
 LR_diadochi_seleukid_empire_tooltip: "Unify the territories of the ancient Seleukid Empire, from the Mediterranean to the Indus, to forge a Hellenistic dominion."
 LR_diadochi_seleukid_empire_confirm: "Let the world tremble before the might of the Seleukid Empire!"
 LR_diadochi_seleukid_empire_effect_tooltip: "Form the Seleukid Empire and claim hegemony over the Hellenistic world. Your dynasty will be feared and respected as a true imperial power."

 LR_diadochi_ptolemaic_kingdom_decision: "Establish the Ptolemaic Kingdom of Egypt"
 LR_diadochi_ptolemaic_kingdom_desc: "In the wake of Alexander's conquests, Ptolemy I Soter carved out a kingdom in the land of the Nile. A land where Greek culture met the ancient traditions of Egypt, forging a unique Hellenistic identity. Now, with our armies strengthened and our rivals weakened, we can revive this ancient kingdom and restore the Ptolemaic legacy to its rightful place as the master of Egypt."
 LR_diadochi_ptolemaic_kingdom_tooltip: "Restore the Hellenistic legacy of the Ptolemies and claim the throne of ancient Egypt as a beacon of culture and power."
 LR_diadochi_ptolemaic_kingdom_confirm: "Let the Nile carry the news: a new Pharaoh rises."
 LR_diadochi_ptolemaic_kingdom_effect_tooltip: "Claim the Ptolemaic Kingdom of Egypt and forge a Hellenistic legacy. Your lineage will be remembered as the restorer of a golden age."

 LR_diadochi_ptolemaic_empire_decision: "Establish the Ptolemaic Empire"
 LR_diadochi_ptolemaic_empire_desc: "Egypt is no longer just a kingdom; it is the heart of a new empire. From the deserts of Nubia to the islands of the Mediterranean, we have unified the soul of the ancient world. Here, the wisdom of Greek philosophers merges with the mysteries of Egyptian priests and the riches of African trade routes. This is the ultimate legacy of Alexander: a Hellenic power that does not look to Macedonia, but rules from the banks of the Nile."
 LR_diadochi_ptolemaic_empire_tooltip: "Unify the territories of the ancient Hellenistic empire, from the Nile to Cyprus and Jerusalem, to forge a Mediterranean dominion."
 LR_diadochi_ptolemaic_empire_confirm: "Let the world know that the heir of Alexander rules the waves."
 LR_diadochi_ptolemaic_empire_effect_tooltip: "Form the Ptolemaic Empire, unifying Egypt, Cyprus, and the Levant. Your court will become the Hellenistic beacon of the Mediterranean."
 
 LR_diadochi_antigonid_kingdom_decision: "Establish the Antigonid Kingdom"
 LR_diadochi_antigonid_kingdom_desc: "In the wake of Alexander's conquests, Antigonos I Monophthalmos carved out a kingdom in the rugged heart of Asia Minor. A land where Greek culture met the traditions of Anatolia, forging a unique Hellenistic identity. Now, with our armies strengthened and our rivals weakened, we can revive this ancient kingdom and restore the Antigonid legacy to its rightful place as the master of Greece."
 LR_diadochi_antigonid_kingdom_tooltip: "Found the legendary Hellenistic kingdom in the heart of Anatolia, where East and West meet."
 LR_diadochi_antigonid_kingdom_confirm: "In the land of the blind, the one-eyed man is king."
 LR_diadochi_antigonid_kingdom_effect_tooltip: "Form the Antigonid Kingdom and end the petty kingdoms of Asia Minor."

 LR_diadochi_antigonid_empire_decision: "Establish the Antigonid Empire"
 LR_diadochi_antigonid_empire_desc: "The realm of the Antigonids"
 LR_diadochi_antigonid_empire_tooltip: "Consolidate dominion over the heart of Central Asia, creating a Hellenistic empire ruling from the steppes to the Persian mountains."
 LR_diadochi_antigonid_empire_confirm: "Let Central Asia tremble before its new master!"
 LR_diadochi_antigonid_empire_effect_tooltip: "Form the Antigonid Empire, unifying Bactria, Sogdiana, and the Persian trade routes. Your court will become the Hellenistic beacon of Asia."

 LR_diadochi_antipatrid_kingdom_decision: "Restore the Kingdom of Antipater"
 LR_diadochi_antipatrid_kingdom_desc: "Antipater was the loyal regent of Alexander the Great, entrusted with the governance of Macedonia and Greece during the conqueror's eastern campaigns. Now, with our armies strengthened and our rivals weakened, we can revive this ancient kingdom and restore the Antipatrid legacy to its rightful place as the master of the Greek world."
 LR_diadochi_antipatrid_kingdom_tooltip: "Reclaim the throne of Macedonia and unite the heart of Hellenism under your rule."
 LR_diadochi_antipatrid_kingdom_confirm: "Let the Greek cities bow to our power!"
 LR_diadochi_antipatrid_kingdom_effect_tooltip: "Form the Antipatrid Kingdom and end the divisions of Greece."

 LR_diadochi_antipatrid_empire_decision: "Establish the Antipatrid Empire"
 LR_diadochi_antipatrid_empire_desc: "The Macedonian heartland is no longer just a kingdom; it is the core of a new empire. From the plains of Thessaly to the mountains of Epirus, we have unified the soul of Greece. Here, the wisdom of Greek philosophers merges with the valor of Macedonian warriors and the culture of Hellenistic cities. This is the ultimate legacy of Alexander: a Hellenic power that does not look to Asia, but rules from the land where it all began."
 LR_diadochi_antipatrid_empire_tooltip: "Unify the territories of the ancient Antipatrid Empire, from Thessaly to Epirus, to forge a Hellenistic dominion."
 LR_diadochi_antipatrid_empire_confirm: "Let the legacy of the Successors be reborn in Macedonia!"
 LR_diadochi_antipatrid_empire_effect_tooltip: "Form the Antipatrid Empire, unifying Macedonia, Thessaly, and Epirus. Your court will become the Hellenistic beacon of Greece."

 LR_diadochi_alexander_empire_decision: "Claim the mantle of Alexandros Megas"
 LR_diadochi_alexander_empire_desc: "After centuries, the dream of Alexander the Great can be fulfilled once more. His vision of a united empire, stretching from the Hellenic heartlands to the farthest reaches of Asia, can be realized under our banner. With our armies strengthened and our rivals weakened, we can claim the legacy of the great conqueror and restore his empire to its former glory."
 LR_diadochi_alexander_empire_tooltip: "Establish the empire of Alexander the Great, uniting the Hellenistic world under your rule."
 LR_diadochi_alexander_empire_confirm: "Suceed Alexandros Megas!"
 LR_diadochi_alexander_empire_effect_tooltip: "." 
 ##Reforge Alexander's Empire
 LR_create_alexander_hegemony_decision: "Revive the Dream of Alexander"
 LR_create_alexander_hegemony_decision_desc: "Alexander is perhaps the most important person in history, and he surely is for the Hellens. And his dream of conquest, of cultural exchange, is not dead! \nWe will revive Empire of his dreams, or even more than Empire!"  
 LR_create_alexander_hegemony_decision_tooltip: "Arise From the Ashes!"
 LR_create_alexander_hegemony_decision_confirm: "Arise From the Ashes!"
 
 world_alexanders_empire: "Empire of Alexandros Megas"
 holds_imperial_title_tooltip: "Primary Title is an Empire"

 LR_diadochi_seleukid_second_satrapy_tt: "Completely control the lands of one other Seleukid satrapy: Kilikia, Mesopotamia, Babylonia, Susiane, Media, Persis or Parthia"
 LR_diadochi_antigonid_second_satrapy_tt: "Completely control the lands of one other Antigonid satrapy: Hellespontine Phrygia, Ionia, Kappadokia, Paphlagonia or Pontos"
