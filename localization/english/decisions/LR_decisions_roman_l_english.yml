#Grain Dole
 wr_reinstitute_grain_dole_decision: "Reinstitute the Grain Dole"
 wr_reinstitute_grain_dole_decision_desc: "In the ancient Western Roman Empire, the citizens of Rome enjoyed the benefit of regular distributions of free or cheap bread. This tradition was interrupted by the decline of the Empire and the loss of Africa. Now that we have rebuilt the Empire, any emperor who restores this ancient tradition will win the fervent support of the people."
 wr_reinstitute_grain_dole_decision_tooltip: "Implement the bread distribution system to the capital's people"
 wr_reinstitute_grain_dole_decision_confirm: "Open the Granaries!"
 enough_granaries_in_africae: "At least 3 counties in the region of [GetGeographicalRegion('custom_roman_africa').GetName] have built [GetBuilding('cereal_fields_05').GetName] or higher"
 wr_reconfirm_grain_dole_decision_tooltip: "Reconfirm the bread distributions to the people of the capital"
 wr_reconfirm_grain_dole_decision_confirm: "$reinstitute_grain_dole_decision_confirm$"
 wr_reconfirm_grain_dole_decision_tt: "Grain Dole Reconfirmed"

# Restore Rome as Capital
 br_set_capital_rome_decision: "Restore Rome as Capital"
 br_set_capital_rome_decision_confirm: "Rebuild the Empire's legitimate throne!"
 br_set_capital_rome_decision_desc: "Though Milan's iron walls shield against northern threats, only Rome's ruins can reignite the imperial soul.\n\nPlant the eagle standard upon Capitoline Hill once more—let the shadow of Aurelian Walls fall upon newly conquered lands, and the Tiber's currents purge the rust of barbarian occupation."
 br_set_capital_rome_decision_tooltip: "Restore Rome as your capital."

 byzantium_delenda_est_tooltip: "The [GetTitleByKey('e_byzantium').GetNameNoTier] does not exist."

# Destroy The Vatican
 eoe_destroy_the_vatican_decision: "Destroy the Church of Saint Peter"
 eoe_destroy_the_vatican_decision_desc: "We have won. We have reconquered our historical heartlands, we have dismantled the Galilean priesthood and driven out their pathetic 'Pope'. The only thing that remains now is to destroy the last symbol if this foul religion. The chruch of Saint Peter on Vatican Hill."
 eoe_destroy_the_vatican_decision_effect_tooltip: "The [GetBuilding('holy_site_st_peters_basilica_01').GetName] will be destroyed and you will be presented with a choice."
 eoe_vatican_must_not_exist_tooltip: "[GetTitleByKey('k_papal_state').GetDefinitiveName] does not exist."
 eoe_destroy_the_vatican_decision_confirm: "Vatican Hill shall burn!"






