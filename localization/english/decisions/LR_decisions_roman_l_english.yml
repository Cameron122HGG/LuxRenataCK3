# Convert to Hellenism#
 convert_hellenism_religion_decision:0 "Embrace the Old Gods"
 convert_hellenism_religion_decision_desc:0 "The ancient gods have never left; they have merely waited in the long night for the call. Now, the time has come. This decision will guide you and your court to reclaim the ancient covenant your ancestors made with heaven and earth, allowing Jupiter's thunder, Minerva's wisdom, and Venus's glory to once again illuminate your lands and people."
 convert_hellenism_religion_decision_confirm:0 "Relight the Sacred Flame"
 convert_hellenism_religion_decision_tooltip:0 "Formally restore the worship of the Olympian gods or related ancient deities. This will change your state religion, profoundly affecting your relations with those of the same faith and the outside world."
 convert_hellenism_decision_tooltip_1:0 "You will personally convert to the chosen polytheistic faith and unlock the ancient right to construct its corresponding altars and temples."
 convert_hellenic_pagan_desc:0 "Hellenic Paganism"
 hellenic_pagan_tooltip:0 "Hellenic pagans worship the gods of ancient Greece and Rome, said to dwell on Mount Olympus. Each deity has a unique aspect and is venerated in their own way by their followers."
 convert_indo_hellenism_desc:0 "Yavanadharma"
 convert_roman_pagan_desc:0 "Romanism"
 roman_pagan_tooltip:0 "Romanism refers to the system of beliefs and traditions followed by the Romans, influenced by their historical neighbors in Magna Graecia and Etruria during the Republican era."
 convert_imperial_cult_desc:0 "Imperial Cult"
 convert_hypsistarian_pagan_desc:0 "Hypsistarianism"
 hypsistarian_pagan_tooltip:0 "The Hypsistarians are an eclectic group, a branch of Greek paganism heavily influenced by Jewish thought, originating in Asia Minor and the Black Sea. Their worship centers on the Most High God, Hypsistos, without denying the existence of other gods."
 convert_sol_invictus_desc:0 "Sol Invictus"
 sol_invictus_tooltip:0 "Sol was an early Roman sun god who seemed to vanish in the 1st century but was later revived during the reign of Emperor Aurelian."
 convert_julianism_desc:0 "Julianism"
 CHOOSE_RELIGION_BUTTON:0 "Survey the Paths"
 CHOOSE_HELLENIC_BUTTON:0 "Undergo the Rites"

