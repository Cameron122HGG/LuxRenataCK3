# Reunite the two halves of Rome
 form_rome_decision:0 "Re-establish the Roman Empire"
 form_rome_decision_desc:0 "Roman civilization cannot survive if its empire is split in two; numerous strifes plague both the Western and the Eastern Empires, ranging from Germanic migrations to political turmoil and economic collapse. The people of the Eternal City cannot survive if Rome’s empire remains divided. The best course of action is to formally reunite the west and the east under one emperor, one crown, and one empire."
 form_rome_decision_tooltip:0 "Rome reunited"
 form_rome_decision_confirm:0 "Restitutor Orbis"

# Establish Western Rome
 western_roman.0030.t:0 "The Legacy of Nepos: Purple Chamber and New Banner"
 western_roman.0030.desc:0 "Victorious banners snap above Rome's walls, heralding Western Rome's rebirth from the ashes! The yoke of foreign rule is shattered as ancient laws return to Italy's heartland. This monumental feat shakes the world.\n\nYet triumph's joy is swiftly overshadowed by the East's looming presence. Upon the map lies the vast realm of another 'Rome' - Constantinople. The millennial capital never ceased proclaiming itself Rome's sole heir. Its Emperor, court, legions, wealth, and undisputed legitimacy forged through unbroken tradition form an inescapable reality."
 western_roman.0030.a:0 "Embrace Eastern Brethren: Alliance serves both our interests."
 western_roman.0030.a.flavor:0 "Gain priceless 'Roman' endorsement! Deter foes and share power! The cost? Sacrifices must be made for the future!"
 western_roman.0030.b:0 "The time has come to forge our own path."
 western_roman.0030.b.flavor:0 "The East, self-proclaimed sole heir of Rome, views this sudden 'Western brother' with complex emotions: ties of blood through shared history and faith, hypersensitivity to legitimacy, and mingled desire and wariness toward influence in Italy and the Western Mediterranean.\n\nThis demands utmost prudence."

 restore_the_west:0 "Reunite the Western Roman Empire"
 restore_the_west_desc:0 "The former lands of a glorious empire are now overrun by wretched kings, a mere shadow of what once was. The time to rise from the ashes has come."
 restore_the_west_tooltip:0 "Rome restored."
 restore_the_west_confirm:0 "Vae Victīs"

 western_roman.001.t:0 "The Western Empire Reforged"
 western_roman.001.desc:0 "Once again the eagle has risen from the ashes. Rome thrives under my name. My law stretches from the mighty Carthage and the bustling cities of Africa to the beautiful cities of Italia Annonaria, from Sicily to Dalmatia. The heartlands of the empire are again reunited and from the glorious city of Rome we will start a new age of light for the known world."
 western_roman.001.a:0 "Roma Invicta!"

 convert_roman_culture_decision:0 "Forge Roman Heritage"

