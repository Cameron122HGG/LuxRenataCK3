#Praetorian Prefectures
 reestablish_praetorian_prefectures_decision:0 "Reestablish the Praetorian Prefectures"
 reestablish_praetorian_prefectures_decision_desc:0 "Since the times of Diocletian and Constantine, the Empire has been governed through the system of Four Great Praetorian Prefectures, like four pillars holding up the firmament of the Empire. The Praetorian Prefects are extensions of His Majesty's will, governing military and administrative affairs, upholding law and taxation. This ingenious structure once breathed new life into the Empire in its time of crisis. Now that the imperial territories have been restored to their vast extent, the wisdom of the old system deserves to be revived."
 reestablish_praetorian_prefectures_decision_tooltip:0 "Reestablish the Praetorian Prefectures."
 reestablish_praetorian_prefectures_decision_tooltip_1:0 "Territories will be reorganized."
 reestablish_praetorian_prefectures_decision_confirm:0 "Roma Invicta!"

#Establish Western Roman Hegemony
 wr_ascent_decision:0 "Reforge the Western Roman Hegemony"  
 wr_ascent_decision_desc:0 "The ancestral lands of Western Rome have all been reclaimed, but our achievement far surpasses the declining Empire of old. It is time to proclaim the dawn of a new era: a powerful hegemony ruling the Western world in Rome's name has been born."
 wr_ascent_decision_tooltip:0 "Reforge the Hegemony"
 wr_ascent_decision_tooltip_1:0 "Territories will be reorganized."
 wr_ascent_decision_confirm:0 "Roma Invicta!"



