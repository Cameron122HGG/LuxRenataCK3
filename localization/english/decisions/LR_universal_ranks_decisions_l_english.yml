l_english:
 # LR 2026-11-25 universal ranks (tools/universal_ranks/build_universal_ranks.py)
 LR_proclaim_the_everlasting_kingdom_decision: "Proclaim the Everlasting Kingdom"
 LR_proclaim_the_everlasting_kingdom_decision_desc: "My household army and my scribes have made one realm out of many kingdoms. Let it be proclaimed the kingdom that shall not pass away, as the prophet saw it."
 LR_proclaim_the_everlasting_kingdom_decision_tooltip: "Raise the #V $mamlakah_imperial_government$#! to the #V $mamlakah_alma_government$#! for as long as you rule at the hegemony tier."
 LR_proclaim_the_everlasting_kingdom_decision_confirm: "Proclaim the kingdom"
 LR_proclaim_the_glory_of_kings_decision: "Proclaim the Glory of Kings"
 LR_proclaim_the_glory_of_kings_decision_desc: "The kings of my line are the heirs of Solomon, and the Ark rests in my realm. Let the glory of kings be proclaimed, so that every ruler of the earth knows the throne it belongs to."
 LR_proclaim_the_glory_of_kings_decision_tooltip: "Raise the #V $nilotic_imperial_government$#! to the #V $nilotic_kebra_government$#! for as long as you rule at the hegemony tier."
 LR_proclaim_the_glory_of_kings_decision_confirm: "Proclaim the glory"
 LR_swear_the_great_union_decision: "Swear the Great Union"
 LR_swear_the_great_union_decision_desc: "The kings who bring me tribute are many, and gold flows to my court from every road. Let them gather and swear the great union, as the kings of Manden swore at Kurukan Fuga."
 LR_swear_the_great_union_decision_tooltip: "Raise the #V $sudanic_imperial_government$#! to the #V $sudanic_kurufaba_government$#! for as long as you rule at the hegemony tier."
 LR_swear_the_great_union_decision_confirm: "Gather the kings"
