l_english:
 # LR Roman Republics (Silk & Silver / 1.21), written 2026-11-17.
 e_western_roman_republic: "Roman Republic"
 e_western_roman_republic_adj: "Roman"
 e_western_roman_republic_article: "the "
 e_eastern_roman_republic: "Commonwealth of the Romans"
 e_eastern_roman_republic_adj: "Roman"
 e_eastern_roman_republic_article: "the "

 LR_restore_western_roman_republic_decision: "Restore the Roman Republic"
 LR_restore_western_roman_republic_decision_desc: "Kings and emperors have ruled from the Seven Hills for centuries, yet the city never forgot the Senate and the People of Rome. With Rome in our hands and Italy secure, the Res Publica can rise again."
 LR_restore_western_roman_republic_decision_tooltip: "Restore the Senate and the People of Rome"
 LR_restore_western_roman_republic_decision_confirm: "Senatus Populusque Romanus!"

 LR_restore_eastern_roman_republic_decision: "Restore the Commonwealth of the Romans"
 LR_restore_eastern_roman_republic_decision_desc: "The Queen of Cities has known emperors, patriarchs and usurpers, but her people still call themselves Romans and their state a commonwealth, a Politeia. With Constantinople ours and Macedonia secure, the East can be a republic once more."
 LR_restore_eastern_roman_republic_decision_tooltip: "Restore the Politeia tōn Rhōmaiōn"
 LR_restore_eastern_roman_republic_decision_confirm: "For the Commonwealth!"

 LR_restore_roman_republic_prefecture_italia_tt: "Every [diocese|E] of the Prefecture of Italia is held in your [realm|E]"
 LR_restore_roman_republic_prefecture_macedonia_tt: "Every [diocese|E] of the Prefecture of Macedonia is held in your [realm|E]"
 LR_restore_roman_republic_make_rome_capital_tt: "You may choose to make [GetTitleByKey('c_roma_urbs').GetName] your new [capital|E]"
 LR_restore_roman_republic_make_constantinople_capital_tt: "You may choose to make [GetTitleByKey('c_byzantion').GetName] your new [capital|E]"

 LR_roman_republic.0001.t: "The Republic of Rome"
 LR_roman_republic.0001.desc: "The fasces are carried through the Forum once more. Senators in purple-bordered togas take their seats, and the crowd that gathers on the Capitoline hears the old words spoken anew: the Senate and the People of Rome. Whatever crowns rose and fell in the long centuries since, the Republic stands again."
 LR_roman_republic.0001.a: "All roads shall lead to Rome once more."
 LR_roman_republic.0001.b: "Our own city will serve as the seat of the Senate."
 LR_roman_republic.0002.t: "The Commonwealth of the Romans"
 LR_roman_republic.0002.desc: "Beneath the dome of the Holy Wisdom and along the Mese, heralds proclaim that the Romans of the East are ruled by no master but their own commonwealth. The Senate of the New Rome, long a hall of courtiers, now sits as the voice of the Politeia."
 LR_roman_republic.0002.a: "The Queen of Cities shall be our seat."
 LR_roman_republic.0002.b: "Our own city will serve as the seat of the Senate."
