l_english:
 # Hellenic League (ported from Lux Invicta's e_hellenic, "The Hellenic Hegemony")
 e_hellenic_league: "Hellenic League"
 e_hellenic_league_adj: "Hellenic"
 e_hellenic_league_article: "the "

 form_hellenic_league_decision: "Found the Hellenic League"
 form_hellenic_league_decision_desc: "The Greeks of the Aegean have served Roman emperors, Persian kings and the heirs of Alexander. With Athens in our hands and the cities of the Peloponnese, Ionia, Cyprus and the Euxine with us, the Hellenes can stand together under their own league."
 form_hellenic_league_decision_tooltip: "Unite the Greek cities of the Aegean in a league of their own."
 form_hellenic_league_decision_confirm: "For the freedom of the Hellenes!"
 form_hellenic_league_not_roman_tt: "You are not a Roman emperor"
 LR_form_hellenic_league_dejure_tt: "[GetTitleByKey('k_hellas').GetName], [GetTitleByKey('k_sparta').GetName], [GetTitleByKey('k_pergamon').GetName] and [GetTitleByKey('k_cyprus').GetName] are laid out over their old lands and become de jure parts of the [GetTitleByKey('e_hellenic_league').GetName]. Roman themes and provinces left without land are dissolved."
