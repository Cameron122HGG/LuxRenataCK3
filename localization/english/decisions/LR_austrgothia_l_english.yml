l_english:
 # Austrgothia (ported from Lux Invicta's e_egoth)
 e_austrgothia: "Austrgothia"
 e_austrgothia_adj: "Austrgothic"

 form_austrgothia_decision: "Raise Austrgothia"
 form_austrgothia_decision_desc: "The Greutungi once ruled from the Danube to the Don before the Huns broke them. Their kin still hold the Crimean hills and the Danubian plain. United again, the eastern Goths can raise a realm worthy of Ermanaric."
 form_austrgothia_decision_tooltip: "Unite the eastern Goths from Crimea to the Danube."
 form_austrgothia_decision_confirm: "For the realm of Ermanaric!"
 LR_form_austrgothia_dejure_tt: "Crimea and Yedisan become de jure part of [GetTitleByKey('k_titular_crimean_gothia').GetName]. [GetTitleByKey('k_titular_crimean_gothia').GetName], [GetTitleByKey('k_moldavia').GetName] and [GetTitleByKey('k_warlord_roxolania').GetName] become de jure part of [GetTitleByKey('e_austrgothia').GetName]. You also gain [GetTitleByKey('k_titular_crimean_gothia').GetName] if no one holds it."
