l_english:
 # Found the Hellenic League (1.21 trade league), 2026-11-17. Uses vanilla's found_the_hanseatic_league_* tooltips.
 LR_found_hellenic_trade_league_decision: "Found the Hellenic League"
 LR_found_hellenic_trade_league_decision_tooltip: "Bind the [counties|E] of your [trade_league|E] into a sworn league of the Aegean"
 LR_found_hellenic_trade_league_decision_confirm: "Let the cities speak with one voice"
 LR_found_hellenic_trade_league_decision_desc: "Long before any emperor, the cities of the Greeks swore oaths at common altars and pooled their silver against common foes. Our ships already sail together from Athens to Smyrna and Rhodes; let us bind the league by oath, as our ancestors did, and let no king tax what the sea brings us."
 LR_HELLENIC_LEAGUE_NAME: "Hellenic League"
 LR_found_hellenic_trade_league_message_title: "The Hellenic League Is Sworn"
 LR_found_hellenic_trade_league_message_desc: "[hanse_founder.GetUIName|U] [Select_CString( hanse_founder.IsLocalPlayer, 'have', 'has' )] bound the cities of the Aegean into the Hellenic League."
