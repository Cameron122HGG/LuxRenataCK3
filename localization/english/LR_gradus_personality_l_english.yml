l_english:
 # LR 2026-11-25 GRADUS personality (tools/imperial_rise/build_personalities.py)
 LR_personality_roman_modifier: "The State Outlives the Emperor"
 LR_personality_roman_modifier_desc: "Rome's offices and provinces outlast any one ruler: the state is strong, the dynasty less so."
 LR_personality_hellenistic_modifier: "King by the Spear"
 LR_personality_hellenistic_modifier_desc: "A conqueror's monarchy over many peoples, won by the spear and held by renown."
 LR_personality_western_modifier: "Lords and Oaths"
 LR_personality_western_modifier_desc: "Counts and knights hold their lands by oath and answer the king's call to arms."
 LR_personality_persianate_modifier: "King of Kings"
 LR_personality_persianate_modifier_desc: "The great houses are kings in their own lands; the king of kings keeps their loyalty, not their purses."
 LR_personality_mamlakah_modifier: "Sword and Pen"
 LR_personality_mamlakah_modifier_desc: "The realm leans on soldiers the throne pays and scribes the throne trains, more than on the levies of the lords."
 LR_personality_nilotic_modifier: "Lord of the River"
 LR_personality_nilotic_modifier_desc: "The king stands between Heaven and the river, and his piety is the realm's good fortune."
 LR_personality_sudanic_modifier: "Lord of Gold"
 LR_personality_sudanic_modifier_desc: "Gold and tribute flow to the court, and with them the fame of its lord."
 LR_personality_iqta_modifier: "Land for Service"
 LR_personality_iqta_modifier_desc: "Land is granted for service and taken back when service ends; the soldiery stays loyal to the hand that grants."
 LR_personality_indic_modifier: "The Dharmic Overlord"
 LR_personality_indic_modifier_desc: "An overlord who keeps the dharma, honoured by the samantas who bow to him."
 LR_personality_sinic_modifier: "Mandate and Merit"
 LR_personality_sinic_modifier_desc: "Officials chosen for their merit govern in the name of a ruler who holds Heaven's mandate."
 LR_personality_japanese_modifier: "Court and Warrior Houses"
 LR_personality_japanese_modifier_desc: "The court rules, but the warrior houses fight its wars."
 LR_personality_sacral_modifier: "The Anointed King"
 LR_personality_sacral_modifier_desc: "The king of Gaul is anointed, and the realm's piety rises with him."
 LR_personality_barbarian_modifier: "The War Band"
 LR_personality_barbarian_modifier_desc: "A chief and his war band: quick to raid, quick to muster, slow to govern."
