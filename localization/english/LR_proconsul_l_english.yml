l_english:
 # LR proconsuls (tools/cleave_caesars.py, 2026-11-25). GENERATED.
 LR_proconsul_male: "Proconsul"
 LR_proconsul_female: "Proconsul"
 LR_proconsul_male_hegemony: "Proconsul"
 LR_proconsul_female_hegemony: "Proconsul"
 title_type_lr_concilium: "Provincial Council"
 LR_proconsul_appoint_tt: "#HIGH [new_holder.GetName]#! becomes #V Proconsul#! over [caesar_area.GetNameNoTier] for #V 10 years#!: a command of [new_holder.GetHerHis] own is made, with a #V provincial council#! under it at its fixed seat, and your [counties|E], duchies and kingdoms in that area and your direct [vassal|E]s based there go to [new_holder.GetHerHim]. The governors of the provinces sit in the council. A Proconsul is never promoted and holds no claim on the Republic."
 LR_caesar.0001.t_p: "A Proconsul for the Provinces"
 LR_caesar.0001.desc_p: "The Senate cannot govern every frontier from the Curia. As the Republic always did, it may give a magistrate imperium over a province for a term: a proconsul, answerable to the Senate, with a council of the province beside him. Which part of the Res Publica shall be given to a Proconsul?"
 LR_caesar.0002.t_p: "Who Shall Be Proconsul?"
 LR_caesar.0002.desc_p: "[caesar_area.GetName] needs a Proconsul. A kinsman, a colleague, the strongest man on the spot, or the head of a great house: the Senate will judge the choice when the term is over."
 LR_caesar.0003.t_p: "Proconsul"
 LR_caesar.0003.desc_p: "[caesar_augustus.GetTitledFirstName] and the Senate have given me imperium over [caesar_command.GetName] for ten years. The council of the province meets at my seat, and when the term is over I must answer for it in Rome."
 LR_concilium_modifier: "Seat of the Provincial Council"
 LR_concilium_modifier_desc: "The council of the province meets here: delegates of every city, the high priest of the province, and the petitions of all."
 LR_proconsul_modifier: "Proconsular Imperium"
 LR_proconsul_modifier_desc: "This character governs a province with the imperium of a consul, for a term granted by the Senate."
 LR_seated_in_concilium_opinion: "Seated in the Council"
 LR_grant_proconsular_command_decision: "Grant a Proconsular Command"
 LR_grant_proconsular_command_decision_desc: "Give a magistrate imperium over one of the great provinces for ten years, with a council of the province beside him, as the Republic governed its provinces before there were Caesars."
 LR_grant_proconsular_command_decision_tooltip: "Grant a Proconsul a part of the Res Publica"
 LR_grant_proconsular_command_decision_effect_tt: "Choose the province, then the Proconsul"
 LR_grant_proconsular_command_decision_confirm: "Choose the Province"
 LR_grant_proconsular_command_room_tt: "Fewer than two Caesars or Proconsuls serve you"
 LR_proconsul_cross_rubicon_decision: "Cross the Rubicon"
 LR_proconsul_cross_rubicon_decision_desc: "Your term is over and the Senate wants you back without your legions. Caesar did not go back alone. The die is cast."
 LR_proconsul_cross_rubicon_decision_tooltip: "Keep your command and march on the Republic"
 LR_proconsul_cross_rubicon_decision_confirm: "Alea iacta est"
 LR_proconsul_cross_rubicon_decision_effect_tt: "You stop being Proconsul, leave the college (its cohesion drops by #N 30#!), your command becomes an empire of your own, you become #V Augustus#!, and you go to war for the Republic with a [pressed_claim|E] on it."
 LR_proconsul_cross_rubicon_term_tt: "Your term as Proconsul is over"
 LR_debug_make_proconsul_decision: "Debug: Make a Proconsul"
 LR_debug_make_proconsul_decision_desc: "Debug only. Choose any area of the Empire that no Caesar or Proconsul commands yet, and a Proconsul for it, without the requirements of Grant a Proconsular Command."
 LR_proconsul.0001.t: "The Term Is Over"
 LR_proconsul.0001.desc: "[lr_proconsul.GetTitledFirstName] has held imperium over [lr_proconsul.GetHerHis] province for ten years. The law says a command ends; the Senate may prorogue it, or call the Proconsul home."
 LR_proconsul.0001.a: "Prorogue the command for ten more years"
 LR_proconsul.0001.b: "Recall the Proconsul"
 LR_proconsul.0002.t: "Recalled to Rome"
 LR_proconsul.0002.desc: "The Senate has not prorogued my command. [lr_head.GetTitledFirstName] wants me home, a private citizen, without my legions."
 LR_proconsul.0002.a: "I lay down the fasces."
 LR_proconsul.0002.b: "The die is cast: cross the Rubicon."
 LR_proconsul.0003.t: "The Rubicon Is Crossed"
 LR_proconsul.0003.desc: "[usurper.GetTitledFirstName], whose command the Senate would not prorogue, has kept [usurper.GetHerHis] legions and marches on the Republic."
 LR_proconsul.0003.a: "The Republic will defend itself."
 LR_proconsul.0004.t: "A Proconsul Is Dead"
 LR_proconsul.0004.desc: "My Proconsul is dead, and imperium does not pass to an heir: the command has lapsed, and the heir has sworn fealty to the Republic. Shall the province have a new Proconsul?"
 LR_proconsul.0004.a: "Grant a new command"
 LR_proconsul.0004.b: "Let it lapse"
