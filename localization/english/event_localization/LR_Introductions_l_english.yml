l_english:
  german_introduction.0002.t: "The Iron Fist"
  german_introduction.0002.desc: "Once there was a Reich. A great Roman Reich, where any man regardless of his background could rise to glory based on his merit, his skills, and his courage in war. The frontiers of this Reich were the great rivers of the Rhine and Danube, and countless men from all over Germania crossed these waterways for a chance to earn land and rights guarding those frontiers with the mighty legions. The border legions, the limitanei, never buckled, but the Reich behind them did. Rome's greatness came crashing down and with the wealthy cities of Italy facing raids, famine and pestilence, few of the so-called Emperors of the last few centuries could even dream of paying, let alone reinforcing the limitanei. \n\nFaced with ruination, isolation and possible starvation, the legions had no choice but to reach out to their old rivals across the river, the Alamans, to come together to forge a realm safe for them both. While this new kingdom would never be particularly stable or "civilised" by Roman standards, Alamania would grow strong and prosperous, as inheritors of the mighty legions and controllers of the critical mountain passes enabling trade between Italy and Germania, slowly refilling the coffers that enables forts and castles to rise far beyond the old Roman frontier. It is here, in the ever shifting mix of "arian_rite" Christianity, Mithraism, Manicheanism and old pagan traditions, that a new faith to conquer all others would emerge. The legions' old protectors, Mithras and Mars, became identified with Teiwaz, the god of warriors, and new temples and structures would emerge in imitation of the Christian faith. The biggest patrons of this new belief would be the greatest leaders this region has seen since the first Roman Kaiser. \n\nA century ago, Otto the Great came out of the Saxon lands to the north, saving all Germania from Hungarian pillaging. In the former Karling lands of the Palatine counts, he had seen the effectiveness of Frankish knights, and would combine them with the mighty soldiers of Alamania to form his Iron Legions, as people nicknamed them from their heavy armour. While even these armies could not keep Germania united beyond Otto's death, the core of his realm in Alamania would remain the strongest kingdom north of the Alps, his line continuing their forefather's legacy of sponsoring arts, science and infrastructure. A line of erudite and literate rulers, the Ottonians maintain the dream of their forefather to succeed where Charlemagne did not, to forge a New Roman Reich to replace the rotting carcass of the old, the descendants of the proud Germanic legionaires of old marching to war under the banners of Teiwaz like Rome once did before the days of Christian weakness. The Ottonians will forge a new realm, which will be Holy, Roman, and a Kaiserreich. \n\nThe Christian lords of the Palatinate, once leaders of a revolt to free the Germans from Karling tyranny, now stand as the last bastions of a Christian Germania against the Alaman onslaught. The mostly pagan lords and tribes of Ostmark have little sympathy for their cause, and the Franks to the west will hardly forgive their revolt. Should the Palatinate fall, Charlemagne's vision will be truly dead in the east, as all Germania will stand open to the Ottonian advances, isolating the Bavarian frontierlands that still resist them to the east. With a united Reich at their back, could even Italy hold back the true inheritors of Rome from reaching out and claiming their rightful legacy in the name of Tiw? Germania holds her breath as the great questions of the age are answered in blood and iron."
  german_introduction.0002.a: "Unflinching, Teiwaz plunges his fist into the mouth of the Great Wolf."

  byzantium_introduction.0002.t: "The Unconquered Sun"
  byzantium_introduction.0002.desc: "All roads lead to Rome, it was once said, as that ancient city brought the world low, cutting down barbarians like sheaves of wheat and civilised the world beyond all horizons. The region around the Straits of Bosporus was thankfully spared the worst of this warfare, the local leaders being allies and supporters of Rome, eventually integrated entirely into their Empire. Yet none could then know the unfathomable glory this peaceful backwater of the Empire would one day host. As the Empire emerged from the Century of Crisis, the Emperor Constantine would set his sights on the town of Byzantium as the perfect location for his Golden City, a New Rome to outshine the crumbling, overpopulated City of Old, increasingly infested with fleas, rats and Christian converts as the monuments of ancient glories fell apart.\n\nNew Rome would rise, in enough marble and gold and porphyry to baffle the senses of any Roman or drive a provincial peasant mad at the mere concept of such wealth. Nowadays known most commonly as Constantinopolis or Megalopolis, the City of Constantine or the Greatest City, the greatest walls the world have ever seen shields an uncounted population larger than entire nations. Pilgrims seeking the light of the Invincible Sun radiating off the golden roofs or to sacrifice to the countless Old Gods prostrate themselves in the thousands in temples the size of city blocs, the exotic smells and sounds of the overflowing markets surrounding them drowned out by the raucuous roar of the Hippodrome. Far beyond the great walls, in their villas dotting vast estates where slaves and peasants toil from dawn to dusk to feed the City of Cities, the imperial elites tightly cling their golden goblets, enviously eyeing the distant lights of the City and imagining what controlling it could mean for their legacy, their dynasty, their faith. Like sharks or wolves they stare through enveloping darkness of the setting sun, for they all know the weak point at the very centre of the golden sheen.\n\nBehind walls, villas, townhouses, temples, markets, monuments and yet more walls, ensconced in a palace the size of a small city, behind thousands of bureaucrats, slaves, servants, scholars, clerics and courtiers, beyond marble walls shrouded by heavy imperial purple silken veils, illuminated by dancing lights in gilded fittings... a bejewelled cup worth more than what many people earn in a lifetime slip from a trembling hand covered in equally expensive rings. The wine spills across the red ink of depressing economic reports and disturbingly stained reports from the military frontiers, and for a moment the stone faces of the Council move ever so slightly. Not because of the destruction of the reports; their respective spymasters had long since procured them copies from each other's departments, rather, the shocking thing was the trembling of the hand and what it betrayed of its owner's conclusions about the state of the greatest Empire the known world had ever seen. For a moment the room held its collective breath as all present thought the same phrase that would be repeated by the elites by the end of the night, by the city beggars by tomorrow, muttered as a curse by frontier soldiers by the end of the month, and read with smiles from spy reports in foreign courts before the year was out. A phrase that could topple all political, economic and military certainties."
  byzantium_introduction.0002.a: "The Emperor is afraid."

  french_introduction.0002.t: "Sacred Stench"
  french_introduction.0002.desc: "Approaching Paris, the Sacral Heart of Francia and greatest city of all Gaul, the first thing one notices is the smell. The Sacral Kings pour the tax money they receive from their countless vassals into turning the city into a hub of trade, industry, science and the arts in anotherwise dark era. Yet all the poets, painters, sculptors and scholars still frown when hit with the waft of the city as they open their door in the morning. \n\nFor the pilgrims, seeking to see the old Roman Cathédrale Saint-Étienne on the Île de la Cité before the planned construction of the Saint-Clovis de Paris in its place, the main streets may seem paved with gold. Flowers bloom in windowsills in small gardens surrounding chapels, the storefronts and stalls seemingly buckle under the weight of exotic goods, and preachers in luxurious robes yell the gospel from platforms across the bustling crowds. The only thing marring the vision of God's Gallic Pearl is the smell sneaking into the nostrils of the pious. \n\nHigh above the streets and courtyards of the Royal Quarter, behind thick stone walls and guarded by hundreds of Nobles of the Sword in glittering gilded armour; the Sacral King, the representative of God on Earth, cannot escape the smell, even on his balcony. It is a constant reminder of the tens of thousands of humans living and dying in the city every day, of the crumbling Roman sewers below and the ever expanding catacombs being dug around them to house the dead the churchyards cannot fit. But most of all it is a reminder he is a prisoner. To the east the Karlings claim authority over all Franks and the Roman lands beyond. To the southwest the descendants of Syagrius and his relatives in the House of Capet compete in their endless games to actually rule Gaul. And further afield, Vikings, Germans and Romans would see all this burned to the ground or bound in chains. Paris is a prison for the descendants of Merovech; a gilded prison, but one where the smell always reveals the truth of the invisible cell around the throne..."
  french_introduction.0002.a: "Have the servants bring more perfume!"

  french_introduction.0003.t: "The Remnant"
  french_introduction.0003.desc: "Once Austrasia was great, the very heartland of the Franks as they rose from guardians of the Roman Rhine frontier to the stewards of Gaul. Yet Austrasia was broken, like Francia itself. \n\nIt all began after the conquest of Suessonium and the Syagrian realm. The Merovings began devoting ever more time to their new 'Neustrian' heartland, the prosperous Roman territories the western Franks gorged themselves on as a new aristocracy. The line of Charles Martel promised renewed Austrasian leadership of the Franks, yet they soon became ensnared in Neustrian politics as well, until Charlemagne promised to turn things around with his new Empire. \n\nFor a brief brilliant moment Neustria seemed on top of the world as their proud lancers marched from Hispania to Denmark, yet within a few generations all that was gained had been lost. The Merovings reasserted themselves in Neustria, imperial authority stretched little beyond Aachen, and the Palatine Rebellion ripped the German heart out of Austrasia. \n\nAustrasia may one day yet again be the heart of a great Empire, but first we must deal with the deviant descendants of Lothar..."
  french_introduction.0003.a: "The true Rome is greater than just Rome!"

  french_introduction.0004.t: "Fear and and Lothar in Vosges"
  french_introduction.0004.desc: "What is in a name? Lotharingia, Lothringen, Lorraine, Lottringe, Loutringe... even the population of our diverse land cannot agree how to spell the name of their own region, let alone how to pronounce it. The only thing they can all agree on is how indelibly the region is tied to the Karling dynasty and their imperial vision. \n\nTwo and a half centuries ago, infuriated by the intrigues of the Syagrians to align the Merovingian court with the Greek pagan devils burning their way across Italy, Charlemagne, Karl the Great, declared a new Roman Empire with the backing of the Holy Father, to replace the one seemingly destroyed by the demonic Greek followers of Lucifer-in-the-Sun. What followed was a series of glorious campaigns that made many think a true Restitutor Orbis had arrived, despite the Karling setbacks in Italy. \n\nYet soon, the Empire grew weak and divided, and what was Middle Francia, the Empire's former centre, came to be known as Lotharingia after the Karling ruler at the time. With West Francia returning to Meroving rule, and East Francia being consumed in the so-called Palatine Revolt, Middle Francia is now all that remains of Charlemagne's grand empire. \n\nIf we are to triumph and win back our Empire, we must combat the religious division in our lands and then the political challenge of the Austrasian restorationists to the North. With their defeat, Lotharingia will be the only legitimate heir to the heritage of not only Lothar, but Charlemagne himself too!"
  french_introduction.0004.a: "At least we can all agree we hate the Alemani!"

  french_introduction.0005.t: "Noble Neustria"
  french_introduction.0005.desc: "Long ago, the great Roman general Jules César led his armies into Gallia, home of the Gauls. Some fought him vigorously, filled with Gallic pride, others saw wisdom in collaborating with this builder of empires and extender of civilisation. This combination of pride and providence has always defined our beautiful land, and continues to this day. As the empire built by the Romans faultered, the lords of Gaul began raising up their own rulers, whether looking to the throne in Rome or one more local to this land. \n\nWhen the Franks, alleged descendants of Troy and César's knights, fought the Roman Syagrius for rulership of Gaul, some resisted, some fell in line. When the Goths invaded and made the Franks and Romans share this land, some fought it, some thrived within the system. To be from this land is to be able to improvise, to adapt, and to overcome, whether on the battlefield, or with wine, women and song. \n\nThere are many competing visions for the future in this land, whether you want to call it Gallia, Francia, the Sacral Kingdom, or something else entirely. All we can agree on is that these ambitions will be achieved with pride, adaptation, and hopefully some excellent cheese..."
  french_introduction.0005.a: "Don't forget the wine!"

  french_introduction.0006.t: "The Norman Norm"
  french_introduction.0006.desc: "They say to the south the King calls himself god and have servants stack Asian silk wipes in his golden privy while he gorges himself on the culinary delights of Paris. For his sake, we hope he has fun. But our people right here in Normandie, the land of the northmen, are the ones who keep his allegedly sacred rear on said golden privy.  \n\nIt is but two centuries since Paris crumbled under the Viking horde. The soft-handed gentlemen of Gaul realised they needed a true warrior in order to fend off true warriors. They found Rollo, the noblest and most courageous of all Norse in Gallia, and under the auspices of their puppet king they named Rollo lord of the mouth of the Seine, handing land out to all brave Nordic warriors who would defend Gaul against our marauding cousins.  \n\nNormans are known across Christendom and beyond as intrepid adventurers and noble warriors, fighting Muslims and Solar devils with as much courage as our Norse kin. \n\nYet, all is not in order in the new home of the Normans. Some claim the Christian rulers have grown decadent and Gallic and character, and challenge even the legitimacy of the ruling house as descendants of Rollo, instead pledging allegiance to a pagan line more in tune with the old ways. As the Gallic lords squabble to the south, we Normans must come to agreement on our future the old way, by force of arms. Whosoever wins will command the armies of Normandy and kingdoms will fall at his or her feet."
  french_introduction.0006.a: "England does look tempting!"

  french_introduction.0007.t: "Baleful Britanny"
  french_introduction.0007.desc: "In ages past, these misty, forested lands were known as Armorica, the westernmost peninsula of Gallia Romana. This all changed when an emperor now largely lost to time recalled the legions from Britannia to the North. One of the generals of said force, the legendary Conan Meriadoc, would settle his troops in these lands and refused to be expelled even after his emperor was defeated. Instead he would turn this new land, by many called 'Little Britannia' afterwards, into a new home for any Briton refugees from the endless wars between the Saxons and Artorians to the north. \n\nHere our people have built a new home and a new hope, and despite political division and Norse invasions, we remain proud and independent. Yet, many fear the Gallic and Frankish heretics to the east. They clearly want to subjugate our lands and crush our culture, this last bastion of Celtic culture in a region literally named for our people's common name. Mayhaps the safest future for us all, for all of Gaul, would not be a return to Rome or some Frankish pastiche of a kingdom, but a return even further, to a truly Celtic realm for all Gauls?" 
  french_introduction.0007.a: "The Romans would call that a 'revolution,' I think."