#Diadochi Restoration Major Events
LR_diadochi_kingdoms_events.0001.t:0 "Seleukid Empire Restored"
LR_diadochi_kingdoms_events.0001.desc:0 "Seleukid Empire has been restored under [scoped_ruler.GetFirstName], who now holds the title of [scoped_ruler.GetTitleTierName]. \n\nReviving the legacy of Seleukos I, and the Hellenistic world he helped shape after the death of Alexander the Great."
LR_diadochi_kingdoms_events.0001.a:0 "Glory to the Seleukids!"
LR_diadochi_kingdoms_events.0002.desc.others:0 "Aw fuck..."
LR_diadochi_kingdoms_events.0002.a:0 "Elephant Time"
LR_diadochi_kingdoms_events.0002.b:0 "I see..."

LR_diadochi_kingdoms_events.0005.t:0 "Ptolemaic Empire Restored"
LR_diadochi_kingdoms_events.0005.desc:0 "Ptolemaic Empire has been restored under [scoped_ruler.GetFirstName], who now holds the title of [scoped_ruler.GetTitleTierName].\n\nReviving the legacy of Ptolemy I, and the Hellenistic world he helped shape after the death of Alexander the Great."
LR_diadochi_kingdoms_events.0005.a:0 "Glory to the Ptolemies!"
LR_diadochi_kingdoms_events.0006.desc.others:0 "Aw fuck..."
LR_diadochi_kingdoms_events.0006.a:0 "Elephant Time"
LR_diadochi_kingdoms_events.0006.b:0 "I see..."

LR_diadochi_kingdoms_events.0003.t:0 "Alexander's Empire Reforged"
LR_diadochi_kingdoms_events.0003.desc:0 "The Greatest Empire the World has ever seen has been restored under [scoped_ruler.GetFirstName], who now holds the title of [scoped_ruler.GetTitleTierName].\n\nThe vast territories stretching from the eastern Mediterranean to the borders of India are once again united under a single ruler, reviving the legacy of Alexander the Great, and leading the Hellenistic World into a New Era!"
LR_diadochi_kingdoms_events.0003.a:0 "The Alexander has been Reborn..."

LR_diadochi_kingdoms_events.0007.t:0 "End of the Upper Egypt"
LR_diadochi_kingdoms_events.0007.desc:0 "With the formation of the Kingdom of Egypt, there is no place for the "Upper Egypt", or legitimacy in it. \nThe realms are united."
LR_diadochi_kingdoms_events.0007.a:0 "Egypt long divided..."

LR_diadochi_kingdoms_events.0008.t:0 "Antigonid Empire Restored"
LR_diadochi_kingdoms_events.0008.desc:0 "Antigonid Empire has been restored under [scoped_ruler.GetFirstName], who now holds the title of [scoped_ruler.GetTitleTierName].\n\nReviving the legacy of Antigonos I, and the Hellenistic world he helped shape after the death of Alexander the Great."
LR_diadochi_kingdoms_events.0008.a:0 "Glory to the Antigonids!"

primary_title_is_e_levant_tooltip: "Primary Title is an Empire of Levant"
primary_title_is_e_egypt_tooltip: "Primary Title is an Empire of Egypt"

LR_diadochi_kingdoms_events.0009.t:0 "Antipatrid Kingdom Restored"
LR_diadochi_kingdoms_events.0009.desc:0 "The Antipatrid Kingdom has been restored under [scoped_ruler.GetFirstName], who now holds the title of [scoped_ruler.GetTitleTierName].\n\nAs Antipatros once held Makedonia and Hellas while Alexander marched east, so the heart of the Greek world is again ruled from Pella."
LR_diadochi_kingdoms_events.0009.a:0 "Glory to the Antipatrids!"
LR_diadochi_kingdoms_events.0010.t:0 "Argead Empire Restored"
LR_diadochi_kingdoms_events.0010.desc:0 "The house of Philippos and Alexandros rules an empire once more. [scoped_ruler.GetFirstName] has raised the Argead Empire, and claims the inheritance that the Successors divided among themselves.\n\nFrom here, the throne of Alexander himself is within reach."
LR_diadochi_kingdoms_events.0010.a:0 "The heirs of Alexander return!"
