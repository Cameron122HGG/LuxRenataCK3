 LR_roman_diocese_event.0021.desc:0 "TEMP Macedonia restoration description"
 LR_roman_diocese_event.0021.option:0 "TEMP Macedonia option"
 LR_roman_diocese_event.0021.option.tooltip_1:0 "You gain [GetTitleByKey('k_diocese_macedonia').GetName]"
 LR_roman_diocese_event.0023.t:0 "TEMP Restore Pontus"
