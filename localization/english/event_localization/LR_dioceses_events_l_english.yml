 trait_restitutor_orbis:0 "Restitutor Orbis"
 trait_restitutor_orbis_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] has successfully reasserted the disparate holdings of Rome under one crown and one empire."
 restitutor_orbis:0 "Restitutor Orbis"
 restitutor_orbis_desc:0 "This character was able to reconquer all of the lands of the Roman Empire, making any recognition and praise they recieve for their efforts well deserved."

 LR_roman_diocese_event.0001.t:0 "Reigniting Rome's Rule in [GetTitleByKey('k_diocese_britannia').GetNameNoTier]#"
 LR_roman_diocese_event.0001.desc:0 "As the Emperor of Rome, in a move reminiscent of the great Julius Caesar, we boldly reassert our claim over Britannia. This decision, steeped in the legacy of our ancestors, marks a new chapter in our glorious history. Our reclamation is more than a conquest; it's a renewal of Rome's eternal vision, a testament to our rightful place as leaders and protectors of Britannia.\n\nThis is the dawn of a new era, where Rome, guided by its unwavering spirit and strength, reestablishes its reign, ensuring a prosperous and enduring future for Britannia under the Roman banner."
 LR_roman_diocese_event.0001.option:0 "Proclaim Reign"
 LR_roman_diocese_event.0001.option.tooltip_1:0 "You gained the [GetTitleByKey('k_diocese_britannia').GetName]#"
 LR_roman_diocese_event.0001.option.tooltip_2:0 "The de-jure territories of the [GetTitleByKey('k_diocese_britannia').GetName] have been reverted to their original Roman provincial structures"

 LR_roman_diocese_event.0002.t:0 "Reconstituting the [GetTitleByKey('k_diocese_viennensis').GetNameNoTier]#"
 LR_roman_diocese_event.0002.desc:0 "In the wake of our revitalized empire, we turn our attention to the strategic Diocese of Viennensis, a region once bustling with Roman culture, commerce, and governance. This diocese, encompassing the vital provinces of Aquitania, Narbonensis, and the Alpine regions, was renowned for its economic prosperity, cultural richness, and as a crucial link in our Mediterranean dominion.\n\nReestablishing this diocese is more than a mere administrative act; it is a revival of Rome's legacy, reaffirming our commitment to the ideals and traditions that shaped our Empire during its zenith."
 LR_roman_diocese_event.0002.option:0 "Restore Roman Order"
 LR_roman_diocese_event.0002.option.tooltip_1:0 "You gained the [GetTitleByKey('k_diocese_viennensis').GetName]#"
 LR_roman_diocese_event.0002.option.tooltip_2:0 "The de-jure territories of the [GetTitleByKey('k_diocese_viennensis').GetName] have been reverted to their original Roman provincial structures"

 LR_roman_diocese_event.0003.t:0 "Reviving the [GetTitleByKey('k_diocese_lugdunensis').GetName]#"
 LR_roman_diocese_event.0003.desc:0 "As we continue to fortify the foundations of our resurgent empire, our focus now shifts to the Diocese of Gallia, a land that was once a cornerstone of Roman power in the West. Encompassing regions from the lush landscapes of Belgica to the rich fields of Lugdunensis and the strategic crossroads of Germania Superior, Gallia was a beacon of Roman administration, culture, and military strength. Its cities, like Lugdunum (Lyon) and Lutetia (Paris), were centers of Roman civic life and culture in the West.\n\nThe restoration of the Diocese of Gallia is not merely a reclamation of territory; it is a rekindling of the Roman spirit in these lands, a reaffirmation of our enduring legacy and a reassertion of the Pax Romana across these historically vital provinces."
 LR_roman_diocese_event.0003.option:0 "Reestablish Roman Gallia"
 LR_roman_diocese_event.0003.option.tooltip_1:0 "You gained the [GetTitleByKey('k_diocese_lugdunensis').GetName]#"
 LR_roman_diocese_event.0003.option.tooltip_2:0 "The de-jure territories of the [GetTitleByKey('k_diocese_lugdunensis').GetName] have been reverted to their original Roman provincial structures"

 LR_roman_diocese_event.0004.t:0 "Restoring the [GetTitleByKey('k_diocese_hispania').GetName]#"
 LR_roman_diocese_event.0004.desc:0 "With our empire's resurgence, we now turn to rejuvenate the Diocese of Hispania, once a bastion of Roman prosperity and culture in the West. This diocese, spanning the diverse and resource-rich territories of Hispania Baetica, Tarraconensis, Lusitania, and Carthaginensis, was celebrated for its agricultural bounty, mineral wealth, and strategic significance. Cities like Emerita Augusta (Mérida) and Tarraco (Tarragona) stood as beacons of Roman civilization on the Iberian Peninsula.\n\nReinvigorating the Diocese of Hispania is not just about reclaiming lost territories; it represents the restoration of Roman order, culture, and economic vitality in these lands. We aim to reassert the ideals of Roman governance and the Pax Romana, ensuring that these provinces once again thrive under the eagle standard."
 LR_roman_diocese_event.0004.option:0 "Reinstate Roman Hispania"
 LR_roman_diocese_event.0004.option.tooltip_1:0 "You gained the [GetTitleByKey('k_diocese_hispania').GetName]#"
 LR_roman_diocese_event.0004.option.tooltip_2:0 "The de-jure territories of the [GetTitleByKey('k_diocese_hispania').GetName] have been reverted to their original Roman provincial structures"
 
 LR_roman_diocese_event.0005.t:0 "Restore [GetTitleByKey('k_diocese_syria').GetName]"
 LR_roman_diocese_event.0005.desc:0 "As the Empire revives, we turn to the restoration of the Oriental Diocese. These lands were once the Empire's eastern heartland and bulwark, bridging the imperial core with the vast expanses of inner Asia. The Oriental Diocese commands fertile lands, its profound culture, thriving commerce, and pivotal strategic position are unparalleled in the world.\n\nThe restoration of the Oriental Diocese signifies not merely territorial recovery, but the solemn return of Roman order, universal spirit, and civilizational excellence. Our aim is to reaffirm the wisdom of Roman governance, revive the ideal of the 'Pax Romana,' and ensure these key provinces – the Empire's wellspring of wealth, cultural bastion, and bridge between East and West – flourish once more under the banner of the Double-Headed Eagle."
 LR_roman_diocese_event.0005.option:0 "Restore the Eastern Province"
 LR_roman_diocese_event.0005.option.tooltip_1:0 "You gain [GetTitleByKey('k_diocese_syria').GetName]"
 LR_roman_diocese_event.0005.option.tooltip_2:0 "The de jure territory of [GetTitleByKey('k_diocese_syria').GetName] has been reset to its original Roman provincial structure"
 LR_roman_diocese_event.0006.t:0 "Rebuild [GetTitleByKey('k_diocese_aegyptus').GetName]"
 LR_roman_diocese_event.0006.desc:0 "With the tide of Imperial restoration, our focus shifts to rebuilding the Diocese of Aegyptus, the Empire's former granary and cornerstone of wealth in the Eastern Mediterranean. This land, nourished by the Nile, is renowned for its unparalleled fertility, ancient wisdom, and strategic significance. Once the linchpin of Roman civilization and faith in the Orient, it bears the strategic weight of connecting Africa, Asia, and Europe. With its abundant resources, flourishing trade, and profound knowledge, it stood as a radiant jewel in the Empire's crown.\n\nThe restoration of Aegyptus is far more than a military conquest. In times past, this land fractured as the Empire waned:0bandits plagued the trade routes of Cyrenaica, the Nile waterways silted up due to dams built by local magnates, and scholars scattered from Alexandria amidst conflict. Today, we must restore order through Roman law..."
 LR_roman_diocese_event.0006.option:0 "Restore Aegyptus"
 LR_roman_diocese_event.0006.option.tooltip_1:0 "You gain [GetTitleByKey('k_diocese_aegyptus').GetName]"
 LR_roman_diocese_event.0006.option.tooltip_2:0 "The de jure territory of [GetTitleByKey('k_diocese_aegyptus').GetName] has been reset to its original Roman provincial structure"
 LR_roman_diocese_event.0007.t:0 "Restore [GetTitleByKey('k_diocese_africa').GetName]"
 LR_roman_diocese_event.0007.desc:0 "The grand endeavor of Imperial restoration calls for the rebuilding of the Diocese of Africa – Rome's granary and the bedrock of Mediterranean prosperity. This sun-drenched land is famed for its abundant produce, thriving Romanized cities, and crucial maritime gateways. Great cities like Carthage (Tunis) once stood as exemplars of Roman affluence and order.\n\nWe seek not only to reclaim lost territory but to ensure that Africa's olive groves and wheat fields once again nourish the Empire, that Carthage's baths and theaters revive Roman elegance, and that this land becomes an enduring eastern bastion of the Roman spirit."
 LR_roman_diocese_event.0007.option:0 "Restore Africa"
 LR_roman_diocese_event.0007.option.tooltip_1:0 "You gain [GetTitleByKey('k_diocese_africa').GetName]"
 LR_roman_diocese_event.0007.option.tooltip_2:0 "The de jure territory of [GetTitleByKey('k_diocese_africa').GetName] has been reset to its original Roman provincial structure"
 LR_roman_diocese_event.0008.desc:0 "The grand task of Imperial restoration urgently demands the rebuilding of the Diocese of Illyricum – the Empire's sturdy shield and cradle of exceptional commanders. These mountainous lands and coasts along the Danube are renowned for their martial resilience, critical strategic position, and role as the gateway defending Italy. Fortified cities like Salona (Solin) and Scupi (Skopje) were once pillars of Roman frontier defense and military strength.\n\nRestoring Illyricum signifies not just territorial recovery, but the reforging of the Empire's frontier bulwark and martial spirit here. We are committed to reestablishing stable borders, reforming the military, and restoring the mighty protective power of this Imperial pillar."
 LR_roman_diocese_event.0008.option:0 "Restore Illyria"
 LR_roman_diocese_event.0008.t:0 "Restore [GetTitleByKey('k_diocese_illyricum').GetName]"
 LR_roman_diocese_event.0009.t:0 "Restore [GetTitleByKey('k_diocese_italia_suburbicaria').GetName]"
 LR_roman_diocese_event.0009.desc:0 "The foundation of the Empire's restoration lies in rebuilding Italia Suburbicaria – the core of Roman power and cradle of civilization. This sacred land is home to the Senate, the source of citizenship, and the origin of Imperial law and roads. The Eternal City of Rome and ancient Capua embody the essence of the Roman spirit and glory.\n\nRestoring Italia Suburbicaria is not merely the recovery of the capital region; it is the revitalization of the Empire's lifeblood and soul here. We are dedicated to restoring the Senate's authority, unifying the citizen spirit, and allowing this Mother of Nations to reclaim its glory of leading the world."
 LR_roman_diocese_event.0009.option:0 "Restore Italia Suburbicaria"
 LR_roman_diocese_event.0009.option.tooltip_1:0 "You gain [GetTitleByKey('k_diocese_italia_suburbicaria').GetName]"
 LR_roman_diocese_event.0009.option.tooltip_2:0 "The de jure territory of [GetTitleByKey('k_diocese_italia_suburbicaria').GetName] has been reset to its original Roman provincial structure"
 LR_roman_diocese_event.0010.t:0 "Restore [GetTitleByKey('k_diocese_italia_annonaria').GetName]"
 LR_roman_diocese_event.0010.desc:0 "The lifeline of the Empire's restoration hinges on rebuilding Italia Annonaria – the fertile northern granary and the solid rampart against invaders. These Po Valley plains, famed for their abundant grain, vital crossroads, and role as the key defending the capital, nurtured cities like Mediolanum (Milan) and Ravenna – crucial military and administrative centers sustaining the late Empire.\n\nRestoring Italia Annonaria signifies not just the recovery of the northern territories, but the refortification of the Empire's granary and defensive barrier here. We are committed to restoring agricultural abundance, reforming the military garrison, and ensuring that this cornerstone shielding the Empire's heart regains its supporting strength."
 LR_roman_diocese_event.0010.option:0 "Restore Italia Annonaria"
 LR_roman_diocese_event.0010.option.tooltip_1:0 "You gain [GetTitleByKey('k_diocese_italia_annonaria').GetName]"
 LR_roman_diocese_event.0010.option.tooltip_2:0 "The de jure territory of [GetTitleByKey('k_diocese_italia_annonaria').GetName] has been reset to its original Roman provincial structure"
 LR_roman_diocese_event.0015.t:0 "Restore [GetTitleByKey('k_diocese_thracia').GetName]"
 LR_roman_diocese_event.0015.desc:0 "The Empire must rebuild Thracia to secure its eastern frontier."
 

 gallia_first_restore_tt:0 "You must first restore the Diocese of Gallia"

 split_the_empire:0 "Split the Roman Empire"
 split_the_empire_desc:0 "The Roman Empire has stood strong and proud for centuries, but it is time to acknowledge that it is too vast, too complex for any one person to handle. In order for the Empire to be managed more efficiently, we need to split it just like Diocletian did many years ago."
 split_the_empire_tooltip:0 "Mitigate the Empire's problems by dividing it into two parts."
 split_the_empire.custom.tooltip.3:0 "The empire will be split after this ruler dies if they are still emperor"
 custom_potential_wre:0 "The West"
 custom_potential_ere:0 "The East"
 split_the_empire_confirm:0 "Rome #italic will#! endure!"
 child_inherits_roman_empire_tt:0 "One of your children is set to inherit the Roman Empire"
 male_pref_split_tt:0 "Either the heir to the Roman Empire is female and you have at least one son or you have at least two sons"
 female_pref_split_tt:0 "Either the heir to the Roman Empire is male and you have at least one daughter or you have at least two daughters"
 equal_pref_split_tt:0 "You have at least two children who are alive"

 LR_roman_diocese_event.0050.t:0 "Splitting the Roman Empire"
 LR_roman_diocese_event.0050.desc:0 "Many years ago, [diocletian.GetFirstName] solved decades of imperial crisis and civil war through a series of reforms. Among these was splitting the Empire between four Emperors. While his system did not last, it helped the Empire rebuild by taking the burden of rulership off of one person's shoulders.\n\nThe Empire now faces many external and internal problems. To make the Empire more manageable, it needs to be split again, this time into two halves:0a Western half centered on Italia, and an Eastern half centered on Constantinople.\n\nThe big question that remains is whether to do this now, or later. On one hand, ruling a united Empire is an overwhelming burden on myself. On the other hand, if I am confident enough in my abilities to hold the Empire together for the short-term, we can have it split between my heirs #italic after#! I die."
 LR_roman_diocese_event.0050.a:0 "This split needs to happen now."
 LR_roman_diocese_event.0050.b:0 "We can wait until I pass away."

 LR_roman_diocese_event.0051.t:0 "Splitting the Roman Empire"
 LR_roman_diocese_event.0051.desc:0 "Many years ago, [diocletian.GetFirstName] solved decades of imperial crisis and civil war through a series of reforms. Among these was splitting the Empire between four Emperors. While his system did not last, it helped the Empire rebuild by taking the burden of rulership off of one person's shoulders.\n\nhe Empire now faces many external and internal problems. The current Emperor, [split_emperor.GetFirstName] wants to split it into two halves:0a Western half centered on Italia, and an Eastern half centered on Constantinople.\n\n"
 LR_roman_diocese_event.0051.desc.now:0 "The split is now official. Whether because [split_emperor.GetSheHe] doubts [split_emperor.GetHerHis] abilities, or because [split_emperor.GetSheHe] feels the situation is too urgent, [split_emperor.GetFirstNameNoTooltip] decided not to wait. Only time will tell whether [split_emperor.GetSheHe] made the right decision in the end."
 LR_roman_diocese_event.0051.desc.later:0 "[split_emperor.GetFirstNameNoTooltip], it seems, trusts in [split_emperor.GetHerHis] abilities to hold the Empire together, at least in the short-term. [split_emperor.GetSheHe|U] has decreed that the Empire will be split only once [split_emperor.GetSheHe] passes away or abdicates. If and when that happens, how will history judge [split_emperor.GetFirstNamePossessiveNoTooltip] decision?"
 LR_roman_diocese_event.0051.a:0 "Truly, the Roman Empire is undergoing great changes."

 MOESIA:0 "MOESIA"

 create_the_province_of_germania_decision:0 "Restore the Province of Germania"
 create_the_province_of_germania_decision_desc:0 "After the disaster that was the Battle of Teutoburg Forest in 9 AD, the Romans gradually abandoned their ambitions within the hostile land of Germania. Now that the Western Roman border is threatened along the Rhine and Upper Danube, the most viable option may be to reinforce these frontiers, but it is only a matter of time before a reconquest of Germania is necessary to consolidate our defenses at the River Elbe and along the Ore and Sumava Mountains."
 create_the_province_of_germania_decision_tooltip:0 "It is only a matter of time before a reconquest of Germania is necessary to consolidate our defenses at the River Elbe and along the Ore and Sumava Mountains"
 create_the_province_of_germania_decision_confirm:0 "We must secure a more defensible frontier!"
 #germano_roman_convert_tt:0 "Several counties in [GetGeographicalRegion('custom_roman_germania').GetName] Will be converted to [GetCultureByKey('germano_roman').GetName], they will be more likely to convert if they have higher development."
 
 create_the_province_of_dacia_decision:0 "Restore the Province of Dacia"
 create_the_province_of_dacia_decision_desc:0 "During the Crisis of the Third Century, Emperor Aurelian was forced to abandon the province of Dacia in order to secure a defensible border along the Danube River. Now that the Germanic tribes pose a considerably smaller threat to the empire, it is best for us to restore Roman rule over the Carpathian Basin."
 create_the_province_of_dacia_decision_tooltip:0 "Now that the Germanic tribes pose a considerably smaller threat to the empire, it is best for us to restore Roman rule over the Carpathian Basin"
 create_the_province_of_dacia_decision_confirm:0 "Roman rule shall return to Dacia!"

 restore_kingdom_of_bosporus:0 "Restore the Kingdom of Bosporus"
 restore_kingdom_of_bosporus_decision_tooltip:0 "Like a phoenix, Bosporus shall emerge again!"
 restore_kingdom_of_bosporus_decision_desc:0 "The centuries-old Bosporan Kingdom ruled the northern Black Sea until its fall at the hands of the Goths and Huns, but perhaps a new Hellenic endeavor into the region could bring forth the old kingdom's restoration."
 restore_kingdom_of_bosporus_decision_culture_tt:0 "Both [GetTitleByKey('d_crimea').GetNameNoTier] and [GetTitleByKey('d_azov').GetNameNoTier] are of the [GetPlayer.GetCulture.GetName] culture"
 restore_kingdom_of_bosporus_confirm:0 "Bosporan vessels shall sail the Maeotis Lake once more!"

 create_the_province_of_caledonia_decision:0 "Create the Province of Caledonia"
 create_the_province_of_caledonia_decision_desc:0 "After the Claudian Campaign that led to the subjugation of most of Britannia, the peoples in the far north refused to bend the knee and instead stymied all efforts to bring the entire island under Roman control. Even after Emperor Hadrian constructed a wall to hold back the warmongering Picts, we never fully abandoned our desire to rule the rest of Britannia, made apparent by the construction of the Antonine Wall two decades after Hadrian's project and the more recent formation of the Province of Valentia."
 create_the_province_of_caledonia_decision_tooltip:0 "Our aspiration to govern the entirety of Britannia has always persisted, and now we are poised to complete the mission initiated by Emperor Claudius."
 create_the_province_of_caledonia_decision_confirm:0 "Let us expand our reach in Britannia!"

 create_the_province_of_hibernia_decision:0 "Create the Province of Hibernia"
 create_the_province_of_hibernia_decision_desc:0 "The island of Hibernia has long been far from our focus as we considered greater opportunities and dangers. However, once we secure our presence in Britannia for centuries to come, we should bring the rest of the region under our control. Hibernia looks to be an ideal site for Roman civilization to expand into!"
 create_the_province_of_hibernia_decision_tooltip:0 "Hibernia presents an excellent opportunity for Roman colonization and progress. Thus, it stands to reason that we should conquer the island and incorporate it into our empire."
 create_the_province_of_hibernia_decision_confirm:0 "The Hibernian Celts shall be integrated!"

