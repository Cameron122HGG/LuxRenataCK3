 LR_roman_diocese_event.0011.t:0 "Establishing the Provinces of Hibernia"
 LR_roman_diocese_event.0011.desc:0 "As our dominion in Britannia stands firm and unyielding, the verdant isle of Hibernia beckons to us, ripe for integration into the grandeur of Rome. In a strategic move mirroring our illustrious forebearers, we set our sights on this untapped jewel, envisioning a future where Roman culture and governance flourish on its shores. The creation of the provinces is not merely an expansion of territory, but a vital step in the propagation of Roman civilization and order across these northern realms."
 LR_roman_diocese_event.0011.option:0 "Incorporate Hibernia"
 LR_roman_diocese_event.0011.option.tooltip_1:0 "You gained the [GetTitleByKey('d_hibernia_superior').GetName] and [GetTitleByKey('d_hibernia_inferior').GetName]"
 LR_roman_diocese_event.0011.option.tooltip_2:0 "De-jure duchies of the [GetTitleByKey('k_ireland').GetName]  are reformed into Roman provinces"
 LR_roman_diocese_event.0012.t:0 "Extending the Empire's Grasp to [GetTitleByKey('d_caledonia').GetNameNoTier]"
 LR_roman_diocese_event.0012.desc:0 "With the might of Rome now firmly reestablished in Britannia, our imperial gaze turns northward to the untamed lands of Caledonia. In a bold stroke echoing the ambitions of emperors past, we venture beyond the Antonine Wall, bringing the light of Rome to these distant shores. This campaign, a blend of martial prowess and imperial vision, heralds a new chapter in our Empire's legacy.\n\nIn conquering Caledonia, we do not merely expand our borders; we extend the reach of Roman civilization, law, and order. This marks the beginning of a new era of Roman dominance in these northern territories, promising peace and prosperity under the steadfast rule of the Empire."
 LR_roman_diocese_event.0012.option:0 "Assert Imperial Rule"
 LR_roman_diocese_event.0012.option.tooltip_1:0 "You gained the [GetTitleByKey('d_caledonia').GetName]#"
 LR_roman_diocese_event.0012.option.tooltip_2:0 "De-jure duchies [GetTitleByKey('d_caledonia').GetNameNoTier]  are reformed into Roman provinces and integrating into the [GetTitleByKey('k_diocese_britannia').GetName]#"
 
 LR_roman_diocese_event.0013.t:0 "Establish the Province of Germania"
 LR_roman_diocese_event.0013.desc:0 "With the boundaries of the Rhine and Danube now standing unshakable under the iron tread of our legions, the boundless primordial forests of Germania open their arms to us.\\n\\nWe shall raise Roman towns upon the ruins of barbarian settlements, erect the Temple of Jupiter beside the sacred groves of the Druids, and transform the martial prowess of the tribes into loyalty to Rome. The establishment of this province will eradicate the northern threat once and for all, turning this land, which once bred countless war-clouds, into a steadfast shield guarding the Empire's peace. This is not merely an expansion of the Empire, but civilization's eternal triumph over chaos — allowing Germania's amber and black iron to finally gleam with new radiance in the furnace of Rome."
 LR_roman_diocese_event.0013.option:0 "Uphold the imperial rule"
  
 LR_roman_diocese_event.0014.t:0 "Re-establish the Province of Dacia" 
 LR_roman_diocese_event.0014.desc:0 "Though the monuments of Emperor Trajan still stand tall, and though our legions once brought this land into the fold of civilization with blood and glory, the loyalty of Dacia remains as elusive as the Carpathian fog.\\n\\nWe shall no longer be content with mere superficial submission. The new Dacia will be built upon a firmer foundation — more legionary fortresses will be driven like iron nails into strategic strongpoints, and a denser network of roads will shatter the isolation of the valleys and the obstinacy of the tribes. Let Roman law, like the flowing waters of the Mureș and Siret rivers, permeate every inch of this land, washing away all memory of rebellion."
 LR_roman_diocese_event.0014.option:0 "Uphold the imperial rule"

 become_emperor_of_gaul_decision:0 "Reforge the Gallic Empire"
 become_emperor_of_gaul_decision_desc:0 "The Third Century Crisis taught us that provinces must fend for themselves when Italy fails. The Gallic Empire was not rebellion, but a necessary bulwark for Roman rule. Now, as the West collapses once more, Mediolanum cannot govern us. We are not tearing the purple, but mending it—a sovereign Gallic Empire is the only way to preserve Rome's legacy from the barbarians. This is not creation, but restoration."
 become_emperor_of_gaul_decision_tooltip:0 "One step to greatness..."
 become_emperor_of_gaul_decision_confirm:0 "The Empire Shall Once Again Exist!"

 restore_kemet_decision:0 "Restore the Egyptian Kingdom"
 restore_kemet_decision_desc:0 "For centuries, the peoples of Egypt have been ruled by others. Their lands have been fought over by the Romans, Greeks, and Persians. But no more! It is time we restore the Egyptian Kingdom of old and create a new era for the Egyptian people!"
 restore_kemet_decision_confirm:0 "Egypt for Egyptians!"
 restore_kemet_decision_tooltip:0 "It is time we restore the Kingdom of old"
 kemet_replace_titles_effect_tooltip:0 "Aegyptus and all other Egyptian Kingdom titles will be destroyed"
 TFE_kemet_traditional_borders:0 "Traditional Egyptian Borders"

 kemet_restored.0001.t:0 "Kemet Restored"
 kemet_restored.0001.desc:0 "My vassals and courtiers gather around me as I prepare to proclaim liberation to the people of Egypt.\n\nIn the dust of the Nile, a new sovereignty has risen. The cheering crowds gradually quieten, and now a crucial decision lies before us: where shall this reborn kingdom proceed?"  
 kemet_restored.0001.a:0 "Embrace Our Present State"  
 kemet_restored.0001.a.flavor:0 "The Arabic language and faith have become our new foundation."  
 kemet_restored.0002.b:0 "Return to the Original Suzerain"  
 kemet_restored.0002.b.flavor:0 "Let the double-headed eagle banner fly over Alexandria once more."  
 restore_kemet_decision.tt.effects.option.1:0 "Face reality and continue the rule of the Sultan"  
 restore_kemet_decision.tt.effects.option.2:0 "The golden light of Constantinople is a beacon of civilization and order—we need its protection and trade"

 TFE_formed_kemet_house_modifier:0 "Rulers of the Nile"

 LR_roman_diocese_event.0020.t:0 "The Gallic Empire"
 LR_roman_diocese_event.0020.desc:0 "Imperator Galliae, The Emperor of Gaul. This was a title Postumus himself effectively had during the crisis of the third century to claim  the imperial title. Today, the Gallic Empire has been proclaimed once again stronger than ever. Long live the Emperor!"
 LR_roman_diocese_event.0020.option.a:0 "The Gallic Empire is back!"
 LR_roman_diocese_event.0020.option.tooltip.a:0 "You are now the Gallic Emperor"

 central_claim:0 "Claim Your Liege's Throne"
 central_claim_desc:0 "If your liege is unable to counter your growing influence within the realm, what is preventing you from deposing an evidently-weak ruler?"
 central_claim_tooltip:0 "You claim your liege's throne"
 central_claim_confirm:0 "I will claim what is rightfully mine!" 
