l_english:
 LR_diadochi_line.0002.t:0 "One Line of the Diadochi"
 LR_diadochi_line.0002.desc:0 "The crowns of more than one of Alexander's successors have come to rest on my head. No court can serve two dynasties of the Diadochi: their claims, their courtiers and their memories pull against each other. I must choose which line I continue, and let the others pass into history."
 LR_diadochi_line.0002.keep_tt:0 "The titles of every other line of the Diadochi are destroyed"
 LR_diadochi_line.0002.antipatrid:0 "I continue the Antipatrid line"
 LR_diadochi_line.0002.antigonid:0 "I continue the Antigonid line"
 LR_diadochi_line.0002.seleukid:0 "I continue the Seleukid line"
 LR_diadochi_line.0002.ptolemaic:0 "I continue the Ptolemaic line"
 LR_diadochi_line.0002.argead:0 "I continue the Argead line"
 LR_diadochi_line.0002.lysimachid:0 "I continue the Lysimachid line"
 LR_diadochi_line.0002.attalid:0 "I continue the Attalid line"
 LR_diadochi_line.0002.mithridatid:0 "I continue the Pontic line"
 LR_diadochi_line.0002.graeco_bactrian:0 "I continue the Graeco-Bactrian line"
 LR_diadochi_line.0002.eumenid:0 "I continue the Eumenid line"
 LR_diadochi_line.0002.peithonid:0 "I continue the Peithonid line"

 LR_not_other_diadochi_line_tt:0 "Does not hold the title of another line of the Diadochi"