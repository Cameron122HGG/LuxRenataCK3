l_english:
 # Lux Invicta Celtic flavour events (Patrick Marchand, Jacob Hodge), ported 2026-11-06
 LR_celtic_flavor.0001.t: "Meeting a Bard"
 LR_celtic_flavor.0001.desc: "Out on a stroll in the mountains nearby, you encounter a strange, entrancing melody. Following the source of the sound, you come across an old, blind bard, playing his harp with a grace akin to the gods themselves."
 LR_celtic_flavor.0001.a: "Stand by and listen."
 LR_celtic_flavor.0001.b: "Mind if I join?"
 LR_celtic_flavor_sing_poetry_tt: "You start declaiming poetry."

 LR_celtic_flavor.0002.t: "The Afanc"
 LR_celtic_flavor.0002.desc: "The lake is placid as you throw your rope into the water. You let the soft singing of the birds lull you into deep thoughts as you daydream on its banks. Suddenly, the rope stirs and you are pulled into the water. Opening your eyes in the water shows a dark form swiftly swimming towards you."
 LR_celtic_flavor.0002.a: "Stay and fight!"
 LR_celtic_flavor.0002.b: "Run away!"

 LR_celtic_flavor.0003.t: "The Banshee"
 LR_celtic_flavor.0003.desc: "Unable to sleep, you take a walk in the castle gardens. Suddenly, you see a dark form near a small stream. It seems to be a woman, dressed in green and washing some bloody rags. As you try to see her more clearly, she raises her head and lets go a melodious, soul-wrenching scream. By the time you blink your eyes, she has disappeared."
 LR_celtic_flavor.0003.a: "It's a Banshee!"
 LR_celtic_flavor.0003.b: "Pah, spirits don't scare me."
 LR_banshee_omen_modifier: "Omen of the Banshee"
 LR_banshee_omen_modifier_desc: "This character has seen a banshee washing bloody rags, and heard her scream."

 LR_celtic_flavor.0004.t: "Bran's Voyage"
 LR_celtic_flavor.0004.desc: "The fresh sea air fills your lungs as you look over the wild waters of the bay. You notice a strange ship, sailing in the distance. Its making is ancient and it never seems to approach the land, only slipping in and out of the fog like a spirit on the doorway."
 LR_celtic_flavor.0004.a: "Bran's ship, come to see the shores of Éire."

 # Journey to St Kilda (Jacob Hodge)
 LR_celtic_flavor.0005.t: "Rumours of St Kilda"
 LR_celtic_flavor.0005.desc: "You feel terribly ill, as if on the brink of death. You have heard rumours of a group of Celts on the island of St Kilda who continue to practise their old ways. These pagans may have forgotten knowledge on how to cure your illness."
 LR_celtic_flavor.0005.a: "Maybe these Celts can cure me."
 LR_celtic_flavor.0005.b: "Don't these barbarians also collect the heads of their enemies?"
 LR_celtic_flavor_travel_island_tt: "You travel to the island."
 LR_celtic_flavor_ignore_rumors_tt: "You ignore the rumours."

 LR_celtic_flavor.0006.t: "Arrival at St Kilda"
 LR_celtic_flavor.0006.desc: "As you arrive on the island, you begin to search for the rumoured Celts. Suddenly, someone grabs you and demands to know why you are here. After you explain your predicament, the man informs you that you can only be cured of your ailment if you worship their gods."
 LR_celtic_flavor.0006.a: "So, your gods can perform miracles? Let's get started then."
 LR_celtic_flavor.0006.b: "I refuse to accept your false gods!"
 LR_celtic_flavor_accept_healing_tt: "You place yourself in the hands of the islanders and their gods."

 LR_celtic_flavor.0007.t: "The Islanders' Gods"
 LR_celtic_flavor.0007.desc: "After several days of rest, you feel much better, and have begun to worship the islanders' gods as your own. As you travel back home, you learn to accept your new faith as the one true faith."
 LR_celtic_flavor.0007.a: "Their gods are now my gods."
 LR_celtic_flavor_miracle_st_kilda_tt: "The magic of the druids heals you of your illnesses."

 # First Celtic Emperor: Y Mab Darogan
 LR_celtic_flavor.0010.t: "The First Brythonic Emperor"
 LR_celtic_flavor.0010.desc_pagan: "Long have the Celtic peoples stood divided, easy pickings for conquerors over the millennia. From Julius Caesar to the Saxons and more, the land has been constantly ravaged by warfare. Worse still, most Celts had been robbed of their faith, taught the ways of the Romans' dead god. But the faith of the Druids has been brought back from the brink of destruction! Now [ROOT.Char.GetTitledFirstName] of the Britons, loyal adherent to the [ROOT.Char.GetFaith.ReligiousText], has united much of the Isles and declared [ROOT.Char.GetHerselfHimself] the rightful ruler of all Prydain! Henceforth, [ROOT.Char.GetSheHe] shall be known as 'Pendragon'!"
 LR_celtic_flavor.0010.desc: "Long have the Celtic peoples stood divided, easy pickings for conquerors over the millennia. From Julius Caesar to the Saxons and more, the land has been constantly ravaged by warfare. Now [ROOT.Char.GetTitledFirstName] of the Britons has united much of the Isles and declared [ROOT.Char.GetHerselfHimself] the rightful ruler of all Prydain! Henceforth, [ROOT.Char.GetSheHe] shall be known as 'Pendragon'!"
 LR_celtic_flavor.0010.a: "Long may I reign!"
 LR_celtic_flavor.0011.desc_pagan: "Long have the Celtic peoples stood divided, easy pickings for conquerors over the millennia. From Julius Caesar to the Saxons and more, the land has been constantly ravaged by warfare. Worse still, most Celts had been robbed of their faith, taught the ways of the Romans' dead god. But the faith of the Druids has been brought back from the brink of destruction! Now [SCOPE.sC('celtic_emperor').GetTitledFirstName] of the Britons, loyal adherent to the [SCOPE.sC('celtic_emperor').GetFaith.ReligiousText], has united much of the Isles and declared [SCOPE.sC('celtic_emperor').GetHerselfHimself] the rightful ruler of all Prydain! Henceforth, [SCOPE.sC('celtic_emperor').GetSheHe] shall be known as 'Pendragon'!"
 LR_celtic_flavor.0011.desc: "Long have the Celtic peoples stood divided, easy pickings for conquerors over the millennia. From Julius Caesar to the Saxons and more, the land has been constantly ravaged by warfare. Now [SCOPE.sC('celtic_emperor').GetTitledFirstName] of the Britons has united much of the Isles and declared [SCOPE.sC('celtic_emperor').GetHerselfHimself] the rightful ruler of all Prydain! Henceforth, [SCOPE.sC('celtic_emperor').GetSheHe] shall be known as 'Pendragon'!"
 LR_celtic_flavor.0011.a: "Long may [SCOPE.sC('celtic_emperor').GetSheHe] reign!"
 LR_celtic_flavor.0011.b: "Just another trumped-up savage pretending at imperium."

 # Druidic headhunters (Patrick Marchand)
 LR_headhunter.0001.t: "A Worthy Trophy"
 LR_headhunter.0001.desc: "Your fallen enemy lies before you. He was a valiant foe, and his head will make a great trophy to prove your valour to the gods. Grasping your blade firmly, you sever his head from the rest of his body."
 LR_headhunter.0001.a: "For [ROOT.Char.GetFaith.WarGodName]!"
 LR_headhunter.0002.t: "A Living Legend"
 LR_headhunter.0002.desc: "Some men say that you are nine feet tall, shoot lightning from your eyes and wield a sword the size of a tree; one story even says that you fart huge fireballs from your arse. Now these are just stories, but they bear witness to the legend your life has become."
 LR_headhunter.0002.a: "My legend will be greater than any other man's!"
 trait_LR_headhunter: "Headhunter"
 trait_LR_headhunter_desc: "The heads of many men and heroes are bloody tokens of this character's valour in combat."
 trait_LR_headhunter_legend: "Living Legend"
 trait_LR_headhunter_legend_desc: "The life of this warrior is legendary; their exploits match those of the mythic warriors of old."
