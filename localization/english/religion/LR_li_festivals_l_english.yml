l_english:
 # Lux Invicta festivals and the Irminsul (gen_li_festivals.py)
 LR_festival_opinion: "Attended a Festival"
 LR_hold_pagan_festival_decision: "Hold a Religious Festival"
 LR_hold_pagan_festival_decision_desc: "The festival of the gods is a time for offerings, sacrifice and feasting, when the victory of the gods over their foes is remembered by spirits and men alike."
 LR_hold_pagan_festival_decision_tooltip: "Honor the gods with offerings, a staged battle and a great feast."
 LR_hold_pagan_festival_decision_effect_tt: "You hold the festival: same-faith vassals are pleased, and you gain piety and a blessing for five years."
 LR_festival.0101.a: "Let the preparations begin."
 LR_festival.0101.t: "Preparations for the Festival"
 LR_festival.0101.desc: "Invitations have gone out to your vassals asking them to join you in this festival to honor [ROOT.Char.GetFaith.HighGodName]. You have decided to make the festival this year a special one, remembered by both spirits and men for many years to come."
 LR_festival.0102.a: "Take that, [ROOT.Char.GetFaith.DevilName]!"
 LR_festival.0102.t: "The Festival Begins"
 LR_festival.0102.desc: "Your vassals have arrived and the time of the festival to honor [ROOT.Char.GetFaith.HighGodName] is upon us. Offerings and sacrifices are put on a great altar, and a symbolic fight is staged between the foul [ROOT.Char.GetFaith.DevilName] and [ROOT.Char.GetFaith.HighGodName]. To everyone's delight, [ROOT.Char.GetFaith.HighGodName] emerges victorious, as always."
 LR_festival.0103.a: "A festival to remember!"
 LR_festival.0103.t: "The Festival Ends"
 LR_festival.0103.desc: "The offerings and sacrifices have been given, [ROOT.Char.GetFaith.DevilName] has been defeated, and the feast has come to an end. Your vassals are returning home, but most seem to agree that the festival to honor [ROOT.Char.GetFaith.HighGodName] was well worth the trip."
 LR_pagan_festival_modifier: "Held a Religious Festival"
 LR_hold_mithras_feast_decision: "Hold the Mithraic Rituals"
 LR_hold_mithras_feast_decision_desc: "Mithras, God of the Morning, is honored with the ritual banquet of Mithras and Sol, the burning of offerings at his altar and a great feast in the Mithraeum's triclinium."
 LR_hold_mithras_feast_decision_tooltip: "Gather your vassals at the Mithraeum for the rituals of Mithras and Sol."
 LR_hold_mithras_feast_decision_effect_tt: "You hold the festival: same-faith vassals are pleased, and you gain piety and a blessing for five years."
 LR_festival.0201.a: "My court's Pater will represent Mithras."
 LR_festival.0201.b: "The local Mithraeum's Pater will represent Mithras."
 LR_festival.0201.c: "I will represent Mithras!"
 LR_festival.0201.t: "The Mithraic Rituals"
 LR_festival.0201.desc: "You and your vassals arrive at the local Mithraeum, and the time has come to begin the rituals in honor of Mithras and Sol. The Mithraeum's leading Pater starts the opening prayer: 'Mithras, God of the Morning, our trumpets waken the wall! [ROOT.Char.GetPrimaryTitle.GetNameNoTier] is above the Nations, but Thou art over all! Now as the names are answered, and the guards are marched away, Mithras, also a soldier, give us strength for the day!' As is tradition, the cult's senior officers, the Paters, must represent the parts of Mithras and Sol in their feast scene. But who will receive the highest honor of representing Mithras himself? Giving it to your court's Pater would be seen as legitimate and prestigious, choosing the local Mithraeum's Pater would be much more pious, and representing Mithras yourself might paint you in a grandiose light, though the Mithraic officers will not be so happy."
 LR_festival.0202.a: "I wear the Armor of Mithras. I am shielded from all that is harmful!"
 LR_festival.0202.b: "I wield the Weapons of Mithras. No darkness may stand against them!"
 LR_festival.0202.c: "I stand in the Light of Mithras. In the Light, I am invincible, for Mithras is my crown!"
 LR_festival.0202.t: "Offerings at the Altar"
 LR_festival.0202.desc: "As the banquet scene ends, now it's the time to place offerings on Mithras's altar. The initiates give each one of you a part of the sacrificed bull's entrails, which you burn in a brazier placed on the altar while you start the prayer: 'Hail to thee Mithras, patron of soldiers! I come to thy abode as a Servant of the Light and as a Seeker of Wisdom. I beg thee to aid me in my desire to serve.' As the entrails burn, you continue the prayer..."
 LR_festival.0203.a: "Until next time!"
 LR_festival.0203.t: "The Rituals End"
 LR_festival.0203.desc: "This year's rituals to honor Mithras and Sol have finished, and you shake hands with your vassals as is proper Mithraic custom, before they return to their homes. Most seem to agree that the Rituals were properly done in accordance with Mithras and that the banquet was a great delight."
 LR_mithras_defense_modifier: "Mithraic Prayer of Defense"
 LR_mithras_offense_modifier: "Mithraic Prayer of Offense"
 LR_mithras_sovereignty_modifier: "Mithraic Prayer of Sovereignty"
 LR_hold_christ_blot_season_tt: "It is between October and December"
 LR_hold_christ_blot_decision: "Hold a Blót to Baldr Kristr"
 LR_hold_christ_blot_decision_desc: "Among the Christian Germans the old blót lives on: in autumn and winter, animals are sacrificed to Baldr Kristr, the Allsavior, and to the saints beneath him, and their meat is shared in a great feast."
 LR_hold_christ_blot_decision_tooltip: "Hold the autumn sacrifice to Baldr Kristr and his saints."
 LR_hold_christ_blot_decision_effect_tt: "You hold the festival: same-faith vassals are pleased, and you gain piety and a blessing for five years."
 LR_festival.0301.a: "I will offer a Horse to honor Baldr Kristr!"
 LR_festival.0301.b: "I will offer a Pig to our Lord."
 LR_festival.0301.c: "A lamb is all I can afford... let's hope the Allsavior is not offended."
 LR_festival.0301.t: "The Blót Begins"
 LR_festival.0301.desc: "The guests have arrived, and the time has come for the blót to begin! You gather outside the church, and start by offering animals as sacrifice to Baldr Kristr and the lesser saints under him. As is custom, you must offer an animal yourself: a horse is considered the greatest of sacrifices, offered by kings and the highest of chiefs, a pig is the usual sacrifice of the lower nobility and the free citizens, while a lamb is the only sacrifice peasants and lowborns can afford..."
 LR_festival.0302.a: "Saint Tyr, guardian and commander of the armies of Himnaríki!"
 LR_festival.0302.b: "Saint Thor, warrior and protector of the small-folk!"
 LR_festival.0302.c: "Saint Freyr, prosperous patron of Kings!"
 LR_festival.0302.d: "Saint Freyja, keeper of the house and protector of women!"
 LR_festival.0302.t: "The Patron Saint"
 LR_festival.0302.desc: "Though the sacrifice is held in the name of the only true god, Baldr Kristr, there are many saints subservient to him. Usually, one of them is invoked as the patron of the event, and they're known to bestow their favor on the ceremony's host."
 LR_festival.0303.a: "May the blood of Baldr Kristr grant me His strength..."
 LR_festival.0303.t: "The Blood of Kristr"
 LR_festival.0303.desc: "As [ROOT.Char.GetTitledFirstName], it is your duty to sacrifice the animal you chose. As the animal dies, you pour its blood into a chalice and bless it with the words 'the blood of Kristr', before drinking it."
 LR_saint_tyr_modifier: "St. Tyr's Protection"
 LR_saint_thor_modifier: "St. Thor's Might"
 LR_saint_freyr_modifier: "St. Freyr's Righteousness"
 LR_saint_freyja_modifier: "St. Freyja's Love"
 LR_hold_solar_procession_decision: "Celebrate a Solar Procession"
 LR_hold_solar_procession_decision_desc: "The sacred procession of Sol Invictus carries his radiant image from his temple to the palace, symbolic of His fall every sunset and rise every dawn, before the ruler addresses the people under His auspices."
 LR_hold_solar_procession_decision_tooltip: "Parade the image of Sol Invictus from his temple to your palace."
 LR_hold_solar_procession_decision_effect_tt: "You hold the festival: same-faith vassals are pleased, and you gain piety and a blessing for five years."
 LR_festival.0401.a: "The best food and splendorous decorations!"
 LR_festival.0401.b: "Good food and moderate decorations."
 LR_festival.0401.c: "Normal food and small decorations."
 LR_festival.0401.t: "Preparing the Procession"
 LR_festival.0401.desc: "A Solar Procession is not a cheap event: decorations must be paid for, and food must be distributed amongst the populace that come to see the glory of Sol Invictus. The more you spend, the more pious your image will appear to the general public."
 LR_festival.0402.a: "...The armies of [ROOT.Char.GetPrimaryTitle.GetNameNoTier] are on the verge of success..."
 LR_festival.0402.b: "...The wealth of [ROOT.Char.GetPrimaryTitle.GetNameNoTier] will expand beyond measure..."
 LR_festival.0402.c: "...Sol Invictus watches over us!"
 LR_festival.0402.t: "The Procession of Sol Invictus"
 LR_festival.0402.desc: "The time has finally come for Sol Invictus' sacred procession from his temple to your palace. At the head of the procession are images of foreign gods, come from far and wide, preceding and later flanking Sol Invictus, like servants before their only lord and master. Then comes the radiant icon of Sol Invictus himself: a golden sun, shaded by the image of a great eagle, its wings spread open, carried on a great chariot drawn by four pristine white horses.\n\nLast in the procession is you, on foot and flanked by your generals, ministers and guards, as even the greatest of rulers on this earth are nothing when compared to the glory of Sol. With the image of Sol placed on your palace's balcony, you give a speech to the onlooking populace. It is clear that you must announce the direction of your realm for the next year..."
 LR_festival.0403.a: "Praise Sol Invictus!"
 LR_festival.0403.t: "The Procession Ends"
 LR_festival.0403.desc: "The time has come to give the event a closing. The image of Sol is delivered back to the temple by the priests in a much more discreet ceremony, the banners are taken down, and the people return to their homes. They all agree, though, it was a great ceremony."
 LR_sol_armies_modifier: "Celebrated a Solar Procession: Armies"
 LR_sol_wealth_modifier: "Celebrated a Solar Procession: Wealth"
 LR_sol_watches_modifier: "Celebrated a Solar Procession: Sol's Gaze"
 LR_hold_tawusgeran_season_tt: "It is between September and November"
 LR_hold_tawusgeran_decision: "Hold the Tawusgeran"
 LR_hold_tawusgeran_decision_desc: "In autumn the brass images of Tawuse Melek, the Peacock Angel, are paraded through the villages, holy water is given out, and the faithful gather for sacrifice and a great feast."
 LR_hold_tawusgeran_decision_tooltip: "Parade the sacred images of the Peacock Angel and hold the Tawusgeran feast."
 LR_hold_tawusgeran_decision_effect_tt: "You hold the festival: same-faith vassals are pleased, and you gain piety and a blessing for five years."
 LR_festival.0501.a: "Glory to [ROOT.Char.GetFaith.HighGodName]!"
 LR_festival.0501.t: "The Sacred Images"
 LR_festival.0501.desc: "The sacred images are paraded around the nearby villages by the priests. These images are made of brass, and symbolize Tawuse Melek, the Peacock Angel. Holy water is also distributed and taxes are collected from the pious in the name of [ROOT.Char.GetFaith.HighGodName]."
 LR_festival.0502.a: "We honor you, [ROOT.Char.GetFaith.HighGodName]."
 LR_festival.0502.t: "The Tawusgeran Feast"
 LR_festival.0502.desc: "Your vassals have arrived and the time of the Tawusgeran feast is upon us. Bulls and oxen are sacrificed to honor the Peacock Angel, sermons are preached by the priests, and guests are blessed with holy water."
 LR_festival.0503.a: "Until next year!"
 LR_festival.0503.t: "The Feast Ends"
 LR_festival.0503.desc: "The food is gone, and the festival has come to an end. Your vassals are returning home, but you all agree that this year's Tawusgeran celebration was well worth the trip."
 LR_tawusgeran_modifier: "Held the Tawusgeran"
 LR_festival.0900.a: "Wodanaz, the Wise One, patron of men!"
 LR_festival.0900.b: "Teiwaz, the patron of war and good governance!"
 LR_festival.0900.c: "Frijjo, the Lady, protector of women and blesser of marriages!"
 LR_festival.0900.d: "Thunraz, god of thunder and protector of farmers!"
 LR_festival.0900.t: "The Irminsul"
 LR_festival.0900.desc: "You have raised an Irminsul, a wooden pillar dedicated to the divine, made from the hollowed trunk of a sacred oak. It is custom to carve the face of a deity in it, to honor them. Who should be carved into it?"
 LR_festival.0901.t: "Wodanaz's Irminsul"
 LR_festival.0901.desc: "It's a great ceremony at the sacred grove, and people from all over the land have gathered there to see the Irminsul raised. As [ROOT.Char.GetTitledFirstName], it is your duty to preside over the ceremony. Your workers raise the Irminsul your craftsmen carved the oak's trunk into. Now it is a great wooden pillar, carved in interlaced patterns, with all kinds of scenes involving animals and myths carved into it as well. But one carving stands above all others: a sagely male face with a long beard, overlooking from the top of the Irminsul all those who have gathered to see it raised with a fatherly gaze. It's no doubt Wodanaz, father of all."
 LR_festival.0901.a: "All praise Wodanaz, the Wise One, father of men!"
 LR_irminsul_wodanaz_modifier: "Wodanaz's Irminsul"
 LR_festival.0902.t: "Teiwaz's Irminsul"
 LR_festival.0902.desc: "It's a great ceremony at the sacred grove, and people from all over the land have gathered there to see the Irminsul raised. As [ROOT.Char.GetTitledFirstName], it is your duty to preside over the ceremony. Your workers raise the Irminsul your craftsmen carved the oak's trunk into. Now it is a great wooden pillar, carved in interlaced patterns, with all kinds of scenes involving animals and myths carved into it as well. But one carving stands above all others: a strong male face with a stern look and long hair. It's no doubt Teiwaz, lord of war and patron of good governance!"
 LR_festival.0902.a: "All praise Teiwaz, may he strengthen the hearts of the brave and true!"
 LR_irminsul_teiwaz_modifier: "Teiwaz's Irminsul"
 LR_festival.0903.t: "Frijjo's Irminsul"
 LR_festival.0903.desc: "It's a great ceremony at the sacred grove, and people from all over the land have gathered there to see the Irminsul raised. As [ROOT.Char.GetTitledFirstName], it is your duty to preside over the ceremony. Your workers raise the Irminsul your craftsmen carved the oak's trunk into. Now it is a great wooden pillar, carved in interlaced patterns, with all kinds of scenes involving animals and myths carved into it as well. But one carving stands above all others: a female face with a kind look. It's no doubt Frijjo, wife of Wodanaz and protector of women!"
 LR_festival.0903.a: "All praise Lady Frijjo, beauty of the gods and protector of the home!"
 LR_irminsul_frijjo_modifier: "Frijjo's Irminsul"
 LR_festival.0904.t: "Thunraz's Irminsul"
 LR_festival.0904.desc: "It's a great ceremony at the sacred grove, and people from all over the land have gathered there to see the Irminsul raised. As [ROOT.Char.GetTitledFirstName], it is your duty to preside over the ceremony. Your workers raise the Irminsul your craftsmen carved the oak's trunk into. Now it is a great wooden pillar, carved in interlaced patterns, with all kinds of scenes involving animals and myths carved into it as well. But one carving stands above all others: a fierce face, with hair as red as fire. It's no doubt Thunraz, god of thunder and protector of farmers!"
 LR_festival.0904.a: "All praise Thunraz, may he rain his blessings on those who pay tribute to him!"
 LR_irminsul_thunraz_modifier: "Thunraz's Irminsul"
 LR_festival.0950.t: "Sacrifice at the Irminsul"
 LR_festival.0950.desc: "You bring [LR_irminsul_victim.GetTitledFirstName] to the sacred grove to be sacrificed in honor of [ROOT.Char.GetFaith.HighGodName]. As [ROOT.Char.GetTitledFirstName], it is your sacred duty to see it done. [LR_irminsul_victim.GetFirstName] begs you not to... but it is useless. You place [LR_irminsul_victim.GetHerHim] on a stone altar before the Irminsul, then take part of the blood with your hands and spray it over the trees in the grove, placing the rest in a wooden bowl at the altar, as an offering to [ROOT.Char.GetFaith.HighGodName]."
 LR_festival.0950.a: "This will please [ROOT.Char.GetFaith.HighGodName]."
 LR_irminsul_sacrifice_modifier: "Blessed at the Irminsul"
 LR_sacrifice_at_irminsul_decision: "Sacrifice at the Irminsul"
 LR_sacrifice_at_irminsul_decision_desc: "Bring a prisoner of foreign faith to the sacred grove and offer [LR_irminsul_victim.GetHerHim] at the Irminsul."
 LR_sacrifice_at_irminsul_decision_tooltip: "Offer a prisoner to the gods at the Irminsul."
 LR_sacrifice_at_irminsul_prisoner_tt: "You hold a prisoner of another faith"
 great_project_type_LR_raise_irminsul: "Raise an Irminsul"
 great_project_type_LR_raise_irminsul_desc: "An Irminsul is a wooden pillar dedicated to the divine, made from the hollowed trunk of a sacred oak and carved with the face of a god. Raised in a sacred grove, it watches over the land and its people."
 great_project_type_tooltip_LR_raise_irminsul: "A sacred pillar for the gods of the Germanic peoples."
