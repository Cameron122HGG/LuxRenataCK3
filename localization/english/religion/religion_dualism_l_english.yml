 #Sethianism
 sethianism: "Sethianism"
 sethianism_adj: "Sethian"
 sethianism_adherent: "Sethianist"
 sethianism_adherent_plural: "Sethianists"
 sethianism_desc: "The Sethiotae ('Followers of Seth') are a Local Gnostic cult of Traditional Soul, with significant Jewish influences. According to the Sethoit mythos, the material world was created by the demiurge Yaldabaoth, who in turn was a creation of Sophia - an emanation of the Only God's wisdom. Yaldabaoth has created the Earth, assisted by his subordinates - the Archons - and tricked mankind into believing he is the Only God. His greatest creation is Adam and Eve's third son - Seth - who unwittingly inherited divine powers Yaldabaoth had stolen from Sophia. According to Sethians, Jesus of Nazareth was Seth's reincarnation, and his earthly mission was to reunify human souls - particles of Light dispersed in the world - with the divine world called Pleroma. Since the Light is timeless and eternal, Sethians cherish tradition, upholding ceremonies and beliefs described in the scriptures. They are steadfastly orthodox, considering every change as yet another corrupted creation of Yaldabaoth, aimed to retake the divine powers Seth inherited."
