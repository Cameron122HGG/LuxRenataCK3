 mand_ruha_desc: "The cult of Rūha d-Qudša is a Heretical Gnostic faith of Traditional soul. Rūha d-Qudša is regarded as the Holy Spirit in the Bible, Qur'an, and Torah, but in Mandaean tradition is viewed as a malevolent, seductive female spirit. She is ruler of the World of Darkness alongside her son Ur, and from their carnal union birthed the seven planets and the twelve constellations. Rūha, alongside her celestial progeny, is also responsible for the founding of Jerusalem, which was conducted against the will of Heaven. The cult was founded after Kawus' defeat by his brother, the Sassanid Emperor Khosrau I, in the Great Mazdakite Revolt in 539 CE. Forced to recant his Mazdakite beliefs, the embittered prince and his surviving followers turned to a new source of spiritual liberation in the hedonism of the Queen of Darkness."
