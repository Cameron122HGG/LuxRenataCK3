 mani_slavic_desc: "The teachings of Dragomir are a Local Gnostic religion of Populist Soul, with strong Slavic influences. Created by the Manichaean priest Dragomir in the latter half of the 9th Century CE, Dragomirism claims that the universe is an arena of eternal war between the Creator God (often identified with Rod) and the evil, chaotic dragon Zmey. Zmey is the creator of the material world, which he planned to use to corrupt the Creator God's pure divine creation. According to Dragomirist theology, humans are the only material beings possessing a Soul - and as such are the only ones that can stand up against Zmey in this eternal struggle. Dragomirist beliefs incorporate the majority of Slavic pantheon - deities like Perun, Svarog and Dazhbog are lesser beings who attempt to harness Zmey's matter and turn it against its master. Dragomirists constitute small autonomous communities sharing all material properties, centered around the performing of esoteric rituals aiming at exorcising Zmey and bringing forth spiritual purity in this world. These Dragomirist communities are enthusiastic to fight Zmey's servants, but they often make for extremely unruly subjects."
