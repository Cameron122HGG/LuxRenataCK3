 mani_ahriman_desc: "The cult of Ahriman is a Heretical Gnostic sect of Messianic Soul, with strong Steppe influences. It is a cult worshipping the Manichaean king of darkness, Ahriman, in an effort to bring about total darkness on the world. Followers of Ahriman seek to throw away the balance between shadow and light in the world and bring back the World of Darkness, the realm of their master, that existed since primordial times. They will fight zealously against all those who stand in their way."
