 #Priscillianism
 priscillianism: "Priscillianism"
 priscillianism_adj: "Priscillian"
 priscillianism_adherent: "Priscillian"
 priscillianism_adherent_plural: "Priscillians"
 priscillianism_desc: "Priscillianism is a Heretical Christian sect of Messianic Soul, with a strong Gnostic influence. Priscillian was an Iberian ascetic mystic living in the fourth Century, who regarded the Christian life as continual intimacy with God. He created an ascetic group which thrived in spite of his execution for heresy. Its dualistic doctrine is based on the belief in the Kingdoms of Light and Darkness. Angels and men are from the Kingdom of Light and made from matter taken from God. Men received the mission to destroy the Kingdom of Darkness, but they fell and were imprisoned in human bodies. Thus both kingdoms are represented in men - the light by the Twelve Patriarchs which correspond to man's powers, and the darkness by the signs of the Zodiac and matter. Since the Twelve Patriarchs could not free man, Jesus was sent in a mortal body to release man from the curse of earthly matter. The salvation of man consists in liberation from the domination of matter, and at the center of Priscillianism is a strong call to a life of personal piety and asceticism, including celibacy, vegetarianism, and abstinence from alcohol.  This doctrine has always been under harsh repression from the mainstream Church, but the power of its ascetic message serves as the foundation for this deeply rooted sect. Priscillians do not attend churches integrated to villages and cities for their religious ceremonies, as most other Christians do. Instead, Priscillian priests organize religious and social life within the confine of a network of impregnable fortresses, which they initially developed to resist repression and invasions. Within the austere stone walls, they impose tenuous ascetic practices on themselves and their community, requiring extreme self-control in a spiritual as well as physical sense. These practices are based as much on studies of the secret scriptures as on stern training in the arts of war and murder in the name of the Christ of Light."
 priscillianism_high_god_name: "God"
 priscillianism_high_god_name_2: "The Lord" # Optional translation alt
 priscillianism_high_god_name_possessive: "God's"
 priscillianism_good_god_saviour: "The Christ of Light"
 priscillianism_good_god_the_light: "The Light"

