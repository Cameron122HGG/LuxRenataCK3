 mani_norse_old_adherent: "Old Ginungstrúari"
 mani_norse_old_adherent_plural: "Old Ginungstrúande"
 mani_norse_desc: "Ginungstrú is a Norse faith with Zoroastrian, Gnostic, Buddhist and Neoplatonist influences, emerging from the crash of ideas from the two great empires south of the Varangian colonies among the Rus. Ginungstrú, meaning Creative Faith, refocuses Norse mythology on the very beginning of space and time itself, Ginnungagap, the Gap of Creation through which the primordial energies of heat and cold interacted to birth time and space. Matter itself is viewed with mild resentment, usually referenced as Ymir, after the primordial creature from which most matter was formed by the Aesir, including Odin and his brothers, creating humans by breathing a remnant of Ginnungagap's creative energies into them. Much like the Rökkatrúar, the Ginungstrú believe the Twilight of the Gods as a just punishment of the Aesir for their corruption of Creation, but unlike their counterparts see this event as already passed. Baldr, having been returned to the physical realm and blessed with knowledge of pure Creation beyond matter, was the great Prophet of this new era in which humans find themselves free of fading Old Gods who now have but lingering malign influence on the world. Instead humans must seek to embrace universal Order and fight Chaos, to make Creation more alike to the Uncreated Ginnungagap. Through maintaining order in the world, they can ascend into the higher plane of non-material existence, or follow the example of Mimir and Baldr and be reborn through the Lifsmeiðr, the Tree of Life, usually equated with Yggdrasil or Mimir's Tree. Those seen as reborn in this way are treated with an almost messianic reverence as guiding figures towards achieving universal Order and unity with Ginnungagap."
