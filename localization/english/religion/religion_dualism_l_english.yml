 #Mandeanism
 mandeaism: "Mandaeism"
 mandeaism_adj: "Mandaean"
 mandeaism_adherent: "Mandaean"
 mandeaism_adherent_plural: "Mandaeans"
 mandeaism_desc: "Mandaeism is a Local Gnostic religion of Traditional Soul. In Mandaeism, there are about nine features which are the fundamental tenets: A supreme formless Entity, the expression of which in time and space is creation of spiritual, etheric, and material worlds and beings. Production of these is delegated by It to a creator or creators who originated in It. The cosmos is created by Archetypal Man, who produces it in similitude to his own shape. Dualism is a strong feature of Mandaeism, with opposites in the cosmic universe such as Father and Mother, and Light and Darkness. As a feature of this dualism, there are counter-types, a world of ideas. The soul is portrayed as an exile, with home and origin being the supreme Entity to which the soul eventually returns. Planets and stars influence fate and human beings, and are also places of detention after death. A savior spirit or savior spirits which assist the soul on the journey through life and after it to 'worlds of light'. Ideas and qualities are personified through a cult-language of symbol and metaphor. 'Mysteries', sacraments to aid and purify the soul, ensure rebirth into a spiritual body, and ascent from the world of matter. These are often adaptations of existing seasonal and traditional rites to which an esoteric interpretation is attached. This interpretation is based upon the creation story, especially on the Divine Man, Adam, as crowned and anointed King-priest. Great secrecy is enjoined upon initiates, with the full explanation of the creation story and the 'Mysteries' being reserved for those considered able to understand and preserve the gnosis. Marriage and procreation are a part of Mandaeism, and a strong emphasis on family life is placed. There is an abstention from strong drink and red meat, however. While Mandaeans reject Jesus of Nazareth, Abraham, and Moses, other characters from Abrahamic religions such as Adam, Abel, Seth, Enoch, Noah, Shem, Aram, and especially John the Baptist are highly revered."
 mandeaism_high_god_name: "The First Light"
