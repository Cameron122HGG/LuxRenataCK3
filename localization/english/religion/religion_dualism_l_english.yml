 #Valentinianism
 valentinianism: "Valentinianism"
 valentinianism_adj: "Valentinian"
 valentinianism_adherent: "Valentinian"
 valentinianism_adherent_plural: "Valentinians"
 valentinianism_desc: "Valentinianism is a Local Gnostic sect of Scholarly Soul, with a strong Christian ascendant. Valentinus was an early Christian gnostic theologian living in the 2nd Century CE who founded his own school in Rome when he failed to be selected for the bishop of Rome. The Valentinian theological system is deeply complex, and is kept secret to infidels. In the beginning, there was a Plemora (fullness) in which there was the Father. The Father projected thirty Aeons which joined into 15 syzygies, among them being Sophia (wisdom). Her curiosity and passion led to her fall from the Plemora and the creation of the world and man. Man must now recognize the Father as the true source of divine power in order to achieve gnosis, or knowledge. Only individuals of a spiritual nature, namely those following the truth revealed by Valentinus, can receive gnosis, allowing them to return to the divine Pleroma. Those of a psychic nature, the rest of the Christians, can only attain a lesser form of salvation, and that those of a worldly nature, non-Christian infidels, are doomed to perish. Valentinians devote much time studying their esoteric, complicated texts in order to achieve gnosis in this world."
