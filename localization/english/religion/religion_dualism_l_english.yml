 mani_germanic_adherent_plural: "Wulfilists"
 mani_germanic_desc: "The teachings of Wulfila are a Local Gnostic religion of Statist Soul, with strong Barbarian influences. A syncretic Germano-Manichaean faith, it features the archetypical dualism present in Manichaeism, that of the clash between light and darkness. The traditional Germanic focus on Wodanaz moves to a deity known as Auzawandilaz, the Luminous Wanderer, who wages eternal war against the forces of the Múspell, 'the world destroyers'. Their conflict is said to end in a cataclysmic event that will cover the world in flames, but thanks to Auzawandilaz humanity will endure and rebuild. It is named after its founder, Wulfila, a Gothic-Greek that translated and adapted the Gospel of Mani to evangelize the Germanic tribes."
