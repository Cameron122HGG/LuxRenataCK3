 #Manicheanism
 manichean: "Manichaeism"
 manichean_adj: "Manichaean"
 manichean_adherent: "Manichaean"
 manichean_adherent_plural: "Manichaeans"
 manichean_desc: "Manichaeism is a Mainstream Gnostic religion of Messianic Soul, with strong Persian influences. The faith is based on the teachings of Mani, a prophet originally from Persia. Similarly to Zoroastrianism, Manichaeism features a conflict between light and darkness. With Manichaeism, however, the conflict is mainly internal, and the struggle of good versus evil is characterized by the struggle between Primal Man and Satan. It also plays out over the world, but things like the earth and the flesh are not seen as inherently good or evil, but rather possessed by light or darkness."
