l_english:
 # Lux Invicta Celtic changelings (LI celtic_changelings.txt, ancrel.211-244), ported 2026-11-06
 LR_changeling.0002.t: "A Druid's Warning"
 LR_changeling.0002.desc: "You are spending some time with little [SCOPE.sC('changeling_child').GetFirstName] when [SCOPE.sC('changeling_druid').GetFirstName], your court druid, comes silently to your side. 'Be careful with the child, the borders between the world of man and the otherworld are thin these days...'"
 LR_changeling.0002.a: "Druid, stop scaring my family with your stories!"
 LR_changeling.0002.b: "Is that so? Maybe I should try to appease the gods?"
 LR_changeling.0002.b.tt: "Your offerings may keep the Sidhe away from the child."

 LR_changeling.0010.t: "A Strange Child"
 LR_changeling.0010.desc: "It is the dead of night when a sudden chill comes upon you. You open your eyes and sit up only to see [SCOPE.sC('changeling_child').GetFirstName] standing at the foot of your bed staring at you in complete silence. After rubbing the sleep out of your eyes, you look again and now there is no sign of the child."
 LR_changeling.0010.a: "Was it a dream?"
 LR_changeling.0011.desc: "[SCOPE.sC('changeling_child').GetFirstName] is sitting on the floor, playing with [SCOPE.sC('changeling_child').GetHerHis] toys when something dark suddenly seems to come over the child. While spasming wildly, [SCOPE.sC('changeling_child').GetFirstName] cries out in a tongue foreign to you and looks wildly about, looking for shelter from... something."
 LR_changeling.0011.a: "That can't be a good sign..."
 LR_changeling.0012.desc: "An inhuman wail interrupts your sleep, and you hurry outside with your sword. On the ground in front of the castle you find [SCOPE.sC('changeling_child').GetFirstName] running around in circles around a burning fire."
 LR_changeling.0012.a: "[ROOT.Char.GetFaith.HighGodName] help me..."
 LR_changeling_acts_strange_tt: "[SCOPE.sC('changeling_child').GetFirstName]'s behavior concerns you sometimes."

 LR_changeling.0020.t: "A Tragic Accident"
 LR_changeling.0020.desc: "The corpse of [SCOPE.sC('changeling_victim').GetTitledFirstName] was discovered today at the bottom of a steep ravine with a broken neck. It seems to have been a tragic accident ordained by the gods, but strangely, [SCOPE.sC('changeling_child').GetFirstName] was seen standing next to the ravine, peering down into it just before the tragedy was revealed."
 LR_changeling.0020.a: "Curious..."
 LR_changeling.0021.desc: "[SCOPE.sC('changeling_victim').GetTitledFirstName] was found impaled on a wooden fence just outside your courtyard this morning. You can only deduce that [SCOPE.sC('changeling_victim').GetSheHe] fell on the fence from the roof of your stable, though what business [SCOPE.sC('changeling_victim').GetSheHe] had up there you cannot fathom. Poor [SCOPE.sC('changeling_child').GetFirstName] was the first one to lay eyes on the gruesome scene..."
 LR_changeling.0021.a: "Yes, an interesting coincidence..."
 LR_changeling.0022.desc: "[SCOPE.sC('changeling_victim').GetTitledFirstName] was found stuffed head first into a barrel full of rain water this morning, with only [SCOPE.sC('changeling_victim').GetHerHis] pale, rigid legs visible above the surface. Your guards speculate that [SCOPE.sC('changeling_victim').GetSheHe] tripped, somehow fell into the barrel and then tragically drowned. [SCOPE.sC('changeling_child').GetFirstName] was found playing just nearby, but doesn't seem to have seen anything."
 LR_changeling.0022.a: "Yes... I suppose it could have happened that way..."

 LR_changeling.0030.t: "The Changeling Trade"
 LR_changeling.0030.desc: "[SCOPE.sC('changeling_druid').GetTitledFirstName] ambushes you as you leave your personal grove and speaks to you in a pleading voice. '[SCOPE.sC('changeling_child').GetFirstName] has clearly been taken by the lesser Sidhe, [SCOPE.sC('changeling_child').GetSheHe] has been replaced with a changeling. I must try to contact the Sidhe and perform a trade, there is no other way, but I won't lie - the child may or may not survive the ordeal. Nevertheless, the child must be saved.'"
 LR_changeling.0030.a: "Perform the ritual."
 LR_changeling.0030.b: "If you so much as touch [SCOPE.sC('changeling_child').GetFirstName]..."
 LR_changeling_trade_approved_tt: "You approve the trade."
 LR_changeling_trade_denied_tt: "You refuse the trade."
 LR_changeling.0031.desc: "The druidic ritual to contact the Sidhe has begun. The child is brought to a raised platform in a grove where [SCOPE.sC('changeling_druid').GetFirstName] awaits surrounded by chanting maidens. You are not permitted to witness the sacred ritual itself, so you depart the grove and wait."
 LR_changeling.0031.a: "[ROOT.Char.GetFaith.HighGodName] preserve us."
 LR_changeling_trade_begins_tt: "You pace back and forth."
 LR_changeling.0032.desc: "The incantations from the grove suddenly stop, and several maidens, their white gowns red with someone else's blood, run past screaming. Fearing the worst you hurry back, but when you reach the platform you find only the butchered remains of [SCOPE.sC('changeling_druid').GetFirstName]... and [SCOPE.sC('changeling_child').GetFirstName] lying unconscious next to them."
 LR_changeling.0032.a: "[ROOT.Char.GetFaith.HighGodName] preserve us..."
 LR_changeling_freed_tt: "The Sidhe will trouble [SCOPE.sC('changeling_child').GetFirstName] no more."
 LR_changeling.0033.desc: "A solemn procession of maidens led by [SCOPE.sC('changeling_druid').GetTitledFirstName] finally emerges from the grove, but there is no sign of [SCOPE.sC('changeling_child').GetFirstName]. 'It is done,' [SCOPE.sC('changeling_druid').GetFirstName] announces. 'The changeling has been sent back... but I fear there was no way to save your child. The Sidhe are fickle beings.'"
 LR_changeling.0033.a: "Then your life is forfeit as well, druid!"
 LR_changeling.0033.b: "Leave while you still can, [SCOPE.sC('changeling_druid').GetFirstName], and never return."
 LR_changeling.0033.c: "You have my thanks... it had to be done."
 LR_changeling.0034.desc: "The chanting from the grove comes closer and [SCOPE.sC('changeling_druid').GetTitledFirstName] appears together with [SCOPE.sC('changeling_child').GetFirstName], flanked on either side by singing maidens. The child looks shaken, but otherwise unharmed. 'It is done,' [SCOPE.sC('changeling_druid').GetFirstName] announces. 'The child has been saved.'"
 LR_changeling.0034.a: "Thank the gods!"
 LR_changeling.0035.desc: "The chanting from the grove comes closer and [SCOPE.sC('changeling_druid').GetTitledFirstName] appears together with [SCOPE.sC('changeling_child').GetFirstName], flanked on either side by singing maidens. The child's vacant stare hints that something is wrong. 'It is done,' [SCOPE.sC('changeling_druid').GetFirstName] announces. 'The changeling has been sent back, but the struggle was great. I fear it has left scars on [SCOPE.sC('changeling_child').GetFirstName] that may never heal...'"

 LR_changeling.0040.t: "Changeling"
 LR_changeling.0040.desc: "You have known since you were a child that you were not fully... normal. The druids say that you were switched at birth and that your strange temperament and short fuse are due to your otherworldly nature, for you are a changeling, half human, half Sidhe or maybe... half Fomorian?"
 LR_changeling.0040.a: "It is my time now."

 trait_LR_changeling: "Changeling"
 trait_LR_changeling_desc: "This character is thought to be a changeling, switched at birth by fairies."
 LR_changeling_warning_dismissed_opinion: "Dismissed my warning"
 LR_changeling_trade_refused_opinion: "Refused the changeling trade"
 LR_changeling_trade_thanks_opinion: "Allowed the changeling trade"
