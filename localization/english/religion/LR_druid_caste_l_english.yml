l_english:
 # Lux Invicta druidic caste (ancrel.152 - ancrel.207), ported 2026-11-06
 LR_court_druid_priestly_court_position: "Court Druid (Priest)"
 LR_court_druid_priestly_court_position_desc: "Responsible for organizing worship and sacrifices, divination, and judicial procedure in Celtic society, the $LR_court_druid_priestly_court_position$ is as essential to a ruler as their sword. This one is a servant of the gods."
 LR_court_druid_diplomatic_court_position: "Court Druid (Lawgiver)"
 LR_court_druid_diplomatic_court_position_desc: "Responsible for organizing worship and sacrifices, divination, and judicial procedure in Celtic society, the $LR_court_druid_diplomatic_court_position$ is as essential to a ruler as their sword. This one is a master of law."
 LR_court_druid_is_druid_aptitude: "[GetTrait('LR_druid').GetName( ROOT.Char )]"
 LR_court_druid_cynical_trait: "[GetTrait('cynical').GetName( ROOT.Char )]"
 LR_court_druid_only_one_tt: "Does not already employ a Court Druid"
 LR_court_druid_employee_desc: "Becomes a [GetTrait('LR_druid').GetName( GetNullCharacter )] if not one already"
 trait_LR_wicked_druid: "Wicked Druid"
 trait_LR_wicked_druid_desc: "This druid has decided to use the ancient secrets of the druids for [ROOT.Char.GetHerHis] own personal gain; such sacrilegious behavior is unfitting of a druid."
 trait_LR_druid_novice: "Druid Novice"
 trait_LR_druid_novice_desc: "This character is learning the secret arts and rituals of the Druids, and has much to learn."
 LR_druid_training_refused_opinion: "Forbade my druidic training"
 LR_druid_patron_opinion: "Brought me to court"
 LR_druid.0001.t: "No Druid at Court"
 LR_druid.0001.desc: "The people of your court are incredulous. "Great [ROOT.Char.GetFirstName], it is a shame that you do not have a Druid at court! Are you to be like a Bard without his voice, a warrior without his spear, a farmer without his seeds?" No self-respecting ruler of the Celts can go without a Druid, after all.\n\nA lord must choose their Druid with care, for while all druids are wise, not all have specialized in the same teachings."
 LR_druid.0001.a: "Yes, there's a suitable candidate at court."
 LR_druid.0001.b: "Send for a master of law."
 LR_druid.0001.b.tt: "A druid learned in the law will come to your court"
 LR_druid.0001.c: "Bring me a servant of the gods."
 LR_druid.0001.c.tt: "A druid devoted to the gods will come to your court"
 LR_druid.0001.d: "I must find a knowledgeable Druid, and fast!"
 LR_druid.0002.t: "A Druid Arrives"
 LR_druid.0002.desc: "I have searched far and wide for a worthy Druid to serve at my court. [SCOPE.sC('new_druid').GetSheHe|U] will organize worship and sacrifices, divination, and judicial procedure, encourage my warriors, and provide me counsel. At long last, one such druid has arrived at my court, but I am not sure whether [SCOPE.sC('new_druid').GetSheHe] is worthy... A ruler must choose their Druid wisely, after all.\n\n[SCOPE.sC('new_druid').GetFirstName] presents [SCOPE.sC('new_druid').GetHerselfHimself] to you. In order to judge of [SCOPE.sC('new_druid').GetHerHis] talents, you request [SCOPE.sC('new_druid').GetHerHim] to show you the subject [SCOPE.sC('new_druid').GetSheHe] is most skillful at."
 LR_druid.0002.a: "[SCOPE.sC('new_druid').GetSheHe|U] shall be my new Court Druid!"
 LR_druid.0002.b: "I will settle this matter later."
 LR_druid.0010.t: "Wicked Habits"
 LR_druid.0010.desc: "A Druid is expected to follow the Celtic Virtues of honor, loyalty, hospitality, honesty, justice and courage. Gossip is starting to spread about your wicked habits."
 LR_druid.0010.a: "May [ROOT.Char.GetFaith.HighGodName] have mercy on me."
 LR_druid.0020.t: "A Peculiar Wish"
 LR_druid.0020.desc: "Your child [SCOPE.sC('druid_child').GetFirstName] has expressed a peculiar wish: unsatisfied with the life of a warrior, [SCOPE.sC('druid_child').GetSheHe] wishes to learn the druidic arts and become closer to the gods.\n\nBut that way is strange and dangerous, and not all survive it."
 LR_druid.0020.a: "I will not allow it!"
 LR_druid.0020.b: "Yes, this will bring great honor to our family."
 LR_druid.0020.b.tt: "Your child will undergo training with the druids"
 LR_druid.0021.t: "The Path of the Druids"
 LR_druid.0021.desc: "An old man has arrived, dressed in the garb of a druid. He is here to take [SCOPE.sC('druid_child').GetFirstName] with him to a sacred grove deep inside the forest.\n\nThere [SCOPE.sC('druid_child').GetSheHe] will be taught the secret arts of the druids. This training will take many years, and novices have been known to come back changed, or worse..."
 LR_druid.0021.a: "Be safe, my child."
 LR_druid.0031.t: "Back from the Groves"
 LR_druid.0031.desc: "[SCOPE.sC('druid_child').GetTitledFirstName] is back from the druidic groves. There [SCOPE.sC('druid_child').GetSheHe] has learned much of the ways of the gods and of our people; [SCOPE.sC('druid_child').GetSheHe] has sung numerous stories and even come up with a few of [SCOPE.sC('druid_child').GetHerHis] own."
 LR_druid.0031.a: "I wish to hear of these new stories!"
 LR_druid.0032.t: "A Visitor in the Night"
 LR_druid.0032.desc: "The night is dark and cold when your servants wake you: a visitor has come to see you. Suddenly, a black shape pushes them to the side and approaches your bedside. You reach for your sword, but slowly realize who it is: [SCOPE.sC('druid_child').GetTitledFirstName], back from the forests of the druids!"
 LR_druid.0032.a: "[SCOPE.sC('druid_child').GetFirstName]! You've... changed!"
 LR_druid.0033.t: "Back from the Druids"
 LR_druid.0033.desc: "One of the supplicants at your court today is hopping on one leg, trying to keep [SCOPE.sC('druid_child').GetHerHis] balance with the help of a knotted stick of wood. [SCOPE.sC('druid_child').GetSheHe|U] has a familiar look, and as [SCOPE.sC('druid_child').GetSheHe] approaches your throne you finally understand why: it is [SCOPE.sC('druid_child').GetTitledFirstName], back from the druids!"
 LR_druid.0033.a: "My child, what have the gods done to you?"
