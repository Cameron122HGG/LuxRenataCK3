l_english:
 # Celtic divination, ported from Lux Invicta (written by Patrick Marchand)
 LR_hold_divination_decision: "Hold a Divination"
 LR_hold_divination_decision_desc: "Gather your people in the sacred grove and offer sacrifice to the gods so that the druids may divine our future. A prisoner from your dungeons will be given to the gods. This can only be done every fifth year."
 LR_hold_divination_decision_tooltip: "Offer a prisoner to the gods and have the druids read the omens."
 LR_hold_divination_decision_confirm: "Begin the preparations!"
 LR_hold_divination_decision_prisoner_tt: "You hold an adult prisoner who can be sacrificed"
 LR_hold_divination_decision_effect_tt: "You begin preparations for the divination. A prisoner will be sacrificed, and the omens may bring glory, victory or wealth, or warn of loss and the anger of the gods. A druid at your court improves the reading."
 LR_held_divination_opinion: "Held divination"
 LR_divination_promised_victory_modifier: "Promised Victory"
 LR_divination_promised_victory_modifier_desc: "This character has been promised a great victory by the gods, thus bolstering the morale of this character's warriors."
 LR_divination_promised_riches_modifier: "Promised Wealth"
 LR_divination_promised_riches_modifier_desc: "The wealth and knowledge promised by the gods have reinvigorated trade in this character's lands."
 LR_divination_foreboding_modifier: "Foretold Loss"
 LR_divination_foreboding_modifier_desc: "The druids have warned this character of a loss that will deeply affect this character."
 LR_divination_gods_displeased_modifier: "Displeased Gods"
 LR_divination_gods_displeased_modifier_desc: "The druids have warned of the disappointment of the gods with this character's dynasty."
 LR_divination.0001.t: "The Divination Begins"
 LR_divination.0001.desc: "The guests have arrived, and the time has come for the divination to begin! You gather near the grove, and start by offering animals as sacrifice to the gods. While their meat is prepared for the feast that is to follow, the blood is sprinkled on the trees and the many representations of the gods, as well as on the worshippers themselves."
 LR_divination.0001.desc_druid: "\n\nYour druid, [SCOPE.sC('LR_div_druid').GetTitledFirstName], leads the rites and will read the will of [ROOT.Char.GetFaith.HighGodName] in the sacrifice."
 LR_divination.0001.desc_self_druid: "\n\nAs a druid yourself, you lead the rites, and it will be you who reads the will of [ROOT.Char.GetFaith.HighGodName] in the sacrifice."
 LR_divination.0001.desc_no_druid: "\n\nNo druid serves at your court, and the wandering vates who lead the rites are a poor substitute."
 LR_divination.0001.a: "Now for the human sacrifice..."
 LR_divination.0001.a.druid_tt: "A druid leads the rites: good omens are more likely"
 LR_divination.0001.a.no_victim_tt: "There is no prisoner left to sacrifice, and the gods are denied their offering"
 LR_divination.0002.t: "The Sacrifice"
 LR_divination.0002.desc.generic_1: "[SCOPE.sC('LR_div_victim').GetTitledFirstName] is brought up from your dungeons and escorted to the grove. The vates walks around [SCOPE.sC('LR_div_victim').GetHerHim] while a druid talks of the gods. A small yellow pool forms at [SCOPE.sC('LR_div_victim').GetFirstName]'s feet."
 LR_divination.0002.desc.generic_2: "[SCOPE.sC('LR_div_victim').GetTitledFirstName] is brought up from your dungeons and escorted to the grove. When [SCOPE.sC('LR_div_victim').GetSheHe] sees the druid circling around [SCOPE.sC('LR_div_victim').GetHerHim], balancing a knife in his right hand, [SCOPE.sC('LR_div_victim').GetSheHe] pushes the nearest guard aside and makes a desperate run for it, but to no avail. Your men drag [SCOPE.sC('LR_div_victim').GetHerHim] kicking and screaming back to the middle of the grove."
 LR_divination.0002.desc.generic_3: "[SCOPE.sC('LR_div_victim').GetTitledFirstName] is brought up from your dungeons and escorted to the grove. Even as the druid approaches [SCOPE.sC('LR_div_victim').GetHerHim], [SCOPE.sC('LR_div_victim').GetFirstName] stares vacantly ahead without betraying any emotion whatsoever. It would seem [SCOPE.sC('LR_div_victim').GetSheHe] has accepted [SCOPE.sC('LR_div_victim').GetHerHis] fate."
 LR_divination.0002.desc.generic_4: "[SCOPE.sC('LR_div_victim').GetTitledFirstName] is brought up from your dungeons and escorted to the grove. As soon as [SCOPE.sC('LR_div_victim').GetSheHe] spots you among those gathered nearby, [SCOPE.sC('LR_div_victim').GetSheHe] hurls insults and spittle your way. The hatred in [SCOPE.sC('LR_div_victim').GetHerHis] eyes could not be mistaken."
 LR_divination.0002.desc.christian: "[SCOPE.sC('LR_div_victim').GetTitledFirstName] is brought up from your dungeons and escorted to the grove. As the druid paints [SCOPE.sC('LR_div_victim').GetHerHis] face, [SCOPE.sC('LR_div_victim').GetSheHe] steadies [SCOPE.sC('LR_div_victim').GetHerselfHimself] and murmurs several passages that you recognize as being from the Christian holy book."
 LR_divination.0002.desc.muslim: "[SCOPE.sC('LR_div_victim').GetTitledFirstName] is brought up from your dungeons and escorted to the grove. A vates starts taunting [SCOPE.sC('LR_div_victim').GetHerHim] with a branch of oak while [SCOPE.sC('LR_div_victim').GetSheHe] murmurs a passage with closed eyes from the Mohammedan holy book."
 LR_divination.0002.desc.brother: "Your brother, [SCOPE.sC('LR_div_victim').GetTitledFirstName], is brought up from his dungeon and escorted to the grove. As he is forced to his knees, he looks at you with pleading eyes. #italic Don't do this, [ROOT.Char.GetFirstName]. There has to be some other way...#!"
 LR_divination.0002.desc.sister: "Your sister, [SCOPE.sC('LR_div_victim').GetTitledFirstName], is dragged up from her dungeon and escorted to the grove. She looks up at you with tears streaming down her face as your vates force her to her knees. #italic Please, [ROOT.Char.GetFirstName],#! she says with a trembling voice. #italic Don't let them do this.#!"
 LR_divination.0002.desc.father: "The vates drag your father, [SCOPE.sC('LR_div_victim').GetTitledFirstName], from his dungeon and escort him to the grove where they sprinkle him with blood. #italic My child,#! he croaks while looking at you. #italic Can't you find it in your heart to forgive me?#!"
 LR_divination.0002.desc.mother: "Distant screaming can be heard as the vates drag your mother, [SCOPE.sC('LR_div_victim').GetTitledFirstName], from her dungeon. They bring her to the grove and as they place her before the sacrificial pit, she looks at you with pleading eyes. #italic W-why would you do this to your own mother?#!"
 LR_divination.0002.desc.son: "The vates fetch your son, [SCOPE.sC('LR_div_victim').GetTitledFirstName], from his dungeon and lead him to the grove. There he is laid down on the ground. Before the druid plunges his knife into him, your son looks at you with tearful eyes. #italic Please don't, [ROOT.Char.GetMotherFather]... please don't.#!"
 LR_divination.0002.desc.daughter: "Your daughter, [SCOPE.sC('LR_div_victim').GetTitledFirstName], is pulled from her dungeon and brought to the grove by the vates. As the druid slowly puts his hands around her neck, she looks at you with a desperate yet piercing glare. #italic Is this really what you have been reduced to, [ROOT.Char.GetMotherFather]? To do this... against your own daughter?#!"
 LR_divination.0002.desc.spouse: "Your spouse, [SCOPE.sC('LR_div_victim').GetTitledFirstName], is dragged into the middle of the grove as the vates readies his weapon. In a last desperate effort to save [SCOPE.sC('LR_div_victim').GetHerselfHimself], [SCOPE.sC('LR_div_victim').GetFirstName] calls out to you for mercy. #italic I have always loved you, [ROOT.Char.GetFirstName]... and I always will.#!"
 LR_divination.0002.desc.kin: "[SCOPE.sC('LR_div_victim').GetTitledFirstName] is brought from your dungeons by the vates and placed near the well in front of the grove. As they start plunging [SCOPE.sC('LR_div_victim').GetHerHim] in the cold water, [SCOPE.sC('LR_div_victim').GetFirstName] cries out to you. #italic Don't do this, [ROOT.Char.GetFirstName]! We are family and of the same blood!#!"
 LR_divination.0002.a.generic: "[ROOT.Char.GetFaith.HighGodName], we offer you this sacrifice..."
 LR_divination.0002.a.christian: "Where is your Blessed Virgin now, [SCOPE.sC('LR_div_victim').GetFirstName]?"
 LR_divination.0002.a.muslim: "Soon you shall meet your Prophet, friend."
 LR_divination.0002.a.brother: "I'm afraid not. Do it, men."
 LR_divination.0002.a.sister: "There can be no turning back now. I'm sorry."
 LR_divination.0002.a.father: "No."
 LR_divination.0002.a.mother: "Because I can."
 LR_divination.0002.a.son: "Do it, men."
 LR_divination.0002.a.daughter: "You have left me with little choice."
 LR_divination.0002.a.spouse: "Forgive me then, my love, but this is how it must be."
 LR_divination.0002.a.kin: "Yes, and that only proves my devotion to [ROOT.Char.GetFaith.HighGodName]."
 LR_divination.0002.b.generic: "No, I have changed my mind."
 LR_divination.0002.b.infidel: "No, perhaps this is a bad idea..."
 LR_divination.0002.b.brother: "No, I can't do this to my own brother..."
 LR_divination.0002.b.sister: "No... not my own sister..."
 LR_divination.0002.b.father: "I can't do this to my own father..."
 LR_divination.0002.b.mother: "I... I wouldn't..."
 LR_divination.0002.b.son: "I can't do this... not to my own boy..."
 LR_divination.0002.b.daughter: "No, send her back... not to my girl..."
 LR_divination.0002.b.spouse: "No, this is too much... I can't permit it."
 LR_divination.0002.b.kin: "It is true... [SCOPE.sC('LR_div_victim').GetSheHe] is kin."
 LR_divination.0002.b.tt: "The execution is stayed, and [SCOPE.sC('LR_div_victim').GetFirstName] is brought back to the dungeon"
 LR_divination.0002.b.omens_tt: "The gods have been denied their offering: ill omens are more likely"
 LR_divination.0011.t: "Omens of Glory"
 LR_divination.0011.desc: "The druids have divined the messages of the gods in the sacrifices we made. The whole assembly is attentive while the druids sing of the glory which awaits our grand dynasty."
 LR_divination.0011.a: "Glory to the Gods!"
 LR_divination.0012.t: "Omens of Victory"
 LR_divination.0012.desc: "The druids have divined the messages of the gods in the sacrifices we made. The whole assembly is attentive while the druids sing of a great victory which awaits our armies."
 LR_divination.0012.a: "Glory to the Gods!"
 LR_divination.0012.a.tt: "The promise of victory raises the morale of our warriors"
 LR_divination.0013.t: "Omens of Wealth"
 LR_divination.0013.desc: "The druids have divined the messages of the gods in the sacrifices we made. The whole assembly is attentive while the druids sing of the wealth and knowledge we will attain."
 LR_divination.0013.a: "Glory to the Gods!"
 LR_divination.0013.a.tt: "The promise of wealth reinvigorates trade in our lands"
 LR_divination.0014.t: "Omens of Loss"
 LR_divination.0014.desc: "The druids have divined the messages of the gods in the sacrifices we made. The whole assembly is attentive while the druids warn of a loss that will affect us deeply."
 LR_divination.0014.a: "Woe to me!"
 LR_divination.0015.t: "The Anger of the Gods"
 LR_divination.0015.desc: "The druids have divined the messages of the gods in the sacrifices we made. The whole assembly is attentive while the druids warn of the disappointment of the gods with our dynasty."
 LR_divination.0015.a: "Woe to me!"
 LR_divination.0020.t: "The Divination Ends"
 LR_divination.0020.desc: "The ceremony is over. It will be at least five years until you hold the next one, but as your vassals return home, most seem to agree that the ceremony was well worth the trip."
 LR_divination.0020.a: "Until next time!"
