l_english:
 saint_0001_obscured_desc: "The Holy Virgin Mary, who was chosen by God to bear His Child."
 saint_0002_obscured_desc: "Paul, the Apostle to the Gentiles, who carried the Gospel from Jerusalem to Rome."
 saint_0003_obscured_desc: "Mary of Magdala, the first to see the risen Christ."
 saint_0004_obscured_desc: "Ignatius, Bishop of Antioch, who went gladly to the beasts of the Roman arena."
 saint_0005_obscured_desc: "Cyprian, Bishop of Carthage, who held the African Church together through persecution and plague."
 saint_0006_obscured_desc: "Basil of Caesarea, father of eastern monks and champion of the poor."
 saint_0009_obscured_desc: "Jerome of Stridon, who gave the Latin Church its Bible."
 saint_0011_obscured_desc: "Nicholas, Bishop of Myra, the secret giver of gifts."
 saint_0012_obscured_desc: "Catherine of Alexandria, the learned virgin who confounded the philosophers."
 saint_0013_obscured_desc: "Cecilia, the Roman virgin martyr who sang to God in her heart."
 saint_0014_obscured_desc: "Lucy of Syracuse, the light of the Sicilian martyrs."
 saint_0015_obscured_desc: "Anthony the Great, the father of monks, who fought demons in the Egyptian desert."
 saint_0016_obscured_desc: "Benedict of Nursia, who gave the monks of the West their Rule."
 33922_obscured_desc: "May God's blessings and peace be upon him."
 MEGAS_ALEXANDROS_obscured_desc: "Alexander wept when he heard Anaxarchus discourse about an infinite number of worlds, and when his friends inquired what ailed him, 'Is it not worthy of tears,' he said, 'that, when the number of worlds is infinite, we have not yet become lords of a single one?."