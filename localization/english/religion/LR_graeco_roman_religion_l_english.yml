 # Lux Invicta Graeco-Roman religion content (gen_graeco_roman_religion.py)
 d_vestal_college: "College of Vesta"
 d_vestal_college_article: "the "
 d_vestal_college_adj: "Vestal"
 d_pontifex_maximus: "Pontifex Maximus"
 d_pontifex_maximus_article: "the "
 d_pontifex_maximus_adj: "Pontifical"

 trait_LR_vestalis: "Vestalis"
 trait_LR_vestalis_desc: "This character is a member of the College of the Vestales, and has dedicated 30 years of her life to the service of the goddess Vesta."
 trait_LR_retired_vestalis: "Retired Vestalis"
 trait_LR_retired_vestalis_desc: "This character served thirty years as a Vestal Virgin and has retired from the College of Vesta with honour."
 trait_LR_cult_of_orpheus: "Initiate of Orpheus"
 trait_LR_cult_of_orpheus_desc: "This character has been initiated into The Orphic Mysteries."
 trait_LR_cult_of_serapis: "Initiate of Serapis"
 trait_LR_cult_of_serapis_desc: "This character has been initiated into The Mysteries of Serapis."
 trait_LR_cult_of_eleusis: "Initiate of Eleusis"
 trait_LR_cult_of_eleusis_desc: "This character has been initiated into The Eleusinian Mysteries."
 trait_LR_cult_of_trophonius: "Initiate of Trophonius"
 trait_LR_cult_of_trophonius_desc: "This character has been initiated into The Mysteries of Zeus Trophonius."

 LR_nominate_vestalis_interaction: "Nominate as Vestalis"
 LR_nominate_vestalis_interaction_desc: "Dedicate [recipient.GetShortUIName] to thirty years of service to Vesta in the College of the Vestales."
 LR_nominate_vestalis_becomes_maxima_tt: "The College of Vesta has no Vestalis Maxima: [recipient.GetShortUIName] becomes its head"
 LR_vestal.0001.t: "Retirement from the College"
 LR_vestal.0001.desc: "After 30 years of devoted service to Vesta the time has come for you to retire from public office."
 LR_vestal.0001.a: "Vesta has been well served."
 LR_vestal_college_passes_tt: "The College of Vesta passes to the eldest serving Vestal, or lapses if there is none"

 LR_become_pontifex_maximus_decision: "Become Pontifex Maximus"
 LR_become_pontifex_maximus_decision_desc: "Since Augustus the Emperor has been the Pontifex Maximus, first among the priests of Rome. With both Romes in our realm, we can take up the office again and lead the worship of the gods."
 LR_become_pontifex_maximus_decision_tooltip: "Become head of the Roman faith."
 LR_become_pontifex_maximus_decision_confirm: "I am the Pontifex Maximus!"
 LR_become_pontifex_maximus_effect_tt: "The Roman faith gains a head of faith: you, as Pontifex Maximus. The office passes to your primary heir."
 LR_pontifex_rome_tt: "Rome is in your realm"
 LR_pontifex_constantinople_tt: "Constantinople is in your realm"

 LR_mysteries.0010.t: "The Orphic Mysteries"
 LR_mysteries.0010.desc: "You have been approached by a group of priests who have offered to initiate you into the Orphic Mysteries, a cult dedicated to the mythical poet, Orpheus, who descended into the Underworld to retrieve Persephone through his charm. Becoming a member would be a significant honor."
 LR_mysteries.0010.a: "I will gladly join."
 LR_mysteries.0010.b: "I am not interested."
 LR_mysteries.0011.desc: "The night descends, the Sun has set, and you walk the streets in the direction of the place where you are to be initiated. Suddenly, you find yourself lost, in front of a grove awash in a pale light, as if lit by a thousand candles.\n\nYou venture in, and you find yourself on a path guarded by men wearing masks of different animals. 'We are the souls hunted by Zagreus', they say, 'We are One with Dionysos. We are those who followed the Christ into Hades and returned'. At the end of the path is the Mystagogue, a man ten feet tall. He sacrifices three animals and bathes a white-clad woman in their blood. The candles give out a strange smell, and you feel dizzy. The men around you seem to twitch and shiver at the corners of your eyes. And there, the Mystagogue puts his hand on the woman's head and she falls down in a trance."
 LR_mysteries.0011.a: "Continue..."
 LR_mysteries.0012.desc: "He then looks at you, half bloody, and says: 'We are the Orpheotelestai, we see all paths and we see into everyone's soul. We have seen great promise in you. The path ahead is hard and full of mystery, but the reward could be priceless. We learn to become immortal, to become One with the Divine, to master Death. We invite you to our circle.' Then the candles burst out and give the light of ten suns, and the Mystagogue is covered in flames, and says with an otherworldly voice: 'Do you accept following our rite? Will you seize Eternity?'"
 LR_mysteries.0012.a: "I accept. I will seize Eternity!"
 LR_mysteries.0012.b: "No. This is too much."
 LR_mysteries.0020.t: "The Mysteries of Serapis"
 LR_mysteries.0020.desc: "You have been approached by a group of priests who have offered to initiate you into the Mysteries of Serapis, a cult dedicated to the Greco-Egyptian god that supplanted Osiris in renown and power. The cult is well known for its martial prowess, and membership would be an honor."
 LR_mysteries.0020.a: "I will gladly join."
 LR_mysteries.0020.b: "I am not interested."
 LR_mysteries.0021.desc: "Three days later, you are blindfolded and brought down into a dark cavern, and there you take part in the ancient and secret rites of initiation into the Serapic Mysteries, joining those who are now your brothers and sisters."
 LR_mysteries.0021.a: "I am one of you now."
 LR_mysteries.0030.t: "The Eleusinian Mysteries"
 LR_mysteries.0030.desc: "You have been approached by a group of priests who have offered to initiate you into the Eleusinian Mysteries, a cult dedicated to the goddesses Demeter and Persephone. The cult is well known for its stewardship, and membership would be an honor."
 LR_mysteries.0030.a: "I will gladly join."
 LR_mysteries.0030.b: "I am not interested."
 LR_mysteries.0031.desc: "Three days later, you are blindfolded and brought down into a dark cavern, and there you take part in the ancient and secret rites of initiation into the Eleusinian Mysteries, joining those who are now your brothers and sisters."
 LR_mysteries.0031.a: "I am one of you now."
 LR_mysteries.0040.t: "The Mysteries of Zeus Trophonius"
 LR_mysteries.0040.desc: "You have been approached by a group of priests who have offered to initiate you into the Mysteries of Trophonius, the ancient figure from whom the saying 'those whom the gods love die young' originates, and who has come to represent wisdom. The cult is renowned for its scholars, and membership would be a great honor."
 LR_mysteries.0040.a: "I will gladly join."
 LR_mysteries.0040.b: "I am not interested."
 LR_mysteries.0041.desc: "Three days later, you are blindfolded and brought down into a dark cavern, and there you take part in the ancient and secret rites of initiation into the Trophonian Mysteries, joining those who are now your brothers and sisters."
 LR_mysteries.0041.a: "I am one of you now."
