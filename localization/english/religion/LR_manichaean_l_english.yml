l_english:
 # Lux Invicta Manichaean events (FaF_manichean_events.txt), ported 2026-11-06

 # Decision
 LR_keep_bema_month_decision: "Observe the Bema Fest"
 LR_keep_bema_month_decision_desc: "The Bema Fest is the most important Manichaean religious observance. It is a period of fasting and religious devotion in commemoration of the passions of Prophet Mani, leading to confession and absolution of sins."
 LR_keep_bema_month_decision_tooltip: "Keep the month of fasting and vigil that ends before the Bema."
 LR_keep_bema_month_decision_confirm: "We do as we must."
 LR_keep_bema_month_decision_effect_tt: "Begin the Fasting Month: a month of fasting, a visit to a monastery of the Elect, confession before the Bema and a closing feast."
 LR_manichaean.bema_chain_tt: "Over the coming month you will fast, visit the Elect, confess before the Bema and hold a feast."

 # Bema Fest
 LR_manichaean.0001.t: "The Fasting Month"
 LR_manichaean.0001.desc: "Today is the start of the Fasting Month. Thirty days of fasting and vigil-keeping are ahead of me."
 LR_manichaean.0001.a: "We do as we must."

 LR_manichaean.0002.t: "Fasting Begins"
 LR_manichaean.0002.desc: "As the Prophet Mani taught us, [ROOT.Char.GetFaith.DevilName] has trapped particles of light in every material creation, even the food we eat! The harder I fast, the less particles of light I trap within my body."
 LR_manichaean.0002.a: "My health is irrelevant. This is for the greater good!"
 LR_manichaean.0002.b: "I will observe this month of fasting as I always do."
 LR_manichaean.0002.c: "I can indulge myself now and then, as long as nobody finds out."

 LR_manichaean.0003.t: "The Monastery of the Elect"
 LR_manichaean.0003.desc: "There's a monastery not far from town, the ascetics that dwell there are bound by the three seals of purity and are thus prohibited from performing manual labor and owning property. I should pay them a visit and make sure they have everything they need to sustain their bodies in their quest towards returning to the Light. Maybe they will share some of their wisdom with me."
 LR_manichaean.0003.a: "Servants! Make sure the pack animals are ready for travel by tomorrow morning!"
 LR_manichaean.0003.b: "Sadly we cannot afford it at the moment..."

 LR_manichaean.0004.desc: "The Head Elect of the monastery smiles and thanks you. Before you make your way back home he tells you one of the Prophet's favorite parables. #italic \"If the gems remain in their box unbored and the merchant orders his workers to play music for him instead, at the end of the day he cannot deny them their payment for not doing their job. For it is he who ordered them otherwise.\"#!"
 LR_manichaean.0004.a: "I must always strive to manage my people in the best possible way!"

 LR_manichaean.0005.desc: "You arrive at the monastery, one of the ascetics offers you some tea while the servants unload the supplies. #italic \"As Prophet Mani wrote to one of his Apostles,\"#! he says, #italic \"... if someone strikes you, do not strike him back, and if someone is angry with you, speak kindly with him always, nobody can make the patient and devout one waver even slightly.\"#!"
 LR_manichaean.0005.a: "You can catch more flies with honey than with vinegar."

 LR_manichaean.0006.desc: "As you take a look at the monastery you cannot help but wonder what it takes to become one with [ROOT.Char.GetFaith.HighGodName]. Suddenly one of the ascetics lying nearby answers: #italic \"The human body is a snake, filled with poison since the day we are born. Purge the three poisons and bear the agony of observing the Law. Only then will your soul arise from your body and attain the peace of Paradise.\"#!"
 LR_manichaean.0006.a: "Our path is not an easy one, but I must persevere."

 LR_manichaean.0007.t: "Confession before the Bema"
 LR_manichaean.0007.desc: "The last day of the Fasting Month is upon us. Soon I will have to stand in front of the Bema, confess my impure deeds and request absolution of my sins from Prophet Mani."
 LR_manichaean.0007.a: "I must expel the darkness that dwells within me, I am ready to confess."
 LR_manichaean.0007.b: "There are some things that I would rather keep to myself."

 LR_manichaean.0008.t: "The Bema Feast"
 LR_manichaean.0008.desc: "The fasting period is over. Our sins are forgiven and life slowly returns to its normal rhythm. It is customary that I invite my vassals to a celebratory feast in my abode."
 LR_manichaean.0008.a: "Yes, send the messengers."
 LR_manichaean.0008.a.tt: "Your vassals who attend are impressed by your hospitality"
 LR_manichaean.0008.b: "Not this year."
 LR_manichaean.0009.desc: "Everyone is having a great time, the people are excited to indulge themselves again after a month of rigorous fasting and singing can once again be heard in my halls. My vassals seem impressed with my benevolence and hospitality."
 LR_manichaean.0009.a: "We had a great time!"

 LR_manichaean.0010.t: "The Bema Fest Ends"
 LR_manichaean.0010.desc: "This year's Bema Festival is over and a new cycle begins until the next one. Now is the time to reflect upon what we have learned and take one more step in our eternal quest of becoming one with [ROOT.Char.GetFaith.HighGodName] once again."
 LR_manichaean.0010.a: "The cycle will close, in this life or another."

 # Alms
 LR_manichaean.0101.t: "Alms for the Church"
 LR_manichaean.0101.desc: "All Manichaean faithful of means are expected to provide part of their wealth towards the upkeep of the Church, and of the Elect who may own nothing of their own."
 LR_manichaean.0101.a: "Give alms to the Church."
 LR_manichaean.0101.a.tt: "The Archegos will be pleased with me fulfilling my duties"
 LR_manichaean.0101.b: "Not this year."

 LR_manichaean.0102.t: "The Archegos Approves"
 LR_manichaean.0102.desc: "Your dedication to the preservation and protection of the Church did not go unnoticed. Blessed is the one who walks in the Path of Light, for it is the only true path to salvation. May [ROOT.Char.GetFaith.HighGodName] be always by your side."
 LR_manichaean.0102.a: "I am but a servant of the Light!"

 # The Elect
 LR_manichaean.0201.t: "A Hearer No Longer"
 LR_manichaean.0201.desc: "[SCOPE.sC('elect').GetFirstName] approaches you visibly worried. After a short conversation you find out that [SCOPE.sC('elect').GetFirstName] no longer feels the life of a Hearer is fulfilling enough, and wishes to join the class of the Elect."
 LR_manichaean.0201.a: "If this is what you wish I cannot stop you."
 LR_manichaean.0201.a.tt: "[SCOPE.sC('elect').GetFirstName] is very happy, and as one of the Elect will now and then share the wisdom of old manuscripts with you"
 LR_manichaean.0201.b: "You are too valuable to me [SCOPE.sC('elect').GetFirstName]. I cannot allow it."

 LR_manichaean.0202.t: "The Laws of Babylon"
 LR_manichaean.0202.desc: "While translating an old religious manuscript from the Babylonian era, [SCOPE.sC('elect').GetTitledFirstName] came across a chapter with various references to Hammurabi's judicial system. It might be an interesting read."
 LR_manichaean.0202.a: "You are an asset to the realm [SCOPE.sC('elect').GetFirstName]!"
 LR_manichaean.0202.b: "If the Babylonians knew what they were doing they would still be around."

 LR_manichaean.0203.t: "The Taxes of the Sasanians"
 LR_manichaean.0203.desc: "While translating an old religious manuscript from the Sasanian era, [SCOPE.sC('elect').GetTitledFirstName] came across a chapter with various references to the Sasanian taxing system. It might be an interesting read."
 LR_manichaean.0203.a: "You are an asset to the realm [SCOPE.sC('elect').GetFirstName]!"
 LR_manichaean.0203.b: "I rule here. I know how to tax my subjects!"

 # Trait
 trait_LR_manichaean_elect: "Elect"
 trait_LR_manichaean_elect_desc: "This character belongs in the class of the Elect, they are bound by the three Seals of Purity and bear the task of returning the trapped particles of light back to Heaven. The Elect may not marry, beget children or own property."

 # Modifiers
 LR_observed_bema_fest_modifier: "Observed Bema Fest"
 LR_observed_bema_fest_modifier_desc: "This character has fasted, confessed before the Bema and been absolved of their sins."
 LR_elect_babylonian_laws_modifier: "The Laws of Babylon"
 LR_elect_babylonian_laws_modifier_desc: "An Elect's translation of Hammurabi's judicial system is being studied at this court."
 LR_elect_sassanid_taxes_modifier: "Sasanian Taxation"
 LR_elect_sassanid_taxes_modifier_desc: "An Elect's translation of the Sasanian taxing system guides the collection of revenue."

 # Opinions
 LR_manichaean_alms_opinion: "Alms given to the Church"
 LR_bema_feast_opinion: "Hosted the Bema Feast"
 LR_manichaean_elect_allowed_opinion: "Allowed me to join the Elect"
 LR_manichaean_elect_refused_opinion: "Forbade me to join the Elect"
 LR_manichaean_elect_praised_opinion: "Praised my translations"
