 bud_pureland: "Buddhaksetra"
 bud_pureland_adj: "Buddhaksetran"
 bud_pureland_adherent: "Buddhaksetran"
 bud_pureland_adherent_plural: "Buddhaksetrans"
 bud_pureland_desc: "Buddhaksetra ('Buddha Field'), also known as Pure Land Buddhism, is a Local Buddhist religion of Messianic Soul and significant Graeco-Roman influences. It emerged in the early 5th century among the Sogdian and Greek inhabitants of Serindia from messianic Buddhism spread in Central Asia by Sogdian merchants, where it adapted to the dominant Hellenic elite. Its adherents venerate Amitabha, the Buddha of Compassion, who promised that those who heed his call will be reincarnated in the land of Sukhavati, also known as the Pure Land or the Elysian Fields. There he will instruct them in ways of achieving Nirvana, along with his subordinate gods and bodhisattvas: Vajrapani-Hercules, Apollo-Mahasthamaprapta and Kanishka Alexandros. Devotional practices of Buddhaksetran Buddhists include meditation, sutra chanting, purification and offerings of wine, food and plants, all meant to bring the practitioner closer to the Compassionate Buddha and gain favor of his gods. These actions are meaningless, however, if one does not actively seek to expand the light of Amitabha's teachings in this world. It is therefore seen as a sacred duty for the Pure Land Buddhists, and especially for their rulers, to bring salvation to humanity by enlightening infidels and expanding the earthly dominion of Buddhaksetra to the end of the known world. A Buddhaksetran realm is considered as a gateway to Sukhavati, a Buddha Field on Earth where everybody can earn their salvation by pious practices taught by monks, and the best Buddhaksetran rulers are considered bodhisattvas or gods incarnate and venerated after their death and ascension."

 indoh_bud: "Eusebeia"
 indoh_bud_adj: "Eusebeian"
 indoh_bud_adherent: "Eusebeian"
 indoh_bud_adherent_plural: "Eusebeians"
 indoh_bud_desc: "The Eusebeian faith is a Local Graeco-Roman faith of Statist Soul, characterized by strong Buddhist influences. The Indo-Hellenic world eagerly supported philosophical movements, and thus when Emperor Ashoka sought to promote Buddhism, he spoke within Greek understanding. Explicitly that the Buddhist concept of Dharma was 'Eusebeia', a Greek term meaning 'Right Reverence'. This faith later became supported as a state religion by other rulers following Emperor Ashoka. The highly adaptable nature of Buddhist teachings meant that it easily co-exists with other creeds and religious traditions. Many of the deities and heroes of Greek and Indian legends are regarded as Bodhisattvas, those who have attained enlightenment and seek to help mortals reach enlightenment."

 bud_pratyeka: "Pratyekabuddhayana"
 bud_pratyeka_adj: "Pratyekan"
 bud_pratyeka_adherent: "Pratyekan"
 bud_pratyeka_adherent_plural: "Pratyekans"
 bud_pratyeka_desc: "Pratyekabuddhayana is a Local Buddhist sect of Statist Soul, centered on the worship and emulation of 'Lone Buddhas.' It is primarily patronized by the various Indohellenic rulers at Pataliputra, a remnant of an lost past dismissively sneered at by the more mainstream Buddhist scholars. Yet for the faithful, this ancient traditions of Pratyekabuddhism binds them together with the oldest of traditions in India, and the great Alexander himself. What sets Pratyekabuddhists apart from other Indian faiths is their strict rejection of karma, instead embracing hardline determinism underlined by the Greek theory of reality consisting of atoms. Escaping the tyranny of the law of causality will result in liberation from Samsara, and only the greatest of sages, the Lone Buddhas, can manage this. The sages of the faith, known as gymnosophists to the Greeks, are usually philosophers who leave behind the trappings of civilized life to live in poverty and nudity in the wild. Disciples, rulers and teachers will seek them out to share in the insight of these Sramanis, and then spread the word of their thoughts to the public. The Greek rulers have over the centuries embraced the movement as a way to promote their own scholars as sages to the local Indian majority, and suppress dissent with fatalist outlook on the authorities that be. Perhaps one day, all Buddhists will embrace the path of the Lone Buddhas to Paranirvana." 

 bud_bahusrutiya: "Bahusrutiya"
 bud_bahusrutiya_adj: "Bahusrutiya"
 bud_bahusrutiya_adherent: "Bahusrutiyan"
 bud_bahusrutiya_adherent_plural: "Bahusrutiyans"
 bud_bahusrutiya_desc: "The Bahusrutiya ('Well Learned') are a Heretical branch of Buddhism with a Scholarly Soul and strong Indian influences. They are an offshoot of the ancient Mahasamghika community, and trace their origins to the early schools of Buddhist thought. According to tradition their founder, the monk Yajnavalkya, was a contemporary of the Buddha himself and a witness to his teachings. However, he was not present for Buddha's final Nirvana, having isolated himself from the world in deep meditation. It is said that when Yajnavalkya returned from this state two centuries later, he found the Mahasamghikas had degenerated as scholars, passing on diluted interpretations of the sutras and prompting him to found his own sect to propagate the Buddha's teachings in their fullest form."
