 #Rabbinism
 rabbinism: "Rabbinism"
 rabbinism_adj: "Rabbinic"
 rabbinism_adherent: "Rabbinist"
 rabbinism_adherent_plural: "Rabbinists"
 rabbinism_desc: "Rabbinism is a Mainstream Jewish religion of Clerical Soul. Rabbinism emphasizes the rabbis' purpose as interpreters of the religious law of the Halakha. Laws and traditions is what ensures the covenant with the Lord is kept, and the rabbis guard those laws."

 #Karaite
 karaism: "Karaism"
 karaism_adj: "Karaite"
 karaism_adherent: "Karaite"
 karaism_adherent_plural: "Karaites"
 karaism_desc: "Karaism is a Heretical Jewish sect of Clerical Soul. In the matters of religious law, the Tanakh alone is the highest and absolute authority. The role of rabbis are not to reassess and adapt the rules of the covenant, but to interpret their literal meaning."

 #Haymanot
 haymanot: "Haymanot"
 haymanot_adj: "Haymanot"
 haymanot_adherent: "Haymanot"
 haymanot_adherent_plural: "Haymanot"
 haymanot_desc: "The Haymanot are a Local Jewish sect of Traditional Soul, with significant African influences. The rabbis, or kahen, judge in matters of religious law, but they work together with a circle of elders who judge in matters of tradition and life."
 haymanot_religious_text: "Orit"
 haymanot_religious_text_2: "$haymanot_religious_text$" # Optional translation alt
 haymanot_religious_text_3: "$haymanot_religious_text$" # Optional translation alt
 haymanot_religious_head_title: "Liqa Kahnet"
 haymanot_devotee: "Monkosa"
 haymanot_devotee_plural: "Monkosas"
 haymanot_priest: "Kahen"
 haymanot_priest_plural: "Kahens"
 haymanot_bishop: "Shmagle"
 haymanot_bishop_plural: "Shmagles"

 #Malabar
 malabarism: "Malabarism"
 malabarism_adj: "Malabari"
 malabarism_adherent: "Malabari"
 malabarism_adherent_plural: "Malabari"
 malabarism_desc: "Malabarism is a Local Jewish Sect of Clerical Soul, with significant Indian influences. As the descendants of the tribes of Israel spread across the world, they built smaller communities from west to east, acting as tribes of their own. Also called Cochin Jews, they made their new home in the Cochin Kingdom of South India. There, they intermixed with the local people and exchanged cultures."

 #Samaritan
 samaritan: "Samaritanism"
 samaritan_adj: "Samaritan"
 samaritan_adherent: "Samaritan"
 samaritan_adherent_plural: "Samaritans"
 samaritan_desc: "Samaritanism is a Local Jewish sect of Traditional Soul. Descended from the tribes that settled Samaria, Samaritans follow an original, unchanged version of the Torah. In this way they are practicing the true religion of Moses, serving the direct duties granted by God."

 #Kabarism
 kabarism: "Kuzarism"
 kabarism_adj: "Kuzarite"
 kabarism_adherent: "Kuzari"
 kabarism_adherent_plural: "Kuzaris"
 kabarism_desc: "Kuzarism is a Local Jewish sect of Traditional Soul, with significant Steppe influences. A community of converts, Kuzarites follow the common Rabbinic interpretation of the Halakha. Even long after their conversion, they continue to hold some local beliefs and traditions with religious reverence."
 kabarism_old: "Old Kuzarism"
 kabarism_old_adj: "Old Kuzarite"
 kabarism_old_adherent: "Old Kuzari"
 kabarism_old_adherent_plural: "Old Kuzaris"

#Merkabah
 merkabah:0 "Merkabah"
 merkabah_adj:0 "Merkabah"
 merkabah_adherent:0 "Merkabist"
 merkabah_adherent_plural:0 "Merkabists"
 merkabah_desc:0 "Merkabah is a Local Jewish sect of Scholarly Soul, with significant Gnostic influences. A strain of Judaic mysticism, the faith is centered on visions, adopting ascetic lifestyles to join the Throne of God."
 
 #jud_sabaoth
 
 jud_sabaoth: "Sabaothism"
 jud_sabaoth_adj: "Sabaothist"
 jud_sabaoth_adherent: "Sabaothite"
 jud_sabaoth_adherent_plural: "Sabaothites"
 jud_sabaoth_desc: "The sect of Yahweh Sabaoth ('the Lord of Hosts') is a Heretical Jewish sect of Martial Soul. It is a Jewish warrior cult that places emphasis on the existence of Yahweh as the Lord of Hosts, and that he shall grant his faithful victory against their enemies."
 
 jud_zion: "Khawdash Siyun"
 jud_zion_adj: "Khawdash Siyun"
 jud_zion_adherent: "Khawdash Siyunist"
 jud_zion_adherent_plural: "Khawdash Siyunists"
 jud_zion_desc: "The Khawdash Siyun ('Renewed Zion') cult is a Local Jewish faith of Populist Soul. They believe that that Zion, the Land of Israel, is not in a fixed location, but in the Jewish people that carry out God's will. Since the people believe themselves to be living in accordance with God's will, there is a balance and happiness in the community not found in many other places. They seek to bring their message to all classes, from the lowest peasant to the highest king. According to tradition, it was founded by one of the lost tribes of Israel who settled between the White and Blue Nile."
 
 jud_ark: "Aron Habrit"
 jud_ark_adj: "Aron Habrit"
 jud_ark_adherent: "Aron Habritist"
 jud_ark_adherent_plural: "Aron Habritists"
 jud_ark_desc: "The cult of the Aron Habrit ('Ark of the Covenant') is a Local Jewish faith of Traditional Soul, with strong Gnostic influences. A Judaic heresy that centers it's worship around using the Ark of the Covenant, or rather a replica of it, as a direct conduit to interpret the will of Yahweh. According to the Kebra Negast, the Ethiopian 'Book of the Glory of Kings', Menelik I brought the Ark to Ethiopia, but it was eventually lost. Adherents believe that when the true Ark is recovered, the connection with God will be restored and the Yehudim will return to their place as God's chosen people."

 doctrine_temple_authority_name: "Halakha Authority"
 doctrine_temple_authority_desc: "Halakha refers to a set of laws and rules by which a Jew must live their life. After centuries of diaspora, Jewish groups diverged into numerous schools of thought on how to properly interpret the Halakha."
 temple_authority_rabbinic_doctrine_name: "Rabbinic"
 temple_authority_rabbinic_doctrine_desc: "Rabbinic Jews believe that the Halakha can be interpreted by the Rabbis alone. They believe in the Written Torah and the Oral Torah, passed on through the Rabbis. All Rabbinic belief is codified in the Babylonian Talmud, which is held as the primary source from which Halakha is interpreted and distributed."
 temple_authority_toric_doctrine_name: "Toraic"
 temple_authority_toric_doctrine_desc: "Toraic Judaism rejects the Talmud and the Oral Torah, passing authority to the written Torah alone. Rabbis cannot change or adapt the Halakha, their duty is solely to interpret the Torah's literal meaning."
 temple_authority_kohanim_doctrine_name: "Kohenimic"
 temple_authority_kohanim_doctrine_desc: "Kohenimic Judaism asserts that the Kohen are the supreme authority on all religious matters, including the Halakha. Kohen must be patrilineally descended from Aaron, Moses' brother."
 temple_authority_samaritan_torah_doctrine_name: "Samaritan"
 temple_authority_samaritan_torah_doctrine_desc: "The Samaritans reject the authority of the Torah altogether, instead granting supreme authority to the Samaritan Torah. Their rejection of the Torah causes them to be universally seen by their fellows as heretics."
 doctrine_parameter_hostility_override_temple_authority_samaritan_torah_doctrine: "Considers [GetFaithDoctrine('temple_authority_samaritan_torah_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_temple_authority_rabbinic_doctrine: "Considers [GetFaithDoctrine('temple_authority_rabbinic_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_temple_authority_toric_doctrine: "Considers [GetFaithDoctrine('temple_authority_toric_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_temple_authority_kohanim_doctrine: "Considers [GetFaithDoctrine('temple_authority_kohanim_doctrine').GetBaseName] [faiths|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_enables_temporal_head_parameter: "Allows the selection of the Temporal Head religious [doctrine|E]."

 tenet_communal_identity_chosen_people_name: "Chosen People"
 tenet_communal_identity_chosen_people_desc: "We were chosen by [ROOT.Faith.HighGodName] for a holy covenant. While this unites our people with a single purpose, it can act as a deterrence to converts."
