l_english:
 # LR 2026-11-06: the Solar Imperial West/East split
 helios_autokrator_faith: "Helios Autokrator"
 helios_autokrator_faith_adj: "Autokratorian"
 helios_autokrator_faith_adherent: "Autokratorian"
 helios_autokrator_faith_adherent_plural: "Autokratorians"
 helios_autokrator_faith_desc: "The Eastern church of the Unconquered Sun. Its faithful hold that the Emperor in Constantinople is the Sun made flesh, the Hēlios Autokrátōr, and that no priest stands between him and the god he embodies."
 sol_invictus_faith: "Sol Invictus"
 sol_invictus_faith_adj: "Invictan"
 sol_invictus_faith_adherent: "Invictan"
 sol_invictus_faith_adherent_plural: "Invictans"
 sol_invictus_faith_desc: "The Western church of the Unconquered Sun. Invictans honour the emperors as the god's chosen, but keep his worship in the hands of the Pontifex at Rome and his college of priests, not of any throne."
 sol_invictus_rite: "Sol Invictus"
 sol_invictus_rite_adj: "Invictan"
 sol_invictus_rite_adherent: "Invictan"
 sol_invictus_rite_adherent_plural: "Invictans"
 sol_invictus_rite_desc: "$sol_invictus_faith_desc$"
 k_helios_autokrator: "Hēlios Autokrátōr"
 k_helios_autokrator_adj: "Autokratorian"
 k_helios_autokrator_article: "the "
 d_pontifex_solis_invicti: "Pontificate of Sol Invictus"
 d_pontifex_solis_invicti_adj: "Pontifical"
 d_pontifex_solis_invicti_article: "the "
 LR_helios_autokrator_male: "Hēlios Autokrátōr"
 LR_helios_autokrator_female: "Hēlía Autokráteira" # Greek feminine of the above
 LR_pontifex_solis_male: "Pontifex Solis"
 LR_pontifex_solis_female: "Pontifex Solis"
 LR_convene_solar_council_decision: "Convene a Solar Council"
 LR_convene_solar_council_decision_desc: "Summon the priests of the Unconquered Sun from East and West to settle the quarrels that divide his church."
 LR_convene_solar_council_decision_tooltip: "Bring the two churches of the Sun together"
 LR_convene_solar_council_decision_confirm: "Let the council meet"
 LR_solar_heads_reconciled_tt: "The [GetTitleByKey('k_helios_autokrator').GetName] and the [GetTitleByKey('d_pontifex_solis_invicti').GetName] are you or in your realm"
 LR_solar_schism_progress_tt: "The East and the West of the Sun are drifting apart"
 LR_solar_council_heal_tt: "The rift between the Eastern and Western rites of the Sun narrows"
 LR_solar_council_mend_tt: "Helios Autokrator and Sol Invictus are reunited as the Solar Imperial faith, headed by the incarnate Sun"
 LR_reunite_solar_faith_decision: "Reunite the Sun"
 LR_reunite_solar_faith_decision_desc: "With Rome and Constantinople under one Augustus, the quarrel over who speaks for the Sun can be ended: there is again one emperor, and so one god made flesh."
 LR_reunite_solar_faith_decision_tooltip: "Heal the Solar schism"
 LR_reunite_solar_faith_decision_confirm: "One Sun, one Empire"
 LR_solar_schism.0001.t: "The Sun Divided"
 LR_solar_schism.0001.desc: "The quarrel could not be healed. Constantinople holds that the Emperor is the Sun made flesh; Rome answers that the god speaks through his Pontifex alone. The church of the Unconquered Sun is now two: Helios Autokrator in the East and Sol Invictus in the West."
 LR_solar_schism.0001.a: "So the Sun has two dawns."
 LR_solar_schism.0002.t: "One Sun Again"
 LR_solar_schism.0002.desc: "East and West have made their peace. The rites of Helios Autokrator and Sol Invictus are again one Solar Imperial faith under the incarnate Sun."
 LR_solar_schism.0002.a: "Praise the Unconquered Sun."
 solar_tradition_classification_name: "Solar Tradition"
 special_doctrine_is_western_solar_faith_name: "Western Solar"
 special_doctrine_is_western_solar_faith_desc: "This rite belongs to the Western, Roman tradition of the Unconquered Sun."
 special_doctrine_is_eastern_solar_faith_name: "Eastern Solar"
 special_doctrine_is_eastern_solar_faith_desc: "This rite belongs to the Eastern, Constantinopolitan tradition of the Unconquered Sun."
