 # LR 2026-11-06: the Solar Imperial West/East split
 helios_autokrator_faith: "Doctrine of Helios Aniketos"
 helios_autokrator_faith_adj: "Aniketiast"
 helios_autokrator_faith_adherent: "Aniketiast"
 helios_autokrator_faith_adherent_plural: "Aniketiasts"
 helios_autokrator_faith_desc: "The Greek church of the Unconquered Sun. Helians keep his worship in the hands of the Helic Hierarchy at Constantinople, the hierarchs and priests of Hēlios, and honour the emperor as the god's chosen, not as the god himself."
 sol_invictus_faith: "Solarism"
 sol_invictus_faith_adj: "Solarist"
 sol_invictus_faith_adherent: "Solarist"
 sol_invictus_faith_adherent_plural: "Solarists"
 sol_invictus_faith_desc: "The Latin church of the Unconquered Sun. Solarists honour the emperors as the god's chosen, but keep his worship in the hands of the Solar Pontificate at Rome and its college of priests, not of any throne."
 sol_invictus_rite: "Cult of Sol Invictus"
 sol_invictus_rite_adj: "Solarist"
 sol_invictus_rite_adherent: "Solarist"
 sol_invictus_rite_adherent_plural: "Solarists"
