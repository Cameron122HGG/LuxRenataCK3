 hypsistarian_desc: "Hypsistarianism is a Heretical Graeco-Roman faith of Scholarly Soul with significant Jewish influences. Followers worship Theos Hypsistos, the Most High God, who they describe as "Self-begotten, un-taught, un-mothered, undisturbed, not permitting a name, many-named, dwelling in fire.""


 #Hypsistarian 

 hypsistian:0 "Hypsistianism"
 hypsistian_adj:0 "Hypsistian"
 hypsistian_adherent:0 "Hypsistian"
 hypsistian_adherent_plural:0 "Hypsistians"
 hypsistian_desc:0 "Long serving as the state religion of the Pontic Empire, Hypsistianism blends Greco-Iranian traditions of the Black Sea with the ruler cults promulgated by Alexander the Great and his successors. In this tradition, Theos Hypsistos is first and foremost a patron of kings, and is commonly depicted in the form of an eagle."


