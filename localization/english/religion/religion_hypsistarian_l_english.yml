 pantokratic:0 "Pantokratism"
 pantokratic_adj:0 "Pantokratic"
 pantokratic_adherent:0 "Pantokratic"
 pantokratic_adherent_plural:0 "Pantokratics"
 pantokratic_desc:0 "Claimed by adherents as the direct successor of classical Greek religion, Pantokratism makes an explicit connection between Zeus and the Most High God. The sect continues to acknowledge other ancient gods such as Helios and Herakles, albeit only as lesser divinities."


