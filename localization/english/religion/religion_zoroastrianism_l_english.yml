 #Mazdayasna
 mazdayasna: "Mazdayasna"
 mazdayasna_adj: "Mazdayan"
 mazdayasna_adherent: "Mazdayan"
 mazdayasna_adherent_plural: "Mazdayans"
 mazdayasna_desc: "Mazdayasna is a Mainstream Persian religion of Clerical soul. It is characterized by the belief in Ahura Mazda, the uncreated Creator of all things seen and unseen, to whom all worship is ultimately directed. The followers of the prophet Zarathustra (known to the Hellenes as Zoroaster) believe that bringing order and stability to the world in all ways possible is to bring ultimate glory to Ahura Mazda. Zoroastrians despise any sort of chaos, and believe any god that would demand their followers to spill undue blood is an agent of the Destructive Spirit, Angra Mainyu. The Zoroastrian clergy is held in very high regard by the faithful, as they are tasked with preserving the most important truths of the universe from the lies of Angra Mainyu. Their social status has been further strengthened by the recent fragmentation of the Sassanid Empire, as they have become the main source of guidance wherever the imperial authority has faded away."

 #Zurvanism
 zurvanism: "Zurvanism"
 zurvanism_adj: "Zurvanite"
 zurvanism_adherent: "Zurvanite"
 zurvanism_adherent_plural: "Zurvanites"
 zurvanism_desc: "The cult of Zurvan is a Local Persian faith of Clerical Soul. It is a sect of Zoroastrianism venerating Zurvan, whom the sect believes to be the parent of both Ahura Mazda and Angra Mainyu. Zurvan is regarded as neutral, neither good nor evil, as well as the god of destiny, light, and darkness."

 #Zurvanism doctrine - FP3 update: removed from doctrine_asceticism and saved for possible future Fatalism tenet. 
 tenet_zurvanism_name: "Zurvanism"
 tenet_zurvanism_desc: "Zurvanists believe that Ohrmazd and Ahriman were equal but opposite twins, born from Zurvan, the Creator of everything. Zurvanism heavily emphasizes aiding Ahura Mazda by rooting out of evil and falsehoods."
 zurvanism_creator_god_name: "Zurvān"
 zurvanism_creator_god_name_possessive: "Zurvān's"

 #Gayomarthianism
 gayomarthianism: "Gayomartianism"
 gayomarthianism_adj: "Gayomartian"
 gayomarthianism_adherent: "Gayomartian"
 gayomarthianism_adherent_plural: "Gayomartians"
 gayomarthianism_desc: "Gayomarthianism is a Local Persian faith of Scholarly Soul. Based on the idea that Ahura Mazda, through his thoughts, created evil spirits by accident, Gayomarthians reject the infabillity of the Lord of Wisdom, and instead emphasize ritualistic practice to learn Truth in communion with Ahura Mazda." 

 #Khurmazta
 khurmazta: "Khurmazta"
 khurmazta_adj: "Khurmazta"
 khurmazta_adherent: "Khurmazta"
 khurmazta_adherent_plural: "Khurmazta"
 khurmazta_desc: "Khurmazta is a Local Persian faith of Traditional Soul. With deep roots in the religious admixture of Sogdiana, the Khurmazta worship a wide set of gods and spirits, both ancestral and universal. They also revere icons, something anathema to many other Zoroastrians. Yet as unique as some aspects of their faith may be, in other ways they remain within the orbit of mainstream Zoroastrian doctrine, practicing the purity rituals and tending the eternal fires with unceasing devotion."

 khurmazta_good_god_zravan: "Zravan"
 khurmazta_good_god_weshparkar: "Weshparkar"
 khurmazta_good_god_adbad: "Adbad"
 khurmazta_fertility_god_name: "Nana"
 khurmazta_fertility_god_name_possessive: "Nana's"
 khurmazta_high_god_name: "Khurmazta Bagh"
 khurmazta_high_god_name_possessive: "Khurmazta Bagh's"
 khurmazta_war_god_name: "Waseghn" 
 khurmazta_war_god_name_possessive: "Waseghn's"
 khurmazta_fate_god_name: "Parn"
 khurmazta_fate_god_name_possessive: "Parn's"
 khurmazta_devil_name: "Shimnu"
 khurmazta_devil_name_possessive: "Shimnu's"
 
 #Mazdakism
 mazdakism: "Mazdakiya"
 mazdakism_adj: "Mazdakite"
 mazdakism_adherent: "Mazdakite"
 mazdakism_adherent_plural: "Mazdakites"
 mazdakism_desc: "The Mazdakite movement is a Heretical Persian faith of Populist Soul, with strong Gnostic influences. The radical prophets Zardusht Khuragan and Mazdak were influenced by esoteric faiths of late antiquity, and agitated for shared ownership of resources and universal cooperation between humans to overcome the five demons of avarice, wrath, envy, possessiveness and vengeance."

 #Khurramism
 khurramism: "Khurramism"
 khurramism_adj: "Khurramite"
 khurramism_adherent: "Khurramite"
 khurramism_adherent_plural: "Khurramites"
 khurramism_desc: "Khurramism is a Heretical Persian faith of Messianic Soul, with strong Islamic influences. In a world of Light and Darkness, unjust rulers must be overthrown in support of what is good. Through prophets such as Mazdak, Abu Muslim, and al-Muqanna, Khurramites believe that the divine is born into humanity, and will one day return to lead them as the Messiah."

 #Urartuism
 urartuism: "Arewordik"
 urartuism_adj: "Arewordi"
 urartuism_adherent: "Arewordi"
 urartuism_adherent_plural: "Arewordis"
 urartuism_desc: "Arewordism is a Local Persian faith of Traditional Soul, with strong Archaic influences. Many ancient beliefs still resonate in the Arewordik faith, a sect of cryptic Zoroastrians with Ohrmazd (as Aramazd) ruling over a pantheon of gods, including the Sun itself, that together direct the world."

 urartuism_high_god_name: "Aramazd"
