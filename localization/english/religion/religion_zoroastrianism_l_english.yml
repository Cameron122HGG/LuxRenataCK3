 urartuism_death_deity_name_possessive: "Spandaramet's"
 urartu_good_god_the_sun: "Arew"
 urartu_good_god_mithra: "Mihr"
 urartu_good_god_zoroaster: "Zradasht"
 urartu_good_god_vanatur: "Vanatur"
 urartuism_priest_male: "Hazarpet"
 urartuism_priest_male_plural: "Hazarpets"

 #Afridunism, Daylamite "paganism"
 afridunism: "Afridunism"
 afridunism_adj: "Afridunist"
 afridunism_adherent: "Afridunist"
 afridunism_adherent_plural: "Afridunists"
 afridunism_desc: "Afridunism is a Local Persian faith of Traditional Soul. Steeped in Daylamite traditions as well as Persian paganism, many aspects of Afridunism predate even the ancient Zoroastrian creed. Adherents strive to live according to the rules laid down by the mythical hero Faridun, which emphasizes the absolute power of family leaders and a fierce spirit of independence."

