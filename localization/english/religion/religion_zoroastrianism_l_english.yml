 afridunism_war_god_name: "Verethragna"
 afridunism_war_god_name_possessive: "Verethragna's"
 afridunism_priest_male: "zautar"
 afridunism_priest_male_plural: "zautars"

 #Zoroastrian Hindu
 zor_hindu: "Parsikasa"
 zor_hindu_adj: "Parsikasa"
 zor_hindu_adherent: "Parsikasi"
 zor_hindu_adherent_plural: "Parsikasis"
 zor_hindu_desc: "Parsikasa is a Local Indian faith of Statist Soul, with strong Persian influences. A hybrid-religion involving a mix of Zoroastrianism with Hindu tenets. Likely possibilities are the concepts of karma (positive energy reflecting positive deeds and vice versa), dharma (a natural law with ideas such as duty, religion vocation, moral uprightness, etc.), as well as a polytheistic pantheon being incorporated into the ideas of Zoroastrianism. For example, some of the gods of the Hindu pantheon (there are very many) could be considered highly-ranked angels under either Angra Mainyu or Ahura Mazda, or perhaps even the other way around, with concepts of light versus darkness and reclamation being split into the different Hindu deities."

 #Angra Mainyui
 zor_angra: "Angra Mainyu"
 zor_angra_adj: "Angra Mainyui"
 zor_angra_adherent: "Angra Mainyui"
 zor_angra_adherent_plural: "Angra Mainyuis"
 zor_angra_desc: "The cult of Angra Mainyu is a Heretical Persian faith of Messianic Soul. It is the worship of the Destructive Spirit of Zoroastrianism, Angra Mainyu. Followers believe that Angra Mainyu will overcome the world in darkness and reward his followers for their obedience."

 #Doctrines for FP3 

 doctrine_zoroastrian_branches_name: "Good and Evil"
 doctrine_zoroastrian_branches_desc: "Do we support the established priesthood and their doctrine, to guard our faith against heresy - or is it actually they who are misguided and corrupt?" 
 doctrine_major_branch_behdin_name: "Behdin"
 doctrine_major_branch_behdin_desc: "Though we might differ on some of the pecularities of practice, do we mainline Zoroastrians not agree on the fundamentals of loyalty to Ahura Mazda?"
 doctrine_heretic_branch_zandik_name: "Korramdin"
 doctrine_heretic_branch_zandik_desc: "The $doctrine_major_branch_behdin_name$ call us heretics, outcasts, and subversives. Though nothing binds us together but their scorn, righteousness dictates our resistance and their disdain hardens our hearts."
