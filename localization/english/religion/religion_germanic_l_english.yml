 german_pagan_rite_desc: "The Furistaz Siduz ('Foremost Custom') is a Mainstream Germanic faith of Traditional Soul. It refers to the polytheistic religious traditions of the continental Germanic peoples. While Germanic and Norse paganism share many similarities, the cultures, names, and practices are different, thus to say Forn Siðr and Furistaz Siduz are the same religion would be inaccurate. The primary gods of the pantheon include Wodan the Allfather, Tiw, the god of war and fair rule, Thunar, the thunder god, and Frija, wife of Wodan and goddess of fertility."
