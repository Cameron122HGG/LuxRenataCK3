norse_pagan: "Forn Siðr"
norse_pagan_adj: "Forn Siðric"
norse_pagan_adherent: "Forn Siðric"
norse_pagan_adherent_plural: "Forn Siðrics"
norse_pagan_desc: "The Forn Siðr ('Old Custom') is a Mainstream Norse faith of Traditional Soul. It refers to the polytheistic religious traditions of the Norse people. Many gods and goddesses are worshipped and venerated, and even though adherents may specialize their worship to a particular god or goddess, all deities in the pantheon are believed in. Practices include ancestor worship and remembrance, blots, and sacrifices - sometimes human. The existence of mythological creatures such as giants, dwarves, elves, and so on, form a great part of its folk beliefs. There are also nine homeworlds which the followers believe the gods used to shape the world humans live in - Midgardr, land of the humans, Asgardr, land of the Aesir, Vanaheimr, land of the Vanir, Jotunheimr, land of the giants, Alfheimr, land of the elves, Hel, land of the dead, Svartalfaheimr, land of the dwarves, Niflheimr, land of ice, and Muspellsheimr, the land of fire."
norse_pagan_old: "Old Forn Siðr"
norse_pagan_old_adj: "Old Forn Siðric"
norse_pagan_old_adherent: "Old Forn Siðric"
norse_pagan_old_adherent_plural: "Old Forn Siðrics"

ragnarok: "Røkkatrú"
ragnarok_adj: "Røkkatrú"
ragnarok_adherent: "Røkkatrúar"
ragnarok_adherent_plural: "Røkkatrúare"
ragnarok_desc: "Røkkatrú ('Allegiance to the Røkkr') is a Heretical Norse Faith of Messianic Soul, with a Christian ascendant. The origins of the Røkkatrúar lie in scattered underground cults of thralls and outcasts, the wretched underclasses bereft of glory or mercy in the harsh lands of the North. They held no love for the gods of their masters and oppressors, viewing Odin and his Aesir as warmongering brutes, and the Vanir as debaucherous fiends. Instead they turned to the worship of the trickster god Loki and his children, and his children's children, particularly the great wolf Fenrir who is destined to slay the King of the Gods in due time. As the number of Christian thralls swelled with the rise of the sun-worshipping Empire of the North Sea, these souls brought from afar would come to add their own, often antinomian, particularities to this growing religious movement, painting Loki as a martyr figure and Fenrir as their coming deliverer. The fall of the Knutings and the descent of their underlings into bitter infighting was taken by many downtrodden thralls as the chance to break their chains. Rising up in the darkness of the northern shores, the Røkkatrúar put an end to their bondage and won their liberty, raising their own jarls and setting forth their own law. Though regarded as bloodthirsty, anarchic renegades by their former masters and confused heretics by the churches beyond the sea, the sons and daughters of the wolf have all the truth they need - that they stand alone as a free folk. Now they wait in the dim twilight, gathering their strength for Ragnarök, for it promises not to be a catastrophe, but a final war for the liberation and redemption of man!"
ragnarok_old: "Old Røkkatrú"
ragnarok_old_adj: "Old Røkkatrú"
ragnarok_old_adherent: "Old Røkkatrúar"
ragnarok_old_adherent_plural: "Old Røkkatrúare"

norse_christ: "Kristatrú"
norse_christ_adj: "Kristatrú"
norse_christ_adherent: "Kristatrúar"
norse_christ_adherent_plural: "Kristatrúare"
norse_christ_desc: "Kristatrú ('Following of Christ'), or Scandinism, is a Local Norse sect of Statist Soul, characterized by strong Christian influences. Viking raids on Frankish kingdoms and the British Isles brought the Scandinavians in contact with Christianity. Some of the Forn Siðric rulers decided to formally embrace Christianity as they seek a broader source of legitimacy towards their trouble-making vassals than the old tribal links. Thus, Norse Christianity adopted Christian monotheism and doctrinal elements that strengthen the monarch's rule as divine right, while rejecting any form of authority from the official church. It retains many typically Norse cultural elements in the new syncretic faith, incorporating many of the old gods into its canon as legendary kings and saints. The Kristatrúare hold that Baldr, who died and went to the underworld guarded by Hel, is the true Christ. They reject the Latin Hvítakristr, the White Christ, with white being associated with the Catholic sacerdotal robes as well as cowardly and effeminate attributes. Scandinist clergy make a point to wear orange garbs and keep their beards long, in keeping with the old ways of the Norse priesthoods."
