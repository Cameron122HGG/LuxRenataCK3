sowilo: "Sunnatrú"
sowilo_adj: "Sunnatrúan"
sowilo_adherent: "Sunnatrúar"
sowilo_adherent_plural: "Sunnatrúare"
sowilo_desc: "Sunnatrú ('Allegiance to Sunna') is a Local Norse faith of Statist Soul. In a twist on Norse faith, the Sunnatrúare believe Mundilfari, god of time, was born from the collision of fire and ice like the giant Ymir. Realising that the world tree could not thrive without the continued energies that birthed him, Mundilfari took Ymir's eyes after Odin slew him, and infused one with the ice of Niflheim, and one with burning embers flying from the fiery world of Muspelheim, naming the two orbs Moon and Sun, after his children Máni and Sunna. Sunna is said to drive the horses Arvakr and Alsviðr that draw the chariot of the sun. She created the chariot to illuminate the Nine Worlds, circling Yggdrasil. Sunna is said to constantly quarrel against her lunar brother for control of the Heavens, continuing the cycle of day and night. The waxing and waning of their energies in this struggle is reflected in the changing lengths of days. Seen as both a nourishing mother and patroness of both fiery war and enlightened peace, she is offered sacrifices, usually animal, but prisoners of war and raids are accepted as well, who are burnt in a ritual to strengthen Sunna in her daily struggle. Influenced by the Roman cult of Sol Invictus, Sunnatrúar rulers often claim as well to have Her blood in their veins."
sowilo_old: "Old Sunnatrú"
sowilo_old_adj: "Old Sunnatrúan"
sowilo_old_adherent: "Old Sunnatrúar"
sowilo_old_adherent_plural: "Old Sunnatrúare"

sowilo_lore: "The faith in Sunna is among the newest in Midgard. In 986 CE, following a coup against his father Harald Bluetooth and subsequent religious repression of the many goðir who supported him, the Danish king Sweyn Forkbeard was forced into exile by his father's Saxon allies for almost a decade, during which he served in the Varangian Guard in Constantinople. Impressed with Roman might, Sweyn would adopt the god Sól as his protector. Upon reclaiming his throne using the wealth from his service in the east, Sweyn would go on to undertake both a grand restructuring of the religion around Sól, legitimised by his armies' successful conquests of Norway and the Danelaw. The faith was deeply unpopular outside the armies however, especially after a religious conflict with the followers of Sól-Odin in Rusland made Sweyn reaffirm Sól as a goddess, not a god. Following King Canute Sweynsson's death, the warlords fighting over the remnants of his Miklariki would seek to eradicate the memory of this 'unmanly' faith. However, the adherents of Sól would survive in an unlikely place; Sweyn's grandson Harold Harefoot, governor of Anglia, was a firm believer in his grandfather's vision, and opened his capital to the remaining pagans of Britannia, on condition they acknowledged 'Sunna' as the superior god. This alternative name for Sól would be deliberately encouraged by the Knutings to separate themselves from the Roman sun-worshipers to the west, and for being closer to the Saxon 'Sunne' and Briton 'Sulis.' To this day, the grand city of Lundúnir blazes with Sunna's light."

