 hypsistarian_desc: "Hypsistarianism is a Heretical Graeco-Roman faith of Scholarly Soul with significant Jewish influences. Followers worship Theos Hypsistos, the Most High God, who they describe as "Self-begotten, un-taught, un-mothered, undisturbed, not permitting a name, many-named, dwelling in fire.""

 alexandros: "Alexandros-Ammon"
 alexandros_adj: "Alexandros-Ammonite"
 alexandros_adherent: "Alexandros-Ammonite"
 alexandros_adherent_plural: "Alexandros-Ammonites" 
 alexandros_desc: "The cult of Alexandros-Ammon is a Local Graeco-Roman religion of Martial Soul, with significant Archaic influences. It centers around the worship of Alexandros III of Makedonia, better known as Megas Alexandros, whose conquests spanned from the Adriatic Sea to the distant shores of the Indus. In his conquest of Egypt, Alexandros acquired a divine nature when he visited the Oracle of the Siwa Oasis, for it was there that he was proclaimed son of Zeus-Ammon and Master of the Universe. Henceforth, his cult grew with every following year, surviving even the dissolution of his empire in the Wars of the Diadochi and merging with the much more ancient worship of the Egyptian god Amun. Ever since then, the quarrelsome descendants of his generals have invoked his name in the throne room and on the battlefield, and every aspirant officer has drilled the lessons of Issus and Gaugamela into his and his comrades' very hearts. This inexorable devotion once carried the brave sons of Hellen forth to achieve his greatest dream in life - to see the sun rise from the Great Eastern Ocean. Yet even this, they knew, was not the end. For the Oracle has prophesied that Alexandros-Ammon, the King of Conquerors, shall one day be reborn among his strongest and his most loyal - not to lead mere kingdoms of men, but to unite this shattered world under his leadership for all eternity!"
