 cybele: "Cybele"
 cybele_adj: "Cybelene"
 cybele_adherent: "Cybelite"
 cybele_adherent_plural: "Cybelites"
 cybele_desc: "The worship of Cybele is a Local Graeco-Roman faith of Clerical Soul, with significant Archaic influences. It is a henotheistic faith inherited from the antique Phrygians, dwellers of Western Anatolia in the Bronze Age, who worshipped 'Matar Kubileya', the Mother Goddess. Greek settlers arriving in Asia Minor in the beginning of the Iron Age adopted the Phrygian cult, centering their worship on Cybele, the Earth Mother, an exemplar of devoted motherhood, the Mistress of Animals, ever accompanied by lions that flank her, sit in her lap, and draw her chariot. From the shores of Asia Minor the cult spread westwards and met considerable success, as Cybele was equated with other Greek deities such as Demeter and Gaïa. In spite of her popularity, Cybele remained controversial and was perceived as an ambiguous symbol of exotic foreignness among Western Greeks, to the extent that the spread of cult was accompanied by violent debates and even conflicts. Many kings in Asia Minor, in particular Eumenes I of Pergamon, saw the political opportunity of supporting a cult distinguishing a strong local identity against other Hellenistic realms and adopted Cybele as the kingdom's patron goddess. As the rise of Rome provoked the political and cultural integration of Asian realms into the wider empire, the worship of Cybele evolved from a state religion sponsored by ambitious petty kings into a more secretive mystery cult, still strongly associated with Anatolian identity. Deprived of political sponsorship, the cult survived on the appeal of its esoteric rites involving ecstatic music, dancing and self-castration as a sign of devotion to the Goddess. Those individuals initiated to the higher degrees of the Cybelene cult hold considerable influence in their society. Thus the cult constitutes a highly structured hierarchy, informal and decentralized, but which works in parallel to the mundane social and political structures."
