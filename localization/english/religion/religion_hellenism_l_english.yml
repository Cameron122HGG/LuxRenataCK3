#HELIOPOLITAN RITE
 heliopolitan_rite: "Heliopolitan Triad"
 heliopolitan_rite_adj: "Heliopolitan"
 heliopolitan_rite_adherent: "Heliopolitanist"
 heliopolitan_rite_adherent_plural: "Heliopolitanists"
 heliopolitan_rite_desc: "Heliopolitanism, also known as the Cult of the Alexandrine Triad, is a syncretic Graeco-Roman born of the Alexandrine religious movement, with significant Semitic and Iranian influences. Worship is primarily centred on the divine triad of Zeus Belos, Apollo Mithras and Alexandros Aniketos. It stresses martial strength and ancient ritual, honouring warriors as defenders of the universal order through sacrifice and ritualised combat.."
 heliopolitan_rite_desc_long: "Following Alexander's conquest of the former Persian Empire, it fell to his lieutenants to negotiate the complex web of dozens of faiths and hundreds of gods that needed to be appeased, sacrificed to and bartered with to ensure their tolerance of an alien force in their ancient lands, let alone realise the Conqueror's dream of a united land under the auspices of his divine father, Zeus. One of these lieutenants was Selucus, commander of the Silver Shields, and as he followed his master from one end of the known world to another, he observed the many beliefs he encountered, concluding they were all reflections of the same universal truth. After crushing a revolt backed by the Priesthood of Marduk in Babylon in the years following the Conqueror's death, Selucus explained this truth to the defeated priests. Alexandros had indeed been the son of Zeus, but also Marduk. Zeus, Marduk, Ammon, Baal, Hadad… these were all names for the same King of the Gods, and the true way to honour Him was not to support regional rebels who claim to fight for privileges for some local cult, but rather to fight for his vision of a united realm where aspects of His divinity can be honoured according to local custom.\n\nSelucus the Victorious would eventually go on reunifying most of Unconquered Alexandros' empire, honouring him and his divine father with temples everywhere he went. However, it was after his passing from the mortal plane that his son and heir Antiokhos the Saviour would reveal to the world the true nature of his father. When Alexandros was but a young man, he met and befriended Selucus, a boy a few years his senior, and approved Selucus' service as his paige and later lieutenant. However, as they left on the Great Conquest, Selucus' father revealed to him that he was in fact Alexandros' cousin. Alexandros' half brother, the god Apollo, had fathered Selucus and prophesied the boy would always protect the coming saviour, and carry on his legacy. Every action Selucus took thenceforth was in pursuit of this mission and in honour of Zeus, Alexandros and Apollo. From his revelation of this family secret, Antiokhos and his descendants would go on to solidify the Alexandrine Triad as the chief unifying gods of their empire; Zeus Belos, Apollo Mithras, and Alexandros Aniketos. Each reflect a key aspect of rulership and life in the empire. Zeus Belos was the god of fertility and prosperity, being honoured by farmers and traders. Apollo Mithras, also known as Nabu in Mesopotamia, is the god of wisdom, prophecy and healing, being honoured by scholars, administrators and healers. Alexandros the Unconquered is the immortal form of the man once bearing the same name, and blesses soldiers and all others who fight in His name until the day of His return to unify the world.\n\nThere are three distinct periods in the faith's history, classified by scholars according to which deity in the triad received the most worship. The Apollonian period covers most of the reign of Selucus' direct descendants. In it this originator of the dynasty received supreme reverence and temples appeared from the shores of Anatolia to the mountains of Bactria. However, in the late imperial period, following the loss of the Mithraic and Chaldean regions of the realm, the royal authorities would get increasingly dependent on the Syrian region and the blessing of Zeus Belos, patron of the Phoenicians. This Belian period culminated in the Roman takeover, as the old dynasty faded away and the new rulers elevated the priests of Zeus Belos at the city of Heliopolis to head the overall priesthood of the Triad. The willingness of these priests to incorporate elements of the Roman Jupiter and the Greek Helios into their worship of Zeus Belos made them perfect partners for the Roman state, who renamed the cult after the city. Yet, nothing can last forever, and in the constant warfare engulfing Syria for centuries following the brief reign of Palmyra, the warrior cult of Alexandros would once more come to the forefront. In this final Alexandrian period, the faith as a whole grew more martial and is now widely seen as simply another form of worship of the Conqueror, being largely constrained to the area around Antioch. Following the Reconquest of the Egyptian northeast from the Muslims some generations ago, Constantinople placed the surviving temples of the Triad under the leadership of the Cult of Alexandros-Ammon at Siwa, a distant and alien leadership hated by the priesthood. Hoping to save the last remnants of this once glorious faith, the priests of the Triad increasingly look with hope to a branch of the Seleucid dynasty that has once more risen to governorship of Syria…"

