 hypsistarian_rite_desc: "Hypsistarianism is a Heretical Graeco-Roman faith of Scholarly Soul with significant Jewish influences. Followers worship Theos Hypsistos, the Most High God, who they describe as "Self-begotten, un-taught, un-mothered, undisturbed, not permitting a name, many-named, dwelling in fire.""

#ALEXANDRINE CUSTOMS
 alexandrian_faith: "Alexandrine Customs"
 alexandrian_faith_adj: "Alexandrian"
 alexandrian_faith_adherent: "Alexandriast"
 alexandrian_faith_adherent_plural: "Alexandriasts" 
 alexandrian_faith_desc: "The cult of Alexandros-Ammon is a Local Graeco-Roman religion of Martial Soul, with significant Archaic influences. It centers around the worship of Alexandros III of Makedonia, better known as Megas Alexandros, whose conquests spanned from the Adriatic Sea to the distant shores of the Indus. In his conquest of Egypt, Alexandros acquired a divine nature when he visited the Oracle of the Siwa Oasis, for it was there that he was proclaimed son of Zeus-Ammon and Master of the Universe. Henceforth, his cult grew with every following year, surviving even the dissolution of his empire in the Wars of the Diadochi and merging with the much more ancient worship of the Egyptian god Amun. Ever since then, the quarrelsome descendants of his generals have invoked his name in the throne room and on the battlefield, and every aspirant officer has drilled the lessons of Issus and Gaugamela into his and his comrades' very hearts. This inexorable devotion once carried the brave sons of Hellen forth to achieve his greatest dream in life - to see the sun rise from the Great Eastern Ocean. Yet even this, they knew, was not the end. For the Oracle has prophesied that Alexandros-Ammon, the King of Conquerors, shall one day be reborn among his strongest and his most loyal - not to lead mere kingdoms of men, but to unite this shattered world under his leadership for all eternity!"
 alexandrian_faith_old: "Old Rite of Alexandros-Ammon"
 alexandrian_faith_old_adj: "Old Rite Alexandros-Ammonite"
 alexandrian_faith_old_adherent: "Old Rite Alexandros-Ammonite"
 alexandrian_faith_old_adherent_plural: "Old Rite Alexandros-Ammonites"

 alexandros_rite: "Cult of Alexandros-Ammon"
 alexandros_rite_adj: "Ammonite"
 alexandros_rite_adherent: "Ammoniast"
 alexandros_rite_adherent_plural: "Ammoniasts" 
 alexandros_rite_desc: "The cult of Alexandros Ammoniades, the Son of Ammon, is a syncretic Greco-Egyptian faith, centred on the Oracle of Ammonium at the Siwa Oasis. It centres around the worship of Alexandros III of Makedonia, better known as Megas Alexandros, who is seen as the son of the king of the gods, Zeus-Ammon. This inexorable devotion once carried the brave sons of Hellen forth to achieve his greatest dream in life - to see the sun rise from the Great Eastern Ocean. Yet even this, they knew, was not the end. For the Oracle has prophesied that Alexandros-Ammon, the King of Conquerors, shall one day be reborn among his strongest and his most loyal - not to lead mere kingdoms of men, but to unite this shattered world under his leadership for all eternity!"
 alexandros_rite_desc_long: "In his conquest of Egypt, the great Alexandros acquired a divine nature when he visited the Oracle of the Siwa Oasis, for it was there that he was proclaimed son of Zeus-Ammon and Master of the Universe. Henceforth, his cult grew with every following year, surviving even the dissolution of his empire in the Wars of the Diadochi and merging with the much more ancient worship of the Egyptian god Amun. Ever since then, the quarrelsome descendants of his generals have invoked his name in the throne room and on the battlefield, and every aspirant officer has drilled the lessons of Issus and Gaugamela into his and his comrades' very hearts. This inexorable devotion once carried the brave sons of Hellas forth to achieve his greatest dream in life - to see the sun rise from the Great Eastern Ocean. However, at the very apex of his power and glory, the resolve of his men failed him, and disappointed at the doubters, he ventured to shed his mortal form and return to his divine father's side. Yet even this, the true believers knew, was not the end. For the Oracle has prophesied that Alexandros Ammoniades, the King of Conquerors, shall one day be reborn among his strongest and his most loyal - not to lead mere kingdoms of men, but to unite this shattered world under his leadership for all eternity!\n\nWhile maintained as a secondary cult under the Ptolemies, who favoured their own syncretic deity, Serapis, but still wanted to venerate the great Conqueror, it is under the Romans the cult would come to truly thrive. With the great Augustus and his successors drawing part of their legitimacy from their relation with the Great Conqueror, they sponsored the Cult to great extent, making Alexandros' tomb in Alexandria a great pilgrimage site and showering the Oracle in 'Ammonium', or Siwa, with gifts and sacrifices. The cult of Alexandros Ammoniades would even be raised to supremacy over all other cults of Alexandros in the Empire, being the gobetween between their priesthood and the imperial authorities. These glory days would however be brought to an end by twin disasters, foreign faiths that serve the very same chaos the divine Alexandros fights every night in the afterlife to preserve the safety of the Sun. The first of these threats was the so-called followers of Christ, who spread like a plague across Egypt and attacked temples and faithful alike. If the authorities had not chosen to protect the traditional cults, the Christians may have wiped them all out entirely. Then, just as the Christians were on the retreat, came a far worse danger. Out of the eastern desert they swarmed, the Muslims as they would call themselves. The temples and cities fell one by one as the innumerable cults of Egypt fell silent in the face of the One God of the Arabs, and those few who still remained loyal to Amun fled either south into Nubia or west towards Siwa. Yet not even there they would find sanctuary, as the Muslims sought to use the oasis as part of their vast supply line as they stormed ever westward. What happened in the two centuries hence is largely lost to history as it is written by the Greeks, but they sure knew what they found when they returned.\n\nSome seven or eight generations before the newest crisis, the Roman rump state in Italy landed in Libya to the west, setting up a new colonial regime. Worried the Westerners would use the chaotic weakness of Muslim infighting in Egypt to expand east, the court at Constantinople sought to establish buffer states by backing the surviving Greek city states at Cyrene and Alexandria, for a long time Muslim protectorates, in a war against the same tribes that once exploited them, securing the hinterland between Alexandria and Cyrene. During this conquest, the Greeks arrived once more in Siwa, and were surprised to not find another Muslim garrison as expected, but instead worshippers of Amun, with some of them even haltingly speaking an archaic form of Greek. Their legends told of two centuries of guerilla war in the unforgiving mountains and deserts surrounding the Qattara Depression, before finally a generation hence storming Siwa and retaking what was once theirs, even if the Oracle now has fallen silent with no known lineage surviving. However, the most shocking of all to the Greeks was the leader of these brave tribespeople, a man who introduced himself as a descendant of Alexandros Helios, the son of Marcus Antonius and Kleopatra, once pardoned by the great Augustus himself. The family having eventually returned to Alexandria but then fleeing to Siwa, they had found themselves the leading Roman family in the oasis following the Invasion, and stepped into the role as leaders of the locals in their war of resistance.\n\nWhile the Ptolemies of Cyrene rejoiced at reuniting with these most distant of relatives, and named the Antonians hereditary protectors of the Oracle, the Cult still stands incredibly weak in the absence of said Oracle. The court in Constantinople hesitatingly conferred upon Siwa their old rights including the nominal leadership of the Alexandrine cults, the Siwans find their authority deeply resented and largely ignored by their imperial sister rites, who see them as Egyptianised barbarians. Falling outside the direct control of the Empire, the Cult has little ability to actually appeal to the Emperor for resolution of their conflicts with the other rites, and so their authority is essentially nil. Yet, the Ammonian cult has one thing going for them; the faith was always martial in nature, but their centuries of struggle to survive has forged them into a true philosophy of war, their training and devotion to tactical study forging them into warriors truly worthy of Alexandros, sharpened to a spearpoint directed towards the forces of chaos consuming the Conqueror's former empire. As for the other cults, if they will not listen to the commands from the palace of a missing Oracle, perhaps they will listen to the singing of steel swung in Alexandros' name."
