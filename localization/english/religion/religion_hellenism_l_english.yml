 hellenic_pagan: "Hellenism"
 hellenic_pagan_adj: "Hellenist"
 hellenic_pagan_adherent: "Hellenist"
 hellenic_pagan_adherent_plural: "Hellenists"
 hellenic_pagan_desc: "The Hellenic religion is a Mainstream Graeco-Roman faith of Traditional Soul. Followers worship a vast pantheon, the most important of which are the Dodekatheon, the twelve Olympian Gods including Zeus, Hera, Poseidon, Demeter, Athena, Apollo, Artemis, Ares, Aphrodite, Hephaestus, Hermes and either Hestia or Dionysus, depending on local variations. The religion is very demonstrative and regulates social life through rites and a well-defined calendar of events. Ritual offerings are practiced at levels, from household shrines to the largest temple, constitute one of the central practices in the religion in daily life. In particular, the religion is quite unique for its prevalence of household shrines, where most believers pray and leave offerings, with the foremost household deity being Hestia, who receives an offering at the beginning and ending of the rituals. In public, priests lead public and communal rituals that provide offerings to the gods. This clergy, although it enjoys much respect, remains decentralized and even temples worshipping the same deity are often independent from one another. In spite of this organizational weakness, the strength of this religion lies in the extremely strong bound it creates within societies that still follow it, with a mystical relationship to their history, natural and architectural environments. This may explain how the religion has gone through the centuries of imperial power, especially in smaller islands, creeks and havens of an old Mediterranean world that Ulysses would not find too unfamiliar. That religion retains a strong spiritual appeal to many, in association with the antique simplicity of a world where the gods still live close by the mortals."
 hellenic_pagan_old: "Old Rite Hellenism"
 hellenic_pagan_old_adj: "Old Rite Hellenist"
 hellenic_pagan_old_adherent: "Old Rite Hellenist"
 hellenic_pagan_old_adherent_plural: "Old Rite Hellenists"

