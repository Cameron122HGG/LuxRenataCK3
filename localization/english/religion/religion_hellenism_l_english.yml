 dionysos: "Dionysos"
 dionysos_adj: "Dionysian"
 dionysos_adherent: "Dionysian"
 dionysos_adherent_plural: "Dionysians"
 dionysos_desc: "The cult of Dionysos is a Heretical Graeco-Roman religion of Populist Soul, with significant Archaic influences. It centers around the worship of Dionysos, the god of wine, fertility, ritual madness, religious ecstasy, and theatre. Dionysos is a god who transcends the boundaries of the human and the divine, the mortal and the immortal. His worshippers seek to achieve a state of ecstasy and liberation from the constraints of everyday life through rituals that often involve music, dance, and the consumption of wine. The cult of Dionysos is known for its ecstatic and frenzied rituals, which can include elements of possession and trance. These rituals are often conducted in natural settings, such as forests or mountains, and are led by priests and priestesses known as Maenads or Bacchae. The cult of Dionysos has a rich mythology and is associated with various symbols, including the thyrsus (a staff topped with a pinecone), the grapevine, and the leopard skin. The worship of Dionysos was an important aspect of ancient Greek culture and had a significant influence on the development of theatre and drama."
