#ALEXANDROS NIKEPHOROS in Macedonia
 nikephoros_rite: "Cult of Alexandros Nikephoros"
 nikephoros_rite_adj: "Nikephorian"
 nikephoros_rite_adherent: "Nikephoriast"
 nikephoros_rite_adherent_plural: "Nikephoriasts"
 nikephoros_rite_desc: "The worship of Alexandros as the Orderer of the material plane, this martial faith with Neoplatonist and Solar influences promises its followers part in dominion over all Creation."
 nikephoros_rite_desc_long: "The cult of Alexandros, the Bringer of Victory, is the source of worship of the Great Conqueror as it persists in his homeland, promoted and protected by the great lords of Macedonia. The esoteric elements seen in Aegyptos and the syncretism of Mesopotamia found little purchase in the core of the Greek world, despite the Successors’ best efforts. Yet, Greeks from almost every polis had served in His armies, and for many veterans of the Great Campaign it proved impossible not to accept the superhuman nature of their former leader. Sporadic Alexander cults soon developed, strongest of all in the Macedonian heartland.\n\nWhat would eventually make the cults so attractive for the upper classes would be the influence of Aristotelian court philosophers from Athens, invited north to educate Macedonian nobles in imitation of Alexandros, on the suggestion of former Athenian resident and Macedonian ruler, Demetrios Antigonid. These philosophers would soon apply an entirely new cosmology to the cult of Alexandros, imbuing the faith with a rational reason well suited to the Greek temperament.\n\nThe Nikephoran cosmology divides Creation into three spheres or planes, depending on the interpretation. The outer, or Empyrean Sphere, is the immaterial world of raw energy and matter, swirling chaos in which exists only the Ápeiron Kinoûn, the Limitless Mover, the Hidden God. Through the interplay of the forces of this Sphere, the Hylomorphic Sphere was born, the realm of Gods where energy starts settling into forms and the Nous, or intellect, awakens. These First Intellects, or gods as humans know them, sought to create an even more perfected world to inhabit alongside their followers, simpler souls. This world was the Somatic Sphere, the material universe. The gods used the chaotic matter of the Empyrean to create the world and creatures for the souls to inhabit, but discovered they themselves were too powerful to inhabit matter. They could only hold the shapes of humans for very short amounts of time, and largely had to contend themselves with influencing the world through natural phenomena. In the absence of the gods, the world soon began to backslide into the chaotic nature of its base matter, and divine order was upset. To restore balance, the greatest of the gods, Zeus Helios, created a series of demigods, superhumans, to defeat evil and unify the world in divine Order. The last and greatest of these was Alexandros the Bringer of Victory, the restorer of Order.\n\nThe Romans paid little attention to the cult for centuries after the takeover, writing it off as a local Greek oddity. However, with the rise of the cult of the Sun, the Romans tried to systematise and organise the many faiths of their empire, and to the chagrin of many Nikephorans they found themselves attached to the cult of Alexandros-Ammon in distant Egypt. To their surprise however, this connection would reinvigorate the faith by showing how to appeal to the common soldier and not just elites. Warrior priests simplifying and explaining the quest for Divine Order to the common soldier, the Sun of the Argeads used as a simple symbol for the commands of Zeus Helios, and of course the promise of a coming resurrected Alexandros, killed but temporarily by the scheming minions of the slain dark lord Dareîos Khaotikós… All these elements have reinvigorated the cult, finding purchase among the common folk and Greek legions alike for the first time, its fire growing every decade in uncounted hearts. One day soon, the cult of Alexandros might reach a point where even the Romans’ shaky connection to the Conqueror may not be enough, the warriors of Macedonia call out for a prince of the True Blood to restore true Order to the world. For war waged well is not chaos, but devotion. It is a song, and a dance, and a sacrifice to the gods all in one glorious whole when directed by a true Conqueror. Victory is Order, Alexandros brings Victory."
