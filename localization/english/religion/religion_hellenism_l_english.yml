 ALEXIKAKOS_GLOSS: "Apollo the Averter of Evil, invoked to ward off disease, pestilence and other afflictions."
 METER_THEON_GLOSS: "The Mother of the Gods, identified with Rhea and Cybele, the divine source of generation, fertility and life in the material world."
 KERDOIOS_GLOSS: "Hermes of Gain, the patron of merchants, commercial pursuits and the acquisition of wealth."
 KTESIOS_GLOSS: "Zeus the Protector of the Abode, guardian of the household's prosperity."
 TRISMEGISTOS_GLOSS: "Hermes the Thrice-Greatest, the syncretic form of Hermes revered as the revealer of sacred knowledge and hidden truths."
 PRONOIA_GLOSS: "Athena of Forethought, the embodiment of providence and prudent counsel."
 HEKEBOLOS_GLOSS: "Apollo the Far-Shooter, smiter of the enemies of those who are pure of heart."
 KALLINIKOS_GLOSS: "Heracles of Glorious Victory, the divine champion whose strength and perseverance overcome adversity and bring triumph."
 DOLIOS_GLOSS: "Hermes the Wily, the god of cunning, deception, stratagems and ingenious contrivances."
 PHOSPHOROS_GLOSS: "Hecate the Light-Bringer, the torch-bearing goddess who illuminates the darkness and guides mortals through the mysteries of the night."
 PELAGIA_GLOSS: "Isis of the Open Sea, protectress of sailors, ships and those who entrust their lives to the waters."
 PSYKHOPOMPOS_GLOSS: "Hermes the Guide of Souls, who conducts the souls of the departed from the mortal world to the abode of the dead."
 STEPHANOS_GLOSS: "The sacred wreath, be it laurel, olive, oak or other leaves, worn by priests, worshippers and sacrificial victims during religious ceremonies, and offered to the gods in reverence."
 TRIPOUS_GLOSS: "The tripod, a three-legged vessel for the burning of offerings, often an offering in itself."
 THYMIATERION_GLOSS: "The incense burner, through which fragrant offerings are made to the gods during prayers."
 HERMETIKA_BIBLIA_GLOSS: "The Hermetic Theogony, 1st to 3rd Century works containing revelatory theology concerning the origin of the world, the Greek gods and their mysteries."
 RHAPSODIAI_GLOSS: "the Rhapsodies, the oral epic and lyrical compositions sung by the Homeric poets, refined into distilled Greek mythological and theological literature."
 HIEROI_HYMNOI_GLOSS: "Sacred Hymns, compositions sung in praise of the gods."
 OURANOS_GLOSS: "Heaven, the celestial expanse inhabited by the heavenly gods."
 HYPEROURANIOS_TOPOS_GLOSS: "The Realm Beyond Heaven, the supracelestial domain of intelligible, real ideas contemplated by the purified soul."
 KHTHONIA_GLOSS: "Hecate of the Underworld, invoked in nocturnal ceremonies, magical rites and dealings with the spirits of the dead."
 KHTHONIOS_GLOSS: "Hermes of the Underworld, the divine intermediary between the living and the dead, invoked in funerary rites, magical practices and chthonic offerings."

