 #Status Doctrines
 lux_doctrine_status_name:0 "Doctrinal Status"
 lux_doctrine_status_desc:0 "Faiths are characterized not only by belief, but by the state of their doctrine in the context of the overall religion."
 lux_doctrine_mainstream_status_name:0 "Mainstream Doctrine"
 lux_doctrine_mainstream_status_desc:0 "This faith is recognized as following a most legitimate and orthodox doctrine, in keeping with the religion's most accepted tenets."
 lux_doctrine_local_status_name:0 "Local Doctrine"
 lux_doctrine_local_status_desc:0 "This faith is a local deviation from mainstream religious teachings, favoring social harmony and pragmatism over doctrinal purity."
 lux_doctrine_heretical_status_name:0 "Heretical Doctrine"
 lux_doctrine_heretical_status_desc:0 "This faith is a radical sect that openly challenges the dogma of accepted religious authorities, be it by the pen or by the sword."

 #Soul Doctrines
 lux_doctrine_soul_name:0 "Energizing Soul"
 lux_doctrine_soul_desc:0 "Every faith draws from a different source of civilizational energy for the vitality of its teachings."
 lux_doctrine_statist_soul_name:0 "Statist Soul"
 lux_doctrine_statist_soul_desc:0 "This faith believes that the religious institution should be closely tied to the state."
 lux_doctrine_martial_soul_name:0 "Martial Soul"
 lux_doctrine_martial_soul_desc:0 "This faith emphasizes the importance of military prowess and valor in its teachings."
 lux_doctrine_populist_soul_name:0 "Populist Soul"
 lux_doctrine_populist_soul_desc:0 "This faith prioritizes the needs and desires of the common people in its teachings."
 lux_doctrine_scholarly_soul_name:0 "Scholarly Soul"
 lux_doctrine_scholarly_soul_desc:0 "This faith values knowledge, learning, and intellectual pursuits as central to its beliefs."
 lux_doctrine_messianic_soul_name:0 "Messianic Soul"
 lux_doctrine_messianic_soul_desc:0 "This faith holds a belief in a future savior or messiah who will bring about a new era of peace and righteousness."
 lux_doctrine_traditional_soul_name:0 "Traditional Soul"
 lux_doctrine_traditional_soul_desc:0 "This faith emphasizes the importance of maintaining long-standing traditions and customs in its practices."
 lux_doctrine_clerical_soul_name:0 "Clerical Soul"
 lux_doctrine_clerical_soul_desc:0 "This faith places a strong emphasis on the role of the clergy and religious leaders in guiding the community."  
 
