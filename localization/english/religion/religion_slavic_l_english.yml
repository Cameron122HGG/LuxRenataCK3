 STANICA_SVATOVITA_GLOSS: "The Banner of Svątovit, a military fellowship entrusted with bearing the three-fold banner into battle."
 TRISTA_VOJINOVU_GLOSS: "The Three Hundred Companions, a cavalry retinue maintained by the priesthood of Arkona and dedicated to their protection."
 BRATSTVO_TRIGLAVA_GLOSS: "The Brotherhood of the Triglav, sworn defenders of the sacred pillars and sanctuaries of the Three-Faced Lord."
 MSTITELI_PERUNA_GLOSS: "The Avengers of Perun, warriors who believe that the ancient thunder god was slain by foreign gods and whose sacred duty is to avenge his downfall."
 ZELEZNYI_SCIT_GLOSS: "The Iron Shield, a military fellowship of sworn Triglaverian retinues."

 SVATOVIT_OBILNYI_GLOSS: "The Abundant, the face of Svątovit that bestows prosperity, plentiful harvests and the blessings of peace upon his people."
 SVATOVIT_SKORBNYI_GLOSS: "The Sorrowful, the face of Svątovit that mourns the fallen, the suffering of his people and the loss of the ancient gods."
 SVATOVIT_JAROSTNYI_GLOSS: "The Wrathful, the face of Svątovit that wages war against foreign gods, avenges the fallen and bestows strength and victory upon his warriors."
 SVATOVIT_GLOSS: "The Three-Faced Lord, supreme god of warfare, abundance and prophecy, whose three faces represent prosperity, sorrow and wrathful war. From his sacred fortress, Svątovit defends the Slavic peoples against foreign gods, bestows victory upon their warriors and reveals his will through the movements of sacred white horses."
 RUJEVIT_GLOSS: "The Seven-Faced Lord of Rujan, a martial deity represented bearing eight swords. Among Triglaverians, he is revered as a divine defender of the island and a companion of Svątovit."
 JAROVIT_GLOSS: "The god of spring and the vigorous renewal of nature, whose golden shield protects courageous warriors in battle protection. He presides over the growth of crops, the fertility of livestock and the strength of men."
 POREVIT_GLOSS: "A five-faced deity regarded as a guardian of the peace and prosperity, safe travels and trade."
 PORENUT_GLOSS: "A guardian against hidden dangers and an interpreter of concealed omens."
 ZIVA_GLOSS: "The goddess of life, revered among the Polabian Slavs as the protector of health, fertility, childbirth and the renewal of living things."
 PROVE_GLOSS: "The tutelary god of the Wagrians, worshipped in sacred groves rather than through idols. He presides over communal justice, solemn assemblies and the settlement of disputes."
 UBOZE_GLOSS: "The protective spirits of the household, revered through domestic offerings and entrusted with the wellbeing of the family, its possessions and its hearth."
 TRIGLAVERIC_PERUN_GLOSS: "The Slavc god of thunder and warfare. His fate is disputed among Triglaverians: some believe that he became Svątovit in his grief and wrath, while others maintain that he was slain or betrayed, leaving the Three-Faced Lord to assume his mantle."
 TRIGLAVERIC_ROD_GLOSS: "The primordial Slavic deity associated with creation, ancestry, birth and the continuity of kinship, revered as the source of the generations of gods and men."

 BIALYKON_GLOSS: "The White Horse, the sacred steed of Svątovit, whose movements are observed by the priests to ascertain the will of the god, particularly before war."
 OBILNOROG_GLOSS: "The Horn of Abundance, the drinking horn of Svątovit, filled with fresh mead every evening at Arkona. It represents the prosperity and plentiful harvests bestowed upon his people."
 TRIGLAV_GLOSS: "The Three-Faced Pillar, the representation of Svątovit displaying his three aspects of abundance, sorrow and wrathful war."

 PROROCANSTVA_GLOSS: "The Prophecies, a collection of prophetic traditions concerning the deeds of Svątovit, the fate of the gods and the fortunes of the Wends."
 ZNAMENA_BELOGO_KONJA_GLOSS: "The Omens of the White Horse, a collection of poems and past prophecies of the holy white steed."
 OTUVETY_SVATOVITA_GLOSS: "The Answers of Svątovit, a collection of oracular responses delivered by the priests of the god in matters of warfare, harvests, princely succession and communal affairs."
 GRODU_SVATOVITA_GLOSS: "The Fortress Above, the divine stronghold where the faithful dead gather under the protection of the Three-Faced Lord and aid him in his struggle against foreign gods."
 NAVI_GLOSS: "The realm of the dead, inhabited by the spirits of those who wander beyond the protection of the divine fortress of Svątovit."


 #Dazhbogite
 dazhbog: "Sŭxod Dažĭboga"
 dazhbog_adj: "Dažĭbogite"
 dazhbog_adherent: "Dažĭbogite"
 dazhbog_adherent_plural: "Dažĭbogites"
 dazhbog_desc: "The Descent of Dažbog is a martial mystery cult centered around Dažbog, the son of Svarog, creator and preserver of the Věčĭnyi Ognĭ, the Eternal Fire.\n\nUnlike his father, however, Dažbog represents the destructive, scorching aspect of the sun, and Svarog, seeking to temper him, challenges him to descend into the depths of Žar, the Burning Pit, not unlike the Christian Hell, and face many trials and torments. Initiates in the Descent of Dažbog practice ritual bloodletting, scarification of their flesh, and in extreme cases, self-mutilation. They seek to bind their slain enemies to Žar in eternal torment, especially Christians, from whom they may have borrowed the idea of a fiery place of torment after death.\n\nDažbogites regard it as a most holy task to unleash the Burning One's wrath on their foes, and go to war in little clothing, covered in body painting that realces their scarified skin, an example for their enemies of the suffering that awaits them in death."
