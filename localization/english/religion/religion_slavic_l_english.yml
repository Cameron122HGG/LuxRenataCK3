 slavic_pagan_old_adj: "Old Rodnoveric"
 slavic_pagan_old_adherent: "Old Rodnoveric"
 slavic_pagan_old_adherent_plural: "Old Rodnoverics"
 
 #Perunic
 perun: "Perunova Věra"
 perun_adj: "Perunovic"
 perun_adherent: "Perunovnik"
 perun_adherent_plural: "Perunovniks"
 perun_desc: "The loose collection of warrior lodges honoring Perun represent a Slavic religious movement -heavily influenced by the Manichean and Norse faiths- popular where Norse influence is strongest and where there is potential for warfare and adventure. Perun is the god of lightning and the Adventurer, the righter of wrongs and the judge of martial honor, the eternal protector of Humanity against Veles, the Lord Beneath the Earth, bent on devouring the Sun and subjecting all men to his will. He is usually depicted as a tall man with a golden moustache, a silver head, a copper beard, and armed with a mighty axe. Under Norse influence, many tend to grant him a loose prominence among all their Gods.\n\nThe cult doesn't have established temples, Perunovans arrange themselves in lodges around sacred oaks and groves, where they convene, revel, sacrifice oxen and listen to the exploits and adventures of warriors from far away, as told by wandering storytellers called Slovotans. They also sing the Slovo Peruna, the Word of Perun, a corpus of oral epics about Perun’s exploits as an honourable and astute adventurer. Every battle in his name and every song sang around the sacred oaks honours and strengthens Perun in his eternal struggle. It is said that whenever lightning strikes, it was an attempt by Perun to strike at Veles. Believers take it upon themselves to take part in this holy struggle against Veles' servants and other enemies to the Will of Perun."
