 #Svarogan
 svaroh: "[Glossary('Xramŭ Sŭvaroga', 'XRAMU_SUVAROGA_GLOSS')]"
 svaroh_adj: "Svarogovan"
 svaroh_adherent: "Svarogovnik"
 svaroh_adherent_plural: "Svarogovniks"
 svaroh_desc: "The Temple of [Glossary('Svarog', 'SVAROG_SVAROGAN_GLOSS')] is an organised Slavic religion built around the figure of the Prince and their rule, and inspired by the way Germanic and Roman states were building their organised religions to further their rule in the 700s and 800s AD.\n\n [Glossary('Svarog', 'SVAROG_SVAROGAN_GLOSS')] is seen as a liberator god of order and wise rule, the celestial master of the fire of creation, which he either stole from [Glossary('Rod', 'ROD_SVAROGAN_GLOSS')] or stole from Olympus of the Romans, and brought it to the banks of the Vistula, the Oder and the Varta rivers -triggering the decline of the Roman Empire in the process, some say. Thanks to this, Mankind broke free from the fetters with which [Glossary('Rod', 'ROD_SVAROGAN_GLOSS')] bound them in a savage state, and together, [Glossary('Svarog', 'SVAROG_SVAROGAN_GLOSS')] and Humanity overthrew [Glossary('Rod', 'ROD_SVAROGAN_GLOSS')]. [Glossary('Svarog', 'SVAROG_SVAROGAN_GLOSS')] then fostered human creation and ordained the world in hierarchies of princes, priests and farmers, all forged according to their use in society. He established his main Abode at Wrocław, dictated His Final Words and the Canticles, chose the Guardians of His Word (the Stróże) and anointed the vessels of His authority, the Princes, before returning to His high throne to watch over Humankind's advances.\n\nThe cult gained popularity in the 8th Century as Lechitic princes made an explicit connection between [Glossary('Svarog', 'SVAROG_SVAROGAN_GLOSS')]'s civilizational role and their own authority, but the Temple was officially established in 855 by [Glossary('Piast the Wheelwright', 'PIAST_GLOSS')], prince of the Polans, after he cast off the tyrannical prince Popiel.\n\nThe Temple has a very strict clerical structure, separate from the rest of society and obedient only to the Wysoki Stróż (the High Guardian of the Word) and the Prince, the true vessel of [Glossary('Svarog', 'SVAROG_SVAROGAN_GLOSS')]'s royal authority on Earth. Since [Glossary('Svarog', 'SVAROG_SVAROGAN_GLOSS')] is the patron of law and social contracts, its priesthood has garnered a monopoly on the writing and interpreting of law, both sacred and secular, becoming lawyers and scribes all across the lands of [Glossary('Lech', 'LECH_GLOSS')], but with the Prince always acting as the judge, lawspeaker and supreme authority. Often the Princes use the Temple as a way to assert their and their family's control over the territory and over other creeds and faiths, by accepting the cult of others as long as the oaths of fealty to the Prince and to the Word of [Glossary('Svarog', 'SVAROG_SVAROGAN_GLOSS')] are pronounced and fulfilled, and by placing local cults under the purview of the Stróż, the head priest of a district."
