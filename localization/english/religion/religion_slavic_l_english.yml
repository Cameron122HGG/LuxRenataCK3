 SVAROZIC_GLOSS: "The son of Svarog and the divine embodiment of the home hearth, the protective fire that warms and nourishes. The Greeks often call him Apollon."
 DAZIBOG_SVAROGAN_GLOSS: "The god of the radiant Sun in the sky, son of Svarog, provider of prosperity and abundance. Through his celestial light, he sustains Humanity and bestows wealth and fortune upon men."
 MOKOSH_GLOSS: "The goddess of the moist earth, fertility, childbirth, worshipped in springs, river banks and prayed upon for the fruitful bounty she brings."
 PERUN_GLOSS: "The god of thunder, warfare, adventure and solemn oaths. Perun is the enforcer of sacred contracts and the punisher of oathbreakers. Foreign theologians consider him another name for the same divine archetype as Thor or Herakles."
 VELES_SVAROGAN_GLOSS: "The silent god of cattle, material wealth, and the Underworld, often quated with Hades or Pluto. An ambiguous figure within the divine order, Veles presides over hidden knowledge, cunning and the passage of the dead."
 CHERNOBOG_SVAROGAN_GLOSS: "The Black God, associated with darkness, misfortune and calamity. His powers threaten the prosperity of Humanity and the order established by Svarog. Manicheans and Dragomirists call him Ahriman."
 XRAMU_SUVAROGA_GLOSS: "The Temple of Svarog, an organised Slavic religious institution devoted to the god of celestial fire, civilization, law and princely authority."
 #WYSOKI_STROZ_GLOSS: "The High Guardian of the Word, supreme clerical authority of the Temple of Svarog and custodian of the divine laws revealed in His Final Words and the Canticles."
 SVAROG_SVAROGAN_GLOSS: "The supreme Slavic god of celestial fire, blacksmithing, creation, law and wise rule, according to the teachings of his Temple. Svarog liberated Humanity from the tyranny of Rod through the gift of fire, Learned theologians often identify him with Jupiter and Prometheus, although he has also been equated with Hephaestus or Vulcan."
 ROD_SVAROGAN_GLOSS: "The primordial Slavic deity associated with creation and ancestry. In the theology of the Temple of Svarog, Rod kept Humanity ignorant and in servitude, until Svarog stole the Fire of Creation and gave Mankind the means to free itself."
 LECH_GLOSS: "The legendary forefather of the Lechitic peoples. The lands of Lech encompass the territories inhabited by his descendants, particularly those along the Vistula, Oder and Varta rivers."
 PIAST_GLOSS: "Piast the Wheelwright, founder of the Piast dynasty and prince of the Polans. Having overthrown the tyrannical prince Popiel, he officially established the Temple of Svarog in 855, binding the authority of the priesthood to that of the Lechitic Princes."svaroh_old: "Old Svaroganism"
 
#Svetovidan
 svetovid: "Triglavery"
 svetovid_adj: "Triglaveric"
 svetovid_adherent: "Triglaverian"
 svetovid_adherent_plural: "Triglaverians"
 svetovid_desc: "The warrior cult of Svątovit is a militant and isolationist Slavic faith that worships Svątovit, God of War and Patron of Abundance, represented by the Triglav totem poles, the Three-Faced Pillar. It has developed a loose organisation of itinerant priests and princely rituals in an area awash with conflict and raids by foreign peoples. The constant state of warfare in the Baltic coast has bred a cult that is secretive, highly suspicious of foreigners and oftentimes quite violent towards foreign cults.\n\nTriglaverians believe that Svątovit brings prosperity in peace and victory in battle, as long as he has strength to fight off the foreign gods that threaten His fortress. Some believe he is a grieving, rageful Perun, or that he has adopted much of Perun’s attributes; others believe Perun was slain by foreign gods like Thor or Christ, or even that he was betrayed by Svarog or Hors, and that Svątovit picked up his mantle. The god is often shown with a sword or bow in one hand and a drinking horn in the other. His cult involves offerings of mead, game and enemy shields in front of the Triglavs, the three-headed pillars that represent the god with three faces, one for abundance, one for sorrow and one for wrathful war. The greatest temple to Svątovit is located on the island of Rujan, in the sacred enclosure of Arkona, which has survived innumerable Norse raids, and the only rock-carved Triglav stands, monolithic and with the war face looking north, as well as the Obilnorog, the Horn of Abundance, filled with fresh mead every evening.\n\n Omens and divination are also paramount in the ritual world of Triglavery, especially the priestly observation of the movement of white horses -the Białykon being one of the main symbols of the faith."
