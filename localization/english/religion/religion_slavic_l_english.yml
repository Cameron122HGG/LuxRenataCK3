 #Rodnoveric
 slavic_pagan: "Rodnovery"
 slavic_pagan_adj: "Rodnoveric"
 slavic_pagan_adherent: "Rodnoveric"
 slavic_pagan_adherent_plural: "Rodnoverics"
 slavic_pagan_desc: "The Rodnovery ('Ancestral Faith') represents the native religious traditions of the Slavs, in which Rod is seen as the creator god and therefore the king of heaven -although in some groups, Svarog is worshiped as the principal deity. Other deities include Perun, the god of thunder, Veles, the ruler of the underworld, Jarilo, the goddess of the moon, Dažbog, god of the sun, and so forth.\n\nRituals include festivals throughout the year, especially marking the passing of the seasons, full of revelry and debauchery, but also periods of observance for the dead, fasting and physical purification with water or fire, and the sacrifice of animals or the offering of precious objects to the altars of the Gods. Oracular divination is also central to their beliefs, with some gods, especially Svetovid and Veles, being considered givers of foresight. At Arkona the priests observe a white horse ride through a maze of spears to discern the result of a war, and in Glomuzi the believers observe the sacred waters for visions of the future."
