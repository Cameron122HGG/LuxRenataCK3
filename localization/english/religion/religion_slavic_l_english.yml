 #Rodic, messianic quasi-monotheistic and probably with strong Christian, Manichean and Hypsistarian influences.
 rod: "Rodicism"
 rod_adj: "Rodnic"
 rod_adherent: "Rodnic"
 rod_adherent_plural: "Rodnics"
 rod_desc: "As polytheism gives way to theism among the majority of the Slavic peoples, Rod has become the prime mover, the breath of creation and the sovereign of the world, who acts upon the Earth through portions of his mind, which some know as lesser gods or angels. Even though Nordic influence resulted in some Slavs accepting Perun as a chief deity, more traditionalist tribes consider that all the gods are faces or aspects of Rod, the father of creation.\n\nPerhaps influenced by the Manichean Avars or the East Roman solar and neoplatonic ideas of gods as emanations, or maybe through a general tendency in their own worldview, in the year 1000 it's becoming the most common form of worship among the Slavs, especially the common folk, and rulers who follow other religions, or who built temples and institutions around themselves to bolster their rule, are finding it difficult to root this belief away. Wandering prophets and living saints roam the land spreading the word of Rod's return to rule over the Earth and cast away the Usurpers and Impostors."
 rod_old: "Old Rodicism"
 rod_old_adj: "Old Rodnic"
 rod_old_adherent: "Old Rodnic"
 rod_old_adherent_plural: "Old Rodnics"

 #Velesic
 veles: "Sŭn Velesa" #The Dream of Veles
 veles_adj: "Velesovian"
 veles_adherent: "Velesovian"
 veles_adherent_plural: "Velesovians"
 veles_desc: "The Dream of Veles is a traditionalist and secretive cult centered around the lord of all beneath the Earth, Veles, he who guards the dead, he who haunts the dreams of Men, and the foremost opponent of the thunder god Perun. In his eternal battle with the Thunderer, Veles takes the form of a great dragon to slither up the roots of the World Tree, writhing and shifting in the wake of the storm and lightning cast down by his foe as he moves to invade the abode of the gods. The followers of Veles recall these battles in extatic rituals in caves or deep underground.\n\nIn his weavings through and dealings with the mortal realm, Veles variously takes the guise of magical trickster, thief, protector of peasants, and a plague-sending punisher of oathbreakers. When Veles sleeps, he sends mortals dreams, which are echoes of lives lived or yet to live, and Velesovians practice ritual trance and meditation.\n\nWhile the rest of the gods dwell high in the heavens, Veles' domain spans all that which lies beneath the earth. This includes the realm of Vyrai, where he shepherds the souls of the dead and guides the birds that carry the souls of the unborn into the world of the living."
