l_english:
 LR_saint_zoroastrianism_male: "Ashavan" # Avestan ašavan, righteous one, whose fravashi is venerated
 LR_saint_zoroastrianism_female: "Ashavan" # Avestan ašavan
 LR_saint_dualism_male: "Electus" # Latin electus, the Manichaean Elect
 LR_saint_dualism_female: "Electa" # Latin electa
 LR_saint_yazidi_male: "Xas" # Kurmanji xas, the holy figures of the Yazidis
 LR_saint_yazidi_female: "Xas" # Kurmanji xas
 LR_saint_hinduism_male: "Rishi" # Sanskrit ṛṣi, a seer
 LR_saint_hinduism_female: "Rishika" # Sanskrit ṛṣikā, a female seer
 LR_saint_bud_hellenic_male: "Arhat" # Sanskrit arhat, a worthy one
 LR_saint_bud_hellenic_female: "Arhatī" # Sanskrit arhatī
 LR_saint_indo_hellenic_male: "Theîos" # Greek theîos, divine (as Hellenism)
 LR_saint_indo_hellenic_female: "Theíā" # Greek theíā
 LR_saint_hypsistarian_male: "Theosebēs" # Greek theosebḗs (ē: the font lacks ḗ), God-fearer, the Hypsistarians' own name
 LR_saint_hypsistarian_female: "Theosebēs" # Greek theosebḗs (ē: the font lacks ḗ)
 LR_saint_mithras_male: "Pater" # Latin pater, the highest Mithraic grade
 LR_saint_mithras_female: "Mater" # Latin mater, invented: the grades were men-only
 LR_saint_neoplatonic_male: "Theurgós" # Greek theurgós, a holy theurgist
 LR_saint_neoplatonic_female: "Theurgós" # Greek theurgós
 LR_saint_solar_male: "Divus" # Latin divus, deified (as Roman)
 LR_saint_solar_female: "Diva" # Latin diva
 LR_saint_kemetic_male: "Akh" # Egyptian ꜣḫ, a transfigured blessed spirit
 LR_saint_kemetic_female: "Akh" # Egyptian ꜣḫ
 LR_saint_canaanite_male: "Rapiu" # Ugaritic rpu, the Rephaim, deified ancestral kings
 LR_saint_canaanite_female: "Rapiat" # invented feminine of rpu
 LR_saint_germanic_male: "Einheri" # Old Norse einheri, a hero of Valhalla
 LR_saint_germanic_female: "Dís" # Old Norse dís, a female ancestral spirit
 LR_saint_celtic_male: "Deuos" # Gaulish deuos, divine
 LR_saint_celtic_female: "Deuā" # Gaulish deuā
 LR_saint_tengrism_male: "Ongon" # Mongolic ongon, a revered ancestor spirit
 LR_saint_tengrism_female: "Ongon" # Mongolic ongon
 LR_saint_bon_male: "Drangsong" # Tibetan drang srong, a sage
 LR_saint_bon_female: "Drangsongma" # Tibetan drang srong ma
 LR_saint_zalmoxian_male: "Athanatos" # Greek athánatos, immortal, Herodotus's word for the Getae
 LR_saint_zalmoxian_female: "Athanatē" # Greek athanátē
 LR_saint_anatolian_male: "Šiuniš" # Hittite šiuniš, god: dead kings became a god
 LR_saint_anatolian_female: "Šiuniš" # Hittite šiuniš
