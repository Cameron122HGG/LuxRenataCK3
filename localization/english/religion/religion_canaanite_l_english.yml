 palmyran_pagan_old_adherent: "Old Elohimi"
 palmyran_pagan_old_adherent_plural: "Old Elohimis"
 palmyran_pagan_desc: "The worship of the Elohim ('Gods') is a Mainstream Canaanite faith of Traditional Soul. It refers to the religious traditions of the Canaanite, Phoenician and Nabatean peoples. It is mainly polytheistic, with some monolastic (recognizing many gods, but worshipping one or a few) tendencies. The main gods of the Elohimi pantheon are Ba'al Hadad, god of storms and king of the gods, Ashtart, goddess of fertility and war, Melqart, king of cities and god of merchants, and Eshmun, the god of healing, but it also includes many local Nabatean deities, and patron gods of Canaanite and Phoenician city states."

