malakbel: "Malakbêl"
malakbel_adj: "Malakbêlite"
malakbel_adherent: "Malakbêlite"
malakbel_adherent_plural: "Malakbêlites"
malakbel_desc: "The worship of Malakbêl ('Messenger of Baal') is a Local Canaanite religion of Traditional Soul. The worship of Malakbêl is traditionally strongly associated with Beelshamên's. In the 1st century, the Palmyran religion focused increasingly on the triad constituted by the supreme god Beelshamên, the lunar god Aglibôl, and the sun god Malakbêl. Then came the time of the glorious Palmyrene Empire in the 3rd century, wherein the Emperor Odaenathus and his wife Zenobia conquered Syria, the Parthian capital and Egypt, worshiping Beelshamên in an increasingly monotheist fashion as a reflection of their own absolute dominion of the lands of men. The new religious doctrine elevated Beelshamên as a rival of Sol Invictus, Ahura Mazda, and Yahweh. In this evolving cult, the new Palmyrene state attempted to merge the personality of all lesser gods, including Malakbêl, in the overwhelming figure of Beelshamên. Sacrifices to Malakbêl were forbidden, and his statues and other representations were removed from the main temples. However, many lay people and lower clergymen, confused by these dramatic changes, continued addressing their prayers to Malakbêl and made their best to keep some smaller representations for worship. Beelshamêni nobles and high priests turned a blind eye, for as the Romans identified Malakbêl with their own Sol Invictus, Beelshamêni authorities viewed the cult of Malakbêl as a potential vector for religious propaganda. More importantly, they did not perceive worshipers of Malakbêl as open challengers of Beelshamên's supremacy, as made explicit by the god's name itself. As the Empire collapsed and Palmyra returned to the status of petty kingdom, people nostalgic of the pluralist pantheon of old continued worshiping Malakbêl with little opposition from the mainstream clergy. Through the figure of Malakbêl, his followers worship the whole pantheon all lesser gods threatened of oblivion and hope to maintain the ways of living of simpler times alive."
