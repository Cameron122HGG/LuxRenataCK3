 kothar: "Kothar-wa-Khasis"
 kothar_adj: "Kothari"
 kothar_adherent: "Kothari"
 kothar_adherent_plural: "Kotharis"
 kothar_desc: "The worship of Kothar-wa-Khasis is a Local Canaanite faith of Scholarly Soul. Strongly tied to the venerable Bronze Age pantheons of the Fertile Crescent, particularly in Phoenicia, Kothar is most famous for his mythological role as a divine craftsman. His legendary works include raising temples and palaces on behalf of El, smithing weapons for Baal, and fashioning a bow for the hero Aqhat, labors of wisdom and skill acknowledged by mortals and the divine alike. Kothar's worship spread steadily throughout the Near East, carried by Phoenician colonists throughout the Mediterranean and eventually by the Egyptians who sought to match his artistry in their monumental projects, although the strength of his cult declined over the centuries as both the Punic and Egyptian civilizations were brought beneath the Roman heel."
