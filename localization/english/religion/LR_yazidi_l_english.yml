l_english:
 # Yazidi extras, ported from Lux Invicta (luxyazd.221-224, luxyazd.10163-10178, yazidi_pilgrimage)

 # Tawusgeran blessings
 LR_yazidi.0002.t:0 "The Sacred Image"
 LR_yazidi.0002.desc:0 "You spend hours looking and praying to the sacred image of [ROOT.Char.GetFaith.HighGodName]. As you meditate further on the divine nature of [ROOT.Char.GetFaith.HighGodName], you feel light and warmth course through your mind and body, and shudder with excitement. Only now do you truly understand!"
 LR_yazidi.0002.a:0 "Praise [ROOT.Char.GetFaith.HighGodName]!"
 LR_yazidi.0003.t:0 "The Sacred Image"
 LR_yazidi.0003.desc:0 "You spend hours looking and praying to the sacred image of [ROOT.Char.GetFaith.HighGodName]. As you meditate further on the divine nature of [ROOT.Char.GetFaith.HighGodName], you open your eyes and stare into [ROOT.Char.GetFaith.HighGodHerHis] face to embrace the divine mysteries to be seen therein..."
 LR_yazidi.0004.t:0 "The Sacred Image"
 LR_yazidi.0004.desc:0 "You spend hours looking and praying to the sacred image of [ROOT.Char.GetFaith.HighGodName]. As you meditate further on the divine nature of [ROOT.Char.GetFaith.HighGodName], you start to feel a holy presence entering your mind. Yes, yes... finally! You feel the gross incandescence of [ROOT.Char.GetFaith.HighGodName] inside you!"
 LR_yazidi.0005.t:0 "The Sacred Image"
 LR_yazidi.0005.desc:0 "You spend hours looking and praying to the sacred image of [ROOT.Char.GetFaith.HighGodName]. As you meditate further on the divine nature of [ROOT.Char.GetFaith.HighGodName], you feel [ROOT.Char.GetFaith.HighGodHerHis] holy light in your body, and shudder with excitement. A miracle! [ROOT.Char.GetFaith.HighGodName] has cured you of your ailments!"

 # Pilgrimage decision
 LR_yazidi_pilgrimage_to_lalish_decision:0 "Visit the Tomb of Sheikh Adi"
 LR_yazidi_pilgrimage_to_lalish_decision_desc:0 "Some faithful [ROOT.Char.GetFaith.GetAdherentNamePlural] decide to make a great pilgrimage at some point in their lives. The devout pilgrim is prepared to travel long distances in order to visit the tomb of the religion's founder, Sheikh Adi ibn Musafir."
 LR_yazidi_pilgrimage_to_lalish_decision_tooltip:0 "Make the pilgrimage to Lalish and pray at the tomb of Sheikh Adi."
 LR_yazidi_pilgrimage_to_lalish_decision_confirm:0 "Onwards to Lalish!"
 LR_yazidi_pilgrimage_to_lalish_decision_effect_tt:0 "You set out on a pilgrimage to Lalish. Your journey may strengthen or shake your faith."
 LR_yazidi_pilgrimage_to_lalish_decision_ongoing_tt:0 "You are not already on a pilgrimage to Lalish"
 LR_yazidi_pilgrimage_to_lalish_decision_health_tt:0 "You are healthy enough to travel"

 # Setting out
 LR_yazidi.0101.t:0 "Pilgrimage to Lalish"
 LR_yazidi.0101.desc:0 "I shall go on a pilgrimage to seek God's grace at one of the holy places of our faith.\n\nThe most important holy site to [ROOT.Char.GetFaith.GetAdherentNamePlural] is the tomb of the religion's founder, Sheikh Adi ibn Musafir, which is located at Lalish, north of Mosul. You may face trouble if you come into contact with any of the area's Muslims or Christians, who consider Yazidis to be devil worshippers, but this is a once in a lifetime opportunity."
 LR_yazidi.0101.a:0 "Onwards to Lalish!"
 LR_yazidi.0101.a.tt:0 "The road to Lalish is long, and the desert is full of dangers."

 # Bandits
 LR_yazidi.0111.t:0 "Bandits!"
 LR_yazidi.0111.desc:0 "As you make your way towards Lalish, you are suddenly ambushed by a group of bandits! Your guards draw their sabres, ready to defend you if necessary, but the bandits are numerous. Will you attempt to fight them, or try to flee?"
 LR_yazidi.0111.a:0 "Fight them!"
 LR_yazidi.0111.b:0 "Run away!"
 LR_yazidi.0112.desc:0 "You order your guards to engage the bandits. The fight is tough, but your men win out in the end. What is left of the bandit force falls back into the desert, their tails tucked between their legs."
 LR_yazidi.0112.a:0 "Victory and honor!"
 LR_yazidi.0113.desc:0 "You ditch your guards and run towards the hills. Your men are able to stop the bandits from catching up with you, but take heavy casualties in the process. You are safe, but your pride has been damaged."
 LR_yazidi.0113.a:0 "That was close..."

 # Oasis
 LR_yazidi.0114.t:0 "The Oasis"
 LR_yazidi.0114.desc:0 "The hot sun beams down upon you as your group makes its way towards Lalish. The nearest town is two days away, but you are nearly out of water. One of your men rides back suddenly and tells you he found an oasis just over the horizon. You could stop for water if you wish, but it may delay your journey."
 LR_yazidi.0114.a:0 "We keep going"
 LR_yazidi.0114.b:0 "Stay for a while"
 LR_yazidi.0114.b.tt:0 "Your arrival at Lalish is delayed."

 # The stranger (peacock)
 LR_yazidi.0115.t:0 "A Stranger in the Desert"
 LR_yazidi.0115.desc:0 "You are riding towards Lalish when a man suddenly appears in the distance, startling you. Your guards draw their weapons and form a circle around you, ready to defend you if needed. The man calls out to you in a language you cannot understand, then begins to walk towards you, his arms held outwards."
 LR_yazidi.0115.a:0 "Drop your weapons"
 LR_yazidi.0115.a.tt:0 "You let the man approach you."
 LR_yazidi.0115.b:0 "Kill the assassin!"
 LR_yazidi.0115.b.tt:0 "You order your men to attack."
 LR_yazidi.0116.desc:0 "You order your guards to drop their weapons so the man may approach. They hesitate at first, but place them on the ground after you throw away your own dagger. The man approaches you and hands you a strange glowing feather. When you look up to ask the man why he has given it to you, he has vanished."
 LR_yazidi.0116.a:0 "Glory to [ROOT.Char.GetFaith.HighGodName]!"
 LR_yazidi.0117.desc:0 "Your men spring into action, ready to strike the man down, but he suddenly vanishes. With the threat seemingly gone, your guards fall back towards you, unnerved by what had just happened. With nothing more to see, you decide to move on, but you can't help but think about what just happened."
 LR_yazidi.0117.a:0 "What a waste of time!"

 # Samaritan
 LR_yazidi.0118.t:0 "The Injured Man"
 LR_yazidi.0118.desc:0 "Your carriage comes to a stop suddenly, shunting you awake. When you ask one of your guards what has happened he tells you an injured man has been found just off the side of the road. He will likely die without proper treatment, but you don't have very many supplies to spare right now."
 LR_yazidi.0118.a:0 "Help him"
 LR_yazidi.0118.b:0 "Leave him"

 # Beggar
 LR_yazidi.0119.t:0 "The Beggar"
 LR_yazidi.0119.desc:0 "The ride has been hard so far, so you decide to take a break in a nearby town. A beggar walks up to you as you walk about the market and asks for a few coins. Charity is good in the eyes of [ROOT.Char.GetFaith.HighGodName], but do you really want to be seen talking to a peasant?"
 LR_yazidi.0119.a:0 "Here you go"
 LR_yazidi.0119.b:0 "Don't even touch me!"

 # Lost
 LR_yazidi.0120.t:0 "Lost in the Desert"
 LR_yazidi.0120.desc:0 "You left the main road some time ago after a traveler told you of a short cut to Lalish. It seems he was wrong, because your group has become lost in the desert. You could keep on going, but with water supplies running low, it might be a good idea to turn back towards the road."
 LR_yazidi.0120.a:0 "We'll go back"
 LR_yazidi.0120.b:0 "We'll keep going"

 # Sheikh's Tomb
 LR_yazidi.0131.t:0 "Sheikh's Tomb"
 LR_yazidi.0131.desc:0 "After weeks of trekking through the desert sun, you have finally arrived at your destination! The village of Lalish is small, but you can feel the presence of [ROOT.Char.GetFaith.HighGodName] all around you. Escorted by your guards, you join the pilgrims waiting to pray at the tomb of Sheikh Adi ibn Musafir. You pray at the tomb once it is your turn, wishing for a long life and many children, and then move on, ready to make the journey home."
 LR_yazidi.0131.a:0 "Glory to [ROOT.Char.GetFaith.HighGodName]!"
 LR_yazidi.0131.a.tt:0 "You begin the journey home."
 LR_yazidi.0132.desc:0 "After weeks of trekking through the desert sun, you finally arrived at your destination. You expected Lalish to be huge, but it is barely even a hamlet, and it feels as if it is devoid of the presence of [ROOT.Char.GetFaith.HighGodName]. Escorted by your guards, you join the pilgrims waiting to pray at the tomb of Sheikh Adi ibn Musafir. Discouraged by your trek, you eventually get tired of waiting, and decide to instead make the journey home."
 LR_yazidi.0132.a:0 "What a waste of time!"

 # Journey home
 LR_yazidi.0133.t:0 "Home from Lalish"
 LR_yazidi.0133.desc:0 "You are finally home, happy to have made the journey. It was a long and arduous trek, but you feel the experience has strengthened your faith in [ROOT.Char.GetFaith.HighGodName]!"
 LR_yazidi.0133.a:0 "A worthwhile trip!"
 LR_yazidi.0134.desc:0 "You are finally home, angry that your journey went poorly. It was a long and arduous trek, all for nothing, and you feel it has shaken your faith in [ROOT.Char.GetFaith.HighGodName]."

 # Modifiers
 LR_lalish_pilgrim_modifier:0 "Pilgrim of Lalish"
 LR_lalish_pilgrim_modifier_desc:0 "This character has prayed at the tomb of Sheikh Adi at Lalish."
 LR_lalish_disillusioned_modifier:0 "Disillusioned Pilgrim"
 LR_lalish_disillusioned_modifier_desc:0 "This character's pilgrimage to Lalish went poorly, and their faith has been shaken."
 LR_peacocks_feather_modifier:0 "Peacock's Feather"
 LR_peacocks_feather_modifier_desc:0 "A strange glowing feather, given by a stranger on the road to Lalish who vanished as suddenly as he came."
 LR_desert_heat_modifier:0 "Desert Heat"
 LR_desert_heat_modifier_desc:0 "This character has suffered under the desert sun."
 LR_fresh_water_modifier:0 "Fresh Water"
 LR_fresh_water_modifier_desc:0 "This character has rested and drunk their fill at a desert oasis."
