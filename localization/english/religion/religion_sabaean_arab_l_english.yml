allat_high_god_name_possessive: "Al-lat's"
allat_high_god_name_alternate: "$allat_high_god_name$"
allat_high_god_name_alternate_possessive: "$allat_high_god_name_possessive$"

almaqah: "Almaqah"
almaqah_adj: "Almaqahi"
almaqah_adherent: "Almaqahi"
almaqah_adherent_plural: "Almaqahis"
almaqah_desc: "The worship of Almaqah is a Mainstream Arabic religion of Clerical Soul. Almaqah is the great protector and sole patron god of the Sabaeans. His veneration is especially strong among the Mukarribs, the unifier kings of Saba, so much that they even call themselves the children of Almaqah and claim direct descent from him. The greatest temple of Almaqah is the huge Temple of Awam near Ma'rib, the Sabaean capital. The temple is tended by his priesthood, who perform rites, bless newborns and receive the offerings that are to be placed on Almaqah's shrine. A common offering to thank Almaqah usually consists of placing incense or little bronze figurines at his shrines to thank Him for past fortunes and to ask for more fortunes in the future. The rich often order their servants to make steles, statuettes, or bronze plates adorned with many different animals, symbols and most importantly an inscription in which they thank Almaqah, the steles are later to be placed at the local temples. More than a protector god, Almaqah is also a god of fertility, responsible for seasonal rain, and hence very important to the Sabaeans who pride themselves on their agricultural methods. Other aggressive natural phenomena, such as storms and thunders are associated to him as well, and not unlike Ba'al Hadad and other Near Eastern deities, have made his totem animal the bull, though more often, in his shrines one can find depictions of ibexes and mountain goats which are as well associated with the father of the Sabaeans. When Southwestern Arabia was unified by the Mukarrib kings of Saba, they ordered the temples and statues dedicated to other gods, such as 'Attar, Ta-lab or Shams, to be destroyed and replaced by shrines and temples dedicated to Almaqah, establishing their supremacy as unifier kings of the new Sabaean federation. Since then, the glory of Almaqah has made the Sabaeans into a thriving metropolitan culture, and His protective influence has been able to withstand and even turn back the might of Islam at its height."
almaqah_old: "Almaqah Old Rite"
almaqah_old_adj: "Almaqahi Old"
almaqah_old_adherent: "Old Almaqahi"
almaqah_old_adherent_plural: "Old Almaqahis"
sabean_arab_adj: "Sabaean"
almaqah_high_god_name: "Almaqah"
almaqah_high_god_name_2: "$almaqah_high_god_name$" # Optional translation alt
almaqah_high_god_name_possessive: "Almaqah's"
almaqah_high_god_name_alternate: "$almaqah_high_god_name$"
almaqah_high_god_name_alternate_possessive: "$almaqah_high_god_name_possessive$"

hubal: "Hubal"
hubal_adj: "Hubali"
hubal_adherent: "Hubali"
hubal_adherent_plural: "Hubalis"
hubal_desc: "The cult of Hubal is a Heretical Arabic faith of Traditional Soul. Hubal, one of the main deities of the Arabian religious traditions, is a god of fertility, rain, war, agriculture, and divination. Shrines to Hubal were once common across the Arab world, with a typical altar to Hubal consisting of his idol being placed upon a platform above a sacred well. Though once a pluralistic sect in keeping with the rites of other Arab pagans, the rise of Islam and their violent expulsion from their lord's greatest and most holy shrine at the Ka'ba has seen the Hubali priesthood adopt more zealous doctrines in the struggle to preserve their faith, chiefly their shift to a monotheistic worship of Hubal. The following centuries spent in mountain exile have made them callous to the whims of the southern Mukarribs and ever more bitter to the Muslims, against whom they continue to swear revenge. For the Hubalis yet envision the day when they may repay the dishonor inflicted upon them by the followers of Mohammed, scattering his followers to the desert winds and worshipping at the Ka'ba once more!"
hubal_old: "Old Hubal"
hubal_old_adj: "Old Hubali"
hubal_old_adherent: "Old Hubali"
hubal_old_adherent_plural: "Old Hubalis"

hubal_high_god_name: "Hubal"
