maher: "Maher"
maher_adj: "Maherite"
maher_adherent: "Maherite"
maher_adherent_plural: "Maherites"
maher_desc: "The cult of Maher is a Local Arabic religion of Martial Soul, with strong Barbarian influences. It is warrior cult focusing on the worship of Maher or Mahrem, the Axumite god of war. He is also worshipped by the Sabaean colonists in Axum. Followers believe that by worshipping Maher, he will grant them victory in battle."
