#Faiths
allat: "Al-lat"
allat_adj: "Al-lati"
allat_adherent: "Al-lati"
allat_adherent_plural: "Al-latis"
allat_desc: "The worship of Al-lat and her sisters is a Local Arabic religion of Traditional Soul. A henotheistic cult worshipping Al-lat, an Arabian goddess of light and life, as a primary deity, it also honors her two sisters: Al-'Uzzá, goddess of love and beauty, and Manat, goddess of destiny and death. Their cultists believe that by keeping the traditions of their goddesses, they may convince the three sisters to maintain the balance between life, fertility, and death. Although her worship once spread as far afield as Palmyra and Nabataea, the rise of the Islamic caliphates in the 7th century saw Al-lat's holiest site at Ta'if destroyed and her cultists scattered to the winds, leaving the cult of the three goddesses to languish at the periphery of Sabaean worship. Diminished as they are, the people have not forgotten them, and their priests and priestesses continue making their offerings and prayers where the old ways yet hold firm."
