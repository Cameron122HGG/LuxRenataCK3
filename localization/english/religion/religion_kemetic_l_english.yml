 #Ra-Horakhticism
 horus_re: "Ra-Horakhty"
 horus_re_adj: "Ra-Horakhtic"
 horus_re_adherent: "Ra-Horakhtic"
 horus_re_adherent_plural: "Ra-Horakhtists"
 horus_re_desc: "The cult of Re-Horakhty (Ra-Horus) is a Local Egyptian faith of Messianic Soul. The faith focuses on Ra of the Two Horizons as the king of the gods. The faith is a dualistic faith, influenced by both the Roman cult of Sol Invictus and Zoroastrianism. Ra is the king of the Gods and is opposed by the evil beast known as Apep, whom every night Ra goes to the underworld and fights. While the traditional Egyptian gods retain worship, they are placed on a lower standing than Ra. Ra is the king of all, and all the other gods derive their power through him. In daily life, it is common to hear numerous hymns to Ra from the faithful, who believe that Ra will one day create a new god in the future whom shall bring Egypt out of darkness and into the light of the sun."
 horus_re_old: "Old Ra-Horakhty"
 horus_re_old_adj: "Old Ra-Horakhtic"
 horus_re_old_adherent: "Old Ra-Horakhtic"
 horus_re_old_adherent_plural: "Old Ra-Horakhtists"
 horus_re_old_desc: "The cult of Re-Horakhty (Ra-Horus) is a Local Egyptian faith of Messianic Soul. The faith focuses on Ra of the Two horizons as the king of the gods."

