 #Isisism
 isis: "Isis"
 isis_adj: "Isetite"
 isis_adherent: "Isetite"
 isis_adherent_plural: "Isetites"
 isis_desc: "The cult of Isis is a Local Egyptian faith of Clerical Soul. The faith is a henotheistic faith that primarily worships Isis. It also worships Horus and Osiris and other family members of Isis, and to an even lesser degree the other Egyptian gods. The faith grew out of the Isetite and Osirion Mystery cult. In daily life the focus of the religion is on the priests which hold great influence. Unlike other faiths, the clergy of the Isetite faith are all women. It is considered prestigious for a daughter to join the clergy of the faith. The festivals and rituals center around Isis and her family, they often involve music, singing hymns and dancing. They also follow a dietary restriction of never eating fish or pork as those animals are considered sacred to the Isetite faith."
