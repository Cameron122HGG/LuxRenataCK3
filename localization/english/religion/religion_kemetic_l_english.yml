 #Cult of Amun-Ra
 amun: "Amun"
 amun_adj: "Amunite"
 amun_adherent: "Amunite"
 amun_adherent_plural: "Amunites"
 amun_desc: "The cult of Amun is a Mainstream Egyptian religion of Clerical Soul. The faith is a polytheistic one, and while Amun-Ra is considered the king of the gods, the other Egyptian deities are also worshiped. Some of the more popular divinities are Hathor, Isis, Osiris, Set, Bast, Ra, and Horus. In daily life most of the rituals revolve around the Nile River, where it is common for many farmers to provide offerings to Osiris for a good harvest. The calendar is likewise arranged according to the ebb and flow of the Nile. One of the central features of the Amunite faith is the relation between the living and the dead. Death festivals are common, but the dead are considered to be in a happy blessed land, and can come and visit the living from time to time and effect their descendants for good or ill. Thus the ancestors, or 'Akhu', are given offerings just like the gods. A final central tenet is Ma'at, the overriding ethical and moral teachings of truth, honor, justice, harmony, and above all balance. All are expected to uphold Ma'at, from the lowliest of peasants to mighty Pharaoh. If Pharaoh himself should go against these principles, then disorder and ruin are bound to befall the kingdom."
 amun_old: "Old Amun"
 amun_old_adj: "Old Amunite"
 amun_old_adherent: "Old Amunite"
 amun_old_adherent_plural: "Old Amunites"
 amun_old_desc: "The cult of Amun is a Reformed Mainstream Egyptian religion of Clerical Soul. The faith focuses on Amun-Ra as the king of the gods of Egypt."
 
 amun_religious_head_title: "Pharaoh"
 
 aten: "Aten"
 aten_adj: "Atenist"
 aten_adherent: "Atenist"
 aten_adherent_plural: "Atenists"
 aten_desc: "The cult of Aten is a Heretical Egyptian faith of Statist Soul, with a strong Graeco-Roman ascendant. Although its origins lie in the religious reforms of the Pharaoh Akhenaten, who two millennia ago attempted to centralize the Egyptian pantheon around the sun disk Aten, its worship today is a much more recent phenomenon. When the Amarna Period came to an end and the priesthood of Amun expunged the sun-worshipping Pharaoh from the annals of history, the Aten returned to its prior place as an aspect of Ra. It would have remained so if not for the rise of Sol Invictus as the foremost god of the Roman Empire. As part of their endeavors to maintain the long-standing harmony between Egypt and their increasingly monotheistic Roman suzerains, the Caesarian Ptolemies began to revive elements of solar worship in Egyptian religious practice starting in the 3rd Century CE, invoking the power of the sun gods as divine patron and protector of their dynasty. The march of Sol's cult into the lands of the Nile with Roman legions and Roman military governors further strengthened these efforts, as did the rediscovery of the abandoned temples at Amarna dedicated to the Aten's glory. This revived worship of Aten, deeply syncretized with that of Sol Invictus and Apollo-Helios, soon became the new state religion of Egypt, worshipping Pharaoh as a living god born of Aten's light. In the religious life of the cult worshippers sing adoring hymns of praise to Aten at services, priests make offerings to him within great open-air temples, and Pharaoh grants life and prosperity to Aten's most loyal."
 aten_old: "Old Aten"
 aten_old_adj: "Old Atenist"
 aten_old_adherent: "Old Atenist"
 aten_old_adherent_plural: "Old Atenists"
 aten_old_desc: "The cult of Aten is a Heretical Egyptian faith of Martial Soul. The faith is monotheistic focusing the worship on the god Aten, the Solar Disk."
 
 aten_religious_head_title: "Atenemesses"
 aten_religious_symbol: "solar disk"
 aten_religious_text: "the Great Hymn to the Aten"

