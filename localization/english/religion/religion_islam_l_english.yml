 #Shia
 islam_shia_priest: "mullah"
 islam_shia_priest_plural: "mullahs"
 islam_shia_religious_head_title: "Imam"
 islam_shia_religious_head_title_name: "Imamate"

 #Ash'ari
 ashari: "Ash'ariyyah"
 ashari_adj: "Ash'ari"
 ashari_adherent: "Ash'ari"
 ashari_adherent_plural: "Ash'aris"
 ashari_desc: "The Ash'ari are a Mainstream Islamic school of Statist Soul. An orthodox school of theology that holds that Allah has created every moment in time, but that humans have free will to choose between good — what God has commanded — and evil — what God forbids."

 #Muwalladism
 muwalladi: "Muwalladiyyah"
 muwalladi_adj: "Muwalladi"
 muwalladi_adherent: "Muwalladi"
 muwalladi_adherent_plural: "Muwalladis"
 muwalladi_desc: "Muwalladiyyah is a Local Islamic school of Clerical Soul. Far from the center of the Arabic world, Iberian Muslims adapted to the realities of ruling over a region with large Christian and Jewish populations that had strange, foreign traditions."

 #Mutazilism
 mutazila: "Mu'tazila"
 mutazila_adj: "Mu'tazili"
 mutazila_adherent: "Mu'tazili"
 mutazila_adherent_plural: "Mu'tazilis"
 mutazila_desc: "Mu'tazila is a Local Islamic sect of Scholarly Soul. A rationalist school of theology that asserts that the Qur'an is not eternally co-existing with God, as God must have preceded his own word."

 #Masmudism
 masmudi: "Muwahhidiyyah"
 masmudi_adj: "Muwahhidi"
 masmudi_adherent: "Muwahhidi"
 masmudi_adherent_plural: "Muwahhidun"
 masmudi_desc: "The Muwahhidun ('Monotheists') are a Local Islamic sect of Martial Soul. A reformist branch of Sunni Islam that originated with the Berber tribes in northern Africa, the Muwahhidi movement see themselves as unitarians and preach a doctrine of purified monotheism."
 masmudi_religious_head_title: "Caliph"
 masmudi_religious_head_title_name: "caliphate"

 #Maturidi
 maturidi: "Maturidiyyah"
 maturidi_adj: "Maturidi"
 maturidi_adherent: "Maturidi"
 maturidi_adherent_plural: "Maturidis"
 maturidi_desc: "Maturidiyyah is a Local Islamic sect of Clerical Soul. It is a breakaway from the Ash'ari school, originally founded in the 10th century by the theologian Abu Mansur Al Maturidi. The Maturidis espouse a rationalist philosophy where ethics have an objective existence, as derived from the eternal qualities of God, and that humans must therefore pursue ethical choices."
 
 #Quranism
 quranist: "Qur'aniyyah"
 quranist_adj: "Qur'ani"
 quranist_adherent: "Qur'ani"
 quranist_adherent_plural: "Qur'anis"
 quranist_desc: "Qur'aniyyah is a Heretical Islamic sect of Scholarly Soul. A literalist interpretation of Islam that emphasizes the Qur'an as the only source of divine wisdom, Qur'anis declare that Islam's holy book should be followed to the letter, ignoring hadith and fatwas."

 #Ismaili
 ismaili: "Isma'iliyyah"
 ismaili_adj: "Isma'ili"
 ismaili_adherent: "Isma'ili"
 ismaili_adherent_plural: "Isma'ilis"
 ismaili_desc: "Isma'iliyyah is a Mainstream Islamic school of Clerical Soul. A Shia faith that considers the line of true Imams — those imbued with divine knowledge and infallibility — to run through Isma'il bin Jafar. They are also known as Seveners, as Isma'il was the seventh Imam after Muhammad."

 #Qarmatians
 qarmatian: "Qarmatiyyah"
 qarmatian_adj: "Qarmatian"
 qarmatian_adherent: "Qarmatian"
 qarmatian_adherent_plural: "Qarmatians"
 qarmatian_desc: "Qarmatiyyah is a Heretical Islamic sect of Messianic Soul, with a Gnostic ascendant. Qarmatians believe that the number of Imams was preordained by God to be seven, and there could therefore be no more Imams before the seventh Imam — Muhammad ibn Isma'il — returned to guide the faithful."

 #Nizari
 nizari: "Nizariyyah"
 nizari_adj: "Nizari"
 nizari_adherent: "Nizari"
 nizari_adherent_plural: "Nizaris"
 nizari_desc: "The Nizaris are a Local Islamic school of Martial Soul. A rationalist faith that emphasizes reasoning in interpretation of the Qur'an and hadiths. Being Imam is hereditary, and they trace the line of succession to Ali."
 
 #Zayidi
 zayidi: "Zayidiyyah"
 zayidi_adj: "Zayidi"
 zayidi_adherent: "Zayidi"
 zayidi_adherent_plural: "Zayidis"
 zayidi_desc: "Zayidiyyah is a Local Islamic sect of Statist Soul. A true Imam is not infallible, but defined by their struggle against corruption and evil. Zayidis are therefore defined by their belief that Zayd ibn Ali was the rightful successor to the Imamate, due to his rebellion against the Umayyads."

 #Imamism (Twelver)
 imami: "Imamiyyah"
 imami_adj: "Imami"
 imami_adherent: "Imami"
 imami_adherent_plural: "Imamis"
 imami_desc: "Imamiyyah is a Local Islamic sect of Messianic Soul. They believe that Twelve Imams were prophesied to lead the Ummah, and that the twelth Imam, Imam Zaman, is waiting to return to lead Muslims into the Day of Judgement."
 islam_ayatollah: "ayatollah"
 islam_ayatollah_plural: "ayatollahs"

 #Ghulat
 ghulat: "Ikhtilafiyyah"
 ghulat_adj: "Ikhtilafi"
 ghulat_adherent: "Ikhtilafi"
 ghulat_adherent_plural: "Ikhtilafi"
 ghulat_desc: "Ikhtilafiyyah, also known as Ghulat ('Exaggeration') is a Heretical Islamic sect of Clerical Soul, with a Gnostic ascendant. They believe in the divine nature of the infallible Imams, starting with Ali. God has not only appointed and inspired them, but partially inhabits them to guide their acts, and by extension all of the Ummah."

 alawite: "Alawiyyah"
 alawite_adj: "Alawite"
 alawite_adherent: "Alawi"
 alawite_adherent_plural: "Alawis"
 alawite_desc: "The Alawis are a Heretical Islamic sect of Traditional Soul, with a Christian ascendant. Alawite religious teachings are secretive, and the Qur'an is only one of their sacred texts. In addition to the belief in the succession of Imams through Ali, Alawis also believe in reincarnation, and that all beings were stars cast out of heaven who must now re-earn their place by living successive good and faithful lives."

 #Alevis
 alevi: "Alevism"
 alevi_adj: "Alevi"
 alevi_adherent: "Alevi"
 alevi_adherent_plural: "Alevis"
 alevi_desc: "Alevis believe in the succession of the Twelve Imams, but also follow many other traditions as outlined in their collection of holy texts, the Buyruks. In Alevi tradition, God is the Truth, and Muhammad and Ali are manifestations of Him in the world."
 alevi_house_of_worship: "cemvi"
 alevi_house_of_worship_2: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_3: "$alevi_house_of_worship$" # Optional translation alt
 alevi_house_of_worship_plural: "cemvis"
 alevi_religious_text: "Buyruks"
 alevi_religious_text_2: "$alevi_religious_text$" # Optional translation alt
 alevi_religious_text_3: "$alevi_religious_text$" # Optional translation alt

 #Druze
 druze: "Druze"
 druze_adj: "Druze"
 druze_adherent: "Druze"
 druze_adherent_plural: "Druze"
 druze_desc: "The Druze faith is a Heretical Islamic religion of Traditional Soul, characterized by strong Archaic influences. Hailing from the Mountain of Druze, the Druze faith follows many of the principles of Isma'ilism, but also includes gnostic beliefs in an esoteric theology focused on the Truth of existence."
 druze_religious_text: "Epistles of Wisdom"
 druze_religious_text_2: "$druze_religious_text$" # Optional translation alt
 druze_religious_text_3: "$druze_religious_text$" # Optional translation alt

 #Ibadi
 ibadi: "Ibadiyyah"
 ibadi_adj: "Ibadi"
 ibadi_adherent: "Ibadi"
 ibadi_adherent_plural: "Ibadis"
 ibadi_desc: "The Ibadi are a Heretical Islamic sect of Traditional Soul. Ibadis do not believe that it is necessary for the entirety of Islam to be governed by a Caliph or an Imam, if there is no suitable candidate. They are therefore Muhakkima, recognizing neither the line of Ali or the successors of Abu Bakr as worthy leaders."

 #Azariqa
 azariqa: "Azariqa"
 azariqa_adj: "Azariqa"
 azariqa_adherent: "Azariqa"
 azariqa_adherent_plural: "Azariqas"
 azariqa_desc: "The Azariqa are a Heretical Islamic sect of Martial Soul. Recognizing no worthy successor to Muhammad, the Azariqas consider it their right and duty to struggle against any leader who does not uphold the values of their faith. Indeed, any difference in interpretation of faith would mark one as an infidel."

 #Najdat
 najdat: "Najdat"
 najdat_adj: "Najdat"
 najdat_adherent: "Najdati"
 najdat_adherent_plural: "Najdatis"
 najdat_desc: "Najdat is a Heretical Islamic sect of Populist Soul. Adherents of the Najdati branch of the Khawarij firmly believe in the establishment of Muslim leadership through the consensus of the faithful. The leader is not infallible, but through the community they are chosen by God."
 
 #Sufri
 sufri: "Sufriyyah"
 sufri_adj: "Sufri"
 sufri_adherent: "Sufri"
 sufri_adherent_plural: "Sufris"
 sufri_desc: "Sufriyyah is a Heretical Islamic sect of Scholarly Soul. Sufris believe in divine guidance and leadership through the interpretation of the word of God, rather than inheritance. The will of God becomes known as an expression of the Ummah's will, as long as the people of the Ummah are well-versed in the Qur'an."

 #Hafizi
 hafizi: "Hafizi"
 hafizi_adj: "Hafizi"
 hafizi_adherent: "Hafizi"
 hafizi_adherent_plural: "Hafizis"
 hafizi_desc: "The Hafizis are a Heretical Islamic school of Martial Soul. They put precedence on supporting who they consider to be the true caliph above all others, as well as resisting any and all attempts to unseat or depose them. In defeat, they are defined by rebellion for a worthy cause, and in victory, proud adherence to the will of their leader."

#Ilm_Islam
 ilm_islam: "Tahsilat al-'Ilm"
 ilm_islam_adj: "'Ilmi"
 ilm_islam_adherent: "'Ilmi"
 ilm_islam_adherent_plural: "'Ilmis"
 ilm_islam_desc: "The Tahsilat al-Ilm ('Study of the One Science') is a Mainstream Islamic School of Scholarly Soul. It is a branch of Islam characterized by strong emphasis on the study and scholastic lifestyle of Islam. A very intellectual sect, many adherents are well-educated and devote their lives to the study of the Qur'an."

#Ghazi
 #ghazi_islam: "Ghazi Islam"
 #ghazi_islam_adj: "Ghazi"
 #ghazi_islam_adherent: "Ghazi"
 #ghazi_islam_adherent_plural: "Ghazis"
 #ghazi_islam_desc: "Ghazi Islam is a Heretical Islamic School of Martial Soul. It is a militant sect, characterized by strong emphasis on jihad and the military expansion of Islam. Many adherents are warriors and soldiers who devote their lives to the expansion of the Islamic faith through holy war."

#Murji'ah
 #murjiah: "Murji'iah"
 #murjiah_adj: "Murji'i"
 #murjiah_adherent: "Murji'i"
 #murjiah_adherent_plural: "Murji'is"
 #murjiah_desc: "The Murji'ah are a Local Islamic School of Statist Soul. They believe that faith alone is sufficient for salvation, and that deeds are not to be judged until the Day of Judgement. Therefore, they advocate for postponing judgement of others, and emphasize unity among Muslims."
 
#Hurufi 
 hurufi: "Hurufiyyah"
 hurufi_adj: "Hurufi"
 hurufi_adherent: "Hurufi"
 hurufi_adherent_plural: "Hurufis"
 hurufi_desc: "Hurufiyyah is a Heretical Islamic sect of Scholarly Soul. A sect of Sufism that focuses around the letters of the Arabic alphabet and the number seven as being holy, Hurufis believe that God's incarnation is in everything, down to the last atom of existence."

#Athari
 athari: "Athariyyah"
 athari_adj: "Athari"
 athari_adherent: "Athari"
 athari_adherent_plural: "Atharis"
 athari_desc: "Athariyyah is a Local Islamic school of Clerical Soul. Athari theology represents a literalist tendency of Muslim thought, grounding itself on the principles of strict compliance with traditional Islamic law, the uniformity of interpretations of these laws, deference to scholars of the hadith in rulings, and strict opposition to bid'ah, dissident strains of emergent Islamic thought. Adherents accept the Qur'an and the hadith as they are originally written, striving to maintain the stability of the faith and to safeguard the purity of its traditions from adulteration."

#Kharijite
 kharijite: "Khawarijiyyah"
 kharijite_adj: "Khawariji"
 kharijite_adherent: "Khawariji"
 kharijite_adherent_plural: "Khawarijis"
 kharijite_desc: "Khawarijiyyah is a Heretical Islamic sect of Populist Soul. It constituted itself in the First Fitna in the 7th Century CE by opposing both Sunnis and Shias, and by assassinating Ali (whom they admired) because of his conciliatory attitude towards his enemy Mu'awiyah. Since then they have been rejecting - often violently - all forms of political leadership, citing 'judgment belongs to God alone.' They denounce most forms of codified Islamic jurisprudence as a betrayal to God's message contained wholly in the Qur'an, and consider it legitimate to kill a caliph if his acts are sinful. While sharing with Shia Islam a fascination for Ali, Kharijites violently reject the worship of individual imams and pilgrimages to imamzadeh as superstitions dangerously close to pagan idolatry. The strength of this uncompromising fundamentalist message based on Ali's legacy exercises a strong appeal among the Shias who regard their current leaders and clergy as corrupted by their drive for wealth and power.."
