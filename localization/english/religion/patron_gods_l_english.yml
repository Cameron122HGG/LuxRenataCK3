 patron_god_solar_deity_02_name: "Elagabal"
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_desc_solar_deity_02: "The black sun-stone of Emesa, brought to Rome by the priest-emperor Elagabalus. His temple tithes enrich every ruler who keeps his rites."
 
 patron_god_solar_deity_03: "Divus Commodus"
 patron_god_solar_deity_03_name: "Divus Commodus"
 # PLACEHOLDER: descriptions written by Claude on 2026-11-24. Replace them with the team's own text.
 patron_god_desc_solar_deity_03: "The emperor who fought in the arena as the new Hercules and was deified by Septimius Severus. He grants a strong body and a mind untroubled by care."
 
 patron_god_solar_deity_04: "Divus Julianus"
 patron_god_solar_deity_04_name: "Divus Julianus"
 patron_god_desc_solar_deity_04: "The Roman Emperor known for his efforts to restore paganism and his philosophical pursuits, worshipped as a solar deity."
 
 patron_god_solar_deity_05: "Sol Invictus"
 patron_god_desc_solar_deity_05: "The Roman sun god, worshipped as the invincible sun, central to the solar cult of the Roman Empire."

