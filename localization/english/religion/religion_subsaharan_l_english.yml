 # Basque Paganism - Era Zaharrak
 ## "Basque Religion"
 basque_religion:0 "Euskal Erlijioa"
 basque_religion_adj:0 "Euskal"
 basque_religion_adherent:0 "Euskal"
 basque_religion_adherent_plural:0 "Euskals"
 basque_religion_desc:0 "The ancient native Basque faith has long incorporated other, more transient religions. Elements of Celtic paganism, Christianity, Hellenic paganism, and a heavy substrata of their own local myths and beliefs all swirl together into a syncretic blend."
 ## "Old Ways"
 basque_pagan:0 "Era Zaharrak"
 basque_pagan_desc:0 "The ancient native Basque faith has long incorporated other, more transient religions. Elements of Celtic paganism, Christianity, Hellenic paganism, and a heavy substrata of their own local myths and beliefs all swirl together into a syncretic blend."
 ## "Old Way"
 basque_pagan_adj:0 "Era Zaharra"
 ## "Believer"
 basque_pagan_adherent:0 "Fededuna"
 ## "Believers"
 basque_pagan_adherent_plural:0 "Fededunak"

 basque_pagan_old:0 "Old $basque_pagan$"
 basque_pagan_old_adj:0 "Old $basque_pagan_adj$"
 basque_pagan_old_adherent:0 "Old $basque_pagan_adherent$"
 basque_pagan_old_adherent_plural:0 "Old $basque_pagan_adherent_plural$"

 basque_high_god_name:0 "Mari"
 ## The euphemistic nickname "Red Skirt", with red being a color frequently ascribed to magical creatures and items in certain versions of Basque mythology.
 basque_high_god_name_2:0 "Ionagorri"
 basque_high_god_name_possessive:0 "Mari's"
 basque_high_god_name_alternate:0 "$basque_high_god_name$"
 basque_high_god_name_alternate_possessive:0 "$basque_high_god_name_possessive$"
 ## We don't have a good line on a more pagan creator deity, so we use Aymeric Picaud's term for God filtered through a more likely Basque spelling.
 basque_creator_god_name:0 "Ortzia"
 basque_creator_god_name_possessive:0 "Ortzia's"
 ## *Definitely* more of a focus later on, with the founding of a hospital in his name, but our best fit.
 basque_health_god_name:0 "St. Blaise"
 basque_health_god_name_possessive:0 "St. Blaise's"
 ## We don't have a solid fertility god, but the Basajaunes wild men had aspects of the harvest, so we slot them in as our best-fit.
 basque_fertility_god_name:0 "the Basajaunes"
 basque_fertility_god_name_possessive:0 "the Basajaunes'"
 ## No solid wealth god, and Mari isn't a great fit, so we pull back in God.
 basque_wealth_god_name:0 "$basque_creator_god_name$"
 basque_wealth_god_name_possessive:0 "$basque_creator_god_name_possessive$"
 ## We don't have a good household god candidate, so we use St. Fermin, patron saint of Navarre, as someone who might be a common candidate to swear by or to.
 basque_household_god_name:0 "St. Ferminus"
 basque_household_god_name_possessive:0 "St. Ferminus'"
 ## Sugaar (Mari's most-ascribed consort) doesn't have a great fit anywhere else, mostly due to a paucity of information, so we give him Fate for his role as the father of Jaun Zuria, mythical first Lord of Bizkaia.
 ### You could pretty easily sub him in instead of Michael if you want to decrease the amount of Christian saints mixed into the list, but it seems likely Michael was a bigger figure overall.
 basque_fate_god_name:0 "Sugaar"
 basque_fate_god_name_possessive:0 "Sugaar's"
 ## Little St. Martin gets to pull double-duty here, though arguably he's just doing what trickster gods do.
 basque_knowledge_god_name:0 "$basque_trickster_god_name$"
 basque_knowledge_god_name_possessive:0 "$basque_trickster_god_name_possessive$"
 basque_war_god_name:0 "St. Mikael"
 basque_war_god_name_possessive:0 "St. Mikael's"
 ## For stealing knowledge of farming from the Basajaunes.
 basque_trickster_god_name:0 "Little St. Martin"
 basque_trickster_god_name_possessive:0 "Little St. Martin's"
 ## Gaueko, the embodiment of the night itself. Occasionally appears as a cow or a bull.
 basque_night_god_name:0 "Gaueko"
 basque_night_god_name_possessive:0 "Gaueko's"
 ## No suitable water god of note, unless you want to but the Lamia were a popular water monster in Basque mythology.
 basque_water_god_name:0 "the Lamiak"
 basque_water_god_name_possessive:0 "the Lamiak's"
 ## Mari's daughter, Illargia, who led the dead to the underworld. Probably.
 basque_death_god_name:0 "Ilargui"
 basque_death_god_name_possessive:0 "Ilargui's"
 ## This is a tough one, but we give it to Mari again due to her association with sorceresses (though this is potentially more of an Early Modern thing) and to show the default increased acceptance of non-clerical magic.
 basque_witch_god_name:0 "$basque_high_god_name$"
 basque_witch_god_name_possessive:0 "$basque_high_god_name_possessive$"
 ## Some assorted minor gods/positive divine creatures:
 ### Tubal, son of Japheth, son of Noah, who due to a clerical error has gotten mixed up in the origin story for the wrong Iberia.
 basque_good_god_japheth:0 "Japheth"
 ### Aatxe, a shapeshifting bull/human who fights crime in the name of Mari.
 basque_good_god_aatxe:0 "Aatxe"
 ### And some popular saints who didn't get their own spheres; respectively St. Nicholas, St. John, & St. Agatha.
 basque_good_god_st_nicholas:0 "St. Nikolas"
 basque_good_god_st_john:0 "St. Ganix"
 basque_good_god_st_agatha:0 "St. Agatha"
 ## The old Basque word for the Devil himself, as his syncretized incarnation seems to be the best wide-spread evil spirit. The modern equivalent would be Deabrua.
 basque_devil_name:0 "Tusuri"
 basque_devil_name_possessive:0 "Tusuri's"
 ## Some assorted nicknames/negative divine creatures:
 ### These are all various regional euphemisms for the Devil.
 basque_evil_god_mamu:0 "Mamu"
 basque_evil_god_mekolats:0 "Mekolats"
 basque_evil_god_beste_mutilla:0 "Beste Mutilla"
 basque_evil_god_galtxagorri:0 "Galtxagorri"
 basque_evil_god_prakagorri:0 "Prakagorri"
 basque_evil_god_adar:0 "Adar"
 ### Tartalo, a colossal & poisonous cyclops.
 basque_evil_god_tartalo:0 "Tartalo"
 ### Herensugue, an infamous dragon.
 basque_evil_god_herensugue:0 "Herensugue"
 basque_evil_god_lehen:0 "Lehen"
 ## The Black Hunter is a myth or monster rather than a god, but *might* be a remnant of something older. Makes a decent entity to swear by, at least.
 basque_evil_god_black_hunter:0 "Eiztari Beltza"
 ## Our cast of divinities is pretty varied, including gods, saints, God, and assorted monsters of varying ethical alignments. Accordingly, we use one set referencing the gods, one for the saints, and one that's neutral on the lot.
 religion_the_powers:0 "the powers"
 religion_the_saints:0 "the saints"
 ## For houses of worship, we re-use churches due to long association, but not exclusively.
 basque_house_of_worship:0 "church"
 basque_house_of_worship_2:0 "temple"
 ## Shrine isn't an attested term, but it's suitable for both Christianity & most pagans, so it works here.
 basque_house_of_worship_3:0 "shrine"
 # Honorable mention goes to the Gernikako Arbola, which is more representative but also more of a cultural icon rather than a religious one.
 basque_religious_symbol:0 "eguzkilore"
 basque_religious_symbol_2:0 "$basque_religious_symbol$"
 basque_religious_symbol_3:0 "$basque_religious_symbol$"
 basque_religious_text:0 "sacred stories"
 basque_religious_text_2:0 "ancient legends"
 basque_religious_text_3:0 "old myths"
 # No basis for this; it was never even a remote possibility, so we go with something fun & cool.
 basque_religious_head_title:0 "Arch-Sorgina"
 basque_religious_head_title_name:0 "Church"
 # We don't have good sources on monastic names, so we default to syncretic Christian terms.
 ## Honorable mention to serorak who are super interesting but neither cloistered nor (verifiably) in our period.
 basque_devotee_male:0 "monk"
 basque_devotee_male_plural:0 "monks"
 basque_devotee_female:0 "nun"
 basque_devotee_female_plural:0 "nuns"
 basque_devotee_neuter:0 "monastic"
 basque_devotee_neuter_plural:0 "monastics"
 # Most commonly, sorginak are gendered female, but there are limited variations where they include male numbers, so we just go with it.
 basque_priest:0 "sorgina"
 council_basque_priest:0 "Sorgina"
 basque_priest_plural:0 "sorginak"
 # The places the stars go in the day; we use both the Basque loc and the English loc for a bit of variety.
 basque_divine_realm:0 "Itsasgorrieta"
 basque_divine_realm_2:0 "the Reddish Seas"
 # Mari hangs out in quite a broad variety of caves, changing the weather depending on where she moves to.
 basque_divine_realm_3:0 "the Caves of $basque_high_god_name$"
 # There aren't any solid positive afterlife names, and the Christian heaven stuff isn't on-brand for a chthonic religion, so we use neutral/cthonian-sounding names.
 basque_positive_afterlife:0 "the Underworld"
 basque_positive_afterlife_2:0 "the Afterlife"
 basque_positive_afterlife_3:0 "the Hereafter"
 # We don't have good afterlife source names, so we run with the Christian versions.
 basque_negative_afterlife:0 "hell"
