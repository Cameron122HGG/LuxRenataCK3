 biliku_religion: "Nakkavaram" # Old Tamil name for the Andamans
 biliku_religion_adj: "Nakkavaram"
 biliku_religion_adherent: "Nakkavara"
 biliku_religion_adherent_plural: "Nakkavaras"
 biliku_religion_desc: "This is the belief in a pantheon of Gods who hold a complex relationship with humanity. Many Nakkavara stories involve great ancestors engaging in combat with the chief deities of their faith. Some people personify the chief deity as a female spider Goddess, while others as a male lizard God. In all versions of the stories, the creator cast a firebrand at the great ancestor who stole fire and then disappeared from the material world, weary of humanity. The creator left behind their sons who took the form of wind to bring both reward and punishment to humans."

