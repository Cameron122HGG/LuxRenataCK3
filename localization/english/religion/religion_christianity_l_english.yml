 unctionist_rite: "Unctionism"
 unctionist_rite_adj: "Unctionist"
 unctionist_rite_adherent: "Unctionist"
 unctionist_rite_adherent_plural: "Unctionists"
 unctionist_rite_desc: "Unctionism is a Local Christian religion of Statist Soul. The Merovingian kings of Francia elevated the sanctity of kingship to the point where the king and a council of the bishops of the realm supplant the role of the Pope. This royal supremacy is symbolized during coronation. Like with the kings of the Old Testament, the coronation ceremony is the covenant between God and the Capetian sovereign: in exchange for divine unction by holy oil, the king promises to reign with justice, to protect his people, and to uphold the faith. This alliance took tangible form with the Sainte Ampoule, or Holy Flask. The Sainte Ampoule was brought to Saint Remi by a dove sent by God for the baptism of Clovis I, the first Frankish king to convert to Christianity. It gets miraculously refilled by God every time for each coronation of a true king, demonstrating the direct relation between God and the Frankish royal line."
 unctionist_rite_religious_head_title: "Archbishop"
 unctionist_rite_religious_head_title_name: "Archbishopric"

 donatist_rite: "Donatism"
 donatist_rite_adj: "Donatist"
 donatist_rite_adherent: "Donatist"
 donatist_rite_adherent_plural: "Donatists"
 donatist_rite_desc: "Donatism is a Heretical Christian creed of Traditional Soul, with a strong Berber ascendant. Donatus Magnus was a bishop in Carthage in the early 4th Century. He challenged the authority of the clergy appointed by the official Catholic hierarchy, on the ground that these clerics had surrendered their faith during times of persecution. After his death in exile around 355 CE, the parallel clergy put in place by Donatists increased its influence among Berber rural populations refusing the rule of Rome and of the official Catholic Church. The Circumcellions were bands of nomadic anti-Roman rebels and Punic-speaking bandits from the lower strata of society who supported Donatism and were sometimes led by Donatist clergy. Over the centuries, Donatism has flourished and evolved as a syncretic religion with nationalist elements, incorporating traditional Amazigh elements into Christianity and violently opposing the strict clerical and social hierarchy of the more-established Christian denominations."

 montanist_rite: "Montanism"
 montanist_rite_adj: "Montanist"
 montanist_rite_adherent: "Montanist"
 montanist_rite_adherent_plural: "Montanists"
 montanist_rite_desc: "Montanism is a Heretical Christian sect of Clerical Soul, with a significant Graeco-Roman ascendant. Its founder Montanus, a mystic from Phrygia, launched a movement called 'The New Prophecy' in the 2nd Century CE. This 'New Prophecy' spread rapidly to other regions in the Roman Empire at a time when Christianity was not yet recognized or tolerated in the Western Empire. Montanus was a recent convert when he first began receiving revelation. He believed he was a prophet of God and asserted that New Jerusalem would appear in Phrygia. He insisted the Holy Trinity had precedence over Jesus, who he claimed was a mere initiator of his own prophecies. During his divinations, Montanus emulated the oracles of the Graeco-Roman world and spoke in the first person as God, claiming direct divine inspiration. Montanism remains a movement focused around prophecy, specifically the prophecies of the ininterrupted lines of 'New Prophets', chosen at each generation by the Wise Amongst The Wise. These prophecies, formulated from the Montanist Oracle in Phrygia, are believed to contain the Holy Spirit's revelation for the present age."

 sabellianist_rite: "Sabellianism"
 sabellianist_rite_adj: "Sabellianist"
 sabellianist_rite_adherent: "Sabellianist"
 sabellianist_rite_adherent_plural: "Sabellianists"
 sabellianist_rite_desc: "Sabellianism is a Local Christian sect of Scholarly Soul. Sabellius of Pentapolis was a North African theologian who flourished in the early 3rd Century CE and gained his initial following in Roman Italy. A deviant from the orthodoxy of the church fathers, Sabellius preached a unitarian interpretation of the godhead wherein God was a singular, indivisible entity, and that the forms of Jesus and the Holy Spirit were but outward manifestations of God as he chose to appear before mankind."

 #semipelagian_rite: "Semipelagianism"
 #semipelagian_rite_adj: "Semipelagian"
 #semipelagian_rite_adherent: "Semipelagian"
 #semipelagian_rite_adherent_plural: "Semipelagians"
 #semipelagian_rite_desc: "Semipelagianism is a Local Christian creed of Clerical Soul. It was developed as a compromise between Pelagianism and the teachings of the Church during the 5th century CE, and formalised at the Council of Arausicae in 529 CE, when bishops from the realms of the Goths, Burgundians, and Romans met to attempt to address the many deviationist rites observed in Gaul. Meddling by the Emperor Valentinian VIII, who was feuding with the Pope over support for the oppressive Vandal Arians against the Eastern Empire, eventually led to many Roman bishops boycotting or being prevented from traveling to the Council, resulting in a decisive victory for the Semipelagian Compromise. The Pope would go on to denounce the Council as invalid, resulting in a permanent split between the Bishop of Rome and what would become known as the Semipelagian Patriarchate.\n\n Pelagianism opposes mainstream Catholicism by stating that mankind is capable of choosing right and wrong without need of divine aid, while Catholicism teaches that man cannot come to God without the grace of God. The Semipelagian position states that the beginning of faith is free will, but the growth of faith is God's work. This is contrary to the common Catholic belief at the time that the beginning of faith requires an initiative from God, but the rest is free will. Thus, according to Catholicism, no one can merit the initial grace of forgiveness associated with conversion, as Semipelagians attempt to convey. In practice, Semipelagian communities have their own well-structured clergy and their rites have evolved in a distinct way, although they are not as radical as Pelagians in opposing mainstream Catholicism."
 #semipelagian_rite_head_title: "Patriarch"
 #semipelagian_rite_religious_head_title_name: "Patriarchate"

 pelagian_rite: "Pelagianism"
 pelagian_rite_adj: "Pelagian"
 pelagian_rite_adherent: "Pelagian"
 pelagian_rite_adherent_plural: "Pelagians"
 pelagian_rite_desc: "Pelagianism is a Heretical Christian religion of Clerical Soul. Originating from the theology of the monk Pelagius in 380 CE, Pelagians hold that Adam never incurred any 'original sin', only that he set a bad example for humanity. Consequently, humanity is not doomed to sin, but instead chooses to sin of its own free will. Therefore, the 'original sin' did not taint humanity and mankind is capable of choosing right and wrong without need of divine aid. This belief directly opposes that of the Catholic Church, which claims that man is inherently evil and that man cannot come to God without the grace of God, symbolized by the Baptism. The Pelagian believers have their own well-structured clergy and are deeply convinced of the heretical nature of mainstream Catholicism.\n\nThe Roman Church made many attempts to wipe out the Pelagians in the 5th and 6th centuries, but saw success only on the mainland; in the British Isles the Pelagian Church survived under Artorian protection. A concerted Papal attempt to stir up a purge of Pelagian clergy in Britannia backfired when the Bishop Germanus of Auxerre was martyred by a javelin while trying to charge a Saxon-Pictish landing party near Deva Victrix, carrying only a cross. The Pelagian clergy saw this as divine endorsement of the faith, and subsequently began intensive proselytising among both the Britons and the Germanic invaders from the east. In recent centuries their traditional rivalry with the Hibernicists for the souls of Britannia's Christians has however been challenged by both the devastating Viking invasions and Roman Catholic proselytism among Jutes and Saxons, centered in Canterbury. With the last true bastion of Pelagianism under threat in Britannia, many High Vicars increasingly lean towards rhetoric of holy war, a March of Good Example against the Roman heretics."
 pelagian_rite_religious_head_title: "High Vicar"
