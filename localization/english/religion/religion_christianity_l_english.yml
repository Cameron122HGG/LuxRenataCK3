 solomonic_christ_rite: "Solomonic Christianity"
 solomonic_christ_rite_adj: "Solomonic Christian"
 solomonic_christ_rite_adherent: "Solomonic Christian"
 solomonic_christ_rite_adherent_plural: "Solomonic Christians"
 solomonic_christ_rite_desc: "Solomonic Christianity is a Local Christian sect of Statist Soul, with significant Archaic influences. The Ethiopian Church, although Christian, evolved under the prophetic rule of the Solomonid dynasty. It retains a stronger emphasis on the Old Testament and even integrates some elements from the Arabo-Sabaean religions, where ancient gods are merged with Biblical Prophets. Solomon is specially commemorated as a prophet almost the equal of the Christ, with the title of 'Righteous Prophet and King'. King Solomon seduced the Queen of Saba, herself descendant of Almaqah, the Sabaean sun god, and sired her son, Menelik I. He became the first Emperor of Ethiopia and brought the Ark of the Covenant, with divine assistance, to Ethiopia. The Solomonid dynasty, claiming descent from Solomon and the Queen of Sheba through Menelik I, thus perpetuates the rule of the House of David. Solomonic Christians believe the Solomonid dynasty and their state to be of divine nature, and see themselves as God's chosen people - the only legitimate perpetrators of the Alliance of the Old Testament."
