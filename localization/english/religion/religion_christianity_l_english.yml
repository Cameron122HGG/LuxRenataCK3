 #LR

 adoptionist_faith: "Adoptionism"
 adoptionist_faith_adj: "Adoptionist"
 adoptionist_faith_adherent: "Adoptionists"
 adoptionist_faith_adherent_plural: "Adoptionists"
 adoptionist_faith_desc: "Adoptionism is a Local Christian sect of Clerical Soul, the remains of a once popular vision of Jesus Christ among newly-converted Jews in the Levant in the first century after the Incarnation of Christ. They believed that Jesus was the promised Messiah as foretold: a Prophet descendant of the Kings of Israel, nothing more, nothing less. Therefore, they rejected the divinity of Christ and his immaculate birth of the Virgin Mary, and considered such traditions as later additions and severe deviations from the Truth, very close to infraction of the First Commandment. This blend of Jewish orthodoxy and primordial Christianity was channeled through the Ebionites, the 'Poor Ones', who declared Paul of Tarsus an apostate. In time, Theodotus of Byzantium proclaimed in the 2nd Century that Jesus of Nazareth was a man entirely until God, because of his sinlessness and immaculate spirit, adopted him in order to make him Christ. This easy solution to the problem of monotheism in a religion with two main divinities that are meant to be one and the same kept re-emerging despite repeated condemnation by the Ecumenical Councils. It sprang with renewed force in Hispania in the 7th Century, when the Archbishop Elipandus of Toledo and Bishop Felix of Urgell propagated the view that the phrase 'Son of God' was metaphorical, and that Christ was 'adopted' by God after his baptism. At that moment, the human will of Christ became subservient to his new divine will. This Christology was first adopted by the Kingdom of Carpetania after the great nobles assassinated their King Leovigild, who attempted to convert them to Catholicism. In the Great Council of Toledo in 595, in the midst of anarchy, Hispania's nobles found a compromise solution between their various spiritual claims and to avoid entering in either Rome or Carthage's spheres of influence. They elected Leovigild's younger son Reccared, an Adoptionist, with the Arian Faith Euricing King of Leon famously proclaiming, 'So called Catholic kings have no place in Hispania.' Adoptionism represented the least threatening of all faiths for the nobles' autonomy. Archbishop Elipandus of Toledo further codified Adoptionism by teaching that Christ's human nature existed separately from His divine personhood. The condemnation of this doctrine in the Council of Ratisbon in 792 only served to strengthen its hold on the Celtiberian highlands, where nobles jealously guard their autonomy from the distant Pope and Emperors."
 adoptionist_faith_religious_head_title: "Archbishop"
 adoptionist_faith_religious_head_title_name: "Archbishopric"

 antinomian_faith: "Antinomianism"
 antinomian_faith_adj: "Antinomian"
 antinomian_faith_adherent: "Antinomian"
 antinomian_faith_adherent_plural: "Antinomians"
 antinomian_faith_desc: "Antinomianism is a Heretical Christian sect of Populist Soul, with a strong Barbarian ascendant. It emerged in the 1st Century as a result of theological criticisms over the strict morale rules contained in the Old Covenant. According to some, moral law was of no use or obligation under the gospel dispensation of grace because faith alone was necessary to salvation. Under this theological guidance, some early Christian communities in Jerusalem are said to have practiced anarchist communism, sharing money, labor and women equally and fairly among the members, refusing any set of rules that they considered arbitrary. These early experiments, remembered by marginalized priests exiled to the fringes of Christianity, spurred a renewal among superficially-Christianized Goths when imperial authority weakened. In the ensuing chaos, new ambitious leaders looking for a mobilizing ideology met the radical preachers of the Antinomian revolution. The new Antinomian rulers claimed that Jesus' love, which is limitless, would wash away the sinful laws and hierarchies set up by the former Roman elite. Antinomianism is now a political and economic program as much as a religion, whereby believers combine Gothic tribal rituals with a new emphasis on moral nihilism, sexual freedom, and absolute collectivism."

 apollinarist_faith: "Apollinarism"
 apollinarist_faith_adj: "Apollinarists"
 apollinarist_faith_adherent: "Apollinarist"
 apollinarist_faith_adherent_plural: "Apollinarists"
 apollinarist_faith_desc: "Apollinarism is a Local Christian creed of Clerical Soul. Apollinarists follow the teachings of Apollinaris of Laodicea, a bishop in Syria during the 4th Century. Apollinaris theorized that Jesus could not have had a human mind, but rather he had a human body and a divine mind. This went against the traditional view that Jesus had both a human body and a human mind as culminated by his presence as the Son of God made flesh. Since by Church decree Christ was both fully human and fully God, Apollinaris and his followers were accused of attempting to create a 'tertium quid', a 'third thing' neither God nor man. Apollinarism was declared to be a heresy in 381 CE by the First Council of Constantinople. Despite the negative publicity and accusations of heresy, Apollinarius was a prolific writer and a charismatic missionary, and some clerics still differentiate themselves from the mainstream Christian theology by following his teachings."

 arian_faith: "Arianism"
 arian_faith_adj: "Arian"
 arian_faith_adherent: "Arians"
 arian_faith_adherent_plural: "Arians"
 arian_faith_desc: "Arianism is a Mainstream Christian denomination of Statist Soul, with a strong Barbarian ascendant. A Christian church founded by Presbyter Arius, emphasizing the belief that Christ did not always exist, but was created by God, and is therefore separate from him. There is a strong belief in the disunity of the Trinity, and the supremacy of God the Father over Jesus and the Holy Spirit. Arian rulers use the rhetoric of Arius, specifically the supremacy of God over the other aspects of the Trinity to exercise a higher degree of control in the affairs of the church. It became very popular among the Vandals, Goths, and other barbarian converts, who scorned the Catholic Church and its ties to the Western Empire."
 arian_faith_religious_head_title: "Presbyter"
 arian_faith_religious_head_title_name: "Presbytery"

 audianist_faith: "Audianism"
 audianist_faith_adj: "Audianist"
 audianist_faith_adherent: "Audianist"
 audianist_faith_adherent_plural: "Audianists"
 audianist_faith_desc: "Audianism is a Local Christian creed of Traditional Soul with significant Jewish influences. Audaeus was a theologian living in 4th Century Syria. In 325 CE at the First Council of Nicaea, he led the opposition to the official Church when it was decreed that all Christians should follow the Roman tradition of celebrating Pascha (Easter) at the Easter Sunday, and no longer at the date of 14 Nisan, like the Jewish Passover. The Audians complained that the church had 'abandoned the fathers' Paschal rite in Constantine's time from deference to the emperor, and changed the day to suit the emperor.' Audianist communities remained the target of sporadic persecutions until Imperial authorities proposed to re-locate them north of the Black Sea, where they would enjoy tolerance of their cult and serve as a vanguard of Roman interests. Since then, Audianists cling to their unique tradition, composed of outdated Christian rituals and nostalgia for the Syrian homeland they left centuries ago."

 docetist_faith: "Docetism"
 docetist_faith_adj: "Docetist"
 docetist_faith_adherent: "Docetist"
 docetist_faith_adherent_plural: "Docetists"  
 docetist_faith_desc: "Docetism is a Local Christian faith of Scholarly Soul, with Jewish influences. It derives from an unorthodox interpretation concerning the meaning, figurative or literal, of a sentence from the Gospel of John: 'the Word was made Flesh', under the influence of heterodox Judaism and ancient Oriental and Greek philosophies. Docestists believe that the phenomenon of Christ, his historical and bodily existence, and thus above all the human form of Jesus, was altogether mere semblance without any true reality. Jesus only appeared to be human, while in actuality he was a phantasmal projection from Heaven. While Docetism was unequivocally rejected at the First Council of Nicaea in 325 CE, it remained alive among the learned of Eastern Anatolia, eventually becoming a popular creed among Armenian communities and rulers. Docetists emphasize skeptical interpretation of the mainstream Christian theology and seeking hidden truths concealed behind appearances."

 fraticelli_faith: "Fraticelli"
 fraticelli_faith_adj: "Fraticelli"
 fraticelli_faith_adherent: "Fraticello"
 fraticelli_faith_adherent_plural: "Fraticelli"
 fraticelli_faith_desc: "The Fraticelli ('Little Brethren') are a Christian Heretical sect of Populist Soul, with a strong Barbarian ascendant. It emerged as a result of theological criticisms over the strict morale rules contained in the Old Covenant. According to some, moral law was of no use or obligation under the gospel dispensation of grace because faith alone was necessary to salvation. Under this theological guidance, some early Christian communities in Jerusalem are said to have practiced anarchist communism, sharing money, labor"

 marcionist_faith: "Marcionism"
 marcionist_faith_adj: "Marcionist"
 marcionist_faith_adherent: "Marcionist"
 marcionist_faith_adherent_plural: "Marcionists"
 marcionist_faith_desc: "Marcionism is a Local Christian creed of Scholarly Soul, characterized by strong Gnostic influences. Marcion of Sinope was a bishop who lived in Pontus during the times of early Christianity. Influenced by the dualistic theology common to the Roman East, he believed and taught that the wrathful Hebrew god Yahweh was a separate and lower entity than the all-forgiving God of the New Testament. For Marcionists, Christ was not the Jewish Messiah but a spiritual entity that was sent by God to reveal the truth about existence, and thus allowing humanity to escape the earthly trap of the Demiurge. In spite of strong doctrinal opposition from the official Church, Marcionism remained predominant in the relatively isolated Pontus area, where it developed in isolation from other Christian currents. A particular feature of that creed is the development of a thorough alternative canon of scriptures, compiled even before the Catholic canonical Gospel. Believers emphasize the analysis of the Marcionist canon, composed of eleven books, which provide keys for analyzing this world in a moral, almost Platonic perspective."

 mari_christ_faith: "Euskalist"
 mari_christ_faith_adj: "Euskalist"
 mari_christ_faith_plural: "Euskalists"
 mari_christ_faith_adherent: "Euskalist"
 mari_christ_faith_adherent_plural: "Euskalists"
 mari_christ_faith_desc: "Euskalism is a Local Christian movement of Traditional Soul with a Barbarian ascendant. Euskalism is a hybrid religion focusing on the belief that the Virgin Mary was the incarnation of Mari, the goddess of the Euskal people. The movement developed in Euskalia as a local synthesis between Arianism and more ancient local beliefs. Believers follow many Christian beliefs and practices but put a heavy emphasis on the veneration of Mari, who is also equated with the Virgin Mary. Each village or community follows the spiritual directions of a virgin crone, often a kind of village elder, whose religious influence supercedes that of the standard Christian clergy. Traditionally, it is only the virgin crones who have the authority to select and give sacraments to Euskalist priests."
 
 mari_christ_faith_old: "Old Euskalist"
 mari_christ_faith_old_adj: "Old Euskalist"
 mari_christ_faith_old_plural: "Old Euskalists"
 mari_christ_faith_old_adherent: "Old Euskalist"
 mari_christ_faith_old_adherent_plural: "Old Euskalists"

 melkite_faith: "Melkite"
 melkite_faith_adj: "Melkite"
 melkite_faith_adherent: "Melkite"
 melkite_faith_adherent_plural: "Melkites"
 melkite_faith_desc: "The Melkite Church is a Heretical Christian creed of Clerical Soul. Melkites view themselves as the first Christian community, dating the Melkite movement back to the time of the Apostles. During the bitter debates occurring at the Council of Chalcedon in 451 CE, the official Church imposed its vision of a dual nature of the Christ. This declaration sparked tensions among Syriac Christians. The anti-Chalcedonians (mostly rural Syriac speakers) accused the Chalcedonians (mostly Hellenized urban dwellers) of following the Pope, or 'king' (in Syriac, 'malka'), and thus called them 'Melkites'. In the 8th century, when Leo III and his successor Leo Constantine organized violent persecutions against Christians, the Melkites negotiated relative respite for their communities by supporting the emperor's agents. The Pope had no choice but to excommunicate them, and the Melkite clergy in turn declared the church in Rome heretical while delivering those loyal to the Pope to the Empire's persecution. This treason to their brothers in faith isolated the Melkite community, but allowed it to survive up to today in the midst of a hostile environment."

 monophysite_faith: "Monophysitism"
 monophysite_faith_adj: "Monophysite"
 monophysite_faith_adherent: "Monophysite"
 monophysite_faith_adherent_plural: "Monophysites"
 monophysite_faith_desc: "Monophysitism is a Local Christian creed of Scholarly Soul. It derives from an unorthodox interpretation concerning the meaning, figurative or literal, of a sentence from the Gospel of John. Monophysites believe that Christ's human nature was absorbed into his divine nature, and thus he was only one nature, rather than two natures in one person."

 eutychianist_faith: "Eutychianism"
 eutychianist_faith_adj: "Eutychian"
 eutychianist_faith_adherent: "Eutychian"
 eutychianist_faith_adherent_plural: "Eutychians"
 eutychianist_faith_desc: "Eutychianism is a Local Christian creed of Scholarly Soul. It derives from an unorthodox interpretation concerning the meaning, figurative or literal, of a sentence from the Gospel of John. Eutychianists believe that Christ had two natures, but only one will, and thus he was only one will, rather than two wills in one person."

 nasrani_faith: "Nasrani"
 nasrani_faith_adj: "Nasrani"
 nasrani_faith_adherent: "Nasrani"
 nasrani_faith_adherent_plural: "Nasranis"
 nasrani_faith_desc: "Nasrani Mappila is a Local Christian creed of Traditional Soul, with significant Indian Influences. It has it's origins in the evangelisation of Saint Thomas the Apostle with later missionary work and settlers from the Syriac Church of the East in India: The Nasrani mix Christanity with aspects of the Brahmin class: Such as the wearing of sacred thread, but retain many trappings of their ancient Syriac church. "

 albionian_faith: "Albionian Christianity"
 albionian_faith_adj: "Albionian"
 albionian_faith_adherent: "Albionian"
 albionian_faith_adherent_plural: "Albionians"
 albionian_faith_desc: "Albionian Christianity is a form of Christianity centered on Britain and Northern Europe, characterized by its unique blend of local traditions and orthodox Christian beliefs."
 albionian_faith_head_title: "Patriarch"
 albionian_faith_religious_head_title_name: "Patriarchate"

 slavic_christian_faith: "Cyrillianism"
 slavic_christian_faith_adj: "Cyrillianist"
 slavic_christian_faith_adherent: "Cyrillian"
 slavic_christian_faith_adherent_plural: "Cyrillians"
 slavic_christian_faith_desc: "Cyrillianism is a Local Christian creed of Clerical Soul, with strong Barbarian influences. Increasing influence of the Solar religions among Slavic peoples motivated the Catholic Church to pay due attention to this group of people emerging as the power broker of the distant eastern lands. The Pope sent twelve clerical envoys with a strong escort and lavish gifts to make their way to the eastern edge of the world for the sake of meeting, impressing, and converting the king of the Slavs. For three years, no news came to Rome from the Papal embassy. Eventually, an Audianist merchant from Caffa brought one of the chests back with the heads of ten of the envoys. No more was heard from the Slavs for twenty-nine years, until a delegation came bringing word from Archishop Cyrill of the Holy Church of the Slavs. How the last of the twelve envoys could succeed is not clear, but an autocephalous Christian church for the Slavs emerged. It first organized itself underground, without support from any ruler or the rest of Christendom. As a result, the Slavic clerics have started creating am organized clergy of their own, somwhow replicating the early Christian days when the Church had to hide from the Roman state."
 slavic_christian_faith_religious_head_title: "Archbishop"
 slavic_christian_faith_religious_head_title_name: "Church"

 solomonic_christ_faith: "Solomonic Christianity"
 solomonic_christ_faith_adj: "Solomonic Christian"
 solomonic_christ_faith_adherent: "Solomonic Christian"
 solomonic_christ_faith_adherent_plural: "Solomonic Christians"
 solomonic_christ_faith_desc: "Solomonic Christianity is a Local Christian sect of Statist Soul, with significant Archaic influences. The Ethiopian Church, although Christian, evolved under the prophetic rule of the Solomonid dynasty. It retains a stronger emphasis on the Old Testament and even integrates some elements from the Arabo-Sabaean religions, where ancient gods are merged with Biblical Prophets. Solomon is specially commemorated as a prophet almost the equal of the Christ, with the title of 'Righteous Prophet and King'. King Solomon seduced the Queen of Saba, herself descendant of Almaqah, the Sabaean sun god, and sired her son, Menelik I. He became the first Emperor of Ethiopia and brought the Ark of the Covenant, with divine assistance, to Ethiopia. The Solomonid dynasty, claiming descent from Solomon and the Queen of Sheba through Menelik I, thus perpetuates the rule of the House of David. Solomonic Christians believe the Solomonid dynasty and their state to be of divine nature, and see themselves as God's chosen people - the only legitimate perpetrators of the Alliance of the Old Testament."
 solomonic_christ_faith_religious_head_title: "Abuna"
 solomonic_christ_faith_religious_head_title_name: "Church"

 gallic_faith: "Gallic Christianity"
 gallic_faith_adj: "Gallic"
 gallic_faith_adherent: "Gallic Christian"
 gallic_faith_adherent_plural: "Gallic Christians"
 gallic_faith_desc: "Gallic Christianity is a Local Christian Church of Statist Soul, with significant Gallic influences. The Gallic Church, although Christian, evolved under the strong influence of the Gallic nobility and their traditional customs. It retains a unique blend of Christian doctrine and Gallic cultural practices, emphasizing the role of the state in religious matters and the sanctity of the Gallic royal line."
 gallic_faith_religious_head_title: "Archbishop"
 gallic_faith_religious_head_title_name: "Archbishopric"

 donatist_faith: "Donatism"
 donatist_faith_adj: "Donatist"
 donatist_faith_adherent: "Donatist"
 donatist_faith_adherent_plural: "Donatists"
 donatist_faith_desc: "Donatism is a Heretical Christian creed of Traditional Soul, with a strong Berber ascendant. Donatus Magnus was a bishop in Carthage in the early 4th Century. He challenged the authority of the clergy appointed by the official Catholic hierarchy, on the ground that these clerics had surrendered their faith during times of persecution. After his death in exile around 355 CE, the parallel clergy put in place by Donatists increased its influence among Berber rural populations refusing the rule of Rome and of the official Catholic Church. The Circumcellions were bands of nomadic anti-Roman rebels and Punic-speaking bandits from the lower strata of society who supported Donatism and were sometimes led by Donatist clergy. Over the centuries, Donatism has flourished and evolved as a syncretic religion with nationalist elements, incorporating traditional Amazigh elements into Christianity and violently opposing the strict clerical and social hierarchy of the more-established Christian denominations."

 montanist_faith: "Montanism"
 montanist_faith_adj: "Montanist"
 montanist_faith_adherent: "Montanist"
 montanist_faith_adherent_plural: "Montanists"
 montanist_faith_desc: "Montanism is a Heretical Christian sect of Clerical Soul, with a significant Graeco-Roman ascendant. Its founder Montanus, a mystic from Phrygia, launched a movement called 'The New Prophecy' in the 2nd Century CE. This 'New Prophecy' spread rapidly to other regions in the Roman Empire at a time when Christianity was not yet recognized or tolerated in the Western Empire. Montanus was a recent convert when he first began receiving revelation. He believed he was a prophet of God and asserted that New Jerusalem would appear in Phrygia. He insisted the Holy Trinity had precedence over Jesus, who he claimed was a mere initiator of his own prophecies. During his divinations, Montanus emulated the oracles of the Graeco-Roman world and spoke in the first person as God, claiming direct divine inspiration. Montanism remains a movement focused around prophecy, specifically the prophecies of the ininterrupted lines of 'New Prophets', chosen at each generation by the Wise Amongst The Wise. These prophecies, formulated from the Montanist Oracle in Phrygia, are believed to contain the Holy Spirit's revelation for the present age."

 sabellianist_faith: "Sabellianism"
 sabellianist_faith_adj: "Sabellianist"
 sabellianist_faith_adherent: "Sabellianist"
 sabellianist_faith_adherent_plural: "Sabellianists"
 sabellianist_faith_desc: "Sabellianism is a Local Christian sect of Scholarly Soul. Sabellius of Pentapolis was a North African theologian who flourished in the early 3rd Century CE and gained his initial following in Roman Italy. A deviant from the orthodoxy of the church fathers, Sabellius preached a unitarian interpretation of the godhead wherein God was a singular, indivisible entity, and that the forms of Jesus and the Holy Spirit were but outward manifestations of God as he chose to appear before mankind."


 adoptionist_rite: "Adoptionism"
 adoptionist_rite_adj: "Adoptionist"
 adoptionist_rite_adherent: "Adoptionists"
 adoptionist_rite_adherent_plural: "Adoptionists"
 adoptionist_rite_desc: "Adoptionism is a Local Christian sect of Clerical Soul, the remains of a once popular vision of Jesus Christ among newly-converted Jews in the Levant in the first century after the Incarnation of Christ. They believed that Jesus was the promised Messiah as foretold: a Prophet descendant of the Kings of Israel, nothing more, nothing less. Therefore, they rejected the divinity of Christ and his immaculate birth of the Virgin Mary, and considered such traditions as later additions and severe deviations from the Truth, very close to infraction of the First Commandment. This blend of Jewish orthodoxy and primordial Christianity was channeled through the Ebionites, the 'Poor Ones', who declared Paul of Tarsus an apostate. In time, Theodotus of Byzantium proclaimed in the 2nd Century that Jesus of Nazareth was a man entirely until God, because of his sinlessness and immaculate spirit, adopted him in order to make him Christ. This easy solution to the problem of monotheism in a religion with two main divinities that are meant to be one and the same kept re-emerging despite repeated condemnation by the Ecumenical Councils. It sprang with renewed force in Hispania in the 7th Century, when the Archbishop Elipandus of Toledo and Bishop Felix of Urgell propagated the view that the phrase 'Son of God' was metaphorical, and that Christ was 'adopted' by God after his baptism. At that moment, the human will of Christ became subservient to his new divine will. This Christology was first adopted by the Kingdom of Carpetania after the great nobles assassinated their King Leovigild, who attempted to convert them to Catholicism. In the Great Council of Toledo in 595, in the midst of anarchy, Hispania's nobles found a compromise solution between their various spiritual claims and to avoid entering in either Rome or Carthage's spheres of influence. They elected Leovigild's younger son Reccared, an Adoptionist, with the Arian Faith Euricing King of Leon famously proclaiming, 'So called Catholic kings have no place in Hispania.' Adoptionism represented the least threatening of all faiths for the nobles' autonomy. Archbishop Elipandus of Toledo further codified Adoptionism by teaching that Christ's human nature existed separately from His divine personhood. The condemnation of this doctrine in the Council of Ratisbon in 792 only served to strengthen its hold on the Celtiberian highlands, where nobles jealously guard their autonomy from the distant Pope and Emperors."
 adoptionist_rite_religious_head_title: "Archbishop"
 adoptionist_rite_religious_head_title_name: "Archbishopric"

 antinomian_rite: "Antinomianism"
 antinomian_rite_adj: "Antinomian"
 antinomian_rite_adherent: "Antinomian"
 antinomian_rite_adherent_plural: "Antinomians"
 antinomian_rite_desc: "Antinomianism is a Heretical Christian sect of Populist Soul, with a strong Barbarian ascendant. It emerged in the 1st Century as a result of theological criticisms over the strict morale rules contained in the Old Covenant. According to some, moral law was of no use or obligation under the gospel dispensation of grace because faith alone was necessary to salvation. Under this theological guidance, some early Christian communities in Jerusalem are said to have practiced anarchist communism, sharing money, labor and women equally and fairly among the members, refusing any set of rules that they considered arbitrary. These early experiments, remembered by marginalized priests exiled to the fringes of Christianity, spurred a renewal among superficially-Christianized Goths when imperial authority weakened. In the ensuing chaos, new ambitious leaders looking for a mobilizing ideology met the radical preachers of the Antinomian revolution. The new Antinomian rulers claimed that Jesus' love, which is limitless, would wash away the sinful laws and hierarchies set up by the former Roman elite. Antinomianism is now a political and economic program as much as a religion, whereby believers combine Gothic tribal rituals with a new emphasis on moral nihilism, sexual freedom, and absolute collectivism."

 apollinarist_rite: "Apollinarism"
 apollinarist_rite_adj: "Apollinarists"
 apollinarist_rite_adherent: "Apollinarist"
 apollinarist_rite_adherent_plural: "Apollinarists"
 apollinarist_rite_desc: "Apollinarism is a Local Christian creed of Clerical Soul. Apollinarists follow the teachings of Apollinaris of Laodicea, a bishop in Syria during the 4th Century. Apollinaris theorized that Jesus could not have had a human mind, but rather he had a human body and a divine mind. This went against the traditional view that Jesus had both a human body and a human mind as culminated by his presence as the Son of God made flesh. Since by Church decree Christ was both fully human and fully God, Apollinaris and his followers were accused of attempting to create a 'tertium quid', a 'third thing' neither God nor man. Apollinarism was declared to be a heresy in 381 CE by the First Council of Constantinople. Despite the negative publicity and accusations of heresy, Apollinarius was a prolific writer and a charismatic missionary, and some clerics still differentiate themselves from the mainstream Christian theology by following his teachings."


 arian_rite: "Arianism"
 arian_rite_adj: "Arian"
 arian_rite_adherent: "Arians"
 arian_rite_adherent_plural: "Arians"
 arian_rite_desc: "Arianism is a Mainstream Christian denomination of Statist Soul, with a strong Barbarian ascendant. A Christian church founded by Presbyter Arius, emphasizing the belief that Christ did not always exist, but was created by God, and is therefore separate from him. There is a strong belief in the disunity of the Trinity, and the supremacy of God the Father over Jesus and the Holy Spirit. Arian rulers use the rhetoric of Arius, specifically the supremacy of God over the other aspects of the Trinity to exercise a higher degree of control in the affairs of the church. It became very popular among the Vandals, Goths, and other barbarian converts, who scorned the Catholic Church and its ties to the Western Empire."
 arian_rite_head_title: "Presbyter"
 arian_rite_religious_head_title_name: "Presbytery"

 audianist_rite: "Audianism"
 audianist_rite_adj: "Audianist"
 audianist_rite_adherent: "Audianist"
 audianist_rite_adherent_plural: "Audianists"
 audianist_rite_desc: "Audianism is a Local Christian creed of Traditional Soul with significant Jewish influences. Audaeus was a theologian living in 4th Century Syria. In 325 CE at the First Council of Nicaea, he led the opposition to the official Church when it was decreed that all Christians should follow the Roman tradition of celebrating Pascha (Easter) at the Easter Sunday, and no longer at the date of 14 Nisan, like the Jewish Passover. The Audians complained that the church had 'abandoned the fathers' Paschal rite in Constantine's time from deference to the emperor, and changed the day to suit the emperor.' Audianist communities remained the target of sporadic persecutions until Imperial authorities proposed to re-locate them north of the Black Sea, where they would enjoy tolerance of their cult and serve as a vanguard of Roman interests. Since then, Audianists cling to their unique tradition, composed of outdated Christian rituals and nostalgia for the Syrian homeland they left centuries ago."

 docetist_rite: "Docetism"
 docetist_rite_adj: "Docetist"
 docetist_rite_adherent: "Docetist"
 docetist_rite_adherent_plural: "Docetists"  
 docetist_rite_desc: "Docetism is a Local Christian faith of Scholarly Soul, with Jewish influences. It derives from an unorthodox interpretation concerning the meaning, figurative or literal, of a sentence from the Gospel of John: 'the Word was made Flesh', under the influence of heterodox Judaism and ancient Oriental and Greek philosophies. Docestists believe that the phenomenon of Christ, his historical and bodily existence, and thus above all the human form of Jesus, was altogether mere semblance without any true reality. Jesus only appeared to be human, while in actuality he was a phantasmal projection from Heaven. While Docetism was unequivocally rejected at the First Council of Nicaea in 325 CE, it remained alive among the learned of Eastern Anatolia, eventually becoming a popular creed among Armenian communities and rulers. Docetists emphasize skeptical interpretation of the mainstream Christian theology and seeking hidden truths concealed behind appearances."

