 frankish_faith: "Frankish Christianity"
 frankish_faith_adj: "Frankish"
 frankish_faith_adherent: "Frankish"
 frankish_faith_adherent_plural: "Frankish Christians"
 frankish_faith_desc: "A form of Christianity that developed under the Frankish realms, characterized by its emphasis on monasticism and missionary work."