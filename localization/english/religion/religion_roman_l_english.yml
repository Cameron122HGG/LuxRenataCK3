 roman_pagan: "Religio Romana"
 roman_pagan_adj: "Religio Romana"
 roman_pagan_adherent: "Roman Pagan"
 roman_pagan_adherent_plural: "Roman Pagans"
 roman_pagan_desc: "The Religio Romana, or the Mos Maiorum ('Ancestral Tradition'), is a Mainstream Graeco-Roman religion of Traditional Soul. An ancient, polytheistic, and cosmopolitan faith, its grand pantheon of gods and goddesses began as a collection of local Italic deities that grew in sophistication and power through the centuries alongside Rome itself. Hellenic religion from Magna Graecia served as formative influences for the Romans, who adapted Greek myths and imagery to enhance their prestige, and they adopted from Etruscan customs the practice of augury as a means to interpret the will of the gods. Worship in the Roman pantheon is a highly ritualized affair, dependent on the strict and proper observance of prayer and sacrifices, both as part of the obligation of mortals to their divine patrons and as a means of enforcing social order. As the Republic, and eventually the Empire, came to span the breadth of the known world, it also assimilated foreign traditions into its own practices. Established gods such as Jupiter, Juno, Mars, and Mercury may be venerated in the same temple quarter as the Egyptian Isis, the Anatolian Magna Mater, the Gallic Epona, and the Eastern Mithras, for the Romans have always attributed their worldly power and prosperity to their piety and their manifold pacts with the heavens."
 roman_pagan_old: "Old Rite Religio Romana"
 roman_pagan_old_adj: "Old Rite Roman"
 roman_pagan_old_adherent: "Old Rite Roman"
 roman_pagan_old_adherent_plural: "Old Rite Romans"

 roman_caesar_cult: "Sacra Augustālia"
 roman_caesar_cult_adj: "Augustalist"
 roman_caesar_cult_adherent: "Augustalist"
 roman_caesar_cult_adherent_plural: "Augustalists"
 roman_caesar_cult_desc: "The Sacra Augustālia, or the Rites of the Emperors, is a Local Graeco-Roman religion of Statist Soul. It is an offshoot of traditional Roman religious practices as they evolved starting from the early Principate of Augustus. In a similar fashion to classical Graeco-Roman beliefs, religious practices involve offerings, ranging from wine to animal sacrifices, to the gods of the classical pantheon - notably the Capitoline Triad of Jupiter, Juno and Minerva, as well as other gods like Vesta and Mars. For the Imperial Cult, this worship includes the emperors as well, along with some members of their families with the divinely sanctioned authority of the Roman State, who serve as guardians of the traditional values and worship of the gods. The *cultus* to a living emperor acknowledges his office and rule as divinely approved and constitutional - his Principate should, therefore, demonstrate pious respect for traditional deities and values. A deceased emperor held worthy of the honor can be voted a state divinity (divus) by the Senate and elevated as such in an act of apotheosis. The granting of apotheosis serves religious, political, and moral judgment on Imperial rulers, and allows living Emperors to associate themselves with a well-regarded lineage of Imperial divi from which unpopular or unworthy predecessors are excluded. The clergy is strictly organized, with the Emperor acting as the Pontifex Maximus. The major deities have their own organized priesthoods, all under spiritual guidance from the Pontifex Maximus."
 roman_caesar_cult_old: "Vetera Sacra Augustālia"
 roman_caesar_cult_old_adj: "Old Augustalist"
 roman_caesar_cult_old_adherent: "Old Augustalist"
 roman_caesar_cult_old_adherent_plural: "Old Augustalists"
 
