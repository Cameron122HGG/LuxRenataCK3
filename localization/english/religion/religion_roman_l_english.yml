 roman_jupiter: "Mos Jovis"
 roman_jupiter_adj: "Jovian"
 roman_jupiter_adherent: "Jovian"
 roman_jupiter_adherent_plural: "Jovians"
 roman_jupiter_desc: "The Mos Jovis ('Jovian Tradition') is a Local Graeco-Roman religion of Statist Soul and Christian ascendant. In the wake of the new age that the rising monotheistic religions of Late Antiquity brought forth, other religions followed their path. The strong cult of Jupiter and Hercules sponsored by the Roman Empire since the times of Diocletian lived on, dwindling in number of followers but growing stronger in community and cohesion. In Anatolia, the last bastion of this tradition, it absorbed a breath of the spirit of the age and Jupiter came to be equated with the Christian God, his bitter rival. So it was that Jupiter Optimus Maximus, Jovis Basileus, adopted Anatolian religious traditions, the most important of which was that of Jupiter Dolichenus or Jupiter-Baal, the Commagenean King of the Gods, and its particular blend of monolatry. From then on Jupiter was King, Judge, and Genesis of the World, and in Anatolia a renewed network of Flamines and Augurs kept the temples and the sacrificial arae open and running, even in secret if needed. These strong communal ties allowed the Jovian Tradition to make its believers everywhere in Anatolia a bastion of their own, a beacon of solidarity, and the support of the state ensures the public aspect of the rites is preserved, while the ruler also seizes the prizes of the communal faith and its Dolichene Mysteries in the unwavering faith of its followers."
