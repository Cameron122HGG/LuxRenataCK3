l_english:
 # Lux Invicta shamans (events/li_shamans.txt, localisation/VIET_pagan_stuff.csv), ported 2026-11-06
 LR_court_shaman_court_position: "Court Shaman"
 LR_court_shaman_court_position_desc: "Able to travel to the Spirit World and speak with the ancestors, the $LR_court_shaman_court_position$ pacifies the spirits who live in the realm and brings their counsel to the ruler."
 LR_court_shaman_is_shaman_aptitude: "[GetTrait('LR_shaman').GetName( ROOT.Char )]"
 LR_court_shaman_cynical_trait: "[GetTrait('cynical').GetName( ROOT.Char )]"
 LR_court_shaman_employee_desc: "Becomes a [GetTrait('LR_shaman').GetName( GetNullCharacter )] if not one already"
 trait_LR_shaman: "Shaman"
 trait_LR_shaman_desc: "This character is a Shaman, able to travel to the Spirit World in trance and to speak with the spirits and the ancestors."
 LR_invite_shaman_to_court_decision: "Invite a Shaman to Court"
 LR_invite_shaman_to_court_decision_desc: "Invite a shaman to the court."
 LR_invite_shaman_to_court_decision_tooltip: "Who will travel to the Spirit World to ask my ancestors for advice? Who will pacify the spirits who live in my realm?"
 LR_invite_shaman_to_court_decision_confirm: "Send for a Shaman"
 LR_invite_shaman_to_court_decision_pending_tt: "Not already waiting for a Shaman to arrive"
 LR_invite_shaman_to_court_decision_none_tt: "No [GetTrait('LR_shaman').GetName( GetNullCharacter )] among your courtiers or vassals"
 LR_invite_shaman_to_court_decision_effect_tt: "A [GetTrait('LR_shaman').GetName( GetNullCharacter )] will arrive at your court"
 LR_ask_ancestors_for_advice_decision: "Ask the Ancestors for Advice"
 LR_ask_ancestors_for_advice_decision_desc: "Ask the Shaman to communicate with your ancestors and get advice."
 LR_ask_ancestors_for_advice_decision_tooltip: "Many worries, many fears, many thoughts cloud my mind. Perhaps my ancestors, the spirits, can be contacted for advice and foresight."
 LR_ask_ancestors_for_advice_decision_confirm: "Seek the Ancestors"
 LR_ask_ancestors_for_advice_decision_shaman_tt: "Employs a $LR_court_shaman_court_position$, or is a [GetTrait('LR_shaman').GetName( GetNullCharacter )]"
 LR_ask_ancestors_for_advice_decision_effect_tt: "Your Shaman will journey to the Spirit World and return with the ancestors' advice, good or bad, on what troubles you. A more learned Shaman reads the spirits better."
 LR_shaman.0001.t: "No Court Shaman"
 LR_shaman.0001.desc: "I currently do not have a Shaman at my court, and it reflects badly on my rule. Who will travel to the Spirit World to ask my ancestors for advice? Who will pacify the spirits who live in my realm?"
 LR_shaman.0001.a: "There is a Shaman at my court already."
 LR_shaman.0001.b: "I must find a Shaman, and soon!"
 LR_shaman.0001.b.tt: "A [GetTrait('LR_shaman').GetName( GetNullCharacter )] will arrive at your court"
 LR_shaman.0001.c: "The spirits can wait."
 LR_shaman.0002.t: "A Shaman Arrives"
 LR_shaman.0002.desc: "The humming tone of the Shaman is unmistakable, the fluidity of [SCOPE.sC('new_shaman').GetHerHis] movements, the tranquility with which [SCOPE.sC('new_shaman').GetSheHe] moves in nature... The Shaman approaches and greets you, and you stay where you are. The otherworldliness, the powers these Shamans hold - it all still mystifies and fascinates you."
 LR_shaman.0002.a: "Welcome to my court. You shall be my Court Shaman."
 LR_shaman.0002.b: "Welcome to my court."
 LR_shaman.0100.t: "Ask the Ancestors"
 LR_shaman.0100.desc: "Many worries, many fears, many thoughts cloud my mind. I feel the need for advice, for counsel, for guidance, to quiet these many things that trouble me. Yes, yes - I shall go to my Shaman, and see if my ancestors, the spirits, can be contacted for advice and foresight."
 LR_shaman.0100.a: "I must remember to bring the proper offerings to my Shaman."
 LR_shaman.0100.a.tt: "[ROOT.Char.GetTitledFirstName] pays the Shaman a visit."
 LR_shaman.0101.t: "Visiting the Shaman"
 LR_shaman.0101.desc: "“To heal your body and soul you must be earnest and pure,” your Shaman says, pacing around you with perfectly-timed, theatrical steps. “You come to me because you are troubled. There is nothing unusual in that. The responsibilities of any leader are many. The responsibilities of any [ROOT.Char.GetManWoman] are many. There is great wisdom in humbling yourself and seeking guidance from the spirits.”\n\nThe Shaman pauses for a bit for dramatic effect, before subsequently saying, “I will try to communicate with your ancestors on your behalf. This is a difficult task, an arduous one, but I will try my best. Tell me first, then, of the things that trouble you.”"
 LR_shaman.0101.family: "“I am always worried about my family situation...”"
 LR_shaman.0101.realm: "“My realm’s affairs are constantly on my mind...”"
 LR_shaman.0101.personal: "“The life I have feels incomplete for some reason...”"
 LR_shaman.0101.family.tt: "[ROOT.Char.GetTitledFirstName] tells the Shaman about [ROOT.Char.GetHerHis] problems with [ROOT.Char.GetHerHis] family."
 LR_shaman.0101.realm.tt: "[ROOT.Char.GetTitledFirstName] tells the Shaman about [ROOT.Char.GetHerHis] problems with the realm."
 LR_shaman.0101.personal.tt: "[ROOT.Char.GetTitledFirstName] tells the Shaman about [ROOT.Char.GetHerHis] problems with [ROOT.Char.GetHerselfHimself]."
 LR_shaman.0102.desc.family: "Your Shaman listens as you speak of your family, nodding slowly. “The ancestors know your house well, for it is their house too,” your Shaman says. “But tell me plainly - what is it about your family that troubles you most?”"
 LR_shaman.0102.desc.realm: "Your Shaman listens as you speak of your realm, nodding slowly. “The spirits of the land and of your forebears watch over your people as well as you,” your Shaman says. “But tell me plainly - what is it about your realm that troubles you most?”"
 LR_shaman.0102.desc.personal: "Your Shaman listens as you speak of yourself, nodding slowly. “There is no shame in this. Even the greatest of your ancestors felt such things,” your Shaman says. “But tell me plainly - what is it that troubles you most?”"
 LR_shaman.0103.t: "To the Spirit World"
 LR_shaman.0103.desc: "Your Shaman meticulously listens to your concerns, asking questions and noting any details as necessary, in preparation for the journey to the Spirit world. It takes your Shaman several days to prepare.\n\nAs the morning of that day dawns, you sit, quiet and respectful, behind the Shaman who carries a drum. With a dramatic flourish of the hand, the Shaman beats the drum - BOM. The gesture is repeated again, and again, with ever-increasing fury as the Shaman recites arcane spells and chants and goes into a trance - bom, bom, bom, BOM, BOM, BOM, BOM.\n\nAnd sooner than you realize it, the Shaman is lost in the Spirit world, seeking your ancestors. You hope that the Shaman will return safe and sound, with relevant guidance from the spirits."
 LR_shaman.0103.a: "Bom, bom... the sounds of the drum fill my head."
 LR_shaman.0103.a.tt: "[ROOT.Char.GetTitledFirstName] takes a seat nearby, carefully watching the Shaman."
 LR_shaman.0104.t: "The Shaman's Journey"
 LR_shaman.0104.desc: "It is many hours later, and your Shaman is still beating the drum, dancing, wailing, screaming, crying, speaking gibberish, as the journey through the Spirit World proceeds. The Spirit World is a dangerous place, that much you know. The dramatic movements, the theatrical sounds, the over-the-top atmosphere, it is not without reason - how else can anyone communicate with the spirits? Much less, as someone from the land of the living, withstand the strain of going into the land of the dead?\n\nAmazing, is it not, that despite being “here,” the Shaman is truly now far, far away, across the mountains, forests, and plains, in the unforgiving world of the spirits? Despite your impatience, you remind yourself that your Shaman will return eventually, to tell you what the spirits wish to tell you."
 LR_shaman.0104.a: "Waiting is all I can do, for now."
 LR_shaman.0104.a.tt: "The wait continues."
 LR_shaman.0105.t: "The Shaman Returns"
 LR_shaman.0105.desc: "The trance rhythm - drumming, singing, yelling, wailing, dancing - begins to slow down. The Shaman almost collapses out of exhaustion, but manages to stand up. You wait a few minutes to allow your Shaman some time to rest, before you engage in conversation.\n\n“I have returned, and the spirits have spoken,” your Shaman says, tired, yet relaxed. Your Shaman rests a moment before continuing, “The journey was arduous, but worthwhile. The spirits told me many things... where to begin?”"
 LR_shaman.0105.a: "Go on. Take your time..."
 LR_shaman.0106.t: "Fate?"
 LR_shaman.0106.desc: "“There is nothing more. That is all that I have been told,” your Shaman says, after telling you many more things. “Do not forget what the spirits have said. Contemplate their messages carefully.”\n\nYour Shaman pauses, before continuing, “Fate is a difficult thing to understand - remember that the world is ever-changing, ever-flowing. The decisions you make today could bode well or ill. Good and bad results depend on all of us, and do not arise randomly. Everything has reason and purpose. Your ancestors’ spirits do not force absolute views on you, for they cannot. But it would be extremely unwise to ignore them. They know better than we do.”"
 LR_shaman.0106.a: "Very well. Thank you."
 LR_shaman.0110.t: "The Ancestors' Foresight"
 LR_shaman.0111.t: "The Ancestors' Warning"
 LR_shaman.0102.marriage: "“My marriage...”"
 LR_shaman.0102.no_spouse: "“That I have no spouse...”"
 LR_shaman.0102.children: "“My children...”"
 LR_shaman.0102.no_children: "“That I have no children...”"
 LR_shaman.0102.distant_relative: "“My kin and my dynasty...”"
 LR_shaman.0102.diplomacy: "“My vassals and servants...”"
 LR_shaman.0102.martial: "“War, and my warriors...”"
 LR_shaman.0102.stewardship: "“The prosperity of my realm...”"
 LR_shaman.0102.intrigue: "“Those who plot against me...”"
 LR_shaman.0102.learning: "“The spiritual needs of my people...”"
 LR_shaman.0102.personality: "“Myself, and the person I am...”"
 LR_shaman.0102.health: "“My health...”"
 LR_shaman.0102.age: "“My age, and the years ahead...”"
 LR_shaman.0110.desc.marriage: "“Your marital life is blessed for now, the spirits told me,” your Shaman says. “Harmony rules your house. But the spirits also warned that you must be cautious - a peaceful house can quickly turn violent and destructive if not carefully watched. To ensure continued prosperity you must...”"
 LR_shaman.0110.a.marriage: "Hmm..."
 LR_shaman.0110.desc.no_spouse: "“You currently hold a lonely existence without a spouse, the spirits know this much,” the Shaman says. “They have said that the loneliness will end soon if you stay true to your duties as a [ROOT.Char.GetManWoman] and a ruler. Take heed of their advice, and you will live well with a spouse.”"
 LR_shaman.0110.a.no_spouse: "My duties, huh? Tell me their advice, then."
 LR_shaman.0110.desc.children: "“Great things may be in store for your grown children, the spirits have said.” Your Shaman pauses, before continuing, “They believe that one of your children will prove themselves worthy. This is an auspicious time for them. Even if they died, their spirit would bring blessings to your dynasty.”"
 LR_shaman.0110.a.children: "Did the spirits offer any suggestions on childbearing?"
 LR_shaman.0110.desc.no_children: "“You bear a life with no close family - or at least one that is not complete,” the Shaman says. “The spirits have given me much advice to ensure you will have children. Stay true to your duties as a [ROOT.Char.GetManWoman] and a ruler, and you will be blessed with many children. The ancestors told me...”"
 LR_shaman.0110.a.no_children: "Hmm..."
 LR_shaman.0110.desc.distant_relative: "“The spirits have told me they have observed your dynasty for some time, and they wish to offer advice on dealing with your relatives,” your Shaman says. “The spirits do not mean to bode ill - on the contrary, they believe this is an opportune time to improve your dynasty’s influence.”"
 LR_shaman.0110.a.distant_relative: "How can I do that, then?"
 LR_shaman.0110.desc.diplomacy: "“The spirits have studied your servants and vassals,” your Shaman explains. “Many are deceitful and dangerous. But many are also trustworthy and loyal. Know whom to trust. Reward and protect them, and they shall do the same to you. The spirits suggest you encourage them by...”"
 LR_shaman.0110.a.diplomacy: "By what?"
 LR_shaman.0110.desc.martial: "“The spirits believe that your warriors shall meet many victories in battle, if war is fated to come in the near future.” Your Shaman warns, however, “But remember that advantages are but a means to victory, not victory in and of itself. Nevertheless, the spirits thought of good war plans, and told me...”"
 LR_shaman.0110.a.martial: "How can I defeat my enemies, if they come?"
 LR_shaman.0110.desc.stewardship: "“The realm should prosper fine,” your Shaman tells. “So the spirits have said. There may be difficult periods, but the realm will emerge stronger so long as you focus and stay diligent. All good things can be lost if they are not carefully watched, and even then, all good things must end eventually.”"
 LR_shaman.0110.a.stewardship: "Did they suggest anything on how to continue this success?"
 LR_shaman.0110.desc.intrigue: "“There are always those who plot and scheme against you, and while the spirits cannot always see what your enemies are planning, they can provide their protection and advice,” your Shaman says. “This should be a peaceful time for you, but be wary as always - hubris is a bringer of doom.”"
 LR_shaman.0110.a.intrigue: "Any suggestions on dealing with these enemies?"
 LR_shaman.0110.desc.learning: "“Your ancestors have told me that the spiritual needs of your people are being fulfilled,” your Shaman reports happily. “Many are learned and know the proper rites and manners of interacting with the spirit world. As ruler, you must ensure this good state of affairs lasts by...”"
 LR_shaman.0110.a.learning: "Hmm..."
 LR_shaman.0110.desc.personality: "“Your ancestors have observed you and saw that while you may have your flaws, there remains great potential in you as a person,” your Shaman says. “Continue respecting the spirits around you, be bountiful in merit and goodness. To improve yourself, the spirits suggested you...”"
 LR_shaman.0110.a.personality: "Well, what a relief."
 LR_shaman.0110.desc.health: "“Your ancestors told me you are in good health,” your Shaman says. “Good health is no guarantee of success, but it does show that the world favors you, for now. The spirits offered me further instructions on how you can continue possessing such strength...”"
 LR_shaman.0110.a.health: "Let me hear it then."
 LR_shaman.0111.desc.marriage: "“The spirits were dark when they told me,” your Shaman continues, “that much caution should be exercised with your current marital life. There may be strife if you are not careful, and one of your wisest ancestors told me that this strife may have already begun. Be very cautious.”"
 LR_shaman.0111.a.marriage: "Oh my... so what can I do to reduce strife?"
 LR_shaman.0111.desc.no_spouse: "“Your ancestors recognize that you are currently unmarried,” your Shaman tells you. “They are uncertain whether this loneliness will end, even if you do get married. You do want to avoid trouble with such relationships in the future, of course, so the ancestors have suggested some advice.”"
 LR_shaman.0111.a.no_spouse: "Dead spirits always give the best love advice."
 LR_shaman.0111.desc.children: "“The spirits were most concerned about your children,” your Shaman says. “Does this mean that disaster will befall them? They do not know for certain. But what is certain is that utter care must be taken handling your children, for they are not prospering in these trying times.”"
 LR_shaman.0111.a.children: "My poor children... What I can do to make things better?"
 LR_shaman.0111.desc.no_children: "“The spirits see that you currently have no children,” the Shaman says. “This is no surprise. They see many things which hinder you from garnering any offspring, which twist and pervert your fate. There are things you can try to alleviate this situation, though...”"
 LR_shaman.0111.a.no_children: "And that would be..."
 LR_shaman.0111.desc.distant_relative: "“Your ancestors have told me they have observed your dynasty for some time, and they wish to offer advice on dealing with your relatives,” your Shaman says. “This does not necessarily mean great conflict within your dynasty, but your ancestors bode caution, as it seems like your dynasty will...”"
 LR_shaman.0111.a.distant_relative: "Uh-oh..."
 LR_shaman.0111.desc.diplomacy: "“The spirits are fearful for your realm’s future, but more so for you as a ruler of men,” your Shaman tells, “There are many who seek to destroy you, including those servants and vassals who serve you. If you are to defend yourself, you must make changes for the better...”"
 LR_shaman.0111.a.diplomacy: "These changes being..."
 LR_shaman.0111.desc.martial: "“Your ancestors told me this might not be a good time for battle,” your Shaman explains. “Even if you win exceptional victory, the aftermath will be of much trouble. Defeat, however, can be avoided - possibly - if you follow the spirits’ advice. They have told me that you must...”"
 LR_shaman.0111.a.martial: "Doesn’t sound good to me."
 LR_shaman.0111.desc.stewardship: "“Your ancestors fear for the realm,” your Shaman says, before reassuring, “This does not necessarily mean disaster is at hand, but it does show that troubling times may come. Who is to suffer? The commoner? The merchants? The rulers? The spirits told me calamity could be prevented if...”"
 LR_shaman.0111.a.stewardship: "Not good..."
 LR_shaman.0111.desc.intrigue: "“There are those who plot and scheme against you, and your ancestors have warned me well that this is a dangerous time for you.” The Shaman frowns, before adding, “It is difficult to change fate as it is to know it, but your ancestors told me of a few measures you can prevent disaster...”"
 LR_shaman.0111.a.intrigue: "Please, tell me!"
 LR_shaman.0111.desc.learning: "“Your ancestors were rather distrustful and unfriendly when I met them, as they believe the spiritual state of your realm is lacking at best.” Your Shaman grimaces. “They are, however, willing to assist you in bettering the spiritual needs of the realm if you are willing to do your part.”"
 LR_shaman.0111.a.learning: "What should I do then?"
 LR_shaman.0111.desc.personality: "“Your ancestors seemed disappointed when I mentioned you,” your Shaman says. “All of us have flaws, that is undeniable, but the spirits believe your recent behaviors and attitudes need to be improved even more for the betterment of your realm and yourself. They suggested...”"
 LR_shaman.0111.a.personality: "Well..."
 LR_shaman.0111.desc.health: "“Your ancestors seem to be concerned about your health,” your Shaman indicates. “Perhaps there are evil spirits near you or your house. Your ancestors indicated they could help if necessary if I perform the proper rites, but they also suggested you should take certain measures...”"
 LR_shaman.0111.a.health: "What measures should I take then?"
 LR_shaman.0112.desc.young: "“The spirits recognize your youth,” your Shaman says. “To be young! It is a blessing, say they, but it can quickly become a curse if used unwisely. Be level-headed, not rash. Virtuous, not wicked. The ancestors have much counsel to give you - let me recount what they told me...”"
 LR_shaman.0112.a.young: "What did they want to tell me?"
 LR_shaman.0112.desc.medium: "“Your ancestors know that you are of middle age,” your Shaman tells you. “Some may think of youth as more exciting, or of old age as more enlightening, but there is reward in middle age as well. The spirits have much advice to offer to you on how to best live your life during this time.”"
 LR_shaman.0112.a.medium: "Let’s hear it then."
 LR_shaman.0112.desc.old: "“The spirits recognize your advanced age,” the Shaman reports. “They know that soon, you will join them. This will be a troubling time for you, full of worries about what you will leave behind, and anxiety about what you will face. Your ancestors offer you the following guidance - listen closely...”"
 LR_shaman.0112.a.old: "Hmm."
