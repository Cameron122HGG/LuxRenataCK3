lugh_old_adj: "Old Lughite"
lugh_old_adherent: "Old Lughite"
lugh_old_adherent_plural: "Old Lughites"
 
#Hibernicism
celtic_christ: "Hibernicism"
celtic_christ_adj: "Hibernicist"
celtic_christ_adherent: "Hibernicist"
celtic_christ_adherent_plural: "Hibernicists"
celtic_christ_desc: "Hibernicism is a Heretical Celtic religion of Traditional Soul, characterized by strong Christian influences. Christianity first arrived in Britain with the Roman legions in the 4th Century, but as the Western Empire descended into anarchy and abandoned the isles, the doctrine of the native Celtic converts began to drift further and further from Latin rites, coming to distinctly resemble the folk tales and traditions of their pagan forefathers. The local druidic priesthoods, taking primacy over foreign preachers from the mainland, gradually reinterpreted Christianity in a fashion more in line with their own teachings, giving rise to a new sect that came to be known as Hibernicism. The saints and prophets of Christian scriptures entwined with figures of Celtic tradition to such an extent that they became inseparable from the gods and heroes of the ancient sagas, and these divergences only grew more stark in the wars and clashes against those that deemed them heretics.\n\nHibernicists believe that the Christ and Messiah Cú Chulainn, Sétanta the Redeemer, born of Lugh Almighty and Queen Morrígan, was sent unto the earth to guide the gods' chosen people and bring forth justice, and that he was betrayed by his unfaithful companions, Lugaid, son of Cú Roí, and Erc, son of Cairbre Nia Fer, who abandoned him in the last, decisive battle against the Romans led by Brutus and Pilate. Imprisoned, tortured, and crucified on a great stone cross, Cú Chulainn promised his return to right all wrongs, bring justice to the world, and redeem his true followers."
celtic_christ_old: "Old Hibernicism"
celtic_christ_old_adj: "Old Hibernicist"
celtic_christ_old_adherent: "Old Hibernicist"
celtic_christ_old_adherent_plural: "Old Hibernicists"

