#Endovellico-Neto
endovellico: "Endovellico-Neto"
endovellico_adj: "Endovellican"
endovellico_adherent: "Endovellican"
endovellico_adherent_plural: "Endovellicans"
endovellico_desc: "The cult of Endovellico-Neto is a Local Celtic faith of Martial Soul, with strong Graeco-Roman influences. Endovellicus was an Iron Age god of public health and safety worshipped among other gods in pre-Roman Lusitania and Gallaecia, associated with chthonic oracles and healing. After his defeat at the hands of the Romans, Punicus, the King of the Lusitani, decided to consolidate his new position as a Roman client-king by focusing public worship on Endovellicus, emphasizing a syncretic Graeco-Roman identity to better tie himself and his people to the new Roman order. The nature of Endovellicus then evolved with the fortune of the Lusitani. As the Lusitanian soldiery began to integrate into the Roman military as legionnaires and auxiliaries, He was conflated with the god Neto, patron of the nearby Arevaci, who was by then syncretized into Mars Neto, sun god of warriors and defender of the land. Thus at the height of the Pax Romana, there was a single Lusitanian sun god with two faces, Endovellicus-Neto. To his worshippers, he is the Healing Sun, the protective and caring father of the Lusitan people. To their enemies he is the Scorching Sun, the harsh and passionate protector of the Lusitanian homeland. Other Celtiberian deities such as Ataecina, goddess of rebirth and the spring season, or Nabia, goddess of rivers and waters, were reinterpreted as local protector spirits, subservient to Endovellicus-Neto. With the descent of Hispania into chaos, the proud and tough Lusitani armies protecting their homeland against waves of invaders have only furthered their reverence for Endovellicus-Neto."
