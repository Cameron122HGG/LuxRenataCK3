#Martinianism
martinianism: "Martinianism"
martinianism_adj: "Martinian"
martinianism_adherent: "Martinian"
martinianism_adherent_plural: "Martinians"
martinianism_desc: "Martinianism is a Local Christian religion of Traditional Soul, marked by strong Celtic and Germanic influences. It blends Briton and "arian_rite" monasticism, Germanic hero worship and Celtiberian ancestor and nature cults under the umbrella of Christian theology. It traces its ordered form to Saint Martin of Bracara, remembered as the Apostle of the Lusitanians, who sought to bring Christ to the quarrelling Lusitanian and Suevic pagan principalities in the 6th Century, at a time when the authority of the Emperor of Hispania was in tatters; to this end, established a broad and very heterodox Christian system of beliefs where the local gods were considered patron saints, and the Lusitanian and Suevic aristocracy became hereditary protectors of temples, cults and monasteries dedicated to those saints. In Martinian belief, there is one God, all powerful and distant, like the Emperor of Rome was, whose grace and mercy manifested through his son, Christ Endovellicus, Christ the Most Good, who forgave grievances, opened the Gates of Heaven, made peace and brought justice to Earth. He sent his Apostle, Saint James of the Silver Hand, to Hispania, to unite its disparate peoples, and with them he fought the terrible Wolf-Drake Cucalebre - losing his arm but gaining one of silver through which God healed the sick and smote His enemies. Through monastic practice, the worship of patron saints and heroes, sacred music, pilgrimage, seasonal fires, blessings of springs, groves, flocks, and fields, and the ritual of incubatio on the eve of special days, over time Martinianism has developed into a strange but enduring synthesis of Christianity and the ancestral beliefs of the Iberian West."
