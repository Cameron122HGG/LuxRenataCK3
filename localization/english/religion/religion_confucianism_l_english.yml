 indoh_confucian: "Konphosianism"
 indoh_confucian_adj: "Konphosian"
 indoh_confucian_adherent: "Konphosian"
 indoh_confucian_adherent_plural: "Konphosians"
 indoh_confucian_desc: "The teachings of Konphosios are a Local Graeco-Roman faith of Statist Soul, characterized by strong Chinese influences. When Lìshān Alexandra I of the Helleno-Chinese issued in 511 A.D the edict of Alexandria Changana, she created a strong meritocratic bureaucracy system based on Confucian principles and Hellenistic values. Under this three-way Indian, Hellenic and Chinese syncretic system, many cults and sects combining spirits and deities from all those mythologies arose. It is thus not surprising to see temples to the Greek and Indian gods next to an Chinese ancestral shrine, mystics practicing both Taoist magic and Theurgy, and scholars mixing the teachings of Konphosios and Socrates."
