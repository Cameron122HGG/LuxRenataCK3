 #Sol Manichaean 
 sol_mani: "Oromasdeism"
 sol_mani_adj: "Oromasdean"
 sol_mani_adherent: "Oromasdean"
 sol_mani_adherent_plural: "Oromasdeans"
 sol_mani_desc: "Oromasdeism is a Local Gnostic faith of [statist|E] Soul, with strong Persian influences. It is a hybrid religion that worships Sol Invictus, the God of Light, in Manichaean fashion. The core of its cosmogony revolves around His struggle against Ahriman, the King of Darkness, and the purification of human souls so that their inner light may be returned through Him to the Eternal Realm. The origins of this sect begin in the late 3rd century with the arrival of the first Manichaean missionaries in the Eastern Empire, whose adherents were initially persecuted by Roman authorities under Imperator Diocletian. With his passing and with the rise of Imperator Alexandros VII, who saw in the new religion a potential rival to undermine the rise of Christianity, Manichaeism received a degree of state toleration that soon gave way to syncretism. As Sol-Incarnate and His Shadow on Earth, the Imperator is seen as responsible for both the salvation of souls and the preservation of the state, which must serve as a Fortress of Light against the foul machinations of Chaos and Darkness until Sol's inevitable triumph."

