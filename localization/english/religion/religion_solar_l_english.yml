 #Solar Victorian
 sol_victor_rite: "Victorianism"
 sol_victor_rite_adj: "Victorian"
 sol_victor_rite_adherent: "Victorian"
 sol_victor_rite_adherent_plural: "Victorians"
 sol_victor_rite_desc: "The Church of Christus Victor is a Heretical [graeco_roman|E] religion of Martial Soul, with significant Christian influences. Originating from the highly militarized religious practices of the Sarmato-Briton legionaries stationed in the Western Empire as well as the messianic cult of the Constantinid imperial line, it is a violently radical sect of Solar Christianity. Solar Victorians proclaim the Sol-Imperator to be the living incarnation of Sol Christus, the Son of the Solar God, and that the sitting rulers of the Empire are but false prophets and puppets of Satan. It is the solemn duty of the rightful sovereign, He who is chosen by the Sword, to purge the wicked usurpers from this world and seize His rightful throne by force of arms. Intense ritual significance is given to the Sword of Victory as both a martial and ceremonial instrument. This is most prominent in its use as an implement of sacrifice in the wake of a victorious battle, wherein it is thrust through the heart of the highest ranking captive of the enemy army to meet the earth. For it is the decree of Sol and the Unconquered Christ that every betrayer of the Empire, willful or ignorant, shall be cast down in such a manner. For no Kingdom is built without sacrifice, and the Lord's shall arrive in fire and steel."
 sol_victor_rite_good_god_name_christ: "Christus Victor"

 holy_order_legio_solis_victor: "Legio IX Solis Victor"
 holy_order_legio_solis_victor_adj: "Victorian"
 holy_order_ordo_draconis: "Ordo Draconis"
 holy_order_ordo_draconis_adj: "Draconian"


