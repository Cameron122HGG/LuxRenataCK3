 sol_slav_desc: "The worship of Hors is a Local Slavic religion of [statist|E] Soul, with significant [graeco_roman|E] influences. Hors is the Slavic sun god, a personification of the solar disc. According to myth, Hors travels across the sky by day and moves underground by night, fighting off the monsters that linger within the dark. His re-emergence as the sunrise every morning signals his victory in his nocturnal journeys, and great celebrations are held when he resurfaces in red, an omen of a heroic and bloody triumph over Chernobog. Hors is the source of all light and life in the world, although creation itself is usually attributed to Rod. Roman influence has resulted in the partial association of Hors with Sol Invictus - each ruler is enthroned during sunrise, with prayers and offerings being made to Hors, protector of the realm. Additionally, the ruler is considered to have a special relationship with Hors, giving blessings on the god's behalf."
