 sol_christ_desc: "Solar Christianity is a Heretical [graeco_roman|E] religion of [statist|E] Soul, with significant Christian influences. Also called Solar Christianity, it was established in the 4th Century CE and popularized during the reign of Imperator Alexandros VII. Helianism claims that the Christian prophet, Jesus of Nazareth, is the only true Sun incarnate and the son of God. While it does share basic elements with other Christian creeds, its pagan elements, such as the adaptation of Dies Natalis Sol Invictus as a central holiday, or the personality cult of the Imperator as Christ's sole successor, make other Christian creeds treat their Solar brethren with suspicion and caution. While moderate Helianists are usually tolerated by followers of the Invincible Sun, more radical elements tend to openly challenge the authority of the Imperators, seeing them as mere usurpers to Christ, who is to return at the end of days to purge the earth of all evil. Helianist monarchs enjoy undisputed authority - which stems from the Solar component, supported by Saint Augustine's theory of Civitas Dei ('City of God') - according to which a strong secular state is required to protect the faithful from evil until the Day of Judgement comes and a pure Kingdom of God is created."


 #Sol Islam
 sol_islam: "Al-Shamsiyyah"
 sol_islam_adj: "Al-Shamsi"
 sol_islam_adherent: "Al-Shamsi"
 sol_islam_adherent_plural: "Al-Shamsis"
 sol_islam_desc: "Al-Shams Islam is a Local Islamic sect of [statist|E] Soul, characterized by strong [graeco_roman|E] influences. When Mu'awiya established control over the lands conquered by the Muslims, he found the wide array of spiritual affiliations present in Judaea both a liability and an opportunity. Challenged by both heathens and the first divisions within Islam, which were encouraged by covert Roman actions, he reacted by blurring the lines of division between all the religions under his control. Making only vague references to Muhammad as the first among a lineage of God's messengers, he tightly controlled the emerging clergy, stopped the codification of Islam into canon holy texts, and established himself as the sole Commander of the Faithful. His spiritual message, garbed in typically Roman monarchical allure, ambiguously combined Muhammad's oral legacy with Manichaean and Solar components so as to establish himself as the rallying point of all sects persecuted in the Roman and Sassanid Empires while reuniting the Muslim faithful. Mu'awiya's offspring, excluded from later Umayyad palace politics in Damascus but still strong in Nabatea, seized the opportunity and referred to him as both heir of Muhammad and the reincarnation of Alexandros XV. In this double legacy, the true message of the Solar God, as revealed first to Muhammad, was made clear - all the kingdoms of men but the Realm of the Faithful will be brought to dust by the burning wrath of God, and believers should follow the holy lineage stemming from Mu'awiya. In many aspects, the key beliefs of Al-Shamsis appear to be paradoxically consistent with the Qur'an as codified by their Sunni enemies, yet they follow a radically different interpretation of the holy text, emphasizing the Solar elements in Allah and his Word, minimizing the importance of Muhammad, refuting all hadith, and rejecting the primacy of the holy cities in Hijaz. Refusing to lay down the Solar God's holy message in writing, they instead worship their Monarch, the Son of the Sun, Shadow of God on Earth."

