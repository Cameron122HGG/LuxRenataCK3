 sol_boreas_desc: "The cult of Apollo-Boreas is a Local [graeco_roman|E] faith of of [statist|E] Soul, with strong Steppe influences. Apollo-Boreas is the union of Apollo, the sun god, and Boreas, the northern wind god, the Devouring One. Boreas was adopted as a patron by the Bosporan Kings, complementing the benevolent side of Apollo as a cruel and unforgiving deity. Together, they form a two-faced god reveling in the duality of good and evil. In the first half of the year, the aspect of Apollo is venerated for his warmth and for the other half, the aspect of Boreas is offered sacrifices to stave off the cold of winter."

