 sol_norse_adherent: "Solar-Ódinnist"
 sol_norse_adherent_plural: "Solar-Ódinnists"
 sol_norse_desc: "The worship of Ódinn-Sól is a Local Norse cult of [statist|E] Soul, characterized by strong [graeco_roman|E] influences. Increasing contacts with the Roman Empire by Varangian captains led to a synthesis between the traditional Nordic deity Odinn with the Roman cult of Sol Invictus. This synthesis makes Odinn-Sol a patron of rulers, associated with victorious conquests and wise administration alike. The chief attribute of Odinn-Sol is his single eye, representing the solar disc. It is said that Odinn sacrificed his other eye to gain infinite wisdom, so that he can shine upon the world for only half of a day. Another chief belief is the so-called Ragnarok ('Twilight of the Gods') when the forces of darkness would rise against the Sun, and the next world would be born anew from the ashes of the previous. Solar eclipses are of particular importance for the followers of Odinn-Sol, for they believe that during each eclipse the forces of darkness attempt to strike against the Solar deity, only to be thwarted by Ódinn-Sól's divine power."

