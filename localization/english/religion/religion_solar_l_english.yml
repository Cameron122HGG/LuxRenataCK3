 #Sol Sahara
 sol_sahara: "Dulefuka"
 sol_sahara_adj: "Dulefukan"
 sol_sahara_adherent: "Dulefukan"
 sol_sahara_adherent_plural: "Dulefukans"
 sol_sahara_desc: "The Dulefukan ('Red Sun') cult is a Local Saharan faith of Messianic Soul, with strong [graeco_roman|E] influences. This religion belongs to the Fur migrants who settled in the area west of the Nile. Legend has it that while moving in the desert, the early Fur in the area came across pale-skinned men in ornate dress who appeared to be dying of thirst. When provided with aid, they said that they were tasked with escorting the Sun Emperor - whom they called 'Sol Invictus' - into the desert as per their servitude to their Lord Made Flesh. They also said that he will return one day to rule forever. The nomads were fascinated by these strange light-skinned wanderers, and believed them to be celestial servants of this Sol Invictus. The men were revered by the tribe and treated akin to saints. As time and generations went on, and light-skinned people became more and more familiar to the Fur, they would soon cease to be regarded as celestial beings but rather as the first missionaries to the Fur in spreading the will of Sol Invictus. These first companions of the Sun Emperor are still regarded as messengers of Sol Invictus, who were meant to be found by the Fur. Yet the Followers of the Red Sun, for all their overt worship of the One True Solar God, do not recognize the validity of the current emperor, for they believe that the true Sun Emperor will return one day, and that all others are either imposters or lesser servants awaiting his return."
