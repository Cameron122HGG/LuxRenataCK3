 sol_tsahay_adj: "Ts'ähäy Mahremite"
 sol_tsahay_adherent: "Ts'ähäy Mahremite"
 sol_tsahay_adherent_plural: "Ts'ähäy Mahremites"
 sol_tsahay_desc: "The cult of Ts'ähäy Maḥrem ('Sun Mahrem') is a Local Archaic Solar faith of Martial Soul, with strong [graeco_roman|E] influences. It is an Ethiopian cult based on the Roman worship of Sol Invictus, wherein Maḥrem, the Axumite god of war oft equated with Ares and Mars, takes on Solar attributes and is worshipped in monotheistic fashion. This worship is far more militaristic in nature than its Roman counterpart, owing to Maḥrem's origins. Much like with Solar-Imperialism and Sol Invictus, the ruling dynasty claims direct descent from Ts'ähäy Maḥrem."
 
