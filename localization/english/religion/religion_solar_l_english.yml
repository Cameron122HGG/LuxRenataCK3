 #Solar-Group Faiths
 solar_imperial_faith: "Sol Invictus"
 solar_imperial_faith_adj: "Solarian"
 solar_imperial_faith_adherent: "Solarian"
 solar_imperial_faith_adherent_plural: "Solarians"
 solar_imperial_faith_desc: "The Imperial Cult of the Unconquered Sun is a [mainstream|E] [graeco_roman|E] faith of [statist|E] Soul. The central figure of this faith is Sol Invictus, incarnated in the flesh as the Emperor of Rome. As such, the Emperor is perceived as a divine ruler of unquestionable authority, be it secular or spiritual. Since its codification by Emperor Alexandros IV in the 3rd Century CE, the Solar faith became one of the most widespread and influential religions of the world, touching religious systems from Britannia and Scandinavia all the way to Ethiopia. Two of the most distinguishing practices of the Solarian cult are the celebration of the 25th of December; Dies Natalis Sol Invictus - 'Day of the Invincible Sun's Birth', and the practice of 'going into the desert' - a practice in which the aging emperor abdicates the throne in favor of his heir so that the new Sun would rise as the old one sets. Still, peaceful transitions of power are rather rare, with most emperors either slain in battle or murdered by palace plotters."

