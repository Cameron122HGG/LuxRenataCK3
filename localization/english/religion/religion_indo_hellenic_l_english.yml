 #Sindhian Hinduism
 sindh_indohelen: "Vedanism"
 sindh_indohelen_adj: "Vedanistic"
 sindh_indohelen_adherent: "Vedanist"
 sindh_indohelen_adherent_plural: "Vedanists"
 sindh_indohelen_desc: "Vedanism is a Local Graeco-Roman faith of Statist Soul, characterized by strong Indian influences. The Sindhian school of Hinduism emerged in 155 BCE following Menander's conquest of Sri Lanka. Many Indo-Hellenic reforms, rituals, and interpretations have been merged with the Hindu faith to create one of the largest state-run theological schools in India. Routine rituals and festivals are performed by an ordained member of the Vedic Brotherhood, and often resemble traditional Hindu rituals with a heavy Hellenic influence, in both practice and iconography. The Vedic Brotherhood was founded by Menander in an effort to subdue the local populace and further the Hellenization of India."
