 indoh_zor: "Artanism"
 indoh_zor_adj: "Artanistic"
 indoh_zor_adherent: "Artanist"
 indoh_zor_adherent_plural: "Artanists"
 indoh_zor_desc: "Artanism is a Local Graeco-Roman faith of Statist Soul, characterized by strong Iranian influences, the result of centuries of syncretism between Greeks and Iranians in the Eastern satrapies of Bactria, Sogdiana and Arachosia, unstable lands of volatile leaders and uneasy masters. It is a subtle blend of Hellenic gods and religious patterns with Sogdian Zoroastrian cosmology, old Iranian deities and Far Eastern themes, built around grand public rituals, divination by fire and the worship of great heroic figures considered as Yazatas (minor deities) and Devas (spirits), all falling under the supreme command of Horomasdes (Ahura-Mazda), the force of Arta, Truth, Light and Order in the World, First Emanation of Zarvanes Bythos, Time Primordial.\n\n Artanistic cosmogony was largely shaped by Indohellenic Kings, claiming divine descent from Roxana and Alexander, who recognized the cult's potential as a way to bring their diverse peoples closer together, thanks to this faith's flexibility with foreign deities and its mythical Iranian-Greek ancestry on an almost equal basis. Fire rituals have only grown stronger with time, with sacrificial pyres being set in festivals and celebrations. The King has the monopoly of receiving purification by holy fire every spring under the auspices of state priests. During this ceremony, the King renews Megas Alexandros' role as the defender of Arta by crossing fire untouched while thirty-nine unworthy individuals, holders of lies, perish by his side in the flames of justice." 

 indoh_zor_history: "Long ago, this pantheon of divine beings sealed a pact with the Prophet and King of Men, Megas Alexandros, who became Horomasdes' adoptive Son. When Megas Alexander set fire to Persepolis and defeated the Persian holders of lies, Horomasdes recognized in Him a worthy Hero, the Saoshyant of our Time. Through the great beacon of Persepolis burning, the Light entered Alexander and guided Him to His Fate. His steps led him to the divine Rowkhshan, unborn reincarnation of Athena-Nanaiya, who conquered His heart and brought Him to a higher plane, where He was assigned the most sacred of missions by Horomasdes: to protect Arta, the cosmic order, and banish Lie and Darkness from this world. To accomplish this mission he reached to both the Eastern and Western ends of the Earth, where he fought Ahriman and made him flee, and enclosed many of his beasts behind the Iron Gates of Caucassus Indicus. This is just one of a series of battles, works and quests that the greatest heroes of myth did while inspired by Horomasdes, while Zurvan Bythos brings the Last Day forth, slow but steady, and sets everyone's Destiny. The Artanistic cosmogony was largely shaped by indo_hellenic Kings, claiming divine descent from Rowkhshan and Alexander and thus divine nature, who recognized the cult's potential as a way to bring."
