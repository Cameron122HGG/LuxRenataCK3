 indohelen_desc: "Pantoléteira is a Local Graeco-Roman faith of Traditional Soul, with strong Indian influences. Pantoletéirans worship Zeus-Pantolétēs, the creator and destroyer of worlds, as the Supreme Being, Hypsistos, that exists in all things. In the same fashion as Zeus-Oromasdes works to maintain Arta, truth and cosmic order, the faithful must strive to bring balance into their lives."
