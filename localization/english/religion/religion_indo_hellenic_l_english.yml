 bud_zor: "Mahādīpika"
 bud_zor_adj: "Mahādīpic"
 bud_zor_adherent: "Mahādīpin"
 bud_zor_adherent_plural: "Mahādīpins"
 bud_zor_desc: "The waves of Iranian semi-nomadic horselords who invaded the Indus valley during Late Antiquity brought with them their Mazdan-influenced beliefs. The existing Indo-Greek elites, majoritarily Buddhist, sought to practice and pass on their faith to the new horselords by adapting Buddhist concepts to Zoroastrian language, ideas and rituals. As these Iranian aristocrats gradually indianised, so did the religion made for them, and thus Mahādīpika was born. While dualistic at face value, Mahādīpins don't consider that Duṣtamanyu, the Sanskrit Ahriman, is an entity with agency; rather, the Lie is an illusion, and true enlightenment consists of realising that there is no battle between Light and Dark, everything is Asura Medhā, Ormazd, and just like shadows are a trick of the light, so is Duṣtamanyu. While the monastic class prays and meditates in their monasteries, ever closer to Enlightenment, the common folk continue to maintain sacred fires as a representation of the purest cleansig of the soul, while they try to avoid bad thought and bad deeds, which fill their soul with Druh, Falsehood and Darkness. A soul devoid of Druh can cross the Chinvat Bridge and reincarnate into a being with a purer soul and an easier path towards final enlightenment."
 #bud_zor_religious_text: "Buddhist Tantras"
