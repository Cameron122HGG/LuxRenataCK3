 berber_pagan_old_adj: "Amazigh Old"
 berber_pagan_old_adherent: "Old Amazigh"
 berber_pagan_old_adherent_plural: "Old Amazighs"

 gurzil: "Gurzil"
 gurzil_adj: "Gurzili"
 gurzil_adherent: "Gurzilite"
 gurzil_adherent_plural: "Gurzilites"
 gurzil_desc: "The worship of Gurzil is a Local Saharan religion of Martial Soul. In the Amazigh pantheon, Gurzil is the bull-headed god of war and the son of Amanai, the venerable god of the sun. He is the patron of the raiders and the warrior kings who have preserved the ancient ways of the Berber peoples throughout the ages, a stalwart bastion against the unholy and effete customs of their enemies and a brutal punisher of would-be conquerors. Gurzil's many worshippers are known to bring frightening images of him to war, counting on his protection and might to grant them victory in battle."
