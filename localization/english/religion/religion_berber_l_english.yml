 amanai: "Amanai"
 amanai_adj: "Amanaii"
 amanai_adherent: "Amanaiite"
 amanai_adherent_plural: "Amanaiites"
 amanai_desc: "The worship of Amanai is a Local Saharan religion of Martial Soul, with strong Graeco-Roman influences. Amanai is the god of the setting sun and the central figure of the Berber pantheon, oft equated with Zeus by the Hellenes and the more ancient Amun by their Egyptian neighbors. The defining character of His cult manifested with the arrival of the conquering Megas Alexandros into Egypt, who had marched west into the desert at the head of the greatest army the ancient world had ever known, and having never tasted defeat. With his proclamation as the son of Zeus-Ammon at the Oracle of the Siwa Oasis, he came to be viewed by the Berber tribes of Libya and beyond as Amanai made flesh. The wind carried word of His legendary battles far across the sands, immortalizing him as an icon of veneration among warriors and holy men. Even so many centuries in the wake of his death, there remain those among the Berbers who aspire to match his mighty deeds, to unite their disparate peoples and bring forth an era of change upon the world."
 amanai_old: "Old Amanai"
 amanai_old_adj: "Old Rite Amanaii"
 amanai_old_adherent: "Old Amanaiite"
 amanai_old_adherent_plural: "Old Amanaiites"
 
