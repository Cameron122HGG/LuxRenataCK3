 berber_pagan_adherent_plural: "Amazighs"
 berber_pagan_desc: "The Amazigh faith is a Local Saharan religion of Traditional Soul. It is the ancient polytheistic belief system of the Berber people, and it has been shaped as much by the worship of indigenous deities as it has been by the influence of foreign pantheons from across the Mediterranean. Its main gods include Mastiman, equated with the Greek Mercury, Amanai, equated with the Egyptian Amun, and Gurzil, equated to the Roman Mars. Practices include elaborate burial rites, in which the dead are buried with ostrich egg shells, weapons, and jewelry. The followers of the Amazigh faith also view the spirits of their ancestors to be gods, and will even spend the night in their tombs seeking the wisdom of the departed."
