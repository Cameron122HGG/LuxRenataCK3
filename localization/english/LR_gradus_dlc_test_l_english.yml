l_english:
 # LR 2026-11-25 GRADUS DLC test (tools/gradus_dlc_test/build_gradus_dlc_test.py)
 rule_lr_gradus_dlc_test: "GRADUS DLC Test"
 setting_lr_gradus_dlc_owned: "Owned DLC"
 setting_lr_gradus_dlc_owned_desc: "GRADUS uses the DLC you own. Leave this on for normal games."
 setting_lr_gradus_dlc_none: "As if no DLC"
 setting_lr_gradus_dlc_none_desc: "#high Testing only.#! The mod acts as if you had none of #high Roads to Power#!, #high All Under Heaven#! and #high Silk & Silver#!: every ruler sits on their group's plain rank. It can only take DLC away, and the game itself still runs the DLC you own."
 setting_lr_gradus_dlc_rtp: "As if Roads to Power only"
 setting_lr_gradus_dlc_rtp_desc: "#high Testing only.#! The mod acts as if you had #high Roads to Power#! but not #high All Under Heaven#! or #high Silk & Silver#!: administrative and imperial ranks become #high Autocratic#!."
 setting_lr_gradus_dlc_rtp_auh: "As if Roads to Power + All Under Heaven"
 setting_lr_gradus_dlc_rtp_auh_desc: "#high Testing only.#! The mod acts as if you had #high Roads to Power#! and #high All Under Heaven#! but not #high Silk & Silver#!: the full ladder except the Roman and Hellenistic universal ranks."
 LR_debug_gradus_dlc_decision_confirm: "Switch and re-run the normalizer"
 LR_debug_gradus_dlc_owned_decision: "Debug: GRADUS as owned DLC"
 LR_debug_gradus_dlc_owned_decision_desc: "Make the mod act as if you had the DLC you own, then re-run the GRADUS normalizer for every ruler (independent rulers first, then vassals by tier). Overrides the game rule for this save."
 LR_debug_gradus_dlc_none_decision: "Debug: GRADUS as no DLC"
 LR_debug_gradus_dlc_none_decision_desc: "Make the mod act as if you had no Roads to Power, All Under Heaven or Silk & Silver, then re-run the GRADUS normalizer for every ruler (independent rulers first, then vassals by tier). Overrides the game rule for this save."
 LR_debug_gradus_dlc_rtp_decision: "Debug: GRADUS as RtP only"
 LR_debug_gradus_dlc_rtp_decision_desc: "Make the mod act as if you had Roads to Power only, then re-run the GRADUS normalizer for every ruler (independent rulers first, then vassals by tier). Overrides the game rule for this save."
 LR_debug_gradus_dlc_rtp_auh_decision: "Debug: GRADUS as RtP + AUH"
 LR_debug_gradus_dlc_rtp_auh_decision_desc: "Make the mod act as if you had Roads to Power and All Under Heaven, no Silk & Silver, then re-run the GRADUS normalizer for every ruler (independent rulers first, then vassals by tier). Overrides the game rule for this save."
