l_english:
 # LR 2026-11-25 GRADUS window (tools/gradus_window/build_gradus_window.py)
 game_concept_gradus: "GRADUS"
 game_concept_gradus_i: "GRADUS"
 game_concept_gradus_desc: "GRADUS (Latin #italic gradus#!, a step, a rank) is how [governments|E] work in Lux Renata. Every [culture|E] belongs to a [government_group|E], and each group is a ladder of [gradus_ranks|E] that a [realm|E] climbs by [decision|E].\n\nClick your government's icon beside your realm's name in your character window to open the GRADUS window."
 game_concept_government_group: "Government Group"
 game_concept_government_groups: "Government Groups"
 game_concept_government_group_desc: "A Government Group is a family of [governments|E]. A [culture|E]'s government [tradition|E] picks its group: Classical, Western, Persianate, Malkuta, Nilotic, Sudanic, Indic, Sinic, Japanese or Barbarian. Muslim rulers use the Iqta group whatever their culture, and the Sacral Kingdom of Gaul has its own.\n\nYour group decides which government you hold at each [gradus_rank|E]."
 game_concept_gradus_rank: "GRADUS Rank"
 game_concept_gradus_ranks: "GRADUS Ranks"
 game_concept_gradus_rank_desc: "Each [government_group|E] is a ladder of five ranks: [gradus_plain_rank|E], [gradus_dynastic_rank|E], [gradus_administrative_rank|E], [gradus_imperial_rank|E] and [gradus_universal_rank|E].\n\nA [realm|E] moves up by [decision|E], and falls back when it loses what a rank needs: a DLC, a [title|E] or a [faith|E]."
 game_concept_gradus_plain_rank: "Plain Rank"
 game_concept_gradus_plain_rank_desc: "The Plain rank is a group's base government, on the [feudal|E] mechanic (Iqta on the [clan|E] mechanic). Every group falls back to it without the DLC."
 game_concept_gradus_dynastic_rank: "Dynastic Rank"
 game_concept_gradus_dynastic_rank_desc: "The Dynastic rank adds [noble_families|E] and [Concept('estate','estates')|E] while staying [feudal|E]. It needs Roads to Power and All Under Heaven; without them it becomes its Plain twin."
 game_concept_gradus_administrative_rank: "Administrative Rank"
 game_concept_gradus_administrative_rank_desc: "The Administrative rank runs on the [administrative|E] mechanic: [governors|E], [provinces|E], [noble_families|E] and [title_men_at_arms|E]. It is taken through Convert to Administrative, which offers each group only its own administrations, and a [vassal|E] only their [top_liege|E]'s.\n\nWith Roads to Power alone, every group shares one: [rtp_autocratic|E]."
 game_concept_gradus_imperial_rank: "Imperial Rank"
 game_concept_gradus_imperial_rank_desc: "The Imperial rank sits above the administrations and is earned by [decision|E] at [empire|E] tier. It needs All Under Heaven."
 game_concept_gradus_universal_rank: "Universal Rank"
 game_concept_gradus_universal_rank_desc: "The Universal rank is a claim to rule the whole world, not one realm among others. Most universal ranks follow an [hegemony|E] title; the rest are taken by [decision|E] at hegemony tier.\n\nIt needs All Under Heaven; the Roman and Hellenistic ones need Roads to Power, Silk and Silver and All Under Heaven."
 game_concept_foreign_customs: "Foreign Customs"
 game_concept_foreign_customs_desc: "A feudal [vassal|E] of another [government_group|E] than their [top_liege|E] resents being ruled by foreign customs: -10 [opinion|E] of the top liege, -20 under the One Custom [realm_customs_law|E] and none under Many Customs.\n\nThe vassal can Adopt the Customs of the Realm, or the top liege can Demand Conformity."
 game_concept_realm_of_many_customs: "Realm of Many Customs"
 game_concept_realm_of_many_customs_desc: "A [realm|E] with 3 or more feudal [vassals|E] of other [government_groups|E] than its ruler pays for it: -5% vassal [taxes|E] and [levies|E], or -10% with 6 or more. The Many Customs [realm_customs_law|E] spares the resentment of [foreign_customs|E] but raises this cost to -10% or -15%."
 game_concept_realm_customs: "Realm Customs"
 game_concept_realm_customs_law: "Realm Customs Law"
 game_concept_realm_customs_desc: "The Realm Customs [law|E] ([kingdom|E] tier and up) sets how a mixed [realm|E] treats feudal [vassals|E] of other [government_groups|E]:\nMany Customs: no resentment, but a heavier cost (-10% or -15%)\nCustomary (the default): [foreign_customs|E] and the [realm_of_many_customs|E] apply\nOne Custom: sharper resentment, and each year vassals are pressed to conform\n\nAdministrative vassals always follow the [top_liege|E]'s administration."
 game_concept_gradus_anarchy: "Anarchy"
 game_concept_gradus_anarchy_desc: "A [culture|E] without a government [tradition|E] lives in Anarchy, with penalties until it takes one up."
