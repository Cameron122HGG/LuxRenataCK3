l_english:
 # LR 2026-11-06: the casus belli of the Roman World and Hellenistic World situations
 LR_claim_the_purple_cb:0 "Claim the Purple"
 LR_CLAIM_THE_PURPLE_CB_NAME:0 "Claim the Purple"
 LR_CLAIM_THE_PURPLE_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]Usurpation of [ATTACKER.GetShortUIName]"
 LR_CLAIM_THE_PURPLE_WAR_NAME_BASE:0 "Usurpation of [ATTACKER.GetShortUIName]"
 LR_claim_the_purple_cb_victory_desc:0 "[attacker.GetShortUIName|U] seizes the throne: every title and vassal of [defender.GetShortUIName] passes to [attacker.GetHerHim], and the deposed emperor is thrown into [attacker.GetHerHis] dungeon."
 LR_claim_the_purple_cb_white_peace_desc:0 "The usurpation fails without a victor, and [defender.GetShortUIName] keeps the purple."
 LR_claim_the_purple_cb_defeat_desc:0 "The usurpation is crushed: [attacker.GetShortUIName] pays reparations and loses prestige."
 LR_seize_the_diocese_cb:0 "Seize the Diocese"
 LR_SEIZE_THE_DIOCESE_CB_NAME:0 "Seize [TITLE.GetNameNoTier]"
 LR_SEIZE_THE_DIOCESE_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')][ATTACKER.GetPrimaryTitle.GetAdjective] Seizure of [TITLE.GetName]"
 LR_SEIZE_THE_DIOCESE_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] Seizure of [TITLE.GetName]"
 LR_seize_the_diocese_cb_victory_desc:0 "[attacker.GetShortUIName|U] takes the lands of [defender.GetShortUIName] in the kingdom, and the diocese title too if [attacker.GetSheHe] may hold Roman titles."
 LR_seize_the_diocese_cb_white_peace_desc:0 "The warlords settle nothing; the land stays where it was."
 LR_seize_the_diocese_cb_defeat_desc:0 "The seizure fails, and [attacker.GetShortUIName] pays reparations."
 LR_seize_the_diocese_cb_title_tt:0 "If it is a Roman diocese, the victor gets the diocese title as well, but only if allowed to hold Roman titles"
 LR_war_of_the_successors_cb:0 "War of the Successors"
 LR_WAR_OF_THE_SUCCESSORS_CB_NAME:0 "Claim [TITLE.GetNameNoTier]"
 LR_WAR_OF_THE_SUCCESSORS_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]War of the Successors for [TITLE.GetName]"
 LR_WAR_OF_THE_SUCCESSORS_WAR_NAME_BASE:0 "War of the Successors for [TITLE.GetName]"
 LR_war_of_the_successors_cb_victory_desc:0 "[attacker.GetShortUIName|U] takes [defender.GetShortUIName]'s line and its crown, and the vassals within it."
 LR_war_of_the_successors_cb_white_peace_desc:0 "Neither successor prevails, and the lines remain as they were."
 LR_war_of_the_successors_cb_defeat_desc:0 "The claim fails: [attacker.GetShortUIName] pays reparations and loses prestige."
 LR_war_of_the_successors_cb_vassals_tt:0 "The defender's vassals based inside the title follow it to the victor"
