l_english:
 # LR 2026-11-25 Politeia road to the Hellenic League (tools/politeia/build_hellenic_league_road.py)
 LR_HELLENIC_LEAGUE_NAME: "Hellenic League"
 LR_found_hellenic_league_politeia_decision: "Found the Hellenic League"
 LR_found_hellenic_league_politeia_decision_desc: "The free cities of the Greeks have traded and quarrelled apart for too long. Let them swear one oath, keep one fleet and one purse, and stand together against the kings."
 LR_found_hellenic_league_politeia_decision_tooltip: "Found the Hellenic League, a [Concept('trade_league','Trade League')|E] of the free Greek cities, led by your city."
 LR_found_hellenic_league_politeia_decision_confirm: "Let the cities swear"
 LR_found_hellenic_league_politeia_effect_tt: "The #high Hellenic League#! is founded as a Trade League led by your city. Every other independent Politeia that does not dislike you joins it."
 LR_hellenic_league_partner_tt: "Another independent Politeia outside any league does not dislike you"
 LR_join_hellenic_league_politeia_decision: "Join the Hellenic League"
 LR_join_hellenic_league_politeia_decision_desc: "The free cities stand together in the Hellenic League. Our city should stand with them."
 LR_join_hellenic_league_politeia_decision_tooltip: "Your city joins the Hellenic League."
 LR_join_hellenic_league_politeia_decision_confirm: "We join the League"
 LR_join_hellenic_league_politeia_effect_tt: "Your city joins the #high Hellenic League#!."
 LR_proclaim_league_hegemony_decision: "Proclaim the Hegemony of the League"
 LR_proclaim_league_hegemony_decision_desc: "The League has grown strong and of one mind. Its leading city may now take up the hegemony, as Athens once did, and give the Greeks one state above the cities."
 LR_proclaim_league_hegemony_decision_tooltip: "Your city takes the hegemony of the Hellenic League, and the League becomes a realm of its own."
 LR_proclaim_league_hegemony_decision_confirm: "Hegemony for the League"
 LR_proclaim_league_hegemony_athens_tt: "Athens is held by a member of the Hellenic League"
