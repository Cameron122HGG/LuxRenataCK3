l_english:
 # Lux Renata bookmark framework (TEMP)
 bm_lr_4672:0 "Lord of the Earth"
 bm_lr_4672_desc:0 "At Babylon, Alexander rules almost the whole known world. His generals, his kin and the kings at the edge of his empire wait to see what he will do with it."
 bm_lr_4682:0 "Death of the Conqueror"
 bm_lr_4682_desc:0 "Megas Alexandros is dead, and the boy Alexandros IV is raised to the throne under a regent. Perdikkas, Antipatros and Polyperchon will each try to hold the empire together, and each will fail."
 bm_lr_4687:0 "The Olympos Foothills"
 bm_lr_4687_desc:0 "After Kassandros wins the regency, Polyperchon, Philip and Olympias march on Macedon with an Epirote army. At the foothills of Olympos the veterans refuse to fight under the colours of Alexander's son, and Kassandros is left uncontested regent of the empire."
 bm_lr_4689:0 "Victors and Saviors"
 bm_lr_4689_desc:0 "Seleukos Nikator and Ptolemaios Soter defeat Demetrios Poliorketes at Gaza. The Seleukid Era begins, and the Successors divide the empire in all but name."
 bm_lr_4697:0 "Rise of Rome"
 bm_lr_4697_desc:0 "While the Successors fight over Alexander's inheritance, a republic on the Tiber begins to look beyond Italy."
 bm_lr_4700:0 "After Ipsos"
 bm_lr_4700_desc:0 "The Successors, Kassandros among them, have destroyed the Antigonids at Ipsos. Letters in Antigonos' tent reveal that Alexandros IV wrote to him in secret, and the Megas Basileus is placed under house arrest in Amphipolis."
 bm_lr_4957:0 "Sic Semper Tyrannis"
 bm_lr_4957_desc:0 "The Republic dies with Caesar on the Ides of March. In the East, Kleopatra holds the Ptolemaic throne, and the heirs of Alexander watch Rome turn on itself."
 bm_lr_4959:0 "Second Triumvirate"
 bm_lr_4959_desc:0 "Octavian and Marcus Antonius divide the Roman world between them, under a commission for restoring the constitution of the Republic."
 bm_lr_5263:0 "Empire of the Sun"
 bm_lr_5263_desc:0 "Odaenathus of Palmyra has overrun Syria and been recognised by Gallienus. Rome is held together by emperors in Gaul, Palmyra and the Maghreb, each defending a piece of it."
 bm_lr_5476:0 "The Scirian Crisis"
 bm_lr_5476_desc:0 "Unpaid and landless, Odoacer and the Germanic auxiliaries of Italy revolt and besiege the emperor in Ravenna. Orestes and the Senate turn to Theoderic and his Ostrogoths to save the West."
 bm_lr_5477:0 "Year of Four Emperors"
 bm_lr_5477_desc:0 "Orestes is lynched at the Circus Maximus, Romulus Augustulus gives up the purple, and the Senate crowns Valentinian V. Within months he falls to the Vandals in Sardinia and Syagrius claims the throne in Gaul."
 bm_lr_5501:0 "King of Italy"
 bm_lr_5501_desc:0 "Riots in Rome leave Avitus II dead in the Tiber and Valentinian VII on the throne. Theoderic seizes the cities of the Po Valley and declares himself King of Italy at Ravenna."
 bm_lr_5800:0 "Emperor of the Romans"
 bm_lr_5800_desc:0 "With Rome fallen to the Eastern pagans, the Pope crowns Charlemagne Emperor of the Romans at Aachen. Witukind holds Saxony against him, and Empress Eirene rules in Constantinople."
 bm_lr_5867:0 "Nightfall"
 bm_lr_5867_desc:0 "The light of Classical Antiquity is fading. Charlemagne's empire is breaking apart, and the old powers of East and West are spent."
 bm_lr_5923:0 "The Palatine Revolt"
 bm_lr_5923_desc:0 "Godfrey of Julich, Eberhard of Franconia and Heinrich of the Alamanni raise the largest revolt the Franks have ever faced. From the Alps to the North Sea, Germania burns."
