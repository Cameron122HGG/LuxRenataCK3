 LR_imperial_residence_modifier: "Imperial Residence"
 LR_imperial_residence_modifier_desc: "This ruler keeps the Imperial Court at one of the great residences of the Empire."
 LR_move_imperial_residence_decision: "Move the Imperial Residence"
 LR_move_imperial_residence_decision_desc: "The Emperors never kept one seat: the court followed them to Trier and Mediolanum, to Sirmium, Nicomedia and Antioch, wherever the frontiers needed them. We may move the Sacred Court to another of the imperial residences."
 LR_move_imperial_residence_decision_tooltip: "Move your capital and the Imperial Court to another imperial residence"
 LR_move_imperial_residence_decision_confirm: "The court moves"
 LR_move_imperial_residence_decision_valid_tt: "You hold an imperial residence of your court that is not your capital"
 LR_move_imperial_residence_decision_wait_tt: "The court has not moved in the last 10 years"
 LR_move_imperial_residence_decision_effect_tt: "Choose the residence: your capital moves there and the Imperial Court takes its name"
 LR_imperial_court.0001.t: "The Sacred Court Moves"
 LR_imperial_court.0001.desc: "The palace officials, the guard and the treasuries are ready to follow [ROOT.Char.GetTitledFirstNameNoTooltip]. Where shall the Imperial Court reside?"
 LR_imperial_court.0001.stay: "We stay where we are."
 LR_evolve_regional_hegemony_tt: "You become the Augustus of the new hegemony. The restored empire stays beside it as the empire tier over the region's kingdoms, until its prefecture is restored and #V Reorganize our Imperium#! makes it the Imperial Court"
