 LR_reorganize_gallic_imperium_decision: "Reorganize our Imperium"
 LR_reorganize_gallic_imperium_decision_desc: "Postumus' Gallic Empire held the Gauls, Hispania and Britain from Colonia and Augusta Treverorum, with its own consuls, praetorians and mint. With its prefecture restored, [GetTitleByKey('e_gallic_empire').GetName] no longer stands between us and the provinces: it becomes the Sacred Court itself, following the Augustus from residence to residence."
 LR_reorganize_gallic_imperium_decision_tooltip: "Make [GetTitleByKey('e_gallic_empire').GetName] the Imperial Court of the Gallic Empire"
 LR_reorganize_gallic_imperium_decision_confirm: "Order the Imperium"
 LR_reorganize_gallic_imperium_decision_effect_tt: "[GetTitleByKey('e_gallic_empire').GetName] becomes the Imperial Court, named after your residence; you become Augustus"
 LR_reorganize_gallic_shadow_tt: "You hold [GetTitleByKey('e_gallic_empire').GetName], or nobody does"
 LR_reorganize_gallic_prefecture_tt: "All the dioceses of the Prefecture of the Gauls ([GetTitleByKey('k_diocese_lugdunensis').GetNameNoTier], [GetTitleByKey('k_diocese_viennensis').GetNameNoTier], [GetTitleByKey('k_diocese_hispania').GetNameNoTier], [GetTitleByKey('k_diocese_britannia').GetNameNoTier]) are held in your realm"
 LR_reorganize_palmyrene_imperium_decision: "Reorganize our Imperium"
 LR_reorganize_palmyrene_imperium_decision_desc: "Zenobia ruled the Levant and Egypt from the oasis city, in the name of her son, and minted coins as Augusta. With its prefecture restored, [GetTitleByKey('e_palmyrene_empire').GetName] no longer stands between us and the provinces: it becomes the Sacred Court itself, following the Augustus from residence to residence."
 LR_reorganize_palmyrene_imperium_decision_tooltip: "Make [GetTitleByKey('e_palmyrene_empire').GetName] the Imperial Court of the Palmyrene Empire"
 LR_reorganize_palmyrene_imperium_decision_confirm: "Order the Imperium"
 LR_reorganize_palmyrene_imperium_decision_effect_tt: "[GetTitleByKey('e_palmyrene_empire').GetName] becomes the Imperial Court, named after your residence; you become Augustus"
 LR_reorganize_palmyrene_shadow_tt: "You hold [GetTitleByKey('e_palmyrene_empire').GetName], or nobody does"
 LR_reorganize_palmyrene_prefecture_tt: "All the dioceses of the Prefecture of the East ([GetTitleByKey('k_diocese_syria').GetNameNoTier], [GetTitleByKey('k_diocese_palestine').GetNameNoTier], [GetTitleByKey('k_diocese_aegyptus').GetNameNoTier]) are held in your realm"
 LR_reorganize_brittanic_imperium_decision: "Reorganize our Imperium"
 LR_reorganize_brittanic_imperium_decision_desc: "Carausius and Allectus ruled the Britains from Londinium as Augusti of their own, until Constantius crossed the Channel. With its prefecture restored, [GetTitleByKey('e_brittanic_empire').GetName] no longer stands between us and the provinces: it becomes the Sacred Court itself, following the Augustus from residence to residence."
 LR_reorganize_brittanic_imperium_decision_tooltip: "Make [GetTitleByKey('e_brittanic_empire').GetName] the Imperial Court of the Britannic Empire"
 LR_reorganize_brittanic_imperium_decision_confirm: "Order the Imperium"
 LR_reorganize_brittanic_imperium_decision_effect_tt: "[GetTitleByKey('e_brittanic_empire').GetName] becomes the Imperial Court, named after your residence; you become Augustus"
 LR_reorganize_brittanic_shadow_tt: "You hold [GetTitleByKey('e_brittanic_empire').GetName], or nobody does"
 LR_reorganize_brittanic_prefecture_tt: "All the dioceses of the Prefecture of the Britains ([GetTitleByKey('k_diocese_britannia').GetNameNoTier], [GetTitleByKey('k_diocese_caledonia').GetNameNoTier], [GetTitleByKey('k_diocese_hibernia').GetNameNoTier]) are held in your realm"
 LR_reorganize_southern_imperium_decision: "Reorganize our Imperium"
 LR_reorganize_southern_imperium_decision_desc: "Lepcis Magna gave Rome the Severi; Carthage was the second city of the West. Africa can be an empire of its own. With its prefecture restored, [GetTitleByKey('e_southern_roman_empire').GetName] no longer stands between us and the provinces: it becomes the Sacred Court itself, following the Augustus from residence to residence."
 LR_reorganize_southern_imperium_decision_tooltip: "Make [GetTitleByKey('e_southern_roman_empire').GetName] the Imperial Court of the Southern Roman Empire"
 LR_reorganize_southern_imperium_decision_confirm: "Order the Imperium"
 LR_reorganize_southern_imperium_decision_effect_tt: "[GetTitleByKey('e_southern_roman_empire').GetName] becomes the Imperial Court, named after your residence; you become Augustus"
 LR_reorganize_southern_shadow_tt: "You hold [GetTitleByKey('e_southern_roman_empire').GetName], or nobody does"
 LR_reorganize_southern_prefecture_tt: "All the dioceses of the Prefecture of Africa ([GetTitleByKey('k_diocese_africa').GetNameNoTier], [GetTitleByKey('k_diocese_mauretania').GetNameNoTier]) are held in your realm"
 e_praetorian_prefecture_britannia: "Britannian Prefecture"
 e_praetorian_prefecture_britannia_adj: "Britannian"
 e_lepcis: "Lepcis"
 e_lepcis_adj: "Lepcitan"
 LR_restore_african_dioceses_decision: "Restore the African Dioceses"
 LR_restore_african_dioceses_decision_desc: "Carthage and the cities of the Severi were the granary and the second heart of the West. We hold the African provinces: let them be governed as dioceses again."
 LR_restore_african_dioceses_decision_tooltip: "Restore the dioceses of Africa and Mauretania"
 LR_restore_african_dioceses_decision_effect_tt: "The dioceses of [GetTitleByKey('k_diocese_africa').GetNameNoTier] and [GetTitleByKey('k_diocese_mauretania').GetNameNoTier] are restored for you and sorted into the [GetTitleByKey('e_praetorian_prefecture_africa').GetNameNoTier] under your hegemony"
 LR_evolve_lepcis_decision: "Proclaim the Southern Roman Empire"
 LR_evolve_lepcis_decision_confirm: "Take up the purple"
 LR_restore_african_dioceses_decision_confirm: "Govern Africa as Rome did"
 e_lepcis_article: ""
 LR_evolve_lepcis_decision_desc: "The heirs of Septimius Severus still rule from Lepcis Magna. Master of Africa and Mauretania, we can take up the purple as Augustus of the Southern Roman Empire."
 LR_evolve_lepcis_decision_tooltip: "Turn [GetTitleByKey('e_lepcis').GetName] into [GetTitleByKey('e_southern_roman_empire').GetName]."
