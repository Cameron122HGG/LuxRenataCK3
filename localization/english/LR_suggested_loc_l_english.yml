 # Nickname descriptions
 nick_plantapilosa_desc: "'Hairy-Sole': it is whispered that hair grows even on the soles of [CHARACTER.GetShortUINameNoTooltipNoFormat]'s feet."
 nick_cathalon_desc: "An old name of the country, borne by [CHARACTER.GetShortUINameNoTooltipNoFormat] as proudly as any title."
 nick_plantagenet_desc: "For the sprig of broom, the planta genista, that [CHARACTER.GetShortUINameNoTooltipNoFormat] wears as [CharYourHerHis(CHARACTER)] badge."
 nick_the_buck_desc: "Lean, quick and proud, [CHARACTER.GetShortUINameNoTooltipNoFormat] carries [CharYourHerHis(CHARACTER)] head like a young buck in the forest."
 nick_the_stag_desc: "Like the king of the forest, [CHARACTER.GetShortUINameNoTooltipNoFormat] is proud, fierce and not to be crossed in rutting season."
 nick_the_deer_desc: "Gentle and watchful, [CHARACTER.GetShortUINameNoTooltipNoFormat] is said to startle at shadows and run from trouble."
 nick_the_goat_desc: "Stubborn, sure-footed and given to butting heads, [CHARACTER.GetShortUINameNoTooltipNoFormat] has earned the name honestly."
 nick_the_lamb_desc: "Meek and mild, [CHARACTER.GetShortUINameNoTooltipNoFormat] is thought by some to be too gentle for this world."
 nick_the_thunder_desc: "When [CHARACTER.GetShortUINameNoTooltipNoFormat] speaks, the hall shakes; when [CHARACTER.GetShortUINameNoTooltipNoFormat] rides to war, the ground does."
 nick_the_towhead_desc: "For [CharYourHerHis(CHARACTER)] pale, flaxen hair, bright as tow on the spindle."
 nick_tallaferro_desc: "'Cut-iron': it is said that [CHARACTER.GetShortUINameNoTooltipNoFormat] once cleaved through a coat of mail with a single blow."
 nick_fierabras_desc: "'Proud-arm': [CHARACTER.GetShortUINameNoTooltipNoFormat] is as strong in the arm as the giant of the old romances."
 nick_taillefer_desc: "'Cut-iron': it is said that [CHARACTER.GetShortUINameNoTooltipNoFormat] once cleaved an enemy's helm and skull with a single blow."
 nick_ironarm_desc: "An arm like iron, and a grip no one has ever broken."
 nick_the_seneschal_desc: "Long service at the head of a great household has made the title of seneschal part of [CHARACTER.GetShortUINameNoTooltipNoFormat]'s name."
 nick_curtus_desc: "'The Short': what [CHARACTER.GetShortUINameNoTooltipNoFormat] lacks in height is made up for in temper."
 nick_crassus_desc: "'The Fat', or 'the Thick', depending on whom one asks, and whether [CHARACTER.GetShortUINameNoTooltipNoFormat] is in earshot."
 nick_arista_desc: "An old Basque name, said to mean 'the Oak', for [CHARACTER.GetShortUINameNoTooltipNoFormat]'s strength and stubbornness."
 nick_azcon_desc: "An old Basque byname, said to mean 'the Dart', for [CHARACTER.GetShortUINameNoTooltipNoFormat]'s swiftness."
 nick_mitarra_desc: "An old Basque byname, given to [CHARACTER.GetShortUINameNoTooltipNoFormat] in the hills and never shaken off."
 nick_heavysword_desc: "For the great blade [CHARACTER.GetShortUINameNoTooltipNoFormat] carries, which few others can lift."
 nick_the_fay_desc: "There is something otherworldly about [CHARACTER.GetShortUINameNoTooltipNoFormat]; the common folk whisper of fairy blood."
 nick_ariovistus_desc: "After the great Germanic king who crossed the Rhine to challenge Caesar himself."
 nick_thumelicus_desc: "After the son of Arminius, raised a captive among the Romans."
 nick_arminius_desc: "After the Cheruscan chief who destroyed three Roman legions in the Teutoburg Forest."
 nick_the_cherusc_desc: "Proud of [CharYourHerHis(CHARACTER)] descent from the Cherusci, [CHARACTER.GetShortUINameNoTooltipNoFormat] never lets anyone forget it."
 nick_granddent_desc: "'Big-Tooth': [CHARACTER.GetShortUINameNoTooltipNoFormat] has a smile few forget, however hard they try."
 nick_the_allfather_desc: "Wise, one-eyed in judgement and father of many, [CHARACTER.GetShortUINameNoTooltipNoFormat] is likened to the lord of the gods himself."
 nick_lady_of_the_slain_desc: "On the battlefield, [CHARACTER.GetShortUINameNoTooltipNoFormat] chooses who lives and who dies, as the valkyries do."
 nick_the_skald_desc: "Few can match [CHARACTER.GetShortUINameNoTooltipNoFormat]'s gift for verse, whether praising a friend or mocking a foe."
 nick_the_thunderer_desc: "Mighty in war and terrible in anger, [CHARACTER.GetShortUINameNoTooltipNoFormat] is likened to the thunder god."
 nick_the_burgundian_desc: "For [CharYourHerHis(CHARACTER)] Burgundian blood, which [CHARACTER.GetShortUINameNoTooltipNoFormat] wears proudly."
 nick_the_scandian_desc: "For [CharYourHerHis(CHARACTER)] roots in the far north, in Scandia beyond the sea."
 nick_the_jute_desc: "For [CharYourHerHis(CHARACTER)] Jutish blood and the old homeland across the sea."
 nick_the_angle_desc: "For [CharYourHerHis(CHARACTER)] Anglian blood and the old homeland across the sea."
 nick_campidoctor_desc: "Like the drill-masters of the old legions, [CHARACTER.GetShortUINameNoTooltipNoFormat] has made soldiers out of farmers."
 nick_sidi_desc: "'My Lord': a title of respect given to [CHARACTER.GetShortUINameNoTooltipNoFormat] by friend and foe alike."
 nick_thiufadus_desc: "Once a leader of a thousand men in the Gothic manner, [CHARACTER.GetShortUINameNoTooltipNoFormat] keeps the title still."
 nick_the_paladin_desc: "Champion of the faith and of the crown, [CHARACTER.GetShortUINameNoTooltipNoFormat] is held up as a model of knightly virtue."
 nick_bradamante_desc: "Like the warrior-maiden of the romances, [CHARACTER.GetShortUINameNoTooltipNoFormat] fights with a courage that shames many men."
 nick_muinremuir_desc: "'Great-Neck': a name from the old Irish tales, for [CHARACTER.GetShortUINameNoTooltipNoFormat]'s bull-like strength."
 nick_reti_desc: "An old Magyar byname, given to [CHARACTER.GetShortUINameNoTooltipNoFormat] on the open plain and never shaken off."
 nick_cerr_desc: "'The Left-Handed', or 'the Crooked', depending on whom one asks, and whether [CHARACTER.GetShortUINameNoTooltipNoFormat] is listening."
 nick_crandomna_desc: "An old Irish byname, given to [CHARACTER.GetShortUINameNoTooltipNoFormat] long ago and remembered still."
 nick_gul_desc: "'The Rose': for [CHARACTER.GetShortUINameNoTooltipNoFormat]'s beauty, and for the thorns that come with it."
 nick_senator_desc: "Proud of the senatorial blood of Rome, [CHARACTER.GetShortUINameNoTooltipNoFormat] takes the old title as [CharYourHerHis(CHARACTER)] own."
 nick_boethius_desc: "Like the great philosopher of the Gothic court, [CHARACTER.GetShortUINameNoTooltipNoFormat] is learned, wise and perhaps unlucky."

