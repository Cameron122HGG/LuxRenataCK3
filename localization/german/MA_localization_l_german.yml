l_german:
 #################
 ##MEDIEVAL ARTS##
 #################

 ###########
 #GAME RULE#
 game_rule_category_MedievalArts: "Medieval Arts"
 rule_MA_monuments: "$game_rule_category_MedievalArts$: Monumente"
 setting_MA_monuments_all: "$game_rule_category_MedievalArts$ bevorzugt"
 setting_MA_monuments_all_desc: "#help Empfohlen:#! Bei Überschneidungen werden [special_buildings|E] aus #V $game_rule_category_MedievalArts$#! denen des Grundspiels vorgezogen."
 setting_MA_monuments_selection: "Grundspiel bevorzugt"
 setting_MA_monuments_selection_desc: "Bei Überschneidungen werden [special_buildings|E] aus dem #V Grundspiel#! denen aus $game_rule_category_MedievalArts$ vorgezogen."
 rule_MA_ahistorical_monuments: "$game_rule_category_MedievalArts$: Unwahrscheinlichkeit"
 setting_MA_ahistorical_monuments_yes: "Unwahrscheinliche Monumente erlaubt"
 setting_MA_ahistorical_monuments_yes_desc: "#help Empfohlen:#! [special_buildings|E], die als #italic unwahrscheinlich#! gelten könnten, sind erlaubt."
 setting_MA_ahistorical_monuments_no: "Unwahrscheinliche Monumente ausgeschlossen"
 setting_MA_ahistorical_monuments_no_desc: "[special_buildings|E], die als #italic unwahrscheinlich#! gelten könnten, sind #bold nicht#! erlaubt."
 rule_MA_creator_pack: "$game_rule_category_MedievalArts$: DLCs"
 setting_MA_creator_pack_yes: "DLCs bevorzugt"
 setting_MA_creator_pack_yes_desc: "#help Empfohlen:#! [special_buildings|E] aus #V DLCs#! wie #V Holy Buildings#! werden – sofern aktiviert – denen aus $game_rule_category_MedievalArts$ vorgezogen."
 setting_MA_creator_pack_no: "$setting_MA_monuments_all$"
 setting_MA_creator_pack_no_desc: "Bei Überschneidungen werden [special_buildings|E] aus #V $game_rule_category_MedievalArts$#! denen aus #V DLCs#! vorgezogen."

 
 ###################
 #SPECIAL BUILDINGS#

 #Rock of Cashel
 MA_rock_cashel_district: "$building_type_MA_rock_cashel$"
 MA_rock_cashel_district_desc: "$building_type_MA_rock_cashel_desc$"
 building_type_MA_rock_cashel: "Rock of Cashel"
 building_type_MA_rock_cashel_desc: "Auf einem felsigen Hügel inmitten grüner Weiden erhebt sich der Rock of Cashel, eine uneinnehmbare steinerne Festung mit zahlreichen Mauerringen, die zugleich als Burg und Palast dienen kann. Sie beherbergt außerdem eines der einflussreichsten Klöster Irlands und eine Pfalzkapelle, deren Gewölbe mit prächtigen Fresken aus dem Leben des heiligen Patrick geschmückt ist."
 MA_rock_cashel: "$building_type_MA_rock_cashel$"
 
 #St Donatus of Zadar
 MA_st_donatus_district: "$building_type_MA_st_donatus$"
 MA_st_donatus_district_desc: "$building_type_MA_st_donatus_desc$"
 building_type_MA_st_donatus: "Kirche des heiligen Donatus in Zadar"
 building_type_MA_st_donatus_desc: "Eine prachtvolle Rundkirche aus weißem Stein, die im Sonnenlicht über den Wellen der Adria schimmert. Ihr Vorbild war die Pfalzkapelle Karls des Großen; ein wunderschönes goldenes Mosaik schmückt ihr Inneres."
 MA_st_donatus: "$building_type_MA_st_donatus$"
 
 #Aula Palatina
 MA_aula_palatina_district: "$building_type_MA_aula_palatina$"
 MA_aula_palatina_district_desc: "$building_type_MA_aula_palatina_desc$"
 building_type_MA_aula_palatina: "Aula Palatina"
 building_type_MA_aula_palatina_desc: "Eine gewaltige Backsteinhalle, die Konstantin der Große für sein eigenes #italic palatium#! errichten ließ. \nIhre Ausmaße finden auf dem ganzen Kontinent kaum ihresgleichen und zeugen von einer Ingenieurskunst, die noch immer als Vorbild dienen kann."
 MA_aula_palatina: "$building_type_MA_aula_palatina$"
 
 #Jokhang Temple
 MA_jokhang_district: "$building_type_MA_jokhang$"
 MA_jokhang_district_desc: "$building_type_MA_jokhang_desc$"
 building_type_MA_jokhang: "Jokhang-Tempel"
 building_type_MA_jokhang_desc: "Der älteste und geheimnisvollste Tempel ganz Tibets, ein majestätisches Ensemble aus Höfen und Heiligtümern im Herzen des Landes der Götter."
 MA_jokhang: "$building_type_MA_jokhang$"
 
 #Dongola Throne Hall
 MA_dongola_hall_district: "$building_type_MA_dongola_hall$"
 MA_dongola_hall_district_desc: "$building_type_MA_dongola_hall_desc$"
 building_type_MA_dongola_hall: "Thronsaal von Dongola"
 building_type_MA_dongola_hall_desc: "Ein großer Palast auf einem felsigen Hügel mit weitem Blick über die umliegende Ebene und den Nil. \nEr dient zeremoniellen Zwecken und soll Gesandte und Reisende beeindrucken: Über eine monumentale Treppe, geschmückt mit prächtigen Fresken nubischer und griechischer Künstler, gelangen sie in den majestätischen Thronsaal im Obergeschoss."
 MA_dongola_hall: "$building_type_MA_dongola_hall$"
 
 #Cathedral of Hildesheim
 MA_hildesheim_cathedral_district: "$building_type_MA_hildesheim_cathedral$"
 MA_hildesheim_cathedral_district_desc: "$building_type_MA_hildesheim_cathedral_desc$"
 building_type_MA_hildesheim_cathedral: "St. Michael in Hildesheim"
 building_type_MA_hildesheim_cathedral_desc: "Diese Basilika wurde errichtet, um die Macht und das Ansehen ihres römischen Königs zu zeigen. Ihre bemalte Holzdecke und Rundbögen verleihen ihr ein prächtiges, kaiserliches Erscheinungsbild. Handwerker und Baumeister vom Rhein und aus Italien wirkten am Bau mit; außerdem birgt sie bronzene Türen und eine mächtige Bronzesäule, beide kunstvoll mit Reliefs verziert."
 MA_hildesheim_cathedral: "$building_type_MA_hildesheim_cathedral$"
 
 #Toulouse Cathedral
 MA_toulouse_basilica_district: "$building_type_MA_toulouse_basilica$"
 MA_toulouse_basilica_district_desc: "$building_type_MA_toulouse_basilica_desc$"
 building_type_MA_toulouse_basilica: "Basilika von Toulouse"
 building_type_MA_toulouse_basilica_desc: "Eine prächtige Basilika, eine der größten Kathedralen nördlich der Alpen. Sie besteht aus Ziegeln, die in der Umgebung reichlich vorhanden sind, und ist ein wahrhaft romanisches Bauwerk, inspiriert von den antiken römischen Ruinen Südfrankreichs und geschmückt mit lombardischen Bändern, Rundbögen und Spoliensäulen."
 MA_toulouse_basilica: "$building_type_MA_toulouse_basilica$"
 
 #The Durham Cathedral
 MA_durham_cathedral_district: "$building_type_MA_durham_cathedral$"
 MA_durham_cathedral_district_desc: "$building_type_MA_durham_cathedral_desc$"
 building_type_MA_durham_cathedral: "Kathedrale von Durham"
 building_type_MA_durham_cathedral_desc: "Die gewaltige Kathedrale von Durham ragt hoch über der sumpfigen Halbinsel am Fluss Wear empor, wo der Legende nach zwei Milchmägde das unverrückbare Grab des heiligen Cuthbert entdeckten. Ihr Kreuzrippengewölbe, entworfen von Handwerkern beiderseits des Ärmelkanals, ist eine Meisterleistung der Baukunst ohne Vorbild in England. Errichtet wurde die Kathedrale über den Wäldern und Flussufern der Stadt aus Stein, der den darunterliegenden Klippen entnommen wurde."
 MA_durham_cathedral: "$building_type_MA_durham_cathedral$"
 
 #The Castel del Monte
 MA_castel_monte_district: "$building_type_MA_castel_monte$"
 MA_castel_monte_district_desc: "$building_type_MA_castel_monte_desc$"
 building_type_MA_castel_monte: "Castel del Monte"
 building_type_MA_castel_monte_desc: "Ein elegantes Jagdschloss auf einem sanften Hügel Apuliens. \nSeine einzigartige Anlage verbindet einen achteckigen Grundriss mit achteckigen Türmen an jeder Ecke und vereint klassische und gotische Architektur. \nSein strenges, geometrisches Äußeres steht in scharfem Gegensatz zu den verschwenderisch ausgestatteten Innenräumen mit Wandteppichen, Teppichen, Gemälden und Kapitellen."
 MA_castel_monte: "$building_type_MA_castel_monte$"
 
 #The Belfry of Bruges
 MA_belfort_district: "$building_type_MA_belfort$"
 MA_belfort_district_desc: "$building_type_MA_belfort_desc$"
 building_type_MA_belfort: "Belfried von Brügge"
 building_type_MA_belfort_desc: "Der beeindruckende gotische Belfried ragt über dem Marktplatz von Brügge auf und bestimmt den Lebensrhythmus der ganzen Stadt. Der gewaltige, mit Fialen und Statuen geschmückte Turm besteht aus Backstein und Naturstein. Über einem rechteckigen Grundriss erhebt sich sein achteckiges Obergeschoss, in dem die Glocken hängen."
 MA_belfort: "$building_type_MA_belfort$"
 
 #The Strasbourg Cathedral
 MA_strasbourg_cathedral1_district: "$building_type_MA_strasbourg_cathedral1$"
 MA_strasbourg_cathedral1_district_desc: "$building_type_MA_strasbourg_cathedral1_desc$"
 building_type_MA_strasbourg_cathedral1: "Straßburger Münster"
 building_type_MA_strasbourg_cathedral1_desc: "Inspiriert von den großen Kirchen West- und Ostfrankens verdankt das Straßburger Münster seine Pracht dem Wohlstand der Bürger und der Förderung durch ihren Herrn. Seine Mauern aus rötlichem Sandstein leuchten in der Abendsonne und überragen den engen Platz mit seinen Fachwerkhäusern, während bronzene Glocken ihre Melodie in die Winde tragen."
 MA_strasbourg_cathedral1: "Straßburger Münster"
 MA_strasbourg_cathedral2: "$MA_strasbourg_cathedral1$"
 
 #Koutoubia Mosque
 MA_koutoubia_district: "$building_type_MA_koutoubia$"
 MA_koutoubia_district_desc: "$building_type_MA_koutoubia_desc$"
 building_type_MA_koutoubia: "Koutoubia-Moschee"
 building_type_MA_koutoubia_desc: "Ein herausragendes Meisterwerk maurischer Baukunst, dessen Minarett Baumeistern in der gesamten islamischen Welt als Vorbild dient."
 MA_koutoubia: "$building_type_MA_koutoubia$"
 
 #Parigoritissa
 MA_parigoritissa_district: "$building_type_MA_parigoritissa$"
 MA_parigoritissa_district_desc: "$building_type_MA_parigoritissa_desc$"
 building_type_MA_parigoritissa: "Panagia Parigoritissa"
 building_type_MA_parigoritissa_desc: "Der Grundriss dieser der Allerheiligsten Maria geweihten Kirche ist von klassischen Vorstellungen der Symmetrie und geometrischen Vollkommenheit geprägt. Sie bildet ein nahezu vollkommenes Quadrat um eine achteckige Kuppel, die von Pfeilern getragen und an allen vier Ecken von kleineren Kapellen umgeben ist."
 MA_parigoritissa: "$building_type_MA_parigoritissa$"
 
 #Rotunda
 MA_rotunda_district: "$building_type_MA_rotunda$"
 MA_rotunda_district_desc: "$building_type_MA_rotunda_desc$"
 building_type_MA_rotunda: "Rotunde von Thessaloniki"
 building_type_MA_rotunda_desc: "Ein gewaltiger Kuppelbau nach dem Vorbild des Pantheons in Rom. \nSein Inneres ist mit Mosaiken von einzigartiger Kunstfertigkeit und Schönheit geschmückt, deren goldene #italic Tesserae#! im Sonnenlicht schimmern, das durch den Opaion fällt. \nEine Säulenstraße verbindet das Bauwerk mit einem mächtigen Marmorbogen, den der verstorbene Caesar Galerius errichten ließ."
 MA_rotunda: "$building_type_MA_rotunda$"
 
 #The Nikaea Walls
 MA_nikaea_walls_district: "$building_type_MA_nikaea_walls$"
 MA_nikaea_walls_district_desc: "$building_type_MA_nikaea_walls_desc$"
 building_type_MA_nikaea_walls: "Stadtmauern von Nikäa"
 building_type_MA_nikaea_walls_desc: "Vor Jahrhunderten von den Caesaren errichtet, schützen diese uneinnehmbaren doppelten Mauern den Weg nach Konstantinopel."
 MA_nikaea_walls: "$building_type_MA_nikaea_walls$"
 
 #The Ephesus Basilica
 MA_ephesus_basilica_district: "$building_type_MA_ephesus_basilica$"
 MA_ephesus_basilica_district_desc: "$building_type_MA_ephesus_basilica_desc$"
 building_type_MA_ephesus_basilica: "Basilika von Ephesos"
 building_type_MA_ephesus_basilica_desc: "Eine gewaltige Basilika, die zur Zeit Justinians über der Grabstätte des #italic Apostels Johannes#! errichtet wurde. \nIhre Mauern aus Ziegeln und Quadersteinen werden von eleganten Marmorsäulen aus Prokonnesos getragen und sind reich mit goldenen Mosaiken geschmückt."
 MA_ephesus_basilica: "$building_type_MA_ephesus_basilica$"
 
 #Arles Amphiteatre
 MA_arles_amphiteatre_district: "$building_type_MA_arles_amphiteatre$"
 MA_arles_amphiteatre_district_desc: "$building_type_MA_arles_amphiteatre_desc$"
 building_type_MA_arles_amphiteatre: "Amphitheater von Arles"
 building_type_MA_arles_amphiteatre_desc: "Diese gewaltige Arena wurde vor Jahrhunderten errichtet und ist noch immer der Mittelpunkt des Lebens in Arles. \nAus ihren steinernen Mauern haben die Bürger Türme, Kapellen und Wohnhäuser geschaffen; sie leben auf dem sandigen Feld, auf dem einst Gladiatoren zur Unterhaltung gegeneinander kämpften und starben."
 MA_arles_amphiteatre: "$building_type_MA_arles_amphiteatre$"
 
 #Axum Stelae Field
 MA_axum_stelae_district: "$building_type_MA_axum_stelae$"
 MA_axum_stelae_district_desc: "$building_type_MA_axum_stelae_desc$"
 building_type_MA_axum_stelae: "Stelenfeld"
 building_type_MA_axum_stelae_desc: "Drei kolossale Stelen sind alles, was vom einst mächtigen Aksum geblieben ist, und doch werfen sie noch immer einen langen Schatten auf die Königskultur dieser Länder. \nAus behauenem Stein gefertigt, tragen sie noch heute sichtbare Reliefs, in denen manche die #italic Tore des Himmels#! erkennen."
 MA_axum_stelae: "$building_type_MA_axum_stelae$"
 
 #Karnak Temple
 MA_karnak_district: "$building_type_MA_karnak$"
 MA_karnak_district_desc: "$building_type_MA_karnak_desc$"
 building_type_MA_karnak: "Karnak"
 building_type_MA_karnak_desc: "Der prächtigste Tempel der alten Pharaonen: Noch nach Jahrtausenden zeugt Karnak von der Macht und dem Reichtum der Könige des Nils."
 MA_karnak: "$building_type_MA_karnak$"
 
 #Pharos of Alexandria
 MA_pharos_alexandria_district: "$building_type_MA_pharos_alexandria$"
 MA_pharos_alexandria_district_desc: "$building_type_MA_pharos_alexandria_desc$"
 building_type_MA_pharos_alexandria: "Pharos"
 building_type_MA_pharos_alexandria_desc: "Hoch über der Landenge erhebt sich der Leuchtturm, in aller Welt als eines der #italic Sieben Weltwunder#! des Antipatros bekannt. \nJahrhunderte sind vergangen, seit sein erster Stein gelegt wurde, und eine neue, von den Kalifen gestiftete Kuppel krönt das Bauwerk. Doch seine unvergleichliche Höhe, sein solides Mauerwerk und sein strahlendes Leuchtfeuer halten die Legende des Pharos in den Herzen aller lebendig, die ihn erblicken."
 MA_pharos_alexandria: "$building_type_MA_pharos_alexandria$"
 
 #Trajan Arch
 MA_trajan_arch1_district: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch1_district_desc: "$building_type_MA_trajan_arch1_desc$"
 building_type_MA_trajan_arch1: "Trajansbogen"
 building_type_MA_trajan_arch1_desc: "Kaiser Trajan, der von dieser Stadt aus seine Feldzüge nach #italic Dakien#! begann, ließ zur Erinnerung an seinen Triumph einen überaus prächtigen Bogen errichten. Noch heute begrüßt er jedes Schiff, das in den Hafen von Ancona einläuft, und weckt Erinnerungen an Stolz und Macht."
 MA_trajan_arch1: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch2: "Bogen von Ancona"
 
 #Palatium of Diocletian
 MA_diocletian_palace_district: "$building_type_MA_diocletian_palace$"
 MA_diocletian_palace_district_desc: "$building_type_MA_diocletian_palace_desc$"
 building_type_MA_diocletian_palace: "Diokletianspalast"
 building_type_MA_diocletian_palace_desc: "Dieser unter der Herrschaft des Tetrarchen errichtete Palast wurde als monumentale, utopische Stadt im Kleinen angelegt, mit Säulenstraßen, Bögen, Mauern und Hallen. \nNach dem Untergang des Reiches nahmen ihn die Bürger in Besitz und verwandelten ihn in den städtischen Mittelpunkt."
 MA_diocletian_palace: "$building_type_MA_diocletian_palace$"
 
 #Romuliana
 MA_romuliana_district: "$building_type_MA_romuliana$"
 MA_romuliana_district_desc: "$building_type_MA_romuliana_desc$"
 building_type_MA_romuliana: "Romuliana"
 building_type_MA_romuliana_desc: "#italic Felix Romuliana#! wurde von den großen Caesaren als Musterstadt gegründet und über die Jahre durch gewaltige Mauern geschützt. \nDoch auch sie konnten den Invasionen der Jahrhunderte nicht standhalten. Von der einstigen Pracht blieben nur die hohlen Gerippe der Wachtürme und die demütigende Fülle der Vegetation, die sie überwuchert hat."
 MA_romuliana: "$building_type_MA_romuliana$"
 
 #Hexamilion
 MA_hexamilion_district: "$building_type_MA_hexamilion$"
 MA_hexamilion_district_desc: "$building_type_MA_hexamilion_desc$"
 building_type_MA_hexamilion: "Hexamilion"
 building_type_MA_hexamilion_desc: "Von Kaiser Theodosius zum Schutz des Peloponnes errichtet, bewachen diese Mauern seit Jahrhunderten den schmalen Zugang zur Landenge. Sie erstrecken sich vom Golf von Korinth bis zum Saronischen Golf und lenken Handel, Reisende und feindliche Überfälle in Engpässe im Norden und Süden."
 MA_hexamilion: "$building_type_MA_hexamilion$"
 
 #Temple of Jupiter
 MA_baalbek_district: "$building_type_MA_baalbek$"
 MA_baalbek_district_desc: "$building_type_MA_baalbek_desc$"
 building_type_MA_baalbek: "Jupitertempel"
 building_type_MA_baalbek_desc: "Der Haupttempel von Baalbek war einst einer der größten der Welt und überragte das fruchtbare Tal. \nSeitdem haben zahlreiche Überfälle und Belagerungen dem gigantischen Tempel zugesetzt; seine Säulen wurden zertrümmert oder in ferne Städte verschleppt. Dennoch verzaubert die Ruine weiterhin Reisende aus aller Welt."
 MA_baalbek: "$building_type_MA_baalbek$"
 
 #Leptis Magna
 MA_leptis_magna_district: "$building_type_MA_leptis_magna$"
 MA_leptis_magna_district_desc: "$building_type_MA_leptis_magna_desc$"
 building_type_MA_leptis_magna: "Leptis Magna"
 building_type_MA_leptis_magna_desc: "Leptis Magna, das Juwel Tripolitaniens, wurde von den alten Kaisern gegründet. \nWenn die erbarmungslose Sonne zur Mittagszeit ihren höchsten Stand erreicht, verschwinden die Schatten über den Ruinen der Tempel, Märkte und Theater. In diesem Land ohne Zeit kann man sich nur verloren fühlen."
 MA_leptis_magna: "$building_type_MA_leptis_magna$"
 
 #Tomb of Numidia
 MA_mauretanian_mausoleum_district: "$building_type_MA_mauretanian_mausoleum$"
 MA_mauretanian_mausoleum_district_desc: "$building_type_MA_mauretanian_mausoleum_desc$"
 building_type_MA_mauretanian_mausoleum: "Grabmal von Numidien"
 building_type_MA_mauretanian_mausoleum_desc: "Ein uraltes, kolossales Mausoleum, erbaut von den Berberkönigen Numidiens vor ihrer Eroberung durch die Römer. \nGanz aus Stein errichtet und auf einem Hügel mit Blick auf das Meer gelegen, ist es weithin sichtbar und glänzt im Sonnenlicht am Horizont."
 MA_mauretanian_mausoleum: "$building_type_MA_mauretanian_mausoleum$"
 
 #Meroë Pyramids
 MA_meroe_pyramids_district: "$building_type_MA_meroe_pyramids$"
 MA_meroe_pyramids_district_desc: "$building_type_MA_meroe_pyramids_desc$"
 building_type_MA_meroe_pyramids: "Pyramiden von Meroë"
 building_type_MA_meroe_pyramids_desc: "Inmitten des goldenen Sandes Nubiens ragen die geheimnisvollen Pyramiden wie vergessene Wächter empor. Der Wüstenwind flüstert ihre Geheimnisse und lockt neugierige Geister, die Rätsel einer verlorenen Zivilisation anhand ihrer unheimlich schönen und kunstvoll geschmückten Bauwerke zu ergründen."
 MA_meroe_pyramids: "$building_type_MA_meroe_pyramids$"
 
 #Basilica of Saint Martin
 MA_saint_martin_district: "$building_type_MA_saint_martin$"
 MA_saint_martin_district_desc: "$building_type_MA_saint_martin_desc$"
 building_type_MA_saint_martin: "Basilika des heiligen Martin"
 building_type_MA_saint_martin_desc: "Diese große Basilika, die letzte Ruhestätte des heiligen Martin, wurde erstmals erbaut, als die Merowinger noch über diese Länder herrschten. \nSie ist hundertsechzig Fuß lang und sechzig Fuß breit, mit antiken Säulen und buntem Marmor verziert und zieht auf dem Weg nach Santiago Pilger von nah und fern an."
 MA_saint_martin: "$building_type_MA_saint_martin$"
 
 #Pillars of Titus
 MA_piliers_district: "$building_type_MA_piliers$"
 MA_piliers_district_desc: "$building_type_MA_piliers_desc$"
 building_type_MA_piliers: "Säulen der Gascogne"
 building_type_MA_piliers_desc: "Auf dem höchsten Punkt der Stadt, über dem Fluss und von der Sonne beschienen, stehen diese ebenso eleganten wie geheimnisvollen Säulen. Manche behaupten, sie seien einst Teil eines großen Palastes des Caesars Titus gewesen; andere meinen, sie seien lange vor der Ankunft der Römer aus dem Fels gewachsen."
 MA_piliers: "$building_type_MA_piliers$"
 
 #Txindoki
 MA_txindoki_district: "$building_type_MA_txindoki$"
 MA_txindoki_district_desc: "$building_type_MA_txindoki_desc$"
 building_type_MA_txindoki: "Txindoki"
 building_type_MA_txindoki_desc: "Wer als Pilger durch diese Länder reist, kann den markanten, schneebedeckten Gipfel kaum übersehen. Jäh und eindrucksvoll erhebt sich der Txindoki, der die Erhabenheit und rätselhafte Schönheit dieser Gegend schon verkörperte, lange bevor ein Mensch ihn erblickte."
 MA_txindoki: "$building_type_MA_txindoki$"
 
 #Hospice of Santa Juliana
 MA_santillana_district: "$building_type_MA_santillana$"
 MA_santillana_district_desc: "$building_type_MA_santillana_desc$"
 building_type_MA_santillana: "Pilgerhospiz Santa Juliana"
 building_type_MA_santillana_desc: "Die hohen Gewölbe, steinernen Pfeiler, Reliquien und Unterkünfte dieses Kollegiatstifts machen es zu einer unverzichtbaren Station für die vielen Pilger auf dem Weg nach Santiago. \nDurch die Unterstützung des örtlichen Magnaten und den stetigen Strom von Spenden ist das Hospiz reich und prächtig geworden, geschmückt mit herrlichen Statuen und gemeißelten Reliefs."
 MA_santillana: "$building_type_MA_santillana$"
 
 #Palace of Naranco
 MA_palace_naranco_district: "$building_type_MA_palace_naranco$"
 MA_palace_naranco_district_desc: "$building_type_MA_palace_naranco_desc$"
 building_type_MA_palace_naranco: "Palast von Naranco"
 building_type_MA_palace_naranco_desc: "Dieser schöne Palast diente über Generationen als Residenz der heiligen Könige Asturiens und beherrscht vom Berg Naranco aus den Blick auf Oviedo. Seine eleganten Bögen und Gewölbe, wie sie auf der Halbinsel seit der Römerzeit nicht mehr zu sehen waren, zeugen vom Ehrgeiz und von der Macht seiner Herrscher."
 MA_palace_naranco: "$building_type_MA_palace_naranco$"
 
 #Burgos Cathedral
 MA_burgos_cathedral_district: "$building_type_MA_burgos_cathedral$"
 MA_burgos_cathedral_district_desc: "$building_type_MA_burgos_cathedral_desc$"
 building_type_MA_burgos_cathedral: "Kathedrale von Burgos"
 building_type_MA_burgos_cathedral_desc: "Von Handwerkern beiderseits der Pyrenäen errichtet, ist diese prächtige Kathedrale eines der bedeutendsten Beispiele des neuen, modernen Kirchenbaustils. \nIhre Türme ragen hoch in den Himmel, und ihre weiten Kapellen und Gänge führen die Pilger von einer Reliquie zur nächsten, umgeben von Opfergaben und Gold und unter den erhabenen Blicken zahlreicher gemeißelter Heiliger."
 MA_burgos_cathedral: "$building_type_MA_burgos_cathedral$"
 
 #Qasr al-Farid
 MA_hegra_district: "$building_type_MA_hegra$"
 MA_hegra_district_desc: "$building_type_MA_hegra_desc$"
 building_type_MA_hegra: "Qasr al-Farid"
 building_type_MA_hegra_desc: "Ein monumentales Grabmal, tief in einen einzigen Felsblock gehauen, Überrest einer einst reichen und mächtigen heidnischen Stadt. \nEinsam erhebt es sich aus der Wüste und trotzt den Winden. Deshalb nennen es die Einheimischen das #italic Einsame Schloss#!."
 MA_hegra: "$building_type_MA_hegra$"
 
 #Wadi Rum
 MA_wadirum_district: "$building_type_MA_wadirum$"
 MA_wadirum_district_desc: "$building_type_MA_wadirum_desc$"
 building_type_MA_wadirum: "Wadi Rum"
 building_type_MA_wadirum_desc: "Dieses weite, uralte Tal ist seit Langem Ursprung von Mythen und Legenden und bis heute von Geheimnissen umgeben. \nAus ihm erhebt sich eine mächtige Wand aus rotem Fels gegen die Wüstenwinde, hoch, schwer und unbezwingbar für jedes Heer. Selbst in den schlimmsten Zeiten bietet sie sicheren Schutz."
 MA_wadirum: "$building_type_MA_wadirum$"
 
 #Walls of Sana'a
 MA_walls_sanaa_district: "$building_type_MA_walls_sanaa$"
 MA_walls_sanaa_district_desc: "$building_type_MA_walls_sanaa_desc$"
 building_type_MA_walls_sanaa: "Stadtmauern von Sanaa"
 building_type_MA_walls_sanaa_desc: "Ein Ring starker Befestigungswälle umschließt das Herz von Sanaa. Unerschütterlich erheben sie sich aus dem verwinkelten Labyrinth des Sarawat-Gebirges; ihre verwitterte Pracht erzählt von schrecklichen Schlachten und großen Taten der Menschen und Götter."
 MA_walls_sanaa: "$building_type_MA_walls_sanaa$"
 
 #Dam of Sheba
 MA_dam_sheba_district: "$building_type_MA_dam_sheba$"
 MA_dam_sheba_district_desc: "$building_type_MA_dam_sheba_desc$"
 building_type_MA_dam_sheba: "Staudamm von Saba"
 building_type_MA_dam_sheba_desc: "Einsam in der kargen Landschaft von Ma'rib, wo die sengende Sonne jeden straft, der ihr entgegentritt, raunen diese prächtigen Ruinen von der Herrlichkeit des Königreichs der Königin von Saba. Einst verwandelte es Sand in fruchtbare Felder und brachte Wohlstand und Leben dorthin, wo zuvor Mangel und Tod herrschten."
 MA_dam_sheba: "$building_type_MA_dam_sheba$"
 
 #Bahla Fort
 MA_bahla_fort_district: "$building_type_MA_bahla_fort$"
 MA_bahla_fort_district_desc: "$building_type_MA_bahla_fort_desc$"
 building_type_MA_bahla_fort: "Festung Bahla"
 building_type_MA_bahla_fort_desc: "Diese gewaltige Burg aus Lehmziegeln wurde errichtet, um die kostbare Oase Bahla von den Höhen des nahen Berglands aus zu schützen. \nIhre verschachtelten Mauern bewahren Bewässerungsanlagen und prächtige Dattelpalmenhaine vor Feinden und sengender Hitze und verleihen ihrem Beschützer hohes Ansehen."
 MA_bahla_fort: "$building_type_MA_bahla_fort$"
 
 #Jebe Hafeet
 MA_jebel_hafeet_district: "$building_type_MA_jebel_hafeet$"
 MA_jebel_hafeet_district_desc: "$building_type_MA_jebel_hafeet_desc$"
 building_type_MA_jebel_hafeet: "Dschabal Hafit"
 building_type_MA_jebel_hafeet_desc: "Ein langer, schmaler und einsamer Berg, der letzte vor den Sanddünen und der erste vor dem Hadschar-Gebirge. \nSeine steilen Felshänge werden seit Langem von den Menschen der Region bewohnt; an seinem Fuß finden sich bienenkorbförmige Gräber."
 MA_jebel_hafeet: "$building_type_MA_jebel_hafeet$"
 
 #Al-Turaif Palace
 MA_alturaif_district: "$building_type_MA_alturaif$"
 MA_alturaif_district_desc: "$building_type_MA_alturaif_desc$"
 building_type_MA_alturaif: "Palast von at-Turaif"
 building_type_MA_alturaif_desc: "Über Generationen hinweg an einem der unwirtlichsten Orte der Schöpfung erbaut, ist dieser Palast ein Sinnbild für Entschlossenheit und Frömmigkeit. \nHinter einem langen Mauerring bieten hohe Lehmziegelpaläste und ein bewässerter Garten Schutz selbst vor der unerträglichsten Hitze. Zugleich dienen sie ihrem Besitzer als bedeutendes Versorgungslager."
 MA_alturaif: "$building_type_MA_alturaif$"
 
 #School of Preslav
 MA_school_preslav_district: "$building_type_MA_school_preslav$"
 MA_school_preslav_district_desc: "$building_type_MA_school_preslav_desc$"
 building_type_MA_school_preslav: "Schule von Preslaw"
 building_type_MA_school_preslav_desc: "Dank eines beständigen Stroms von Spenden arbeiten die klösterlichen Schreibstuben und Palasthallen von Preslaw unermüdlich daran, Handschriften zu übersetzen und neues Wissen hervorzubringen. Der Duft von Tinte und Pergament erfüllt die Luft, und Fresken von Heiligen und Stiftern schmücken die Wände. Der Einfluss der Schule reicht weit über ihre steinernen Hallen hinaus; sie ist zu einem Leuchtfeuer römischer Liturgie und Gelehrsamkeit in der Region geworden."
 MA_school_preslav: "$building_type_MA_school_preslav$"
 
 #Madara Rider
 MA_madara_rider_district: "$building_type_MA_madara_rider$"
 MA_madara_rider_district_desc: "$building_type_MA_madara_rider_desc$"
 building_type_MA_madara_rider: "Reiter von Madara"
 building_type_MA_madara_rider_desc: "Tief in die kalte, ewige Umarmung einer senkrechten Felswand gehauen, zeigt dieses uralte Relief einen Reiter, der über einen Löwen triumphiert. Die Lanze in der Hand scheint der Reiter selbst aus dem Stein hervorzuspringen, auf ewig siegreich. Darunter berichten Inschriften von ruhmreichen Taten in der grenzenlosen Weidesteppe, lange bevor sich die Bewohner dieses Landes im Westen niederließen."
 MA_madara_rider: "$building_type_MA_madara_rider$"
 
 #Tomb of the Thracian King
 MA_thracian_tomb_district: "$building_type_MA_thracian_tomb$"
 MA_thracian_tomb_district_desc: "$building_type_MA_thracian_tomb_desc$"
 building_type_MA_thracian_tomb: "Grabmal des thrakischen Königs"
 building_type_MA_thracian_tomb_desc: "Verloren in Zeit und Raum, umgeben von einer stillen, goldenen Graslandschaft, ruht ein uraltes Grab unter einem gewaltigen, aufgeschütteten [Glossary('Grabhügel','MA_tumulus_glossary')]. Sein Eingang ist durch ein monolithisches Tor gekennzeichnet und von einem Kreis aus Steinen umgeben. Legenden flüstern, hier liege ein großer König der Vorzeit begraben; sein Name ist längst vergessen, doch sein Geist reitet noch immer am Himmel. \nEine einsame Zypresse hält vor dem Eingang Wache und wirft ihren langen, stillen Schatten über das Grab."
 MA_thracian_tomb: "$building_type_MA_thracian_tomb$"
 MA_tumulus_glossary: "Ein aus Erde und Steinen aufgeschütteter Hügel, der sich als gewaltige Kuppel über einem Grab erhebt. Von vielen Kulturen – insbesondere der Antike – verwendet, sind #bold Grabhügel#! düstere und monumentale Zeugnisse der Vergänglichkeit."
 
 #Boyana Church
 MA_boyana_church_district: "$building_type_MA_boyana_church$"
 MA_boyana_church_district_desc: "$building_type_MA_boyana_church_desc$"
 building_type_MA_boyana_church: "Kirche von Bojana"
 building_type_MA_boyana_church_desc: "Auf den ersten Blick wirkt diese bescheidene Kirche unscheinbar. Sie steht abgeschieden in einem ländlichen Ort zwischen goldenen Feldern, und ihr schlichtes Ziegelmauerwerk fügt sich in die Landschaft ein. \nDoch hinter ihrem unauffälligen Äußeren verbirgt sich ein Schatz ohnegleichen, den Blicken der Welt entzogen. Das Herz des Gotteshauses ist mit Fresken von atemberaubender Schönheit geschmückt, jeder Pinselstrich ein Zeugnis göttlicher Eingebung. Blau, Rot und Gold verschmelzen, und die Heiligen scheinen im Flackern der Kerzenflammen zu tanzen – ein Schauspiel von tiefster Mystik."
 MA_boyana_church: "$building_type_MA_boyana_church$"
 
 #Belogradchik Fortress
 MA_belogradchik_fort_district: "$building_type_MA_belogradchik_fort$"
 MA_belogradchik_fort_district_desc: "$building_type_MA_belogradchik_fort_desc$"
 building_type_MA_belogradchik_fort: "Festung Belogradtschik"
 building_type_MA_belogradchik_fort_desc: "Eingebettet zwischen aufragenden Felsformationen scheint diese Festung der Erde selbst zu entwachsen; ihre Mauern gehen nahtlos in den kalten roten Stein des Berges über. Die eleganten Felstürme ragen hoch auf und umschließen die Festung von drei Seiten, sodass sie nahezu uneinnehmbar wird. \nDie Einheimischen erzählen eine uralte Sage von einem Riesen aus dem nahen Wald, der die Felsen mit bloßen Händen auftürmte, und von einem Kloster, das zur göttlichen Strafe von den Steinen verschlungen wurde."
 MA_belogradchik_fort: "$building_type_MA_belogradchik_fort$"
 
 #Studenica Monastery
 MA_studenica_district: "$building_type_MA_studenica$"
 MA_studenica_district_desc: "$building_type_MA_studenica_desc$"
 building_type_MA_studenica: "Kloster Studenica"
 building_type_MA_studenica_desc: "Dieses Kloster, das prächtigste der serbischen Denkmäler und für die Einheimischen ein Hort des Glaubens und der Ruhe, liegt verborgen in einem abgeschiedenen Tal. \nSeine Mauern zeigen Einflüsse sowohl des lateinischen Westens als auch des griechischen Ostens. Die kunstvoll bearbeiteten weißen Marmorplatten und die mächtige Kuppel auf einer leuchtend roten Trommel zeugen von der Kunstfertigkeit und Frömmigkeit seiner Stifter."
 MA_studenica: "$building_type_MA_studenica$"
 
 #Church of the Nativity
 MA_church_nativity_district: "$building_type_MA_church_nativity$"
 MA_church_nativity_district_desc: "$building_type_MA_church_nativity_desc$"
 building_type_MA_church_nativity: "Geburtskirche"
 building_type_MA_church_nativity_desc: "Zuerst von der heiligen Mutter Konstantins gestiftet und später auf Befehl Justinians neu errichtet, ehrt dieses Gotteshaus eine der heiligsten Stätten des Christentums: den Geburtsort Christi. \nDie Kirche ist eine langgestreckte fünfschiffige Basilika mit triumphalem Eingang, geschmückt mit goldenen Mosaiken und antiken römischen Säulen aus buntem Marmor. Sie beherbergt zahlreiche heilige Reliquien und Kunstwerke, die sie – so erzählen die Legenden – schon vor mehreren Invasionen bewahrt haben."
 MA_church_nativity: "$building_type_MA_church_nativity$"
 
 #Great Lejre Hall
 MA_lejre_hall_district: "$building_type_MA_lejre_hall$"
 MA_lejre_hall_district_desc: "$building_type_MA_lejre_hall_desc$"
 building_type_MA_lejre_hall: "Große Halle von Hleiðr"
 building_type_MA_lejre_hall_desc: "Eine prächtige Methalle, die Könige der Vorzeit aus hohen Baumstämmen und mit großartigen Schnitzereien errichten ließen. \nDie Geschichten der mächtigen Helden und Könige, die hier speisten und kämpften, werden gewiss noch viele Sagas inspirieren."
 MA_lejre_hall: "$building_type_MA_lejre_hall$"
 
 #Aetna
 MA_aetna_district: "$building_type_MA_aetna$"
 MA_aetna_district_desc: "$building_type_MA_aetna_desc$"
 building_type_MA_aetna: "Ätna"
 building_type_MA_aetna_desc: "Der mächtigste der feuerspeienden Vulkane der antiken Welt, der Ätna, erhebt sich triumphierend über die fruchtbare Insel Sizilien und bereichert mit seiner Asche die umliegenden Böden. \nSeit Jahrtausenden ranken sich Mythen und Legenden um seinen feurigen Atem, darunter die Geschichte, wie der Gott Hephaistos im Herzen des höllischen Berges seine göttlichen Schöpfungen schmiedete."
 MA_aetna: "$building_type_MA_aetna$"
 
 #Brescia Duomo
 MA_duomo_brescia_district: "$building_type_MA_duomo_brescia$"
 MA_duomo_brescia_district_desc: "$building_type_MA_duomo_brescia_desc$"
 building_type_MA_duomo_brescia: "Dom von Brescia"
 building_type_MA_duomo_brescia_desc: "Eine steinerne Rotunde im Herzen der #italic Cittanuova#!, des neuen Machtzentrums von Brescia westlich des antiken römischen Stadtkerns. Ihre dicken Mauern und die schlichte romanische Gestaltung wurden von Erzählungen über Jerusalem inspiriert. Im dämmrigen Inneren berichten Fresken und Reliquien von Jahrhunderten der Frömmigkeit und Macht."
 MA_duomo_brescia: "$building_type_MA_duomo_brescia$"
 
 #Maschio
 MA_maschio_district: "$building_type_MA_maschio$"
 MA_maschio_district_desc: "$building_type_MA_maschio_desc$"
 building_type_MA_maschio: "Maschio"
 building_type_MA_maschio_desc: "Eine gewaltige Burg aus Stein und vulkanischem Tuff erhebt sich über der schimmernden Bucht von Neapel. Ihre Zinnen und mächtigen Rundtürme beherrschen Land und Meer mit eiserner Faust. \nEin großes Netz aus Zellen und Verliesen reicht tief in den Fels hinab; manche stammen noch aus der Zeit der alten Griechen. $MA_warning_palermo_napoli$"
 MA_maschio: "$building_type_MA_maschio$"
 MA_warning_palermo_napoli: "\n\n@alert_icon! #alert_trial Wenn sowohl der [GetBuildingType('MA_palace_palermo2').GetName] in Palermo als auch der [GetBuildingType('MA_maschio').GetName] in Neapel errichtet werden, kann die [GetDecisionWithKey('empower_sicilian_parliament_decision').GetName] [decision|E] nicht mehr abgeschlossen werden!#!"
 
 #Basilica of Saint Nicholas
 MA_st_nicholas_district: "$building_type_MA_st_nicholas$"
 MA_st_nicholas_district_desc: "$building_type_MA_st_nicholas_desc$"
 building_type_MA_st_nicholas: "Basilika des heiligen Nikolaus"
 building_type_MA_st_nicholas_desc: "Eine wuchtige romanische Basilika aus festem einheimischem Stein, deren strahlendes Weiß sich vom weinblauen Meer abhebt. In ihrem Inneren ziehen die Reliquien des heiligen Nikolaus Pilger und große Reichtümer aus der ganzen Christenheit an und ermutigen sie, die Überfahrt ins Heilige Land zu wagen."
 MA_st_nicholas: "$building_type_MA_st_nicholas$"
 
 #Palace of Arechis
 MA_palace_arechis_district: "$building_type_MA_palace_arechis$"
 MA_palace_arechis_district_desc: "$building_type_MA_palace_arechis_desc$"
 building_type_MA_palace_arechis: "Palast des Arechis"
 building_type_MA_palace_arechis_desc: "Ein weitläufiger Palastkomplex, der in die antike römische Stadt Beneventum eingebettet und von einem Mauerring sowie einem viereckigen Turm geschützt ist. Vom ersten Fürsten der Langobarden errichtet, wurde er zum Sinnbild für den Widerstandsgeist und die unbeugsame Unabhängigkeit dieses Volkes."
 MA_palace_arechis: "$building_type_MA_palace_arechis$"
 
 #Basilica of Saccargia
 MA_saccargia_basilica_district: "$building_type_MA_saccargia_basilica$"
 MA_saccargia_basilica_district_desc: "$building_type_MA_saccargia_basilica_desc$"
 building_type_MA_saccargia_basilica: "Basilika von Saccargia"
 building_type_MA_saccargia_basilica_desc: "Eine eindrucksvolle Basilika aus schwarz-weißem Stein erhebt sich an der trockenen, windgepeitschten Küste Sardiniens. Ihr gestreifter Turm ist vom Meer aus weithin sichtbar. Handwerker aus Italien wurden zum Bau herangezogen und haben dessen Stil maßgeblich geprägt."
 MA_saccargia_basilica: "$building_type_MA_saccargia_basilica$"
 
 #Ruins of Paestum
 MA_paestum_district: "$building_type_MA_paestum$"
 MA_paestum_district_desc: "$building_type_MA_paestum_desc$"
 building_type_MA_paestum: "Ruinen von Paestum"
 building_type_MA_paestum_desc: "Von wildem Gras und Stille umgeben liegen die Überreste einer einst großen antiken Stadt; die kolossalen Säulen ihrer Tempel sind zerbrochen und zertrümmert. Nachdem der nahe Fluss das Umland versumpfen ließ, wurde die Stadt allmählich verlassen, und heute wagen sich nur wenige in diese ungesunde Gegend."
 MA_paestum: "$building_type_MA_paestum$"
 
 #Tower of Pisa
 MA_tower_pisa_district: "$building_type_MA_tower_pisa$"
 MA_tower_pisa_district_desc: "$building_type_MA_tower_pisa_desc$"
 building_type_MA_tower_pisa: "Turm von Pisa"
 building_type_MA_tower_pisa_desc: "Der elegante #italic Campanile#! der stolzen Stadt Pisa, dessen anmutige Bögen und schimmernd weißer Stein in der ganzen Christenheit und weit darüber hinaus bekannt geworden sind. Seit seiner Errichtung hat sich der Boden unter ihm immer wieder verschoben, sodass der Turm zunehmend in Schieflage gerät."
 MA_tower_pisa: "$building_type_MA_tower_pisa$"
 
 #Saint Peter's Basilica
 MA_vatican_district: "$building_type_MA_vatican$"
 MA_vatican_district_desc: "$building_type_MA_vatican_desc$"
 building_type_MA_vatican: "Petersbasilika"
 building_type_MA_vatican_desc: "Die heiligste der alten Basiliken, die Konstantin in Rom errichten ließ, erhebt sich über dem Grab des Apostels, auf dem die Kirche gegründet wurde. \nDas Gotteshaus ist ebenso gewaltig wie elegant. Seine hohen, mit goldenen Mosaiken und exotischen Marmorsorten geschmückten Schiffe empfangen Tausende Pilger aus der ganzen Christenheit – und mit ihnen Reichtum und Macht."
 MA_vatican: "$building_type_MA_vatican$"
 
 #Rock of Canossa
 MA_rock_canossa_district: "$building_type_MA_rock_canossa$"
 MA_rock_canossa_district_desc: "$building_type_MA_rock_canossa_desc$"
 building_type_MA_rock_canossa: "Felsen von Canossa"
 building_type_MA_rock_canossa_desc: "Diese furchteinflößende Burg wurde auf einem steilen Felsvorsprung als Mittelpunkt eines eindrucksvollen Befestigungssystems errichtet, das die Pässe des Apennins bewacht. Von dieser abgeschiedenen Festung aus überblicken ihre Herren die Täler zu ihren Füßen, sicher in ihrer Zuflucht zwischen Stein und Himmel."
 MA_rock_canossa: "$building_type_MA_rock_canossa$"
 
 #Hill of Tara
 MA_hill_tara_district: "$building_type_MA_hill_tara$"
 MA_hill_tara_district_desc: "$building_type_MA_hill_tara_desc$"
 building_type_MA_hill_tara: "Hügel von Tara"
 building_type_MA_hill_tara_desc: "Ein grasbewachsener Hügel, geschützt durch Gräben und Erdwälle und umringt von uralten behauenen Steinen, der heilige Sitz der Hochkönige von Irland. Zwar stehen auf ihm keine Mauern, doch das Land selbst besitzt Macht und zieht Besucher von der ganzen Insel an."
 MA_hill_tara: "$building_type_MA_hill_tara$"
 
 #Clonmacnoise
 MA_clonmacnoise_district: "$building_type_MA_clonmacnoise$"
 MA_clonmacnoise_district_desc: "$building_type_MA_clonmacnoise_desc$"
 building_type_MA_clonmacnoise: "Clonmacnoise"
 building_type_MA_clonmacnoise_desc: "Ein großes Kloster am Ufer des breiten Shannon, dessen Steinkirche und hoher Rundturm sich feierlich über die windgepeitschten Ebenen erheben. Im Lauf der Zeit ist es zu einem der bedeutendsten Zentren der Gelehrsamkeit auf der Insel geworden und zieht Gelehrte und Pilger von nah und fern an."
 MA_clonmacnoise: "$building_type_MA_clonmacnoise$"
 
 #White Stupa of Gaochang
 MA_white_stupa_district: "$building_type_MA_white_stupa$"
 MA_white_stupa_district_desc: "$building_type_MA_white_stupa_desc$"
 building_type_MA_white_stupa: "Weiße Stupa von Gaochang"
 building_type_MA_white_stupa_desc: "Im Auftrag der kaiserlichen Behörden als Zeichen der Reichweite des Reichs der Mitte errichtet, erhebt sich diese strahlende [Glossary('Stupa','MA_stupa_glossary')] einsam über dem versengten Wüstensand. Mit ihrer großen, gerundeten weißen Kuppel und der vergoldeten Spitze ist sie stark von tibetischen und indischen Tempeln beeinflusst, nimmt aber auch traditionelle chinesische Elemente wie den hölzernen Unterbau auf."
 MA_white_stupa: "$building_type_MA_white_stupa$"
 
 #Khan Tengri
 MA_khan_tengri_district: "$building_type_MA_khan_tengri$"
 MA_khan_tengri_district_desc: "$building_type_MA_khan_tengri_desc$"
 building_type_MA_khan_tengri: "Khan Tengri"
 building_type_MA_khan_tengri_desc: "Von den Völkern der Steppe #italic Herr des Himmels#! genannt, ragt diese gewaltige Marmorpyramide in vollkommener Symmetrie über die umliegenden Berge empor. Ihre Hänge sind von ewigem Schnee bedeckt, der bei Sonnenuntergang rot und im Morgenlicht golden erglüht. Unter dem klaren blauen Himmelsgewölbe bildet sie eine heilige Achse zwischen Erde und Himmel."
 MA_khan_tengri: "$building_type_MA_khan_tengri$"
 
 #Singing Dunes
 MA_singing_dunes_district: "$building_type_MA_singing_dunes$"
 MA_singing_dunes_district_desc: "$building_type_MA_singing_dunes_desc$"
 building_type_MA_singing_dunes: "Singende Dünen"
 building_type_MA_singing_dunes_desc: "Nur wenige Tagesmärsche von der Oase entfernt erhebt sich ein großer Halbmond aus Sand aus der kargen Steppe, wo der Wind der Erde selbst lange, gespenstische Töne entlockt. Nomaden, die auf den uralten Wegen Asiens reisen, halten inne und lauschen, denn sie glauben, im Gesang der Dünen die Stimme der Geister zu hören. Dichter aus fernen Ländern schöpfen aus dieser Musik ihre Inspiration."
 MA_singing_dunes: "$building_type_MA_singing_dunes$"
 
 #Dakhma of Gurganj
 MA_dakhma_district: "$building_type_MA_dakhma$"
 MA_dakhma_district_desc: "$building_type_MA_dakhma_desc$"
 building_type_MA_dakhma: "Dakhma von Gurgandsch"
 building_type_MA_dakhma_desc: "Diese große kreisrunde #italic Dakhma#!, ein Turm des Schweigens, krönt eine einsame Anhöhe über der Ebene. Einst legten die Zoroastrier hier ihre Toten dem reinigenden Himmel und der Sonne aus. Doch mit jedem Sommer schwindet die Zahl der Gläubigen, und im Turm finden immer weniger Bestattungsriten statt – dafür stehen umso mehr Wachen bereit, denn seine Höhe und Gestalt eignen sich inzwischen besser zur Überwachung als zur Verehrung. \n\n#help Der Turm gewährt zusätzliche Effekte, wenn er von Angehörigen eines [faith|E], der #game_link Himmelsbestattungen#! praktiziert, gehalten oder bewohnt wird.#!"
 MA_dakhma: "$building_type_MA_dakhma$"
 
 #Black Ruins
 MA_karabalgasun_district: "$building_type_MA_karabalgasun$"
 MA_karabalgasun_district_desc: "$building_type_MA_karabalgasun_desc$"
 building_type_MA_karabalgasun: "Schwarze Ruinen"
 building_type_MA_karabalgasun_desc: "Zerborstene Erdwälle und zerbrochene Säulen sind alles, was von dem einst mächtigen Palast im Herzen eines der größten Steppenreiche geblieben ist. Der Wind heult durch die leeren Höfe, und behauene Steine liegen halb unter Gras und Staub begraben. Doch noch immer kommen Reisende hier vorbei und nennen die Überreste #italic Karabalgasun#!, die Schwarzen Ruinen."
 MA_karabalgasun: "$building_type_MA_karabalgasun$"
 
 #City of the Army
 MA_ordu_district: "$building_type_MA_ordu$"
 MA_ordu_district_desc: "$building_type_MA_ordu_desc$"
 building_type_MA_ordu: "Stadt des Heeres"
 building_type_MA_ordu_desc: "An der Kreuzung der Wege zwischen Europa und Asien liegt eine große Stadt voller Händler, Höflinge und Pferde. \nGeschützt von Erdwällen und umgeben von einem breiten Graben, reihen sich entlang einer Säulenstraße zahlreiche Zelte und Tempel aneinander. Sie führt zum vergoldeten Zelt des großen Steppenherrn, der von hier aus regiert."
 MA_ordu: "$building_type_MA_ordu$"
 
 #Kurgan of the Rider
 MA_kurgan_district: "$building_type_MA_kurgan$"
 MA_kurgan_district_desc: "$building_type_MA_kurgan_desc$"
 building_type_MA_kurgan: "Kurgan des Reiters"
 building_type_MA_kurgan_desc: "Die Einheimischen erzählen von einem großen Reiter, der einst durch diese Länder zog und dessen Geist noch immer durch die Steppe reitet. \nSein Kurgan, ein gewaltiger Erdhügel, soll seine Grabstätte sein. Ein Steinkreis umgibt ihn und kennzeichnet die Grenzen seines Herrschaftsgebiets. Immer weniger Menschen erinnern sich an seinen Namen, doch der Kurgan trotzt weiterhin Wind und Zeit."
 MA_kurgan: "$building_type_MA_kurgan$"
 
 #Cliffs of Ustyurt
 MA_ustyurt_cliffs_district: "$building_type_MA_ustyurt_cliffs$"
 MA_ustyurt_cliffs_district_desc: "$building_type_MA_ustyurt_cliffs_desc$"
 building_type_MA_ustyurt_cliffs: "Klippen des Ustjurt"
 building_type_MA_ustyurt_cliffs_desc: "Diese vom Wetter geformten Klippen markieren den Übergang von einem verlassenen Hochplateau zur Küste des Binnenmeers. Schluchten durchziehen sie, und Höhlen haben sie ausgehöhlt. Das raue, wasserarme Land zwang die Jäger, sich anzupassen und #italic Arane#! anzulegen: steinerne Fallen, die wilde Herden in enge Durchgänge treiben und die Klippen in eine stille Bühne des Todes verwandeln."
 MA_ustyurt_cliffs: "$building_type_MA_ustyurt_cliffs$"
 
 #White Fortress
 MA_sarkel_district: "$building_type_MA_sarkel$"
 MA_sarkel_district_desc: "$building_type_MA_sarkel_desc$"
 building_type_MA_sarkel: "Weiße Festung"
 building_type_MA_sarkel_desc: "Die mächtige Festung #italic Sark-el#! – die Weiße Festung – aus weißem Kalkstein und Ziegeln wurde am linken Donufer errichtet, nachdem der Khagan den römischen Kaiser um Baumeister zur Sicherung der Nordgrenze seines Reiches gebeten hatte. Heute beherrscht sie die strategische Landverbindung zwischen Don und Wolga, erstreckt ihre militärische Macht weit in den Norden und schützt die wichtigen Handelswege der Region."
 MA_sarkel: "$building_type_MA_sarkel$"
 
 #Nilometer
 MA_nilometer_district: "$building_type_MA_nilometer$"
 MA_nilometer_district_desc: "$building_type_MA_nilometer_desc$"
 building_type_MA_nilometer: "Nilometer"
 building_type_MA_nilometer_desc: "Eine schmale Steinkammer am schlammigen Flussufer, die gebaut wurde, um das Steigen und Fallen des Nils genauer zu messen und die Aussaat zu planen. Die neuen islamischen Herrscher ließen sie errichten, um einen uralten Brauch des Landes fortzuführen und Nilflut und Wohlstand mit der staatlichen Ordnung zu verbinden."
 MA_nilometer: "$building_type_MA_nilometer$"
 
 #Abu Simbel
 MA_abu_simbel_district: "$building_type_MA_abu_simbel$"
 MA_abu_simbel_district_desc: "$building_type_MA_abu_simbel_desc$"
 building_type_MA_abu_simbel: "Abu Simbel"
 building_type_MA_abu_simbel_desc: "Kolossale Statuen, vor vielen Generationen von den alten Pharaonen aus dem Fels gehauen, ragen aus diesen steinigen Dünen. Ihre Größe ist noch immer auf der ganzen Welt unerreicht. \nWer ihre Majestät erblickt, ob einfacher Reisender oder mächtiger König, kann sich der Inspiration durch ihre Geschichte kaum entziehen."
 MA_abu_simbel: "$building_type_MA_abu_simbel$"
 
 #Red and White Monasteries
 MA_red_white_monasteries_district: "$building_type_MA_red_white_monasteries$"
 MA_red_white_monasteries_district_desc: "$building_type_MA_red_white_monasteries_desc$"
 building_type_MA_red_white_monasteries: "Rotes und Weißes Kloster"
 building_type_MA_red_white_monasteries_desc: "Zwei alte koptische Klöster nahe den Ufern des Nils, deren Mauern aus auffällig gefärbtem Stein ihnen ihre Namen gaben: das eine tief erdrot, das andere hell und leuchtend. Abgeschieden, doch nicht vergessen, bewahren sie in ihren Kapellen, in denen alte Gesänge widerhallen, und hinter ihren mit verblassenden Fresken geschmückten Mauern eine gelehrte und fromme christliche Tradition. Sie reicht bis in die Zeit vor der Eroberung dieser Länder durch muslimische Herrscher zurück, die Wüsten und Felsen des Sinai überquerten."
 MA_red_white_monasteries: "$building_type_MA_red_white_monasteries$"
 
 #Knossos
 MA_knossos_ruins_district: "$building_type_MA_knossos_ruins$"
 MA_knossos_ruins_district_desc: "$building_type_MA_knossos_ruins_desc$"
 building_type_MA_knossos_ruins: "Palast von Knossos"
 building_type_MA_knossos_ruins_desc: "Mit Blick auf das herrliche Meer bewahrt der alte Palast von Knossos die Erinnerung an Könige und Mythen vergangener Zeiten. Seine großen Hallen, Säulen und Fresken erzählen von einem fernen Zeitalter des Reichtums und der Macht, verzaubern Reisende und inspirieren all jene, die einen Platz unter den mächtigen Herrschern Kretas beanspruchen möchten."
 MA_knossos_ruins: "Ruinen von Knossos"
 MA_knossos: "$building_type_MA_knossos_ruins$"
 
 #Skara Brae
 MA_skara_brae_district: "$building_type_MA_skara_brae$"
 MA_skara_brae_district_desc: "$building_type_MA_skara_brae_desc$"
 building_type_MA_skara_brae: "Skara Brae"
 building_type_MA_skara_brae_desc: "Fast schüchtern lugt diese Ansammlung uralter Steinhäuser aus einem grasbewachsenen Hügel an der sturmgepeitschten Küste hervor, halb unter der Erde begraben. \nVom schneidenden Meereswind umspült, verharrt sie in Stille. Ihre Mauern sind niedrig und verwittert, ihre Herdstellen seit unzähligen Jahrhunderten erkaltet – und doch hallt hier noch die Erinnerung an längst vergangene Leben nach."
 MA_skara_brae: "$building_type_MA_skara_brae$"
 
 #Whitehorse Hill
 MA_whitehorse_hill_district: "$building_type_MA_whitehorse_hill$"
 MA_whitehorse_hill_district_desc: "$building_type_MA_whitehorse_hill_desc$"
 building_type_MA_whitehorse_hill: "Hügel des Weißen Pferdes"
 building_type_MA_whitehorse_hill_desc: "#flavor Nahe der Stadt Abinton liegt ein Berg, auf dem die Gestalt eines Hengstes zu sehen ist, und sie ist weiß. Nichts wächst auf ihr.#!"
 MA_whitehorse_hill: "$building_type_MA_whitehorse_hill$"
 
 #Gagikashen
 MA_gagikashen_district: "$building_type_MA_gagikashen$"
 MA_gagikashen_district_desc: "$building_type_MA_gagikashen_desc$"
 building_type_MA_gagikashen: "Gagikashen"
 building_type_MA_gagikashen_desc: "Eine große Rundkirche, dem heiligen Gregor geweiht, die über den Höhen von Ani aufragt. Ihre Baumeister ließen sich von den Ruinen der Kathedrale von Swartnoz inspirieren. Ihre hohe Kuppeltrommel steigt in drei Stufen über Säulenringen und Seitenkapellen empor, die einen zentralen Raum von großer Harmonie und Klarheit umschließen."
 MA_gagikashen: "$building_type_MA_gagikashen$"
 
 #Saint Gall
 MA_saint_gall_district: "$building_type_MA_saint_gall$"
 MA_saint_gall_district_desc: "$building_type_MA_saint_gall_desc$"
 building_type_MA_saint_gall: "St. Gallen"
 building_type_MA_saint_gall_desc: "Eine bedeutende Klosteranlage, die an der ehemaligen Einsiedelei des heiligen Gallus am Rand des alemannischen Siedlungsgebiets gegründet wurde. Für ihre Disziplin und Ordnung bekannt, beherbergt sie ein #italic Skriptorium#! und eine Bibliothek von außergewöhnlicher Qualität. Hier kopieren, übersetzen und bewahren Mönche klassische und heilige Schriften für die Gelehrten der ganzen Christenheit."
 MA_saint_gall: "$building_type_MA_saint_gall$"
 
 #Sé of Lisbon
 MA_se_lisbon_district: "$building_type_MA_se_lisbon$"
 MA_se_lisbon_district_desc: "$building_type_MA_se_lisbon_desc$"
 building_type_MA_se_lisbon: "Kathedrale von Lissabon"
 building_type_MA_se_lisbon_desc: "Eine wuchtige romanische Kathedrale an den Hängen über dem Hafen, deren dicke Mauern und schmale Fenster die unruhigen Zeiten des iberischen Ringens widerspiegeln. Nach der christlichen Rückeroberung der Stadt über den Ruinen einer alten Moschee errichtet, verwahrt sie unter ihren steinernen Gewölben Reliquien des heiligen Vinzenz und empfängt Prozessionen in ihrem widerhallenden Kirchenschiff."
 MA_se_lisbon: "$building_type_MA_se_lisbon$"
 
 #Alto Douro Vineyards
 MA_alto_douro_district: "$building_type_MA_alto_douro$"
 MA_alto_douro_district_desc: "$building_type_MA_alto_douro_desc$"
 building_type_MA_alto_douro: "Weinberge des Alto Douro"
 building_type_MA_alto_douro_desc: "Terrassierte Weinberge ziehen sich über die steilen Hänge des Dourotals, wo Steinmauern die Erde halten und die Sonnenwärme einfangen. Schon zur Römerzeit angelegt, bringen die Reben seit Langem kräftige, dunkle Weine hervor, die flussabwärts zu den Küstenmärkten und an fremde Höfe gelangen."
 MA_alto_douro: "$building_type_MA_alto_douro$"
 
 #Fortifications on the Guadalquivir
 MA_guadalquivir_fortifications_district: "$building_type_MA_guadalquivir_fortifications$"
 MA_guadalquivir_fortifications_district_desc: "$building_type_MA_guadalquivir_fortifications_desc$"
 building_type_MA_guadalquivir_fortifications: "Befestigungen am Guadalquivir"
 building_type_MA_guadalquivir_fortifications_desc: "Entlang der Ufer des Guadalquivir bewachen Befestigungen mit zahlreichen Türmen und Toren den geschäftigen Hafen von Sevilla. Besonders eindrucksvoll ist die Torre del Oro, ein zwölfeckiger Wachturm, dessen goldfarbener Kalkanstrich über dem Wasser schimmert: ein Orientierungspunkt für ankommende Schiffe und zugleich eine Warnung vor der Macht der Stadt."
 MA_guadalquivir_fortifications: "$building_type_MA_guadalquivir_fortifications$"
 
 #Madinat al-Zahra
 MA_madinat_alzahra_district: "$building_type_MA_madinat_alzahra$"
 MA_madinat_alzahra_district_desc: "$building_type_MA_madinat_alzahra_desc$"
 building_type_MA_madinat_alzahra: "Madinat al-Zahra"
 building_type_MA_madinat_alzahra_desc: "Eine weitläufige Palaststadt am sanften Fuß der Hügel vor Córdoba, errichtet, um den Glanz des Kalifenhofs zur Schau zu stellen. Ihre Gärten, Pavillons und Empfangshallen verteilen sich über breite Terrassen, gesäumt von kunstvoll behauenen Mauern aus Marmor und Jaspis. Ihre Schönheit und Pracht inspirieren Dichter, von den feinsten Freuden des Lebens zu schreiben."
 MA_madinat_alzahra: "$building_type_MA_madinat_alzahra$"
 
 #Circus of Merida
 MA_circus_merida_district: "$building_type_MA_circus_merida$"
 MA_circus_merida_district_desc: "$building_type_MA_circus_merida_desc$"
 building_type_MA_circus_merida: "Circus von Mérida"
 building_type_MA_circus_merida_desc: "Die Überreste eines antiken römischen Circus erstrecken sich lang und schmal über die Ebene außerhalb Méridas. Verfallene Mauern und grasbewachsene Rennbahnen zeichnen noch immer seinen Umriss nach, während einige wenige Zypressen sanften Schatten spenden. In der Nähe ist außerhalb der Ruinen eine kleine Kirche mit einem stillen Friedhof entstanden und gibt dem Ort eine neue Bestimmung."
 MA_circus_merida: "$building_type_MA_circus_merida$"
 
 #Alhambra
 MA_alhambra1_district: "$building_type_MA_alhambra1$"
 MA_alhambra1_district_desc: "$building_type_MA_alhambra1_desc$"
 building_type_MA_alhambra1: "Alhambra"
 building_type_MA_alhambra1_desc: "Auf dem sanften Hügel Sabika wachen die roten Mauern der Alhambra über Granada und seine fruchtbare Ebene. In ihrem Schutz finden die Herrscher der Stadt Zuflucht vor Feinden und der sommerlichen Hitze, während Türme und Zinnen ihre Herrschaft über die Länder zu ihren Füßen verkünden."
 MA_alhambra2: "Neue Zitadelle"
 MA_alhambra3: "Höfe und Gärten"
 MA_alhambra4: "Löwenhof"
 MA_alhambra1: "Rote Festung"
 
 #The Cologne Cathedral
 MA_cologne_cathedral1_district: "$building_type_MA_cologne_cathedral1$"
 MA_cologne_cathedral1_district_desc: "$building_type_MA_cologne_cathedral1_desc$"
 building_type_MA_cologne_cathedral1: "Kölner Dom"
 building_type_MA_cologne_cathedral1_desc: "Die große Kirche von Köln, Sitz des Erzbischofs und Sinnbild des Stolzes der Stadt. Über Jahrhunderte erweitert und umgebaut, birgt sie Reliquien von unschätzbarem Wert, die Pilger von nah und fern anziehen, während ihre mächtigen Mauern über die Dächer der Stadt aufragen."
 MA_cologne_cathedral1: "Alter Kölner Dom"
 MA_cologne_cathedral2: "Doppeltürme des Kölner Doms"
 
 #Qutb Complex
 MA_qutb_complex1_district: "$building_type_MA_qutb_complex1$"
 MA_qutb_complex1_district_desc: "$building_type_MA_qutb_complex1_desc$"
 building_type_MA_qutb_complex1: "Qutb-Komplex"
 building_type_MA_qutb_complex1_desc: "Im Herzen Delhis liegt ein uralter heiliger Bezirk, in dem Herrscher Denkmäler und Tempel errichteten, um ihren Glauben und ihre Macht zu verkünden. Behauene Säulen und Höfe umgeben die große Eisensäule der Guptas, deren dunkler Schaft den Wandel der Dynastien und Götter überdauert."
 MA_qutb_complex1: "Eisensäule"
 MA_qutb_complex2: "Große Moschee von Delhi"
 MA_qutb_complex3: "Qutb Minar"
 MA_qutb_complex4: "Alai Minar"
 
 #Sigiriya
 MA_sigiriya1_district: "$building_type_MA_sigiriya1$"
 MA_sigiriya1_district_desc: "$building_type_MA_sigiriya1_desc$"
 building_type_MA_sigiriya1: "Sigiriya"
 building_type_MA_sigiriya1_desc: "Ein mächtiger, einsamer Felsen ragt aus dem dichten Dschungel empor. Auf seinem Gipfel thront die alte königliche Zitadelle von [Glossary('Sigiriya','MA_sigiriya_glossary')]. Treppen steigen an freskengeschmückten Mauern und dem gewaltigen Löwentor vorbei über Terrassengärten und Wasserbecken empor und zeugen vom Ehrgeiz der Könige, die sich hoch über der Erde niederließen."
 MA_sigiriya1: "Ruinen von Sigiriya"
 MA_sigiriya2: "Wiederhergestelltes Sigiriya"
 MA_sigiriya_glossary: "Ein singhalesisches Wort, das wörtlich \"Löwenfelsen\" bedeutet."
 
 #Great Sanchi Stupa
 MA_sanchi_stupa_district: "$building_type_MA_sanchi_stupa$"
 MA_sanchi_stupa_district_desc: "$building_type_MA_sanchi_stupa_desc$"
 building_type_MA_sanchi_stupa: "Große Stupa von Sanchi"
 building_type_MA_sanchi_stupa_desc: "Diese mächtige Kuppel aus Stein und Ziegeln wurde erstmals auf Befehl des großen Kaisers Ashoka errichtet. Seitdem wurde die Anlage von seinen Nachfolgern erweitert und vom Zahn der Zeit gezeichnet. Sie steht auf einer erhöhten Terrasse, umgeben von gemeißelten Balustraden und verzierten #italics Toranas#!, Torbauten, um die Pilger in endloser Andacht schreiten."
 MA_sanchi_stupa: "$building_type_MA_sanchi_stupa$"
 
 #Vindhyagiri Hill
 MA_gommateshwara1_district: "$building_type_MA_gommateshwara1$"
 MA_gommateshwara1_district_desc: "$building_type_MA_gommateshwara1_desc$"
 building_type_MA_gommateshwara1: "Hügel Vindhyagiri"
 building_type_MA_gommateshwara1_desc: "Steil über der Stadt Shravanabelagola erheben sich die Granithöhen des Vindhyagiri, gekrönt von Jain-Heiligtümern und Gebetshöfen. Barfuß steigen Pilger die in den Fels gehauenen Stufen empor, während die Luft von Glockenklang und dem Duft sonnengewärmten Steins erfüllt ist."
 MA_gommateshwara2: "Koloss von Gommateshwara"
 MA_gommateshwara1: "Tempel von Vindhyagiri"
 
 #Palace of Ghazni
 MA_ghazni_palace_district: "$building_type_MA_ghazni_palace$"
 MA_ghazni_palace_district_desc: "$building_type_MA_ghazni_palace_desc$"
 building_type_MA_ghazni_palace: "Palast der Ghaznawiden"
 building_type_MA_ghazni_palace_desc: "Außerhalb der Mauern von Ghazni liegt diese königliche Residenz, das Machtzentrum des Sultans der Stadt. Ihre Hallen gehen von einem viereckigen Hof mit #italic Iwanen#! aus. Sie sind kunstvoll behauen und reich mit Stuck und vielfarbigen Fliesen geschmückt, inspiriert von der Kunst Persiens."
 MA_ghazni_palace: "$building_type_MA_ghazni_palace$"
 
 #Stupas of Anuradhapura
 MA_stupas_anuradhapura_district: "$building_type_MA_stupas_anuradhapura$"
 MA_stupas_anuradhapura_district_desc: "$building_type_MA_stupas_anuradhapura_desc$"
 building_type_MA_stupas_anuradhapura: "Stupas von Anuradhapura"
 building_type_MA_stupas_anuradhapura_desc: "Rund um die alte Tempelstadt Anuradhapura erheben sich die gewaltigen gemauerten [Glossary('Stupas','MA_stupa_glossary')] der singhalesischen Könige, errichtet zur Aufbewahrung von Reliquien des Buddha. Die weiß getünchten Klöster und Bildungsstätten der Stadt leuchten in der Sonne, während in ihren Hallen und Höfen gelehrte Debatten geführt werden."
 MA_stupas_anuradhapura: "$building_type_MA_stupas_anuradhapura$"
 
 #Eye of the Sahara
 MA_eye_sahara_district: "$building_type_MA_eye_sahara$"
 MA_eye_sahara_district_desc: "$building_type_MA_eye_sahara_desc$"
 building_type_MA_eye_sahara: "Auge der Sahara"
 building_type_MA_eye_sahara_desc: "Eine gewaltige kreisrunde Formation im Herzen der Wüste, deren felsige Ringe sich meilenweit über den Sand erstrecken. Aus der Ferne gleicht sie einem riesigen, verwitterten Auge, das zum Himmel blickt, ein weithin bekanntes Wahrzeichen für Nomaden und Karawanen, die die umliegende Einöde durchqueren. \nUralte Legenden verbinden es mit einer einst blühenden, wasserreichen Stadt, die heute vom Sand verschlungen ist."
 MA_eye_sahara: "$building_type_MA_eye_sahara$"
 
 #Great Mosque of Mahdia
 MA_mahdia_mosque_district: "$building_type_MA_mahdia_mosque$"
 MA_mahdia_mosque_district_desc: "$building_type_MA_mahdia_mosque_desc$"
 building_type_MA_mahdia_mosque: "Große Moschee von Mahdia"
 building_type_MA_mahdia_mosque_desc: "Auf der Halbinsel an der felsigen Küste von Mahdia errichtet, wirkt diese schlichte Moschee mit ihren hellen Steintürmen wie eine Festung. \nIn ihrem Inneren führen zwei elegante Arkadenhöfe zu den Gebetshallen, in denen sich die Gläubigen unter hellen Steinbögen versammeln."
 MA_mahdia_mosque: "$building_type_MA_mahdia_mosque$"
 
 #Saint Mark's of Zagreb
 MA_zagreb_church_district: "$building_type_MA_zagreb_church$"
 MA_zagreb_church_district_desc: "$building_type_MA_zagreb_church_desc$"
 building_type_MA_zagreb_church: "Markuskirche von Zagreb"
 building_type_MA_zagreb_church_desc: "Mit Hilfe italienischer und deutscher Handwerker errichtet, überragt die Markuskirche den Rest der Stadt. Ihr romanischer Grundriss ist durch gotische Anbauten bereichert, und ihre Portale und Wände sind reich mit biblischen Geschichten bemalt."
 MA_zagreb_church: "$building_type_MA_zagreb_church$"
 
 #Walls of Balkh
 MA_walls_balkh_district: "$building_type_MA_walls_balkh$"
 MA_walls_balkh_district_desc: "$building_type_MA_walls_balkh_desc$"
 building_type_MA_walls_balkh: "Stadtmauern von Balch"
 building_type_MA_walls_balkh_desc: "Seit Jahrhunderten wird die Zitadelle von Balch durch zwei große, ineinanderliegende kreisförmige Mauerringe geschützt, die den gesamten Umfang umschließen. Ihre Erdwälle und Türme bilden ein Bollwerk gegen die Heere, die über die Steppe ziehen, und schützen die Märkte und Werkstätten der Stadt."
 MA_walls_balkh: "$building_type_MA_walls_balkh$"
 
 #Martand Sun Temple
 MA_martand_sun_temple_district: "$building_type_MA_martand_sun_temple$"
 MA_martand_sun_temple_district_desc: "$building_type_MA_martand_sun_temple_desc$"
 building_type_MA_martand_sun_temple: "Sonnentempel von Martand"
 building_type_MA_martand_sun_temple_desc: "Auf einem hohen Plateau im Kaschmirtal errichtet, ist dieser Tempel einer der ältesten, die dem Sonnengott geweiht sind. Sein großes Allerheiligstes liegt in der Mitte und wird von zahlreichen kleineren Schreinen und Reihen gemeißelter Götter- und Himmelsgestalten umgeben. Im Peristylhof liegt ein friedliches Wasserbecken, das im Sonnenlicht glänzt."
 MA_martand_sun_temple: "$building_type_MA_martand_sun_temple$"
 
 #Ruins of Aquae Sulis
 MA_aquae_sulis_ruins_district: "$building_type_MA_aquae_sulis_ruins$"
 MA_aquae_sulis_ruins_district_desc: "$building_type_MA_aquae_sulis_ruins_desc$"
 building_type_MA_aquae_sulis_ruins: "Ruinen von Aquae Sulis"
 building_type_MA_aquae_sulis_ruins_desc: "#low Das Werk der Riesen verfällt#! \nRund um die dampfende heilige Quelle liegen die zerfallenen Überreste von Aquae Sulis, wo die Römer einst große Bäder und Tempel aus Quaderstein errichteten. Zerbrochene Mauern, eingestürzte Bögen und überflutete Kammern lassen den geordneten Grundriss der antiken Anlage noch erkennen. Ihr warmes Wasser fließt weiterhin, während sich Pilger und Bürger zwischen den Ruinen versammeln."
 MA_aquae_sulis_ruins: "$building_type_MA_aquae_sulis_ruins$"
 
 #Winchester Minster
 MA_winchester_minster_district: "$building_type_MA_winchester_minster$"
 MA_winchester_minster_district_desc: "$building_type_MA_winchester_minster_desc$"
 building_type_MA_winchester_minster: "Münster von Winchester"
 building_type_MA_winchester_minster_desc: "Das große Münster ist eine weitläufige Basilika aus Stein und Holz, mit einem breiten, bemalten Kirchenschiff und mehreren Glockentürmen. Es beherrscht die Königsstadt, übertrifft alle ihre übrigen Bauwerke bei Weitem und wacht über die königlichen Gräber von Wessex."
 MA_winchester_minster: "$building_type_MA_winchester_minster$"
 
 #Westminster Abbey
 MA_westminster_abbey_district: "$building_type_MA_westminster_abbey$"
 MA_westminster_abbey_district_desc: "$building_type_MA_westminster_abbey_desc$"
 building_type_MA_westminster_abbey: "Westminster Abbey"
 building_type_MA_westminster_abbey_desc: "An der Themse errichtet und von den englischen Königen reich beschenkt, ist Westminster Abbey eine große steinerne Klosterkirche. Ihr langes Kirchenschiff und ihr hoch aufragender Chor sind mit gemeißelten Kapitellen und Wandmalereien geschmückt. Hier werden Könige gekrönt und zur letzten Ruhe gebettet. So dient die Abtei als heiliger Schauplatz, an dem königliche Herrschaft und göttliche Gunst miteinander verbunden werden."
 MA_westminster_abbey: "$building_type_MA_westminster_abbey$"
 
 #Lorsch Gate
 MA_lorsch_gate_district: "$building_type_MA_lorsch_gate$"
 MA_lorsch_gate_district_desc: "$building_type_MA_lorsch_gate_desc$"
 building_type_MA_lorsch_gate: "Torhalle von Lorsch"
 building_type_MA_lorsch_gate_desc: "Die monumentale Torhalle der Abtei Lorsch ist ein seltenes und sorgfältig ausgeführtes Beispiel karolingischer Baukunst. Aus fein behauenem Stein und Ziegeln errichtet, ist ihre symmetrische Fassade durch Halbsäulen, Blendbögen und klassischen Schmuck gegliedert, der an antike römische Vorbilder erinnert."
 MA_lorsch_gate: "$building_type_MA_lorsch_gate$"
 
 #Dover Castle
 MA_dover_castle_district: "$building_type_MA_dover_castle$"
 MA_dover_castle_district_desc: "$building_type_MA_dover_castle_desc$"
 building_type_MA_dover_castle: "Burg Dover"
 building_type_MA_dover_castle_desc: "Auf den weißen Klippen über dem schmalen Ärmelkanal gelegen, beherrscht diese Festung den wichtigsten Zugang zwischen England und dem Kontinent. Ihr mächtiger steinerner Bergfried, die Ringmauern und die gestaffelten Torhäuser bilden einen gewaltigen Verteidigungskomplex. Er kontrolliert den Hafen und die Straßen ins Landesinnere und dient zugleich als königliche Festung und Residenz."
 MA_dover_castle: "$building_type_MA_dover_castle$"
 
 #Château Gaillard
 MA_chateau_gaillard_district: "$building_type_MA_chateau_gaillard$"
 MA_chateau_gaillard_district_desc: "$building_type_MA_chateau_gaillard_desc$"
 building_type_MA_chateau_gaillard: "Château Gaillard"
 building_type_MA_chateau_gaillard_desc: "Auf einem Kalksteinsporn über der Seine erbaut, ist Château Gaillard eine kompakte und ausgeklügelte steinerne Festung, die für die aktive Verteidigung ausgelegt ist. Ihre konzentrischen Mauern, abgewinkelten Türme und vorgeschobenen Toranlagen verringern tote Winkel und bündeln das Abwehrfeuer auf den Zugangswegen. Rasch und präzise errichtet, verkörpert sie die neuesten Grundsätze der Festungsbaukunst und sichert die Kontrolle über den Fluss und die Grenze der Normandie."
 MA_chateau_gaillard: "$building_type_MA_chateau_gaillard$"
 
 #Carnac Stones
 MA_carnac_stones_district: "$building_type_MA_carnac_stones$"
 MA_carnac_stones_district_desc: "$building_type_MA_carnac_stones_desc$"
 building_type_MA_carnac_stones: "Steine von Carnac"
 building_type_MA_carnac_stones_desc: "Hunderte gewaltige Steine sind über die Ebene verstreut und in geordneten Reihen bis zum Horizont aufgestellt. In einer fernen, jenseits aller Erinnerung liegenden Zeit errichtet, ist ihr wahrer Zweck in Legenden und Erzählungen verloren gegangen."
 MA_carnac_stones: "$building_type_MA_carnac_stones$"
 
 #Guérande Salt Marshes
 MA_guerande_salt_marshes_district: "$building_type_MA_guerande_salt_marshes$"
 MA_guerande_salt_marshes_district_desc: "$building_type_MA_guerande_salt_marshes_desc$"
 building_type_MA_guerande_salt_marshes: "Salzgärten von Guérande"
 building_type_MA_guerande_salt_marshes_desc: "Entlang der flachen Küstenlandschaft bei Guérande erstreckt sich ein Netz aus Salzbecken, Deichen und Kanälen, in denen die berühmte Delikatesse #italic Fleur de Sel#! aus dem Meer gewonnen wird. Meerwasser wird durch seichte Becken geleitet, in denen die Sonne das weiße Salz zurücklässt. Dieses über Generationen überlieferte Handwerk erhält die Städte und den Handel der Region."
 MA_guerande_salt_marshes: "$building_type_MA_guerande_salt_marshes$"
 
 #Reims Cathedral
 MA_reims_cathedral_district: "$building_type_MA_reims_cathedral$"
 MA_reims_cathedral_district_desc: "$building_type_MA_reims_cathedral_desc$"
 building_type_MA_reims_cathedral: "Kathedrale von Reims"
 building_type_MA_reims_cathedral_desc: "Eine gewaltige gotische Kathedrale, geprägt von einem hohen Mittelschiff, schlanken Bündelpfeilern sowie ausgedehnten Kreuzrippengewölben und Strebebögen. Ihre Westfassade ist reich mit skulptierten Portalen und tiefen Archivolten gegliedert. Im Inneren betonen große Buntglasfenster Höhe, Licht und zeremonielle Pracht, wie es ihrer zentralen Rolle bei den französischen Königskrönungen gebührt."
 MA_reims_cathedral: "$building_type_MA_reims_cathedral$"
 
 #Chartres Cathedral
 MA_chartres_cathedral_district: "$building_type_MA_chartres_cathedral$"
 MA_chartres_cathedral_district_desc: "$building_type_MA_chartres_cathedral_desc$"
 building_type_MA_chartres_cathedral: "Kathedrale von Chartres"
 building_type_MA_chartres_cathedral_desc: "Als eines der elegantesten und wohlgeordnetsten Zeugnisse hochgotischen Ehrgeizes zeichnet sich Chartres durch sein breites Langhaus, kräftige Pfeiler und einen tiefen Chor aus. Ihre Mauern sind weitgehend durch Buntglasfenster in einem tragfähigen steinernen Gerüst ersetzt, während die Zwillingstürme und die sorgfältig abgestuften Höhenverhältnisse Beständigkeit, Klarheit und theologische Absicht zum Ausdruck bringen."
 MA_chartres_cathedral: "$building_type_MA_chartres_cathedral$"
 
 #Palace of Avignon
 MA_avignon_palace1_district: "$building_type_MA_avignon_palace1$"
 MA_avignon_palace1_district_desc: "$building_type_MA_avignon_palace1_desc$"
 building_type_MA_avignon_palace1: "Palast von Avignon"
 building_type_MA_avignon_palace1_desc: "Hoch auf einem Felsvorsprung über der Rhône erhebt sich dieser große Festungspalast, Sitz eines kultivierten und mächtigen Hofes. Seine Hallen, Türme und gewölbten Kapellen verbinden Festigkeit mit eleganten Formen, während Gesandte, Handwerker und Händler die Straßen darunter füllen, angezogen vom Reichtum und der Autorität seiner Herrscher."
 MA_avignon_palace1: "Alter Palast"
 MA_avignon_palace2: "Neuer Palast"
 
 #Walls of Carcassonne
 MA_walls_carcassonne1_district: "$building_type_MA_walls_carcassonne1$"
 MA_walls_carcassonne1_district_desc: "$building_type_MA_walls_carcassonne1_desc$"
 building_type_MA_walls_carcassonne1: "Stadtmauern von Carcassonne"
 building_type_MA_walls_carcassonne1_desc: "Die alten Mauern von Carcassonne schützen das Tal und die Straßen zwischen den iberischen und fränkischen Ländern. Türme und starke Toranlagen krönen den Mauerring und bewachen die Häuser innerhalb und die Felder darunter – eine gewaltige Festung an einer Grenze, um die Könige und Glaubensgemeinschaften seit Langem ringen."
 MA_walls_carcassonne1: "Alte Stadtmauern von Carcassonne"
 MA_walls_carcassonne2: "Doppelte Stadtmauern von Carcassonne"
 
 #Saint-Denis Basilica
 MA_saint_denis_basilica1_district: "$building_type_MA_saint_denis_basilica1$"
 MA_saint_denis_basilica1_district_desc: "$building_type_MA_saint_denis_basilica1_desc$"
 building_type_MA_saint_denis_basilica1: "Basilika von Saint-Denis"
 building_type_MA_saint_denis_basilica1_desc: "Über der Grabstätte des heiligen Dionysius errichtet, ist diese große Basilika ein Heiligtum königlicher Frömmigkeit. Ihr breites Kirchenschiff führt die Pilger zum Schrein des Heiligen, während bemalte Wände und gemeißelte Kapitelle über die darunter ruhenden Könige wachen. Hier sind die Autorität der Krone und der Kirche in Stein miteinander verbunden."
 MA_saint_denis_basilica1: "Königliche Basilika von Saint-Denis"
 MA_saint_denis_basilica2: "Großer Chor von Saint-Denis"
 
 #Île de la Cité
 MA_ile_de_la_cite1_district: "$building_type_MA_ile_de_la_cite1$"
 MA_ile_de_la_cite1_district_desc: "$building_type_MA_ile_de_la_cite1_desc$"
 building_type_MA_ile_de_la_cite1: "Île de la Cité"
 building_type_MA_ile_de_la_cite1_desc: "Nach dem Untergang Roms fanden die Bürger Sicherheit auf der Insel, die von den Wassern einer Seinebiegung umschlossen wird. Seither jedoch ist die Île lebendig, schön und stolz geworden. Heute bildet sie das politische, geistige und wirtschaftliche Herz von Paris und damit auch Frankreichs."
 MA_ile_de_la_cite1: "Karolingischer Palast"
 MA_ile_de_la_cite2: "Gotischer Palast"
 
 #Iron Gate
 MA_iron_gate_district: "$building_type_MA_iron_gate$"
 MA_iron_gate_district_desc: "$building_type_MA_iron_gate_desc$"
 building_type_MA_iron_gate: "Eisernes Tor"
 building_type_MA_iron_gate_desc: "Das Eiserne Tor bewacht den Gebirgspass, der die Orontesebene mit dem hoch darüberliegenden Gebirge verbindet, und bildet einen der wichtigsten Zugänge nach Antiochia. Hier verengen sich die Mauern zu einem befestigten Engpass mit steinernen Türmen, Toren und Stützmauern, die unmittelbar im Fels verankert sind. Die Zitadelle dient zugleich als eine Art Staudamm, der den Wildbach Parmenios bändigt und so die Stadt schützt."
 MA_iron_gate: "$building_type_MA_iron_gate$"
 
 #Pula Amphitheater
 MA_pula_amphiteater_district: "$building_type_MA_pula_amphiteater$"
 MA_pula_amphiteater_district_desc: "$building_type_MA_pula_amphiteater_desc$"
 building_type_MA_pula_amphiteater: "Amphitheater von Pula"
 building_type_MA_pula_amphiteater_desc: "Aus sorgfältig behauenem Kalkstein errichtet, bewahrt dieses Amphitheater die vollständige Gestalt einer römischen Arena mit elliptischen Mauern, ansteigenden Sitzreihen und einem System gewölbter Gänge darunter. Seine vier Ecktürme und robusten Arkaden zeugen von der stolzen Ingenieurstradition, die es hervorbrachte. Auch in der mittelalterlichen Stadt bleibt das Bauwerk ein Mittelpunkt der Herrschaft, der Versammlungen und der Schauspiele."
 MA_pula_amphiteater: "$building_type_MA_pula_amphiteater$"
 
 #Olympus
 MA_olympus_district: "$building_type_MA_olympus$"
 MA_olympus_district_desc: "$building_type_MA_olympus_desc$"
 building_type_MA_olympus: "Olymp"
 building_type_MA_olympus_desc: "Ein hoch aufragender Berg im Herzen Thessaliens, dessen zerklüfteter Gipfel – der höchste ganz Griechenlands – lange Schatten über das Meer und die sanften, fruchtbaren Hänge wirft. \nAls Wohnsitz der Götter verehrt, weckt er seit Jahrtausenden Ehrfurcht und Staunen. Sein Gipfel soll von ihrem unsichtbaren Palast gekrönt sein."
 MA_olympus: "$building_type_MA_olympus$"
 
 #Ypres Cloth Hall
 MA_ypres_cloth_hall_district: "$building_type_MA_ypres_cloth_hall$"
 MA_ypres_cloth_hall_district_desc: "$building_type_MA_ypres_cloth_hall_desc$"
 building_type_MA_ypres_cloth_hall: "Tuchhalle von Ypern"
 building_type_MA_ypres_cloth_hall_desc: "Diese gewaltige städtische Halle aus Stein und Holz wurde für die Kontrolle, Lagerung und den Handel mit Wolltuch errichtet, auf dem der Reichtum der Stadt beruht. Ihre lange, geordnete Fassade ist durch Arkaden, Giebel und einen beherrschenden Belfried gegliedert und verbindet kaufmännischen Nutzen mit städtischer Autorität. In den gewölbten Hallen überwachen Kaufleute, Zunftbeamte und Magistrate Verträge, Maße und Abgaben im Herzen der städtischen Wirtschaft."
 MA_ypres_cloth_hall: "$building_type_MA_ypres_cloth_hall$"
 
 #Gravensteen
 MA_gravensteen_district: "$building_type_MA_gravensteen$"
 MA_gravensteen_district_desc: "$building_type_MA_gravensteen_desc$"
 building_type_MA_gravensteen: "Gravensteen"
 building_type_MA_gravensteen_desc: "Diese eindrucksvolle Steinburg dient als Sitz der Grafen von Flandern und als Sinnbild ihrer Herrschaft über die Stadt. Um einen gewaltigen Donjon angelegt und von starken Ringmauern umschlossen, vereint sie Wohnsäle, Gerichtsräume und Verteidigungsanlagen. So behauptet sie die Macht des Landesherrn inmitten der dichten Bebauung Gents."
 MA_gravensteen: "$building_type_MA_gravensteen$"
 
 #Mount Ararat
 MA_ararat_district: "$building_type_MA_ararat$"
 MA_ararat_district_desc: "$building_type_MA_ararat_desc$"
 building_type_MA_ararat: "Berg Ararat"
 building_type_MA_ararat_desc: "Ein gewaltiges Vulkanmassiv mit zwei Gipfeln erhebt sich über die umliegenden Ebenen. Mit seinem ewig schneebedeckten Gipfel beherrscht der Ararat den Horizont. In zahlreichen Königreichen und Glaubensgemeinschaften verehrt, gilt er nach alter Überlieferung als Ruheplatz der Arche Noah und verleiht den Ländern an seinen Hängen heilige Würde und feierliche Erhabenheit."
 MA_ararat: "$building_type_MA_ararat$"
 
 #Székesfehérvár Basilica
 MA_szekesfehervar_basilica1_district: "$building_type_MA_szekesfehervar_basilica1$"
 MA_szekesfehervar_basilica1_district_desc: "$building_type_MA_szekesfehervar_basilica1_desc$"
 building_type_MA_szekesfehervar_basilica1: "Basilika von Székesfehérvár"
 building_type_MA_szekesfehervar_basilica1_desc: "Diese große steinerne Basilika ist das zeremonielle und dynastische Herz des ungarischen Reiches. In ihrem breiten Kirchenschiff werden Könige gekrönt und zur letzten Ruhe gebettet. So vereinen sich Königtum, Recht und Glaube unter den Gewölben des bedeutendsten königlichen Heiligtums des Landes."
 MA_szekesfehervar_basilica1: "Königliche Basilika von Székesfehérvár"
 MA_szekesfehervar_basilica2: "Großer Chor von Székesfehérvár"
 
 #Prague Castle
 MA_prague_castle1_district: "$building_type_MA_prague_castle1$"
 MA_prague_castle1_district_desc: "$building_type_MA_prague_castle1_desc$"
 building_type_MA_prague_castle1: "Prager Burg"
 building_type_MA_prague_castle1_desc: "Auf dem langgestreckten Höhenzug über der Moldau überblicken die Hallen, Kirchen und Höfe der Prager Burg die Stadt. Handwerker, Gefolgsleute und Geistliche versammeln sich um diesen Sitz der Herrscher Böhmens, deren Reichtum und Ehrgeiz den Hügel zum politischen und heiligen Mittelpunkt ihrer Länder gemacht haben."
 MA_prague_castle1: "Fürstensitz von Prag"
 MA_prague_castle2: "Königsburg von Prag"
 
 #Saint Adrian's Basilica
 MA_zalavar_basilica_district: "$building_type_MA_zalavar_basilica$"
 MA_zalavar_basilica_district_desc: "$building_type_MA_zalavar_basilica_desc$"
 building_type_MA_zalavar_basilica: "Basilika des heiligen Adrian"
 building_type_MA_zalavar_basilica_desc: "Als Mittelpunkt einer befestigten karolingischen Siedlung in den Sümpfen der Zala ist die Basilika des heiligen Adrian eine bedeutende kirchliche Gründung aus der Frühzeit der Christianisierung der Region. Als dreischiffige Steinkirche mit ausgeprägtem Altarraum und Westbauten dient sie sowohl als Missionszentrum als auch als Fürstenkirche, mit der ihr Schutzherr seinen diplomatischen Einfluss auf die Grenzgebiete ausdehnt."
 MA_zalavar_basilica: "$building_type_MA_zalavar_basilica$"
 
 #Baths of Hisham
 MA_baths_hisham_district: "$building_type_MA_baths_hisham$"
 MA_baths_hisham_district_desc: "$building_type_MA_baths_hisham_desc$"
 building_type_MA_baths_hisham: "Bäder des Hischam"
 building_type_MA_baths_hisham_desc: "Diese Bäder sind Teil einer größeren Palastanlage und bestehen aus einer Abfolge kalter, warmer und heißer Räume, die von einem Hypokaustensystem beheizt und von Steingewölben überspannt werden. Ihre Böden sind reich mit geometrischen und figürlichen Mosaiken bedeckt, insbesondere mit dem großen Mosaik aus Bäumen und Tieren, das mit feinen Tesserae und sorgfältiger Komposition ausgeführt wurde."
 MA_baths_hisham: "$building_type_MA_baths_hisham$"
 
 #Peel Castle
 MA_peel_castle1_district: "$building_type_MA_peel_castle1$"
 MA_peel_castle1_district_desc: "$building_type_MA_peel_castle1_desc$"
 building_type_MA_peel_castle1: "St.-Patrick-Insel"
 building_type_MA_peel_castle1_desc: "Auf der felsigen Insel des heiligen Patrick blicken Kirchen, Hallen und Begräbnisstätten auf das umgebende Meer. Hier treffen ältere einheimische Traditionen und der Glaube neuer Siedler aufeinander, während Geistliche und Herrscher eine enge Zuflucht teilen, deren geschützte Ufer Gottesdienst und weltliche Macht miteinander verbinden."
 MA_peel_castle1: "Inselkloster St. Patrick"
 MA_peel_castle2: "Halle des heiligen Patrick"
 MA_peel_castle3: "Burg Peel"
 
 #Knin Fortress
 MA_knin_fortress_district: "$building_type_MA_knin_fortress$"
 MA_knin_fortress_district_desc: "$building_type_MA_knin_fortress_desc$"
 building_type_MA_knin_fortress: "Festung Knin"
 building_type_MA_knin_fortress_desc: "Auf einem schmalen Kalksteinkamm über dem Krkatal erstreckt sich die Festung Knin als langgezogener, gegliederter Verteidigungskomplex aus Mauern, Türmen und geschlossenen Höfen. Ihre Lage ermöglicht die Kontrolle der Wege zwischen der Küste und den Ebenen des Hinterlandes und macht sie zu einem der wichtigsten königlichen Stützpunkte der Region."
 MA_knin_fortress: "$building_type_MA_knin_fortress$"
 
 #Amaravati Stupa
 MA_amaravati_stupa_district: "$building_type_MA_amaravati_stupa$"
 MA_amaravati_stupa_district_desc: "$building_type_MA_amaravati_stupa_desc$"
 building_type_MA_amaravati_stupa: "Stupa von Amaravati"
 building_type_MA_amaravati_stupa_desc: "Eine große, uralte [Glossary('Stupa','MA_stupa_glossary')], mit weißen Kalksteinplatten verkleidet, die größte im dravidischen Indien. Farbige erzählende Reliefs sind in das Ziegelmauerwerk gemeißelt und zeigen in Medaillons und Friesen das Leben des Buddha und Szenen der Verehrung. Torbauten kennzeichnen die Zugänge aus den vier Himmelsrichtungen und ordnen die rituellen Umzüge um den heiligen Hügel."
 MA_amaravati_stupa: "$building_type_MA_amaravati_stupa$"
 MA_stupa_glossary: "Ein kuppelförmiges Bauwerk zur Aufbewahrung von Reliquien, das im Buddhismus als Ort der Meditation und Verehrung dient. Frühe Stupas waren einfache Hügel; ihre Gestalt und Funktion entwickelten sich im Lauf der Zeit weiter und beeinflussten die buddhistische Architektur in ganz Asien, möglicherweise auch die Pagoden."
 
 #Karla Caves
 MA_karla_caves_district: "$building_type_MA_karla_caves$"
 MA_karla_caves_district_desc: "$building_type_MA_karla_caves_desc$"
 building_type_MA_karla_caves: "Höhlen von Karla"
 building_type_MA_karla_caves_desc: "Direkt in den Berghang gehauen, bilden die Höhlen von Karla eine Anlage aus felsgehauenen [Glossary('Viharas','MA_vihara')] und Heiligtümern, deren Mittelpunkt eine große Chaitya-Halle ist. Der weite Raum wird von einer hohen Gewölbedecke mit gemeißelten Rippen, einem langen säulengesäumten Schiff und einer [Glossary('Stupa','MA_stupa_glossary')] am Apsisende geprägt. Die Eingangsfassade ist mit einem großen Hufeisenbogen und gemeißelten Reliefs gegliedert und markiert den Übergang von der Außenwelt in den geordneten Innenraum ritueller Bewegung und Verehrung."
 MA_karla_caves: "$building_type_MA_karla_caves$"
 MA_vihara: "Eine Art buddhistischer Tempel mit Wohnräumen für Mönche. In der indischen Architektur bezeichnet der Begriff insbesondere eine zentrale Halle mit daran angeschlossenen Zellen."
 
 #Somnath Temple
 MA_somnath_temple_district: "$building_type_MA_somnath_temple$"
 MA_somnath_temple_district_desc: "$building_type_MA_somnath_temple_desc$"
 building_type_MA_somnath_temple: "Somnath-Tempel"
 building_type_MA_somnath_temple_desc: "Der große Steintempel von Somnath ist dem Mondgott geweiht und entlang einer Längsachse aus [Glossary('Mandapas','MA_mandapa')] angeordnet, die zum von einer hoch aufragenden [Glossary('Shikhara','MA_vimana_glossary')] gekrönten Allerheiligsten führt. Seine Mauern und Pfeiler sind reich mit Skulpturen von Gottheiten, Begleitfiguren und Zierfriesen behauen. Als bedeutendes Pilgerzentrum zieht er Gläubige aus der ganzen Region an, aber auch die neidischen Blicke heidnischer Heere jenseits des Indus."
 MA_somnath_temple: "$building_type_MA_somnath_temple$"
 MA_mandapa: "Eine von Säulen getragene Halle oder ein Pavillon der indischen Architektur, der als Übergangsraum und Eingang zu einem Tempel dient."
 
 #Devagiri
 MA_devagiri_district: "$building_type_MA_devagiri$"
 MA_devagiri_district_desc: "$building_type_MA_devagiri_desc$"
 building_type_MA_devagiri: "Devagiri"
 building_type_MA_devagiri_desc: "Ein mächtiger Vulkanhügel steigt unvermittelt aus der Ebene empor. Schmale, gewundene Pfade führen über seine dunklen Basalthänge zum Gipfel. Der als [Glossary('Devagiri','MA_devagiri_glossary')] bekannte Berg birgt uralte Höhlen und Heiligtümer und bietet mit seinen beherrschenden Höhen all jenen eine gewaltige Zuflucht, die ihn besitzen."
 MA_devagiri: "$building_type_MA_devagiri$"
 MA_daulatabad: "Daulatabad"
 MA_devagiri_glossary: "Aus dem Sanskrit: \"Hügel der Götter\"."
 MA_daulatabad_glossary: "Der Wohnsitz des Reichtums."
 
 #Ashoka's Palace
 MA_ashoka_palace1_district: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_palace1_district_desc: "$building_type_MA_ashoka_palace1_desc$"
 building_type_MA_ashoka_palace1: "Palast des Ashoka"
 building_type_MA_ashoka_palace1_desc: "Der Palast des großen [Glossary('Ashoka','MA_ashoka_glossary')] zeugt vom Reichtum und der Macht der alten Könige Indiens. Seine weiten Höfe und säulengesäumten Hallen haben Geschichten von ungewöhnlicher Pracht inspiriert. Ihre Größe und Eleganz sind ein würdiges Vorbild für jene, die den alten Ruhm wiederherstellen möchten."
 MA_ashoka_palace1: "Ruinen des Palastes von Ashoka"
 MA_ashoka_palace2: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_glossary: "Der dritte Kaiser der Maurya-Dynastie, bekannt für seine Wandlung von einem grausamen Kriegsherrn zu einem sittlichen Herrscher, der den Buddhismus und weitreichende Missionsbestrebungen förderte."
 
 #Adina Mosque
 MA_adina_mosque_district: "$building_type_MA_adina_mosque$"
 MA_adina_mosque_district_desc: "$building_type_MA_adina_mosque_desc$"
 building_type_MA_adina_mosque: "Adina-Moschee"
 building_type_MA_adina_mosque_desc: "Die Adina ist eine weitläufige [Glossary('Hypostyl','MA_hypostyle_glossary')]-Moschee aus Ziegel und Stein. Sie ist um einen großen rechteckigen Hof angeordnet, der von Arkaden und Reihen kuppelüberwölbter Joche umgeben ist. Ihre Gebetshalle wird von einem monumentalen Tonnengewölbe überdeckt, das an die kaiserliche Baukunst Persiens erinnert. Gemeißelte steinerne [Glossary('Spolien','MA_spolia_glossary')] und Terrakottablumen schmücken die Außenmauern."
 MA_adina_mosque: "$building_type_MA_adina_mosque$"
 MA_hypostyle_glossary: "Eine Bauweise, bei der das Dach von Säulenreihen getragen wird, sodass ein großer, offener Innenraum entsteht."
 MA_spolia_glossary: "Bauelemente, die aus älteren Gebäuden übernommen und erneut verwendet werden, oft um Kontinuität und Legitimität auszudrücken. Besonders typisch, aber nicht ausschließlich, ist dies bei römischen Ruinen im Mittelmeerraum."
 
 #Chittorgarh
 MA_chittorgarh_district: "$building_type_MA_chittorgarh$"
 MA_chittorgarh_district_desc: "$building_type_MA_chittorgarh_desc$"
 building_type_MA_chittorgarh: "Chittorgarh"
 building_type_MA_chittorgarh_desc: "Auf dem Gipfel eines langen, isolierten Hügels gelegen, ist die Festung Chittor eines der größten Wehrbauwerke Indiens. Mächtige Mauern folgen über Meilen dem Rand des Plateaus und umschließen Paläste, Tempel und Türme innerhalb einer eigenständigen Zitadelle."
 MA_chittorgarh: "$building_type_MA_chittorgarh$"
 
 #Lingaraj Temple
 MA_lingaraj_temple_district: "$building_type_MA_lingaraj_temple$"
 MA_lingaraj_temple_district_desc: "$building_type_MA_lingaraj_temple_desc$"
 building_type_MA_lingaraj_temple: "Lingaraj-Tempel"
 building_type_MA_lingaraj_temple_desc: "Als eines der bedeutendsten Beispiele indischer Tempelbaukunst ist die Anlage des Lingaraj entlang einer einzigen Achse zunehmend heiliger Räume angeordnet, die zur hoch aufragenden, geschwungenen [Glossary('Vimana','MA_vimana_glossary')] Shivas führt. Jede Oberfläche ist mit gemeißelten Gottheiten, floralen Ornamenten und erzählenden Reliefs geschmückt."
 MA_lingaraj_temple: "$building_type_MA_lingaraj_temple$"
 MA_vimana_glossary: "Ein hoher, geschwungener Aufbau, der sich unmittelbar über dem inneren Heiligtum indischer Tempel erhebt und oft reich mit Schnitzereien und Verzierungen geschmückt ist. Im Norden wird dieser Stil #italic Shikhara#! genannt, während er in Südindien und Odisha als #italic Vimana#! bezeichnet wird."
 
 #Tsarevgrad
 MA_tsarevgrad1_district: "$building_type_MA_tsarevgrad1$"
 MA_tsarevgrad1_district_desc: "$building_type_MA_tsarevgrad1_desc$"
 building_type_MA_tsarevgrad1: "Zarewgrad"
 building_type_MA_tsarevgrad1_desc: "Die zerklüfteten Höhen über der Jantra beherrschen die Zugänge durch die umliegenden Täler. Auf diesen Hügeln bilden Mauern, Türme und Tempel eine Festung, deren natürliche Verteidigungsanlagen und hoch gelegene Hallen den Herrschern des Landes einen würdigen Sitz bieten."
 MA_tsarevgrad1: "Alte Festung von Tarnowo"
 MA_tsarevgrad2: "$building_type_MA_tsarevgrad1$"
 MA_tsarevets_glossary: "Stadt der Zaren, ein Name, der die kaiserlichen Bestrebungen und die göttliche Autorität jener Herrscher heraufbeschwört, die von dieser hoch gelegenen Festung aus regieren."
 
 #Orange Theater
 MA_orange_theater1_district: "$building_type_MA_orange_theater1$"
 MA_orange_theater1_district_desc: "$building_type_MA_orange_theater1_desc$"
 building_type_MA_orange_theater1: "Theater von Orange"
 building_type_MA_orange_theater1_desc: "Die hoch aufragende römische Bühnenwand von Orange erhebt sich über einem großen steinernen Halbrund – eine monumentale Erinnerung an die antike Größe der Stadt. Ihre Bögen, Säulen und gemeißelten Steine zeugen vom Können der Baumeister der Caesaren und prägen das Leben der Bürger noch Jahrhunderte nach dem Ende ihrer Herrschaft."
 MA_orange_theater1: "Ruinen des Theaters von Orange"
 MA_orange_theater2: "$building_type_MA_orange_theater1$"
 MA_cavea_glossary: "Vom lateinischen Wort für Einfriedung abgeleitet, bezeichnet der Begriff den halbrunden, stufenförmig angelegten Zuschauerraum eines römischen Theaters oder Amphitheaters."
 
 #Walls of Mesembria
 MA_walls_mesembria_district: "$building_type_MA_walls_mesembria$"
 MA_walls_mesembria_district_desc: "$building_type_MA_walls_mesembria_desc$"
 building_type_MA_walls_mesembria: "Stadtmauern von Mesembria"
 building_type_MA_walls_mesembria_desc: "Die Mauern um die felsige Halbinsel haben eine lange Geschichte: Sie beruhen auf griechischen Fundamenten und den großen Bauanstrengungen römischer und byzantinischer Kaiser. Die mächtigen Kurtinen, vorspringenden Türme und stark befestigten Tore schützen den Hafen und die schmale Landenge zur Küste. So zählt die Siedlung zu den am stärksten befestigten Hafenstädten am westlichen Schwarzen Meer."
 MA_walls_mesembria: "$building_type_MA_walls_mesembria$"
 
 #Sri Pada
 MA_sri_pada_district: "$building_type_MA_sri_pada$"
 MA_sri_pada_district_desc: "$building_type_MA_sri_pada_desc$"
 building_type_MA_sri_pada: "Berg Malaya"
 building_type_MA_sri_pada_desc: "Der steile Granitgipfel des Malaya ist ein markanter Anblick über den Wäldern Lankas und beherrscht die umliegende Landschaft. Auf seinem Gipfel steht ein kleiner Schrein um den [Glossary('Sri Pada','MA_sripada_glossary')], der einen endlosen Strom von Pilgern anzieht, die die gewundenen Pfade erklimmen, um über den Wolken zu beten."
 MA_sri_pada: "$building_type_MA_sri_pada$"
 MA_sripada_glossary: "Ein singhalesisches Wort für \"heiliger Fußabdruck\", der nach der Überlieferung vom Buddha selbst auf dem Berg hinterlassen wurde."
 
 #Palace of Palermo
 MA_palace_palermo1_district: "$building_type_MA_palace_palermo1$"
 MA_palace_palermo1_district_desc: "$building_type_MA_palace_palermo1_desc$"
 building_type_MA_palace_palermo1: "Palast von Palermo"
 building_type_MA_palace_palermo1_desc: "Die Paläste und Villen von Palermo sind für ihre Gärten, Obsthaine und schattigen Höfe berühmt. Ihre hellen Mauern und weitläufigen Hallen bewahren die Erinnerung an die vielen Herrscher der Stadt, deren Förderung die künstlerischen Traditionen des Mittelmeerraums an einem Ort von Reichtum und verfeinerter Kultur zusammengeführt hat."
 MA_palace_palermo1: "Villen von Palermo"
 MA_palace_palermo2: "$building_type_MA_palace_palermo1$"
 MA_palace_balarm1: "Villen von Balarm"
 MA_palace_panormus1: "Villen von Panormus"
 MA_palace_balarm2: "Palast von Balarm"
 MA_palace_panormus2: "Palast von Panormus"
 MA_cassaro_glossary: "Der innerste Kern von Palermo, das alte phönizische und griechische Viertel, das auf allen Seiten befestigt war. Sein Name geht auf das lateinische Wort für Burg, #italic Castrum#!, zurück, das später durch das arabische #italic al Qasr#! weitergeprägt wurde."
 
 #Cefalù Duomo
 MA_cefalu_duomo_district: "$building_type_MA_cefalu_duomo$"
 MA_cefalu_duomo_district_desc: "$building_type_MA_cefalu_duomo_desc$"
 building_type_MA_cefalu_duomo: "Dom von Cefalù"
 building_type_MA_cefalu_duomo_desc: "Hoch über den Kalksteinklippen von Cefalù verbindet dieser [Glossary('Dom','MA_duomo_glossary')] die wuchtigen Formen normannischer Architektur mit byzantinischem und islamischem Schmuck. Seine mächtigen Zwillingstürme flankieren eine breite Westfassade. Der weite Innenraum gipfelt in einem großen, golden schimmernden Mosaik über dem Altarraum, das königliche Autorität und göttliche Majestät verkündet."
 MA_cefalu_duomo: "$building_type_MA_cefalu_duomo$"
 MA_duomo_glossary: "Abgeleitet vom lateinischen #italic domus#!, dem \"Haus\" Gottes, bezeichnet Duomo die Hauptkirche einer italienischen Stadt. Oft fälschlich als \"Kathedrale\" übersetzt, muss sie tatsächlich nicht unbedingt Bischofssitz sein, um diesen Titel zu tragen."
 
 #Athenaion of Syracuse
 MA_athenaion_district: "$building_type_MA_athenaion$"
 MA_athenaion_district_desc: "$building_type_MA_athenaion_desc$"
 building_type_MA_athenaion: "Athenaion von Syrakus"
 building_type_MA_athenaion_desc: "Im antiken Athenatempel errichtet, bewahrt diese Kirche einen großen Teil des ursprünglichen Bauwerks. Die Innenwände des Tempels wurden geöffnet, um ein breites Kirchenschiff zu schaffen, während die großen dorischen Säulen und die Außenmauern noch deutlich sichtbar sind. So umschließen sie eines der schönsten Denkmäler der klassischen Vergangenheit Siziliens."
 MA_athenaion: "$building_type_MA_athenaion$"
 
 #Cave of the Patriarchs
 MA_cave_patriarchs1_district: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs1_district_desc: "$building_type_MA_cave_patriarchs1_desc$"
 building_type_MA_cave_patriarchs1: "Höhle der Patriarchen"
 building_type_MA_cave_patriarchs1_desc: "Über der Höhle, in der Abraham, Isaak, Jakob und ihre Familien ruhen sollen, erhebt sich die große herodianische Umfriedung aus sorgfältig behauenem Kalkstein. Innerhalb ihrer starken Mauern zeugen Tempel und Gebetsstätten von der Verehrung durch Juden, Christen und Muslime gleichermaßen und ziehen Pilger zu den heiligen Gräbern darunter."
 MA_cave_patriarchs1: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs2: "Heiligtum der Patriarchen"
 MA_must_be_abrahamic: "Der [holder|E] muss der $rf_abrahamic$ [religious_family|E] angehören."
 
 #Łysa Góra
 MA_lysa_gora1_district: "$building_type_MA_lysa_gora1$"
 MA_lysa_gora1_district_desc: "$building_type_MA_lysa_gora1_desc$"
 building_type_MA_lysa_gora1: "Łysa Góra"
 building_type_MA_lysa_gora1_desc: "Oberhalb der bewaldeten Hänge von Łysa Góra liegt ein uralter heiliger Gipfel, umgeben von einem mächtigen Ring aus Steinwällen, der die weltliche Welt der Menschen vom heiligen Boden dahinter trennt. Hier tragen Gebete und Opfergaben die Hoffnungen jener, die den Berg erklimmen. Seine feierlichen Höhen erwecken Ehrfurcht, auch wenn Herrscher und Glaubensrichtungen vergehen."
 MA_lysa_gora1: "Kahler Berg"
 MA_lysa_gora2: "Heilig-Kreuz-Kloster"

 #Dome of the Rock
 MA_templum_domini: "Templum Domini"
 
 #Mainz Cathedral
 MA_mainz_cathedral1_district: "$building_type_MA_mainz_cathedral1$"
 MA_mainz_cathedral1_district_desc: "$building_type_MA_mainz_cathedral1_desc$"
 building_type_MA_mainz_cathedral1: "Erzbischöflicher Sitz von Mainz"
 building_type_MA_mainz_cathedral1_desc: "Im Herzen von Mainz bilden der große Dom und die umliegenden Hallen, Kapellen und Höfe den Sitz des mächtigen Erzbischofs. Hier werden Gesandte empfangen und die Geschicke des Landes gelenkt, während die Glocken die Gläubigen zum Gebet rufen. Seine steinernen Mauern verkünden Reichtum und Autorität eines Herrn, dessen Macht weit über den Altar hinausreicht."
 MA_mainz_cathedral1: "Bischofsviertel"
 MA_mainz_cathedral2: "Mainzer Dom"
 
 #Ingelheim Palace
 MA_ingelheim_palace_district: "$building_type_MA_ingelheim_palace$"
 MA_ingelheim_palace_district_desc: "$building_type_MA_ingelheim_palace_desc$"
 building_type_MA_ingelheim_palace: "Kaiserpfalz Ingelheim"
 building_type_MA_ingelheim_palace_desc: "Unter den vielen Residenzen und Palästen, die die fränkischen Könige errichten ließen, können sich nur wenige in Größe und Geschichte mit Ingelheim messen. Die nahe dem Rhein erbaute Pfalz folgt einem ungewöhnlichen halbkreisförmigen Grundriss und umschließt sowohl die [Glossary('Aula Regia','MA_aula_regia_glossary')] als auch die zugehörigen Verwaltungs-, Wohn- und Sakralbauten. Ihre eleganten Bögen und die ländliche Umgebung erinnern die vielen Besucher an eine antike römische Villa."
 MA_ingelheim_palace: "$building_type_MA_ingelheim_palace$"
 MA_aula_regia_glossary: "Die große Audienz- und Thronhalle kaiserlicher Paläste, nach dem Vorbild der einstigen Hallen Roms. Typischerweise eine große, langgestreckte, einschiffige Halle mit einer Apsis an einem Ende."

 #Jewish Quarter of Worms
 MA_worms_jewish_quarter_district: "$building_type_MA_worms_jewish_quarter$"
 MA_worms_jewish_quarter_district_desc: "$building_type_MA_worms_jewish_quarter_desc$"
 building_type_MA_worms_jewish_quarter: "Judenviertel von Worms"
 building_type_MA_worms_jewish_quarter_desc: "Als Heimat einer der bedeutendsten jüdischen Gemeinden des Rheinlands ist die schmale Gasse von Häusern, Werkstätten und einer Synagoge aus sorgfältig behauenem Stein gesäumt. Gemeinsam mit Mainz und Speyer bildet die Stadt ein angesehenes Zentrum jüdischer Gelehrsamkeit und trägt zur Entwicklung aschkenasischer religiöser und geistiger Traditionen in ganz Europa bei."
 MA_worms_jewish_quarter: "$building_type_MA_worms_jewish_quarter$"