l_spanish:
 #################
 ##MEDIEVAL ARTS##
 #################

 ###########
 #GAME RULE#
 game_rule_category_MedievalArts: "Medieval Arts"
 rule_MA_monuments: "$game_rule_category_MedievalArts$: Monumentos"
 setting_MA_monuments_all: "Prioridad a $game_rule_category_MedievalArts$"
 setting_MA_monuments_all_desc: "#help Recomendado:#! En caso de conflicto, los [special_buildings|E] de #V $game_rule_category_MedievalArts$#! tienen prioridad sobre los del juego base."
 setting_MA_monuments_selection: "Prioridad al juego base"
 setting_MA_monuments_selection_desc: "En caso de conflicto, los [special_buildings|E] del #V juego base#! tienen prioridad sobre los de $game_rule_category_MedievalArts$."
 rule_MA_ahistorical_monuments: "$game_rule_category_MedievalArts$: Verosimilitud"
 setting_MA_ahistorical_monuments_yes: "Permitir monumentos inverosímiles"
 setting_MA_ahistorical_monuments_yes_desc: "#help Recomendado:#! Se permiten los [special_buildings|E] que puedan considerarse #italic inverosímiles#!."
 setting_MA_ahistorical_monuments_no: "Excluir monumentos inverosímiles"
 setting_MA_ahistorical_monuments_no_desc: "Los [special_buildings|E] que puedan considerarse #italic inverosímiles#! #bold no#! están permitidos."
 rule_MA_creator_pack: "$game_rule_category_MedievalArts$: DLC"
 setting_MA_creator_pack_yes: "Prioridad a los DLC"
 setting_MA_creator_pack_yes_desc: "#help Recomendado:#! Los [special_buildings|E] de los #V DLC#!, como #V Holy Buildings#!, cuando están activados, tienen prioridad sobre los de $game_rule_category_MedievalArts$."
 setting_MA_creator_pack_no: "$setting_MA_monuments_all$"
 setting_MA_creator_pack_no_desc: "En caso de conflicto, los [special_buildings|E] de #V $game_rule_category_MedievalArts$#! tienen prioridad sobre los de los #V DLC#!."

 
 ###################
 #SPECIAL BUILDINGS#

 #Rock of Cashel
 MA_rock_cashel_district: "$building_type_MA_rock_cashel$"
 MA_rock_cashel_district_desc: "$building_type_MA_rock_cashel_desc$"
 building_type_MA_rock_cashel: "Roca de Cashel"
 building_type_MA_rock_cashel_desc: "Construida sobre una colina rocosa y rodeada de verdes pastizales, la Roca es una fortaleza de piedra inexpugnable, cercada por numerosas murallas y capaz de servir tanto de castillo como de palacio. Alberga asimismo uno de los monasterios más influyentes de Irlanda y una capilla palatina cuya bóveda está decorada con hermosos frescos que representan la vida de san Patricio."
 MA_rock_cashel: "$building_type_MA_rock_cashel$"
 
 #St Donatus of Zadar
 MA_st_donatus_district: "$building_type_MA_st_donatus$"
 MA_st_donatus_district_desc: "$building_type_MA_st_donatus_desc$"
 building_type_MA_st_donatus: "San Donato de Zadar"
 building_type_MA_st_donatus_desc: "Una magnífica iglesia circular construida en piedra blanca, que resplandece bajo la luz del sol sobre las olas del Adriático. Inspirada en la capilla palatina del palacio de Carlomagno, está adornada con un hermoso mosaico dorado."
 MA_st_donatus: "$building_type_MA_st_donatus$"
 
 #Aula Palatina
 MA_aula_palatina_district: "$building_type_MA_aula_palatina$"
 MA_aula_palatina_district_desc: "$building_type_MA_aula_palatina_desc$"
 building_type_MA_aula_palatina: "Aula Palatina"
 building_type_MA_aula_palatina_desc: "Una colosal sala de ladrillo construida por Constantino el Grande para su propio #italic palatium#!. \nSus dimensiones son inmensas, con pocos equivalentes en el continente, y revela un dominio de la ingeniería que siempre puede servir de inspiración."
 MA_aula_palatina: "$building_type_MA_aula_palatina$"
 
 #Jokhang Temple
 MA_jokhang_district: "$building_type_MA_jokhang$"
 MA_jokhang_district_desc: "$building_type_MA_jokhang_desc$"
 building_type_MA_jokhang: "Templo de Jokhang"
 building_type_MA_jokhang_desc: "El templo más antiguo y místico de todo el Tíbet, un majestuoso conjunto de patios y santuarios en pleno corazón de la Tierra de los Dioses."
 MA_jokhang: "$building_type_MA_jokhang$"
 
 #Dongola Throne Hall
 MA_dongola_hall_district: "$building_type_MA_dongola_hall$"
 MA_dongola_hall_district_desc: "$building_type_MA_dongola_hall_desc$"
 building_type_MA_dongola_hall: "Salón del Trono de Dongola"
 building_type_MA_dongola_hall_desc: "Un gran palacio construido en lo alto de una colina rocosa, desde donde se domina toda la llanura circundante y el Nilo. \nSu función es ceremonial: impresionar a los emisarios y viajeros que, tras ascender por una escalera monumental adornada con espléndidos frescos de artistas nubios y griegos, llegan al majestuoso salón del trono del piso superior."
 MA_dongola_hall: "$building_type_MA_dongola_hall$"
 
 #Cathedral of Hildesheim
 MA_hildesheim_cathedral_district: "$building_type_MA_hildesheim_cathedral$"
 MA_hildesheim_cathedral_district_desc: "$building_type_MA_hildesheim_cathedral_desc$"
 building_type_MA_hildesheim_cathedral: "San Miguel de Hildesheim"
 building_type_MA_hildesheim_cathedral_desc: "Esta basílica fue construida para mostrar el poder y el prestigio de su rey romano. Su techo de madera pintada y sus arcos de medio punto le confieren un aspecto grandioso e imperial. Obreros y maestros del Rin y de Italia participaron en su construcción, y alberga unas puertas y una enorme columna, ambas de bronce y cuidadosamente decoradas con relieves."
 MA_hildesheim_cathedral: "$building_type_MA_hildesheim_cathedral$"
 
 #Toulouse Cathedral
 MA_toulouse_basilica_district: "$building_type_MA_toulouse_basilica$"
 MA_toulouse_basilica_district_desc: "$building_type_MA_toulouse_basilica_desc$"
 building_type_MA_toulouse_basilica: "Basílica de Toulouse"
 building_type_MA_toulouse_basilica_desc: "Una grandiosa basílica, una de las mayores catedrales al norte de los Alpes. Está construida con ladrillo, un material abundante en la región, y es un edificio plenamente románico, inspirado en las antiguas ruinas romanas del sur de Francia y adornado con bandas lombardas, arcos de medio punto y columnas reutilizadas."
 MA_toulouse_basilica: "$building_type_MA_toulouse_basilica$"
 
 #The Durham Cathedral
 MA_durham_cathedral_district: "$building_type_MA_durham_cathedral$"
 MA_durham_cathedral_district_desc: "$building_type_MA_durham_cathedral_desc$"
 building_type_MA_durham_cathedral: "Catedral de Durham"
 building_type_MA_durham_cathedral_desc: "La gran catedral de Durham se eleva sobre la pantanosa península del río Wear, donde, según las leyendas, dos lecheras descubrieron la tumba inamovible de san Cutberto. Su bóveda de crucería, concebida por artesanos de ambas orillas del canal de la Mancha, es una obra maestra de ingeniería sin precedentes en Inglaterra, levantada sobre los bosques y riberas de la ciudad con piedra extraída de los acantilados inferiores."
 MA_durham_cathedral: "$building_type_MA_durham_cathedral$"
 
 #The Castel del Monte
 MA_castel_monte_district: "$building_type_MA_castel_monte$"
 MA_castel_monte_district_desc: "$building_type_MA_castel_monte_desc$"
 building_type_MA_castel_monte: "Castel del Monte"
 building_type_MA_castel_monte_desc: "Un elegante pabellón de caza en lo alto de una suave colina de Apulia. \nPosee un diseño singular de planta octogonal, con torres también octogonales en cada esquina, que combina la arquitectura clásica y la gótica. \nSu exterior sobrio y geométrico contrasta vivamente con el lujoso interior, engalanado con tapices, alfombras, pinturas y capiteles."
 MA_castel_monte: "$building_type_MA_castel_monte$"
 
 #The Belfry of Bruges
 MA_belfort_district: "$building_type_MA_belfort$"
 MA_belfort_district_desc: "$building_type_MA_belfort_desc$"
 building_type_MA_belfort: "Campanario de Brujas"
 building_type_MA_belfort_desc: "El impresionante campanario gótico que se alza sobre la plaza del mercado de Brujas marca el ritmo de vida de toda la ciudad. Es una torre enorme, cubierta de pináculos y estatuas, construida en ladrillo y piedra sobre una planta rectangular que da paso a un cuerpo superior octogonal donde se alojan las campanas."
 MA_belfort: "$building_type_MA_belfort$"
 
 #The Strasbourg Cathedral
 MA_strasbourg_cathedral1_district: "$building_type_MA_strasbourg_cathedral1$"
 MA_strasbourg_cathedral1_district_desc: "$building_type_MA_strasbourg_cathedral1_desc$"
 building_type_MA_strasbourg_cathedral1: "Catedral de Estrasburgo"
 building_type_MA_strasbourg_cathedral1_desc: "Inspirada en las grandes iglesias de Francia Occidental y Oriental, la catedral de Estrasburgo debe su grandeza a la riqueza de los ciudadanos y al mecenazgo de su señor. Construida en arenisca rosada, sus muros resplandecen con el sol del atardecer sobre la estrecha plaza y sus casas de entramado de madera, mientras las campanas de bronce entonan su melodía al viento."
 MA_strasbourg_cathedral1: "Catedral de Estrasburgo"
 MA_strasbourg_cathedral2: "$MA_strasbourg_cathedral1$"
 
 #Koutoubia Mosque
 MA_koutoubia_district: "$building_type_MA_koutoubia$"
 MA_koutoubia_district_desc: "$building_type_MA_koutoubia_desc$"
 building_type_MA_koutoubia: "Mezquita Kutubía"
 building_type_MA_koutoubia_desc: "Una obra maestra ejemplar de la arquitectura morisca, cuyo alminar sirve de inspiración a los constructores de todo el mundo islámico."
 MA_koutoubia: "$building_type_MA_koutoubia$"
 
 #Parigoritissa
 MA_parigoritissa_district: "$building_type_MA_parigoritissa$"
 MA_parigoritissa_district_desc: "$building_type_MA_parigoritissa_desc$"
 building_type_MA_parigoritissa: "Panagia Paregoretissa"
 building_type_MA_parigoritissa_desc: "La planta de esta iglesia, dedicada a la Santísima María, se inspira en los ideales clásicos de simetría y perfección geométrica. Es un cuadrado casi perfecto, centrado en una cúpula octogonal sostenida por pilares y rodeada por una pequeña capilla en cada una de sus cuatro esquinas."
 MA_parigoritissa: "$building_type_MA_parigoritissa$"
 
 #Rotunda
 MA_rotunda_district: "$building_type_MA_rotunda$"
 MA_rotunda_district_desc: "$building_type_MA_rotunda_desc$"
 building_type_MA_rotunda: "Rotonda de Tesalónica"
 building_type_MA_rotunda_desc: "Un colosal edificio abovedado inspirado en el Panteón de Roma. \nSu interior está decorado con mosaicos de arte y belleza singulares, cuyas doradas #italic teselas#! centellean bajo la luz solar que entra por el óculo. \nUna columnata conecta el edificio con un enorme arco de mármol erigido por el difunto césar Galerio."
 MA_rotunda: "$building_type_MA_rotunda$"
 
 #The Nikaea Walls
 MA_nikaea_walls_district: "$building_type_MA_nikaea_walls$"
 MA_nikaea_walls_district_desc: "$building_type_MA_nikaea_walls_desc$"
 building_type_MA_nikaea_walls: "Murallas de Nicea"
 building_type_MA_nikaea_walls_desc: "Construidas por los césares hace siglos, estas inexpugnables murallas dobles protegen la ruta hacia Constantinopla."
 MA_nikaea_walls: "$building_type_MA_nikaea_walls$"
 
 #The Ephesus Basilica
 MA_ephesus_basilica_district: "$building_type_MA_ephesus_basilica$"
 MA_ephesus_basilica_district_desc: "$building_type_MA_ephesus_basilica_desc$"
 building_type_MA_ephesus_basilica: "Basílica de Éfeso"
 building_type_MA_ephesus_basilica_desc: "Una enorme basílica construida sobre la tumba de #italic Juan el Apóstol#! en tiempos de Justiniano. \nSus muros de ladrillo y sillares se apoyan en elegantes columnas de mármol de Proconeso y están profusamente decorados con mosaicos dorados."
 MA_ephesus_basilica: "$building_type_MA_ephesus_basilica$"
 
 #Arles Amphiteatre
 MA_arles_amphiteatre_district: "$building_type_MA_arles_amphiteatre$"
 MA_arles_amphiteatre_district_desc: "$building_type_MA_arles_amphiteatre_desc$"
 building_type_MA_arles_amphiteatre: "Anfiteatro de Arlés"
 building_type_MA_arles_amphiteatre_desc: "Construida hace siglos, esta enorme arena sigue siendo el centro de la vida de Arlés. \nEntre sus muros de piedra, los habitantes han levantado torres, capillas y viviendas, y viven sobre la arena donde antaño los gladiadores se masacraban por diversión."
 MA_arles_amphiteatre: "$building_type_MA_arles_amphiteatre$"
 
 #Axum Stelae Field
 MA_axum_stelae_district: "$building_type_MA_axum_stelae$"
 MA_axum_stelae_district_desc: "$building_type_MA_axum_stelae_desc$"
 building_type_MA_axum_stelae: "Campo de estelas"
 building_type_MA_axum_stelae_desc: "Tres estelas colosales son cuanto queda de la otrora poderosa Aksum, pero todavía proyectan una larga sombra sobre la cultura regia de estas tierras. \nTalladas en piedra labrada, aún pueden contemplarse los relieves de sus superficies, que para algunos representan las #italic Puertas del Cielo#!."
 MA_axum_stelae: "$building_type_MA_axum_stelae$"
 
 #Karnak Temple
 MA_karnak_district: "$building_type_MA_karnak$"
 MA_karnak_district_desc: "$building_type_MA_karnak_desc$"
 building_type_MA_karnak: "Karnak"
 building_type_MA_karnak_desc: "El más magnífico de los antiguos templos de los faraones, Karnak sigue en pie tras milenios como testimonio del poder y la riqueza de los reyes del Nilo."
 MA_karnak: "$building_type_MA_karnak$"
 
 #Pharos of Alexandria
 MA_pharos_alexandria_district: "$building_type_MA_pharos_alexandria$"
 MA_pharos_alexandria_district_desc: "$building_type_MA_pharos_alexandria_desc$"
 building_type_MA_pharos_alexandria: "Faro de Alejandría"
 building_type_MA_pharos_alexandria_desc: "Elevándose muy por encima del istmo, el faro es conocido en todo el mundo como una de las #italic siete grandes maravillas#! de Antípatro. \nHan pasado siglos desde que se colocó su primera piedra, y una nueva cúpula, encargada por los califas, corona la estructura; pero su altura sin igual, su sólida mampostería y su luminosa señal siguen perpetuando la leyenda del Faro en el corazón de cuantos lo contemplan."
 MA_pharos_alexandria: "$building_type_MA_pharos_alexandria$"
 
 #Trajan Arch
 MA_trajan_arch1_district: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch1_district_desc: "$building_type_MA_trajan_arch1_desc$"
 building_type_MA_trajan_arch1: "Arco de Trajano"
 building_type_MA_trajan_arch1_desc: "El gran emperador Trajano, que inició desde esta ciudad sus campañas en #italic Dacia#!, ordenó construir un arco magnífico para conmemorar su triunfo, que todavía recibe a cuantos barcos entran en el puerto de Ancona evocando el orgullo y el poder de antaño."
 MA_trajan_arch1: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch2: "Arco de Ancona"
 
 #Palatium of Diocletian
 MA_diocletian_palace_district: "$building_type_MA_diocletian_palace$"
 MA_diocletian_palace_district_desc: "$building_type_MA_diocletian_palace_desc$"
 building_type_MA_diocletian_palace: "Palacio de Diocleciano"
 building_type_MA_diocletian_palace_desc: "Este palacio, construido durante el reinado del tetrarca, fue concebido como una monumental ciudad utópica en miniatura, con calles porticadas, arcos, murallas y salones. \nTras la caída del Imperio, los habitantes lo ocuparon y transformaron en el corazón urbano de la ciudad."
 MA_diocletian_palace: "$building_type_MA_diocletian_palace$"
 
 #Romuliana
 MA_romuliana_district: "$building_type_MA_romuliana$"
 MA_romuliana_district_desc: "$building_type_MA_romuliana_desc$"
 building_type_MA_romuliana: "Romuliana"
 building_type_MA_romuliana_desc: "#italic Félix Romuliana#! fue fundada como ciudad modelo por los grandes césares y protegida a lo largo de los años por murallas colosales. \nSin embargo, estas no bastaron para resistir las invasiones de los siglos, y hoy solo quedan de su antigua gloria los esqueletos vacíos de las torres de vigilancia y la sobrecogedora vegetación que las ha engullido."
 MA_romuliana: "$building_type_MA_romuliana$"
 
 #Hexamilion
 MA_hexamilion_district: "$building_type_MA_hexamilion$"
 MA_hexamilion_district_desc: "$building_type_MA_hexamilion_desc$"
 building_type_MA_hexamilion: "Muralla del Hexamilion"
 building_type_MA_hexamilion_desc: "Construidas por el emperador Teodosio para proteger el Peloponeso, estas murallas han vigilado durante siglos la estrecha entrada del istmo, extendiéndose desde el golfo de Corinto hasta el Sarónico y canalizando el comercio, los viajeros y las incursiones enemigas hacia pasos obligados al norte y al sur."
 MA_hexamilion: "$building_type_MA_hexamilion$"
 
 #Temple of Jupiter
 MA_baalbek_district: "$building_type_MA_baalbek$"
 MA_baalbek_district_desc: "$building_type_MA_baalbek_desc$"
 building_type_MA_baalbek: "Templo de Júpiter"
 building_type_MA_baalbek_desc: "El templo principal de Baalbek fue en otro tiempo uno de los mayores del mundo y dominaba el fértil valle. \nDesde entonces, numerosas incursiones y asedios han dañado el gigantesco templo, cuyas columnas quedaron destrozadas o fueron llevadas a ciudades lejanas, pero sus ruinas aún cautivan a viajeros de todos los rincones del mundo."
 MA_baalbek: "$building_type_MA_baalbek$"
 
 #Leptis Magna
 MA_leptis_magna_district: "$building_type_MA_leptis_magna$"
 MA_leptis_magna_district_desc: "$building_type_MA_leptis_magna_desc$"
 building_type_MA_leptis_magna: "Leptis Magna"
 building_type_MA_leptis_magna_desc: "La joya de Tripolitania, Leptis Magna, fue fundada por los antiguos emperadores. \nCuando el sol implacable alcanza el cenit al mediodía, desaparecen las sombras que proyecta sobre las ruinas de templos, mercados y teatros, y es imposible no sentirse perdido en esta tierra ajena al tiempo."
 MA_leptis_magna: "$building_type_MA_leptis_magna$"
 
 #Tomb of Numidia
 MA_mauretanian_mausoleum_district: "$building_type_MA_mauretanian_mausoleum$"
 MA_mauretanian_mausoleum_district_desc: "$building_type_MA_mauretanian_mausoleum_desc$"
 building_type_MA_mauretanian_mausoleum: "Tumba de Numidia"
 building_type_MA_mauretanian_mausoleum_desc: "Un antiguo y colosal mausoleo construido por los reyes bereberes de Numidia antes de su conquista por los romanos. \nEnteramente hecho de piedra y encaramado a una colina frente al mar, puede verse desde grandes distancias, resplandeciente bajo la luz del sol en el horizonte."
 MA_mauretanian_mausoleum: "$building_type_MA_mauretanian_mausoleum$"
 
 #Meroë Pyramids
 MA_meroe_pyramids_district: "$building_type_MA_meroe_pyramids$"
 MA_meroe_pyramids_district_desc: "$building_type_MA_meroe_pyramids_desc$"
 building_type_MA_meroe_pyramids: "Pirámides de Meroe"
 building_type_MA_meroe_pyramids_desc: "Enclavadas entre las arenas doradas de Nubia, las enigmáticas pirámides se alzan como guardianes olvidados. Sus secretos, susurrados por los vientos del desierto, invitan a las mentes curiosas a desentrañar los misterios de una civilización perdida a través de sus estructuras de inquietante belleza y minuciosa ornamentación."
 MA_meroe_pyramids: "$building_type_MA_meroe_pyramids$"
 
 #Basilica of Saint Martin
 MA_saint_martin_district: "$building_type_MA_saint_martin$"
 MA_saint_martin_district_desc: "$building_type_MA_saint_martin_desc$"
 building_type_MA_saint_martin: "Basílica de San Martín"
 building_type_MA_saint_martin_desc: "Lugar de descanso final de los restos de san Martín, esta gran basílica fue construida por primera vez cuando los merovingios aún gobernaban estas tierras. \nMide ciento sesenta pies de largo y sesenta de ancho, está decorada con columnas antiguas y mármoles de colores, y atrae a peregrinos de lugares lejanos en el camino de Santiago."
 MA_saint_martin: "$building_type_MA_saint_martin$"
 
 #Pillars of Titus
 MA_piliers_district: "$building_type_MA_piliers$"
 MA_piliers_district_desc: "$building_type_MA_piliers_desc$"
 building_type_MA_piliers: "Pilares de Gascuña"
 building_type_MA_piliers_desc: "Situados en el punto más alto de la ciudad, dominando el río y bañados por el sol, estos pilares son tan elegantes como misteriosos. Algunos dicen que antaño formaron parte de un gran palacio del césar Tito, mientras otros afirman que surgieron de la roca mucho antes de la llegada de los romanos."
 MA_piliers: "$building_type_MA_piliers$"
 
 #Txindoki
 MA_txindoki_district: "$building_type_MA_txindoki$"
 MA_txindoki_district_desc: "$building_type_MA_txindoki_desc$"
 building_type_MA_txindoki: "Txindoki"
 building_type_MA_txindoki_desc: "A los peregrinos que recorren estas tierras les resulta difícil no advertir su imponente cumbre nevada. Elevándose de forma abrupta y majestuosa, Txindoki encarna la grandeza y la belleza misteriosa de estas tierras desde mucho antes de que el ser humano posara sus ojos en él."
 MA_txindoki: "$building_type_MA_txindoki$"
 
 #Hospice of Santa Juliana
 MA_santillana_district: "$building_type_MA_santillana$"
 MA_santillana_district_desc: "$building_type_MA_santillana_desc$"
 building_type_MA_santillana: "Hospedería de Santa Juliana"
 building_type_MA_santillana_desc: "Las grandes bóvedas, los pilares de piedra, las reliquias y los alojamientos de esta colegiata la convierten en parada obligada para los numerosos peregrinos del camino de Santiago. \nFinanciada por el magnate local y por el flujo constante de ofrendas, la hospedería se ha enriquecido y embellecido, adornada con magníficas estatuas y relieves esculpidos."
 MA_santillana: "$building_type_MA_santillana$"
 
 #Palace of Naranco
 MA_palace_naranco_district: "$building_type_MA_palace_naranco$"
 MA_palace_naranco_district_desc: "$building_type_MA_palace_naranco_desc$"
 building_type_MA_palace_naranco: "Palacio de Naranco"
 building_type_MA_palace_naranco_desc: "Este hermoso palacio sirvió durante generaciones de residencia a los santos reyes de Asturias y domina Oviedo desde lo alto del monte Naranco. Sus elegantes arcos y bóvedas, sin parangón en la península desde el dominio romano, dan testimonio de la ambición y el poder de sus gobernantes."
 MA_palace_naranco: "$building_type_MA_palace_naranco$"
 
 #Burgos Cathedral
 MA_burgos_cathedral_district: "$building_type_MA_burgos_cathedral$"
 MA_burgos_cathedral_district_desc: "$building_type_MA_burgos_cathedral_desc$"
 building_type_MA_burgos_cathedral: "Catedral de Burgos"
 building_type_MA_burgos_cathedral_desc: "Construida por artesanos de ambos lados de los Pirineos, esta magnífica catedral es uno de los ejemplos más destacados del nuevo y moderno estilo de construcción de iglesias. \nSus torres se elevan hacia el cielo, mientras sus enormes capillas y corredores conducen a los peregrinos de una reliquia a otra, entre ofrendas y oro, bajo la altiva mirada de numerosos santos esculpidos."
 MA_burgos_cathedral: "$building_type_MA_burgos_cathedral$"
 
 #Qasr al-Farid
 MA_hegra_district: "$building_type_MA_hegra$"
 MA_hegra_district_desc: "$building_type_MA_hegra_desc$"
 building_type_MA_hegra: "Qasr al-Farid"
 building_type_MA_hegra_desc: "Una tumba monumental excavada profundamente en una roca monolítica, vestigio de una ciudad pagana antaño rica y poderosa. \nSe eleva solitaria en el desierto, enfrentándose a los vientos, por lo que los habitantes la llaman el #italic Castillo Solitario#!."
 MA_hegra: "$building_type_MA_hegra$"
 
 #Wadi Rum
 MA_wadirum_district: "$building_type_MA_wadirum$"
 MA_wadirum_district_desc: "$building_type_MA_wadirum_desc$"
 building_type_MA_wadirum: "Wadi Rum"
 building_type_MA_wadirum_desc: "Este gran valle ancestral ha sido durante mucho tiempo fuente de mitos y leyendas, y todavía hoy está envuelto en misticismo. \nDe él surge una inmensa muralla de roca roja que desafía los vientos del desierto, alta y maciza, firme e inalcanzable para cualquier ejército, y que ofrece un refugio seguro en los peores tiempos."
 MA_wadirum: "$building_type_MA_wadirum$"
 
 #Walls of Sana'a
 MA_walls_sanaa_district: "$building_type_MA_walls_sanaa$"
 MA_walls_sanaa_district_desc: "$building_type_MA_walls_sanaa_desc$"
 building_type_MA_walls_sanaa: "Murallas de Saná"
 building_type_MA_walls_sanaa_desc: "Un círculo de poderosos baluartes rodea el corazón de Saná, elevándose inexpugnable entre el intrincado laberinto de las montañas de Sarawat. Su grandeza desgastada por el tiempo susurra historias de terribles batallas y grandes hazañas de hombres y dioses."
 MA_walls_sanaa: "$building_type_MA_walls_sanaa$"
 
 #Dam of Sheba
 MA_dam_sheba_district: "$building_type_MA_dam_sheba$"
 MA_dam_sheba_district_desc: "$building_type_MA_dam_sheba_desc$"
 building_type_MA_dam_sheba: "Presa de Saba"
 building_type_MA_dam_sheba_desc: "Solitarias en las tierras áridas de Ma'rib, donde el sol abrasador castiga a cuantos se atreven a afrontarlo, estas magníficas ruinas murmuran historias del gran reino de la reina de Saba, que convirtió las arenas en campos fértiles y llevó riqueza y vida donde antes reinaban la escasez y la muerte."
 MA_dam_sheba: "$building_type_MA_dam_sheba$"
 
 #Bahla Fort
 MA_bahla_fort_district: "$building_type_MA_bahla_fort$"
 MA_bahla_fort_district_desc: "$building_type_MA_bahla_fort_desc$"
 building_type_MA_bahla_fort: "Fortaleza de Bahla"
 building_type_MA_bahla_fort_desc: "Este inmenso castillo de adobe se construyó para proteger el preciado oasis de Bahla desde las alturas de las tierras montañosas cercanas. \nSus intrincadas murallas resguardan de los enemigos y del calor abrasador una red de sistemas de riego y una magnífica plantación de palmeras datileras que sin duda otorgará gran prestigio a su protector."
 MA_bahla_fort: "$building_type_MA_bahla_fort$"
 
 #Jebe Hafeet
 MA_jebel_hafeet_district: "$building_type_MA_jebel_hafeet$"
 MA_jebel_hafeet_district_desc: "$building_type_MA_jebel_hafeet_desc$"
 building_type_MA_jebel_hafeet: "Yebel Hafeet"
 building_type_MA_jebel_hafeet_desc: "Una montaña larga, esbelta y solitaria, la última antes de las dunas y la primera antes de la cordillera de Hajar. \nSus empinadas laderas rocosas han sido habitadas desde antiguo por las gentes de la región, y a sus pies se encuentran tumbas con forma de colmena."
 MA_jebel_hafeet: "$building_type_MA_jebel_hafeet$"
 
 #Al-Turaif Palace
 MA_alturaif_district: "$building_type_MA_alturaif$"
 MA_alturaif_district_desc: "$building_type_MA_alturaif_desc$"
 building_type_MA_alturaif: "Palacio de Al-Turaif"
 building_type_MA_alturaif_desc: "Levantado a lo largo de generaciones en uno de los lugares más inhóspitos de la Creación, este palacio es símbolo de determinación y piedad. \nRodeados por una larga sucesión de murallas, los altos palacios de adobe y un jardín irrigado ofrecen refugio incluso del calor más abrasador y sirven como importante depósito de suministros para su propietario."
 MA_alturaif: "$building_type_MA_alturaif$"
 
 #School of Preslav
 MA_school_preslav_district: "$building_type_MA_school_preslav$"
 MA_school_preslav_district_desc: "$building_type_MA_school_preslav_desc$"
 building_type_MA_school_preslav: "Escuela de Preslav"
 building_type_MA_school_preslav_desc: "Sostenidos por un flujo constante de donaciones, los escritorios monásticos y los salones palaciegos de Preslav trabajan sin descanso para traducir manuscritos y producir nuevos conocimientos. El aroma de la tinta y el pergamino impregna el aire, y frescos de santos y mecenas adornan las paredes. La influencia de la escuela se extiende mucho más allá de sus muros de piedra y se ha convertido en un faro de liturgia y pensamiento romanos para la región."
 MA_school_preslav: "$building_type_MA_school_preslav$"
 
 #Madara Rider
 MA_madara_rider_district: "$building_type_MA_madara_rider$"
 MA_madara_rider_district_desc: "$building_type_MA_madara_rider_desc$"
 building_type_MA_madara_rider: "Jinete de Madara"
 building_type_MA_madara_rider_desc: "Tallado en el abrazo frío y eterno de un acantilado vertical, este antiguo relieve representa a un jinete que triunfa sobre un león. Con la lanza en la mano, el jinete parece surgir de la propia piedra, victorioso para siempre. Debajo, unas inscripciones narran hazañas gloriosas realizadas en las infinitas estepas de pastoreo, antes de que las gentes de estas tierras se asentaran en el oeste."
 MA_madara_rider: "$building_type_MA_madara_rider$"
 
 #Tomb of the Thracian King
 MA_thracian_tomb_district: "$building_type_MA_thracian_tomb$"
 MA_thracian_tomb_district_desc: "$building_type_MA_thracian_tomb_desc$"
 building_type_MA_thracian_tomb: "Tumba del rey tracio"
 building_type_MA_thracian_tomb_desc: "Oculta en el tiempo y el espacio, rodeada de una tranquila pradera dorada, una antigua tumba descansa bajo un enorme [Glossary('túmulo','MA_tumulus_glossary')] de tierra. Su entrada está marcada por una puerta monolítica y rodeada por un bosque de piedras. Las leyendas susurran que aquí fue enterrado un gran rey de antaño, cuyo nombre se ha olvidado hace mucho, pero cuyo espíritu aún cabalga por los cielos. \nUn ciprés solitario monta guardia ante la entrada y proyecta una sombra larga y silenciosa sobre la tumba."
 MA_thracian_tomb: "$building_type_MA_thracian_tomb$"
 MA_tumulus_glossary: "Un montículo de tierra y piedra que forma una cúpula colosal sobre una tumba. Utilizados por numerosas culturas, especialmente por las sociedades antiguas, los #bold túmulos#! son testimonios solemnes y monumentales del paso del tiempo."
 
 #Boyana Church
 MA_boyana_church_district: "$building_type_MA_boyana_church$"
 MA_boyana_church_district_desc: "$building_type_MA_boyana_church_desc$"
 building_type_MA_boyana_church: "Iglesia de Boyana"
 building_type_MA_boyana_church_desc: "Esta humilde iglesia puede parecer insignificante a primera vista, escondida en una población rural perdida entre campos dorados, donde su sencilla fábrica de ladrillo se funde con el paisaje. \nSin embargo, tras su modesto exterior se oculta un tesoro incomparable, apartado de las miradas del mundo: el corazón del templo está adornado con frescos de belleza sobrecogedora, en los que cada pincelada testimonia la inspiración divina. Los tonos azules, rojos y dorados se entremezclan y los santos parecen danzar con el temblor de las llamas de las velas en un espectáculo de profundo misticismo."
 MA_boyana_church: "$building_type_MA_boyana_church$"
 
 #Belogradchik Fortress
 MA_belogradchik_fort_district: "$building_type_MA_belogradchik_fort$"
 MA_belogradchik_fort_district_desc: "$building_type_MA_belogradchik_fort_desc$"
 building_type_MA_belogradchik_fort: "Fortaleza de Belogradchik"
 building_type_MA_belogradchik_fort_desc: "Enclavada entre imponentes formaciones rocosas, esta fortaleza parece brotar de la propia tierra, con sus murallas naciendo de la fría piedra rojiza de la montaña. Las elegantes chimeneas de roca se elevan y rodean la fortaleza por tres lados, haciéndola prácticamente inexpugnable. \nLos habitantes cuentan una leyenda tan antigua como el tiempo: un gigante del bosque cercano apiló las rocas con sus propias manos, mientras que un monasterio fue devorado por las piedras como castigo divino."
 MA_belogradchik_fort: "$building_type_MA_belogradchik_fort$"
 
 #Studenica Monastery
 MA_studenica_district: "$building_type_MA_studenica$"
 MA_studenica_district_desc: "$building_type_MA_studenica_desc$"
 building_type_MA_studenica: "Monasterio de Studenica"
 building_type_MA_studenica_desc: "El más magnífico de los monumentos de Serbia, faro de fe y tranquilidad para sus habitantes, este monasterio se oculta en un valle apartado. \nSus muros muestran huellas de las tradiciones tanto del Occidente latino como del Oriente griego; las losas de mármol blanco, talladas por manos expertas, y la imponente cúpula sobre un tambor rojo brillante dan testimonio de la destreza y piedad de sus patrocinadores."
 MA_studenica: "$building_type_MA_studenica$"
 
 #Church of the Nativity
 MA_church_nativity_district: "$building_type_MA_church_nativity$"
 MA_church_nativity_district_desc: "$building_type_MA_church_nativity_desc$"
 building_type_MA_church_nativity: "Iglesia de la Natividad"
 building_type_MA_church_nativity_desc: "Encargado primero por la santa madre de Constantino y reconstruido después por orden de Justiniano, este templo celebra uno de los lugares más sagrados del cristianismo: el nacimiento de Cristo. \nLa iglesia es una larga basílica de cinco naves, con una entrada triunfal, decorada con mosaicos dorados y antiguas columnas romanas de mármoles de colores. Alberga numerosas reliquias sagradas y obras de arte que, según cuentan las leyendas, la han salvado de varias invasiones."
 MA_church_nativity: "$building_type_MA_church_nativity$"
 
 #Great Lejre Hall
 MA_lejre_hall_district: "$building_type_MA_lejre_hall$"
 MA_lejre_hall_district_desc: "$building_type_MA_lejre_hall_desc$"
 building_type_MA_lejre_hall: "Gran salón de Hleiðr"
 building_type_MA_lejre_hall_desc: "Un grandioso salón de hidromiel construido por reyes de antaño con altos árboles y magníficas esculturas. \nLas historias de los grandes héroes y reyes que comieron y lucharon en este salón inspirarán sin duda nuevas sagas."
 MA_lejre_hall: "$building_type_MA_lejre_hall$"
 
 #Aetna
 MA_aetna_district: "$building_type_MA_aetna$"
 MA_aetna_district_desc: "$building_type_MA_aetna_desc$"
 building_type_MA_aetna: "Etna"
 building_type_MA_aetna_desc: "El mayor de los volcanes ardientes del mundo antiguo, el monte Etna se alza triunfante sobre la fértil isla de Sicilia, enriqueciendo notablemente los suelos cercanos con sus cenizas. \nDurante milenios, mitos y leyendas han impregnado su aliento y relatan cómo el dios Hefesto forjaba sus creaciones divinas en el corazón de la montaña infernal."
 MA_aetna: "$building_type_MA_aetna$"
 
 #Brescia Duomo
 MA_duomo_brescia_district: "$building_type_MA_duomo_brescia$"
 MA_duomo_brescia_district_desc: "$building_type_MA_duomo_brescia_desc$"
 building_type_MA_duomo_brescia: "Catedral de Brescia"
 building_type_MA_duomo_brescia_desc: "Una rotonda de piedra en el corazón de la #italic Cittanuova#!, el nuevo centro de poder de Brescia al oeste del antiguo núcleo romano. Sus gruesos muros y su sencillo diseño románico se inspiraron en las historias de Jerusalén, mientras que en su interior tenuemente iluminado los frescos y reliquias hablan de siglos de devoción y poder."
 MA_duomo_brescia: "$building_type_MA_duomo_brescia$"
 
 #Maschio
 MA_maschio_district: "$building_type_MA_maschio$"
 MA_maschio_district_desc: "$building_type_MA_maschio_desc$"
 building_type_MA_maschio: "Maschio"
 building_type_MA_maschio_desc: "Un enorme castillo de piedra y toba volcánica se alza sobre la reluciente bahía de Nápoles, mientras sus almenas e imponentes torres redondas dominan tierra y mar con puño de hierro. \nUna gran red de celdas y mazmorras se adentra en la roca, algunas tan antiguas como los propios griegos. $MA_warning_palermo_napoli$"
 MA_maschio: "$building_type_MA_maschio$"
 MA_warning_palermo_napoli: "\n\n@alert_icon! #alert_trial Construir tanto [GetBuildingType('MA_palace_palermo2').GetName] en Palermo como [GetBuildingType('MA_maschio').GetName] en Nápoles te impedirá completar la [GetDecisionWithKey('empower_sicilian_parliament_decision').GetName] [decision|E].#!"
 
 #Basilica of Saint Nicholas
 MA_st_nicholas_district: "$building_type_MA_st_nicholas$"
 MA_st_nicholas_district_desc: "$building_type_MA_st_nicholas_desc$"
 building_type_MA_st_nicholas: "Basílica de San Nicolás"
 building_type_MA_st_nicholas_desc: "Una sólida basílica románica construida con resistente piedra local, de un blanco resplandeciente que destaca sobre el mar de color vino. Entre sus muros, las reliquias de san Nicolás atraen a peregrinos y grandes riquezas de toda la cristiandad, animándolos a cruzar hacia Tierra Santa."
 MA_st_nicholas: "$building_type_MA_st_nicholas$"
 
 #Palace of Arechis
 MA_palace_arechis_district: "$building_type_MA_palace_arechis$"
 MA_palace_arechis_district_desc: "$building_type_MA_palace_arechis_desc$"
 building_type_MA_palace_arechis: "Palacio de Arechis"
 building_type_MA_palace_arechis_desc: "Un vasto complejo palaciego de edificios excavados en la antigua ciudad romana de Beneventum, protegido por un anillo de murallas y una torre cuadrangular. Construido por el primer príncipe de los lombardos, se ha convertido en símbolo del desafío y la obstinada independencia de este pueblo."
 MA_palace_arechis: "$building_type_MA_palace_arechis$"
 
 #Basilica of Saccargia
 MA_saccargia_basilica_district: "$building_type_MA_saccargia_basilica$"
 MA_saccargia_basilica_district_desc: "$building_type_MA_saccargia_basilica_desc$"
 building_type_MA_saccargia_basilica: "Basílica de Saccargia"
 building_type_MA_saccargia_basilica_desc: "Una llamativa basílica de piedra blanca y negra se alza en una costa árida y azotada por los vientos de Cerdeña, con su torre rayada visible desde el mar a muchas millas. Se trajeron artesanos de Italia para ayudar en su construcción, y su influencia estilística es profunda."
 MA_saccargia_basilica: "$building_type_MA_saccargia_basilica$"
 
 #Ruins of Paestum
 MA_paestum_district: "$building_type_MA_paestum$"
 MA_paestum_district_desc: "$building_type_MA_paestum_desc$"
 building_type_MA_paestum: "Ruinas de Paestum"
 building_type_MA_paestum_desc: "Los restos de la otrora gran ciudad antigua yacen rodeados de hierbas silvestres y silencio, con las colosales columnas de sus templos rotas y destrozadas. La ciudad fue abandonándose poco a poco después de que el río cercano convirtiera el terreno en una ciénaga, y hoy pocos se atreven a adentrarse en aquellas tierras malsanas."
 MA_paestum: "$building_type_MA_paestum$"
 
 #Tower of Pisa
 MA_tower_pisa_district: "$building_type_MA_tower_pisa$"
 MA_tower_pisa_district_desc: "$building_type_MA_tower_pisa_desc$"
 building_type_MA_tower_pisa: "Torre de Pisa"
 building_type_MA_tower_pisa_desc: "El elegante #italic campanile#! de la orgullosa ciudad de Pisa, cuyos refinados arcos y resplandeciente piedra blanca son famosos en toda la cristiandad y más allá. Desde su construcción, el suelo sobre el que se asienta ha demostrado ser inestable, provocando que la torre se incline cada vez más."
 MA_tower_pisa: "$building_type_MA_tower_pisa$"
 
 #Saint Peter's Basilica
 MA_vatican_district: "$building_type_MA_vatican$"
 MA_vatican_district_desc: "$building_type_MA_vatican_desc$"
 building_type_MA_vatican: "Basílica de San Pedro"
 building_type_MA_vatican_desc: "La más sagrada de las antiguas basílicas mandadas construir por Constantino en Roma se alza sobre la tumba del apóstol en quien se fundó la Iglesia. \nLa iglesia es tan monumental como elegante: sus altas naves, adornadas con mosaicos dorados y mármoles exóticos, acogen a miles de peregrinos de toda la cristiandad, junto con toda la riqueza y el poder que traen consigo."
 MA_vatican: "$building_type_MA_vatican$"
 
 #Rock of Canossa
 MA_rock_canossa_district: "$building_type_MA_rock_canossa$"
 MA_rock_canossa_district_desc: "$building_type_MA_rock_canossa_desc$"
 building_type_MA_rock_canossa: "Roca de Canossa"
 building_type_MA_rock_canossa_desc: "Este formidable castillo fue construido sobre un escarpado peñasco rocoso como centro de un impresionante sistema de fortificaciones que custodia los pasos de los Apeninos. Desde esta fortaleza aislada, sus señores vigilan los valles inferiores, seguros en su refugio de piedra y cielo."
 MA_rock_canossa: "$building_type_MA_rock_canossa$"
 
 #Hill of Tara
 MA_hill_tara_district: "$building_type_MA_hill_tara$"
 MA_hill_tara_district_desc: "$building_type_MA_hill_tara_desc$"
 building_type_MA_hill_tara: "Colina de Tara"
 building_type_MA_hill_tara_desc: "Una colina cubierta de hierba, protegida por fosos y terraplenes y rodeada de antiguas piedras talladas, sede sagrada de los altos reyes de Irlanda. Aunque no se alzan murallas sobre ella, la propia tierra posee poder y atrae a visitantes de toda la isla."
 MA_hill_tara: "$building_type_MA_hill_tara$"
 
 #Clonmacnoise
 MA_clonmacnoise_district: "$building_type_MA_clonmacnoise$"
 MA_clonmacnoise_district_desc: "$building_type_MA_clonmacnoise_desc$"
 building_type_MA_clonmacnoise: "Clonmacnoise"
 building_type_MA_clonmacnoise_desc: "Un gran monasterio fundado a orillas del ancho río Shannon, cuya iglesia de piedra y alta torre circular se elevan solemnemente sobre las llanuras azotadas por el viento. Con el tiempo se ha convertido en uno de los principales centros de saber de la isla, atrayendo a estudiosos y peregrinos de todas partes."
 MA_clonmacnoise: "$building_type_MA_clonmacnoise$"
 
 #White Stupa of Gaochang
 MA_white_stupa_district: "$building_type_MA_white_stupa$"
 MA_white_stupa_district_desc: "$building_type_MA_white_stupa_desc$"
 building_type_MA_white_stupa: "Estupa Blanca de Gaochang"
 building_type_MA_white_stupa_desc: "Encargada por las autoridades imperiales para señalar el alcance del Reino del Medio, esta resplandeciente [Glossary('estupa','MA_stupa_glossary')] se alza solitaria sobre las abrasadas arenas del desierto. Su diseño se inspira en gran medida en los templos tibetanos e indios, con su gran cúpula blanca redondeada y su aguja dorada, pero también incorpora elementos tradicionales chinos, como su base de madera."
 MA_white_stupa: "$building_type_MA_white_stupa$"
 
 #Khan Tengri
 MA_khan_tengri_district: "$building_type_MA_khan_tengri$"
 MA_khan_tengri_district_desc: "$building_type_MA_khan_tengri_desc$"
 building_type_MA_khan_tengri: "Khan Tengri"
 building_type_MA_khan_tengri_desc: "Llamada #italic Señor del Cielo#! por los pueblos de la estepa, esta imponente pirámide de mármol se alza con perfecta simetría sobre las montañas circundantes. Sus laderas están cubiertas de nieves eternas, que brillan rojas al atardecer y doradas al alba, y forman un eje sagrado entre la tierra y el cielo bajo la clara bóveda azul del firmamento."
 MA_khan_tengri: "$building_type_MA_khan_tengri$"
 
 #Singing Dunes
 MA_singing_dunes_district: "$building_type_MA_singing_dunes$"
 MA_singing_dunes_district_desc: "$building_type_MA_singing_dunes_desc$"
 building_type_MA_singing_dunes: "Dunas Cantoras"
 building_type_MA_singing_dunes_desc: "A no demasiadas jornadas del oasis, una gran media luna de arena se eleva sobre la estepa desolada, donde el viento arranca a la propia tierra notas largas y sobrecogedoras. Los nómadas que recorren las antiguas rutas de Asia se detienen a escucharlas, convencidos de que el canto de las dunas es la voz de los espíritus, mientras los poetas llegados de lejos encuentran inspiración en su música."
 MA_singing_dunes: "$building_type_MA_singing_dunes$"
 
 #Dakhma of Gurganj
 MA_dakhma_district: "$building_type_MA_dakhma$"
 MA_dakhma_district_desc: "$building_type_MA_dakhma_desc$"
 building_type_MA_dakhma: "Dajma de Gurganj"
 building_type_MA_dakhma_desc: "Esta gran #italic dajma#! circular, o torre del silencio, corona una elevación solitaria sobre la llanura. Antaño los zoroastrianos la utilizaban para exponer a sus muertos al cielo y al sol purificadores, pero, a medida que disminuye el número de fieles con cada verano, la torre contempla menos ritos funerarios y más centinelas, pues su altura y forma sirven ahora mejor a la vigilancia que al culto. \n\n#help La torre concede efectos adicionales si la posee o habita una [faith|E] que practica #game_link entierros celestiales#!.#!"
 MA_dakhma: "$building_type_MA_dakhma$"
 
 #Black Ruins
 MA_karabalgasun_district: "$building_type_MA_karabalgasun$"
 MA_karabalgasun_district_desc: "$building_type_MA_karabalgasun_desc$"
 building_type_MA_karabalgasun: "Ruinas Negras"
 building_type_MA_karabalgasun_desc: "Muros de tierra derruidos y columnas rotas son todo cuanto queda del otrora poderoso palacio que ocupaba el corazón de uno de los mayores imperios de la estepa. El viento aúlla por los patios vacíos y las piedras talladas yacen medio enterradas entre hierba y polvo, pero los viajeros todavía pasan por allí y las llaman #italic Karabalgasun#!, las Ruinas Negras."
 MA_karabalgasun: "$building_type_MA_karabalgasun$"
 
 #City of the Army
 MA_ordu_district: "$building_type_MA_ordu$"
 MA_ordu_district_desc: "$building_type_MA_ordu_desc$"
 building_type_MA_ordu: "Ciudad del Ejército"
 building_type_MA_ordu_desc: "Una gran ciudad de mercaderes, cortesanos y caballos se encuentra en el cruce de las rutas de Europa y Asia. \nProtegida por murallas de tierra y rodeada de un ancho foso, alberga numerosas tiendas y templos diseminados a lo largo de una avenida porticada que conduce a la tienda dorada del gran señor de la Estepa que gobierna desde este lugar."
 MA_ordu: "$building_type_MA_ordu$"
 
 #Kurgan of the Rider
 MA_kurgan_district: "$building_type_MA_kurgan$"
 MA_kurgan_district_desc: "$building_type_MA_kurgan_desc$"
 building_type_MA_kurgan: "Kurgán del Jinete"
 building_type_MA_kurgan_desc: "Los habitantes cuentan historias de un gran jinete que antaño recorrió estas tierras y cuyo espíritu todavía cabalga por la estepa. \nSe dice que su kurgán, un gran túmulo de tierra, es el lugar donde fue enterrado, rodeado por un círculo de piedras que marca los límites de su dominio. Cada vez son menos quienes recuerdan su nombre, pero el kurgán sigue resistiendo al viento y al tiempo."
 MA_kurgan: "$building_type_MA_kurgan$"
 
 #Cliffs of Ustyurt
 MA_ustyurt_cliffs_district: "$building_type_MA_ustyurt_cliffs$"
 MA_ustyurt_cliffs_district_desc: "$building_type_MA_ustyurt_cliffs_desc$"
 building_type_MA_ustyurt_cliffs: "Acantilados de Ustyurt"
 building_type_MA_ustyurt_cliffs_desc: "Estos acantilados modelados por la intemperie marcan la transición entre una meseta desolada y las costas del mar interior, surcados por cañones y horadados por cuevas. La tierra es dura y carece de agua, lo que ha obligado a los cazadores a adaptarse y construir #italic aranes#!, trampas de piedra que encauzan a los rebaños salvajes hacia pasos estrechos y convierten los acantilados en un silencioso teatro de muerte."
 MA_ustyurt_cliffs: "$building_type_MA_ustyurt_cliffs$"
 
 #White Fortress
 MA_sarkel_district: "$building_type_MA_sarkel$"
 MA_sarkel_district_desc: "$building_type_MA_sarkel_desc$"
 building_type_MA_sarkel: "Fortaleza Blanca"
 building_type_MA_sarkel_desc: "Una gran fortaleza de piedra caliza blanca y ladrillo, #italic Sark-el#! —la Fortaleza Blanca—, fue construida en la orilla izquierda del Don cuando el jagán solicitó ingenieros al emperador romano para reforzar la frontera septentrional de su reino. Ahora domina el estratégico paso terrestre entre el Don y el Volga, proyecta su poder militar hacia las tierras del norte y protege las importantes rutas comerciales de la región."
 MA_sarkel: "$building_type_MA_sarkel$"
 
 #Nilometer
 MA_nilometer_district: "$building_type_MA_nilometer$"
 MA_nilometer_district_desc: "$building_type_MA_nilometer_desc$"
 building_type_MA_nilometer: "Nilómetro"
 building_type_MA_nilometer_desc: "Una estrecha cámara de piedra construida a orillas del río fangoso para medir mejor las crecidas y bajadas del Nilo y ayudar a planificar las cosechas. Fue encargada por los nuevos gobernantes islámicos para perpetuar una antigua costumbre de estas tierras, vinculando las inundaciones y la prosperidad al orden del Estado."
 MA_nilometer: "$building_type_MA_nilometer$"
 
 #Abu Simbel
 MA_abu_simbel_district: "$building_type_MA_abu_simbel$"
 MA_abu_simbel_district_desc: "$building_type_MA_abu_simbel_desc$"
 building_type_MA_abu_simbel: "Abu Simbel"
 building_type_MA_abu_simbel_desc: "Colosales estatuas esculpidas por los antiguos faraones hace muchas generaciones sobresalen de estas dunas rocosas, y su tamaño sigue sin tener rival en todo el mundo. \nQuienquiera que contemple su majestad, ya sea un simple viajero o un gran rey, no puede evitar inspirarse en la historia que cuentan."
 MA_abu_simbel: "$building_type_MA_abu_simbel$"
 
 #Red and White Monasteries
 MA_red_white_monasteries_district: "$building_type_MA_red_white_monasteries$"
 MA_red_white_monasteries_district_desc: "$building_type_MA_red_white_monasteries_desc$"
 building_type_MA_red_white_monasteries: "Monasterios Rojo y Blanco"
 building_type_MA_red_white_monasteries_desc: "Dos antiguos monasterios coptos cerca de las orillas del Nilo, cuyos muros están construidos con piedras de colores llamativos que les dan nombre: uno de un rojo intenso y terroso, el otro pálido y luminoso. Aislados pero no olvidados, conservan en sus capillas, donde resuenan viejos cánticos, y entre sus muros adornados con frescos desvaídos una tradición cristiana erudita y devota que se remonta a antes de que los gobernantes musulmanes cruzaran los desiertos y rocas del Sinaí para conquistar estas tierras."
 MA_red_white_monasteries: "$building_type_MA_red_white_monasteries$"
 
 #Knossos
 MA_knossos_ruins_district: "$building_type_MA_knossos_ruins$"
 MA_knossos_ruins_district_desc: "$building_type_MA_knossos_ruins_desc$"
 building_type_MA_knossos_ruins: "Palacio de Cnosos"
 building_type_MA_knossos_ruins_desc: "Dominando el espléndido mar, el antiguo palacio de Cnosos guarda la memoria de reyes y mitos de antaño. Sus grandes salones, columnas y frescos hablan de una época remota de riqueza y poder, cautivando a los viajeros e inspirando a quienes aspiran a ocupar un lugar entre los poderosos gobernantes de Creta."
 MA_knossos_ruins: "Ruinas de Cnosos"
 MA_knossos: "$building_type_MA_knossos_ruins$"
 
 #Skara Brae
 MA_skara_brae_district: "$building_type_MA_skara_brae$"
 MA_skara_brae_district_desc: "$building_type_MA_skara_brae_desc$"
 building_type_MA_skara_brae: "Skara Brae"
 building_type_MA_skara_brae_desc: "Asomándose tímidamente desde una colina cubierta de hierba en una costa azotada por el viento, este conjunto de antiguas viviendas de piedra yace medio enterrado. \nBañado por la brisa cortante del océano, perdura en silencio, con sus muros bajos y erosionados y sus hogares apagados desde hace incontables siglos, pero aún resonando con el recuerdo de vidas desaparecidas hace mucho."
 MA_skara_brae: "$building_type_MA_skara_brae$"
 
 #Whitehorse Hill
 MA_whitehorse_hill_district: "$building_type_MA_whitehorse_hill$"
 MA_whitehorse_hill_district_desc: "$building_type_MA_whitehorse_hill_desc$"
 building_type_MA_whitehorse_hill: "Colina del Caballo Blanco"
 building_type_MA_whitehorse_hill_desc: "#flavor Cerca de la villa de Abinton hay una montaña sobre la que se encuentra la figura de un semental, y es blanca. Nada crece sobre ella.#!"
 MA_whitehorse_hill: "$building_type_MA_whitehorse_hill$"
 
 #Gagikashen
 MA_gagikashen_district: "$building_type_MA_gagikashen$"
 MA_gagikashen_district_desc: "$building_type_MA_gagikashen_desc$"
 building_type_MA_gagikashen: "Gagikashen"
 building_type_MA_gagikashen_desc: "Una gran iglesia circular dedicada a san Gregorio se alza sobre las alturas de Ani. Sus constructores se inspiraron en las formas ruinosas de la catedral de Zvart'nots. Su alto tambor se eleva en tres cuerpos sobre anillos de columnas y capillas laterales, que rodean un espacio central de gran armonía y claridad."
 MA_gagikashen: "$building_type_MA_gagikashen$"
 
 #Saint Gall
 MA_saint_gall_district: "$building_type_MA_saint_gall$"
 MA_saint_gall_district_desc: "$building_type_MA_saint_gall_desc$"
 building_type_MA_saint_gall: "San Galo"
 building_type_MA_saint_gall_desc: "Un gran complejo monástico fundado en el lugar de la ermita de san Galo, en los confines de las tierras alamanas. Conocido por su disciplina y organización, alberga un #italic scriptorium#! y una biblioteca de calidad excepcional, donde los monjes copian, traducen y conservan textos clásicos y sagrados para los eruditos de toda la cristiandad."
 MA_saint_gall: "$building_type_MA_saint_gall$"
 
 #Sé of Lisbon
 MA_se_lisbon_district: "$building_type_MA_se_lisbon$"
 MA_se_lisbon_district_desc: "$building_type_MA_se_lisbon_desc$"
 building_type_MA_se_lisbon: "Catedral de Lisboa"
 building_type_MA_se_lisbon_desc: "Una robusta catedral románica construida en las laderas sobre el puerto, cuyos gruesos muros y estrechas ventanas reflejan los tiempos turbulentos de esta lucha ibérica. Erigida tras la reconquista cristiana de la ciudad, se alza sobre las ruinas de una antigua mezquita y alberga las reliquias de san Vicente bajo sus bóvedas de piedra, acogiendo procesiones a lo largo de su resonante nave."
 MA_se_lisbon: "$building_type_MA_se_lisbon$"
 
 #Alto Douro Vineyards
 MA_alto_douro_district: "$building_type_MA_alto_douro$"
 MA_alto_douro_district_desc: "$building_type_MA_alto_douro_desc$"
 building_type_MA_alto_douro: "Viñedos del Alto Duero"
 building_type_MA_alto_douro_desc: "Viñedos en terrazas excavadas en las empinadas colinas del valle del Duero, donde los muros de piedra sostienen la tierra y canalizan el sol. Plantados por primera vez en época romana, los viñedos producen desde hace mucho vinos fuertes y oscuros que se transportan río abajo hacia los mercados costeros y las cortes extranjeras."
 MA_alto_douro: "$building_type_MA_alto_douro$"
 
 #Fortifications on the Guadalquivir
 MA_guadalquivir_fortifications_district: "$building_type_MA_guadalquivir_fortifications$"
 MA_guadalquivir_fortifications_district_desc: "$building_type_MA_guadalquivir_fortifications_desc$"
 building_type_MA_guadalquivir_fortifications: "Fortificaciones del Guadalquivir"
 building_type_MA_guadalquivir_fortifications_desc: "Extendidas a lo largo de las orillas del Guadalquivir, las fortificaciones protegen el bullicioso puerto de Sevilla con torres y puertas a cada paso. Destaca sobre todo la Torre del Oro, una atalaya de doce lados revestida de un encalado dorado que reluce sobre las aguas del río, a la vez guía para los barcos que se acercan y advertencia del poder de la ciudad."
 MA_guadalquivir_fortifications: "$building_type_MA_guadalquivir_fortifications$"
 
 #Madinat al-Zahra
 MA_madinat_alzahra_district: "$building_type_MA_madinat_alzahra$"
 MA_madinat_alzahra_district_desc: "$building_type_MA_madinat_alzahra_desc$"
 building_type_MA_madinat_alzahra: "Medina Azahara"
 building_type_MA_madinat_alzahra_desc: "Una vasta ciudad palatina construida en las suaves estribaciones de la campiña cordobesa para mostrar el esplendor de la corte del califa. Sus jardines, pabellones y salones de recepción se distribuyen en amplias terrazas, con muros de mármol y jaspe finamente tallados, cuya belleza y magnificencia inspiran a los poetas a escribir sobre los mayores placeres de la vida."
 MA_madinat_alzahra: "$building_type_MA_madinat_alzahra$"
 
 #Circus of Merida
 MA_circus_merida_district: "$building_type_MA_circus_merida$"
 MA_circus_merida_district_desc: "$building_type_MA_circus_merida_desc$"
 building_type_MA_circus_merida: "Circo de Mérida"
 building_type_MA_circus_merida_desc: "Los restos de un antiguo circo romano se extienden largos y estrechos por la llanura a las afueras de Mérida, con su contorno aún marcado por muros desmoronados y pistas cubiertas de hierba, bajo la suave sombra de unos pocos cipreses. Cerca de allí se ha levantado una pequeña iglesia con un tranquilo cementerio, más allá de las ruinas, encontrando un nuevo propósito donde el antiguo había desaparecido."
 MA_circus_merida: "$building_type_MA_circus_merida$"
 
 #Alhambra
 MA_alhambra1_district: "$building_type_MA_alhambra1$"
 MA_alhambra1_district_desc: "$building_type_MA_alhambra1_desc$"
 building_type_MA_alhambra1: "Alhambra"
 building_type_MA_alhambra1_desc: "Sobre la suave colina de la Sabika, las murallas rojas de la Alhambra vigilan Granada y su fértil vega. Dentro de su abrazo, los gobernantes de la ciudad encuentran refugio frente a sus enemigos y al calor del sol estival, mientras torres y almenas proclaman su dominio sobre las tierras que se extienden a sus pies."
 MA_alhambra2: "Alcazaba Nueva"
 MA_alhambra3: "Patios y jardines"
 MA_alhambra4: "Patio de los Leones"
 MA_alhambra1: "Fortaleza Roja"
 
 #The Cologne Cathedral
 MA_cologne_cathedral1_district: "$building_type_MA_cologne_cathedral1$"
 MA_cologne_cathedral1_district_desc: "$building_type_MA_cologne_cathedral1_desc$"
 building_type_MA_cologne_cathedral1: "Catedral de Colonia"
 building_type_MA_cologne_cathedral1_desc: "La gran iglesia de Colonia, sede de su arzobispo y símbolo del orgullo de la ciudad. Ampliada y reconstruida durante siglos, alberga reliquias de valor incalculable que atraen a peregrinos de todas partes, mientras sus poderosos muros se imponen sobre los tejados de la ciudad."
 MA_cologne_cathedral1: "Antigua catedral de Colonia"
 MA_cologne_cathedral2: "Agujas gemelas de Colonia"
 
 #Qutb Complex
 MA_qutb_complex1_district: "$building_type_MA_qutb_complex1$"
 MA_qutb_complex1_district_desc: "$building_type_MA_qutb_complex1_desc$"
 building_type_MA_qutb_complex1: "Complejo Qutb"
 building_type_MA_qutb_complex1_desc: "En el corazón de Delhi se encuentra un antiguo recinto sagrado donde los gobernantes han erigido monumentos y templos para proclamar su fe y su poder. Columnas talladas y patios rodean la gran columna de hierro de los Gupta, cuyo fuste oscuro resiste el paso de dinastías y dioses."
 MA_qutb_complex1: "Columna de Hierro"
 MA_qutb_complex2: "Gran mezquita de Delhi"
 MA_qutb_complex3: "Qutb Minar"
 MA_qutb_complex4: "Alai Minar"
 
 #Sigiriya
 MA_sigiriya1_district: "$building_type_MA_sigiriya1$"
 MA_sigiriya1_district_desc: "$building_type_MA_sigiriya1_desc$"
 building_type_MA_sigiriya1: "Sigiriya"
 building_type_MA_sigiriya1_desc: "Una enorme roca solitaria emerge de la espesa selva, y en su cima se encuentra la antigua ciudadela real de [Glossary('Sigiriya','MA_sigiriya_glossary')]. Las escaleras ascienden junto a muros cubiertos de frescos y la colosal Puerta del León, por encima de jardines escalonados y estanques que dan testimonio de la ambición de los reyes que establecieron su hogar en el cielo."
 MA_sigiriya1: "Ruinas de Sigiriya"
 MA_sigiriya2: "Sigiriya restaurada"
 MA_sigiriya_glossary: "Una palabra cingalesa que significa literalmente \"la Roca del León\"."
 
 #Great Sanchi Stupa
 MA_sanchi_stupa_district: "$building_type_MA_sanchi_stupa$"
 MA_sanchi_stupa_district_desc: "$building_type_MA_sanchi_stupa_desc$"
 building_type_MA_sanchi_stupa: "Gran estupa de Sanchi"
 building_type_MA_sanchi_stupa_desc: "Esta enorme cúpula de piedra y ladrillo se construyó por primera vez por orden del poderoso emperador Ashoka. Desde entonces, sus sucesores han ampliado el complejo, que también ha sufrido los estragos del tiempo. Se alza sobre una terraza elevada, rodeada de balaustradas esculpidas y ornamentados #italics toranas#!, puertas alrededor de las cuales los peregrinos caminan en interminable devoción."
 MA_sanchi_stupa: "$building_type_MA_sanchi_stupa$"
 
 #Vindhyagiri Hill
 MA_gommateshwara1_district: "$building_type_MA_gommateshwara1$"
 MA_gommateshwara1_district_desc: "$building_type_MA_gommateshwara1_desc$"
 building_type_MA_gommateshwara1: "Colina de Vindhyagiri"
 building_type_MA_gommateshwara1_desc: "Elevándose abruptamente sobre la ciudad de Shravanabelagola, las alturas de granito de Vindhyagiri están coronadas por santuarios y patios de devoción jainista. Los peregrinos ascienden descalzos por sus escalones tallados, mientras el aire se llena del tañido de campanas y del aroma de la piedra calentada por el sol."
 MA_gommateshwara2: "Coloso de Gommateshwara"
 MA_gommateshwara1: "Templos de Vindhyagiri"
 
 #Palace of Ghazni
 MA_ghazni_palace_district: "$building_type_MA_ghazni_palace$"
 MA_ghazni_palace_district_desc: "$building_type_MA_ghazni_palace_desc$"
 building_type_MA_ghazni_palace: "Palacio gaznávida"
 building_type_MA_ghazni_palace_desc: "Situada fuera de las murallas de Gazni, esta residencia real sirve de centro de poder del sultán de la ciudad. Sus salones, dispuestos alrededor de un patio cuadrangular con #italic iwán#!, están exquisitamente tallados y ricamente decorados con estuco y azulejos policromados, inspirados en el arte de Persia."
 MA_ghazni_palace: "$building_type_MA_ghazni_palace$"
 
 #Stupas of Anuradhapura
 MA_stupas_anuradhapura_district: "$building_type_MA_stupas_anuradhapura$"
 MA_stupas_anuradhapura_district_desc: "$building_type_MA_stupas_anuradhapura_desc$"
 building_type_MA_stupas_anuradhapura: "Estupas de Anuradhapura"
 building_type_MA_stupas_anuradhapura_desc: "Alrededor de la antigua ciudad de templos de Anuradhapura se alzan las inmensas [Glossary('estupas','MA_stupa_glossary')] de ladrillo de los reyes cingaleses, construidas para custodiar reliquias de Buda. Las formas encaladas de los monasterios y centros de estudio de la ciudad resplandecen bajo el sol, mientras en sus salones y patios se celebran debates."
 MA_stupas_anuradhapura: "$building_type_MA_stupas_anuradhapura$"
 
 #Eye of the Sahara
 MA_eye_sahara_district: "$building_type_MA_eye_sahara$"
 MA_eye_sahara_district_desc: "$building_type_MA_eye_sahara_desc$"
 building_type_MA_eye_sahara: "Ojo del Sáhara"
 building_type_MA_eye_sahara_desc: "Una vasta formación circular en el corazón del desierto, cuyos anillos rocosos se extienden kilómetros sobre la arena. Desde lejos parece un enorme ojo erosionado que mira al cielo, un hito conocido por los nómadas y las caravanas que cruzan los páramos áridos que lo rodean. \nAntiguas leyendas lo relacionan con una ciudad antaño próspera, exuberante y llena de agua, pero ahora engullida por las arenas."
 MA_eye_sahara: "$building_type_MA_eye_sahara$"
 
 #Great Mosque of Mahdia
 MA_mahdia_mosque_district: "$building_type_MA_mahdia_mosque$"
 MA_mahdia_mosque_district_desc: "$building_type_MA_mahdia_mosque_desc$"
 building_type_MA_mahdia_mosque: "Gran Mezquita de Mahdía"
 building_type_MA_mahdia_mosque_desc: "Erigida en la península de costas rocosas de Mahdía, esta austera mezquita parece una fortaleza con sus torres de piedra clara. \nEn su interior, dos elegantes patios porticados conducen a las salas de oración donde los fieles se reúnen bajo arcos de piedra pálida."
 MA_mahdia_mosque: "$building_type_MA_mahdia_mosque$"
 
 #Saint Mark's of Zagreb
 MA_zagreb_church_district: "$building_type_MA_zagreb_church$"
 MA_zagreb_church_district_desc: "$building_type_MA_zagreb_church_desc$"
 building_type_MA_zagreb_church: "San Marcos de Zagreb"
 building_type_MA_zagreb_church_desc: "Construida con la ayuda de artesanos italianos y alemanes, la iglesia de San Marcos se eleva sobre el resto de la ciudad. Su planta románica está embellecida con añadidos góticos, y sus portadas y muros están profusamente pintados con escenas bíblicas."
 MA_zagreb_church: "$building_type_MA_zagreb_church$"
 
 #Walls of Balkh
 MA_walls_balkh_district: "$building_type_MA_walls_balkh$"
 MA_walls_balkh_district_desc: "$building_type_MA_walls_balkh_desc$"
 building_type_MA_walls_balkh: "Murallas de Balj"
 building_type_MA_walls_balkh_desc: "Durante siglos, la ciudadela de Balj ha estado protegida por dos grandes murallas circulares alrededor de todo su perímetro, una dentro de la otra. Sus terraplenes y torres de tierra forman un baluarte contra los ejércitos que recorren la estepa y protegen los mercados y talleres de la ciudad."
 MA_walls_balkh: "$building_type_MA_walls_balkh$"
 
 #Martand Sun Temple
 MA_martand_sun_temple_district: "$building_type_MA_martand_sun_temple$"
 MA_martand_sun_temple_district_desc: "$building_type_MA_martand_sun_temple_desc$"
 building_type_MA_martand_sun_temple: "Templo del Sol de Martand"
 building_type_MA_martand_sun_temple_desc: "Erigido sobre una alta meseta del valle de Cachemira, el templo es uno de los más antiguos consagrados al Sol divino. Su gran santuario ocupa el centro y está rodeado de numerosos santuarios menores y hileras de relieves de deidades y figuras celestiales. El patio peristilo contiene un estanque sereno que reluce bajo el sol."
 MA_martand_sun_temple: "$building_type_MA_martand_sun_temple$"
 
 #Ruins of Aquae Sulis
 MA_aquae_sulis_ruins_district: "$building_type_MA_aquae_sulis_ruins$"
 MA_aquae_sulis_ruins_district_desc: "$building_type_MA_aquae_sulis_ruins_desc$"
 building_type_MA_aquae_sulis_ruins: "Ruinas de Aquae Sulis"
 building_type_MA_aquae_sulis_ruins_desc: "#low La obra de los gigantes se desmorona#! \nAlrededor del manantial sagrado y humeante yacen los restos destrozados de Aquae Sulis, donde los romanos levantaron antaño grandes termas y templos de piedra labrada. Muros rotos, arcos caídos y cámaras inundadas aún señalan la planta ordenada del antiguo complejo, mientras sus aguas cálidas siguen fluyendo y peregrinos y habitantes de la ciudad se reúnen entre las ruinas."
 MA_aquae_sulis_ruins: "$building_type_MA_aquae_sulis_ruins$"
 
 #Winchester Minster
 MA_winchester_minster_district: "$building_type_MA_winchester_minster$"
 MA_winchester_minster_district_desc: "$building_type_MA_winchester_minster_desc$"
 building_type_MA_winchester_minster: "Gran iglesia de Winchester"
 building_type_MA_winchester_minster_desc: "La gran iglesia es una vasta basílica de piedra y madera, con una amplia nave pintada y varios campanarios. Domina la ciudad real, mucho mayor que cualquiera de sus otras construcciones, y custodia las tumbas reales de Wessex."
 MA_winchester_minster: "$building_type_MA_winchester_minster$"
 
 #Westminster Abbey
 MA_westminster_abbey_district: "$building_type_MA_westminster_abbey$"
 MA_westminster_abbey_district_desc: "$building_type_MA_westminster_abbey_desc$"
 building_type_MA_westminster_abbey: "Abadía de Westminster"
 building_type_MA_westminster_abbey_desc: "Construida junto al Támesis y generosamente dotada por los reyes de Inglaterra, la abadía de Westminster es una gran iglesia monástica de piedra, cuya larga nave y elevado coro están adornados con capiteles esculpidos y muros pintados. Aquí se corona y se da sepultura a los reyes, y la abadía sirve de escenario sagrado donde la autoridad real y el favor divino se unen."
 MA_westminster_abbey: "$building_type_MA_westminster_abbey$"
 
 #Lorsch Gate
 MA_lorsch_gate_district: "$building_type_MA_lorsch_gate$"
 MA_lorsch_gate_district_desc: "$building_type_MA_lorsch_gate_desc$"
 building_type_MA_lorsch_gate: "Puerta de Lorsch"
 building_type_MA_lorsch_gate_desc: "La monumental puerta de la abadía de Lorsch es un ejemplo raro y cuidadosamente construido de arquitectura carolingia. Levantada con piedra y ladrillo finamente labrados, su fachada simétrica está articulada por columnas adosadas, arcos ciegos y ornamentos clásicos que evocan antiguos modelos romanos."
 MA_lorsch_gate: "$building_type_MA_lorsch_gate$"
 
 #Dover Castle
 MA_dover_castle_district: "$building_type_MA_dover_castle$"
 MA_dover_castle_district_desc: "$building_type_MA_dover_castle_desc$"
 building_type_MA_dover_castle: "Castillo de Dover"
 building_type_MA_dover_castle_desc: "Situada sobre los acantilados blancos que dominan el estrecho canal, la fortaleza controla el principal acceso entre Inglaterra y el continente. Su enorme torre del homenaje de piedra, sus murallas y sus sucesivas puertas fortificadas forman un formidable complejo defensivo que domina el puerto y los caminos hacia el interior y sirve al mismo tiempo de plaza fuerte y residencia real."
 MA_dover_castle: "$building_type_MA_dover_castle$"
 
 #Château Gaillard
 MA_chateau_gaillard_district: "$building_type_MA_chateau_gaillard$"
 MA_chateau_gaillard_district_desc: "$building_type_MA_chateau_gaillard_desc$"
 building_type_MA_chateau_gaillard: "Château Gaillard"
 building_type_MA_chateau_gaillard_desc: "Construido sobre un espolón calizo que domina el Sena, Château Gaillard es una fortaleza de piedra compacta y sofisticada, concebida para la defensa activa. Sus murallas concéntricas, torres angulares y puertas avanzadas reducen los puntos ciegos y concentran el fuego en los accesos. Levantado con rapidez y precisión, encarna los principios más modernos de la arquitectura militar y asegura el control del río y la frontera normanda."
 MA_chateau_gaillard: "$building_type_MA_chateau_gaillard$"
 
 #Carnac Stones
 MA_carnac_stones_district: "$building_type_MA_carnac_stones$"
 MA_carnac_stones_district_desc: "$building_type_MA_carnac_stones_desc$"
 building_type_MA_carnac_stones: "Piedras de Carnac"
 building_type_MA_carnac_stones_desc: "Cientos de enormes piedras están diseminadas por la llanura, dispuestas en hileras ordenadas que se extienden hacia el horizonte. Erigidas en una época remota, más allá de toda memoria, su verdadero propósito se ha perdido entre leyendas y relatos."
 MA_carnac_stones: "$building_type_MA_carnac_stones$"
 
 #Guérande Salt Marshes
 MA_guerande_salt_marshes_district: "$building_type_MA_guerande_salt_marshes$"
 MA_guerande_salt_marshes_district_desc: "$building_type_MA_guerande_salt_marshes_desc$"
 building_type_MA_guerande_salt_marshes: "Salinas de Guérande"
 building_type_MA_guerande_salt_marshes_desc: "Por las bajas llanuras costeras cerca de Guérande se extiende una red de salinas, diques y canales utilizados para extraer del mar el célebre manjar de la #italic flor de sal#!. El agua marina se conduce por estanques poco profundos, donde el sol hace aflorar la sal blanca, sosteniendo las ciudades y el comercio de la región mediante un oficio transmitido de generación en generación."
 MA_guerande_salt_marshes: "$building_type_MA_guerande_salt_marshes$"
 
 #Reims Cathedral
 MA_reims_cathedral_district: "$building_type_MA_reims_cathedral$"
 MA_reims_cathedral_district_desc: "$building_type_MA_reims_cathedral_desc$"
 building_type_MA_reims_cathedral: "Catedral de Reims"
 building_type_MA_reims_cathedral_desc: "Una vasta catedral gótica caracterizada por su alta nave, esbeltos pilares fasciculados y abundantes bóvedas de crucería y arbotantes. Su fachada occidental está ricamente articulada mediante portadas esculpidas y profundas arquivoltas, mientras el interior queda encerrado entre muros de vidrieras que acentúan la altura, la luz y la grandeza ceremonial, apropiadas para su papel central en las coronaciones de los reyes de Francia."
 MA_reims_cathedral: "$building_type_MA_reims_cathedral$"
 
 #Chartres Cathedral
 MA_chartres_cathedral_district: "$building_type_MA_chartres_cathedral$"
 MA_chartres_cathedral_district_desc: "$building_type_MA_chartres_cathedral_desc$"
 building_type_MA_chartres_cathedral: "Catedral de Chartres"
 building_type_MA_chartres_cathedral_desc: "Uno de los ejemplos más elegantes y ordenados de la ambición del alto gótico, Chartres se distingue por su amplia nave, robustos pilares y profundo coro. Sus muros se disuelven en gran medida en vidrieras insertadas en una sólida estructura esquelética, mientras sus torres gemelas y alzados cuidadosamente proporcionados expresan estabilidad, claridad e intención teológica."
 MA_chartres_cathedral: "$building_type_MA_chartres_cathedral$"
 
 #Palace of Avignon
 MA_avignon_palace1_district: "$building_type_MA_avignon_palace1$"
 MA_avignon_palace1_district_desc: "$building_type_MA_avignon_palace1_desc$"
 building_type_MA_avignon_palace1: "Palacio de Aviñón"
 building_type_MA_avignon_palace1_desc: "Elevado sobre un promontorio rocoso junto al Ródano, este gran palacio fortificado es la sede de una corte refinada y poderosa. Sus salones, torres y capillas abovedadas muestran líneas fuertes y elegantes, mientras emisarios, artesanos y mercaderes llenan las calles inferiores, atraídos por la riqueza y la autoridad de sus gobernantes."
 MA_avignon_palace1: "Palacio Viejo"
 MA_avignon_palace2: "Palacio Nuevo"
 
 #Walls of Carcassonne
 MA_walls_carcassonne1_district: "$building_type_MA_walls_carcassonne1$"
 MA_walls_carcassonne1_district_desc: "$building_type_MA_walls_carcassonne1_desc$"
 building_type_MA_walls_carcassonne1: "Murallas de Carcasona"
 building_type_MA_walls_carcassonne1_desc: "Las antiguas murallas de Carcasona protegen el valle y los caminos entre las tierras ibéricas y francas. Torres y sólidas puertas fortificadas coronan el recinto, custodiando las casas interiores y los campos inferiores, un formidable bastión en una frontera disputada durante mucho tiempo por reyes y credos."
 MA_walls_carcassonne1: "Antiguas murallas de Carcasona"
 MA_walls_carcassonne2: "Murallas dobles de Carcasona"
 
 #Saint-Denis Basilica
 MA_saint_denis_basilica1_district: "$building_type_MA_saint_denis_basilica1$"
 MA_saint_denis_basilica1_district_desc: "$building_type_MA_saint_denis_basilica1_desc$"
 building_type_MA_saint_denis_basilica1: "Basílica de Saint-Denis"
 building_type_MA_saint_denis_basilica1_desc: "Levantada sobre el lugar donde fue enterrado san Dionisio, esta gran basílica es un santuario de devoción real. Su amplia nave guía a los peregrinos hacia el sepulcro del santo, mientras muros pintados y capiteles esculpidos velan por los reyes que descansan bajo ellos. Aquí la autoridad de la Corona y de la Iglesia quedan unidas en piedra."
 MA_saint_denis_basilica1: "Basílica real de Saint-Denis"
 MA_saint_denis_basilica2: "Gran coro de Saint-Denis"
 
 #Île de la Cité
 MA_ile_de_la_cite1_district: "$building_type_MA_ile_de_la_cite1$"
 MA_ile_de_la_cite1_district_desc: "$building_type_MA_ile_de_la_cite1_desc$"
 building_type_MA_ile_de_la_cite1: "Île de la Cité"
 building_type_MA_ile_de_la_cite1_desc: "Tras la caída de Roma, los habitantes encontraron refugio en la isla, rodeada por las aguas de un meandro del Sena. Desde entonces, sin embargo, la Île se ha vuelto vibrante, hermosa y orgullosa, y hoy es el corazón político, intelectual y comercial de París y, con él, de Francia."
 MA_ile_de_la_cite1: "Palacio carolingio"
 MA_ile_de_la_cite2: "Palacio gótico"
 
 #Iron Gate
 MA_iron_gate_district: "$building_type_MA_iron_gate$"
 MA_iron_gate_district_desc: "$building_type_MA_iron_gate_desc$"
 building_type_MA_iron_gate: "Puerta de Hierro"
 building_type_MA_iron_gate_desc: "Custodiando el paso montañoso que une la llanura del Orontes con la cordillera que se alza más allá, la Puerta de Hierro constituye uno de los accesos más importantes a Antioquía. Aquí las murallas se estrechan en un desfiladero fortificado con torres de piedra, puertas y muros de contención anclados directamente en la roca. La ciudadela también funciona como una especie de presa que controla el torrente del Parmenio para proteger la ciudad."
 MA_iron_gate: "$building_type_MA_iron_gate$"
 
 #Pula Amphitheater
 MA_pula_amphiteater_district: "$building_type_MA_pula_amphiteater$"
 MA_pula_amphiteater_district_desc: "$building_type_MA_pula_amphiteater_desc$"
 building_type_MA_pula_amphiteater: "Anfiteatro de Pula"
 building_type_MA_pula_amphiteater_desc: "Construido con piedra caliza finamente tallada, este anfiteatro conserva la forma completa de una arena romana, con muros elípticos, gradas escalonadas y un sistema de corredores abovedados bajo ellas. Sus cuatro torres de esquina y robustas arcadas reflejan las orgullosas tradiciones de ingeniería que lo levantaron, mientras la estructura sigue siendo un centro de autoridad, reunión y espectáculo en la ciudad medieval."
 MA_pula_amphiteater: "$building_type_MA_pula_amphiteater$"
 
 #Olympus
 MA_olympus_district: "$building_type_MA_olympus$"
 MA_olympus_district_desc: "$building_type_MA_olympus_desc$"
 building_type_MA_olympus: "Olimpo"
 building_type_MA_olympus_desc: "Una montaña imponente en el corazón de Tesalia, cuya cima escarpada, la más alta de toda Grecia, proyecta largas sombras sobre el mar y las suaves y fértiles laderas. \nConsiderada la morada de los dioses, ha inspirado veneración y asombro durante milenios, y se dice que su cumbre está coronada por su palacio invisible."
 MA_olympus: "$building_type_MA_olympus$"
 
 #Ypres Cloth Hall
 MA_ypres_cloth_hall_district: "$building_type_MA_ypres_cloth_hall$"
 MA_ypres_cloth_hall_district_desc: "$building_type_MA_ypres_cloth_hall_desc$"
 building_type_MA_ypres_cloth_hall: "Lonja de Paños de Ypres"
 building_type_MA_ypres_cloth_hall_desc: "Este vasto edificio cívico de piedra y madera se construyó para albergar la regulación, el almacenamiento y el comercio de paños de lana que sostienen la riqueza de la ciudad. Su larga y ordenada fachada está articulada por arcadas, hastiales y un imponente campanario, combinando la función mercantil con la autoridad urbana. En sus salas abovedadas, mercaderes, funcionarios gremiales y magistrados supervisan contratos, medidas e impuestos en el corazón de la economía de la ciudad."
 MA_ypres_cloth_hall: "$building_type_MA_ypres_cloth_hall$"
 
 #Gravensteen
 MA_gravensteen_district: "$building_type_MA_gravensteen$"
 MA_gravensteen_district_desc: "$building_type_MA_gravensteen_desc$"
 building_type_MA_gravensteen: "Gravensteen"
 building_type_MA_gravensteen_desc: "Este imponente castillo de piedra sirve de sede a los condes de Flandes y simboliza la autoridad condal sobre la ciudad. Centrado en una enorme torre del homenaje y rodeado de gruesas murallas, combina salones residenciales con cámaras judiciales y defensas militares, afirmando el poder señorial entre el denso tejido urbano de Gante."
 MA_gravensteen: "$building_type_MA_gravensteen$"
 
 #Mount Ararat
 MA_ararat_district: "$building_type_MA_ararat$"
 MA_ararat_district_desc: "$building_type_MA_ararat_desc$"
 building_type_MA_ararat: "Monte Ararat"
 building_type_MA_ararat_desc: "Un vasto macizo volcánico que se eleva en dos cumbres sobre las llanuras circundantes, el monte Ararat domina el horizonte con nieves perpetuas en su cima. Venerado por reinos y religiones, está vinculado a la antigua tradición como lugar de descanso del arca de Noé, otorgando autoridad sagrada y una presencia solemne a las tierras que se extienden bajo sus laderas."
 MA_ararat: "$building_type_MA_ararat$"
 
 #Székesfehérvár Basilica
 MA_szekesfehervar_basilica1_district: "$building_type_MA_szekesfehervar_basilica1$"
 MA_szekesfehervar_basilica1_district_desc: "$building_type_MA_szekesfehervar_basilica1_desc$"
 building_type_MA_szekesfehervar_basilica1: "Basílica de Székesfehérvár"
 building_type_MA_szekesfehervar_basilica1_desc: "Esta gran basílica de piedra sirve de corazón ceremonial y dinástico del reino húngaro. En su amplia nave se corona y sepulta a los reyes, uniendo realeza, ley y fe bajo las bóvedas del principal santuario real del reino."
 MA_szekesfehervar_basilica1: "Basílica real de Székesfehérvár"
 MA_szekesfehervar_basilica2: "Gran coro de Székesfehérvár"
 
 #Prague Castle
 MA_prague_castle1_district: "$building_type_MA_prague_castle1$"
 MA_prague_castle1_district_desc: "$building_type_MA_prague_castle1_desc$"
 building_type_MA_prague_castle1: "Castillo de Praga"
 building_type_MA_prague_castle1_desc: "Sobre la larga cresta que domina el Moldava, los salones, iglesias y patios del castillo de Praga se imponen sobre la ciudad. Artesanos, servidores y clérigos se reúnen alrededor de esta sede de los gobernantes de Bohemia, cuya riqueza y ambición han convertido la colina en el corazón político y sagrado de sus tierras."
 MA_prague_castle1: "Sede principesca de Praga"
 MA_prague_castle2: "Castillo real de Praga"
 
 #Saint Adrian's Basilica
 MA_zalavar_basilica_district: "$building_type_MA_zalavar_basilica$"
 MA_zalavar_basilica_district_desc: "$building_type_MA_zalavar_basilica_desc$"
 building_type_MA_zalavar_basilica: "Basílica de San Adriano"
 building_type_MA_zalavar_basilica_desc: "Centro de un asentamiento fortificado carolingio en los pantanos del Zala, la basílica de San Adriano es una importante fundación eclesiástica de la primera cristianización de la región. Construida como iglesia de piedra de tres naves con un santuario pronunciado y estructuras occidentales, sirve tanto de centro misionero como de iglesia principesca y amplía la influencia diplomática de su protector sobre las regiones fronterizas."
 MA_zalavar_basilica: "$building_type_MA_zalavar_basilica$"
 
 #Baths of Hisham
 MA_baths_hisham_district: "$building_type_MA_baths_hisham$"
 MA_baths_hisham_district_desc: "$building_type_MA_baths_hisham_desc$"
 building_type_MA_baths_hisham: "Baños de Hisham"
 building_type_MA_baths_hisham_desc: "Parte de un complejo palaciego mayor, estos baños están distribuidos en una sucesión de cámaras frías, templadas y calientes, abastecidas por un sistema de hipocausto y cubiertas por bóvedas de piedra. Sus suelos están ricamente revestidos de mosaicos geométricos y figurativos, especialmente el gran pavimento de árboles y animales, ejecutado con teselas finas y una composición esmerada."
 MA_baths_hisham: "$building_type_MA_baths_hisham$"
 
 #Peel Castle
 MA_peel_castle1_district: "$building_type_MA_peel_castle1$"
 MA_peel_castle1_district_desc: "$building_type_MA_peel_castle1_desc$"
 building_type_MA_peel_castle1: "Isla de San Patricio"
 building_type_MA_peel_castle1_desc: "En la rocosa isla de San Patricio, iglesias, salones y cementerios contemplan el mar circundante. Aquí conviven las antiguas tradiciones locales y la fe de los nuevos colonos, mientras clérigos y gobernantes comparten un estrecho refugio cuyas costas protegidas unen el culto con el poder terrenal."
 MA_peel_castle1: "Monasterio de la isla de San Patricio"
 MA_peel_castle2: "Salón de San Patricio"
 MA_peel_castle3: "Castillo de Peel"
 
 #Knin Fortress
 MA_knin_fortress_district: "$building_type_MA_knin_fortress$"
 MA_knin_fortress_district_desc: "$building_type_MA_knin_fortress_desc$"
 building_type_MA_knin_fortress: "Fortaleza de Knin"
 building_type_MA_knin_fortress_desc: "Extendida por una estrecha cresta caliza sobre el valle del Krka, la fortaleza de Knin forma un largo complejo defensivo dividido en sectores, con murallas, torres y patios cerrados. Su posición controla las rutas entre la costa y las llanuras interiores, convirtiéndola en una de las principales plazas fuertes reales de la región."
 MA_knin_fortress: "$building_type_MA_knin_fortress$"
 
 #Amaravati Stupa
 MA_amaravati_stupa_district: "$building_type_MA_amaravati_stupa$"
 MA_amaravati_stupa_district_desc: "$building_type_MA_amaravati_stupa_desc$"
 building_type_MA_amaravati_stupa: "Estupa de Amaravati"
 building_type_MA_amaravati_stupa_desc: "Una gran y antigua [Glossary('estupa','MA_stupa_glossary')] revestida de paneles de piedra caliza blanca, la mayor de la India dravídica. Coloridos relieves narrativos están tallados en el ladrillo y representan la vida de Buda y escenas de devoción en medallones y frisos, mientras las puertas señalan los accesos cardinales y ordenan el recorrido ritual alrededor del túmulo sagrado."
 MA_amaravati_stupa: "$building_type_MA_amaravati_stupa$"
 MA_stupa_glossary: "Una estructura con forma de cúpula que contiene reliquias y se utiliza como lugar de meditación y devoción en la práctica budista. Las primeras estupas eran sencillos túmulos, y su forma y función evolucionaron con el tiempo hasta influir en la arquitectura budista de toda Asia, incluidas, posiblemente, las pagodas."
 
 #Karla Caves
 MA_karla_caves_district: "$building_type_MA_karla_caves$"
 MA_karla_caves_district_desc: "$building_type_MA_karla_caves_desc$"
 building_type_MA_karla_caves: "Cuevas de Karla"
 building_type_MA_karla_caves_desc: "Excavadas directamente en la ladera, las cuevas de Karla forman un complejo de [Glossary('viharas','MA_vihara')] y santuarios rupestres centrado en una gran sala chaitya. Este vasto espacio se caracteriza por un techo alto y abovedado con nervaduras talladas, una larga nave flanqueada por columnatas y una [Glossary('estupa','MA_stupa_glossary')] en el extremo absidal. La fachada de entrada está articulada por un gran arco de herradura y relieves esculpidos, que señalan la transición del mundo exterior al interior ordenado del movimiento ritual y la devoción."
 MA_karla_caves: "$building_type_MA_karla_caves$"
 MA_vihara: "Un tipo de templo budista que ofrece alojamiento a los monjes. En la arquitectura india se refiere más concretamente a una sala central con celdas conectadas a ella."
 
 #Somnath Temple
 MA_somnath_temple_district: "$building_type_MA_somnath_temple$"
 MA_somnath_temple_district_desc: "$building_type_MA_somnath_temple_desc$"
 building_type_MA_somnath_temple: "Templo de Somnath"
 building_type_MA_somnath_temple_desc: "Un gran templo de piedra dedicado al dios de la Luna, Somnath se organiza a lo largo de un eje longitudinal de [Glossary('mandapas','MA_mandapa')] que conduce a un santuario coronado por una elevada [Glossary('shikhara','MA_vimana_glossary')]. Sus muros y pilares están ricamente tallados con esculturas de deidades, acompañantes y bandas ornamentales. Como importante centro de peregrinación, atrae a devotos de toda la región, pero también las miradas codiciosas de ejércitos paganos procedentes del otro lado del Indo."
 MA_somnath_temple: "$building_type_MA_somnath_temple$"
 MA_mandapa: "Una sala o pabellón con pilares de la arquitectura india que funciona como espacio de transición y entrada a un templo."
 
 #Devagiri
 MA_devagiri_district: "$building_type_MA_devagiri$"
 MA_devagiri_district_desc: "$building_type_MA_devagiri_desc$"
 building_type_MA_devagiri: "Devagiri"
 building_type_MA_devagiri_desc: "Una gran colina volcánica se eleva abruptamente desde las llanuras, con sus oscuras laderas de basalto surcadas por estrechos senderos que serpentean hacia la cumbre. Conocida como [Glossary('Devagiri','MA_devagiri_glossary')], la montaña alberga antiguas cuevas y santuarios, mientras sus alturas dominantes ofrecen un formidable refugio a quienes la poseen."
 MA_devagiri: "$building_type_MA_devagiri$"
 MA_daulatabad: "Daulatabad"
 MA_devagiri_glossary: "Del sánscrito, significa \"Colina de los Dioses\"."
 MA_daulatabad_glossary: "La Morada de la Riqueza."
 
 #Ashoka's Palace
 MA_ashoka_palace1_district: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_palace1_district_desc: "$building_type_MA_ashoka_palace1_desc$"
 building_type_MA_ashoka_palace1: "Palacio de Ashoka"
 building_type_MA_ashoka_palace1_desc: "El palacio del gran [Glossary('Ashoka','MA_ashoka_glossary')] da testimonio de la riqueza y el poder de los antiguos reyes de la India. Sus amplios patios y salones porticados han inspirado relatos de un esplendor extraordinario, y su escala y refinamiento ofrecen un modelo digno para quienes deseen restaurar las glorias de antaño."
 MA_ashoka_palace1: "Ruinas del palacio de Ashoka"
 MA_ashoka_palace2: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_glossary: "El tercer emperador maurya, conocido por su transformación de brutal belicista en gobernante ético que promovió el budismo y una extensa actividad misionera."
 
 #Adina Mosque
 MA_adina_mosque_district: "$building_type_MA_adina_mosque$"
 MA_adina_mosque_district_desc: "$building_type_MA_adina_mosque_desc$"
 building_type_MA_adina_mosque: "Mezquita Adina"
 building_type_MA_adina_mosque_desc: "Una vasta mezquita [Glossary('hipóstila','MA_hypostyle_glossary')] de ladrillo y piedra, Adina se organiza alrededor de un gran patio rectangular rodeado de arcadas e hileras de tramos abovedados. Su sala de oración está cubierta por una monumental bóveda de cañón que recuerda las formas imperiales de Persia. Los [Glossary('elementos reutilizados','MA_spolia_glossary')] de piedra tallada y las flores de terracota adornan los muros exteriores."
 MA_adina_mosque: "$building_type_MA_adina_mosque$"
 MA_hypostyle_glossary: "Un tipo de diseño arquitectónico en el que el techo descansa sobre hileras de columnas, creando un amplio espacio interior abierto."
 MA_spolia_glossary: "Elementos arquitectónicos reutilizados de edificios más antiguos, a menudo empleados para transmitir una sensación de continuidad y legitimidad. Es habitual, aunque no exclusivo, en las ruinas romanas de todo el Mediterráneo."
 
 #Chittorgarh
 MA_chittorgarh_district: "$building_type_MA_chittorgarh$"
 MA_chittorgarh_district_desc: "$building_type_MA_chittorgarh_desc$"
 building_type_MA_chittorgarh: "Chittorgarh"
 building_type_MA_chittorgarh_desc: "Ocupando la cima de una larga colina aislada, el fuerte de Chittor es uno de los mayores monumentos militares de la India. Enormes murallas siguen el borde de la meseta a lo largo de kilómetros, encerrando palacios, templos y torres en una ciudadela autosuficiente."
 MA_chittorgarh: "$building_type_MA_chittorgarh$"
 
 #Lingaraj Temple
 MA_lingaraj_temple_district: "$building_type_MA_lingaraj_temple$"
 MA_lingaraj_temple_district_desc: "$building_type_MA_lingaraj_temple_desc$"
 building_type_MA_lingaraj_temple: "Templo de Lingaraj"
 building_type_MA_lingaraj_temple_desc: "Uno de los mayores ejemplos de arquitectura de templos de la India, el complejo de Lingaraj se organiza a lo largo de un único eje de espacios cada vez más sagrados que conducen a la imponente [Glossary('vimana','MA_vimana_glossary')] curvilínea de Shiva. Todas las superficies están enriquecidas con deidades esculpidas, ornamentos florales y relieves narrativos."
 MA_lingaraj_temple: "$building_type_MA_lingaraj_temple$"
 MA_vimana_glossary: "Una superestructura alta y curva que se eleva directamente sobre el santuario interior de los templos indios, a menudo adornada con intrincadas tallas y decoraciones. En el norte, este estilo se conoce como #italic shikhara#!, mientras que en el sur de la India y en Odisha recibe el nombre de #italic vimana#!."
 
 #Tsarevgrad
 MA_tsarevgrad1_district: "$building_type_MA_tsarevgrad1$"
 MA_tsarevgrad1_district_desc: "$building_type_MA_tsarevgrad1_desc$"
 building_type_MA_tsarevgrad1: "Tsarevgrad"
 building_type_MA_tsarevgrad1_desc: "Las alturas escarpadas sobre el Yantra dominan los accesos por los valles circundantes. Sobre estas colinas, murallas, torres y templos forman una plaza fuerte cuyas defensas naturales y elevados salones ofrecen una sede digna a los gobernantes de estas tierras."
 MA_tsarevgrad1: "Antigua fortaleza de Tarnovo"
 MA_tsarevgrad2: "$building_type_MA_tsarevgrad1$"
 MA_tsarevets_glossary: "Ciudad de los zares, un nombre que evoca las aspiraciones imperiales y la autoridad divina de los gobernantes que reinan desde esta elevada fortaleza."
 
 #Orange Theater
 MA_orange_theater1_district: "$building_type_MA_orange_theater1$"
 MA_orange_theater1_district_desc: "$building_type_MA_orange_theater1_desc$"
 building_type_MA_orange_theater1: "Teatro de Orange"
 building_type_MA_orange_theater1_desc: "El imponente muro de escena romano de Orange se alza sobre un gran semicírculo de piedra, recuerdo monumental de la antigua gloria de la ciudad. Sus arcos, columnas y sillares esculpidos dan testimonio de la pericia de los constructores de los césares, que sigue dando forma a la vida de los ciudadanos siglos después del fin de su dominio."
 MA_orange_theater1: "Ruinas del teatro de Orange"
 MA_orange_theater2: "$building_type_MA_orange_theater1$"
 MA_cavea_glossary: "Del término latino que significa recinto, es la zona de asientos semicircular y escalonada de un teatro o anfiteatro romano."
 
 #Walls of Mesembria
 MA_walls_mesembria_district: "$building_type_MA_walls_mesembria$"
 MA_walls_mesembria_district_desc: "$building_type_MA_walls_mesembria_desc$"
 building_type_MA_walls_mesembria: "Murallas de Mesembria"
 building_type_MA_walls_mesembria_desc: "Las murallas que rodean la península rocosa tienen una larga historia, levantadas sobre cimientos griegos y fruto de grandes esfuerzos de emperadores romanos y bizantinos. Las enormes cortinas de piedra, torres salientes y puertas fuertemente defendidas protegen el puerto y el estrecho istmo que une la ciudad con tierra firme, convirtiendo el asentamiento en uno de los puertos fortificados más sólidos del mar Negro occidental."
 MA_walls_mesembria: "$building_type_MA_walls_mesembria$"
 
 #Sri Pada
 MA_sri_pada_district: "$building_type_MA_sri_pada$"
 MA_sri_pada_district_desc: "$building_type_MA_sri_pada_desc$"
 building_type_MA_sri_pada: "Monte Malaya"
 building_type_MA_sri_pada_desc: "Una figura prominente sobre los bosques de Lanka, la escarpada cumbre de granito de Malaya domina el paisaje circundante. En su cima se alza un pequeño santuario construido alrededor de la [Glossary('Sri Pada','MA_sripada_glossary')], que atrae una interminable procesión de peregrinos que ascienden por sus sinuosos senderos para ofrecer oraciones por encima de las nubes."
 MA_sri_pada: "$building_type_MA_sri_pada$"
 MA_sripada_glossary: "Una expresión cingalesa que significa \"huella sagrada\", que según la tradición fue dejada en la montaña por el propio Buda."
 
 #Palace of Palermo
 MA_palace_palermo1_district: "$building_type_MA_palace_palermo1$"
 MA_palace_palermo1_district_desc: "$building_type_MA_palace_palermo1_desc$"
 building_type_MA_palace_palermo1: "Palacio de Palermo"
 building_type_MA_palace_palermo1_desc: "Los palacios y villas de Palermo son célebres por sus jardines, huertos y patios sombreados. Sus muros luminosos y amplios salones conservan la memoria de los numerosos gobernantes de la ciudad, cuyo mecenazgo ha reunido las tradiciones artísticas del Mediterráneo en una sede de riqueza y refinamiento."
 MA_palace_palermo1: "Villas de Palermo"
 MA_palace_palermo2: "$building_type_MA_palace_palermo1$"
 MA_palace_balarm1: "Villas de Balarm"
 MA_palace_panormus1: "Villas de Panormus"
 MA_palace_balarm2: "Palacio de Balarm"
 MA_palace_panormus2: "Palacio de Panormus"
 MA_cassaro_glossary: "El núcleo más interior de Palermo, el antiguo barrio fenicio y griego fortificado por todos sus lados. Su nombre procede de la palabra latina para castillo, #italic Castrum#!, adaptada posteriormente del árabe #italic al Qasr#!."
 
 #Cefalù Duomo
 MA_cefalu_duomo_district: "$building_type_MA_cefalu_duomo$"
 MA_cefalu_duomo_district_desc: "$building_type_MA_cefalu_duomo_desc$"
 building_type_MA_cefalu_duomo: "Duomo de Cefalú"
 building_type_MA_cefalu_duomo_desc: "Dominando los acantilados calizos de Cefalú, este [Glossary('Duomo','MA_duomo_glossary')] combina las formas robustas de la arquitectura normanda con decoraciones bizantinas e islámicas. Sus enormes torres gemelas flanquean una amplia fachada occidental, mientras el espacioso interior culmina en un gran mosaico de oro resplandeciente sobre el santuario, que proclama tanto la autoridad real como la majestad divina."
 MA_cefalu_duomo: "$building_type_MA_cefalu_duomo$"
 MA_duomo_glossary: "Derivado del latín #italic domus#!, que significa \"casa\" de Dios, el Duomo es la iglesia principal de una ciudad italiana. Aunque a menudo se traduce erróneamente como \"catedral\", no es necesario que sea sede de un obispo para recibir este título."
 
 #Athenaion of Syracuse
 MA_athenaion_district: "$building_type_MA_athenaion$"
 MA_athenaion_district_desc: "$building_type_MA_athenaion_desc$"
 building_type_MA_athenaion: "Ateneo de Siracusa"
 building_type_MA_athenaion_desc: "Construida dentro del antiguo templo de Atenea, esta iglesia conserva gran parte de la estructura original de la Antigüedad. Los muros interiores del templo se han abierto para crear una amplia nave, mientras las grandes columnas dóricas y los muros exteriores siguen siendo claramente visibles, encerrando uno de los monumentos más notables del pasado clásico de Sicilia."
 MA_athenaion: "$building_type_MA_athenaion$"
 
 #Cave of the Patriarchs
 MA_cave_patriarchs1_district: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs1_district_desc: "$building_type_MA_cave_patriarchs1_desc$"
 building_type_MA_cave_patriarchs1: "Cueva de los Patriarcas"
 building_type_MA_cave_patriarchs1_desc: "Sobre la cueva donde se cree que descansan Abraham, Isaac, Jacob y sus familias se eleva el gran recinto herodiano de piedra caliza finamente labrada. Dentro de sus sólidos muros, templos y lugares de oración expresan por igual la devoción de judíos, cristianos y musulmanes, y atraen a los peregrinos hacia las tumbas sagradas que yacen debajo."
 MA_cave_patriarchs1: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs2: "Santuario de los Patriarcas"
 MA_must_be_abrahamic: "El [holder|E] debe pertenecer a la [religious_family|E] $rf_abrahamic$."
 
 #Łysa Góra
 MA_lysa_gora1_district: "$building_type_MA_lysa_gora1$"
 MA_lysa_gora1_district_desc: "$building_type_MA_lysa_gora1_desc$"
 building_type_MA_lysa_gora1: "Łysa Góra"
 building_type_MA_lysa_gora1_desc: "Sobre las laderas boscosas de Łysa Góra se encuentra una antigua cumbre sagrada, rodeada por un gran anillo de terraplenes de piedra que separa el mundo profano de los hombres de la tierra santa que se extiende más allá. Aquí, las plegarias y ofrendas llevan las esperanzas de quienes ascienden la montaña, cuyas solemnes alturas inspiran veneración a través del paso de gobernantes y credos."
 MA_lysa_gora1: "Montaña Calva"
 MA_lysa_gora2: "Monasterio de la Santa Cruz"

 #Dome of the Rock
 MA_templum_domini: "Templum Domini"
 
 #Mainz Cathedral
 MA_mainz_cathedral1_district: "$building_type_MA_mainz_cathedral1$"
 MA_mainz_cathedral1_district_desc: "$building_type_MA_mainz_cathedral1_desc$"
 building_type_MA_mainz_cathedral1: "Sede arzobispal de Maguncia"
 building_type_MA_mainz_cathedral1_desc: "En el corazón de Maguncia, la gran catedral y los salones, capillas y patios que la rodean forman la sede de su poderoso arzobispo. Aquí se recibe a los emisarios y se resuelven los asuntos de estas tierras, mientras las campanas llaman a los fieles a la oración. Sus muros de piedra proclaman la riqueza y autoridad de un señor cuyo poder se extiende mucho más allá del altar."
 MA_mainz_cathedral1: "Barrio episcopal"
 MA_mainz_cathedral2: "Catedral de Maguncia"
 
 #Ingelheim Palace
 MA_ingelheim_palace_district: "$building_type_MA_ingelheim_palace$"
 MA_ingelheim_palace_district_desc: "$building_type_MA_ingelheim_palace_desc$"
 building_type_MA_ingelheim_palace: "Palacio de Ingelheim"
 building_type_MA_ingelheim_palace_desc: "Entre las numerosas residencias y palacios construidos por los reyes francos, muy pocos pueden rivalizar con Ingelheim en tamaño e historia. El palacio, construido cerca del Rin, presenta un singular diseño semicircular que encierra tanto el [Glossary('Aula Regia','MA_aula_regia_glossary')] como sus edificios auxiliares administrativos, residenciales y religiosos. Sus elegantes arcos y su entorno campestre recuerdan a sus numerosos visitantes una antigua villa romana."
 MA_ingelheim_palace: "$building_type_MA_ingelheim_palace$"
 MA_aula_regia_glossary: "La gran sala de audiencias y del trono de los palacios imperiales, inspirada en las que existían antaño en Roma. Generalmente es una gran sala longitudinal de una sola nave, con un ábside en uno de sus extremos."

 #Jewish Quarter of Worms
 MA_worms_jewish_quarter_district: "$building_type_MA_worms_jewish_quarter$"
 MA_worms_jewish_quarter_district_desc: "$building_type_MA_worms_jewish_quarter_desc$"
 building_type_MA_worms_jewish_quarter: "Judería de Worms"
 building_type_MA_worms_jewish_quarter_desc: "Hogar de una de las comunidades judías más importantes de Renania, esta estrecha calle está flanqueada por viviendas, talleres y una sinagoga construida con piedra cuidadosamente labrada. Junto con Maguncia y Espira, la ciudad constituye un renombrado centro del saber judío, contribuyendo al desarrollo de las tradiciones religiosas e intelectuales asquenazíes por toda Europa."
 MA_worms_jewish_quarter: "$building_type_MA_worms_jewish_quarter$"