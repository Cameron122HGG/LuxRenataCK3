l_french:
 #################
 ##MEDIEVAL ARTS##
 #################

 ###########
 #GAME RULE#
 game_rule_category_MedievalArts: "Medieval Arts"
 rule_MA_monuments: "$game_rule_category_MedievalArts$ : Monuments"
 setting_MA_monuments_all: "Priorité à $game_rule_category_MedievalArts$"
 setting_MA_monuments_all_desc: "#help Recommandé :#! En cas de conflit, les [special_buildings|E] de #V $game_rule_category_MedievalArts$#! ont priorité sur ceux du jeu de base."
 setting_MA_monuments_selection: "Priorité au jeu de base"
 setting_MA_monuments_selection_desc: "En cas de conflit, les [special_buildings|E] du #V jeu de base#! ont priorité sur ceux de $game_rule_category_MedievalArts$."
 rule_MA_ahistorical_monuments: "$game_rule_category_MedievalArts$ : Invraisemblance"
 setting_MA_ahistorical_monuments_yes: "Monuments invraisemblables autorisés"
 setting_MA_ahistorical_monuments_yes_desc: "#help Recommandé :#! Les [special_buildings|E] pouvant être considérés comme #italic invraisemblables#! sont autorisés."
 setting_MA_ahistorical_monuments_no: "Monuments invraisemblables interdits"
 setting_MA_ahistorical_monuments_no_desc: "Les [special_buildings|E] pouvant être considérés comme #italic invraisemblables#! ne sont #bold pas#! autorisés."
 rule_MA_creator_pack: "$game_rule_category_MedievalArts$ : DLC"
 setting_MA_creator_pack_yes: "Priorité aux DLC"
 setting_MA_creator_pack_yes_desc: "#help Recommandé :#! Les [special_buildings|E] des #V DLC#!, tels que #V Bâtiments sacrés#!, lorsqu'ils sont activés, ont priorité sur ceux de $game_rule_category_MedievalArts$."
 setting_MA_creator_pack_no: "$setting_MA_monuments_all$"
 setting_MA_creator_pack_no_desc: "En cas de conflit, les [special_buildings|E] de #V $game_rule_category_MedievalArts$#! ont priorité sur ceux des #V DLC#!."

 
 ###################
 #SPECIAL BUILDINGS#

 #Rock of Cashel
 MA_rock_cashel_district: "$building_type_MA_rock_cashel$"
 MA_rock_cashel_district_desc: "$building_type_MA_rock_cashel_desc$"
 building_type_MA_rock_cashel: "Rocher de Cashel"
 building_type_MA_rock_cashel_desc: "Érigé sur une colline rocheuse entourée de verts pâturages, le Rocher est une forteresse de pierre imprenable, ceinte de nombreuses murailles et pouvant servir tant de château que de palais. Il abrite également l'un des monastères les plus influents d'Irlande ainsi qu'une chapelle palatine dont la voûte est ornée de magnifiques fresques retraçant la vie de saint Patrick."
 MA_rock_cashel: "$building_type_MA_rock_cashel$"
 
 #St Donatus of Zadar
 MA_st_donatus_district: "$building_type_MA_st_donatus$"
 MA_st_donatus_district_desc: "$building_type_MA_st_donatus_desc$"
 building_type_MA_st_donatus: "Église Saint-Donat de Zadar"
 building_type_MA_st_donatus_desc: "Une magnifique église circulaire en pierre blanche, étincelante sous le soleil qui illumine les flots de l'Adriatique. Inspirée de la chapelle palatine du palais de Charlemagne, elle est ornée d'une splendide mosaïque dorée."
 MA_st_donatus: "$building_type_MA_st_donatus$"
 
 #Aula Palatina
 MA_aula_palatina_district: "$building_type_MA_aula_palatina$"
 MA_aula_palatina_district_desc: "$building_type_MA_aula_palatina_desc$"
 building_type_MA_aula_palatina: "Aula Palatina"
 building_type_MA_aula_palatina_desc: "Une salle colossale en brique, édifiée par Constantin le Grand pour son propre #italic palatium#!. \nSes dimensions gigantesques, qui n'ont guère d'égales sur le continent, témoignent d'une maîtrise de l'ingénierie qui demeure une source d'inspiration."
 MA_aula_palatina: "$building_type_MA_aula_palatina$"
 
 #Jokhang Temple
 MA_jokhang_district: "$building_type_MA_jokhang$"
 MA_jokhang_district_desc: "$building_type_MA_jokhang_desc$"
 building_type_MA_jokhang: "Temple de Jokhang"
 building_type_MA_jokhang_desc: "Le plus ancien et le plus mystique de tous les temples du Tibet, un majestueux ensemble de cours et de sanctuaires au cœur même du Pays des Dieux."
 MA_jokhang: "$building_type_MA_jokhang$"
 
 #Dongola Throne Hall
 MA_dongola_hall_district: "$building_type_MA_dongola_hall$"
 MA_dongola_hall_district_desc: "$building_type_MA_dongola_hall_desc$"
 building_type_MA_dongola_hall: "Salle du trône de Dongola"
 building_type_MA_dongola_hall_desc: "Un vaste palais construit au sommet d'une colline rocheuse, d'où l'on contemple toute la plaine environnante et le Nil. \nSa fonction est cérémonielle : impressionner les émissaires et les voyageurs qui, après avoir gravi un escalier monumental orné de splendides fresques peintes par des artistes nubiens et grecs, sont conduits à la majestueuse salle du trône de l'étage supérieur."
 MA_dongola_hall: "$building_type_MA_dongola_hall$"
 
 #Cathedral of Hildesheim
 MA_hildesheim_cathedral_district: "$building_type_MA_hildesheim_cathedral$"
 MA_hildesheim_cathedral_district_desc: "$building_type_MA_hildesheim_cathedral_desc$"
 building_type_MA_hildesheim_cathedral: "Église Saint-Michel de Hildesheim"
 building_type_MA_hildesheim_cathedral_desc: "Cette basilique fut édifiée pour manifester la puissance et le prestige de son roi des Romains. Son plafond de bois peint et ses arcs en plein cintre lui confèrent une allure grandiose et impériale. Des ouvriers et des maîtres venus du Rhin et d'Italie participèrent à sa construction. Elle renferme des portes et une colonne monumentale, toutes en bronze et soigneusement ornées de reliefs."
 MA_hildesheim_cathedral: "$building_type_MA_hildesheim_cathedral$"
 
 #Toulouse Cathedral
 MA_toulouse_basilica_district: "$building_type_MA_toulouse_basilica$"
 MA_toulouse_basilica_district_desc: "$building_type_MA_toulouse_basilica_desc$"
 building_type_MA_toulouse_basilica: "Basilique de Toulouse"
 building_type_MA_toulouse_basilica_desc: "Une basilique grandiose, l'une des plus grandes cathédrales au nord des Alpes. Construite en brique, matériau abondant dans la région, elle constitue un véritable édifice roman, inspiré des ruines de la Rome antique dans le sud de la France et orné de bandes lombardes, d'arcs en plein cintre et de colonnes de remploi."
 MA_toulouse_basilica: "$building_type_MA_toulouse_basilica$"
 
 #The Durham Cathedral
 MA_durham_cathedral_district: "$building_type_MA_durham_cathedral$"
 MA_durham_cathedral_district_desc: "$building_type_MA_durham_cathedral_desc$"
 building_type_MA_durham_cathedral: "Cathédrale de Durham"
 building_type_MA_durham_cathedral_desc: "La grande cathédrale de Durham domine la péninsule marécageuse de la Wear, où, selon la légende, deux laitières découvrirent le tombeau inamovible de saint Cuthbert. Sa voûte d'ogives, conçue par des artisans venus des deux rives de la Manche, est une prouesse d'ingénierie sans précédent en Angleterre. Elle fut bâtie au-dessus des bois et des berges de la ville, avec de la pierre extraite des falaises en contrebas."
 MA_durham_cathedral: "$building_type_MA_durham_cathedral$"
 
 #The Castel del Monte
 MA_castel_monte_district: "$building_type_MA_castel_monte$"
 MA_castel_monte_district_desc: "$building_type_MA_castel_monte_desc$"
 building_type_MA_castel_monte: "Castel del Monte"
 building_type_MA_castel_monte_desc: "Un élégant pavillon de chasse au sommet d'une douce colline des Pouilles. \nSon architecture singulière associe un plan octogonal à des tours octogonales à chaque angle, mêlant les styles classique et gothique. \nSon extérieur austère et géométrique contraste vivement avec un intérieur somptueusement garni de tapisseries, de tapis, de peintures et de chapiteaux."
 MA_castel_monte: "$building_type_MA_castel_monte$"
 
 #The Belfry of Bruges
 MA_belfort_district: "$building_type_MA_belfort$"
 MA_belfort_district_desc: "$building_type_MA_belfort_desc$"
 building_type_MA_belfort: "Beffroi de Bruges"
 building_type_MA_belfort_desc: "Le splendide beffroi gothique s'élève au-dessus de la place du marché de Bruges et rythme la vie de toute la cité. Cette immense tour hérissée de flèches et de statues, construite en brique et en pierre, possède une base rectangulaire surmontée d'un étage octogonal abritant les cloches."
 MA_belfort: "$building_type_MA_belfort$"
 
 #The Strasbourg Cathedral
 MA_strasbourg_cathedral1_district: "$building_type_MA_strasbourg_cathedral1$"
 MA_strasbourg_cathedral1_district_desc: "$building_type_MA_strasbourg_cathedral1_desc$"
 building_type_MA_strasbourg_cathedral1: "Cathédrale de Strasbourg"
 building_type_MA_strasbourg_cathedral1_desc: "Inspirée des grandes églises des Francies occidentale et orientale, la cathédrale de Strasbourg doit sa grandeur à la richesse des bourgeois et au mécénat de leur seigneur. Édifiés en grès rose, ses murs resplendissent sous le soleil couchant, dominant une place étroite et ses maisons à colombages, tandis que les cloches de bronze chantent leur mélodie au vent."
 MA_strasbourg_cathedral1: "Cathédrale de Strasbourg"
 MA_strasbourg_cathedral2: "$MA_strasbourg_cathedral1$"
 
 #Koutoubia Mosque
 MA_koutoubia_district: "$building_type_MA_koutoubia$"
 MA_koutoubia_district_desc: "$building_type_MA_koutoubia_desc$"
 building_type_MA_koutoubia: "Mosquée Koutoubia"
 building_type_MA_koutoubia_desc: "Chef-d'œuvre exemplaire de l'architecture mauresque, le minaret de cette mosquée inspire les bâtisseurs de tout le monde islamique."
 MA_koutoubia: "$building_type_MA_koutoubia$"
 
 #Parigoritissa
 MA_parigoritissa_district: "$building_type_MA_parigoritissa$"
 MA_parigoritissa_district_desc: "$building_type_MA_parigoritissa_desc$"
 building_type_MA_parigoritissa: "Panagia Parigoritissa"
 building_type_MA_parigoritissa_desc: "Le plan de cette église dédiée à la Très Sainte Marie s'inspire des idéaux classiques de symétrie et de perfection géométrique. Elle forme un carré presque parfait, centré sur une coupole octogonale soutenue par des piliers et flanquée d'une petite chapelle à chacun de ses quatre angles."
 MA_parigoritissa: "$building_type_MA_parigoritissa$"
 
 #Rotunda
 MA_rotunda_district: "$building_type_MA_rotunda$"
 MA_rotunda_district_desc: "$building_type_MA_rotunda_desc$"
 building_type_MA_rotunda: "Rotonde de Thessalonique"
 building_type_MA_rotunda_desc: "Un édifice colossal coiffé d'une coupole, inspiré du Panthéon de Rome. \nSon intérieur est orné de mosaïques d'une beauté et d'une maîtrise artistique incomparables, dont les #italic tesselles#! dorées scintillent sous la lumière pénétrant par l'oculus. \nUne colonnade relie le bâtiment à un immense arc de marbre élevé par feu le César Galère."
 MA_rotunda: "$building_type_MA_rotunda$"
 
 #The Nikaea Walls
 MA_nikaea_walls_district: "$building_type_MA_nikaea_walls$"
 MA_nikaea_walls_district_desc: "$building_type_MA_nikaea_walls_desc$"
 building_type_MA_nikaea_walls: "Remparts de Nicée"
 building_type_MA_nikaea_walls_desc: "Élevées par les Césars il y a des siècles, ces doubles murailles imprenables protègent la route de Constantinople."
 MA_nikaea_walls: "$building_type_MA_nikaea_walls$"
 
 #The Ephesus Basilica
 MA_ephesus_basilica_district: "$building_type_MA_ephesus_basilica$"
 MA_ephesus_basilica_district_desc: "$building_type_MA_ephesus_basilica_desc$"
 building_type_MA_ephesus_basilica: "Basilique d'Éphèse"
 building_type_MA_ephesus_basilica_desc: "Une basilique monumentale édifiée sur le tombeau de #italic Jean l'Apôtre#! à l'époque de Justinien. \nSes murs de brique et de pierre de taille sont soutenus par d'élégantes colonnes de marbre du Proconnèse et richement décorés de mosaïques dorées."
 MA_ephesus_basilica: "$building_type_MA_ephesus_basilica$"
 
 #Arles Amphiteatre
 MA_arles_amphiteatre_district: "$building_type_MA_arles_amphiteatre$"
 MA_arles_amphiteatre_district_desc: "$building_type_MA_arles_amphiteatre_desc$"
 building_type_MA_arles_amphiteatre: "Amphithéâtre d'Arles"
 building_type_MA_arles_amphiteatre_desc: "Construite il y a des siècles, cette immense arène demeure le centre de la vie d'Arles. \nDans ses murs de pierre, les habitants ont aménagé des tours, des chapelles et leurs demeures, occupant la piste sablonneuse où les gladiateurs s'entretuaient jadis pour le divertissement de la foule."
 MA_arles_amphiteatre: "$building_type_MA_arles_amphiteatre$"
 
 #Axum Stelae Field
 MA_axum_stelae_district: "$building_type_MA_axum_stelae$"
 MA_axum_stelae_district_desc: "$building_type_MA_axum_stelae_desc$"
 building_type_MA_axum_stelae: "Champ de stèles"
 building_type_MA_axum_stelae_desc: "Trois stèles colossales sont tout ce qui reste de la jadis puissante Aksoum, et pourtant leur ombre plane encore sur la culture royale de ces terres. \nTaillées dans la pierre de taille, elles portent toujours des reliefs que certains interprètent comme les #italic Portes du Ciel#!."
 MA_axum_stelae: "$building_type_MA_axum_stelae$"
 
 #Karnak Temple
 MA_karnak_district: "$building_type_MA_karnak$"
 MA_karnak_district_desc: "$building_type_MA_karnak_desc$"
 building_type_MA_karnak: "Karnak"
 building_type_MA_karnak_desc: "Le plus magnifique des temples des anciens pharaons, Karnak demeure, après des millénaires, un témoignage de la puissance et de la richesse des rois du Nil."
 MA_karnak: "$building_type_MA_karnak$"
 
 #Pharos of Alexandria
 MA_pharos_alexandria_district: "$building_type_MA_pharos_alexandria$"
 MA_pharos_alexandria_district_desc: "$building_type_MA_pharos_alexandria_desc$"
 building_type_MA_pharos_alexandria: "Pharos"
 building_type_MA_pharos_alexandria_desc: "S'élevant bien au-dessus de l'isthme, ce phare est connu dans le monde entier comme l'une des #italic Sept Grandes Merveilles#! d'Antipater. \nDes siècles se sont écoulés depuis la pose de sa première pierre, et une nouvelle coupole commandée par les califes couronne désormais l'édifice. Pourtant, sa hauteur sans égale, sa solide maçonnerie et son feu éclatant continuent de graver la légende du Pharos dans le cœur de tous ceux qui le contemplent."
 MA_pharos_alexandria: "$building_type_MA_pharos_alexandria$"
 
 #Trajan Arch
 MA_trajan_arch1_district: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch1_district_desc: "$building_type_MA_trajan_arch1_desc$"
 building_type_MA_trajan_arch1: "Arc de Trajan"
 building_type_MA_trajan_arch1_desc: "Le grand empereur Trajan, qui partit de cette ville pour mener ses campagnes en #italic Dacie#!, ordonna l'édification d'un arc des plus magnifiques pour commémorer son triomphe. Aujourd'hui encore, il accueille les navires entrant dans le port d'Ancône et évoque des souvenirs de fierté et de puissance."
 MA_trajan_arch1: "$building_type_MA_trajan_arch1$"
 MA_trajan_arch2: "Arc d'Ancône"
 
 #Palatium of Diocletian
 MA_diocletian_palace_district: "$building_type_MA_diocletian_palace$"
 MA_diocletian_palace_district_desc: "$building_type_MA_diocletian_palace_desc$"
 building_type_MA_diocletian_palace: "Palais de Dioclétien"
 building_type_MA_diocletian_palace_desc: "Construit sous le règne du tétrarque, ce palais fut conçu comme une cité miniature monumentale et idéale, avec ses rues bordées de colonnes, ses arcs, ses remparts et ses salles. \nAprès la chute de l'Empire, les habitants s'en sont emparés et l'ont transformé en cœur urbain de la cité."
 MA_diocletian_palace: "$building_type_MA_diocletian_palace$"
 
 #Romuliana
 MA_romuliana_district: "$building_type_MA_romuliana$"
 MA_romuliana_district_desc: "$building_type_MA_romuliana_desc$"
 building_type_MA_romuliana: "Romuliana"
 building_type_MA_romuliana_desc: "#italic Felix Romuliana#! fut fondée par les grands Césars comme une cité modèle et protégée au fil des ans par de colossales murailles. \nCelles-ci ne purent cependant résister aux invasions des siècles suivants. De sa gloire passée ne subsistent que les carcasses vides des tours de guet et l'immense amas de végétation qui les a englouties, rappelant aux hommes leur petitesse."
 MA_romuliana: "$building_type_MA_romuliana$"
 
 #Hexamilion
 MA_hexamilion_district: "$building_type_MA_hexamilion$"
 MA_hexamilion_district_desc: "$building_type_MA_hexamilion_desc$"
 building_type_MA_hexamilion: "Hexamilion"
 building_type_MA_hexamilion_desc: "Construits par l'empereur Théodose pour protéger le Péloponnèse, ces remparts gardent depuis des siècles l'étroit passage de l'isthme. Ils s'étendent du golfe de Corinthe au golfe Saronique et canalisent le commerce, les voyageurs et les incursions ennemies vers des points de passage au nord et au sud."
 MA_hexamilion: "$building_type_MA_hexamilion$"
 
 #Temple of Jupiter
 MA_baalbek_district: "$building_type_MA_baalbek$"
 MA_baalbek_district_desc: "$building_type_MA_baalbek_desc$"
 building_type_MA_baalbek: "Temple de Jupiter"
 building_type_MA_baalbek_desc: "Le grand temple de Baalbek était autrefois l'un des plus vastes du monde, dominant la vallée fertile. \nDepuis, de nombreux raids et sièges ont endommagé ce temple gigantesque ; ses colonnes ont été brisées ou emportées vers des cités lointaines, mais ses ruines enchantent toujours les voyageurs venus des quatre coins du monde."
 MA_baalbek: "$building_type_MA_baalbek$"
 
 #Leptis Magna
 MA_leptis_magna_district: "$building_type_MA_leptis_magna$"
 MA_leptis_magna_district_desc: "$building_type_MA_leptis_magna_desc$"
 building_type_MA_leptis_magna: "Leptis Magna"
 building_type_MA_leptis_magna_desc: "Joyau de la Tripolitaine, Leptis Magna fut fondée par les empereurs de l'Antiquité. \nLorsque le soleil impitoyable atteint son zénith à midi, les ombres qu'il projette sur les ruines des temples, des marchés et des théâtres s'effacent, et nul ne peut s'empêcher de se sentir perdu dans cette terre hors du temps."
 MA_leptis_magna: "$building_type_MA_leptis_magna$"
 
 #Tomb of Numidia
 MA_mauretanian_mausoleum_district: "$building_type_MA_mauretanian_mausoleum$"
 MA_mauretanian_mausoleum_district_desc: "$building_type_MA_mauretanian_mausoleum_desc$"
 building_type_MA_mauretanian_mausoleum: "Tombeau de Numidie"
 building_type_MA_mauretanian_mausoleum_desc: "Un mausolée antique et colossal érigé par les rois berbères de Numidie avant leur conquête par les Romains. \nEntièrement bâti en pierre et perché sur une colline face à la mer, il est visible de très loin, étincelant sous la lumière du soleil à l'horizon."
 MA_mauretanian_mausoleum: "$building_type_MA_mauretanian_mausoleum$"
 
 #Meroë Pyramids
 MA_meroe_pyramids_district: "$building_type_MA_meroe_pyramids$"
 MA_meroe_pyramids_district_desc: "$building_type_MA_meroe_pyramids_desc$"
 building_type_MA_meroe_pyramids: "Pyramides de Méroé"
 building_type_MA_meroe_pyramids_desc: "Nichées au milieu des sables dorés de Nubie, les énigmatiques pyramides se dressent telles des sentinelles oubliées. Leurs secrets, murmurés par les vents du désert, invitent les esprits curieux à percer les mystères d'une civilisation disparue à travers leurs structures d'une beauté envoûtante, parées d'ornements raffinés."
 MA_meroe_pyramids: "$building_type_MA_meroe_pyramids$"
 
 #Basilica of Saint Martin
 MA_saint_martin_district: "$building_type_MA_saint_martin$"
 MA_saint_martin_district_desc: "$building_type_MA_saint_martin_desc$"
 building_type_MA_saint_martin: "Basilique Saint-Martin"
 building_type_MA_saint_martin_desc: "Dernière demeure du corps de saint Martin, cette grande basilique fut érigée pour la première fois alors que les Mérovingiens régnaient encore sur ces terres. \nLongue de cent soixante pieds et large de soixante, décorée de colonnes antiques et de marbres colorés, elle attire des pèlerins de toutes contrées sur la route de Saint-Jacques-de-Compostelle."
 MA_saint_martin: "$building_type_MA_saint_martin$"
 
 #Pillars of Titus
 MA_piliers_district: "$building_type_MA_piliers$"
 MA_piliers_district_desc: "$building_type_MA_piliers_desc$"
 building_type_MA_piliers: "Piliers de Gascogne"
 building_type_MA_piliers_desc: "Dressés sur le point le plus élevé de la ville, dominant le fleuve et baignés de soleil, ces piliers sont aussi élégants que mystérieux. Certains prétendent qu'ils faisaient autrefois partie d'un grand palais appartenant au César Titus, mais d'autres affirment qu'ils jaillissaient déjà de la roche bien avant l'arrivée des Romains."
 MA_piliers: "$building_type_MA_piliers$"
 
 #Txindoki
 MA_txindoki_district: "$building_type_MA_txindoki$"
 MA_txindoki_district_desc: "$building_type_MA_txindoki_desc$"
 building_type_MA_txindoki: "Txindoki"
 building_type_MA_txindoki_desc: "Il est difficile aux pèlerins qui traversent ces terres de ne pas remarquer son saisissant sommet enneigé. Surgissant brusquement et majestueusement, le Txindoki incarne la grandeur et la beauté mystérieuse de ces contrées depuis bien avant que l'homme y pose les yeux."
 MA_txindoki: "$building_type_MA_txindoki$"
 
 #Hospice of Santa Juliana
 MA_santillana_district: "$building_type_MA_santillana$"
 MA_santillana_district_desc: "$building_type_MA_santillana_desc$"
 building_type_MA_santillana: "Hospice de Santa Juliana"
 building_type_MA_santillana_desc: "Les vastes voûtes, les piliers de pierre, les reliques et les logements de cette collégiale en font une étape incontournable pour les nombreux pèlerins sur la route de Saint-Jacques-de-Compostelle. \nFinancé par le seigneur local et par un flot constant d'offrandes, l'hospice est devenu riche et somptueux, orné de magnifiques statues et de reliefs sculptés."
 MA_santillana: "$building_type_MA_santillana$"
 
 #Palace of Naranco
 MA_palace_naranco_district: "$building_type_MA_palace_naranco$"
 MA_palace_naranco_district_desc: "$building_type_MA_palace_naranco_desc$"
 building_type_MA_palace_naranco: "Palais de Naranco"
 building_type_MA_palace_naranco_desc: "Ce beau palais servit pendant des générations de résidence aux saints rois des Asturies, dominant Oviedo depuis le sommet du mont Naranco. Ses arcs et ses voûtes élégants, tels qu'on n'en avait plus vus dans la péninsule depuis la domination romaine, témoignent de l'ambition et de la puissance de ses souverains."
 MA_palace_naranco: "$building_type_MA_palace_naranco$"
 
 #Burgos Cathedral
 MA_burgos_cathedral_district: "$building_type_MA_burgos_cathedral$"
 MA_burgos_cathedral_district_desc: "$building_type_MA_burgos_cathedral_desc$"
 building_type_MA_burgos_cathedral: "Cathédrale de Burgos"
 building_type_MA_burgos_cathedral_desc: "Édifiée par des artisans venus des deux versants des Pyrénées, cette magnifique cathédrale constitue l'un des plus remarquables exemples de ce nouveau style moderne d'architecture religieuse. \nSes tours s'élancent vers le ciel, tandis que ses chapelles et ses couloirs immenses conduisent les pèlerins d'une relique à l'autre, parmi les offrandes et l'or, sous les regards sévères des innombrables saints sculptés."
 MA_burgos_cathedral: "$building_type_MA_burgos_cathedral$"
 
 #Qasr al-Farid
 MA_hegra_district: "$building_type_MA_hegra$"
 MA_hegra_district_desc: "$building_type_MA_hegra_desc$"
 building_type_MA_hegra: "Qasr al-Farid"
 building_type_MA_hegra_desc: "Un tombeau monumental profondément creusé dans un rocher monolithique, vestige d'une cité païenne autrefois riche et puissante. \nIl s'élève seul au milieu du désert, solitaire face aux vents, ce qui a conduit les habitants à le surnommer le #italic Château solitaire#!."
 MA_hegra: "$building_type_MA_hegra$"
 
 #Wadi Rum
 MA_wadirum_district: "$building_type_MA_wadirum$"
 MA_wadirum_district_desc: "$building_type_MA_wadirum_desc$"
 building_type_MA_wadirum: "Wadi Rum"
 building_type_MA_wadirum_desc: "Cette grande vallée ancestrale nourrit depuis longtemps mythes et légendes, et demeure aujourd'hui encore enveloppée de mysticisme. \nUne gigantesque paroi de roche rouge y défie les vents du désert, haute, massive et solide, hors de portée de toute armée, offrant un refuge sûr dans les pires épreuves."
 MA_wadirum: "$building_type_MA_wadirum$"
 
 #Walls of Sana'a
 MA_walls_sanaa_district: "$building_type_MA_walls_sanaa$"
 MA_walls_sanaa_district_desc: "$building_type_MA_walls_sanaa_desc$"
 building_type_MA_walls_sanaa: "Remparts de Sanaa"
 building_type_MA_walls_sanaa_desc: "Une enceinte de puissants remparts entoure le cœur de Sanaa, surgissant, impénétrable, du labyrinthe complexe des monts Sarawat. Leur grandeur usée par le temps murmure les récits de combats terribles et des hauts faits des hommes et des dieux."
 MA_walls_sanaa: "$building_type_MA_walls_sanaa$"
 
 #Dam of Sheba
 MA_dam_sheba_district: "$building_type_MA_dam_sheba$"
 MA_dam_sheba_district_desc: "$building_type_MA_dam_sheba_desc$"
 building_type_MA_dam_sheba: "Barrage de Saba"
 building_type_MA_dam_sheba_desc: "Solitaire sur les terres arides de Ma'rib, où le soleil brûlant châtie quiconque ose l'affronter, cette magnifique ruine murmure les récits du grand royaume de la reine de Saba, qui transforma les sables en champs fertiles et apporta la richesse et la vie là où régnaient la pénurie et la mort."
 MA_dam_sheba: "$building_type_MA_dam_sheba$"
 
 #Bahla Fort
 MA_bahla_fort_district: "$building_type_MA_bahla_fort$"
 MA_bahla_fort_district_desc: "$building_type_MA_bahla_fort_desc$"
 building_type_MA_bahla_fort: "Fort de Bahla"
 building_type_MA_bahla_fort_desc: "Cet immense château de briques crues fut construit pour protéger la précieuse oasis de Bahla, depuis les hauteurs des premiers contreforts montagneux. \nSes murailles complexes mettent à l'abri des ennemis et de la chaleur écrasante tout un réseau d'irrigation et une magnifique plantation de palmiers dattiers, assurant un grand prestige à son protecteur."
 MA_bahla_fort: "$building_type_MA_bahla_fort$"
 
 #Jebe Hafeet
 MA_jebel_hafeet_district: "$building_type_MA_jebel_hafeet$"
 MA_jebel_hafeet_district_desc: "$building_type_MA_jebel_hafeet_desc$"
 building_type_MA_jebel_hafeet: "Djebel Hafeet"
 building_type_MA_jebel_hafeet_desc: "Une montagne solitaire, longue et élancée, la dernière avant les dunes de sable et la première avant la chaîne du Hajar. \nSes pentes rocheuses escarpées sont habitées depuis longtemps par les peuples de la région, et l'on trouve à son pied des tombeaux en forme de ruche."
 MA_jebel_hafeet: "$building_type_MA_jebel_hafeet$"
 
 #Al-Turaif Palace
 MA_alturaif_district: "$building_type_MA_alturaif$"
 MA_alturaif_district_desc: "$building_type_MA_alturaif_desc$"
 building_type_MA_alturaif: "Palais d'Al-Turaif"
 building_type_MA_alturaif_desc: "Édifié au fil des générations dans l'un des lieux les plus inhospitaliers de la Création, ce palais est un symbole de détermination et de piété. \nÀ l'intérieur d'une longue enceinte de remparts, de hauts palais en briques crues et un jardin irrigué offrent un refuge contre les chaleurs les plus accablantes et servent d'important dépôt de ravitaillement à leur détenteur."
 MA_alturaif: "$building_type_MA_alturaif$"
 
 #School of Preslav
 MA_school_preslav_district: "$building_type_MA_school_preslav$"
 MA_school_preslav_district_desc: "$building_type_MA_school_preslav_desc$"
 building_type_MA_school_preslav: "École de Preslav"
 building_type_MA_school_preslav_desc: "Soutenus par un flux régulier de donations, les scriptoria monastiques et les salles palatiales de Preslav travaillent sans relâche à traduire des manuscrits et à produire de nouveaux savoirs. L'odeur de l'encre et du parchemin imprègne l'air, tandis que des fresques de saints et de mécènes ornent les murs. L'influence de l'école dépasse largement ses salles de pierre, et elle est devenue un phare de la liturgie et de la pensée romaines dans la région."
 MA_school_preslav: "$building_type_MA_school_preslav$"
 
 #Madara Rider
 MA_madara_rider_district: "$building_type_MA_madara_rider$"
 MA_madara_rider_district_desc: "$building_type_MA_madara_rider_desc$"
 building_type_MA_madara_rider: "Cavalier de Madara"
 building_type_MA_madara_rider_desc: "Profondément sculpté dans l'étreinte froide et éternelle d'une falaise verticale, cet ancien bas-relief représente un cavalier triomphant d'un lion. Lance à la main, le cavalier semble jaillir de la pierre elle-même, à jamais victorieux. Plus bas, des inscriptions racontent des exploits glorieux accomplis dans l'immensité des steppes herbeuses, avant que les habitants de ces terres ne s'établissent à l'ouest."
 MA_madara_rider: "$building_type_MA_madara_rider$"
 
 #Tomb of the Thracian King
 MA_thracian_tomb_district: "$building_type_MA_thracian_tomb$"
 MA_thracian_tomb_district_desc: "$building_type_MA_thracian_tomb_desc$"
 building_type_MA_thracian_tomb: "Tombeau du roi thrace"
 building_type_MA_thracian_tomb_desc: "Dissimulé au temps et aux regards, au milieu d'une paisible prairie dorée, un tombeau antique repose sous un immense [Glossary('tumulus','MA_tumulus_glossary')] de terre. Son entrée est signalée par une porte monolithique et encerclée d'une forêt de pierres. Les légendes murmurent qu'un grand roi des temps anciens y fut enseveli ; son nom est oublié depuis longtemps, mais son esprit chevaucherait encore dans les cieux. \nUn cyprès solitaire monte la garde devant l'entrée, projetant sur le tombeau une longue ombre silencieuse."
 MA_thracian_tomb: "$building_type_MA_thracian_tomb$"
 MA_tumulus_glossary: "Un monticule de terre et de pierres formant un dôme colossal au-dessus d'une sépulture. Utilisés par de nombreux peuples, notamment les sociétés antiques, les #bold tumulus#! sont des témoignages austères et monumentaux du passage du Temps."
 
 #Boyana Church
 MA_boyana_church_district: "$building_type_MA_boyana_church$"
 MA_boyana_church_district_desc: "$building_type_MA_boyana_church_desc$"
 building_type_MA_boyana_church: "Église de Boyana"
 building_type_MA_boyana_church_desc: "Cette humble église peut sembler insignifiante au premier regard, isolée dans un village rural perdu entre des champs dorés, sa simple maçonnerie de brique se fondant dans le paysage. \nPourtant, derrière son extérieur modeste se cache un trésor incomparable, soustrait aux regards du monde : le cœur du sanctuaire est orné de fresques d'une beauté à couper le souffle, chaque coup de pinceau témoignant d'une inspiration divine. Les teintes bleues, rouges et dorées se mêlent, et les saints semblent danser au vacillement des flammes des cierges, dans un spectacle empreint du plus profond mysticisme."
 MA_boyana_church: "$building_type_MA_boyana_church$"
 
 #Belogradchik Fortress
 MA_belogradchik_fort_district: "$building_type_MA_belogradchik_fort$"
 MA_belogradchik_fort_district_desc: "$building_type_MA_belogradchik_fort_desc$"
 building_type_MA_belogradchik_fort: "Forteresse de Belogradchik"
 building_type_MA_belogradchik_fort_desc: "Nichée parmi d'immenses formations rocheuses, cette forteresse semble jaillir de la terre elle-même, ses murailles se prolongeant naturellement dans la pierre rouge et froide de la montagne. D'élégantes cheminées rocheuses s'élèvent de trois côtés et enveloppent la forteresse, la rendant presque imprenable. \nLes habitants racontent une légende aussi vieille que le monde : un géant de la forêt voisine aurait empilé ces pierres de ses propres mains, tandis qu'un monastère aurait été englouti par les rochers en châtiment divin."
 MA_belogradchik_fort: "$building_type_MA_belogradchik_fort$"
 
 #Studenica Monastery
 MA_studenica_district: "$building_type_MA_studenica$"
 MA_studenica_district_desc: "$building_type_MA_studenica_desc$"
 building_type_MA_studenica: "Monastère de Studenica"
 building_type_MA_studenica_desc: "Le plus magnifique des monuments de Serbie, phare de foi et de quiétude pour les habitants, ce monastère est blotti dans une vallée isolée. \nSes murs portent les marques des traditions de l'Occident latin et de l'Orient grec. Les dalles de marbre blanc, sculptées de main de maître, et l'imposante coupole dressée sur un tambour rouge éclatant témoignent du savoir-faire et de la piété des mécènes du monastère."
 MA_studenica: "$building_type_MA_studenica$"
 
 #Church of the Nativity
 MA_church_nativity_district: "$building_type_MA_church_nativity$"
 MA_church_nativity_district_desc: "$building_type_MA_church_nativity_desc$"
 building_type_MA_church_nativity: "Église de la Nativité"
 building_type_MA_church_nativity_desc: "Commandé d'abord par la sainte mère de Constantin, puis reconstruit sur ordre de Justinien, ce sanctuaire célèbre l'un des lieux les plus saints de la chrétienté, celui de la naissance du Christ. \nL'église est une longue basilique à cinq nefs, dotée d'une entrée triomphale et décorée de mosaïques dorées et de colonnes romaines antiques en marbres colorés. Elle conserve plusieurs reliques sacrées et œuvres d'art qui, selon la légende, l'auraient déjà sauvée de multiples invasions."
 MA_church_nativity: "$building_type_MA_church_nativity$"
 
 #Great Lejre Hall
 MA_lejre_hall_district: "$building_type_MA_lejre_hall$"
 MA_lejre_hall_district_desc: "$building_type_MA_lejre_hall_desc$"
 building_type_MA_lejre_hall: "Grande halle de Hleiðr"
 building_type_MA_lejre_hall_desc: "Une grandiose halle à hydromel construite par les rois d'autrefois à l'aide de grands arbres et de magnifiques sculptures. \nLes récits des grands héros et des rois qui festoyaient et combattaient dans cette halle ne manqueront pas d'inspirer les sagas."
 MA_lejre_hall: "$building_type_MA_lejre_hall$"
 
 #Aetna
 MA_aetna_district: "$building_type_MA_aetna$"
 MA_aetna_district_desc: "$building_type_MA_aetna_desc$"
 building_type_MA_aetna: "Etna"
 building_type_MA_aetna_desc: "Le plus grand des volcans ardents du monde antique, le mont Etna domine triomphalement la fertile île de Sicile, ses cendres enrichissant considérablement les sols alentour. \nDepuis des millénaires, son souffle nourrit mythes et légendes, racontant comment le dieu Héphaïstos forgeait ses créations divines au cœur de la montagne infernale."
 MA_aetna: "$building_type_MA_aetna$"
 
 #Brescia Duomo
 MA_duomo_brescia_district: "$building_type_MA_duomo_brescia$"
 MA_duomo_brescia_district_desc: "$building_type_MA_duomo_brescia_desc$"
 building_type_MA_duomo_brescia: "Duomo de Brescia"
 building_type_MA_duomo_brescia_desc: "Une rotonde de pierre au cœur de la #italic Cittanuova#!, le nouveau centre du pouvoir de Brescia à l'ouest du noyau romain antique. Ses murs épais et son architecture romane dépouillée furent inspirés par les récits de Jérusalem, tandis qu'à l'intérieur, dans la pénombre, fresques et reliques racontent des siècles de dévotion et de puissance."
 MA_duomo_brescia: "$building_type_MA_duomo_brescia$"
 
 #Maschio
 MA_maschio_district: "$building_type_MA_maschio$"
 MA_maschio_district_desc: "$building_type_MA_maschio_desc$"
 building_type_MA_maschio: "Maschio"
 building_type_MA_maschio_desc: "Un immense château de pierre et de tuf volcanique dominant la baie scintillante de Naples, dont les créneaux et les imposantes tours rondes règnent d'une main de fer sur la terre et la mer. \nUn vaste réseau de cellules et de cachots s'enfonce profondément dans la roche, certains datant des anciens Grecs. $MA_warning_palermo_napoli$"
 MA_maschio: "$building_type_MA_maschio$"
 MA_warning_palermo_napoli: "\n\n@alert_icon! #alert_trial Construire à la fois le [GetBuildingType('MA_palace_palermo2').GetName] à Palerme et le [GetBuildingType('MA_maschio').GetName] à Naples vous empêchera de prendre la [GetDecisionWithKey('empower_sicilian_parliament_decision').GetName] [decision|E] !#!"
 
 #Basilica of Saint Nicholas
 MA_st_nicholas_district: "$building_type_MA_st_nicholas$"
 MA_st_nicholas_district_desc: "$building_type_MA_st_nicholas_desc$"
 building_type_MA_st_nicholas: "Basilique Saint-Nicolas"
 building_type_MA_st_nicholas_desc: "Une massive basilique romane bâtie en pierre locale solide, d'un blanc étincelant qui tranche sur le bleu vineux de la mer. Dans ses murs, les reliques de saint Nicolas attirent les pèlerins et de grandes richesses de toute la chrétienté, les invitant à traverser vers la Terre sainte."
 MA_st_nicholas: "$building_type_MA_st_nicholas$"
 
 #Palace of Arechis
 MA_palace_arechis_district: "$building_type_MA_palace_arechis$"
 MA_palace_arechis_district_desc: "$building_type_MA_palace_arechis_desc$"
 building_type_MA_palace_arechis: "Palais d'Arigis"
 building_type_MA_palace_arechis_desc: "Un vaste ensemble palatial aménagé au sein de l'antique cité romaine de Bénévent, protégé par une enceinte de remparts et une tour quadrangulaire. Bâti par le premier prince des Lombards, il est devenu le symbole de la résistance et de l'indépendance farouche de ce peuple."
 MA_palace_arechis: "$building_type_MA_palace_arechis$"
 
 #Basilica of Saccargia
 MA_saccargia_basilica_district: "$building_type_MA_saccargia_basilica$"
 MA_saccargia_basilica_district_desc: "$building_type_MA_saccargia_basilica_desc$"
 building_type_MA_saccargia_basilica: "Basilique de Saccargia"
 building_type_MA_saccargia_basilica_desc: "Une remarquable basilique de pierre noire et blanche s'élevant sur une côte aride et battue par les vents de Sardaigne, sa tour rayée visible à des milles depuis la mer. Des artisans d'Italie furent appelés pour participer à sa construction, et leur influence stylistique y est profonde."
 MA_saccargia_basilica: "$building_type_MA_saccargia_basilica$"
 
 #Ruins of Paestum
 MA_paestum_district: "$building_type_MA_paestum$"
 MA_paestum_district_desc: "$building_type_MA_paestum_desc$"
 building_type_MA_paestum: "Ruines de Paestum"
 building_type_MA_paestum_desc: "Les vestiges de l'ancienne grande cité gisent dans les herbes folles et le silence, les colonnes colossales de ses temples brisées et effondrées. La ville fut progressivement abandonnée lorsque le fleuve voisin transforma la région en marécage, et rares sont aujourd'hui ceux qui osent s'aventurer dans ces terres malsaines."
 MA_paestum: "$building_type_MA_paestum$"
 
 #Tower of Pisa
 MA_tower_pisa_district: "$building_type_MA_tower_pisa$"
 MA_tower_pisa_district_desc: "$building_type_MA_tower_pisa_desc$"
 building_type_MA_tower_pisa: "Tour de Pise"
 building_type_MA_tower_pisa_desc: "L'élégant #italic campanile#! de la fière cité de Pise, dont les arcs gracieux et la pierre blanche étincelante sont connus dans toute la chrétienté et au-delà. Depuis sa construction, le sol sur lequel il repose s'est souvent révélé instable, provoquant une inclinaison toujours plus prononcée."
 MA_tower_pisa: "$building_type_MA_tower_pisa$"
 
 #Saint Peter's Basilica
 MA_vatican_district: "$building_type_MA_vatican$"
 MA_vatican_district_desc: "$building_type_MA_vatican_desc$"
 building_type_MA_vatican: "Basilique Saint-Pierre"
 building_type_MA_vatican_desc: "La plus sainte des anciennes basiliques commandées par Constantin à Rome s'élève sur le tombeau de l'Apôtre sur lequel fut fondée l'Église. \nAussi monumentale qu'élégante, cette église accueille des milliers de pèlerins de toute la chrétienté dans ses hautes nefs ornées de mosaïques dorées et de marbres exotiques, avec toute la richesse et la puissance qu'ils apportent."
 MA_vatican: "$building_type_MA_vatican$"
 
 #Rock of Canossa
 MA_rock_canossa_district: "$building_type_MA_rock_canossa$"
 MA_rock_canossa_district_desc: "$building_type_MA_rock_canossa_desc$"
 building_type_MA_rock_canossa: "Rocher de Canossa"
 building_type_MA_rock_canossa_desc: "Ce formidable château fut bâti au sommet d'un escarpement rocheux comme centre d'un impressionnant réseau de fortifications gardant les cols des Apennins. Depuis ce bastion isolé, ses seigneurs surveillent les vallées en contrebas, à l'abri dans leur refuge de pierre et de ciel."
 MA_rock_canossa: "$building_type_MA_rock_canossa$"
 
 #Hill of Tara
 MA_hill_tara_district: "$building_type_MA_hill_tara$"
 MA_hill_tara_district_desc: "$building_type_MA_hill_tara_desc$"
 building_type_MA_hill_tara: "Colline de Tara"
 building_type_MA_hill_tara_desc: "Une colline herbeuse protégée par des fossés et des levées de terre, ceinte de pierres antiques sculptées, siège sacré des hauts rois d'Irlande. Bien qu'aucune muraille ne s'y élève, la terre elle-même recèle une puissance qui attire des visiteurs de toute l'île."
 MA_hill_tara: "$building_type_MA_hill_tara$"
 
 #Clonmacnoise
 MA_clonmacnoise_district: "$building_type_MA_clonmacnoise$"
 MA_clonmacnoise_district_desc: "$building_type_MA_clonmacnoise_desc$"
 building_type_MA_clonmacnoise: "Clonmacnoise"
 building_type_MA_clonmacnoise_desc: "Un grand monastère fondé sur les rives du large Shannon, dont l'église de pierre et la haute tour ronde se dressent solennellement dans les plaines balayées par les vents. Avec le temps, il est devenu l'un des principaux centres du savoir de l'île, attirant érudits et pèlerins de toutes contrées."
 MA_clonmacnoise: "$building_type_MA_clonmacnoise$"
 
 #White Stupa of Gaochang
 MA_white_stupa_district: "$building_type_MA_white_stupa$"
 MA_white_stupa_district_desc: "$building_type_MA_white_stupa_desc$"
 building_type_MA_white_stupa: "Stoupa blanc de Gaochang"
 building_type_MA_white_stupa_desc: "Commandé par les autorités impériales pour marquer l'étendue de l'Empire du Milieu, ce [Glossary('stoupa','MA_stupa_glossary')] étincelant s'élève, solitaire, au-dessus des sables brûlés du désert. Sa grande coupole blanche et arrondie et sa flèche dorée s'inspirent largement des temples tibétains et indiens, mais sa base de bois intègre aussi des éléments traditionnels chinois."
 MA_white_stupa: "$building_type_MA_white_stupa$"
 
 #Khan Tengri
 MA_khan_tengri_district: "$building_type_MA_khan_tengri$"
 MA_khan_tengri_district_desc: "$building_type_MA_khan_tengri_desc$"
 building_type_MA_khan_tengri: "Khan Tengri"
 building_type_MA_khan_tengri_desc: "Surnommée le #italic Seigneur du Ciel#! par les peuples de la steppe, cette pyramide de marbre vertigineuse domine les montagnes environnantes avec une symétrie parfaite. Ses pentes sont drapées de neiges éternelles, rouges au crépuscule et dorées à l'aube, et forment un axe sacré reliant la terre aux cieux sous la voûte d'azur."
 MA_khan_tengri: "$building_type_MA_khan_tengri$"
 
 #Singing Dunes
 MA_singing_dunes_district: "$building_type_MA_singing_dunes$"
 MA_singing_dunes_district_desc: "$building_type_MA_singing_dunes_desc$"
 building_type_MA_singing_dunes: "Dunes chantantes"
 building_type_MA_singing_dunes_desc: "À quelques marches de l'oasis, un grand croissant de sable s'élève au-dessus de la steppe aride, où le vent arrache à la terre elle-même de longues notes envoûtantes. Les nomades qui empruntent les antiques routes d'Asie s'arrêtent pour écouter, croyant entendre dans le chant des dunes la voix des esprits, tandis que les poètes venus de loin s'inspirent de leur musique."
 MA_singing_dunes: "$building_type_MA_singing_dunes$"
 
 #Dakhma of Gurganj
 MA_dakhma_district: "$building_type_MA_dakhma$"
 MA_dakhma_district_desc: "$building_type_MA_dakhma_desc$"
 building_type_MA_dakhma: "Dakhma de Gurganj"
 building_type_MA_dakhma_desc: "Ce grand #italic Dakhma#! circulaire, ou tour du silence, couronne une hauteur solitaire au-dessus de la plaine. Les zoroastriens y exposaient jadis leurs morts au ciel et au soleil purificateurs, mais, à mesure que les fidèles se font moins nombreux d'été en été, la tour accueille moins de rites funéraires et davantage de sentinelles : sa hauteur et sa forme se prêtent désormais mieux à la surveillance qu'au culte. \n\n#help La tour confère des effets supplémentaires lorsqu'elle appartient à une [faith|E] pratiquant les #game_link sépultures célestes#! ou qu'elle est peuplée de fidèles de cette foi.#!"
 MA_dakhma: "$building_type_MA_dakhma$"
 
 #Black Ruins
 MA_karabalgasun_district: "$building_type_MA_karabalgasun$"
 MA_karabalgasun_district_desc: "$building_type_MA_karabalgasun_desc$"
 building_type_MA_karabalgasun: "Ruines noires"
 building_type_MA_karabalgasun_desc: "Des murailles de terre effondrées et des colonnes brisées sont les seuls vestiges du palais autrefois puissant qui se dressait au cœur de l'un des plus grands empires des steppes. Le vent hurle dans les cours désertes, les pierres sculptées reposent à demi ensevelies dans l'herbe et la poussière, mais les voyageurs traversent encore ces lieux et les nomment #italic Karabalgasun#!, les Ruines noires."
 MA_karabalgasun: "$building_type_MA_karabalgasun$"
 
 #City of the Army
 MA_ordu_district: "$building_type_MA_ordu$"
 MA_ordu_district_desc: "$building_type_MA_ordu_desc$"
 building_type_MA_ordu: "Cité de l'Armée"
 building_type_MA_ordu_desc: "Une grande cité de marchands, de courtisans et de chevaux se trouve au carrefour des routes d'Europe et d'Asie. \nProtégée par des remparts de terre et entourée d'un large fossé, elle abrite de nombreuses tentes et des temples disséminés le long d'une avenue à colonnades, menant à la tente dorée du grand seigneur de la Steppe qui gouverne depuis ce siège."
 MA_ordu: "$building_type_MA_ordu$"
 
 #Kurgan of the Rider
 MA_kurgan_district: "$building_type_MA_kurgan$"
 MA_kurgan_district_desc: "$building_type_MA_kurgan_desc$"
 building_type_MA_kurgan: "Kourgane du Cavalier"
 building_type_MA_kurgan_desc: "Les habitants racontent l'histoire d'un grand cavalier qui parcourait jadis ces terres et dont l'esprit chevauche encore la steppe. \nSon kourgane, un immense tertre de terre, serait le lieu de sa sépulture. Un cercle de pierres délimite son domaine. Son nom s'efface peu à peu des mémoires, mais le kourgane résiste toujours au vent et au temps."
 MA_kurgan: "$building_type_MA_kurgan$"
 
 #Cliffs of Ustyurt
 MA_ustyurt_cliffs_district: "$building_type_MA_ustyurt_cliffs$"
 MA_ustyurt_cliffs_district_desc: "$building_type_MA_ustyurt_cliffs_desc$"
 building_type_MA_ustyurt_cliffs: "Falaises de l'Oust-Ourt"
 building_type_MA_ustyurt_cliffs_desc: "Ces falaises façonnées par les intempéries marquent la transition entre un plateau désolé et les rivages de la mer intérieure, sillonnées de canyons et percées de grottes. Cette terre rude et sans eau a contraint les chasseurs à s'adapter et à créer des #italic arans#!, des pièges de pierre qui canalisent les troupeaux sauvages vers des passages étroits, transformant les falaises en un silencieux théâtre de mort."
 MA_ustyurt_cliffs: "$building_type_MA_ustyurt_cliffs$"
 
 #White Fortress
 MA_sarkel_district: "$building_type_MA_sarkel$"
 MA_sarkel_district_desc: "$building_type_MA_sarkel_desc$"
 building_type_MA_sarkel: "Forteresse blanche"
 building_type_MA_sarkel_desc: "Grande place forte de calcaire blanc et de brique, #italic Sark-el#! – la Forteresse blanche – fut construite sur la rive gauche du Don lorsque le khagan demanda à l'empereur romain des ingénieurs pour renforcer la frontière septentrionale de son royaume. Elle contrôle aujourd'hui le portage stratégique entre le Don et la Volga, projetant sa puissance militaire loin vers les terres du nord et protégeant les importantes routes commerciales qui traversent la région."
 MA_sarkel: "$building_type_MA_sarkel$"
 
 #Nilometer
 MA_nilometer_district: "$building_type_MA_nilometer$"
 MA_nilometer_district_desc: "$building_type_MA_nilometer_desc$"
 building_type_MA_nilometer: "Nilomètre"
 building_type_MA_nilometer_desc: "Une étroite chambre de pierre construite sur la berge boueuse du fleuve pour mieux mesurer les crues et les décrues du Nil et planifier les cultures. Commandée par les nouveaux souverains musulmans, elle perpétue une coutume ancestrale de ces terres, liant les inondations et la prospérité à l'ordre de l'État."
 MA_nilometer: "$building_type_MA_nilometer$"
 
 #Abu Simbel
 MA_abu_simbel_district: "$building_type_MA_abu_simbel$"
 MA_abu_simbel_district_desc: "$building_type_MA_abu_simbel_desc$"
 building_type_MA_abu_simbel: "Abou Simbel"
 building_type_MA_abu_simbel_desc: "Des statues colossales, sculptées il y a de nombreuses générations par les anciens pharaons, émergent de ces dunes rocheuses, et leur taille demeure sans égale au monde. \nNul témoin de leur majesté, simple voyageur ou grand roi, ne peut rester insensible à l'histoire qu'elles racontent."
 MA_abu_simbel: "$building_type_MA_abu_simbel$"
 
 #Red and White Monasteries
 MA_red_white_monasteries_district: "$building_type_MA_red_white_monasteries$"
 MA_red_white_monasteries_district_desc: "$building_type_MA_red_white_monasteries_desc$"
 building_type_MA_red_white_monasteries: "Monastères rouge et blanc"
 building_type_MA_red_white_monasteries_desc: "Deux anciens monastères coptes se dressent près des rives du Nil. Leurs murs sont bâtis en pierres aux couleurs saisissantes qui leur ont donné leurs noms, l'un d'un rouge profond et terreux, l'autre d'une pâleur lumineuse. Isolés mais non oubliés, avec leurs chapelles résonnant de chants anciens et leurs murs ornés de fresques qui s'effacent, ils préservent une tradition chrétienne savante et pieuse datant d'avant que les souverains musulmans ne franchissent les déserts et les rochers du Sinaï pour conquérir ces terres."
 MA_red_white_monasteries: "$building_type_MA_red_white_monasteries$"
 
 #Knossos
 MA_knossos_ruins_district: "$building_type_MA_knossos_ruins$"
 MA_knossos_ruins_district_desc: "$building_type_MA_knossos_ruins_desc$"
 building_type_MA_knossos_ruins: "Palais de Cnossos"
 building_type_MA_knossos_ruins_desc: "Dominant la mer splendide, l'antique palais de Cnossos conserve la mémoire des rois et des mythes d'autrefois. Ses vastes salles, ses colonnes et ses fresques évoquent un âge lointain de richesse et de puissance, enchantant les voyageurs et inspirant ceux qui aspirent à prendre place parmi les puissants souverains de Crète."
 MA_knossos_ruins: "Ruines de Cnossos"
 MA_knossos: "$building_type_MA_knossos_ruins$"
 
 #Skara Brae
 MA_skara_brae_district: "$building_type_MA_skara_brae$"
 MA_skara_brae_district_desc: "$building_type_MA_skara_brae_desc$"
 building_type_MA_skara_brae: "Skara Brae"
 building_type_MA_skara_brae_desc: "Émergeant timidement d'une colline herbeuse sur une côte battue par les vents, cet ensemble d'anciennes habitations de pierre repose à demi enseveli sous la terre. \nBalayé par la brise mordante de l'océan, il demeure dans le silence, ses murs bas érodés par les intempéries et ses foyers éteints depuis d'innombrables siècles, mais résonnant encore du souvenir de vies depuis longtemps disparues."
 MA_skara_brae: "$building_type_MA_skara_brae$"
 
 #Whitehorse Hill
 MA_whitehorse_hill_district: "$building_type_MA_whitehorse_hill$"
 MA_whitehorse_hill_district_desc: "$building_type_MA_whitehorse_hill_desc$"
 building_type_MA_whitehorse_hill: "Colline du Cheval blanc"
 building_type_MA_whitehorse_hill_desc: "#flavor Près de la ville d'Abinton se trouve une montagne portant la figure d'un étalon, et celle-ci est blanche. Rien n'y pousse.#!"
 MA_whitehorse_hill: "$building_type_MA_whitehorse_hill$"
 
 #Gagikashen
 MA_gagikashen_district: "$building_type_MA_gagikashen$"
 MA_gagikashen_district_desc: "$building_type_MA_gagikashen_desc$"
 building_type_MA_gagikashen: "Gagikashen"
 building_type_MA_gagikashen_desc: "Une grande église circulaire dédiée à saint Grégoire, dominant les hauteurs d'Ani. Ses bâtisseurs se sont inspirés des formes ruinées de la cathédrale de Zvartnots. Son haut tambour s'élève en trois degrés au-dessus d'anneaux de colonnes et de chapelles latérales, entourant un espace central d'une grande harmonie et clarté."
 MA_gagikashen: "$building_type_MA_gagikashen$"
 
 #Saint Gall
 MA_saint_gall_district: "$building_type_MA_saint_gall$"
 MA_saint_gall_district_desc: "$building_type_MA_saint_gall_desc$"
 building_type_MA_saint_gall: "Saint-Gall"
 building_type_MA_saint_gall_desc: "Un vaste complexe monastique fondé sur le site de l'ermitage de saint Gall, aux confins des terres alémaniques. Réputé pour sa discipline et son organisation, il abrite un #italic scriptorium#! et une bibliothèque de qualité exceptionnelle, où les moines copient, traduisent et préservent les textes classiques et sacrés à l'usage des érudits de toute la chrétienté."
 MA_saint_gall: "$building_type_MA_saint_gall$"
 
 #Sé of Lisbon
 MA_se_lisbon_district: "$building_type_MA_se_lisbon$"
 MA_se_lisbon_district_desc: "$building_type_MA_se_lisbon_desc$"
 building_type_MA_se_lisbon: "Sé de Lisbonne"
 building_type_MA_se_lisbon_desc: "Une imposante cathédrale romane édifiée sur les pentes dominant le port, dont les murs épais et les fenêtres étroites témoignent des temps troublés de cette lutte ibérique. Bâtie après la reconquête chrétienne de la ville, elle s'élève sur les ruines d'une ancienne mosquée et conserve les reliques de saint Vincent sous ses voûtes de pierre, accueillant les processions dans sa nef résonnante."
 MA_se_lisbon: "$building_type_MA_se_lisbon$"
 
 #Alto Douro Vineyards
 MA_alto_douro_district: "$building_type_MA_alto_douro$"
 MA_alto_douro_district_desc: "$building_type_MA_alto_douro_desc$"
 building_type_MA_alto_douro: "Vignobles du Haut-Douro"
 building_type_MA_alto_douro_desc: "Des vignobles en terrasses taillés dans les collines abruptes de la vallée du Douro, où des murets de pierre retiennent la terre et captent le soleil. Plantées pour la première fois à l'époque romaine, ces vignes produisent depuis longtemps des vins puissants et sombres, transportés par le fleuve vers les marchés côtiers et les cours étrangères."
 MA_alto_douro: "$building_type_MA_alto_douro$"
 
 #Fortifications on the Guadalquivir
 MA_guadalquivir_fortifications_district: "$building_type_MA_guadalquivir_fortifications$"
 MA_guadalquivir_fortifications_district_desc: "$building_type_MA_guadalquivir_fortifications_desc$"
 building_type_MA_guadalquivir_fortifications: "Fortifications du Guadalquivir"
 building_type_MA_guadalquivir_fortifications_desc: "S'étendant le long des rives du Guadalquivir, des fortifications protègent le port animé de Séville, avec des tours et des portes à chaque détour. La plus remarquable est la Torre del Oro, tour de guet à douze côtés revêtue d'un enduit à la chaux aux reflets dorés qui scintille au-dessus des eaux du fleuve, servant à la fois de repère aux navires qui approchent et d'avertissement de la puissance de la cité."
 MA_guadalquivir_fortifications: "$building_type_MA_guadalquivir_fortifications$"
 
 #Madinat al-Zahra
 MA_madinat_alzahra_district: "$building_type_MA_madinat_alzahra$"
 MA_madinat_alzahra_district_desc: "$building_type_MA_madinat_alzahra_desc$"
 building_type_MA_madinat_alzahra: "Madinat al-Zahra"
 building_type_MA_madinat_alzahra_desc: "Une vaste cité palatiale érigée au pied des douces collines de la campagne de Cordoue pour manifester la splendeur de la cour du calife. Ses jardins, pavillons et salles de réception s'étagent sur de vastes terrasses, avec des murs de marbre et de jaspe finement sculptés. Sa beauté et sa magnificence inspirent aux poètes des vers sur les plus grands plaisirs de la vie."
 MA_madinat_alzahra: "$building_type_MA_madinat_alzahra$"
 
 #Circus of Merida
 MA_circus_merida_district: "$building_type_MA_circus_merida$"
 MA_circus_merida_district_desc: "$building_type_MA_circus_merida_desc$"
 building_type_MA_circus_merida: "Cirque de Mérida"
 building_type_MA_circus_merida_desc: "Les vestiges d'un ancien cirque romain s'étirent, longs et étroits, dans la plaine à l'extérieur de Mérida. Son tracé demeure visible grâce à des murs croulants et des pistes herbeuses, que quelques rares cyprès couvrent doucement de leur ombre. À proximité, une petite église et son paisible cimetière ont été édifiés à l'écart des ruines, donnant une nouvelle vocation à un lieu qui n'en avait plus."
 MA_circus_merida: "$building_type_MA_circus_merida$"
 
 #Alhambra
 MA_alhambra1_district: "$building_type_MA_alhambra1$"
 MA_alhambra1_district_desc: "$building_type_MA_alhambra1_desc$"
 building_type_MA_alhambra1: "Alhambra"
 building_type_MA_alhambra1_desc: "Sur la douce colline de la Sabika, les murs rouges de l'Alhambra veillent sur Grenade et sa plaine fertile. Dans leur enceinte, les souverains de la cité trouvent refuge contre leurs ennemis et la chaleur du soleil estival, tandis que tours et créneaux proclament leur domination sur les terres en contrebas."
 MA_alhambra2: "Nouvelle citadelle"
 MA_alhambra3: "Cours et jardins"
 MA_alhambra4: "Cour des Lions"
 MA_alhambra1: "Forteresse rouge"
 
 #The Cologne Cathedral
 MA_cologne_cathedral1_district: "$building_type_MA_cologne_cathedral1$"
 MA_cologne_cathedral1_district_desc: "$building_type_MA_cologne_cathedral1_desc$"
 building_type_MA_cologne_cathedral1: "Cathédrale de Cologne"
 building_type_MA_cologne_cathedral1_desc: "La grande église de Cologne, siège de son archevêque et symbole de la fierté de la cité. Agrandie et remaniée au fil des siècles, elle renferme des reliques d'une valeur inestimable qui attirent des pèlerins de toutes contrées, tandis que ses puissantes murailles dominent les toits de la ville."
 MA_cologne_cathedral1: "Ancienne cathédrale de Cologne"
 MA_cologne_cathedral2: "Flèches jumelles de Cologne"
 
 #Qutb Complex
 MA_qutb_complex1_district: "$building_type_MA_qutb_complex1$"
 MA_qutb_complex1_district_desc: "$building_type_MA_qutb_complex1_desc$"
 building_type_MA_qutb_complex1: "Complexe du Qûtb"
 building_type_MA_qutb_complex1_desc: "Au cœur de Delhi s'étend une ancienne enceinte sacrée, où les souverains ont élevé des monuments et des temples pour proclamer leur foi et leur puissance. Des colonnes sculptées et des cours entourent le grand pilier de fer des Gupta, dont le fût sombre résiste à la succession des dynasties et des dieux."
 MA_qutb_complex1: "Pilier de fer"
 MA_qutb_complex2: "Grande mosquée de Delhi"
 MA_qutb_complex3: "Qûtb Minâr"
 MA_qutb_complex4: "Alai Minar"
 
 #Sigiriya
 MA_sigiriya1_district: "$building_type_MA_sigiriya1$"
 MA_sigiriya1_district_desc: "$building_type_MA_sigiriya1_desc$"
 building_type_MA_sigiriya1: "Sigiriya"
 building_type_MA_sigiriya1_desc: "Au milieu de la jungle profonde s'élève un puissant rocher solitaire, dont le sommet abrite l'antique citadelle royale de [Glossary('Sigiriya','MA_sigiriya_glossary')]. Des escaliers grimpent le long de murs couverts de fresques et franchissent la colossale Porte du Lion, au-dessus de jardins en terrasses et de bassins, témoignant de l'ambition des rois qui firent leur demeure dans le ciel."
 MA_sigiriya1: "Ruines de Sigiriya"
 MA_sigiriya2: "Sigiriya restauré"
 MA_sigiriya_glossary: "Un mot cingalais signifiant littéralement \"le Rocher du Lion\"."
 
 #Great Sanchi Stupa
 MA_sanchi_stupa_district: "$building_type_MA_sanchi_stupa$"
 MA_sanchi_stupa_district_desc: "$building_type_MA_sanchi_stupa_desc$"
 building_type_MA_sanchi_stupa: "Grand stoupa de Sanchi"
 building_type_MA_sanchi_stupa_desc: "Cet immense dôme de pierre et de brique fut d'abord édifié sur ordre du puissant empereur Ashoka. Depuis, le complexe a été agrandi par ses successeurs et ravagé par le temps. Il se dresse sur une terrasse surélevée, entourée de balustrades sculptées et de #italics toranas#! décorés, des portiques autour desquels les pèlerins tournent dans une dévotion sans fin."
 MA_sanchi_stupa: "$building_type_MA_sanchi_stupa$"
 
 #Vindhyagiri Hill
 MA_gommateshwara1_district: "$building_type_MA_gommateshwara1$"
 MA_gommateshwara1_district_desc: "$building_type_MA_gommateshwara1_desc$"
 building_type_MA_gommateshwara1: "Colline de Vindhyagiri"
 building_type_MA_gommateshwara1_desc: "Dominant abruptement la ville de Shravanabelagola, les hauteurs granitiques du Vindhyagiri sont couronnées de sanctuaires et de cours consacrés à la dévotion jaïne. Les pèlerins gravissent pieds nus ses marches taillées dans la pierre, dans l'air empli du tintement des cloches et de l'odeur de la roche chauffée par le soleil."
 MA_gommateshwara2: "Colosse de Gommateshwara"
 MA_gommateshwara1: "Temples de Vindhyagiri"
 
 #Palace of Ghazni
 MA_ghazni_palace_district: "$building_type_MA_ghazni_palace$"
 MA_ghazni_palace_district_desc: "$building_type_MA_ghazni_palace_desc$"
 building_type_MA_ghazni_palace: "Palais ghaznévide"
 building_type_MA_ghazni_palace_desc: "Située hors des murs de Ghazni, cette résidence royale est le centre du pouvoir du sultan de la ville. Ses salles, disposées autour d'une cour quadrangulaire à #italic iwans#!, sont savamment sculptées et richement ornées de stuc et de carreaux polychromes, inspirés par l'art persan."
 MA_ghazni_palace: "$building_type_MA_ghazni_palace$"
 
 #Stupas of Anuradhapura
 MA_stupas_anuradhapura_district: "$building_type_MA_stupas_anuradhapura$"
 MA_stupas_anuradhapura_district_desc: "$building_type_MA_stupas_anuradhapura_desc$"
 building_type_MA_stupas_anuradhapura: "Stoupas d'Anurâdhapura"
 building_type_MA_stupas_anuradhapura_desc: "Autour de l'antique cité sacrée d'Anurâdhapura se dressent les vastes [Glossary('stoupas','MA_stupa_glossary')] de brique des rois cingalais, bâtis pour abriter les reliques du Bouddha. Les formes blanchies à la chaux des monastères et des centres d'étude de la cité scintillent au soleil, tandis que les débats animent leurs salles et leurs cours."
 MA_stupas_anuradhapura: "$building_type_MA_stupas_anuradhapura$"
 
 #Eye of the Sahara
 MA_eye_sahara_district: "$building_type_MA_eye_sahara$"
 MA_eye_sahara_district_desc: "$building_type_MA_eye_sahara_desc$"
 building_type_MA_eye_sahara: "Œil du Sahara"
 building_type_MA_eye_sahara_desc: "Une vaste formation circulaire au cœur du désert, dont les anneaux rocheux s'étendent sur des lieues à travers les sables. De loin, elle ressemble à un œil immense, érodé par les siècles et tourné vers le ciel, un repère connu des nomades et des caravanes qui traversent les étendues stériles alentour. \nDe vieilles légendes l'associent à une cité jadis prospère, verdoyante et traversée par les eaux, aujourd'hui engloutie par les sables."
 MA_eye_sahara: "$building_type_MA_eye_sahara$"
 
 #Great Mosque of Mahdia
 MA_mahdia_mosque_district: "$building_type_MA_mahdia_mosque$"
 MA_mahdia_mosque_district_desc: "$building_type_MA_mahdia_mosque_desc$"
 building_type_MA_mahdia_mosque: "Grande mosquée de Mahdia"
 building_type_MA_mahdia_mosque_desc: "Érigée sur la péninsule aux rives rocheuses de Mahdia, cette austère mosquée, avec ses tours de pierre pâle, ressemble à une forteresse. \nÀ l'intérieur, deux élégantes cours à arcades mènent aux salles de prière, où les fidèles se rassemblent sous des arcs de pierre claire."
 MA_mahdia_mosque: "$building_type_MA_mahdia_mosque$"
 
 #Saint Mark's of Zagreb
 MA_zagreb_church_district: "$building_type_MA_zagreb_church$"
 MA_zagreb_church_district_desc: "$building_type_MA_zagreb_church_desc$"
 building_type_MA_zagreb_church: "Église Saint-Marc de Zagreb"
 building_type_MA_zagreb_church_desc: "Érigée avec l'aide d'artisans italiens et allemands, l'église Saint-Marc domine le reste de la ville. Son plan roman est enrichi d'ajouts gothiques, tandis que ses portails et ses murs sont richement peints de scènes bibliques."
 MA_zagreb_church: "$building_type_MA_zagreb_church$"
 
 #Walls of Balkh
 MA_walls_balkh_district: "$building_type_MA_walls_balkh$"
 MA_walls_balkh_district_desc: "$building_type_MA_walls_balkh_desc$"
 building_type_MA_walls_balkh: "Remparts de Balkh"
 building_type_MA_walls_balkh_desc: "Depuis des siècles, la citadelle de Balkh est protégée par deux grandes murailles circulaires entourant tout son périmètre, l'une à l'intérieur de l'autre. Leurs remparts de terre et leurs tours forment un rempart contre les armées qui déferlent sur la steppe et protègent les marchés et les ateliers de la cité."
 MA_walls_balkh: "$building_type_MA_walls_balkh$"
 
 #Martand Sun Temple
 MA_martand_sun_temple_district: "$building_type_MA_martand_sun_temple$"
 MA_martand_sun_temple_district_desc: "$building_type_MA_martand_sun_temple_desc$"
 building_type_MA_martand_sun_temple: "Temple solaire de Martand"
 building_type_MA_martand_sun_temple_desc: "Érigé sur un haut plateau de la vallée du Cachemire, ce temple est l'un des plus anciens consacrés au Soleil divin. Son grand sanctuaire occupe le centre de l'ensemble, entouré d'une multitude de petits lieux de culte et de rangées de sculptures représentant des divinités et des êtres célestes. La cour à péristyle abrite un bassin paisible, resplendissant sous les rayons du soleil."
 MA_martand_sun_temple: "$building_type_MA_martand_sun_temple$"
 
 #Ruins of Aquae Sulis
 MA_aquae_sulis_ruins_district: "$building_type_MA_aquae_sulis_ruins$"
 MA_aquae_sulis_ruins_district_desc: "$building_type_MA_aquae_sulis_ruins_desc$"
 building_type_MA_aquae_sulis_ruins: "Ruines d'Aquae Sulis"
 building_type_MA_aquae_sulis_ruins_desc: "#low L'œuvre des géants tombe en ruine#! \nAutour de la source sacrée fumante gisent les vestiges brisés d'Aquae Sulis, où les Romains avaient autrefois élevé de grands thermes et des temples de pierre de taille. Murailles effondrées, arcs écroulés et salles inondées dessinent encore le plan ordonné de l'antique complexe. Ses eaux chaudes continuent de couler tandis que pèlerins et habitants se rassemblent parmi les ruines."
 MA_aquae_sulis_ruins: "$building_type_MA_aquae_sulis_ruins$"
 
 #Winchester Minster
 MA_winchester_minster_district: "$building_type_MA_winchester_minster$"
 MA_winchester_minster_district_desc: "$building_type_MA_winchester_minster_desc$"
 building_type_MA_winchester_minster: "Minster de Winchester"
 building_type_MA_winchester_minster_desc: "La grande église est une vaste basilique de pierre et de bois, dotée d'une large nef peinte et de plusieurs clochers. Elle domine la cité royale, dépassant de loin toutes ses autres constructions, et veille sur les tombeaux des rois du Wessex."
 MA_winchester_minster: "$building_type_MA_winchester_minster$"
 
 #Westminster Abbey
 MA_westminster_abbey_district: "$building_type_MA_westminster_abbey$"
 MA_westminster_abbey_district_desc: "$building_type_MA_westminster_abbey_desc$"
 building_type_MA_westminster_abbey: "Abbaye de Westminster"
 building_type_MA_westminster_abbey_desc: "Bâtie au bord de la Tamise et richement dotée par les rois d'Angleterre, l'abbaye de Westminster est une grande église monastique de pierre, dont la longue nef et le chœur élancé sont ornés de chapiteaux sculptés et de peintures murales. Les rois y sont couronnés et ensevelis, et l'abbaye est la scène sacrée où l'autorité royale et la faveur divine s'unissent."
 MA_westminster_abbey: "$building_type_MA_westminster_abbey$"
 
 #Lorsch Gate
 MA_lorsch_gate_district: "$building_type_MA_lorsch_gate$"
 MA_lorsch_gate_district_desc: "$building_type_MA_lorsch_gate_desc$"
 building_type_MA_lorsch_gate: "Porte de Lorsch"
 building_type_MA_lorsch_gate_desc: "La porte monumentale de l'abbaye de Lorsch est un exemple rare et soigneusement réalisé d'architecture carolingienne. Construite en pierre finement taillée et en brique, sa façade symétrique est rythmée par des colonnes engagées, des arcatures aveugles et des ornements classiques rappelant les modèles de la Rome antique."
 MA_lorsch_gate: "$building_type_MA_lorsch_gate$"
 
 #Dover Castle
 MA_dover_castle_district: "$building_type_MA_dover_castle$"
 MA_dover_castle_district_desc: "$building_type_MA_dover_castle_desc$"
 building_type_MA_dover_castle: "Château de Douvres"
 building_type_MA_dover_castle_desc: "Dressée sur les falaises blanches dominant l'étroit bras de mer, cette forteresse contrôle le principal passage entre l'Angleterre et le continent. Son immense donjon de pierre, ses courtines et ses ouvrages d'entrée successifs forment un redoutable ensemble défensif, qui contrôle le port et les routes vers l'intérieur tout en servant de place forte et de résidence royale."
 MA_dover_castle: "$building_type_MA_dover_castle$"
 
 #Château Gaillard
 MA_chateau_gaillard_district: "$building_type_MA_chateau_gaillard$"
 MA_chateau_gaillard_district_desc: "$building_type_MA_chateau_gaillard_desc$"
 building_type_MA_chateau_gaillard: "Château Gaillard"
 building_type_MA_chateau_gaillard_desc: "Construit sur un éperon calcaire dominant la Seine, Château Gaillard est une forteresse de pierre compacte et sophistiquée, conçue pour une défense active. Ses enceintes concentriques, ses tours angulaires et ses ouvrages d'entrée avancés réduisent les angles morts et concentrent les tirs sur les voies d'approche. Bâti avec rapidité et précision, il incarne les principes les plus récents de l'architecture militaire, assurant le contrôle du fleuve et de la frontière normande."
 MA_chateau_gaillard: "$building_type_MA_chateau_gaillard$"
 
 #Carnac Stones
 MA_carnac_stones_district: "$building_type_MA_carnac_stones$"
 MA_carnac_stones_district_desc: "$building_type_MA_carnac_stones_desc$"
 building_type_MA_carnac_stones: "Alignements de Carnac"
 building_type_MA_carnac_stones_desc: "Des centaines de pierres gigantesques parsèment la plaine, disposées en rangées ordonnées qui s'étendent jusqu'à l'horizon. Dressées en un âge si lointain que nul ne s'en souvient, elles ont perdu leur véritable fonction dans les brumes des légendes et des récits."
 MA_carnac_stones: "$building_type_MA_carnac_stones$"
 
 #Guérande Salt Marshes
 MA_guerande_salt_marshes_district: "$building_type_MA_guerande_salt_marshes$"
 MA_guerande_salt_marshes_district_desc: "$building_type_MA_guerande_salt_marshes_desc$"
 building_type_MA_guerande_salt_marshes: "Marais salants de Guérande"
 building_type_MA_guerande_salt_marshes_desc: "Le long des basses terres côtières près de Guérande s'étend un réseau d'œillets, de digues et de canaux permettant d'extraire de la mer la célèbre #italic fleur de sel#!. L'eau de mer est conduite dans des bassins peu profonds où le soleil en fait apparaître le sel blanc, faisant vivre les villes et le commerce de la région grâce à un savoir-faire transmis de génération en génération."
 MA_guerande_salt_marshes: "$building_type_MA_guerande_salt_marshes$"
 
 #Reims Cathedral
 MA_reims_cathedral_district: "$building_type_MA_reims_cathedral$"
 MA_reims_cathedral_district_desc: "$building_type_MA_reims_cathedral_desc$"
 building_type_MA_reims_cathedral: "Cathédrale de Reims"
 building_type_MA_reims_cathedral_desc: "Une vaste cathédrale gothique caractérisée par sa haute nef, ses fins piliers fasciculés et son emploi généralisé de voûtes d'ogives et d'arcs-boutants. Sa façade occidentale est richement articulée par des portails sculptés et de profondes voussures, tandis que l'intérieur est enveloppé de vitraux qui soulignent la hauteur, la lumière et la grandeur cérémonielle, à la mesure de son rôle central dans les sacres des rois de France."
 MA_reims_cathedral: "$building_type_MA_reims_cathedral$"
 
 #Chartres Cathedral
 MA_chartres_cathedral_district: "$building_type_MA_chartres_cathedral$"
 MA_chartres_cathedral_district_desc: "$building_type_MA_chartres_cathedral_desc$"
 building_type_MA_chartres_cathedral: "Cathédrale de Chartres"
 building_type_MA_chartres_cathedral_desc: "Parmi les exemples les plus élégants et les plus ordonnés des ambitions du gothique classique, Chartres se distingue par sa large nef, ses piliers robustes et son chœur profond. Ses murs s'effacent largement derrière des vitraux pris dans une solide ossature de pierre, tandis que ses tours jumelles et ses élévations soigneusement proportionnées expriment la stabilité, la clarté et une intention théologique."
 MA_chartres_cathedral: "$building_type_MA_chartres_cathedral$"
 
 #Palace of Avignon
 MA_avignon_palace1_district: "$building_type_MA_avignon_palace1$"
 MA_avignon_palace1_district_desc: "$building_type_MA_avignon_palace1_desc$"
 building_type_MA_avignon_palace1: "Palais d'Avignon"
 building_type_MA_avignon_palace1_desc: "S'élevant sur un éperon rocheux au-dessus du Rhône, ce grand palais-forteresse abrite une cour raffinée et puissante. Ses salles, ses tours et ses chapelles voûtées allient force et élégance des lignes, tandis qu'émissaires, artisans et marchands se pressent dans les rues en contrebas, attirés par la richesse et l'autorité de ses maîtres."
 MA_avignon_palace1: "Vieux Palais"
 MA_avignon_palace2: "Palais neuf"
 
 #Walls of Carcassonne
 MA_walls_carcassonne1_district: "$building_type_MA_walls_carcassonne1$"
 MA_walls_carcassonne1_district_desc: "$building_type_MA_walls_carcassonne1_desc$"
 building_type_MA_walls_carcassonne1: "Remparts de Carcassonne"
 building_type_MA_walls_carcassonne1_desc: "Les anciens remparts de Carcassonne protègent la vallée et les routes reliant les terres ibériques aux terres franques. Tours et puissants ouvrages d'entrée couronnent l'enceinte, gardant les maisons à l'intérieur et les champs en contrebas, formidable place forte sur une frontière longtemps disputée entre rois et religions."
 MA_walls_carcassonne1: "Anciens remparts de Carcassonne"
 MA_walls_carcassonne2: "Double enceinte de Carcassonne"
 
 #Saint-Denis Basilica
 MA_saint_denis_basilica1_district: "$building_type_MA_saint_denis_basilica1$"
 MA_saint_denis_basilica1_district_desc: "$building_type_MA_saint_denis_basilica1_desc$"
 building_type_MA_saint_denis_basilica1: "Basilique de Saint-Denis"
 building_type_MA_saint_denis_basilica1_desc: "Érigée sur la sépulture de saint Denis, cette grande basilique est un sanctuaire de dévotion royale. Sa large nef conduit les pèlerins vers la châsse du saint, tandis que les murs peints et les chapiteaux sculptés veillent sur les rois qui reposent en dessous. Ici, l'autorité de la Couronne et celle de l'Église sont unies dans la pierre."
 MA_saint_denis_basilica1: "Basilique royale de Saint-Denis"
 MA_saint_denis_basilica2: "Grand chœur de Saint-Denis"
 
 #Île de la Cité
 MA_ile_de_la_cite1_district: "$building_type_MA_ile_de_la_cite1$"
 MA_ile_de_la_cite1_district_desc: "$building_type_MA_ile_de_la_cite1_desc$"
 building_type_MA_ile_de_la_cite1: "Île de la Cité"
 building_type_MA_ile_de_la_cite1_desc: "Après la chute de Rome, les habitants avaient trouvé refuge sur cette île, entourée par les eaux d'un méandre de la Seine. Depuis, l'Île est pourtant devenue vivante, belle et fière : elle est désormais le cœur politique, intellectuel et commercial de Paris, et avec lui, de la France."
 MA_ile_de_la_cite1: "Palais carolingien"
 MA_ile_de_la_cite2: "Palais gothique"
 
 #Iron Gate
 MA_iron_gate_district: "$building_type_MA_iron_gate$"
 MA_iron_gate_district_desc: "$building_type_MA_iron_gate_desc$"
 building_type_MA_iron_gate: "Porte de Fer"
 building_type_MA_iron_gate_desc: "Gardant le col de montagne qui relie la plaine de l'Oronte aux hauteurs du massif, la Porte de Fer constitue l'une des entrées les plus importantes d'Antioche. Ici, les remparts se resserrent en un défilé fortifié de tours de pierre, de portes et de murs de soutènement directement ancrés dans le roc. La citadelle sert également de sorte de barrage, maîtrisant le torrent du Parménios pour protéger la cité."
 MA_iron_gate: "$building_type_MA_iron_gate$"
 
 #Pula Amphitheater
 MA_pula_amphiteater_district: "$building_type_MA_pula_amphiteater$"
 MA_pula_amphiteater_district_desc: "$building_type_MA_pula_amphiteater_desc$"
 building_type_MA_pula_amphiteater: "Amphithéâtre de Pula"
 building_type_MA_pula_amphiteater_desc: "Construit en calcaire finement taillé, cet amphithéâtre conserve la forme entière d'une arène romaine, avec ses murs elliptiques, ses gradins et son réseau de couloirs voûtés en dessous. Ses quatre tours d'angle et ses solides arcades témoignent des fières traditions d'ingénierie qui l'ont élevé, tandis que l'édifice demeure un centre d'autorité, de rassemblement et de spectacles dans la cité médiévale."
 MA_pula_amphiteater: "$building_type_MA_pula_amphiteater$"
 
 #Olympus
 MA_olympus_district: "$building_type_MA_olympus$"
 MA_olympus_district_desc: "$building_type_MA_olympus_desc$"
 building_type_MA_olympus: "Olympe"
 building_type_MA_olympus_desc: "Une montagne vertigineuse au cœur de la Thessalie, dont le sommet déchiqueté, le plus haut de toute la Grèce, projette de longues ombres sur la mer et les douces pentes fertiles. \nConsidérée comme la demeure des dieux, elle inspire révérence et émerveillement depuis des millénaires, son sommet étant, dit-on, couronné de leur palais invisible."
 MA_olympus: "$building_type_MA_olympus$"
 
 #Ypres Cloth Hall
 MA_ypres_cloth_hall_district: "$building_type_MA_ypres_cloth_hall$"
 MA_ypres_cloth_hall_district_desc: "$building_type_MA_ypres_cloth_hall_desc$"
 building_type_MA_ypres_cloth_hall: "Halle aux draps d'Ypres"
 building_type_MA_ypres_cloth_hall_desc: "Cette vaste halle civique de pierre et de bois est édifiée pour abriter le contrôle, le stockage et le commerce des draps de laine qui font la richesse de la cité. Sa longue façade régulière est rythmée par des arcades, des pignons et un imposant beffroi, associant fonction marchande et autorité urbaine. Sous ses voûtes, marchands, responsables des guildes et magistrats supervisent les contrats, les mesures et les taxes au cœur de l'économie de la ville."
 MA_ypres_cloth_hall: "$building_type_MA_ypres_cloth_hall$"
 
 #Gravensteen
 MA_gravensteen_district: "$building_type_MA_gravensteen$"
 MA_gravensteen_district_desc: "$building_type_MA_gravensteen_desc$"
 building_type_MA_gravensteen: "Gravensteen"
 building_type_MA_gravensteen_desc: "Cet imposant château de pierre sert de résidence aux comtes de Flandre et symbolise leur autorité sur la ville. Centré sur un immense donjon et ceint d'épaisses courtines, il associe salles résidentielles, chambres de justice et défenses militaires, affirmant le pouvoir seigneurial au cœur du tissu urbain dense de Gand."
 MA_gravensteen: "$building_type_MA_gravensteen$"
 
 #Mount Ararat
 MA_ararat_district: "$building_type_MA_ararat$"
 MA_ararat_district_desc: "$building_type_MA_ararat_desc$"
 building_type_MA_ararat: "Mont Ararat"
 building_type_MA_ararat_desc: "Vaste massif volcanique aux deux sommets dominant les plaines alentour, le mont Ararat s'impose à l'horizon avec ses cimes couvertes de neiges éternelles. Vénéré par différents royaumes et différentes religions, il est associé par une tradition ancestrale au lieu où reposa l'arche de Noé, conférant une autorité sacrée et une présence solennelle aux terres qui s'étendent sous ses pentes."
 MA_ararat: "$building_type_MA_ararat$"
 
 #Székesfehérvár Basilica
 MA_szekesfehervar_basilica1_district: "$building_type_MA_szekesfehervar_basilica1$"
 MA_szekesfehervar_basilica1_district_desc: "$building_type_MA_szekesfehervar_basilica1_desc$"
 building_type_MA_szekesfehervar_basilica1: "Basilique de Székesfehérvár"
 building_type_MA_szekesfehervar_basilica1_desc: "Cette grande basilique de pierre constitue le cœur cérémoniel et dynastique du royaume de Hongrie. Sous les voûtes de sa large nef, les rois sont couronnés et ensevelis, unissant la royauté, la loi et la foi dans le plus éminent sanctuaire royal du royaume."
 MA_szekesfehervar_basilica1: "Basilique royale de Székesfehérvár"
 MA_szekesfehervar_basilica2: "Grand chœur de Székesfehérvár"
 
 #Prague Castle
 MA_prague_castle1_district: "$building_type_MA_prague_castle1$"
 MA_prague_castle1_district_desc: "$building_type_MA_prague_castle1_desc$"
 building_type_MA_prague_castle1: "Château de Prague"
 building_type_MA_prague_castle1_desc: "Sur la longue crête dominant la Vltava, les salles, les églises et les cours du château de Prague surplombent la cité. Artisans, serviteurs et clercs se rassemblent autour de ce siège des souverains de Bohême, dont la richesse et l'ambition ont fait de cette colline le cœur politique et sacré de leurs terres."
 MA_prague_castle1: "Résidence princière de Prague"
 MA_prague_castle2: "Château royal de Prague"
 
 #Saint Adrian's Basilica
 MA_zalavar_basilica_district: "$building_type_MA_zalavar_basilica$"
 MA_zalavar_basilica_district_desc: "$building_type_MA_zalavar_basilica_desc$"
 building_type_MA_zalavar_basilica: "Basilique Saint-Adrien"
 building_type_MA_zalavar_basilica_desc: "Au centre d'un établissement carolingien fortifié dans les marais de la Zala, la basilique Saint-Adrien est une importante fondation ecclésiastique des débuts de la christianisation de la région. Construite comme une église de pierre à trois vaisseaux, dotée d'un sanctuaire marqué et de structures occidentales, elle sert à la fois de centre missionnaire et d'église princière, renforçant le rayonnement diplomatique de son protecteur sur les régions frontalières."
 MA_zalavar_basilica: "$building_type_MA_zalavar_basilica$"
 
 #Baths of Hisham
 MA_baths_hisham_district: "$building_type_MA_baths_hisham$"
 MA_baths_hisham_district_desc: "$building_type_MA_baths_hisham_desc$"
 building_type_MA_baths_hisham: "Bains d'Hisham"
 building_type_MA_baths_hisham_desc: "Intégrés à un complexe palatial plus vaste, ces bains comprennent une succession de salles froides, tièdes et chaudes, alimentées par un système d'hypocauste et couvertes de voûtes de pierre. Leurs sols sont richement décorés de mosaïques géométriques et figuratives, notamment le grand pavement représentant des arbres et des animaux, composé de fines tesselles savamment agencées."
 MA_baths_hisham: "$building_type_MA_baths_hisham$"
 
 #Peel Castle
 MA_peel_castle1_district: "$building_type_MA_peel_castle1$"
 MA_peel_castle1_district_desc: "$building_type_MA_peel_castle1_desc$"
 building_type_MA_peel_castle1: "Île Saint-Patrick"
 building_type_MA_peel_castle1_desc: "Sur l'île rocheuse de Saint-Patrick, églises, salles et sépultures donnent sur la mer environnante. Ici, les anciennes traditions locales côtoient la foi des nouveaux arrivants, tandis que clercs et souverains partagent un refuge exigu dont les rivages abrités unissent le culte et le pouvoir temporel."
 MA_peel_castle1: "Monastère de l'île Saint-Patrick"
 MA_peel_castle2: "Grande salle de Saint-Patrick"
 MA_peel_castle3: "Château de Peel"
 
 #Knin Fortress
 MA_knin_fortress_district: "$building_type_MA_knin_fortress$"
 MA_knin_fortress_district_desc: "$building_type_MA_knin_fortress_desc$"
 building_type_MA_knin_fortress: "Forteresse de Knin"
 building_type_MA_knin_fortress_desc: "Étendue le long d'une étroite crête calcaire dominant la vallée de la Krka, la forteresse de Knin forme un long ensemble défensif compartimenté de murailles, de tours et de cours closes. Sa position permet de contrôler les routes entre la côte et les plaines intérieures, ce qui en fait l'une des principales places fortes royales de la région."
 MA_knin_fortress: "$building_type_MA_knin_fortress$"
 
 #Amaravati Stupa
 MA_amaravati_stupa_district: "$building_type_MA_amaravati_stupa$"
 MA_amaravati_stupa_district_desc: "$building_type_MA_amaravati_stupa_desc$"
 building_type_MA_amaravati_stupa: "Stoupa d'Amaravati"
 building_type_MA_amaravati_stupa_desc: "Un grand et ancien [Glossary('stoupa','MA_stupa_glossary')] revêtu de panneaux de calcaire blanc, le plus imposant de l'Inde dravidienne. Des reliefs narratifs colorés sont sculptés dans sa maçonnerie de brique, représentant la vie du Bouddha et des scènes de dévotion dans des médaillons et des frises, tandis que les portiques marquent les accès depuis les quatre points cardinaux et organisent la circulation rituelle autour du tertre sacré."
 MA_amaravati_stupa: "$building_type_MA_amaravati_stupa$"
 MA_stupa_glossary: "Une structure en forme de dôme renfermant des reliques, utilisée comme lieu de méditation et de dévotion dans la pratique bouddhique. Les premiers stoupas étaient de simples tertres, puis leur forme et leur fonction ont évolué avec le temps pour influencer l'architecture bouddhique dans toute l'Asie, y compris, peut-être, celle des pagodes."
 
 #Karla Caves
 MA_karla_caves_district: "$building_type_MA_karla_caves$"
 MA_karla_caves_district_desc: "$building_type_MA_karla_caves_desc$"
 building_type_MA_karla_caves: "Grottes de Karla"
 building_type_MA_karla_caves_desc: "Creusées directement dans la colline, les grottes de Karla forment un ensemble de [Glossary('vihâras','MA_vihara')] rupestres et de sanctuaires organisé autour d'une grande salle chaitya. Ce vaste espace se distingue par son haut plafond voûté aux nervures sculptées, sa longue nef bordée de colonnades et un [Glossary('stoupa','MA_stupa_glossary')] placé dans l'abside. La façade d'entrée est ornée d'un grand arc en fer à cheval et de reliefs sculptés, marquant le passage du monde extérieur à un intérieur ordonné consacré aux rites et à la dévotion."
 MA_karla_caves: "$building_type_MA_karla_caves$"
 MA_vihara: "Un type de temple bouddhique offrant des logements aux moines. Dans l'architecture indienne, ce terme désigne plus particulièrement une salle centrale reliée à des cellules."
 
 #Somnath Temple
 MA_somnath_temple_district: "$building_type_MA_somnath_temple$"
 MA_somnath_temple_district_desc: "$building_type_MA_somnath_temple_desc$"
 building_type_MA_somnath_temple: "Temple de Somnath"
 building_type_MA_somnath_temple_desc: "Grand temple de pierre dédié au dieu de la Lune, Somnath est organisé selon un axe longitudinal de [Glossary('mandapas','MA_mandapa')] menant à un sanctuaire couronné d'un imposant [Glossary('shikhara','MA_vimana_glossary')]. Ses murs et ses piliers sont richement sculptés de représentations de divinités, de serviteurs et de frises ornementales. Important centre de pèlerinage, il attire des fidèles de toute la région, mais aussi les regards envieux des armées païennes au-delà de l'Indus."
 MA_somnath_temple: "$building_type_MA_somnath_temple$"
 MA_mandapa: "Une salle ou un pavillon à piliers de l'architecture indienne, servant d'espace de transition et d'entrée à un temple."
 
 #Devagiri
 MA_devagiri_district: "$building_type_MA_devagiri$"
 MA_devagiri_district_desc: "$building_type_MA_devagiri_desc$"
 building_type_MA_devagiri: "Devagiri"
 building_type_MA_devagiri_desc: "Une grande colline volcanique surgit brusquement des plaines, ses pentes de basalte sombre entaillées de sentiers étroits qui serpentent vers le sommet. Connue sous le nom de [Glossary('Devagiri','MA_devagiri_glossary')], la montagne abrite d'anciennes grottes et des sanctuaires, tandis que ses hauteurs dominantes offrent un refuge redoutable à ceux qui la détiennent."
 MA_devagiri: "$building_type_MA_devagiri$"
 MA_daulatabad: "Daulatabad"
 MA_devagiri_glossary: "Du sanskrit, signifiant \"Colline des Dieux\"."
 MA_daulatabad_glossary: "La Demeure de la richesse."
 
 #Ashoka's Palace
 MA_ashoka_palace1_district: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_palace1_district_desc: "$building_type_MA_ashoka_palace1_desc$"
 building_type_MA_ashoka_palace1: "Palais d'Ashoka"
 building_type_MA_ashoka_palace1_desc: "Le palais du grand [Glossary('Ashoka','MA_ashoka_glossary')] témoigne de la richesse et de la puissance des anciens rois de l'Inde. Ses vastes cours et ses salles à colonnades ont inspiré des récits d'une splendeur peu commune, leur ampleur et leur raffinement offrant un digne modèle à ceux qui voudraient restaurer les gloires d'autrefois."
 MA_ashoka_palace1: "Ruines du palais d'Ashoka"
 MA_ashoka_palace2: "$building_type_MA_ashoka_palace1$"
 MA_ashoka_glossary: "Troisième empereur maurya, connu pour être passé du statut de conquérant brutal à celui de souverain soucieux de morale, défenseur du bouddhisme et d'une vaste activité missionnaire."
 
 #Adina Mosque
 MA_adina_mosque_district: "$building_type_MA_adina_mosque$"
 MA_adina_mosque_district_desc: "$building_type_MA_adina_mosque_desc$"
 building_type_MA_adina_mosque: "Mosquée Adina"
 building_type_MA_adina_mosque_desc: "Vaste mosquée [Glossary('hypostyle','MA_hypostyle_glossary')] de brique et de pierre, l'Adina s'organise autour d'une grande cour rectangulaire bordée d'arcades et de rangées de travées coiffées de coupoles. Sa salle de prière est couverte d'une monumentale voûte en berceau rappelant les formes impériales de la Perse. Des [Glossary('éléments de remploi','MA_spolia_glossary')] sculptés dans la pierre et des fleurs en terre cuite ornent les murs extérieurs."
 MA_adina_mosque: "$building_type_MA_adina_mosque$"
 MA_hypostyle_glossary: "Un type de conception architecturale dans lequel le toit est soutenu par des rangées de colonnes, créant un vaste espace intérieur ouvert."
 MA_spolia_glossary: "Des éléments architecturaux réutilisés à partir de bâtiments plus anciens, souvent pour suggérer une continuité et une légitimité. Ce procédé est fréquent, mais pas exclusif, dans les ruines romaines du pourtour méditerranéen."
 
 #Chittorgarh
 MA_chittorgarh_district: "$building_type_MA_chittorgarh$"
 MA_chittorgarh_district_desc: "$building_type_MA_chittorgarh_desc$"
 building_type_MA_chittorgarh: "Chittorgarh"
 building_type_MA_chittorgarh_desc: "Occupant le sommet d'une longue colline isolée, le fort de Chittor est l'un des plus grands monuments militaires de l'Inde. D'immenses murailles longent le bord du plateau sur des lieues, enserrant palais, temples et tours au sein d'une citadelle autonome."
 MA_chittorgarh: "$building_type_MA_chittorgarh$"
 
 #Lingaraj Temple
 MA_lingaraj_temple_district: "$building_type_MA_lingaraj_temple$"
 MA_lingaraj_temple_district_desc: "$building_type_MA_lingaraj_temple_desc$"
 building_type_MA_lingaraj_temple: "Temple de Lingaraj"
 building_type_MA_lingaraj_temple_desc: "L'un des plus remarquables exemples d'architecture religieuse de l'Inde, le complexe de Lingaraj est organisé selon un axe unique d'espaces de plus en plus sacrés menant au [Glossary('vimana','MA_vimana_glossary')] curviligne et vertigineux de Shiva. Chaque surface est enrichie de divinités sculptées, de motifs floraux et de reliefs narratifs."
 MA_lingaraj_temple: "$building_type_MA_lingaraj_temple$"
 MA_vimana_glossary: "Une haute superstructure incurvée qui s'élève directement au-dessus du sanctuaire intérieur des temples indiens, souvent ornée de sculptures et de décorations complexes. Dans le Nord, ce style est appelé #italic shikhara#!, tandis que dans le Sud de l'Inde et en Odisha, il est désigné par le terme #italic vimana#!."
 
 #Tsarevgrad
 MA_tsarevgrad1_district: "$building_type_MA_tsarevgrad1$"
 MA_tsarevgrad1_district_desc: "$building_type_MA_tsarevgrad1_desc$"
 building_type_MA_tsarevgrad1: "Tsarevgrad"
 building_type_MA_tsarevgrad1_desc: "Les hauteurs escarpées dominant la Yantra commandent les accès à travers les vallées environnantes. Sur ces collines, remparts, tours et temples forment une place forte dont les défenses naturelles et les salles élevées offrent un siège digne des souverains de ces terres."
 MA_tsarevgrad1: "Ancien fort de Tarnovo"
 MA_tsarevgrad2: "$building_type_MA_tsarevgrad1$"
 MA_tsarevets_glossary: "Cité des Tsars, un nom qui évoque les ambitions impériales et l'autorité divine des souverains qui gouvernent depuis cette forteresse perchée."
 
 #Orange Theater
 MA_orange_theater1_district: "$building_type_MA_orange_theater1$"
 MA_orange_theater1_district_desc: "$building_type_MA_orange_theater1_desc$"
 building_type_MA_orange_theater1: "Théâtre d'Orange"
 building_type_MA_orange_theater1_desc: "L'immense mur de scène romain d'Orange domine un vaste demi-cercle de pierre, rappel monumental de la gloire antique de la cité. Ses arcs, ses colonnes et sa maçonnerie sculptée témoignent du savoir-faire des bâtisseurs des Césars et continuent de façonner la vie des habitants des siècles après la fin de leur règne."
 MA_orange_theater1: "Ruines du théâtre d'Orange"
 MA_orange_theater2: "$building_type_MA_orange_theater1$"
 MA_cavea_glossary: "Du mot latin signifiant enceinte, la cavea est l'ensemble des gradins en demi-cercle d'un théâtre ou d'un amphithéâtre romain."
 
 #Walls of Mesembria
 MA_walls_mesembria_district: "$building_type_MA_walls_mesembria$"
 MA_walls_mesembria_district_desc: "$building_type_MA_walls_mesembria_desc$"
 building_type_MA_walls_mesembria: "Remparts de Mésembrie"
 building_type_MA_walls_mesembria_desc: "Les murailles qui encerclent la péninsule rocheuse ont une longue histoire, bâties sur des fondations grecques et grâce aux grands efforts des empereurs romains et byzantins. Les puissantes courtines de pierre, les tours saillantes et les portes fortement défendues protègent le port et l'étroit isthme qui relie la cité au continent, faisant de la ville l'un des ports fortifiés les plus solides de la côte occidentale de la mer Noire."
 MA_walls_mesembria: "$building_type_MA_walls_mesembria$"
 
 #Sri Pada
 MA_sri_pada_district: "$building_type_MA_sri_pada$"
 MA_sri_pada_district_desc: "$building_type_MA_sri_pada_desc$"
 building_type_MA_sri_pada: "Mont Malaya"
 building_type_MA_sri_pada_desc: "Dominant les forêts de Lanka, le pic escarpé de granit du Malaya règne sur le paysage environnant. À son sommet se trouve un petit sanctuaire bâti autour du [Glossary('Sri Pada','MA_sripada_glossary')], attirant une procession ininterrompue de pèlerins qui gravissent ses sentiers sinueux pour prier au-dessus des nuages."
 MA_sri_pada: "$building_type_MA_sri_pada$"
 MA_sripada_glossary: "Expression cingalaise signifiant \"empreinte sacrée\", traditionnellement attribuée à une trace laissée sur la montagne par le Bouddha lui-même."
 
 #Palace of Palermo
 MA_palace_palermo1_district: "$building_type_MA_palace_palermo1$"
 MA_palace_palermo1_district_desc: "$building_type_MA_palace_palermo1_desc$"
 building_type_MA_palace_palermo1: "Palais de Palerme"
 building_type_MA_palace_palermo1_desc: "Les palais et les villas de Palerme sont réputés pour leurs jardins, leurs vergers et leurs cours ombragées. Leurs murs lumineux et leurs salles spacieuses conservent la mémoire des nombreux souverains de la cité, dont le mécénat a réuni les traditions artistiques de la Méditerranée en un lieu de richesse et de raffinement."
 MA_palace_palermo1: "Villas de Palerme"
 MA_palace_palermo2: "$building_type_MA_palace_palermo1$"
 MA_palace_balarm1: "Villas de Balarm"
 MA_palace_panormus1: "Villas de Panormus"
 MA_palace_balarm2: "Palais de Balarm"
 MA_palace_panormus2: "Palais de Panormus"
 MA_cassaro_glossary: "Le noyau le plus ancien de Palerme, l'antique quartier phénicien et grec fortifié de tous côtés. Son nom vient du mot latin désignant un château, #italic Castrum#!, lui-même adapté de l'arabe #italic al Qasr#!."
 
 #Cefalù Duomo
 MA_cefalu_duomo_district: "$building_type_MA_cefalu_duomo$"
 MA_cefalu_duomo_district_desc: "$building_type_MA_cefalu_duomo_desc$"
 building_type_MA_cefalu_duomo: "Duomo de Cefalù"
 building_type_MA_cefalu_duomo_desc: "Dominant les falaises calcaires de Cefalù, ce [Glossary('Duomo','MA_duomo_glossary')] associe les formes robustes de l'architecture normande à des décorations byzantines et islamiques. Ses deux tours massives encadrent une large façade occidentale, tandis que son intérieur spacieux culmine dans une grande mosaïque dorée scintillante au-dessus du sanctuaire, proclamant à la fois l'autorité royale et la majesté divine."
 MA_cefalu_duomo: "$building_type_MA_cefalu_duomo$"
 MA_duomo_glossary: "Issu du latin #italic domus#!, signifiant la \"maison\" de Dieu, le Duomo est l'église principale d'une ville italienne. Souvent traduit à tort par \"cathédrale\", il n'est en réalité pas nécessaire qu'il abrite un évêque pour porter ce titre."
 
 #Athenaion of Syracuse
 MA_athenaion_district: "$building_type_MA_athenaion$"
 MA_athenaion_district_desc: "$building_type_MA_athenaion_desc$"
 building_type_MA_athenaion: "Athénaion de Syracuse"
 building_type_MA_athenaion_desc: "Construite à l'intérieur de l'antique temple d'Athéna, cette église conserve une grande partie de l'édifice d'origine. Les murs intérieurs du temple ont été ouverts pour créer une large nef, tandis que les grandes colonnes doriques et les murs extérieurs demeurent bien visibles, renfermant l'un des plus beaux monuments du passé classique de la Sicile."
 MA_athenaion: "$building_type_MA_athenaion$"
 
 #Cave of the Patriarchs
 MA_cave_patriarchs1_district: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs1_district_desc: "$building_type_MA_cave_patriarchs1_desc$"
 building_type_MA_cave_patriarchs1: "Tombeau des Patriarches"
 building_type_MA_cave_patriarchs1_desc: "Au-dessus de la grotte où reposeraient Abraham, Isaac, Jacob et leurs familles s'élève la grande enceinte hérodienne en calcaire finement taillé. À l'intérieur de ses solides murailles, des sanctuaires et des lieux de prière témoignent de la dévotion des juifs, des chrétiens et des musulmans, attirant les pèlerins vers les tombeaux sacrés situés en dessous."
 MA_cave_patriarchs1: "$building_type_MA_cave_patriarchs1$"
 MA_cave_patriarchs2: "Sanctuaire des Patriarches"
 MA_must_be_abrahamic: "Le [holder|E] doit appartenir à la famille $rf_abrahamic$ [religious_family|E]"
 
 #Łysa Góra
 MA_lysa_gora1_district: "$building_type_MA_lysa_gora1$"
 MA_lysa_gora1_district_desc: "$building_type_MA_lysa_gora1_desc$"
 building_type_MA_lysa_gora1: "Łysa Góra"
 building_type_MA_lysa_gora1_desc: "Au-dessus des pentes boisées de Łysa Góra se trouve un ancien sommet sacré, entouré d'un vaste anneau de remparts de pierre séparant le monde profane des hommes des terres saintes situées au-delà. Ici, prières et offrandes portent les espoirs de ceux qui gravissent la montagne, dont les hauteurs solennelles inspirent la révérence à travers les changements de souverains et de religions."
 MA_lysa_gora1: "Mont Chauve"
 MA_lysa_gora2: "Monastère de la Sainte-Croix"

 #Dome of the Rock
 MA_templum_domini: "Templum Domini"
 
 #Mainz Cathedral
 MA_mainz_cathedral1_district: "$building_type_MA_mainz_cathedral1$"
 MA_mainz_cathedral1_district_desc: "$building_type_MA_mainz_cathedral1_desc$"
 building_type_MA_mainz_cathedral1: "Siège archiépiscopal de Mayence"
 building_type_MA_mainz_cathedral1_desc: "Au cœur de Mayence, la grande cathédrale et les salles, chapelles et cours qui l'entourent forment le siège de son puissant archevêque. Ici, les émissaires sont reçus et les affaires du pays réglées, tandis que les cloches appellent les fidèles à la prière. Ses murs de pierre proclament la richesse et l'autorité d'un seigneur dont le pouvoir s'étend bien au-delà de l'autel."
 MA_mainz_cathedral1: "Quartier épiscopal"
 MA_mainz_cathedral2: "Dom de Mayence"
 
 #Ingelheim Palace
 MA_ingelheim_palace_district: "$building_type_MA_ingelheim_palace$"
 MA_ingelheim_palace_district_desc: "$building_type_MA_ingelheim_palace_desc$"
 building_type_MA_ingelheim_palace: "Palais d'Ingelheim"
 building_type_MA_ingelheim_palace_desc: "Parmi les nombreuses résidences et les nombreux palais bâtis par les rois francs, rares sont ceux qui peuvent rivaliser avec Ingelheim par leur taille et leur histoire. Construit près du Rhin, le palais adopte un plan semi-circulaire inhabituel, englobant à la fois l'[Glossary('Aula Regia','MA_aula_regia_glossary')] et ses bâtiments annexes administratifs, résidentiels et religieux. Ses arches élégantes et son cadre champêtre rappellent à ses nombreux visiteurs une villa de la Rome antique."
 MA_ingelheim_palace: "$building_type_MA_ingelheim_palace$"
 MA_aula_regia_glossary: "La grande salle d'audience et du trône des palais impériaux, inspirée de celles que l'on trouvait autrefois à Rome. Il s'agit généralement d'une vaste salle longitudinale à nef unique, avec une abside à une extrémité."

 #Jewish Quarter of Worms
 MA_worms_jewish_quarter_district: "$building_type_MA_worms_jewish_quarter$"
 MA_worms_jewish_quarter_district_desc: "$building_type_MA_worms_jewish_quarter_desc$"
 building_type_MA_worms_jewish_quarter: "Quartier juif de Worms"
 building_type_MA_worms_jewish_quarter_desc: "Abritant l'une des plus importantes communautés juives de Rhénanie, cette rue étroite est bordée de maisons, d'ateliers et d'une synagogue en pierre soigneusement taillée. Avec Mayence et Spire, la cité est un centre renommé d'érudition juive, contribuant au développement des traditions religieuses et intellectuelles ashkénazes à travers toute l'Europe."
 MA_worms_jewish_quarter: "$building_type_MA_worms_jewish_quarter$"