# The ck3-tiger.conf file is in standard Paradox script format.
# It should be placed in the top directory of your mod.

languages = {
	# This will check only english and german localizations
	check = "english"
	#check = "german"

	# If you DON'T specify any check languages, you can instead say which ones to skip.
	skip = "french"
	skip = "spanish"

	# If you don't specify anything in languages, the validator will check all languages.
}

# Allows configuring what reports are printed by CK3-Tiger.
filter = {

    # Whether to report about problems in vanilla game files.
    # Setting this to 'yes' results in a LOT of spam.
    # Optional boolean value, defaults to no.
    show_vanilla = no

    # Whether to report about problems in mods loaded via the load_mod sections.
    # Optional boolean value, defaults to no.
    show_loaded_mods = yes

    # Contains rules for reports, using trigger syntax.
    # Only reports matching the trigger will be printed.
    # The root trigger is an AND block, just like any other trigger.
    trigger = {
        NOT = { key = strict-scopes }
        NOT = { key = temporary-scope }
        NOT = { key = scopes }
        NOT = { key = if-else }
        NOT = { key = tooltip }
        NOT = { key = unknown-list }
        NOT = { key = duplicate-field }
        NOT = { key = field-missing }
        NOT = { key = use-of-this }
        NOT = { key = logic }
        NOT = { key = performance }
        NOT = { key = structure }
        NOT = { key = deprecated }
        NOT = { key = missing-perspective }
        NOT = { text = mask }
        NOT = { text = activity }
        NOT = { text = modifier }
        NOT = { text = character_view }
        NOT = { text = environnments }
        NOT = { text = macro }
        NOT = { text = debug }   
        NOT = { key = rivers }
        NOT = { text = _adj }
        NOT = { text = infinite_ }
        NOT = { text = dlc }
        NOT = { text = Okhotsk }
        NOT = { text = weak_hook }
        NOT = { text = strong_hook }
        NOT = { text = additional_deed }
        NOT = { text = unexpected }
        NOT = { text = reactive_ }
        NOT = { text = APPOINTMENT_SCORE_SCRIPT_VALUE_DESC }
        NOT = { key = unneeded }
        NAND = { key = missing-localization text = "|E]" }
        NAND = { key = missing-localization text = "test" }
        NAND = { key = missing-localization text = "interaction" }
        NAND = { key = missing-localization text = "special_type" }
        NAND = { key = missing-localization text = "action_" }
        NAND = { key = missing-localization text = "house_power" }
        NAND = { key = missing-localization text = "_effects" }
        NAND = { key = missing-localization text = "[Get" }
        NAND = { key = missing-localization text = "situation_" }
        NAND = { key = missing-localization text = "natural_" }
        NAND = { key = missing-item text = "template" }
        NAND = { key = choice text = "expected" }
        NAND = { key = missing-localization text = "domicile_" }
        NAND = { key = missing-localization text = "raid" }      
        NOT = { key = image-size }
        NOT = { key = validation }
        NOT = { key = unknown-field }

        NOT = { file = "map_data/adjacencies.csv" }
        NOT = { file = "localization/english/core_l_english.yml" }
        NOT = { file = "localization/english/gui/map_l_english.yml" }
        NOT = { file = "localization/english/accolades/accolades_l_english.yml" }
        NAND = { file = "map_data/definition.csv"  key = missing-localization }
        NOT = { file = "common/script_values/00_ai_values.txt" }
        NOT = { file = "events/activities/hold_court_activity/hold_court_events_general.txt" }
        NOT = { file = "common/game_concepts/06_ce1_game_concepts.txt" }
        #NOT = { file = "events/court_events/court_events_general.txt" }
        NAND = { file = "common/religion/doctrine_group_types/00_doctrine_group_types.txt" key = missing-localization }
        NAND = { file = "common/schemes/agent_types/agent_types.txt" key = missing-localization }
        #NAND = { file = "common/schemes/scheme_types/agent_types.txt" key = missing-item }
        NAND = { file = "common/modifier_definition_formats/00_terrain_definitions.txt" key = missing-localization }
        NAND = { file = "common/modifier_definition_formats/00_terrain_definitions.txt" key = missing-item }
        NAND = { file = "common/religion/doctrine_group_types/00_doctrine_group_types.txt" key = missing-file }
        NAND = { file = "common/religion/doctrine_types/20_doctrines.txt" key = missing-file }
        NAND = { file = "common/religion/doctrine_types/10_doctrines_religions.txt" key = missing-file }
        NAND = { file = "common/religion/doctrine_types/40_doctrines_special.txt" key = missing-file }
        NAND = { file = "common/scripted_triggers/00_scripted_rule_triggers.txt"  key = missing-item }
        NAND = { file = "history/titles/zzLR_province_dev/zzLR_province_dev.txt"  key = duplicate-item }
        NAND = { file = "common/great_projects/types/00_ministry_projects.txt"  key = missing-localization }
        NAND = { file = "common/great_projects/types/00_great_project_types.txt"  key = missing-localization }
    }
}


# Use a load_mod section to tell ck3-tiger to load another mod before this one.
# This is useful when making submods or compatibility patch mods.
# You can have multiple load_mod sections.
#load_mod = {
